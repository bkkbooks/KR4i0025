front:
  text: 唐詩紀事巻第七十五
  hash: sha256:11e7f37a1e3e8a2341a575f85fef826d6514868dc608f21297335a594bd6f3fd
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_075-1a}
body:
  text: 僧虚中貫休僧齊已殷七七許碏許宣平裴修然僧虚中寄中條司空啚侍郎詩曰門徑放莎垂徃來投刺稀有時聞御禮特地掛朝衣嶽信僧傳去天香鸖帶歸他年二南㫖無復更衰微作開聞一又云逍遥短褐成一劍動精靈白晝夢仙島清晨禮道經黍苗侵野逕桒椹汚閑庭肯要爲鄰者西南太華清啚贈虚中云十年華嶽峰前住只得虚中兩首詩言得其意趣也虚中冝春人也遊瀟湘山水與齊已尚顔栖蟾為詩友住湘西粟城寺潭州烏氏子希振侍中好事每出迎納於詩閣虚中好燒火烟昬彩翠去後又復粉飾又題馬侍郎池亭云嘉魚在深處幽鳥立多時聽軒轅先生琴云訣妙與功精通宵膝上横一堂風冷淡千古意分明㘴客神䰟凝巢禽耳目傾酷哉傷紂世曽不遇先生芳艸云綿綿芳草緑何處動深思金谷人亡後沙塲日暖時龍鱗蔵有瑞風雨洒無私欲採蘭兼蕙清香可贈誰善巻壇云耕荒鑿原時髙趣在希夷大舜欲遜國先生空歛眉五溪清不足千古美無虧縱遣亡淳者何人投所思傳疑亡淳字經賀監舊居云不戀明皇寵歸來鏡水隅道裝鸖汀識春醉釣人扶逐朶雲如吐成行鴈佀驅蘭亭名景在蹤跡未爲孤贈屏風岩栖蟾上人云嵓房髙且靜住此幾寒暄鹿齅安禪石猿啼乞食村朝陽生樹罅古道透雲根獨我閑相覔凄凉碧洞門泊洞庭云槐栁未知秋依依舘驛頭客心俱念逺時雨自相留浪沒貨魚市㠶髙賣酒樓夜來思展轉故里在南州僧貫休姓姜氏字徳隠婺州蘭溪人錢鏐自稱吳越國王休以詩投之曰貴逼身來不自由幾年勤苦蹈林丘滿堂花醉三千客一劍霜寒十四州萊子衣裳宫錦窄謝公篇詠綺霞羞他年名上凌烟閣豈羡當時萬戸侯鏐諭改為四十州乃可相見曰州亦難添詩亦難改然閑雲孤鶴何天而不可飛遂入蜀以詩投王建曰河北河南處處災惟聞金蜀少塵埃一瓶一鉢垂垂老萬水千山得得來秦苑幽栖多勝景巴歈陳貢愧非才自慙林藪龍鐘者亦得親登郭隗臺建遇之甚厚建二年召令誦近詩時貴戚皆㘴休欲諷之乃稱公子行云錦衣鮮華手擎鶻閑行氣貌多輕忽稼穡艱難緫不知五帝三皇是何物建稱善貴倖皆怨之休與齊已齊名有西岳集十巻吳融爲之序卒死于蜀休毎得句云只堪供養佛故懐贈武昌棲一云凮清江上月霜洒月中砧得句先呈佛無人知此心休工篆隷初在荆州成中令問其筆㳒曰此事湏登壇而授詎可草草言之成怒逓放黔中因為病鸖詩曰見説氣清邪不入不知爾病自何來赤旃壇塔六七級白􅔽蓞花三四枝禪客相逢只彈指此心能有幾人知石霜問云如何是此心休不能荅石霜云汝問我荅休即問之霜云能有幾人知唐末冦亂休避地渚官荆帥髙氏優待之舘于龍興寺㑹有謁宿話時政不治乃作酷吏詞以刺之云霰雨灂灂風吼如斸有叟有叟暮投我宿吁歎自語云太苛酷如何如何掠脂斡肉吳姬唱一曲等閑破紅束韓娥唱一曲錦叚鮮照屋寜知一曲兩曲歌曽使千人萬人哭不惟哭亦白其頭飢其族所以祥凮不來和風不復蝗兮蠈兮東西南北遂離荆門立趋井絡上蜀主陳情之詩春山行云重疊大古色濛濛花雨時好山行恐盡流水語相隨黒壤生紅葉黄猨領白兒因思石橋日曽與道人期晚泊湘江懐古云烟浪濛秋色髙吟佀得隣一輪湘渚月千古獨酲人㟁濕穿花逺風香禱廟頻只應䛕佞者到此不傷神天台老僧云獨住無人處松龕嶽雪侵僧中九十臘雲外一生心白髪垂不剃青眸笑更深猶能指孤月爲我暫開襟寒夜思盧山賈生云山兄詩僻甚寒夜更何爲覔句如頑㘴嚴霜打不知石膏粘木履崕栗落氷池近見禪僧說生涯勝徃時雪夜寄友人云皓彩中霄合開門失所從何年今夜意共子老孤峰氣射燈花落光侵壁罅濃唯君心佀我吟到五更鐘苦熱云松桂晝不動陽烏飛半天稻麻傾結實沙石欲生煙毒氣仍干扇髙枝不立蟬舊山多積雪歸去是何年途中逢周朴云東西南北路相遇共興衰世獨無知已子從何處來菊衰芳草在程逺宿烟開儻遇中興主還應不用媒題嶧桐律師院云律中麟角者髙淡出塵埃芳草不曽觸幾生如此來壑風吹磬斷杉露滴花開如結林中社伊余願一陪言詩云經天緯地物動必是仙才幾處覔不得有時還自來真風含素髪秋色入靈臺吟向霜蟾下終湏神鬼哀休糧僧云不食更何求自由終自由身輕嫌衲重天旱爲民愁供器誰將去生臺蟻不遊會湏傳此術歸去老林丘觀地獄啚云峨峨水劍閣有樹不堪攀佛手遮不得人心似等閑周王應未雪白起作何顔盡日空彈指忙忙塵世間山居五首云休話喧譁事事難山翁只合住深山數声清磬是非外一箇閑人天地間緑圃空堦雲冉冉異禽靈草水潺潺無人爲向君王道岩桂枝髙正好攀詎是言休即便休清冷孤㘴碧溪頭三間茆屋無人到十里松闗獨自遊明月清風宗炳社夕陽秋色庾公樓修心未到無心地萬種千般逐水流心心心不住希夷石室巉岩白髪垂惜竹不除當路笋愛松留得礙人枝焚香開巻雲生砌卷箔冥心月在池無限故人頭盡白不知頭白又何之自古浮華能幾朝逝波終日去滔滔漢王廢苑生秋草吳主荒宫入夜濤滿屋黄金機不息一頭白髪氣猶髙豈知物外金仙子甘露天香滴毳袍翠竇烟巖畫不成桂香瀑沫雜芳馨撥霞掃雪和雲母掘石移松得茯苓好鳥傍花窺玉磬嫰苔和水汲金瓶從他人笑從他笑地覆天翻也只寜經東林寺云白薝蔔花露滴滴碧苾蒭草雨濛濛田地更無塵一㸃是何人合住其中夜夜曲云蟪蛄切切風騷騷芙蓉噴香蟾蜍髙孤燈耿耿征婦勞更深撲落金錯刀古意云乹坤有清氣散入詩人脾聖賢遺清風不在惡木枝千人萬人中一人兩人知憶在東溪日花開葉落時幾擬以黄金鑄作鍾子期僧齊已僧齊已有詩名住襄州謁鄭谷獻詩云髙名喧省闥雅頌出吾唐疊巘供秋望無雲到夕陽自封修藥院别下着僧牀幾夢中朝事乆離鴛鷺行谷覽之云請改一字方可相見經數日再謁稱已改得詩云别掃着僧床谷嘉賞結爲詩友還人詩巻云李賀李白遺機杼散在人間不知處聞君收在芙蓉江日聞鮫人織秋浦金梭劄劄文離離吳姬越女羞上機鴛鴦浴烟鸞鳯飛澄江曉映餘霞輝仙人手持玉刀尺寸寸酬君與珠璧裁作霞裳何處披紫皇殿裏深相覔後唐明宗太子從榮好作歌詩髙輦軰多依附之觀碁詩云㸔他終一局白却少年頭齊已中秋詩云東林莫礙漸髙勢四海正㸔當時路從榮果謀不軌唱和者言陟嫌疑皆就誅惟齊已得荆帥髙令公匿而獲免中秋月云空碧無雲露濕衣衆星光外湧清規東樓莫礙漸髙勢四海待㸔當路時還許分明吟皓魄肯教幽暗取丹枝可憐半夜嬋姢影正對五侯殘酒巵早行云舟子相呼起長沙未五更幾看星月在猶帶夢魂行鳥亂村林逈人喧水柵横蒼茫平野水慚愧逺峰名詠鴈云瀟湘水暖全迷鶴邏逤川寒只有鵰誰向孤舟憶兄弟㘴㸔連鴈渡横橋詠鸎云何事經年閟好音暖風催出囀喬林羽毛新刷陶潜菊喉舌初調叔夜琴怕雨並栖紅杏密避人䨇入緑楊深曉來枝上千般語佀共桃花訢舊心夏日草堂作云沙泉帶草堂𥿄帳巻空床靜是真消息吟非俗肺膓園林坐清影梅杏嚼紅香誰住原西寺鍾聲送夕陽寄方干處士鑑湖舊居云賀監舊山川空來近百年聞君與琴鶴終日在漁船島路深秋石湖澄半夜天雲門幾回厺題徧好林泉寄錢唐羅給事云噴噴嘔䜛書無人誦子虚傷心天佑末搔首懿宗初海樹青叢短湖山翠㸃踈秋濤㸔足否羅刹石邊居戊辰歳湖中寄鄭谷郎中云白髪乆慵簮常聞病亦吟瘦應成鶴骨閑想佀禪心上國楊花亂滄洲荻笋深不堪思翠蓋西望獨沾襟劍客云㧞劍遶殘罇歌終便出門西風滿天雪何處報人恩勇死尋常事輕讎不足論翻嫌易水土細碎動離魂歸鴈云塞門春亦暖連影起蘋風雲夢千行厺瀟湘一夜空江人空舉網虜將又虛弓莫失南來伴衡陽樹即紅東林作寄金陵知己云十八賢真在時來拂榻㸔已知前事逺更結後人難泉滴勝清磬松香掩白壇憑君聽朝貴誰欲猒簮冠山寺喜道士至云閏年春過後山寺始花開還有無心者閑尋此境來鳥幽聲忽斷茶好味重廻知住南岩乆冥心㘴緑苔老將云破虜與平戎曽居第一功明時不用武白首向秋風馬病霜飛草弓閑鴈過空兒孫已成立膽氣亦英雄聞貫休下世云吾師詩匠者真箇碧雲流争得梁太子重為文選樓錦江新塜樹婺女舊山秋欲去焚香禮啼猿哭阻修豋祝融峰云猨鳥共不到我來身欲浮四邊空碧落絶頂正清秋宇宙知何極華夷見細流壇西獨立乆白日轉神州贈孫生云傳家詩自君别是繼詩人道出千途外功争一字新寂寥中影迹霜雪裏精神待折東堂桂歸來更苦辛邊上云漢地從休馬胡家自牧羊都來消帝道渾不用兵防草上孤城白沙飜大漠黄秋風起邊鴈一一向瀟湘行路難云下浸與髙盤不爲行路難是非真險惡反覆作峰巒漆媿同時黒朱慚巧處丹令人畏相識欲畫白雲㸔觀水云范蠡東浮濶靈均北泛長誰知逺烟浪别有好思量故國門前急天崕照裏忙難收樓上興渺漫正斜陽聽李先生琴云仙子弄瑶琴仙山杉月深此聲含太古誰聽到無心洒石霜千片噴空瀑萬尋何人傳指㳒携向海中岑寄陸龜蒙云萬巻功何用徒稱處士休閑歌太古石醉聽洞庭秋道在誰開口詩成自㸃頭中間欲相訪尋便阻戈矛自題云禪外求詩妙年來鬢已秋未曽將一字容易謁諸侯掛夢山皆逺題名石盡幽敢言梁太子傍採碧雲流聽泉云落石幾萬仞冷聲飄逺空髙秋初雨後半夜亂山中秪有照壁月更無吹葉風㫺曽廬岳聽到曉與僧同宿簡寂觀云萬壑雲霞影千峰松桂聲如何教下士容易信長生月共虛無白香和沆瀣清閑尋古廊畫記得列仙名觀燒云獵獵寒蕪引乗風勢不還放來應有主焚厺到何山熖入空濛裏烟飛蒼莾間石中有良玉惆悵但傷顔齊已本姓胡名得生詩名多湖湘間與鄭谷爲詩友殷七七殷七七名文祥周寳舊於長安識之及寳移鎮浙西七七忽至寳禮貌益勤毎醉吟曰琴彈碧玉調爐飬白硃砂稱造逡廵酒能栽頃刻花鶴林寺杜鵑花云貞元中外國僧自天台鉢盂中以藥養其根來植於此寺僧飾花院或見女子遊花下或謂花神也一日寳謂七七曰鶴林寺花天下竒絶甞聞能開頃刻花可開於重九乎曰可乃前二日徃鶴林寺宿中夜女子謂七七曰妾爲上玄命下司此花非久即歸閬苑今與道者開之來日晨起寺僧訝花漸拆至九日爛爛熳後經兵火其花遂亡許碏碏遊江淮間常醉吟曰閬苑花前是醉鄉拈翻王母九霞觴群仙拍手嫌輕脱謫向人間作酒狂碏自稱髙陽人少爲進士累舉不第後得道於娥眉山許宣平新安人也常掛一花瓠及曲竹枝醉則歌曰負薪朝出賣沽酒日西歸路人莫問歸何地穿白雲行入翠微好事者題于壁李白自翰林出東遊覽詩嘆曰仙人也裴修然唐道士裴修然楚州刺史思訓之子為人詼諧强學不成一名好詩酒善丹青觧絲竹開元中嘗夜醉卧街犯禁乃為詩曰遮莫鼕鼕動湏傾滿滿盃金吾如借問但道玉山頺官不罪之也出張彥逺名畫記唐詩紀事巻第七十五
