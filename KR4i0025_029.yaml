front:
  text: 唐詩紀事卷第二十九
  hash: sha256:8541ea8e8886118c350c0b68c9dad051839cfe715e1eb014e7f5bf1c5277eea9
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_029-1a}
body:
  text: 常衮張衆甫田澄柳郴李彥逺薛元載張元宗楊郇伯高拯梁鍠劉長川姚倫孫處立劉復朱彬戴叔倫于鵠王李文常衮晚秋集賢院即事寄徐薛二侍郎云穆穆上清宫沉沉中祕書金鋪深內殿石甃盡寒渠花樹臺斜倚宫煙閣半虛縹囊鋪錦繡翠軸卷瓊琚墨潤氷文繭香消蠧字魚翻黃桐葉老吐白桂花𥘉舊德雙遊處聮芳千載餘北朝榮庾薛西漢盛嚴徐侍講親華扆徴詩步綺踈綴簾金翡翠賜硯玉蟾蜍移秩東南逺離憂歲月除承明期重入江海意何如衮京兆人為中書舍人文采贍蔚長於應用譽重一時相代宗用人非文詞者擯不用世謂之濌伯衮晚秋集賢即事詩司空曙和云藹藹鳯凰宫蘭臺玉樹通夜霜凝樹羽曉日照和風官亞三台貴儒開百代宗司言陳禹拜侍講發堯聰香卷青蒲內鉛力緑字中綴籖從太史鏘佩揖群公池接天泉碧林文御果紅寒龜登故葉秋蝶戀踈叢顔謝微文並鍾裴直事同離群驚海鸖屬思怨江楓地逺招蘇外山長越絶東慙當哲匠後下曲奏難工獨孤及和云漢家金馬署帝座紫微郎圖籍凌群玉歌詩冠柏梁隂隂萬年樹肅肅五經堂揮翰忘朝食研精待夕陽晴空露盤逈秋月鎖窗凉逺興生班鬢高情寄縹囊葳蓬雙鸑鷟夙昔並翺翔汲冡同刋謬蓬山共𥙷亡羌池摧羽翮流落限江湘禁省一分𬒮旻天三雨霜石渠遺跡滿水國暮雲長早晚朝宣室歸時道路光錢起和云文星垂太虛辭伯綜群書綵筆下鴛掖褒衣來石渠典墳探奧㫖造化覩權輿述聖魯宣父通經漢仲舒窗明冝縹帶地肅近丹除清晝刪詩暇高秋作賦𥘉露盤侵漢聳宫柳度鴉踈靜對連雲閣睛聞過闕車舊僚云出矣晚歲復何如海嶠瞻歸路江城夢直廬含毫思兩鳯望逺寄雙魚定笑巴歌拙還參麗曲餘張衆甫鸖詩云馴狎經時久㰚樅短翮存不隨淮海變空愧稻糧恩獨立秋天淨單棲夕露繁欲飛還斂翼誰敢望乘軒戴叔倫酬衆甫詩云野人無夲意散木任天材分向空山老何言上苑來超遙千里道依倚九層臺出處寧知命輪轅豈自媒更慙張處士相與别嵩萊衆甫送李觀之宣州謁袁中丞詩云古渡大江濵西南拒要津自當舟楫路應濟往來人翻浪驚飛鳥回風起緑蘋君看波上客晚歲獨垂綸高仲武云衆甫婉媚綺錯巧用文字工於興喻只如不隨淮海變空愧稻粱恩盡陳謝之源又自當舟擑路應濟往來人得諷興之要形容體裁率皆如此文流之佳士也衆甫字子𥘉清河人年過耳順方脫章甫冠惠文為太常寺太祝尉河南壽安縣罷秩僑居雲陽時以緣情比興疏導心術志之所之輒詣絶境待拜監察御史為淮寧軍從事建中三年卒志其墓權載之田澄成都為客作云蜀郡將知逺城南萬里橋衣緣鄉淚濕貌以客愁銷地富魚為米山芳桂是樵旅遊唯得酒今日過明朝澄大曆天寶間人杜子美贈獻納使起居田舍人詩即澄也末句云楊雄更有河東賦惟待吹噓送上天蓋澄以舍人奉使入蜀肅宗時人也柳郴郴與李端盧綸友善有賊平後送客還鄉詩云他鄉生白髮舊國有青山最有思致尤長於短句如贈别云江浦程千里離樽淚數行無論吳與楚俱是客他鄉又云何處最悲辛長亭臨古津往來舟楫路前後别離人李彥逺採桑云採桑畏日高不待春眠足攀條有餘愁那矜貌如玉千金豈不贈五馬空躑躅何以變貞性幽篁雪中緑彥逺大曆正元間詩人薛勑贈康尚書美人云天門喜氣曉氛氲聖主臨軒召冠軍欲令從此行霖雨先賜巫山一片雲康尚書日知也德宗時斬李惟嶽以功擢為深趙節度遷奉誠軍陟晉綘德宗時河東詩人也元載王忠嗣鎮北京以女韞秀歸元載歲久而見輕韞秀勸之遊學元乃遊秦為詩别韞秀曰年來誰不厭龍鍾雖在侯門似不容看取海山寒翠樹苦遭霜霰到秦封妻請偕行曰路掃飢寒跡天哀志氣人休零别離淚携手入西秦元到京屢陳時務深符上㫖肅宗擢拜中書王寄諸姨妹詩曰相闥巳隨麟閣貴家風第一右丞詩笄年解笑鳴機婦耻見蘇秦冨貴時元肅代兩朝宰相貴盛無比復為一篇以喻之曰楚竹燕歌動畫梁春蘭重換舞衣裳公孫開館招嘉客知道浮雲不久長元貪吝𬒳誅上令王氏入宫歎曰二十年太原節度使女十六年宰相妻誰能為長信昭陽之事死亦幸矣京兆笞斃大曆五年春載早朝有獻文章者公令左右收之其人苦欲公讀公云候入中書當為看其人言若不能讀自誦畢因亦不見詩曰城東城西舊行處城裏花飛亂如絮海燕㗸泥欲下來屋裏無人却飛去載後破家妻子𬒳殺其一云城南路長無宿處荻花紛紛如柳絮海燕㗸泥欲作巢空室無人却飛去張元宗登景雲寺閣云胡馬飲河洛我家從此遷今來獨垂淚三十六峰前望終南山云紅塵白日長安路馬足車輪不暫間唯有茂陵多病客每來高處望南川楊郇伯妓人出家云盡出花鈿與四鄰雲鬟剪落厭殘春暫驚風燭難留世便是蓮花不染身貝葉欲翻迷錦字梵聲𥘉學悮梁塵從今艷色歸空後湘浦應無解佩人竇常逢中立春寄懷郇伯云浪跡終年客驚心此地春風前獨去馬澤畔耦耕人老大交情重悲哀物外親子雲今在宅應見柳條新高拯拯及第後贈試官云公子求賢未識真欲將毛遂比常倫當時不及三千客今日何如十九人拯大曆十三年進士試官薛雍也梁鍠七夕泛舟云雲端有靈匹掩映拂粧臺夜久應搖珮天高響不來片歡秋始展殘夢曉翻催却怨填河鵲留橋又不回詠木老人云刻木牽絲作老翁雞皮鶴髮與真同須臾弄罷寂無事還似人生一夢中曾詠此詩明皇遷西內古意云妾家巫峽陽羅幌寢銀床曉日臨窗久春風引夢長落叉仍在鬢微汗欲消香縱使蒙籠覺魂遊逐楚王錢起秋夜與鍠文宴云車到間林下杯香蕙草時好風能自至明月不須期秋水翻河影晴霜脆柳絲微官是底物許日廢言詩明皇雜録云李輔國矯制遷明皇西宫力士竄嶺表帝戚戚不樂日一𬞞食吟詩云刻木牽絲作老翁至一夢中不知明皇作或詠鍠也詩劉長川寶劒篇云寶劒不可得相逢幾許難今朝一度見亦色照人寒匣裏星文動環邊月影殘自然神鬼伏無事莫空彈將赴東都上李相公云四海兵𥘉偃平津閣正開誰知火爐下還有不燃灰長川肅代時詩人也姚倫感秋云試向踈林望方知節候殊亂聲千葉下寒影一巢孤不蔽秋天鴈驚飛夜月烏霜風與春日幾度遣榮枯倫過章秀才洛陽客舍云逹人心自適旅舍當間居不出來時徑重看讀了書晚山嵐色近斜日樹隂踈盡是忘言客聽君誦子虛高仲武云姚子詩雖未洪深去凡巳逺屬興比事不失文流如亂聲千葉下寒影一巢孤亦篇之秀也倫終楊州大都府曹參軍孫處立詠黃鶯云欲轉聲猶澀輕飛羽未調高風不借便何處得遷喬處立江寧人長安中為左拾遺善屬文嘗恨天下無書以廣新聞神龍𥘉桓彥範等用事處立遺書論時事得失不得用乃去官還鄉以病卒劉復寺居清晨云高枕對曉月衣中清且凉露華朝未晞滴瀝含虛光隔竹聞汲井開扉見焚香幽心感衰病結念依法王青冥早雲飛杳眇空鳥翔此情皆有釋悠然知所忘經禁城云日沒路且長遊子欲涕零荒城無人路秋草飛寒螢東南古丘墟莾蒼馳郊埛黃雲晦斷岸枯井臨崩亭昔人竟何之窮泉獨冥冥蒼苔沒碑版杇水與荆吳分清光日阻修尺素安可論相思寄夢寐瑶草空氛氲出三城别幕中三判官詩云翔禽託高柯倦客念主人恩義有所知四海同一身况皆曠大姿翰音見良辰陳規佐武略高統據要津常願投素誠今果得所申金罍列四座廣厦無氛塵留連徂暑中觀望歷數旬河山險以固士卒勇且仁飾裝去未歸相追越城闉貴無青玉案緘佩永不泯復登大曆進士第嘗為水部外郎為石洪父平墓銘朱彬丹陽作云暫入新豐市猶聞舊酒香抱琴沽一醉盡日卧垂陽彬大曆正元間詩人戴叔倫字幼公潤州人師事蕭頴士為門人冠劉晏管鹽鐵表主管湖南至雲安楊惠琳反馳客劫之曰歸我金幣可緩死叔倫曰身可殺財不可得乃捨之纍遷至容管經略德宗嘗賦中和節詩遣使者寵賜代還卒早行寄朱山人放云山曉旅人去天高秋風悲明河川上沒芳草露中衰此别又萬里少年能幾時心知剡溪路聊且寄前期和汴州李相公勉人日喜春云年來日日春光好今日風光好更新獨獻菜羹憐應節遍傳金勝喜逢人煙添柳色看猶淺鳥踏梅花落巳頻東閣此時聞一曲翻令和者不勝春高仲武云叔倫為人溫雅善舉止無賢不肖見皆盡心在租庸幕數年夕惕靡怠吏部尚書劉公與祠部員外張繼書云博訪選材揖對賔客如戴叔倫其見推稱如此詩體雖不中越格然𪠘宇經山火公田沒海潮亦指事造形之工者其骨氣稍輕故詩亦少吳明府自逺來留宿云出門逢故友衣服滿塵埃歲月不可問山川何處來倚城容弊宅散職寄靈臺自此留君醉相歡得幾回除夜宿石頭驛云旅館誰相問寒燈獨可親一年將盡夜萬里未歸人寥落悲前事支離笑此身愁顔與衰鬢明日去逢春客舍與故人偶集云天秋月又滿城闕夜千重還作江南㑹翻凝夢裏逢風枝驚暗鵲露草覆寒蛩羈旅長堪醉相留畏曉鍾送友人東歸云萬里楊柳色出關逢故人輕煙拂流水落日照行塵積夢江湖闊憶家兄弟貧徘徊灞亭上不語自傷春拯元集姚合取為送謝夷甫宰鄖縣云君去方為縣干戈尚未銷邑中殘老小亂後少官僚𪠘宇經山火公田沒海潮致時應變俗新政滿餘姚于鵠鵠野田行云日沒出古城野田何茫茫寒狐上孤塜獵火燒白楊昔人未為泉下客若到此中還斷腸題鄰居云僻巷鄰家少茅簷喜並居蒸梨常共竈澆薤亦同渠傳屐朝尋藥分燈夜讀書雖然在城市還得似樵漁寄盧儼員外秋衣詞云寄逺空以心心誠亦難知篋中有秋帛裁作逺客衣縫製雖女工尺度手自特容貌當目中長短不復疑針線密且堅遊客作塵緇意欲都無言浣濯耐歲時殷勤託行人傳語愼勿遺别來年巳老亦聞鬢成絲縱然更相逢握手唯是悲所寄莫復棄願見長相思買山吟云買得幽山入漢陽槿籬踈處種桄榔唯有獮猴來往熟弄人拋果滿書堂山中寄樊尚書云却憶東溪日同𫀆事魯儒僧房間共宿酒肆醉相扶江上雙旌貴山中病客孤無媒還有計春谷種桑榆鵠大曆正元間詩人也為諸府從事居江湖間有卜居漢陽及荆南陪樊尚書賞花詩其自述曰三十無名客空山獨卧秋豈以詩窮者耶老大看花猶未足㳂江正遇一枝紅日斜人散東風急吹向誰家明月中上作襄陽席送死多於生幾人得終老句右張為取主客圖張籍傷鵠詩云野性踈時俗再命乃從軍氣高終不合去如鏡上塵鵠送客遊邊云若到并州北誰人不憶家寒深無去伴路盡有平沙磧冷唯逢鴈天春不見花莫隨邊將意垂老事輕車江南曲云偶向江邊採白蘋還隨女伴賽江神衆中不敢分明語暗擲金錢卜逺人又玄集韋莊取為張籍贈王建云于君去後交遊少東野無來篋笥貧賴有白頭王建在眼前猶是詠詩人王季文季文字宗素池陽人少厭名利居九華遇異人授九仙飛化之術曰子當先决科於詞籍後䇿名於真列冥注使然不可移也登咸通中進士第授祕書郎尋謝病歸九華日一浴於山之龍潭寒暑不渝季文九華山謡云九華峥嶸占南陸蓮花擢本山半腹翠屏橫截萬里天瀑水落深千丈玉雲梯石磴入杳冥俯看四極如中庭丹崕壓下廬霍勢白日隱出牛斗星杉松一歲抽數尺瓊草寅緣秀層壁南風拂曉煙霧開滿山䓤蒨鋪鮮碧雷霆往往從地發龍卧豹藏安可别峻極遙看戞昊蒼挺生豈得無才傑神仙憚險莫敢登馭風駕鸖循丘陵陽烏不見峰頂樹大火尚結嵒中氷靈光爽氣曛復旭晴天倒影西江渌具區彭蠡夾兩傍正可别作一嶽當少陽唐詩紀事卷第二十九
