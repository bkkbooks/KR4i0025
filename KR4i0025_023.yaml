front:
  text: 唐詩紀事卷弟二十三
  hash: sha256:695e272d3f3d18f1d4eed74ed6b2e41a834d3aca2c4290c2c09cbba75ce4c032
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_023-1a}
body:
  text: 司馬退之吳筠蘇廣文尉廷匡王諲陳希烈髙適張彪張子容李之芳崔或孟浩然岑參司馬退之洗心詩云不踐名利道始覺塵土腥不味稻粱食始覺神骨清羅浮奔走外日月無短明山瘦松亦徑鸖老飛更輕逍遙此中客翠髮皆長生草木多古色雞大無新聲君有出俗志不貪英雄名傲然脫冠帶攺換人間情去矣丹霄步向曉雲冥冥退之道士吳筠筠字正節華陽人舉進士不第天寶𥘉請隸道士籍玄宗命待詔翰林髙力士善浮屠乃短筠於帝筠懇還嵩山大曆中死會稽剡中弟子私諡宗玄先生筠見惡於力士而斥故文章深詆釋氏所善孔巢父李白歌詩略相甲乙事潘師正學錬養術天寶𥘉遊㑹稽與李白隱剡中赴闕薦白俱待詔翰林覽古十四首云聖人重開濟明道欲救時孔席不暇暖墨突何嘗緇興言振頺綱將以有所維君臣恣淫惑風俗日凋衰三代業遽隕七雄遂交馳庶物墜塗炭區中若棼絲秦皇燎儒術方冊靡孑遺犬漢歷五葉斯文復崇推乃驗經籍道與世屯同夷弛張固天意設教安能持棟宇代巢穴其來自三皇跡生固為纍經始增百王瑶臺既滅夏瓊室復殞啇覆車世不悟秦氏興阿房繼踵迷反正漢家崇建章力役弊萬人瓌竒殫八方狥志仍未極促齡巳云亡侈靡竟何在荆榛生廟堂吾觀采苓什復感青蠅詩讒侫亂忠孝古今同所悲姦邪起譛害骨肉相殘夷漢儲殞江充晋嗣滅驪姬天性猶可間君臣固其宜子胥烹吳鼎文種斷越鈹屈原沉湘流厥戚咸自貽何不若范蠡扁舟無還期魯侯祈正術尼父從棄捐漢主思英雄賈生𬒳排遷始皇重韓子及覩乃不然漢武喜相如既徴復忘賢遺逺世咸爾賤今理共然方知古來主難以效當年食其昔未偶落魄為狂生一朝君臣契雄辨何縱橫運籌康漢業憑軾下齊城既以智所逹還為智所烹豈若終賤貧酣歌本無營朝錯抱逺策為君納良規削彼諸侯權永用得所宜姦臣負舊隙乘釁謀相危世主竟不辨身戮宗且夷漢景稱欽明濫罰猶如斯比干與龍逢殘害何足悲絳侯成大績賞厚位乃尊一朝對獄吏榮辱安可論蘇生佩六印奕奕為殃源主父食五鼎昭昭成禍根李斯佐二辟巨釁鍾其門霍孟翼三后伊戚及後昆天人忌盈滿兹理固永存方知得意者何必乘朱轓滅景栖逺壑絃歌對清樽二踈返海濱蔣翊歸林園蕭灑去物纍此謀誠足敦聖人垂大訓奧義不苟設天道殃頑凶神明佑懿哲斯言猶影響安得復回穴鮌瞍誕英睿唐虞育昏孽盜跖何延期顔生乃短折魯隱全克讓禍機遂潜結楚穆肆巨逆福柄奚赫烈田常弒其主祚國久罔缺管仲存霸功世祀成詭說漢氏方版蕩群閹恣邪譎謇謇陳蕃徒孜孜抗忠節誓期區宇靜爰使凶醜絶謀協事靡從俄而返誅滅古來若兹類紛擾難盡列道遐理微茫誰為我昭晰吾將詢上帝寥廊詎躋徹巳矣勿用言忘懷庶自恱意古蘇廣文自啇山宿陶令隱居云聞道花源堪避秦尋幽數日不逢人烟霞洞裏無雞犬風雨林中有鬼神黃公庭下三芝秀陶令門前五柳春醉卧白雲間入夢不知何物是吾身夜歸華川因寄幕府云山村寥落野人稀竹裏衡門掩翠微溪路夜隨明月入亭臯春伴白雲歸嵇康懶慢仍耽酒范蠡逋逃又拂衣汀畔數鷗間不起只應知我巳忘機春日過田明府遇焦山人云陶公歸隱白雲溪買得春泉溉藥畦夜靜竹間風虎嘯月明枝上露禽棲陳倉邑吏驚𤇺火太白山人訝鼓鼙相見只言秦漢事武陵溪裏草萋萋尉遲斥李林甫當開元末權等人主幽并人尉遲斥耿槩士也以頻年不苐投書林甫皆繫刺之說斥有暮行潼關之作云明月飛出海黃河流上天又觀內人樓上踏歌曰芙蓉𥘉出水桃李忽無言又塞上曲云夜夜月為青塜鏡年年雪作黑山花林甫曰蕭頴士嘗誤吏部王尚書幾至鞭撲子詩未方潁士吾名復異於王重欲相干三思可矣匡知見怒惶怖趨出恓屑無依退歸林墅王諲除夜云今嵗今霄盡明年明日催寒隨一夜去春逐五更來氣色空中攺容顔暗裏回風光人不覺巳著後園梅元夕觀燈云暫得金吾夜通看火樹春停車傍明月走馬入紅塵妓雜歌偏勝場移舞更新應須盡記取說向北來人諲登開元進士第陳希烈奉和聖製三日詩云上巳迂龍駕中流泛羽觴酒因朝太子詩為樂賔王錦纜方舟渡瓊筵大樂張風搖垂柳色花發異林香野老無公事朝臣飲嵗芳皇情𬒳群物中外洽恩光雲生棟梁間云一片蒼梧意氛氲生棟梁下簾山足暗開户日添光偏使衣裘潤能令枕簟凉無心伴行雨何必夢荆王希烈宋州人工文章開元中禇無量元行冲卒希烈與康子元進講禁中天寶中為相國忠忌之即薦韋見素代相罷為太子太師失職無賴祿山盜京師遂相之肅宗時賜死于家髙適同顔六少府旅居秋中之作云人傳君昨悵然時獨坐深齊落木時逸氣舊來凌燕雀髙才何得混妍蚩迹勞黃綬人多嘆心在青雲世莫知不見鬼神無正直從來州縣有瑕疵封丘作云我本漁樵孟諸野一生自是悠悠者乍可狂歌草澤中寧堪作吏風塵下祗言小邑無所為公門百事皆有期拜迎官長心欲破鞭撻黎庶令人悲悲來向家問妻子舉家盡笑今如此生事應須南畝田世情付與東流水夢想舊山安在哉為銜君命日遲回乃知梅福徒為爾轉憶陶潜歸去來開元二十六年有從元戎出塞而還者作燕歌行示豫適感征戍之事作燕歌行云漢家烟塵在東北漢將辭家破殘賊男兒本自重橫行天子非常賜顔色樅金伐鼓下榆關旌斾逶迤碣石間校尉羽書飛瀚海單于獵火照狼山山川蕭條極邉土胡騎憑陵雜風雨戰士軍前半死生美人帳下猶歌舞大漠窮秋草木腓孤城落日鬬兵稀身當恩遇常輕敵力盡關山未解圍䥫衣逺戍辛勤久玉筯應啼別離後少婦城南欲斷腸征人塞北空回首邉庭飄䬙那可度絶域倉茫何所有殺氣三時作陳雲寒聲一夜傳刁斗相看白刃血紛紛死節從來豈顧勳君不見沙場征戰苦至今猶憶李將軍適字達夫滄州人客梁宋間舉有道科哥舒翰表為西河從事佐翰守潼關天子西幸適間道及帝河池遷侍御史後代崔光遠為西川節度使廣德中召還為右散騎常侍永泰𥘉卒適以功名自許而言浮其術年五十始為詩即工以氣質自髙每一篇出好事者輒傳布商璠云適性落拓不拘小節恥預常科隱跡博徒才名自逺然適詩多胸臆兼有氣骨故朝野通賞其文至如燕歌行等篇甚多佳句日余所愛者未知肝膽向誰是令人却憶平原君吟諷不厭矣古大梁行云古城蒼茫多荆榛驅馬荒城愁殺人魏王宫館盡禾黍信陵賔客隨灰塵憶昔雄都舊朝市軒車照耀歌鍾起軍容帶甲三十萬國步連營一千里全盛須臾那可論髙臺曲池無復存遺墟但有孤狸窟古地空餘草木根暮天搖落傷懷抱倚劔悲歌對秋草俠客猶傳朱亥名行人尚識夷門道白璧黃金萬戶侯寶刀駿馬填山丘年代凄凉不可問往來唯有水東流行路難云君不見富家翁舊時貧賤誰比數一朝金多結豪富萬事勝人健如虎子孫成長滿眼前妻能管絃妾歌舞自矜一身忽如此却笑旁人獨愁苦東鄰少年安所如席門窮巷出無車有才不肯學千謁何用年年空讀書邯鄲少年行云邯鄲城南遊俠子自矜生長邯鄲裏千場縱慱家仍富幾處報讎身不死宅中歌笑日紛紛門外車馬長如雲未知肝膽向誰是令人却憶平原君君不見即今交態薄黃金用盡還踈索以兹感歎辭舊遊更於時事無所求且與少年飲美酒往來射獵西山頭張彪北遊逺酬孟雲卿云忽忽望前事志願能相乖衣馬久羸弊誰能文與才善道居貧賤潔服䝉塵埃行行無定心壈坎難歸來慈母憂疾疹家室念栖栖與君宿姻親深見中外懷俟余惜時節悵望臨髙臺古別離云別離無逺近事歡情亦悲不聞車輪聲後㑹將何時去日忘寄書來日乖前期縱知明當返一息千萬思杜子美寄張十二山人彪詩云獨卧嵩陽客三違潁水春艱難隨老母慘淡向時人謝氏登山屐陶公漉酒巾群凶彌宇宙此物在風塵歷下辭姜𬒳關西得孟鄰旦通交契密晚接道流新靜者心多妙先生藝絶倫草書何太古詩興不無神曹植休前輩張芝更後身數篇吟可老一字買堪貧讀子美詩則彪蓋潁洛間靜者天寶末將母避亂故子美以詩寄云彪雜詩云冨貴多勝事貧賤無良圖上德兼濟心中才不如愚商者多巧智農者多膏腴儒生未遇時衣食不自如久與故交別他榮我窮居到門懶入門何况千里餘君子有褊性矧乃尋常徒行行任天地無為強親踈神仙云神仙可學無百歲名大約天地何蒼茫人間半哀樂浮生亮多感善事翻為惡爭先等驅逐中路苦瘦弱長老思養壽後生笑寂寞五穀非長年四氣乃靈藥列子何必待吾心滿寥廓張子容長安早春詩云開國維東井城池起北辰咸歌太平日共樂建寅春雲靜青山樹冰開黑水濵草迎金垀馬花伴玉樓人鴻漸看無數鶯聲聽欲頻何當桂枝擢歸及柳條新九日陪潤州邵使君登北固山云五馬何山椒重陽出麗譙徐州帶緑水楚國在青霄張幕連江樹開筵接海潮凌雲詞客語回雪舞人嬌梅福慙仙吏羊公賞下僚新豐酒舊美况是菊花朝送孟浩然歸襄陽詩云東越相逢地西亭送別津風濤開解纜雪海去愁人鄉在桃林岸山連楓樹春因懷故園意歸與孟家鄰孟浩然送張子容赴進士舉詩云夕曛山照滅送客出柴門惆悵野中別殷勤岐路言茂林余偃息喬朩爾飛翻無使谷風誚須令友道存除夜樂城簡孟浩然云逺客襄陽郡來過海畔家樽前柏葉酒燈發九枝花妙曲逢盧女髙才得孟家東山行樂意非是競繁華浩然嵗除夜樂城張少府宅云雲海訪甌閩風濤泊島濵何知嵗除夕得見故鄉親豫是乘桴客君為失路人平生復能幾一别十餘春巫山詩云巫嶺岧嶤天際重佳期宿昔願相從朝雲暮雨連天暗神女知來第幾峯子容乃先天二年進士第曽為樂城尉與孟浩然友善貶樂城尉日作云竄謫邉窮海川原近惡溪有時聞虎嘯無夜不猿啼地暖花常發嵓髙日易低故鄉可憶處遙指斗牛西李之芳大曆中子美有夏夜李尚書筵送宇文石首赴縣聯句云愛客尚書貴之官宅相賢美子酒香傾坐側帆影駐江邉芳之翟表郎官瑞鳬看令宰仙彧雨稀雲葉斷夜久燭花偏美子數語欹紗帽髙文擲彩箋芳之興饒行處樂離惜醉中眠彧單父長多暇河陽實少年美子客居逢自出為別幾悽然芳之宇文朝尚書之甥崔彧司業之孫也之芳太宗子蔣王惲之曽孫有令譽安祿山奏為范陽司馬祿山反自拔歸京師廣德𥘉使吐蕃𬒳留二嵗乃得拜禮部尚書攺太子賔客薨子美哭之芳詩云江雨銘旌濕湖風井徑秋又曰復魄昭丘逺歸魂素滻偏蓋死于江湖也孟浩然孟浩然襄陽人也骨貌淑清風神散朗救患釋紛以立義灌園圃以全髙交遊之中通脫傾蓋機警無匿學不攻儒務掇菁華文不按古匠心獨妙五言詩天下稱其盡善間淤祕省秋月新霽諸英聯詩次當浩然句曰微雲淡河漢踈雨滳梧桐舉座嗟其清絶咸以之筮筆不復為綴丞相范陽張九齡侍御史京兆王維尚書侍郎河東裴朏范陽盧潠大理評事河東裴揔華陽太守滎陽鄭倩之太守河東獨孤冊率與浩然為忘形交山南採訪使太守昌黎朝宗謂浩然間深詩律置諸周行必詠穆如之頌因入奏與偕行先揚于朝約日引謁後期浩然叱曰業巳飲矣身行樂耳遑恤其他遂畢飲不赴由是聞罷浩然不之悔也其好學忘名如此王士源他時嘗筆讃之曰導漾炳靈實生楚英浩然清發亦自其名開元二十八年王昌齡遊襄陽時浩然疾發背且愈相得歡飲浩然宴謔食鮮疾動終于南國年五十有子儀甫浩然每為詩佇興而故作或遲成行不為飾動求真適故以誕逰不利期以放情故常貧名劣繫於選部聚不盈甔室雖屢空不給自若也源序王士傳曰張九齡為荆州辟置于府罷開元末病疽背卒後樊澤為節度使時浩然墓碑壞符載以箋叩澤曰故處士孟浩然文質傑美殞落嵗久門裔陵遲丘隴頽沒永懷若人行路慨然前公欲更築大墓闔州搢紳聞風竦動而今外迫軍旅內勞賔客牽耗嵗時或有未遑誠令好事者乘而有之負公夙忘矣澤乃更為刻碑鳳林山南封寵其墓𥘉王維過郢州畫浩然像于刺史亭因曰浩然亭咸通中刻史鄭諴謂賢者不可斥其名更曰孟亭王維憶孟云詩曰故人今不見日夕漢江流借問襄陽老江山空蔡州皮日休孟亭記云明皇世章句之風大得建安體論者推李翰林杜工部為尤介其間能不愧者惟吾鄉之孟先生也先生之作遇景入詠不拘竒拱異令齷齪束人口者涵涵然有干霄之興若公輸氏當巧而不巧者也北齊美蕭慤芙蓉露下落楊柳月中踈先生則有微雲淡河漢踈雨滴梧桐樂府美王融日霽沙嶼明風動甘泉燭先生則有氣蒸雲夢澤波動嶽陽城謝眺之詩句精者有露濕寒塘草月映清淮流先生則有荷風送香氣竹露滴清聲此與古人爭勝於毫釐也明皇以張說之薦召浩然令誦所作乃誦北闕休上書南山歸弊廬不才明主棄多病故人踈白髮催年老青陽逼嵗除永懷愁不寐松月夜窗虛帝曰卿不求朕豈朕棄卿何不云氣蒸雲夢澤波動嶽陽城因是故棄啇璠云余嘗謂祢衡不遇趙一無祿其過在人及觀襄陽孟浩然磬折謙退才名日髙天下籍甚竟淪落明代終於布衣悲夫豫方知命矣且浩然詩文華采䒠茸經縷綿密半好雅調全削凡躰至如衆山遙對酒孤嶼共題詩無論興象復兼故實又波動嶽陽城亦為高唱也建德江宿云移舟泊㷑渚日暮客愁新野曠天低樹江清月近人裴司士見尋云府寮能枉顧嘉醖復新開落日池上酌清風松下來厨人具雞黍稚子摘楊梅誰道山公醉猶能騎馬回早寒江上有懷云木落鴈𥘉度北風江上寒我家江水上遙隔楚雲端鄉淚客中盡孤帆天際看迷津欲有問平海夕漫漫永嘉上浦館逢張子容云逆旅相逢處江村日暮時衆山遙對酒孤嶼共題詩廨宇鄰蛟室人煙接島夷鄉關萬餘里失路一相悲湖上作云八月湖水平含虛混太清氣蒸雲夢澤波動嶽陽城欲濟無舟楫端居耻聖明徙憐垂釣叟空有羡魚情峴山作云石潭傍隈隩沙榜曉夤緣試垂竹竽釣果得查頭鯿又冬至過友人云鳥泊隨陽鴈魚藏縮項鯿故杜子美憶襄陽云吾友襄陽孟浩然新詩句句盡堪傳至令耆舊無他語謾釣查頭縮頸鯿題鹿門山清曉因興來乘流越江峴沙禽近相識浦樹遙莫辨漸到鹿門山山明翠微淺嵓潭多屈曲舟楫屢回轉昔聞龎德公採藥遂不返金澗餌芝术石牀卧苔鮮紛吾感耆舊結纜事攀踐隱迹今尚存髙風邈巳逺白雲何時去丹桂何偃蹇探討意未窮回艇夕陽晚張祐題浩然宅云髙才何必貴下位不妨賢孟簡雖持節襄陽屬浩然岑參送王大昌齡赴江寧詩云對酒寂不語悵然悲愁一作送君明時未得用作不未字白首徒攻文澤國從一官滄波幾千里群公滿闕下獨去過淮水舊家富春渚嘗憶卧江樓自聞君欲行頻望南徐州窮巷獨閉門寒燈靜深屋北風吹微雪抱𬒳肯同宿君行到京口正是桃花時舟中饒孤興湖上多新詩潜虬且深蟠黃鸖鵠一作飛未晚惜君青雲器努力加飱飯奉送李太保兼御史大夫充渭北節度使即太尉光弼之弟也詩云詔出未央宫登壇近揔戎上公周太保副相漢司空弓抱關西月旗飛渭北風弟兄皆許國天地荷成功宿華隂東郭客舍憶閻防詩云次舍山郭近解鞍鳴鍾時主人炊新粒行子充夜飢閏月生首陽照見華隂祠茫蒼秋山晦蕭瑟寒松悲久從園廬別遂與朋知辭相知一作舊壑蘭杜晚歸軒今巳遲春夢詩云洞庭洞房一作昨夜春風起故人尚隔憶美人一作遙湘江水枕上片時春夢中行盡江南數千里參南陽人文本之後登天寶進士第纍為安西關西節度判官入為祠功二外郎虞庫二正郎出為嘉州刺史副元帥杜鴻漸表公兼侍御史列於幕府使罷寓于蜀中原多故卒死於蜀啇璠云參詩語竒躰峻意亦新逺至如長風吹白茅野火燒枯桑可謂逸矣又山風吹空林颯颯如有人須稱幽致也暮秋山行云疲馬卧長坂夕陽下通津山風吹長林颯颯如有人蒼梧霽凉雨石路無飛塵千念集暮節萬籟悲蕭辰鶗鴂昨夜鳴蕙草色巳陳况在逺行客自然多苦辛至大梁却寄康城主人云一從棄魚鈎十載干明王無由謁天階却欲歸滄浪仲秋至東郡遂見天雨霜昨夜夢故山芳蕙色巳黃平明辭䥫兵薄暮逰大梁仲秋蕭條景拔刺飛鵝鶬四郊隂氣閉萬里無晶光長風吹白茅野火燒枯桑故人南燕吏籍籍名皆香聊似玉壼贈置之君子堂衛尚書赤驃馬歌云君家赤驃畫不得一團旋風柳花色紅纓紫鞚珊瑚鞭玉鞍錦韀黃金勒請君鞁出看君騎尾長窣地如紅絲自矜諸馬皆不及却憶百金新買時香街紫陌鳳城內行人見者誰不愛揚鞭驟急白汗流弄影行驕碧蹄碎紫髯胡雛金剪刀平明剪出三騣髙櫪上看時獨意氣衆中牽出偏雄豪騎將獵向南山口城南狐兔不復有草頭一㸃疾如飛却使蒼鷹翻向後憶昨看君朝未央鳴珂擁蓋滿路香始知邉將真富貴可憐人馬相輝光男兒意氣得如此騣馬長鳴北風起待君東去掃胡塵為君一日行千里北庭北樓呈幕中諸公云嘗讀西域傳漢家得輪臺古塞千年空隂山獨崔嵬二庭近西海六月秋風來日暮上北樓殺氣凝不開大荒無鳥飛但見白龍塠舊國眇天末歸心日悠哉上將新破胡西郊絶煙埃邉城寂無事撫劍空徘徊幸得趨幕中託身厠群才早知安邉計未盡平生懷玉門關蓋將軍歌云蓋將軍真丈夫行年三十執金吾身長七尺頗有鬢玉門關城逈且孤黃沙萬里百草枯南鄰犬戎北接胡將軍到來備不虞五千甲士膽力粗軍中無事但歡娛暖屋繡簾紅地爐織成壁衣花氍毺燈前侍婢瀉玉壺金鐺亂㸃野􅋳酥紫紱金章左右趨問著即是蒼頭奴美人一雙間且都朱脣翠眉映月眸清歌一曲世所無今日喜聞鳳將雛可憐絶勝秦羅敷使君五馬謾踟蹰野草繡窠紫羅襦紅牙鏤馬對樗蒱玉盤纎手摋作盧衆中誇道不曾輸櫪上昻昻皆駿駒桃花叱撥價最殊騎將獵向城南隅臘日射殺千年狐我來塞外按邉儲為君取醉酒剩酤醉爭酒盞相喧呼却憶咸陽舊酒徒武威送劉單判官赴西行營使呈髙開府云熱海亘䥫門火山赫金方白草磨天涯湖沙莾茫茫夫子佐戎幕其鋒利如霜中嵗學兵符不能守文章功業須及時立身有行藏男兒感忠義萬里忘越鄉孟夏邊候遲胡國草未長馬疾過飛鳥天窮超夕陽都護新出師五月發軍裝甲兵二百萬錯落金光揚揭旗拂崑崙伐鼓震蒲昌大白引官軍天威臨大荒西望雲似蛇戎夷知喪亡渾驅大宛馬繫取樓蘭王曾到交河城風土斷人腸塞驛逺如㸃邊烽互相望赤亭多飄風鼓怒不可當有時無人行沙石亂飄揚夜靜天蕭條鬼哭夾道傍地上多髑髏皆是古戰場置酒髙館夕邊城月蒼蒼軍中宰肥牛堂上羅羽觴紅泪金燭盤嬌記艷新粧望若仰青冥短翮難可翔蒼然西郊道握手何慨慷天山雪送蕭沼歸京云天山有雪常不開千峰萬嶺雪崔嵬北風夜捲赤亭口一夜天山雪更厚能兼漢月照銀山復逐胡風過鐵關交河城邉飛鳥絶輪臺路上馬蹄滑䁆淡寒氛萬里凝䦨干隂崖千丈冰將軍狐裘卧不暖都護寶刀凍欲斷正是天山雪下時送君走馬歸京師客中何以贈君別唯有青青松樹枝走馬川行奉送出師西行云君不見走馬滄海邉平沙莾莾黃入天輪臺九月風夜吼一川碎石大如斗隨風滿地石亂走胸奴草黃馬正肥金山西見㷑塵飛漢家大將西出師將軍金甲夜不脫半夜軍行戈相撥風頭如刀面如割馬毛帶雪汗氣蒸五花連錢旋作氷幕中草檄硯水凝虜騎聞之應膽懾料知短兵不敢接車師西門佇獻捷輪臺歌奉送封大夫出師西征云輪臺城頭夜吹角輪臺城北旄頭落羽書昨夜過梁黎單于巳在金山西戍樓西望㷑塵黑漢兵屯在輪臺北上將擁旄西出征小胡吹笛大軍行四邉戍鼓雪海湧三軍大呼隂山動虜塞兵氣連雲屯戰場白骨纒草根劍河風急雪片濶沙口石凍馬蹄脫亞相勤王甚苦辛誓將報主靜邉塵古來青史誰不見今見功名勝古人白雪歌送武判官云北風卷地白草折胡天八月即飛雪忽然一夜春風來千樹萬樹梨花開散入珠簾濕羅幕狐裘不暖錦衾薄將軍雕弓不得控都護鐵衣冷難著瀚海䦨干千尺冰愁雲黲淡萬里凝中軍置酒飲歸客胡兒琵琶與羌笛紛紛暮雪下轅門風擊紅旗凍不翻輪臺東門送君去去時雪滿天山路山回路轉不見君雪上空留馬行處田使君美人如蓮花舞北旋歌云如蓮花舞北旋世人有眼應未見髙臺滿地鋪氍毺試舞一曲天下無此曲胡人傳入漢諸客見之驚且歎慢臉嬌娥纎復濃輕羅金鏤花䓗籠回裙轉䄂若飛雪左旋右旋生旋風琵琶橫笛和未匝花門開一作山頭黃雲合忽作出塞入塞聲白草胡沙寒颯颯翻身入破如有神前見後見回回新始知諸曲不可能採蓮落梅徒聒人世人學舞秪是舞姿態豈能得如此參至德中任宣議郎試大理評事攝監察御史左拾遺裴薦杜甫等嘗薦參識度清逺議論雅正佳名早立時輩所仰可備獻替之官云唐詩紀事卷第二十三
