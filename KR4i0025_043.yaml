  text: 唐詩紀事卷第四十三
  hash: sha256:aaf3b4e3f6f38a4c98d7d02a9cae9087eac32d7f3af492c0456402aa368ba9a0
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_043-1a}
body:
  text: 竇參郭士元于良史舒元輿李諒李賀呂溫呂恭假波古何元上羊士諤馮宿桞宗元吳武陵邵真崔膺衛象李宣逺熊孺登崔立之郭遵韋紓竇參謫江表久未歸有詩云一自經放逐徘徊無所從便為出山雲不隨飛去龍名豈不欲保歸豈不欲早苟無三月資難適千里道離心與羈思終日常草草人生年幾齊憂苦則先老誰能假羽翼使我暢懷抱湖上間居云避影將息隂自然知音稀向來深林中偶亦有所窺飛鳥口㗸食引雛上髙枝髙枝但各有安知宜不宜止止復何云物情何自私髙仲武云參詩祖沈千運比於孟郊尚在廊廡之間然萬丈水聲落四時松色寒又人生年幾齊憂苦即先老羽翮未齊而力巳具參字時中為人矜嚴悻直果於斷初為萬年尉失囚貶尉江夏代同舍人罪人義之相德宗與陸贄不平以姦賄貶死於雍州郭士元題劉相公三湘圖云昔别醉衡霍爾來憶南洲今朝平津却兼得瀟湘遊稍辨荆門樹依然芳杜洲微明三巴峽咫尺萬里流去鳥不知倦逺帆生暮愁涔陽指天末北渚空悠悠枕上見漁父坐中常狎鷗誰言魏闕下自有東山幽塞下曲云寶刀塞上兒身經百戰曽有百勝心竟未嫖姚知白草山頭日初沒黃沙城下歌聲發蕭條夜靜邊風吹獨倚營門望秋月贈韋司直云聞君感歎二毛初舊友相依萬里余烽火有時驚暫定甲兵無處可安居客來吳越星霜久家在平陵音信踈昨日風光還入戶登山臨水意何如送張南史云雨余深巷靜獨酌定殘春車馬雖嫌僻鶯花不棄貧蟲聲粘戶網鼠迹印床塵借問山陽會如今有幾人髙仲武云士元員外河嶽英竒人倫秀異自家形國遂擁大名右丞巳後與錢郎更長自丞相已下出使作收二公無詩祖餞時論鄙之兩公詞體大約欲同就中郎公稍更間雅近於康樂如荒城背流水逺鴈入寒雲又去鳥不知倦逺帆生暮愁又蕭條夜靜邉風吹獨倚營門望秋月可齊衡古人掩映時輩又暮蟬不可聽落葉豈堪聞古人謂謝眺工於發端比之於今有慙沮矣士元字君胃中山人寶應中選畿縣官詔試中書補渭南尉歷拾遺郢州刺史送彭將軍云雙旌漢飛將萬里授橫戈春色臨關盡黃雲出塞多鼓􅎏悲絶漠烽戍隔長河莫斷山陽路天驕巳請和送孫頠云悠然富春客憶與暮潮歸擢第人多羡如君獨步稀亂流江渡淺逺色海山微若訪新安路嚴陵有釣磯宿杜氏江樓云適楚豈吾願思歸秋向深故人江樓月夜夜千里心落葉覺鄉夢鳥啼驚越吟廖廖更何有斷續空成砧南史詩姚合取為極元集送彭將軍以下二章并贈張于良史良史為張徐州建封從事每自吟曰出身三十年髮白衣猶碧日暮倚朱門從朱汚袍赤公因為奏章服焉春山夜月云春來多勝事賞玩夜忘歸掬水月在手弄花香滿衣興來無逺近欲去惜芳菲南望鍾鳴處樓臺深翠微冬日寄李贊府云地險朝陽滿天邊宿霧收風兼殘雪起河帶斷氷流北闕馳心極南圖尚旅遊登臨思不巳何處得銷憂間居寄薛據云隱几讀黃老間齋耳目清僻居人事少多病道心生雨洗山林濕鴉鳴池館晴晚來因廢卷行樂至西城髙武仲云良史工於清雅工於形似如風兼殘雪起河帶斷氷流吟文未終較然在目舒元輿大和九年誅王涯等仇士良愈專恣文宗惡之雖登臨遊幸未嘗為樂或瞪目獨語左右莫敢進問因題詩曰輦路生春草上林花滿枝慿髙何限意無復侍臣知一日看牡丹或吟曰拆者如語含者如咽俯者如愁仰者如恱吟罷方省元輿詞不覺嘆息泣下霑衣李翺在長沙嫁韋中丞愛姬所生女之流落者元輿自京馳詩贈翺曰湘江舞罷忽成悲便脫蠻靴出綘帷誰是蔡雍琴酒客魏公懷舊嫁文姬元輿㜈州人與李訓善同相文宗專附鄭注詭謀謬算日與訓比敗天下事二人為之也元輿授監察御史時坊州刺史汪浰黷貨御史大夫溫造署元輿往訊之於坊州按獄有詩云中部接戎塞頑山四周遭風冷木長瘦石磽人亦勞牧守茍懷仁癢之時為瘙其愛如赤子始得無啼號奈何貪狼心潤屋沉脂膏攫摶如猛虎吞噬若狂獒山秃逾髙採水窮益深撈龜魚既絶迹鹿兔無遺毛氓苦稅外緍吏憂笑中刀大君明四目燭之動秋亳眷兹一州命慮齊墜波濤臨軒詔小臣汝往窮貪叨分明舉公法為我緩窮騷小臣誠小心奉命如煎熬飲水不待夕驅馬凌晨臯及此督簿書遊詞出狴牢門牆見狼狽案牘問腥臊探情與之言變態如姦猱直非既巧飾偽意乃深韜去惡猶農夫稂莠須耘耨恢恢布踈網罪者何由逃自顧孱鈍姿利器非能操六旬始歸奏霜落秋原蒿寄謝守土臣努力清郡曹須知聽甚卑勿謂天之髙橋山懷古云軒轅猒代千萬秋渌波浩蕩東南流今來古往無不死獨有天地長悠悠我乘驛騎到中部古聞此地為渠搜橋山突兀在其左荒榛交鎖寒風愁神仙天下亦如此况我蹙役同蜉蝣誰言衣冠葬其下不見弓劒何人收哀喧呌笑牧童戲隂天月落狐貍遊郯思皇墳立人極車輪馬迹無不周洞庭張樂降鸖涿鹿大戰摧蚩尤智勇神天不自大風后力牧輸長籌襄城迷路問童子帝鄉歸去無人留崆洞求道失遺迹荆山鑄鼎余荒丘君不見黃龍飛去山下路斷髯成草風颼颼八月五日中部官舍讀唐歷天寶已來追愴故事云將尋國朝事靜讀柳芳歷八月日之五開卷忽感激正當天寶末撫事坐追惜仰思聖明帝貽禍在肘腋楊李盜吏權貪殘日狼籍燕戎伺其便百萬奮長戟兩河連煙塵二京成瓦鑠生人死欲盡揳業猶不息肅宗傳寶圖冦難連年擊天地方開泰鑄鼎成繼述萬國哭龍衮悲思動蠻貊自此千秋節不復動金石悲風楊霜天繐帷冷塵席零落太平老東西亂離客往往為余言嗚咽淚雙滴况當近塞地哀吹起邉笛撫機觀陳文使我心不懌花蕚笑繁華溫泉樹客碧霓裳煙雲盡梨園風雨隔露囊與金鏡東遊驚波溺昔聞歡娛事今日成慘戚神仙不可求劒繭苔文積萬古長恨端蕭蕭泰陵陌坊州按獄蘇氏莊記室二賢自鄜州走馬相訪留連數日發後獨坐寂寞因成詩寄之云十年一相見世路信多歧雲雨易分散山川長間之我銜鳳闕恩按獄橋山陲君在龍驤府掌奏羽檄詞相去百餘里魂夢自相馳形容在胸臆書札通相思煩君愛我深輕車忽載脂塞門秋色老霜氣方凝姿此地少平川岡阜相參差誰知路非逺行者多云疲君能犯徑風信宿凌欹危情親不自倦下馬開雙眉相對坐沉吟屈指驚歲時萬事且莫問一杯欣共持陽烏忽西傾明蟾挂髙枝卷簾引瑶玉滅燭臨霜墀中庭有踈蘆浙浙聞風吹長河卷雲色凝碧無瑕疵一言開我懷曠然淡希夷悠悠夜方永冷思偏相宜眉睫無他人與君間解題陶然叩寂寞更請吟清詩得意且忘言何况竹與絲頃刻過三夕起坐輕四支明朝告行去慘然還别離出門送君去君馬楊金羇回來坐空堂寂寞無人知重重碧雲合何處尋佳期李諒蘇州元日郡齋感懷寄越州元相公杭州白舍人云稱慶還鄉郡吏歸端憂明發儼朝衣首開三百六旬曆新知四十九年非當官補拙猶勤慮逰宦量才巳息機舉族共資隨月俸一身惟憶故山薇舊交邂逅封強近老牧蕭條宴賞稀書扎每來同笑語篇章時到借光輝絲綸暫厭分符竹舟楫初登擁羽旗未知今日情何似應與幽人事有違四年也時長安樂天和李中丞元日寄詩兼呈微之云領郡慙當潦倒年鄰州喜得平生友又云憑鶯傳語與李六倩鴈將書寄元九莫嗟一日日催人且貴一年年入手樂天草諒泗州刺史制云諒自澄城長訖尚書郎中間再為州牧三宰劇縣苦心恤隱仁恕及物操刃決滯砉騞有聲諒後為京兆尹諒字復言微之有酬復言元日郡齋感懷詩云臘盡殘銷春又歸逢新别故欲沾衣自驚身上添年幾休繫心中小是非貴富祝來何所遂聰明鞭得轉無機羞看稚子先拈酒悵望平生舊採薇去日漸加余日少賀人間閙故人稀椒花麗句開重撿艾髮衰容惜寸輝苦思正直酬白雪間觀風色助青旗千官仗下爐煙裏東海西頭意獨違正旦童稚俗云祝富貴鞭聰明皆李賀髙軒過云華裾織翠青如蔥金環壓轡搖玲瓏馬蹄隱耳聲隆隆入門下馬氣如虹云是東京才子文章巨公二十八宿羅心􅎍元精昭昭貫當中殿前作賦聲摩空筆補造化天無功龎眉書客感秋蓬誰知死草生華風我今垂翅附冥鴻他日不羞蛇作龍皇甫退之而出命賦此詩操觚立成湜聨騎造門賀揔角荷衣賀以詩謁退之時為國子博士已送客解帶門人呈卷旋讀之首篇鴈門太守行云黑雲壓城城欲摧甲光向月金鱗開却援帶命邀之其詩云黑雲壓城城欲摧甲光向月金鱗開龜聲滿天秋色裏塞上燕脂凝夜紫半卷紅旗臨易水霜重鼓聲寒不起報君黃金臺上意提携玉龍為君死守行鴈門木李啇隱作賀小傳云京兆杜牧為李長吉序狀長吉之竒甚盡世傳之長吉姊嫁王氏者語長吉之事尤備長吉細瘦通眉長指爪能苦吟疾書最先為昌黎韓愈所知所與遊者王參元楊敬之權璩崔植為密每旦日出與諸公遊未嘗得題然後為詩如他人思量牽合以及程限為意常從小奚奴騎距驢背一古破錦囊遇有所得即書投囊中及暮歸太夫人使婢探囊出之見所書多輒曰是兒要當歐出心始已耳上燈與食長吉從婢取書研墨疊紙足成之投他囊中非大醉及弔喪日率如此過亦不復省王楊輩時復來探取寫去長吉往往獨騎往京洛所至或時有隨棄之故沈子明家所餘四卷而已長吉將死時或晝見一緋衣人駕赤蚪持一版書若太古篆或霹靂石文者云當召長吉長吉了不能讀歘下榻叩頭言阿㜷呼太夫人云長吉學語時老且病賀不願去緋衣人笑曰帝成白玉樓立召君為記天上差樂不苦也長吉獨泣邊人盡見之少之長吉氣絶常所居窗中勃勃有煙氣聞行車嘒管之聲太夫人急止人哭待之如炊五斗黍許時長吉竟死王氏姊非能造作謂長吉者實所見如此嗚呼天蒼蒼而髙也上果有帝也耶帝果有苑囿宮室觀閣之玩耶茍信然則天之髙邈帝之尊嚴亦宜有人物文彩愈此世者何獨畨畨於長吉而使其不壽耶噫又豈世所胃才而竒者不獨地上少耶天上亦不多邪長吉生二十六年位不過奉禮太常當時人亦多排擯毁斥之又豈才而竒者帝獨重之而人返不重耶又豈人見會勝帝耶飛香芝紅滿天春樂句上雲酒酣喝月使倒行句踏天磨刀割紫雲句此硯右張為取作主客圖杜牧之序其文集云賀字長吉元和中韓吏部亦頗道其歌詩雲煙綿聯不足為其態也水之迢迢不足為其情也春之盎盎不足為其和也秋之明潔不足為其格也風檣陳馬不足為其勇也瓦棺篆鼎不足為其古也時花美女不足為其色也荒國陊殿梗莾丘壠不足為其恨怨悲愁也鯨呿鼇擲牛鬼蛇神不足為其虛荒幻誕也蓋騷之裔理雖不及辭或過之騷有感怨刺懟言及君臣理亂時有以激發人意乃賀所為無得有是賀能採尋前事所以深嘆恨今古未嘗經道者如金銅仙人辭漢歌補梁庾肩吾宮體謡求取情狀離絶逺去筆墨畦徑間亦殊不能知之賀生二十七年死矣世皆曰使賀且未死少加以理奴僕命騷可也呂溫字和叔一字化光禮部侍郎渭之子正元中連中兩科德宗召為集賢校書後為治書御史坐王叔文貶道州改衡州年四十而殁有子安衡溫和張舍人聞琴云迢遞天上真寂寞丘中琴憶爾山水韻起子仁智心凝情在正始超想踈煩襟涼生子夜後月照禁垣深逺風藹蘭氣微露清桐隂方襲緇衣慶永奉南薰吟贈友人云南山雙喬松擢本皆千尋夕流膏露津朝被青雲隂負雪出深澗搖風倚髙岑明堂久不創雲幹何森森匠意方雕巧時情正誇淫生材會有用天地豈無心道州觀野火詩云南風吹烈火熖熖燒楚澤陽景當晝連隂天半夜赤過處若彗掃來時如電激豈復辨蕭艾焉得分玉石蟲蛇盡爍爛虎兕出奔迫積穢一蕩除和氣始融液堯時既敬授禹稼斯肇迹遍生合頴禾大秀兩歧麥家有京坻詠人無溝洫戚若悟焚如功來歲終受益衡州早春云碧水何逶迤東風吹春草煙波千里曲不辨嵩陽道又云病肺不飲酒傷心不看花唯驚望鄉處猶自隔長沙劉夢得序其文曰蚤聞詩禮於先侍郎從梁肅學文章勇於藝能咸有所祖年益壯志益大遂撥去文學與雋賢交重氣槩核名實歆然以致君及物為大欲每與其徒講疑考要皇王霸強之際臣子忠賢之道出入上下千百年間詆訶角逐疊發連柱得一善輒盰衡擊節揚袂頓足信容得色舞于眉端以為按是言修是理合乎心而氣將之昭昭然若揭日月而行孰能閼其勢而爭天光者嗚呼言可信而時異道甚長而命窄精氣為物其有所歸乎又曰和叔生少遇君而卒以謫似賈生能明王道似荀卿始學左氏書故其文微為富艷夫羿之關弓唯巴蛇九日乃能盡其力而廽注鷃爵亦要中於尋常之間非羿之手弓有能有不能所遇然也後之逹解者推而廣之知余之素交不相索於文字之內而已其序如此是以夢得元微之柳子厚悼呂衡州詩并誄皆以溫功業未濟為辭夢得詩曰一夜霜風雕玉芝蒼生望絶士林悲空懷濟世安人略不見男婚女嫁時遺草一函歸太史旅墳三尺近要離朔方徒歲行將滿欲為君刋第二碑微之詩云氣敵三人傑交深一紙書我投氷瑩眼君報水憐魚䏶股唯夸瘦膏肓豈暇除傷心死諸葛憂餘又云望有經綸釣虔收宰相刀江文駕風逺雲貌接天髙國待球琳器家藏虎豹韜盡將千載寶埋入五原蒿又云白馬雙旌隊青山八陳圖請纓期繫虜枕草誓捐軀勢激三千壯年應四十無遙聞不暝目非是不憐吳又云雕鶚生難敵沉檀死更香兒童喧市井羸老哭碑堂鴈起沙汀暗雲連海氣黃祝融峯上月幾點北人喪子厚作誄云元和六年八月日衡州刺史東平呂君卒君由道州以陟為衡州君之卒二州之人哭者逾月湖南人重社飲酒是月上戊不酒去樂會哭干神所而歸君之志與能不施于生人知之者又不過十人世徒讀君之文章歌君之理行不知二者之於君其末也萬不試而一出焉猶為當世甚重使君幸得出其什二三巍然為偉人與世無窮其可涯也溫孟冬蒲津開河亭作云息駕非窮途未濟豈迷津獨立大河上北風來吹人雪霜自兹始草木當更新嚴冬不肅殺何似見陽春溫有偶然作云悽悽復汲汲忽覺年四十今朝淚滿衣不是傷春泣又曰中夜兀然坐無言空涕洟丈夫志氣事兒女安得知可見以其志也呂恭呂溫春日與李六景儉及苐恭聮句景儉云始見花滿枝又見花滿地溫云且持增氣酒莫滴傷心淚恭云深誠長鬱結芳辰自妍媚景儉云笑歌聊永日誰知此時意溫又有同恭歲暮寄晉州李協律詩其略曰伊我抱微尚仲氏即心期討論自少小形影相差池此來胸中氣欲耀天下竒雲衢兩沛艾煙閣雙萎蕤幾年困方枘一旦失多歧道因窮理悟命以盡性知皆失志之狀也呂渭四子溫恭儉遜柳宗元志恭墓云以為賢豪絶人又云恭之妻裴延齡女也假洪古洪古澧州人呂溫守道州時洪古客焉洪古奉陪郎中使君樓上夜把火看花詩云城上芳園花滿枝城頭太守夜看時為報林中髙舉燭感人情思欲題詩溫答假秀才云盡日看花君不來江城半夜為君開樓中共指南園火紅燼隨花落碧苔溫送假秀才歸澧州云湘南孤白芷幽託在清潯豈有馨香發空勞知處深推賢路已隔賑乏力不任慙我一言分負君千里心寸義薄聮組片誠兼敵金方期踐氷雪無使弱思侵何元上呂溫知道州時元上居此州謂之何處士元上有所居寺院涼夜書情呈溫云庾公念病宜清暑遣何僧家占上方月光似水衣裳濕松氣如秋枕簟涼幸以薄才當客次無因弱羽逐鸞翔何由一示雲霄路腸斷星星兩鬢霜溫答云意氣曾傾四國豪偶來幽寺息塵勞嚴陵釣處江初滿梁甫吟詩月正髙新識幾人知杞梓故園何歲長蓬蒿期君自致青雲上不用傷心歎二毛溫又有送何山人之容州詩云匣有青萍笥有書何門不可曵長裾應須定取真知者遣對明君説子虛羊士諤小園春至偶書呈竇郎中孟員外云松篠雖苦節氷霜慘其間欣欣發佳色如喜東風還幽抱想前躅冥鴻度南山春臺一以眺逹士未解顔偃息非老圃沉吟閟玄關馳暉忽復失壯歲不得間君子當濟物丹梯難共攀心期自有約去掃蒼苔班酬西川獨孤侍御見寄云百雉層城上將壇列營西照雪峯寒文章立事須銘鼎談笑論功耻據鞍草檄青油推健筆曵裾黃閣聳危冠雙金未比三年字負弩空慙知者難亂後曲江云憶昔曾遊曲水濱來春長有探春人遊春人靜空池在直至春深不似春順宗實録云元年六月貶宣州巡官羊士諤為汀州寧化縣尉士諤性傾險時以公事至京遇叔文用事朋黨相煽頗不能平公言其非叔文聞之怒欲下詔斬之執誼不可則令杖殺之又不可遂貶焉由是叔文始大惡執誼士諤受知李吉甫又最善呂溫薦為御史嘗為資州刺史張為主客圖以樂天為廣大教化主士諤為入室取其句云風泉留古顔笙磬相遺音句歷山桂杇有遺馥鸞飛安可待句塵沙藹如霧長波驚飈度鴈起汀州寒馬嘶髙城暮銀釭倦秋館綺瑟瞻永路重有携手期清光倚玉樹士諤望女几山早歲有卜築之志云望女山頭春雪銷路傍仙杏發柔條心思欲去知何日惆悵回車上野橋酬蕭使君出妓夜宴見送云玉顔紅燭忽驚春微步凌波拂暗塵自是當歌斂眉黛不應惆悵為行人郡樓晴雪云霽色朝雲盡亭髙露亦晞褰關臨曲檻蕭瑟換輕衣地逺秦人望天晴社燕飛無功慙歲晚唯念故山歸息舟荆溪入陽羡南山遊善權寺呈李功曹云結纜蘭渚曉紫嵓上連岡晏溫值初霽去繞山河長獻歲氷雪盡細泉在路傍行披煙杉入激瀾橫石梁層門表精廬飛甍切雲翔沖襟得髙步清眺極逺方潭嶂積佳氣荑英多早芳具觀澤國秀重使春心傷念遵煩促途榮利騖隙光勉君脫冠意共匿無何鄉尋山家云獨訪山家歇還涉茅屋斜連隔松葉主人聞語未開門繞籬野菜飛黃蝶馮宿宿字拱之婺州人為裴度彰義判官徐州張建封掌書記歷工刑二侍郎宿尹河南樂天夢得以詩送之宿酬云共稱洛邑難其選何幸天書用不才遙約和風新草木且令新雪靜塵埃臨歧有愧傾三省别酌無辭醉百杯明歲杏園花下集須知春色自東來公杏園宴會每春嘗接諸栁宗元宗元種栁戲題云栁州栁刺史種栁栁江邊談笑為故事推移成昔年垂隂當覆地聳幹會參天好作思人樹慚無惠化傳南澗中題云秋氣集南澗獨遊亭午時回風一蕭瑟林影久參差始至若有得稍深遂忘疲羇禽響幽谷寒藻舞淪漪去國魂巳遊懷人淚空垂孤生易為感失路少所宜寂寞竟何事徘徊秪自知誰為後來者當與此心期漁翁云漁翁夜傍西巖宿曉汲清湘燃楚竹煙銷日出不見人欵乃一聲山水緑廽看天際下中流巖上無心雲相逐子厚與楊誨之書云吾年十七求進士四年乃得舉二十四求慱學宏詞二年乃得仕及為藍田尉走謁六官堂下與卒伍為列益學老子和光同塵雖自以為得然巳得號為輕薄人矣及為御史郎官自以登朝廷利害益大雖戒礪益切卒不免為連纍廢逐厚子於柳州物人立廟羅池陷王叔文之黨遷謫卒死雪詩云千山鳥飛絶萬徑人蹤滅孤舟蓑苙翁獨釣寒江雪不侔矣東坡居士云視鄭答亂飄僧舍之句子厚死三年愚溪無復曩時矣劉夢得聞之賦三絶云溪水悠悠春自來草堂無主燕飛廽隔簾惟見中庭草一樹山榴依舊開一其草聖數行留壞壁木奴千樹屬鄰家唯見里門通德榜殘陽寂寞出樵車二其桞門竹巷依依在野草青苔日日多縱有鄰人解吹笛山陽舊侶更誰過三其吳武陵貢院樓北新栽小松詩云拂檻愛貞客移根自逺峯巳從芳草沒終不任苔封葉小初臨雪鱗生欲狀龍承春濯雨露得地近垣墉逐吹風微動含煙色漸濃時回日月照為謝小山松武陵有文而強扞嘗為韶州刺史贓罪狼籍勑令廣州幕吏鞠之科第少年殊不假貸持之頗急武陵不勝其忿題詩路左佛廟曰雀兒來逐揚風髙下視鷹鸇意氣豪自謂能生千里翼黃昏依舊委蓬蒿尋貶潘州司户卒時大和八年也觀察吳為副因宴或云李渤為桂管乃悟其太過釋之故武陵詩云大醉渤命衙校米蘭梟之明日武陵信州人為大學博士大和初薦杜牧於崔郾抆第五人登第初李訴節度唐鄧武陵薦李景儉王湘健智沈敏可表以自副時號知人邵真尋人偶題云日昊不復午落花難歸樹人生能幾何莫厭相逢遇真為李寶臣成德軍掌書記後從李惟嶽之叛與田恱李正巳拒命真諫之惟嶽寤使真作奏復為將之所沮德宗詔張孝忠朱滔合兵討大敗之恱嬰城惟嶽召真議歸順恱遣扈岌來責惟嶽且欲斬真惟嶽懼斬真以謝焉其後王武俊表其忠贈戶部尚書崔膺感興云富貴難義合困窮易感恩古來忠烈士多出貧賤門世上桃李樹但結繁華子白屋抱關人青雲壯心死本以勢利交勢盡交情巳如何失情後始歎門易軌膺博陵人性狂少長於外家不齒及長能文作道傍孤兒歌以諷外家張建封愛其才以為客夜中大呌驚軍衆欲食其肉建封藏之明日置宴監軍曰某有請請崔膺建封曰如約逡巡建封又曰某亦有請却請崔膺坐中皆笑乃獲免膺賦别佳人云壠上流泉壠下分斷腸嗚咽不堪聞常娥一入月中去巫峽千秋空白雲涯詩或云崔李涉醉中贈膺詩云與君兄弟厈嶺故與君相逢楊子渡白浪南分吳塞雲緑楊西入隋宮路隋家文物今雖改舞館歌臺尚基在煬帝陵邊草木深汴河流水空歸海今古悠悠人自别此地繁華人未歇大道青樓夾翠煙瓊墀繡帳開明月與君一言兩相許外捨形骸中爾汝楊州歌酒不可追洛神映箔湘妃語白馬黃金為身置誰能獨美他人醉暫到香爐一夕間能展愁眉百年事君看白日光如箭一度别來顔色變早謀侯印佩腰間莫遣看花鬢如霰衛象古詞云鵲血雕弓濕未乾鸊鵜新染劒花寒遼東老將鬢成雪猶向旄頭夜夜看傷李端云才子浮生促泉臺此路賖官卑揚執戟年少賈長沙人去門捿鵩災成酒誤蛇唯余封禪草留在茂陵家假成式云大曆末禪師元鑒住荆州陟岵寺道髙有風韻人不可得而親張璪嘗畫松於齋壁符載贊之象詠之時號三絶悉加堊焉人問之曰無事疥吾壁也其徒有殺物命者弗之責有髙行者亦不稱或怪之乃題詩於竹曰大海從魚躍長空任鳥飛乃知象大曆間江陵詩人也李宣逺并州路作云秋日并州路黃榆落照間孤城吹角罷數騎射雕還帳幕遙臨水牛羊自下山征人正垂淚烽火起雲間近無西耗云逺戎兵壓境遷客淚橫襟烽候驚秦塞囚居困越吟自憐牛馬走未識犬羊心一月無消息西看日又沉宣逺正元進士登第熊孺登至日荷李常侍過郊居云賤子守柴荆誰人記姓名風雲千騎降草木一陽生禮異江河動歡殊里巷驚稱觴容侍坐看竹許同行遇覺滄溟淺恩疑太嶽輕盡搜天地物無諭此時情和竇中丞歲酒喜見小男兩歲云更添十歲應為相歲酒從今把未休聞得一毛添五色眼看相逐鳳池頭劉夢得送湘陽熊判官孺登府罷歸鍾陵因寄江西裴中丞詩云射策志未就從事府云除篋留馬卿賦袖有劉引書忽見夏木隂恨然憶吾廬復持州民刺歸謁專城居樂天洪州逢孺登詩云靖安院裏新荑下醉笑狂吟氣最麁莫問别來多少苦低頭看取白髭鬚孺登鍾陵人登進士第終於藩鎮從事崔立之南至隔仗望含元殿香爐詩云千官望長至萬國拜含元隔仗爐光出浮霜煙氣翻飄飄縈內殿漠漠淡前軒聖日開如捧卿雲近欲渾輸囷灑宮闕蕭索散乾坤願倚天風便披香奉至尊退之贈崔立之評事詩云崔侯文章苦敏捷髙浪駕天輸不盡曾從關外來上都隨身卷軸車連軫朝為百賦猶鬱怒暮作千詩轉遒緊詩意殊憫其窮立之登正元進士第郭遵南至日隔仗望含元殿香爐詩云冕旒親負扆卉服盡朝天暘谷移初日金爐出御煙芬馨流逺近散漫入貂蟬霜仗凝余白朱欄映轉鮮如看浮闕在稍覺逐風遷為沐皇家慶來瞻羽衛前遵登正元進士第韋紓南至日隔仗望含元殿香爐云抗殿疏元首髙髙接上玄節當南至日星是北辰天寶戟羅仙仗金爐引瑞煙霏微雙闕麗溶泄九州連拂曙祥光滿分晴曉色鮮一陽今在曆生植願陶甄紓正元進士也唐詩紀事卷第四十三
