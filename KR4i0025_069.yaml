front:
  text: 唐詩紀事卷第六十九
  hash: sha256:87cca7750ccc1c711c64f9d2bb976c9869c67463151905f29aaf1424ea40f543
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_069-1a}
body:
  text: 羅虬羅隱劉贊陸庡比紅兒詩并序云比紅者為雕隂官妓杜紅兒作也美貌年少機智慧悟不與羣輩妓女等余知紅者乃擇古之美色灼然干史傳三數十輩優劣於章句間遂題比紅詩姓氏看侵尺五天芳菲占斷百花鮮馬嵬好笑當時事虛賺明皇幸蜀川金谷園中花正繁墜樓從道感深恩齊奴恰是來東市不為紅兒更死冤故小名齊奴石崇生青州陷却平陽為小憐周師百萬戰長川更教乞與紅兒貌舉國山川不直錢主馮淑妃名小憐北齊後一曲都緣張麗華六宫齊唱後庭花若教比並紅兒貌枉破當時國與家樂營門外栁如隂中有佳人畫閣深若是五陵公子見買時應不啻千金青絲髙綰石榴裙腸斷當筵酒半醺置向漢宫圖畫裏入朝應不啻昭君斜憑欄杆醉態新斂眸微眄不勝春當時若遇東昏主金葉蓮花是此人匼匝千山與萬山碧桃花下景長間神仙得似紅兒貌應免劉郎憶世間越山重疊越溪斜西子休憐解浣沙得似紅兒今日貌肯教將去與夫差詔下人間覔好花月眉雲髻選人家紅兒若向當時見繫臂先封第一紗鋒鏑縱橫不敢看淚垂玉筯正泛瀾應緣近似紅兒貌始得深宫奉五官金縷濃薰百和香臉紅眉黛入時粧當時便向喬家見未敢將心在窈娘故事喬知之通霄甲帳散香塵漢帝精神禮百神若見紅兒醉中態也應休憶李夫人拔得芙蓉出水新魏家公子信才人若教瞥見紅兒貌不肯留情賦洛神芳姿不合並常人雲在遙天玉在塵因事愛思荀奉倩一生間坐枉傷神筆底如風思湧泉賦中休謾説嬋姢紅兒若在東家住不得登墉爾許年一抹濃紅傍臉斜粧成不語獨攀花當時若是逢韓夀未必埋蹤在賈家樹裊西風日半沉地無人迹轉傷心阿嬌得似紅兒貌不費長門買賦金五雲髙捧紫金堂花下投壺侍玉皇從道世人都不識也應知有社蘭香戲水源頭指舊蹤當時一笑也難逢紅兒若為廽桃臉豈比連催舉五烽虢國夫人照夜璣若為求得與紅兒醉和香態濃春睡一樹繁花偃繡幃知有持盈玉葉冠剪雲裁月照人寒若使紅兒風貌戴直似瑶池會上看明媚何曾讓玉環破瓜年幾百花顔若教貌向南朝見定却梅粧似等間世事悠悠未足稱肯將間事更爭能自從命向紅兒斷不欲留心在裂繒自隱新從夢裏來嶺雲微步下陽臺舍情一向春風笑羞殺凡花盡不開捨却青娥換玉鞍古來公子苦無端莫言一匹追風馬天驥牽來也不看檻外花低瑞露濃夢魂驚覺暈春容憑君細看紅兒貌最稱嚴粧待曉鍾薄羅輕剪越溪紋鴉翅低從兩鬢分料得相如偷見面不應琴裏挑文君南國東鄰各一時後來唯有杜紅兒若教楚國宫人見羞把腰身並栁枝照耀金叉簇膩鬟見時直向畫屏間黃姑阿母能判剖十斛明珠也是間輕小休誇似燕身生來占斷紫宫春漢皇若遇紅兒貌掌上無因著别人鸚鵡娥如裛露紅鏡前眉樣自深宫稍教得似紅兒貌不嫁南朝沈侍中擬將心地學安禪爭奈紅兒笑靨圎何物把來堪比並野塘初綻一枝蓮浸草漂花繞檻香最憐穿度樂營墻殷勤留滯緣何事曾照紅兒一面粧雕隂舊俗騁嬋姢有箇紅兒賽洛川常笑世人語虛誕今朝自見火中蓮渡口諸儂樂未休堯陵西望路悠悠石城有箇紅兒貌兩槳無因迎莫愁誰向深山識大仙勸人山上引春泉定知不及紅兒貌枉却工夫溉玉田雍伯故事搜神記楊傾國傾城㧾絶倫紅兒花下認真身十年東北看燕趙眼冷何曽見一人今時自是不諳知前代由來豈見遺一笑陽城人便惑何堪教見杜紅兒京口喧喧百萬人競傳河鼓謝星津奈花似雪簮雲髻今日夭容是後身青史書時未是真可能纎手却狂秦再三為謝齊皇后要解連環別與人繡帳鴛鴦對刺紋博山微暖麝微曛詩成若有紅兒貌悔道當時月墜雲粧成渾欲認前朝金鳳義雙逐步搖未必慕容宫裏伴舞風歌月勝纎腰琥珀叉成恩正深玉兒妖惑蕩君心莫教回首看粧面始覺曾虛擲萬金自有間花一面春臉檀眉黛一時新殷勤為報梁家婦休把啼粧賺後人故事梁兾輕梳小髻號慵來巧中君心不用媒可得紅兒拋醉眼漢皇恩澤一時回千里長江旦暮潮吳都風俗尚纎腰周郎若見紅兒貌料得無心念小喬月落潛奔暗解携本心誰道獨單棲還緣交甫非良偶不肯終身作羿妻漢皇曾識許飛瓊寫向人間作畫屏昨日紅兒花下見大都相似更娉婷魏帝休誇薛夜來霧綃雲縠稱身裁紅兒笑發君知否倚檻繁花帶露開曉月雕梁燕語頻見花難可比他人年年媚景歸何處長作紅兒面上春逗玉濺盆冬殿開邀恩光賜夜明苔紅兒若是三千數多少芳心似死灰畫簾垂地紫金床暗引羊車駐七香若見紅兒此中住不勞煙篠灑宫廊蘇小空勻一面粧便留名字在錢塘藏鷗門外諸年少不識紅兒未是狂一首長歌萬恨來惹愁漂泊水難回崔徽有底多頭面費得微之爾許才昔年黃閣識竒章愛説真珠似窈娘若見紅兒深夜態便應休説繡衣裳鳳拆鶯離恨轉深此生難負百年心紅兒若向隨朝見破鏡無因更重尋行綰穠雲立暗軒我來猶愛不成冤當時若見紅兒貌未必形相有此言揔似紅兒媚態新莫論千度笑爭春任伊孫武心如鐵不辨軍前殺此人暖塘爭赴蕩舟期行唱菱歌著艷詞為問東山謝丞相可能諸妓勝紅兒吳興皇后欲辭家澤國重臺展曙霞今日紅兒貌傾國恐須真宰別開花陌上行人歌黍離三千門客欲何之若教粗及紅兒貌爭敢樓前斬愛姬休話如臯一笑時金髐中臆錦離披陋容枉把雕弓射射盡春禽未展眉長恨西風送早秋低眉深恨嫁牽牛若同人世長相對爭作夫妻得到頭謝娘休謾逞風姿未必娉婷勝柳枝聞道只應嘲落絮何曾得似杜紅兒總傳桃葉渡江時只為王家一首詩今日紅兒自堪唱不須枉唱舊來詞巫山洛浦本無情揔為佳人便得名今日雕隂有神艷後來公子莫相輕幾拋雲髻恨金墉淚洗花顔百戰中應有紅兒些子貌却言皇后長深宫倚檻還應有所思半開東閣見嬌姿可中得似紅兒貌若遇韓朋好殺伊曉向粧窗與畫眉鏡中長欲助嬌姿若教得似紅兒貌走馬章臺任道遲錬得霜華助翠鈿相期朝謁玉皇前依稀有似紅兒貌方得吹簫引上天重門深掩幾枝花未勝紅兒莫大誇王相不能探物理可能虛上短轅車前代休憐事可奇後來還出有光輝爭如晝卧紗窗裏不有神人覆玉衣化羽嘗聞赴九天只疑塵世是虛傳自從一見紅兒貌始信人間有謫仙從道長安小市東巧將花貌占春風紅兒若是同時見未必伊仙入紫宫人間難免是深情命斷紅兒向此生不似前時李丞相枉拋才力為鶯鶯鳳舞香飄繡幕風暖穿馳道百花中還緣有似紅兒貌始道迎將入漢宫休道將軍出世才盡驅諸妓下歌臺都緣沒箇紅兒貌致使輕教後閣開馮媛須知住漢宫將身只是解當熊不聞有貌傾人國爭得今朝更似紅能將一笑使人迷花艷何須上大堤踈屬便同巫峽路洛川真是武陵溪辭輦當時意可知寵深還恐寵先衰若教得似紅兒貌占却君恩自不疑三吳時俗重風光未見紅兒一面粧好寫妖饒與教看便應休更話真娘波平楚澤浸星辰臺上君王宴早春畢竟章華會中客冠纓虛絶為何人紅兒不向漢宫生便使雙成謾得名疑是麻姑惱塵世暫教微步下層城天碧輕紗只六銖宛如含露透肌膚便教漢曲爭明媚應沒心情更弄珠共嗟含恨向衡陽方寸花箋寄沈郎不似紅兒些子貌當時爭得少年狂淺色桃花亞短墻不因風送也聞香凝情盡日君知否還似紅兒淡薄粧火色櫻桃摘得初仙宫只有世間無凝情盡日君知否真似紅兒口上朱宿雨初晴春日長入簾花氣靜難忘凝情盡日君知否真似紅兒舞袖香初月纎纎映碧池池波不動獨看時凝情盡日君知否直似紅兒罷舞眉濃艷濃香雲壓枝裊煙和露曉風吹紅兒被掩粧成後含笑無人獨立時樓上嬌歌裊夜霜近來休數踏歌娘紅兒謾唱伊州遍認取輕敲玉韻長金粟粧成扼臂環舞腰輕薄瑞雲間紅兒生在開元末羞殺新豐謝阿蠻君看紅兒學醉粧誇裁宫纈砑裙長誰能更把間心力比並當時武媚娘梔子同心裛露垂折來深恐沒人知花前醉客頻相間不贈紅兒贈阿誰雲間翡翠一雙飛水上鴛鴦不暫離寫向人間百般態與君題作比紅詩舊恨長懷不語中幾回偷泣向春風還緣不及紅兒貌却得生教入楚宫一舸春深指鄂君好風從度水成紋越人若見紅兒面繡被應羞徹夜薰花落塵中王墮泥香魂應上窈娘堤欲知此恨無窮處長倩城烏夜夜啼虬詞藻冨贍與宗人隱鄴齊名咸通乾符中時號三羅廣明庚子亂後去從鄜州李孝恭籍中有杜紅兒者歌常為副戎屬意副戎聘鄰道虬請紅兒歌而贈綵孝恭以副戎所盻不令受之虬怒拂衣而起詰旦手刃紅兒既而思之乃作絶句百篇以追其冤號比紅盛行於時羅隱劉贊字昭諌餘杭人隱池之梅根浦自號江東生為唐相鄭畋李蔚所知畋女覽隱詩諷誦不已畋疑有慕才意貌寢陋女一日簾窺之自此絶不詠其詩廣明中池守竇潏營墅居之光啓中錢鏐辟為從事節度判官副使梁祖以諫議召不行開平中魏博羅紹威推為叔父表授給事中年八十餘終餘杭塞翁有子隱虬鄴共場屋謂之三羅隱與桐廬章魯封齊名錢鏐初起以魯封為表奏孔目官不就執之後以隱為錢塘令懼而受命因宴獻口號曰一箇禰衡容不得思量黃祖謾英雄鏐自是厚禮之僧貫休懷二子詩云二子依公子雞鳴狗盜徒青雲十上苦白髮一莖無風􅧣潮聲惡天空角韻孤別離千萬里何以慰榮枯隱謝裴廷韓詩卷云澤國佳人唯粧半面營丘辨士何用空籠其浮薄如此隱受知於令狐綯卒無成有詩哭綯云深恩無以報底事是柴荆鄴都王紹威學隱為詩自號其文為偷江東集青州王師範遣使齎禮幣求一篇隱以詩寄之曰盛業傳家有寶刀况聞餘力更揮毫腰間印綬黃金貴卷內文章白雪高宴罷佳賔吟鳳藻獵回諸將問龍韜登壇甲子才三十猶擬回頭奪錦摽王得詩大喜昭宗欲以甲科處之有大臣奏曰隱雖有才然多輕易明皇聖德猶橫遭譏將相臣僚豈能免乎凌爍帝問譏謗之詞對曰隱有華清詩曰樓殿層層佳氣多開元時節好笙歌也知道德勝堯舜爭奈楊妃解笑何其事遂寢令狐滈趙公綯之子登進士隱以詩賀之趙公謂滈曰吾不喜汝及第喜汝得羅公一篇耳隱在浙幕沈山松得新榜示隱題其末曰黃土原邊狡兔肥大如流電馬如飛霸陵老將無功業猶憶當時夜獵歸鍾陵妓雲英隱舊見之一日譏隱猶未第隱嘲之曰鍾陵醉別十餘春重見雲英掌上身我未成名君未嫁可能俱是不如人顧雲依淮南高駢隱譏之夏飲於海風亭雲曰青蠅被扇扇離坐隱遽曰白澤遭釘釘在門隱老不遇有歸五湖詩云江東日暖花又開江東行客思悠哉髙陽酒徒半凋落終南山色空崔嵬聖代也知無棄物侯門未必用非才一船明月一竿竹家住五湖歸去來進士劉贊贈隱詩曰人皆言子屈獨我謂君非明主既難謁青山何不歸年虛侵雪鬢塵枉汚麻衣自古逃名者至今名豈微牡丹云似共東君別有因綘羅髙卷不勝春若教解語應傾國任是無情也動人芍藥與君為近侍芙蓉何處避芳塵可憐韓令功成後辜負穠華過此身籌筆驛云拋擲南陽為主憂北征東討盡良籌時來天地皆同力運去英雄不自由千里山河輕孺子兩朝冠劒恨譙周惟余嵓下多情水猶解年年傍驛流魏城逢故人云一年兩度錦江遊前值東風後值秋芳草有情皆礙馬好雲無處不遮樓山將別恨和心斷水帶離聲入夢流今日因君試回首淡煙喬朩隔綿州中秋夜不見月云隂雲薄暮上空虛此夕清光已破除只恐異時開霽後玉輪依舊養蟾蜍蜂云不論平地與山尖無限風光盡被沾採得百花成蜜後不知辛苦為誰甜杜荀鸖錢塘別隱詩云故國看看逺前程計在誰五更吹角候一葉渡江時吾道天寧喪人情日可疑西陵向西望雙淚為君垂鼉江常有二氣亘于江終夜不滅隱及杜建徽生氣不復見議者以為文武秀氣江南李氏嘗遣使聘越越人問見羅給事否使人曰不識亦不聞名越人云四海聞有羅江東何拙之甚使人曰為金榜上無名所以不知陸扆扆詩有今秋已約天台月之句或云扆昭宗末舉進士及第六月榜出盛暑同舍戲曰造榜天也觀扆此詩豈幸倉猝茍科第者唐詩紀事卷第六十九
