front:
  text: 唐詩紀事卷第八十
  hash: sha256:27f60088d52c3f1dabda62454ab56be467b6867617886ae33dabb1dced4f2dbc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_080-1a}
body:
  text: 河北人不知名僕新羅王楊彥鯤不知名權龍褒河北士人朱滔以士族應募問一士人所業曰學為詩有妻乎曰有之令作寄內詩即曰握筆題詩易荷戈征戍難慣從鴛𬒳暖怯厺鴈門寒瘦盡寬衣帶題多漬枕檀試留青黛著盡日畫眉看又令代妻答曰蓬鬢荆叉世所稀布裙還是嫁時衣胡麻好種無人種正是歸時不見歸事詩出本不知名江陵有士子遊交廣五年未還愛姫為太守所取納於高麗坊底及歸寄詩曰隂雲幕幕下陽臺惹著襄王更不回五度看花空有泪一心如結不曽開纎蘿自合依芳樹覆水寧思返舊杯惆悵髙麗坊底宅春光無復下山來守逐遣還有為御史分務洛京者其愛姬為逢吉一閉遂不復出明日以詩投之云三山不見海沉沉豈有仙縱尚可尋青鳥厺時雲路斷嫦娥歸處月宫深紗窗暗想春相憶書愰誰憐夜獨吟料得此時天上月只應偏照兩人心李得詩含笑曰大好詩逐絶唐人及第後或遇舊題名處即加前字故詩曰曽題名處加前字送出城人乞舊詩街添一字舊友讓前姚合及第後詩曰新途長安木塔院有進士房曽題名處有人題詩曰姚家新壻是房郎未解芳顔意欲狂見説正調穿羽箭莫交射破寺家墻丹陽焦山瘞鶴銘傍小碣刻詩云江外水不凍今年寒苦遲三山在何許欲到引風歸后題云丹陽椽王瓉作後復得小石云縱步不知逺夕陽猶未回好花隨處發流水趂人來不知誰為之傳聞天子訪沉淪萬里懷書西入秦早知不用無媒客恨别江南楊柳春不知名氏顧陶類詩云僕咸陽郭氏之僕捧劍者有詩曰青鳥㗸蒲萄飛上金井欄美人恐驚厺不敢捲簾看又題牡丹云一種芳菲出後庭却輸桃李得佳名誰能為向天人説從此移根近太清後耻為奴隸逃走有詩曰珍重郭四郎臨行不得别曉漏動離心輕車冒殘雪欲出主人門零涕暗嗚咽萬里隔關山一心思漢月京兆司録全曉述此事以語李蹊友議雲溪孫願唐貞元已後三代為池陽刺史有戟門門子朱元迎道左獻詩曰昔日郎君今刺史朱元依舊守朱門今朝行馬諸童子盡是當時竹馬孫新羅主太宗立新羅主善德妹真德為王永徽元年真德大破百濟之衆遣其弟法敏以聞真德乃織錦作五言太平頌以獻之其詞曰大唐開洪業巍巍皇猷昌止戈戎衣定修文繼百王統天崇雨施理物休含章深仁諧日月撫運邁陶唐幡旗何赫嚇鉦鼓有鍠鍠外夷違命者剪覆𬒳天殃淳風疑幽顯遐邇競呈祥回時和玉燭七耀巡萬方維嶽降宰輔維帝任忠良五三成一德昭我皇家唐帝嘉之楊竒鯤竒鯤南詔大酋之心膂也僖宗時來朝高駢自淮海飛章曰蠻酋用事唯竒鯤等數人請止而鴆之帝用其䇿竒鯤有詞藻途中詩云風裏浪花吹又白雨中嵐影洗還青沙鷗住處窗前見林狖啼時枕上聽北出言要瑣不知名雜調云勸君莫惜金縷衣勸君須惜少年時有花堪拆直須拆莫待無花空拆枝青天無雲月如燭露泣梨花白如王子規一夜啼到明美人獨在空房宿石沉遼海濶劍别楚山長會合知無日離心滿夕陽空賜羅衣不賜恩一燻香後一銷魂雖然舞袖何曽舞長對春風裛泪䀶不洗殘粧憑繡床却嫌鸚鵡繡衣裳回針刺到雙飛處憶昔征夫泪數行眼想心思夢裏驚無人知我此時情不如池上鴛鴦鳥雙宿雙飛過一生一去遼陽繫夢魂忽傳征騎到中門紗窗不肯施紅粉啚遣蕭郎問泪䀶鶯啼露冷酒初醒罨畫樓西曉角鳴翠羽帳中人夢覺寶叉斜墜枕函聲行人南北分征路流水東西接御溝日日波前怨離别謾名長樂是長愁偏倚繡床愁不起雙垂玉筯翠環低卷簾相待無消息夜合花開日又西悔將泪眼向東開特地愁從望裏來三十六峰猶不見况伊如燕這身裁滿目笙歌一段空萬般離恨總隨風多情為謝殘陽意與展晴霞片片紅兩心不語暗知情燈下裁縫月下行行到階前知未睡夜深聞放剪刀聲六言詩云把酒留君聽琴那堪歲暮離心霜葉無風自落秋天不雨多隂人愁荒村路逺馬怯寒溪水深望盡清山猶在不知何處相尋美人騎馬云駿馬嬌仍穩春風霸岸晴促來金蹬短扶上玉人輕帽束雲鬟亂鞭籠翠袖明不知從此厺何處更傾城乾符末有客訪僧僧却之題門而厺云龕龍厺東海時日隱西斜敬文今不在碎石入流沙忽一僧曰大罵我曹乃合寺茍卒四字鴈塔詩云漢國山河在秦陵草樹深暮雲千里色何處不傷心傍書云荆叔偶題不知何人也盧常侍牧章江一曹生令為從事曹悅營妓丹霞盧不許會餞朝客曹有詩曰拜玉亭前間送客此時孤恨感離鄉尋思往歲絶纓事肯向朱門泣夜長盧演為長句云桑扈交暉百舌忙祖亭同樂陪思鄉樽前有恨同卑宦席上無聊發靚粧莫與狂花迷眼界須求真理定心王遊蜂採掇何時已却恐多言議短長令丹霞改令罰曹丹霞乃號之為怨胡天以曹狀類胡滿座大笑盧因目丹霞為怨胡婦盧氏子失弟徒步及都城門來寒甚有一人續至附火吟曰學織繚綾功未多亂拈機杼錯拋梭莫教宫錦行家見把此文章笑殺他遂云如今不重文章士莫把文章誇向人盧愕然以為樂天詩問姓名曰姓李世織綾錦前屬東都宫錦坊宫錦巧兒以薄妓投本行皆云如今花樣與前不同不謂伎倆兒以文彩求售者不重於世且東歸厺權龍褒景龍中為左武將軍好賦詩而不知聲律中宗與學士賦詩輒自預焉帝戲呼為權學士初以親纍逺貶洎歸獻詩云龍褒有何罪天恩放嶺南勑知無罪過追來與將軍上大笑常吟夏日詩嚴雪白皓皓明日赤團團或曰豈是夏景答曰趂韻而已通天中刺滄洲初到呈同官曰遙看滄洲城楊柳鬱青青中央一群漢聚坐打柸角諸公謝曰公有逸才曰不敢趂韻而已常作秋日休懷詩曰簷前飛七百雪白後園疆飽食房裏側家糞集野狼參軍不曉問之權曰鷂子簷前飛直七百洗衫挂後園白如雪飽食房中側卧家裏便轉集得野澤蜣蜋開者嗤之始賦夏日嚴霜明月之句乃皇太子宴賦詩太子援筆譏之曰龍褒才子秦州人士明月晝耀嚴雪夏起如此詩章趂韻而已龍褒為􅌡洲刺史歲暮京州人附書云改年多感乃將書呈判司以下云有司改年為多感元年一日謂府吏何名私忌對曰父母忘日請假偶房中靜坐有青狗突入大怒曰衝破我忌更牒改到明日好作忌日談者笑之唐詩紀事卷第八十
