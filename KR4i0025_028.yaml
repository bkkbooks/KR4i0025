  text: 唐詩紀事卷第二十八
  hash: sha256:a52ef86028bbfc991c57c67e488908d07c06d529061e4da2cfb7854cbbe8d007
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_028-1a}
body:
  text: 張濯孫叔向朱長文胡令能鄭丹李希仲杜誦鄭錫古之竒秦系令狐峘楊凌劉太真顧况薛業劉希戩朱絳元凛楊志堅劉方平李揆戎昱張濯題舜廟云古都遺廟出山濆萬代千秋仰聖君蒲版城邊長逝水蒼梧野外不歸雲寥寥象設魂應老寂寂虞篇德巳聞向晚風吹庭下柏猶疑琴曲韻南薰濯登上元進士第孫叔向題昭應溫泉云一道溫泉繞御樓先皇曽向此中逰雖然水是無情物也到宫前咽不流送咸安公主云鹵簿遲遲出國門漢家公主嫁烏孫玉顔使向穹廬去衛霍空承明主恩咸安德宗女元和時追封燕國襄穆公主朱長文吳興送梁輔闕歸朝賦得荻花云柳家汀州孟冬月雲寒水清荻花發一枝持贈朝天人願比蓬萊殿雪前春眺揚州西岡寄於貟外云蕪城西眺極蒼流漠漠春煙間曙樓瓜步早湖吞建業蒜山晴雪照揚州隋家故事不能向鸖在山池期我遊望中有懷云龍向洞中銜雨出鳥從花裏帶香飛白雲斷處見明月黃葉落時聞搗衣宿新安江深度館寄鄭州王使君云霜飛十月中搖落衆山空孤館閉寒禾大江生夜風賦詩忙有意沈約在關東送李司直歸浙東幕兼寄鮑將軍云翩翩書記早曽聞二十年來願見君今日朝廷想白髮同時幾許在青雲人從北固山邊去水到西陵渡口分會作王門曵裾客為餘前謝鮑將軍封東平郡王時節度大夫𥘉長文大曆間江南詩人胡令能詠繡障云日暮堂前花蘂嬌爭拈小筆上床描繡成安向春園裏引得黃鶯下柳條小兒垂釣云蓬頭稚子學垂綸側坐莓苔草映身路人借問遙拈手恐畏魚驚不應人喜圃田韓少府見訪云忽聞梅福來相訪笑著荷衣出草堂兒童不慣見車馬爭入蘆花深處藏令能圃田隱者少為負局鎪釘之業以所居列子之里家貧遇茶果必祭列子以求聰明或夢人割其腹以一卷書內之遂能吟詠禪學尤邃世謂胡釘鉸者也正元元和間人鄭丹肅宗挽歌云國以重明受天從諒暗移諸侯方北靣白日又西馳龍影當泉落鴻名向廟垂永言青史上還見載無為玄宗挽歌云律曆千年會車書萬里同固期常戴日豈意厭觀風地慘新疆理城摧舊戰功山河萬古壯今夕盡歸空高仲武云鄭丹詩剪刻婉密寶應中獻二帝兩后挽歌三十首詞旨哀楚得臣子之致雖不及事朝廷嘉之解褐蘄州録事參軍二章其尤者也丹大曆間詩人李希仲東皇太一詞云吉日𥘉齋戒靈巫穆上皇焚香布瑶席鳴珮奠椒漿緩舞花飛滿清歌水去長回波送神曲雲雨滿瀟湘薊北行云旄頭有精芒胡騎獵秋草羽檄南渡河邊庭用兵早漢家愛征戰宿將今巳老辛苦羽林兒從戎榆關道一身救邊速烽火通薊門前軍飛鳥斷格鬪塵沙昏寒日鼓聲急單于夜將奔當須徇忠義身死報國恩高仲武云希仲輕靡華勝於質此所謂才力不足務為清淺者也然前軍飛鳥斷格鬪塵沙昏亦出塞録疊疊不歇可及中矣希仲趙郡人天寶𥘉宰偃師范陽趙戎挈家避亂入江淮杜誦誦哭長孫侍御云道為謀猷重名因賦頌雄禮闈曽擢桂憲府既乘驄流水生涯盡浮雲世事空惟應舊松柏蕭飋九原中高仲武云誦詩平調不失文流如流水生涯盡浮雲世事空得生人始終之理故編於集誦大曆間詩人也鄭錫邯鄲少年行云霞鞍金口騮豹袖紫貂裘家住叢臺下門前漳水流喚人呈楚舞借客試吳鈎見説秦兵至甘心赴國讎李嘉祐與錫遊春詩云東門垂柳長回首獨心傷日暖臨芳草天晴憶故鄉映花鶯上下過水蝶悠揚借問同行客今朝淚幾行李端司空曙皆錫友也錫登寶應進士第寶曆間為禮部員外郎李長史墓銘事見李翺所撰古之竒秦人謡云微生祖龍代却思堯舜道何人仕帝庭拔殺指佞草姦臣弄民柄天子恣衷抱上下一相蒙馬鹿遂顛倒中國既版蕩骨肉安可保人生貴年壽吾恨死不早李端送之竒赴涇州幕云疇昔十年兄相逢五校營今宵舉杯酒隴月見軍城僕射辟時從馬之竒登寶應進士第秦系系呈韋蘇州詩云久卧雲間巳息機青袍忽著狎鷗飛詩興到來無一事郡中今有謝元暉系字公緒會稽人隱泉州南安九日山張建封聞系不可致就加校書郎自號東海釣客與劉長卿善權德輿曰長卿自以為五言長城系用偏師攻之矣韋答系曰知掩山扉三十秋魚鬚翠碧葉床頭莫道謝公方在郡五言今日為君休蓋系以五言得名久矣年八十餘卒南安人號其峰為高士峰系將移耶溪舊居留呈嚴長史陳校書允𥘉云雞犬漁舟裏長謡任興行即今邀客醉巳𬒳逺山迎書笈將非重荷衣著甚輕謝安無箇事忽起為蒼生山中贈張評事時授右衛佐云終年常避喧自注五千言流水間過院春風與閉門山茶邀土客桂實落前軒何事教豫起微言不足論系家剡山向盈一紀大曆五年人或以其文聞於留守薛公無何奏系右衛率府倉參軍意所不欲以疾辭免因將命者獻詩云由來那敢議輕肥散髮行歌自採薇逋客未能忘野興辟書令遣脫荷衣家中匹婦空相笑池上群鷗盡欲飛更乞大賢容小隱益看愚谷有光輝系曽與鮑員外同舉場因其見尋呈情云少小為儒不自強如今復懶見侯王覽鏡自知身漸老買山將作計偏長荒涼鳥獸同三徑撩亂琴書共一床猶有郎官來問病時人莫道我徉狂山中寄錢起苗發云空山歲計是胡麻窮海無梁泛一槎幼子唯能覔黎粟逸妻相共老煙霞高吟麗句驚巢鸖間閉春風看落花借問省中何水部今人幾箇屬詩家令狐峘儒服學從政遂為塵事嬰䘖命東復西孰堪異鄉情懷祿且懷恩䇿名敢逃名羡彼農畝人白首親友并江山入秋氣草木雕晚榮方塘寒露凝旅館涼飈生懿交守東吳夢想聞頌聲雲水方浩浩離憂何時平右令狐峘寄韋蘇州詩峘德棻五世孫天寶末第進士宰相楊炎故出杜鴻漸門下其子封求洪文生以託峘峘曰必得公手書得書即奏之炎具奏所以然德宗曰姦人也自禮侍貶衡州别駕人以為怨峘介愎人韋蘇州答峘詩云一凶乃一吉一是復一非孰能逃斯理亮在識其微三黜故無愠高賢當庶幾但以親交戀音容邈難希况惜别離久俱欣蕃守歸朝晏方陪厠山川又乖違吳門昌海霧峽路凌連磯同會在京國相望涕沾衣明時重英才當復别彤闈白王雖塵垢拂拭還光輝峘再謫三衢遇田敦為牧乃門生也方相見敦曰吾今日方見座主乃分半俸奉之楊凌淮陽為郡暇坐惜流芳歇散懷纍榭風清暑澄潭月陪燕辭三楚戒途綿百越非當逺别離雅奏何由發右楊凌詩韋應物剌滁州凌時以協律客滁州既别韋寄詩云吏散山閣掩鳥鳴山郡中逺念長江别俯覺坐隅空舟泊南池雨簟捲北樓風併罷芳樽燕為愴昨時同故凌以前詩謝之凌明妃怨云漢國明妃去不還馬駝絃管向隂山匣中縱有菱花鏡羞對單于照舊顔凌字恭履最善文章大曆中與兄憑凝踵進士第時號三楊凌終侍御史子敬之劉太真寵至乃不驚罪及非無由奔迸厯畏途𬗟邈赴偏陬牧此雕弊氓屬當賦斂秋夙興諒無輔旬暇焉敢休前日懷友生獨登城上樓迢迢西北望逺思不可收今日車騎來曠然銷人憂晨迎東齋飯晚度南溪遊以我碧流水泊君青翰舟莫將遷客程不為勝景留飛扎謝三守斯篇希見酬右劉太真詩太真剌信州時顧十二左遷過上饒出韋蘇州房杭州韋睦州三使君詩太真繼焉太真宣州人師蕭潁士蕭云太真吾入室者也正元四年德宗詔群臣宴曲江自為詩群臣皆和帝自第之以太真李紓等為上鮑防于邵等次之張蒙等為下與擇者四十二人韋蘇州答太真詩云瓊樹凌霜雪䓤蒨如芳春英賢雖出守夲自王階人宿昔陪郎署出入迎清塵孰云俱列郡比德豈為鄰其見重如此顧况况字逋翁姑蘇人至德進士性詼諧與柳渾李泌為方外友德宗時渾輔政以祕書郎召及泌相自謂當得逹官久之遷著作郎况坐詩語調謔貶饒州司戶居於茅山以壽終皇甫湜為况文集序云偏於逸歌長句駿發踔厲往往若穿天心出月脅意外驚人語非尋常所能及最為快也其為人類其詞章云况志尚踈逸近於方外時宰招以好官况以詩答云四海如今巳太平相公何用喚狂生此生還似籠中鸖東望􅌡州呌一聲上柳相公子規詩云棲霞山中子規鳥口邊血出啼不了山僧夜後𥘉入定聞似不聞山月曉露青竹杖歌云鮮于仲通正當年章仇兼瓊在蜀川約束蜀兒採馬鞭蜀兒採鞭不敢眠橫截斜度飛鳥邊繩橋夜上層崕巔頭插白雲跨飛泉採得馬鞭長且堅浮漚丁子珠聮聮灰煮蠟揩光爛然章仇兼瓊持上天上天雨露何其偏飛龍間廄馬數千朝飲吳江夕秣燕紅塵撲轡汗濕韉師子麒麟聊比肩曲江昆明洗刷牽四蹄浪頭枿天蛟龍稽顙河伯虔拓羯胡雛腳手鮮陳閎韓幹丹青妍欲貌未貌眼欲穿金鞍王勒錦連乾騎入桃花楊柳煙十二樓中奏管絃樓中美人奪神仙爭愛大家把此鞭祿山入關關破年忽見楊州北邸前祗有人還千一錢亭亭筆直無皴節磨捋形相一條鐵市頭終是無人别江海賤臣不拘絏垂綃挂影西窗缺稚子覔衣挑仰穴家僮拾薪幾柪折玉潤猶霑玉壘雪碧鮮似染萇弘血蜀帝祠邊子規咽相如橋上文君絶往年䇿馬降至尊七盤九折橫劒門穆王八駿超昆崘安用冉冉孤生根聖人不貴難得貨金玉珊瑚誰買恩况攻小筆嘗求知新亭監人詰之曰余要貌海中山耳仍辟畫省王默為副任職半年解後落筆有竒趣山中作云野人愛向山中宿况在葛洪丹井西庭前有箇長松樹半夜子規來上啼况又有汀洲渺渺江籬短疑是疑非兩斷腸句巫峽朝雲暮不歸洞庭春水晴空滿句頺垣化為陂陸地堪乘舟句大姑山盡小孤出月照洞庭行客船句右張為取作主客圖代佳人贈别云萬里行人欲渡溪千行珠淚滴為泥巳成殘夢隨君去猶有驚烏半夜啼秋題葉道士山房云水邊垂柳赤欄橋洞裏仙人吹玉簫近得麻姑書信否潯陽向上不通潮金鐺玉珮歌云贈君金鐺太霄之玉佩金鎖禹步之流珠五嶽真君之祕籙九天文人之寶書東井沭浴辰巳畢先進洞房上奔日借問君從何處來黃姑織女機邊出悲歌三首并序云情思發動聖所不免也故師乙陳其宜延陵審其音理亂之所經王化之所興信無逃聲豈徒文彩之麗遂作歌以悲之云邊城路今人犂田昔人墓岸上沙昔時江水今人家今人昔人共長歎四氣相催節回換明月皎皎入華池白雲離離渡青漢我欲升天天隔霄我欲渡水水無橋我欲上山山路險我欲吸井井泉遙越人翠𬒳今何夕獨立沙邊江草碧紫燕西飛欲寄書白雲何處蓬萊客新繫青絲百尺繩心在君家轆轤上我心皎潔君不知轆轤一轉一惆悵何處春風吹曉幕江南渌水通朱閣美人二八顔如花泣向春風聽春鳥別時多見時少愁人一夜不得眠瑶井玉繩相對曉軒轅黃帝𥘉得仙鼎湖一去三千年周流三十六洞天洞中日月星辰聮騎龍倒景遊八極軒轅弓劒無人識東海青童寄消息八月五日歌云四月八日明星出摩耶夫人降千佛八月五日佳氣新昭成太后出聖人開元九年燕公説奉詔聽置千秋節丹青廟裏貯姚宋花蕚樓中宴岐薛清樂靈香幾處聞鸞歌鳯吹動祥雲巳於武庫見靈鳥仍向晉山逢老君率土溥天無不樂河清海晏窮寥廓梨園弟子傳法曲張果先生進仙藥玉座凄涼遊帝京悲翁回首望承明雲韶九奏杳然逺唯有五陵松柏聲洞庭秋日云青草湖邊日影低黃茅嶂裏鷓鴣啼丈夫飄蕩今如此一曲狂歌楚水西薛業洪州客舍寄柳博士芳詩云去年燕巢主人屋今年花發路傍枝年年為客不到舍舊國存亡那得知胡塵一起天下亂何處春風無别離晚秋贈張折衝詩云都尉今無事時清但閉關夜霜戎馬瘦秋草射雕間位以穿楊得名因折桂還馮唐真不遇嘆息鬢毛班獨孤常州送薛處士業遊廬山序云薛侯敦於詩困於學敏於行時然後言言而寡尤口弗言祿祿亦不及識其真者以為永嘆而薛侯居之淡如君子哉若人也拂纓上之塵西遊廬山趙輔闕驊王侍御定張評事有略各以文為贈余亦持片言用代踈麻瑶華之贈劉希戩彈琴詩云碧山本岑寂素琴何清幽彈為風入松崕谷颯以秋庭鶴舞白雪泉魚躍洪流余欲娛世人明月難暗投感歎未終曲淚下不可收嗚呼鐘子期零落歸山丘死而若有知魂兮從我遊朱綘春女怨云獨坐紗窗剌繡遲紫荆枝上囀黃鸝欲知無限傷春意併在停針不語時顧陶取此書為類選元凛九日對酒云嘉辰復遇登高臺良朋笑語傾金罍煙攤秋色正堪玩風惹菊香無限來未保亂離今日後且謀歡恰玉山頺誰知靖節當時事空學狂歌倒戴回中秋夜不見月云蟾輪何事色全微賺得佳人出繡幃四野霧凝空寂寞九霄雲鎖絶光輝吟詩得句翻停筆玩處臨樽却掩扉公子倚欄猶悵望懶將紅燭草堂歸楊志堅顔魯公為臨川內史邑有楊志堅者嗜學而貧妻厭之一日告離志堅以詩送之曰平生志業在琴詩頭上如今有二絲漁父尚知溪谷暗山妻不信出身遲荆叉任意撩新鬢明鏡從他别畫眉今日便同行路客相逢即是下山時持詩詣州請公牒求别醮顔公案其妻曰王歡之廪既虛豈遵黃卷朱叟之妻必去寧見錦衣汚辱鄉閭敗傷風俗若無褒貶僥幸者多遂箠之後無棄其夫者劉方平秋夜泛舟云林塘夜泛舟蟲響荻颼颼萬影皆因月千聲各為秋歲華空復晚鄉思不堪愁西北浮雲外伊川何處流皇甫冉寄方平詩云十年不出蹊林中一朝結束甘從戎嚴子持竿心寂歷寥落荒籬遮舊宅又曰與君從來同語默豈是悠悠但相識天伴三秋空復情袖中一字無由得方平春怨云紗窗落日漸黃昏金屋無人見淚痕寂寞空庭春又晚梨花滿地不開門方平泛舟思鄉云西北浮雲外伊川何處流蓋洛中人也皇甫冉之京留别方平詩云遲遲越二陵回首但蒼茫喬木清宿雨故關愁夕陽冉嘗為河南從事自是遷左拾遺留别於河南也方平與元魯山善不仕蓋邢襄公政會之後也蕭潁士云山東茂異有河南劉方平李揆揆與饒州剌史封漸仲容叔霽連句揆筆力遒媚有免相踐蓬閣卧痾淮海濵偶逢潘川守宛是潘陽親又云共仰新侯伯同瞻舊宰臣又云鄉路轅思北家林巷喜南幾雜志出江鄰前定録云有巫者告揆曰公當為拾遺遺以一書緘之云得此官即開後明皇召試紫絲盛露囊賦果得拾遺啓緘即此賦也􅊨􅊨戎昱􅊨憲宗朝北狄頻寇邊大臣奏議古者和親有五利而無千金之費帝曰比聞有士子能為詩而姓名稍僻是誰宰相對以包子虛冷朝陽皆非也帝遂吟曰山上青松陌上塵雲泥豈合得相親世路盡嫌良馬瘦唯君豈合卧龍貧千金未必能移性一諾從來許殺身莫道書生無感激寸心還是報恩人侍臣對曰此是戎昱詩也京兆尹李鑾擬以女嫁昱令其攺姓昱固辭焉帝恱曰朕又記得詠史一篇云漢家青史內計拙是和親社稷因明主安危託婦人豈能將玉貌便欲靜胡塵地下千年骨誰為輔佐臣帝笑曰魏綘之功何其懦也大臣遂息和戎之論矣塞上曲云樓上畫角哀即知兵心苦試問左右人無言淚如雨何意值明時終年事鼙鼓長安秋夕云八月更漏長愁人起常早閉門寂無事滿地生秋草昨霄西窗夢先入荆門道逺客歸去來在家貧亦好昱在零陵于襄陽聞有妓善歌取之昱以詩遣行曰寶鈿香娥翡翠裙粧成掩泣欲行雲殷勤好取襄王意莫向陽臺夢使君于遂遣還昱登進士第衛伯玉鎮荆南辟為從事後為辰虔二州剌史昱贈别張駙馬云上元年中長安陌見君朝下欲歸宅飛龍騎馬三十匹玉勒雕鞍照𥘉日數里衣香遙撲人長衢雨歇無纎塵從奴斜抱勑賜錦雙雙蹙出金麒麟天子愛壻皇后弟獨步明時負權勢一身扈蹕承殊澤甲第朱門聳高戟鳯凰樓上伴吹簫鸚鵡杯中醉留客泰去否來何足論宫中晏駕人事翻一朝負譴辭丹闕五年待罪湘江源冠冕凄涼幾遷攺眼看桑田變成海華堂金屋别賜人細眼黃頭揔何在清宫相見寸心悲懶欲今時問昔時看君風骨殊未歇不用愁來雙淚垂延和二郡公主代宗立廢后肅宗張皇后弟清潛尚太寧潛皆放流為庶人清寶應中過滑州洛陽後同王季犮作苦哉行詩云妾家清河邊七葉承貂蟬身為最小女偏得渾家憐親戚不相識幽閨十五年有時最逺出祗到中門前年狂胡來懼死翻生全今秋官軍至豈意遭戈鋋胸奴為先鋒長鼻黃髮拳彎弓獵生人百步牛羊羶脫身落虎口不及歸黃泉苦哉難重陳暗哭蒼蒼天採蓮曲云雖聽採蓮曲詎識採蓮心漾楫愛花逺回船愁浪深煙生極浦色日落半汪隂同侣憐波靜看粧墮玉簮涔陽女兒花滿頭毿毿同泛朩蘭舟秋風日暮南湖裏爭唱菱歌不肯休卷末
