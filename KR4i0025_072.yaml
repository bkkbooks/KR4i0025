front:
  text: 唐詩紀事卷第七十二
  hash: sha256:df60fbbd15d12413ae235610f1afa840308e2f728a7c48d99e654add3f94d182
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_072-1a}
body:
  text: 僧法宣僧中窹僧子蘭僧靈徹僧靈一僧清江僧廣宣僧法宣和趙郡王觀妓應教詩云桂山留上客蘭室命淫妖城中畫眉黛宫內束纎腰舞袖風前舉歌聲扇後嬌周郎不相顧今日管絃調觀間人法宣正中窹儀鳯中青城翠圍山下有王仙柯得道蜀州僧中窹以詩贈之云瞻思不及望仙兄早晚升霞入太清手種一株松未老爐燒九轉藥新成心中已得黃庭術頭上應無白髮生異日却歸華表柱得教凡俗並聞名自是復隱後山更不復遇子蘭飲馬長城窟詩云遊客長城下飲馬長城窟馬嘶聞水腥為浸征人骨豈不是流泉終不成潺湲洗盡骨上土不洗骨中冤骨若不流水四海有還魂空留嗚咽聲聲中疑是言秋日思舊山云六咸言上國繁華豈謂帝城羈旅十點五點殘螢千聲萬聲秋雨白云江上故鄉月下風前吟處欲去不去遲遲未展平生所佇襄陽曲云為憶南移人移家大堤住千帆萬帆來過盡門前去太平里尋兵部裴郎中云不語凄涼無限情荒階行盡又重行昔年住此人何在空見槐花秋草生贈行腳僧云世界曾行遍全無行可修炎涼三衲共生死一身休片斷雲隨體稀踈雪滿頭此門無所著不肯暫淹留貪誡云多求待心足未足旋傾覆明知貪者心求榮不求辱觀棋云拂局盡涓時能因長路點頭初得計格手遲待無疑寂默親遺景凝神入過思共藏多少意不語兩相知僧靈徹生於會稽本湯氏字澄源與吳興詩僧皎然逰然皎薦之包佶李紓以是上人之名由二公而揚正元中逰京師緇流嫉之造飛語激動中貴人浸誣得罪徙汀州後歸會稽元和十一年終于宣州劉夢得曰詩僧多出江右靈一導其源護國襲之清江揚其波法振沿之如么絃孤韻瞥入人耳非大音之樂獨吳興晝公能備衆體徹公承之至如芙蓉園新寺詩曰經來白馬寺僧到赤烏年謫汀州云青蠅為吊客黃犬寄家書可謂入作者閫域豈獨雄於詩僧間耶初到汀洲云初放到滄洲前心詎解愁舊交容不拜臨老學梳頭禪室白雲去故山明月秋幾年猶在此北戶水南流元日觀郭將軍早朝云欲曙九衢人更多千條香燭照銀河今朝始見金吾貴連馬縱橫避玉珂九日和于使君思上京親故云清晨有髙會賔從出東方楚俗風煙古汀洲草木涼山清來逺思菊意在重陽心憶華池上從容鴛鷺行皎然亦賦云霽景滿水國我公望江城碧山與黃花爛熳多秋情搖落見松柏歲寒比忠貞歡娛在鴻都是日思朝英栁宗元韓漳州書報徹上人亡因寄二絶云早歲京華聽越吟聞君江海分逾深他時若寫蘭亭會莫畫髙僧支道林又云頻把瓊書出袖中獨吟遺句立秋風桂江日夜流千里揮泊何時到浙東又聞徹上人亡寄侍郎楊文云東越廣僧還姓湯幾時瓊佩觸鳴璫空花一散不知處誰採金英與侍郎權載之送上人廬山回歸沃州序云吳興長老晝公綴六義之清英首冠方外入其室者有沃州徹上人心冥空而無迹寄文字故語甚夷易如不出常境而諸生思慮終不可至其變也如風松柏韻氷玉相扣層峰千仞下有金碧聳鄙夫之目如不敢視三復則淡然天和晦於其中故暏其容覽其詞者知其心不待境靜而靜况會稽山水自古絶勝東晉逸民多遺身世於此夏五月上人自爐峰言旋復于是邦豫知夫拂方袍坐輕舟泝沿鏡中靜得佳句然後深入空寂萬慮灑然則嚮之境物又其稊稗也鄙人方景行企尚之不暇惡敢以離羣為嘆徹與劉夢得友善夢得送僧仲端東遊末句呈徹云一旦楊眉望沃州自言王謝許同遊憑將雜意三千首寄與江南湯惠休權載之酬以詩代書見寄云蓮花出水地無塵中有南宗了義人已取貝多翻半字還將陽焰諭三身碧雲飛處詩偏麗白月圓時性本真更喜開緘銷熱惱西方社裏舊相親載之月夜宿徹上人房云此身會逐白雲去未洗塵纓還自傷今夜幸逢清淨境滿庭秋月對支郎劉長卿送師云蒼蒼竹林寺杳杳鍾聲晚荷笠帶殘陽青山獨歸逺長卿酬師相招云石澗泉聲久不聞獨臨長路雪紛紛如今漸欲生黃髮願脫頭冠與白雲徹於東林寺寄陳丘二侍郎云年老心間無外事麻衣坐草亦容身相逢盡道休官好林下何曽見一人張祐題徹上人舊房云寂寞空門支道林滿堂新板舊知音秋風吹葉古廊下一半繩床燈影深祐又寄師詩云老僧何處寺秋夢繞江濵獨樹月中鶴孤舟雲外人榮華長指幻衰病久觀身呂溫在道州戲贈云僧家亦有芳春興自是禪心無滯境君看池水湛然時何曽不受花枝影僧靈一新泉詩云泉源新湧出洞徹映纎雲稍落芙蓉沼初淹苔蘚文了將空性淨素與衆流分若對青霄月冷然夢裏聞劉長卿和云東林一泉出復與逺公期石淺寒流處山空夜落時夢間聞細響慮淡向清漪動靜皆無意唯應道者知與亢居士青山潭飲茶云野泉煙火白雲間坐飲香茶愛此山岩下維舟不忍去青溪流水暮潺潺送陳允初居麻源云欲向麻源隱能尋謝客縱空山幾千里幽谷第三重嵓宇寧須葺荷衣不待縫因君見往事為我謝喬松送人得蕩子歸倡婦云垂涕憑回信為語栁園人情知獨難守又是一陽春髙仲武云自齊梁已來道人為文者多矣少有入其流一公乃能尅意精妙與士大夫更唱遞和不其偉歟泉湧階前地雲生戶外峰則道猷寶月曽何及此靈一大曆正元間生也酬皇甫冉西陵見寄云西陵潮信滿島嶼沒中流越客依風水相思南渡頭寒光生極浦落日映滄洲何事揚帆去空驚海上鷗溪行即事云近夜山更碧入林溪轉清不知伏牛地潭洞何縱橫曲岸煙初合平湖月未生孤舟屢失道但聽秋泉聲重還冝豐寺云載過招隱寺重會息心期樵客問歸日山僧寄别詩野雲隂逺甸秋水漲前陂勿謂頻來此吾今不好竒姚合取為極玄集酬皇甫冉以下三章酬皇甫冉將赴無錫雲門寄别云湖南通古寺來往意無涯欲識雲門路千峰向若耶春山子猷宅古木謝敷家自是長俱隱那云相去賖靜林精舍梁武隱所有鍾磬古物云靜林溪路逺蕭帝有遺蹤水擊羅浮磬山鳴于闐鐘煙傳三世火樹老萬株松無復煙霞色空聞昔卧龍雨後尋天目山問元駱二公溪路云昨夜雲生天目東春山一雨幾回風林花併逐溪流下欲上龍門通不通取為中興間氣集無錫下三章髙仲武自大林與韓明府歸郭中精舍云野客中舟楫相携復一歸孤煙生暮景逺岫帶春暉不道還山是誰云向郭非禪門有通隱喧寂共忘機陳羽送靈一上人云十年勞逺别一笑喜相逢又上青山去青山千萬重岩維哭靈一上人云一公何不住空有逺公名共説岑山路今時不可行舊房松更老新塔草初生經論傳緇侶文章遍墨卿禪林枝幹拆法宇棟梁傾誰復修僧史知應傳已成靈一宿天柱觀詩云石室初投宿仙翁幸見容花源隨水逺洞府過山逢泉湧階前地雲生戶外峰中霄自入定非是欲降龍皇甫冉小江懷靈一上人云江上年年春草津頭日日人行借問山隂逺近猶聞薄暮鍾聲靈一自青山詣於潛道中呈元八居士云苕水灘行淺潛州路漸深參差逺邊色迢遞野人心凍澗氷難釋秋山日易隂不知天目下何處訪雲林錢起寄靈一上人初歸雲門寺云寒山白雲裏法侣自招携竹徑通城下松門隔水西同期沃州去不作武陵迷倣佛心知處髙峰是會稽僧清江夕次襄邑云何處成吾道經年逺路中客心猶向北河水自歸東古戍鳴寒角踈林振夕風輕舟唯有月那與故人同病起云身世足堪悲空房卧病時卷簾槐雨滴掃室竹隂移已覺生如夢那堪夀不知未能通法性詎可見支離宿嚴維宅簡章八元詩云佳期曽不逺甲第即南鄰惠愛遍相及經過豈厭頻秋光林葉動夕霽月華新莫話羈栖事平原是主人贈淮西賈兵馬使云破虜功成百戰場天書親拜漢中郎應門旌斾春風起對客絃歌白日長階下鬪雞花乍拆營南試馬栁初長由來楚蜀多同調感激逢君共異鄉九日菊花韻應制云可訝東籬菊能知節候芳細枝青玉潤繁蕊碎金香逸氣浮朝露濃滋帶夜霜泛杯傳夀酒應共樂時康僧廣宣李益重陽夜集蘭陵居與宣供奉聮句益云蟋蟀催寒服茱萸滴露芳酒巡明刻燭籬菊暗尋芳宣云新月知秋露繁星混夜霜登髙今夕事九九是天長九月十五日夜宿鄭尚書絪東亭望月寄杜給事云霜天晴夜宿東齋松竹交隂愜素懷逈出風塵心得地可憐三五月當階清光滿院思情見寒色臨門笑語諧霄漢路殊從道合往來人事不相乖鄭絪奉酬宣上人九月十五日東亭望月見贈因懷紫閣舊遊云中年偶逐鴛鸞侣弱歲多從麋鹿羣紫閣道流今不見紅樓禪客早曽聞松齋月朗星初散苔砌霜繁夜欲分一覽綵箋佳句滿何人更詠惠休文中秋夜獨遊安國寺山亭院步月李益遲明至寺中求與聮句宣云九重城接天花界三五秋分一夜風行聽漏聲雲散後遙聞天雨月明中益云含涼閣近通仙掖承露盤髙出上宫誰問獨愁圍外理清談不與比霄同􅊨李益與師携癭樽歸杏園聫句云千畦抱甕園一酌癭樽酒唯有沃州僧時過杏溪叟益李追歡君適性獨飲我空口儒釋事雖殊文章意多偶宣廣王起於會昌中放第二榜宣以侍寄賀曰從辭鳯閣掌絲綸便向青雲領貢賔再闢文章無枉路兩開金榜絶冤人眼看龍化門前水手放鶯飛谷口春明白定歸台席去鶺鴒原上共陶鈞起和云延英面奉入春闈亦選功夫亦選竒在冶只求金不耗用心空學稱無私龍門變化人皆望鶯谷飛鳴自有時獨喜向公誰是證彌天上士與新詩劉夢得和云禮闈新榜動長安九陌人人走馬看一日聲名遍天下滿城桃李屬春官自吟白雪銓辭賦指示青雲借羽翰借問至公誰印可支郎天眼定中觀元微之和王侍郎酬宣上人詩云渥窪徒自有權竒伯樂書名世始知競走墻前希得雋髙懸日下表無私都中紙貴流傳後海外金填姓字時珍重劉繇因首薦同判解頭及第進士李景述以為君送和碧雲詩宣會昌間有詩名與劉夢得最善宣寄在蜀與韋令公唱和詩劉答云碧雲佳句久傳芳曽向都城住草堂振錫長過長者宅披文猶帶令公香一時風景添詩思八部人天入道場若許相期同結舍吾家本自近柴桑退之有廣宣上人頻見過詩云三百六旬長擾擾不衝風雨即塵埃久慙朝士無禆補空愧髙僧數往來學道同年何所得吟詩竟日未能回天寒古寺遊人少紅葉窗前有幾堆樂天别宣上人云上人處世界清淨何所似侣彼白蓮花在水不著水性真悟泡幻行潔離塵澤修道未幾時身心俱到此嗟豫牽世網不得長休止離念與碧雲秋來朝夕起宣以應制詩示樂天時詔許上人居安國寺紅樓以詩供奉樂天有詩云道林談論惠休詩一到人天便作師香積筵承紫泥詔昭陽歌唱碧雲詞紅樓許住請聲平銀鑰翠輦陪行踏玉墀惆悵甘泉曽侍從與君前後不同時李益贈宣大師云一國沙彌獨解詩人人道勝惠休師先皇詔下徵還日今上龍飛入內時看月憶來松寺宿尋花思作杏溪期論因佛地求心地祇説常吟是住持唐詩紀事卷第七十二
