front:
  text: 唐詩紀事卷第五十五
  hash: sha256:62694d5d56de65b33cb3566fa0d5ae5ffab9a7dd5a140dc6bc3267593d1598ca
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_055-1a}
body:
  text: 周墀王起盧肇丁稜姚鵠高退之孟球劉耕裴翻樊􅋮崔軒蒯希逸林滋李宣古黃頗張道符丘上卿石貫李潛孟寧唐思言左牢金厚載王甚荑周墀武宗會昌三年王起僕射再主文柄起自長慶至此凡三領貢籍墀時剌華州以詩寄賀云文場三化魯儒生三十餘年振重名曾忝木雞誇羽翼又陪金馬入蓬瀛常陪僕射守職內庭墀𥘉年木雞賦及第雖欣月桂居先折更羡春蘭最後榮欲到龍門看風雨關防不許暫離營者和於後列姓名酬李常侍立秋日奉詔祭嶽見寄云秋祠靈嶽奉樽罍風過深林古柏開蓮掌月高圭幣列金天雨露鬼神陪質明三獻雖終禮祈壽千年别上柸豈是瑣才能祀事洪農太守主張來亦曽知華州常侍李景遜也墀字德升汝南人長史學屬辭高古武宗時剌華州召為兵部侍郎遂為宰相以議河湟事不合指罷鄭皓言於帝曰世謂墀以直言相亦以直言免帝悟加拜右僕射王起和周侍郎見寄云貢院離來二十霜誰知更忝主文場楊葉縱能穿舊的桂枝何必愛新香九重每憶同仙禁六義初吟得夜光莫道相知不相見蓮峰之下欲徴黃張籍喜起放榜詩云東風時節近清明車馬爭來滿禁城二十八人𥘉上榜百千萬里盡傳名誰家不惜花園看在處多將酒器行共賀春司能鑒識今年應合有分卿酒器錢絹實之逢花即飲勑下後人置皮袋例以圖章太和中文宗重之曽為詩寫于太子之笏武宗嘗以乃方二字問之起曰群書未之見也周穆王有二字百儒但言古馬名于今未詳臣所不識者惟此八駿圖中三五字而巳帝曰知卿夙學偶相試示起字舉之元和末為中書舍人穆宗時錢徽坐貢舉失實貶詔起覆核起建言以所試送宰相閲可否然後付有司議者謂起失職李訓為相起門生也引與共政文宗上文好古學時鄭覃以經術進起以該博顯武宗時自東都召為尚書判太常卿帝患選士不得才特命起典貢舉凡四舉士皆知名者人伏其鑒慈恩寺題名云進士題名自神龍之後過關宴後率皆期集於慈恩塔下題名故貞元中劉太真侍郎試慈恩寺望杏園花發詩會昌三年贊皇公為上相其年十一月十九日勑諌議大夫陳商守本官權知貢舉後因奏對不稱旨十二月十七日宰臣遂奏依前命左僕射兼太常卿王起主文二十二日中書覆奏奉宣旨不欲令及第進士呼有司為座主趨附其門兼題名局席等條疏進來者伏以國家設文學之科求貞正之士所宜行崇風俗義本君親然後升於朝廷必為國器豈可懷賞技之私惠忘教化之根源自謂門生遂成膠固所以時風寢壞臣節何施樹黨背公靡不由此臣等啇量今日卩後進士及第任一度參見有司向後不得聚集參謁及於有司宅置宴其曲江大會朝官及題名局席並望勒停緣初獲美名實皆少雋既遇春節難阻良遊三五人自為宴樂並無所禁唯不得聚集同年進士廣為宴會仍委御史臺察訪聞奏謹具如前奉勑宣依於是向之題名各盡削去蓋贊皇公不由科第故設法以排之洎公失意悉復舊態李德𥙿為祕省校書有雨中自祕省歸訪王御史起時集賢直學士為監察御史知早入朝便入集賢不遇詩起和之序云起頃任集賢校書及升桓堂又與祕閣相對今直書殿有張學士嘗忝同幕而與祕書稍逺故瞻望之詞多詩云台庭才子來欵扉典校𥘉從天祿歸巳慙陋巷回玉趾仍聞細雨占綵衣詰朝始趍鳯闕去此日遂歎雞黍違憶昨謬官在烏府喜君對門討魚魯直廬相望夜每闌高閣遙臨月時吐昔聞三入承明廬今來重入中祕書校文復忝丞相屬博物更與張侯居新冠峨峨不變鐡舊泉脈脈猶在渠忽在情人吐芳訊臨風不羡潘錦舒憶見青天霞未卷吟玩瑶華不知晚自憐超足風引舟如何漸與蓬山逺樂天惜玉蘂花懷集賢王校書云芳意將闌風又吹白雲離葉雪辭枝集賢讎校無間日落盡瑶花君不知盧肇嵩高降德為時生洪筆三題造化名鳳詔佇歸專北極驪珠搜得盡東瀛褒衣巳換金章貴禁掖曾隨玉樹榮明日定知同相印書襟新列柳間營甚夷各和自肇至王章多用起韻主司王起一開成初就江西解試為試官末送肇謝曰巨鼇屓贔首冠蓬山試官曰某恨人數擠排深慙名第奉浼何云首冠肇曰頑石處上巨鼇戴之豈非冠耶張祐於甘露寺觀肇詩曰不謂三吳經此詩也祐曰日月光先到山河勢盡來肇曰地從京口斷人自海門回因而仰伏肇初計偕至襄陽竒章公方有真珠之惑肇賦詩曰神女初離碧玉階彤雲猶擁牡丹鞋知道相公憐玉腕強將纎手整金叉肇字子發袁州人也初登第或問所由來曰肇袁民也或曰袁州出舉人耶肇曰袁州出舉人亦猶沅江出龜甲九肋者蓋稀矣肇筮仕之初為鄂嶽盧啇從事其後江陵節度裴休太原節度盧簡求奏為門吏後除著作郎遷倉部外郎克集賢院直學士咸通中出知歙州肇競渡詩云石溪久住思端午館驛樓前看發機鞞鼓動時雷隱隱獸頭凌處雪微微衝波突出人齊噉躍浪爭先鳥退飛向道是龍剛不信果然奪得錦標歸咸通初恩除歙州途中寄座主王侍郎詩云忽忝專城奉六條自憐出谷屢遷喬驅車雖覺還家近捧日惟愁去國遙朱戶昨經新棨戟風帆常覺戀簞瓢江天夜夜知消息長見台星在碧霄丁稜公心獨立副天心三轄春闈冠古今蘭署門生皆入室蓮峰太守别知音同升翰苑時名重遍歷朝端主意深新有受恩江海客坐聽朝夕繼為霖李德𥙿嘗左宦冝春盧肇以文見知既拜相舊例放榜先呈宰相王起問德𥙿所欲答曰何問為如盧肇丁稜姚鵠豈可以不與及第起遂依次放之唐放榜訖謁宰相即榜元致詞肇以故不至稜口吃而形陋俯曰稜等登鞠躬赬汗卒不能致後語左右皆笑或曰君善箏耶稜猶不悟也稜字子威姚鵠三年竭力向春闈塞斷浮花衆路岐盛選棟梁稱昔日平均雨露及明時登龍舊美無斜徑折桂新榮盡直枝莫道只陪金馬貴相期更在鳳凰池鵠尋趙尊師不遇詩云羽客朝元晝掩扉林中一徑霧中微松隂繞院鶴相對山色滿樓人未歸盡日獨思風馭返寥天幾望野雲飛慿高目斷無消息自醉自吟愁落輝鵠字居雲高退之昔年桃李巳滋榮今日蘭蓀又發生葑菲采時皆有道權衡分處且無情叨陪鴛鷺朝天客共作門闌出谷鶯何事感恩偏覺重忽聞金榜扣柴荆微劣始不退之自顧進士則遣人齎榜扣關相報方知忝矣敢有叨竊之望䇿試之後遂歸盩屋山居不期一旦退之字遵聖孟球富年門下化龍成今日餘波進後生仙籍共知推麗則禁垣同得薦嘉名桃蹊早茂誇新萼菊圃𥘉開耀晚英誰料羽毛方出谷許教齊和九臯鳴球字庭玉劉耕孔門頻建鑄顔功紫綬青襟感激同一簣勤勞成太華三年恩德華維嵩楊隨前輩穿皆中桂許平人折欲空慙和周郎應見顧感知大造竟無窮裴翻常將公道選群生猶𬒳春闈屈重名文柄久持殊歲紀恩門三啓動寰􅌡雲霄幸接鴛鸞盛變化欣同草木榮乍得陽和如細桞參荖長近亞夫營翻字雲章樊􅋮滿朝簮髮半門生又見新書甲乙名孤進自今開道路至公依舊振寰瀛雲飛太華清詞著花發長安白屋榮忝受恩光同上客惟將報德是經營􅋮字元龍崔軒滿朝朱紫半門生新榜勞人又得名國器曰知收片玉朝宗轉覺集登􅘵同升翰苑三年美繼入花源九族榮共仰蓮峰聽雪唱欲賡仙曲意怔營軒字鳴嵐蒯希逸一振聲華入紫微三開秦鏡照春闈龍門曰列金章貴鶯谷新遷碧落飛恩感風雷皆變化詩裁錦繡借光輝誰知散質多榮忝鴛鷺清塵接布衣芳草復芳草斷腸還斷腸自然堪下淚何必更斜陽楚峰千萬里燕鴻三兩行有家歸不得况舉别君觴牡牧之池州送希逸詩也武幹者事蒯希逸十餘歲希逸擢第幹辭以親在求去希逸以詩送之略曰山險不曽離馬後酒醒長見在床前士人皆有繼和希逸字大隱希逸詩蟾蜍醉裏破蛺蝶夢中殘牛相在揚州嘗稱之林滋龍門一變荷生成况是三傳不朽名美譽早聞喧北闕頽波今見走東􅌡鴛行既接參差影雞樹仍同次第榮從此青襟與朱紫升堂侍宴更何營望九華山詩云兹山突出何怪竒上有萬狀無凡姿大者嶙峋若奔兕小者􅐑嵬如嬰兒玉柱金莖相拄枝干空榆碧勢參差稀中始訝巨靈擘陡處乍驚愚叟移蘿煙石月相蔽虧天風裊裊猿咿咿龍潭萬古噴飛溜虎冗幾人能得窺吁豫比少愛靈境到此始覺魂神馳如何獨得百丈索直上高峰拋俗羈滋字後象李宣古恩光忽逺曉春生金榜前頭忝姓名三感至公禆造化重揚文德振寰􅌡佇為霖雨曾相賀半在雲霄覺更榮何處新詩添照灼碧蓮峰下桞間營宣古嘗賦寒食日亥時云人定朱門尚未開𥘉星粲粲照人回此時寒食無燈燭花桞蒼蒼月欲來杜司空悰自忠武軍節度使出鎮澧陽宣古數陪遊宴乘醉慢侮悰欲辱之長林公主曰豈有飲而舉人細過耶謂宣古請為詩冀彌縫也宣古得韻立成詩曰紅燈初上月輪高照見堂前萬朵桃觱栗調清銀字管瑟琶聲亮𬗋檀槽能歌姹女顔如玉解引蕭郎眼似刀爭奈夜深拋耍令舞來挼去使人勞宣古字垂後冉冉池上煙盈盈池上栁生貴非道傍不斷行人首句翠蓋不西來池上天池歇句右張為取作主客圖黃頗二十二年文教至三千上士滿皇州獨陪宣父蓬􅌡奏方接顔生魯衛遊多羡龍門齊變化屢看雞樹第名流升堂何處最榮美朱紫環樽幾處酬頗為失第後久方第托言曰黃頗以洪奧文章蹉跎者一十三載劉纂以平漫子弟而折丹桂由斯言之可謂命通性能豈曰性能命通者歟韓愈自潮州量移宜春郡頗學愈為文亦振大名頗嘗觀盧肇為碑版則唾之而去頗宜春人與肇同鄉頗富而肇貧同日遵路赴舉郡牧餞頗離亭肇駐蹇十里以俟明年肇以第一名還袁因競渡即度賦詩云向道是龍剛不信果然奪得錦標歸頗字無頗張道符三開文鏡繼芳聲暗暗雲霄接去程會厭洪波先得路早升清禁共垂名蓮峰對處朱輪貴金榜傳時玉韻成更許下才聽白雪一枝今過郤詵榮道符字夢鍚丘上卿常將公道選諸生不是鴛鴻不得名天上宴回聮步武禁中麻出滿寰􅌡簮𥚑盡過前賢貴門館仍叨舊學榮看著鳯池相繼入都堂那肯滯關營上卿字陪之石貫重德由來為國生五朝清顯冠公卿風波久佇濟川楫羽翼三遷出谷鶯絳帳青矜同日貴春蘭秋菊異時榮孔門弟子皆賢哲誰料窮儒忝一名貫字惣之李潛文學宗師心稱平無私三用佐貞明恩波舊是仙舟客德字新添月桂名蘭署崇資金重蓮高唱玊音清羽毛方荷生成力難繼鸞凰上漢聲濳字德隱宜春人孟寧科文又主守𥘉時光顯門生濟會期美擅東堂登甲乙榮同內署待恩私群鶯共喜新遷不雙鳳皆當即入池别有陪深知感士曾經兩度得芳枝寧字處中長慶三年王起放及第為時相所退是年大和主和戎至會昌三年起以左揆再知貢舉寧龍鍾就試成名是歲石雄入塞公主自蕃還京唐思言儒雅皆傳德教行幾崇浮浴贊文明龍門昔上波濤逺禁署同登渥澤榮虛散謬當陪𣏌梓後先寧異感生成時方側席徴賢急况説歌謡近帝京思言字子文左牢聖乾文德最稱賢自古儒生少比肩再啓龍門將二紀兩司鶯谷巳三年蓬山皆美成榮貴金榜誰知忝後先正是感恩流涕日但思旌斾碧峰前牢字德膠金厚載長慶曾收間世英果居臺閣冠公卿天書再受恩波逺金榜三開日月明巳見差肩趍翰苑更期連步掌台衡小儒謬迹雲霄路心仰蓮峰望太清厚載字化光王甚夷春闈帝念主生成長慶公聞兩歲名有詔赤心分雨露無私和氣浹寰􅌡龍門乍出難勝幸鴛侶先行是最榮遙仰高峰看白雪多慙屬和意屏營甚夷字無黨唐詩紀事卷第五十五
