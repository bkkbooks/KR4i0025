  text: 唐詩紀事卷第二
  hash: sha256:31c16e8baa621347feb70955beadedb70f8d571b7a3c70a2b706540db424aad1
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_002-1a}
body:
  text: 眀皇德宗文宗宣宗昭宗軒遊宫十五夜云行邁離秦國廵方赴洛師路逢三五夜春色暗中期關外長河轉宫中淑氣遲歌鐘對明月不减舊遊時初入秦川路逢寒食詩云洛川芳樹映天津㶚㟁垂楊窣地新冝爲經過行處樂不知虚度兩京春去年有閏今春早曙色和風着花草可憐寒食與清明光輝併在長安道自從關路入秦川爭到何人不戯鞭公子途中方蹴踘佳人馬上戯鞦韆渭水長橋今欲渡怱怱漸見新豐樹遠㸔驪岫入雲霄預想陽起池煙霧煙霧氛氲水殿開蹔拂香輪歸去來今歲清明行巳晚明年寒食更相陪早渡蒲闗云鐘皷嚴更曙山河野望通鳴鸞下蒲坂飛斾入秦中地險闗逾壯天平鎮尚雄春深津樹合月落戍樓空馬色分朝景鷄聲逐曉風所希常道㤗非復俟繻同帝幸蜀西至劒門題詩曰劒閣撗雲峻鑾輿出狩回翠屏千仞合丹嶂五丁開灌木縈旗轉仙雲拂馬來乗時方在德嗟爾勒銘材至德二年普安郡守賈深勒石開元間河南叅軍鄭銑朱陽丞郭仙舟投匭獻詩敕曰觀其文理乃崇道法至於今時不切事情冝各從所好並罷官度爲道士裴寛除太原尹帝賦詩餞之曰德比岱雲布心如晉水清早登太行山中言志云清蹕渡河陽凝笳上太行火龍明鳥道鐡騎遶羊膓白露霾隂壑丹霞助曉灮澗泉含宿凍山草帯餘霜野老茅爲室樵人薜作裳宣風問耆艾敦俗勸耕桑凉德慙先哲徽猷慕昔皇不因今展義何必冐垂裳帝廵省塗次上黨舊宫賦詩序曰朕昔在初九佐貳此州未遇扶揺之力空俟海沂之詠洎大横入兆出處斯易一揮寳劎遽履瑶圖承曆數而順謳謡着天衣而御區夏嗟乎向時沈黙駕四馬而朝京師今日逍遥乗六龍而問風俗爰因廵省途次舊居山川宛然人事無間忽其昇華周遊館宇觸目依然雖迹異漢皇而地如豐邑擊筑慷慨酌杯留連空想大風題兹短什詩云三千初擊浪九萬欲搏空天地猶驚否隂陽始遇䝉存貞斯歷試佐貳佇昭融多謝時康理良慙寳劒功長懐問鼎氣夙負㧞山雄不學劉崐舞先歌漢祖風英髦既包括豪傑自牢籠人事一朝異謳謡四海同如何昔朱邸今此作離宫鴈沼澄瀾翠猿嵓落照紅小山秋桂馥長坂舊蘭藂即是淹留處乗歡樂未窮荅張説出雀䑕谷云雷出膺乾象風行順國人川途猶在晉車馬漸歸秦背陜闗山險横汾皷吹頻草依陽谷變花待北嵓春聞有鵷鸞客清詞雅調新求音思欲報心迹竟難陳送張說廵邊云端拱復垂裳長懐御遠方股肱申教義戈劒静要荒命將綏邊服雄圖出廟堂三台入武帳八座起文昌寳胄匡韓主華宗輔漢王茂先慙博物平子謝文章盡節恢時佐輸誠禦㓂場三軍臨朔野駟馬即戎行皷吹威夷狄旌軒溢洛陽雲臺先著美今日更貽芳送張説集賢上學士云廣學開書殿崇儒引席珍集賢招衮職論道命台臣禮樂㳂今古文章革舊新獻酬罇俎列賔主位班陳節變雲初夏時移氣尚春所希光史䇿千載仰兹晨左丞相説右丞相璟太子少傳乾曜同上官命讌東堂賜詩云赤帝收三傑黄軒舉二臣由來丞相重分掌國之鈞我有握中璧䨇飛席上珍子房推要道仲子訝風神復輟台衡老將爲調䕶人鵷鸞同拜日車騎擁行塵樂聚南宫宴觴連北斗醇俾子成百揆垂拱問彛倫同二相已下群臣宴樂遊園賜詩云撰日嵓廊暖需雲宴樂初萬方朝玉帛千品㑹簮𥚑地入南山遠城分北斗餘林塘垂柳宻原隰野花踈帟幕㸔逾暗歌鐘聽自虛興闌歸騎轉還奏弼違書二相謂張宋也千秋莭賜群臣鏡詩云臺上氷花澈䆫中月影臨更衘長壽帯留意感人深是日賜宴詩云月衘花綬鏡露綴綵絲囊張説應制云珠囊含瑞露金鏡抱僊輪開元十六年帝自擇廷臣爲諸州刺史許景先治虢州源灮裕鄭州冦泚宋州鄭温琦邠州袁仁恭杭州崔志廉襄州李昇期邢州鄭放定州蔣挺湖州裴觀滄州崔誠遂州凡十一人行詔宰相諸王御史以上祖道洛濵盛具奏太常樂帛舫水嬉命高力士賜詩令題座右帝親書且給筆𥿄令自賦賚絹三千遣之帝詩云眷言思共理鑑寢想惟良猗歟此推擇聲績著周行賢能既俟進黎獻實佇康視人當如子愛人亦如傷講學試誦論阡陌勸耕桑虚譽不可飾清知不可忘求名迹易見安直德自彰獄訟必以情教民貴有常恤惸且存老撫弱復綏强勉哉各祗命知予眷萬方帝爲趙法師別造精院過院賦詩并序云秋九月聽政觀風存乎遊息退朝之後歷西上陽入清虚院則法師所居之地也法師得玄元之法養浩然之氣故法此僊家特建真宇紫房對聳緑竹羅生既親重其人每經過其地以怡神洗雪進德脩業何必齋心累月逺在順風因而賦詩用適真意云尔詩云宗師心物外爲道運虚舟不戀巗泉賞來從宫禁遊探玄知㡬歲習静更冝秋煙樹辨朝色風湍聞夜流坐朝繁聽覧尋勝在清幽欲廣無爲化因兹庶可求又送趙法師還蜀因名山奠簡詩云道家奠靈簡自昔仰神仙真子今將命蒼生福可傳江山尋故國城郭信依然二室遥相望雲廻洞裏天蜀州新津縣也法師觀宇在今天寳十六年又送忠州太守康昭逺等詩云端拱臨中樞𬗟懐共予理不惟臺閣英孰振循良美分符侯甸内拜首明庭裏誓節期飲氷調人方導水嘉聲馳九牧惠化灮千祀時雨侔昔賢芳猷貫前史佇爾頌中和吾將令卿士德宗元日退朝觀軍仗歸營云獻歲視元朔萬方咸在庭端旒揖群后廻輦閲師貞綵仗宿華殿退朝歸禁營分行左右出轉斾風雲生歷歷趨複道容容映層城勇餘矜捷技令肅無喧聲眷此戎旅節載嘉良工誠順時傾宴賞亦以助文經中和節日宴百寮賜詩云韶華啓仲序初吉諧良辰肇兹中和節式慶天地春歡酣朝野同生德區宇均雲開灑膏露草䟽芳河津歲華方載陽東作方肆勤慙非薰風唱曷用慰吾人中和節賜百官讌集因示所懐云至化常在宥保和兹息人推誠撫諸夏與物長爲春仲月風景暖禁城花栁新芳時恊金奏錫燕周群臣絲竹豈云樂忠賢唯所親庻洽朝野意曠然天下均帝移晦日爲中和節故吕渭詩云皇心不向晦攺節號中和淑氣同風景佳名自詠歌湔裙移舊俗賜尺下新科曆象千年正酺醵四海多正元八年試宏詞詩以中和節應詔重陽日即事云令節曉澄霽四郊煙靄空天青白露㓗菊散黄金叢寡德荷天貺順時休百工豈懐歌鐘樂思爲君臣同至化在亭育相成資始終未知康衢詠所仰惟年豐豐年多慶九日示懐云爽氣肅時令早衣聞朔鴻重陽有佳節具物欣年豐皎潔暮潭色芬敷新菊叢芳罇滿衢室繁吹凝煙空惠合信吾道保和惟爾同推誠至玄化天下期爲公九日絶句云禁苑秋來爽氣多昆明風動起滄波中流簫皷誠堪賞詎假横汾發棹歌重陽中外同懽餘字韻群臣亦以其韻奉和故權德輿云宸衷在化成藻思煥瓊琚微臣侍竊抃豈足歌唐虞又重陽即事豐年多慶二詩以同字韻亦依以奉和故德輿前章云天道灮下濟睿詞敷大中後章云澤均行葦厚年慶華黍豐武元衡前章云重陽德澤振萬國歡娱同後章云賡歌禹功盛擊壤堯年豐九奏碧霄裏千官皇澤中重陽日中外同歡以詩言志因示群官云爽節在重九物華新雨餘清秋黄葉下菊散金潭初萬實行就稔百工欣所如歡心暢遐邇殊俗同車書至化自敦睦佳辰冝宴胥鏘鏘間絲竹濟濟羅簮𥚑此樂匪足躭此誠期永孚七月十五日題章敬寺云招提邇皇邑複道連重城法筵會早秋駕言訪禪扄嘗聞大仙教清浄宗無生七物匪吾寳萬行先求成名相既䨇寂繁華奚所榮金風扇㣲凉逺煙凝翠晶松院静苔色竹房深磬聲境幽真慮恬道勝外物輕意適本非説含毫空復情七年正元正元五年初置中和節帝製詩冩本賜戴叔倫於容州詩云東風變梅柳萬彚生春灮中和紀月令方與天地長耽樂豈予尚懿兹時景良庶遂亭育恩同致寰海康君臣永終始交㤗符隂陽曲沼水新碧華林桃稍芳勝賞信多歡戒之在無荒送徐州張建封還鎭云牧守寄所重才賢生爲時宣風自淮甸授鉞膺藩維入覲展遐戀臨軒慰來思忠誠在方寸感激陳情詞報國爾所尚恤人予是資歡宴不盡懷車馬當還期糓雨將應候行春猶未遲勿以千里遥而云無巳知獨建封獲賜詩正元後藩帥入朝帝善爲文尤長於篇什每與學士言詩於浴堂殿夜分不寐正元中昭義節度李抱真薦貝州宋庭芬之女若昭召入禁中試文帝咨美帝每與侍臣賡和若昭姊若莘等五人皆預呼學士正元四年九月賜宴曲江亭帝爲詩序曰朕在位僅將十載實頼忠賢左右克致小康是以擇三令節錫兹宴賞俾大夫卿士得同歡洽也夫共其戚者同其休有其初者貴其終咨爾群寮順朕不暇樂而能節職思其憂咸若時則庻乎理矣因重陽之㑹聊示所懐詩云早衣對庭燎躬化勤意誠時此萬機暇適與佳節并曲池潔寒流芳菊舒金英乾坤爽氣澄臺殿秋光清朝野慶年豐高㑹多歡聲求懐無荒誡良事同期情因詔曰卿等重陽㑹宴朕想歡洽欣慰良多情發于中因製詩序令賜卿等一本可中書門下簡定文詞士三五十人應制同用清字明日内於延英門進來宰臣李泌等雖奉詔簡擇難於取捨由是百寮皆和上自考其詩以劉太真及李紓等四人爲上等鮑防于邵等四人爲次等張蒙殷亮等二十三人爲下等而李晟馬燧李泌三宰相之詩不加考第帝章敬寺詩松院浄苔色竹房深磬聲時人傳誦帝晩年工詩句臣下莫及每御製奉和退而笑曰排工俗有投石之戲兩頭置摽號曰排公以中不中爲勝負也杜太保在淮南進崔叔靖詩一百萹帝曰此惡詩何用進時云奉勑惡詩韋綬以内相感心疾罷還第帝九日作黄菊歌顧左右曰安可不示韋綬遣使持徃綬遽奉和附使進帝曰爲文不巳豈頥養耶敕曰自今勿復爾文宗上元日詩云上元高㑹集群仙心齋何事欲祈年丹誠儻徹玉帝座且共吾人慶大田又云蓂生三五葉初齊上元羽客出桃蹊不愛仙家登真訣願䝉四海福黔黎裴度拜中書令以疾未任朝謝上巳曲江賜宴群臣賦詩帝遣中使賜度詩曰注想待元老識君恨不早我家柱石衰憂來學丘禱仍賜御扎曰朕詩集中欲得見卿唱和詩故令示此卿疾未差可異日進來御扎及門而度薨常謂左右曰若不甲夜視事乙夜觀書則何以爲人君耶每試進士多自出題目及所司進所試披覧吟詠終日忘倦常延學士於内庭討論經義較量古今令宫女以下侍茶湯飲饌李訓講周易時方盛夏遂命取水玉腰帶辟著犀如意以賜訓曰如意足以與卿爲談柄也讀高郢無聲樂賦白居易求玄珠賦謂之玄祖帝聽政暇慱覧群書一日延英顧問宰臣詩云􅊯􅊯鹿鳴食野之苹苹是何草時宰相揚珏楊嗣復陳夷行相顧未對珏曰臣按爾雅苹是籟蕭上曰朕㸔毛詩䟽葉圓而花白藂生野中似非藾蕭又一日問宰臣古詩云輕衫襯跳脱是何跳脱物宰臣未對上曰即今之腕釧也真誥言安妃有斵粟金跳脱是臂飾帝好五言自制品格多同肅代而古調清峻嘗欲置詩博士貞穆李公曰陛下逺慕堯舜而置詩博士况詩人多輕昧於識理今翰林學士皆能文詞而古今篇什足可怡悅聖情帝乃止珏也李公甘露事後帝不樂徃徃瞠目獨語云須殺此軰令我君臣間絶後賦詩曰輦路生春草上林花滿枝憑高無限意無復侍臣知翌日觀牡丹誦賦吟罷始憶舒元輿之詞歎息泣下因命作樂聊自適宫人沈翹翹者歌河滿子有浮雲蔽白日之句其聲宛轉上因欷歔問曰汝知之耶此文選古詩第一首蓋忠臣爲姦邪所蔽也乃賜金臂環問其從來則呉元濟女也自䧟掖廷易姓沈氏配樂籍又奏曰妾本藝方響廼白玉也搥則響犀爲之願賜臣妾帝命賜之既至命奏凉州之曲音韻清越聽者無不凄然嘗詔開元霓裳羽衣舞參以雲韶肄于廷太常少卿馮定部諸工立簴間端凝若植問李珏珏以定對帝喜曰豈非能古章句者邪親誦定送客西江詩召升殿賜禁中瑞錦詔悉所著以上嘗與宰相論詩之工拙鄭覃曰詩之工者無若三百篇皆國人作之以剌美時政王者采之以觀風俗耳不聞王者爲詩也後代辭人之詩華而不實無補於事陳後主隋煬帝皆工於詩不免亡國陛下何取焉覃篤於經術上甚重之常吟杜甫曲江篇云江頭宫殿鎻千門細栁新蒲爲誰緑乃知天寳以前樓臺之盛鄭注乃命神䇿軍淘曲江昆明二池許公卿立亭館兩軍造紫雲樓彩霞亭内出樓額賜之宣宗宣宗十二年前進士陳玩等三人應博學宏辭選所司考定名第及詩賦論進訖上於延英殿詔中書舍人李藩等對上曰凡考試之中重用字如何中書對曰賦即偏枯駮雜論即褒貶是非詩即緣題落韻如只封中白雲起是也白雲起封中詩云其間重用文字乃是庶㡬亦非常有例也又曰孰詩重用字對曰錢起湘靈皷瑟詩有二不字上曰善撫雲和瑟常聞帝子靈馮夷空自舞楚客不堪聽逸韻諧金石清音發杳冥蒼梧來怨慕白芷動芳馨流水傳湘浦悲風過洞庭曲終人不見江上數峰青上覧錢公此年宏詞詩曰且一重用文字此詩似不及起起則今之恊律文字也合於匏革宫商即變鄭衛之奏雖謝眺云洞庭張樂夜瀟湘帝子遊雲去蒼梧野水還江漢流未若此皷瑟一篇摛藻妍華無以加其前進士宏詞詩重字者登科更待明年考校起詩便付吏選帝好進士及第每對朝臣問及第茍有科名對者必大喜便問所試詩賦題目并主司姓名或佳人物偶不中第必歎惜移時甞於内自題鄉貢進士李道龍白居易之死帝以詩弔之曰綴玉聮珠六十年誰教冥路作詩仙浮雲不繫名居易造化無爲字樂天童子解吟長恨曲胡兒能唱琵琶篇文章巳滿行人耳一度思卿一愴然帝製秦邊陲曲其詞云海岳咸通及帝垂拱而年號咸通焉庶子裴惲進詩賀聖政有太康字帝怒曰太康失邦乃以比我戸部韋澳奏云晉平呉冦攺號太康雖有失邦之言乃見歸美之文上曰天子大湏博覧不然㡬錯罪惲舊制盛春内殿賜宴三日帝妙音律每先裁製新曲俾禁中女伶迭相教授至是出宫女數百分行連𬒮而歌其曲有曰播皇猷者率高冠方屨褒衣博帯趍走俯仰皆合規矩于于然有唐堯之風焉有曰葱女踏歌隊者率言葱嶺之士樂河湟故地歸國復爲唐民也若霓裳曲者皆執節幡被羽服態度凝澹飄飄然有翔雲舞鸖見左右如是數十曲流傳民間狐澄出令遺事正陵昭宗陜府唐昭宗有詩云安得有英雄迎歸大内中或曰逍遙樓有太宗詩云昔乗匹馬去今驅萬乗來志意不侔矣乾寧三年李茂貞犯闕帝次華州韓建迎歸郡中帝鬱鬱不樂每登城西齊雲樓逺望明年秋制菩薩蠻二首云登樓遥憶秦宫殿茫茫只見䨇飛燕渭水一條流千山與萬丘逺煙籠碧樹陌上行人去何處是英雄迎奴歸故宫又一曰飄飄且在三峰下秋風徃徃堪霑灑膓斷憶仙宫朦朧煙霧中思夢時時睡不語長如醉早晚是歸期蒼穹知不知帝戊午年還京庚申歲劉季述爲變冊德王帝明年正月一日返正攺元天復十一月朱全忠領兵入河中四日冬節帝又爲鳳翔兵士擁幸岐城帝在城中忽一旦大雷雨牛馬震死街西古槐殿東鴟吻立碎帝爲詩曰只解劈牛兼劈樹不能誅惡復誅兇朱全忠迎駕圍逼首渉三載癸亥正月駕幸全忠軍乃還京甲子歳全忠遣冦彦卿逼幸洛四月攺元天祐帝
