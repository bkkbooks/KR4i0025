  text: 唐詩紀事巻第三十七
  hash: sha256:4380cf99fbdbc47f2e1d44e09ecc1f0453f37cddff90025c21c30036d4115478
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_037-1a}
body:
  text: 元􅍬􅍬為御史奉使東川於褒城題黄明府詩其序云昔年曾於觧縣飲酒余為觥録事嘗於竇明府㕔有一人至頻犯語令連飛十數觥不勝因迯去醒後問人前虞卿黄丞也此後絶不復知元和四年三月奉使東川十六日至褒城驛逡廵有黄明府見迎瞻其形容髣髴似識問其前衘即曩日逃席黄氶也説向前事黄生惘然而悟因饋酒一罇􅋈舟請余同載余不免其意與之盡歡徧問褒陽山水則褒姒所奔之城在其左諸葛所征之路次其右感今懐古作贈黄明府詩曰昔年曾痛飲黄令困飛觥席上當時走馬前今日迎依稀迷姓字積漸識平生故友身皆逺他鄉眼暫明便邀連榻坐兼共剔舡行酒思臨風亂霜稜拂地平不㸔深淺酌貪愴古今情迤邐七盤路坡拖數大城花疑褒女笑棧息武侯征一種埋幽石空開千載名出本事詩稹聞西蜀薛濤有辭辯及爲監察使蜀以御史推鞠難得見焉嚴司空潜知其意毎遣薛徃洎登翰林以詩寄曰錦江滑膩峨眉秀生出文君與薛濤言語巧稹以明經制䇿入仕其一篇自述曰延英引對碧衣郎江硯宣毫各别床天子下簾親考試宫人手裏過茶湯是時貴族並應制科用為男子榮進連昌宫辭云連昌宫中滿宫竹歲乆無人森自束又有牆頭千葉桃風動落花紅蔌蔌宫邊老人為余泣小年選進因曾入上皇正在望僊樓太真同憑欄竿立樓上樓前盡珠翠炫轉熒煌照天地歸來如夢復如癡何睱備言宫裡事初過寒食一百六店食無煙宫樹緑夜半髙樓絃索鳴賀老琵琶定場屋力士傳呼覔念奴念奴潜伴諸郎宿湏㬰覔得又連催特勑街中許燃燭春嬌滿眼睡紅消掠削雲鬟旋粧束飛上九天歌一聲二十五郎吹管逐逡廵大遍梁州徹色色龜兹轟緑續李摹擪笛傍宫牆偷得新翻數般曲平明大駕發行宫萬人鼓舞途路中百官隊仗避岐薛楊氏諸姨車闘風明年十月東都破御路猶存禄山過驅令供頓不敢藏萬姓無聲淚潜墮兩京定後六七年却尋家舎行宫前㽵園燒盡有枯井行宫門闥樹宛然尔後相傳六皇帝不到離宫門乆閉徃來年少説長安玄武樓前華萼廢去年因勑使斫竹偶值門開暫相逐荆榛櫛比塞池塘狐鬼驕癡縁樹偷鸚鵡舌文章分得鳯凰毛紛紛辭客多停筆箇箇君候欲夢刀别後相思隔煙水菖蒲花發五雲高後㢘問淛東乃有劉採春自淮甸而來容華奠比元贈詩曰新粧巧様盡雙蛾褁慢常州透額羅正靣偷倫光滑笏暖行輕踏皺紋波言辭雅措風流足舉止低回秀媚多更有惱人腸斷處選詞能唱望夫歌望夫歌者即羅嗊之曲也元云在淛河七年因醉題東武其詩曰役役行人事紛紛碎簿書功夫兩衙盡留滯七年餘病痛梅天發親情海㟁踈因循未歸得不是憶鱸魚盧侍郎簡求戯曰丞相雖不爲鱸魚爲好鏡湖春色耳謂採春也公先娶京兆韋氏字蕙叢韋逝爲詩悼之曰曾經滄海難爲水除却巫山不是雲岀本事傳稹元和四年爲御史鞠獄梓潼樂天昆仲送至城西而别後旬日昆仲與李侍郎建閑遊曲江及慈恩寺飲酣作詩曰花時同醉破春愁醉折花枝作酒籌忽憶故人天際去計程今日至梁州後旬日得元書果以是日至褒仍寄詩曰夢見兄弟曲江頭也到慈恩院院遊驛吏喚人排馬去忽驚身在古梁州千里魂交合若符契自有感夢記備叙其事朩舞榭欹傾基尚存文牎窈窕紗猶緑塵埋粉壁舊花鈿鳥啄風筝碎珠玉上皇偏愛臨砌花依然御榻臨街斜蛇出鷰巢盤闘拱菌生香按正當衙寢殿相連端正樓太真梳洗樓上頭晨光未出簾影黒至今反掛珊瑚鈎指向傍人因慟哭却出宫門淚相續自從此後還閉門夜夜狐狸上門屋我聞此語心骨悲太平誰致亂者誰翁言野父何分别耳聞眼見為君説姚崇宋璟作相公勸諌上皇言語切爕理隂陽禾黍豐調和中外無兵戎長官清平太守好揀選皆言由相公開元欲末姚宋死朝庭漸漸由妃子祿山宫裏飬作兒虢國門前閙如市弄權宰相不說名依稀憶得楊與李廟謀㒹倒四海揺五十年來作瘡痏今皇神聖丞相明詔書纔下呉蜀平官軍又取淮西賊此賊亦除天下寧年年耕種宫前道今年不遣子孫耕老翁此意深望幸努力廟謀休用兵穆宗時嬪御多誦稹歌宫中號為元才子後荆南監軍崔峻歸朝出稹連昌宫詞等百餘篇奏御穆宗大悦即日拜祠部郎中知制誥稹上令狐文公書云某始自御史府謫官於外十餘年矣閑誕無事遂用力於詩章日益月滋有詩千餘首其間感物寓意可備矇瞍之風逹者有之詞直氣麤罪戾是懼固不敢陳露於人惟盃酒光景間屢為小碎篇章以自吟暢然以為律體卑下格力不揚茍無姿態則䧟流俗常然欲得思深語近韻律調新屬對無差而風情自逺然而病未能也江湖間多有新進小生不知天下文有宗主妄相倣傚而又從而失之遂至有褊淺之調皆目為元和詩體某又與同門生白居昜友善居昜雅能為詩就中愛驅駕文字窮極聲韻或為千言或為五百言律詩以相投寄小生自審不能有以過之徃徃戯排舊韻别創新詞名為次韻蓋欲以難相挑耳江湖間為詩者或相倣傚或力不足則至於㒹倒語言重複首尾韻同意等不異於篇亦目為元和詩體而司文者考變異之由徃徃歸咎於某嘗以為雕蟲小事不足自明也樂天在洛大和中稹拜左丞相自越過洛以二詩别樂天云君應恠我留連乆我欲與君辤别難白頭徒侣漸稀少明日恐君無此歡又云自識君來三度别這回白盡老髭䰅戀君不去君湏㑹知得後廻相見無未幾死于鄂樂天哭之曰始以詩交終以詩訣絃筆相絶其今日乎屈指正元舊朝事幾人同見大和春句感興兒歌楊栁葉妾拂石榴花句逺路事無限相逄惟一言月色照榮辱長安千萬門公句逄白右張為取作主客圗稹序言寄樂天云九嵗學賦詩長者徃徃驚其可恠年十五六粗識聲病時貞元十年已後徳皇帝春秋髙理務因人㝡不欲文法吏生天下罪過外閫節將動十餘年不許相朝死於其地不易者十八九而又將豪卒愎之處因喪負衆横相賊殺告變駱驛使者迭窺旋以状聞天子曰某色將某能遏亂亂衆寧附願為其師名為衆情其實逼詐因而可之者又十八九前置介倅因縁交授者亦十四五由是諸侯敢為自意有羅列兒孩以自固者有開導蠻夷以自重者甚者視一境如一室刑殺其下不啻六畜厚加剥奪名為進奉其實貢入之數百一焉京城之中停第邸店以曲巷斷侯甸之内水陸腴沃以鄉里計其餘奴婢資財生生之備稱是朝廷大臣㕥謹慎不言為朴雅以時進見者不過一二親信直臣議士徃徃抑塞禁省之間或繕完隤墜豪家大帥乗聲相扇延及老㓜土木妖熾習俗不恠上不欲令有司備宫闥中小碎湏求徃徃持幣帛以易餅餌吏縁其端剽奪百貨勢不可禁僕時孩騃不慣聞見獨於書傳中初習理亂萌漸心體悸震若不可活思欲發之乆矣適有人以陳子昻感遇詩相示吟翫激烈即日為寄思玄子詩二十首故鄭京兆於㒒為外諸父深賜憐奨因以所賦呈獻京兆翁深相駭異秘書少監王表在坐頋謂表曰使此兒五十不死其志義何如哉惜吾軰不見其成就因召諸子訓責泣下僕亦竊不自怠由是勇於為文又乆之得杜甫詩數百首愛其浩蕩津涯處處臻到始病沈宋之不存寄興而訝子昻之未暇旁備矣不數年與詩人楊巨源友善日課為詩性復僻懶人事常有閑暇閑則有作識足下時有詩數百篇矣習慣性靈遂成病蔽毎公私感憤道義激揚朋友切磨古今成敗日月遷逝光景舒慘山川勝勢風雲景色當花對酒樂罷哀餘通滯屈伸悲歡合散至於疾恙其身悼懐昔遊凢所對遇有常者則欲賦詩又不幸年三十二時有罪譴弃今三十七矣三十六年間是丈夫心力壮時常在閑處無所役用性不近道未能淡然忘懐又復懶於他欲全盛之氣注射語言雜揉精粗遂成多文然亦未嘗繕寫適值河東李明府景儉在江陵時僻好僕詩章謂能為觧欲得盡取觀覽僕因撰成巻軸其中有㫖意可觀而詞近古徃者為古諷意亦可觀而流在樂府者為樂諷詞雖近古而止於吟寫情性者為古體詞實樂流而止於模象物色者為新題樂府聲勢㳂順屬對稳切者為律詩仍以七言五言為兩體其中有稍存寄興與諷為流者為律諷不幸少有伉儷之悲撫存感徃成數十詩取潘子悼亡為題又有以于教化者近昵婦人暈淡眉目綰約頭䰅衣服脩廣之度及匹配色澤尤極恠艶因為艶詩百餘首詞有今古又兩體自十六時至是元和七年矣有詩八百首色類相從共成十體凢二十巻自笑冗辭亦不復致之於行李昨來京師偶在箱篋及通行盡置足下僅亦有説僕聞上士立徳其次立事不遇立言凢人急位其次急利下急食僕天與不厚既乏全然之徳命與不遇未遭可為之事性與不恵復無垂範之言兀兀狂癡行近四十徼名取位不過於第八品而冒憲已六七年授通之初有習通之熟者曰地濕墊卑褊人士稀少近歳荒札死亡過半邑無吏市無貨百姓茹草朩刺史以下計粒而食大有虎豹蛇虺之患小有蟆蚋浮塵蜘蛛之類皆能鑚囓肌膚使人瘡痏夏多隂霪秋為痢瘧地無醫巫藥石萬里病者有百死一生之慮夫何以僕之命不厚也如此智不足也又如此其所詣之憂險也又復如此則安能保持萬全與足下必復京輦以湏他日立言立事之驗耶但恐一旦與急食相扶而終使足下受天下有不如已之誚是用悉所為文留穢箱笥比夫格奕樗里之戯猶曰愈於飽食僕所為又不愈於格奕樗里之戯乎昨行巴南道中又有詩五十一首文書中得七年已後所為向二百篇繁亂冗雜不復置之執事前所寄思玄子者小歳為文不能自足其意貴其起予之始且志京兆公見遇之由今亦寫爲古諷之一移諸左右僕少時授吹嘘之術於鄭先生病懶不就今在閑處思欲怡神保和以求其内異日亦不復費詞於無用之文矣省視之煩庻亦已於是乎琵琶歌此後並新題樂府寄管兒兼管鉄山琵琶宫調八十一旋宫三調彈不出玄宗偏許賀懐智叚師此藝還相匹自後流傳指撥衰崐崘善才徒尔爲鴻聲少得似雷吼聲去絃不敢彈羊皮人間竒事㑹相續但有卞和無有玉叚師弟子數十人李家管兒稱上足管兒不作供奉兒抛在東都雙鬢絲逄人便請送盃盞㸔盡工夫人不知李家兄弟皆愛酒我是酒徒為宻友著作曽邀連夜宿中輾清溪華新緑平明船在管兒行盡日聽彈無限曲曲名無限知者鮮霓裳羽衣偏宛轉凉州大遍最毫嘈緑腰散序多籠撚我聞此曲深賞竒賞著竒處驚管兒管兒為我雙淚垂自彈此曲長長悲淚垂捍撥朱絃濕氷泉嗚咽流鶯澁因兹彈作雨霖鈴風雨蕭條鬼神泣一彈既罷又一彈珠幢夜靜風珊珊低佪慢弄闗山思坐對燕然秋月寒月寒一聲深殿磬驟彈曲破音繁併百萬金鈴旋聲去玉盤醉客滿船皆暫醒自兹聽後六七年管兒在洛我朝天游想慈恩杏園裡夢寐仁風花樹前去年御史留東臺公私蹙促顔不開今春制獄正撩亂晝夜推囚心似灰暫輟歸時尋著作著作南園花拆萼煙支耀眼桃正紅雪片滿溪梅巳落是夕青春值三五花枝向月雲含吐著作施罇命管兒管兒乆别今方覩管兒還為彈緑腰緑腰依舊聲迢迢猿鳴雪岫來三峽鶴唳晴空聞九霄逡廵彈得緑腰徹霜刀破竹無殘節幽闗鵶軋胡鴈悲斷絃砉騞層氷裂我為含凄歎竒絶許作是歌始終説藝竒思寡塵事多許來寒暑又經過如今左降在閑處始為管兒歌此歌此歌寄管兒管兒憂尔衰尔衰之後繼者誰繼之無乃在鐡山鐡山已近曹穆間才二善性靈甚好功猶淺急處未得臻幽閑努力鐡山勤學取莫遣後來無所祖何滿子歌唐有態作張胡南坐為何滿能歌能宛轉天寳年中世稱罕嬰刑繫在囹圄間下調哀音歌憤懣棃園弟子奏玄宗一唱承恩覊網緩便將何滿為曲名御譜親題樂府纂魚家入内本領絶葉氏有年聲氣短自徒煩記得詞㸃拍纔成已夸誕我居湖外拜君侯正值灰飛仲春琯廣宴江亭為我開紅粧遲日花枝暖此時有態踏華筵未吐芳詞㒵夷坦翠蛾轉盻揺雀釵碧袖歌垂飜鸖卵定靣凝眸一聲發雲停塵下何勞筭迢迢擊磬逺玲玲一一貫珠匀欵欵犯羽含商移調態留情度意抛絃管湘妃寳瑟上水來秦女玉簫空外滿纒綿疊破最慇勤整頓衣裳事閑散水含逺溜咽還通鸎泥晩花啼漸嬾歛黛吞聲若自冤鄭袖見捐西子浣隂山鳴鴈曉斷行巫峽哀猿夜呼伴古者諸侯饗外賔鹿鳴三奏陳圭瓉何如有態一曲終牙籌記令紅螺盞五絃彈云趙壁五絃彈徴調徴聲巉絶何清峭辭雄皓鸖警露啼失子哀猿繞林嘯風入春松正凌亂鸎含曉舌憐驕妙嗚嗚暗溜咽氷泉殺殺霜刀澁寒鞘促節頻催漸繁撥珠幢斗絶金鈴掉千鳴鏑發胡弓萬片清球擊虞廟衆樂雖同第一部徳宗皇帝常偏召旬休節假暫歸來一聲狂殺長安少主第侯家最難見挼反蘇雷歌按曲皆承詔水晶簾外散貴嬪瑇瑁筵心伴中要臣有五賢非此絃或在拘囚或屠釣一賢得進勝累百兩賢得進同周邵三賢仕漢滅暴强四賢鎮岳寧邊徼五賢並用調五常五常既序三光矅趙璧五絃非此賢九九何勞設庭燎放言五首云近來逄酒便髙歌醉舞詩狂漸欲磨五斗觧酲猶恨少十分飛盞未慊多眼前讎敵都休問身外功名一任他死是等閑生也得擬將何事奈吾何莫將心事厭長沙雲到何方不是家酒熟餔糟學漁父飯來開口似神鵶竹枝待鳯千莖直柳樹迎風一向斜揔被天公霑雨露等頭成長盡生涯霆轟電烻數聲頻不奈狂夫不藉身縱使被雷燒作燼寧殊埋骨颺為塵得成蝴蝶尋花樹儻化江魚棹錦鱗必若乖龍在諸處何湏警動自來人安得心源處處安何勞終日望林巒玉英惟向火中冷蓮葉元來水上乾寗戚飯牛圖底事陸通歌鳯也無端孫登不語啓期樂各自當情各自歡三十年來世上行也曾狂走趂浮名兩廻左降湏知命數度登朝何處榮乞我杯中松葉滿遮渠肘上柳枝生他時定葬燒缸地賣與人家得酒盛和樂天過秘閣書省舊㕔云聞君西省重徘徊秘閣書房次第開壁記欲題三編合吏人驚問十年來經排蠧簡憐初撥芸長陳根識舊栽司馬見詩心最苦滿身蚊蚋笑煙埃和樂天贈楊秘書云昔與楊郎在帝城搜天斡地覔詩情曾因並句甘稱小不為論年便喚兄刮骨直穿由苦闘夢腸翻出暫閑行因君投贈還相和老去那能竟底名琵琶云學語胡兒撼土鈴甘州破裏最星星使君自恨常多事不得工夫夜夜聼内状詩寄楊白二員外制誥時知天門暗闢玉錚鍧晝送中樞曉禁清彤管内人書細膩金奩御印篆分明衝街不避将軍令䟦勑兼題宰相名南省郎中誰得詔與君将向世間行酬樂天餘思不盡加為六諳之作律吕同聲我愛身文章君是一伶倫衆推賈誼為才子帝喜相如作侍臣巻云白才子文章及樂天知制誥詞云覧其詞賦樂天先有秦中吟及百節判皆為書肆書賈題其並一處時喜與相如次韻千言曾報荅數首予皆用本韻酬和樂天曽寄予千字律詩成風耳後來遂以直詞三道共經綸求千軰功直詞䇿以盡樂天與予同應制科其具之字詩謹中爾經邦之術其事已元詩駮雜真難辯詩傳流諸處身後軰好偽作予皆云是余所撰及勘驗無一篇是者到㑹稽以有人寫宫詞百篇及雜詩兩巻白撲流傳用轉新式禁中號曰白撲毎有新入學士求訪寳重樂天於翰林中書取詔批荅同等撰為典也過於六蔡女圖書雖在口書四百餘篇蔡琰口誦家于公門户豈生塵川八十家寃憤一言中因感無兒之嘆故余自樂天嘗贈予詩云詩心如肺石動必逹窮民東句有此商瞿未老猶希兾莫把籯金便付人寄湖西李大夫四首云柳眼梅心漸欲春白頭西望憶何人金陵太守曽相伴共踏銀䑓一路塵蘂珠深處少人知網索西臨太液池殿曉聞天語後步廊騎馬笑相隨士候對歇於此網索在太液上學禁林同直話交情無夜無曽不到明最憶西樓人静後玉晨鐘磬兩三聲宸殿後靣也玉晨觀在紫由來鵬化便圖南浙右雖雄我未甘早渡西江好歸去莫抛舟檝滯春潭徽之善紀事如䑓中鞠獄贈周兄詩云閙装轡頭繘静拭腰帯班鷂子繡線􅭕狗兒金油去鐶又坐卧摩錦褥捧擁綟絲鬢罰俸西歸詩邀我上華筵横頭坐賔位那知我年少深觧酒中事能唱犯聲歌偏精變籌義含詞徙殘拍促舞逓繁吹呌噪擲投盤生獰攝觥使寄呉士矩云予時最年少專務酒中職未觧媿生獰偏矜任狂直曲庇桃根盞横講捎雲式亂布闘分朋惟新間䜛慝耻作最先吐羞言未朝食酬東川季相公云昔附赤霄羽葳蕤逰紫垣闕班香案上奏語玉晨尊酬白學士云並入紅蘭署偏親白王䂓又闘班雲洶湧開扇雉参差又􅔇棃通蒂朽味無火米帯芒炊精不芽笋錢筒束鯾魚箭羽鬐又病賽烏稱鬼巫占瓦代龜烏鬼南人賽紀懐贈李六云昔冠諸生首初因三道徴公卿碧墀㑹名姓白麻稱荅胡靈之云矮馬駞鬉䪜犛茒牛獸靣纓一船席外語三榼拍心精傳盞加分數横波鄭目成葉奴歌淅淅塩媚子侮卿卿又環坐唯更草枝盤漸廢觥又柳愛凌寒軟梅憐上畨驚又雨催魚火熖風引去竹枝聲店卧戯呈諸公籌筋隨宜放投盤止罰啀紅娘留醉打抛打曲名舞引紅娘觥使及醒差席上古聀酒中觥使又搶旗如在手色目籌筋那復敢葳㠢酬樂天東南行云科試銓衡局衙參典校厨同年書判同省校正月中分桂樹天上識菖蒲又白麻雲色膩墨詔電光徂又祖竹聚新筍孫枝壓舊梧又酬樂天待漏入閣云未勘銀䑓契先挑浴殿闗沃心因特召承㫖絶常班學士上承㫖在颭閃才人袖傳詔宫官嘔鵶軟轝鐶宫花低作帳雲從積成山宻視樞機草偷瞻咫尺顔恩垂天語近對乆漏聲閑丹陛曽同立金鑾恨獨攀舎人樂天翰林徽之筆無鴻業潤視愧紫文殷河水通天上瀛洲接世間謫仙名籍在何不重來還神麹酒云七月調神麹三春釀綠醽雕鐫荆玉盞烘透内丘瓶戴光弓詩云潞府筋角勁戴光因合成閑吟云晻淡州煙白籬篩日脚紅江喧過雲雨船泊打頭風底子收魚市鴉兒噪荻叢不堪堤上立滿眼是蚊䖝狂醉云崐亭今日㒹狂醉舞引紅娘亂打人亞枝紅云平陽地上亞枝紅在池上桃花平悵望山郵是事同還向萬莖深竹裡一枝渾卧碧流中稹在鄂州周復為從事常命酬唱復簮笏見稹曰某偶以大人徃還獲一第其實不能詩賦稹曰質實如是賢於能詩逺矣一云徽之守浙東樂天守蘇䑓逓簡唱和内一聮云有月多同賞無杯不共持兩地暗合唐詩紀事巻第三十七
