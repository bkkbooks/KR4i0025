  text: 明
  hash: sha256:73b972d71b0aec48bed3fe7ef7cecc472d07ed7437bd07c485f95622bf7728ea
body:
  text: 崔宗之宗之襲父日用齊國公封好學寛愽有風舉與李杜以文相知贈李白云凉秋八九月白露空園庭耿耿意不暢捎捎一作悄悄風葉聲思見雄俊士共話今古情李侯忽來儀把袂苦不早清論既抵掌𤣥談多絶倒分明楚漢事厯歴王覇道擔囊無俗物訪古千里餘袖有匕首劒懐中茂陵書雙眸光照人詞賦凌子虚酌酒竝素琴霜風氣凝潔平生心中事今日為君說我家有别業寄在嵩之陽明月出髙岑清溪澄素光雲散牕戸靜風吹松桂香子若同斯遊千載不相忘白和云朔風横髙天萬里起秋色壯士心飛揚落日空嘆息長嘯出原野凛然寒風生幸遭聖明時功業猶未成柰何懐良圖鬱悒獨愁坐一作空獨坐杖䇿尋英豪立談乃知我崔公生人秀緬邈青雲姿制作參造化託諷含神祗海岳尚可傾吐諾終不移是時霜飈寒逸興臨華池起舞拂長劒四座皆揚眉因得窮歡情贈我以新詩又結汗漫期九垓逺相待舉身憇蓬壺濯足弄滄海從此凌倒景一去無時還朝遊明光宫日暮閶闔闗但得長把袂何必嵩􅏀山宗之為侍御史謫官金陵與白詩酒唱和月夜乘舟自採石逹金陵敬括孫晦昕眸括字叔弓河中人為殿中侍御史不諧附楊國忠出知果州入為兵侍志簡淡不求名後刺同州隠然持重大歴中卒括試七月流火云前逢一葉下言念忽悲秋變節金初至分寒火正流氣含良夜早光拂夏雲收助月㣲明散沿河麗景浮秋標時令羙詩興國風幽自此觀邪正深知玉葉休房琯琯宰盧氏王維贈詩云逹人無不可忘已愛蒼生不復小千室絃歌在兩楹又云視事兼偃卧對書不簮纓蕭條人吏踈烏雀下空庭是時琯之清名已重於搢紳矣琯題漢州西湖云髙流纒峻隅城下緬􅏀墟决渠信浩蕩潭島成江湖結宇依回渚水中信可居三伏氣不蒸四逹暑自徂同人千里駕鄰國五馬車月出共登舟風生隨所如舉麾指極浦欲極更盤紆繚繞各殊致夜盡情有餘遭亂意不開即理還暫祛安得長晤語使我憂更除琯字次律融之子也相肅宗有逺器好談老子浮屠法髙談有餘而不切事蘇源明天寳十二載源明守東平宴濮陽守崔季重魯郡李蘭濟南田琦濟陽李陵于回源亭為小洞庭五太守讌集載其歌曰小洞庭兮牽方舟風嫋嫋兮離平流牽方舟兮小洞庭雲㣲㣲兮連絶􅠌層瀾壮兮緬以没重嵓轉兮超以忽馮夷逝兮䕶輕橈蛟龍行兮落増潮泊中潮兮澹而閑並曲溆兮悵而還適予手兮非予期將解袂兮藂予思尚君子兮夀厥身承明主兮憂斯人其後以國子司業召須尉袁廣餞于小洞庭復歌曰浮漲湖兮莾迢遥川后禮兮扈予橈横増沃兮蓬僊延川后福兮易予舷月澄凝兮明空波星磊落兮耿秋河夜既良兮酒且多樂方作兮奈别何子羙八哀詩曰武功少也孤徒歩客徐兗讀書東嶽中千載考墳典時下萊蕪郭忍飢浮雲巘負米晚為身毎食臉必泫夜字照爇薪垢衣生碧蘚庶以勤苦志報兹劬勞願學蔚醇儒姿文包舊史善灑落辭幽人歸來潜京輦射䇿君東堂宗匠集精選制可題未乾乙科己大闡文章日自負吏禄亦累踐晨趍閶闔内足踏宿昔趼一麾出守還源明累遷太子諭徳為東平太守故召為國子司業也黄屋朔風巻不暇陪八駿虜庭悲所遣平生滿樽酒斷此朋知展憂憤病二秋有恨石可轉安禄山䧟京師源明以病不受偽官黄屋車蓋也肅宗復社稷得無逆順辨肅宗復兩京權考功郎中知制誥范曄顧其兒李斯憶黄犬秘書茂松意再扈祠壇墠前後百巻文枕藉皆禁臠篆刻楊雄流溟漲本末淺青熒芙蓉劒犀兕豈獨剸反為後軰䙝予實苦懐緬煌煌齋房芝事絶萬手搴垂之俟來者正始眞勸勉不要懸黄金胡為投亂贙結交三十載吾與誰遊衍滎陽復𡨕莫罪罟已横罥嗚呼子逝日始泰則終蹇長安米萬錢凋喪盡餘喘戰伐何當解歸㠶阻清沔尚纒漳水疾永負蒿里餞詩中滎陽謂鄭䖍也唐詩紀事巻十九欽定四庫全書唐詩紀事巻二十宋計敏夫撰鄭䖍嚴武史俊李適之祖詠李頎
