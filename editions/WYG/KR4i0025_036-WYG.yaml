body:
  text: 黎逢閻濟美裴交泰劉皂黎逢小苑東望宫池柳色詩云上林新柳變小苑暮天晴始望和煙密遥憐拂水輕色承陽氣暖隂帶御溝清不厭隨風弱仍宜向日明垂絲遍閣榭飛絮觸簾旌漸到依依處思聞出谷鸎韋蘇州任京兆功曹日有答貢士黎逢詩云彌月曠不接公門但驅馳蘭草忽有贈持用慰所思不見心㣲密况當相見時逢氣貎山野及第年初塲後至便於簾前設席主司異之誚其生踈必謂文詞稱是專令人伺之句句來報初問云何人徘徊曰亦是常言既而將及數聨莫不驚嘆遂擢第逢登大歴十二年進士第閻濟美濟美大歴九年春下第將出闗獻坐主張謂詩六韻曰謇諤王臣直文明雅量全望鑪金自躍應物鏡何徧南國幽沉盡東堂禮樂宣轉令遊藝士更惜至公年芳樹歡新景青雲泣暮天唯愁鳳池拜孤賤更誰憐謂覽之問失第之因具以實告謂深有遺才之嘆乃曰所投六韻必展後效明年濟美自江東繼薦就試東都謂復主文雜文巳過繼欲帖經濟美辭以不能謂曰禮闈故事亦許作詩贖帖遂命天津橋望洛城殘雪題濟美曰新霽洛城端千家積雪寒未收清禁色偏向上陽殘既而日勢巳晚詩未就謂云只據見在將來一覽稱賞遂唱過盧景莊謂曰前足下試蜡日祈天宗賦以魯􅉌對衛賜則子貢也乃作駟字誤矣方悔之明日謂曰天寒急景諸君文巻不成未可以呈宰相請重録送納既而索舊巻則駟字上朱㸃在焉易巻之意蓋有在也到闕謂揖濟美曰前日春間遺才所投六韻不敢暫忘幸副素懷矣濟美紀其事曰前朝公相許與定分一面不忘美哉濟美貞元末歴福建觀察為治簡易以工部尚書卒濟美元和初刺華州劾華隂令柳澗贓罪韓愈使過華上䟽理澗留中不下詔御史按得澗贓狀以愈妄論復為國子博士裴交泰長門怨云自閉長門經幾秋羅衣濕盡淚還流一種峨嵋明月夜南宮歌吹北宮愁范攄曰近日舉塲詩尤新章孝標對月云長安一夜千家月幾處笙歌幾處愁有類乎裴交泰交泰正元間詩人劉皂長門怨云宮殿沉沉月色分昭陽宮漏不堪聞珊瑚枕上千行淚不是思君是恨君皂正元間人也韋莊載皂長門怨云涙滴長門秋夜長愁心和雨到昭陽淚㾗不學君恩斷拭却千行更萬行唐詩紀事巻三十六欽定四庫全書唐詩紀事巻三十七宋計敏夫撰元微之微之為御史奉使東川於褒城題黄明府詩其序云昔年曾於觧縣飲酒余為觥録事嘗於竇明府㕔有一人至頻犯語令連飛十數觥不勝因迯去醒後問人前虞卿黄丞也此後絶不復知元和四年三月奉使東川十六日至褒城驛逡廵有黄明府見迎瞻其形容髣髴似識問其前衘即曩日逃席黄丞也説向前事黄生惘然而悟因饋酒一罇􅋈舟請余同載余不違其意與之盡歡徧問褒陽山水則褒姒所奔之城在其左諸葛所征之路次其右感今懐古作贈黄明府詩曰昔年曾痛飲黄令困飛觥席上當時走馬前今日迎依稀迷姓字積漸識平生故友身皆逺他鄉眼暫明便邀連榻坐兼共榜舡行酒思臨風亂霜稜拂地平不㸔深淺酌貪愴古今情迤邐七盤路坡陁數丈城花疑褒女笑棧息武侯征一種埋幽石空聞千載名出本事詩微之聞西蜀薛濤有辭辯及為監察使蜀以御史推鞠難得見焉嚴司空潜知其意毎遣薛徃洎登翰林以詩寄曰錦江滑膩峨眉秀幻出文君與薛濤言語巧偷鸚鵡舌文章分得鳯凰毛紛紛辭客多停筆箇箇君侯欲夢刀别後相思隔煙水菖蒲花發五雲高後㢘問淛東乃有劉採春自淮甸而來容華莫比元贈詩曰新粧巧様畵雙蛾謾裹常州透額羅正靣偷勻光滑笏緩行輕踏皺紋波言辭雅措風流足舉止低回秀媚多更有惱人腸斷處選詞能唱望夫歌望夫歌者即羅嗊之曲也元云在淛河七年因醉題東武其詩曰役役行人事紛紛碎簿書功夫兩衙盡留滯七年餘病痛梅天發親情海㟁踈因循未歸得不是憶鱸魚盧侍郎簡求戯曰丞相雖不為鱸魚為好鏡湖春色耳謂採春也公先娶京兆韋氏字蕙叢韋逝為詩悼之曰曽經滄海難為水除却巫山不是雲出本事傳微之元和四年為御史鞠獄梓潼樂天昆仲送至城西而别後旬日昆仲與李侍郎建閑遊曲江及慈恩寺飲酣作詩曰花時同醉破春愁醉折花枝作酒籌忽憶故人天際去計程今日到梁州後旬日得元書果以是日至褒仍寄詩曰夢見兄弟曲江頭也到慈恩院院遊驛吏喚人排馬去忽驚身在古梁州千里魂交合若符契自有感夢記備叙其事微之
