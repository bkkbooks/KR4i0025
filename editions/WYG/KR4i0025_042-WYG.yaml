body:
  text: 王涯獻夀詞云宫觀参差列九重祥雲瑞氣捧階濃㣲臣欲獻南山夀遥指南山對衮龍遊春詞云曲江絲桞變煙條寒谷氷隨暖氣消纔見春光生綺陌已聞清樂動雲韶經過桞陌與桃蹊尋逐春光著處迷鳥度時時衝絮起花繁衮衮壓枝低秋思云綠軒凉吹動輕衣夜聽更長玉漏稀月渡天河光轉濕鵲驚秋樹葉頻飛宫連太液見滄波暑氣㣲消秋意多一夜輕風蘋末起露珠翻盡滿池荷從軍辭云髦頭夜落㨗書飛來奏金門着賜衣白馬将軍頻破敵黄龍戍卒幾時歸塞下曲云辛勤幾出黄花戍迢遞初隨細栁營塞晩毎愁殘月苦邊愁更逐斷蓬聲年少辭家從冠軍金装寳劍去邀勲不知馬骨傷寒水唯見龍城起暮雲平戎辭云太白秋髙助發兵長風夜巻敵塵清男兒觧却腰間劍喜見從王道化平塞上曲云塞卒常為敵邊聲巳報秋平生多志氣箭底覓封侯從軍辭云戈甲從軍久風雲識陣難今朝拜韓信計日斬成安燕頷多竒相狼頭敢犯邊寄言班定逺正是立功年隴上行負羽到邊州鳴笳度隴頭雲黄知塞近草白見邊秋閨人贈逺花明綺陌春栁拂御􅗂新為報遼陽客流芳不待人逺戍功名薄幽閨年貎傷妝成對春樹不語淚千行形影一朝别煙波千里分君看望君處秖是起行雲戴勝飛晴野凌澌下濁河春風樓上望誰見淚痕多春江曲揺漾越江春相将看白蘋歸時不覺夜出浦月隨人家寄征江岸征人幾嵗遊不如潮水信毎月到沙頭乗曉南湖去参差疊浪横前洲在何處露裏鴈嚶嚶塞下曲三戍漁陽再渡遼騂弓在臂劍横腰匈奴欲似知名姓休傍隂山更射鵰獵馬千羣鴈幾雙燕然山下碧油幢傳聲漠北單于破火照旌旗夜受降朔雪飄飄開鴈門平莎厯亂巻蓬根功名恥計擒生數直斬樓蘭報國恩隴水潺湲隴樹秋征人到此泪雙流鄉闗萬里無因見西戍河源早晩休隂磧茫茫塞草腓桔橰烽上暮煙飛闗河北望天連海蘇武曽将漢節歸漢苑行二月春風變桞條九天清樂奏雲韶蓬萊殿後花如錦紫閤街前雪未銷廻鴈髙翻太液池新花低發上林枝年光到處皆堪賞春色人間総未知春風澹蕩影悠悠鸎囀髙枝燕入樓千歩廽廊聞鳯吹珠簾處處上銀鈎閨思云洞房今夜月如練復如霜為照離人恨亭亭到曉光涯字廣津博學工屬文梁蕭陸贄異其才元和中為相又相穆宗至文宗時李訓敗遂及禍令狐楚宫中樂云楚塞金陵靖巴山玉壘空萬方無一事端坐大明宫雪霽長楊苑氷開太液池宫中行樂日天下盛明時栁色煙相似梨花雪不如春風空有意一一麗皇居月上宫花静煙含逺樹深銀䑓門已閉仙漏夜沉沉九重青鎻闥百尺碧雲樓明月秋風起珠簾上玉鈎逺别離云楊栁黄金穂梧桐碧玉枝春來消息斷早晩是歸時玳織鴛鴦履金装翡翠簾畏人相借問不擬到城南遊春辭云曉遊臨碧殿晩日上春亭芳樹羅仙苑晴山展翠屏一夜好風吹新花一萬枝風前調玉管花下簇金覊長相思云君行登隴上妾夣在閨中玉箸千行落銀牀一半空綺席春眠覺紗窓曉望迷䑃朧殘夢裡猶自在遼西年少行云少小邊城慣放狂驏騎蕃馬射黄羊如今年老無筋力猶倚營門數鴈行家本清河住五城湏憑弓箭覓功名等閑飛鞚秋原上猶向寒雲試射聲弓背霞明劍照霜秋風走馬出咸陽未收天子河源地不擬囘頭望故鄉霜滿庭中月滿樓金樽玉柱對清秋當年稱意湏為樂不到天明未肯休從軍行云荒鷄隔水啼汗馬向風嘶終日隨旌斾何時罷皷􅎏孤心眠夜雪滿眼是秋沙萬里猶防塞三年不見家却望氷河濶前登雪嶺髙征人幾多在又擬戰臨洮胡風千里驚漢月五更明縱有還家夢猶聞出塞聲暮雪迷青海隂霞覆白山可怜班定逺生入玉門闗塞下曲云雪滿衣裳氷滿鬚曉隨飛将伐單于平生志氣今何在把得家書淚似珠邉草蕭條塞鴈飛征人南望盡霑衣黄塵滿面長湏戰白髪生頭未得歸思君恩云小苑鶯歌歇長門蝶舞多眼看春又去翠輦不經過紫禁香如霧青天月似霜雲韶何處奏祗是在昭陽鷄鳴天漢曙鶯語禁林春誰入巫山夢唯應洛水神王昭君云錦車天外去毳幕雪中開魏闕蒼龍逺蕭闗赤鴈來仙娥今下嫁驕子自同和劔㦸歸田盡牛羊繞塞多望春辭云髙樓望見一花開便覺春光四面來曉日晴雲知次第東風不用更相催雲霞五采浮天闕梅栁千般夾御􅗂不上黄山南北望豈知春色滿神州楚久為太常博士詩云何日居三署終年尾百寮世傳之立春後言懐招李庭衙推云閑齋夜擊唾壺歌試望夷門奈逺何毎聽塞笳離夢斷時窺清鑑旅愁多稍驚宵漏丁丁促已覺春風習習和海内故人君最老花間鞭馬更相過節度宣武酬樂天夢得云蓬萊仙監樂天客曹郎劉為主客曽枉髙車客大梁見擁旌㫋治軍旅知親筆硯事文章愁看栁色懸離恨憶遞花枝助酒狂洛下相逄肯相寄南金璀錯玉凄凉劉詩云曽經謝病客遊梁今日相逄憶李王少有一身兼将相更能四面占文章白詩云馬頭拂栁時囘轡豹尾穿花暫亞槍誰引相公開口笑不逄白傳與劉郎楚自翰林學士拜相子綯自湖州召入翰林為學士間嵗拜相渭南尉趙嘏獻詩曰鶚在卿雲氷在壺代天才業奉訏謨榮同伊陟傳朱戸秀比王商入畵圖昨夜星辰為劍履前年風月滿江湖不知機務時多暇猶許詩家屬和無貞元七年杜黄裳知舉㣲服訪名士於尹樞樞言子弟有崔元略孤進有林藻令狐楚其年樞冠榜試珠還合浦賦藻賦成夢人謂曰何不叙珠來去之意既寤改之黄裳謂藻曰叙珠來去如有神助是年楚第五藻第十一楚字殻士徳棻之裔與李逄吉善元和末為相敬宗逐李紳楚自宣武節度徙天平入為左僕射開成間卒楚遊義興寺寄上李逄吉相公云栁營無事詣蓮宫相公乆住此寺歩歩猶疑是夢中勞役徒為萬夫長閑遊曽與二人同鸞凰飛去仙巢在龍象潜來􅊰席空松下花飛頻佇立一心千里憶梁公遊晉祠上李逄吉相公云不歴晉祠三十年白頭重到一凄然泉聲自昔鏘寒玉草色雖秋耀翠鈿少壯同遊寧有數尊榮再㑹便無縁相思臨水下雙淚寄入并汾向洛川張仲素聖神樂云玉帛殊方至歌鐘比屋聞華夷今一貫同賀聖明君海浪恬丹徼邉塵静黒山從今萬里外不復鏁蕭闗九陌祥煙合千春瑞月明宫花同苑栁先發鳯凰城宫中樂云網戸交如綺紗窗薄似煙樂吹天上曲人是月中仙翠匣開寒鏡珠釵掛歩揺粧成秪是曉更漏促清宵紅果揺池實金盤露井氷甘泉将避暑臺殿水光凝月彩浮鸞殿砧聲遶鳯樓笙歌臨水檻紅燭乍迎秋竒樹留寒翠神池結夕波黄山一夜雪渭水鴈聲多春遊云煙栁飛輕絮風榆落小錢濛濛百花裡羅綺競鞦韆騁望登香閣争髙下砌臺林間踏青去席上意錢來行樂三春節林花百和香當年重意氣先占闘鷄塲春閨怨云雪盡萱抽葉風輕水變苔玉闗書信絶又見發庭梅裊裊邉城栁青青陌上桑提籠忘採葉昨夜夢漁陽桂魄初生秋露㣲輕羅已薄未更衣銀筝夜久殷勤弄心怯空房不忍歸太平辭云風俗今和厚君王在穆清行看採花曲盡是泰階平聖徳超千古皇風静四方蒼生今息戰無事覺時長遊春曲云萬樹江邉杏新開一夜風滿園深淺色照在綠波中上苑何窮樹花開次第新香車與絲綺風静亦生塵送春辭云日日人空老年年春更歸相歡在樽酒不用惜花飛塞上曲云天驕逺塞行出鞘寳刀鳴定是酬恩日今朝覺命輕巻斾生風喜氣新早持龍節静邉塵漢家天子圗麟閣身是當今第一人贈逺云當年只是守空帷夢見江山覺别離不見鄉書傳鴈足唯看新月吐蛾眉厭攀楊栁臨青閣閑採芙蓉傍碧潭走馬臺邉人不見拂雲堆畔戰方酣閨人思云愁見遊空百丈絲春風惹斷更傷離閑花落徧蒼苔地盡日無人誰得知秋夜曲云丁丁漏水夜何長漫漫輕雲露月光秋逼暗蟲通夕響征衣未寄莫飛霜碧窓斜月藹清輝愁聽寒螿淚濕衣夢裡分明見闗塞不知何路向金㣲秋天一夜静無雲斷續鴻聲到曉聞欲寄征衣問消息居延城外又移軍博山沉燎絶餘香蘭燼金檠怨夜長為問青青河畔草幾囘經雨復經霜天馬辭云天馬初從渥水來郊歌曾唱得龍媒不知玉塞沙中路苜蓿殘花幾處開躞蹀宛駒齒未齊摐金噴玉向風嘶來時行盡金河道獵獵輕風在碧蹄緱山鶴詩羽客驂仙鶴將飛駐碧山映松殘雪在度嶺片雲還清唳因風逺高姿對水閑笙歌憶天上城郭歎人間幾覺霜毛潔殊知藻質班迢迢煙路逸奮翮詎能攀砌臺即今攃攃臺也仲素詩云冩望臨香閤登高下砌臺林間踏青去席上意錢來仲素字繪之建封之子憲宗以仲素段文昌為翰林學士韋賢之曰學士所以備顧問不宜專取辭藝罷之後終中書舎人右王涯令狐楚張仲素五言七言絶句共作一集號三舎人集今盡錄於此唐詩紀事巻四十二欽定四庫全書唐詩紀事巻四十三宋計敏夫撰竇參郎士元于良史舒元輿李諒李賀呂温呂恭段洪古何元上羊士諤馮宿柳宗元
