body:
  text: 邵大震李日知李景伯劉禕之王無競袁恕巳郭元振崔融張昌齡陳子昻字伯玉梓州人資褊躁然好施予篤朋友與陸餘慶王無競房融崔泰之盧藏用趙元最厚唐興文章承徐庾餘風子昻始變雅正為感遇詩三十八篇王適曰是必為海内文宗子昻趙貞固盧藏用杜審言宋之問畢隆澤郭襲㣲司馬承􅐃釋懷一陸餘慶號方外十友盧黄門藏用曰道䘮五百嵗而得陳君顔真卿曰若激昻頺俗雖無害於過正權其中論不亦傷於厚誣與沈隠侯論謝康樂靈均以來此祕未覩同也開寳中梓州刺史郭廷謂以詩哭之略曰魄逐東流水墳依獨坐山退之薦士詩曰國朝盛文章子昻始髙蹈黄門侍郎盧藏用祭文曰天之生也珠圓流兮玉方潔子之歿也太山頺兮良玉折士林閴寂兮人物踈門舘蕭條兮賔侣絶嘆佳城之不返辭玉階而長别鳴呼置酒祭子子不顧亢聲哭子子不廻唯天道而無託但無心而巳摧獨異記載子昻初入京不為人知有賣胡琴者價百萬豪貴傳視無辯者子昻突出謂左右曰輦千緡市之衆驚問答曰余善此樂皆曰可得聞乎曰明日可集宣揚里如期偕徃則酒肴畢具置胡琴於前食畢捧琴語曰蜀人陳子昻有文百軸馳走京轂碌碌塵土不為人知此樂賤工之役豈宜留心舉而碎之以其文軸遍贈㑹者一日之内聲華溢郡時武攸宜為建安王辟為書記感遇詩云微月生西海幽陽始代昇圓光正東滿隂魄巳朝凝太極生天地三元更廢興至精諒斯在三五誰能徵其一蘭若生春夏芊蔚何青青幽獨空林色朱蕤冐紫莖遲遲白日晚嫋嫋秋風生嵗華盡揺落芳意竟何成其二蒼蒼丁零塞今古緬荒途亭堠何摧兀暴骨無全軀黄沙幙南起白日隱西隅漢甲三十萬曾以事匈奴但見沙塲死誰憐塞上孤其三樂羊為魏將食子殉軍功骨肉且相薄他人安得忠吾聞山中相乃属放麑翁孤獸猶不忍况以奉君終其四市人矜巧智於道若童䝉傾奪相夸侈不知身所終曷見𤣥真子觀世玉壺中杳然遺天地乘化入無窮其五吾觀龍變化乃知至陽精石林何㝠宻幽洞無留行古之得仙道信與元化幷𤣥感非象識誰能測淪冥世人拘目見酣酒笑丹經崐崘有瑶樹安得采其英其六白日每不歸青陽時暮矣茫茫吾何思林卧觀無始衆芳委時晦鶗鴂悲鳴耳鴻荒古已頺誰識巢居子其七吾觀崐崘化日月淪洞冥精魄相交㑹天壤以羅生仲尼推太極老聃貴窈㝠西方金仙子崇議乃無明空色皆寂滅業縁定何成名教信紛藉死生俱未停其八聖人秘元命懼世亂其真如何嵩公軰詼譎誤時人先天誠為羙階亂禍誰因長城備敵國嬴禍發其親赤精既迷漢子年何救秦去去桃李花多言死如麻其九深居觀群動悱然争朶頥群動相啖食利害紛㘈㘈便便夸毗子榮耀更相持務光讓天下商賈競刀錐已矣行采芝萬世同一時其十吾愛鬼谷子青谿無垢氛囊括經世道遺身在白雲七雄方龍闘天下亂無君浮榮不足貴遵飬晦時文舒可彌宇宙巻之不盈分豈徒山朩壽空與麋鹿群其十一呦呦南山鹿離罟以媒囮招揺青桂樹幽蠧亦成科世情甘近習榮耀紛如何怨憎未相復親愛生禍羅瑶臺傾巧笑玉杯殞䨇娥誰見枯城蘖青青成斧柯十二林居病時乆水朩澹孤清閑卧觀物化悠悠念無生青春始萌逹朱火巳滿盈殂落方自此感歎何時平十三臨岐泣世道天命良悠悠昔日殷王子玉馬遂朝周寳鼎淪伊􅥃瑶臺成古邱西山傷遺老東陵有故侯十四貴人難得意賞愛在須臾莫以心如玉探他明月珠昔稱夭桃子今為舂市徒鴟鴞悲東國麋鹿泣姑蘇誰見鴟夷子扁舟去五湖其十五聖人去巳乆公道緬良難蚩蚩夸毗子堯禹以為謾驕榮貴工巧勢利迭相干燕王尊樂毅分國願同歡魯連讓齊爵遺組去邯鄲伊人信徃矣感激為誰歎十六幽居觀天運悠悠念群生終古代興沒豪聖莫能争三季淪周赧七雄滅秦嬴復聞赤精子提劒入咸京炎光既無象晉魏紛縱横堯禹道已昧昬虐勢方行豈無當世雄天道與邊兵咄咄安可言時醉而未醒仲尼溺東夏伯陽遁西溟大運自古來旅人胡歎哉十七逶迤世巳乆骨鯁道斯窮豈無感激者時俗頺此風灌園何其鄙皎皎於陵子世道不相容嗟嗟張長公十八聖人不利巳憂濟在元元黄屋非堯意瑶臺安可論吾聞西方化清浄道彌敦奈何窮金玉彫刻以為尊雲架山林盡瑶圖珠翠煩鬼功尚未可人力安能存夸愚適增累矜智道逾昬十九𤣥天幽且黙群議曷嗤嗤聖人教猶在世運乆陵遲一䋲將何繋憂醉不能持去去行采芝勿為塵所欺二十蜻蛉遊天下與世本無患飛飛未能止黄雀來相干穰侯富秦寵金石比交歡出入咸陽裏諸侯莫敢言寜知山東客激怒秦王肝布衣取丞相千載為辛酸二十一微霜知嵗晏斧柯始青青况乃金天乆浩露霑群英登山望宇宙白日巳西暝雲海方蕩潏孤鱗安得寜二十二翡翠巢南海雄雌珠樹林何知羙人意驕愛比黄金殺身炎洲裏委羽玉堂隂旖旎光首飾葳蕤爛錦衾豈不在遐逺虞羅忽見尋多材信為累歎息比珍禽二十三挈缾者誰子姣服當青春三五明月滿盈華不自珍髙坐委金玉微縷懸千鈞如何負公鼎被敓笑時人二十四寒蟬號白露兹歳巳蹉􅋸群物從大化孤英將奈何瑶臺有青鳥逺食玉山禾崐崘見𤣥鳯豈復虞雲羅二十五荒哉穆天子始與白雲期宫女多怨曠層城閉峨眉日晚瑶臺樂豈傷桃李時青苔空萎絶白髪生羅帷二十六朝發宜都渚浩然思故鄉故鄉不可見但見巫山陽巫山彩雲沒髙邱正微茫佇立望巳乆涕涙霑衣裳豈兹越鄉感憶昔楚襄王朝雲無處所荆國亦淪亡二十七昔日章華宴荆王樂荒滛霓旌翠羽蓋射兕雲夢林朅來髙唐觀悵望陽雲岑雄圖今何在黄雀空哀吟二十八丁亥歳云暮西山事甲兵贏糧市卭道荷㦸爭羗城嚴冬隂風勁窮岫油雲生昬黷無晝夜羽檄復相驚拳跼競萬仞崩危走九冥籍籍峰壑裏哀哀氷雪行聖人御宇宙聞道太階平肉食謀何失藜藿緬縱横二十九可惜瑶臺樹灼灼佳人姿碧華映朱實攀折青春時豈不盛光寵榮君白玉墀但恨紅芳歇凋傷感所思三十朅來豪遊子勢利禍之門如何蘭膏歎感激自生寃衆趨明所避時棄道猶存雲淵既巳失羅網與誰論箕山有髙節湘水有清源唯應白鷗鳥可為洗心言三十一索居猶幾日炎夏忽然衰陽彩皆隂翳親友盡暌違登山望不見涕泣乆漣洏宿昔感顔色若與白雲期世中驕豪子驅逐正嗤嗤蜀山與楚水携手在何時三十二金鼎合神丹世人將見欺飛飛騎羊子胡乃在峨眉變化固幽類芳菲能幾時疲痾苦淪世憂痗日侵淄眷然顧幽褐白雪空涕洟其三十三朔風吹海樹蕭條邊巳秋亭上誰家子哀哀明月樓自言幽燕客結髪事逺遊赤丸殺公吏白刄報私讎避仇至海上被役此邊州故鄉三千里遼水復悠悠每憤邊兵入常為漢國羞何知七十載白首未封侯三十四本為貴公子平生實愛才感時思報國拔劒起蒿萊西馳丁零塞北上單于臺登山見千里懷古心悠哉誰言未忘禍磨沒成塵埃其三十五浩然坐何慕吾蜀有峨眉念與楚狂子悠悠白雲期時哉悲不㑹涕泣乆漣洏夢登西山冗南采巫江芝探元觀造化遺世從雲螭婉孌時永矣感悟不見之其三十六朝入雲中郡北望單于臺二國何宻邇沙朔氣雄哉藉藉天驕子猖狂已復來塞垣無名將亭堠空崔嵬咄嗟吾何歎邊人塗草萊其三十七仲尼探元化幽鴻順陽和大運自盈縮春秋逓來過盲飈忽號怒萬物相紛劘溟海皆震蕩孤鳯其如何其三十八邵大震九日登𤣥武山旅眺云九月九日望遥空秋水秋天生夕風寒鴈一向南飛逺遊人幾度菊花叢盧照隣和云九月九日眺山川歸心歸望積風煙他鄉共酌金花酒萬里同悲鴻鴈天𤣥武山在今東蜀髙宗時王勃以檄鷄文斥出沛王府既廢客劒南有遊𤣥武山賦詩照隣為新都尉大震其同時人也勃詩云九月九日望鄉臺他席他鄉送客杯人今巳厭南中苦鴻鴈那從北地來李日知鄭州人景龍初為相初安樂公主館第成中宗臨幸燕從官賦詩日知卒章曰所願但知居者樂無使時稱作者勞獨以規誡睿宗他日謂曰嚮時雖朕亦不敢諫非卿亮直何能爾即拜侍郎亮直唐書本傳作挺直李景伯中宗宰相懷逺之子景龍初為諫議大夫中宗宴侍臣酒酣各命為廽波辭景伯獨為箴規語帝不悦蕭至忠曰真諫官也廻波辭曰廻波爾時酒巵微臣職在箴規侍宴既過三爵喧譁竊恐非宜劉禕之字希羙常州人與孟利貞髙智周郭正一俱有名號劉孟髙郭上元中與元萬頃等偕召入禁中論次新書髙宗又宻與參决時政以分宰相權時謂北門學士武后時以罪賜死九成宫秋初應制詩云𤣥圃䟽金闕仙臺駐玉鑾野分仙鸑岫路接寳鷄壇林樹千霜積山宫四序寒蟬急知秋早鶯踈覺夏䦨怡神紫氣外凝睇白雲端舜海詞波發空驚游聖難和太子納妃公主出降詩曰夢梓光青陛穠桃藹紫宫德優宸念逺禮備國姻崇萬戸聲明發三條騎吹通香輪送重景綵斾引仙虹奉和别越王詩云周屏辭金殿梁驂整玉珂管聲依折柳琴韻動流波鶴葢分隂促龍軒别念多延襟小山路還起大風歌王無競字仲列宋太尉𢎞之裔氣豪縱下筆成章為殿中侍御史張易之等誅坐嘗交貶廣州仇家矯制榜殺之巫山詩云神女向髙唐巫山下夕陽徘徊作行雨婉孌逐荆王電影江前落雷聲峽外長霽雲無處所臺館曉蒼蒼宋之問下山歌云下嵩邱兮多所思携佳人兮歩遲遲松間明月長如此君再遊兮復何時無競和云日云暮兮下嵩山路連綿兮樹石間出谷口兮見明月心徘徊兮不能還袁恕巳詠屏風云綺閣雲霞滿芳林草樹新鳥驚疑欲曙花笑不關春山對彈琴客溪流垂釣人請看車馬客行處有風塵恕巳滄州人與誅二張相中宗及貶周利正逼殺之郭元振古劒歌云君不見昆吾鐡冶飛炎煙紅光紫氣俱赫然良工鍜鍊凢幾年鑄得寳劒名龍泉龍泉顔色如霜雪良工嗟咨歎竒絶瑠璃玉匣吐蓮花錯鏤金環生明月正逄天下無風塵幸得周防君子身精光黯黯青虵色文章片片緑龜鱗非直結交遊俠子亦曾親近英雄人何言中路遭棄捐零落飄淪古獄邊雖復沉埋無所用猶能夜夜氣衝天子羙過代公故宅詩云壯公臨事斷顧歩涕横落髙詠寳劒篇神交付溟漠元振尉通泉任俠使氣撥去小節武后知所為召欲詰既與語竒之索所為文章上寳劒篇后覧嘉嘆詔示學士李嶠等乆戍人将老長征馬不肥元振警句也元振嘗山居夜有人面如盤出燈下元振以此詩題其頰遂㓕明日出行巨朩上有白耳此句在焉元振魏州人年十六與薛稷趙彦昭同為大學生姿雄邁景雲中位宰相崔融融字成安齊州人擢八科髙第與李嶠蘇味道王紹宗附易之兄弟杜審言為融所奬引為服緦麻子禹錫翹知名孫巨曾孫從和宋之問寒食題黄梅臨江驛云春分自淮北寒食渡江南忽見潯陽水疑是宋家潭明主閽難呌孤臣逐未堪遥思故園陌桃李正酣酣宋之問詩云馬上逄寒食愁中屬暮春可憐江浦望不見洛橋人北極懷明主南溟作逐臣故園膓斷處日夜桞條新戸部尚書崔公挽歌云八座圖書委三臺章奏盈舉杯常有勸曵履忽無聲市若荆州罷池如薛縣平空餘濟南劒天子署髙名詠劒詩云寳劒出昆吾龜龍夾采珠五精初獻術千戸競論都匣氣衝牛斗山形轉轆轤欲知天下貴持此問風胡則天皇后挽歌云前殿臨朝罷長陵合葬歸山川不可望文物盡成非隂月霾中道軒星落太微空餘天子孝松上景雲飛韋長史挽詞云日落桑榆下寒生松栢中㝠㝠多苦霧切切有悲風京兆新阡闢扶陽甲第空郭門從此送荆棘漸蒙籠崔融瓦松賦序曰崇文館瓦松者産于屋霤之下謂之朩也訪山客而未詳謂之草也驗神農而罕記賦云煌煌特秀狀金芝之産霤歴歴虛懸若星榆之種天葩條郁毓根柢連巻間紫苔而裛露凌碧瓦而含煙又曰慙魏宫之烏悲惡漢殿之紅蓮崔公博學莫不該悉豈不知瓦松巳有舊説乎博雅云在屋曰昔邪在墻曰垣衣廣志謂之香生於乆屋之瓦魏明帝好之命長安西載其瓦於洛陽以覆屋前代詞人詩中多用昔邪梁簡文詠薔微曰縁堦覆碧倚依簷映昔邪或言屋上朩多松栽土朩氣洩則瓦松生出酉陽雜爼烏悲字未詳乆視元年改控鶴府為奉宸府張易之為奉宸令引詞人為供奉佞者奏云昌宗王子晉後身令被羽衣吹簫乘朩鶴奏樂於庭融賦詩為絶唱有昔遇浮邱伯今同丁令威中郎才貎是藏史姓名非之句後與宰相蘇味道相誚云某詩所以不及相公無銀花合也蘇有詩云火樹銀花合味道云子詩雖無銀花合還有金銅丁取令威之句也融為文華婉當時未有輩者朝廷大筆多手敕委之譔武后哀冊最髙麗絶筆而死時謂思苦神竭云張昌齡冀州人與兄昌宗皆能文昌齡舉進士與王公治齊名皆為考功王師旦所絀太宗問之荅曰昌齡等華而少實其文浮靡非令器也取之則後生勸慕亂陛下風雅帝然之後獻翠㣲宫頌敕於通事舍人裏洪奉賀蘭敏之奏豫北門修撰卒南部新書云昌齡與文皇作息兵詔嘆曰禰衡潘岳之儔也唐詩紀事巻八欽定四庫全書唐詩紀事巻九宋計敏夫撰李適
