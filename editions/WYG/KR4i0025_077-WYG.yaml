seq: 77
front:
  text: 僧僧巒僧曇域
  hash: sha256:4ac012874cd3ac5b47d7a36ad495f7bc3f3d68b42481fbc1aa80cf675b462857
body:
  text: 僧懐楚僧懐浦僧慕幽僧尚顔僧善生僧栖一垓下懐古云緬想咸陽事可嗟楚謌哀怨思無涯八千子弟歸何處萬里鴻溝屬漢家弓指陣前爭日月血流垓下定龍蛇㧞山力盡烏江水今古悠悠空浪花武昌懐古云戰國城池盡悄然昔人遺迹遍山川笙歌罷吹幾多日臺榭荒凉七百年蟬響夕陽風滿樹鴈横秋島雨來天傷嗟世事如流水空見蘆花一釣舩僧可止贈楚川長老云瘦顔顴骨見滿靣雪毫垂坐石鳥疑死出門人謂癡照身潭入楚浸影檜生隋太白曽經夏清風涼四肢哭賈島云燕生松雪地蜀死塟山根詩僻降今古官卑悞子孫塜欄寒月色人哭苦吟魂暮雨滴碑字年年添蘚㾗送僧云四海無拘繫行心興自濃百年三事衲萬里一枝笻夜減當晴影春消過雪蹤白雲深處去知宿在何峰寄麥積山㑹如長老云黙然如大道塵世不相闗青檜行時靜白雲禪處閑貧髙一生行病長十年顔夏滿期游寺尋山又下山雪十二韻云落處咸過尺翛然物像凄瑞凝金殿上寒甚玉闗西潤比江河普明將日月齊凌雲花頂膩鎻徑竹梢低出谷樵人怯歸林野鳥迷煑茶融破練磨墨染成黳䧟兎埋平驛和魚凍合溪入樓消酒力當檻冩詩題道路依憑馬朝昬委託鷄洞深􅆐作族松亞鶴移栖及夏清岩穴經春溜石梯豐年兼泰國天道育黥黎山居云雪消春力展花澷洞門垂果長纎枝曲嵓崩直道移重猨圍淺井闘䑕下踈籬寒食煙微有髙風勢徹陂僧卿雲秋日江居閑詠云寄居江島邊閑詠見秋殘草白牛羊瘦風髙􅆐鳥寒檢方毉故疾挑薺偹中餐時復停書巻鋤沙種朩蘭送人游塞云去去玉闗路省君曽未行塞深多伏冦時靜欲屯兵雪毎先秋降花常近夏生閑陪射雕將應到受降城長安言懐寄沈彬侍郎云故園黎嶺下歸路接天涯生作長安草勝為邊地花鴈南飛不到書北寄來賖堪羡神仙客青雲早致家舊國里云舊居黎嶺下風景近炎方地暖生春草家貧覺歳長石房雲過濕松逕雨餘香日乆覺無事詩書聊自強僧處黙題聖果寺云路自中峰上盤廻出薜蘿到江呉地盡隔㟁越山多古朩叢青靄遥天浸白波下方城郭近鐘磬接笙歌山中作云蓆簾髙挂枕髙欹門揜垂蘿蘸碧溪閑把史書眠一覺起來山月過松西螢云熠熠與娟娟池塘竹樹邊亂飛如拽火成聚却無烟㣲雨洒不滅輕風吹欲然昔時書案上頻把作囊懸逺烟云靄靄前山上凝光滿薜蘿髙風吹不盡逺樹得偏多翠與晴雲合輕將淑氣和正堪流野目朱閤意如何送僧遊西域云一盂兼一錫秪此度流沙野性難為客禪心即是家寺投雲嶠雪路入曉天霞自説遊諸國回應歳月賖憶廬山舊居云麄衣糲食老烟霞勉抱衰顔惜歳華獨鶴秪為山客伴閑雲常在野僧家叢生嫰蕨沾松粉自落乾薪帯蘚花明月清風舊相識十年歸恨可能賖題栖霞僧房云名山不取買山錢任創花宫近碧巔松桂老依雲裏寺樓臺深鎻洞中天風經險嶂廻踈雨石倚危屏掛落泉欲結茅庵共師坐肯饒多少薜蘿煙織婦云蓬鬢蓬門積恨多夜䦨燈下不停梭成縑猶自賠錢納未直青樓一曲歌僧淡交病後作云未得身亡法此身終未安病膓猶可洗瘦骨不禁寒藥少心神餌經無氣力㸔悠悠片雲質獨坐夕陽殘寫真云圖形期自見自見却傷神已是夢中夢更逄身外身水花凝幻質墨彩染空塵堪笑余兼爾俱為未了人効古云榮辱又榮辱一何翻與覆人生百歳中孰肯死前足𤣥鬢忽如絲青叢不再緑自古爭名徒黄金是誰禄僧若虚樂真觀云樂氏騎龍上碧天東呉遺宅尚依然悟來大道無多事真後丹元不直錢老樹夜風蟲咬葉古垣春雨蘚生甎松傾烏死桑田變華表歸鄉未有年懐廬山舊隱云九疊嵯峨倚着天毎隨寒瀑下岩烟深秋狷鳥來心上夜靜杉松到眼前書架想遭苔蘚褁石窓應被薜蘿纒一枝笻杖遊江北不見爐峰二十年古鏡云軒后洪爐獨鑄成蘚㾗磨落月輪呈萬般物像皆能鑒一箇人心不可明匣内乍開鸞鳯活臺前髙掛鬼神驚百年肝膽堪將比只怕頻㸔素髪生僧僧巒蜀中送人遊廬山云君遊正值芳春月蜀道千山皆秀發溪邊十里五里花雲上三峰五峰雪君上匡山我舊居松蘿抛擲十年餘君行試到山前問山鳥只今相憶無牧童云牧童見人俱不㑹盡着芒鞵戴簔笠朝陽未出衆山時露滴簔衣猶半濕二月三月時平原草初緑三箇五箇騎羸牛前村後村未放牧笛聲纔一舉衆稚齊歌舞㸔㸔白日又西斜各自騎牛又歸去逄老人云路逄一老翁兩鬢白如雪一里二里行四回五回歇僧曇域宿鄭諫議山居云堂開星斗邊大諫採薇還禽隱石中樹月生池上山涼風吹詠思幽語隔禪闗莫擬歸城計終防此地閑懐齊已云鬢髯秋景兩蒼蒼靜對茅齋一炷香病後身心俱澹薄老來朋友半凋傷峨眉山色侵雲直巫峽灘聲入夜長猶喜深交有支遁時時音信到松房贈島雲禪師云逺庵枯葉滿羣鹿亦相隨頂骨生新髪庭松長舊枝禪髙太白月行出祖師碑亂後潜來此南人總不知僧懐楚謝友人見訪留詩云軒車誰肯到泉石自相親暮雨凋殘寺秋風悵望人庭新一片葉衣故十年塵頼有瑶華贈清吟愈病身送新平故人云逺聽鶬鶊思舊友又因蝴蝶夢生涯一千餘里河連郭三十六峰寒到家隂島宜分東曉鴈晴樓髙入上陽鴉姜原廟北與君别應咲薄寒悲落花僧懐浦贈智丹三藏云壮歳心難伏師心伏豈難尋常獨在院行坐不離壇嶽雪當禪暝松聲入呪寒更因文字外多把史書㸔初冬旅舎早懐云枕上角聲㣲離情未息機夢回三楚寺寒入五更衣月沒栖鳥動霜晴凍葉飛自慙行役早深與道相違僧慕幽冬日淮上别文上人云家國各萬里同吟六七年可堪隨北鴈迢逓向南天水共行人逺山將落日連春淮有雙鯉莫忘尺書傳酬和友人見寄云勞歌好自㸔終乆偶齊桓五字若教易一名爭得難侵窻紅樹老䕃砌雪花殘莫効齊僚屬東歸剪釣竿劍客云去住知何處空將一劍行殺人雖取次為事愛公平㦸立嗔髭鬢星流忿眼睛曉來湘市説拂署别遼城柳云今古憑君一贈行幾回折盡復重生五株斜傍淵明宅千樹低垂大尉營臨水帯烟藏翡翠倚風兼雨宿流鶯隋皇堤上依依在曽惹當時歌吹聲燈云鐘斷危樓鳥不飛熒熒何處最相宜香然水寺僧開巻筆寫春幃客著詩忽爾思多穿壁處偶然心盡斷纓時孫康勤苦誰能念少減餘光借與伊三峽聞􅆐云誰向兹來不恨生聲聲聲是斷腸聲七千里外一家住十二峰前獨自行嶂雨晩藏神女廟蠻煙寒鏁夜郎城憑君且莫哀吟好㑹待青雲道路平僧尚顔言興云矻矻被吟牽因師賈閬仙江山風月處一十二三年雅頌在於此浮華致􅄼邊猶慚功未至謾道近千篇懐陸龜蒙處士云布褐東南隱相傳繼謝敷髙譚夫子道靜㸔海山圖事厄傷心否碁逄敵手無闗中花數内獨不見菖蒲寄方干處士云格外綴清詩詩名獨得知閑居公道日醉卧牡丹時海鳥和濤望山僧帯雪期仍聞稱處士聖主肯相違送陸肱入闗云舟行復陸行始得到咸京准擬何人口吹嘘六義名亂山逄減翠叢菊早含英衣錦還鄉日他時有此榮早春送人歸岳陽云乆食主人魚春來復舊居逺無千里浪輕有半船書過片晴雲淡消殘暮雪虛岳陽多異境搜思勿令踈寄劉逸士云無愁無累者偶向市朝遊此後乗孤艇依前入亂流髙眠歌聖日下釣坐清秋道不離方寸而能混俗求寄陳陶處士云鍾陵城外住喻似玉沉泥道直貧嫌殺神清語亦低雪深加酒債春盡減詩題記得曽邀宿山茶又更携僧善生送玉禪師云飄然無定跡逈與律乗違入郭隨縁住思山破夏歸盂擎數家飯衲乞幾人衣洞了曹溪㫖寧輸俗者機送智光之南值雨云結束衣囊了炎州定去遊草堂方惜别山雨為相留又得一宵話免生千里愁莫辭重卜日後㑹必驚秋旅中答喻軍事問客情云一自遊他國相逄少故人縱然為客樂爭似在家貧畜恨霜侵鬢搜詩病入神若非憐片善誰肯問風塵贈盧逸人云髙眠岩野間至藝敵應難詩苦無多首藥靈惟一丸引泉魚落釡攀果露沾冠已得􅄞康趣逄迎事毎䦨劉夢得送舉師序云近古而降釋子以詩聞于世者相踵焉因定而得境故翛然以清由慧而遣辭故粹然以麗信禪林之蘤萼而戒河之珠璣也柳儀曹謂文郁師背笈篋懐筆牘挾海泝江獨行山林間翛翛然模狀物態搜伺隱隙登髙逺望悽愴超忽游其心以求勝語若有程督之者此一節論浮屠能詩者故載于巻末唐詩紀事巻七十七欽定四庫全書唐詩紀事巻
