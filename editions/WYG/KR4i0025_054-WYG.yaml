seq: 54
front:
  text: 本來踈露氣寒光盡㣲陽下楚􅏀猿啼洞庭樹人在朩蘭舟楚江懐古句夜乆遊子息月明岐路閑句却意軒羲日無人尚戰功句右張為取作主客圖
  hash: sha256:dd16547b711842ace640031f2716e9880891feb473884bc107cdcfe7da129658
body:
  text: 孟遲懐鄭洎云風蘭舞幽香雨葉墮寒滴美人來不來前山看向夕發蕙風舘遇隂不見九華山有作云我來淮隂城千江萬山無不經山青水碧千萬丈竒峰急𣲖何縱横又聞九華山山頂連青冥太白有逸韻使我西南行一歩一攀䇿前行正鷄鳴隂雲冉冉忽飛起千里萬里危崢嶸譬如天之有日蝕使我昬沉猶不明人家敲鏡救不得光影却屬貪狼星恨亦不能通言亦不足聼長鞭揮馬出門去是以九華為不平遲字遲之登㑹昌五年進士第廣陵城云紅映樓臺緑遶城城邊春草傍墻生隋家不向此中盡汴水應無東去聲又有過垓下之句云天地有時饒一擲江山無主任平分過驪山云冷月㣲煙渭水愁華清宫樹不勝秋霓裳一曲千門鎻白盡梨園弟子頭已上數篇張為取作主客圖遲與杜牧之友善牧之嘗有池州送遲詩其間云烟濕樹姿嬌雨餘山態活仲秋徃歴陽同上牛磯歇大江吞天去一練横紳抹歴陽裴太守襟韻苦超越鞔鼓畵騏驎㸔君擊狂節離袖颭應勞恨粉啼還咽明年忝諌官緑樹秦川闊子提徤筆來勢若夸父渇九衢林馬檛千門識車轍秦臺破心膽黥陣驚毛髪子固屈一鳴余固直三刖又曰丹鵲東飛來喃喃送君札呼兒旋去聲供衫走馬空踏襪手把一枝物桂花香帯雪喜極至無言笑餘翻不悦又送遲詩云手撚金僕姑腰懸玊轆轤爬頭峰北正好去係取可汗鉗作奴六宫雖念相如賦其那防邊重武夫金華子云遲陳商門生為浙西掌書記以䜛罷至淮南崔相國奏掌書記後以詩寄浙右幕中曰由來惡舌駟難追自古無媒謗所歸句踐豈能容范蠡李斯何暇救韓非巨拳豈為雞揮肋强弩那因䑕發機慚愧故人同鮑叔此心江栁尚依依南卓子厚在栁州吕温嘲之曰栁州栁刺史種栁栁江邊栁管依然在千株栁拂天後卓為黔南經畧使故人嘲曰黔南南太守南郡在雲南閑向南亭醉南風變俗談初為拾遺與崔黯因諫出宰黯為支江卓為松滋卓贈副戎等詩曰翺翔曽在玊京天墮落江南路幾千從事不湏輕縣宰滿身猶帯御爐烟卓字昭嗣大中時為黔南觀察使鄭顥顥宰相絪之孫登甲科以起居郎尚主有噐識宣宗時恩寵無比嘗夢中得句云石門霧露白玊殿莓苔青續成長韻此一聮杜甫集中詩也大中十年顥放牓後謁假覲省於洛生徒餞長樂驛俄有紀於屋壁云三十驊騮一烘塵來時不鎻杏園春楊花滿地如飛雪應有偷遊曲水人舊史云顥絪之子尚宣宗女萬壽公主因壽昌節上壽回夢一宫殿與數十人納凉聮句既悟省石門之句十字恠其不祥不數日宣宗弓劒上僊方悟其事乃續為十韻云間歳流虹節歸軒出禁扄奔波逃畏景蕭洒夢殊庭境象非曽到崇嚴昔未經日斜烏歛翼風動鶴梳翎異苑人爭集凉臺筆不停石門霧露白玊殿莓苔青若匪灾先兆何縁思入冥御爐虚仗馬華蓋負云亭白日成千古金縢閟九齡小臣哀絶筆湖上泣青萍御爐或作丹墀未幾顥亦卒李羣玊羣玊好吹笙善急就章喜食鵞及授校書郎東歸盧肇送詩云妙吹應諧鳯工書定得鵝杜丞相悰筵中贈羙人云裙拖六幅瀟湘水鬢聳巫山十朶雲貌態祇應天上有歌聲豈合世間聞胷前瑞雪燈斜照眼底桃花酒半醺不是相如憐賦客肯教容易見文君羣玊觧天禄之任而歸涔陽經二妃廟題云小袁洲北浦雲邊二女明粧玊儼然野廟向江春寂寂古碑無字草芊芊風廻日暮吹芳芷月落山深哭杜鵑猶似含嚬望廵守九疑凝黛隔湘川又曰黄陵廟前春已空子規啼血滴松風不知精爽歸何處疑是行雲秋色中羣玊疑春空遂至秋色欲易之恍若有物告以二年之兆時尋陽太守段成式志其事二年後果死於洪井段以詩哭之曰曾話黄陵事今為白日催老無兒女累誰哭到泉臺羣玊字文山澧州人裴休觀察湖南厚延致之及為相以詩論薦授校書郎杜牧送羣玊赴舉詩曰故人别來靣如玊一榻拂雲秋影中玊貌花紅三百首五陵誰唱兩春風或曰羣玊受相府之知進詩三百篇授麟臺讎校黄陵廟前莎草春黄陵女兒茜裙新輕舟小檝唱歌去水逺天長愁殺人羣玊賦黄陵廟詩也或曰李逺之作方干經羣玊故居云訐直上書難遇主衘寃下世未成翁琴樽劒鶴誰将去惟鏁山齋一樹風温庭筠彦博裔孫與李商隐俱有名號温李與貴胄裴誠令狐髙等蒱飲狎眤為襄陽廵官郭處士擊甌歌云吉栗金虬石潭古勺陂澹灔幽脩語湘君寳馬上神雲砕珮叢鈴滿煙雨吾聞三十六宫花離離軟風吹春星斗稀玊宸冷磬破昬夢朩露未乾香著衣蘭釵委墜垂雲髮小響丁當逐廻雪晴碧煙滋重疊山羅屏半掩桃花月太平天子駐雲車龍鑪勃鬰雙蟠挐宫中近臣抱扇立侍女低鬟落翠花亂珠觸續正跳蕩傾頭不覺金烏斜我亦為君長嘆息緘情逺寄愁無色莫霑香夢緑楊絲千里春風正無力陽春曲云雲母空忩曉煙薄香昬龍氣疑輝閣霏霏霧雨杏花天簾外春寒著羅幕曲欄伏檻金麒麟沙苑芳郊連翠茵廐馬何能嚙芳草路人不敢隨流塵庭筠才思艶麗工於小賦毎入試押官韻作賦凡八义手而八韻成時號温八义多為隣鋪假手號曰救數人也而士行玷缺搢紳薄之李義山謂曰近得一聮句云逺比趙公三十六年宰輔未得偶句温曰何不云近同郭令二十四考中書宣宗嘗賦詩上句有金步摇未能對遣求進士對之庭筠乃以玊條脱續也宣宗賞焉又藥名有白頭翁温以蒼耳子為對他皆類此宣皇愛唱菩薩蠻詞丞相令狐綯假其修撰宻進之戒令勿洩而遽言於人由是踈之温亦有言云中書内坐将軍譏相國無學也宣皇好㣲行遇於逆旅温不識龍顔傲然而詰之曰公非長史司馬之流帝曰非也又曰得非六参簿尉之類帝曰非也謫為方城尉其制詞曰孔門以徳行為先文章為末爾既徳行無取文章何以補焉徒負不覊之才罕有適時之用竟流落而死杜悰自西川除淮海廷筠詣韋曲杜氏林亭留詩云卓氏壚前金線栁隋家堤畔錦㠶風貪為兩地行霖雨不見池蓮照水紅豳公聞之遺絹千疋曽於江淮為親表辱之由是改名廷筠又改名舉塲多為舉人假手沈詢知舉施鋪席授廷筠不與諸公隣比困於塲屋卒無成而終令狐綯曾以舊事訪於廷筠對曰事出南華非僻書也或兾相公爕理之暇時宜覧古綯益怒奏廷筠有才無行卒不登第廷筠有詩曰因知此恨人多積悔讀南華第二篇廷筠五丈原詩云鐡馬雲雕共絶塵栁隂髙壓漢營春天晴煞氣屯闗右夜半長星照渭濵下國卧龍空誤主中原得鹿不因人象床錦帳無言語從此譙周是老臣過新豐云一劒乘時帝業成沛中鄉里到咸京寰區已作皇都貴風月猶含白社情泗水舊亭春草遍千門遺瓦古苔生至今留得離家恨雞犬相聞落照明蘇武廟云蘇武魂銷漢使前古祠髙樹兩茫然雲邊鴈斷胡天月隴上羊歸塞草煙回日樓臺非甲帳去時冠劒是丁年茂陵不見封侯印空向秋波哭逝川周繇繇字為憲池州人及咸通進士第以明皇夢鍾馗賦知名弟繁亦工為詩調池之建徳令李昭象以詩送曰投文得仕而今少佩印還家古所榮後以御史中丞與段成式韋蟾温庭皓同遊襄陽徐商幕府繇有㸔牡丹贈段成式詩云金蘂霞英疊彩香初疑少女出蘭房逡廵又是一年别寄語集仙呼索郎成式前㸔恡酒絶句贈繇曰太白東西飛正狂新篘石凍雜梅香詩中反語常廻避尤恠花前呼索郎繇又以人參遺成式有詩云人形上品傳方志我得真英自紫團慙非叔子空持藥更請伯言審細㸔式求人參詩曰少賦令才猶强作衆醫多失不能呼九莖仙草真難得五葉靈根許恵無襄陽中堂賞花繇與妓人戯語成式嘲之曰鸎裏花前選孟光東山逋客酒初狂素娥畢竟難防備燒得河車莫遣嘗繇和云廻簮轉黛喜猜防粉署裁詩助酒狂若遇仙丹偕羽化便隨簫史亦何傷成式不赴光風亭夜宴贈繇云屏開屈膝見呉娃蠻臘同心四照花姹女不愁難管領斬新鈆裏得黄牙繇和云玊樹瓊筵映彩霞澄虛樓閣似仙家只縁存想歸蘭室不向春風㸔夜花廣陽公宴成式速罷馳騁坐觀花艶或有眼飽之嘲繇賦詩云蹙鞠且徒為寧如目送時報讎慙選耎存想恨逶遲促坐疑辟咡㗸盃强朶頥恣情窺窈窕曽恃好風姿色授應難奪神交願莫辭請君㸔曲譜不負少年期段成式和并序云近者初開金埒大敞紅筵騎歴塊而風生鼓摻撾而雷發成式未曽盤馬徒效執鞭喜過君子之營徒接将軍之地以欵叚辭退因得坐觀是時滿目鈆黄逆鼻蘭麝晩薪餘論有屬恨織素而不憐斜柯新知歎因針而難假化符端公妾換名馬賦闢長門莫逆賞心形於善謔為憲老舅吟飄白雪思効碧雲六韻傳觀不得落地鏗如佩玉粲若列星僦眼詎貴於千金貸心只勞於一句輙鳴瓦釡方應金鐃拗拙冝咍足代諧笑詩云才甘魚目並藝怯馬蹄間王謝初飛蓋姫姜盡下山縳雞難角逐射雉豈開顔亂翠移林色狂紅照座殷防梭齒雖在乞㡌鬢慙斑儻恕相如瘦應容累騎還庭筠和云齊馬馳千駟盧姫逞十三玳筵方盼眄金勒自䟃􅑗墮珥情初洽鳴鞭戰未酣神交花苒苒眉語栁􅆴􅆴栁呉興云窓踈眉語度却畧青鸞鏡翹翻翠鳯篸專城有佳對寧肯顧春蠶唐詩紀事巻五十四欽定四庫全書唐詩紀事巻五十五宋計敏夫撰周墀王起盧肇丁稜姚鵠髙退之孟球劉耕裴翻樊驤崔軒蒯希逸林滋李宣古黄頗張道符􅏀上卿石貫李潜孟守唐思言左牢金厚載王甚夷
