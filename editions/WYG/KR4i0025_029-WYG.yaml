body:
  text: 常衮張衆甫田澄桞郴李彥逺薛􅀢元載張元宗楊郇伯髙拯梁鍠劉長川姚倫孫處立劉復朱彬戴叔倫于鵠王季文常衮晩秋集賢院即事寄徐薛二侍郎云穆穆上清居沉沉中秘書金鋪深内殿石甃盡寒渠花樹臺斜倚宫煙閣半虚縹囊鋪錦綉翠軸巻瓊琚墨潤氷文繭香消蠧字魚翻黄桐葉老吐白桂花初舊徳雙遊處聮芳千載餘比朝榮庾薛西漢盛嚴徐侍講親華扆徴詩歩綺踈綴簾金翡翠賜硯玉蟾蜍移秩東南逺離憂歳月除承明期重入江海意何如衮京兆人爲中書舍人文采贍蔚長於應用譽重一時相代宗用人非文詞者擯不用世謂之濌伯衮晩秋集賢即事詩司空曙和云藹藹鳯凰宫蘭臺玉署通夜霜凝樹羽曉日照和風官亞三台貴儒開百代宗司言陳禹拜侍講發堯聰香巻青編内鈆分緑字中綴籖從太史鏘佩揖羣公池接天泉碧林交御果紅寒龜登故葉秋蝶戀踈叢顔謝㣲文並鍾裴直事同離羣驚海鶴屬思怨江楓地逺姑蘇外山長越絶東慙當哲匠後下曲奏難工獨孤及和云漢家金馬署帝座紫㣲郎圖籍凌羣玉歌詩冠栢梁隂隂萬年樹肅肅五經堂揮翰忘朝食研精待夕陽晴空露盤逈秋月鎻窻凉逺興生班鬢髙情寄縹囊葳蓬雙鸑鷟夙昔並翺翔汲冡同刋謬蓬山共補亡羌池摧羽翮流落限江湘禁省一分袂旻天三雨霜石渠遺跡滿水國暮雲長早晩朝宣室歸時道路光錢起和云文星垂太虚辭伯綜羣書綵筆下鴛掖褒衣來石渠典墳探奥㫖造化覩權輿述聖魯宣父通經漢仲舒窻明宜縹帶地肅近丹除清晝刪詩暇髙秋作賦初露盤侵漢聳宫栁度鴉踈靜對連雲閣晴聞過闕車舊僚云出矣晩嵗復何如海嶠瞻歸路江城夢直廬含毫思兩鳯望逺寄雙魚定笑巴歌拙還參麗曲餘張衆甫鸖詩云馴狎經時乆䙰褷短翮存不隨淮海變空媿稻粱恩獨立秋天淨單棲夕露䌓欲飛還歛翼誰敢望乘軒戴叔倫酬衆甫詩云野人無本意散木任天材分向空山老何言上苑來超遥千里道依倚九層臺出處寜知命輪轅豈自媒更慙張處士相與别嵩萊衆甫送李觀之宣州謁袁中丞詩云古渡大江濵西南距要津自當舟檝路應濟徃來人翻浪驚飛鳥廻風起緑蘋君㸔波上客晚嵗獨垂綸髙仲武云衆甫婉媚綺錯巧用文字工於興喻只如不隨淮海變空媿稻粱恩盡陳謝之源又自當舟檝路應濟徃來人得諷興之要形容體裁率皆如此文流之佳士也衆甫字子初清河人年過耳順方脱章甫冠惠文爲太常寺太祝尉河南夀安縣罷秩僑居雲陽時以縁情比興䟽導心術志之所之輙詣絶境待拜監察御史爲淮寧軍從事建中三年卒權載之誌其墓田澄成都爲客作云蜀郡將知逺城南萬里橋衣縁鄉淚濕貌以客愁銷地富魚爲米山芳桂是樵旅遊唯得酒今日過明朝澄大厯天寳間人杜子美贈獻納使起居田舍人詩即澄也末句云楊雄更有河東賦惟待吹嘘送上天蓋澄以舍人奉使入蜀肅宗時人也栁郴郴與李端盧綸友善有賊平後送客還鄉詩云他鄉生白髪舊國有青山最有思致尤長於短句如贈别云江浦程千里離樽淚數行無論呉與楚俱是客他鄉又云何處最悲辛長亭臨古津往來舟檝路前後别離人李彥逺採桑云採桑畏日髙不待春眠足攀條有餘愁那矜貌如玉千金豈不贈五馬空躑躅何以變貞性幽篁雪中緑彥逺大厯貞元間詩人薛􅀢勅贈康尚書美人云天門喜氣曉氛氲聖主臨軒召冠軍欲令從此行霖雨先賜巫山一片雲康尚書日知也徳宗時斬李惟岳以功擢爲深趙節度遷奉誠軍陟晉綘􅀢徳宗時河東詩人也元載王忠嗣鎮北京以女韞秀歸元載嵗乆而見輕韞秀勸之遊學元乃遊秦爲詩别韞秀曰年來誰不厭龍鍾雖在侯門似不容㸔取海山寒翠樹苦遭霜霰到秦封妻請偕行曰路掃飢寒跡天哀志氣人休零别離淚携手入西秦元到京屢陳時務深符上㫖肅宗擢拜中書王寄諸姨妺詩曰相闥已隨麟閣貴家風第一右丞詩笄年解笑鳴機婦耻見蘇秦富貴時元肅代兩朝宰相貴盛無比復為一篇以喻之曰楚竹燕歌動畫梁春蘭重換舞衣裳公孫開館招嘉客知道浮雲不乆長元貪恡被誅上令王氏入宫歎曰二十年太原節度使女十六年宰相妻誰能爲長信昭陽之事死亦幸矣京兆笞斃大厯五年春載早朝有獻文章者公令左右收之其人苦欲公讀公云候入中書當爲㸔其人言若不能讀自誦畢因亦不見詩曰城東城西舊行處城裏花飛亂如絮海鷰㗸泥欲下來屋裏無人却飛去載後破家妻子被殺其一云城南路長無宿處荻花紛紛如栁絮海鷰㗸泥欲作巢空室無人却飛去張元宗登景雲寺閣云胡馬飲河洛我家從此遷今來獨垂淚三十六峰前望終南山云紅塵白日長安路馬足車輪不暫閑唯有茂陵多病客每來髙處望南川楊郇伯妓人出家云盡出花鈿與四鄰雲鬟剪落厭殘春暫驚風燭難留世便是蓮花不染身貝葉欲翻迷錦字梵聲初學悮梁塵從今艶色歸空後湘浦應無解佩人竇常逢中立春寄懐郇伯云浪跡終年客驚心此地春風前獨去馬澤畔耦耕人老大交情重悲哀物外親子雲今在宅應見栁條新髙拯拯及第後贈試官云公子求賢未識真欲將毛遂比常倫當時不及三千客今日何如十九人拯大厯十三年進士試官薛邕也梁鍠七夕泛舟云雲端有靈匹掩映拂粧臺夜乆應揺珮天髙響不來片歡秋始展殘夢曉翻催却怨填河鵲留橋又不廻詠朩老人云刻木牽絲作老翁鷄皮鶴髪與真同湏臾弄罷寂無事還似人生一夢中明皇遷西内曽詠此詩古意云妾家巫峽陽羅幌寢銀床曉日臨窻乆春風引夢長落釵仍在鬢㣲汗欲消香縱使蒙朧覺魂還逐楚王錢起秋夜與鍠文宴云車到閑林下杯香蕙草時好風能自至明月不湏期秋水翻河影晴霜脆栁絲㣲官是底物許日廢言詩明皇雜録云李輔國矯制遷明皇西宫力士竄嶺表帝戚戚不樂日一蔬食吟詩云刻木牽絲作老翁至一夢中不知明皇作或詠鍠詩也劉長川寳劒篇云寳劒不可得相逢幾許難今朝一度見赤色照人寒匣裏星文動環邊月影殘自然神鬼伏無事莫空彈將赴東都上李相公云四海兵初偃平津閣正開誰知火爐下還有不燃灰長川肅代時詩人也姚倫感秋云試向踈林望方知節候殊亂聲千葉下寒影一巢孤不蔽秋天鴈驚飛夜月烏霜風與春日幾度遣榮枯倫過章秀才洛陽客舍云逹人心自適旅舍當閑居不出來時徑重㸔讀了書晩山嵐色近斜日樹隂踈盡是忘言客聽君誦子虚髙仲武云姚子詩雖未洪深去凢已逺屬興比事不失文流如亂聲千葉下寒影一巢孤亦篇之秀也倫終揚州大都府曹參軍孫處立詠黄鶯云欲囀聲猶澁輕飛羽未調髙風不借便何處得遷喬處立江寧人長安中爲左拾遺善屬文嘗恨天下無書以廣新聞神龍初桓彦範等用事處立遺書論時事得失不得用乃去官還鄉以病卒劉復寺居清晨云髙枕對曉月衣巾清且凉露華朝未晞滴瀝含虛光隔竹聞汲井開扉見焚香幽心感衰病結念依法王青冥早雲飛杳𣺌空鳥翔此情皆有釋悠然知所忘經禁城云日没路且長遊子欲涕零荒城無人路秋草飛寒螢東南古邱墟莾蒼馳郊坰黄雲晦斷㟁枯井臨崩亭昔人竟何之窮泉獨冥冥蒼苔没碑版朽骨無精靈俛仰寄世間忽如流波萍金石非汝夀浮生等臊腥不如學神仙服石求丹經遊仙云稅駕倚扶桑逍遥望九州二老佐軒轅移戈戮蚩尤功成棄之去乗龍上天遊天上見玉皇夀與天地休俯視崑崘宫五城十二樓王母何窈𣺌玉質清且柔揚袂折瓊芳寄我天東頭相思千萬歳大運浩悠悠安用知吾道日月不能周寄音青鳥翼謝爾碧海流送王倫詩云春天日未曛楚客酣送君翩翩孤黄鶴萬里滄洲雲四方各有心豈得常顧羣山連巴湘逺水與荆呉分清光日阻脩尺素安可論相思寄夢寐瑶草空氛氲出三城别幕中三判官詩云翔禽託髙柯倦客念主人恩義有所知四海同一身况皆曠大姿翰音見良辰陳規佐武略髙統據要津常願投素誠今果得所申金罍列四座廣厦無氛塵留連徂暑中觀望歴數旬河山險以固士卒勇且仁飾裝去未歸相追越城闉貴無青玉案緘佩永不泯復登大厯進士第嘗爲水部外郎爲石洪父平墓銘朱彬丹陽作云暫入新豐市猶聞舊酒香抱琴沽一醉盡日卧垂陽彬大厯貞元間詩人戴叔倫字幼公潤州人師事蕭頴士爲門人冠劉晏管鹽鐵表主管湖南至雲安楊惠琳反馳客刼之曰歸我金幣可緩死叔倫曰身可殺財不可得乃捨之累遷至容管經略徳宗嘗賦中和節詩遣使者寵賜代還卒早行寄朱山人放云山曉旅人去天髙秋風悲明河山上没芳草露中衰此别又萬里少年能幾時心知剡溪路聊且寄前期和汴州李相公勉人日喜春云年來日日春光好今日風光好更新獨獻菜􅃵憐應節遍傳金勝喜逢人煙添栁色看猶淺鳥踏梅花落已頻東閣此時聞一曲翻令和者不勝春髙仲武云叔倫爲人温雅善舉止無賢不肖見皆盡心在租庸幕數年夕惕靡怠吏部尚書劉公與祠部員外張繼書云博訪選材揖對賔客如戴叔倫其見推稱如此詩體雖不中越格然廨宇經山火公田沒海潮亦指事造形之工者其骨氣稍輕故詩亦少呉明府自逺來留宿云出門逢故友衣服滿塵埃嵗月不可問山川何處來倚城容弊宅散職寄靈臺自此留君醉相懽得幾廻除夜宿石頭驛云旅館誰相問寒燈獨可親一年將盡夜萬里未歸人寥落悲前事支離笑此身愁顔與衰鬢明日去逢春客舍與故人偶集云天秋月又滿城闕夜千重還作江南㑹翻疑夢裏逢風枝驚暗鵲露草覆寒蛩覊旅長堪醉相留畏曉鐘送友人東歸云萬里楊栁色出闗逢故人輕煙拂流水落日照行塵積夢江湖闊憶家兄弟貧徘徊㶚亭上不語自傷春姚合取爲極元集送謝夷甫宰鄖縣云君去方爲縣干戈尚未銷邑中殘老小亂後少官僚廨宇經山火公田沒海潮致時應變俗新政滿餘姚于鵠鵠野田行云日沒出古城野田何茫茫寒狐上孤塜獵火燒白楊昔人未爲泉下客若到此中還斷膓題鄰居云僻巷鄰家少茅簷喜並居蒸棃常共竈澆薤亦同渠傳屐朝尋藥分燈夜讀書雖然在城市還得似樵漁寄盧儼員外秋衣詞云寄逺空以心心誠亦難知篋中有秋帛裁作逺客衣縫製雖女工尺度手自持容貌當目中長短不復疑針線宻且堅遊客作塵緇意欲都無言澣濯耐嵗時殷勤託行人傳語慎勿遺别來年已老亦聞鬢成絲縱然更相逢握手唯是悲所寄莫復棄願見長相思買山吟云買得幽山入漢陽槿籬疎處種桄榔唯有獮猴來往熟弄人抛果滿書堂山中寄樊尚書云却憶東溪日同袍事魯儒僧房閑共宿酒肆醉相扶江上雙旌貴山中病客孤無媒還有計春谷種桑榆鵠大厯貞元間詩人也爲諸府從事居江湖間有卜居漢陽及荆南陪樊尚書賞花詩其自述曰三十無名客空山獨卧秋豈以詩窮者耶老大㸔花猶未足沿江正遇一枝紅日斜人散東風急吹向誰家明月中㐮陽席上作送死多於生幾人得終老句右張爲取主客圖張籍傷鵠詩云野性踈時俗再命乃從軍氣髙終不合去如鏡上塵鵠送客遊邊云若到并州北誰人不憶家寒深無去伴路盡有平沙磧冷唯逢鴈天春不見花莫隨邊將意垂老事輕車江南曲云偶向江邊採白蘋還隨女伴賽江神衆中不敢分明語暗擲金錢卜逺人韋莊取爲又𤣥集張籍贈王建云于君去後交遊少東野無來篋笥貧頼有白頭王建在眼前猶是詠詩人王季文季文字宗素池陽人少厭名利居九華遇異人授九仙飛化之術曰子當先决科於詞籍後䇿名於真列冥注使然不可移也登咸通中進士第授秘書郎尋謝病歸九華日一浴於山之龍潭寒暑不渝季文九華山謡云九華崢嶸占南陸蓮花擢本山半腹翠屏横截萬里天瀑水落深千丈玉雲梯石磴入杳冥俯㸔四極如中庭丹崕壓下廬霍勢白日隱出牛斗星杉松一嵗抽數尺瓊草寅縁秀層壁南風拂曉煙霧開滿山葱蒨鋪鮮碧雷霆徃往從地發龍卧豹藏安可别峻極遥㸔戞昊蒼挺生豈得無才傑神仙憚險莫敢登馭風駕鶴循邱陵陽烏不見峰頂樹大火尚結嵒中氷靈光爽氣曛復旭晴天倒影西江渌具區彭蠡夾兩傍正可别作一嶽當少陽唐詩紀事巻二十九欽定四庫全書唐詩紀事巻三十九宋計敏夫撰白居易韋式崔𤣥亮牛僧孺李紳沈傳師盧羣劉禹錫封孟紳陳潤白居易按樂天生於代宗大厯七年壬子正月二十日大和七年樂天尹河南元日對酒詩云今朝呉與洛相憶一欣然夢得君知否俱過本命年又詩云何事同生壬子歲老於崔相及劉郎序云余注云余與蘇州劉郎中同生壬子歲今年六十三退之生於大厯三年戊申㣲之生於徳宗建中元年庚申卒於大和五年時年五十三少樂天八歲徳宗貞元十六年已卯中書舍人髙郢下及第第四人省試性習相近逺賦玉水記方流詩時年二十八樂天送侯權秀才序云貞元十五年予與侯生俱為宣城守所貢明年春予中春官第傳云年二十七李商隱銘云年二十六十七年庚辰試中書判拔萃補校書郎樂天泛渭賦序云右丞相髙公之掌貢舉也予以鄉貢進士舉及第左丞相鄭公珣瑜之領選部也予以書判拔萃選登科十九年天子並命二公對掌鈞軸是年齊抗罷崔塤薨二公入相憲宗元和元年丙戍四月以賢良方正對䇿一等冬十二月尉盩厔為集賢校理賦長恨歌于盩厔是月召入翰林為學士遷左拾遺元和二年為拾遺樂天曲江感秋詩云元和二年秋我年三十七長慶二年秋我年五十一序云元和二年三年四年予毎歳有曲江感秋詩是時予為左拾遺翰林學士賀雨詩元和三年冬作諷諭樂府詞元和四年作凢九千二百五十言分為五十首秦中吟等詩皆拾遺時拾遺歳滿當遷憲宗聽自擇官樂天請如姜公輔以學士兼京兆戶曹叅軍以便親養詔可五年以母喪解還有渭上等詩洎效陶淵明詩十六首七年拜左賛善大夫居昭國里酬張十八訪宿云昔我為近臣君常稀到門今我官職冷唯君來徃頻又寄元八云進入閤前拜退就廊下飡歸來昭國里人卧馬歇鞍却坐至日午起坐心浩然又十年贈杓直云已年四十四又為五品官盖為賛善大夫首尾四年十年秋或言居昜母墮井死賦新井詩出為刺史王涯言其不可乃貶江州司馬論盗殺武元衡事宰相嫌其出位故也樂天東南行一百韻其間云愽望移門籍潯陽佐郡符注云十年春㣲之移佐通州其年秋予出佐潯陽十一年秋賦琵琶行時年四十五矣詩云行年四十五兩鬢半蒼蒼清瘦詩成癖粗豪酒放狂老來尤委命安處即為鄉或擬廬山下來春結草堂十二年裴度平淮西十三年冬移刺忠州三遊洞庭序云平淮西之明年冬予自江州司馬授忠州刺史㣲之自通州司馬授虢州長史又明年春各祗命之郡與知退偕行三月十一日參㑹於夷陵又賦詩云澧水店頭春盡日送君馬上謫通川夷陵峽口明月夜此處逄君是偶然一别五年方見面相携三宿未回舡是也十五年正月徳宗崩穆宗立召為司馬員外郎是年寒食夜詩云四十九年身老日一百五夜月明天抱膝思量何事在癡男騃女喚鞦韆又初除尚書郎脱刺史緋詩云頭白喜抛黄草峽眼明驚拆紫泥書便留朱紱還銓閣却着青袍侍玉除是歳下峽自商山路還朝有商山路詩云萬里路長在六年身始歸所經多舊舘大半主人非自十年至是六年矣明年除主客郎中知制誥長慶元年以詩贈王十一李七元九王舎人云紫垣曹局聮華地白鬢郎官老醜時莫怪不如君氣味此中來挍十年遲時元㣲之亦以中人之薦入為舎人是年除中書舎人有絲綸閣下文章静等詩長慶二年七月自舎人匄外出守杭州時河北復亂謀趙國急樂天論事不合乃匄外遷次藍溪詩云既居可言地願助朝廷理伏閣三上章戇愚不稱㫖聖人存大體優貸容不死鳯詔停舎人魚書除刺史長慶三年二月五日杭州花下作云二月五日花如雪五十二人頭似霜聞有酒時湏笑樂不闗身事莫思量長慶四年以太子左庻子分司東都是歳正月穆宗崩恭宗立三年為刺史無政在人口唯向郡城中題詩千餘首慙為甘棠詠豈有思人不三年為刺史飲氷復食蘖唯向天竺山取得兩片石此秪有千金無乃傷清白三月作錢塘湖石記時猶在杭州則分司當在秋時洛中詩云五年職翰林四年蒞潯陽一年巴郡守半年南宫郎二年直綸閣三年刺史堂凡此十五載有詩千餘章寳歴元年三月餘守蘇州是年七月有呉郡詩石記明年病兔華嚴經社石記云寳歴二年九月二十五日前蘇州刺史曰白居易記是歳十二月恭帝崩文宗立樂天欲去郡有自詠五章其一云官舎非我廬官園非我樹洛中有小宅渭上有别墅既無婚嫁累幸有歸休處歸去誠已遲猶勝不歸去又宿滎陽詩云生長在滎陽少小辭鄉曲迢迢四十載復到滎陽宿去時年十二今年五十六時文宗大和元年也文宗大和元年以秘書監召十月上旬誕聖之日樂天以秘書監與沙門義林道士楊洪元發問酬難是歳遷刑部侍郎㣲之於浙東就拜尚書樂天詩云我為憲部入南宫君作尚書鎮浙東老去一時成白首别來七度換春風是也二年歳暮詠懐云窮冬月末兩三日半百年過六七時龍尾趂朝無氣力牛頭叅道有心期榮華外物終湏悟老病傍人豈得知猶被妻兒教漸退莫求致仕且分司時二李黨事興樂天畏禍求退故詠懐云人間禍福愚難料世上風波老不禁萬一差池似前事又應追悔不抽簮二年春移病還東都是年夏得請為太子賔客分司見池上篇序自是不出東呉矣将至東都先寄令狐留守云東都添箇狂賔客先報壷觴風月知歸履道宅詩云徃時多暫住今日是長歸自是劉白令狐裴相唱和甚多四年作自嘲詩云五十八翁方有後静思堪喜亦堪嗟自後何處難忘酒不如來飲酒詩篇皆東都作也五年拜河南尹樂天詩云六十河南尹前途足可知老應無處避病不與人期是年六十矣七年復以賔客分司序洛詩云大和二年詔授刑部侍郎明年病免歸洛旋以賔客分司居二年就領河南尹事又三年病免歸履道里第再授賔客分司開成元年起為同州刺史不拜改太子少傅二年三月河南尹李待價禊於洛濵啓留守裴令公公召居易劉禹鍚等一十五人宴舟中樂天賦三月草萋萋黄鸎歇又啼之作四年賦病中詩序云開元已未嵗余蒲柳之年六十有八冬十月甲寅始得風痺之疾因成十五首題為病中詩且貽所知兼用自廣五年春盡獨吟云病共樂天相伴住春隨樊素一時歸是年文宗崩武宗立樂天妓樊素也善歌楊柳枝人多以曲名名之樂天病去之夢得詩云春盡絮飛留不得隨風好去落誰家辛酉㑹昌元年年七十以刑部尚書致仕逹哉樂天行云分司東都十三年七旬纔滿冠已掛又香山寫真賛序云㑹昌二年罷太子少傅為白衣居士寫真香山寺藏經䑓又初致仕贈留守牛丞相時年七十一則樂天七十致仕矣致仕詩云南北東西無所羈掛冠自在勝分司探花嘗酒多先到拜表行香盡不知炮笋烹魚飽飱後擁袍枕臂醉眠時報君一語君應笑兼亦無心羡保釐又醉中吟一生躭酒客五度棄官人注云蘇州刑侍河南尹同州刺史太子少傅皆以病免五年為東都九老㑹時年七十四六年八月薨東都贈右僕射時年七十五樂天寄王起李紳詩云云予與山南王僕射淮南李僕射仕歴五朝年踰三紀海内年軰今唯三人故詩云故交海内只三人二坐嵓廊一卧雲時㑹昌六年也㣲之卒於大和六年明年崔元亮卒會昌二年劉夢得卒樂天之卒最後韋式樂天分司東洛朝賢悉㑹興化亭送别酒酣各請一字至七字詩以題為韻王起賦花詩云花㸃綴分葩露初裛月未斜一枝曲水千樹山家戯蝶未成夢嬌鶯語更誇既見東園成徑何殊西子同車漸覺風飄輕似雪能令醉者亂如麻李紳賦月詩云月光輝皎潔耀乾坤靜空闊圓滿中秋翫争詩哲玉兎鏑難穿桂枝人共折萬象照乃無私瓊臺豈遮君謁抱琴對彈别鸖聲不得知音聲不切令狐楚賦山詩云山聳峻回環滄海上白雲間商老深尋謝公逺攀古巖泉滴滴幽谷鳥闗闗樹島西連隴塞猿聲南徹荆蠻世人只向簮裾老芳草空餘麋鹿閑元㣲之賦茶詩云茶香葉嫰芽慕詩客愛僧家碾雕白玉羅織紅紗銚煎黄蘂色椀轉麴塵花夜後邀陪明月晨前命對朝霞洗盡古今人不倦将知醉亂豈堪誇魏扶賦愁詩云愁逈野深秋生枕上起眉頭閨閣危坐風塵逺遊巴猿啼不住谷水咽還流送客泊舡入浦思鄉望月登樓煙波早晩長覊旅絃管終年樂五侯韋式郎中賦竹詩云竹臨池似玉裛露静和煙緑抱節寧改貞心自束渭曲偏種多王家看不足仙仗正驚龍化美實當隨鳯熟唯愁吹作别離聲回首駕驂舞陣速張籍司業賦花詩云花落早開賖對酒客興詩家能廻游騎毎駐行車宛宛清風起茸茸麗日斜且願相留懽洽惟愁虚棄光華明年攀折知不逺對此誰能更嘆嗟范堯佐道士賦書字詩云書慿鴈寄魚出王屋入匡廬文生益智道著清虚葛洪一萬巻恵子五車餘銀鈎屈曲索靜題橋司馬相如别後莫暌千里信數封緘送到閑居居易賦詩字詩云詩綺羙瓌竒明月夜落花時能助懽笑亦傷别離調清金石怨吟苦鬼神悲天下只應我愛世間惟有君知自從都尉别蘇句便到司空送白辭崔元亮元亮為散騎常侍後以太子賔客分司東都歸洛和樂天詩云病餘歸到洛陽頭拭目開眉見白侯鳯詔恐君今嵗去龍門欠我舊時遊自到未遊龍門幾人樽下同歌詠數盞燈前共獻酬相對憶劉劉在逺寒宵耿耿夢長洲夢得詩云幾年侍從作朝臣却向青雲索得身朝士忽為方外士主人仍是眼中人元亮在洛與白樂天相從醉吟之樂曽有詩云共相呼喚醉歸來樂天答云居士忘筌黙黙坐先生枕麴昏昏睡早晩相從入醉鄉醉鄉此去無多地元亮字晦叔礠州人大和中為諌議大夫鄭注誣宋申鍚捕逮倉卒内外震駭元亮率諌官叩延英苦諌帝感悟由是名重朝廷頃之移疾歸東都召為虢州刺史卒元亮與元㣲之白樂天皆貞元初同年生也元亮名最後自詠云人間不㑹雲間事應笑蓬萊最後仙後白刺杭州元為浙東廉使刺越而崔刺湖州白以詩戯之曰越國封彊吞碧海杭城樓閣入青天呉興卑小君應屈為是蓬萊最後仙三郡有唱和詩謂之三州唱和集樂天誌元亮墓云公晩年師六祖以無相為心地易簀之夕大怖将至如入三昧恬然自安於遺䟽之末手筆題云蹔榮蹔悴石敲火即空即色眼生花許時為客今歸去大歴元年是我家諸子中芻言罕言登進士第元㣲之酬歌舒少府寄同年科第云前年科第偏年少未解知羞最愛狂九陌爭馳好鞍馬八人同看綵衣裳注云同年科第宏詞吕二炅王十一起抜萃白二十二居易平判李十一復禮吕四頻歌舒大垣崔十一八元亮逮不肖八人皆奉榮養元亮在湖州寄三癖詩劉夢得言癖在詩與琴酒夢得和之并序云栁呉興亭臯隴首之句王融書之白團扇故夢得詩曰視事畫屏中自稱三癖翁管絃汎春渚旌斾拂晴虹酒對青山月琴韻白蘋風㑹書團扇上知君文字工牛僧孺樂天夢得有除夜詩僧孺和云惜歳歳今盡少年應不知凄凉數流軰歡喜見孫児暗減一身力潜添滿鬢絲莫愁花笑老花自幾多時元和三年宣政殿試賢良方正能直言極諌科一十人登科其後僧孺李宗閔王起賈餗四人皆相次拜相先是白居易在翰林為考校官後僧孺罷相出鎮揚州居易在洛中有詩送云北闕至東京風光十六程坐移丞相閤春入武陵城紅斾擁雙節白髪無一莖萬人開路看百吏立班迎閫外君彌重樽前我亦榮何湏身自得將相是門生公始至京致琴書㶚滻間先以所業謁韓文公皇甫員外二公披巻巻首有説樂一章未閲其詞遽曰且以拍板為什麽對曰樂句二公相顧大喜曰斯髙文必矣公因謀所居二公良乆曰可於客戶坊税一廟院公如所教二公復誨之曰某日可遊青龍寺薄暮而歸二公其日聫鑣至彼因大書其門曰韓愈皇甫湜同謁幾官先軰不遇翌日輦轂名士咸徃觀焉竒章之名由是赫然矣或云僧孺登第與同軰登政事堂宰相曰掃㕔奉候樂天在香山時僧孺在廣陵有詩曰唯羡東都白居士年年香積問禪師樂天答云支許徒思遊白日䕫龍未放下青天應湏且為蒼生住猶去懸車十四年時僧孺年五十七樂天求筝於維揚僧孺先有詩曰但愁封寄去魔物或驚禪樂天云㑹教魔女弄不動是禪心樂天云思黯自誇前後服鍾乳三千兩而歌舞之妓甚多乃謔予衰老故答思黯詩云鍾乳三千兩金釵十二行如他心似火欺我鬢如霜慰老資歌笑銷愁仰酒漿眼看狂不得狂得且湏狂竒章又有詩云不是道公狂不得恨公逄我不教狂公赴舉之秋嘗投贄於劉補闕禹錫對客展巻飛筆塗竄其文歴二十餘歳劉轉汝州公鎮海南枉道駐旌信宿酒酣賦詩劉方悟徃年改公文巻僧孺詩曰粉署為郎四十春今來名軰更無人休論世上昇沉事且闘樽前見在身珠玉㑹應成咳唾山川猶覺露精神莫嫌恃酒輕言語曽把文章謁後塵禹鍚和云昔年曽忝漢朝臣晩歳空餘老病身初見相如成賦日後為丞相掃門人追思徃事咨嗟乆幸喜清光笑語頻猶有當時舊冠劒待公三日拂埃塵牛公吟和詩前意稍解曰三日之事何敢當焉宰相三朝後主印可以昇降百司也於是移宴竟夕方整前驅也劉乃戒其子咸及承雍曰吾成人之志豈料為非汝軰進修守中為上僧孺周秦行紀云余貞元中舉進士落第歸宛葉間至伊闕南道鳴臯山下将宿大安民舎㑹暮不至更十餘里一道甚異夜月始出忽聞有異香因而進行不知猒逺見火明意為荘家更驅至一宅庭門若富家有黄衣人曰郎君何氏何至余曰僧孺姓牛應進士落第徃大安民舎誤道來此黄衣入告少時出曰請郎君入拜殿下簾下語曰妾漢文帝母薄太后此是妾廟太后遣軸簾使上殿召坐食頃太后命髙祖戚夫人元帝王嬙余皆拜乃亦就坐太后迎唐朝太真楊妃齊潘妃余拜既命饌太后問曰今天子誰余對曰今皇帝名适代宗長子太后曰沈婆兒作天子也大竒命酒各賦詩余應教作詩曰香風引上大羅天月地花宫拜洞仙具道人間惆悵事不知今夕是何年太后曰秀才逺來今日誰伴戚夫人先起辭曰如意成長潘妃曰東昏侯誓不負他緑珠曰石衛尉嚴忌太后曰太真今朝先帝貴妃重言其他太后目王昭君昭君不對低眉羞恨俄歸休餘為左右送入昭君院旦侍人告起太后戚夫人昭君等皆泣别使朱衣人送至大安民里余衣上香經十餘年不歇云云李紳紳初以古風求知於吕温温見齊煦誦其憫農詩曰春種一粒粟秋收萬顆子四海無閑田農夫猶餓死鋤禾日當午汗滴禾下土誰知盤中飱粒粒皆辛苦又曰此人必為卿相果如其言奉酬樂天立秋日有懐見寄云深夜星漢靜秋風初報凉篁堦淅瀝響露葉参差光氷兎半升魄銅壷㣲滴長薄帷乍飄巻襟帯輕揺揚北除䰟夢清斜月滿軒房屣履歩前楹劒㦸森在行重城宵正分號鼓互相望獨坐有所思夫君鸞鳯章天津落星河一葦安可航龍泉白玉首魚服黄金裝報國未知效維鵜徒在梁徘徊顧戎旃顥氣生東方衰葉滿欄草班毛盈鏡霜羸牛未脱轅老馬强騰驤吟君白雪唱慙愧巴人腸樂天贈紳詩云一篇長恨有風情十首秦吟近正聲剛被老元偷格律苦教短李復歌行注云元九徃江陵余以詩一軸贈行自是格變李二十嘗自負歌行近見余樂府五十首黙然心伏樂天藏書東都聖善寺號白氏文集紳有詩以美之云寄玉蓮花藏緘珠貝葉扃院閑容客讀講倦許僧聽部列雕金牓題名刻石銘永添鴻寳集莫雜小乗經紳字公垂中書令敬𤣥曽孫號短李穆宗召為翰林學士與李徳裕元㣲之同時號三俊武宗時為相居位四年出鎮南卒紳江南暮春寄家云洛陽城見迎梅雪魚口橋逄送雪梅劒外寺前芳草合鏡湖亭上野花開江鴻斷續翻雲去海燕差池拂水廻料得心知近寒食潛聼喜鵲望歸來開成間紳集其詩為追昔遊盖嘆逝感時發於悽恨而作也或長句或五言或雜言或歌或吟或樂府齊梁不一其辭乃由牽思所屬爾赴梁漢歸諌垣升翰苑感恩遇歌帝京風物遭䜛邪播越歴荆楚涉湘沅逾嶺嶠抵荒陬止髙安移九江泛五湖過鍾陵沂荆江守滁陽轉壽春改賔客留洛陽歴㑹稽過梅里遭䜛邪再為賔客分務歸東周擢川守鎮大梁詞有所懐興生於怨故或隐或顯不常其言兾知音於異而已南梁行云江城鬰鬰春草長悠悠漢水浮清光雜英飛盡空晝景緑楊重隂官舎靜此時醉客縱横書公言可薦承明廬元和十四年䝉故山南節度僕射崔公奏觀察判官䝉以書見委常戯拙速青天詔下寵光至頒籍金閨徴石渠是歳五月䝉恩除左拾遺秭歸山路煙嵐隔山朩幽深晩花拆澗底紅光奪火燃揺風扇毒愁行客駱谷中多毒朩名山琵琶其花明艶而與杜鵑花相雜樵者識之言内草朩殺人杜鵑啼咽花亦殷聲悲絶艶連空山斜陽瞥影淺深朩雲雨飜迷嵓谷間山雞錦質矜毛羽透竹穿蘿命儔侣喬朩幽谿上下同雄雌不惑飛棲處望秦峯逈過商顔浪疊波堆萬簇山行盡杳冥青嶂外九重鐘漏紫霄間元和列侍明光殿諌草初焚市朝變北闕趍臣半隙塵南梁吟嘯皆飛霰追思感歎却昏迷霜鬢愁吟到曉雞故篋歳深開斷簡秋堂月曉掩遺桂嗚嗚曉角霞輝粲撫劒長楹一長歎芻狗無由學聖賢空持感激終昏旦憶春日太液池東亭候對云宫鸎曉報瑞煙開三島靈禽拂水廻橋轉綵虹當綺殿檻浮花鷁近蓬萊草承步輦王孫長桃艶仙顔阿母栽簮筆此時方侍從却思金馬笑鄒枚憶夜直金鑾奉詔承㫖詩云月當銀漢玉繩低深聼簫韶碧落齊門壓紫垣髙綺樹閣連青鎻近丹梯墨宣外渥催飛詔草定新恩促換題明日獨歸花路近可怜人世隔雲􅅺過荆門詩云荆江水闊煙波轉荆門路逺山葱倩帆勢侵雲滅又明山程背日昏還見青青麥壠啼飛鵶寂寞野徑棠棃花行行駈馬萬里逺漸入煙嵐危棧賖林中有鳥飛幽谷月上千嵓一聲哭腸斷思歸不可聞人言恨魄來巴蜀我聽此鳥祝我䰟魂死莫學聲㘅寃縱為羽族莫棲息直上青雲呼帝閽此時山月如衘鏡嵓樹参差互輝映皎潔深看入澗泉分明細見樵人逕隂森鬼廟當郵亭雞豚日宰聞膻腥愚夫禍福自迷惑魍魎憑何通百靈日低山晩問行客已酹椒漿拜荒陌惆悵忠直徒自持誰登山頭望夫石涉沅湘詩云屈原死處瀟湘隂滄浪淼淼雲沉沉蛟龍長怒虎長嘯山水翛翛波浪深煙横日落驚鴻起山映雲霞淼千里鴻呌離離入莫天霞消漠漠深雲水水虛江暗揚波濤黿鼉動盪風騷騷行人愁望待明月星漢沉浮魅鬼號屈原爾為懐忠沒水府通天化靈物何不駈雷擊電除姦邪空作沈泉抱寃骨舉盃瀝酒召爾魂月影滉漾開乾坤波白水黑山隐見汨羅之上遥昏昏風帆候晩㸔五兩戍皷鼕鼕逺山響潮滿江津猿鳥啼荆夫楚語飛蠻槳瀟湘島浦無人居風驚水暗惟鮫魚行來擊棹獨長歎問爾精魂何所如悲善才詩余守郡日有客遊者善彈琵琶聞其所傳乃善才所授頃在内庭日别承恩顧賜宴曲江勑善才等二十人備樂自余經播遷善才巳沒因追感前事為悲善才穆王夜幸蓬池曲金鑾殿門髙秉燭東頭弟子曹善才琵琶請奏新飜曲翠娥列坐層城女笙歌參差齊笑語天顔静聽朱絃彈衆樂寂然無敢舉銜花金鳯當承撥轉腕攏絃促揮霍抹花飜鳯天上來徘徊滿殿飛春雪抽絃度曲新聲發金鈴玉佩相瑳切流鶯子母飛上林仙鸖雌雄唳明月此時奉詔侍金鑾别殿承恩許召看三月曲江春草緑九霄天樂下雲端紫髯供奉前屈膝盡彈妙曲當春日寒泉注射隴水開胡鴈飜飛朔天沒日曛塵暗車馬散為惜新聲有餘歎明年冠劒閉橋山萬里孤臣投海畔籠禽鎩翮尚廻飛白首生從五嶺歸聞道善才成朽骨空餘弟子奉宣徽南譙寂寞三春晩有客彈絃獨悽怨静聼深奏楚月光憶惜初聞曲江宴心悲不覺淚䦨干更為調絃反復彈秋吹動揺神女佩月珠敲擊水精盤自怜淮海同泥滓恨魄凝心未能死惆悵追懐萬事空雍門感慨徒為爾憶過潤州時元和二年余以進士為鎮海軍書奏從事秋七月兵亂余以不從書奏飛檄之詐遭庻人李暴怒腰領不殊者再三後軍平尚書李公欲具事以聞余以本乃誓節非欲求榮罷所奏詩云昔年從宦干戈地黄綬青春一魯儒弓犯控絃招武族劒當抽匣問狂夫帛書投筆封魚腹元髪衝冠捋虎鬚談笑謝金何所貴不為偷買用兵符元㣲之和樂天東南行云李多嘲蝘蜓竇數集蜘蛛注云李二十多詠物之作竇七頗改官衘屢有蜘蛛之喜樂天詩曰悶勸迂辛酉閑吟短李詩迂辛辛邱度也度之子一日自云辛氏子來見紳曰小子毎憶白二十二丈詩悶勸疇昔酒閑吟二十丈詩紳笑曰辛大有此狂兒吾敢不存舊沈傳師子詢傳師次潭州酬唐侍御姚員外遊道林嶽麓寺題示云承明年老輙自論訖得湘守東南奔為聞楚國富山水青嶂邐迤僧家園含香珥筆皆眷舊謙抑自忘臺省尊不令執簡候亭館直許携手遊山樊忽驚列岫曉來逼朔雪洗盡煙嵐昏碧波廻嶼三山轉丹檻繚郭干艘屯華鑣躞蹀絢沙歩大斾綵錯輝松門樛枝競鶩龍蛇勢折幹不滅風霆痕相重古殿倚嵓腹别引新徑縈雲根目傷平楚虞帝魂情多思逺聊開樽危絃細管逐歌飃盡皷繡靴隨節飜鏘金七言凌老杜入朩八法蟠髙軒嗟余潦倒乆不知忍復感激諭元元傳師字子言既濟之子材行有餘權徳輿門生七十人推為顔子終吏侍子詢字誠之亦能文咸通中為昭義節度使詢清粹端美神仙中人也制除山北節旄京城咸誦曹唐遊仙詩贈之云玉詔新除沈侍郎便分茅土領東方不知今夜逰何處侍從皆騎白鳯凰李徳裕觀察浙西有招隐山觀玉蘂花詩云玉蘂天中樹金閨昔共窺落英閑舞雪宻葉作低帷内署沈大夫所居閣前有此花落空中回旋乆之方集庭砌大夫草詔之暇常邀余同玩舊賞煙霄逺前歡歳月移今來想顔色還似憶瓊枝傳師和云曽對金鑾直同依玉樹隂雪英飛舞近煙葉動揺深素蕚年年宻衰容日日侵勞君想華髪僅欲不勝簮盧羣唐淮西節度使呉少誠不奉詔令羣使蔡州詰之羣諭以君臣之分忠順之義少誠乃從命羣又與唱和賦詩自言以反側常蒙隔在恩外羣於筵中醉而歌曰祥瑞不在鳯凰麒麟太平湏得邊将忠臣衛霍真誠奉主貔虎十萬一身江河潜注息浪蠻貊欵塞無塵但得百寮師長肝膽不用三軍羅綺金銀少誠大悦羣以奉使稱㫖遷祕書監羣字載初范陽人終於義成軍節度使劉禹鍚三鄉驛伏覩明皇望女几山詩斐然有感云開元天子萬事足惟惜當時光景促三鄉陌上望仙山歸作霓裳羽衣曲仙花從此在瑶池三清八景相追隨天上忽乗白雲去世間惟有秋風辭長慶中元㣲之夢得韋楚客同㑹樂天舎論南朝興廢各賦金陵懐古詩劉滿引一盃飲已即成曰王濬樓舡下益州金陵王氣黯然收千尋鐵鏁沉江底一片降幡出石頭人世幾回傷徃事山形依舊枕寒流而今四海為家日故壘蕭蕭蘆荻秋白公覧詩曰四人探驪龍子先獲珠所餘鱗爪何用耶於是罷唱詩弔張曲江曰聖言貴忠恕至道重觀身法在何所恨色傷斯為仁良時難乆恃隂謫豈無因寂寞韶陽廟魂歸不見人元和十年自朗州召至京戯贈看花君子云紫陌紅塵拂面來無人不道看花回元都觀裏桃千樹盡是劉郎去後栽再遊元都觀絶句并序云余貞元二十一年為屯田員外郎時此觀未有花是歳出牧連州貶朗州司馬居十年召至京師人人皆言有道士手植仙桃滿觀如紅霞遂有前篇以志一時之事旋又出牧今十有四年復為主客郎中重遊元都蕩然無復一樹唯兎葵燕麥動揺春風耳因再題二十八字以俟後遊時大和二年三月也詩云百畆庭中半是苔桃花落盡菜花開種桃道士歸何處前度劉郎今獨來禹錫嘗對賔友毎吟張愽士籍詩云新酒欲開期好客衣冠暫脱見閑身對花朩則吟王右丞詩云興䦨啼鳥換坐乆落花多白二十二好余秋水詠云東屯滄海闊南瀼洞庭寛余自知不及韋蘓州春潮帯雨晩來急野渡無人舟自横甞過洞庭雖為一篇思杜員外落句云年去年來洞庭上白蘋愁殺白頭人鄙夫之言有愧於杜公也楊茂卿校書過華山詩曰河勢崑崙逺山形䓧蓞秋此實為佳句贈歌人米嘉榮詩云唱得梁州意外聲舊人唯有米嘉榮近來年少輕前軰好染髭鬚事後生禹錫赴呉臺揚州大司馬杜公鴻漸開宴命妓侍酒禹錫詩曰髙髻雲鬟宫様粧春風一曲杜韋娘司空見慣渾閑事斷盡蘓州刺史腸白樂天任杭州刺史携數妓還洛陽後却還錢塘故禹鍚戯答云無那錢塘蘓小小憶君淚黯石榴裙沈存中曰禹鍚霓裳羽衣曲云三鄉陌上望仙山歸作霓裳羽衣曲又王建詩云聽風聽雨作霓裳樂天詩注云開元中西凉府節度使楊敬述造鄭愚津陽門詩注云葉法善甞引上入月宫聞仙樂及上歸但記其半遂於笛中寫之㑹西凉府都督楊敬述進婆羅門曲與其聲調相符遂以月中新聞為散序用敬述所進為其腔而名霓裳羽衣曲説各不同今蒲州逍遥樓楣上有唐人横書類梵字相傳是霓裳譜字訓不通莫知是非或謂今燕部有獻仙音曲乃其遺聲然霓裳本謂之道調法曲今獻仙音乃小石調耳未知孰是山圍故國周遭在潮打空城寂寞廻淮水東邊舊時月夜深還過女墻來樂天掉頭苦吟嘆賞良乆曰石頭詩云潮打空城寂寞回吾知後之詩人不復措辭矣禹錫金陵五題自叙云禹鍚與樂天唱和號劉白唱和集與裴度唱和號汝洛集與令狐楚唱和號彭陽唱和集與李徳裕唱和號呉蜀集禹鍚字夢得附叔文擢度支員外郎人不敢斥其名號二王劉栁憲宗立禹錫貶連州未至斥朗州司馬作竹枝詞武元衡初不為宗元所喜自中丞下除右庻子及是執政禹鍚乆落魄乃作問大鈞謫九年等賦又叙張九齡事為詩感諷權要乆之召還宰相欲任南省郎乃作元都觀看花君子詩當路不喜出為播州易連州徙䕫州由和州刺史入為主客郎中復作遊元都觀詩有兎葵鷰麥之語聞者益薄其行俄分司東都裴度薦為集賢學士度罷出刺蘓州徙汝同二州㑹昌時檢校禮部尚書卒禹鍚晩年與白傅友善詩筆文章時無在其右者常與禹錫唱和徃來因集其詩而序之曰彭城劉夢得詩豪者也其鋒森然少敢當者予不量力徃徃犯之夫合應者聲同交争者力敵一徃一復欲罷不能由是毎制一篇先於視草視竟則興作興作則文成一二年來日尋筆研同和贈答不覺滋多大和三年春已前帋墨所存者凡一百三十八首其餘乗興仗醉卒然口號者不在此數因而命小姪龜兒編勒成兩軸仍寫二本一付龜兒一授夢得小男崑郎各令收載附兩家文集予頃與元㣲之唱和頗多或在人口甞戯㣲之云僕與足下二十年來為文友詩敵幸也亦不幸也吟詠情性播揚名聲其適遺形其樂忘老幸也然江南士女語才子者多云元白以子之故僕不得獨步於呉越間此亦不幸也今垂老復遇夢得非重不幸耶夢得文之神妙莫先於詩若妙與神則吾豈敢如夢得雪裏髙山頭白早海中仙果子生遲沉舟側畔千㠶過病樹前頭萬朩春之句類真謂神妙矣在在處處應有靈物䕶持豈兩家子弟祕藏而已其為名流許與如此故國思如此若為天外心寄白公句湖上收宿雨句故人日已逺䆫下塵滿琴坐對一樽酒恨多無力斟幕踈螢色逈露重月華深萬境與羣籟此時情豈任無題禪思何妨在玉琴真僧不見聽時心秋堂境寂夜方半雲去蒼梧湘水深聼琴右張為取作主客圖夢得曰栁八駮韓十八平淮西碑文左飡右粥何如我平淮西雅云仰父俯子韓碑兼有㡌子使我為之便説用兵伐叛矣夢得曰韓碑桞雅余詩為云城中晨雞喔喔鳴城中皷角聲和平美愬之入蔡城也湏臾之間賊無覺者又落句云始於元和十二載四海重見昇平時以見平淮之年云禹鍚叙董侹文集云詩其文章之藴耶義得而言喪故㣲而難能境生於象外故精而寡和千里之謬不容秋毫非有的然之姿可使戶曉必俟知者然後皷行於時自建安距永明以還詞人比肩唱和相發有以朔風零雨髙視天下雖蟬噪鳥鳴蔚在史䇿國朝因之粲然復興由篇章以躋貴仕者相踵而起封孟紳行不由徑詩云欲速意何成康荘欲砥平天衢皆利徃吾道泰方行不復由荒徑無由見蒋生三條遵廣逹九軌尚安貞紫陌悠悠去芳塵步步清澹臺千載後公正有遺名孟紳貞元十五年髙郢下進士第一人終於太常卿陳潤賦得浦外虹云日影化為虹彎彎出浦東一條㣲雨後五色片雲中輪勢隨天度橋形跨海通還将飲水處持送使車雄送駱徴君云野人膺辟命溪上掩柴扉黄巻猶将去青山豈更歸馬留苔蘚迹人脱薜蘿衣他日相思處天邊望少㣲東都所居寒食下作云江南寒食早二月杜鵑鳴日暖山初緑春寒雨欲晴浴蚕看社日改火待清明更喜𤓰田好令人憶邵平賦得秋河曙耿耿云曉望秋髙夜㣲明欲曙河橋成鵲已去機罷女應過月上殊開練雲行類動波尋源不可到耿耿復如何潤大歴間人終坊州鄜城縣令樂天之外祖也丈夫不感恩感恩寧有淚心頭感恩血一滴染天地右張為取作主客圖唐詩紀事巻三十九欽定四庫全書唐詩紀事巻三十宋計敏夫撰李益杜羔諸葛覺韋執中耿湋盧綸韓翃錢起司空曙苖發崔峒李端冷朝陽
