seq: 12
front:
  text: 鸚林花塔啟鳳輦順時逰重九昭皇慶大千揚帝休耆闍妙法闡王舍睿文流至徳覃無極小臣歌詎詶
  hash: sha256:b7f82139cb60fa9f52a06d3506baf146fb42c5fa9c674955effa200018f5ca82
body:
  text: 辛替否慈恩寺九日應制云洪慈均動植至徳俯深𤣥出豫從初地登髙適梵天白雲飛御藻慧日暖皇編别有秋原藿長傾雨露縁替否字協時京兆人景龍中為左拾遺以直諫遷右臺殿中侍御史為憲司彈擊不避强禦累遷頴王府長史卒王景慈恩寺九日應制云玉輦移中禁珠梯覽四禪重階清漢接飛竇紫霄懸綴葉披天藻吹花散御筵無因鑾蹕暇俱舞鶴林前景太原人為司門貟外郎萊州刺史子之咸為長安尉昆弟之賁之渙皆善屬文之咸之子緯有傳韋安石九日侍宴應制云重九開秋莭得一動宸儀金風飄菊蘂玉露泫茰枝睿覽八紘外天文七曜披臨深應在即居髙豈忘危得枝字安石京兆人久視中為相二張三思横寵安石數折辱之復相中宗不附太平公主睿宗時為姜晦所劾貶黜發憤卒竇希玠九日應制云鑾輿巡上苑鳳駕瞰層城御座丹烏麗宸居白鶴驚玉旗縈桂葉金杯汎菊英九晨陪聖膳萬嵗奉承明得明字八月中宗令學士尋勝同宴於禮部尚書竇希玠林亭張説製序云召絲竹於伶官借池亭於貴族雕俎在席金覊駐門逺山片雲隔層城而即興繁鸎芳樹遶髙臺而共樂夏日帝幸五王第乃過希玠宅劉憲詩云北斗樞機任西京肺腑親李乂詩云貴逰開北第宸眷幸西鄉按希玠武徳時内史令威之後中宗時為禮書以恩澤賜實封開元為太子少傅世為外戚唐世貴盛莫與為比李咸九日應制云重陽乘令序四野開晴色日月數初并乾坤聖登極菊黄迎酒泛松翠凌霜直遊海難為深負山徒倦力得直字陸景初九日應制云九秋光順豫重節霽良辰登髙識漢苑問道侍軒臣菊花浮秬鬯茰房插縉紳聖化邊陲謐長洲鴻鴈賓得臣字景初元初之子恬静寡欲議論髙簡景雲中與崔湜同知政事睿宗曰子能紹先業是謂象賢乃賜名象先鄭南金九日應制云重陽玉律應萬乘金輿出風起韻虞絃雲開吐堯日菊花浮聖酒茱香挂衰質欲知恩煦多順動觀秋實得日字于經野九日應制云御氣三秋節登髙九曲門桂筵羅玉俎菊醴溢芳樽遵渚歸鴻度承雲舞鶴騫微臣濫陪賞空荷聖明恩得樽字經野中宗時為户部尚書中宗九日登髙應制二十四人韋安石蘇瓌詩先成于經野及盧懐慎詩後成時景龍三年也解琬慈恩寺九日登塔應制云瑞塔臨初地金輿幸上方空邊有清淨覺處無馨香雨霽微塵歛風秋定水凉兹辰採仙菊薦夀慶重陽晦日宴髙氏林亭云主第簪裾出王畿春照華山亭一以眺城闕帶煙霞横堤列錦帳傍浦駐香車歡娱屬晦節酩酊未還家琬魏州元城人與郭元振善習邊事守邊積二十年開元中終同州刺史麴瞻慈恩寺九日應制云扈蹕遊𤣥地陪仙瞰紫微似邁銖衣刼将同羽化飛雕戈秋日麗寳劒曉霜霏獻觴乘菊序長願奉天暉樊帎慈恩寺九日應制云淨境重陽節仙逰萬乘來插茰登鷲嶺把菊坐蜂臺十地祥煙合三天瑞景開秋風詞更逺竊抃樂康哉孫佺慈恩寺九日應制云應節茰香滿初寒菊浦新龍旗煥辰極鳳駕儼香闉蓮井偏疑夏梅梁更若春一忻陪鴈塔還似得天身佺麟徳宰相處約之子延和初為幽州都督為奚所敗同周以弟見獲送黙啜所殺之佺不知兵始裴懐古為都督馭士有方朝廷以佺代之遂及敗李從逺慈恩寺九日應制云九月從時豫三乘為法開中霄日天子半座寳如來摘果珠盤獻攀茰玉輦廻願将塵露㸃遥奉光明臺周利用慈恩寺九日應制云出豫乘金節飛文煥日宫茰房開聖酒杏苑被𤣥功塔向三天逈禪收八解空叨恩奉蘭籍終愧洽薰風金城公主和蕃中宗送至馬嵬羣臣賦詩帝令御史大夫鄭惟忠及利用䕶送入蕃學士賦詩以餞徐彥伯為之序云楊㢘九日侍宴應制云逺目瞰秦坰重陽坐㶚亭既開黄菊酒還降紫微星簫皷諳仙曲山河入畫屏幸兹陪宴喜無以效丹青得亭字慈恩寺九日應制云萬乘臨真境重陽眺逺空慈雲浮鴈塔定水映龍宫寳鐸含飈響仙輪帶日紅天文将瑞色輝煥滿寰中沈佺期酬楊給事中㢘見贈臺中詩云子雲推辯博公理擅詞雄始自尚書省旋聞給事中言從溫室秘籍向鎻闈通張景源慈恩寺九日應制云飛塔凌霄起宸遊一届焉金壺新泛菊寳座即披蓮就日揺香輦憑雲出梵天祥氛與佳色相伴雜鑪煙李恒慈恩寺九日應制云寳地隣丹掖香臺瞰碧雲闗山江水出城闕樹中分睿藻蘭英秀仙杯菊蘂薰願将今日樂長奉聖明君唐詩紀事巻十二欽定四庫全書唐詩紀事巻十三宋計敏夫撰崔液張元一劉希夷鄭遂初王熊房融張敬忠崔珪沈祖仙盧崇道徐安期張紘薛曜袁暉李休烈邵士彥吴大江劉幽求賈曽楊齊哲魏元忠李夔司馬承禎
