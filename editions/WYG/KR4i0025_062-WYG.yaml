body:
  text: 鄭嵎津陽門詩云華清宫之外闕南局禁闈北走京道開元中嵎常得群書下帷於石甕僧觀而甚聞宫中陳跡焉今年冬自虢而來暮及山下因解鞍謀飡求客旅邸而主公年且艾自言世事明皇夜闌酒餘復爲嵎道承平故實翌日於馬上輙裁刻俚叟之話爲長句七言詩凡一千四百字成一百韻止以門題爲之目云耳津陽門北臨通逵雪風獵獵飄酒旗泥寒欵段蹶不進疲童退問前何爲酒家顧客催觧裝案前羅列樽與巵青錢𤨏屑安足數白醪軟羙甘如飴開爐引滿相獻酬枯腸渇肺忘朝飢愁憂似見出門去漸覺春色入四肢主翁移客挑華燈雙肩隠膝烏㡌欹笑云鮐老不爲禮飄蕭雪鬢霜垂頥問余何往凌寒曦顧翁枯朽郎豈知翁曽豪盛客不見我自爲君陳昔時時平親衞號羽林我纔十五爲孤兒射熊搏虎衆莫敵彎弧出入隨佽飛開元中未有東西神䇿軍但以六軍為親衛此時初創觀風樓簷髙百尺堆華榱樓南更起鬭鷄殿晨光山影相參差觀風樓在宫之外東北隅屬陜城而連上内前臨馳道周視山川寳應中魚朝㤙毁之以修章敬今遺址尚存唯鬬鷄殿與毬場迤邐尚在其年十月移禁仗山下櫛比羅百司朝元閣成老君見㑹昌縣以新豐移時有詔改新豐為㑹昌縣移自隂鱉故城置于山下至明年十月老君見于朝元閣南而於其䖏置䧏聖觀復改新豐爲昭應縣廨宇始成令大将軍髙力士率禁樂以落之幽州曉進供奉馬玉珂寳勒黄金覊安禄山毎進馬必殊特而極衘勒之飾五王扈駕夾城路傳聲校獵渭水湄六軍各出射絡野張罝維彫弓繡韣不知數翻身滅沒皆娥眉赤鷹黄鶻雲中來妖狐狡兎無所依人煩馬殆禽獸盡百里腥膻禾黍稀申王有髙䴡赤鷹岐王有北山黄鶻逸翮竒姿特異他等上愛之毎弋獵必置於駕前目為决勝兒暖山度臘東風㣲宫娃賜浴長湯池刻成玉蓮噴香液漱廻烟浪深逶迤宫内除供奉兩湯池内外更有湯十六所長湯毎賜諸嬪御其修廣與諸湯不侔甃以文瑶寳石中央有玉蓮捧湯泉噴以成池又縫綴綺繡爲鳬雁於水中上時於其間泛鈒鏤小舟以嬉㳺焉犀屏象薦雜羅列錦鳬繡鴈相追隨破簮碎鈿不足拾金溝殘溜和纓緌上皇寛容易承事十家三國爭光輝繞床呼盧恣樗博張燈逹晝相謾欺相君侈擬縱驕横日從秦虢多㳺嬉朱衫馬前未滿足更驅武卒羅旌旗楊國忠爲宰相帶劍南節度使常與秦虢聮轡而出更於馬前以兩川旌節為導也畫輪寳軸從天來雲中笑語聲融怡鳴鞭後騎何躞蹀宫粧禁袖皆仙姿青門紫陌多春風風中數日殘春遺驪駒吐沬一奮迅路人擁篲爭珠璣事盡載在國史中此下更重叙其事八姨新起合歡堂翔鵾賀鷰無由窺萬金酬工不肯去矜能恃巧猶嗟咨虢國創一堂價費萬金堂成工人償價之外更邀賞伎之直復受綘羅五千叚工者嗤而不顧虢國異之問其由工曰某生平之能殚於此矣茍不知信願得螻蟻蜥蝪蜂蠆之類去其目而投於堂中使有間隙得失一物即不論工直也於是又以繒綵珍貝與之山下人至今話故事者尚以第行呼諸姨焉四方節制傾附媚窮奢極侈沽恩私堂中特設夜明枕銀燭不張光鑒帷虢國夜明枕置扵堂中光燭一室西川節度使所進事載國史畧書之瑶光樓南皆紫禁梨園仙宴臨花枝迎娘歌㗋玉䆗窱蠻兒舞帶金葳蕤瑶光樓即飛霜殿之北門迎娘蠻兒乃梨園弟子之名聞者三郎紫笛弄烟月怨如别鶴呼覊雌玉奴琵琶龍香撥倚歌促酒聲嬌悲上皇善吹笛常寳一紫玉管貴妃妙彈琵琶其樂器聞於人間者有邏逤檀爲槽龍香栢爲撥者上毎執酒巵必令迎娘歌水調曲遍而太真輙彈絃倚歌爲上送酒内中皆以上爲三郎玉奴乃太真小字也飲鹿泉邊春露晞粉梅檀杏飄朱墀金沙洞口長生殿玉蘂峰頭王母祠山城内多馴鹿流澗號爲飲鹿有長生殿乃齋殿也有事扵朝元閣即御長生殿以沐浴也禁庭術士多幻化上前較勝紛相持羅公如意奪顔色三藏袈裟成散絲上頗崇羅公逺楊妃尤信金剛三藏上嘗幸功徳院将謁七聖殿忽然背痒公逺折竹枝化作七寳如意以進上大喜顧謂金剛曰上人能致此乎三藏曰此幻術耳僧爲陛下取真物乃扵袖中出如意七寳炳耀而公逺所進即時復爲竹枝耳後一日楊妃始以二人定優劣時禁中将創小殿三藏乃舉一鴻梁扵空中将中公逺之首公逺不爲動容上連命止之公逺飛符扵他處竊三藏金欄袈裟扵籄中守者不之見三藏怒又呪取之湏㬰而至公逺復噀水龍符扵袈裟上散爲絲縷以盡也蓬萊池上望秋月無雲萬里懸清輝上皇夜半月中去三十六宫愁不歸月中秘樂天半間丁璫玉石和塤箎宸聰聽覽未終曲却到人間迷是非葉法善常引上人入月宫時秋已深上苦凄冷不爲久留歸扵天半間尚聞仙樂及上歸且記憶其半遂扵笛中冩之㑹西梁都督楊敬述進婆羅門曲與其聲調相符遂以月中所聞爲之散序用敬述所進曲作其腔而名霓裳羽衣法曲千秋御節在八月㑹同萬國朝華夷花蕚樓南大合樂八音九奏鸞來儀都盧尋橦誠齷齪公孫劍伎方神竒馬知舞徹下牀榻人惜曲終更羽衣上始以誕聖日爲千秋節毎大酺㑹必扵勤政樓下使華夷縱觀有公孫大娘舞劍當時號爲雄妙又設連榻令馬舞其上馬衣紈綺而被鈴鐸驤首奮鬛舉趾翹尾變態動容皆中音律又令宫妓梳九綺仙髻衣孔雀翠衣佩七寳瓔珞爲霓裳羽衣之類曲終珠翠可掃其舞馬禄山亦将數疋以歸而私習之其後田承嗣代安有存者一旦扵廐上聞鼓聲頓挫其舞廐人惡之舉篲以撃之其馬尚爲怒未妍妙因更奮擊宛轉曲盡其態厮恐以告承嗣以爲妖遂戮之而舞馬自此絶矣禄山此時侍御側金鷄畫障當罘罳繡祤衣褓日屓贔甘言狡計愈嬌癡上毎座及宴㑹必令禄山坐扵御座側而以金鷄障隔之賜其箕踞太真又以爲子時襁褓戯而加之上亦呼之禄兒毎入宫必先拜貴妃然後拜上笑而問其故輙對曰臣本畨中人禮先拜母後拜父是以然也詔令上路建甲第樓通走馬如飛翬大開内府恣供給玉缶金筐銀簸箕時扵親仁里南陌爲禄山建甲第令中貴人督其事仍謂之曰卿善爲部署禄山眼孔大勿令笑我至扵篣筐簸箕釜缶之具咸金銀為之今回元觀即其故第耳異謀潜熾促歸去臨軒賜帶盈十圍禄山肥博過人腹垂而緩帶十五圍方周體忠臣張公識逆狀日日切諫上弗疑張曲江先識其必反逆状數數言扵上上曰卿勿以王夷甫識石勒而誤疑禄山尔湯成召浴果不至潼闗已溢漁湯師御街一夕無禁鼓玉輅順動西南馳其年賜柑子使回泣訴禄山反状云臣㡬不得生反上猶疑其言復遣使喻云我爲卿造一湯待卿至使回荅言反状上然後憂疑即冦軍已至潼闗矣九門回望塵坌多六龍夜馭兵衞疲縣官無人具軍頓行宫徹屋屠雲螭時郊畿草擾無御頓之備上命徹行宫朩宰御馬以饗士卒馬嵬驛前駕不發宰相射殺寃者誰長眉鬒髪作凝血空有君王潜涕洟青泥坂上到三蜀金堤城邊止九旂移文泣祭昔臣墓度曲悲歌秋鴈辭駕至蜀詔中貴人馳祭張曲江墓悔不納其諫又過劍閣下望山川忽憶水調辭云山川滿目淚沾衣富貴榮華能幾時不見只今汾水上唯有年年秋雁飛上泫然流涕顧問左右曰此誰人詩從臣對曰此李嶠詩復掩泣曰李嶠真可謂才子也明年尚父上㨗書洗清觀闕收封畿兩君相見望賢宫君臣鼓舞皆歔欷望賢宫在咸陽之東數里時車駕自蜀回肅宗迎駕上皇自致傳國璽扵上上歔欷拜授左右皆泣曰不圗今日復觀兩君相見之禮駕将入開逺門上皇疑焉上先後入門不决顧問從臣不能對髙力士前曰上皇雖尊人臣也皇帝雖子主也上皇偏門而先行皇帝正門而入後行耆老皆呼萬歳當時皆是之宫中親呼髙驃騎潜令改塟楊真妃花膚雪艶不復見空有香囊和淚滋時肅宗詔令改塟太真髙力士知其所瘞在嵬坡驛西北十餘歩當時乗輿怱遽無復備周身之具且以紫縟裹之及改塟之時皆已朽壊惟有胸前紫繡香囊中尚得氷麝香持以進上皇上皇泣而佩之鑾輿却入華清宫滿山紅實垂相思飛霜殿前月悄悄迎春亭下風颸颸飛霜殿即寢殿而白傳長憾歌以長生殿為寢殿殊誤矣上皇至眀年復幸華清宫信宿乃回自此遂移處西内中矣雪衣女失玉籠在長生鹿瘦銅牌垂象牀塵凝罨颯被畫檐蟲網頗梨碑太真養白鸚鵡西國所貢辨慧多辭上尤愛之字爲雪衣女上常扵芙蓉園中獲白鹿惟山人王旻識之曰此漢時鹿也上異之令左右周視之乃扵角際雪毛中得銅牌子刻之曰宜春苑中白鹿上由是愈愛之移扵北山目之曰山客上止華清罨􅪔公主嘗爲上晨召聽按新水調主愛起晚遽遺真珠被而出及冦至倉惶隨駕出宫後不知省及上歸南内一旦再入此宫當時罨颯之被宛然而塵積矣上尤感焉温泉堂碑其石瑩徹見人形影宫中號爲頗梨碑碧菱花覆雲母陵風篁雨菊低離披真人影帳偏生草果老藥堂空掩扉真人李順興後周時修道北山神堯皇帝授禪真人潜告符契至今山下有祠宇宫中有七聖殿自神堯至睿宗所植俱擁腫矣南有功徳院其間瑶壇羽帳皆在焉順興影堂果老藥室亦在禁中也鼎湖一日失弓劒橋山烟草俄霏霏空聞玉椀入金市但見銅壺飄翠帷開元到今踰十紀當初事跡皆殘隳竹花唯養棲梧鳯水藻周㳺巢葉龜㑹昌御宇斥内典去留二敎分黄緇慶山汙瀦石甕毁紅樓緑閣皆支離竒松恠柏爲樵蘇童山眢谷亡嶮􅇖煙中壁碎摩詰畫雲間字失𤣥宗詩持國寺夲名慶山寺徳宗始改其額寺冇緑額複道而上天后朝以禁臣取宫中制度結構之石甕寺開元中以創造華清宫餘材修繕佛殿中玉石像皆幽州進來與朝元閣道像同日而至精妙無比叩之如磬餘像並楊惠之手塑肢空像皆元伽兒之制能妙纎麗曠古無儔紅樓在佛殿之西巖下臨絶壁樓中有𤣥宗題詩草八分毎一篇一體王右丞山水兩壁寺毁之後皆失之矣摩詰乃王維之字也石魚巖底百尋井銀床下巻紅綆遲當時清影䕃紅葉一旦飛埃埋素規石魚嵓下有天絲石其形如甕以佇飛泉故上以石甕爲寺名寺僧扵上層飛樓中縣轆轤叙引修笮長二百餘尺以汲甕泉出扵紅樓喬樹之杪寺既毁拆石甕今已埋没也韓家燭臺倚林杪千枝燦若山霞摛昔年光彩奪天月昨日銷鎔當路岐韓國爲千枝燈臺髙八十尺置于山上毎至上元夜則燃之千光奪月凡百里之内皆可望焉龍宫御牓髙可惜火焚牛挽臨﨑峗孔雀松殘赤琥珀鴛鴦瓦碎青琉璃寺額睿宗在藩邸中所題也標扵危樓之上世傳孔雀松下有赤茯苓入圡千年則成琥珀寺之前峯古松老柏洎乎嘉草今皆樵蘇蕩除矣今我前程能幾許徒有餘息筋力羸逢君話此空灑涕却憶歡娯無見期主翁莫泣聽我話寜勞感舊休吁嘻河清海宴不難覩我皇已上昇平基湟中土地昔湮没昨夜收復無瘡痍戎王北走棄青塜虜馬西奔空月支兩逢堯年豈易偶願翁頥養豐膚飢平明酒醒便分首今夕一罇翁莫違唐詩紀事巻六十二欽定四庫全書唐詩紀事巻六十三宋計敏夫撰方干劉駕王駕衞凖詹雄顧非熊司空圖秦韜玉潘誠胡駢髙駢潘緯武瓘于鄴路徳延
