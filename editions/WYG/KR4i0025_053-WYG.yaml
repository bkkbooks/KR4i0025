body:
  text: 喬琳緜州越王樓即事云三蜀澄清郡政閑登樓携酌日躋攀頓覺胸懐無俗事廽看掌握是人寰灘聲曲折涪州水雲影低銜富樂山行鴈南飛似鄉信忽然西笑向秦闗琳為郭子儀朔方掌書記與連舍畢曜相掉訐貶巴州司戸參軍厯果綿遂懐四州刺史建中初為朱泚叛為偽吏部尚書後伏誅臨刑歎曰我以七月七日生以此日死非命耶王鋋登越王樓見喬公詩偶題云雲架重樓出郡城虹梁雅韻仲宣情越王空置千年跡丞相兼揚萬古名過鳥時時衝客㑹閑風往往弄江聲謬將蹇歩尋芳躅魚目驪珠豈繼眀鋋大厯中代喬琳為綿州刺史于興宗夏杪登越王樓臨涪江望雪山寄朝中知友詩云巴西西北樓堪望亦堪愁山亂江廽逺川清樹欲秋晴明中雪嶺煙靄下魚舟寫寄朝天客知予恨獨逰大中時以御史中丞守緜州後為洋川莭度初在左緜作此詩和者李朋楊牢軰皆朝中知友也許渾訓緜州于中丞見寄云故人書信越褒斜新意雖多舊約賖皆就一麾先去國共謀三徑未還家荆巫夜隔巴江月鄔郢春連漢上花半月離居猶恨望可堪垂白各天涯李朋綿州中丞以江山小圗逺垂賜及兼寄詩云巴江與雪山井邑共廽環圗冩丹青内分明煙靄間移君名郡興助我小齋閑日想登臨處髙蹤不可攀朋為尚書郎和于興宗詩朋除刑部貟外郎制云將仕郎御史李朋能積行實發其辭華方正端慎官業克舉杜牧之句楊牢牢洪農人少孤年六嵗母俾入雜學誤入人家乃父友也方彈棋戲以局為題俾牢賦之應聲曰魁形下方天頂亞二十四寸牕中月年十八中第奉酬于中丞見寄之什詩云劔外書来日驚忙自拆封丹青得山水强健慰心胸事少勝諸郡江廽見㡬重寧悲久作别且似一相逢詩合焚香詠愁應頼酒濃庾樓寒更憶腸斷雪千峰牢登大中二年進士第最有詩名大中時顧陶作唐詩類選去取甚嚴其初云刪㝎之初如楊牢等十數公時猶在世及稍稍淪謝一萹一詠未稱所錄若續有所得當列為巻軸庶無遺恨李汶儒和緜州于中丞詩云珍重巴西守殷勤寄逺情劔峰當户碧詩韻滿樓清日照涪川闊煙籠雪嶠明徴黄看即及莫歎滯江城汶儒登太和五年進士第官至翰林學士汶儒守禮部員外郎充翰林學士制云才行冠時名聲曅然揚厯臺閣宣昭職業無入而不得其道守正而莫混其源並為儒者之英獨藴賢人之操久逰安在相見何晚杜牧之詞薛䝉和綿州于中丞詩云左綿江上樓五馬此銷愁暑退千山雪風来萬水流邅廽猶刺郡繫滯似維舟即有徴黄日名川莫厭逰䝉時為考功郎李鄴和緜州于中丞詩云長聼巴西事看圗勝所聞江楼眀返照雪嶺亂晴雲景象詩情在幽竒茟跡分使君徒説好不抵怨離羣鄴時為户部郎官于瓌和緜州于中丞詩云樓因藩邸號川勢似依樓顯敞含清暑風光入素秋山宜姑射貌江泛李膺舟郢曲思朋執輕紗畫勝逰又云極目郡城樓浮雲拂檻愁政成多暇日詩思覺先秋逺霽千巗雪随波一葉舟昔曽窺粉繪今願許陪逰瓌字正徳敖之子也大中七年進士苐一人時為校書郎王嚴和于中丞詩云雉堞臨朱檻登兹便散愁蟬聲怨炎夏山色報新秋江轉穿雲樹心閑随葉舟仲宣徒有歎謝守㡬追逰嚴大中時布衣劉騤題越王樓寄獻中丞使君詩云朱軒逈壓碧煙州昔嵗賢王是勝逰山簇劍峰朝闕逺水如巴字遶城流人間物象分千里天上笙歌醉五侯今日登臨無限意同霑恵化自銷愁騤時為鄉貢進士李渥秋日登臨越王樓詩曰越王曽牧劔南州因向城隅建此樓横玊逺開千嶠雪暗雷下聽一江流畫簷先弄朝陽色朱檻低臨衆朩秋徒學仲宣聊四望且將詞賦好依劉渥時為鄉貢進士後登第劉璐洋州于中丞頃牧左綿題詩越王樓上朝賢繼和輙課四韻詩云隔政代君侯多慙跡令猷山光来户牖江鳥滿汀洲雅韻徴朝客清詞寫郡樓至今謡未已注意在洋州璐為綿州刺史隔政代興宗璐曽刺蜀州盧栯和于中丞見寄詩云圗畫越王樓開緘慰别愁山光涵雪冷水色帯江秋雲島孤征鴈煙帆一葉舟嚮風舒霽景如伴謝公逰栯時為洪文館學士李續和中丞見寄詩云早年登此樓退想不勝愁地逺二千里時將四十秋續相從東川奏舉過綿州刺史韋洪臯尚書携登此樓扵今三十七年矣邅迍多失路華皓任虚舟詩酒雖堪使何因得共逰續時為同州刺史盧求和于中丞見寄詩云髙情推謝守善政属綿州未落紫泥詔閑登白雪樓晴江如送日寒嶺鎮迎秋滿壁朝天士唯予不繫舟求登寳厯二年進士第李翺之婿也翺典合淝有道人號先知始翺妹婿楊嗣復知舉求落第至是嗣復再知舉道人以小巻遺嗣復曰放榜日開之洎放榜開巻乃曰裴頭黄尾三求六李時第一人裴求榜末黄駕次則李俅盧求又李方𤣥従毅道裕景初李助李俅共六人道人又謂翺曰公之子不如外孫後求子携鄭亞子畋李審權子遜能為相皆翺外孫也田章和于中丞云志乖多感物臨眺更増愁暑候雖云夏江聲已似秋雪遙難辨朩村近好維舟莫恨歸朝晚朝簮擬勝逰章登開成四年進士第髙璩白敏中自劍南節度移荆南經忠州追尋樂天遺迹有詩云南浦花臨水東樓月映風璩時為書記有詩云公齋一到人非舊詩板重尋墨尚新璩自梓州刺史入朝經綿州與刺史薛逢登越王樓逢以詩贈别云乗遞初登劔外州傾心喜事富平侯方當㳺藝依仁日便到攀轅卧轍秋客聽巴歌消子夜許陪仙躅上危樓欲知恨戀情深處聽取長江旦暮流璩和云劍外緜州苐一州罇前偏喜接君留歌聲婉轉添長恨管色凄凉似到秋但務歡娱思曉角獨耽雲水上髙樓莫言此去難相見怨别徴黄是順流璩字瑩之第進士第翰林學士擢諫議大夫學士超省郎進官者惟鄭顥以尚主而璩以寵升懿宗時為宰相卒曺鄴言璩宰相交㳺醜雜進取多蹊徑諡法不思妄愛曰刺請諡為刺牛徴登越王樓即事詩云危樓送逺目信美奈鄉情轉㟁孤舟疾銜山落照眀蕭條看草色惆悵認江聲誰㑹登臨恨従軍白髪生徴登咸通二年進士第叢之子也蕭祐逰石堂觀詩云西山髙髙何所如上有古昔真人居嶔崖巨石自成室其下磅礴含清虛我来斯邑訪遺迹乃遇沈生躭載籍沈生為政哀惸嫠又能索隠探靈竒欣然向我話佳境與我﨑嶇到山頂甘𤓰割綠出寒泉碧甌浮花酌春茗嚼𤓰啜茗身清凉汗消絺綌如迎霜胡為空山百草花倐爾籩豆肆我旁始驚知周無大小力寡多方驗斯在妙用騰聲冠葢間勝逰恣意煙霞外故碑石像凡㡬年雲鬱雨霏生綠煙我知逰此多靈仙縹緲月中飛下天天風㣲微夕露委松梢颼颼曉聲起鳳去空遺簫管音星翻零落銀河水勸君學道此時来結茅獨宿何遼哉齋心𤣥黙感靈衛必見鸞鶴相徘徊我愛崇山䨇劔北峰如人首拄天黒俗呼為人頭山羣仙傴僂勢奔走狀若歸尊超有徳半巗有洞頂有池出入靈怪潜蛟螭我去不得晝夜思夢逰曽信南風吹南風吹我到林嶺故國不見秦天逈山花名草撲地香月色泉聲洞心冷䕃松散髪逢異人寂寞曠然口不言道陵公逺莫能識髪短耳長誰獨存司農驚覺忽惆悵可惜所逰俱是妄藴懐耿耿誰與言直至今来意通形神開擁傳又恨斜陽催一􅏀人境尚堪戀何况海上金銀臺祐扵唐為祠部郎中魏謩宣宗重陽錫宴群臣有御製詩其略曰欵塞旋征騎和戎委廟賢傾心方倚注叶力共安邉宰臣以下應制皆和上曰宰相魏謩詩㝡佳其兩聨云四方無事去宸豫杪秋来八水寒光起千山霽色開上嘉賞久之魏蹈舞拜謝群僚聳視魏有得色極歡而罷謩字申之文宗時以直言拜右補闕大中時鎮蜀宣宗曰謩名臣孫有祖風朕心憚之然卒以剛正為令狐綯所忌讒罷之陸肱松詩云霜雪知勁質今古占嘉名斷砌盤根逺踈林偃盖清鶴栖何代色僧老四時聲鬱鬱心彌久煙髙萬井生肱大中九年登進士第咸通六年自前振武從事試平判入等後牧南康郡辟許棠為郡従事鄭谷寄詩云江山多勝境賔主是貧交肱以春賦得名李商隠商隠字義山懐州人英國公世勣裔孫令狐楚帥河陽竒其文使與諸子㳺楚厯鎮表為廵官卒扵工部侍郎商隠累佐王茂元鄭亞栁仲郢故樊南甲乙之集作焉温庭筠段成式俱以儷偶相夸號三十六體楊大年出義山詩示陳恕酷愛一絶云珠箔輕明覆玊墀披香新殿鬬腰支不須看盡魚龍戯終遣君王怒偃師嘆曰古人措辭寓意如此深妙令人感慨不已大年又曰鄧帥錢若水舉賈誼兩句云可憐半夜虚前席不問蒼生問鬼神錢云措意如此後人何以企及鹿門先生唐彦謙為詩纂慕玉溪得其清峭感愴盡其一體也然警絶之句亦多有商隠賦云豈如河畔牛星隔年只聞一過不及苑中人栁終朝剰得三眠注漢中有人形栁一日三起三側義山少逰投宿逆旅主人㑹客召與坐不知其為義山也酒酣席客賦朩蘭花詩義山後就曰洞庭波冷曉侵雲日日征帆送逺人㡬度朩蘭舟上望不知原是此花身坐客覽之大驚詢之乃義山也商隠為彭陽公從事彭陽之子綯繼有韋平之拜惡商隠從鄭亞之辟以為忘家恩疎之重陽日商隠留詩於其㕔事曰曽共山翁把酒巵霜天白菊遶堦墀十年泉下無消息九日罇前有所思不學漢臣栽苜蓿空教楚客詠江蘺郎君官貴施行馬東閣無因再得窺綯乃補太學博士尋為東川栁仲郢判官府罷客滎陽卒錦瑟詩云錦瑟無端五十絃一絃一柱思華年莊生曉夢迷蝴蝶望帝春心託杜鵑滄海月明珠有淚藍田日暖玉生煙此情可待成追憶只自當時已惘然或云錦瑟令狐楚之妾劉得仁聽松聲詩曰庭際㣲風暖髙松韻自生聽時無物亂盡日覺神清强以幽泉並翻嫌細雨并拂空増鶴唳過牖合琴聲况復當秋杪偏宜在月明不知幽㵎厎􅀈􅀈有誰聼樂逰原春望云樂逰原上望望盡帝城春始覺繁華地應無不醉人雲開䨇闕麗栁映九衢新愛此偏髙野閑来竟日頻題邵公禪院云無事門多掩隂階竹掃苔勁風吹雪聚渇鳥啄氷開樹向寒山得人從瀑布来終期天目老擎錫逐雲回悲老宫人云白髪宫娃不觧悲滿頭猶自揷花枝曽緣玉貎君王愛准擬人看似舊時得仁貴主之子自開成至大中三朝昆弟皆厯貴仕而得仁苦扵詩出入舉場三十年卒無成常自述曰外家雖是帝當路且無親又云外族帝王是中朝親故稀翻令浮議者不許九霄飛既終詩人競為詩弔之僧栖白詩曰忍苦為詩身到此氷魂雪魄已難招若教桂子落墳上生得一枝寃始銷吟苦曉燈暗露深秋草疎舊山多夢到流水送愁餘句風定一池星句右張為取作主客圗宿宣義里池亭云暮色遶柯亭南山幽竹青夜深斜舫月風㝎一池星島嶼無人傍菰蒲有鶴翎此中休便得何必泛滄溟聽歌云朱檻滿明月美人歌落梅忽驚塵起處疑有鳳飛来一曲聽初徹㡬年愁暫開東南正雲雨不得見陽臺長信宫云簟凉秋氣初長信恨何如拂黛月生指觧鬟雲滿梳一従悲畫扇㡬度泣前魚坐聽南宫樂清風揺翠裙唐詩紀事巻五十三欽定四庫全書唐詩紀事巻五十四宋計敏夫撰韋表㣲羅𢎞信髙崇文王智興劉綺莊馬戴孟遲南卓鄭顥李羣玉温庭筠周繇韋表㣲表㣲字子明韋臯鎮西川王緯司空曙獨孤良弼裴説居幕府厚相推挹以表㣲比衛玠自以不能及也遷中書舍人敬嘗語左右欲相二韋會崩處厚以父事表㣲池州夫子廟麟臺碑銘曰二儀既閉三象乃乖聖道埋鬱人心不開上無文武下有定哀吁嗟麟兮孰為來哉周雖不綱孔實嗣聖詩書既刪禮樂大定勸善懲惡姦邪乃正吁嗟麟兮克昭符命聖與時合化行位尊茍或乖戾身窮道存於昭魯邑栖遑孔門吁嗟麟兮孰知其仁運極數殘徳至時否楚國寖廣秦封益侈墻仞廹阨﨑嶇闗里吁嗟麟兮靡有攸止世治則麟世亂則麏出非其時麋鹿同羣孔不自聖麟不自祥吁嗟麟兮天何所亡羅𢎞信柳詩云粧㸃青春更有誰青春常許占先知亞夫營畔風輕處元亮門前日暖遲花宻宛如飄六出葉繁何惜借雙眉交情别緒論多少好向仁人贈一枝詠白菊云雖被風霜競欲催皎然顔色不低摧已疑素手能粧出又似金錢未染來香散自宜飄渌酒葉交仍得䕃蒼苔尋思閉户中宵見應認寒忩雪一堆𢎞信字徳孚魏州人為魏博節度使髙崇文崇文本薊門將校討劉闢有功為西川節度使渤海鄙言呼人為􅐴兒一旦雪下崇文謂賔客曰某雖武夫亦有一詩乃吟曰崇文崇武不崇文提戈出塞號將軍那箇􅐴兒射鴈落白毛空裏雪紛紛或謂北齊敖曹之比也出比夢𤨏言王智興智興為徐州節度一日從事於使院㑹飲賦詩智興召䕶軍俱至從事屏去翰墨智興曰適聞作詩何獨見某而罷復以牋陳席上小吏亦置牋於智興前於是引毫立成曰三十年前老徤兒剛被郎官遣作詩江南花柳從君詠塞北煙塵獨我知四座驚嘆監軍謂張祐曰觀兹盛事豈得無言祐乃獻詩曰十年受命鎮方隅孝節忠規兩有餘誰信将壇嘉政外李陵章句右軍書左右曰書生謟辭耳智興叱曰有人道我惡汝軰又肯否張生海内名士篇什豈昜得天下人間且以為王智興樂善矣劉綺荘揚州送人詩云桂檝朩蘭舟楓江竹箭流故人從此去望逺不勝愁落日低㠶影歸風引棹謳思君折楊柳淚盡武昌樓置酒云酒熟人湏飲春還鬢已秋願逄千日醉得逭百年愁卒卒周姫旦棲棲魯孔㐀平生能幾日不及且遨遊尤善樂府嘗守藩服與白敏中崔元式韋琮相知宣宗時人也馬戴易水懐古詩云荆卿西去不復返易水東流無盡期落日蕭條薊城北黄沙白草狂風吹送客南遊云擬卜何山隐髙秋指岳陽葦乾雲夢色橘熟洞庭香踈雨殘虹影回雲背鳥行靈均如可問一為哭清湘河梁别云河梁送别者行哭半非親此地足征戰胡天多殺人金罍照離席寳瑟凝青春中秋夜對月云隂魄出海上望之増苦吟冷搜驪頷重寒徹蚌胎深皓氣籠諸夏清光射萬岑悠然天地内皎潔一般心校獵曲云楚子畋郊野布罟籠天涯浮雲張作羅萬草結成罝意在絶飛鳥臂弓腰鏌鋣逺将射句踐次欲誅夫差許棠乆困名塲咸通末戴佐大同軍幕棠徃謁之一見如舊相識留連數月但詩酒而已未嘗問所欲一旦大㑹賔友命使者以棠家書授之棠驚愕莫知其來啓緘即知戴潜遣一介䘏其家矣戴與姚合善合贈詩云天府鹿鳴客幽山秋未歸我知方甚善衆説以為非隔石聞泉細和風見鶴飛新詩此處得清峭比應稀合又有送戴下第客遊詩云昨夜送君處亦是九衢中此日慇懃别前時寂寞同鳥啼寒食雨花落暮春風向晩離人别筵收樽未空戴酬姚合歸字韻詩云岐路非人見尚得起心中日憶瀟湘渚春生蘭桂叢鳥啼花半落客散爵方空所贈誠難答冷然一雅風蠻家云領得賣珠錢還歸銅柱邊㸔兒調小象打鼓放新船醉後眠神樹耕時語瘴煙又逄衰蹇老相問莫知年夕次淮口云天涯秋光盡木末羣鳥還夜乆遊子息月明岐路閑風生淮水上㠶落楚雲間此意竟誰是行行非故闗夕發邠中路却寄舒從事云飲酣走馬别别後鏁邊城日落月未上鳥棲人獨行方馳故國戀復愴長年情乆夜不能息何當閑此生楚江懐古云露氣寒光集㣲陽下楚􅏀猿啼洞庭樹人在朩蘭舟廣澤生明月蒼山夾亂流雲中君不見竟夕自悲秋金華子云戴大中初掌書記於大原李司空幕以正言被斥貶龍陽尉行道興詠以自傷其方城懐古云申胥任向秦庭哭靳尚終貽楚國羞新春聞赦云道在猜䜛息仁深疾苦除堯聰能下聽湯網
