body:
  text: 宮詞一百首蓬萊正殿壓金鼇紅日初生碧海濤開着五門遥北望柘黃新帕御床高殿前傳㸃各依班召對西來八詔蠻上得青花龍尾道側身偷覷正南山龍煙日氣紫曈曈宣政門當玉殿風五刻閣前卿相出下簾聲在半天中白玉䆫中起草臣櫻桃初出賜嘗新殿頭傳語金階逺因進詞來謝聖人内人對御疊花牋綉坐移來玉案邊紅䗶燭前呈草本平明舁出閤門宣千牛仗下放朝初玉案傍邊立起居每日請來金鳳紙殿頭無事不教書延英引對碧衣郎江硯宣毫各别床天子下簾親考試宮人手裏過茶湯此詩亦云微之作未明開着九重關金畵黃龍五色幡直到銀床排仗合聖人三殿對西畨少年天子愛邊功親到凌煙畵閣中教覔勲臣冩圖本長敎殿裏作屏風丹鳳樓門把火開先排法駕出蓬萊棚前走馬人傳語天子南郊一宿廻樓前立仗㸔宣赦萬歳聲長再拜齊日照綵盤髙百尺飛仙爭上取金雞集賢殿裏圖書滿㸃勘頭邉御印同真跡進來依字數别收鏁在玉凾中秋殿清齋刻漏長紫微宮女夜焚香拜陵日到公卿發鹵簿分頭入太常新調白馬怕鞭聲供奉騎來遶殿行爲報諸王侵早起隔門催進打毬名對御難爭第一籌殿前不打背身毬内人唱好龜兹急天子龍輿過玉樓新衫一様殿頭黃銀帶排方獺尾長揔把金鞭騎御馬綠緵紅額麝煙香羅衫葉葉綉重重金鳳銀鵝各一藂每遍舞頭分兩向太平萬歳字當中魚藻宮中鎖翠娥先皇行處不曾過如今池底休鋪錦菱角鵶頭積漸多殿前明日中和節連夜瓊林散舞衣傳報所司供蠟燭監門金鎖放人歸五更五㸃索金車盡放宮人出㸔花仗下一時催立馬殿頭先報内園家城東南北望雲樓半下珠簾半上鈎騎馬行人長逺過忽防天子在樓頭射生宮女宿紅粧請得新弓各自張臨上馬時齊賜酒男兒跪拜謝君王新秋白兎大於拳紅耳霜毛趂草眠天子不教人射煞玉鞭遮到馬蹄前内鷹籠脫解紅縚戴勝争飛出手髙直到碧雲還却下一雙金爪菊花毛競渡舡頭掉綵旗兩邊泥水濕羅衣池東争向池西岸先到先書上字歸燈前飛入玉堦蟲未卧嘗聞半夜鐘㸔着中元齋日到自盤金線綉真容步行送出長門逺不許來辭舊院花只恐他時身到此乞來自在得還家一時起立吹簫管得寵人來滿殿迎整頓衣裳皆着節舞頭當拍第三聲琵琶先抹六么頭小管丁寜側調愁半夜美人雙起唱一聲聲出鳳凰樓春池日暖少風波花裏牽舡水上歌遥索劒南新様錦東宮先釣得魚多十三初學擘箜篌弟子名中被㸃留昨日教坊新進入並房宮女與梳頭紅蠻捍撥帖胷前移坐當頭近御筵用力獨彈金殿響鳳凰飛出四條絃春風吹曲信旗竿自得深宮不怕寒誇道自家先上馬團中橫過覔人㸔粟金腰帶象牙錐散揷紅翎玉突支旋獵一邊還引馬歸來花鴨遶鞍垂雲駮月騘各試行一般毛色一般纓殿前來徃重騎過欲得天恩别賜名每夜停燈熨御衣銀燻籠底火霏霏遥聽帳裏君王覺上直聲鐘始得歸因喫櫻桃病放歸三年着破舊羅衣内中侍從來還去結得金花上貴妃欲迎天子㸔花去下得金堦却悔行恐見失恩人舊院廽來憶着五絃聲徃來舊院不堪修近敇宣徽别起樓聞有美人新入内宮中未識大家愁自誇歌舞勝諸人恨未承恩出内頻連夜宮中修理院地衣簾額一時新悶來無處可思量旋下金堦旋下床收得山丹紅蘂粉牎中洗却麝香黃嫌羅不着索輕􅀈對面交人染褪紅衫子成來一遍出今朝㸔處滿園中合暗報來門鎖了夜深應别喚笙歌房中下着珠簾睡月過金堦白露多御厨不食索時新每見花開即苦春白日卧多嬌似病隔簾敎喚女醫人藂藂洗手遶金盆旋拭紅巾入殿門衆裏遥抛金橘子在前收得便承恩御波水色春來好處處分流白玉渠宻奏君王知入月喚人相伴洗裙裾移來女樂部頭邊新賜花檀大五絃縱得紅羅手帕子當心香畫一雙蟬新晴草色暖温暾山雪初消漸出渾今日踏青歸校晚傳聲留着苑東門兩簷新換珠簾額中尉明朝設内家一様金盤五千箇紅蘇㸃出牡丹花舞送香毬出内家記廵傳把一枝花散時各自燒紅燭相逐行歸不上車家常愛着舊衣裳空戴紅梳不作粧忽地下堦衣帶解非時應得見君王宣勑敎歌不出房一聲一遍報君王再三博士留殘拍索向宣徽作徹章行中第一頭先舞愽士傍邉亦被欺忽覺管絃偷急遍翩翩羅袖不敎知同黄縫校捨釵梳欲得金仙觀内居近被天恩知識字收來按上撿文書月冷江清近臘時玉堦金瓦雪澌澌浴堂門外抄名入公主家人謝面脂未承恩澤一家愁乍到宮中憶外頭求首管絃聲欵逐側商調裏唱伊州東風潑潑雨新休弄盡春風蕩雪溝走馬犢車當御路漢陽公主進雞毬風簾水閣壓芙蓉四面鈎欄在水中避熱不歸金殿宿秋河織女夜燈紅聖人生日明朝是私地先須屬内監自冩金花紅榜予前頭先進鳳凰衫避脫昭儀不擲盧井邉含水噴鵶雛内中數日無呼喚冩得滕王蛺蝶圖内宴初秋入二更殿前燈火一天明宮官分半音聲住諸院門開觸處行玉蟬金掌三層揷翠髻髙藂緑鬢虛舞處春風吹落地歸來别賜一頭梳樹葉初成鳥出窠石榴花裏笑聲多舞中遺却金釵子拾得從他要賞羅小殿新裝粉欲乾貴妃姊妹盡來㸔爲逢好日先移入續向街西索牡丹内人相續報花開准擬君王便㸔來縫着五絃琴綉袋宜春院裏按歌廻廵吹慢遍不相和暗㸔誰人曲校多明日棃花園裏見先須逐得内家歌黃金合裏盛紅雪重結香羅四出花一一傍邊書勑字分明送與大臣家未明東上閤門開排仗聲從後殿來阿監兩邊相對立遥聞索馬一時廽宮人早起笑相呼不識堦前掃地夫乞與金錢争借問外頭還似此間無小隨阿姊學吹笙好見君王乞與名夜掃玉床朝把鏡黃金堦下不敎行日髙殿裏有香煙萬歳聲來動九天妃子院中初降誕内人爭乞洗兒錢宮花不共外邊同正月長生一朶紅供御櫻桃㸔守别直無鵶鵲在園中殿前鋪設兩邊樓寒食宮人歩打毬一半走來爭跪拜上棚先謝得頭籌太儀前日暖房來囑和昭陽乞藥栽勑賜一窠紅躑躅謝恩未了奏花開床前謝賜紫羅襦不下金堦上軟輿官局揔來為喜樂院中新拜内尚書鸚鵡誰敎轉舌關内人手裏飬來姦語多近更承恩澤數對君王憶隴山分眀閑坐賭櫻桃休却投壺玉腕勞各把沉香雙陸子局中鬬得壘髙高禁寺紅樓内裏通笙歌引駕夾城中褁頭官監當前立手把牙鞘竹彈弓春風院院落花堆金鎻衣生掣不開更築歌臺起粧殿明朝先進畫圖來舞來汗濕羅衣徹樓上人扶下玉梯歸到院中重洗面金盆水裏撥紅泥宿粧殘粉未明天揔在朝陽花樹邊寒食内人長白打庫中先散與金錢衆中愛得君王笑偷把金箱筆硯開書破紅蠻隔子上旋催當直美人來後宮宮女無多少起得園中笑一團舞蝶落花相㸔着春風共語亦應難黛眉小婦砑裙長惣被抄名入敎坊春設殿前多隊舞棚頭各别請衣裳水中芹葉土中花拾得還將避衆家揔待别人般數盡袖中捻得鬱金牙玉簫改調移纎指催赴紅羅綉舞筵未着柘枝花帽子兩行宮監在簾前牎牎戸戸院相當揔有珠簾玳瑁床雖道君王不來宿帳中長是炷衙香銀燭秋光冷畫屏輕羅小扇撲飛螢天階夜色凉如水卧㸔牽牛織女星雨入珠簾滿殿凉避風新出石盆湯内人恐要秋衣着不住熏籠換好香金吾除夜進儺名畫袴朱衣四隊行院院燒燈如白日沉香火底坐吹笙樹頭樹底覔殘紅一片西飛一片東自是桃花貪結子錯教人恨五更風金殿當頭紫閤重仙人掌上玉芙蓉太平天子朝迎日五色雲車駕六龍日晩長秋簾外報望陵歌舞在明朝添爐欲爇熏衣麝憶得分時不忍燒日映西陵松栢枝下臺相顧一相悲朝來樂部歌新曲唱着君王自作詞淚盡羅巾夢不成夜深前殿按歌聲紅顏未老恩先斷斜倚熏籠坐到明新鷹初放兎方肥白日君王在内稀薄暮千門臨欲鎻紅粧飛騎向前歸黃金捍撥紫檀槽絃索初張調更髙盡理昨來新上曲内官簾外送櫻桃鴛鴦瓦上忽然驚晝寢宮娥夢裏聲元是吾皇金彈子海棠窠下打流鶯寶仗平明金殿開暫將紈扇共徘徊玉顏不及寒鵶色猶帶昭陽日影來閑吹玉殿昭華管醉打梨園縹蒂花千年一夢歸人世絳縷猶封繫臂紗建初爲渭南尉值内官王樞宻者盡宗人之分然彼我不均復懐輕謗之色忽過飲語及漢元靈信任中官起黨錮興廢之事樞宻深憾其譏乃曰吾弟所有宮詞天下皆誦於口禁掖深䆳何以知之建不能對後爲詩以贈之乃脫其禍建詩曰先朝行坐鎮相隨今上春宮見長時脫下御衣偏得着進來龍馬每教騎常承宻㫖還家少獨對邉情出殿遲不是當家頻向說九重爭遣外人知上李庶子云紫煙樓閣碧沙亭上界詩仙獨自行奇險驅回還寂寞雲山經用始鮮明藕綃紋縷裁衣滑鏡水波濤濾得清昏思願因秋露洗幸容階底禮先生建赴陜州司馬樂天夢得以詩送之夢得詩云暫輟清嚴出太常空携詩巻赴甘棠府公旣有朝中舊司馬應容酒後狂案牘來時唯署字風煙入興便成章兩京大道多遊客每遇詞人戰一場樂天詩云陜州司馬去何如養靜資貧兩有餘公事閑忙同少尹俸錢多少敵尚書只携美酒閑爲伴惟作新詩趂下車自有鐡牛無詠者計君投刃必應虛張籍贈建詩云早在山東聲價逺曾將順策佐嫖姚識來詩句無閑語老去官班未在朝身屈只聞詞客說居貧多見野僧招獨從詩閣歸來晚春水橋邊㸔柳條建大歴進士爲昭應丞太府寺丞終於司馬建在昭陽楊巨源寄詩曰武皇金輅輾香塵毎歳朝元及此辰光動泉心初浴日氣蒸山腹揔成春謳歌日入雲韶曲詞賦方歸侍從臣瑞靄朝朝猶望幸天教赤縣有詩人唐詩紀事巻四十四欽定四庫全書唐詩紀事巻四十五宋計敏夫撰朱灣王良㑹
