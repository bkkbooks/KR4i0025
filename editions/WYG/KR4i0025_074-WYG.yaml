body:
  text: 僧文秀僧尚能僧棲白僧無可僧神頴僧懷濬僧應物僧可朋僧雲表僧文秀端午詩云節分端午自誰言萬古傳聞爲屈原堪笑楚江空浩浩不能洗得直臣寃秀唐末詩僧也鄭谷喜秀上人相訪詩有他夜松堂宿論詩更入㣲之句又次韻秀上人長安寺居言懐云舊齋松老别多年香社人稀䘮亂間出寺只知趍内殿閉門長似在深山又重訪秀上人云展畫長懐呉寺殿宜茶偏賞霅溪泉又寄題詩僧秀公云靈一心傳清塞心可公吟後楚公吟近來雅道相親少唯仰吾師所得深好句未停無暇日舊山歸老有東林吟曹孤宦甘寥落多謝携笻數訪尋秀南僧也而居長安以文章應制故谷送遊五臺詩云内殿評詩切身回心未回僧尚能中秋旅懷云所畜惟騷雅兼之得固窮望鄉連北斗聽雨帶西風稼穡村坊逺烟波路逕通冥搜清絶句恰似有神功僧棲白中秋夜月云尋常三五夕不是不嬋娟及到中秋半還勝别夜圓清光凝有露皓色爽無煙自古人皆玩年來更一年哭劉得仁云爲愛詩名剛到此風魂雪魄去難招直教桂子落墳上生得一枝寃始銷送造㣲上人遊五臺及禮本師云寒空金錫響欲過渭陽津極目多來鴈孤城少故人與師雖别乆於法本相親又對清凉月中宵語宿因送僧歸舊山云談空與破邪獻夀復榮家白日得何偈青天落幾花傳燈皆有分化俗獨無涯却入中峰寺還知有聚沙曹松薦福贈白上人云才子紫檀衣明君寵顧時講昇髙座懶書荅重臣遲瓶勢傾圓頂刀聲落碎髭還聞穿内禁隨駕進新詩李洞贈白上人云險倚石屏風秋濤夢越中前朝吟侶散故國講流終北地聞巴狖南山見磧鴻樓髙驚雨濶朩落覺城空兎滿期姚監蟬稀别楚公浄瓶光照客柱杖朽生蟲平地塔千尺半空燈一籠祝堯談幾句旋鴈海潮東洞又哭白上人云聞說孤忩卧化時首摩羅雨滴空池吟詩堂裏秋開影禮佛燈前夜照碑賀雪巳成金殿夢㸔濤終負石橋期逢山對月還惆悵争得無情似祖師僧無可中秋翫月云蟾宜天地靜三五對堦明照耀超諸夜光芒掩衆星影寒池更澈雲冷樹梢青枉値中秋夜長乖宿洞庭金州夏晚陪姚合員外遊金州南池云栁暗青波漲衝萍復嫩苔張筵白鳥下掃㟁使君來洲島秋應沒荷花晚盡開髙城吹角絶騶馭尚徘徊冬日寄僧友云歛履入寒竹安禪過漏聲髙杉殘葉落深井凍痕生罷磬風枝動懸燈雪屋明何當招我友乘月上方行白閤未歸日青門又値春半天傾瀑溜數郡見廬峰句右張爲取作主客圖秋夜宿西林寄賈島云暗蟲喧暮色黙思坐西林聽雨寒更盡開門落葉深昔因京邑病併起洞庭心亦是吾兄弟遲回共至今秋日寄厲元云楊栁起秋色故人猶未還别離俱自老少壯豈能閑夜雨吟殘燭秋城憶逺山何當同一見語黙此林間廬山寺云千峰盤磴盡林寺昔年名歩歩入山影房房聞水聲多年人跡絶殘月石隂清便可求居止安閑過此生題青龍寺僧房云從誰傳法印不離上方傳夕磬城霜下寒房竹月圓煙殘衰朩畔客住積雲邊未隱滄洲去時來於此禪新年作云然燈朝復夕漸作長年身紫閣未歸日青門又値春掩闗寒過盡出定草生新自有林中趣誰驚歳月頻贈圭峰禪師云絶壑禪床底泉分落石層露澆髙頂草雪隱下方燈朝滿傾心客溪連學道僧半旬持一食此事有誰能金州别姚合云日日西亭上春留到夏殘言之離别易勉以道途難山出一千里溪行三百灘松間樓月裏秋入五陵寒姚合送無可住越州云清晨相訪門前立麻履方袍一少年懶讀經文求作佛願攻詩句覔成仙芳春山影花連寺觸夜湖聲月滿船今日送行偏惜别共師文字有因縁李洞贈可上人云寺門和鶴倚香杉月吐秋光到思嚵將法傳來穿泱漭把詩吟去失嵌巖糢糊䟽巻烟嵐滴狼藉衣裳瀑布緘不斷清風牙底嚼無因内殿得名衘僧神頴和王季文題九華山云衆岳雄分野九華鎭南朝彩筆凝空逺崔嵬寄青霄龍潭古仙府靈藥今不凋瑩爲滄海鏡烟霞作荒標造化心數竒性狀精氣饒玉樹鬰玲瓏天籟韻蕭寥寂寂尋乳竇兢兢行石橋通泉漱雲母藉草縈香苕我住幽且深君賞昬復朝稀逢發清唱片片霜凌颷宿嚴陵釣臺云寒谷荒臺七里洲賢人求逐水東流獨􅆐呌斷青天月千古冥冥潭樹秋僧懐濬秭歸郡僧懐濬不知何所人乾寜初知來蔵往皆有神驗刺史于公以其惑衆繫而詰之乃以詩代通狀云家在閩山西復西其中歳嵗有鶯啼如今不在鶯啼處鶯在舊時啼處啼又詰之復有詩云家在閩山東復東其中嵗歳有花紅而今不在花紅處花在舊時紅處紅守異而釋之詳其詩意似在海中得非杯渡之流乎出北夢𤨏言僧應物龍潭云石激懸流雪滿灣五龍潜處野雲閑暫收雷電九峰下且飲溪潭一水間浪引浮槎依北㟁波分曉日浸東山回瞻四面如看畫湏信遊人不欲還題化城寺云平髙選處創蓮宮一水縈流處處通畫閣晝開遲日畔禪房夜掩碧雲中平川不見龍行雨幽谷遥聞虎嘯風偶與遊人論法要真元浩浩理無窮應物大中時江南詩僧也與羅鄴唱酬作九華山記僧可朋可朋丹稜人少與延讓為風雅之友有詩千餘篇號玉壘集㑹題洞庭詩云水涵天影濶山㧞地形髙贈友人曰來多不似客坐乆却垂簾歐陽烱以此比孟郊賈島言其好飲酒貧無以償酒債以詩賙之可朋自號醉髠贈方干詩云月裏豈無攀桂分湖中空賞釣魚休杜甫舊居云傷心盡日有啼鳥獨歩殘春空落花寄齊巳云唯陪北楚三千客多話東郊十八賢劉公詩話云有詩僧讀洪州滕王閣詩謂守者詩總不佳何不除却守云僧能佳乎即吟曰洪州太白方積翠滿穹蒼萬古遮新月半天無夕陽守異之然南方浮屠能詩者多矣予嘗見可朋詩云虹收千丈雨潮弄半江天又云詩因試客分題僻碁爲饒人下着低不減唐人出詩話孟昶廣政十九年賜詩僧可朋錢十萬帛五十疋孟蜀歐陽逈與可朋爲友是歳酷暴中歐陽命同僚納凉於浄衆寺依林亭列樽爼衆方懽適寺之外皆耕者曝背烈日種耘田擊腰鼓以適倦可朋遂作耘田鼓詩以贄歐陽衆賔悶已遽命撤飲詩曰農舍田頭鼓王孫筵上鼓擊鼓兮皆爲鼓一何樂兮一何苦上有烈日下有焦土願我天翁䧏之以雨令桑麻熟倉箱富不飢不寒上下一般言雖淺近而極於理君子謂可朋諌而歐陽善聽焉朋賦洞庭云周極八百里凝眸望則勞水涵天影濶山㧞地形髙賈客停非乆漁翁轉幾遭颯然風起處又是皷波濤僧雲表寒食詩云寒食悲㸔郭外春野田無處不傷神平原壘壘傷新塚半是去年來哭人唐詩紀事巻七十四欽定四庫全書唐詩紀事巻七十五宋計敏夫撰僧虛中貫休
