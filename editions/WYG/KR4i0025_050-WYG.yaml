body:
  text: 姚向温㑹李敬伯姚康張正元楊嗣復炙轂子楊厚劉郇伯王觀陳上美侯冽崔樞陳彦博郭良驥崔嘏李景遜唐球封敖敖為池州刺史題西隠寺云三年未到九華山終日披圗一室間秋寺喜因晴後賞靈峰看待足時還猿從有性留僧坐雲靄無心伴客閑勝事儻能銷嵗月已拚名利不相關敖字碩夫冀州人雅為李徳裕所器武宗時詔慰邊將傷夷者曰傷居爾體痛在朕躬劉稹平徳裕進太尉制曰言皆予同謀不他惑皆敖為之終尚書右僕射才髙而少行檢故不至宰相鄭薰贈鞏疇詩序云九華處士鞏疇擅𤣥言之要通易老其扵浄名僧肇尤精達余在句溪時重其能車幣而致之及到官舍再説易一説老氏將兒姪軰執巻列坐而傳之老氏畢業而寇難作與鞏各散去不知其何之存耶亡耶余既休居洛師鏁扉獨静已卯冬十一月半雪中有客叩柴門樵童視之走復曰鞏處士遽下榻開闗執手話艱苦鞏背簦笈草履杖靈夀下笠且咍笑曰聞公恬養淡逸不屑於榮悴故以𤣥来助成之升榻觧四書即易老浄肇也明日講肇論階前多偃松髙桂氷凍墮落有琴瑟金石聲理致眀妙神骨超爽自謂一時之遇日與故人為徒又意兹樂之難諧也遂成二十韻贈之詩云宻雪松桂寒書窓導餘清風撼氷玉碎階前琴磬聲榻浄几硯潔帙散縑緗眀髙論展僧肇精言資鞏生立意加𤣥虚析理分縦横萬化悉在我一物安能驚江海何所動􅏀山常自平遲速不相閡後先徒起争鏡照各妍醜秤稱分重輕顔容寧入鑑銖兩豈闗衡藴㣲道超忽剖證音泠泠紙上掣牢鍵舌端揺利兵圎澈保真性客塵排妄情有住即非住無行方是行踈越捨吴典朱絃鄙秦筝淡薄貴無味羊斟慙大羮洪逺包乾坤幽窅潜沉冥㒺煩跬歩舉頓達萬里程廬逺尚莫曉隠留曽誤聽直須持妙説共詣毘耶城薰字子溥為宣歙觀察使前不治薰以才力自將牙將素驕共謀逐出之奔楊之後分司東都懿宗時為左丞薰端勁再知禮部引寒俊士類多遺老號所居為隠嵓自號七松處士云大中八年掌文誤以顔標為魯公之後以苐一人處之士子嘲曰主司頭腦太冬烘錯認顔標作魯公鄭谷有故少師從翁隠巖別業亂後榛蕪感舊愴懐之作即薰也詩云風騷為主人凡俗仰清塵宻行稱閨閫眀誠動搢紳周旋居顯重内外掌絲綸妙主蓬壺籍忠為社稷臣大儀墻仭峻東轄紀綱新聞善嘗開口推公豈為身立朝鳴珮貴歸宅典衣貧半醉看花晚中飱煮菜春晴臺随鹿上幽野約僧隣理論知清越清越江左詩僧公甚稱之生徒得李頻藥香沾茟硯竹色染衣巾寄鶴眠雲叟騎驢入室賓咸通中舉子乗馬唯張喬跨驢延扵門下近將姚監比自姚監祕合主張風雅後孤卿一人而已僻與叚卿親故少常成式奥學辛勤章句及徴孤卿為前序葉積池邉路茶遲雪後薪所難留著述誰不秉陶鈞喪亂時多變追思事已陳浮華重發作雅正甚湮淪宗従今何在依棲素有因七松無影響孤卿植松七株自號七松處士䨇淚益悲辛猶喜于門秀年来屈併伸班即孤卿姪孫登進士科級也王軒軒少為詩頗聞淇澳之萹逰西江泊舟苧蘿山下題西施石曰嶺上千峰秀江邉細草春今逢浣紗石不見浣紗人軒登太和進士第宋雍范攄云宋雍初無令譽及嬰瞽疾其詩名始彰盧貟外綸作擬僧之詩僧清江作七夕之詠劉随州有眼作無眼之句宋雍無眼作有眼之詩詩流以為四背或云四倒然辭意悉為佳致盧公詩云願得逺公知姓字焚香洗鉢過餘生清江詩曰唯愁更漏促離別在明朝劉随州曰細雨濕衣看不見閑花落地聽無聲雍詩曰黄鳥不堪愁裏聽緑楊宜向雨中看李摯貞元十二年摯以宏詞振名與李行敏同姓同甲子同年登苐俱二十五嵗又同門摰嘗有詩曰因緣三紀異契分四般同韋澳字子斐以宏詞登科懿宗時為邠寧節度使坐事罷鎮以祕書監分司東都嘗戲吟云莫將韋監同殷鑒錯認容身是保身此句聞扵京師權倖尤怒之段文昌古栢文云是草朩有異扵草朩則靈武侯祠前栢夀千齡盤根擁門勢如龍形含碧太空散霧虚庭合抱在扵旁枝駢梢葉之青青百尋及於半身蓄風雷之冥冥攅柯垂隂分翠閒眀忽如虬螭向空争行上承翔雲孤鸞時鳴下䕃芳苔凡草不生古色天風蒼蒼玲玲曽到靈山老栢縦横亦有大者莫之與京於惟武侯佐蜀有程神其不昏表此為禎斯廟斯栢實播芳馨長慶二年六月題文昌字墨卿有別業在廣都縣之南龍華山嘗杜門力學于此俗謂之段公讀書臺長慶初朝議文昌少在西蜀諳詳利病詔授劔南節度使有邑人贈詩曰昔日騎驢學忍飢今朝忽著錦衣歸等閑畫虎驅紅斾可畏登龍入紫㣲富貴不由翁祖致文章生得羽毛飛廣都再去應惆悵猶有江邉舊釣磯文昌還別業有尋龍華山寺廣宣上人詩云十里惟聞松桂風江山忽轉見龍宫正與休師方話舊風煙㡬度入樓中郭震亦有題龍華山詩曰昔年曽到此山囬百鳥聲中酒一盃㝡好寺邉開眼處段文昌有讀書臺出古今詩話文昌父鍔為江陵紏文昌長自諸宫客逰成都韋南康與奏釋褐為賔従後劉闢逐作外邑髙崇文收蜀召復舊職指其椅曰此猶不足與君坐文昌遽請歸闕至興元西鵠鳴驛有僧倚巴山之隈有前識謂文昌曰去日既逢梅蘂綻来時應見杏花開至京屢外擢自相位拜劔南節度西至鵠鳴僧已物故杏花方盛文昌客荆州從事劔南帥幕其後相穆宗罷相鎮蜀再相文宗罷相帥荆南復鎮蜀太和九年卒文昌鎮蜀有題武擔寺西臺詩云秋天如鏡空樓閣盡玲瓏水暗餘霞外山明落照中鳥行看漸逺松韻聽難窮今日登臨意多歡語笑同文昌晚夏登張儀樓呈院中諸公詩云重樓窓户開四望斂煙埃逺岫林端出清波城下廽乍疑蟬韻促稍覺雪風来併起鄉闗思銷憂在酒杯姚向和登武擔寺西臺詩云開閣錦城中餘閑訪梵宫九層連晝景萬象冩秋空天半將身到江長與海通提携出塵土曽是穆清風向奉陪段相公晚夏登張儀樓詩云秦相架羣材登臨契上台查従銀漢落江自雪山来儷曲親流火凌風洽小杯帝鄉如在目欲下盡徘徊向為節度判官時長慶二年也温㑹登武擔寺西臺詩云桑臺煙樹中臺榭造雲空眺聽逢秋興萹辭變國風坐愁髙鳥起笑指逺人同始媿才情薄躋攀繼韻窮晚夏登張儀楼詩云危軒重疊開訪古上徘徊有舌嗟秦策飛樑駕楚材雲霄随鳳到物象為詩来欲和關山意巴歌調更哀㑹以殿中侍御史為安撫判官楊汝士時掌管記和西臺詩云清浄此道宫層臺復倚空偶時三伏外列席九霄中平視雲端路髙臨樹杪風自憐榮末座前日别池籠乂和張儀樓詩云從公城上来秋近絶纎埃樓古秦規在江分蜀望開逺山標宿雪末席本寒灰陪賞今為忝臨歡敢訴杯李敬伯登武擔寺西臺詩云臺上起凉風乗閑覽嵗功自随台席貴盡許羽觴同樓殿斜暉照江山極望通賦詩思共樂俱得詠時豐晚夏登張儀樓詩云層屋架城隈賔筵此日開文鋒摧八陣星分應三台望雪煩襟釋當歡逺思来披雲霄漢近蹔覺出塵埃敬伯試大理評事為觀察廵官姚康晚夏登張儀樓詩云登覽值晴開詩従野思来蜀川新草朩秦日舊樓臺池景揺中座山光接上台近秋宜晚景極目斷浮埃登武擔寺西臺詩云松逕引清風登臺古寺中江平沙岸白日下錦川紅疎樹山根净深雲鳥跡窮自慚陪末席便與九霄通康試右武衛倉曹參軍為觀察推官康禮部試早春殘雪云㣲暖春潜至輕明雪尚殘銀鋪光漸濕珪破色仍寒無栁花常在非秋露正團素光浮轉薄皓質駐應難幸得依隂處偏宜帶月看玉塵銷欲盡窮巷起袁安魚縦云水府乗閑望圎波息躍魚從来暴泥乆今日脱泉初得志寧相忌無心任宛如龍門應可度鮫室豈常居掉尾方窮樂逰鱗每自舒乗流千里去風力藉吹嘘康字汝諧南仲孫也登元和十五年進士第大中時為太子詹事開成時曽以贓敗張正元冬日可愛詩云寒日臨清晝遼天一望時未消埋徑雪先暖讀書帷属思光難駐舒情影若移晉臣曽比徳謝客昔言詩散彩寧偏照流隂信不追餘輝如可就廽燭幸無私東野聞夜啼贈張正元云寄泣須寄黄河泉此中怨聲流徹天愁人獨有夜燈見一紙鄉書淚滴穿正元登貞元五年進士第楊嗣復丁已嵗八月祠祭畢因題臨淮公舊碑詩云齋荘修祀事旌斾出郊闉薙草軒墀狭塗墻赭堊新謀猷期作聖風俗奉為神酹酒成㘭澤持兵列偶人非才膺寵任異代揖芳塵况是平津客碑前淚滿巾楊汝士和云古栢森然地修嚴蜀相祠一過榮異代三顧盛當時功徳流何逺馨香薦未衰敬名探國志飾象慰甿思昔謁従征盖今聞擁信旗固宜光寵下有淚刻前碑臨淮公武元衡也元和初元衡鎮蜀嗣復為節度推官後二十七年嗣復鎮蜀時太和九年也汝士為東川節度使故相唱和汝士曽為蜀帥段文昌掌管也炙轂子牡丹詩云牡丹妖艶亂人心一國如狂不惜金曷若東園桃與李果成無語自成隂松詩云寒松聳拔倚蒼岑綠葉扶疎自結隂丁固夢時還有意秦皇封日豈無心常将正莭栖孤鶴不遣髙枝宿衆禽好是特凋羣朩後䕶霜凌雪翠踰深竹詩云庭竹森疎玉質寒色包葱碧盡琅玕翠筠不染湘娥淚斑籜堪裁漢主冠成韻含風已蕭瑟媚漣凝渌更檀欒此君引鳳為龍日聳莭梢雲直上看炙轂子王叡也元和後詩人楊厚早起云星漢轉寒更伊余索寞情鐘催歸夢斷鴈引逺愁生危壁蘭光暗疎簾露氣清閑庭聊一望海日未分明厚貞元間詩人劉郇伯早行云鎮静人猶寢天髙月自凉一星深戍火殘月半橋霜客老愁塵下蟬寒怨路傍青山依舊色宛是馬卿鄉郇伯與范鄼郎中為詩友范曽得一句云嵗盡天涯雨久而莫屬郇伯曰何不曰人生分外愁范甚賞之出北夢𤨏言王觀早行云鷄唱催人起又生前去愁路明殘月在山露宿雲收村店煙火動漁家燈燭幽趨名與趍利行役㡬時休觀大厯貞元間人陳上美咸陽懐古云山連河水碧氛氲瑞氣東移擁聖君秦苑有花空笑日漢陵無主自侵雲古槐堤上鶯千囀逺渚沙中鷺一群頼與淵眀司把菊煙郊四望夕陽曛上美登開成進士第侯冽冽金谷園懐古云金谷千年後春花發滿園紅芳徒笑日穠艶尚迎軒雨濕輕光軟風揺碎影翻猶疑施錦帳堪歎罷朱紈愁態鶯吟澁啼容露綴繁慇懃問前事桃李竟無言冽登元和六年進士第崔樞賜耆老布帛云殊私及耆老聖徳賑黎元布帛忻天賜生涯作主恩情均皆挟纊禮異賁􅏀園慶洽時方泰仁沾月告存寧知酬雨露空識荷乾坤擊壤将何幸徘徊望九門裴垍舉宏詞崔樞考之落第及垍為宰相擢樞為禮部笑謂樞曰聊以報徳也終扵祕書監順宗時有詔曰古之所以教太子必茂選師傅以輔翼之法於訓詞而行其典禮左右前後㒺非正人是以教諭而徳成也給事中陸質中書舍人崔樞積學懿文守經據古夙夜講習庶協于中並充皇太子侍讀陳彦博恩賜魏文正公諸孫舊第以導直臣云阿衡随逝水池館主他人天意能酬徳雲孫喜庇身生前由直道殁後振芳塵雨露新恩日芝蘭故里春勲庸流十代光彩映諸隣共喜昇平代従兹得諫臣前㝎錄云彦博元和中與謝楚同為廣文生夢一官司列几案上有尺牘如金字者問之曰眀年進士之名見其名在三十二從上二人皆李姓而無楚名明年果如夢二李即李顧行李仍叔也時元和五年明年楚扵于尹躬下擢第白居易為翰林學士奏云今日奉宣令撰李師道請收贖魏徴宅還其子孫甚合朕心允依来奏者臣伏以魏徴太宗宰相盡忠輔佐以致太平在其子孫合加優䘏事闗激勸合出朝廷師道何人輙掠此美伏願明勅有司特以官錢收贖使還後嗣以勸忠臣則事出皇恩美歸聖徳憲宗深然之其後有司以為詩題試進士郭良驥自蘇州至望亭驛有作云南浦菰蒲遶白蘋東呉黎庶逐黄巾野棠自發空流水江燕初歸不見人逺岫依依如送客平田渺渺獨傷春淮中廽首長洲苑烽火年年報虜塵觀詩所載疑李錡叛時事也崔嘏嘏字乾錫邢州刺史㑹劉稹反歸朝授考功郎中中書舍人李徳裕之謫嘏草制不盡書其過貶端州刺史施肩吾與之同年不睦嘏舊失一目以珠代之施嘲之曰二十九人及第五十七眼看花元和十五年也李景遜景遜字後巳贈太尉憕孫也大中中進御史大夫威肅當朝為大夫三月蔣伸輔政宣宗盡書羣臣名内器中禱憲宗神前射取之而景遜名不得乃見宰相自陳考深當代即拜西川節度使景遜好奨寒士如李蔚楊知退所善蘇滌裴夷直寄華州周侍郎立秋日奉詔祭嶽詩云關河豁静曉雲開承詔秋祠太守来山霽蓮花添翠黛路隂桐葉少塵埃朱轓入廟威儀肅玉歩昇壇歩武囬往嵗今朝㡬時事謝君非重我非才自大中至咸通相白敏中次畢諴曹確使相羅劭權崔相㥀由戲曰可以歸矣近日中書皆蕃臣謂畢白曹羅皆蕃姓也始自蔣伸景遜在蜀聞報曰不能伏事斯人也遽託疾離鎮有詩曰成都十萬戸抛若一鴻毛出北夢瑣言唐球球有詩名如臨池洗硯云恰似有龍深處卧被人驚起黒雲生又有漸寒沙上鷺欲暖水邉村亦佳句也球居蜀之味江山方外之士也為詩撚藁為圎納之大瓢中後臨病投瓢扵江曰斯文茍不沉没得者方知吾苦心爾至新渠有識者曰唐山人瓢也接得之十纔二三其題有處士隠居云不信最清曠及来愁已空數㸃水泉雨一溪霜葉風業在有山處道成無事中酌盡一樽酒老夫顔亦紅贈行如上人云不知名利苦念佛老岷峨衲補雲千片香焚篆一窠戀山人事少憐客道心多日日齋鐘罷髙懸濾水羅題青城范賢觀云數里緣山不厭難為尋真訣問黄冠苔鋪翠㸃山橋滑松織香梢古道寒晝傍綠畦薅嫩玉夜開紅竈撚新丹孤鐘已斷泉聲在風動瑶花月滿壇贈僧云曽聞半偈雪山中貝葉翻時理盡通般若常添持戒力落义誰算念經功雲間曉月應難染海上虚舟自信風長説滿庭花色好一枝紅是一枝空已上詩見芳亭客話球生扵唐末至性純慤篤好雅道放曠疎逺邦人謂之唐隠居或云王建帥蜀召為參謀不就今以其故居為隠居寺北夢𤨏言曰球詩逰厯不出二百里李洞贈唐山人云長鬚長似髮七十色如黧醉眼青天小吟情太華低千年松遶屋半夜雨連溪邛蜀路無限往来琴自携不知是球否也唐詩紀事巻五十欽定四庫全書唐詩紀事巻五十一宋計敏夫撰白敏中
