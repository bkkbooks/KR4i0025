  text: 唐詩紀事卷第五十二
  hash: sha256:5213fc857766b067a3480270aa81e7a20014131c3f57d769e61d89179eb0491a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_052-1a}
body:
  text: 雍􅁉之裴潾皇甫􅍼李肱皇甫松徐凝張佑崖涯盧儲趙璜柴夔王􅁇勲夏鴻曺汾楊鴻易重雍􅁉之敢競桃李色自呈刀尺功蝶猶迷剪翠人豈辨栽紅花剪綵野酌亂無廵送君兼送春明年春色至莫作未歸人送客春晦􅁉之正元後詩人也五雜組云五雜組剌繡窠徃復還織錦梭不得巳戍交河自君之出矣寳鏡爲誰明思君如隴水長聞嗚咽聲裴潾長安豪貴惜春殘争賞先開紫牡丹别有玉柸承露冷無人起就月中㸔長安三月十五日兩街㸔牡丹甚盛慈恩寺元果院花最先開太平院開最後潾作白牡丹詩題壁間太和中駕幸此寺吟翫之乆因令宫嬪諷念及暮歸則此詩蒲六宫矣潾河東人桞泌為憲宗治丹劑潾上䟽極諌帝卒以藥棄天下世以為知言潾以兵部侍郎卒嘗裒古今辭章續文選號大和通典上之當時之士非與遊者不取世恨其隘開成元年李衛公分司東都居平泉别墅潾述其素尚賦四言詩十四章兼述山泉之美明年衛公觀察浙西潾自兵侍尹河南乃刻于石首章云動静有源進退有期用在得正明以知微夫惟哲人㑹且有歸静固致動安每慮危將憇于盤止亦先機皇甫曙立春日呈宫􅀓侍郎云朝旦微風吹曉霞散為和氣滿家家不知容貌潜消落且喜春光動物華出問池氷猶塞㟁歸㝷園桞未生芽摩娑酒甕重封閉待入新年共賞花曙元和十一年中書舎人李逢吉下登第逢吉所擢多寒素時有詩曰元和天子丙申年三十三人同得仙􅂁似爛銀文似錦相將白日上青天是歳高澥第一人劉端夫行李方周匡物廖有方軰皆預選寳曆間崔從鎭淮􅀯署為行軍司馬李肱開元太平日萬國賀豐歳梨園猒舊曲玉座流新製鳳管遞叅差霞衣競揺曳宴罷水殿空輦餘香草細蓬壺事巳乆仙樂功無替誰肯聽遺音聖明知善繼肱開成二年試霓裳羽衣曲詩也是年秋帝命高鍇復司貢籍詔曰夫宗子維城夲枝百代封爵所宜無令廢絶常年宗正寺觧送人恐有浮薄以忝科名在卿精揀藝能勿妨賢路所試賦則准常規詩則依齊梁體格乃試琴瑟合奏賦電裳羽衣曲詩主司先進五人詩其㝡佳者李肱次則王收乃以牓元及第帝覽之曰近属如肱者其不忝乎高鍇奏曰臣鍇昨日奉宣進㫖令將進士所試詩賦進来者伏以陛下聦明文思天縦聖德今年詩賦題目出自宸􅂨体格雅麗意思遐逺諸生捧讀相賀自古未有倍用研精覃思磨礪緝諧其今年試詩賦比於去年又勝數等臣日夜考校敢不推公就中進士李肱霓裳羽衣曲詩一首㝡為􅒯出更無其北詞韻旣好去就又全臣前後吟詠近三五十遍雖使何遜復生亦不能過兼是宗枝臣與狀頭第一人以奬其能次張堂詩一首亦絶好亞次李肱臣與第二人其次沈黃中琴瑟合奏賦又似文選中雪月賦體格臣與第三人其次王牧賦自立意緒言語不凡臣與第四人其次桞棠詩賦興思敏速日中便成臣與第五人凡此五卷詩賦擢其中科實所不愧其餘三十五人􅂉奬舊文别録人材非止一途四靣搜擇臣並與及第李肱舊文亦好人物絶竒每事且他日必為卿相宗枝之俊實謂難得况属籍之中讀書為文者甚少伏望聖恩俯留宸覽李肱等三人詩賦若有不堪敢受欺天之罪如或可採伺􅀱聖心其李肱詩賦伏望陛下聖慈特賜降奬飾宣示百寮以勸皇族修飾之道臣謬忝主司不勝慺慺之誠其詩賦惣為一卷謹隨狀奉進以聞范攄云肱止於岳齊二牧皇甫松古松感興云皇天后地力使我向此生貴賤不我均若為天地情我家世道德㫖意匡文明家集四百卷獨立天地經􅀉言青松姿豈羡朱槿榮昭昭大化光共此遺芳馨怨回紇歌云白首􅀯朝女愁聽異城歌收兵頡利國飲馬胡蘆河毳布腥膻乆穹廬歳月多鵰巢城上宿吹笛涙滂沱又云祖席駐征棹開㠶􅀱信潮隔筵桃葉泣吹管杏花飄􅂳去鷗飛閣人歸塵上橋别離惆悵淚江路濕紅蕉松著醉鄉日月三卷自叙也或曰松丞相竒章公表甥公不薦舉怨望因襄陽大水極言誹謗有夜入真珠室朝遊玳􅈘宫之句眞珠公愛􅁎名也抛毬樂詩云紅撥一聲飄輕毬墜越綃帶翻金孔雀香滿綉蜂腰少少抛分數花枝正索饒又云金蹙花毬小眞珠綉帯垂幾回衝蠟燭千度入春懷上客終須醉觥盃自亂排松有登郭隗臺詩云燕相謀在兹積金黃巍巍上者欲何顔使我千載悲又有勸僧酒詩云勸僧一盃酒共㸔青青山酣然萬象㓕不動心印閑右張為取作主客圖松韓門第子湜之子也徐凝􅀫冽上人房云浮生不定􅀂蓬飄林下真僧偶見超􅁴後始知身是夢更聞寒􅀨滴芭蕉凝睦州人樂天詩中有李郎中訪徐凝山人云郡守輕詩客鄉人薄釣翁觧憐徐處士惟有李郎中張祜題金山寺云一宿金山頂微茫水國分僧歸夜舩月龍出晚堂雲樹影中流見鐘聲兩㟁聞因悲在朝市終日酔醺醺寓懷寄蘇州劉郎中云一聞周邵佐明時西望都門強策羸天子好文才自薄諸侯力薦命猶竒賀知章口徒勞說孟浩然身更不疑唯是勝遊行未遍欲離京國尚遲遲入潼􅀜云都城三百里雄險此廻環地􅀔遥尊嶽河流側譲􅀜秦皇曽虎視漢祖昔龍顔何處梟兇軰干戈自不閑故國三千里􅀷宫二十年一聲河滿子䨇涙落君前自􅀝能歌曲先皇掌上憐新聲何處唱膓斷李延年二章祜所作宫詞也􅀓入宫禁武宗疾篤目孟才人曰吾即不諱爾何為哉指笙􅇸泣曰請以此就縊上憫然復曰妾嘗藝歌請對上歌一曲以泄其憤上許乃歌一聲河滿子氣亟立殞上令醫􅀱之曰脉尚温而膓巳絶帝崩柩重不可舉或曰非俟才人乎爰命其襯襯至乃舉祐為孟才人嘆序曰才人以誠死上以誠命雖古之義激無以過也歌曰偶因歌態詠嬌嚬傳唱宫中十二春却為一聲河滿子下泉須弔舊才人杜牧之守秋浦與祐遊酷吟其宫詞亦知樂天有非之之論乃為詩曰㫸在眼前人不見道超身外更何求誰人得似張公子千首詩輕萬戸侯寜哥来云日映宫城霧半開太眞簾下畏人猜黃翻綽指向西樹不信寜哥㢠馬來退宫人云開元皇帝掌中憐流落人間二十年長􅀃承天門上宴百官樓下拾金錢又云歌喉漸退出宫闈泣訴伶官上許歸猶説人時歡聖夀内人􅀄着五方衣玉環琵琶云宮樓一曲琵琶聲滿眼雲山是去程廻頋段師非汝意玉環休把恨分明春鸎囀云興慶池􅀯桞未開太眞先把一枝梅内人巳唱春鸎囀花下傞傞軟舞來容兒鉢頭云爭走金車叱鞅牛笑聲誰是說千秋兩邉角子羊門裏猶學容兒弄鉢頭邠娘羯鼓云新教邠娘羯鼓成大酺􅀄日㝡先呈冬兒指向眞眞說一曲乾鳴杖子輕要娘歌云宜春花夜雪千枝妃子偷行上宻隨便唱要娘歌一曲六宫生老是娥眉悖㧝兒舞云春風􅀯内百花時道調凉州急遍吹掲手便拈金椀舞上皇驚笑悖㧝児集虛臺云日􅊍斜照集虚臺紅樹花迎暁霧開昨夜小皇新授籙太眞會笑入簾來阿䳰湯云月照宫城紅樹芳緑䆫燈未在雕梁金輿未到長生殿如子偷㝷阿䳰湯和杜牧之齊山登高云秋溪􅀯㟁菊霏霏急管繁絃對落暉紅葉樹深山逕斷碧雲江淨浦㠶稀不堪孫盛嘲時笑願送王洪醉夜歸流落正憐芳意在砧聲徒促授寒衣感王將軍柘枝妓殁云寂寞春風舊柘枝舞人休唱曲休吹鴛鴦鈿帶抛何䖏孔雀羅衫付阿誰􅀞鼓不聞招節拍錦靴空想挫腰支今來坐上偏惆悵曽是堂前敎徹詩題干越亭云扁舟亭下駐煙波十五年遊重此過洲觜露沙人渡淺樹稍藏竹鳥啼多山㗸落照欹紅蓋水蹙斜紋卷緑羅膓㫁中秋正圓月夜來誰唱異郷歌世􅀓韋鮑二生以妾換馬之事云韋生下弟東歸同憇水閣鮑有美妾韋有良馬鮑以夢蘭小情佐歡飲酣停盃閲馬軒檻韋曰能以人換任選殊尤鮑欲馬之意頗切宻遣四絃更衣盛裝頃之而至乃命勸韋酒歌云白露濕庭砌皓月臨前軒此時去留恨含思獨無言又歌送鮑生酒云風颭荷珠雖暫圓多生信有短因縁西橋今夜三更月還照離人泣㫁絃韋乃命牽紫叱撥以酬之俄有紫衣冠二人自閣西升階而來二生恐悚闔戸窺之一人長髯云足下賦云斜漢􅀹界北陸􅀯􅄤白露曖空素月流天可謂􅊍絶對曰何不見賞風霽地表雲歛天末洞庭始波木葉㣲脫今佳月如晝可以為賦長髯曰向聞妾換馬之事可以為題以彼傾城求其駿足為韻長髯曰彼佳人兮如瓊之英此良馬兮􅀒駿之名將有求於駿足亦何惜於傾城香暖􅀷閨未厭夭桃之色風清廣陌曾憐噴玊之聲希逸曰原夫人以矜其容馬乃稱其德旣各從其所好諒何求而不克長跪而别姿容休耀其金鈿右牽而來光彩蝢生於玉勒文通曰歩及庭砌効當軒墀望新恩懼非吾偶也戀舊主疑借人乗之香散緑騣意巳忘於鬒髪汗流紅頷愛無異於凝脂希逸曰是知事有廢興用有取捨彼以絶代之容為鮮矣此以軼群之足為貴也買笑之恩旣盡有􅀋求之據鞍之力尚存猶希進也賦訖行十余歩而失故祐自愛妾換馬之什云綺閣香綃華厩空忍將行􅀨換追風休憐桞葉􅀟眉緑􅁍愛桃花兩耳紅侍宴永辭春色裏趂朝休立漏聲中恩勞未盡情先盡暗泣西風兩意同祐長慶中􅀷為令狐楚所知楚鎭天平自草薦表令以詩三百篇隨狀表進祐至京屬元禎在内庭上問之􅍬曰祐雕䖝小巧壯夫不爲或奨激之恐變陛下風教上頷之由是失意東歸有孟浩然身更不疑之句驪宫小禽名阿濫堆明皇御玊笛採其聲翻爲曲且名焉逺近以笛爭効之祐有華清宫詩曰紅樹蕭蕭閣半開玉皇猶幸此宫來至今風俗驪山下村笛猶吹阿濫堆皮日休云佑字長吉元和中作宫躰小詩辭曲艶發當時輕薄之流能其才合譟得譽老大稍窺建安風格誦樂府録知作者本意短章大篇徃徃間出講諷怨譎時與六義相左右善題目佳境言不可刋置別處此為才子之最也或薦之天子書奏不下亦受辟諸矦府性狷介不容物輙自劾去以曲阿地古澹有􅀯朝遺風遂築室種植而家焉性嗜水石悉力致之從􅀯海間罷職事載羅浮石笋還不蓄美田利産為身後計死未二十年而故􅁎遺孕凍餒不暇豈其怨剌於神明耶天果不愛才􅃿而猶譴耶又進士顔萱過祐丹陽遺居見其愛姬崔氏貧居荆榛下有一子􅂎兒求食汝墳矣憫然作詩弔之萱詩曰憶昔為兒逐我兄曾抛竹馬拜先生書齋巳換當時主詩壁空題故友名豈是爭權留怨敵可憐當路盡公卿柴扉草屋無人問猶向荒田責地征日休詩云勝華通子共悲辛荒逕今為舊宅鄰一代交遊非不貴五湖風月合教貧魂應絶地為才􅀑名與遺編在史臣聞道平生偏愛石至今猶泣洞庭人陸􅀛䝉云先生清骨葬煙霞業破孤存孰為嗟㡬箧詩編分貴位一林石笋散豪家兒過􅃇宅啼楓影􅁎遶荒田泣稗花唯我共君堪便戒莫將交譽作生涯裴洪慶以為冬􅀲堰宫􅂎兒後名望䖍嘉㒷監張為作主客圖以白樂天為廣大教化主而以祐為入室取其句云萬國見清道一身成白頭相公句上令狐此地榮辱盛豈宜山中人句秋晚葛溪謾淬張家劔却是猿聲斷客膓句葛溪書空疑未決卓地計􅀄成句柱杖春申還有三千客寂寞無人報李園句杜牧之酬祐詩云七子論詩誰似公曺劉須在指揮中薦衡昔日知文舉曽表薦令狐公乞火無人作蒯通北極樓臺長掛夢西江波浪逺吞空可憐故國三千里虚唱歌辭滿六宮或言祐清河人嘗賦淮􅀯詩有人生只合揚州死禪智山光好暮田大中中果卒於丹陽隱舍崔涯崔涯吳楚人與張祐齊名其妻雍氏乃惣校之女夫婦相歡而涯不禮其妻父妻父不平之奪其女爲尼涯不得巳爲詩留別日隴上泉流隴下分腸㫁嗚咽不堪聞常娥一入月中去巫峡千秋空白雲膺之作或謂崔詠春風云動地經天物不傷高情易韻住何方扶持燕雀連天去斷送楊花盡日狂遶桂月明過萬戸弄㠶晴晚渡三湘孤雲雖是無心物借便吹教到帝鄉太行嶺上三尺雪崔涯袖中三尺鐡一朝若遇有心人出門便與妻兒别涯挾士詩也涯與張祐失意游挾江淮此詩徃徃傳於人口盧儲李翺江淮典郡儲以進士投卷翶禮待之置文卷几案間因出視事長安及笄閑歩鈴閣前見文卷尋繹數回謂小青衣曰此人必為狀頭迨公退李聞之􅀷異其語乃令賔佐至郵舍具語於儲選以為􅡾儲謙辭乆之終不却其意越月遂許來年果狀頭及第􅂊過􅀜試徑赴嘉禮催粧詩曰昔年將去玉京遊第一仙人許狀頭今日幸為􅁗晉㑹早教鸞鳳下粧樓後盧止官舎迎内子有庭花開乃題曰芍藥斬新栽當庭數朶開東風與拘束留待細君來人生前定固非偶然耳趙璜正月云正月今朝半陽臺信未廻水芹寒不食山杏􅀨應開世網留三􅀫真源􅀉一杯因聲謝猿鳥歳宴㑹歸來題七夕圖云帝子吹簫上翠微秋風一曲鳳凰歸明年七月重相見依舊髙懸織女機七夕詩曰烏鵲橋頭􅀟扇開年年一度過河來莫嫌天上稀相見猶勝人問去不廻欲减煙花饒俗世暫煩煙月掩樓臺璜開成三年登第柴夔望九華山詩云九華如劒揷雲霓青靄連空望欲迷北截吳門疑地盡􅀯連楚界􅁴天低龍池水醮中秋月石路人攀上漢梯惆悵舊遊無復到會須登此出塵泥䕫登太和中進士第王繼勲贈和龍妙空禪師詩云白靣山􅀯靈慶院茅齋道者雪峰禪只棲雲樹兩三畝不下煙蘿四五年猿鳥認聲呼喚易龍神降伏住持堅誰知今日秋江畔獨歩醫王闡法筵夏鴻和贈和龍妙空禪師詩云翰林遺迹鏡潭前孤峭高僧此處禪出為信門興化日坐當吾國太平年身同瑩澈尼珠淨語並鋒鋩慧劔堅道果巳圓名巳遂即㸔千匝遶香筵鴻登開成進士第曹汾早發靈芝望九華􅀉杜使君詩云戴月早歸三秀舘平明􅀄辨九華峰嵯嵯玉劔寒芒利裊裊青蓮翠葉重恠狀却疑人􅀞出嵐光似為客􅄈濃行香􅀂到五溪上此處褰幃正靣逢汾以尚書鎭許下其子希幹及第用錢二十萬牓至鎭張宴置牓於側時進士胡錡有啓賀略曰桂枝折處著萊子之綵衣楊葉穿時用魯連之舊箭第故也汾先登又曰一千里外觀上國之風光十萬軍前展長安之春色汾字道謙開成四年登第希幹咸通十四年登第汾終戸部侍郎汾懿宗宰相礭之第礭罷相為鎭海節度使以扞龐勛功就加太子太師汾為忠武節度入為戸部判度支弟兄並列將相之任時人榮之楊鴻晴望九華山詩云九華閑屋簇清虛氣象群峰盡不如惆悵都􅀯掛冠吏無人觧向此山居鴻登開成二年進士第易重會昌五年陳商下進士張濆第一重次之後詔白敏中重考覆落濆等八人而重居牓首有詩寄冝陽兄弟云六年鴈序恨分離詔下今朝遇巳知上國皇風􅀄喜日御堦恩渥屬身時内庭再考稱文異聖主宣名奨藝竒故里仙才若相問一春攀得兩重枝
