  text: 唐詩紀事卷第七
  hash: sha256:0454ed546f37e429b0498fef4d59b80ea0bf906923ff7b555c4526c803020ab4
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_007-1a}
body:
  text: 髙正臣崔知賢韓仲宣周彦昭髙球弓嗣初髙瑾王荗時徐皓長孫正􅀮髙紹郎餘令陳嘉言周彦輝髙嶠周思鈞劉友賢于季子東方虬駱賔王盧照隣王勃勔勮楊烱田遊巗髙正臣晦日置酒林亭詩云正月符嘉節三春翫物􅂠忘懷寄罇酒陶性狎山家柳翠含煙葉梅芳帶雪花􅊍隂不相借遲遲落景斜晦日重宴云芳辰重遊衍乗景共追隨班荆陪舊識傾蓋得新知水葉分蓮沼風花落栁枝自符河朔趣寧羡山陽池正臣廣平人官至衛尉卿習右軍書法􅌖宗最愛其筆晦日宴高氏林亭凢二十一人皆以華字爲韻子昻爲之序曰有渤海之宗英是平陽之貴戚發揮鳳臺而嘯侣幽賛鷄川而留宴又曰冠纓濟濟多延戚里之賔鸞鳳鏘鏘自有文雅之客晦日重宴八人皆以池字爲韻周彦暉爲之序上元夜効小􅁃體詩六人以春字為韻長孫正隠為之序崔知賢晦日林亭云上月河陽地芳辰景望華綿蠻變時鳥昭曜起春霞桺搖風處色梅散日前花淹留洛城晩歌吹石崇家上元夜効小􅁃詩云今夜啟城闉結伴戲芳春皷聲撩亂動風灮觸處新月下多逰騎燈前饒看人歡樂無窮已歌舞達明晨韓仲宣晦日林亭云欲知行有樂芳罇對物華地接安仁縣園是季倫家桺處雲疑葉梅間雪似花日落歸途逺留與伴煙霞晦日重宴詩云鳳苑先吹晩龍樓夕照披陳遵已投轄山公正坐池落日催金奏飛霞送玉巵此時陪綺席不醉欲何為上元夜効小􅁃體云他鄉月夜人相伴看燈輪灮隨九華出影共百枝新歌鍾盛北里車馬沸南隣今宵何處好惟有洛城春周彦昭晦日林亭云勝地臨鷄浦髙㑹偶龍沙御栁驚春色仙笻掩月華門邀千里馭杯泛九灮霞日落山亭晩雷送七香車髙球晦日林亭云温洛年灮早皇州景望華連鏕尋上路乗興入山家輕苔網危石春水架平沙賞極林塘暮處處起煙霞弓嗣初晦日林亭云上序春輝麗中園物􅀱華髙才盛文雅逸興滿煙霞參差金谷榭皎鏡碧塘沙蕭散林亭晚倒載欲還家晦日重宴云年華藹芳隰春溜滿新池促賞依三友延歡寄一巵鳥聲隨管變花影逐風移行樂方無極淹留惜晩曦嗣初咸亨二年第一人登第高瑾晦日林亭云試入山亭望言是石崇家二月風􅊍起三春桃李華鶯吟上喬木鴈往息平沙相㸔㑹取醉寧知還路賖晦日重宴云忽聞鶯響谷於此命相知正開彭澤酒來向高陽池柳葉風前弱梅花影處危賞洽林亭晩落照下參差上元夜效小􅁃體云初年三五夜相知一兩人連鑣出巷口飛轂下池漘燈下恰似月人靣併如春遨逰終未已相歡待日輪瑾士廉之孫登咸亨元年進士第王茂時晦日林亭云勝踐㝷良㑹乘春翫物華還隨張放友來向石崇家止水分巗鏡開庭枕浦沙未極清泉賞參差落照斜徐皓晦日林亭云綺筵乘暇景瓊醑對年華門多金埒騎路引璧人車蘋早猶藏葉梅殘正落花藹藹林亭晩餘興促流霞長孫正隠晦日林亭云梅晩屬煙霞遨逰重嵗華歌鍾雖戚里林藪是山家細雨猶開日深池不漲沙淹留迷處所巗岫幾重花上元夜效小􅁃體詩云薄晩嘯逰人車馬亂驅塵月灮三五夜燈熖一重春煙雲迷北闕簫管識南隣洛城終不閉更出小平津正隠序上元之逰云九谷帝畿三川奧域交風均露上分朱鳥之躔泝洛背河下鎮蒼龍之闕多近臣之第宅即瞰銅街有貴戚之樓臺自連金宂美人競出錦幛如霞公子交馳雕鞍似月同逰洛浦疑尋税馬之津争渡河橋似向牽牛之渚實昌年之樂事令節之佳逰者焉髙紹晦日林亭云嘯侶入山家臨春翫物華葛􅁝調綵水桂醑酌丹霞㟁柳開新葉庭梅落早花興洽林亭晩方還倒戴車紹爲考功郎中郎餘令晦日林亭云三春休晦節九谷泛年􅂠半晴餘細雨全晚澹殘霞樽開踈竹葉管應落梅花興闌相顧起流水送香車餘令定州人博學擢第授霍王元􅁤府參軍事從父知年亦爲王友元􅁤每曰郎家二賢皆入府不意培塿而松栢爲林也改著作郎卒餘令善􅀞唐秘書省内落星石薛稷􅀞鶴賀知章草書餘令鳳相傳爲四絶元和中韓公武爲校書郎挾彈中鸖一眼乃謂之五絶陳嘉言晦日林亭云公子申敬愛携朋翫物華人是平陽客地即石崇家水文生舊圃風色滿新花日暮連歸騎長川照晩霞晦日重宴云髙門引冠蓋下客抱支離綺席珍羞滿文塲藻翰摛蓂華彫上月柳色藹春池日斜歸戚里連騎勒金覊上元夜效小􅁃體云今夜可憐春河橋多麗人寳馬金為絡香車玉作輪連手窺潘掾分頭㸔洛神重城自不掩出向小平津武后時酷吏也中宗神龍中詔酷吏陳嘉言等其身巳死自垂拱已來枉濫殺人有官者並令削奪開元中御史程行諶奏酷吏來子珣等二十三人情狀尤重子孫不許與官陳嘉言魚承曄皇甫文備傅逰藝四人情狀稍輕子孫不許近任周彦輝晦日林亭云砌蓂收晦魄津栁競年華既狎忘筌友方淹投轄車綺筵廻舞雪瓊醑泛流霞雲低上天晩􅁝竹帶風斜晦日重宴云春華歸栁㟁晦景落蓂枝置驛銅街右開筵玉浦陲林煙含障密竹􅀨帯珠危興䦨巾倒戴山公下習池彦輝登咸亨五年進士髙嶠晦日林亭云飛歡冩春望開宴坐汀沙積溜含苔色晴空蕩日華歌入平陽第舞對石崇家莫慮能騎馬投轄自停車晦日重宴云駕言尋鳳侣乘歡俯鴈池班荆逢舊識斟桂喜深知紫蘭方出逕黄鶯未囀枝别有陶春日青天雲霧披嶠為司門郎中周思鈞北門學士思茂之弟也武后時為太子文學劉禕之賜死在獄上疏自陳臨誅洗沐神色自若自捉筆為表詞懇哀到思鈞帳嘆其文后惡之貶楊州司倉參軍和髙氏林亭晦日文宴云早春驚栁襚初晦掩蓂華騎出平陽里筵開衛尉家竹影含雲密池紋帶雨斜重惜林亭晩上路滿煙霞重宴又云綺筵乘晦景髙宴下陽池濯雨梅香散含風栁色移輕塵依扇落流水入絃危勿顧林亭晩方歡雲霧披思鈞以中書舎人卒子瑛為單父令瑛以女適武就生靖安丞相元衡劉友賢晦日林亭云春來日漸賖琴酒逐年華欲向文通徑先游武子家池碧新流滿巗紅落照斜興䦨情未極步步惜風花已上並髙氏林亭之客外陳子昻張鍚王勔解琬各載其門于季子漢髙祖云百戰方夷項三章且代秦功歸蕭相國氣盡戚夫人詠雲詩云瑞雲千里映祥輝四望新隨風亂鳥足汎水結魚鱗布葉疑臨夏開花詎待春願得承嘉景無令掩桂輪季子登咸亨進士第東方虬詠春雪云春雪滿空來觸處似花開不知園裏樹若箇是真梅陳子昻寄東方左史脩竹篇序云文章道弊五百年矣漢魏風骨晉宋莫傳然而文獻有可證者常觀齊梁詩彩麗競繁而興寄都絶每以永嘆昨見明公孤桐篇骨氣端翔音韻頓挫􅊍英明韻有金石聲遂用洗心收視發揮幽鬱不圖正治之音復覩於兹虬武后時為左史嘗曰百年後可與西門豹作對駱賔王帝京篇云山河千里國城闕九重門不覩皇居壯安知天子尊皇居地里崤凾谷鶉野龍山侯甸服五緯連影集星躔八水分流横地軸秦塞重關一百二漢家離宫三十六桂殿隂岑對玉樓椒房窈窕連金屋三條九陌麗城隈萬户千門平旦開􅃨道斜通鳷鵲觀交衢直指鳳凰臺劒履南宮入簮纓北闕來聲明冠寰宇文物象昭回鈎陳肅蘭戺壁沼浮槐市銅羽應風廻金莖承露起校文天禄閣習戰昆明水朱邸枕平臺黄扉通戚里平臺戚里帶崇墉灼金饌玉待鳴鍾小堂綺帳三千萬大道青樓十二重寶蓋彫鞍金絡馬蘭䆫繡柱玉盤龍綺柱璇題粉壁映鏘金鳴玉王侯盛王侯貴人多近臣朝逰北里暮南鄰陸賈分金將讌喜陳遵投轄尚留賔趙李經過密蕭朱交結親丹鳳朱城白日暮青巾繡幰紅塵度俠客珠彈垂楊道倡婦銀鈎采薪路倡家桃李自芳菲京華逰俠盛輕肥延年女弟雙飛入羅敷使君千騎歸同心結縷帶連理織羅衣春朝桂樽樽百味秋夜蘭燈燈九微翠幌珠簾不獨映清歌寳瑟自相依且論二八千金是寜知四十九年非古來榮利若浮雲人生倚伏信難分始見田竇相移奪俄聞衞霍有功勲未厭金陵氣先開石槨文朱門無復張公子㶚亭誰畏李將軍相顧百齡皆有待居然萬化咸應改桂枝芳氣巳銷亡栢梁高宴今何在莫矜一旦擅豪華自言千載長驕奢倐忽搏風生羽翼湏㬰失浪委􅅺沙黄雀徒巢桂青門遂種􅀲黄金銷鑠素絲變一貴一賤交情見紅顔宿昔白頭新脫粟布衣輕故人故人有湮淪新知無意氣灰死韓安國羅傷翟庭尉已矣哉歸去來馬卿辭蜀多文藻楊雄仕漢乏良媒三冬自矜成足用十年不調幾遭廻汲黯薪逾積孫􅀪閤未開誰惜長沙傅獨負洛陽才世稱王楊盧駱楊􅄹川之為文好以古人姓名連用如張平子之略談陸士衡之所記潘安仁宜其陋矣仲長統何足知之號為㸃􅀑簿賔王文好以數對如秦地重關一百二漢家離宮三十六人號爲筭博士帝京篇曰倐忽搏風生羽翼湏㬰失浪委泥沙賔王後與徐敬業興兵楊州大敗逃死此其䜟也宋之問貶黜放還至江南逰靈隠寺夜月極明長廓行吟曰鷲嶺鬱岹嶢龍宮鏁寂寥句未屬有老僧㸃長明燈問曰少年夜久不寐何耶之問曰適偶欲題此寺而興思不屬僧請吟上聮即曰何不云樓觀滄海日門對浙江潮之問愕然訝其遒麗又續終篇曰桂子月中落天香雲外飄捫羅登塔逺刳木取泉遥霜薄花更發氷輕葉互凋待入天台路看余渡石橋遲明更訪之則不復見矣寺僧有知者曰此賔王也詠月云忌滿􅊍先缺乗昬影暫流既能明似鏡何用曲如鈎賔王義烏人七嵗能賦詩武后時數上疏言事除臨海丞鞅鞅不得志棄官去徐敬業亂以為府屬敬業為檄武后罪后讀但嘻笑至一杯之土未乾六尺之孤安在矍然曰誰為之或以賔王對后曰宰相安得失此人敬業敗亡命不知所之中宗時詔求其文得數百篇賔王七嵗詠鵝云鵞鵞曲頂向天歌白毛浮渌水紅掌撥清波盧照隣結交少年場云長安重遊俠洛陽富才雄玉劒浮雲騎金鞭明月弓闘鷄通渭北走馬向關東孫賔遙見待郭解暗相通不受千金爵誰論萬里功將軍下天上虜騎入雲中烽火夜似月兵氣曉成虹横行徇知已負羽逺征戎龍旌昬朔霧鳥陣巻寒風追奔瀚海咽戰罷隂山空歸來謝天子何如馬上翁詠史云昔有平陵男姓朱名阿游直髪上衝冠壯氣横三秋願請斬馬劒先斷佞臣頭天子玉檻折將軍丹血流捐生不肯拜視死其若休歸來教郷里童䝉逺相求弟子數百人散在十二州三公不敢吏五鹿何能詶名與日月懸義與天壤儔何必疲執㦸區區在封侯偉哉曠達士知命固不憂季生昔未達身辱功不成髠鉗為臺􅀠灌園變姓名幸逢滕將軍兼遇曹丘生漢祖廣招納一朝拜公卿百金孰為重一諾良匪輕廷議斬樊噲羣公寂無聲處身孤且直遭時坦而平丈夫當如此唯唯何足榮大漢昔云季小人道遂振玉帛委閽尹斧鑕嬰搢紳邈哉郭先生巻舒得其真雍容謝朝廷譚笑奬人倫在晦不絶俗處亂不為親諸侯不得友天子不得臣冲情甄負甑重價折角巾悠悠天下士相送洛橋津誰知仙舟上寂寂無四隣公業負竒志交結盡才雄良田四百頃所食常不充一為侍御史慷慨説何公何公何為敗吾謀適不同仲頴恣殘忍廢誠良在躬死人如亂麻天子如轉蓬干戈及黄屋荆棘生紫宫鄭生運其謀將以清國戎時來命不遂脫身歸山東凛凛千載下穆如懷清風元日述懷云筮仕無中秩歸耕有外臣人歌小嵗酒花舞大唐春草色薫三徑風􅊍動四隣願得長如此年年物􅀱新七夕泛舟云汀葭肅徂暑江樹起初凉水疑通織室舟似泛仙潢連橈渡急響鳴棹下浮􅊍日晚菱歌唱風煙滿夕陽鳳杼秋期至鳬舟野望開微吟翠塘側延想白雲隈石似支機罷查疑犯宿來天潢殊漫漫日暮獨悠哉照隣字昇之范陽人調新都尉病去官足攣一手又廢乃居具茨山下自以為髙宗尚吏已獨儒武后尚法巳獨黄老后封嵩山屢聘賢士已獨廢著五悲文以自明病既久與親属訣自沈頴水王勃勔勮裴行儉在吏部見蘇味道王勮曰二君後皆掌銓衡李敬􅀇盛稱王勃楊烱盧照隣駱賔王行儉曰勃等雖有才然浮躁衒露豈享爵禄者烱頗沉黙可至今長餘皆不得其死勔晦日宴髙氏林亭詩云上序披林館中京視物華竹䆫低露葉梅逕起風花景落春臺霧池侵舊渚沙綺筵歌吹晚暮雨泛香車勃為文先磨墨數升引被覆靣而卧忽起書之初不加㸃時謂腹藁滕王閣記落霞孤鶩之語至今稱之其詩甚多如畫棟朝飛南浦雲珠簾暮捲西山雨上巳云緑齊山葉滿紅曵片芝銷九日云蘭氣添新酌花香染別衣又詠風云肅肅凉景生加我林壑情驅煙入洞户巻霧出山楹去來固無跡動息如有情日落山水静為君起松聲最有餘味真天才也勮開元中任中書舎人先是五王出閣同日受冊有司忘載冊文百官在列方知闕禮勮召五吏執管授一時俱畢勃為沛王府修撰時諸王闘鷄勃戲為文檄英王鷄髙宗曰是且交覯斥出府勃既廢官劒南嘗登葛憒山曠望慨然思諸葛之功賦詩見情為虢州參軍坐罪除名父福畤以左遷交阯令勃往省度海溺水痵而卒年二十九勮勔以事坐誅楊烱夜送趙縱云趙氏連城壁由來天下傳送君還舊府明月滿秦川張燕公贈別􅄹川箴云杳杳深谷森森喬木天與之才或觧其禄君服六藝道徳為尊君居百里風化之源才勿驕恡政勿苛煩明神是福而小人不寃畏其不畏存其不存作誥兹酒成敗之根勒銘其口禍福之門雖有韶夏勿棄擊轅豈無車馬敢贈一言炯􅂠陰人永􅂭二年皇太子巳釋奠求豪俊充崇文舘學士後爲􅄹川令􅀃以箴贈行戒其苛至官果以嚴酷稱不爲人所多卒官中宗時贈著作郎田遊巗遊巗云洪農清巗曲有磐石可坐宋十一每拂拭待余寄詩贈之云信彼稱靈石居然狎遁棲徘徊承翠巘斌駮帶深溪夕隂起層岫清景半虹蜺風來應嘯阮波渡可琴􅄞僕也頴陽客望彼空思齊儻見山人至簮蒿且杖藜宋之問荅云家臨清溪水溪水繞磐石緑羅四靣垂䮍䮍百餘尺風泉度􅁝管苔蘚鋪茵蓆傳聞頴陽人霞外潄靈液忽枉巗中翰吟卧復朝夕何當遂逺逰物外􅀱逋客遊巗京兆人隠箕山髙宗幸嵩山遣薛元超就問其母帝親至其門帝曰先生比佳否荅曰臣所謂泉石膏盲煙霞痼疾者敕赴都拜崇文館學士進太子洗馬裴炎死坐素厚善放還山唐詩紀事卷第七
