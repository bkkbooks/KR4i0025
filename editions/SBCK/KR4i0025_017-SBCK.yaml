front:
  text: 唐詩紀事巻第十七
  hash: sha256:b1f3d2fb9df59f530f4dd504c4dc396e7b3d7ddf4aea5ee40b7facd9c10a9d9c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_017-1a}
body:
  text: 賀知章賀蘭進明李邕隂行先李伯魚趙冬曦尹􅐂崔成甫李昂殷遥徐延壽范咸丘為賀知章詠柳云碧玉粧成一樹高萬條垂下緑􅁝絛不知細葉誰裁出二月春風似剪刀曉發詩云故鄉杳無際江臯聞􅍼鐘始見沙上鳥猶埋雲外峰知章年八十六卧病􅁳然無知疾損上表乞為道士還鄉明皇許之捨宅為觀賜名千秋命其男曾子㑹稽郡司馬賜鑑湖剡川一曲生池因賜剡川一曲元乞官湖數頃為放詔令供帳東門百寮祖餞御製送詩并序云天寶三年太子賔客賀知章鑒止足之分抗歸老之䟽觧組辭榮志期入道朕以其年在遲暮用循挂冠之事俾遂赤松之遊正月五日將歸㑹稽遂餞東路乃命六卿庻尹大夫供帳青門寵行邁也豈惟崇德尚齒抑亦勵俗勸人無令二踈獨光漢􅁽乃賦詩贈行詩云遺榮期入道辭老競抽簮豈不惜賢逹其如高尚心寰中得秘要方外散幽􅁭獨有青門餞群英悵别􅀷又云筵開百壺餞詔許二踈歸仙記題金籙朝章拔羽衣悄然承睿藻行路滿光輝李林甫詩云挂冠知止足豈獨漢踈賢入道求真侶辭榮訪列仙睿文含日月宸翰動雲煙鸖駕吳鄉逺遥遥南斗邊知章採蓮詩云稽山雲霧鬱嵯峨鏡水無風也自波莫言春度芳菲盡别有中流採芰荷朝士以知章吳越人戲云南金復生中􅁟知章賦詩云鈒鏤銀盤盛蛤蜊鏡湖蓴菜亂如􅁝郷曲近來佳此味􅃒渠不道是吴兒神龍中知章與越州賀朝方齊融楊州張若虚邢巨湖州包融俱以吳越文詞俊秀名聞上京朝止山隂尉齊融崑山令若虛兖州兵曹巨監察御史融遇張九齡引爲懷州司户集賢直學士知章最貴神龍中又有尉氏李澄之善五言詩終宋州參軍知章送張説廵朔方應制云荒境盡懷忠梯航已自通九攻雖不戰五月尚持戎遣戌徴周牒臨邊重漢攻選車命元宰授律取文雄胄出天弧上謀成帝幄中詔旂分夏物專射錫唐􅃓帳􅀫伊生右鉦吹􅀳苑東饔人藉蕡實樂正理􅁝桐岐陌􅆂餘􅀨離川照曉虹恭聞詠方叔千載舞皇風又送張説集賢上學士應制云西學垂玄覧東堂發聖謩天光燭武殿時宰集鴻都枯杇霑皇澤飛舞帝梧跡同逰汘澷榮是㧞泥塗三歎承湯鼎千歡接舜壷微軀不可荅空欲詠依蒲賀蘭進明古意云秦庭􅀄指鹿群盜滿山東忤意皆誅死所言誰肯忠武􅀜猶未啓兵入望夷宫為祟非涇水人君道自窮又云崇蘭生澗底香氣滿幽林釆釆欲為贈何人是同心日暮徒盈把徘徊憂思深􅁣然紉雜佩重奏丘中琴祿山亂進明守臨淮以御史大夫為節度使張廵睢陽之圍遣南霽雲乞師不應霽雲去抽矢回射佛寺浮圖曰吾破賊必㓕賀蘭此矢所以志也行路難云君不見嵓下井百尺不及泉君不見山上苖數寸臨雲煙人生相命亦如此何苦太息自憂煎但願親友長含笑相逢莫乏杖頭錢寒夜邀歡湏秉燭豈得容思花柳年君不見門前柳榮耀暫時蕭條乆君不見陌上花狂風吹去落誰家誰家思婦見之歡蓬首不梳心歷亂盛年夫􅡾長離别歳暮見之色凋換君不見芳樹枝春花落盡蜂不窺君不見梁上泥秋風始高鷰不栖蕩子從軍事征戰蛾眉嬋姢守空閨獨宿自然堪下泪况復更聞烏夜啼君不見雲間月蹔盈還復缺君不見林下風聲逺意難窮親故平生或聚散懽娯未盡罇中空歏息青青陵上栢歳寒能與㡬人同君不見東流水水去無窮已君不見西郊雲日夕空氛氲群鴈徘徊不能去一鴈驚鳴復失群人生結交在終始莫以􅀷沉中路分取於河岳英灵右行路難商璠進明登開元十六年進士第肅宗時進明爲比海太守詣行在上命房琯以進明爲南海太守兼御史大夫嶺南節度使琯以爲攝御史大夫進明入謝遂譛之上由是踈琯李邕李之芳自尚書郎出爲齊州司馬製新亭邕有登歴下古城貟外孫新亭詩云吾宗固神秀體物冩謀長形制開古跡曾氷延樂方太山雄地里巨壑􅆌雲莊高興泊煩促永懷清典常含引知四大出入見三光􅀒郭喜粳稻安時謌吉祥善五言詩初爲祿山范陽之芳大宗子蔣王揮之後叛自拔歸司馬祿山子美八哀詩有秘書監江夏李邕詩云長嘯宇宙間高才日陵替古人不可見前軰復誰繼憶昔李公存詞林有根柢文選六十卷行於時邕少知名長安􅀄唐文苑傳李邕廣陵江都人父善嘗注高行直堪爲諫諍李矯張廷珪並薦邕詞聲華當徤筆灑落冨清製風流散金石追􅅣山岳鋭衣冠天下寺觀多出其手邕早擅才名尤長碑頌中朝情窮造化理學貫天人際干謁走其門碑板照四裔各滿深望還森然起凢例蕭蕭白楊路洞徹寶珠惠龍宫塔廟湧浩刼浮雲衛宗儒爼豆事故吏去思計眄膝已皆虛䟦渉曾不泥向來映當時豈獨勤後世豊屋􅃢瑚鈎騏驎織成􅄢紫騮隨劔几義取無虛歳分宅脱驂間感激懷未濟衆歸賙給美擺落多藏穢而賈生信陵之流執事忌勝剥落在外邕素􅀒美名頻被貶斥皆㕥邕能文養士獨歩四十年風聽九臯唳可謂獨歩矣累献詞賦甚称􅀇宗㫖邕知名長安中死天寳初十四年間文章徹天聽故有九臯唳之句後因上計中使臨索其新文以嗚呼江夏姿竟掩宣尼袂往者武后朝引用多寵嬖否􅆇太常議韋巨源邕有戒推重之溢議文士靣折二張勢丞宋景奏侍臣張昌宗兄事初邕為左拾遺俄而御史中璟言事関社稷望陛下可其奏則天色觧始􅁢宋璟有不順之言請付法断則天初不應邕在陛下進曰不測何為造次如是邕曰不顛不狂其名不章旣岀或謂邕曰子名位尚卑若不稱㫖禍福捋衰俗凛生風排蕩秋旻霽忠正􅀒􅁈恨宮闕􅀷旈綴放逐早聮翩低垂困炎厲宗􅀄又貶後召還為姚宗所邕始以與張東之善貶雷州􅀇慰稱㫖頗自矜衒為張説所􅁖發陳州賍事抵死許嫉貶台州徴為陳州􅀇宗東封回邕謁見於汴献詞官掦思朂討賊有功轉括溜滑三州刺史上計京師州人孔璋上䟽救之㑹赦免貶欽州後於嶺南從中古人或傳眉目有異衣冠望風㝷訪門巷又中使臨邕少有名累被貶逐後進不識京洛阡陌聚觀以為隂中竟不得進用也問索其新文復為人日斜鵬鳥入䰟斷倉梧帝榮枯走不暇星駕無安税㡬分漢庭竹給郡守邕累為刺漢制以竹使符分㡬分史故曰夙擁文侯篲終悲洛陽獄事近小臣敝禍階初􅀒謗易力何􅀷嚌温令勣引邕議及休咎事遂誅邕與柳勣馬一疋及勣下獄吉伊昔臨淄亭酒酣託末契歴下亭詩是也甫有陪李北海宴重叙東都别朝隂改軒砌論文到崔蘇人以文章擅也崔信明蘇源明二指盡流水逝近伏盈川雄張沈曰楊盈川文思如懸河唐文菀傳陽烱為盈川令卒照隣亦不减王勃也注酌之不竭旣優於盧末甘特進麗文如良金美玉張説曰李嶠之嶠為特進故也無疵不可特進李是非張相國相扼一危脆封回邕􅀇宗東云當居相位又素輕張説與相􅁖説為中書令甚􅁖於汴州謁見累献詞賦甚稱上由是頗自矜衒自之争名豈古然鍵捷歘不閉例及吾家詩曠懷掃氛翳慷􅁣嗣真作咨嗟玉山桂鍾律儼高懸鯤鯨噴迢遰坡陁青州血蕪沒汶陽瘞所也邕塟哀贈竟蕭條恩波延揭厲贈秘書監代宗時國恩例子孫如在綫舊客舟疑滯君臣尚論兵將帥接燕薊朗詠六公篇公洎伏相六公邕有張桓等五詩憂來豁蒙蔽争鋒但虞傷缺耳後卒如其言盧藏用嘗謂邕如干將莫耶難與邕字太和揚州人旣冠見李嶠願一見秘書乃假直秘閣累以罪譴開元末歷淄滑二州刺史上計京師阡陌聚觀出為北郡太守李林甫忌之天寶末以柳勣事遣御史就郡杖殺之先是邕王弼王琚皆耆艾􅀘外乆書䟽尺題有譴謫留落之句林甫故隂議除之隂行先張燕公説至湘有九日登高詩云西楚茱茰節南淮戲馬臺寜知洹水上復有菊花盃亭帳慿高出親遊自逺來短歌將急景同使興情催行先和云重陽􅀄啓節無射正飛􅁅寂寞風蟬至連翩􅀟鴈來山棠紅葉下㟁菊紫花開今日􅁊公坐多愧孟嘉才行先開元問為湘州從事李伯魚伯魚桐竹詩云北竹青桐北南家綠竹南竹林君早愛桐樹我􅀄貪鳳栖桐不媿鳳食竹何慙棲食更如此餘非鳳所堪張燕公説和云結廬桐竹下室邇人相深接垣分竹逕隔户共桐隂落花朝滿㟁明月夜披林竹有龍鳴管桐留鳳舞隂伯魚臨淄人登開元六年進士第善為文擢校書郎出為青州司功而卒其妻范陽張氏女燕公之妹也燕公銘張氏墓云送我伯妹萬安之墳精靈何處為雨為雲彼臨淄兮千里望倐忽􅀆夫君趙冬曦和張燕公説早霽南樓詩云方􅍼躋南樓凭軒四遐矚物華喧淑氣春景媚晴旭川霽湘山孤林芳楚郊縟列巗重疊翠逺㟁逶迤綠風㠶摩天垠漁艇散灣曲鴻歸鸖舞逺猿呌鶯斷續群動皆熈熈噫予獨覉束常欽才子義忌鵬傷踡跼雅尚騷人文懷沙何迫促未知二賢意去矣從所欲和張説耗磨日飲云春來半月度俗忌一朝閑不酌他郷酒無堪對楚山乆曦定州人開元􅀄爲監察御史坐事流岳州召還復官酬燕公歸田賦之作云窮鳥嬰籠綴孤飛任播遷鷦鷯王佐用復此挫冲天楚雲何掩鬱湘水亦廻邅懷哉愧木鴈忽爾枉蘭荃愈疾同枚叔銷憂比仲宣歸途書可畏弱藻石猶堅覆載雖云廣涔陽􅀡塊未詳然抆叔㴩湖作云三湖􅝭入兩山間畜作㴩湖彎復彎暑雨奔流湘正滿微霜及潦水􅀄還水還波卷溪潭涸綠草芊芊㟁嶄岝適方飛棹共回旋已復揚鞭恣行樂道傍􅂄老歩躚躚楚言兹事不知年試就湖邊披草徑莫疑東海變桒田君訝今時盡陵陸我㸔明歳更淪漣來今自昔無終始人事廻環常若是應思闕下聲華日誰謂江潭旅遊子􅀄貞正喜固當然徃蹇來譽冝可俟盈虚用捨輪輿旋勿學靈均逺問天巴江序云潦成湖冬涸為野尔雅云水􅝭入為㴩斯名之作有南㴩湖者蓋玩湘汨之際波淪匯洞庭澹澹千里夏尔由焉和燕公岳州山城云爲吏恩猶舊投沙惠此蒙江邊攸爾處泗上宛然同訪道精言合論經大義通鳴琴有眞氣泥巳沬清風陪燕公行郡竹籬云良臣乃國寶麾守去承明外户人無閉浮江獸巳行隨來晉盗逸民化蜀風清郛郭從彛典州閭荷德聲小人􅀍天涯流落巴丘城所頼中和作優游鑿與耕酬燕公出湖見􅀉云綸紱有成命旌麾不可攀湘川朝自斷闕夕波還果枉東瞻唱興言夕放閑携琴仙洞中置酒㴩湖上芳景恣行樂謫居忽如忘聚散本相因離情自悲悵鸞翮非常戢鵬天㑹昭曠永懷宛洛游曽是彈冠望荆闕字未詳和燕公遊㴩湖上寺云江外多山水招要歩馬來琴將天籟合酒共鳥聲催巗坐攀紅藥溪行愛綠苔所懷非此地游望亦徘徊和燕公别㴩湖云南湖美泉石君子翫幽竒灣澳陪臨泛巗峿共踐窺秋風頳桂竦春景緑楊垂郢路委分竹湘濵擁去麾枉㠶懷勝賞留景惜􅆧池水朩且不弃情遊良可知尹􅐂陪燕公登南樓詩云君子每垂眷江山共流盻水逺林外明嵓近霧中見終日西北望何處是京縣屢登高春臺徒使淚如霰燕公和云危樓㵼洞湖積水照城隅命駕邀漁父通家引鳳鶵山晴紅蘂匝洲曉綠苖鋪舉目思鄉縣春光定不殊趙冬曦云寛慰何以歡隂氣亦登望孤島輕霧裏行舟白波上目熒西北雲心醉東南障昔日青溪子胡然此無狀秋夜遊㴩湖詩云熊軾巴陵地鷁舟湘水潯江山與勢逺泉石自幽􅀷杳靄入天壑􅁳茫見道心超然無俗事清宴有深林又云江上饒竒山㠝羅雲水間風秋樹色雜苔古色文班巴浴將千溬㴩湖凡㡬灣嬉遊竟不盡乗月汎舟還方舟嬉逰㴩壑覧山川之異􅊥泉石之竒盻望􅐂序云燕公以董司馬􅀄到趙侍御客焉聿理時之樂豈不盛歟崇朝留樽待月一燕公和云㴩湖佳可遊旣近復能幽林裏捿精舎山間轉去舟鴈飛江月冷猿嘯野風秋不是迷郷路㝷竒處處留又云坐嘯人事閑佳逰野情發山門送落照湖口望昇月林㝷猿狖居水戯黿鼉􅔙朔風吹飛鴈芳草亦云歇趙冬曦云政理常多暇方舟此泝洄吹笙虛洞荅舉揖便風催山暗雲猶辯潭幽月稍來清溪無數曲未盡莫先回又云煙靄夕微􅀩幽灣賞未窮艤舟待􅀄月寒幌招逺風鸖聲聒前浦人火明暗叢東山雲壑意不謂爾來同張均云逺水沉西日寒沙聚夜鷗平湖乗月滿飛棹接星流黃葉鳴淒吹蒼葭掃暗洲願移滄浦賞歸侍頴川遊又云灣潭幽意深查靄涌寒岑石㾗秋水落嵐聚夕陽沉澄澈天為底淵玄月作心青溪非大隐歸弃白雲潯汎洞庭云風光淅淅草中飄日采熒熒水上揺幸奉瀟湘雲壑意山傍欲與動仙橈燕公和云平湖一望氷連天秋景千潯下洞泉忽驚水上􅊍􅂠滿疑是乗舟到日邊􅐂開元時張燕公岳州從事也官􅀘闕崔成甫侍御是也李白詩崔贈李白云我是瀟湘放逐臣君辭明主漢江濵天外常求李白老金陵捉得酒仙人白和云嚴陵不從萬乗遊歸卧空山釣北流自是客星辭帝座元非太白醉揚州李白澤畔吟序云澤畔吟者逐臣崔公所作云代業文宗早荗才秀起家校書蓬山再尉􅀜輔中佐于憲車因貶湘隂流離沅湘摧顇草莾忠憤義烈形于清辭其怨者之流乎開元末長安令韋堅兼水陸轉運使鑿潭望春樓下先時民間唱俚歌曰得夲紇那邪其後得寶符於桃林時成甫為陜縣尉更得体歌為得寶洪農野堅命舟人歌之成甫又廣之為歌辭十闋自衣缺後綠衣錦半臂紅抹額立第一船為號頭以唱集兩縣婦女百人鮮服靚粧鳴皷吹笛以和之先是人間歔唱歌詞云得反丁紇体反都董紇郍耶紇囊得体耶潭裏船車閙楊州銅噐多三郎當殿坐㸔唱得体歌至開元二十九年田同秀上言見玄元皇帝云有寶符在陜州桃林縣古􅀜令尹喜宅發中使求而得之以為殊祥改桃林為靈寶縣以韋堅為陜郡太守鑿新潭潭成又致楊林銅噐翻出此詞廣集兩縣官使婦人唱之言得寶弘農野弘農得寶耶潭􅂻船車閙楊州銅噐多三郎當殿坐㸔唱得寶歌成甫又作歌詞十首李昂雋秀等科􅀄皆考功主之開元二十四年李昂員外性剛急不容物以舉人皆􅅚名求稱揺蕩主司談毁失實竊病之而將革焉集貢士與之約曰文之美􅁖悉知之矣考校取捨存乎至公如有請託於時求聲於人者當首落之旣而昻外舅常與進士李權隣居相善乃舉權於昻昻怒集貢人召權庭數之權謝曰人或相知竊聞於左右非敢求也昻因曰觀衆君子之文信美矣然古人云瑜不掩瑕忠也其有詞或不典將與衆評之若何皆曰唯公之命旣出權謂衆曰向之言其意属吾也吾誠不第决矣又何籍焉乃隂求昻瑕以待之異日㑹論果斥權章句之疪以辱之權拱而前曰夫禮尚徃來來而不往非禮也鄙文不􅆇旣得而聞矣而執事昔有雅什嘗聞於道路愚將切磋可乎昻怒而嬉笑曰有何不可權曰耳臨清渭洗心向白雲閑豈執事之詞乎昻曰然權曰昔唐堯衰耄厭倦天下將禪於許由由惡聞故洗耳今於天子春秋鼎盛不揖讓於足下而洗耳何哉是時國家寜謐百寮畏法令兢然莫敢跌昻聞惶駭蹶起不知所酬乃訴於執政謂權風狂不遜遂下權吏初昻強復不受嘱請及有吏議求者莫不允從由是庭議以省郎位輕不足以臨多士乃以禮部侍郎專之昂賦戚夫人楚舞歌云定陶城中是妾家妾年二八顔如花閨中歌舞未終曲天下死人如亂麻漢王此地因征戰未出簾櫳人已薦風花􅔽蓞落轅門雲雨徘徊入行殿日夕悠悠非舊郷飄飄處處逐君王閨門向裏通歸夢銀燭迎來在戰場相從顧恩不顧已何異浮萍寄深水逐戰曾迷隻輪下隨君㡬䧟重圍裏此時平楚復平齊咸陽宫闕到􅀜西珠簾夕殿聞鍾皷白日秋天憶皷􅎏君王縱恣翻成誤吕后由來有􅀷妬不柰君王容鬢衰相存相顧能㡬時黃泉白骨不可報雀􅁫翠羽從此辭君楚歌􅀆妾楚舞脉脉相㸔兩心苦曲未終兮袂更揚君流涕兮妾斷腸已見儲君歸惠帝徒留愛子付周昌殷遥題友人亭云故人雖薄宦往往渉清溪鑿牖對山月褰裳拂澗霓逰魚逆水上􅀫鳥向風棲一見桃花發能令秦漢迷山行云寂歷青山曉山行趣不稀野花成子落江鷰引雛飛暗草薰苔徑晴楊掃石磯俗人猶語此餘立轉忘歸王維哭之云人生能㡬何畢竟歸無形念君等為死萬事傷人情慈母未及葬一女纔十齡􅐯􅐯寒郊外蕭條聞哭聲浮雲為蒼忙飛烏不能鳴行人同寂寞白日自悽清憶昔君在時問我學無生勸君苦不早令君無所成故人各有贈又不及半生􅀒爾非一涂慟哭􅝭柴荆又曰送君反葬石樓山松栢蒼蒼賔馭還埋骨白雲長已矣空餘流水向人間遥丹陽人天寶間終於忠王府曹參軍徐延壽人日剪綵詩云閨婦持刀坐自憐裁剪新葉催情綴色花􅀉手成春帖鷰留粧户黏鷄欲向人驚來問夫婿何處不如眞延壽開元間江寧人處士也苑咸王維贈咸詩序曰苑舎人能書􅆊字兼逹梵音曲盡其妙戲為之贈詩曰名儒待制滿公車才子為郎典石渠蓮花法藏心懸悟貝葉經文手自書楚詞共許勝揚馬梵字何人辯魯魚故舊相望在三事願君莫厭承明廬咸荅詩曰蓮花梵字本從天華省仙郎早悟禪三㸃成伊猶有想一觀如幻自忘筌為文已變當時躰入用還推間氣賢應同羅漢無名欲故作馮唐老歳年荅云仙郎真意憐同舎丞相無私断掃門王為庫部員外郎乆不迁故咸末句及之王咸成都人開元末上書拜司經校書中書舎人顔眞卿序遜逖文集曰公之除庶子也苑咸草詔曰西掖掌綸朝推無對議者以為知言唐人推咸為文誥之最後貶漢東郡司户參軍復起為舎人終永陽太守始咸舉進士在京仲夏忽染疾而卒三日復蘇云見人追至隂司見劉敬則為㝠官乃同舉進士也問其故乃曰追瑊乃誤召公速遣押還咸曰數上京不捷家逺且貧試閲籍若有科第官職即願生還劉謂曰君來春登苐歴臺省至中書舎人丘為為蘇州嘉興人事繼母孝常有靈芝生堂下累官太子右庻子時年八十餘而母無恙給俸祿之半及居憂觀察使韓滉以致仕官給祿所以惠養老臣不可在喪為異唯罷春秋羊酒􅀄還郷縣令謁之為候門磬折令坐乃拜里胥立庭下旣出乃敢坐經縣宇降馬而趍卒年九十六與劉長卿善長卿送為赴上都詩云帝郷何處是岐路空垂泣楚思愁暮多川程帶潮急潮歸人不歸獨向回塘立王摩誥送為徃唐州詩云四愁連漢水百口􅀉隨人為尋西山隱者不遇詩云絶頂一茅茨直上三十里扣􅀜無僮僕窺室唯案几若非巾柴車應是鈎秋水差池不相見黾俛空仰止草色新雨中松聲晚秋裏及兹繼幽絶自足盪心耳雖無賔主意頗得清浄理興盡方下山何必待之子王維送為落第東歸詩云憐君不得意况復柳條春為客黃金盡還家白髪新五湖三畝宅萬里一歸人知禰不能薦羞為獻納臣重岀摩詰賦左掖棃花詩云閑灑階邊草輕隨箔外風黄鸎弄不足衘入未央宫為和云冷艶全欺雪餘香乍入衣春風且莫定吹向玉階飛皇甫冉詩云巧觧迎人笑偏能亂蝶飛春風時入户㡬片落朝衣唐詩紀事卷第十七
