front:
  text: 唐詩紀事卷第十八
  hash: sha256:3bdde629ee4f7c38a747568958aa50bcc9cbaf2c87d0d94d37d8cd5d0e75874f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_018-1a}
body:
  text: 杜甫李白杜甫元稹作子美墓銘叙曰餘讀詩至杜子美而知古人之才有所揔萃焉始堯舜之君臣以賡歌相和是後詩人繼作歴夏殷周千餘年仲尼緝拾選練取其干預教化之􅀹者三百篇其後無聞焉騷人作而怨憤之態繁然猶去風雅日近尚相比擬秦漢巳還釆詩之官旣廢天下俗謡民謳歌頌諷賦曲度嬉戯之詞亦隨時間作至武帝賦栢梁詩而七言之體具蘇子卿李少卿之徒􅀹工爲五言雖句讀文律各異雅鄭之音而詞意闊逺指事言情自非有爲而爲則文不妄作建安之後天下之士遭罹兵􅀾曹氏父子鞍馬間爲文徃徃横槊賦詩故其遒文壯節抑揚怨哀悲離之作􅀹極於古晉世風槩稍存宋齊之間教失根本士以簡慢矯飾相尚文章以風容色澤放曠精清爲高蓋吟冩性靈流連光景之文也意義格力無取焉陵遲至梁陳滛艶刻飾佻巧小碎之詞又宋齊之所不取唐興學官大振歴世之文能者互書而又沈宋之流研練精切穏順聲勢謂之爲律詩由是而後文變之體極焉而又好古者遺近務華者去實效齊梁則不逮於􅀳魏工樂府則力屈於五言律切則骨格不存閑暇則纎穠莫備至於子美所謂上簿風雅下該沈宋言奪蘇李氣吞曹劉掩顔謝之孤高雜徐􅁃之流麗盡得古今之體􅀔而兼昔人之所獨專矣如使仲尼考鍜其㫖要尚不知貴其多乎哉苟以爲能所不能無可無不可則詩人以來未有如子美者是時山東人李白亦以竒文取稱時人謂之李杜余觀其壯浪縱恣擺去拘束摸冩物象及樂府歌詩誠亦差肩於子美至􅀂鋪陳終始排比聲韻大或千言次猶數百詞氣豪邁而風調清􅀷屬對律切而脫棄凡近則李尚不能歷其藩翰况堂奥乎余嘗欲條㭊其文體别相附與來者爲之凖病􅂴未就爾適子美之孫嗣業啓子美之柩㐮祔事於偃師途次于荆楚雅知余愛言其大父之爲文祈余爲誌辭不可絶余因系其官閥而銘其卒葬云系曰􅀳當陽侯杜氏下十世而生依藝生審言善詩官至膳部員外郎審言生閑閑生甫爲奉天令甫字子美天寶中獻三大禮賦明皇竒之命宰相試文文善授率州曹屬京師亂歩謁行在授左拾遺以直言失官出爲華州司功㝷迁京兆功曹劔南節度使嚴武㧞爲工部員外叅謀軍事旋又棄其官扁舟下荆楚間竟以寓卒旅殯嶽陽享年五十九夫人弘農楊氏女父曰司農少卿怡四十九年終嗣子曰宗武病不克葬没命其子嗣業以家貧無以給䘮收拾乞丐燋勞晝夜去子美没後四十年然後卒先人之志亦足爲難矣銘曰惟元和之癸己粤某月某日之佳辰合􅉎我杜子美於首陽之山前嗚呼千歳而下曰此文先生之古墳樂天曰杜詩最多至於貫穿今古覼縷格律盡工盡善又過於李然撮其新安石濠潼􅀜吏蘆子􅀜花門之章朱門酒肉臭路有凍死骨之句亦不過三四十杜尚如此况不逮者乎睿宗先天元年癸丑是歳甫生明皇開元三年丙辰於郾城觀公孫大娘舞劔噐是年才四歳必有悞天寳元年癸未有南曹小司㓂爲山之作時年三十一天寶十一年癸巳上韋相詩有龍飛四十春帝即位四十年時有兵車行麗人行十三年乙未上三大禮賦甫年四十三行攺右衛率府胄曹召試文章授河西尉不十四年丙申是年十一月􅀄自京赴奉先有懷詠詩是月禄山亂州獨䧟賊中以家避亂鄜天寶十五載丁酉六月帝西狩有哀王孫詩七月肅宗即位攺元至德是年避㓂馮翊有白水高齋三川觀漲詩至德二年自賊中竄歸鳯翔拜左拾遺八月墨制放徃鄜州迎家有北征詩明年乾元元年收京扈從還長安上䟽論救房琯帝怒黜甫華州司功有新安吏石壕吏新婚别垂老别留花門洗兵馬詩明年􅀜輔飢亂棄官之秦州乃適同谷乃入蜀有遣興三百首上元元年辛丑在蜀二年嚴武鎭蜀甫自閬徃依焉明年寶應元年癸巳有元年建已月詩代宗廣德元年甲辰有祭房相國文武再鎭蜀表甫叅謀檢校員外工部作傷春五首永㤗元年丙午武卒崔旰殺郭英乂楊子琳栢正節舉兵攻旰蜀亂甫遊東川除京兆功曹不赴大歴元年丁未移居夔州三年出峽之荆渚至湘潭寓居耒陽五年辛亥有追高適人日作夏甫還㐮漢卒於岳陽叚成式酉陽雜俎云李白集有堯祠贈杜􅀘闕者老杜也詩曰我覺秋興逸誰言秋興悲山將落日去水與晴相冝煙歸北海少鴈度青天遲相失各萬里茫然空爾思不獨飯顆山頭之句也國朝盛文肅嘗夢朝上帝見殿上題扇云夜䦨更秉燭相對如夢􅄰􅀄謂天上之作巳而知子美詩也禰衡撾漁陽摻其聲悲壯漢武時星辰影動揺東方朔謂民勞之應子美詩云五更皷角聲悲壯三峽星河影動揺乃用故事也先儒云不行一萬里不讀萬卷書不知老杜書信然詩話云有病瘧者子美曰吾詩可以療之病者曰云何曰夜䦨更秉燭相對如夢􅄰其人誦之瘧猶是也杜曰更誦吾詩云子章髑髏血摸糊手提擲還崔大夫其人誦之果愈子美傲誕不冠見嚴武故詩云莫􅀝善題鸎鵡賦何湏不着鵕儀冠子美奉酬云謝安不倦登臨賞阮籍焉知禮法踈傳叙子美傲放武積不平欲殺之冠鈎於簾者三遂止􅀉韋有夏都中詩云省郎憂病士書信有柴胡飲子頻通汗懷君想報珠飲子對懷君或云沈佺期齒録對牙緋孟浩然鷄􅁰對楊梅之􅀋也子美題李尊師松障詩云巳知仙客意相親更覺良工心獨苦用意之妙有舉世莫知者此唐人所以名家也李白烏棲曲云姑蘇臺上烏棲時呉王宫裏醉西施呉歌楚舞歡未畢青山猶衘半邊日銀箭金壺金丁一作漏水多起㸔秋月墜江波東方漸高奈樂何爾何一作天寶􅀄賀知章見之曰此詩可以泣􅀑神矣蜀道難云噫嚱吁危乎高哉蜀道之難難於上青天蚕叢及魚鳬開國何茫然爾來肆萬捌千歳乃與秦塞通人煙西當太白有鳥道可以横絶峨眉巔地崩山摧壯士死然後天梯石棧方相一作鈎漣上有六龍廻日之高摽海之浮雲一作横河断下有衝波逆折之回川黃鸖之飛尚不得過一作猿猱欲度愁攀縁牽一作青泥何盤盤百歩九折縈嵓巒捫參歴井仰脅息以手撫膺坐長嘆問君西遊何時還畏途巉嵓不可攀但見悲鳥號古木雄飛雌從遶林間又聞子規啼夜月愁空山蜀道之難難於上青天使人聽此凋朱顔連峰去天不􅄹尺㡬千尺一作入㷑枯松倒挂􅀝絶壁飛湍瀑流争喧豗氷崕轉石方壑雷其嶮也若此嗟爾逺道之人胡爲乎來哉劔閣峥嶸而崔嵬一夫當􅀜萬人夫一作莫開所守或匪親人一作化爲狼與豺朝避猛虎夕避長蛇磨牙吮血殺人如麻錦城雖云樂不如早還家蜀道之難難於上青天側身西望長咨嗟人嗟一作令蜀道難或曰譏章仇兼瓊或曰譏嚴武之􅁀爲房相杜甫危之也宫中行樂詞云小小生金屋􅄹􅄹在紫微山花揷寳䯻石竹繡羅衣毎出􅀷宫裏常隨歩輦歸只愁歌舞散化作綵雲飛柳色黃金嫰梨花白雪香玉樓巢開一作翡翠珠金一作殿鎻鴛鴦選妓隨雕朝一作輦徴歌出洞房宫中誰第一飛鷰在昭陽盧橘爲榛樹蒲桃出是一作漢宫煙花冝落日絲管醉春風笛奏龍鳴吟一作水簫吟鳴一作鳳下空君王多樂事何必向在一作回中万方同一作選與玉樹殿一作春歸日好一作金宮樂事多後庭朝未入輕輦夜相過笑歩花間語嬌來燭下歌莫教明月去留著醉姮娥繡户香風暖紗窓􅍼色新宫花争笑日池草暗生春緑樹聞歌鳥青樓見舞人昭陽桃李月羅綺自坐一作相親今日明光裏還湏結伴遊春風開紫殿天樂下珠樓豔舞全知巧嬌歌半欲羞更憐花月夜宫女笑蔵鉤寒雪梅中盡春風柳上歸宫鶯嬌欲醉簷燕語還飛遲日明歌席新花豔舞衣晩來移綵仗行樂好光輝水渌南薰殿花紅北闕樓鶯歌聞太液鳯吹遶瀛州素女鳴珠佩天人弄綵毬今朝風日好冝入未央逰明皇坐沉香亭意有所感欲得白爲樂章召入而白巳醉左右以水頮靣稍觧授筆成文婉轉精切無留思清平調詞云雲想衣裳花想容春風拂檻露華濃􅀂非群玉山頭見會向瑶臺月下逢一枝紅豔露凝香雲雨巫山枉斷腸借問漢宫誰得似可憐飛燕􅀝新粧名花傾國兩相歡長得君王帶笑看觧釋春風無限恨沉香亭北􅀝欄干禁中木芍藥開上賞之妃子從帝曰賞名花對妃子焉用舊樂詞爲命李亀年持金花牋賜白爲清平樂詞三章梨園子弟撫絲竹李亀年歌之上親調玉笛以􅀝曲毎曲遍將換則遲其聲以媚之太真以頗梨七寶盃酌西凉蒲萄酒笑飲翰林讀書言懷呈集賢院内諸學士云晨趍紫禁中夕待金門詔觀書散遺秩探古窮至妙片日茍會心掩卷忽而笑青蝇易相㸃白雪難同調本是散踈人屢貽􅄶促誚雲天屬清朗林壑憶遊眺或時清風來閑􅀝欄簷一作下嘯嚴光桐廬溪謝客臨海嶠功成謝人君間一作從比一投釣高力士以脫靴之耻諎白於貴妃曰以飛燕指妃子是賤之甚也不爲親近所容乃益放鷔爲酒八仙人懇求還山潯陽紫極宫感秋作云何處聞秋聲翛翛北牎竹廻薄萬古心攬之不􅄹掬静坐觀衆妙浩然媚幽獨白雲南山來就我簷下宿􅈸從唐生决羞訪季主卜四十九年非一徃不可復野情轉蕭散世道有翻復陶令歸去來田家酒應熟是時自有歸山之意矣胡無人云嚴風吹霜海草凋筋簳精堅胡馬驕漢家戰士三千萬將軍兼領誰者一作霍嫖姚流星白羽腰間挿劒花秋蓮光岀匣天兵照雪下王􅀜虜箭如沙射金甲雲龍風虎盡晝一作交回太白入月敵可摧旄頭㓕覆胡之腸涉胡血懸胡青天上埋胡紫塞旁胡無人漢道昌陛下之壽三千霜但歌大風雲飛揚安用猛士兮守四方此詩禄山反時作禄山死太白食月云東武吟云好古笑流俗素聞賢逹風方希佐明主長揖辭成功白日在高天回光燭微躬恭承鳯凰詔歘起雲蘿中清切紫霄廻優游丹禁通君王晹顔色聲價凌煙虹桒輿擁翠蓋扈從金城東寶馬麗絶景錦衣入新豐􅀝巗望松雪對酒鳴絲桐因學楊子雲獻賦甘泉宫天書美片善清芬播無窮歸來入咸陽談笑皆王公一朝去金馬飄落成飛蓬賔犮日踈散玉樽日成空才力猶可􅀝恃一作不慙世上雄閑作東武吟曲盡情未終書此謝知巳吾尋黃綺翁尋釣翁一作扁舟或曰白以是詩留别翰苑蓫放逰江湖矣對酒憶賀監序云太子賔客賀公扵長安紫極宫一見余呼余爲謫仙人因觧金􅀛換酒爲樂没後對酒悵然有懷而作是詩曰四明有狂客風流霞杯一作賀季眞長安一相見呼我謫仙人㫺好盃中物翻今一作爲松下塵金龜換酒處却憶淚沾巾又狂客歸四明山隂道士迎勑賜鏡湖水爲君臺沼榮人亡余湖宅空有荷花生念此杳如夢凄然傷我情又曰欲向江東去定將誰舉盃稽山無賀老却棹酒船廻飯顆山頭逢杜甫頂戴笠子日草午借問因何太痩生揔爲從前作詩苦此詩載於唐舊史近世傳白詩云斷崕如削􅀲嵐光破崕緑天河從中來白雲漲川谷玉案勑文字世眼不可讀攝身凌清霄松風拂我足又云舉䄂露條脫招我飯胡麻白本末傳記所載不同唐史稱白興聖皇帝九世孫隋末以罪徙西域神龍􅀄遁還客巴西旣長隱岷山蘇頲爲益州長史見白異之更客任城與孔巢父韓凖裴政張叔明陶􅃆居徂徠山日沉飲號竹溪六逸天寶􅀄南入會稽與吳筠善筠􅀍召故白亦至長安徃見賀知章賀知章見其文歎曰子謫仙人也嚴武傳武爲劒南節度使房琯以故相爲部内剌史武慢倨不爲禮最厚杜甫然欲殺甫數矣李白爲蜀道難者乃爲房杜危之也韋臯傳天寶時李白爲蜀道難斥嚴武陸暢更爲蜀道易以美韋臯摭言云太白自蜀至京以新業贄謁賀知章知章覽蜀道難一篇楊眉謂之曰公非人世人豈非太白星精邪然則蜀道難之作乆矣非爲房杜也又南部新書云李白山東人父為任城尉因家焉少與魯人隱徂徠山號竹溪陸逸天寶􅀄逰會稽吳筠隱剡中谷稱蜀人非也今任城令廳有白之詞尚存唐范傳正誌其墓曰白凉武昭王九世孫昭王隴西人隋末子孫以罪徙碎葉神龍時白父客自西域逃居綿之巴西而白生焉唐魏顆李陽氷序其文劉全白􅁧其墓碣皆曰廣漢人故論白者或曰隴西或曰山東或曰蜀陽氷云出翰林浪跡縱酒以自昬穢詠謌之際屢稱東山林白亦云以張垍讒逐逰海岱間子美所謂汝與山東李白好蓋白自号也蜀道難或曰作於天寶􅀄或曰作於天寶末二說皆出於後世以意逆之曰此爲房杜危之也陸暢去白未逺作蜀道易以美韋臯傳之當時而蜀道難之詞曰錦城雖云樂不如早還家其意必有所属房杜之說盖近之矣西故以客呼之白之父客於巴東蜀楊天惠彰明逸事云元符二年春正月天惠􅀘令於此竊從學士大夫求問逸事聞唐李太白本邑人微時募縣小吏入令卧内嘗驅牛徑堂下令妻怒將加詰責太白亟以詩謝云若非是織女何得問牽牛素靣􅀝欄鈎嬌聲出外頭令驚異不問稍親招引侍研席令一日賦山火詩思軋不属太白從傍綴其下句令詩云人歸火不歸野火燒山去太白繼云煙逐暮雲飛熖隨紅日去令慙止頃之從令觀漲有女子溺死江上令復苦吟太白輙應聲繼之令詩云鳥窺眉上翠魚弄口傍珠二八誰家女漂來􅀝岸芦太白繼云因何逢五伯應是想秋胡緑鬂隨波散紅顔逐浪無令滋不悅太白恐弃去隱居戴天大匡山往來旁郡依潼江趙徴君蕤亦節士任俠有氣善爲縱横學著書号長短經太白從學歳餘去遊成都賦春感詩云事难諧榆莢錢生茫茫􅀯與北道直人􅁫却憶青山上雲門掩竹齋樹楊花玉惨街塵縈逰子靣蝶弄美益州剌史蘇頲見而竒之時太白齒方少英氣溢發諸爲詩文甚多㣲􅀋宫中行樂詞體今邑人所藏百篇大抵皆格律也雖頗體弱然短羽䙰褷已有雛鳳態淳化中縣令楊遂爲之引謂爲少作是也遂江南人自名能詩累謫爲令云始太白與杜甫相遇梁宋間結交歡甚乆乃去客居魯徂徠山甫從嚴武成都太白益流落不能歸故甫詩又云頭白好歸來匡山讀書處然學者多疑太白爲山東人又以匡山爲匡廬皆非也今大匡山猶有讀書臺而清㢘郷故居遺地尚在廢爲寺名隴西院有唐梓州剌史碑名失其及綿州剌史高柷記太白有子曰伯禽女平陽皆生太白去蜀後有妺月圓前嫁邑子留不去以故塟邑下墓今在隴西院旁百歩外或傳院乃其所捨云白詩云昔作芙蓉花今爲斷腸草以色事他人能得㡬時好陶洪景仙方云斷腸草不可食其名美好名芙蓉乃知詩人無一字閑語唐詩紀事卷第十八
