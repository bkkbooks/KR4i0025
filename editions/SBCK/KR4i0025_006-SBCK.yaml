front:
  text: 唐詩紀事卷第六
  hash: sha256:2d13f5cf078a42202e35acefa11e4c32ce50a143311d12ddfcc125ae84cd4c85
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_006-1a}
body:
  text: 上官儀郭正一喬知之喬侃員半千任希古蘇味道杜審言郭利正吳少微富嘉謨李福業王適李崇嗣上官儀字㳺韶陜州人工詩其詞綺錯婉媚及貴人効之曰上官體詠雪詩云禁園凝朔氣瑞雪掩晨曦花明棲鳳閣珠散影娥池飄素迎歌上翻花向舞移幸因千里映還繞萬年枝又奉和山夜臨秋詩云殿帳清炎氣輦道合秋陰凄風移漢筑流水入虞琴雲飛送斷鴈月上净踈秋滴瀝露枝響空濛烟壑深又和頴川公秋夜詩云泬寥空色逺芸黄凄序變洞浦落遵鴻長飈送巢鷰千秋流夕景萬􅄜含霄轉峻雉聆金祗曾䑓切銀箭金祗未詳王昭君云玉關春色晩金河路幾千琴悲桂條上笛怨柳花前霧掩臨粧月風驚入鬢蟬裁書待廻使淚盡白日天日字未詳髙宗承貞觀之後天下無事儀獨持國政嘗凌晨入朝巡洛水堤步月徐轡詠詩曰脉脉廣川流驅馬入長洲鵲飛山月曙蟬噪野風秋音韻清亮羣公望之猶神仙焉詩話右古今髙宗即位儀為相麟徳元年坐梁王忠事下獄死武后惡之也儀應詔詩中用影娥池學士時無解其事祭酒令狐徳棻召張柬之等十餘人示此詩東之對云洞冥記漢武帝於望鸖臺西起俯月臺臺下穿影娥池每登臺眺月影入池中使宮人乘舟笑弄月影因名影娥池亦曰眺蟾臺令狐徳棻嘆其博識郭正一定州人永隆中平章事武后專國出刺陜州與張楚金元萬頃皆為周興誣殺之和太子納妃公主出降詩云桂宮初服冕蘭掖早升笄禮盛親迎晉聲芳出降齊金􅀛開瑞鈿寳翟上仙袿轉扇承霄月揚旌照夕蜺喬知之知之馮翊人武后時為補闕有緑珠篇云石家金谷重新聲明珠十斛買婷娉昔日可憐君自許此時歌舞得人情君家閨閤不曽関好將歌舞借人看富貴英雄非分理驕奢勢力横相干别君此去終不忍徒勞掩淚傷紅粉百年離別在髙樓一旦紅顔為君盡蓋知之有寵婢曰碧玉知之為之不婚為武承嗣所奪知之以此歌寄之而末句云百年離別在髙樓一旦紅顔為君盡寵者結於衣帶投井而死承嗣見詩大恨知之坐此陷亡沈佺期贈知之古意云盧家少婦鬱金堂海燕雙栖玳瑁梁九月寒砧催下葉十年征戍憶遼陽白狼河北音書斷丹鳳城南秋夜長誰知含愁獨不見使妾明月照流黄通鑑考異云唐曆及本紀殺知之在天授元年據陳子昻別傳云武攸宜討契丹子昻知之為參謀尚在萬嵗通天元年子昻有西還至散闗荅知之詩云昔君事胡馬余得奉戎旃携手同沙塞闗河緬幽燕歎此南歸日猶聞北戍邊是時未罷也疑知之死在神功年後或天授初承嗣銜之至是乃殺之耳喬􅋲人日登髙云僕本多悲者年來不悟春登髙一逰目始覺栁條新杜陵猶識漢桃源不辨秦蹔若昇雲霧還似出囂塵頼得煙霞氣淹􅅏攀桂人沈佺期送喬隨州􅋲云結交三十載同逰一萬里情為契闊生心由離別死拜恩前後人從官差池起今尔歸漢東明珠報知已􅋲武后時學士預脩三教珠英知之之弟也開元初為兖州都督長安中卒於襄陽以文詞知名員半千隴右途中遭非語云趙有兩毛遂魯聞二曽參慈母猶且惑况在行路心冠冕無醜士賄賂成知已名利我所無清濁誰見理弊服空廷春緩帶不着身出逰非懷壁何憂乎忌人正湏自保愛振衣出世塵半千字榮期齊州人嘗事王義方義方曰五百歳一賢者生子冝當之因改今名餘慶始名舉八科皆中累爲洪文館學士睿宗立召爲太子右諭徳表丐骸骨事五君有清白節后時同爲洪文館學士與王劇路敬淳石抱中武任希古字敬臣棣州人五歳䘮母七歳問父何以報母父曰揚名顯親可也乃刻志從學年十六刺史崔樞欲舉秀才自以學未廣遯去後舉孝廉虞世南噐其人爲洪文學士終太子舎人奉和太子納妃公主出降詩云帝子陞青陛王姬降紫宸星灮移雜珮月彩薦重輪龍旌翻地杪鳳管颺天濵槐陰浮淺瀬葆吹翼輕塵和長孫秘監伏日苦熱云玉署三時曉金覊五日歸北林開晚徑東閣敞閑扉池鏡分天色雲峰減日輝游鱗映荷聚驚翰遶林飛披襟楊子宅舒嘯仰重闈和東觀羣賢七夕臨泛昆明云秋風始揺落秋水正澄鮮飛眺牽牛渚激賞鏤鯨川㟁珠淪曉魄池灰歛􅍼煙泛查分冩漢儀星別架天雲灮波處動月影浪中懸驚鴻絓蒲弋游鯉入莊筌萍葉凝江上菱花似鏡前長林代輕幄細草即芳筵文􅂠開翠㶑筆海控清漣不挹蘭罇聖空仰桂舟仙薛元超永徽初為中書舎人薦希古郭正一王義方孟和貞崔融十餘人時論美之蘇味道趙州人與里人李嶠號蘇李武后時為相世號模稜手上元云火樹銀花合星橋鐵鎻開暗塵隨馬去明月逐人來逰妓皆濃李行歌盡落梅金吾不惜夜玉漏莫相催詠霧詩曰氤氲超洞壑遥裔匝平疇乍似含龍劒還疑映蜃樓拂林隨􅀨密度逕帶煙浮方謝公超步終從彦輔遊又詠虹詩曰紆餘帶星渚窈窕架天潯空因壯士見還共美人沉逸照含良玉神灮藻瑞金獨留長劒彩終負昔賢心贈封御史入臺詩云故事惟三獨兹辰對兩闈夕林鳴舞屈春草接芳菲盛府題清槖殊章動繡衣風連臺閣起霜就簡書飛凛凛當朝色行行滿路威唯當擊隼去復覩落鵰歸未詳舞屈字又始背洛城秋郊矚目奉懷臺中諸侍御詩云薄遊忝霜署直指戒氷心荔浦方南紀蘅臯暫北臨山晴闗塞斷川暮廣城隂場圃通圭甸溝塍礙石林野童永捃拾田叟去謳吟蟋蟀秋風起蒹葭晩露深帝城猶鬱鬱征傳幾駸駸廻憶披書地勞歌謝所欽杜審言和李大夫嗣真奉使存撫河東云六位乾坤動三微歴數遷謳歌移火徳圖䜟在金天子月開階統房星受命年禎符龍馬出寳籙鳳凰傳地即交風雨都仍卜澗瀍明堂惟御極清廟乃尊先不宰神功運無私大象懸八荒平物土四海接人煙已属羣生泰猶言至道偏璽書傍問俗旌節近推賢秩比司空位官臨御史員推詞執刀筆直諌下樓船國有大臣噐朝加小㑹筵將行備禮樂送別仰神仙城闕周京轉闗河陜服連稍觀汾水曲俄指絳臺前姑射聊長望平陽遂宛然舜耕餘草木禹鑿舊山川昔出諸侯争無何覇業全中軍掃戰敵外府絶兵權隠隠帝鄉逺瞻瞻肅命䖍西河偃風俗東壁挂星躔井邑枌榆社陵園松栢田榮灮朝掩代佳氣曉侵燕雨霈鴻私滌風行睿㫖宣惸􅄔訪疾苦屠釣採貞堅人樂逢刑措時康洽賞延賜踰秦氏給恩倍漢家錢擁傳咸翹首稱觴競比肩拜迎彌道路舞詠溢郊􅆵殺氣西衡白窮隂北土􅀇飛霜遥度海殘月逈臨邊緬邈朝廷問周流朔塞旋興來探鳥䇿俊發抱龍泉學揔三千卷文傾三百篇澄清得使者作頌有人焉未以崇班閡而云勝託捐偉材何磊落陋質幾翩翾江海寧為讓巴渝輙自牽一聞歌聖道助曲荷陶甄托􅂢未詳諸侯争勝和韋承慶過義陽公山㽵池五首野興城中發朝英物外求情懸朱紱望契動赤城逰海鷰巢書閣山鷄舞畫樓􅀨餘清晚夏共坐北巗幽逕轉危峰逼橋斜缺㟁妨玉泉移酒味石髓換花香綰霧青條弱牽風紫蔓長猶言行樂少别向後池塘携琴遶碧沙搖筆弄青霞杜若幽庭草芙蓉曲沼花宴遊成􅀧客形勝得仙家往往􅅏仙步登攀日易斜攅石當軒倚懸泉度牖飛鹿麛衝妓席鶴子曵童衣園菓嘗難遍池蓮摘未稀巻簾先待月應在醉中歸賞翫竒他日髙深愛此時池為八水背峰作九山疑池静魚偏逸人閑鳥欲欺青溪留別興别與白雲期贈崔融詩云十年俱薄宦萬里各他方雲天斷書札風土異炎凉太息幽蘭紫勞歌竒樹黄日疑懷叔度夜似憶真長北使從江表東歸在洛陽相逢慰疇昔相對叙存亡草深窮巷毁竹盡故園荒雅節君彌固衰顔余自傷人事盈虛故交游寵辱妨雀羅争去翟鸖氅更尋王思極歡娱至明情詎可忘速騎追佳賞城中及路傍琴樽横宴席巗冶卧詞場三川宿􅀨霽四月晩花芳復此開懸榻寧唯入後堂興酣鴝鵒舞言念鳳凰翔高選俄遷職嚴程巳飭裝撫躬衘道義携手戀輝灮玉振先推美金銘舊所防勿嗟離别易行役共時康贈蘇味道詩云北地寒應苦南庭戍不歸邊聲亂羗笛朔氣巻戎衣雨雪闗山暗風霜草木稀胡兵戰欲盡漢卒尚重圍雪浄妖星落秋深塞馬肥據鞍雄劒動挣筆羽書飛輿駕還京邑朋遊滿帝畿方期來獻凱歌舞共春輝蓬萊三殿侍宴奉勑詠終南山應制詩云北斗掛城邊南山倚殿前雲標金闕逈樹杪玉堂懸半􅊐通佳氣中峰繞瑞煙小臣持獻壽長此戴高天子美贈閭丘師詩云吾祖詩冠古同年䝉主恩謂審言以詩閭丘均以字同侍武后也審言字必簡襄州人初貶吉州司户與同僚不叶司馬周季重司户郭若訥誣以罪繫獄審言子并年十三因季重酢讌懷刃刺之季重臨死曰吾不如審言有孝子若訥誤我亦焉避害審言因此免官還東郭則天召將用之問曰卿喜否審言舞蹈謝恩因作懽喜笑授著作郎神龍初坐交通張易之流峰州入爲修文館學士卒將死謂宋之問武平一曰吾在久壓公等今且死固大慰但恨不見替人云與李喬崔融蘇味道爲文章四友審言卒李嶠巳下請加命時武平一爲表云審言譽鬱中朝文髙前列是以升榮粉署擢秀蘭臺徃以微瑕久從逺謫陛下膺圖玉扆下制金門收賈􅁩於長沙返蔡邕於左校審言獲登文館預奉属車未獻長卿之辭􅃍啟元瑜之悼臣等積薪増愧焚芝盈感伏乞恩加朱紱寵及幽泉假飾終之儀舉哀榮之典庶弊帷莫棄墜履無遺乃贈著作郎制曰漢覃恩祐方慶於同時漳浦㽸痾忽歸於厚夜蒿里修文之地永閟音徽蓬山著作之曹宜加寵數字俱未詳開階統漢單郭利正上元云九陌連燈影千門慶月華傾城出寳騎匝路轉香車爛熳唯愁曉周遊不問家更逢清管發處處落梅花吳少微少微和崔日用游開元寺詩云左憲多材雄故人尤鷙鶚護贈單于使休軺太原郭館次厭煩歊清懷尋寂寞西縁十里餘北上開花閣初入雲樹間冥䝉未昭廓漸出欄榥外萬里秋景焯嵗晏風落山天寒水歸壑覽物頌幽景三乗動􅀇鑰但敷利解言永用忘昬著少微新安人與富嘉謨齊名友善進士擢第累授晉陽尉與富嘉謨並拜監察御史時卧疾聞嘉謨亡號哭賦詩曰維三月癸丑河南富嘉謨卒予時寢疾於洛陽北里聞之投枕而起淚霑乎袵席匍匐於寢門之外病不能哭仰天而呼曰天乎天乎俾予曷所朋曷可得而見乎賦詩曰吾友適不死於戱社稷臣直禄非造利長懷大庇人乃通承明籍遇比敦牂春藥厲其可畏皇穹故匪仁疇昔與夫子孰云異天倫同病一相失茫茫不重陳子之文章在其殆尼父新皷興斡河岳貞詞毒􅀑神可悲不可朽車輤沒荒榛聖主賢為寳吁兹大國貧詞人莫不歎美既而病亟歎曰生死人之大分何恨焉然官職十分未作其一乃至是耶慷慨而終少微為并州長史張仁亶進九鼎銘表其畧曰鼎者夏后氏作羣牧貢金逺方圖物備諸山澤以禦魑魅厥後嗣徳昬亂鼎遷于啇夏之寳也杞不足徵殷既有之又患失之周徳休明神寳不墜百代可繼伏惟陛下灮大而當之若乃崇貴之噐金玉之鼎鎔首山發睢上列太廟序明堂克明靈命以奉上帝非愚臣所敢議也富嘉謨明氷篇云北陸蒼茫河海凝南山䦨干晝夜氷素彩峨峨明月升深山窮谷不自見安知採斵備嘉薦隂房固沍掩寒扇陽春二月朝始暾春灮潭沲度千門明氷時出御至尊彤庭赫赫九儀備腰玉煌煌千官事明氷畢嵗周在位憶昔沙朔寒風漲崐崘長河氷始壯漫汗崚嶒積亭障嗈嗈鳴鴈江上來禁苑池臺氷復開揺青涵緑映樓臺豳歌七月王風始鑿氷藏用昭物軌四時不忒千萬祀嘉謨武功人長安中為晉陽尉吳少微者亦尉晉陽有魏倚谷者為太原主簿時稱北京三傑時天下文章尚徐􅁃浮俚不競嘉謨少微本經術雅厚雄邁人争慕之號吳富體嘉謨終於右臺監察御史張説論其文曰如孤峰絶㟁壁立萬仞濃雲鬱興震雷俱發誠可畏也若施於廊廟駭矣李福業嶺外守嵗詩云冬去更籌盡春隨斗柄迴寒暄一夜隔客鬢兩年催福業調露二年登第後為御史五王誅二張亦與謀及誅王適幽州人終雍州司功參軍詠江濵梅云忽見寒梅樹開花漢水濵不知春色早疑是弄珠人陳子昻別傳云幽人王適見感遇詩曰是必為海内文宗矣蜀中言懷云獨坐年將暮常懷志不通有時湏問影無事則書空弃置如天外平生似夣中蓬心猶是客華髮欲成翁跡滯魂逾窘情􅆾路轉窮別離同夜月愁畏隔秋風老少悲顔叟􅄹虛悟翟公時來不可問何用求童䝉李崇嗣寒食絶句云普天皆滅焰匝地盡藏煙不知何處火來向客心燃覽鏡云嵗去紅顔盡愁來白髪新今朝開鏡匣疑是逢故人獨愁云聞道成都酒無錢亦可求不知將幾許銷得北來愁陳子昻題李三書齋云灼灼青春仲悠悠白日昇聲容何足恃榮吝坐相矜願與金庭㑹將待玉書徴還丹應有術煙駕共君乗又別李參軍詩云􅁌望如朝夕寧嗟蜀道行又酬李參軍旅館見贈云昨夜銀河半星文犯遙漢今朝紫氣新物色果逢真君從天上落乃是地僊人白璧疑寃楚烏裘似入秦摧藏多古意歴覽備艱辛樂廣雲雖覩夷吾風未春鳳歌空有問龍性詎能馴寳劒終應出驪珠㑹見珍未及馮公老何驚孺子貧青雲儻可致北海憶孫賔皆與福業酬唱也沈佺期黄口讃序云聖暦中有勑東觀修書黄口飛落鈆槧間奉宸主簿李崇嗣命采花哺之河東薛曜邀余為讃唐詩紀事卷第六
