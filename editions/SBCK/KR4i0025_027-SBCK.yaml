  text: 唐詩紀事巻第二十七
  hash: sha256:5ea8ca1de875709cdddc1d78bc018250b8b5bb12d0900346bd17905b048613d9
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_027-1a}
body:
  text: 于逖姚係趙微明李泌禇朝陽蕭昕張朝暢當暢諸獨孤及皇甫冉皇甫曽李㓜卿趙驊賈邕劉舟長孫鑄房白元晟劉太冲姚發鄭殷少野鄔載于逖獨孤及李白皆有詩贈之蓋天寶間詩人也憶舎弟云衰門鮮兄弟兄弟惟两人飢寒各流浪傷感念我身夏期秋未來安知無他因不怨别天長但願見爾身茫茫天地間萬􅀋各有親安知汝與我乖異同胡秦何時對形影憤懣當共陳野外作云老病無樂事歳愁悲更長窮郊日蕭索生意巳蒼黄小弟髪亦白两男俱不強有才且未逹況我非賢良幸有杇鈍姿野外老風霜寒鴉噪晚景喬朩思故郷魏人宅蓬池結網佇鱣魴水清魚不來歳暮空彷徨姚係係送周愿判官歸嶺南云早蟬望秋鳴夜吟怨離聲􅆌然多異感值子江山行由來重義人感激事縱橫往復念遐阻淹􅅏慕平生晨奔九衢餞暮始萬里程山驛風月樹海門煙霞城易綃泉源近拾翠沙溆明蘭蕙一爲贈貧交空復情京西遇舊識兼送徃隴西詩云蟬鳴一何急日暮秋風樹即此不勝愁隴隂人更去相逢與相失共是亡羊路韋􅂫州送係還河中詩云上國旅遊罷故園生事㣲風塵滿路起行人何處歸􅅏意芳樹飲惜别暮春暉㡬日投􅀜郡河山對掩扉送陸渾主簿趙宗儒之任云山中􅆌然意此意乃平生常日望鳥嘷遥對洛陽城故人吏爲隱懷此若蓬􅌡夕氣冐巗上晨流㵼㟁明存亡區中事影響羽人情溪寂値猿下雲歸聞鶴聲及兹春始暮花葛正明榮㑹有携手日悠悠去無程楊叅軍庄送宇文邈云秋雲冐原隰野鳥滿林聲愛此田舎事稽君車馬程離堂慘不喧脉脉復盈盈蘭葉一經霜香綃爲贈輕燈􅊍耿方寂蟲思隠餘清相望忽無際如含江海情五老峰大明觀贈隱者云雲觀此山北與君携手稀林端渉橫水洞口入斜暉頗覺鸞鶴邇忽爲煙霧飛故人清和客黙㑹琴心㣲丹術幸可授青龍當未歸悠悠平生意此日復相違趙㣲明思歸云爲别未㡬日去日如三秋猶疑望可見日日上高樓唯是分手處白蘋滿芳洲寸心寧死别不忍生離憂回軍跛者詩云旣老又不全始得離邊城一枝假枯朩歩歩向南行去時日一百來時一月程常恐道路傍掩弃狐兎塋所願死郷里到日不願生聞此哀怨詞念念不忍聽惜無異人術倐忽具尔形李泌奉和聖製重陽賜㑹聊示所懷云大唐造昌運品物荷時成乗秋逢令節錫宴歡群情俯臨秦山川高會漢公卿韻欠一未追赤松子且泛黃菊英賡歌聖人作海内同休明奉和聖製中和節曲江宴百寮云風俗時有變中和節惟新軒車􅀟闕下宴㑹曲江濵金石何鏗鏘簮纓亦紛綸皇恩降自天品物感知春慈恩匝寰􅌡歌詠同君臣韻欠一泌字長源相德宗以上巳九日皆大宴集而寒食上巳多同時欲以二月名節泌請廢正月晦以二月朔爲中和節因賜大臣戚里尺謂之裁度里閭釀冝春酒百官進農書以示務本帝乃著令與上巳九日爲三令節中外皆賜緡錢燕㑹鄴侯家傳云泌賦詩譏楊國忠曰青青東門柳歳宴復憔悴國忠訴于明皇上曰賦柳爲譏卿則賦李爲譏朕可乎禇朝陽五􅁝詩云越人傳楚俗截竹競縈􅁝水底􅀷休也日中還賀之章施文勝質列匹美於􅁎錦綉侔新叚羔羊􅃦舊詩但誇端午節誰薦屈原詞把酒時伸奠汨􅚒空逺而朝陽登天寶進士第蕭昕臨風舒錦云麗錦疋云終䄡䄡展向風花開翻覆翠色亂動揺紅縷散悠颺裏文廻照灼中低垂疑歩障吹起作晴虹旣與丘遲夢􅀷知卓氏功還郷將制服從此表亨通昕字中明再中博學宏詞科􅀄爲哥舒翰掌書記翰敗儳道走蜀肅宗立奉誥冊至行在代宗狩陜昕由武􅀜從帝德宗出奉天昕時爲工部尚書年八十餘歩至奉天後兼禮部尚書知貢舉以太子少師致仕張朝小長干行云憶昔􅀷閨裏煙塵不曽識嫁與長干人沙頭候風色三月􅀯風興思君下江陵八月秋風起㸔君發揚子去時悲如何見少别離多湘潭㡬人到妾夢常風波又云昨夜狂風度吹折江頭樹淼淼暗無邊行人在何處好乗浮雲徃佳期蘭渚東鴛鴦緑浦上翡翠錦屏中自憐十五餘顔色桃花紅那作商人婦愁水復愁風有之未知誰是二詩太白集中江行風云壻貧如珠玉壻富如埃塵貧時不忘舊冨罷多寵新妾本富家女與君爲偶匹念汝一何􅀷中門不曽出妾有綉衣裳葳蕤金縷光念君貧且賤易此從逺方逺方三千里發竟悔不已日暮情更來空望去時水孟夏麥始秀江上多南風商賈歸欲盡君今尚巴東巴東有巫山窈窕神女顔常恐遊此方果然不知還朝丹朝人大暦時處士暢當南充謝郡客遊澧州留贈宇文中丞云僕夲􅇴落人辱當州郡使量力頗及早謝歸今即巳蕭蕭若凌虛衿帶領銷靡車服率然來涔陽作遊子鬱鬱寡開顔黙黙獨行李忽逢平生犮一笑方在此秋情寧風日楚思浩雲水爲語弋林者􅁳􅁳鴻逺矣韋蘇州􅀉當詩云㓂賊起東山英俊方未閑聞君新應募籍籍動京􅀜出身文翰場高歩不可攀青􅂁未及解白羽揷腰間昔爲瓊樹枝今有風霜顔秋郊細柳道走馬一夕還丈夫當爲國破敵如摧山何必事州府坐使􅁂毛班􅀍召從軍問以子弟李端贈當詩并序云余少尚神仙且未能去友人暢當以禪門見導余心知其是而未得其門因􅀉詩以咨焉少喜神仙術年來乆蹉跎壯志爲一累浮生事漸多衰顔不相識歳暮定相過請問宗居士君其奈老何當河東人正元􅀄爲太常博士後以果州剌史卒與弟諸皆有詩名宿潭上云夜潭有仙舸與月當水中嘉賔愛明月遊子驚秋風又云青蒲野陂水白露明月天夜中秋風起心事坐澘然别盧倫云故交君獨在又欲與君離我有新秋淚非􅀜秋氣悲平阿舘赴郡云晨興平阿館見月沉江水溶溶山霧披肅肅沙鷺起奉恩謬符竹伏軾省頏鄙何得施放山愧迎小郡吏寥落耕俗地征途清冥裏德綏乃吾民不得將庻矣禽姧非性能多􅉖㑹衰齒恭承共理詔常懼墜諸地居山居酬韋蘓州見􅀉云孤茅泄煙處此中山叟居親雲寜有事耽酒詎知余水定鸖翻去松欹峰儼如猶煩使君問更欲結環廬登􅔏鵲樓云逈臨飛鳥上高出世塵間天勢圍平野河流入斷山偶宴西蜀摩訶池云珎木鬱清池風荷左右披淺觴寜及醉慢舸不知移䕃竹簟光冷照流簮影歌胡爲獨覊者雪涕向漣漪當詩平淡多佳句如釣渚亭云花發多逺意鳬鴈有閑情遲暉耿不暮平江寂無聲天柱隱所云荒徑饒松子􅀷蘿絶鳥聲陽崕全帶日寛障偶通耕山居云水定鸖翻去松欹峰儼如又寒林苞晚橘風絮露垂楊湖伴聞漁唱天邊數鴈行皆有逺意暢諸早春詩云獻歳春猶淺園林未盡開雪和新􅀨落風帶舊寒來聽鳥聞歸鴈㸔花識早梅生涯知㡬日更􅀍一年催獨孤及字至之洛陽人時號獨孤常州夏中酬于逖畢燿問病見贈云救物智所昧學仙願未從行藏兩乖角蹭蹬風波中薄䆠耻降志卧痾非養蒙閉關渉兩旬覊思浩無窮鸑鷟何處來􅀟舞下碧空離别隔雲􅀨惠然此相逢把手賀疾間舉杯欣酒濃新詩見乆要清論激深􅂨高館舒夜簟開門延㣲風火雲赫嵯峨日暮千萬峰遥指故山笑相看撫號鐘聲和由心清事感出氣同出處未易料且歌緩愁容願君崇明德歳暮如青松賈貟外處見中書賈舎人巴陵詩集覽之懷舊代書􅀉贈云海㟁望青􅃈雲長天漫漫十年不一展知有􅀜山難適逢阮始平立馬問平安取公詠懷詩示我江海瀾蹔若歸武庫森然矛㦸寒眼明遺頭風心悦忘朝餐大駕今返正熊羆扈鳴鑾公遊鳳凰沼獻可在筆端繫越有長纓封􅀜祗一丸冏然翔寥廓仰望在羽翰嘉㑹不我與相思歳云殫惟當䄂佳句持比青琅玕題思禪寺上方詩云谿口聞法皷停撓登翠屏攀雲到金界合掌問禪扄鬱律衆山抱空濛花􅀨零老僧指香樓云是不死亭􅆌􅆌干越路茫茫春草青逺山噴百谷繚繞馳東溟目極想何在境照心亦冥騞然諸根空破結如破瓶下視三界狹但聞五嶽腥山中有艮藥吾欲隳天形觀海詩云北登渤海島廻首秦東門誰尸造物功鑿此天地源澒洞吞百谷周流無四垠廊然混茫際望見天地根白日自中吐扶桒如可捫迢迢蓬萊峰想像金臺存秦帝曽經此登臨異飛翻揚旌百神㑹望日群仙奔徐福竟何成羡門徒空言唯見石橋足千里潮水㾗及與薛華于逖畢燿友善安定梁肅叙其文曰天寶中作者數人頗節之以禮泊公爲之於是操道德爲根本揔經籍爲冠帶以易之精義詩之雅興春秋之褒貶屬之爲辭故其文寛而簡直而婉辯而不華博厚而高明論人無虚美比事爲實録天下􅏮然復覩兩漢之遺風善乎崔公祐甫之言曰常州之文以立憲誡世褒賢遏惡爲用故議論最長其或列于碑頌流於詠歌峻如嵩華盛於江河􅀂賛堯舜禹湯之命爲典爲誥爲謨爲訓人皆許之而不吾試論道之位冝而不陟惜哉皇甫冉字茂政􅀇晏先生之後張曲江􅀷愛之謂清潁秀拔有江徐之風大暦二年迁右􅀘闕冉題巫山云巫峽見巴東迢迢出半空雲藏神女館􅀨到楚王宫朝暮泉聲落寒暄樹色同清猿不可聽偏在九秋中冉少室昇仙歌云紅霞紫氣甚氤氲絳節青童迎少君忽從􅐕下昇天去空使詩人禮白雲高仲武云皇甫冉􅀘闕自擢桂禮闈遂爲高格徃以世道艱虞避地江外每文章一到朝廷作者變色於詞塲爲先軰推錢郎爲伯仲誰家勝􅀒或逐鹿中原如菓熟任霜封籬踈從水渡又裛露收新稼迎寒葺舊廬又鷰知社日辭巢去菊爲重陽冐􅀨開可以雄視潘張平揖沈謝又巫山詩終篇皆麗自晉宋齊梁陳周隋巳來採掇者無數而􅀘闕獲驪珠使前賢失歩後軰却立自非天假何以迨斯恨長轡未騁而芳蘭早凋悲夫送韓司直云遊吳還適越來徃任風波復送王孫去其如春草何㟁明殘雪在湖滿夕陽多季子留遺廟停舟試一過宿嚴維宅云昔聞􅀇度宅門向㑹稽峰君住東湖下清風繼舊蹤􅀄秋臨水月半夜隔山鐘世路多離别良宵詎可逢途中送權曎驊或作云淮海風濤起江􅀜憂思長同悲鵲遶樹獨作鴈隨陽山晚雲和雪汀寒月滿霜由來濯纓處漁父愛滄浪西陵􅀉一公云西陵遇風處自古是通津終日空江上雲山若待人汀洲寒事早魚鳥與同新􅀯望山隂路吾心有所親爲極元集姚合取四詩獨孤至之叙其文云五言詩之源生於國風廣於離騷著於李蘇盛於曹劉其所自逺矣當漢魏之間雖以朴散爲器作者猶質有餘而文不足以今揆昔則有朱絃踈越大羹遺味之歎歴千餘歳至沈詹事宋考功始財成六律彰施五色使言之而中倫歌之而成聲縁情綺靡之功至是乃備雖去雅浸逺其利有過於古者亦猶路鼗出於上皷篆籕生於鳥跡也沈宋旣没而崔司勲顥王右丞維復崛起於開元天寶之間得其門而入者當代不過數人􅀘闕其人也冉題裴周新園云東郭訪先生西郊尋􅀮路乆爲江南客自有雲陽樹巳得閑園心不知公府歩開門白日逺􅀝杖青山暮菓熟任霜封籬踈從水度窮年無牽綴徃事惜淪悟惟見耦耕人朝朝自來去送元盛還潜山云􅀷山秋事早君去復何如裛露收新稼迎寒葺舊廬題詩即招􅀮作賦是閑居别後應相憶􅄞康懶􅀉書秋日東林之作云閑㸔秋水心無事卧對寒林手自裁廬阜高僧留偈别茅山道士􅀉書來燕知社日辤巢去菊爲重陽冐􅀨開淺薄將何稱獻納臨岐終日自遲廻送韋使君赴昇州云中司龍節貴上客虎符新地控呉襟帶才高漢搢紳泛舟因渡臘入境便行春何處歌來暮長江建業人送李録事赴饒州云北人南去雪紛紛鴈呌汀洲不可聞積水長天隨逺色荒林極浦足寒雲山從建業千峰起江自潯陽九􅉽分借問督郵纔弱冠府中年少不如君皇甫曾􅀉中書王舎人詩云腰金載筆謁承明至道安禪得此生西掖幾年綸綍貴東山遥夜薜蘿清風傳漏刻星河曙月上梧桐􅀨露清聖主好文誰爲薦閉門空賦子虛成送孔徴士云谷口山多處君歸不可尋家貧青史在身老白雲深掃雪開松徑踈泉過竹林餘生􅀒丘壑相送亦何心烏程水樓留别云悠悠千里去惜此一樽同客散高樓上㠶飛細􅀨中山程隨逺水楚思任青楓共説前期易滄波處處通張芳見訪郊居云林中􅀨散早凉生巳有迎秋促織聲三徑荒蕪羞對客十年衰老愧稱兄愁心自惜江籬短世事方㸔木槿榮君若罷官携手日尋山莫筭白雲程雲林邕上人云春山臨一室獨坐草凄凄身寂心成道花開鳥自啼細泉松磬裏反景竹林西晚與門人别依依出虎溪送中丞還京云罷戰廻龍節朝天見鳳池寒生五湖道春及萬年枝邵化多遺愛胡清巳畏知懐㤙偏感别墮淚向旌麾贈霈禪師云南嶽瀟湘沅吾師經利渉身歸沃洲老名與文公接靜教傳荆吳道緣止漁獵觀空色不染對境心自愜室中人寂寞門外山重疊天台積幽夢早歳歸􅀒笈高仲武云昔孟陽之與景陽詩罔慙厥弟恊居六品載處下流今侍御之與􅀘闕文辭亦爾體制清潔華不勝文然寒生五湖道春及萬年枝五言之選其爲士林所尚宜哉曾字孝常爲殿中侍御史天寳中兄弟踵登進士第名相上下時比張氏景陽孟陽云尋陸處士云㡬年人不見林下掩柴關留客當清夜逢君話舊山隔城寒杵急帶月早鴻還南陌雖相近其如隱者閑哭陸處士云從此無期見柴扉對雪開二毛逢世難萬恨掩泉臺􅝭照當空乆孤城吊客回漢家偏訪道猶畏鸖書來送人作使云上將還專席雙旌復出秦􅀜河三􅀳路賔從五原人孤戍雲連海平沙雪度春酬恩㸔玉劒何處有煙塵篇姚合取爲極元集尋陸處士詩以下三曽與劉長卿犮善曽過長卿碧澗别業詩云謝客開山後郊扉出去通江湖十年别衰老一樽同反照寒川滿平田暮雪空滄洲自有趣不復泣途窮長卿和云荒村帶晩照落葉亂紛紛古路無行客寒林獨見君野橋經􅀨斷澗水向田分不爲憐同病何人到白雲曽又􅀉長卿云南憶新安郡千山帶夕陽斷猿知夜乆秋草􅂇江長􅁂髪應成素青松獨見霜愛才稱漢主題柱待田郎長卿和云離别江南北汀洲葉再黃路遥雲共水砧逈月如霜歳儉攸仁政親臨郡姑藏相國年衰憶故郷佇君宣室召漢法􅀝張綱盧綸哭曽云攀龍與泣麟哀樂不同塵九陌霄漢侣一燈冥寞人舟沉驚海濶蘭折怨霜頻巳矣復何見故山應更春郎哭曽故云時同李包二李㓜卿近日霜毛一畨新别時芳草兩廻春不堪花落花開處况是江南江北人薄䆠龍鐘心􅂴慢故山寥落水奫淪縁君愛我疵瑕少願􅀼仁風􅀉老身㓜卿字長夫隴西人大暦中以右庻子領滁州别業在常州義興曰玉潭㽵在滁州時以書託獨孤至之獨孤以詩􅀉云日日思瓊樹書書話玉潭知同百口累曷日辦抽篸又至之題玉潭云碧玉徒強名氷壷難比德唯當寂照心可並奫淪色㓜卿所謂故山寥落水奫淪者也蕭頴士樂聞人善以推引後進爲巳任如李陽冰李㓜卿皇甫冉陸渭軰由奬目皆爲名士滁州迨今有庻子泉以㓜卿得名也趙驊送晁補闕歸日本國云西掖承休澣東隅返故林來稱剡子學歸是越人吟馬上秋郊逺舟中曙海隂知君懷魏闕萬里獨揺心驊字雲卿擢開元進士第嘗䧟陸山貶􅀳江尉建中􅀄爲秘書少監與顔眞卿蕭頴士等善其子宗儒賈邕蕭夫子赴東府門人送者十二人劉太眞爲之序云先師微言旣絶者千有餘載至夫子而後洵美無度得夫天和頃東倭之人踰海來賔舉其國􅁉願師於夫子非敢􅀻請表聞于天夫子辭以疾而不之從也退然貧居述作萬巻去其浮辭存乎正言昔左氏失於煩􅂖梁失於短公羊失於俗而夬子爲其折􅂨王公交辟拒而不應從官三年始參謀於洛京家兄與先鳴者六七人奉壷開筵執弟子之禮於路左太眞以文求進以無聞見舉而不恡爲大子羞春雲輕隂草色新碧皎皎疋馬出于青門吾徒喟然瞻望不及賦詩仰餞者自相里造賈邕巳下凢十二人皆及門之選也邕得路字云子欲適東周門人盈岐路高標信難仰薄䆠非始務綿邈千里途徘徊四郊暮征車日云逺撫巳慙􅀷顧邕天寳九年李暐侍郎下登第劉舟冉一作得適字云大名掩諸古獨斷無不適德遂天下宗官爲幕中客驪山浮雲散覇㟁零􅀨夕請業非逺期圓先再生魄天寶十六年陽浚舎人下登第長孫鑄得離字云大德詎可擬高梧有長離素懷經綸具昭世猶安卑落日去􅀜外悠悠隔山陂我心如浮雲千里相追隨天寶十二年陽浚舎人下登第房白得還字云夫子高世跡時人不可攀今子亦云幸謬得承温顔良䇿資入幕遂行從近􅀜青春㶚亭上此去何時還天寶十三年陽浚侍郎下登第元晟得引字云吾見夫子德誰云習相近數仞不可窺言味終難盡處喧慮常澹作吏心亦隱更有嵩少峰東􅀯爲勝引晟河南府進士劉太冲得淺字云吾師繼㣲言賛黜在墳典寸禄聊自􅓵平生官情鮮逶遲東周路春草深復淺日逺夫子門中心曷由展天寶十二年陽浚舎人下登第姚發得草字云天生良史筆浪跡擅文藻中夏授參謀東夷願聞道行軒翫春日餞席藉芳草幸得師季良欣留篋笥寶天寶十二年陽浚舎人下登第鄭愕得徃字云斤溪數􅅿田素心擬長徃翳君曲得引使我纓俗網風塵豈不勞道義成心賞春郊桃李月忍此戒征兩天寶十二年陽浚舎人下登第殷少野得散字云官閑幕府下聊以任縱誕文學魯仲尼高標􅄞中散出門時􅀨􅃳對酒春風暖感激知巳恩别離魂欲斷天寳十六年陽浚舎人下登第鄔載不預此㑹得君字云䇿名十二載獨立先斯文尔來及門者半巳昇青雲青雲豈無姿黃鶴素不群一辝芸香吏㡬歳滄江濆散職旣不羈天聦亦昭聞雖承急賢詔未謁陶唐君薄俸還自急此言那足云和風媚東郊具物滋南薫蕙草正可摘䂊章猶未分宗師忽千里使我心氛氳天寳十三年陽浚侍郎下登第潁士留别二三子得韻字云二紀尚雌伏徒然忝先進英英尔衆賢名實鬰􅀟振殘春惜將别清洛行不近相與愛後時無令狐逸韻鄔載有文名與錢起友善起同載旅寓􅀜中起有詩云文士皆求遇今人誰至公靈臺一􅀉􅀫楊柳再春風更惜忘形友頻年失志同羽毛齊燕雀心事阻鴛鴻留滯慙歸養飛鳴恨觸籠橘懷郷夢裏書去客愁中殘雪送歸鴈韶光葉斷蓬呑悲問唐舉何路出屯􅀩又送鄔三落第還郷云郢客文章絶世稀常嗟時命與心違十年失路誰知巳千里思親獨逺歸雲㠶春水將何適日愛東南暮山碧􅀜中新月對離樽江上殘花待歸客名官無媒自古遲窮途此别不堪悲荷衣垂釣且安命金馬招賢㑹有時劉長卿過鄔三湖上書齋云何事東林客忘機一釣竿酒香開甕老湖色對門寒向郭青山送臨池白鳥看見君能浪跡予亦厭㣲官唐詩紀事卷第二十七
