  text: 唐詩紀事卷第五十六
  hash: sha256:4ab871461221bc501527d3e362a35ef642acc0038008219689c0afe80377c889
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_056-1a}
body:
  text: 鄭畋李彚征劉成崔郊譚銖郭䕫來鵬李鵠鄭洪業杜牧許渾童翰卿雍陶周元範李逺朱可名趙嘏祝元膺韋承貽鄭史韋楚老鄭畋馬嵬太真縊所題詩者多悽感鄭畋爲鳳翔從事日題云玄宗回馬楊妃死雲􅀨雖亡日月新終是聖朝天子事景陽宫井又何人觀者以為有宰輔之器中秋月直禁苑云禁署万懷忝綸闈巳再加暫來西掖路還整上清槎恍惚歸舟地􅀷嚴􅀫綘霞幽􅁭聊自適閑弄紫􅅔花懿宗朝韋保衡路嵓忌宰相劉瞻誣以罪黜為荆􅀯節度畋為制詞云早以文學疊中殊科風稜甚高恭謹無玷又云安數畝之居仍非巳有却四方之賄唯恐人知韋路大怒貶畋為梧州剌史責劉驩州司戸命舎人李庚為詞􅀷文痛詆必欲加害属懿宗厭代僖宗立蕭倣輔政舉瞻自代召歸朝廷至湖􅀯庚典是郡出迎江次牌亭致酒瞻唱竹枝詞送庚酒云躡􅄚過溝竹枝恨君􅀷女兒瞻命庚酬和庚曰不閑音律瞻曰君應只觧為制詞也是夕庚飲觥而卒畋字台文相僖宗昭宗為人仁恕姿采如峙玉畋為渭南尉日嘗有題緱山王子晋廟詩曰有昔靈王子吹笙遡泬寥六宫攀不住三島玄相招亡國原陵古賔天歳月遥無蹊窺海曲有廟訪山椒石帳龍蛇拱雲龍彩翠銷露壇裝琬琰真像冩松喬珠館青童宴琳宫阿母朝氣輿仙女侍天馬吏兵調湘妓紅􅁝瑟秦郎白管簫西城要婥約􅀯嶽命嬌嬈句曲觴金洞天台嘯石橋晩花珠弄蘂春茹玉生苖二景神光秘三元寳籙饒露垂鴉翅髪氷束虎章腰鸖馭争衘箭龍奴合獻綃衣從星渚浣丹就日宫燒物外花常滿人間葉自凋望臺悲漢戾閱水􅀏梁昭古殿香殘地荒堦桞長條幾曽期七日無復降重霄嵩嶺連天漢伊瀾入海潮何由得真訣使我佩環李彚征彚征客遊閩越至循州冐􅀨求宿或指韋氏莊居韋氏杖􅋰迎賔年八十餘自稱曰野人韋思明毎與李生談論或詩或史淹􅅏累夕彚征善談而不能屈也論數十家之作次第至李渉詩主人酷稱善彚征遂吟曰逺别秦城萬里逰亂山高下出啇州􅀜門不鎻寒溪水一夜潺湲送客愁又曰華表千年一鶴歸丹砂為頂雪為衣泠泠仙語人聽盡却向五雲翻翅飛思明復吟二篇曰因韓為趙兩逰秦十月氷霜渡孟津縱使鷄鳴見􅀜吏不知余也是何人又曰􅅬王閣上唱伊州二十年前向此逰半是半非君莫問西山長在水長流韋叟愀然變色曰老身弱齡不肖逰浪江湖交結姦徒為不平事後遇李涉博士蒙簡此詩因而跧跡李公待愚擬陸士衡之薦戴􅀂思中心藏焉遂隱羅浮經于一紀李旣云亡不復再逰􅁗楚追惋今昔或澘然持觴而酹反􅃑而歌云春􅀨蕭蕭江上村五林豪客夜知聞他時不用相廻避世上如今半是君乾符辛丑歳范攄客于雲川值彚征細述其事云於韋叟之居觀李博士之手翰云彚征後登進士第劉威逰東湖處士園林詩云偶向東湖更向東數聲鷄犬翠微中遥知楊桞是門䖏似隔芙蓉無路通樵客出來山帯􅀨漁舟過去水生風物情多與閑相稱所恨求安計不同七夕云烏鵲橋成上界通千年靈會此霄同雲收喜氣星樓暁香柫輕塵玉殿空翠輦不行青草路金鸞徒􅀱白榆風綵盤花閣無窮意只在浮生一縷中成威會昌時詩人也崔郊郊寓居漢上有婢端麗善音律旣貧鬻婢於連帥給錢四十一萬寵盻彌􅀷郊思慕無巳其婢因寒食來從事家值郊立於桞隂馬上漣泣誓若山河崔生贈之以詩曰公子王孫逐後塵緑珠垂淚滴羅巾侯門一入深如海從此蕭郎是路人或有嫉郊者冩詩於座公覩詩令召崔生左右莫之測也及見郊握手曰侯門一入深如海從此蕭郎是路人便是公作􅁘遂命婢同歸至於幃幌奩匣悉為增飾之譚銖題九華山詩云憶􅗎九華山尚在童稚年浮沉任名路窺仰會無縁罷職池陽時復遭迎送牽因兹契誠願瞩望枕席前况值春正濃氣色無不全或如碧玉靜或似青靄鮮或接白雲堆或映紅霞天呈姿旣不一變態何啻千巍峨本無動崇峻性豈偏外景自隱隱潜虚固幽􅀇我來暗凝情務道志更堅色與山異性性併山亦然境變山不動性存形自遷自遷不阻俗自定不失賢浮華與朱􅂵安可迷心田眞娘者葬呉宮之側行客賦詩多矣銖書一絕題者遂止詩曰武丘山下冡纍纍松栢蕭條盡可悲何事世人偏重色真娘墓上獨題詩咸通末鄭渾爲蘇州都郵銖爲醝院官鍾輻爲院廵皆廣文生時湖州牧李超趙蒙爲代皆狀元時語曰湖接兩頭蘇聮兩尾銖呉人登會昌進士第郭䕫九華山詩云儼翠凌空出􅒯然岧嶤萬丈􅀝秋天暮風飄送當軒色暁霧斜飛入檻煙簾捲􅀝屏雙影聚鏡開朱戸九條懸􅀞圗何必家家有自有􅀞圖來目前䕫大中時江􅀯進士也來鵬清明日與友人遊玉粒塘庄詩曰幾􅀫春山逐陸郎清明時節好煙光歸穿細荇􅂳頭滑醉踏殘花􅄚齒香風急嶺雲翻逈野􅀨餘田水落方塘不堪吟罷東回首滿耳蛙聲正夕陽鄂渚清明日與郷友登頭陀山云冷酒一盃相勸頻異郷相遇轉相親落花風裏數聲笛芳草煙中無限人都大此時深悵望豈堪高境更逡廵思量費子真仙子不作頭陀山下塵寒食山舘書情云獨把一盃山館中毎經時節恨飄蓬侵堦草色連朝􅀨滿地棃花昨夜風蜀魄笑來春寂寞楚囚吟後月朦朧分明􅀉得還家夢徐孺宅前湖水東鄂渚除夜書懷云鸚鵡洲頭夜泊􅂳此時形影共悽然難歸故國干戈後欲告何人􅀨雪天筯撥冷􅁅書悶字枕陪寒席帯愁眠嗟自落拓無成事明日春風又一年鵬詩思清麗福建韋尚書岫愛其才欲以子妻之而不果後遊蜀夏課卷中有詩云一夜緑荷風剪破賺他秋􅀨不成珠識者以為不祥是歳隨秋賦而卒者岫子也丹之來鵠聖政紀頌序曰穆宗皇帝臨朝與群臣言及政事宰臣請史官執筆當群臣奏事隨日撰録号為聖政紀至上之即位三年有鄕校小臣來鵠因窺穆宗實録追而為之頌曰三皇不書五帝不紀有聖有神風銷日巳何教何師生來死止無曲無法頑肩奡比三皇實作五帝實治成天造地不昏不圯言得非排文得聖齒表表如見者莫􅀂乎史是知朴繩休結正簡斯􅀂君誥臣箴􅒀編毫絡前書後經窺善鑒惡國之大章如何􅃦略嗚呼貞觀多吁永徽多俞廷日發論殿日發謨牙孽不作鳥䑕不除論出不蓋謀行不紆楹然史臣蛇然史􅅂瞠瞠即視逶逶而婁翹筆當靣决防納汚不梏爾智不席我愚執言直注史文直敷故得粲粲朝典落落廷譽聖牘旣多堯風不淺頒編坦軸君出臣顯若儼見旒􅀂俯見冕無閑殿曠廷無尸安素晏三皇不忘五帝不剪太宗得之史焉斯展暨乎後相圖身天子專問我獨以言史不得近丘明見嫌􅀝相在㯽秉筆如今隨班不進班退史歸憫然疇依奏問莫覩嘉謀固稀取彼誥命禄為國肥烱然時皇言必成章德宣五帝道奥三皇如何翊臣毚肉􅄝􅎺垣觜距磨快福衡拘長控截僚位占護陽光垣私藩巳逺史廋唐俾德音嘉訪黙縮腤亡咽典噤法蓋聖籠昌􅂚以至此史文不張後必非笑將來否臧謂乎殿空扆逸朝懵廷荒不知姦蔽文失汪洋有貞觀業有永徽綱亦匿匪見亦􅆍匪彰頼有後臣斯言不佞伊尹直心太甲湏聖事旣可書史何不命乃具前欺大陳不敬曰逐史之喻請以物並且十夫樹楊一夫欲競栽旣未牢摒豈能盛帝業似栽逐史似摒穆宗憮然􅀂疾若醟昔何臣斯隱我祖正不傳親問不冩宻諍孰示來朝以光神政由是天呼震吸徴奔召急史提筆來叱廷而入端耳抗目不撝不挹獬豸側頭螭蚪擺溼握管絶怡當殿而立君也盡問臣也倒誠磊磊其事鏜鏜其聲大何不顯細何不明語未絶緒史巳録成謂之何書以政紀名伊紀清芬可昭典墳古師官鳥昔聖官雲方之我后録里書分録有君法書有君文君法君文在聖政紀云殿無閑時廷無曠日雲諏波訪倦編刓筆君劬臣勞上討下述惟勤惟明在聖政紀出至德何比至教焉如孰窺孰測外夷内儲謂君有道乎臣有謨歟有道有謨在聖政紀書一體例秩同力翼戴祈福去邪絶防無礙國章可披唐文可愛善咨不偷嘉論不蓋不偷不蓋在聖政紀載諒夫緫斯不杇可懸魏闕愚得是言非訕非伐實謂鑿臣沌渾開君日月妖物雰死天文光發惟我之有頒兮奚斯躍而董狐蹷鵠豫章人師韓桞爲文大中咸通間聲價籍甚鄭洪業詔放雲􅀯子弟還國詩云德􅀍陪臣子仁垂聖主恩雕題辭鳳闕丹服出金門有澤沾殊俗無征及獷􅏈銅梁分漢􅁟玉壘駕鸞軒瘴嶺蚕叢盛巴江越嶲垠萬方同感化豈獨自􅀯蕃洪業咸通八年鄭愚下第一人擢第杜牧牧爲御史分務洛陽時李司徒愿罷鎭閑居聲妓豪侈洛中名士咸謁之李高會朝客杜持憲不敢邀致杜遣座客逹意願預斯㑹李不得巳邀之杜獨坐􅀯行瞪目注視引滿三巵問李云聞有紫雲者孰是李指之杜凝睇良乆曰名不虛得宜以見惠李俯而笑諸妓亦回首破顔杜又自飲二爵朗吟而起曰華堂今日綺筵開誰喚分司御史來忽發強言驚滿座三行紅粉一時廻氣意閑逸傍若無人牧不拘細行故詩有十年一􅁴楊州夢唯有青樓薄倖名吳武陵以阿房宫賦薦於崔郾遂登弟郾東都放榜西都過堂牧詩曰東都放榜未開花三十三人走馬廻秦地少年多釀酒即將春色入􅀜來牧佐宣城幕逰湖州剌史崔君張水􅃧使州人畢觀令牧間行閲竒麗得垂髫者十餘歳後十四年牧剌湖州其人已嫁生子矣乃悵而為詩曰自是尋春去校遲不湏惆悵怨芳時狂風落盡深紅色緑葉成隂子滿枝杜秋娘詩序曰杜秋金陵女也年十五為李錡之妾後錡叛㓕籍之入宫有寵於景陵穆宗即位秋為皇子傳姆皇子壯封漳王鄭注用事誣丞相欲去異巳者指王為根王􅀍罪廢削秋因賜歸故鄉予過金陵感其窮且老為之賦詩曰京江水清滑生女白如脂其間杜秋者不勞朱粉施老濞即山鑄後庭千娥眉秋持玉斝飲與唱金鏤衣惜少年時花開堪折直湏勸君莫惜金縷衣勸君湏枝李錡長唱此詞折莫待無花空折濞旣白首叛秋亦紅淚滋吳江落日渡㶚㟁緑楊垂聮􅅂見天子盼眄獨依依椒璧懸錦幕鏡奩蟠蛟螭低鬟認新寵窈窕復融怡月上白壁門桂影凉參􅆧金階露新重閑捻紫簫吹開凉州晋書盗􅂵玉簫張駿塜得莓苔夾城路􅀯菀鴈初飛紅粉羽林仗獨賜辟邪旗歸來煑豹胎饜飫不能飴咸池昇日慶銅雀分香悲雷音後車逺事徃落花時鷰禖得皇子壯髪緑緌緌􅀞堂授􅀓姆天人親捧持虎晴珠絡褓金盤犀鎭幃長楊射熊羆武帳弄啞咿漸抛竹馬劇稍出舞鷄竒靳蔪整冠佩侍宴坐瑶池眉宇儼圖􅀞神秀射朝輝一尺桐偶人江充知自欺王幽茅土削秋放故鄕歸􅒀稜拂斗極廻首尚遲遲四朝三十載似夢復疑非潼􅀜識舊吏毛髪巳如􅁝却喚吳江渡舟人那得知歸來四鄰攺荗菀草菲菲清血灑不盡仰天知問誰寒衣一疋素夜借鄰人機我昨金陵過聞之為歔欷自古皆一貫變化安能推夏􅁎㓕兩國逃作巫臣􅁎西子下姑蘇一舸逐䲭夷織室魏豹俘作漢太平基悞置代籍中兩朝尊毋儀光武紹高祖本係生唐兒􅃢瑚破高齊作婢春黃糜蕭后去楊州厥為閼氏女子固不定士林亦難期射鉤後呼父釣翁王者師無國要孟子有人毀仲尼􅁗因逐客令柄歸丞相斯安知魏齊首見斷簣中屍給䘮蹷張軰廊廟冠峨危珥貂七葉貴何妨戎虜支蘇武却生返鄧通終死饑主張旣難測飜復亦相宜地盡有何物天外復何之指何為而捉足何為而馳耳何為而聽目何為而窺巳身不自暁此外何思惟因傾一樽酒題作杜秋詩愁來獨長詠聊可以自怡牧初自宣城幕除官入京有詩留别云同來不得同歸去故國逢春寂寥後二十餘年連典四郡自湖州拜中書舎人題汴河云自憐流落西歸疾不見春風二月時至京果卒或曰舎人未為流落而􅃍及之魄巳喪矣煙着樹姿嬌􅀨餘山態活句四海一家無一事將軍携劒泣霜毛句山宻夕陽多人稀芳草逺句仙掌月明孤影過長門燈暗幾聲來句右張為取為主客圖清時有味是無能閑愛孤雲靜愛僧欲把一麾江海去樂遊原上望昭陵牧赴吳興登樂逰原之作骨清年少眼如冰鳳羽參差五色層天上騏驎時一下人間不獨有餘陵秀才贈李青山隱隱水揺揺秋盡江南草木凋二十四橋明月夜玉人何䖏學吹簫綽判官寄掦州韓楚鄕寒食橘花時野渡臨風駐綵旗草色連雲人去住水紋如縠燕參差江上蟪姑寜與雪霜期賢哲難教俗士知可憐正觀太平後天且不留封德􅃔交正題魏長空澹澹孤鳥没萬古消沉向此中㸔取漢家何似業五陵無樹起秋風遊原登樂登池州九峰樓寄張祐云百感􅂨來不自由角聲孤起夕陽樓碧山終日思無盡芳草何年恨即休睫在目前人不見道非身外更何求誰人得似張公子千首詩輕萬戸侯過華清宫云長安廻望綉成堆山頂千門次第開一􅀐紅塵妃子笑無人知道荔枝來又云新豐緑樹起紅埃數􅀐漁陽探使廻霓裳一曲千峰上舞破中原始下來李義山作杜司勲詩云高樓風􅀨歎斯文短翼差池不及群刻意傷春復傷别人間唯有杜司勲又云杜牧司勲字牧之清秋一首杜秋詩前身應是梁江揔名緫還曾字緫持心鐡巳從千鏌利􅁂􅁝休嘆雪霜垂漢江逺吊西江水羊祜韋丹盡有碑撲韋碑時杜春許渾祇命􅀯海至廬陵逢表兄軍倅奉使淮海别後却􅀉云蘆橘花香拂釣磯佳人猶舞越羅衣三洲水淺漁來少五嶺山高鴈到稀客路晩依紅樹宿鄕􅀜暗望白雲歸交親不念征南吏昨夜風㠶去似飛金陵懷古云玉樹歌殘王氣終景陽兵合戍樓空松林逺近千家塜禾􅁰高低六代宫石燕拂雲晴亦􅀨江肫吹浪夜還風英雄一去豪華盡惟有青山似洛中登故洛陽城云禾􅁰離離半野蒿昔人城此豈知勞水聲東去市朝變山􅀔北來宮殿高鴉噪暮雲歸古堞鴈迷寒􅀨下空壕可憐緱嶺登仙子猶自吹笙醉碧桃咸陽西樓晩望云一上高城萬里愁兼葭楊桞似汀洲溪雲􅀄起日沉閣山􅀨欲來風滿樓鳥下緑蕪􅁗苑夕蟬鳴黃葉漢宫秋行人莫問前朝事渭水寒聲晝夜流杜牧之有許七侍郎弃官東歸瀟洒江南高秋企望寄贈之詩云天子綉衣吏東吳美退居有園同􅁃信避事學相如蘭畹晴香嫰筠溪翠影踈江山九秋後風月六朝餘錦開詩軸青嚢結道書霜嚴紅薜荔露沼白芙蕖睡高梧密棋燈小閣虛凍醪元亮秫寒鱠季鷹魚塵意迷今古雲情識卷舒他年雪中棹陽羡訪吾廬近有水榭榮於㒷義縣又初春􅀨中舟次和撗江裴使君見迎李趙二秀才同來因書四韻兼􅀉江南許渾云芳草渡頭微雨時萬株揚桞拂波垂蒲根水暖鴈初落梅逕香寒蜂未知辭客􅀝風吟暗淡使君廻馬濕旌旗江􅀯仲蔚多情調悵望青隂幾首詩渾記夢詩序云余常夢登山有宫室淩雲人云此崑崘也旣入見數人方欲招之至暮而罷詩云暁入瑶臺露氣清坐中唯有許飛瓊塵心未盡俗縁在十里下山空月明或云攺第二句為天風飛下歩虚聲韋莊讀渾詩云江南才子許渾詩字字清新句句竒十斛眞珠量不盡惠休虚作碧雲詞渾睦州人字用晦圉師之後大中三年任􅁥察御史以疾乞東歸終郢睦二州剌史水聲東注市朝變山勢北來宫殿高句草生宫闕國無主玉樹後庭花為誰句何郎翠鳯􅀟飛去三十六宫聞玉簫句經年未葬家人散昨日因齋故吏來句垂釣有深意望山多逺情右張為取為主客圖童翰卿省試昆明池織女石詩云一片昆明石千秋織女名向風長脉脉臨水更盈盈有臉蓮同笑無心鳥不驚㟁雲連􅁂濕沙月對眉生苔作輕裙色波為促杼聲還如明鏡裏形影自分明翰卿又有句云大朴逐物盡哀我天地功爭得榮辱心酒然歸西風張為取作主客圖雍陶詠䨇白鷺云䨇鷺應憐水滿池風飄不動頂􅁝垂立當青草人先見行傍白蓮魚未知一足獨拳寒􅀨裏數聲相呌早秋時林塘得爾湏增價况是詩家物色冝杜元頴為西川節度使治無狀文宗大和三年南詔蠻嗟巔乃悉衆掩攻戎嶲三州䧟之入成都止西郛十日掠女子五􅇊數萬而南至大渡河謂華人曰此吾南境爾去國當哭衆號慟赴水死者十三故陶賦蜀人爲南蠻俘虜詩云但見城池還漢將豈知佳麗属蠻兵錦江南渡聞遥哭盡是離家别國聲又賦過大渡泣望鄕國詩云大渡河邊蠻亦愁漢人將渡盡回頭此中郵􅀉思鄉淚南去應無水北流别嶲州一時慟哭雲日爲之變色詩云越嶲城南無難地傷心從此便爲蠻􅁈聲一慟悲風起雲暗青天日下山蠻界不許有悲泣之聲詩云雲南路出䧟河西毒草長青瘴色低漸近蠻城誰敢哭一時收淚羡猿啼蜀中戰後感事云蜀道英靈地山重水又回文章四子盛道路五丅開詞客題橋去忠臣叱馭來卧龍同駭浪躍馬比浮埃巳謂無妖土那知有禍胎蕃兵依漢桞蠻斾指江梅戰後悲逢血燒餘恨見􅁅空留犀猒怪無復酒除災歳積萇洪怨春深杜宇哀家貧移未得愁上望鄕臺蜀中經蠻後友人馬艾見􅀉荅云茜馬渡瀘水北來如鳥輕幾年朝鳯闕一日破􅀛城此地有征戰誰家無死生人悲還舊里鳥喜下空營弟姪意初定交朋心尚驚自從經難後吟苦似猿聲陶蜀川上第後稍薄親黨其舊雲安劉敬之罷舉歸三峽責陶不寄書曰山近衡陽雖少鴈水連巴字豈無魚陶得詩悸􅎼乃有􅈢首之思後為簡州牧自此謝宣城桞吳興賔至則折之閽者亦怠投贄者稀得見有馮道明下第請謁云與貟外故舊􅕡者以道明言啓之及引進陶詞曰與公昧平生何云相識道明云誦員外之詩仰員外之德詩集中日得相見何隔平生也遂吟曰立當青草人先見行傍白蓮魚未知又曰江聲秋入寺􅀨氣夜侵樓又曰閉門客到常疑病滿院花開不似貧陶聞吟欣狎待道明如􅇮昔之友君子以雍君矜誇而好媚馮予匪藝而求知酬李紺歳除送酒云歳盡貧心事事湏就中􅀷恨酒錢無故人克壽能分送逺客消愁免自沽一夜四乗輕鑿落五更三􅀧把屠蘇巳供時節􅀷珎處况許今朝更挈壺陶典陽安送客至情盡橋問其故左右曰送迎之地止此故橋名情盡陶命筆題其柱曰折桞橋自後送别必吟其詩曰從來只有情難盡何事名爲情盡橋自此攺名爲折桞任他離恨一條條劉夢得洞庭詩云湘江秋月两相和潭靣無風鏡未磨遥望洞庭山翠小白雲盤裏一青螺陶亦吟云煙波不動影沉沉碧色全無翠色􅀷疑是水仙梳洗處一螺青黛鏡中心陶字國鈞大中八年再自國子毛詩愽士出剌簡州姚合送陶及第歸覲云獻親冬集書比橘復何如此去􅀜河逺相思笑語踈路尋清壑斷人近白雲居幽石題名處憑君亦記予陶河隂新城詩云高城新築壓長川虎踞龍盤氣色全五里似雲根不動一重如月暈長圓河流暗與溝池合山色遥將睥睨連自有此來當汴口武牢何用鎻風煙天津橋春望云津橋春水浸紅霞煙桞風􅁝拂㟁斜翠輦不來金殿閣宫鶯㗸出上陽花送徐山人歸睦州舊隱云君在桐廬何處住草堂應與戴家鄰初歸山犬飜驚主乆别江鷗却避人終日欲為相逐計臨時空羡獨行身秋風釣艇遥相憶七里灘西片月新賈島送陶入蜀云江山事􅀂諳那滯滯雲南草色分危磴杉隂近古潭日斜褒谷鳥夏淺嶲州吾自疑䨇􅁂相逢更不堪陶題杜子美故居云沙崩水檻鷗飛盡樹壓村橋馬過遲唐詩人最重行卷陶首篇上裴度或云耿湋行卷首篇上第五􅄾遂指爲二子邪正雖然方􅄾未有釁時上詩亦何足多怪周元範誰云蒿上煙隨雲依碧落公句投白莫怪西陵風景别鏡湖花草爲先春及第及句賀朱慶餘右張爲取作主客圖元範句曲人李逺失鸖詩云秋風吹却九臯禽一片閑雲萬里心碧落有情應悵望青天無路可追尋來時白雪翎􅀹短去日丹砂頂漸深華表柱頭留語後不知消息到如今聽話叢臺云有客新從趙地廻自言曾工古叢臺雲􅃒襄國天邊盡樹遶漳河掌上來絃管變成山鳥弄綺羅留作野花開金輿玉輦無行跡風􅀨誰知長碧苔贈冩御容李長史云玉座塵消硯水淸龍髯不動彩毫輕初分隆凖山河秀乍􅀧重瞳日月明宫女捲簾皆暗認侍臣開殿盡遥驚三朝供奉無人敵始􅁴僧繇浪得名張同幽閑鼓吹云宣宗朝令􅈢綯薦逺為杭州宣皇曰我聞有逺詩云長日唯銷一局棋豈可以臨郡哉對曰詩人之言非有實也仍薦逺廉察可任乃俞之宣宗視逺到郡謝上表左右曰不足煩聖慮也上曰逺到郡無非時奏章只有此謝上表安知不有情懇乎吾不敢忽也逺字求古大中時為建州剌史朱可名應舉日􅀉兄弟云廢斵湖鏡田上書紫閣前愁人乆委地詩道未聞天不是燒金手徒抛釣月􅂳多慙兄弟意不敢問林泉右張為取作主客圖可名越州人進士及第終長安趙嘏長安秋望云雲物凄凉拂曙流漢家宫闕動高秋殘星幾􅀧鴈撗塞長笛一聲人􅀝樓􅂵艶半開籬菊静紅衣落盡渚蓮愁鱸魚正美不歸去空戴􅀯冠學楚囚獻准􅀯李僕射云早年曾謁富人侯今日難甘失鵠羞新諾似山無力負舊思如水滿身流馬嘶紅葉蕭蕭晩日照長江灔灔秋功德萬重知不惜一言抛得百生愁開成五年樂和侍郎下三十一人及第時在諒闇率皆雅飲嘏以詩賀曰天上高高月桂叢分明三十一枝風滿懷春色向人動􅃒路亂花迎馬紅鸖馭尚飄雲􅀨外蘭堂不在管絃中居然自是前賢事何必青樓􅀝翠空宣宗索嘏詩首卷題􅁗皇云徒知六國隨斤斧莫有群儒定是非上不悦張濆會昌五年陳啇下第一人翰林覆考黜之嘏貽濆詩曰莫向春風送酒盃謫仙眞箇是仙才猶堪與世為祥瑞曾到蓬萊頂上來杜紫微覽嘏早秋詩云殘星幾􅀧鴈撗塞長笛一聲人􅀝樓吟味不巳因目嘏為趙􅀝樓復有贈嘏詩曰今代風騷將誰登李社壇㶚陵鯨海動翰死鶴天寒今日訪君還有意三條氷雪獨來㸔嘏曾有詩曰早晩粗酬身事了水邊歸去一閑人果卒於渭南尉嘏嘗家于浙西有美􅁎惑之洎計偕會中元鶴林之遊浙帥窺其􅁎遂􅍕有明年嘏及第因以一絶箴之曰寂寞堂前日又曛陽臺去作不歸雲當時聞説沙吒利今日青娥属使君浙帥不自安遣一介歸之嘏方出􅀜逢於撗水驛􅁎抱嘏慟􅂘而卒遂葬於撗水之陽嘏字承祐大中終於渭南尉一千里色中秋月十萬軍聲半夜潮句錢塘梁王舊舘巳秋色珠􅂂少年輕綉衣句滿樓春色傍人醉半夜􅀨聲前計非句三千宫女自􅂗地十萬人家如洞天江都司送人尉右張為取作主客圖祝元膺送高遂赴舉云句曲舊宅真自産日月英旣涵嶽瀆氣安無神仙名松桂邐迤色與君相送情又􅀉道友云兩頷凝清霜玉鑪焚天香為我延歳華得入不死鄕又夢仙辭云蟾蜍夜作青冥鏡螮蝀晴為碧落梯好箇分明上天路誰教移入武陵溪又有霧紋班似豹水力徤如龍之句張為取作主客圖元膺句曲人與段成式同時每愛誦孟不疑句云白日故鄕逺青山佳句中成式紀之韋承貽承貽咸通中䇿試夜潜紀長句於都堂西南隅云褒衣博帶滿塵埃獨自都堂納試回蓮卷幾時聞吉語􅁄籬何日免重來三條燭盡鍾初動九轉丹成􅂦未開殘月漸低人擾擾不知誰是謫仙才又曰白雲千朶照廊明一片昇平雅頌聲􅂊唱第三條燭盡南宫風月􅀞難成承貽字貽之咸通八年登第鄭史史開成元年登第經過池陽廉使崔君悅一妓行雲有詩云㝡愛鈆華薄薄粧更兼衣着又鵝黃從來南國名佳麗何事今朝在北行臨岐博陵公輟贈之史終國子博士賈島送史詩曰葛林頗重疊岑渚復幽竒汨水斜陽㟁羇人正則祠蒼梧多蟋蟀白露濕紅籬擢第榮回去晨昏近九疑韋楚老祖龍行云黒雲兵氣射天烈壯士朝眠夢􅁈結祖龍一夜死沙丘胡亥空隨鮑魚轍腐肉偷生三千里僞書先賜扶􅂫死墓接驪山土未乾瑞光巳向芒碭起陳勝城中鼓三下􅁗家天地如崩瓦龍蛇撩亂入咸陽少帝空隨漢家馬江上蚊子云飄揺挾翅亞紅腹江邊夜起如雷哭請問貪婪一􅀧心臭腐塡腹幾多足越女如花住江曲嫦娥夜夜疑䨇緑君撩亂錦牎中十軸輕綃圍夜夜玉杜牧之送韋楚老拾遺自洛中歸朝云洛橋風暖細飜衣春引仙官去玉墀獨鶴􅀄冲太虚日九牛新落一毛時行開教化期君是卧病神祗禱我知十載丈夫堪耻處朱雲猶棹直言旗楚老長慶進士終於拾遺開成時李德􅁉代牛僧孺為淮南節度奏僧孺錢帛事􅀘闕王繢魏謨崔黨韋有翼拾遺令􅈢綯及楚老樊宗仁連章奏德􅁉妄奏錢帛以傾僧孺上不問一從黃帝葬橋山碧落千門鎻元氣行句天上唐詩紀事卷第五十六
