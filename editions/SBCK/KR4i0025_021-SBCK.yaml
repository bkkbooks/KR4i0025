  text: 唐詩紀事卷第二十一
  hash: sha256:e34137c4c4b343cd24ceb4250f41fefd92f82535355a87b6b9b44017084c0b64
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_021-1a}
body:
  text: 蕭頴士李華崔顥李嘉祐王翰蕭頴士頴士重陽陪魯山登北城贈别時元有掛冠之意詩云山縣遶古堞悠悠快登望雨餘秋天高目盡無隱狀綿連滍川逈杳􅄅鴉路􅀷彭澤興不淺臨風動歸心頼兹琴堂暇傲倪傾菊酒人和嵗巳登從政復何有逺山十里並一道衘長雲青霞半落日混合疑晴曛漸聞栖林羽坐歎清夜月中歡愴有違行子念明發僅能泯寵辱未免傷别離江湖不可忘風雨勞相思明時當盛才短􅇊安所設何日謝百里從君漢之澨又答韋司業垂訪云􅊯􅊯食苹鹿常飲清泠川但恱豐草美寜知牢饌鮮主人有幽意將以充林泉羅網幸免傷䝉君復覊牽高堂列衆賔廣坐鳴清絃俯仰轉傷惕徘􅆦獨憂煎􅃡懐雲巖路欲往無由縁物各有所好違之傷自然神􅀛在南國緬邈湘川隂遊止蓮葉上歳時嘉􅀣林毒䖝且不近斤斧何由尋錯落􅀒竒文熒煌燿丹金江山萬里餘淮海阻且􅀷獨保貞素質不爲寒暑侵一逢聖明代應見通靈心􅀳代有儒臣當年冨辭藻立言􅀉青史將以賛王道遼落􅃡歳時辛勤歷江島且言風波倦􅊥渉豈爲寳不遇􅁃征西云誰展懐抱士貧乏知巳安得成所好彭陽昔游說願謁南郢都王果尚未逹况從夷節謨豈知􅀳叔向無罪嬰囚拘臨難俟解紛獨知祁大夫舉讎且不棄何必論親踈夫子覺者也其能遺我乎關西一公子年皃獨青春披褐來上京翳然聲未振中郎何爲者倒屣驚座賔詞賦豈不佳盛名亦相因爲君奏此曲此曲多苦辛千載不可誣孰言今無人李華序其文曰開元天寳間以文學著於時者曰蘭陵蕭頴士字茂挺年十九進士擢第淮南連帥表君爲楊州工曹沒於汝南旅次君謂六經之後有屈原宋玉文甚雄壯而不能經厥後有賈􅁩文詞詳正近於理躰杖乗司馬相如亦瓌麗才士然而不近風雅楊雄用意頗􅀷班彪識理張衡宋曠曺植豊贍王粲超逸嵇康摽舉此外皆金相玉質所尚或殊不能備舉左思詩賦有雅頌遺風千寳著論近乎王化根源此外皆敻絶無聞近日陳拾遺文體最正以此而言見君􅄒作君以文章制度爲巳任時人咸以此許之頴士卒門人贈文元先生惟一子存字伯誠爲金部外員郎有功曹文風惡裴延齡棄官歸廬山存子東從事邕南以女妻柳淡字中庸韓文公少時受存之知自􅀽州入爲祭酒經廬山過其山居知諸子凋謝唯二女在乃爲詩曰中郎有女能傳業伯道無􅄦可保家今日匡山過舊隱空將衰淚對烟霞頴士以推奬後進爲任如李陽李㓜皇甫冉陸渭等數十人由奨目皆爲名士天下推知人稱蕭功曹嘗兄事元德秀而友殷寅顔眞卿柳芳陸據李華邵軫趙驊時人語曰殷顔柳陸李蕭邵趙以能全其交也李華與齊名世號蕭李李華華字遐叔舉開元二十三年進士天寳二年愽學宏詞皆爲科首天寳十一年拜監察御史除右􅀘闕禄山亂輦母而逃爲盗所得二京復坐謫杭州司功參軍召加司封外員郎將以司言處之華曰焉有隳節奪志者可以荷君之寵乎移病請告李峴領選江南表爲從事以風痺廢居楚詠史詩云日照崑崙山羽人披羽衣乗龍駕雲霧欲徃心無違此山在西北乃是神仙國靈氣皆自然求之不可得何爲漢武帝精意徧群山糜費巨萬計宫車終不還蒼蒼茂陵􅀣足以戒人間天生忠與義本以佐雍熈何意李司􅀠而當昏亂時古墳襄城野斜徑横秋陂况不禁樵採茅莎無了遺髙褾尚可仰精爽今何之一忤中常侍啣寃誰見知常觀黨錮傳撫卷不勝悲文候耽鄭衛一聽一忘飱白雪燕􅁎舞朱絃趙女彈滛聲流不返慆蕩日無端献歳受朝時鳴鍾醼百官兩牀陳管磬九奏殊未闌對此唯恐卧更能整衣冠漢皇修雅樂乗與臨太學三老輿五更天王親割牲一人調風俗萬國和且平單于驟欵塞武庫欲銷兵文物此朝盛君臣何穆清至今壝壇下如有簫韶聲蜀主相諸葛功高名亦尊驅馳千萬衆怒目瞰中原曺伯任公孫國亡身不存社宫久蕪沒白鴈猶飛翻勿言君臣合可以濟􅀺元爲蜀諒不易如曹難復論秦滅漢帝興南山有遺老危冠揖萬乗幸得猒征討當君逐鹿時臣等巳枯槁寜知市朝變但覺泉石好高卧五十年相看成四皓帝言翁甚善見顧何不早咸稱太子仁重義亦尊道側聞驪􅁎事申生不自保蹔出啇山雲朅來趍灑掃東宫成羽翼楚舞傷懷抱後代無其人戾園滿秋草六國韓最弱末年􅀹畏秦鄭生爲韓計且欲疲秦人利物可分社原情堪滅身咸陽古城下萬頃稻苗新昻藏獬豸獸出自太平年亂代乃潜伏縱人爲禍愆常聞斷馬劍毎壯朱雲賢身死名不滅寒風吹墓田精靈如有在幽憤滿松煙沂水春可渉泮宫映楊葉麗色異人間􅃢􅃢揺珮環展禽常獨處深巷生禾黍城上飛海雲城中暗春雨適來鳴珮者復是誰家女泥沾珠綴􅂂􅀨濕翠毛簮電影閉蓮臉雷聲飛蕙心自言沂水曲采蘋兼采菉歸逕雖可尋天隂光景促憐君貞且獨願許君家宿徒勞惜衾枕子不顧雙娥豔質誠可重滛風如禮何周王惑褒姒城闕成波沲巢許在嵩頴陶唐不得臣九州上洗耳一命安能親緜邈數千祀丘中誰隱淪朝遊八卿府夕是山林人蒲帛楊仄陋薜蘿爲縉紳九重念入夢三事思䧏神且設庭中燎寜窺泉下鱗漢時征百越楊僕將樓船幕府功未立江湖巳騷然島夷非敢亂政􅁀地仍偏得罪因懐壁防身輒控弦三軍求裂土萬里詎聞天魏闕心猶在旗門首巳懸如何得良吏一爲制方圓一篇詠史十􅀉題趙七侍御餘自干谿行經弋陽至上饒山川幽麗思與雲卿同遊邈不可得因叙疇年之素􅀉懐於篇云揺槳曙江流江清山復重心愜賞未足川迥失前峯凌灘出極浦曠若天池通君陽青嵯峨開折混元中九潭魚龍窟仙成羽人宫隂奥潜􅀑物精光動煙空玄猿啼􅀷蘢竹􅀣􅀷者爲蘢千宗反楚越謂白鳥戯葱䝉飛湍鳴金石激溜皷雷風雨濯万木鮮霞照千山濃草閑長餘緑花浄落幽紅渚烟見晨釣山月聞夜春覆谿窈窕波滔石洶溶溶丹丘忽聚散素壁相奔衝白日破昏靄靈山出其東􅀔排昊蒼上氣壓呉越雄逈頸望雲卿此恨發吾􅂨昔日蕭郊逰四人纔成童侍御驊故華與趙七十六軫未冠進太學相次與校邵後三人及第也蕭十功曹皆苦貧幇􅁦同年三人登科頴士故邵屬詞慕孔門入仕希上公緯卿䧟非罪折我昆吾鋒字郡貶卒南中緯卿以􅁈横茂挺獨先覺㧞身渡京虹斯人謝明代百代墜鵷鴻東殯葬先人逝于江南蕭天寳未知乱棄官徃江世故墜横流與君哀路窮與趙受辱見中逆胡䧟兩京華相顧無死節䝉恩逐殊封貶泉州晋江尉華貶杭州司功趙天波洗其瑕朱衣備朝容恩累華承拜􅀘聞御史迁尚書郎趙一别凡十年豈期復相從餘生得携手遺此兩孱翁群迁失鸎羽後凋惜長松衰旅難重别悽悽滿心胷遇勝悲獨逰貪竒悵孤逢禽尚彼何人胡爲束樊籠吾師度門敎投弁躡遐蹤崔顥擢進士第有文無行終司勲員外郎􅀄李邕聞其名虛舎待之顥至献詩首章云十五嫁王昌邕叱曰小兒無禮不與接而去孟門行云黃雀衘黃花翩翩傍簷隙本擬報君恩如何反彈射金罍羙酒滿座春平原愛財多衆賔滿堂盡是忠義士何意得有䜛䛕人䛕人翻覆那可道能令君心不自保北園新裁桃李枝根株未固何轉移成隂結子君自取若問傍人那得知霍將軍云長安甲第髙入雲誰家居住霍將軍日晚朝迴擁賔從路旁揖拜何紛紛莫言灸手手可􅀬湏􅁷火盡灰亦滅莫言貧賤即可欺人生富貴自有時一朝天子賜顔色世上悠悠應始知黃鶴樓詩昔人已乗白雲去此地空餘黃鶴樓黃鶴一去不復返白雲千載空悠悠晴川歴歴漢陽􅀣春草凄凄鸚武洲日暮郷關何處是煙波江上使人愁在上頭遂作鳯凰䑓詩以䡋勝􅀒恐不然世傳太白云眼前有景道不得崔顥題詩王家少婦詩云十五嫁王昌盈盈入􅀞堂自憐年最小復􅀝婿爲郎舞愛前溪緑歌憐子夜長閑來闘百草度日不成粧商璠云顥少年爲詩属意浮艶多䧟輕薄晩歳忽變常躰風骨凛然如殺人遼水上走馬漁陽歸錯落金鏁甲䝉茸貂䑕衣又秋風吹淺草獵􅀐何翩翩挿羽兩相顧鳴􅃓新上弦鮑昭江淹湏有慙色古㳺俠呈軍中諸將云少年􅀒膽氣好勇復知機仗劍出門去孤城逢合圍殺人遼水上走馬漁陽歸錯落金鏁甲䝉茸貂䑕衣還家行且獵弓矢速如飛地逈鷹狗疾草􅀷狐兎肥腰間帶兩綬轉盻生光輝顧謂今日戰何如隨建威贈王威古云三十羽林將出身常事邊秋風吹淺草獵􅀐何翩翩挿羽兩相顧鳴􅃓新上弦射麋入􅀷谷飲馬向寒泉馬上共傾酒野中􅂓割鮮相看未及醉雜虜叩幽燕烽火知不息胡塵高際天長驅救東北戰解城亦全報國行赴難古來皆共然送單于裴都䕶云征馬出翩翩秋城月正圓單于莫近塞都䕶欲臨邊漢驛通烟火胡沙乏井泉功成須献捷未必去經年題隱侯八詠樓云梁日東陽守爲樓望越中緑牕明月在青史古人空江靜聞山􅎜川長數塞鳴登臨白雲晚流恨此遺風遼西云燕郊芳歳晚殘雪涷邊城四月青草合遼陽春水生胡人正牧馬漢將日徵兵露重寳刀濕沙虚金皷鳴寒衣着巳盡春服誰與成􅀉言洛陽使爲傳邊戍情渭城少年行云洛陽三月梨花飛􅁗地行人春憶歸揚鞭走馬城南陌朝逢驛使秦川客驛使前日發章䑓傳道長安春早來棠梨宫中燕􅀄至蒲萄舘裏花正開問念使人歸更早三月便逹長安道長安道上春可怜揺風蕩日曲江邊萬戸樓䑓臨渭水五陵花柳滿秦川李嘉祐字從一上元中嘗爲台州剌史大曆間剌􅀽州李肇記漠漠水田飛白鷺隂隂夏朩囀黃鸝之句本嘉祐詩而集中不見與嚴維劉長卿冷朝陽友善嘗有詩四年謫官滯江城未猒門前鄱水清誰言宰邑化􅀺庶欲别雲山如兄弟雙鷗爲底無心狎白髮從他遶􅁂生惆悵閑眠臨極浦夕陽秋草不勝情嘉祐盖嘗謫官但不知其故然見元日無衣冠入朝云白髭空換歳丹陛不朝天其坎坷之狀可少見矣嘉祐有送從叔陽氷􅀉從弟紆及姪端詩盖三子之族也逰鶴林寺云野寺江城近雙旌五馬過禪心超忍辱􅆊語問多羅松竹閑僧老雲霞晚日和寒塘歸路轉清磬隔微波送王􅀵徃吉州謁王使君云細草緑汀洲王孫耐薄遊年華􅀄冠帶文體舊弓裘野渡花争發春塘水亂流使君矜小阮應念􅀝門愁仲夏江隂官舎􅀉裴明府云萬里邊江次孤城對海安朝霞晴作雨濕氣曉生寒苔色侵衣桁潮痕上井欄題書招茂宰畏尓欲辭官潤州送蔣侍御􅀵兵歸楊云冷氣清金虎兵威壯䥫冠楊旌川色􅉂吹角水風寒人對輜軿醉花看睥睨殘羡歸丞相府空望舊門欄高仲武云嘉祐􅀽州人振藻天朝大􅀵芳譽中興髙流也與錢郎别爲一躰徃徃渉於齊梁綺美婉麗盖呉筠何遜之敵也至於野渡花爭發春塘水亂流朝霞晴作雨濕氣曉生寒文華之冠冕也又禪心超忍辱􅆊語問多羅設使許珣更生孫綽復在窮思極筆未到此境和苗員外發秋夜宿直云乆􅀨南宫夜仙郎寓直時漏長丹鳯闕秋冷白雲司螢影侵堦亂鴻聲出苑遲蕭條人吏散小謝有新詩極元集姚合取爲戴叔倫夜發􅀽州􅀉李頴川詩即嘉祐也詩云半夜廻舟入楚郷月明山水共蒼蒼孤猿更發秋風裏不是愁人亦斷腸於此時李貶王翰古長城吟云長安少年無逺圖一生唯羡執金吾騏驎前殿拜天子走馬西擊長城胡胡沙獵獵吹人靣漢虜相逢不相見遥聞鍾鼓動地來傳道單于夜猶戰此時顧恩寜顧身爲君一行摧萬人壯士揮戈迴白日單于濺血染朱輪迴來飲馬長城窟長城道傍多白骨問之耆老何代人云是秦王築城卒黃昏塞北無人烟􅀑哭啾啾聲沸天無罪見誅功不賞孤魂流落此城邊當昔秦王按劍起諸侯膝行不敢視冨國強兵二十年築怨興徭九千里秦王築城何太愚天實亡秦非北胡一朝禍起蕭墻内渭水咸陽不復都翰字子羽晋陽人少豪徤恃才張嘉正張說爲并州長史厚禮之爲駕部外員郎坐事貶道州司馬卒明皇送張說廵邊應制云紫盭尚書印朱軿丞相車登朝身許國出閫將辭家不憚炎蒸苦親嘗走馬賖選徒軍有令誓卒爾無譁帝樂風􅀄起王城日半斜寵行流聖作寅餞至台華􅀐歴河南􅀣旌揺天北沙榮懐應盡服嚴殺巳先加業峻靈祗保功成道路嗟寜知鑿空使逺致石榴花送張􅀃赴集賢院上賜讌賦得筵字云東堂起集賢貴得俊神仙首命台階老將崇御府圓送人將玉珮中使拂瓊筵和樂薫風解湛恩時􅀨連長材成磊落短翮強翩􅗁徒仰蓬萊地何階不讓縁恩賜樂遊園宴應制云未極人心暢何如帝道明仍嫌酺宴促復寵樂遊行陸海披珎藏天河直斗城四關清靄合數處白雲生飪餗調元氣歌鍾溢雅聲空慙堯舜力至德眷難名唐詩紀事卷第二十一
