front:
  text: 唐詩紀事巻第六十一
  hash: sha256:107837537b8573bf5dba52ae69159a6a59a64054653bdead849dc7efb0064cb0
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_061-1a}
body:
  text: 聶夷中劉象紀唐夫羅紹威鄭仁表張林李摶裴廷裕髙蟾宋邕崔塗孫郃鄭凖章碣于濆聶夷中夷中有公子行云種花滿西園花發青樓道花下一禾生去之爲􅁖草又詠田家詩云父耕原上田子斸山下荒六月禾未秀官家已修倉又云二月賣新絲五月籴新糓醫得眼前瘡剜却心頭肉我願君王心化作光明燭不照綺羅筵只照逃亡屋所謂言近意逺合三百篇之正也咸通十二年髙湜知舉牓内孤平者夷中公乘億許棠夷中􅀹貧苦精古詩夷中字坦之咸通中爲華隂尉劉象鷺鷥詩云潔白孤髙生不同頂絲清軟冷揺風窺魚翹立荷香裏慕侶低翻栁影中幾日下巢辭紫閤多時凝目向晴空摩霄志在潜修羽㑹接鸞凰别葦叢象京兆人天復元年與曹松軰同登第居五花膀象詠仙掌詩時号劉仙掌詩云万古亭亭倚碧霄不成竒刻不成招何如掬取天池水灑向人間救旱苖紀唐夫開成中執政􅁖温廷筠擾場屋黜隨州縣尉唐夫送以詩曰何事明時泣玉頻長安不見杏園春鳯凰詔下雖霑命鸚鵡才髙却累身且飲緑醽消積恨莫辭黄綬拂行塵方城若比長沙路猶隔千山與萬津唐夫􅍡馬云連年出塞踏沙蓬豈比當時御史􅍡逐北自諳深磧路連嘶誰念靜邊功登山毎與青雲合弄影應知碧草同今日虜平將換妾不如羅䄂舞春風羅紹威唐末襲父洪信爲魏博節度使喜爲詩江東羅隠有詩名紹威厚禮之與通属籍目已所爲詩号偷江東集如樓前淡淡雲頭日簾外蕭蕭􅀨脚風無愧隠矣紹威形㒵魁偉有英傑氣好招延文學士開館聚書万巻毎歌酒宴㑹與賔佐賦詩頗有情致羅隠贈紹威詩云寒門雖得在諸宗棲北巢南恨不同馬上固慙銷髀肉幄中猶美愈頭風蹉跎歳月心仍切迢逓江山夢未通深荷吾人有知已好將筆力當英雄鄭仁表贈美人云嚴吹如何下太清玉肌無疹六銖輕自知不是流霞酌願聽雲和瑟一聲嘗有詩曰文章世上爭開路閥閱山東柱破天仁表經過滄浪峽憇於長亭驛吏堅進一扳仁表走筆云分陜東西路正長行人名利火燃湯路傍著榜滄浪峽真是將閑攪撩忙仁表豪爽有文嘗以門閥文章自髙曰天瑞有五色雲人瑞鄭仁表傲縱多所陵籍人畏薄之仕為起居郎為劉鄴所􅁖貶死嶺外鄴少時投文於仁表父泊仁表嗤鄙之鄴為相仁表貶死張林林擢進士第官至御史爲詩小巧多採景於園林亭沼云菱葉乍翻人採後芰荷初没舸行時亦佳句也林言毁佛寺時御史有蘇監察者撿天下廢寺見銀佛一尺以下者多袖而歸時号蘇揑佛温庭筠􅑈曰好對宻陁僧李摶裴廷􅁉僖宗在成都廷裕登第摶以詩賀曰銅梁千里曙雲開仙籙新從紫府來天上已張新羽翼世間無復舊塵埃嘉禎果中君平卜賀喜須斟卓氏盃應笑戎藩刀筆吏至今泥滓曝魚鰓既而復謔之曰曽隨風水化凡麟安上門前一字新聞道蜀江風景好不知何似杏園春裴有六韻答曰何勞問我成都事亦報君知便納降蜀栁籠堤煙矗矗海棠當戸燕䨥䨥富春不並窮師子濯錦全勝旱曲江髙捲絳紗楊氏宅主時故有比句文寓楊子巷半垂紅袖薛濤牕浣花泛鷁詩千首靜衆尋梅酒百缸若説絃歌與風景主人兼是碧油幢摶登乾符進士第裴廷裕廷裕字膺餘昭宗翰林學士左散騎常侍乾寜中在内庭文書敏犍号下水舩後貶湖南卒斈士人号􅇥梁時姚洎為水舩灘頭上廷裕偶題云㣲􅀨㣲風寒食節半開半合木蘭花看花倚柱終朝立却似凄凄不在家髙蟾詠春詩曰明月斷魂清靄靄平蕪歸思緑迢迢人生莫遣頭如雪縱得春風亦不消金陵晚望云曽伴浮雲悲晚翠猶陪落日泛秋聲世間無限丹青手一片傷心􅀞不成鄭谷贈詩云張生故國三千里知者惟應杜子㣲君有君恩秋葉後可能更羡謝􅀇暉蓋蟾有宫詞云君恩秋後葉日日向人踈蟾初落第詩云天上碧桃和露種日邊紅杏倚雲栽芙蓉生在秋江上莫向春風怨未開胡曽亦有下第詩云翰苑何時休嫁女文昌早晚罷生兒上林新桂年年發不許平人折一枝時謂蟾無躁兢心後登第乾符中爲中丞宋邕一作雍春日云輕花細葉滿林端昨日春風曉色寒黄鳥不堪愁裏聽緑楊宜向􅀨中看僞蜀韋糓取此詩爲才調集唐末五雲溪人范攄云宋雍初無令譽及嬰􅎩疾而詩名始彰或戯其詩云緑楊宜向􅀨中看所謂無眼作有眼之詩崔塗春夕旅懐云水流花謝兩無情送盡東風過楚城蝴蝶夢中家万里杜鵑枝上月三更故園書動多年絶華髪春唯兩鬢生自是不歸歸便得五湖烟景有誰爭蜀城春云天涯憔悴身一望一霑巾在處有芳草滿城無故人懐才皆得路失計自傷春清鏡不堪照鬢毛愁更新塗字禮山光啓進士也感花詩云繡軛香韉夜不歸少年爭認最紅枝東風一陣黄昏􅀨又到繁花夢覺時孫郃郃古意云屈子生楚國七雄知其材介潔世不容跡合藏高萊道廢固命也瓢飲亦賢哉何事塟江南空使後人哀又云魏禮叚干朩秦王乃止戈小國有其人大國柰之何賢哲信爲美兵甲豈云多君子戰必勝斯言聞孟軻郃字希韓四明人與方千友善乾寜中登進士第好荀楊孟子之書學退之爲文爲校書郎中河南府人學其文爲錢珝所序詩有仕官類啇賈終日常東西之句鄭凖江南清明云呉山楚驛四年中一見清明一改容旅恨共風連夜起韶光隨酒着人濃延興門外攀花别採石江頭帶酒逢無限歸心何計是路邊戈甲正重重凖以文依荆州成中令汭常欲比肩陳阮自作所業爲三巻号劉表軍書其應舉日詩巻有題水牛云䕶犢横身立逢人掲尾跳朝士大笑字不欺登乾寜進士第有渚宫集一巻章碣癸卯歳毗陵登髙云流落常嗟勝會稀故人相遇菊花時鳯笙龍笛數廵酒紅樹碧山無限詩塵土十分歸舉子乾坤太半属偷兒長􅀭羽獵湏􅅏本開濟重爲闕下期焚書坑詩曰竹帛煙銷帝業虛闗河空鎻祖龍居坑灰未冷山東亂劉項元來不讀書上元夜建元寺觀燈呈通智上人云建元看别上元燈處處回廊闘火層珠玉亂抛髙殿佛綺羅深拜逺山僧臨風走筆思呈惠到曉行禪合伴能無限喧闐留不得月華西下露華凝邵安石連州人髙湘侍郎南遷歸闕途次連江安石以所業投獻遂挈至輦下湘主文安石擢第碣賦東都望幸刺之曰懶修珠翠上髙臺眉月連娟恨不開縱使東廵也無益君王自領美人來碣孝摽之子登乾符進士第碣未第時方干贈詩織錦雖云用舊機抽捘起様更新竒何如且破望中葉未可便攀低處枝藉地落花春半後打牕斜雪夜深時此時才子吟應苦吟苦鬼神知不知千濆辛苦吟云隴上扶犂兒手種腹長飢牕下擲梭女手織身無衣我願燕趙姝化爲嫫女姿一笑不直金自然家國肥古宴曲云雉扇合蓬萊朝車廻紫陌重門集嘶馬言宴金張宅燕娥奉巵酒低鬟若無力十戸手胼胝鳯凰釵一隻髙樓齊下視日照綺羅色笑指負心人不信生中國思歸引云不耕南畆田誤愛東堂桂身同樹上花一落又經歳交親日相薄知已恩潜替日開十二門自是無歸計濆字子漪咸通進士終泗州判官唐詩紀事巻第六十一
