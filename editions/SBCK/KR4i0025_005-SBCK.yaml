front:
  text: 唐詩紀事卷第五
  hash: sha256:04c4ce9e992ebc9638dc509e0e65e27c652cfcb710671989530f38a4f0135187
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_005-1a}
body:
  text: 蕭徳言顔師古杜淹裴守眞胡元範元萬頃李敬立張文琮薛􅌖惑張大安薛元超鄭蜀賔王徳真楊思􅀇鄭義真徐珩蕭翼弘執恭鄭軌王勣竇咸蕭徳言詠舞詩云低身鏘玉珮舉袖拂羅衣對簷疑鷰語映雪似花飛徳言字文行正觀中為􅀪文館學士兼侍讀以年老致仕太宗不許詔曰天下無事方欲建禮作樂偃武修文卿年齒已衰教將何恃所冀才徳猶茂卧振髙風使濟南伏生猶在兹日拜秘書少監顔師古奉和正日臨朝云七政璿衡始三元寳律新負扆延百辟垂旒御九賔肅肅皆鴛鷺濟濟盛簮紳天涯重致譯日域獻竒珎師古字籀自之推以來居關中性簡峭自負其才意望甚髙終於秘書監諌議大夫相時其弟也師古叔父逰秦武徳初刺廉州州人歌曰廉州顔有道性行同莊老愛人如赤子不煞非時草髙祖璽書勞勉之杜淹杜淹始見袁天綱於洛天綱謂曰蘭臺成就學堂寛廣又語曰二十年外終恐責黜暫去即還武徳六年以善隠太子俱配流雋州淹至益州見天綱曰洛邑之言何其神也天綱曰不久即回至九年六月召入天綱曰杜公至京即得三品要職淹至京拜御史大夫檢校吏部尙書贈天綱詩曰伊吕深可慕松喬定是虛繫風終不得脫屣欲安如且珎紈素美當與薜蘿踈既逢楊得意非復久閑居淹字執禮隋時隠太白山文帝惡之謫戍江表秦王引入為天䇿府曹參軍賦詩尤工賜銀鐘楊文幹反辭連太子歸罪淹流雋州太宗踐阼召為御史大夫後檢校吏部尚書㕘預朝政卒裴守真和太子納妃詩曰瑜珮升青殿穠華降紫微還如桃李發更似鳳凰飛金屋貞離象瑶臺起婺徽綵纓紛碧坐繢羽泛褕衣雲路移凋輦天津轉明鏡仙珠照乘歸寳月重輪映望園喜宴洽主第懽娱盛􅁝竹楊帝熏簮􅅂奉宸慶藂雲藹曉灮湛露晞朝陽天文大景麗容藻睿詞芳玉庭散秋色銀宮生夕凉太平起遂古萬壽樂無疆守真綘州人髙宗時太常博士天授中為司憲府丞覈詔獄多裁恕不合武后㫖出刺成州徙寧州卒胡元範奉和太子納妃詩云帝子威儀絶宮妃禮慶優疊鼓陪山觀凝笳翼畫輈鬱鬱神香滃弈弈彩雲浮排空列錦􅄢勝觀溢皇州金閨未息火玉樹鍾天愛月路飾還裝星津動歸珮紫極流宸眷清規佇慈誨恩波洽九流光輝軼千載側席詔親賢式宴坐神仙聖文飛聖筆天樂奏鈞天曲池􅉼雅景文字孕祥煙小臣同百獸率舞悦堯年高宗子洪為太子納妃有司奏贄用白鴈適苑中獲之帝喜曰漢獲朱鴈為樂府歌今得白鴈為㛰贄㛰乃人倫首我則無慙孝欽皇帝太子後謚裴炎請武后歸政后以炎有異圖捕送詔獄元範為鳳閣侍郎曰炎有功於國臣明其不反后曰炎有反端顧卿未知耳元範曰若炎反臣軰亦反矣后曰朕知炎反卿軰不反遂斬炎元範申州義陽人介廉有才以炎故流死嶲州元萬頃春日池臺詩云日影飛花殿風紋積翠池鳳樓通夜敞虬輦望春移春日詩云花輕葉亂仙人店葉宻鸎喧帝女枽飛雲閣上春應至明月樓中夜未央又曰鳳輦迎風乗紫閣鸞車避日轉彤闈中塘促管淹春望後殿清歌開夜扉奉和太子納妃公主出降詩云离元應春夕帝子降秋期鳴瑜合清響冠玉麗濃輝和聲躋鳳掖清影步鸞墀從李勣征髙麗為遼東道管記勣令別將赴平壤粮不及期萬頃作離合詩宻報勣勣曰軍機切遽何以詩為欲斬之言狀乃免勣令作文檄髙麗其語有不知守鴨渌之險莫離支報云謹聞命矣遂移兵鴨渌軍不得入萬頃坐是流嶺外遇赦還為北門學士累遷鳳閣侍郎坐事誅李敬􅀇奉和別魯王詩云緑車旋楚服丹蹕佇秦川珠臯轉歸騎金㟁引行旃一朝限原隰千里間風煙鸎喧上林右鳬響御溝前斷雲移魯蓋離歌動舜絃别念凝神扆崇恩洽玳筵顧惟慙叩寂徒自仰鈞天又奉和別越王詩云飛蓋迴蘭坡宸襟佇栢梁別館分涇渭歸路指衡漳􅀜山通曉色林籞徧春灮帝念紆千里詞波照玉潢敬􅀇毫州人該覽群籍尤善於禮高宗在東宫馬周薦其材召入崇賢館侍讀後相髙宗儀鳳中劉仁軌奏河西鎮守非敬玄不可帝强遣之由是大敗於湟川魯王靈䕫髙祖子也歴五州刺史越王正太宗子武后時爲豫州刺史張文琮水詩云摽名資上善流􅂀表靈長地圖羅四瀆天文載五潢方流􅉼玉潤圓折動珠灮獨有䝉園吏棲偃玩濠梁賦橋詩云造舟浮渭日鞭石表秦初星文遥㵼漢虹勢尙凌虛已授文成履空題武騎書別有臨濠上棲偃獨觀魚和陽舎人詠中書有花樹詩云初蘂映春叢參差間早紅因風時落砌雜雨乍浮空影照鳳池水香飄鷄樹風豈不愛攀折希君懷袖中文琮同潘屯田冬日早朝云假􅄰懷古人夙興瞻曉月通辰禁門啟冠蓋趨朝謁霜靄清九衢霞灮照双闕紛綸人物紀煥爛聲明發腰劒動陸離鳴玉和清越文琮髙宗宰相文瓘弟也貝州人好自冩書正觀中為治書侍御史永徽中拜户部侍郎出為建州刺史卒文琮賦蜀道難云梁山鎮地險積石阻雲端深谷下寥廓層嵓上鬱盤飛梁架絶嶺棧道絶危巒攬境猶長息方知斯路難薛御諱孝宗惑進船於洛水詩云禁園紆睿覽仙棹叶宸遊洛北風花樹江南彩􅀞舟榮生蘭蕙草春人鳳凰樓興盡離宫暮煙灮起夕流世傳諱孝宗惑善投壺背後執矢投之龍躍隼飛百發百中張大安奉別越王詩云盛藩資右戚連蕚重皇情離襟愴睢苑分途指鄴城麗日開芳甸佳氣積神京何時驂駕入還見謁承明越王太宗子武后時為豫州刺史大安公謹之子上元中同中書門下三品章懷太子令與劉訥言等共註范瞱漢書太子廢故貶普州刺史終横州司馬薛元超和同太子監守違戀詩云儲禁銅扉啓宸行玉軷遥空懷壽街吏尚隔寢門朝北首瞻龍㦸塵外想鸞鏕飛文映仙誥濟惠叶神飈帝念紆蒼陸乾文煥紫霄歸塘横筆海平圃振詞條欲應重輪曲鏘洋韻九韶元超收之子也髙宗時為給事中轉中書舎人薦士若任希古郭正一崔融等皆以才自名上元初同中書門下三品政出武后因陽喑乞骸骨卒髙宗為太子也元超為舎人太宗親征時元超韓王元嘉同太子監守賦違戀詩鄭蜀賔蜀賔滎陽人善五言年老為江左一尉親朋餞於上東門蜀賔賦詩曰畏途方萬里生涯近百年不知將白首何處入黄泉酒酣詠歌聲調哀戚竟卒於官時長壽中也王徳真和過温湯詩云握圖開萬㝢屬聖啓千年驪阜疏緹騎驚鴻映彩旃玉霜明鳳野金陣藻龍川祥煙聚危岫慶水溢飛泉停輿興􅌖覽還舉大風篇徳真武后時為納言房先敏以罪貶訴於相府内史騫味道曰太后㫖劉褘之曰乃上從有司所奏云后聞貶味道而以褘之為忠臣徳真推順曰戴至徳無異才惟能歸善於君為時所服后曰善楊思􅀇湯泉詩云豐城觀漢迹温谷幸秦餘地接幽王壘塗分鄭國渠風威肅文衛日彩鏡雕輿逺岫凝氛重寒叢樹影踈迴瞻建章闕佳氣滿宸居奉和別魯王詩云元王詩傳奏文后寵靈優未若動宸眷龍章送逺逰潼關踈别道㶚岸引行舟北林分苑樹東流溢御溝鳥聲含吹咽騎影曳花浮聖澤九垓遍天文七曜周方翹獻雅樂簮帶奉鳴球髙宗時人鄭義真温湯詩云洛川方佇蹕豐野暫停鑾湯泉常獨涌温谷豈知寒漏皷依巗畔相風出樹端嶺煙遥聚草山月逈臨鞍日用誠多幸天文遂仰觀髙宗時人徐珩日暮望涇水詩云導源經隴阪屬汭貫嬴都下瀬波常急迴圻溜亦紆毒流秦卒斃泥糞漢田腴獨有迷津客懷歸􅎮暮途髙宗時人蕭翼太宗以翼爲監察御史􅂶使取羲之蘭亭序真蹟於越僧辯才翼初作北人南逰一見欵宻􅅏宿設缸靣酒江東缸靣猶何北曰甕頭蓋初熟酒也酣樂之後探韻賦詩才探來字詩云初醖一缸開新知萬里來披雲同落莫步月共徘徊夜久孤琴思風長旅鴈哀非君有秘術誰照不燃灰翼探招字詩云邂逅欵良霄慇懃荷勝招彌天俄若舊初地豈成遥酒蟻傾還泛心猨躁似調誰憐失羣翼長苦業風飄既而以術取其書以歸世翼本名南部新書曰蘭亭序武徳四年歐陽詢就越詐求之始入秦王府麻道嵩奉教搨兩本一送辯才一王自收道嵩私搨一本正觀二十三年禇遂良請入昭陵弘執恭和平凉公觀趙郡王妓詩云小堂羅薦陳妙妓命燕秦翠眉凝假黛紅臉自含春合舞俱迴雪分歌共落塵齊竽不可厠空願上龍津賦劉生云英名振闗右雄氣逸江東逰俠五都内來去三秦中劒照七星影馬控千金騘縱撗方未息因兹定武功梁以來歌為三秦逰劉生不知何代人齊鄭軌觀兄弟同夜成㛰詩云棠棣開䨇蕚夭桃照兩花分庭含珮響隔扇偶粧華迎風俱似雪映綺共如霞今霄二神女併在一仙家王勣詠妓詩云妖􅁎飾浄粧窈窕出蘭房日照當軒影風吹滿路香早時歌扇薄今日舞衫長不應令曲誤持此試周郎勣武徳正觀間人有集五卷竇威出塞曲云匈奴屢不平漢將欲縱撗㸔雲方結陣却月始連營潜軍渡馬邑楊斾掩龍城㑹勒燕然石方傳車騎名威字文蔚沈􅃉有噐局貫覧群言諸兄詆爲書癡武徳初爲内史令唐詩紀事卷第五
