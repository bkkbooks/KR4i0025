  text: 唐詩紀事巻第三十六
  hash: sha256:6ee8ca44bfd436149f130015014d6766528db30dd00d84b3b7cd47d6ef550fa1
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_036-1a}
body:
  text: 黎逢閻濟美裴交泰劉皂黎逢小菀東望宫池柳色詩云上林新柳變小苑暮天晴始望和煙密遥憐拂水輕色承陽氣暖隂帶御溝清不厭隨風弱仍冝向日明垂􅁝遍閣榭飛絮觸簾旌漸到依依處思聞出谷鸎韋蘇州任京兆工曹日有荅貢士􅀺逢詩云彌月曠不接公門但驅馳蘭草忽有贈持用慰所思不見心微密况當相見時逢氣貎山野及第年初塲後至便於簾前設席主司異之誚其生踈必謂文詞稱是專令人伺之句句來報初問云何人徘徊曰亦是常言既而將及數聮莫不驚嘆遂擢第逢登大暦十二年進士第閻濟美濟美大暦九年春下第將出闗獻坐主張謂詩六韻曰謇諤王臣直文明雅量全望鑪金自躍應物鏡何徧􅀯國幽沉盡東堂禮樂宣轉令遊藝士更惜至公年芳樹歡新景青雲泣暮天唯愁鳳池拜孤賤更誰憐謂覽之問失第之因具以實告謂深有遺才之嘆乃曰所投六韻必展後效明年濟美自江東繼薦就試東都謂復主文雜文巳過繼欲帖經濟美辭以不能謂曰禮闈故事亦許作詩贖帖遂命天津橋望洛城殘雪題濟美曰新霽洛城端千家積雪寒未收清禁色徧向上陽殘既而日勢巳晚詩未就謂云只㩀見在將來一覽稱賞遂唱過盧景莊謂曰前足下試蜡日祈天宗賦以魯丘對衛賜則子貢也乃作駟字誤矣方悔之明日謂曰天寒急景諸君文巻不成未可以呈宰相請重録送納既而索舊巻則駟字上朱㸃在焉易巻之意蓋有在也到闕謂揖濟美曰前日春間遺才所投六韻不敢暫忘幸副素懷矣濟美紀其事曰前朝公相許與定分一靣不忘美哉濟美正元末歴福建觀察為治簡易以工部尚書卒濟美元和初刺華州劾華隂令柳澗􅂍罪韓愈使過華上䟽理澗留中不下詔御史按得澗􅂍狀以愈妄論復為國子博士裴交㤗長門怨云自閉長門經幾秋羅衣濕盡淚還流一種峨嵋明月夜南宮歌吹北宮愁范攎曰近日舉場詩尤新章孝摽對月云長安一夜千家月幾處笙歌幾處愁有類乎裴交㤗交㤗正元間詩人劉皂長門怨云宮殿沉沉月色分昭陽宮漏不堪聞􅃢瑚枕上千行淚不是思君是恨君皂正元間人也韋莊載皂長門怨云涙滴長門秋夜長愁心和􅀨到昭陽涙㾗不學君恩斷拭却千行更萬行唐詩紀事巻第三十六
