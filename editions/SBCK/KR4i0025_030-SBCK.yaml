front:
  text: 唐詩紀事卷第三十
  hash: sha256:1f604c9a6723564348be366676ff6e543b75083aed73406f58e805d5ed9c711e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_030-1a}
body:
  text: 李益杜羔諸葛􅁴韋執中耿偉盧綸韓翃錢起司空曙苖發崔峒李端冷朝陽李益益姑􅆇人字君虞大暦四年登第其受降城聞笛詩教坊樂人取爲聲樂度曲又有冩征人歌早行詩爲圖􅀞者廻樂峯前沙似雪之詩是也益有心疾不見用及爲幽州劉濟營田副使獻詩有感恩知有地不上望京樓之句左遷右庶子年且老門人趙宗儒自宰相罷免年七十餘益曰此吾爲東府所送進士也聞者憐益之困後遷禮部尙書致仕卒益録其從軍詩贈左􅀘闕盧景亮自序云吾自兵間故爲文多軍旅之思或軍中酒酣塞上兵􅃦投劔秉筆散懷於斯文率皆出乎慷􅁣意氣武毅果厲本其凉國則世將之後乃西州之遺民歟亦其坎軻當世發憤之所致也正元間作其詩皆建中夜上受降城聞笛詩云廻樂峰前沙似雪受降城下月如霜不知何處吹蘆管一夜征人盡望郷臺也烽烽火征人歌云胡風凍合鸊鵜泉牧馬千群逐暖川塞外征行無盡日年年移帳雪中天曉角詩云邊霜一夜落平蕪吹角當城片月孤無數塞鴻飛不度秋風卷入小單于從軍北征云天山雪後海風寒撗笛偏吹行路難磧裏征人三十萬一時廻向月明看獻劉濟云草緑古燕州鸎聲引獨遊鴈歸天北畔春盡海西頭向日花偏落馳年水自流感恩知有地不上望京樓從軍有苦樂行公比征作時從司空兾云勞者且莫歌我欲歌送觴行軍有苦樂此曲樂未央僕居在隴上隴水斷人腸東過􅁗官路宫樹入咸陽時逢漢帝出諌獵至長楊詎馳遊俠窟非結少年場一旦承嘉惠輕身重恩光秉筆參帷帟從軍至朔方邊馬多隂風草朩自凄凉斷絶西海去出没胡沙長參差引鴈翼隱轔騰軍裝劔文夜如水馬汗凍成霜使氣五都少矜功六郡良山河起目前睚眦死路傍北逐馳種虜西臨復舊􅆠昔還賦餘資今出乃羸粮一矢致夏服我􅃓不再張􅀉言丈夫雄苦樂身自當馳一作駞來從竇車􅀐云行作自朔方束髪逢世屯懷恩抱明義讀書良不武學劔慙非智遂別魯諸生求從竇車􅀐追兵起邊急絡馬黃金轡出入燕南陲由來重意氣自經臯蘭戰入破樓煩地西北護三邊東南留一尉時過如雲雨參差不自意將軍失恩澤萬事從比異置酒高䑓上薄暮秋風至長㦸與我歸歸來同棄置自酌還自飲非名又非利歌出易水寒琴下雍門涙出逢平樂舊言在天階侍問我從軍苦自陳少年貴丈夫交四海徒論身自致漢將不封侯蘓卿還逺使令我終此曲此曲誠不易貴人難識心何由知忌諱夜發中軍云邊馬􅇫上驚雄劔匣中鳴半夜軍書至匈奴㓂六城中堅分暗陣太一起神兵出没風雲合蒼皇豺虎争今日邊庭戰縁賞不縁名五城道中云金鐃隨玉節落日河邊路沙鳴後􅀐來鴈起前軍度五城鳴斥堠三秦新召募天寒自登道寒濁隂山霧仍聞舊兵老尙在烏蘭戍笳簫漢思繁旌旗邊色故􅃦興倦􅃓甲勤役傷風露來逺賞不行鋒交勲乃茂未知朔方道何年罷兵賦塞下曲云蕃門部落能結束朝朝馳獵河南曲朝馳一作河曲暮獵兾燕歌未斷塞鴻飛牧馬群嘶邊草緑秦築長城城巳摧漢武北上單于䑓古來征戰虜不盡至今還復天兵來黃河東流流九折沙場埋恨何時絶蔡琰没去造胡笳蘇武歸來持漢節爲報如今都護雄匈奴且莫下雲中請書塞北隂山石願比燕然車功􅀐大暦十才子唐書不見人數盧綸錢起郎士元司空曉李端李益苗發皇甫曽耿偉李嘉祐又云􅁻頊夏侯審亦是或云錢起盧綸司空曉皇甫曽李嘉祐吉中孚苖發郎士元李益耿偉李端二李皆出於姑臧庻子爲文章李益尚書爲門户李益一日赴嘉㑹尙書曰今日兩箇坐頭皆是李益紅樓下聮句云佛刹接重城紅樓切太清紫雲連照耀丹檻望峥嶸宣廣榱棟烟虹入軒䆫日月平參差五陵晚分背八川明益李絃韻風􅀄過蓮枝浪欲傾敬瞻疑涌見圍繞學無生羔杜蘭陵僻居聮句云潘岳閑居賦陶潜獨酌謡二賢成徃事三徑是今朝宣廣生幸逢唐運昌時奉帝堯進思諧啓沃退混即漁樵益李蠧簡封延閣彫欄閟上霄相從清矌地秋露挹蘭苕杜羔天津橋􅀯山中各題一句云野坐分苔䂖益山行遶菊叢中韋執雲衣惹不破斍諸葛秋色望來空閑庭草色能留馬當路楊花不避人句笳簫漢恩繁旌旗邊色故句馬汗凍成霜句右張爲取爲主客圖以益爲清竒雅正主耿偉元日早朝云九陌朝臣滿三朝􅀱皷賖逺珂時接韻攅炬偶成花紫貝爲高闕黃龍建大牙參差萬㦸合左右八貂斜羽扇紛朱檻金爐隔翠華㣲風傳􅍼漏曉日上春霞環珮聲重疊蠻夷服等差樂和天易感山固壽無涯渥澤千年聖車書四海家盛明多在位誰得守蓬麻贈苖員外云爲郎日賦詩小謝少年時業繼儒門後心多道者期曉廻長樂殿新出永明祠行樂西園暮春風動柳􅁝許州書情􅀉韓張二舎人云謫䆠軍城老更悲近來頻夢到丹墀乍燃乍㓕心中火唯鑷唯多􅁂上􅁝繞院緑苔聞鴈處滿庭黃葉閉門時故人高歩雲衢上肯念前程杳未期贈嚴維云許詢清論重寂寞住山隂野客捿寒寺閑門當古林海田秋熟早湖水夜漁􅀷世上窮通理誰能柰此心贈公云來自西天竺持經奉紫㣲年深􅆊語變行苦俗人歸月上安禪乆苔生出院稀梁間有馴鴿不去爲無機早朝云鍾皷餘聲裏千官向紫㣲冒寒人語少乗月燭來稀清漏聞馳道紅霞映鏁闈猶看嘶馬處未啓掖垣扉秋日云􅝭照入閭巷憂來與誰語古道無人行秋風動禾􅁰書情逢故人云因君知此事流恨巳忘機客乆多人識年高衆病歸連雲潮色逺度雪鴈聲稀又説家林盡悽傷淚滿衣沙上鴈云衡陽多道里弱羽復哀音還塞知何日驚弦亂此心夜隂前侣逺秋冷後湖深獨立沙汀意寧知霜霰侵贈張將軍云寥落邊城暮重門返照間皷􅎏驚雨暗士馬過秋閑慣守臨邊郡曽營近海山􅀜西舊業在夜夜夢中還醻暢當云同遊􅃮沮後巳是十年餘㡬度曽相夢何時定得書月高城影盡霜重柳條踈且對樽中酒千般想未如篇姚合取爲極元集書情逢故人以下四偉寳應元年進士爲左拾遺詩有家貧僮僕慢官罷友朋踈世多傳之盧綸綸字􅁢言河中人大暦進士與吉中孚韓翃錢起司空曙苖發崔峒夏侯審李端皆能詩號大暦十才子春日登樓云花正濃時人正愁逢花却欲替花羞年來笑伴皆歸去今日晴明獨上樓長安春望云東風吹雨過青山却望千門草色閑家在夢中何日到春歸江上㡬人還川原繞繚浮雲外宫闕參差落照間誰念爲儒多失意獨將衰􅁂客􅀜秦正元中吉中孚爲翰林學士薦綸于朝會丁家艱而中孚卒大暦中李端錢起韓翃軰能爲五言詩詞情徤麗綸作尤工至正元末錢李諸公周落綸爲懷舊詩五十韻叙其事曰吾與吉侍郎中孚司空郎中曙苗員外發崔􅀘闕峒耿拾遺偉李校書端風塵追遊向三十載數公皆􅀒當時盛稱榮耀未㡬俱沉泉下傷悼之際常暢博士追感前事賦詩五十韻見􅀉輙有所酬以申悲舊兼􅀉夏侯審侍郎其歴言諸子云侍郎文章宗傑出淮楚靈掌賦􅀂吹􅄜司言如建瓴郎中善餘慶雅韻與琴清鬱鬱松帶雪蕭蕭鴻入冥員外眞貴儒弱冠􅀍華纓月香飄桂實乳溜􅄋瓊英􅀘闕思冲融巾拂藝亦精彩蝶戱芳圃瑞雲滋翠屏拾遺興難侔逸調曠無程九醖貯彌㓗三花寒轉馨校書才智雄舉世一娉婷暏墅􅀑神變属辭鵉鳯驚差肩曵長􅅂緫轡奉和鈴共賦瑶䑓雪同觀金谷笙􅀝天方比劔沉水忽如瓶君持玉盤珠冩我懷䄂盈讀罷涕交頥願言躋百齡綸之才思皆此􅀋也綸德宗時爲户部郎中舅韋渠牟表其才召見禁中帝有所作輙􅆳和異日問渠牟盧綸李益何在荅曰綸從渾瑊在河中驛召之會卒文宗尤愛其詩問􅌠相綸文章㡬何亦有子否李德􅁉對綸四子皆擢進士第在臺閣帝遣中人悉索家笥得詩五百篇以聞綸春詞云北苑羅裙帶塵衢錦綉鞋醉眠芳樹下半􅀍落花埋得嶺􅀯故人書云瘴海􅀉􅀟魚中霄逹我居兩行燈下淚一紙嶺􅀯書地說炎蒸極人稱老病餘慇懃祝賈􅁩莫共酒盃踈題興善寺後池云隔牎棲白鶴似與鏡湖鄰月照何年樹花逢㡬畨人㟁沙青有路苔逕緑無塵願得容依止僧中老此身山下古朩云高林巳蕭索夜雨復秋風墜葉鳴荒竹斜根擁斷蓬半侵山影裏長在水聲中此地何人到雲門去亦通送李端云故􅀜衰草遍離別自堪悲路出寒雲外人歸暮雪時少孤爲客慣多難識君遲掩涙空相向風塵何所期姚合取爲極元集􅀉嶺南故人以下四篇臘月觀咸寧王部曲娑勒擒豹歌云山頭曈曈日將出山下獵圍照􅀄日前林有獸未識名將軍促􅀐無人聲潜形踠伏草不動􅀟鵰旋轉群鵶鳴隂方質子纔三十譯語受詞蕃語揖捨鞍觧甲疾如風人忽虎蹲獸人立歘然扼䫙批其頥爪牙委地涎淋漓旣蘇復吼拗切於教仍怒果叶英謀生致之拖自􅀷叢目如電萬夫失容千馬戰傳呼拜賀聲相連殺氣騰陵隂滿川始知縳虎如縛䑕敗虜降羗在眼前祝爾嘉詞身無苦獻看將隨犀象舞苑中流水禁中山期爾攫搏開天顔非熊之兆慶無極願紀雄名傳百蠻送張侍郎還蜀歌云秦家御史漢家郎親傳兩印征殊方功成走馬朝天子伏檻談邊若流水曉離仙署趨紫㣲夜接高儒讀青史瀘􅀯五將望君還願以天書示百蠻曲棧重江􅀄過雨前旌後􅀐不同山迎車拜舞多􅂄老舊卒新營遍青草塞口雲生火候遲烟中鸖唳軍行早黃花川下水交橫逺應孤霞蜀國晴笻竹筍長椒瘴起荔支花發杜鵑紅回首岷峨半夜黒傳觴接膝何由得空令豪士仰威名無復貧交恃顔色垂楊不動雨紛紛錦帳胡瓶争送君湏􅁷醉起簫笳發空見紅旌入白雲韓翃字君平􅀯陽人命以駕部外郎知制誥時有兩韓翃德宗曰與詩人韓翃終中書舎人翃别韋兵曹歸池州云南陵八月天暮色逺峰前楚竹青陽路吳江赤馬􅂳贏金上客貴佩玉主人賢終日應相逐西歸定㡬年侯希逸鎭青淄翃爲從事罷府閑居十年李勉鎭夷門辟爲幕属時巳遲暮不得意多家居一日夜將半客叩門急賀曰員外除駕部侍郎知制誥翃愕然曰誤矣客曰邸報制誥闕人中書兩進名不從又請之曰與韓翃時有同姓名者爲江淮剌史又具二人同進御批曰春城無處不開花寒食東風御柳斜日暮漢宫傳䗶燭青煙散入五侯家又批曰與此韓翃客曰此員外詩耶翃曰是也是不誤矣時建中􅀄也奉送王相公縉赴幽州廵邊云黃閣開帷幄丹墀侍冕旒位高湯左相權揔漢諸侯不攺周南化仍分趙北憂􅀟旌過易水千􅀐入幽州塞草連天暮邊風動地秋無因隨逺道結束佩吳鈎南部新書云昇平公主宅即席李端擅場送王相之幽鎭翃擅場送劉相廵江淮錢起擅場德宗西幸有神智騘如意騮二馬謂之功臣一日有進瑞鞭者上曰朕有二駿今得此可爲三絶因吟翃觀調馬詩云鴛鴦赭目齒新齊晚日花開放碧蹄玉勒乍廻􅀄噴沫金鞭欲下不成嘶高仲武云韓員外意放經史興致繁冨一篇一詠朝野珎之多士之選也至如星河秋一鴈砧杵夜千家又客衣筒布細山舎荔支繁又踈簾看雪卷􅀷户映花􅀜方之前載則芙蓉出水未足多也其比興􅀷於劉員外䈥節减於皇甫冉也少年行云千㸃爛媥噴玉騘青􅁝結尾繡纒騌鳴鞭曉出銅臺路葉葉春衣楊柳風羽林云駿馬牽來御柳中鳴鞭欲向渭橋東紅蹄亂踏青城雪花頷驕嘶上苑風題薦福衡岳禪師房云春城乞食還高論此中閑僧臘堦前樹禪心江上山踈簾看雪捲􅀷户映花􅀜晚送門人去鍾聲杳藹間送孫革及第東歸云過淮芳草歇千里又東歸野水吳山出家林越鳥飛荷香隨去棹梅雨㸃行衣無數滄洲客如君逹者稀合取爲極元集少年行以下四章姚送故人歸魯云魯客多歸興居人愴别情􅀨餘衫袖冷風急馬蹄輕秋草靈光殿寒雲曲阜城知君拜親後少婦下機迎元集韋莊又世傳翃有寵􅁎柳氏翃成名從辟淄青置之都下數歳􅀉詩曰章䑓柳顔色青青今在否縱使長條似舊垂也應攀折他人手柳荅曰楊柳枝芳菲節可恨年年贈離别一葉隨風息報秋縱使君來豈堪折後果爲蕃將沙吒利所刼翃會入中書道逢之謂永訣矣是日臨淄大校置酒疑翃不樂具告之有虞􅀱將許俊以義烈自許即詐取得之以授韓希逸聞之曰似我徃日所爲也俊復能之翃後爲夷門幕府後生共目爲惡詩輕之李義山有韓翃舎人即事云萱草含丹粉荷花抱緑房鳥應悲蜀帝蟬是怨齊王通内藏珠府應官觧玉坊橋南荀令過十里送花香錢起起具興人天寳進士與郎士元齊名時語曰前有沈宋後有錢郎終考功郎中天寳十年試湘靈皷瑟詩云善皷雲和瑟常聞帝子靈馮夷徒自舞楚客不堪聽苦調凄金石清音入杳冥蒼梧來怨慕白芷動芳馨流水傳湘浦悲風過洞庭曲終人不見江上數峰青起從郷薦居江湖客舎聞吟於庭中曰曲終人不見江上數峰青視之無所見矣明年崔暐試湘靈皷瑟詩起即用爲末句人以爲􅀑謡奉送劉相公催運云國用資戎事臣勞爲主憂將徴任土貢更發濟川舟擁傳星還去過池鳯不留唯高飲水節稍餞别家愁落葉淮邊雨孤山海上秋遥知謝公興㣲月上江樓時以此詩爲擅場高仲武云詩格清竒理致清澹粤從登第挺冠詞林文宗右丞許以高格右丞没後貟外爲雄投齊宋之浮游削梁陳之靡嫚逈然獨立莫之與京且如鳥道掛踈雨人家殘夕陽又牛羊山上少煙火隔林􅀷又長樂鍾聲花外盡龍池柳色雨中􅀷皆特出意表摽凖古今又窮逹戀明主耕桒亦近郊則禮義克全忠孝兼著足可以引長名流爲後揩式送僧歸日東云上國縁隨去東途若夢行浮雲滄海逺去世法舟輕水月通禪觀魚龍聽􅆊聲唯憐惠燈影萬里眼中明送僧自吳逰蜀云隨縁忽西去何日􅝭東林世路無期别空門不住心人煙一飰少山雪獨行􅀷天外猿聲夜誰聞清􅆊音送張管書記云邊事多勞役儒衣逐皷􅎏日寒􅀜樹外峰盡塞雲西河廣蓬難度天遥鴈漸低班超封定逺之子去思齊送征鴈云秋空萬里静嘹唳獨南征風急翻霜冷雲開見月驚塞長憐去翼影㓕有餘聲悵望遥天外郷愁滿目生􅀉郎士元云龍節知無事江城不掩扉詩傳過客逺書别故人稀坐嘯看潮逺行春送鴈歸望舒三五夜思盡謝􅀇暉宿洞口館云野竹通溪冷秋蟬入户鳴亂來人不到寒草上堦生裴廸書齋望月云夜來詩酒意月上謝公樓影閉重􅀜静寒生獨樹秋鵲驚隨葉散螢逺入煙流今夕遥天末清暉㡬處愁送彈琴李長史赴洪州云抱琴爲傲吏孤棹復南行㡬度秋江水皆􅄈白雪聲佳期來客夢幽興緩王程佐牧無勞問心平政自平姚合取爲極元集􅀉郎士元以四章起還藍田王維贈别云草色日向好桃源人去稀手持平子賦目送老萊衣毎􅀱山櫻發時同海燕歸今年寒食酒應得􅝭柴扉起荅詩云卑栖却得性毎與白雲歸徇禄仍懷橘看山免採􅅔露巳霑衣採蕨頻一作别山昨日春空厭歸盈夢看花暮禽先去馬新月待開扉霄漢時廻首知音青􅃈闈王維春夜竹亭贈起歸藍田詩云夜静群動息時聞隔林犬却憶山中時人家澗西逺羡君明發去采蕨輕軒冕起荅云山月隨客來主人興不淺今宵竹林下誰覺花源逺惆悵曉鶯啼孤雲還絶巘贈闕下裴舎人云二月黃鶯飛上林春城紫禁曉隂隂長樂鍾聲花外盡龍池柳色雨中􅀷陽和不散窮途恨霄漢長懷捧日心獻賦十年猶未遇羞將白髪對􅂠簮東臯早春􅀉郎校書云禄㣲頼學稼歳起歸衡茅窮逹戀明主耕桒亦近郊夜來靈山雪陽氣動林梢萌蕙暖􅀄吐春鳩鳴欲巢蓬萊時入夢知子憶平交題玉山村叟壁云谷口好泉石居人能陸沉牛羊上山小煙火隔雲􅀷一徑入溪色數家連竹隂藏虹辭晚雨驚隼落殘禽渉趣皆流目將歸必在林却思黃綬事辜􅀒紫芝心逃暑太子李舎人别業云下馬失炎暑重門􅀷緑篁宫臣禮嘉客林表開蘭堂兹夕興難盡澄罍照墨場東陵晩來好目極趣何長鳥路掛踈􅀨人家殘夕陽城隅擁歸􅀐留醉戀群芳和張僕射塞下曲云月黒鴈飛高單于夜遁逃欲將輕􅀐逐大雪滿􅃓刀司空曙和耿拾遺元日早朝云元朔争朝闕奔流若㑹溟路塵和薄霧􅀐火接低星漏促􅀟魚鑰車喧百子鈴冕旒當翠殿幢㦸滿彤庭表歳方編瑞乗春即宥刑諸侯陳禹玉司暦獻堯蓂壽酒三觴退簫韶九奏停太陽開物象沛澤及生靈南陌祥光紫東方晚氣青自憐楊子賤歸草太元經立秋日云律變新秋至蕭條自此􅀄花酣蓮報謝葉在柳呈踈淡月多雲映清風似雨餘捲簾凉暗度却扇暑先除草静多翻燕波澄乍露魚今朝散􅀐省作賦興何如酬張芬有赦後見贈云紫鳯朝㘅五色書陽春忽報網羅除已將心變寒􅁅後豈料光生腐草餘建水風煙收客涙杜陵花竹夢郊居勞君故有詩人贈欲報瓊瑶恨不如晦日益州北池陪宴云臨泛從公日仙舟翠幕張七橋通碧澗􅀟樹接花塘玉燭收寒氣金波隱夕光野聞歌管思水静綺羅香遊􅀐縈林逺飛撓截㟁長郊原懷㶚産波漾冩江黃常侍傳花詔偏禆同羽觴豈令南峴首千載播餘芳曙字文􅀄廣平人登進士第從韋臯於劍南正元中爲水部郎中終虞部耿偉就􅀫因傷故人云舊時聞􅅇淚此夜重霑衣方恨同懷少那堪相見稀竹煙疑澗壑林雪似芳菲多謝勞車馬應憐獨掩扉經廢寳光寺云黃葉前朝寺無僧寒殿開池晴􅀛出曝松暝鶴飛廻古砌碑橫草隂廊􅀞雜苔禪宫亦銷歇塵世静堪哀春日野望􅀉錢起貟外云草長花落樹羸病強尋春無復少年意空餘華髪新青原晴見水白社静逢人􅀉謝南宫客軒車不見親喜外弟盧綸見宿云静夜無四隣荒居舊業貧􅀨中黃葉樹煙下白頭人似我獨沉乆媿君相見頻平生自有分况是蔡家親送王閏云相送臨寒水蒼然望故􅀜江蕪連夢澤楚雪入啇山話我他年舊看君此日閑因將自悲涙一灑别離顔新蟬云今朝蟬忽鳴覉客􅀂爲情漸覺一年謝能令萬感生㣲風􅀄滿樹落日稍沉城爲問同懷者凄凉聽㡬聲望水云高樓晴見水楚色靄相和野極空如練天遥不辨波永無人跡到時有鳥行過况是蒼茫外殘陽照最多哭麴象云憶昨秋風起君曽歎逐臣何言芳草日自作九泉人姚合取爲極元集耿就宿以下七篇苖發送司空􅍼之蘇州詩云盤門吳舊地蟬盡草秋時歸國人皆乆移家君獨遲廣陵經水宿建鄴有僧期􅀂到西霞寺應看江㧾碑送孫德諭罷官徃黔州州因􅀉家也孫父曽牧此云中歳分符典石城兩朝趍陛謁承明闕下昨陳歸老䟽天􅀯今切去郷情親知握手三秋别几杖扶身萬里行伯道暮年無嗣子欲將家事託門生發􅀳卿子終都官員外郎崔峒􅀉上禮部李侍郎云吳楚相逢處江湖共泛時任風舟去逺待月酒行遲白髪常同歎青雲本異期貴來君却少愁去我先悲玉佩明朝盛蒼苔陋巷滋追尋恨無路唯有夣相思江上書懷云骨肉天涯别江山日落時涙流􅁭上血髪白鏡中􅁝胡越書難到存亡夢豈知登高廻首罷形影自相隨喜逢妻弟鄭損因送入京詩云亂後自江城相逢喜復驚爲經多載别欲問小時名對酒悲前事論文畏後生遥知盈卷軸􅁓貴在江城詠門上􅀞小松上元王杜三相公云昔聞生澗底今見起毫端衆草此時没何人知歳寒豈能禆棟宇且貴出門䦨只在丹青意凌雲也不難題崇福寺禪師院云僧家竟何事掃地與焚香清磬度山翠閑雲來竹房身心塵外逺歳月坐中長向晚禪堂閉無人空夕陽峒有􅀄入集賢院贈李獻任詩峒與李􅀄同官於常山又有拜拾遺酬丘二十二見贈詩云江海乆垂綸朝衣忽掛身丹墀方謁帝白髪免羞人才愧文章士名當諫諍臣空餘薦賢分不敢􅀒交親嚴維送峒使徃睦州云如今相府共英髦獨往􅀯州肯苦勞氷水近開漁浦出雪雲􅀄卷定山高朩蘭花映桐廬縣青雀舟隨白鷺濤使者應湏訪廉吏府中唯有范功曹高仲武云峒詩文彩炳發意思雅淡如清磬度山翠閑雲來竹房又流水聲中視公事寒山影裏見人家此亦披沙錬金時時見寳也峒登進士第爲拾遺入集賢爲學士後終州剌史或云終元武令文藝傳云終右􅀘闕峒􅀉李明府云松堂寂寂對煙霞五柳門前集晩鵶流水聲中視公事寒山影裏見人家觀風共美新爲政計日還應更觸邪可惜陶潜無限酒不逢籬菊正開花李端古别離詩云水國葉黃時洞庭霜落夜行舟間啇賈􅀫在楓林下此地送君還茫茫似夢間後期知㡬日前路轉多山巫峽通湘浦迢迢隔雲雨天晴見海檣月落聞津皷人老自多愁水深難急流清霄歌一曲白首對汀洲贈郭駙馬詩云公主此詩席上成郭令公子曖尚昇平青春都尉最風流二十功成便拜侯金距闘鷄過上苑玉鞭駙馬出長楸薫香荀令偏憐小􅀓粉何郎不觧愁日暮吹簫楊柳陌路人遥指鳯凰樓又云方塘似鏡草芊芊􅀄月如鈎未上弦新開金垀看調馬舊賜銅山許鑄錢楊柳入樓吹玉笛芙蓉出水妬花鈿今朝都尉如相願願脫長裙學少年端趙州人始郭曖尙昇平公王賢明有才思􅀹多招士端等多從曖遊曖進官大集客端賦詩最工錢起曰素爲之請賦起姓又工於前客乃服端賦巫山高云巫山十二峰皆在碧虛中回合雲藏日霏㣲雨帶風猿聲寒過水樹色暮連空愁向髙唐望清秋見楚宫蜀路有飛泉亭中詩板百餘篇後薛能佐李福於蜀道過此題云賈椽曽空去題詩豈易哉悉去諸板唯留端巫山高一篇而巳贈苖發員外云朱户敞高扉青槐凝落暉八龍承慶重二虎逓朝歸坐竹人聲絶橫琴鳥語稀花慙潘岳貌年稱老萊衣葉暗新櫻熟􅁝長粉蝶飛應憐魯儒賤空與故山違茂陵山行陪韋金部云􅀫雨朝來歇空山天氣清盤雲􅀟鸖下隔水一蟬鳴古道黃花落平蕪赤燒生茂陵雖有病猶得伴君行雲際中峰云自得中峰住􅀷林亦閉􅀜經秋無客到入夜有僧還暗澗泉聲小荒崗樹影閑高亭不可望星月滿空山蕪城懷古云風吹城上樹草沒城邊路城裏月明時精靈自來去姚合取爲極元集贈苖發以下四篇冷朝陽登靈善寺塔云飛閣青霞裏先秋獨早凉天花映䆫近月桂拂簷香華岳三峰小黄河一帶長空聞指歸路煙處有垂楊中秋與空上人同􅀫華嚴寺云掃榻相逢宿論詩舊梵宫鍾聲迎皷盡月色過山窮庭簇安禅草牎飛帶火䖝一宵何惜别廻首隔秋風立春詩云玉律傳佳節青陽應北辰土牛呈歳稔綵燕表年春臘盡星廻次寒餘月建寅風光何處好雲物望中新流水􅀄銷凍潜魚欲振鱗梅花將柳色偏思越郷人潞州節度薛嵩有青衣善弹阮咸琴手紋􅀮起如紅線因以名之一日辤去朝陽爲詞曰採菱歌怨朩蘭舟送客䰟銷百尺樓還似洛妃乗霧去碧天無際水東流李嘉祐送朝陽登第歸江寜云高第猶佳句諸生似者稀長安帶酒别建業􅀱潮歸稚子歡迎棹鄰人爲掃扉含情過舊浦鷗鳥亦依依朝陽登大曆進士第爲薛嵩從事錢起送朝陽擢第後歸金陵覲省詩云萊子晝歸今始好潘園景色夏偏濃夕陽流水吟詩去明月青山出竹逢兄弟相親􅀄讓果郷人争賀舊登龍佳期少别俄千里雲樹愁看過㡬重唐詩紀事卷第三十
