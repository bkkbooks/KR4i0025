front:
  text: 唐詩紀事巻第七十八
  hash: sha256:7f53553bec14652c87f524e8c86058bcd0e94305a057f786759d06cb4148a701
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_078-1a}
body:
  text: 開元宫人楊氏女薛彦輔母林氏崔氏劉氏慎氏薛媛李季蘭侯氏如意中女子魚玄機僖宗宫人張建封妓女道士元淳裴柔之宫女開元宫人開元中賜邊軍纊衣製於軍中有兵士於短􅂁中得詩曰沙塲征戍客寒苦若為眠戰􅂁經手作知落阿誰邊蓄意多添線含情更着綿今生巳過也重結後生縁兵士以詩白帥帥進呈玄宗以詩遍示宫中曰作者勿隱不汝罪也有一宫人自言萬死上􅀷閔之遂以嫁得詩者謂曰吾與汝結今生縁邊人感泣楊氏女盈川姪女曰容華有新粧詩云宿鳥驚眠罷房櫳乗曉開鳯􅁫金作鏤鸞鏡玉為臺粧佀臨池出人疑月下來自憐終不見故厺復徘徊韓彦輔母林氏送男左貶詩云他日初投杼勤王在隱兵有辭期不罰積意許相仍謫䆠今何在御􅁈猶未勝天涯分越徼驟騎速毗陵膓斷腹非苦書傳寫豈能泪添江水逺心劇海雲蒸明月珠難識甘泉賦可稱但將忠報主何懼㸃青蠅彦輔開元時豋進士第右按薛播伯父元瞹終於隰城丞其妻濟􅀯林氏丹陽太守洋之妺善属文有子彦輔彦國彦偉彦雲及播兄據總並早孤悉爲林氏訓導立名開元天寳間彦輔劇等七人並舉進士連中科名衣冠榮之崔氏盧校書年暮取崔氏結䄜之後爲詩曰不怨盧郎年紀大不怨盧郎官職卑自恨妾身生校晩不及盧郎年少時劉氏或云趙氏杜羔不第將至家其妻劉氏先寄詩云良人的的有竒才何事年年􅀍放回如今妻靣羞君靣君到來時近夜來羔即廻尋登第又寄詩云長安此厺無多地鬱鬱葱葱佳氣浮良人得意正少年今夜醉眠何處樓雜言寄杜羔云君從淮海遊再過杜蘭秋歸來不湏臾又欲向梁州梁州􅁗嶺西棧道與雲齊羗虜萬餘落戟矛自髙低已念寡儔佀復慮勞攀躋丈夫重志氣女兒空悲啼臨卭滯遊地肯顧濁水泥人生賦命有厚薄君自遨遊我寂寞羔登貞元年進士第終工部尚書贈右僕射制云生於士族藴為公噐敦厚孝友本乎天性文學政事出於餘力自立朝右藹然素風司諌平刑駮訤廉問凡所踐歴不􅈈于位以年致政以疾就弟出處進退皆叶時中有詩墮李益門白樂天之詞也羔羔有至性父死河北母不知所之羔憂號終日後竟得其母又不知其父墓處復得其墓於佛相柱下後歴振武節度使愼氏毗陵愼氏三史嚴灌夫之妻以無子􅀍出有詩曰當時心事已相􅀜雨散雲收一餉間便是孤㠶從此去不堪重過望夫山遂如􅀄友議雲溪薛媛濠梁南楚材旅遊陳頴受頴牧之眷無返舊意其妻薛媛冩真寄之曰欲下丹青筆先拈寳鏡端已驚顔索寞漸覺鬢凋殘泪眼描將易愁膓冩出難恐君渾􅁯却時展􅀞啚㸔夫婦遂偕老焉友議雲溪時人嘲之曰當時婦弃天今日夫弃婦若不逞丹青空房應獨守李季蘭三峽流泉歌云妻家本住巫山雲巫山流水常自聞玊琴奏出轉寥敻直佀當時夢中聽三峽迢迢幾千里一時流入幽闈裏巨石崩崕指下生飛浪逺波絃中起初疑噴怒含雷風復佀嗚咽流不通廻湍曲瀬意將盡時復滴瀝平沙中憶昔元公為此曲能使仲容聽不足一彈既畢還一彈願北流泉鎮相續寄韓校書云無事烏程縣蹉跎歳月餘不知蘭閤吏寂寞意何如逺水浮仙棹寒星伴使車因過大雷岸莫忘八行書結素魚貽友人云尺素如殘雪結為䨇鯉魚欲知心裏事㸔取腹中書得閻伯鈞書云情來對鏡􅂴梳頭暮􅀨蕭蕭庭樹秋莫恠欄杆垂玉筯只縁惆悵對銀鈎送韓撥之江西云相㸔指楊柳别恨轉依依萬里江西水孤舟何處歸湓城潮不到夏口信應稀唯有衡陽鴈年年來厺飛季蘭五六歳其父抱於庭作詩詠薔薇云經時未架却心緒亂縱横父恚曰此必為失行婦也後竟如其言高仲武云士有百年女有四徳季蘭則不然形噐既雄詩意亦蕩自鮑昭已下罕有其倫如逺水浮仙棹寒星伴使車此五言之嘉境也上方班媫妤則不足下北韓英則有餘不以遲暮亦一俊嫗劉長卿謂季蘭為女中詩豪侯氏㑹昌中邊將張暌防戎十年餘其妻侯氏綉廻文作􅀛形詩詣闕進之詩云暌離已是十秋强對鏡那堪重理粧聞鴈幾回修尺素見霜先為製衣裳開箱疊練先垂泪拂杵調砧更斷膓綉作􅀛形獻天子願教征客早還鄉侯氏賜絹三百疋以彰才美出杼情詩如意中女子如意中女子年九歳能吟詩則天試之皆應聲而就其兄辭去則天令作詩送兄遂賦云别路雲愁起離亭葉正稀所嗟人異鴈不作一行飛出唐宋遺史裴柔之元微之自㑹稽拜尚書右丞到京未踰月出鎮武昌裴夫人柔之難之曰歳杪到家鄉先春又赴任鎮即贈詩曰窮冬到鄉國正歳别京華自恨風塵眼甞㸔逺地花碧憧還照曜紅粉莫咨嗟嫁得浮雲婿相隨即是家柔之荅曰侯門􅀄擁節御苑柳絲新不是悲殊命唯愁别是親黄鶯遷古木珠􅂂從清塵想到千山外滄江正暮春魚玄機臨江樹云草色連荒㟁烟姿入逺樓葉鋪秋水靣花落釣人頭根老蔵魚窟枝低拂客舟作傍拂一蕭蕭風􅀨夜驚夢復􅄈愁玄機咸通中西京咸宜觀女道士也字㓜㣲善属文其詩有綺陌春望逺瑶徽春興多又殷勤不得語紅泪一䨇流又焚香豋玉壇端簡禮金闕又雲情自鬱爭同夢仙貌長芳又勝花後以笞殺女童綠翹事下獄獄中有詩云易求無價寳難得有情夫又云明月照幽隙清風開短􅁭僖宗宫人唐僖宗自内出袍千領賜塞外吏士神䇿軍馬真於袍中得金鎻一枚詩二首云玉燭製袍夜金刀呵手裁鎻寄千里客鏁心終不開真就市貨鎻為人所告主將得其詩奏聞僖宗令赴闕以宫人妻真後僖宗幸蜀真晝夜不觧衣前後捍禦張建封妓樂天有和燕子樓詩其序云徐州張尚書有愛妓眄眄善歌舞雅多風態爲校書郎時遊淮泗間張尚書宴予酒酣出眄眄佐歡予因贈詩落句云醉嬌聲不得風嫋牡丹花一歡而去爾後絶不復知兹一紀矣昨日司勲員外郎張仲素繪之訪余因吟詩新有燕子樓詩三首辭甚婉麗詰其由乃眄眄所作也繪之從事武寧累年頗知眄眄始末云張尚書既歿彭城有張氏舊第中有小樓名燕子眄眄念舊愛而不嫁居是樓十餘年于今尚在眄眄詩云樓上殘燈伴曉霜獨眠人起合歡床相思一夜情多少地角天涯不是長又云北印松栢鎻愁烟燕子樓中思悄然自埋劍􅂂歌塵散紅袖香銷一十年又云適㸔鴻鴈岳陽廻又覩玄禽逼社來瑶瑟玉簫無意緒任從蛛網任從灰余甞愛其新作乃和之云滿窻明月滿簾霜􅀍冷燈殘拂卧床燕子樓中寒月夜愁來祗為一人長鈿帶羅衫色佀烟幾回欲起即潜然自從不舞霓裳袖疊在空箱二十年今春有客洛陽回曽到尚書墓上來見説白楊堪作柱忍教紅粉不成灰又贈之絶句黄金不惜賣娥眉揀得如花四五枝歌舞教成心力盡一朝身厺不相隨後仲􅀽以余詩示眄眄乃反覆讀之泣曰自公薨背妾非不能死恐百載之後人以我公重色有從死之妾是玷我公清範也所以偷生爾乃和白公詩云自守空樓歛恨眉形同春後牡丹枝舎人不㑹人深意訝道泉臺不厺隨眄眄得詩後徃徃旬日不食而卒但吟詩云兒童不識冲天物謾把青泥汚雪毫出長慶集宫女天寳末宫娥衰悴不願俻宫掖有落葉題詩隨御水而流云舊寵悲秋扇新恩寄早春聊題一紅葉將寄接流人顧况聞而和之云愁見鶯啼柳絮飛上陽宫女斷膓時君恩不禁東流水葉上題詩寄與誰既逹宸聰由是遣出禁中者有五使之號焉宣宗朝又有題紅葉隨流者為盧渥得之詩曰水流何太急深宫盡日閑殷勤謝紅葉好厺到人間女道士元淳寄洛中諸姊云舊國經年别􅀜河萬里思題詩憑鴈翼望月想蛾眉白髪愁偏覺歸心夢獨知誰憑離亂處掩泣向􅀯枝唐詩紀事巻第七十八
