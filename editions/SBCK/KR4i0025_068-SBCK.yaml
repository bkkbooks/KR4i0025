front:
  text: 唐詩紀事巻第六十八
  hash: sha256:5d9b20a382e499e1c3cc217637efd896ccc6f7f80bc2e256e950a2ef80d910e6
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_068-1a}
body:
  text: 湯文圭唐彥謙裴澈盧携韋莊呉融公乗億羅鄴羅衮湯文圭本殷文圭文圭池州人居九華小字桂郎苦學所用墨池底爲之穴舉進士中途遇一叟曰眉緑拳文入口神仙狀也如學道當冲虚爲儒當大有名於天下唐末詞塲請託公行文圭與游恭獨歩塲屋乾寧中帝幸三峯文圭携梁王表薦及第仍列牓中尋爲裴樞宣諭判官至大梁朱全忠表薦之既而由汴宋馳歸全忠大怒遣吏捕之不及矣自是屢言措大率皆負心毎以文圭爲證白馬之禍蓋自此也文圭事楊行宻終左千牛衞将軍子崇義自江南歸朝改姓湯名悦九華賀􅀨吟云陶公焦思念生靈變旱爲豐合杳冥雷劈老松疑虎怒雨衝隂洞覺龍腥萬畦香稻蓬䓗緑九朶竒峰撲亞青吟賀西成饒旅興散絲飛灑滿長亭贈池州張太守云神珠無纇玉無瑕七葉簮貂漢相家陣面奔星破犀象筆頭飛電躍龍蛇綘幃夜坐窮三史紅斾春行到九華只怕他人留不住别遷征鎮擁髙牙和友人送衡尚書赴池陽副車云淮王上將例分憂玉帳參承半列侯次第選材如創厦别離排宴向藏舟鵾鵬變化知難測龍蠖昇沉各有由􅉜蹀行牽金錂重嬋娟立唱翠娥愁築頭勲業諧三陣滿腹詩書究九流金海珠韜乗月讀肉芝牙茗撥雲收赤鱗斾巻鷗汀晚青雀􅊑撗鴈陣秋十字細波澄鏡面九華殘雪露峯頭醉沉北海千罇酒吟上南荆百尺樓况是昭明食魚郡不妨閑擲釣璜鈎正命云衆口聲光文圭賀池陽太守勲業佐淮王誇漠将築頭中秋自宛陵寄池陽太守云出山三見月如眉蝶夢終宵遶㦸枝旅客思歸鴻去日賢侯行化子來時郡樓遐想劉琨嘯相閤方窺謝􅀓棊按部况聞秋稼熟馬前迎拜羡并兒次韻九華杜先軰重陽寄投宛陵丞相云日下飛聲徹不毛酒醒時得廣離騷先生鬢爲吟詩白上相心因治國勞千乗信廻魚榼重九華秋逈鳯巢髙强酬小謝重陽句沙恨無金盡日淘寄賀杜荀鸖及第云一戰平疇五字勞晝歸鄉去錦爲袍大鵬出海翎猶濕駿馬辞天氣正豪九子舊山増秀絶二南新格變風騷由來稽古符公道平地丹梯甲乙髙主犯切馬首飾文圭詩中錂字文圭杜荀鸖楊䕫康軿夏侯淑王希羽等皆爲淮南将田頵上客文圭有羙名不應朱全忠錢鏐之辟頵置田宅迎其母以甥事之故文圭爲盡力䕫知頵不足亢楊行宻著溺賦以戒頵不用果敗文圭受薦於全忠復擬飾非投啓於公卿略曰於莬獵食非求尺璧之珍鶢鶋避風不望洪鍾之樂既登第即南歸俄爲多言者所發全忠捕之則不及矣或云文圭應舉嘗經大澤中驟􅀨震電衆駭躓獨安詳如不聞􅀨定傍人見其兩耳中􅀑神以泥封之後爲内翰曽草司空李徳誠麻潤毫久不至爲詩督之云紫殿西頭月欲斜曽草臨淮上相麻潤筆巳曽經奏謝更将章句問張華時論少之唐彥謙唐儉裔孫憲宗時終中書舍人次子持持子彦謙字茂葉歴慈綘澧三州刺史自號鹿同先生陶榖之祖也榖避晉祖諱改姓陶後遂不易識者非之中秋翫月云一夜髙樓萬景竒碧天無際水無涯只留皎月當層漢並送浮雲出四維霧靜不容􅀇豹隠水生唯恐夏蟲疑坐來離思憂将曉爭得嫦娥子知細上已寄韓八云上已接寒食鶯花寥落晨㣲㣲潑火􅀨草草踏青人凉似三秋景清無九陌塵與余同病者對此合傷神又云露白風清夜向晨小星乗佩且埋輪綘河浪淺休相隔滄海波深尚作塵天外鳯凰何寂寞世間烏鵲謾辛勤倚欄殿北斜樓上多少通宵不寐人八月十六日夜月云斷腸佳賞固難期昨夜消魂更不疑丹桂影空蟬有露緑槐隂在鵲無枝懶将吟咏聊惆悵早是踈頑耐别離堪恨賈生曽慟哭不縁清景爲憂時過長陵詩云耳聞明主提三尺眼見愚民盗一抔千古腐儒騎痩馬㶚陵斜日重回頭又題蒲津河亭云煙横愽望乗槎水月上文王避􅀨陵最善用事詠栁云惹絆風光别有情世間誰敢闘輕盈楚王江畔無端種餓損宫腰學不成彦謙學義山爲詩裴澈澈通登咸通進士第後爲相初左拾遺孟昌圖在蜀上䟽極諫僖宗田令孜惡之沉諸蟇頥江澈以詩弔曰一章何罪死何名投水惟君與屈平從此蜀江煙月夜杜鵑應作兩般聲盧携常題司空圗壁云姓氏司空貴官班御史卑老夫如且在不用歎屯竒携字子升乾符中爲相巢㓂表求天平節度不與欲倚髙駢立功巢遂入闗携仰藥死韋莊立春云青帝東來日馭遲暖煙輕逐曉風吹􅄢袍公子罇前覺錦帳佳人夢裏知雪浦乍開紅菜甲綵幡新剪緑楊枝殷勤欲獻冝春曲題向花牋帖繡楣長安清明云早是傷春夢雨天可堪芳草更芊芊内官初賜清明火上相閑分白打錢紫陌亂嘶紅叱撥緑楊髙映畫鞦韆遊人記得承平事暗喜風光似昔年感懐詩云長年方悟少年非人道新詩勝舊詩十畆野塘留客釣一軒春雨對僧碁花間醉任黄鶯語亭上吟從白鷺窺大道不将爐冶去有心重築太平基或謂此詩包括生成果爲台輔荘應舉時遇巢冦犯闕著秦婦吟云内庫燒爲錦繡灰天街踏盡公卿骨公卿多垂訝荘乃諱之時號秦婦吟秀才又有帝子夢魂煙水闊謝公詩思碧雲低最爲警䇿至若閑卧詩云誰知閑卧意非病亦非眠又手從彫扇落頭任漉巾偏識者知其不祥後誦子羙詩白沙翠竹江村暮相送紫門月色新吟諷不輟是歳卒於花林坊葬於白沙荘字端巳杜陵人見素之後曾祖少㣲宣宗中書含人荘踈曠不拘小節李詢爲兩川宣諭和恊使辟爲判官以中原多故潜欲依王建建辟爲掌書記尋召爲起居舍人建表留之後相建爲偽平章事荘爲王建管記時一縣宰乗時擾民莊爲建草牒云正當凋瘵之秋好安凋瘵勿使瘡痍之後復作瘡痍時以爲口實莊集詩人一百五十人得詩三百章爲又元集序云此蓋詩中鼓吹名下笙篁繋鳬氏之鍾霜清日觀淬雷公之劔影動星津雲間分合壁之光海上運摩天之翅奪造化而雲雷噴湧沒􅀑神而風雨奔馳但忍其食馬留肝徒云染指豈慮其烹魚去乙或致傷鱗呉融壬戌歳閿鄉卜居云六載抽毫侍禁闈不堪多病决然歸五陵年少如相問阿對泉頭一布衣伯起家阿對是泉至今尚在嘗引泉灌蔬其華清宫云中原無鹿海無波鳯輦鑾旂出幸多今日故鄉歸寂寞太平功業在山河四郊飛雪暗雲端唯此宫中落旋乾緑樹碧簷相掩映無人知道外邊寒漁陽烽火照凾闗玉輦怱怱下此山一曲羽衣聽不盡至今遺恨水潺潺闗東獻劉員外云昨夜星辰動仙郎近漢闗玳筵吟雪罷錦帳押春還巳到青雲上應捿綘圃間臨卭有辞賦一爲奏天顔融字子華越州人昭宗時爲翰林學士卒官李巨川爲華帥韓建掌書記昭宗至華清宫賜建御容一軸時巨川草謝表以示融其中有彤雲似盖以長隨紫氣臨闗而不度融吟味不已因草篇與巨川對壘略曰霧開五里克諧披覩之心掌拔一峯兼􅂇捧持之力松江晚泊云樹逺天疑盡江奔地欲隨孤㠶落何處殘日更新离客是凄凉本情爲繫滯枝寸腸無計免應只楚猿知紅樹云一聲南鴈已先紅槭槭凄凄葉葉同此是孤根非暖地莫驚他朩耐秋風燒煙散去隂全薄明月臨來影半空長憶洞庭千萬樹昭山撗浦夕陽中公乗億髙湜咸通末爲禮部侍郎士多繇權要于請湜曰吾决以至公取之得譴固吾分乃取億許棠聶夷中皆有文名億字夀仙魏人與李山甫皆爲魏愽樂彦禎幕府羅隠寄詩於易定云謝舞仍宫栁髙竒世少雙侍中生不到園今死須降班秩通烏府樽壘奉碧幢昭王有餘烈試爲禱迷邦億郎官上應列宿詩云北極佇文昌南宫曉拜郎紫泥乗帝澤銀印佩天光緯結三台側鈎連四輔傍佐啇依􅀓說仕漢笑馮唐委佩揺秋色峩冠帶晚霜自然符列象千古耀嵓廊秋菊有佳色云陶令籬邊菊秋來色轉佳翠攅千片葉金剪一枝花蘂逐蜂鬚亂英随蝶翅斜帶香飃緑綺和酒上烏紗散漫揺霜彩嬌妍漏日華芳菲彭澤見稱更在誰家臨江遲來客云江上晚沉沉煙波一望深向來殊未至何處擬相尋栁結重重眼萍翻寸寸心暮山期共眺寒渚待同臨北去魚無信南飛鴈絶音思君不可見使我獨愁吟億以詞賦著名咸通十三年别家十餘年矣嘗大病鄉人傳以死其妻自河北迎䘮㑹億送客馬上見婦人麄縗類其妻也睇睨不已妻亦如之詰之則是也相持而哭路人異之後旬日登第億嘗有詩云十上十年皆落第一家一半已成塵可知其屈矣羅鄴費拾遺書堂云滿袖歸來天桂香紫泥重䧏舊書堂自憐葦帶同巢許不駕蒲輪佐禹湯恠石盡㴠千古秀竒花多吐四時芳何人更肯追髙躅唯有樵童戯蘚牀雲詩云紛紛靄靄遍江湖得路爲霖豈合無莫使悠颺祗如此帝鄉還更暖蒼梧嵗仗云玉帛朝天萬國來鷄人唱曉五門開春排北極迎仙仗日捧南山入夀柸歌舜薫風鏘玉佩祝堯嘉氣靄樓臺可憐四海車書混重見蕭曹佐漢才牡丹云落盡春紅始見花花時比屋事豪奢買栽池舘恐無地㸔到子孫能幾家門倚長衢攅繡軛幄籠輕日䕶香霞歌鍾到此爭懽賞豈信流年鬢有華賞春云芳草和煙暖更青閑門要路一時生年年㸃撿人間事唯有春風不世情公子行云彫鞍玉勒照花明過後鄕風特地生半醉五侯門裏出月髙猶在禁街行鄴餘杭人父則爲塩鐵小吏有二子俱以文學上進鄴尤長七言詩時宗人隠亦以律韻著稱然隠才雄而踈鄴才清而緻咸通中崔安潜侍郎亷問江西志在弓旌竟爲幕吏所沮既而俯就督郵因兹舉事無成而卒羅衮清明登奉先城樓云年來年去只艱危春半堯山草尚衰四海清平耆舊見五陵寒食小臣悲煙銷井邑隈樓檻雪滿川原泥酒巵拭盡賈生無限淚一行歸鴈逺參差清明赤水寺居云榆火輕煙處處新旋從閑望到諸隣浮生浮世秪多事野水野花娱病身濁酒不禁雲外景碧峰猶冷寺前春蓑衣毳衲誠吾黨自結村薗一社貧羅隠梁開平中召拜夕郎不起衮以小天倅大秋姚公使兩浙以詩贈隠曰平日時風好涕流䜛書雖盛一名休寰區歎屈瞻天問夷貊聞詩過海求向夕便思青􅃈拜近年尋伴赤松逰何當世祖從人望早以公台命卓侯隠荅曰崑崙水色九般流飲即神仙憇即休敢恨守株曽失意始知縁朩更難求鴒原謾欲均餘力鸖髪那堪問舊逰遥望北辰當上國羡君歸棹五諸侯昭宗誅韓全誨等衮時爲左拾遺上言劉蕡當大和時宦官始熾因直言䇿請奪爵土復歸除之役遂羅譴逐死異􅁟六十餘年正人端士切齒飲泣使蕡䇿蚤用則杜漸防萌逆節可消帝感悟贈蕡左諫議大夫唐詩紀事巻第六十八
