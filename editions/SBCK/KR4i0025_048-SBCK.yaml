front:
  text: 唐詩紀事巻第四十八
  hash: sha256:45c382c1d84a9fc5ebf77b48a50d77500304aaa86827ab6b17dfa38192fd3ad3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_048-1a}
body:
  text: 李秘韋臯李德裕鄭還古裴航裴休呂羣徐商王傳韋渠牟陸長源盧宗回劉闢薛宜僚陸希聲崔季卿皇甫澈李秘禁中送任山中云子去非長徃君恩取大還補天留彩石縮地入青山獻夀千年外來朝數月閑莫抛殘藥物切欲駐童顔唐宗室也元和正元時人韋臯臯少遊江夏止於姜使君之館有小青衣曰玉簫纔十許嵗常侍臯臯後告别與約後㑹因留玉指環一枚并詩寄情云黄雀㘅來巳數春别時留解贈佳人長江不見魚書至爲遣相思夢入秦李德裕元和十一年嵗在丙申李逢吉下三十三人皆取寒素時有語曰元和天子丙申年三十三人皆得仙袍似爛銀文似錦相將白日上青天德裕頗爲寒素開路及謫官南去或有詩曰八百孤寒齊下淚一時回首望崖州言出摭上巳憶江南褉事云黄河西繞郡城流上已應無袚褉遊為憶渌江春水色更隨霄夢向呉州德裕營平泉莊逺方以異物奉之或題曰隴右諸侯供語鳥日南太守送名花及譴責或作詩云肉視具寮忘匕著氣吞同列削寒温當時誰是承恩者肯有餘波達􅀑村之句又云畫閣不開梁燕去朱門罷掃乳烏歸千嵓萬㕡應惆悵流水斜傾出武闈盖恨之也公離東都平泉有詩云十年紫殿掌洪鈞出入三朝一品身文帝寵深陪雉尾武皇恩重燕龍津黒山永破和親虜烏嶺全坈跋扈臣自是功高臨盡處禍來名滅不由人公漢州日夕遊房公西湖云丞相鳴琴地何年黯玉徽聲聞海内房公好琴偶因㣲月夕重敞故樓扉桃李蹊空在芙蓉客暫依唯怜濟川檝長與夜舟歸重題云晚日臨寒渚㣲風發櫂謳鳳城波自闊魚水運難留亭古思宏棟川長憶濟舟想公髙世志祗似化城游房公舊竹亭聞琴緬慕風流神期如對有作云流水音長在青霞意不傳獨悲形解後誰聴廣陵絃德裕論文曰沈休文以音韻為切重輕為難語雖甚工㫖則未逺未可以言文外意也古之辭髙者盖以言妙而工適情不取於音韻依四韻王粲有舉原安曹植七哀詩有四泥諧元勲佐漢舉信是也矣三韻班固多用恊韻倚歟意盡而止成篇不拘於隻耦韻十一韻者文選有五韻七故篇無足尤詞寡累句古辭如金石琴瑟尚於至音今則如􅁝竹鞞鼓迫於促節即知聲律之為其弊也世有非文章者曰詞不出於風雅思不越於離騷摸鴈古人何足貴也余曰譬諸日月雖終古常見而光景嘗新此所以為靈物者也嘗為文箴曰文之為物自然靈氣惚怳而來不思而至杼軸得之澹而無味琢刻藻繪弥不足貴如彼璞玉磨礱成器奢者為之錯以金翠美質既彫良寳斯弃此文之大㫖也劉三復謂德裕曰漁歌樵唱皆傳述作夢北述夢詩云賦命誠非薄良時幸巳遭君當堯舜日官接鳳凰曹目睇煙霄闊心驚羽翼髙夢中作此六句椅梧連鸖禁埤堄接龍韜西接羽林軍内署北連春宮我后憐詞客卿等是我門客先后朝曾宣諭吾僚並雋髦著書同陸賈待詔比王褒重價隣􅀇璧英辭淬寳刀泉流初落澗流於齒􅊯文賦稱言泉露滴更濡毫赤豹忻來獻彤弓喜暫櫜身赴􅏱海内無事者累月時西戎乞盟幽鎭二帥束羆盖真也詩稱赤豹黄非煙含瑞氣馴雉㓗霜毛静室便幽獨虛樓散鬱陶有小樓時燕語於此學士院有一室西南花光晨豔豔松韻晚騷騷畫壁看飛鸖山圖見巨鼇松鸖先是西壁畫内署垣牆皆有畫臨幸中使懼而圖焉海内曲龍山憲宗欲傍簷隂藥樹落落蔓蒲萄句悉此八遊者依然可想也是内署物色唯曾荷靜蓬池膾氷寒郢水醪初上腸每學士酒以酒味稍濃常和氷而飲禁中有酒方食皆蓬萊池魚膾夏至後頒賜水及燒香荔芰來自逺盧橘賜常叨亦䝉頒賜自後以道逺罷献先朝初臨御南方曾獻荔芰麝氣隨蘭澤霜華入杏膏恩光唯覺重携挈未為勞扇廻交綵翟鵰起颺銀絛轡待奚􅁝􅄃書期蜀客操盡規徒謇謇退舍尚忉忉内庭所覩此八句述􅀛顧垂金鈕鸞飛曵錦袍御溝楊柳弱天廐驌驦豪屢換青春直閑隨上苑遨煙仾行殿竹風折繞垣桃澣日遊戯此八句述聚散俄成昔悲愁益自熬毎懷仙駕逺更望茂陵號地接三茅嶺川迎五子濤子胥憤氣所作代稱海濤是五花迷􅀲歩暗石固䔉山牢蘭野凝青管梅洲動翠篙泉魚驚綵妓溪鳥避千旄感舊心猶絶思歸首更搔無聊燃宻炬誰復勸金舠實僚乃常顧形迹未嘗以此而相勸也余自到此絶無夜宴酒器中大者呼為舠嵐氣朝生棟城隂暝入濠望煙歸海嶠送鴈度江臯宛馬嘶寒攊呉鈎在錦㢭未能追狡􅇠空覺長江蒿水逾国千里風帆過萬艘閲川終古恨唯見暮滔滔德裕述夢詩記為夢中賦詩耳元㣲之和云聞有池塘什還因夢寐遭攀禾占類蔡詠豆放過曹莊蝶􅀇言秘羅禽藻思髙注云本篇稱六句皆夢中作故此三聮多證夢意巳下皆言同在翰林及翰苑故事若學士初入賜龍飛馬故有借騎銀杏葉之句青詔用麥紋􅁓故有麥􅁓侵紅㸃之句麻制例别通宵勘冩故有蘭燈熖碧髙之句學士宻邇銀臺每旦嘗聞門使勘契開鎻又院門有急命即鈴索門自揺習以為異故有吏傳開鎻契神撼引鈴絛之句學士無過從聚㑹之例時與李閑行寺觀而巳故有分阻盃盤㑹閑期寺觀遨之句乃皆唐之故事也鄭還古還古閑居東都將入京赴選桞當將軍者餞之酒酣以一詩贈桞氏之妓曰冶艶出神仙歌聲勝管絃詞輕白紵曲歌遏碧雲天未擬生裴秀如何乞鄭玄不堪金谷水横過墜樓前桞喜甚曰專伺榮命以此為賀未幾還古除國子愽士桞見除目即遣入京及嘉祥驛而還古物故乃放妓他適逸史載還古初娶桞氏女嘉㑹之初夢娶房氏後柳卒再娶東都李氏属房直温為東洛少尹李之舅也禮宴皆房主之始知舊夢之前定也還古登元和進士苐裴航長慶中裴航下第遊鄂渚傭舟還都有樊氏女同載航賂其侍兒以詩求達曰同為胡越猶懷思况遇天花隔錦屏儻若玉京朝㑹去願隨鸞鸖入青蓂樊荅詩曰一飲瓊漿百感生􅀇霜搗盡見雲英藍橋便是神仙宅何必﨑嶇上玉清世傳藍橋雲英之事未必信姑載於此裴休贈黄蘖山僧希運詩曰自從大士傳心印額上圓珠七尺身挂錫十年棲蜀水浮盃今日渡漳濵一千龍象隨髙歩萬里香華結勝因擬欲事師為弟子不知將法付何人休㑹昌中官于鍾陵請運至郡以所解一篇示之師不顧曰若形於􅁓墨何有吾宗休問其故曰上乗之印唯是一心更無别法心體一空萬縁俱寂如大日輪升於虛空其中照耀靜無纎埃證之者無新舊無淺深説之者不立義解不開户牗直下便是動念即乖其後休録之為傳心法要云休字公美孟州人大中六年為相能文章為人醖藉進止雍閑宣宗曰休眞儒者呂羣羣元和十一年下第遊蜀性不容下僕馭怨之至眉州題詩所寓寺之東壁其一云路行三蜀盡身及一陽生頼有殘燈火相依坐到明其二曰社後辭巢燕霜前别蔕蓬願為胡蝶夢飛去覔闗中吟訖淚下意緖不堪未幾為其奴所殺徐商王傳商鎭襄陽有副使節判同加章綬商以詩賀之云朱紫花前賀故人兼榮此㑹頗闗身同年坐上聮賔榻宗姓亭中布錦裀晴日照旗紅灼爍韶光入隊影玢璘芳菲解􅂇今朝喜嫰蘂青條滿眼新觀察判官將仕郎監察御史王傳和云朱紫聮輝照日新芳菲全屬斷金人華筵重處宗盟地白雪飛時郢曲春仙府色饒攀桂侣蓮花光讓握蘭身自憐亦是膺門客吟想恩榮氣益振朝議郎江州刺史叚成式和云雲雨軒懸鶯語新一篇佳句占陽春銀黄年少偏欺酒金紫風流不讓人連璧坐中斜日滿貫珠歌裏落花頻莫辭倒戴吟歸去看欲東山又吐茵商宣宗時為山南東道節度使咸通四年為宰相封東莞縣子商與曹確楊收路巖同秉政有嘲之者曰確確無餘事錢財揔被收商人都不管貨賂幾時休傳登大中三年進士第初貧窶於中條山萬固寺入院讀書家廟碑云隨僧洗鉢韋渠牟貞元元年渠牟為大府卿與金吾李齊運度支裴延齡京兆尹嗣道皆承恩寵薦人多得名位時劉老師穆寂皆科目渠牟主穆寂齊運主老師㑹齊運朝對上嗟其羸弱許以致仕而老師失據無名子嘲之云太尉朝天外穆老尚書倒地落劉郎劉禹錫曰名場􅇖嶮如此出古今詩話渠牟南山四皓賛云煥煥煌煌為珪為璋孰光乎不耀之光幽幽深深為山為林孰繫乎不繫之心足知乎虛室生白􅀇門不闗流水去住清風徃還豈比乎稷契在世巢由在山一物有累兩心不閑者哉閑之謂何簮居薜蘿本不干我豈云其他熈熈忻忻與時為春匡漢避秦惟兹四人于德之濵不迷其津繪事後素孰知其故想像儀刑念兹丹青曄曄紫芝深谷逶迤俛仰今古空林徃時鳳豈無德鸞皆有羣出處嘿語商山白雲渠牟述之從子也少警悟攻為詩李白異之授以古樂府去為道士不終更為浮屠巳而復冠韓滉表試校書郎德宗誕日詔徐岱趙需許孟容與渠牟及佛老二師並對麟德殿質問大趣渠牟有口辯雖三家未究解然荅問鋒生帝聴之意動遷秘書郎後倚延齡為姦利勢熖可炙擢太常卿卒權載之叙其文曰初君年十一嘗賦銅雀臺絶句右拾遺李白見而大駭因授以古樂府之學且以瓌琦軼抜為巳任至弱冠乃喟然曰四始五際今既逺矣㑹情性者因於物象窮比興者在於聲律盖辨以麗以則得於無間合於天倪者其在是乎彼思休稱謝永嘉如芙蓉出水鍾嶸謂范尚書如流風廻雪吾知之矣遂苦心藻慮儷詞比事纎宻清巧度越羣倫嘗著天笁寺十六韻魯郡文忠公序引而和之使畫工圖於仁祠摘句配境偕為勝絶又於江南著卧疾三十韻晉國忠肅公手翰以美之曰草木獨立其在我韋生乎其為名臣宗公所稱賞如此又與竟陵陸鴻漸杼山僧皎然為方外之侶沉冥慱約為日最乆而不名一行不滯一方故其曵羽衣也則曰遺名攝方袍也則曰塵外披儒服也則今之名字著焉周流三教出入無際寄詞詣理必於斯文陸長源孟東野以樂府戱贈云蓮子不可得荷花生水中猶勝道傍桞無事蕩春風長源荅云芙蓉初出水菡蓞露中花風吹著枯朩無柰值空槎東野有夷門雪贈主人云夷門貧士空吟雪夷門豪士皆飲酒酒聲歡閙入雲霄雪聲激切悲枯杇悲歡不同歸去來萬里春風動江桞長源荅云好丹與素道不同失意得途事皆别東隣年少樂未英南客思歸腸欲絶千里長河水復氷雲鴻􅁳冥楚山雪酬東野新居見寄云大道本夷曠髙情亦冲虛因隨白雲意偶逐青蘿居青蘿分䝉宻四序無慘舒餘情濯子衿散彩還吾廬去嵗登羙第榮名在公車將必繼管蕭豈惟躡應徐首夏尚清和殘芳徧丘墟褰幃䕃䆫桞汲井滋園􅂼達者貴知心古人不願餘愛君蔣生徑且著茂陵書長源呉人贍於學德宗以宣武節度使董晉儒愞詔長源為司馬佐之持法峭刻晉卒長源緫留後事軍亂殺之盧宗回長安慈恩寺塔詩云東方曉日上翔鸞西轉蒼龍拂露盤渭水冷光揺藻井玉峯晴色墮欄杆九重宮闕參差見百二山河表裏觀暫輟去蓬悲不定一凭金界望長安宗回登元和進士苐劉闢登樓望月云圓月當新霽髙樓見最明素波流粉壁丹桂拂飛甍下瞰千門静旁觀萬象生梧桐䆫下影烏鵲檻前聲嘯逸劉琨興吟資庾亮情遊人莫登眺迢逓故鄉程又云皎潔三秋月巍峩百丈樓下分征客路上有美人愁帳巻芙蓉帶簾褰玳瑁鈎倚䆫情􅄅􅄅慿檻思悠悠未得金波轉俄成玉筯流不堪三五夕夫壻在邊州闢字太初擢進士宏詞科佐韋臯府後為西川節度以叛誅薛宜僚宜僚以左庻子充新羅冊贈使至青州恱一妓叚東美賦詩曰阿母桃花方似錦王孫草色正如煙不須更向滄溟望惆悵懽情又一年到外國謂判官苖甲曰東美何故頻見夢中數日而卒櫬至青叚奠之一慟而卒陸希聲古之善書鮮有得筆法者希聲得之凢五字擫押鈎格扺用筆􅀟鈎則㸃畫遒勁而盡妙矣謂之撥鐙法希聲自言昔二王皆傳此法至陽氷亦得之希聲以授沙門􅈯光􅈯光入長安為翰林供奉希聲猶未達以詩寄􅈯光云筆下龍蛇似有神天池雷雨變逡巡寄言昔日不􅀛手應念江頭洴澼人􅈯光感其言引薦希聲於貴倖後至相希聲愽學善屬文相昭宗在位無所輕重以太子太師罷李茂正犯京師輿疾避難卒崔季卿晴江秋望云八月長江萬里晴千帆一道帶風輕盡日不分天水色南是岳陽城季卿峒之從孫也皇甫澈正元十四年澈刺蜀州賦四相詩序云蜀州刺史㕔壁記㞐相位者前後四公謨明弼諧遷轉歷此顧已無取忝跡於斯景行遺烈嗟嘆之不足也謹述其行事詠其休美庶將來君子知聖朝之德云爾中書令漢陽王張柬之周曆革元命天歩值艱阻烈烈張漢陽左袒清諸武休明神器正文物舊儀覩南向翊大君西宮朝聖母作補文借韻用茂勲鏤鍾鼎鴻勞食茅土至今稱五王卓立邁萬古中書令鍾紹京景龍仙駕逺中禁姧釁結謀猷叶聖朝披鱗奮英節清宫閶闔啓滌穢氛沴滅紫極重昭回皇天新日月從容廟堂上肅穆人神恱唐元佐命功煇煥何烈烈禮部尚書門下侍郎平章事李峴時來偶明聖道濟寧邦國猗歟瑚璉器竭我股肱力進賢黜不肖措枉舉諸直宦官既却坐權竪亦移職載踐每若驚三巳無愠色昭昭垂憲章來世實作則門下侍郎平章事王縉舟檝濟巨川山河資秀氣昭膺究儒業屈指取髙位北征戮驕悍東守輯携貳論道致巍巍持衡無事事知巳不易遇宰相固有器瞻事華壁中來者誰其嗣唐詩紀事巻第四十八
