  text: 唐詩紀事巻第十
  hash: sha256:81e29e597879186bab372229e2051fa9d3045e02ea5ac2b0e85b3d48ee1978f7
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_010-1a}
body:
  text: 趙彦昭崔日用李乂盧藏用馬懷素薛稷劉允濟李元紘李嶠蘇瓌蘇頲趙彦昭上幸薦福寺令賦詩云初地龍飛後金身佛現時千花開國界萬善累重基北闕承行幸西園属住持天衣拂舊石王舍起前祠刹鳳迎琱輦幡虹駐綵旗同霑小雨􅃳仰詠大風詩九日臨渭亭云秋豫凝仙覽宸遊轉翠華呼鷹下鳥路戲馬出龍沙紫菊冝新壽丹茰辟舊邪湏陪長乆宴嵗嵗奉吹花安樂公主入新宅詩云雲物中京曉天人外館開飛橋像河漢懸牓學蓬萊北闕臨仙檻􅀯山送壽杯一窺輪奐畢慙恧棟梁材人日清暉閣應制云出震乗東陸慿髙御北辰祥雲應早嵗瑞雪􅀱初旬庭樹千花發堦蓂七葉新幸承今日宴長奉萬年春侍宴韋嗣立庄云賢族唯題里儒門但署鄉何如表嚴洞宸翰發輝灮地在兹山曲家憐郃水陽六龍駐旌罕四壯耀旂常北斗臨台坐東山入廟堂天髙羽翼近主聖股肱良野竹池亭氣村花澗谷香縱然懷豹隱空愧躡鵷行白鹿觀應制云雲驂驅半景星蹕坐中天國誕玄宗聖家尋碧落仙玉杯鸞薦壽寳筭鸖知年一覩灮華旦忻承道德篇登驪山寓目應制云皇情遍九垓御輦駐昭回路若隨天轉人疑近日來河看大禹鑿山見巨靈開願扈封鑾駕常持薦壽杯人日翫雪應制云始見青雲干律吕俄逢瑞雪應陽春今日廻看上林樹梅花柳絮一時新七夕應制云青女三秋節黄姑七日期星橋度玉珮雲閣掩羅帷河氣通仙掖天文下睿詞今宵望雲漢應得見蛾眉慈恩寺九日應制云乗秋節登髙出􅆊宫皇心滿塵界佛跡現虚空日月冝長壽人天得大通喜聞題寳唱受記莫由同立春日侍宴别殿内出綵花應制云剪綵迎初候攀條冩故真花隨紅意發葉就緑情新嫩色驚㗸鷰輕香誤採人應為薫風拂能令芳樹春人日侍宴大明宫應制云寳契無為屬聖人琱輿出幸翫芳辰平樓半入􅀯山霧飛閤旁臨東野春夾路穠花千樹發垂軒弱桞萬條新處處風􅊍今日好年年願奉屬車塵悼右僕射楊再思詩云兩揆光天秩三朝奉帝熈何言集大鳥忽此喪元􅀛坐歎公槐落行聞宰樹悲壑舟今已去寜有濟川期彦昭字奐然甘州人少豪邁風骨秀爽景龍中為相以權幸進後御史郭震震也非元劾暴舊惡姚崇惡之貶江州别駕卒崔日用正月七日宴大明殿詩云新年宴樂坐東朝鐘皷鏗鍠大樂調金屋瑶筐開寳勝花牋彩筆頌春椒曲江苔色氷前液上苑梅香雪裏嬌宸極此時飛聖藻微臣竊抃預聞韶望春宫迎春應制云東郊草物正薫聲素滻鳬鷖戲緑汀鳳闕斜通長樂觀龍旂直逼望春亭􅊍風遥艶蘭英紫淑景依遲柳色青渭浦明晨脩禊事群公傾賀水心銘送金城公主云聖后經綸逺謀臣計畫多受降追漢䇿築館許戎和俗化烏孫壘春生積石河六龍今出餞䨇鶴願為歌宴長樂公主新宅云銀燭金屏坐碧堂只言河漢動神􅊍主家盛明歡不極才子能歌夜未央餞唐永昌云洛陽桴皷今不鳴朝野咸推重太平冬至氷霜俱怨别春來花鳥若為情慈恩寺九日應制云紫宸歡毎洽紺殿法初隆菊泛延齡酒蘭吹觧愠風咸英調正樂香􅆊遍秋空臨幸符天瑞重陽日再中日用為御史中丞賜紫是時佩魚湏有特恩亦因宴命群臣撰詞日用曰臺中䑕子直湏諳信足跳梁上壁龕倚飜燈脂汚張五還來囓帶報韓三莫浪語直王相大家必若賜金􅀛賣􅁍苗兒相報賞中宗亦以金魚賜之立春遊苑應制云乗時迎氣正璿衡㶚滻煙氛向曉清剪綺裁紅妙春色宫梅殿柳識天情瑶筐綵鷰先呈瑞金縷晨鷄未學鳴聖澤陽和冝宴樂年年捧日向東城上宴日日用起舞自歌云東舘揔是鵷鸞􅀯臺自多􅂎梓日用讀書萬卷何忍不蒙學士墨制簾下出來微臣眼看喜死其日以日用兼修文館學士制曰日用書窮萬巻學富三冬日用舞蹈拜謝日用滑州人中宗時武三思宗楚客權寵交煽日用多所結納才辯絶人能乗機反禍取富貴韋氏平遂為相嘗謂人曰吾平生所事皆適時制變不專始謀然每一反思若芒刺在背云明皇時日用猶被寵眷帝賦詩宴遊多預酬唱送張說廵邊應制云吉日四黄馬宣王六月兵擬清鷄鹿塞先指朔方城日用有才辯惟是姦佞耳中宗時七日應制云曲江苔色氷前液上苑梅香雪裏嬌亦佳語也李乂陪幸臨渭亭詩云青陽御紫㣲白雪下彤闈浹壤流天霈綿區灑帝輝水如銀度燭雲似玉披衣為得因風起還來就日飛送沙門元奘等還荆州云初日承歸㫖秋風起贈言漢珠留道味江壁返真源地出南關逺天廻北斗尊寜知一柱觀却啓四禪門芙蓉園應制云水殿臨丹籞山樓遶翠微昔遊人託乗今幸帝垂衣澗篠縁峰合巗花逗浦飛朝廻曲池地無處不灮輝陪幸韋嗣立㽵云樞掖調梅暇林園種槿初入朝榮劒履退食偶琴書地隱東巗室天廻北斗車旌門臨􅌄窱輦道属扶踈雲罕明丹谷霜笳徹紫虛水疑投石處溪似釣璜餘帝澤頒巵酒人歡頌里閭一承黄竹咏長奉白茆居景龍四年正旦賦栢樹詩云勁節凌冬勁芳心待嵗芳能令人益壽非止麝含香陪幸長寜公主㽵云紫禁乗宵動青門訪水嬉貴遊鱣序集仙女鳳樓期合宴簮紳滿承恩雨露滋北辰還捧日東館幸逄時陪奉五王宅云家住千門側亭臨二水傍貴遊開北第宸睠幸西郷曵履迎中谷鳴􅁝出後堂浦疑觀萬象峰似駐三􅊍草向瓊筵樂花承繡扆香聖情思舊重留飲賦雕章三㑹寺應制云睿德揔無邊神臯擇勝縁二儀齊法駕三㑹禮香筵漢闕中黃近秦山太白連臺疑憲鳥日池似刻鯨年滿月臨真鏡秋風入御絃小臣叨下列持管謬窺天薦福寺應制云象設隆新宇龍潜想舊居碧樓披玉額丹枕導金輿代日興灮近周星掩曜􅀄空歌清沛筑􅆊樂美何書帝造環三界天文賁六虚康哉孝理日崇德在真如人日清暉閣應制云上日登臺賞中天御輦飛後庭聮舞唱前席仰恩輝睿作風雲起農祥雨雪霏幸陪人勝節長願奉垂衣安樂公主山庄云金輿玉輦背三條水閣山樓望九霄野外初迷七聖道河邊忽覩二靈橋懸泉滴滴依虹箭清吹泠泠雜鳳簫向晚平陽歌舞合前溪更轉朩蘭橈白鹿觀應制云制蹕乗驪阜廻輿指鳳京􅀯山四皓謁西岳兩重迎雲幄臨玄圃霞杯薦赤城神明近福地何必徃蓬瀛登驪山寓目應制云崖巘萬尋懸居髙敞御筵行戈疑駐日歩輦若昇天城闕霧中近關河雲外連謬陪登岱駕忻奉濟汾篇望春宫迎春應制云東城結宇敞千尋北闕廻輿且四臨麗日祥煙承罕畢輕荑弱草藉衣簮春商重㳫雲巗近河渭縈紆霧壑深謬接鵷鴻陪賞樂還欣魚鳥遂飛沉春啇恐是春字誤春日遊苑喜雨云仙蹕九成臺香筵萬壽杯一旬􅀄降雨二月早聞雷葉向朝躋宻花含宿潤開幸天承澤遍無使日光催興慶池應制云神池汎濫水盈科仙蹕䊸餘歩輦過縱棹洄㳂萍溜合門軒眺賞麥風和潭魚在藻供遊詠谷鳥含櫻入賦歌寄語乗查溟海客匝頭來此問天河宴安樂公主新宅云牽牛南度象昭回學鳳樓成帝女來平旦鵷鸞歌席上方宵鸚鵡獻酬杯餞唐永昌云田郎才貎出咸京潘子文華向洛城願以深心留善政當令強項謝髙名餞唐州髙使君云淮源之水清可以濯君纓彼美稱才傑親人佇政聲歳寒疇曩意春晚别離情終歎臨岐逺行看擁傳榮餞許州宋司馬云展驥旌時傑談鷄羙代賢暫離仙掖務追送近郊筵地慘金商節人康壁假田從來昆友事咸以佩刀傳慈恩寺九日應制云涌塔臨玄地髙層瞰紫微鳴鑾陪帝出攀橑翊天飛慶洽重陽壽文含列象輝小臣叨載筆欣此頌巍巍和晦日駕幸昆明池云玉輅尋春賞金堤重晦遊川通黒水浸地派紫泉流晃朗扶桑出綿聮樹􅂎周烏疑埋海處人似隔河秋刼盡􅁅猶識年移石故留汀洲歸棹晚簫皷雜汾謳人日侍宴大明宫應制云詰旦行春上苑中慿高御下大明宫千年執象寰瀛㤗七日為人慶賞隆鐡鳳曾騫揺瑞雪銅烏細轉入祥風此時朝野歡無筭此歳雲天樂未窮奉和三日祓禊渭濵云上林花鳥暮春時上巳陪遊樂在兹此日欣逢臨渭賞昔年空道濟汾詞乂爲紫微侍郎與蘇頲對掌綸誥明皇曰前有味道嶠朕今有頲乂皆號蘇李時宰輔子將授太廟頲草詞乆不就曰以遵仲尼之問而未能續乂曰何不云冝採方山之能頲伏其敏乂字尚真趙州人年十二工屬文薛元超曰是子且有海内名沈正方雅識治體時稱有宰相器初為黄門侍郎開元􅀄姚崇為紫微令乃薦為侍郎外託引重實去其紏駮權畏又明切也未幾卒於刑部尚書兄尚一尚正俱有名同為一集號李氏花蕚集終清尚一博州刺史源尉尚正盧藏用幸安樂公主西㽵應制云皇女瓊臺天漢潯星橋月宇創山林飛蘿半拂銀題影瀑布環流玉砌隂菊酒香隨鸚鵡泛簫樓韻逐鳯凰吟瑶池蹕駐思方乆璧月無文興轉深餞唐州髙使君云餞酒臨豐樹褰帷出魯陽蕙蘭春已曉桐栢路猶長祖逖方城鎮安期外氏郷從來二千石天子命惟良餞許州宋司馬云國為休徴選輿因仲舉題山川襄野隔朋酒㶚亭暌零􅀨征軒鶩秋風别驥嘶驪歌一曲罷愁望正凄凄慈恩寺九日應制云化塔龍山起中天鳳輦迂綵梳牽􅀞刹雜珮冐香茰寳葉擎千座金英漬百盂秋雲飃聖藻霄極捧連珠主弟夜宴云侯家主第一時新上席花年不惜春珠缸綴月那知夜玉斚流霞畏底晨宋主簿鳴臯夢趙六未及報而陳子云亡追為此詩荅宋兼貽平昔遊舊云暮川罕停波朝雲無留色故人琴與詩可存不可識識心尚可親琴詩非故人鳴臯􅀄夢趙蜀國已悲陳感化傷淪㓕䰟交昔未申􅁳期失幽報兹理復今晨前嗟成後泣巳矣將何及舊感與新悲虛懷疇昔時趙侯鴻寳氣獨負青雲姿群有含妙識衆象懸清機雄談盡物變精義觧人頥在隂既獨善幽躍自為疑踠彼千里足傷哉一尉欺陳生冨清理卓􅕸兼文史思縟巫山雲調逸岷江水鏗鏘哀忠義感激懷知巳負劒登薊門孤遊入燕市浩歌去京國歸守西山跂幽居探元化立言見千祀埋沒經濟情良圖竟云已坐憶平生遊十載懐嵩丘題書滿古壁採藥遍巗幽子微化金鼎僊笙不可求榮哉宋與陸名宦美中州在亡一暌阻岐路方悠悠自余事山海及兹人世改傳聞當世榮皆入古人名無復平原賦空餘隣笛聲泣對西州使悲訪北邙塋新墳蔓宿草舊􅏱毁殘銘為君成此曲因言寄友生黙語無窮事凋傷共此情藏用字子潜幽州人初隱終􅀯少室二山中時有意當世人目為隨駕隱士晚乃狥權利司馬承禎將還山藏用指終􅀯曰此中大有佳處承禎徐曰以僕視之仕宦之捷徑耳藏用終黄門侍郎馬懷素慈恩寺九日應制云季月啓重陽金輿陟寳坊御旗横日道仙塔儼雲庄帝蹕千官從乾詞七耀光顧慙文墨職無以頌時康中宗立春游苑應制云玄籥飛灰出洞房青郊迎氣肇初陽仙輿蹔下冝春苑御醴行開薦壽觴映水輕苔猶隱緑縁堤弱柳未舒黄唯有裁花飾簮鬢相隨聖藻狎年􅊍興慶池侍宴應制云積水逶迤繞直城含虛皎鏡有餘清圖雲曲樹連緹幕映日中塘間綵旌賞洽猶聞簫管沸歡留更睹木蘭輕無勞海上尋仙客即此蓬萊在帝京正月七日宴大明殿云日宇千門平旦開天容萬象列昭回三陽􅀱節金為勝百福延祥玉作盃就暖風􅊍偏着柳辭寒雪影半藏梅何幸得參詞賦職自憐終乏馬卿才安樂公主山㽵云主家臺沼勝平陽帝幸歡娯樂未央掩映琱䆫交極浦參差繡戸遶廻塘泉聲百處歌傳曲樹影千重舞對行聖酒一霑何以報唯忻頌德奉時康望春宫迎春應制云綵眊琱輿俯碧潯行春御氣發皇心揺風細柳縈馳道映日輕花出禁林遍野園亭開帟幕連堤草樹狎衣簮謬參西掖霑堯酒願沐南薫觧舜琴送金城公主云帝子今何在重姻適異方離情愴宸掖引路遶關梁望絶園中柳悲纒陌上桑空余願黄鶴東顧憶廻翔宴安樂公主新宅云鳳樓􅌄窱凌三襲翠幌玲瓏瞰九衢複道中宵留宴衎彌令上客想踟蹰餞唐永昌云聞君出宰洛陽隅賔友稱觴餞路衢别後相思在何處祗應􅏱下望仙鳬餞唐州髙使君云外牧資賢守斯人奉帝俞淮􅀯膺建隼渭北斬分符坐歎煙波隔行嗟物候殊何年昇美廻看北城隅餞許州宋司馬云頴川開郡邑角宿分􅄤野君非仲舉才誰應題輿者憫憫琴上鸖蕭蕭路傍馬嚴程若可留别􅃑希再把懷素字惟白潤州人師李善武后時爲監察御史李逈秀歛賕諉法懷素劾罷之轉禮部外郎開元初爲昭文館學士薛稷送金城公主云天道寜殊俗慈仁乃戢兵懷荒寄赤子忍愛鞠蒼生月下瓊娥去星分寶婺行關山馬上曲相送不勝情安樂公主山庄云主家園囿極新䂓帝郊遊豫奉天儀歡宴瑶臺鎬京集賞賜銅山蜀道移曲閣交映金精板飛花亂下􅃢瑚枝借問今朝八龍駕何如昔日指仙池望春宫迎春應制云九春風景足林泉四野雲霞敞御筵花鏤黄山繡作苑草圖玄㶚錦爲川飛觴趂醉心廻日走馬争先眼着鞭喜奉仙遊歸路逺直言行樂不言旋宴安樂公主新宅云秦樓宴喜月徘徊妓筵銀燭滿庭開坐中香氣排花出扇後歌聲逐酒來餞唐永昌云河洛風煙壯市朝送君飛鳬去漸遥更思明年桃李月花紅柳綠宴浮橋餞許州宋司馬云令弟與名兄髙才振兩京别序聞鴻鴈離章動鶺鴒逺鵬追翰墨勝地寫丹青風月相思夜勞望頴川星慈恩寺九日應制云寳宫星宿刼香塔􅀑神功王遊盛塵外眷覽出區中日宇開􅀄景天詞掩大風微臣謝時菊薄綵入芳叢秋日還京陜西十里作云驅車越陜郊北顧臨大河隔河見郷邑秋風水增波西城咸陽途日暮憂思多傳巗旣紆鬰首山亦嵯峨操築無昔老採薇有遺歌客遊既回換人生能㡬何得之陜郊篇謂此作也杜子羙云少保有古風稷善書􅀞􅀞蹤閻立本書師禇河􅀯時稱買禇得薛不落節稷字嗣通毋魏鄭公女也為中書舍人與從祖兄曜更踐兩省俱以辭章自名睿宗立自少常數日拜中書侍郎參知機務歴太子少保以翊賛功恩絶群臣竇懷正誅稷以知本謀賜死萬年獄劉允濟詠琴詩云昔在龍門側誰想鳴鳯時雕􅅣今為器宫啇不自持巴人緩踈節楚客弄繁􅁝欲作髙張引飜成下調悲允濟字允濟河􅀯人少與王勃齊名垂拱四年明堂成奏賦述功德除著作郎遷鳳閣舍人坐二張昵狎除青州長史以内憂去官服除召為修文館學士既乆斥喜甚與家人樂飲數日卒經廬岳廻望江山想洛川有作云􅀛山帝始營龍門禹初鑿出入經變化俯仰憑寥郭未若兹山功連延並巫霍東北䟽艮象西南距坤絡宏阜自鬰盤髙標復廻薄勢入柴桑渚隂開彭蠡壑九江杳無際七澤紛相錯雲雨㪚呉㑹風波騰鄢鄂跡隨造化乆利與乾坤博肹蠁精氣通紛綸潜恠錯石渠忽見踐金房安可託地入天子都巗有仙人藥二門㡬迢逓三宫何儵爚咫尺窮杳冥跬歩皆恬漠才驚羽翰幽居靜龍蛇蠖明牧振雄詞地華殊灼灼盛業匡西夏深謀賛禹亳黄雲覆鼎飛絳氣横川躍佐暦符賢運人其茂天爵禮樂冨垂髫詩書成舞勺清輝靖嵓電利器騰霜鍔遊聖挹衢樽隣㡬恭木鐸牆仞包武侯波瀾控文若旋聞刈薪楚遽都升葵藿稷卨郭圖良平公輔略重臣資出守英藩諒求瘼䂊章觀偉材江州訪靈崿陽岫曉氛氲隂崕暮蕭索潜伏屢鯨奔雄飛更鷙搏驚􅚦透煙霞騰猿亂枝格故園有歸夢他山飛賞樂帝郷徒可遊皇溪終旅泊景物觀淮海雲霄望河洛城闕紫微星圖書玄扈閣神功多粉繢元氣猶斟酌丞相下􅀯宫將軍趍北落横簮並輝蟬烈鼎俱調鸖四郊時迷路五月先投龠池榭喧瓊管風花亂珠箔舊遊勞夢寐新知無恱樂天寒欲贈言歳暮期交約夜琴清玉柱秋灰變緹幕風雲動翰林宫徴調文籥言泉激為浪思緒飛成繳千里輝珠璣五采含丹艧鐘皷旋驚鷃瑾瑜俄抵鵲竊價慙庸怠叨聲逾寂寞長望限􅀯溟居然翳東郭時推此詩為當李元紘緑墀怨云征馬噪金珂嫖姚向北河緑苔行跡少紅粉涙㾗多寳屋粘花絮銀筝覆網羅别君如昨日青海鴈頻過相思怨云望月思氛氲朱衾􅂴更薫春生翡翠帳花㸃石榴裙鷰語時驚妾鶯啼轉憶君交河一萬里仍隔數重雲元紘字大綱京兆人開元中為相務峻崖檢抑奔競夸進者憚之宋璟曰李公引宋遥之美黜劉晃之貪為國相家無留儲雖季文之德何以加之送張説上集賢學士元紘應制得私字云碩儒延鳳詔金馬被鴻私饌玉還丹禁牋花降紫墀御恩傾㫖酒皷舞詠康時暫纂群書緝逾昭盛業丕接筵欣有命搦管愧無詞自驚一何幸太陽還及葵李嶠三㑹寺應制云故臺蒼頡里新邑紫泉居歳在開金寺時來降玉輿龍形雖起刹鳥跡尚留書竹是蒸青外地仍㸃墨餘天文灮聖草寶思合真如謬奉千齡旦忻陪十地初又陪幸臨渭亭詩曰同雲接野煙飛雪暗長天拂樹添梅色過樓助粉妍光含班女扇韻入楚王絃六出迎仙藻千箱荅瑞年送沙門元奘等還荆州詩云三乗歸淨域萬騎餞通莊就日離亭近彌天别路長荆􅀯旋杖鉢渭北限津梁何日紆真乗還來入帝郷幸太平公主􅀯庄詩云主家山第接雲開天子春遊動地來羽騎參差花外轉霓旌遥颺日邊廻還將石溜調琴曲更取峰霞入酒杯鸞輅巳辭烏鵲渚簫聲猶繞鳯凰臺送張亶赴朔方應制云玉塞徴驕子金符命老臣三軍張戍斾萬乗飾行輪猛氣凌玄朔崇恩降紫宸投醪還得士辭第本忘身露下鷹􅀄擊風髙鴈欲賔方銷塞北祲遂静漠南塵薦福寺應制云􅀿詔開香域嬰林降綵旃還窺圖鳳宇更坐躍龍川桂轝朝群辟蘭宫列四禪半空銀閣斷分砌寳繩連甘雨蘇燋澤慈雲動沛篇獨慙賢作礪空喜福成田陪遊苑遇雪云散漫祥雲逐聖廻飄飄瑞雪遶天來不能落後争飛絮故故迎前定早梅剪綵花應制云幸聞年欲至剪綵學芳辰綴緑竒能似裁紅巧逼真花從篋裏發葉向手中春不與時􅊍競何名天上人人日清暉閣應制云三陽偏勝節七日最靈辰行慶傳芳蟻升髙綴綵人階前蓂候月樓上雪驚春今日衘天造還疑上漢津安樂公主山庄云黄金瑞牓綘河隈白玉仙輿紫禁來碧樹青岑雲外聳朱樓􅀞閣水前開龍舟下瞰鮫人室羽節髙臨鳳女臺遽惜歡娯歌吹晚揮戈却使耀靈廻人日大明宫應制云鳳城景色巳含韶人日風光陪覺饒桂吐半輪迎此夜蓂開七葉應今朝魚猜氷凍行猶澁鸎喜春驚弄欲嬌愧奉登髙揺采翰欣逢御氣上丹霄春日遊苑喜雨詩園林春正歸入苑弄芳菲宻雨迎仙歩低雲拂御衣危花霑易落度鳥濕難飛膏澤登千􅁃歡情遍九圍送金城公主云漢帝撫戎臣􅁝言命錦輪還將弄機女逺嫁織皮人曲怨江山月粧消道路塵所嗟穠李樹空對小榆春九日應制云令節三秋晚重陽九日歡仙杯還泛菊寳饌且調蘭御氣雲霄近乗髙宇宙寛今朝萬壽引冝何曲中彈字得歡正月中宗上清暉閣遇雪嶠賦詩云千鍾聖酒御筵披六出祥英亂繞枝即此神仙對瓊圃何湏轍跡向瑶池七夕應制云靈匹三秋㑹仙期七夕過查來人泛海橋渡鵲填河帝縷昇銀闕天機罷玉梭誰言七襄詠重入五絃歌嶠字巨山為兒時夢人遺􅀟筆自是有文詞十五通五經二十擢進士第與駱賔王劉灮業齊名相中宗其仕也􅀄與王勃楊盈川接中與崔融蘓味道齊名晚諸人沒獨為文章宿老一時學者取法焉嶠汾隂行云君不見昔日西京全盛時汾隂后土帝親詞齊宫宿􅃦設厨供撞鐘鳴皷樹羽旗漢家四葉才且雄賔延萬靈朝九戎栢梁賦詩髙宴罷詔書法駕幸河東河東太守親掃除奉迎至尊導鑾輿五營將校列容衛三河縱觀空里閭回旌駐蹕䧏靈場焚香奠醑邀百祥金鼎發食正焜煌靈祗煒燁攄景灮埋玉陳牲禮神畢舉麾上馬乘輿出彼汾之曲嘉可游朩蘭為檝桂為舟櫂歌微吟綵鷁浮簫皷哀鳴白雲秋歡娯宴洽賜群后家家復除戸牛酒聲明動天樂無有千秋萬嵗南山壽自從天子向秦關玉輦金車不復還珠簾羽葢長寂寞鼎湖龍髯安可攀千齡人事一朝空四海為家此路窮雄豪意氣今何在壇場宫館盡蒿蓬路逢古老長歎息世事回環不可測昔時青樓對歌舞今日黄埃聚荆棘山川滿目淚沾衣冨貴榮華能㡬時不見只今汾水上惟有年年秋鴈飛天寶末明皇乘春登勤政樓命梨園弟子歌數闋有唱歌至冨貴榮華能㡬時以下四句帝春秋衰邁問誰詩或附李嶠因凄然涕下􅃍起曰嶠真才子也及其年幸蜀登白衛嶺覽眺良乆又歌是詞復曰嶠誠才子也髙力士以下揮涕乆之嶠有三戾性好榮遷憎人陞進性好文章憎人才華性貪濁憎人受賂有鋪曰白衛鋪今其名見於此利州昭化縣之南境與劒門相接張亶自朔方入朝中宗於西苑迎之從臣宴于桃花園嶠歌曰歳去無言忽顦􅷑時來含笑吐氛氲不能擁路迷仙客故欲開蹊侍聖君趙彦伯曰紅蕚競然春苑曉芋葺新吐御筵開長年願奉西王讌近侍無慙東朔才又一從臣歌曰源水叢花無數開丹跗紅蕚間青梅從今結子三千嵗預喜仙遊復摘來明日宴承慶殿上令宫女善謳者唱之詞既婉歌仍妙絶樂府號桃花行皮日休松牎録云中宗常召宰相蘇瓌李嶠之子進見時皆童年帝謂曰汝等各以所通書取宜奏吾者言之頲應曰木從繩則正后從諌則聖嶠二子亡其名亦奏曰斮朝渉之脛剖賢人之心帝曰蘇瓌有子李嶠無兒蘇瓌九日應制云重陽早露晞睿賞瞰秋磯菊氣先薫酒茰香更襲衣清切􅁝桐㑹縱横文雅飛恩深荅効淺㽜醉未宸暉興慶池侍宴應制云金闕平明宿霧收瑶池式宴俯清流瑞鳳飛來隨帝輦祥魚出戲躍王舟帷齊緑樹當筵宻蓋轉緗河接㟁浮如臨竊比微臣懼若濟叨陪聖主遊瓌字昌容武功人以正立朝相中宗睿宗陳當世利病甚多蘇頲送金城公主云帝女出天津和戎轉􅄢輪川經㫁膓望地與析支隣奏曲風嘶馬衘悲月伴人旋知偃兵革長是漢家親興慶池應制云降鸖池前廻歩輦棲鸞樹杪出行宫山灮積翠遥相逼水態含青近若空直視天河垂象外俯窺京室􅀞圖中皇歡未使恩波極日暮樓舡更起風宴安樂公主新宅云車如流水馬如風仙史髙樓十二重天上􅀄移衡漢匹中憐歌舞夜相逢餞唐州髙使君云春日奏對時東風揺蕩夕浩然思樂事飜復餞征客淮水春流清楚山暮雲白勿言行路逺所貴專城伯九日應制云并數登髙日延齡命賞時宸游天上轉秋物􅀨來滋降鸖承仙取吹花入睿詞微臣復何幸長得奉饒私字得時頲字廷石㓜敏悟一覽至千言初除左司禦率府曹參軍吏侍馬載曰古稱一日千里蘇生是矣長安中為中書舍人時瓌同三品父子同在禁筦榮之開元中為相世為名宰相綽威瓌頲四寒食宴于中舍兄弟宅云子推山上歌龍罷定國門前細駟來始覩元昆鏘玉至旋聞季子佩刀廻晴花處處因風起御柳條條向日開自有長筵歡不極還持綵勝詠􅀯陔和晦日駕幸昆明池云炎暦事邉陲昆明如鑿池䂊遊灮後聖征戰罷前規霽色清弥宇年芳入錦披御杯蘭薦葉仙仗柳交枝二石分河冩􅀟珠代月移微臣此翔詠恩廣自無涯瓌初未知頲一日有客詣瓌候於客次頲擁篲庭廡間遺落一文字客取視之乃詠崐崙奴詩云指如十挺墨耳似兩張匙異之良乆瓌出與客淹留言詠以其詩問瓌何人豈非足下宗庻之孽也瓌備言其事客驚訝之請瓌加禮收舉必蘇氏之令子也瓌稍稍親之有人獻兎懸於廊廡瓌召令詠之曰兎子死蘭彈將來掛竹竿試將明鏡照無異月中看瓌覽詩異之由是學問日新文章蓋代及帝平内難日夕制詔駱驛無非頲之所作時稱小許公人日侍宴大明宫應制云䟽龍磴道切昭回建鳳旗門繞帝臺七葉仙蓂承月吐千株御柳拂煙開􅀄年競帖冝春勝長命先浮獻壽杯是日最靈知竊幸群心就捧大明來頲㓜年有京兆尹過瓌命詠尹字曰丑雖有足甲不全身見君無口知伊少人韋嗣立拜中書令瓌署官告頲為之詞薛稷書時謂三絶東明觀道士周彦雲欲為其師立碑謂瓌曰成某志不過煩相君諸子五郎文也頲六郎書八分詵善七郎致石瓌大笑口不言而心服其公長安盛春遊頲製詩云飛埃結紅霧遊葢飃青雲明皇嘉賞以御花親揷其巾上時榮之望春宫應制云東望春灮正可憐更逢晴日柳舍煙宫中下見􅀯山盡城上平臨北斗懸細草偏承新輦處輕花㣲落奉觴前宸遊對此歡無極鳥哢聲聲入管絃扈從明皇出雀䑕谷應制云雨施廵方罷雲從訓谷廻宻途汾水衛清蹕晉郊陪寒着山邊靜春當日下來御祠元鳥應仙仗緑楊開作頌音傳雅觀文色動台更知西向樂宸藻恊鹽梅惟此一篇明皇時作頲詩盡是中宗時作唐詩紀事卷第十
