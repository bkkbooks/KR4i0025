  text: 唐詩紀事卷第五十四
  hash: sha256:f5e52e600b0e3da9f35c6250c64523822d22c8dccae8c1c9e515d5f8682bb16b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_054-1a}
body:
  text: 韋表㣲羅引信高崇文王智興劉綺莊馬戴孟遲􅀯卓鄭顥李群玉温庭筠周繇韋表微表微字子明韋皐鎮西川王緯司空曙獨孤良弼裴說居幕府厚相推挹以表微比衛玠自以不能及也遷中書舎人敬嘗語左右欲相二韋會崩事表㣲處厚以父池州夫子廟麟臺碑銘曰二儀旣閉三象乃乖聖道埋鬱人心不開上無文武下有定哀吁嗟麟兮孰爲來哉周雖不綱孔實嗣聖詩書旣刪禮樂太定勸善懲惡姦邪乃正吁嗟麟兮克昭符命聖道時君化行位尊茍或乖戾身窮道存於昭魯邑栖遑孔門吁嗟麟􅀆孰知其仁運極數殘德至時否楚國䆮廣􅁗封益侈墻仞迫阨﨑嶇闕里吁嗟麟兮靡有攸止世治則麟世亂則麏出非其時麋鹿同群孔不自聖麟不自祥吁嗟麟兮天何所亡羅引信柳詩云粧􅀧青春更有誰青春常許占先知亞夫營畔風輕處元亮門前日暖遲花宻苑如飄六出葉繁何惜借䨇眉交情别緒論多少好向仁人贈一枝詠白菊云雖􅀍風霜競欲催皎然顔色不低摧巳疑素手能粧岀又似金錢未染來香散自宜飄渌酒葉交仍得䕃蒼苔尋思閉戸中霄見應認寒䆫雪一堆弘信字德孚魏州人爲魏博節度使高崇文崇文夲薊門將校討劉闢有功爲西川節度使渤海鄙言呼人爲􅐴兒一旦雪下崇文謂賔客曰某雖武夫亦有一詩乃吟曰崇文崇武不崇文提戈出塞號將軍那箇􅐴兒射鴈落白毛空裏雪紛紛或謂北齊敖曺之比也􅃈云出此夢王智興智興為徐州節度一日從事於使院會飲賦詩智興召䕶軍俱至從事屏去翰墨智興曰適聞作詩何獨見某而罷復以牋陳席上小吏亦置牋於智興前於是引毫立成曰三十年前老徤兒剛􅀍郎官遣作詩江􅀯花桞從君詠塞北煙塵獨我知四座驚嘆監軍謂張祐曰觀兹盛事豈得無言祐乃獻詩曰十年受命鎭方隅孝節忠規兩有餘誰信將壇嘉政外李陵草句右軍書左右曰書生謟辭耳智興叱曰有人道我惡汝軰又肯否張生海内名士篇什豈易得天下人間且以為王智興樂善矣劉綺莊楊州送人詩云桂檝木蘭舟楓江竹箭流故人從此去望逺不勝愁落日低㠶影歸風引棹謳思君折楊桞淚盡武昌樓置酒云酒熟人湏飲春還鬢巳秋願逄千日醉得逭百年愁卒卒周􅁎旦捿捿魯孔丘平生能㡬日不及且遨遊􅀹善樂府嘗守藩服與白敏中崔元式韋琮相知宣宗時人也馬戴易水懷古詩云荆􅀸西去不復返易水東流無盡期落日蕭條薊城北黄沙白草狂風吹送客南遊云擬卜何山隱高秋指岳陽葦乾雲夢色橘熟洞庭香踈􅀨殘虹影回雲背鳥行靈均如可問一為􅂘清湘河梁別云河梁送别者行􅂘半非親此地足征戰胡天多殺人金罍照離席寳瑟凝青春中秋夜對月云隂魄出海上望之増苦吟冷搜驪頷重寒徹􅑕胎深皓氣籠諸夏清􅊍射萬岑悠然天地内皎㓗一般心校獵曲云楚子畋郊野布􅅈籠天涯浮雲張作羅萬草結成􅆯意在絶飛鳥臂弓腰鏌鋣逺將射句踐次欲誅夫差壯志一朝攄湯綱本來踈露氣寒光盡微陽下楚丘猿啼洞庭樹人在木蘭舟古句楚江懷夜乆遊子息月明岐路閑句却憶軒羲日無人尚戰功句右張爲取作主孟遲懐鄭泊云風蘭舞幽香􅀨葉墮寒滴美人來不來前山看向夕發蕙風舘遇隂不見九華山有作云我來淮隂城千江萬山無不經山青水碧千萬丈竒􅈐急􅉽何縱横又聞九華山山頂連青冥太白有逸韻使我西􅀯行一歩一攀䇿前行正鷄鳴隂雲冉冉忽飛起千里萬里危崢嶸譬如天之有日蝕使我昬沉猶不明人家䰙鏡救不得光影却属貪狼星恨亦不能通言亦不足聽長鞭揮馬出門去是以九華為不平遲字遲之登㑹昌五年進士第廣陵城云紅映樓臺緑遶城城邊春草傍墻生隋家不向此中盡汴水應無東去聲又有過垓下之句云天地有時饒一擲江山無主任平分過驪山云冷月微煙渭上愁華清宮樹不勝秋霓裳一曲千門鎻白盡梨園弟子頭巳上數篇張為取作主客圖遲與杜牧之友善牧之嘗有池州送遅詩其間云烟濕樹姿嬌􅀨餘山態活仲秋徃歴陽同上牛磯歇大江吞天去一練橫紳抹歴陽裴太守􅁭韻苦超越鞔鼓􅀞騏驎㸔君擊狂節離䄂颭應勞恨粉啼還咽明年忝諌官緑樹􅁗川闊子提徤筆交􅀔若夸父盡他繁華當時能獵賢保國兼保家乆困名塲咸通末戴佐大同軍幕棠徃謁之一見如舊相識留連數月但詩酒而巳未嘗問所欲一旦大會賔友命使者以棠家書授之棠驚㬽莫知其來啓緘即知戴潜遣一介䘏其家矣戴與姚合善合其詩云天府鹿鳴客幽山秋未歸我知方甚善衆說以爲非隔石聞泉細和風見鸖飛新詩此處得清峭此應稀合又有送戴下第客遊詩云昨夜送君處亦是九衢中此日慇懃别前時寂寞冋鳥啼寒食雨花落暮春風向晚離人别筵收樽未空戴酬姚合歸字韻詩云歧路非人見尚得起心中日憶瀟湘渚春生蘭桂叢鳥啼花半落客散爵方空所贈誠難荅冷然一雅風蠻家云領得賣珠錢還歸銅柱邊㸔兒調小象打鼓新􅂳醉後眠神樹耕時語瘴煙不逄寒便老相問莫知年夕次淮口云天涯秋光盡木末群鳥還夜乆遊子息月明岐路閑風生淮水上㠶落楚雲間此意竟誰見行行非故􅀜夕發邠中路却􅀉舒從事云飲酣走馬别馬後鏁邉城日落月未上鳥棲人獨行方馳故國戀復愴長年情久夜不能息何當閑此生楚江懷古云露氣寒光集微陽下楚丘猿啼洞庭樹人在木蘭舟廣澤生明月蒼山夾亂流雲中君不見竟夕自悲秋金華子云戴大中􅀄掌書記於大原李司空幕以正言􅀍斥貶龍陽尉行道興詠以自傷其方城懷古云申胥任向􅁗庭􅂘靳尚終貽楚國羞新春聞赦云道在掅讒息仁􅀷疾苦除堯聦能下渇九衢林馬檛千門識車轍奏臺破心膽黥陣驚毛髪子固屈一鳴余固宜三刖又曰丹鵲東飛來喃喃送君札呼兒旋聲去供衫走馬空踏襪手把一枝物桂花香帶雪喜極至無言笑餘翻不悅又送遲詩云手撚金僕姑腰懸玉轆轤􅐡頭峰北正好去係取可汗鉗作奴六宮雖念相如賦其郍防邊重武夫堯聦能下渇必有脱字金華子云遲陳商門生為浙西掌書記以䜛罷至淮􅀯崔相國奏掌書記後以詩􅀉浙右幕中曰由來惡舌駟難追自古無媒謗所歸句踐豈能容范蠡李斯何暇救韓非巨拳豈為鷄揮肋強弩那因䑕發機慚愧故人同鮑叔此心江桞尚依依􅀯卓子厚在桞州吕温嘲之曰桞州桞剌史種桞桞江邊桞管依然在千株桞拂天後卓爲黔􅀯經略使故人嘲曰黔􅀯􅀯太守􅀯郡在雲􅀯閑向􅀯亭醉􅀯風變俗談􅀄爲拾遺與崔黯因諌出宰陸爲支江卓爲松滋卓贈副戎等詩曰翶翔曾在玉京天墮落江􅀯路幾千從事不湏輕縣宰滿身猶帯御爐烟卓字昭嗣大中時爲黔􅀯觀察使鄭顥顥宰相絪之孫登甲科以起居郎尚主有噐識宣宗時恩寵無比嘗夢中得句云石門霧露白玉殿莓苔青續成長韻此一聮杜甫集中詩也大中十年顥放牓後謁假覲省於洛生徒餞長樂驛俄有紀於屋壁云三十驊騮一烘塵來時不鎻杏園春楊花滿地如飛雪應有偷遊曲水人舊史云顥絪之子尚宣宗女萬壽公主因壽昌節上壽回夢一宫殿與十數人納凉聮句旣悟省石門之句十字恠其不祥不數日宣宗弓劒上僊方悟其事乃續爲十韻云間歳流虹節歸軒出禁扄奔波逃畏景蕭洒夢殊庭境象非曽到崇嚴昔未經日斜烏歛翼風動鶴踈翎異苑人爭集凉臺筆不停石門霧露白玉殿莓苔青若匪灾先兆何縁思入冥御爐虛仗馬華蓋負云亭白日成千古金縢閟九齡小臣哀絶筆湖上泣青萍作丹墀御爐或未幾顥亦卒李群玉群玉好吹笙善急就章喜食鵞及授校書郎東歸盧肇送詩云妙吹應諧鳯工書定得鵝杜丞相悰筵中贈美人云裙拖六幅瀟湘水􅁂聳巫山十朶雲貌態祗應天上有歌聲豈合世間聞􅎍前瑞雪燈斜照眼底桃花洒半醺不是相知憐賦客肯教容易見文君群玉觧天禄之任而歸涔陽經二妃廟題云小哀洲北浦雲邊二女明粧玉儼然野廟向江春寂寂古碑無字草芊芊風廻日暮吹芳芷月落山􅀷􅂘杜鵑猶似含嚬望廵守九疑凝黛隔湘川又曰黃陵廟前春巳空子􅒑啼血滴松風不知精爽歸何䖏疑是行雲秋色中群玉疑春空遂至秋色欲易之恍若有物告以二年之兆時尋陽太守叚成式志其事二年後果死於洪井叚以詩􅂘之曰曾話黃陵事今為白日催老無兒女累誰􅂘到泉臺群玉字文山澧州人裴休觀察湖􅀯厚延致之及為相以詩論薦授校書郎杜牧送群玊赴舉詩曰故人别來靣如玊一榻拂雲秋影中玊貌花紅三百首五陵誰唱兩春風或曰群玊受相府之知進詩三百篇授麟臺讎校黃陵廟前莎草春黃陵女兒茜裙新輕舟小檝唱歌去水逺天長愁殺人群玊賦黃陵廟詩也或曰李逺之作方干經群玊故居云訐直上書難遇主衘􅁈下世未成翁琴樽劒鸖誰將去惟鏁山齋一樹風温庭筠彦博裔孤與李商隐俱有名號温李與貴胄裴誠令孤高等蒲飮狎眤為襄陽廵官郭處士擊甌歌云吉栗金虬石潭古勺陂澹灔幽脩語湘君寶馬上神雲砕珮叢鈴滿煙􅀨吾聞二十六宫花離離軟風吹春星斗稀玉宸泠磬破昬夢木露未乾香著衣蘭􅁫委墜垂雲髪小響丁當逐回雪晴碧煙滋重疊山羅屏半掩桃花月太平天子駐雲車龍鑪勃鬰雙蟠挐宫中近臣抱扇立侍女低鬟落翠花亂珠觸續正跳蕩傾頭不􅁴金烏斜我亦為君長嘆思緘情逺􅀉愁無色莫霑香夢緑楊􅁝千里春風玉無力陽春曲云雲母空䆫暁煙薄香昬龍氣疑輝閣霏霏霧􅀨杏花天簾外春寒著羅幕曲欄伏檻金麒麟沙苑芳郊連翠茵廐馬何能嚙芳草路人不敢隨流塵庭筠才思艶麗工於小賦毎入試押官韻作賦凡八义手而八韻成時號温八吟多為隣鋪假手號曰救數人也而士行玷缺搢紳薄之李義山謂曰近得一聮句云逺比趙公三十六年宰輔未得偶句温曰何不云近同郭令二十四考中書宣宗嘗賦詩上句有金歩摇未能對遣求進士對之庭筠乃以玉條脫續也宣宗賞焉又藥名有白頭翁温以蒼耳子為對他皆􅀋此宣皇愛唱菩薩蠻詞丞相令狐綯假其修撰宻進之戒令勿􅂥而􅃍言於人由是踈之温亦有言云中書内坐將軍譏相國無學也宣皇好微行遇於逆旅温不識龍顔傲然而詰之曰公非長史司馬之流帝曰非也又曰得非六參簿尉之􅀋帝曰非六謫為方城尉其制詞曰孔門以德行為先文章為末爾旣德行無取文章何以􅀘焉徒負不覊之才罕有適時之用竟流落而死杜悰自西川除淮海廷筠詣韋曲杜氏林亭留詩云卓氏壚前金線桞隋家堤畔錦㠶風貪為兩地行霖􅀨不見池蓮照水紅豳公聞之遺絹千疋曾於江淮為親表辱之由是攺名廷筠又攺名舉塲多為舉人假手沈詢知舉施鋪席授廷筠不與諸公隣此困於塲屋卒無成而終令孤綯曾以舊事訪於廷筠對曰事出􅀯華非僻書也或兾相公爕理之暇時宜覧古綯益怒奏廷筠有才無行卒不登第廷筠有詩曰因知此恨人多積悔讀􅀯華第二篇廷筠五丈原詩云鐡馬雲雕共絶塵桞隂高壓漢營春天晴煞氣屯􅀜右夜半長星照渭濵下國卧龍空誤主中原得鹿不因人象床錦帳無言語從此譙周是老臣過新豐云一劒乗時帝業成沛中鄉里到咸京寰區巳作皇都貴風月猶含白社情泗水舊亭春草遍千門遺瓦古苔生至今留得離家恨鷄犬相聞落照明蘇武廟云蘇武魂銷漢使前古祠高樹􅀨茫然雲􅁁鴈斷胡天月隴上羊歸塞草煙回日樓臺非甲帳去時冠劒是丁年茂陵不見封侯印空向秋波哭逝川周繇繇字為憲池州人及咸通進士第以明皇夢鍾馗賦知名工為詩苐繁亦調池之建德令李昭象以詩送曰投文得仕而今少佩印還家古所榮後以御史中丞與段成式韋蟾温庭皓同遊襄陽徐商幕府繇有㸔牡丹贈段成式詩云金蘂霞英疊彩香初疑少女出蘭房逡廵又是一年别􅀉語集山呼索郎成式前㸔恡酒絶句贈繇曰太白東西飛正狂新篘石凍雜梅香詩中反語常廻避􅀹恠花前呼索郎繇又以人參遺成式有詩云人形上品傳方志我得真英自紫團慙非叔子空持藥更請伯言審細㸔求式能呼九莖仙草真難得五葉灵根許恵無人參詩曰少賦令才猶強作衆醫多失不襄陽中堂賞花繇與妓人戯語成式嘲之曰鸎裏花前選孟光東山逋客酒初狂素娥畢竟難防備燒得河車莫遣嘗繇和云廻簮轉黛喜猜防粉署裁詩􅂇酒狂􅀂遇仙丹偕羽化便隨簫史亦何傷成式不赴􅊍風亭夜宴贈繇云屏開屈􅂰見呉娃蠻臘同心四照花姹女不愁難管領斬新鈆裏得黃牙繇和云玉樹瓊筵映彩霞澄虚樓閣似仙家只縁存㱕想蘭室不向春風㸔夜花廣陽公宴成式速罷馳騁坐觀花艶或有眼飽之嘲繇賦詩云蹙鞠且徒爲寜如目送時報讎慙選耎存想恨逶遲促坐疑辟咡㗸盃強朶頥恣情窺窈窕曽恃好風姿色授應難奪神交願莫辤請君㸔曲講不負少年期叚成式和并序云近者􅀄開金埒大敞紅筵􅀐歴塊而風生鼓摻撾而雷發成式未曾盤馬徒效執鞭喜過君子之營徒接將軍之地以欵叚辭退因得坐觀是時滿目鈆黃逆鼻蘭麝晩薪餘論属有恨織素而不憐斜柯新知歎因針而難假化符端公妾換名馬賦闢長門莫逆賞心形於善謔為憲老舅吟飄白雪思効碧雲六韻􅀓觀不得落地鏗如珮玉粲􅀂列星僦眼詎貴於千金貸心只勞於一句轍鳴瓦釡方應金鐃拗輔冝咍足代諧笑詩云才甘魚目並藝怯馬蹄間王謝初飛蓋􅁎姜盡下山縳鷄難角逐射雉豈開顔亂翠移林色狂紅照座殷防梭齒雖在乞㡌􅁂慙班儻恕相如瘦應容累􅀐還庭筠和云齊馬馳千駟盧􅁎逞十三玳筵方盻眄金勒自䟃􅑗墮珥情初洽鳴鞭戰未酣神交花苒苒眉語桞􅆴􅆴踈眉語度栁呉興云窓却略青鸞鏡翹翻翠鳯篸專城有佳對寕肯頋春蚕
