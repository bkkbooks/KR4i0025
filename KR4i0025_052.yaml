  text: 唐詩紀事卷第五十二
  hash: sha256:5213fc857766b067a3480270aa81e7a20014131c3f57d769e61d89179eb0491a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_052-1a}
body:
  text: 雍𥙿之裴潾皇甫曙李肱皇甫松徐凝張佑崖涯盧儲趙璜柴夔王繼勳夏鴻曺汾楊鴻易重雍𥙿之敢競桃李色自呈刀尺功蝶猶迷剪翠人豈辨栽紅花剪綵野酌亂無巡送君兼送春明年春色至莫作未歸人送客春晦𥙿之正元後詩人也五雜組云五雜組剌繡窠往復還織錦梭不得巳戍交河自君之出矣寶鏡為誰明思君如隴水長聞嗚咽聲裴潾長安豪貴惜春殘爭賞先開紫牡丹别有玉柸承露冷無人起就月中看長安三月十五日兩街看牡丹甚盛慈恩寺元果院花最先開太平院開最後潾作白牡丹詩題壁間太和中駕幸此寺吟玩之久因令宫嬪諷念及暮歸則此詩蒲六宫矣潾河東人桞泌為憲宗治丹劑潾上疏極諌帝卒以藥棄天下世以為知言潾以兵部侍郎卒嘗裒古今辭章續文選號大和通典上之當時之士非與遊者不取世恨其隘開成元年李衛公分司東都居平泉别墅潾述其素尚賦四言詩十四章兼述山泉之美明年衛公觀察浙西潾自兵侍尹河南乃刻于石首章云動靜有源進退有期用在得正明以知微夫惟哲人會且有歸靜固致動安每慮危將憩于盤止亦先機皇甫曙立春日呈宫傳侍郎云朝旦微風吹曉霞散為和氣滿家家不知容貌潛消落且喜春光動物華出問池氷猶塞岸歸尋園桞未生芽摩娑酒甕重封閉待入新年共賞花曙元和十一年中書舍人李逢吉下登第逢吉所擢多寒素時有詩曰元和天子丙申年三十三人同得仙𫀆似爛銀文似錦相將白日上青天是歲高澥第一人劉端夫行李方周匡物廖有方輩皆預選寶曆間崔從鎮淮南署為行軍司馬李肱開元太平日萬國賀豐歲梨園猒舊曲玉座流新製鳳管遞參差霞衣競搖曳宴罷水殿空輦餘香草細蓬壺事巳久仙樂功無替誰肯聽遺音聖明知善繼肱開成二年試霓裳羽衣曲詩也是年秋帝命高鍇復司貢籍詔曰夫宗子維城夲枝百代封爵所宜無令廢絶常年宗正寺解送人恐有浮薄以忝科名在卿精揀藝能勿妨賢路所試賦則準常規詩則依齊梁體格乃試琴瑟合奏賦電裳羽衣曲詩主司先進五人詩其最佳者李肱次則王收乃以榜元及第帝覽之曰近屬如肱者其不忝乎高鍇奏曰臣鍇昨日奉宣進旨令將進士所試詩賦進來者伏以陛下聰明文思天縱聖德今年詩賦題目出自宸衷體格雅麗意思遐逺諸生捧讀相賀自古未有倍用研精覃思磨礪緝諧其今年試詩賦比於去年又勝數等臣日夜考校敢不推公就中進士李肱霓裳羽衣曲詩一首最為􅒯出更無其北詞韻既好去就又全臣前後吟詠近三五十遍雖使何遜復生亦不能過兼是宗枝臣與狀頭第一人以奬其能次張堂詩一首亦絶好亞次李肱臣與第二人其次沈黃中琴瑟合奏賦又似文選中雪月賦體格臣與第三人其次王牧賦自立意緒言語不凡臣與第四人其次桞棠詩賦興思敏速日中便成臣與第五人凡此五卷詩賦擢其中科實所不愧其餘三十五人或奬舊文别録人材非止一途四靣搜擇臣並與及第李肱舊文亦好人物絶竒每事且他日必為卿相宗枝之俊實謂難得况屬籍之中讀書為文者甚少伏望聖恩俯留宸覽李肱等三人詩賦若有不堪敢受欺天之罪如或可採伺候聖心其李肱詩賦伏望陛下聖慈特賜降奬飾宣示百寮以勸皇族修飾之道臣謬忝主司不勝慺慺之誠其詩賦惣為一卷謹隨狀奉進以聞范攄云肱止於嶽齊二牧皇甫松古松感興云皇天后地力使我向此生貴賤不我均若為天地情我家世道德旨意匡文明家集四百卷獨立天地經寄言青松姿豈羡朱槿榮昭昭大化光共此遺芳馨怨回紇歌云白首南朝女愁聽異城歌收兵頡利國飲馬胡蘆河毳布腥膻久穹廬歲月多雕巢城上宿吹笛淚滂沱又云祖席駐征棹開帆候信潮隔筵桃葉泣吹管杏花飄船去鷗飛閣人歸塵上橋别離惆悵淚江路濕紅蕉松著醉鄉日月三卷自敘也或曰松丞相竒章公表甥公不薦舉怨望因襄陽大水極言誹謗有夜入真珠室朝遊玳瑁宫之句真珠公愛姬名也拋毬樂詩云紅撥一聲飄輕毬墜越綃帶翻金孔雀香滿繡蜂腰少少拋分數花枝正索饒又云金蹙花毬小真珠繡帶垂幾回衝蠟燭千度入春懷上客終須醉觥杯自亂排松有登郭隗臺詩云燕相謀在兹積金黃巍巍上者欲何顔使我千載悲又有勸僧酒詩云勸僧一杯酒共看青青山酣然萬象滅不動心印間右張為取作主客圖松韓門第子湜之子也徐凝宿冽上人房云浮生不定若蓬飄林下真僧偶見超覺後始知身是夢更聞寒雨滴芭蕉凝睦州人樂天詩中有李郎中訪徐凝山人云郡守輕詩客鄉人薄釣翁解憐徐處士惟有李郎中張祜題金山寺云一宿金山頂微茫水國分僧歸夜船月龍出晚堂雲樹影中流見鐘聲兩岸聞因悲在朝市終日醉醺醺寓懷寄蘇州劉郎中云一聞周邵佐明時西望都門強策羸天子好文才自薄諸侯力薦命猶竒賀知章口徒勞説孟浩然身更不疑唯是勝遊行未遍欲離京國尚遲遲入潼關云都城三百里雄險此回環地勢遙尊嶽河流側讓關秦皇曽虎視漢祖昔龍顔何處梟凶輩干戈自不間故國三千里深宫二十年一聲河滿子雙淚落君前自倚能歌曲先皇掌上憐新聲何處唱腸斷李延年二章祜所作宫詞也傳入宫禁武宗疾篤目孟才人曰吾即不諱爾何為哉指笙囊泣曰請以此就縊上憫然復曰妾嘗藝歌請對上歌一曲以泄其憤上許乃歌一聲河滿子氣亟立殞上令醫候之曰脈尚溫而腸巳絶帝崩柩重不可舉或曰非俟才人乎爰命其襯襯至乃舉祐為孟才人嘆序曰才人以誠死上以誠命雖古之義激無以過也歌曰偶因歌態詠嬌嚬傳唱宫中十二春却為一聲河滿子下泉須弔舊才人杜牧之守秋浦與祐遊酷吟其宫詞亦知樂天有非之之論乃為詩曰㫸在眼前人不見道超身外更何求誰人得似張公子千首詩輕萬戶侯寧哥來云日映宫城霧半開太真簾下畏人猜黃翻綽指向西樹不信寧哥迥馬來退宫人云開元皇帝掌中憐流落人間二十年長説承天門上宴百官樓下拾金錢又云歌喉漸退出宫闈泣訴伶官上許歸猶説人時歡聖夀內人𥘉著五方衣玉環琵琶云宮樓一曲琵琶聲滿眼雲山是去程回顧段師非汝意玉環休把恨分明春鶯囀云興慶池南桞未開太真先把一枝梅內人巳唱春鶯囀花下傞傞軟舞來容兒鉢頭云爭走金車叱鞅牛笑聲誰是説千秋兩邉角子羊門裏猶學容兒弄鉢頭邠娘羯鼓云新教邠娘羯鼓成大酺𥘉日最先呈冬兒指向真真説一曲乾鳴杖子輕要娘歌云宜春花夜雪千枝妃子偷行上密隨便唱要娘歌一曲六宫生老是娥眉悖㧝兒舞云春風南內百花時道調涼州急遍吹揭手便拈金碗舞上皇驚笑悖㧝兒集虛臺云日光斜照集虛臺紅樹花迎曉霧開昨夜小皇新授籙太真會笑入簾來阿鴇湯云月照宫城紅樹芳緑窗燈未在雕梁金輿未到長生殿如子偷尋阿鴇湯和杜牧之齊山登高云秋溪南岸菊霏霏急管繁絃對落暉紅葉樹深山徑斷碧雲江淨浦帆稀不堪孫盛嘲時笑願送王洪醉夜歸流落正憐芳意在砧聲徒促授寒衣感王將軍柘枝妓殁云寂寞春風舊柘枝舞人休唱曲休吹鴛鴦鈿帶拋何處孔雀羅衫付阿誰畫鼓不聞招節拍錦靴空想挫腰支今來坐上偏惆悵曽是堂前教徹詩題干越亭云扁舟亭下駐煙波十五年遊重此過洲觜露沙人渡淺樹稍藏竹鳥啼多山㗸落照欹紅蓋水蹙斜紋卷緑羅腸斷中秋正圓月夜來誰唱異鄉歌世傳韋鮑二生以妾換馬之事云韋生下弟東歸同憩水閣鮑有美妾韋有良馬鮑以夢蘭小情佐歡飲酣停杯閲馬軒檻韋曰能以人換任選殊尤鮑欲馬之意頗切密遣四絃更衣盛裝頃之而至乃命勸韋酒歌云白露濕庭砌皓月臨前軒此時去留恨含思獨無言又歌送鮑生酒云風颭荷珠雖暫圓多生信有短因緣西橋今夜三更月還照離人泣斷絃韋乃命牽紫叱撥以酬之俄有紫衣冠二人自閣西升階而來二生恐悚闔戶窺之一人長髯云足下賦云斜漢尤界北陸南躔白露曖空素月流天可謂光絶對曰何不見賞風霽地表雲斂天末洞庭始波木葉微脫今佳月如晝可以為賦長髯曰向聞妾換馬之事可以為題以彼傾城求其駿足為韻長髯曰彼佳人兮如瓊之英此良馬兮負駿之名將有求於駿足亦何惜於傾城香暖深閨未厭夭桃之色風清廣陌曾憐噴玊之聲希逸曰原夫人以矜其容馬乃稱其德既各從其所好諒何求而不克長跪而别姿容休耀其金鈿右牽而來光彩蝢生於玉勒文通曰步及庭砌效當軒墀望新恩懼非吾偶也戀舊主疑借人乘之香散緑騣意巳忘於鬒髮汗流紅頷愛無異於凝脂希逸曰是知事有廢興用有取捨彼以絶代之容為鮮矣此以軼群之足為貴也買笑之恩既盡有類求之據鞍之力尚存猶希進也賦訖行十余步而失故祐自愛妾換馬之什云綺閣香綃華廄空忍將行雨換追風休憐桞葉雙眉緑却愛桃花兩耳紅侍宴永辭春色裏趂朝休立漏聲中恩勞未盡情先盡暗泣西風兩意同祐長慶中深為令狐楚所知楚鎮天平自草薦表令以詩三百篇隨狀表進祐至京屬元禎在內庭上問之􅍬曰祐雕蟲小巧壯夫不為或奬激之恐變陛下風教上頷之由是失意東歸有孟浩然身更不疑之句驪宫小禽名阿濫堆明皇御玊笛採其聲翻為曲且名焉逺近以笛爭效之祐有華清宫詩曰紅樹蕭蕭閣半開玉皇猶幸此宫來至今風俗驪山下村笛猶吹阿濫堆皮日休云佑字長吉元和中作宫躰小詩辭曲艷發當時輕薄之流能其才合譟得譽老大稍窺建安風格誦樂府録知作者本意短章大篇往往間出講諷怨譎時與六義相左右善題目佳境言不可刋置別處此為才子之最也或薦之天子書奏不下亦受辟諸矦府性狷介不容物輒自劾去以曲阿地古淡有南朝遺風遂築室種植而家焉性嗜水石悉力致之從南海間罷職事載羅浮石笋還不蓄美田利産為身後計死未二十年而故姬遺孕凍餒不暇豈其怨剌於神明耶天果不愛才沒而猶譴耶又進士顔萱過祐丹陽遺居見其愛姬崔氏貧居荆榛下有一子𣏌兒求食汝墳矣憫然作詩弔之萱詩曰憶昔為兒逐我兄曾拋竹馬拜先生書齋巳換當時主詩壁空題故友名豈是爭權留怨敵可憐當路盡公卿柴扉草屋無人問猶向荒田責地征日休詩云勝華通子共悲辛荒徑今為舊宅鄰一代交遊非不貴五湖風月合教貧魂應絶地為才鬼名與遺編在史臣聞道平生偏愛石至今猶泣洞庭人陸龜蒙云先生清骨葬煙霞業破孤存孰為嗟幾篋詩編分貴位一林石笋散豪家兒過舊宅啼楓影姬繞荒田泣稗花唯我共君堪便戒莫將交譽作生涯裴洪慶以為冬瓜堰宫𣏌兒後名望虔嘉興監張為作主客圖以白樂天為廣大教化主而以祐為入室取其句云萬國見清道一身成白頭相公句上令狐此地榮辱盛豈宜山中人句秋晚葛溪謾淬張家劔却是猿聲斷客腸句葛溪書空疑未決卓地計𥘉成句柱杖春申還有三千客寂寞無人報李園句杜牧之酬祐詩云七子論詩誰似公曺劉須在指揮中薦衡昔日知文舉曽表薦令狐公乞火無人作蒯通北極樓臺長挂夢西江波浪逺吞空可憐故國三千里虛唱歌辭滿六宮或言祐清河人嘗賦淮南詩有人生只合揚州死禪智山光好暮田大中中果卒於丹陽隱舍崔涯崔涯吳楚人與張祐齊名其妻雍氏乃惣校之女夫婦相歡而涯不禮其妻父妻父不平之奪其女為尼涯不得巳為詩留別日隴上泉流隴下分腸斷嗚咽不堪聞常娥一入月中去巫峽千秋空白雲膺之作或謂崔詠春風云動地經天物不傷高情易韻住何方扶持燕雀連天去斷送楊花盡日狂繞桂月明過萬戶弄帆晴晚渡三湘孤雲雖是無心物借便吹教到帝鄉太行嶺上三尺雪崔涯袖中三尺鐡一朝若遇有心人出門便與妻兒别涯挾士詩也涯與張祐失意遊挾江淮此詩往往傳於人口盧儲李翺江淮典郡儲以進士投卷翶禮待之置文卷几案間因出視事長安及笄間步鈴閣前見文卷尋繹數回謂小青衣曰此人必為狀頭逮公退李聞之深異其語乃令賔佐至郵舍具語於儲選以為􅡾儲謙辭久之終不却其意越月遂許來年果狀頭及第才過關試徑赴嘉禮催粧詩曰昔年將去玉京遊第一仙人許狀頭今日幸為秦晉會早教鸞鳳下粧樓後盧止官舍迎內子有庭花開乃題曰芍藥斬新栽當庭數朵開東風與拘束留待細君來人生前定固非偶然耳趙璜正月云正月今朝半陽臺信未回水芹寒不食山杏雨應開世網留三宿真源寄一杯因聲謝猿鳥歲宴會歸來題七夕圖云帝子吹簫上翠微秋風一曲鳳凰歸明年七月重相見依舊髙懸織女機七夕詩曰烏鵲橋頭雙扇開年年一度過河來莫嫌天上稀相見猶勝人問去不回欲減煙花饒俗世暫煩煙月掩樓臺璜開成三年登第柴夔望九華山詩云九華如劒插雲霓青靄連空望欲迷北截吳門疑地盡南連楚界覺天低龍池水醮中秋月石路人攀上漢梯惆悵舊遊無復到會須登此出塵泥夔登太和中進士第王繼勳贈和龍妙空禪師詩云白靣山南靈慶院茅齋道者雪峰禪只棲雲樹兩三畝不下煙蘿四五年猿鳥認聲呼喚易龍神降伏住持堅誰知今日秋江畔獨步醫王闡法筵夏鴻和贈和龍妙空禪師詩云翰林遺迹鏡潭前孤峭高僧此處禪出為信門興化日坐當吾國太平年身同瑩徹尼珠淨語並鋒鋩慧劔堅道果巳圓名巳遂即看千匝繞香筵鴻登開成進士第曹汾早發靈芝望九華寄杜使君詩云戴月早歸三秀館平明𥘉辨九華峰嵯嵯玉劔寒芒利裊裊青蓮翠葉重怪狀却疑人畫出嵐光似為客添濃行香若到五溪上此處褰幃正靣逢汾以尚書鎮許下其子希幹及第用錢二十萬榜至鎮張宴置榜於側時進士胡錡有啓賀略曰桂枝折處著萊子之綵衣楊葉穿時用魯連之舊箭第故也汾先登又曰一千里外觀上國之風光十萬軍前展長安之春色汾字道謙開成四年登第希幹咸通十四年登第汾終戶部侍郎汾懿宗宰相礭之第礭罷相為鎮海節度使以扞龐勛功就加太子太師汾為忠武節度入為戶部判度支弟兄並列將相之任時人榮之楊鴻晴望九華山詩云九華間屋簇清虛氣象群峰盡不如惆悵都南挂冠吏無人解向此山居鴻登開成二年進士第易重會昌五年陳商下進士張濆第一重次之後詔白敏中重考覆落濆等八人而重居榜首有詩寄冝陽兄弟云六年鴈序恨分離詔下今朝遇巳知上國皇風𥘉喜日御階恩渥屬身時內庭再考稱文異聖主宣名奬藝竒故里仙才若相問一春攀得兩重枝
