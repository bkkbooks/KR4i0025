front:
  text: 唐詩紀事卷第十九
  hash: sha256:ca3732a33f46fdfac93854bb8c2254d32d1dd8958a5824791493b622518576c3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_019-1a}
body:
  text: 崔宗之敬括房琯蘇淵明崔宗之宗之襲父日用齊家之封好學寬博有風舉與李杜以文相知贈李白云涼秋八九月白露空園庭耿耿意不暢捎捎悄悄一作風葉聲思見雄俊士共話今古情李侯忽來儀把𬒮苦不早清論既抵掌玄談多絶倒分明楚漢事歷歷王霸道擔囊無俗物訪古千里余袖有七首劒懷中茂陵書雙眸光照人詞賦淩子虛酌酒並素琴霜風氣凝潔平生心事中今日為君説我家有别業寄在嵩之陽明月出高岑清溪澄素光雲散窗戶靜風吹松桂香子若同斯遊千載不相忘白和云朔風橫高天萬里起秋色壯士心飛揚落日空嘆息長嘯出原野凛然寒風生幸遭聖明時功業猶未成奈何懷良圖鬱悒獨愁坐獨坐一作空杖䇿尋英豪立談乃知我崔公生人秀𬗟邈青雲姿制作參造化託諷含神祗海嶽尚可傾吐諾終不移是時霜飈寒逸興臨華池起舞拂長劒四座皆揚眉因得窮歡情贈我以新詩又結汗漫期九垓遠相待舉身憩蓬壺濯足弄滄海從此凌倒景一去無時還朝遊明光宫暮日閶闔關但得長把𬒮何必嵩丘山宗之為侍御史謫官金陵與白詩酒唱和月夜乘舟自採石逹金陵敬括孫晦昕眸括字叔弓河中人為殿中侍御史不諧附揚國忠出知果州入為兵侍志簡淡不求名後剌同州隱然持重大曆中卒括試七月流火云前逢一葉下言念忽悲秋變節金𥘉至分寒火正流氣含良夜早光拂夏雲收助月微明散沿河麗景浮秋標時令美詩興國風幽自此觀邪正深知玉葉休房琯琯宰盧氏王維贈詩云逹人無不可忘巳愛蒼生不復小千室絃歌在兩楹又云視事兼偃卧對書不簮纓蕭條人吏踈鳥雀下空庭是時琯之清名巳重於榗紳矣琯題漢州西湖云高流纒峻隅城下𬗟丘墟決渠信浩蕩潭島成江湖結宇依回渚水中信可居三伏氣不蒸四逹暑自徂同人千里駕鄰國五馬車月出共登舟風生隨所如舉麾指極浦欲極更盤紆繚繞各殊致夜盡情有餘遭亂意不開即理還暫祛安得長晤語使我憂更除琯之次律融之子也相肅宗有逺器好談老子浮屠法高談有餘而不切事蘇源明天寶十二載源明守東平宴濮陽守崔季重魯郡李蘭濟南田琦濟陽李陵于回源亭為小洞庭五太守宴集載其歌曰小洞庭兮寓方舟風嫋嫋兮離平流寓方舟兮小洞庭雲微微兮連絶􅠌仍瀾壯兮𬗟以沒重嵓轉兮超以忽馮夷娎兮護輕撓蛟龍妤兮落增潮泊中潮兮淡而間並曲溆兮悵而還適豫手兮非于期將解𬒮兮藂豫曲尚君子兮夀厥身承明主兮憂斯人其後以國子司業召須尉袁廣餞于小洞庭復歌曰浮漲湖兮莾條遙川后禮兮扈豫橈橫增沃兮蓬仙延川后福兮易豫船月澄凝兮明空波星磊落兮耿秋河夜既良兮酒且多樂方作兮奈别何子美八哀詩曰武功少也孤徒步客徐兖讀書東嶽中十載考墳典時下萊蕪郭忍飢浮雲巘負米晚為身每食臉必泫夜字照爇薪垢衣生碧蘚庶以勤苦志報兹劬勞願學蔚醇儒姿文包舊史善灑落辭幽人歸來濳京輦射䇿君東堂宗匠集精選制可題未乾乙科巳大闡文章日自負吏祿亦纍踐晨趍閶闔內足踏宿昔研一麾出守還東平太守故召為國子源明纍遷太子諭德為也司業黃屋朔風卷不暇陪八駿虜庭悲所遣平生滿樽酒斷此朋知展憂憤病二秋有恨石可轉陷京師安祿山官黃屋車蓋也源明以病不受偽肅宗復社稷得無逆順辨兩京權肅宗復知制誥考功郎中范曄顧其兒李斯憶黃犬祕書茂松意再扈祠壇墠前後百卷文枕藉皆禁臠篆刻楊雄流𬈑漲本末淺青熒芙蓉劒犀兕豈獨剸反為後輩褻豫實苦懷𬗟煌煌齋房芝事絶萬手搴垂之俟來者正始真勸勉不要懸黃金胡為投亂贙結交三十載吾與誰遊衍滎陽復冥莫罪罟巳橫罥嗚呼子逝日始泰則終蹇長安米萬錢凋喪盡餘喘戰伐何當解歸帆阻清沔尚纒漳水疾永負蒿黑餞謂鄭虔也詩中滎陽唐詩紀事卷第十九
