front:
  text: 唐詩紀事卷第六十五
  hash: sha256:1cc4d35bf6123d46aafa8d4237fc8caba3813405926a41e23cc9baa062526086
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_065-1a}
body:
  text: 袁郊盧延讓裴説張為韓偓曹松杜荀鸖孫棨王鐸鄭綮胡玢楊淑平曽繆島雲袁郊月詩云常娥竊藥出人間藏在蟾宫不放還后羿遍尋無覔處誰知天上却容姦霜詩云古今何事不思量盡信鄒生感彼蒼但想燕山吹暖律炎天豈不解飛霜露詩云湛湛騰空下碧霄地卑濕處更偏饒菅茅豐草皆霑潤不道良田有旱苗雲詩云楚甸嘗聞旱魃侵從龍應合解為霖荒淫却入陽臺夢感亂懷襄父子心郊咸通時為祠部郎中有甘澤謡九章與溫庭筠酬唱庭筠有開成五年抱疾不得預計偕詩寄郊云逸足皆先路窮蛟獨向隅是也郊字之儀滋之子也昭宗時為翰林學士盧延遜延遜吟詩多著尋常容易語如送周太保赴浙西云臂鷹健卒懸氊帽騎馬佳人卷畫衫又寄友人云每過私苐邀看鸖長著公裳送上驢然於數篇見境尤妙有松寺云山寺取涼當夏夜共僧蹲坐石階前兩三條電欲為雨七八個星猶在天衣汗稍停牀上扇茶香時撥澗中泉通霄聽論蓮華義不藉覺眠松窗一又苦吟云莫話詩中事詩中難更無吟安一個字撚斷數莖鬚險覔天應悶狂搜海亦枯不同文賦易為著者之乎又贈僧云浮世浮華一斷空偶拋煩惱到蓮宫髙僧解語牙無水老鸖能飛骨有風野色吟餘生竹外山隂坐久入池中禪師莫問求名苦滋味過於食蓼蟲曽獻王建詩有栗爆燒氊破貓跳觸鼎翻後建冬夜與潘峭平章邊事旋令宫人燒栗俄有數栗爆出燒繡褥時建多疑嘗於爐中燒金鼎命二妃親侍湯茶而已是夜宫貓相戲誤觸鼎翻建良久曰栗爆燒氊破貓跳觸鼎翻憶得盧延遜卷有此一聮乃知先輩裁詩信無虛境來日遂有六行之拜拜工部自給事中翰林學士吳融獨重其作盛稱於時且云此子語不尋常後必垂名楊大年云延遜詩至今存人亦有絶好之者其播人口有旅舍言懷云名紙毛生五門下家僮骨立六街中蜀路云雲間閙鐸騾馱至雪裏殘骸虎拽來懷江上云餓貓臨鼠穴饞犬舐魚砧八月十六日夜云只訛些子緣應耗沒多光寄人云吟安一個字撚斷數莖鬚冬夜云樹上咨諏批頰鳥窗間壁駮叩頭蟲哭人云漸窮頑僕慵看馬著慘佳人暗理筝狐衝官道過犬刺店門開租張相每稱之餓貓臨鼠穴饞犬舐魚砧成中令每稱之栗爆貓跳之句王建愛之盧曰平生投謁公卿不意得貓狗力延遜始投贄吳子華子華讀至不同文賦易為下者之乎笑曰上門惡罵來本朝楊億在翰苑嘗召對上言及延遜詩曰臂鷹健卒懸氊帽騎馬佳人卷畫衫似此淺近亦自成一體延遜字子善范陽人光化初登第從事朗陵雷滿敗歸王建僣位授水部外郎卒於刑部侍郎師薛能為文裴説裴詣唐舉子先投所業於公卿之門謂之行卷説只行五言十九首至來年秋賦復行舊卷人有譏之者説曰只此十九首苦吟尚未有人見知何假别行卷哉識者以為知言説天復六年登甲科其詩以苦吟難得為工且拘格律嘗有詩曰苦吟僧入定得句將成功又贈僧貫休云揔無方是法難得始為詩又云是事精皆易唯詩會却難遭亂故宦不逹多遊江湖間有石首縣詩云因携一家住嬴得半年吟深閨乍冷鑑開篋玉筯微微濕紅頰一陳霜風殺栁條濃煙半夜成黃葉垂垂白練明如雪獨下間階轉凄切秪知抱杵搗秋砧不覺髙樓已無月時聞寒鴈聲相喚紗窗只有燈相伴幾度齊紈又懶裁離腸恐逐金刀斷細想儀形執牙尺回刀剪破澄江色愁捻銀針信手縫惆悵無人試寬窄時時舉袖勻紅淚紅箋謾有千千字書中不盡心中事一半殷勤寄邊使此説聞砧詩也説終禮部貟外郎説與詣俱有詩名詣唐天祐三年登第終於桂嶺假官宰字而已同在湘江説詩云吟餘潮落岸水髙經杜甫墳説云擬掘孤墳破重教大雅生詣云名終埋不得骨便朽何妨景同而語意俱别實為䨥美説旅行聞冦云寸步邊多事將行間四鄰深山不畏虎當路却防人無事助明代何門銷此身空慙兩行淚飄灑向紅塵洛中作云莫怪苦吟遲詩成鬢亦絲鬢絲猶可染詩病却難醫山暝雲橫處星沉月側時冥收不堪得一句至公知中秋月云一歲幾盈虧當軒重此期幸無偏照處剛有不明時色靜雲歸早光凝故宿遲望吟吟未足皎皎下踈籬棊云十九條平路言平又嶮巇人心無算處國手有輸時勢逈流星逺聲乾下雹遲臨軒才一局寒日又西垂喜友人再面云一别幾寒暄迢迢隔塞垣相思長有事及見却無言靜坐將茶試間書把葉翻依依又留宿圎月上東軒張為秋醉歌云金風颯已起還是招魚翁携酒夫姥岑自彈嶧陽桐脫却登山履赤腳翹青笻泉聲掃殘暑猿臂攀長松翠微泛樽緑苔蘚分煙紅造化處術內相對數壺空醉眠嶺上草不覺夜露濃一夢到天曉始覺一醉中皎然夢中路直到瀛洲東初平把我臂相與騎白龍三留對上帝玉樓十二重上帝賜我酒送我敲金鍾寶閣香斂苒琪樹寒玲瓏動葉如笙篁音律相怡融珍重此一醉百骸出天地長如此夢魂永謝名與利為唐末江南詩人與周朴齊名如到處即閉戶逢君方展眉最有詩稱為作詩人主客圗序曰若主人門下處其客者以法度一則也以白居易為廣大教化主上入室楊乘入室張祐羊士諤元稹升堂盧同顧况沈亞之及門費冠卿皇甫松殷堯藩施肩吾周元範况元膺徐凝朱可名陳摽童翰卿以孟雲卿為髙古奧逸主上入室韋應物入室李賀杜牧李餘劉猛李涉胡幽正升堂李觀賈馳李宣古曽鄴劉駕孟遲及門陳潤韋楚老以李益為清竒推正主上入室蘇郁入室劉畋僧清塞盧休于鵠楊洵美張籍楊巨源楊敬之僧無可姚合升堂方干馬戴任蕃賈島厲元項斯孽夀及門僧良乂潘誠于武陵詹雄衛凖僧志定喻島朱慶餘以孟郊為清竒僻苦主上入室陳陶周朴及門劉得仁李溟以鮑溶為博容宏拔主上入室李群玉入室司馬退之張為以武元衡為瓌竒美麗主上入室劉禹錫入室趙嘏長孫佐輔曺庚升堂盧頻陳羽許渾張蕭逺及門張陵章孝摽雍陶周祚袁不釣杜光庭載毛仙翁事云仙翁名干字鴻漸元和間劉禹錫李紳白樂天輩皆贈詩至大中戊寅五十餘年矣是歲張為薄遊長沙不汲汲隨計獲女奴於嶽麓下惑之嵗餘成羸疾仙翁一見曰子妖氣邪光浹遍肌骨茍不相值殞於旦夕也以一粒授為於香爐焚之郁烈之氣聞百步魅妾一號而斃乃木偶人也又吞以丹砂和黍者三疾遂瘳為作詩别之曰羸形感神藥削骨生豐肌蘭炷飄靈煙妖怪立誅夷重覩日月光何報父母慈黃河濁衮衮别淚澌流澌黃河清有時别淚無收期為後入釣臺山訪道而去韓偓偓父瞻開成六年李義山同年也義山有餞韓同年西迎家室戲贈云籍籍征西万戶侯新緣貴壻起珠樓一名我漫居先甲千騎君翻在上頭雲路招邀回綵鳯天河迢遞笑牽牛南朝禁臠無人寄瘦盡瓊枝為四愁偓小字冬郎義山云嘗即席為詩相送一座盡驚句有老成之風因有詩云十歲裁詩走馬成冷灰殘燭動離情桐花万里丹山路雛鳯清於老鳯聲偓字致堯今曰致光誤矣自號玉山樵人苑中云上苑離宫處處迷相風髙與露盤齊金階鑄出狻猊立玉柱雕成翡翠啼外使調鷹初得按外案五坊始能禽獲之得案使以鷹集初調習中官過馬不教嘶駿以進謂之過上乘馬必中官馬笙歌錦繡雲霄裏獨許詞臣醉似泥六月十七日召對詩云清暑簾開散異香恩深咫尺對龍章花應洞裏尋常發日向壺中特地長生長忽凝槎犯斗歸來兼恐海生桑如今冷笑東方朔唯用詼諧侍漢皇與吳子華侍郎同年玉堂伴直懷昔敘懇因成長句兼呈同年云往年鶯谷接清塵今日鼇山作侍臣二紀許諧勞筆硯一朝宣入掌絲綸久困名場豫與子華俱聲名烜赫文章士金紫雍容冨貴身綘帳恩深無路報語餘相聚却酸辛賜宴日詩云玉銜花馬踏天街詔遣追歡綺席開中使押從天上去外人知自日邊來門齊人司進狀辭是日在外四考排二人押出赴宴中使臣心淨比漪漣水聖澤深於瀲灔柸才有異恩頒稷卨已將優禮及鄒枚清啇逈向黎園降妖妓新行峽雨廽不散通霄離禁直晚來殘醉入銀杯醉著云万里清江万里天一村桑柘一村煙漁翁醉著無人喚過午醒來雪滿船即日云書墻暗記移花日洗甕先知醖酒期須信間人有忙事早來衝雨覔漁師春恨云殘夢依依酒力餘城頭批頰伴啼烏平明乍捲西樓幕院靜初聞放轆轤并州云戍旗靑草杜榆關雨裏并州四月寒誰會慿欄潛忍淚不勝天際似江千偓天復初入翰林其年冬駕幸鳯翔偓有扈從之功返正初上面許偓為相奏云陛下運契中興當復用重德鎮風俗臣座主右僕射趙崇可充是選乞回臣之命授崇天下幸甚上喜歎翌日制用崇暨兵部侍郎王贊為相時梁太祖在京素聞崇之輕佻贊復有舋馳入請見於上前具言二公長短上曰趙崇是偓薦時偓在側梁主叱之偓奏曰臣不敢與大臣爭上曰韓偓出尋謫官入閩故窗外日光飛野馬案前筠管長蒲盧謀身拙為安蛇足報國危曽捋虎鬚滿世可能無默識未知誰擬試齊竽香奩集和魯公之詞也惟其艷麗故貴後嫁其名於偓凝平生著述分為縯論遊藝孝悌疑獄香奩籝金六集自為遊藝集序云豫有香奩籝金集不行於世凝在政府避議論諱其名又欲後人知故遊藝集序實之此凝之意也沈存中云曹松天復初杜德祥主文放松及王希羽劉象柯崇鄭希顔等及第年皆七十餘時號五老榜時內難新平首求孤貧人德祥以松等塞詔各授校書郎制曰念爾登科之際當豫反正之年宜降異恩各膺寵命松字夢徵舒州人也學賈司倉為詩此外無他能時號松啓事為送羊腳狀松别湖州上主人云門繫釣舟雲滿岸借君幽致坐移旬湖村夜呌白蕪鴈菱市曉暄深浦人逺水日邊重作雪寒林燒後别生春不辭更後醒還醉太一東峯歸夢頻李肇國史補云曲江大會此為下第舉人邇來漸侈靡皆為上列所占向之下第舉人不復預矣所以逼大會則先牒教坊請奏上御紫雲樓簾觀焉時或擬作樂則為之移目故曹松詩云追逰若遇三清樂行從應妨一日春勑下後人置皮袋例以圖章酒器錢絹實其中逢花即飲故張籍詩云無人不借花園宿到處皆携酒器行其皮袋狀元録事同點撿闕一則罰金曲江之宴行市羅列安僅為之半空公卿家率以是日揀選東牀車馬闐塞莫可殫述松及苐勑下宴中獻坐主杜侍郎詩云得召丘墻淚却頻若無公道也無因門前送勑朱衣吏席上銜杯碧落人半夜笙歌教泥月平明桃杏放燒春南山雖有歸溪路爭那酬恩未殺身春日長安書事云浩浩看花晨六街楊逺塵塵中一丈日誰是晏眠人御栁舞著水野鶯啼春破徒云還楚客猶自惜離情晨起云曉色教不睡卷簾清氣中林殘數枝月髮冷一梳風並鳥聞鍾語欹荷隔霧空莫徒營白日道路本無窮弔北印云山下望山上夕陽明又曛無人醫白髮少地著新墳歲代殊相逺賢愚旋不分東歸聊一弔亂木倚寒雲松有詩云憑君莫話封侯事一將功成万骨枯可謂諳世故矣杜荀鸖荀鸖有詩名號九華山人大順初擢第授翰林學士主客外郎知制誥序其文為唐風集或曰荀鸖牧之微子也牧之會昌末自齊安移守秋浦時年四十四所謂使君四十四兩佩在銅魚者也時妾有妊出嫁長林鄉正杜筠而生荀鸖擢第年四十六矣溪興云山雨溪風卷釣絲瓦甌蓬砥獨斟時醉來睡著無人喚流下前溪也不知春宫怨云早被嬋娟誤欲粧臨鏡慵承恩不在貌教妾若為容風暖鳥聲碎日髙花影重年年越溪女相憶採芙蓉荀鸖曽得詩一聮云舊衣灰絮絮新酒竹芻芻韋莊曰我道印將金鎖鎖簾用玉鈎鈎即京兆太拜之祥也贈僧云利門名路兩何憑百歲風前短熖燈只恐為僧心不了為僧心了揔輸僧時世行云夫因兵死守蓬茅麻紵裙衫鬢髮焦桑柘廢來猶納稅田園荒盡尚徵苗時挑野菜和根煮旋斫生柴帶葉燒任是深山更深處也應無計避征徭又云八十老翁住破村村中牢落不堪論因供寨木無桑柘為點鄉兵絶子孫還似平寧徴賦稅未曽州縣略安存至今雞犬皆星散日落西山哭倚門荀鸖擢第時危勢晏復還舊山田頵在宣州甚重之頵起兵隂令以箋問至梁太祖許頗厚遇及頵遇禍梁祖表授翰林學士主客貟外郎中知制誥恃勢侮易搢紳衆怒欲殺之而未及天祐初卒顧雲序其詩曰大順初皇帝命小宗伯河東裴公掌邦貢次二年逺者來隱者出異人雋士大集都下於群進士中得九華山人杜荀鸖拔居上第諸生謝恩日列座既定公揖生謂曰聖上歉文教未張思得如髙宗朝射洪拾遺陳公宗廣諱名犯文作詩出沒二雅馳驟建安削苦澀僻碎略淫靡淺切破豔冶之堅陳擒雕巧之酋帥皆摧犝折角崩潰解散掃蕩詞場豁淸文祲然後有戴容州劉隋州王江寧率其徒揚鞭按轡相與呵樂來朝於正道矣以生詩有陳體可以潤國風廣王澤故擢以塞詔意勉為中興詩宗生謝而退明年寧親江表以僕故山偕隱者出詩三百篇見簡其雅麗疑越之句能使貪吏亷邪臣正父慈子孝兄友弟悌人倫之紀備矣其壯語大言則決起逸發可以左攬工部袂右拍翰林肩吞賈喻八九於􅎍中曽不蠆介情動於中則極思冥搜神逰希夷形瓦枯未五聲勞於呼吸万象貧於抉剔信詩之雄傑者也美哉裴公知人之為不誣矣於戲旌别淑慝史臣之職僕幸得為之敘録視其人齒尚壯才力未盡謳吟之興方酣俟其繼作得如周頌者目之為唐風集荀鸖初謁梁王朱全忠雨作而天無行雲梁曰此謂天泣知何祥請先作無雲雨詩乃賦曰同是乾坤事不同雨絲飛灑日輪中若教隂都相似爭表梁王造化工梁悅之孫棨題妓王福娘墻詩云移壁廽窗廢幾朝指鐶偷解博蘭椒無端鬪草輸鄰女更被捻將玉步搖鄭谷寄臺院孫端公棨詩云才拙道仍孤無何捨釣徒班雖沾玉笋香不近金爐雨露瞻雙闕煙波隔五湖唯君應是念曽共伏靑蒲諌垣曽同棨贈妓人云綵翠仙衣紅玉膚輕盈年在破瓜初霞杯醉喚劉郎賭雲髻慵邀阿母梳不怕寒侵緣帶寶每憂風舉倩持裾謾圖西子為粧樣西子元來未得如題北里妓人壁云寒繡衣裳餉阿嬌新圗香獸不禁燒東鄰起樣裙腰闊剩蹙黃金一兩條王鐸鐸字昭範重德名家位望崇顯率由文雅非定亂才鎮渚宫為都統以禦巢冦洎荆州失守復把潼關黃巢差人傳語云令公儒生非我敵請自退避無汚鋒刃於是棄關於隨僖宗播遷於蜀再授都統收復京師大勳不成竟落都統後有詩其要云黜詔已聞來闕下檄書猶未遍軍前亦志其中也罷都統守鎮滑州作云用軍何事敢遷延恩重才輕分使然黜詔已聞來闕下檄書猶未遍軍前腰間盡解蘇秦印波上虛迎范蠡船正會星辰扶北極却驅戈甲鎮南燕三塵上相逢明主九合諸侯愧昔賢看却中興扶大業殺身無路好歸田鐸為侍御史于興宗守綿州登越王樓以詩寄朝士鐸和云謝眺題詩處危樓壓郡城雨餘江水碧雲斷雪山明錦繡來仙境風光八帝京恨無靑玉案何以報髙情鐸謁梓潼張惡子廟詩曰盛唐聖主解靑萍欲振新封濟順名夜雨龍拋三尺匣靑雲鳯入九重城宗幸時僖云春內必還京蜀人情術士皆劒明喜氣隨雷動玉壘韶光待賊平惟報關東諸將相柱天功業賴隂兵判度支蕭遇和云靑骨祀吳誰讓德紫華居越亦知名未聞一劒傳唐王長擁千山護蜀城斬馬威稜應掃蕩截蛟鋒刃俟升平鄼侯為國親簫鼓堂上神籌更布兵神故二公賦詩時僖宗解劔贈鄭綮古今詩話曰相國綮善詩有題老僧詩云日照四山雪老僧門未開凍瓶粘柱礎宿火燼爐灰童子病歸去鹿麑寒入來常云此詩屬對可以衡稱言輕重不偏也或曰相國近為新詩否對曰詩思在灞橋風雪中驢子上此處何以得之蓋言平生苦心也綮字藴武大順後王政微綮每以詩謡託諷中人有誦之天子前者昭宗意其所藴未盡因有司上班簿遂書其側曰可禮部侍郎同中書門下平章事綮本善詩其語多俳諧故使落調世號鄭五歇後體至是省史走其家上謁綮笑曰諸君誤矣人皆不識字宰相亦不及我俄聞制下歎曰歇後鄭五作宰相事可知矣立朝無復故態才三月去位綮刺盧江將去别郡人云唯有兩行公廨淚一時灑向渡頭風其滑稽類此胡玢玢不知何許人嘗隱廬山苦心於五七言桑落洲一篇云莫問桑田事但看桑落洲數家新住處昔日大江流古岸崩欲盡平沙長未休想應百年後人世更悠悠又月詩云輪中别有物寧有土改云桂根光外更無空玢山與李騰簾問江西弓旌不至楊牧字藏之吳人呼為神童兄發戲令詠蛙即曰兔邊分玉樹龍底耀同儀會當同鼓吹不復問官私又令詠筆仍賦鑽字即曰雖匪囊中物何堅不可鑽一朝操政事定使冠三端吳人造門請詩觀者壓敗其墻牧嘲曰爾幸無羸角何用觸吾藩若是升堂者還應自得門平曽曽謁華州李固言不遇因吟一絶而去曰老夫三日門前立珠箔銀屏晝不開詩卷却拋書袋裏正如間看華山來曽恃才傲物竟殁於縣曹薛平僕射出鎮浙西主禮稍薄曽留詩以諷之曰梯山航海幾﨑嶇來謁金陵薛大夫毛髮竪時趍劒戟衣冠儼處拜氷壺誠知兩軸非珠玉深愧三縑恤旅途明日過江風景好不堪回首望勾吳薛聞曽出境遣使追還縻留數日又獻縶白馬詩曰白馬披鬃練一團今朝被絆欲行難雪中放去空留迹月下牽來只見鞍向北長鳴天外逺臨風斜控耳邊寒自知毛骨還應異更請孫楊子細看河東公曰若不留絆行軒即得觀其毛骨遂以殊禮相待唐以府元被絀者九人曽其一也曽長慶二年同賈閬仙輩貶謂之舉場十惡曽後謁固於蜀幕中皆名士曽輕忽無所畏遂獻雪山賦李覽命推出不旬日再獻鯸魚賦曰此魚觸物而怒翻身上波為烏鳶所獲奈魴鯉之何李覽之遂不至深罪繆島雲島雲少從浮圗其詩尤尚竒險至如四五片霞生絶壁兩三行鴈過踈松又拋芥子降顛拂拂折楊枝灑醉惺惺廬山瀑布曰白鳥逺行樹玉虹孤飲潭皆敻出前輩開成中常逰豫章武宗朝淮勑反初名甚喧然唐詩紀事卷第六十五
