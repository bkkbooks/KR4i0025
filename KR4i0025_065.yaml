front:
  text: 唐詩紀事卷第六十五
  hash: sha256:1cc4d35bf6123d46aafa8d4237fc8caba3813405926a41e23cc9baa062526086
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_065-1a}
body:
  text: 袁郊盧延讓裴說張爲韓偓曹松杜荀鸖孫棨王鐸鄭綮胡玢楊淑平曽繆島雲袁郊月詩云常娥竊藥出人間藏在蟾宫不放還后羿遍尋無覔處誰知天上却容姦霜詩云古今何事不思量盡信鄒生感彼蒼但想燕山吹暖律炎天豈不解飛霜露詩云湛湛騰空下碧霄地卑濕處更偏饒菅茅豐草皆霑潤不道良田有旱苗雲詩云楚甸嘗聞旱魃侵從龍應合解為霖荒淫却入陽䑓夢感乱懐襄父子心郊咸通時爲祠部郎中有甘澤謡九章與温庭筠酬唱庭筠有開成五年抱疾不得預計偕詩寄郊云逸足皆先路窮蛟獨向隅是也郊字之儀滋之子也昭宗時爲翰林學士盧延遜延遜吟詩多著尋常容易語如送周太保赴浙西云臂鷹徤卒懸氊㡌騎馬佳人卷畫衫又寄友人云毎過私苐邀㸔鸖長着公裳送上驢然於數篇見境尤妙有松寺云山寺取凉當夏夜共僧蹲坐石堦前兩三條電欲為雨七八个星猶在天衣汗稍停牀上扇茶香時撥澗中泉通霄聴論蓮華義不藉覺眠松牎一又苦吟云莫話詩中事詩中難更無吟安一个字撚断數莖鬚險覔天應悶狂搜海亦枯不同文賦易為著者之乎又贈僧云浮世浮華一斷空偶抛煩惱到蓮宫髙僧解語牙無水老鸖能飛骨有風野色吟餘生竹外山隂坐乆入池中禪師莫問求名苦滋味過於食蓼虫曽献王建詩有栗爆燒氊破猫跳觸鼎翻後建冬夜與潘峭平章邊事旋令宫人燒栗俄有數栗爆出燒繡褥時建多疑嘗於爐中燒金鼎命二妃親侍湯茶而已是夜宫猫相戯悞觸鼎飜建良乆曰栗爆燒氊破猫跳觸鼎飜憶得盧延遜卷有此一聮乃知先軰裁詩信無虚境來日遂有六行之拜拜工部自給事中翰林學士呉融獨重其作盛稱於時且云此子語不尋常後必垂名楊大年云延遜詩至今存人亦有絶好之者其播人口有旅舍言懐云名帋毛生五門下家僮骨立六街中蜀路云雲間閙鐸騾䭾至雪裏殘骸虎拽來懐江上云餓猫臨䑕穴嚵犬䑛魚砧八月十六日夜云只訛㱔子縁應耗沒多光寄人云吟安一个字撚斷數莖鬚冬夜云樹上諮諏批頰鳥牎間壁駮叩頭虫哭人云漸竆頑僕慵看馬著慘佳人暗理筝狐衝官道過犬刺店門開租張相毎稱之餓猫臨䑕穴嚵犬䑛魚砧成中令毎稱之栗爆猫跳之句王建愛之盧曰平生投謁公卿不意得猫狗力延遜始投贄呉子華子華讀至不同文賦易爲下者之乎笑曰上門悪罵來本朝楊億在翰苑嘗召對上言及延遜詩曰臂鷹徤卒懸氊㡌騎馬佳人卷畫衫似此淺近亦自成一體延遜字子善范陽人光化初登第從事朗陵雷滿敗歸王建僣位授水部外郎卒於刑部侍郎師薛能爲文裴說裴詣唐舉子先投所業於公卿之門謂之行卷說只行五言十九首至來年秋賦復行舊卷人有譏之者說曰只此十九首苦吟尚未有人見知何假别行卷哉識者以爲知言說天復六年登甲科其詩以苦吟難得爲工且拘格律嘗有詩曰苦吟僧入定得句将成功又贈僧貫休云揔無方是法難得始爲詩又云是事精皆易唯詩㑹却難遭亂故宦不逹多遊江湖間有石首縣詩云因携一家住嬴得半年吟深閨乍冷鑑開篋玉筯微微濕紅頰一陣霜風殺栁條濃烟半夜成黄葉垂垂白練明如雪獨下閒堦轉凄切秪知抱杵搗秋砧不覺髙樓已無月時聞寒鴈聲相喚紗牎只有燈相伴幾度齊紈又嬾裁離腸恐逐金刀斷細想儀形執牙尺回刀剪破澄江色愁捻銀針信手縫惆悵無人試寛窄時時舉袖勻紅淚紅牋謾有千千字書中不盡心中事一半慇懃寄邊使此說聞砧詩也說終禮部貟外郎說與詣俱有詩名詣唐天祐三年登第終於桂嶺假官宰字而已同在湘江說詩云吟餘潮落岸水髙經杜甫墳說云擬掘孤墳破重教大雅生詣云名終埋不得骨便朽何妨景同而語意俱别寔爲䨥美説旅行聞冦云寸歩邊多事将行間四隣深山不畏虎當路却防人無事助明代何門銷此身空慙兩行淚飄洒向紅塵洛中作云莫怪苦吟遲詩成鬢亦絲鬢絲猶可染詩病却難醫山暝雲横處星沉月側時㝠收不堪得一句至公知中秋月云一歳㡬盈虧當軒重此期幸無偏照處剛有不明時色靜雲歸早光凝故宿遲望吟吟未足皎皎下踈籬棊云十九條平路言平又嶮巇人心無筭處國手有輸時勢逈流星逺聲乾下雹遲臨軒纔一局寒日又西垂喜友人再面云一别㡬寒暄迢迢隔塞垣相思長有事及見却無言靜坐将茶試閑書把葉飜依依又留宿圎月上東軒張爲秋醉歌云金風䬃已起還是招魚翁携酒夫姥岑自彈嶧陽桐脫却登山履赤脚翹青笻泉聲掃殘暑猿臂攀長松翠㣲泛罇緑苔蘚分煙紅造化處術内相對數壺空醉眠嶺上草不覺夜露濃一夢到天曉始覺一醉中皎然夢中路直到瀛洲東初平把我臂相與騎白龍三留對上帝玉樓十二重上帝賜我酒送我敲金鍾寳閣香歛苒琪樹寒玲瓏動葉如笙篁音律相怡融珎重此一醉百骸出天地長如此夢䰟永謝名與利爲唐末江南詩人與周朴齊名如到處即閉戸逢君方展眉最有詩稱爲作詩人主客圗序曰若主人門下處其客者以法度一則也以白居易為廣大教化主上入室楊乗入室張祐羊士諤元稹升堂盧仝顧况沈亞之及門費冠卿皇甫松殷堯藩施肩吾周元範况元膺徐凝朱可名陳摽童翰卿以孟雲卿為髙古奥逸主上入室韋應物入室李賀杜牧李餘劉猛李渉胡幽正升堂李觀賈馳李宣古曽鄴劉駕孟遲及門陳潤韋楚老以李益為清竒推正主上入室蘇郁入室劉畋僧清塞盧休于鵠楊洵羙張籍楊巨源楊敬之僧無可姚合升堂方干馬戴任蕃賈島厲元項斯孽夀及門僧良乂潘誠于武陵詹雄衞凖僧志定喻島朱慶餘以孟郊爲清竒僻苦主上入室陳陶周朴及門劉得仁李溟以鮑溶爲愽容宏㧞主上入室李群玉入室司馬退之張爲以武元衡爲瓌竒羙麗主上入室劉禹錫入室趙嘏長孫佐輔曺庚升堂盧頻陳羽許渾張蕭逺及門張陵章孝摽雍陶周祚袁不釣杜光庭載毛仙翁事云仙翁名干字鴻漸元和間劉禹錫李紳白樂天軰皆贈詩至大中戊寅五十餘年矣是歳張爲薄遊長沙不汲汲隨計獲女奴於岳麓下惑之嵗餘成羸疾仙翁一見曰子妖氣邪光浹遍肌骨茍不相值殞於旦夕也以一粒授為於香炉焚之郁烈之氣聞百歩魅妾一號而斃乃木偶人也又吞以丹砂和黍者三疾遂瘳為作詩别之曰羸形感神藥削骨生豊肌蘭炷飄靈煙妖怪立誅夷重覩日月光何報父母慈黄河濁衮衮别淚澌流澌黄河清有時别淚無收期為後入釣䑓山訪道而去韓偓偓父瞻開成六年李義山同年也義山有餞韓同年西迎家室戯贈云籍籍征西万戸侯新縁貴婿起珠樓一名我漫居先甲千騎君翻在上頭雲路招邀囬綵鳯天河迢逓笑牽牛南朝禁臠無人寄痩尽瓊枝爲四愁偓小字冬郎義山云嘗即席為詩相送一座盡驚句有老成之風因有詩云十歳裁詩走馬成冷灰殘燭動離情桐花万里丹山路雛鳯清於老鳯聲偓字致堯今曰致光誤矣自號玉山樵人苑中云上苑離宫處處迷相風髙與露盤齊金階鑄出狻猊立玉柱雕成翡翠啼外使調鷹初得按外案五坊始能禽獲之得案使以鷹集初調習中官過馬不敎嘶駿以進謂之過上乗馬必中官馬笙歌錦綉雲霄裏獨許詞臣醉似泥六月十七日召對詩云清暑簾開散異香恩深咫尺對龍章花應洞裏尋常發日向壺中特地長生長忽凝槎犯斗歸來兼恐海生桑如今冷笑東方朔唯用詼諧侍漢皇與呉子華侍郎同年玉堂伴直懐昔叙懇因成長句兼呈同年云徃年鸎谷接清塵今日鼇山作侍臣二紀許諧勞筆硯一朝宣入掌絲綸乆困名場予與子華俱聲名烜赫文章士金紫雍容冨貴身綘帳恩深無路報語餘相聚却酸辛賜宴日詩云玉衘花馬踏天街詔遣追歡綺席開中使押從天上去外人知自日邊來門齊人司進狀辞是日在外四考排二人押出赴宴中使臣心淨比漪漣水聖澤深於㶑灔柸才有異恩頒稷卨已将優禮及鄒枚清啇逈向黎園降妖妓新行峽雨廽不散通霄離禁直晚來殘醉入銀盃醉着云万里清江万里天一村桑柘一村㷑漁翁醉着無人喚過午醒來雪滿舡即日云書墻暗記移花日洗瓮先知醖酒期須信閑人有忙事早來衝雨覔漁師春恨云殘夢依依酒力餘城頭批頰伴啼烏平明乍捲西樓幕院靜初聞放轆轤并州云戍旗靑草杜榆關雨裏并州四月寒誰㑹慿欄潜忍淚不勝天際似江千偓天復初入翰林其年冬駕幸鳯翔偓有扈從之功返正初上面許偓為相奏云陛下運契中興當復用重徳鎮風俗臣座主右僕射趙崇可充是選乞逥臣之命授崇天下幸甚上喜歎翌日制用崇暨兵部侍郎王賛為相時梁太祖在京素聞崇之輕佻賛復有舋馳入請見於上前具言二公長短上曰趙崇是偓薦時偓在側梁主叱之偓奏曰臣不敢與大臣爭上曰韓偓出尋謫官入閩故䆫外日光飛野馬案前筠管長蒲盧謀身拙爲安蛇足報國危曽捋虎鬚滿世可能無黙識未知誰擬試齊竽香奩集和魯公之詞也惟其艶麗故貴後嫁其名於偓凝平生著述分為縯論遊藝孝悌疑獄香奩籝金六集自爲遊藝集序云予有香奩籝金集不行於世凝在政府避議論諱其名又欲後人知故遊藝集序實之此凝之意也沈存中云曹松天復初杜徳祥主文放松及王希羽劉象柯崇鄭希顔等及第年皆七十餘時号五老牓時内難新平首求孤貧人徳祥以松等塞詔各授校書郎制曰念尔登科之際當予反正之年宜降異恩各膺寵命松字夢徵舒州人也學賈司倉為詩此外無他能時號松啓事爲送羊脚狀松别湖州上主人云門繋釣舟雲滿岸借君幽致坐移旬湖村夜呌白蕪鴈菱市曉暄深浦人逺水日邊重作雪寒林燒後别生春不辞更後醒還醉太一東峯歸夢頻李肇國史補云曲江大㑹此爲下第舉人迩來漸侈靡皆為上列所占向之下第舉人不復預矣所以逼大㑹則先牒教坊請奏上御紫雲樓簾觀焉時或擬作樂則為之移目故曹松詩云追逰若遇三清樂行從應妨一日春勑下後人置皮袋例以圖章酒器錢絹實其中逢花即飲故張籍詩云無人不借花園宿到處皆携酒器行其皮袋狀元録事同㸃撿闕一則罰金曲江之宴行市羅列安僅為之半空公卿家率以是日揀選東牀車馬闐塞莫可殫述松及苐勑下宴中献坐主杜侍郎詩云得召丘墻淚却頻若無公道也無因門前送勑朱衣吏席上衘盃碧落人半夜笙歌敎泥月平明桃杏放燒春南山雖有歸溪路争那酬恩未殺身春日長安書事云浩浩㸔花晨六街楊逺塵塵中一丈日誰是晏眠人御栁舞着水野鶯啼春破徒云還楚客猶自惜離情晨起云曉色教不睡卷簾清氣中林殘數枝月髪冷一梳風並鳥聞鍾語欹荷隔霧空莫徒營白日道路本無窮弔北印云山下望山上夕陽明又曛無人醫白髪少地着新墳歳代殊相逺賢愚旋不分東歸聊一弔乱木倚寒雲松有詩云憑君莫話封侯事一將功成万骨枯可謂諳世故矣杜荀鸖荀鸖有詩名號九華山人大順初擢第授翰林學士主客外郎知制誥序其文爲唐風集或曰荀鸖牧之微子也牧之㑹昌末自齊安移守秋浦時年四十四所謂使君四十四兩佩在銅魚者也時妾有姙出嫁長林郷正杜筠而生荀鸖擢第年四十六矣溪興云山雨溪風卷釣絲瓦甌蓬厎獨斟時醉來睡着無人喚流下前溪也不知春宫怨云早被嬋娟誤欲粧臨鏡慵承恩不在貌教妾若為容風暖鳥聲碎日髙花影重年年越溪女相憶採芙蓉荀鸖曽得詩一聮云舊衣灰絮絮新酒竹蒭蒭韋荘曰我道印將金鎻鎻簾用玉鈎鈎即京兆太拜之祥也贈僧云利門名路兩何憑百歳風前短熖燈只恐爲僧心不了爲僧心了揔輸僧時世行云夫因兵死守蓬茅麻紵裙衫鬢髮焦桑柘廢來猶納稅田園荒盡尚徵苗時挑野菜和根煑旋斫生柴帶葉燒任是深山更深處也應無計避征徭又云八十老翁住破村村中牢落不堪論因供寨木無桑柘為㸃鄉兵絶子孫還似平寜徴賦稅未曽州縣畧安存至今鷄犬皆星散日落西山哭倚門荀鸖擢第時危勢晏復還舊山田頵在宣州甚重之頵起兵隂令以牋問至梁太祖許頗厚遇及頵遇禍梁祖表授翰林學士主客貟外郎中知制誥恃勢侮易搢紳衆怒欲殺之而未及天祐初卒顧雲序其詩曰大順初皇帝命小宗伯河東裴公掌邦貢次二年逺者來隠者出異人雋士大集都下於群進士中得九華山人杜荀鸖㧞居上第諸生謝恩日列座既定公揖生謂曰聖上歉文敎未張思得如髙宗朝射洪拾遺陳公宗廣諱名犯文作詩出没二雅馳驟建安削苦澁僻碎略淫靡淺切破豔冶之堅陣擒雕巧之酋帥皆摧犝折角崩潰解散掃蕩詞塲豁淸文祲然後有戴容州劉隋州王江寜率其徒揚鞭按轡相與呵樂來朝於正道矣以生詩有陳體可以潤國風廣王澤故擢以塞詔意勉為中興詩宗生謝而退明年寜親江表以僕故山偕隠者出詩三百篇見簡其雅麗疑越之句能使貪吏亷邪臣正父慈子孝兄友弟悌人倫之紀備矣其壯語大言則决起逸發可以左攬工部袂右拍翰林肩吞賈喻八九於􅎍中曽不蠆介情動於中則極思冥搜神逰希夷形瓦枯未五聲勞於呼吸万象貧於抉剔信詩之雄傑者也羙哉裴公知人之爲不誣矣於戯旌别淑慝史臣之職僕幸得為之叙録視其人齒尚壯才力未尽謳吟之興方酣俟其継作得如周頌者目之爲唐風集荀鸖初謁梁王朱全忠雨作而天無行雲梁曰此謂天泣知何祥請先作無雲雨詩乃賦曰同是乾坤事不同雨絲飛洒日輪中若教隂都相似争表梁王造化工梁悅之孫棨題妓王福娘墻詩云移壁廽牎廢幾朝指鐶偷解愽蘭椒無端闘草輸隣女更被捻將玉歩揺鄭谷寄臺院孫端公棨詩云才拙道仍孤無何捨釣徒班雖沾玉笋香不近金炉雨露瞻雙闕㷑波隔五湖唯君應是念曽共伏靑蒲諌垣曽同棨贈妓人云綵翠仙衣紅玉膚輕盈年在破瓜初霞盃醉喚劉郎賭雲髻慵邀阿母梳不怕寒侵縁帶寳毎憂風舉倩持裾謾圖西子為粧様西子元來未得如題北里妓人壁云寒繡衣裳餉阿嬌新圗香獸不禁燒東隣起様裙腰闊剰蹙黄金一兩條王鐸鐸字昭範重徳名家位望崇顯率由文雅非定乱才鎮渚宫為都統以禦巢冦洎荆州失守復把潼関黄巢差人傳語云令公儒生非我敵請自退避無汚鋒刃於是棄関於隨僖宗播迁於蜀再授都統收復京師大勲不成竟落都統後有詩其要云黜詔已聞來闕下檄書猶未遍軍前亦志其中也罷都統守鎮滑州作云用軍何事敢迁延恩重才輕分使然黜詔已聞來闕下檄書猶未遍軍前腰間尽解蘇秦印波上虚迎范蠡船正㑹星辰扶北極却驅戈甲鎮南燕三塵上相逢明主九合諸侯媿昔賢㸔却中興扶大業殺身無路好歸田鐸為侍御史于興宗守綿州登越王樓以詩寄朝士鐸和云謝眺題詩處危樓壓郡城雨餘江水碧雲断雪山明錦綉來仙境風光八帝京恨無靑玉案何以報髙情鐸謁梓潼張惡子廟詩曰盛唐聖主解靑萍欲振新封済順名夜雨龍抛三尺匣靑雲鳯入九重城宗幸時僖云春内必還京蜀人情術士皆劒明喜氣随雷動玉壘韶光待賊平惟報関東諸将相柱天功業頼隂兵判度支蕭遇和云靑骨祀呉誰讓徳紫華居越亦知名未聞一劒傳唐王長擁千山䕶蜀城斬馬威稜應掃蕩截蛟鋒刄俟昇平鄼侯爲國親簫皷堂上神籌更布兵神故二公賦詩時僖宗解劔贈鄭綮古今詩話曰相國綮善詩有題老僧詩云日照四山雪老僧門未開凍瓶粘柱礎宿火烬炉灰童子病歸去鹿麑寒入來常云此詩屬對可以衡秤言輕重不偏也或曰相囯近爲新詩否對曰詩思在㶚橋風雪中驢子上此處何以得之蓋言平生苦心也綮字藴武大順後王政微綮毎以詩謡託諷中人有誦之天子前者昭宗意其所藴未盡因有司上班簿遂書其側曰可禮部侍郎同中書門下平章事綮本善詩其語多俳諧故使落調世號鄭五歇後體至是省史走其家上謁綮笑曰諸君誤矣人皆不識字宰相亦不及我俄聞制下歎曰歇後鄭五作宰相事可知矣立朝無復故態纔三月去位綮刺盧江將去别郡人云唯有兩行公廨淚一時灑向渡頭風其滑稽類此胡玢玢不知何許人嘗隠廬山苦心於五七言桑落洲一篇云莫問桑田事但㸔桑落洲數家新住處昔日大江流古岸崩欲盡平沙長未休想應百年後人世更悠悠又月詩云輪中别有物寕有土改云桂根光外更無空玢山與李騰簾問江西弓旌不至楊牧字藏之吴人呼爲神童兄發戯令詠蛙即曰兔邊分玉樹龍底耀同儀㑹當同鼓吹不復問官私又令詠筆仍賦鑚字即曰雖匪囊中物何堅不可鑚一朝操政事定使冠三端吴人造門請詩觀者壓敗其墻牧嘲曰爾幸無羸角何用觸吾藩若是升堂者還應自得門平曽曽謁華州李固言不遇因吟一絶而去曰老夫三日門前立珠箔銀屏晝不開詩卷却抛書袋裏正如閑㸔華山來曽恃才傲物竟殁於縣曹薛平僕射出鎭浙西主禮稍薄曽留詩以諷之曰梯山航海㡬﨑嶇來謁金陵薛大夫毛髪竪時趍劒㦸衣冠儼處拜氷壺誠知兩軸非珠玉深愧三縑䘏旅途明日過江風景好不堪回首望勾吴薛聞曽出境遣使追還縻留數日又献絷白馬詩曰白馬披鬃練一團今朝被絆欲行難雪中放去空留跡月下牽來只見鞍向北長鳴天外逺臨風斜控耳邊寒自知毛骨還應異更請孫楊子細㸔河東公曰若不留絆行軒即得觀其毛骨遂以殊禮相待唐以府元被絀者九人曽其一也曽長慶二年同賈閬仙軰貶謂之舉場十悪曽後謁固於蜀幕中皆名士曽輕忽無所畏遂獻雪山賦李覽命推出不旬日再獻鯸魚賦曰此魚觸物而怒翻身上波為烏鳶所獲奈魴鯉之何李覽之遂不至深罪繆島雲島雲少從浮圗其詩尤尚竒險至如四五片霞生絶壁兩三行鴈過踈松又抛芥子降顛拂拂折楊枝灑醉惺惺廬山瀑布曰白鳥逺行樹玉虹孤飲潭皆敻出前軰開成中常逰豫章武宗朝淮勑反初名甚喧然唐詩紀事卷第六十五
