front:
  text: 唐詩紀事卷第二十
  hash: sha256:871eedd4e6136a1e15bf79932364e792cfd0be0d778638d3b93ad122668437d4
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_020-1a}
body:
  text: 鄭䖍嚴武史俊李適之祖詠李頎綦母潜趙謙光李元操薛令之張諲陶翰顔舒王琚王熊薛維翰崔亘朱琳王冷然萬楚胡皓袁瓘柳識高力士高霽息夫牧崔曙鄭䖍䖍閨情云銀鑰開香閣金臺㸃夜燈長征君自慣獨卧妾何曽子美詩云鶢鶋至魯門不識鍾皷饗孔翠望青霄愁思彫籠養滎陽冠衆儒早聞名公賞地崇士大夫况乃清氣爽天然生知姿學立游夏上神農或闕漏黃石愧師長藥纂西極名兵流指諸掌貫穿無遺恨薈蕞何技癢圭臬星經奥蟲篆丹青廣當世著書八十按新史䖍集撰坐謫十年命其書爲㑹猝孔子作春秋㳺夏不能賛余篇有窺其藁者上書告䖍私撰國史䖍蒼黄焚之古書也言䖍無不貫穿復通游藝星經丹青之類皇猷䖍私撰國史出其上也神農黄石藥纂兵流者子雲窺未遍方朔諧太枉神翰顧不一躰變鍾兼兩葉數屋䖍取筆書歳乆皆遍矣䖍好書及畫恨無紙慈恩寺貯𥙷文傳天下口大字猶在牓昔獻書画圖新詩亦俱徃滄洲動玉陛宣鶴誤一響三絶自御題四方尤所仰以獻帝大署其尾䖍自寫其詩并畫宣一作寡曰鄭䖍三絶嗜酒益踈放云頼得蘇司業時時與酒䖍嗜酒踈放故杜南贈詩源明也錢蘇司業彈琴視天壤形骸實土木親近唯几杖未曽寄官曹突兀倚書幌欲置左右以不事事更爲置䖍𥘉坐謫還京師上愛其材宰相曰上橧國學置廣文舘以居賢者令後世言廣廣文舘以䖍爲愽士䖍聞命不知廣文曹司何在訴始不亦美乎文愽士自君晚就芸香閣胡塵昬坱莾反覆歸聖朝㸃染無滌蕩老䝉台州椽泛泛浙江槳張通儒劫百安禄山反遣潜以宻逹達靈武賊平免死貶台州司戸參軍官置東都僞受水部郎中因稱風緩求攝市令履穿四明雪飢拾楢溪橡空聞紫芝歌不見杏壇丈天長眺東南秋色餘魍魎别離慘至今班白徒懐曩春深秦山秀葉墜清渭朗劇談王侯門野稅林下鞅操𥿄終夕酣時物集遐想詞塲竟踈闊平昔濫吹奬百年見存沒牢落吾安放蕭條阮咸在出處同世網他日傍江樓含悽述飄蕩作寡鸖宣鸖一䖍滎陽人天寳𥘉爲恊律郎或告其私撰國史坐謫十年還京爲廣文愽士自寫其詩畫以獻帝書曰鄭䖍三絶禄山反劫爲攝部郎中乃託風緩求水市令而以宻草逹靈武賊平坐王維下迁而䖍貶台州司戸參軍後數年卒䖍著薈蕞等諸書之外又撰胡本草七卷詩中及之子美云䖍與今秘書監鄭審編翰齊價謫江陵故有阮咸江樓之句嚴武卧向巴山落月時兩郷千里夢相思可但歩兵偏愛酒也知光禄最能詩謝荘阮籍江頭赤葉楓愁客籬外黃花籬對誰䟦馬望君非一度冷猿秋雁不勝悲荅子巴嶺簇鞍馬回首白雲間美見憶子美詩云遥知漫向江頭把釣竿懶眠沙草愛風湍莫倚善題鸚鵡賦何湏不着鵕䴊冠中侍腹中書籍幽時曬肘後醫方靜處看興發㑹能馳駿馬終須重到使君灘錦江野亭寄題杜二子美八哀詩云鄭公瑚璉器華岳金天晶昔在童子日巳聞老成名嶷然大賢後復見秀骨清中書侍郎嚴武傳武書不究精義渉獵而巳大賢謂嚴子陵歟挺之子神氣雋爽敏於聞見㓜有成人風讀開口取將相小心事犮生牀呼斥其父名而武不忤甫與武世契也嘗醉登武閱書百𥿄盡落筆四座驚歴職匪父任嫉邪常力爭以門䕃武弱冠傑武挺節赴行在宰相房琯素重之及是首薦才畧䇿名哥舒翰奏克判官至德𥘉肅宗𥘉靖難大收才給事中可稱累迁漌儀尚整肅侍御史時武爲胡騎忽縱横亂也禄山之飛傳自河壠逢人問公卿不知萬乗出雪涕風悲武受詞劒閣道謁帝蕭關城新舊二史皆不載河壠劍閣䔥関城事寂寞雲䑓仗飃䬙沙塞旌江山少使者笳皷凝皇情壯士血相視忠臣氣不平宻論正觀躰揮發𡵨陽征宗兵時肅翔鳳感激動四極聯翩收二京史皆不載武收復功二京長安東都也二西郊牛酒再原廟丹青明匡汲俄寵辱衛霍竟哀榮四登薈府地時年二十三後又還京兆尹兼御史大夫旣收長安以武爲京兆少尹兼御史中丞三掌華陽兵優㳺京師頗自矜大出爲綿州剌史迁華陽成都也武以史思明阻兵不之官道拜武成都尹充劒南節度使入復求爲方靣拜成劒南東川節度使登發上皇誥以劒南兩川合爲一恣行猛政威震一方都尹在蜀累年肆志逞京兆空柳色尚書無履聲群烏日朝夕白馬休横行諸葛蜀人愛文翁儒化成公來雪山重公去雪山輕記室得何遜韜鈴延子荆四郊失壁壘此美武能鎮静也失壁壘言無出戍也虚舘開逢迎堂上指畫圖軍中吹玉笙豈無成都酒憂國只細傾時觀錦水釣問俗終相并意待犬戎滅人藏紅粟盈以兹報主願庶或禆世程烱烱一心在沉沉二豎嬰顔回竟短折賈誼徒忠貞飛旐出江漢孤舟轉荆衡虚無馬融笛悵望龍驤塋空餘老賔客身上媿簮纓武年二十二爲給事黃門郎明年擁旄西蜀杜甫乗醉言不謂嚴挺之乃有此子也武恚目久之曰杜審言孫子擬捋虎鬚合坐皆笑以彌縫之房太尉琯徴有所悞憂怖成疾李太白作蜀道難爲房杜危之也武字季鷹永泰𥘉卒母哭且曰而今而後吾知免爲官婢矣子美送武入朝有鼎湖瞻望逺象闕憲章新之作武酬别云獨逢堯典日再覩漢宫時未効風霜勁空慙雨露私夜鍾清萬户曉漏拂千旗並向斜亭謁俱承别舘追斗城憐舊路渦水惜歸期峰樹還相伴江雲更對誰試廻滄海掉更和敬亭詩祗是書應寄無忘酒共持但令心事在未肯鬢毛衰最悵巴山裏清猿惱夢思武題巴州光福寺楠朩云楚江長楚寺對楠朩幽生赤崖背臨溪挿石盤老根苔色青蒼山雨㾗高枝閙葉鳥不度半掩白雲朝與暮香殿蕭條轉宻隂花龕滳瀝垂清露聞道偏多越水頭煙生霧歛使人愁月明忽憶湘川夜猿呌還思鄂渚秋看君幽靄㡬千丈寂寞窮山今遇賞亦知鍾𣑽報黃昏猶卧禪床戀竒響史俊題巴州光福寺楠木云近郭城南山寺深亭亭竒樹出禪林結根幽壑不知歳聳幹摩天凡㡬尋翠色晚將嵐氣合月光時有夜猿吟經行緑葉望成蓋宴坐黃花長滿襟此朩嘗聞生豫章今朝獨秀在巴郷凌霜不肯讓松栢作宇猶來稱棟樑㑹待良工時一盻應歸法水作慈航嚴武作巴山賦楠朩歌俊後以監察御史來臨是邦亦賦焉李適之常山愍王孫天寳𥘉代牛仙客爲左相適之未罷相也朝退毎邀賔戚談諧賦詩曽賦云朱門長不閉親友恣相過年今將半百不樂復如何後爲林甫所譛罷乃爲詩曰避賢𥘉罷相樂聖且㗸盃爲問門前客今朝㡬箇來適之入仕不歷丞簿便爲别駕不歷兩畿官便爲京兆尹不歷御史及中丞便爲大夫不歷兩省給舎便爲宰相不歷剌史便爲節度使然不得其死祖詠古意二首楚王竟何去獨自留巫山偏使世人見迢遥江水間駐舟春潭裏誓願拜靈顔夢寐覩神女金沙鳴珮環閑艶絶世姿令人氣力微含笑黙不語化作雲朝飛夫差日滛放舉國求妃嬪自謂得王寵代間無美人碧羅䝉天閣坐輦乗芳春宫女數千騎常逰江水濵年深玉顔老時薄花粧新拭淚下金殿嬌多不顧身生前妬歌舞死後同灰塵塜墓令人哀哀於銅雀臺有司試終南山望餘雪詩詠賦云終南隂嶺秀積雪浮雲端林表明霽色城中増暮寒四句即納于有司或詰之詠曰意盡陸渾水亭云晝眺伊川水巖間霽色明淺沙平有路流水漫無聲浴鳥㳂波聚潜鱗觸釣驚更尋春岸上幽意滿山楹王維有喜祖三至留宿詩詠云四年不相見相見復何爲握手言未畢却令傷别離升堂還駐馬酌醴便呼兒語黙自相對安用旁人知最善詠與維詠登開元進士第商璠云詠詩剪刻省淨用思尤苦氣雖不高調頗淩俗至如霽日園林好清明煙火新亦可稱爲才子也張說在并州厚遇王翰旣相引爲駕部外員郎說罷相出翰仙州别駕至郡日聚英豪從禽擊皷恣爲歡賞詠與杜華嘗在座翰坐是貶道州司馬開元中進士唱第尚書省落第者至省門散去詠吟曰落去他兩兩三三戴㡌子日暮祖侯吟一聲長安竹栢皆枯死留别盧象云朝來巳握手宿别更傷心㶚水行人渡啇山驛路深故情君且足謫䆠我難任直道皆如此誰能淚滿襟蘭峰贈張九臯云君王旣巡狩輦路入秦京逺樹低蒼壘孤山出草城寒踈清禁漏夜警羽林兵誰念迷方客長懐魏國情蘇氏别業云别業居幽處到來生隱心南山當戸牗豊水在園林屋覆經冬雪庭昏未夕隂寥寥人境外閑坐聽春禽夕次圃田店云前路入鄭郊向經百餘里馬煩時欲歇客歸程未巳落日桑柘隂遥村烟火起西還不皇宿中夜渡涇水題韓少府山亭云梅福幽棲處佳期不忘還鳥啼當戸竹花遶傍池山水氣侵堦冷藤隂覆坐閑寜知武陵趣宛在市朝間姚合以爲極元集自留别盧象以下五篇清明宴劉司勲别業云田家復近臣行樂不遺親霽日園林好清明煙火新以文常㑹友唯徳自成隣池照窓隂晚杯香藥味春簷前花覆地竹外鳥窺人似何桃源裏深居作隱淪李頎緩歌行云小來託身攀貴逰傾財破産無所憂暮夜經過石渠署朝將出入銅龍樓結交杜陵輕薄子誰言可生復可死一沉一浮㑹有時棄我翻然如脫屣男兒立身須自強十年閉戸潁水陽業就功成見明主擊鍾鼎食坐華堂二八蛾眉梳墮馬美酒清歌曲房下文昌宫中賜錦衣長安陌上退朝歸五陵賔從莫相視三省官寮揖者稀早知今日讀書是悔作從來狂俠児聽董大彈胡笳聲兼語弄寄房給事云蔡女昔造胡笳聲一彈一十有八拍胡人落淚向邉草漢使斷腸對歸客古戍蒼蒼烽火寒大荒隂沉飛雪白先拂商弦後角羽四郊秋葉驚摵摵董夫子通神明深山竊聽來妖精言遲更速皆應手將徃復旋如有情空山百鳥散還合萬里浮雲隂且明斯酸雛鷹失群夜斷絶胡児戀母聲川爲靜其波鳥亦罷其鳴烏珠部落家郷逺羅逤沙塵哀怨生岀音變調忽飃灑長風吹林雨墮瓦迸泉颯颯飛木末野鹿􅊯􅊯走堂下長安城連東掖垣鳳凰池對青瑣門高才脫略名與利日夕望君抱琴至漁父歌云白頭何老人簔笠蔽其身避世常不任釣魚清江濵浦沙明濯足山月靜垂綸寓宿湍與瀬行歌秋復春持竽湘岸竹爇火蘆州薪緑水飯香稻青荷苞紫鱗於中還自樂所欲全吾眞而笑獨醒者臨流多苦辛送曁道士還玉清詩云仙官有名籍度世呉江濵大道本無我青春長與君中州俄巳到至理得而聞明主降黃屋時人看白雲空山何窈窕三秀日氛氲遂此留書客超遥煙駕分樂天放言詩序云元九在江陵有放言長句詩五韻韻高而躰律意古而詞新雖前輦深於詩者未有此作唯李頎有云濟水至清河自濁周公大聖接輿狂斯句近之矣聖善閣送裴廸入京云雪華歛高閤苔色上鈎欄藥草空階靜梧桐返照寒清吟可愈疾携手暫同歡墜葉如金磬飢烏鳴露盤伊川惜東别㶚水向西看舊託含香署雲霄可足難題濬公山池云逺公遁跡廬山岑開山岀居祗樹林片石孤峰窺色相清池白月㸃禪心指揮如意天花落坐卧閑房春草深此外俗塵都不染唯餘玄度得相尋王摩詰贈頎詩云聞君餌丹砂甚有好顔色不知從今去㡬時生羽翼王母翳華芝望爾崑崙側文螭從赤豹萬里方走息悲哉世上人甘此羶腥食頎開元進士也啇璠云頎詩發調旣清修詞亦麗漁父歌咸善玄理最長故其論道家徃往高於衆作頎東郊寄萬楚云濩落乆無用隱身甘采薇仍聞薄䆠者還事田家衣頴水日夜流故人相見稀春山不可望黃鳥東南飛濯足豈長徃一罇聊可依了然潭上月適我胷中機在昔同門友如今出處非優游白虎殿出入青瑣闈且有薦君表當看携手歸寄晝不代靣蘭茞空芳菲河岳英靈此詩取於王母歌云武皇齋戒承華殿端拱須臾王母見霓旌照曜麒麟車羽蓋淋漓孔雀扇手指交梨遣帝食可以長生臨㝢縣頭上復帶九星冠揔領玉皇坐南面欲聞要言今告汝帝乃焚香請此語若能鍊䰟去三尸後當見我天皇所顧謂侍女董雙成酒闌可奏雲和笙紅霞白日儼不動七龍五鳯紛相迎惜哉志驕神不悅歎息馬蹄與車轍複道歌鍾查將暮深宫桃李花成雪爲看青玉五枝燈蟠螭吐火光巳絶綦母潜字孝通開元中繇宜夀尉入集賢院待制迁右拾遺終著作郎早發上東門云十五能行西入秦三十無家作路人時命不將明主合紫衣空染洛陽塵唐類詩顧陶取爲春泛若耶詩云幽意無斷絶此去隨所偶晚風吹行舟花路入溪口際夜轉西壑隔山望南斗潭煙飛溶溶林月低向後生事且彌漫願爲持竿叟王摩詰别潜詩云端笏明光宫歴稔朝雲陛詔刋延閤書高義平津邸適意輕偶人虚心削繁禮盛得江左風彌工建安躰高張多絶絃截河有清濟嚴冬爽群木伊洛方清泚渭水氷下流潼關雪中啓符條㡬時還塵纓待君洗韋蘇州寄淮上綦母三詩云滿城憐傲吏終日賦新詩請報淮隂客春㠶浪作期商璠云拾遺詩舉躰清秀蕭蕭跨俗桑門之說於巳獨能至如松覆山殿冷不可多得又鍾聲和白雲歴代少有借使若人加氣質減彫餙則髙視三百年外也題靈隱寺山頂禪院云招提此山頂下界不相聞塔影挂清漢鍾聲和白雲觀空淨室掩行道衆香焚且駐西來駕人天日未曛若耶溪逢孔九云相逄此溪曲勝託在烟霞潭裏竹影動嵓隂簷外斜人生上皇代大吠武陵家借問淹留日春深歸若耶冬夜寓居贈儲太祝云自爲洛陽客夫子吾知音盡義能下士時人無此心柰何離居夜巢鳥空悲林愁坐至月上復聞南隣砧過禪居云山頭禪室挂僧衣牕外無人溪鳥啼黃昏半在下山路却聽松聲連翠微題鶴林寺云道門隱形勝向背臨法橋松覆山殿冷花藏溪路遥珊珊寳幡挂熖熖明燈燒遲日半空谷春風連上朝少憑水朩興蹔忝身心調願謝携手客兹山禪侣饒李頎送綦母三謁房給事云夫子大名下家無鍾石儲惜哉湖海上曾校蓬萊書外物非本意此生空澹如所思但乗興逺適唯單車高道時坎軻舊交願吹嘘徒言青瑣闥不愛承明廬百里人戸滿片言諍訟踈手持蓮花經目送飛鳥餘晚景南路别炎雲中伏𥘉此行儻不遂歸食廬洲魚趙謙光賀遂涉唐諸郎中不自貟外郎拜者謂之土山頭果毅便拜崇品有似長征兵士便授邊逺果毅謙光自彭州司馬入爲大理正遷戸部郎中戸部員外賀遂渉詠曰員外由來美郎中望亦優寜知粉署裏翻作土山頭謙光荅詩曰錦帳隨情設金爐任意薰唯愁員外置不應列星文謙光登咸亨進士第李元操和從叔禄愔元日早朝云銅渾變秋節玉律動年灰曖曖城霞旦隱隱禁門開衆靈湊仙府百神朝帝䑓葉令雙鳬至梁王駟馬來戈鋋映林闕歌管拂塵埃保章望瑞氣尚書免火災冠冕多秀士簮𥚑饒上才誰憐張仲蔚日暮反蒿萊元操開元𥘉詩人也薛令之令之閩之長溪人及第遷右庶子開元中東宫官僚清淡令之題詩自悼曰朝日上團團照見先生盤盤中何所有苜蓿長闌干飯澁時難綰羔稀筯易寛無以謀朝夕何由保歳寒上幸東宫覽之索筆題其傍曰啄木口觜長鳯凰羽毛短若嫌松桂寒任逐桑煖榆令之遂謝病歸肅宗爲太子賀知章自右庶子遷賔客授秘書監令之以右𥙷闕兼侍讀積歳不遷故令之棄官徒歩歸郷里而知章自號秘書外監晚節尤誕放肅宗乾元𥘉以雅舊贈知章禮部尚書亦以舊恩召令之而令之巳前卒張諲諲官至刑部員外郎善草隷工丹青與王維李頎等爲詩酒丹青之友尤善畫山水王維荅詩曰屏風誤㸃感孫郎團扇草書輕内史李頎詩曰小王破躰閑支䇿落日梨花照空璧詩堪記室妬風流盡與將軍作勍敵陶翰塞下曲云進軍飛狐北窮㓂勢將變日落沙塵昏背河更一戰駿馬黃金勒彫弓白羽箭射殺左賢王歸奏未央殿欲言塞下事天子不召見東出咸陽門哀哀淚如霰翰潤州人開元中爲禮部員外郎以氷壺賦得名商璠云歴代辭人詩笔雙美者鮮矣今陶生實謂兩全兼之既多興義復備别有風骨三百年以前方可論其躰裁燕謌行云請君留楚調聽我吟燕謌家在遼水頭邉風意氣多出身爲漢將正値戎未和雪中凌天山水上渡交河大小百餘戰封侯竟蹉跎歸來覇陵下故舊無相過雄劒委塵匣空門唯雀羅玉簮還趙姝瑶瑟付齊娥昔日不爲樂時哉今柰何出蕭關懐古云駈馬繫長劒行役至蕭關悠然五原上永眺蕭河前北虜三十萬此中常控弦秦城亘宇宙漢帝埋旌旃刁斗鳴不歇羽書日夜傳五軍計莫就三䇿議空全大漠横萬里蕭條絶人烟孤山當翰海落日照祁連蒼梧苦寒客懷哉式㣲篇更悲秦樓月夜夜出胡天贈鄭員外云騘馬拂綉裳按兵遼水陽西分鴈門騎北逐樓煩王聞道五軍集相邀百戰塲風沙暗天起虜騎森巳行儒服䕶諸將雄謀吞大荒金門來見謁朱緩生輝光數載侍御史稍遷尚書郎人生志氣立所貴功業昌何必守章句終年事蒼皇同時獻賦客尚在東陵傍贈房侍御云新安房在志人固不覊與道同周旋進則天下仰巳之能晏然褐衣東府召執簡南臺先雄義乃特立犯顔豈圖全謫居東南逺逸氣吟芳荃適會寥廓趣清波更寅縁扁舟入五湖發纜洞庭前浩蕩臨海曲超遥濟江壖微寄忽忘反遇興將彌年乃悟范生智足明漁父賢郡臨新安渚佳賞此城偏日夕對層岫雲霞映晴川閑居變秋色偃卧含貞堅倚伏自相化行藏互推遷君期倦羽翮歳晏欲冲天望太華贈盧司倉云作吏至西華乃觀三峰壯削成元氣中傑出天河上如有飛動色不知青冥狀巨靈安在哉厥跡猶可望方此歎行旅未由訪仙装葱朧記星壇明㓕數雲嶂良友垂此契宿心所微尚敢投歸山吟霞徑一相訪晚出伊蘭寄河南裴中丞云退無燕息資近無當代䇿冉冉時歳暮坐爲周南客前登關塞門永眺伊城陌長川暗巳空千里寒氣白家在渭水西異日同所適秉志師禽尚微言祖莊易一一林壑間共繫風塵役交朋忽先進天道何紛劇豈念嘉遁時依依遇沮溺乗潮至漁浦作云艤舟乗早潮潮來如風雨嶂高忽巳界峰暗莫及覩崩騰心爲失浩蕩月無主風停浪始開漾漾入漁浦雲景共澄霽江山相吞吐倬哉造化工此事巳終古流沬誠足誡高歌調易苦頗因忠信全客念猶栩栩宿天竺寺云松栢辭嵓口西山微徑通天開一峰見宫闕生虚空正殿倚霞壁千樓摽石叢夜來猿鳥靜鍾𣑽寒雲中峰翠映明月泉聲亂溪風心超諸境外了與懸解同明發唯攺視朝日長崖東湖色濃蕩漾海光漸曈曨葛仙心尚在許氏道猶崇獨徃古來事幽懐期二公早過臨淮云夜泊三風渚晨過臨淮島潮中海氣白城上楚雲早鱗鱗漁浦帆􅐯􅐯蘆洲草川路日浩蕩惄焉心如擣且言任倚伏何暇念枯槁范子名屢移蘧公志常保古人去巳乆此理難足道顔舒鳳樓怨云佳人名莫愁珠箔上花鈎清鏡鴛鴦匣新粧翡翠樓擣衣明月夜吹管白雲秋唯恨金吾子年年向隴頭唐類詩顧陶取爲王琚琚自荆湖入朝至岳陽張說有送王十一及趙公入朝之作云昔濫貂蟬長同承雨露霏今參魚鼈守望美洞庭歸浦樹懸秋影江雲繞落暉離䰟似征帆常徃帝郷飛琚以詩奉别云五載朝天子三湘逢舊寮扁舟方輟棹清論遂終朝逺樹煙門沒長江地際遥帝城馳夢想歸帆滿風飈曦也趙公冬琚逰㴩湖上寺詩云春山臨逺壑水木自幽清夙息懐微尚兹焉一放情雲間聽弄鳥烟上摘𥘉英地僻方無悶逾知道思生奉答燕公云郡逺途且艱宜悲良自得胡爲心獨爾惠好在南國亦旣清顔披冏然良願克與君蘭時㑹群物如藻餙烟景惜歡賞雲山起翰墨接藝竒思微偶談玄言直永日不知倦逾旬猶謂亟如何酌離樽移棹巴城側浦口勞長望舟中獨太息疾風吹飛帆倐忽南與北目盡不復見懐哉無終極唯當衡峰上遥辦湖水色琚以預誅太平公主之功眷委特異進戸部尚書豫大政事時號内宰相群臣不能無望遂䜛于帝帝䟽之歴九剌史故詩多感激之詞時燕公亦以罪謪守岳陽故送琚賦詩亦有湘東股肱守心與帝郷期舟檝中路蹇風波復來思之語王熊張燕公在岳州有宴别潭州王熊詩云絲管清且哀一曲傾一盃氣將然諾重心向友朋開古木無生意寒雲若死灰贈君芳杜草爲植建章䑓又云縉雲連省閤溝水遽西東然諾心猶在容華歳不同孤城臨楚塞遠樹入秦宫誰念三千里江潭一老翁熊答云長沙辭舊國洞庭逢故人故人敦久要披霞轉相親歳月空嗟老江山不惜春忽聞黄鸖曲更作白頭新又云平生共風月倐忽間山川不期交淡水暫得欵忘年興逸方罷鈞帆開欲解船離心若危斾朝夕爲君懸薛惟翰閨怨云美人怨何深含情倚金閣不笑復不語珠淚紛紛落春夜裁縫云珠箔因風起飛蛾入最能不敎人夜作方便殺明燈春女怨云白玉堂前一樹梅今朝忽見數花開兒家門戸尋常閉春色因何入得來維翰登開元進士第崔亘春怨云夜盡夢𥘉驚紗牎早霧明曉粧脂粉薄春服綺羅輕妾有今朝恨君無舊日情愁來理絃管皆是斷腸聲亘開元二十四年登進士第朱琳開緘怨云夫婿邊庭乆幽閨恨㡬重玉琴知别日金鏡識愁容懶寄雲中服慵開海外封年年得衣慣且試莫裁縫王冷然王丘傳云開元𥘉爲吏部典選奬用孫逖張鏡微張晋明進士王冷然皆一時茂秀冷然上相國燕公書曰相公必欲選良宰莫若舉前倉部員外郎呉太玄爲洛陽令必欲舉御史中丞莫若舉襄州剌史靳能清輦轂之路非太玄不可生䑓閣之風非靳能不可僕非呉靳親友但以知其賢明相公有而不知知而不用亦過深矣抑又聞之昔閔子騫爲政曰仍舊貫如之何何必攺作凡校書正字一政不得入畿相公曽爲此職見貞觀巳來故事今吏部侍郎楊滔眼不識字心不好賢蕪穢我清司攺張我舊貫去年冬奏請自今巳後官無内外一例不得入畿即知正字校書不如十郷縣尉經明進士不如三衛出身相公復此攺張甄别安在古人有坐釣登相立籌封侯今僕無尚父之謀薛公之䇿徒以仕於書苑生於學門小道逢時大言祈相僕也幸甚幸甚去冬有詩贈公愛子恊律云官微思倚玉文淺怯投珠吕氏春秋云嘗一臠之肉知一鼎之味請公看此十字則知僕曾吟五言亦更有舊文願呈作者如公之用人盖巳多矣僕之思用其來乆矣拾遺𥙷闕寜有種乎僕雖不佞亦相公一株桃李也冷然吟汴堤柳云隋家天子憶楊州猒坐深宫傍海逰穿地鑿山開御路鳴笳疊皷泛清流流從鞏北分河口直到淮南種官柳功成力盡人旋亡代謝年移樹空有當時綵女侍君王繡帳旌門對柳行青葉交垂連幔色白花飛度染衣香今日摧殘何用道數里曽無一枝好驛騎征帆損更多山精野魅藏應老凉風八月露爲霜日夜孤帆入帝郷河畔時時聞朩落客中無不淚沾衣萬楚五月五日觀妓云西施漫道浣春紗碧玉今時闘麗華眉黛奪將萱草色紅裙妬殺石榴花新歌一曲令人艶醉舞雙眸欲鬢斜誰道五絲能續命却令今日死君家李頎東郊寄楚云濩落乆無用隱身甘采薇仍聞薄䆠者還事田家衣頴水日夜流故人相見稀春山不可望黃鳥東南飛濯足豈長徃一罇聊可依了然潭上月適我胷中機在昔同門犮如今出處非優游白虎殿出人青瑣闈且有薦君表當看携手歸寄書不代面蘭茞空芳菲楚登開元進士第胡皓和宋之問寒食題臨江驛云聞道山隂㑹仍爲火忌辰途中甘棄日江上苦傷春流水翻催淚寒灰更伴人丹心終不攺白髮爲誰新開元中張孝嵩出塞張九齡韓休崔沔王翰皓賀知章所撰送行詩號朝英集明皇錫宴樂遊園皓應制詩云五酺終宴集三錫又歡娯仙阜崇高異神州眺覽殊南山臨皓雪北闕對明珠廣座鵷鴻滿昌庭賜馬趍綺羅含草朩絲竹吐郊衢衘盃不能罷歌舞樂唐虞袁壦惠文太子挽詞云寒仗丹旄引隂堂白日違暗燈明象物畫水濕靈衣羽化淮王去仙迎太子歸冝餘鷰􅋦土朝夕向陵飛瓘明皇時人惠文太子眷宗之子岐王範也柳識許由先生頴陽祠庭獻酹文序云識壬辰歳夏四月自洛東遊至先生遺廟而頴水古風舊山巋然追懐古蹤慕美至道以時酒敬酹于靈旣酌拜献言曰天清旣能久地靜不能杇先生清靜天地全性出於胚渾入於鴻䝉雲逰鳥還蓊欎和風當時帝道已半滋章欲深大樸散於人末散於山林乃有巢父杳㝠同心堯齎公器退然見推遇聖相感不得不知耳雖濯於清流道終播於無爲所謂春膏時蒸杇葉自滋先生含德唐尭發之頴陽之仁德日大天下之禄利日卑且聖王所重者名器至人所重者感通推以大名義同讓終廉能感俗道自爲功任應㑹之偶然生垂後之清風人登雲嶺多憶箕頴猗歟先生山水齊名兹焉遺廟萬古芬馨識弔夷齊文曰洪河之東兮首陽穹崇側聞孤竹二子昔也餒在其中偕隱胡爲得仁而死青苔草朩兮雲秋水䰟兮來可依兮去何止掇澗磎之毛薦精誠而巳𥘉先生鴻逸中州鸞伏西山顧薇蕨之離離歌唐虞之不還謂易暴兮又武謂墨縗兮胡顔一吒兮忘飢若有誚兮干嵓之關豈不以冠弊在於上履新處於下且曰一人之正位孰知三聖之純嘏讓周之意不其然乎是以知先生所恤者偏矣當昔夷羊在牧殷綱解結乾道息坤維絕鯨吞噬兮鬼孽王奮厥武天意若曰覆昏暴資濬哲於是二老歸而八百㑹一戎衣而九有截况乎旗錫黃鳥珪命赤烏俾荷鉅橋之施俾申羑里之辜故能岦雨集電掃風驅及下車也五刃不礪於武庫九駿伏轅於文途雖二士不食而兆人其蘇旣而漙天周土率土周人吁嗟先生逃將奚臻萬姓歸飾兮獨欎乎方寸六合莾蕩兮終跼乎一身雖忤時而過周終臣心而惻殷所以不食其食求仁得仁然非一端事各其志若旁通以阜厥躬應物以濟其利則焉有貞節之規君親之事靈乎靈乎雖非與道而保生乃朂爲臣之不二識字方明工文章最爲李華知許其文與蕭頴士元德秀劉迅相上下而識練理創端徃徃詣極雖趣向非愽然當時作者伏其簡㧞髙力士力士謫承州山多薺不食因感之作詩寄意曰兩京作斤賣五溪無人採夷夏雖有殊氣味都不攺其後㑹赦因至武陵遇開元中羽林軍士坐事謫嶺南停車話舊方知明皇厭世北望號慟嘔血而卒叚柯古叙力士事證云呼二兄柯古呼阿翁善張継呼將軍復鄭夢呼父老柯五輪磑継𥘉施棨㦸夢常卧簏林柯長六尺五寸継陪葬泰陵夢詠薺柯齒成印継上國下國夢夢鞭柯吕氏生髭継髙霽韋瓘輿池陽九子山太白易以九華之目因與二三子聯句傳之將來妙有分二氣靈山開九華白太層摽遏遲妙有分明朝霞霽髙積雪曜隂壑飛流歕陽崖興韋瓘青熒玉樹色縹緲羽人家息夫牧冬夜宴蕭十丈因餞殷郭二子西上詩云冬有十二月家君宰邑許下夫子問津潁上二賢將馳會府皆適兹土夜處狹室列座有位尊卑儼如或捧觴上夀或摳衣請益始崇詩以閱禮終講信而脩睦然後文飽於德義潤其身頃夫子升堂之後若盧賈劉尹之徒半紀間接武鳴躍實夫子訓之導之斯至也今殷郭二子天資才幹而加之鏃羽觀光王庭俯拾地芥其誰曰不然飛霜靄林寒氣㧾至月落匝戸夜將向晨座偶謙謙畢醉温克則知孔門宴餞異於他日二三子終身識之夫子以家君政事百里無事命門弟子賦詩鳴琴亦以釋仳離之怨焉小子不敏忝居門人之末敢不敬書其事詩曰有琴斯鳴于宰之庭君子莅止其心孔子政旣告成德以永貞鳴琴有術于頴之畔彼之才髦其年未冠聞詩聞禮裴兮璨璨鳴琴其怡于頴之湄二子翰飛言戾京師有欎者桂載攀其枝琴旣鳴矣霄旣清矣烘煁有煒酒醴惟㫖喟我窹歎吁其别矣崔曙曙頴陽東溪懐古云靈谿氛霧歇皎鏡清心顔空色不映水秋聲多在山世人久踈曠萬物皆自閑白鷺寒更浴孤雲晴未還昔時讓王者此地閉玄關無以躡高歩凄凉林壑間試明堂火珠詩云正位開重屋中天出火珠夜來雙月合曙後一星孤天淨光難滅雲生望欲無還將聖明代國寳在京都曙以是詩得名明年卒惟一女名星星始悟其䜟也曙開元二十六年登進士第商璠云曙詩言辭欵要情興悲凉送别登樓但堪下淚途中晚發云晚霽長風裏勞歌赴逺期雲輕歸海疾月滿下山遲旅望因高盡郷心遇物悲故林遥不見况在落花時送薛據云無媒嗟失路有道亦乗流客處不堪别異郷應共愁我生早孤賤淪落居此州風土至今憶山河皆共遊一從文章事兩京春復秋君去問相識㡬人成白頭早發交崖山還太室云東林氣微白寒鳥忽高翔吾亦自兹去北山歸草堂仲冬正三五日月遥相望蕭蕭過頴上曨曨辨少陽川水生積雪野火出枯桑獨徃路難盡窮隂人易傷傷此無依客如何蒙雪霜唐詩紀事卷第二十
