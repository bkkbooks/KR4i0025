  text: 唐詩紀事卷第六十四
  hash: sha256:1c060bf371ffe145852c56a48724ad52cd1fcbd11563f350fedd0e6e2d4b4ccd
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_064-1a}
body:
  text: 顔萱李縠司馬都崔璞鄭璧魏朴張賁陸龜蒙皮日休崔璐任蕃盧休劉畋顔萱送羊振文歸覲桂陽云髙掛呉㠶喜動容問安歸去指湘峰懸魚庭内芝蘭秀馭鸖門前薜荔封宅在桂蘇晚舊州紅斾正憐棠影茂綵衣偏帶桂香濃臨歧獨有霑襟戀南巷當年共化龍叔父同年先軰拾遺送圓載上人云師來一世恣經行却泛滄波問去程心靜已能防渇鹿􅤯喧時爲駭長鯨鯨則鳴鼓師云舟人遇禪林幾結金桃重實重一片日本金桃梵室重修鐵瓦輕輕為桃者似鐵爲瓦料得還鄉無别利只應先見日華生萱字弘至江南進士也中書舍人蕘之弟嘗受知於張祐故弔祐詩序曰尚意孩稚之歳與伯氏常承處士撫抱之仁目管輅爲神童期孔融於偉器萱唐末與皮陸二生酬唱有詩載松陵集李縠和皮日休悼鸖云才子襟期夲上清陸雲家鸖伴閑情猶憐反顧五六里何意忽歸十二城露滴誰聞髙葉墜月沈休藉半階明人間華表堪留語剰向秋風寄一聲又云道林曽放雪翎飛應悔庭除閉羽衣料得王恭披鸖鼈倚吟猶待月中歸浙東罷府西歸酬别張廣文皮先軰陸秀才詩云豈有頭風筆下痊浪成蛮語向初筵蘭亭舊趾雖曽見抲笛遺音更不傳照曜文星呉分野留連花月晉名賢相逢只恨相知晚一曲驪歌又幾年縠字徳師咸通進士也唐末爲浙東觀察推官兼殿中侍御史日休松陵集序云南陽廣文潤卿隴西侍御徳師咸旅泊之際善其所為皆以詞致師詞之不多去之速也縠西歸日休詩云建安才子太微仙暫上金臺許二年形影欲歸温室樹夣魂猶傍越溪蓮空將海月爲傖鬼恨呉天詩脱下叚司馬都鄭璧和陸龜蒙白菊詩云白艶輕明帶露㾗始知佳色重難群終朝疑笑梁王雪盡日慵看蜀帝雲燕雨似翻瑶渚浪鴈風疑卷玉綃紋瓊飛若㑹寛裁剪堪作蟾宫夜舞裙璧唐末江南進士也與皮六二生酬唱又有寒夜文譙張潤卿有期不至詩云已知羽駕朝金闕不用燒蘭望玉京應是登仙明月好玉皇留㸔舞雙成崔璞奉酬霜菊見贈詩云菊花開晚過秋風聞道芳香正滿叢爭奈病夫難強飲應湏速自召車公蒙恩除替將還京洛偶叙所懐云兩載求人瘼三春受代歸務繁多簿籍才短泛恩威共理乖天奬分憂値歳饑遽蒙交郡印除替未及三年到任十二个月安敢整朝衣作牧慙爲政思鄉念式微儻容還故里髙卧掩柴扉璞唐末以大司諫刺蘇州其詩見皮六二生松林唱和集魏朴和皮日休悼鸖云直欲裁詩問杳冥豈教靈化亦浮生風林月動疑留魄沙島香愁似藴情雪骨夜封蒼蘚冷練衣寒在碧塘輕人間飛去猶堪恨况是泉臺逺玉京又云經秋宋玉已悲傷况報胎禽昨夜亡霜曉起來無問處伴僧彈指遶荷塘朴唐末呉中名士也皮日休松陵詩序云潤卿徳師旅泊之際以詞致師大司諫清河公有作璞崔或命之和亦著焉其餘則呉中名士璧朴㒷顔萱謂司馬都鄭張賁旅泊呉門云一舸呉江晩堪憂病廣文鱸魚誰與伴鷗鳥自成群反照縱横水斜空斷續雲異鄉無限思盡付酒醺醺酬龔美先軰見寄云尋疑天意䘮斯文故選茅峰寄白雲酒後只留滄海客香前唯見紫陽君近年巳絶詩書癖今日兼將筆硯焚爲有此身猶苦患不知何者是玄纁和陸龜蒙白菊詩云雪綵氷姿號女華寄聲多是地仙家有時南國和霜立幾處東籬伴月斜謝客瓊枝空貯恨袁郎金鈿不成夸自知終古清香在更出梅粧弄晩霞賁字潤卿南陽人登大中進士第唐末爲廣文博士寓呉中與皮六二生㳺其詩多羇旅感激若異鄉無限思盡付酒醺醺又送李縠西歸云孤雲獨歩本無依江海重逢故舊稀楊栁漸踈蘆葦白可堪斜日送君歸陸龜蒙字魯望父虞賔浙東從事居蘇臺亀蒙攻文與顏尭皮日休羅隠呉融友善家貧與張搏為廬江吴興二郡丞李蔚盧携景重之羅隠寄詩曰龍樓李丞相昔歳仰髙文黄閣今無主青山竟不焚夜船乗海月秋寺伴江雲只恐塵埃裏浮名㸃汚君唐末以左拾遺授之詔下日以疾終于家皮日休松陵唱和集序云咸通十年日休為吴郡郡從事有進士陸龜蒙云其業見造其才之變真天地之氣也近代稱温飛卿李義山爲之最俾生參之未知孰為後先龜蒙三吴人也尤善談笑嘗體江謝賦事名振書萬餘卷詩篇清麗與皮日休為卷號曰松陵集中和功初遇疾而為文誌其墓矣吴子華奠文千餘言畧曰大風吹海海波淪漣㴠為子文無偶無邊長松倚雪枯枝半折捉為子文真上巔絶風下霜晴寒鍾自聲發為子文鏗將杳清武陵深間川長晝白問為子文渺茫岑寂豕突鯨狂其來莫當雲沉鳥沒去其倐忽膩若凝脂軟於無骨霏漠漠澹㳙涓春哆冶秋鮮妍觸即碎潭下月拭不滅玉上煙江湖散人歌云江湖散人天骨竒短髪搔來蓬半垂手捉孤篁曳寒繭口誦太古滄浪詞詞云太古万万古民怪其壄野音無風期夜棲正與禽獸雜獨自架結縱横枝因而稱曰有巢氏民共敬貴如君師當時只効烏鵲軰豈是有意陳尊卑無端後穿鑿破一派前導千流随多方忷亂元氣死日使父子生姦欺聖人事業轉消耗尚有漁者存熙熙風波不獨因一士凡百器具皆能施罛疎扈腐鱸鱖肥上失撿馭無䜛疵人間所謂好男子我見婦女留鬚眉奴顔婢膝真乞丐反以正直爲狂癡所以頭欲散不散弁峩巍所以腰欲散不散珮陸離行散任之適坐散從傾欹語散空谷應笑散春容披衣散單複便食散酸醎冝書散忘簮履禽散虚籠池外物一以散中心散何疑不共諸侯分邑里不與天子專隍陴靜則守桑柘亂則逃妻兒金鏕紳帶未嘗識白刃投我窮生為或聞蕃將負恩澤號令鐵馬如風馳大君年小丞相少當軸自請都旌旗神鋒悉出羽林仗繪畫日月蟠龍螭太宗基業甚牢固小醜背叛當殱夷禁軍近自肅宗署抑遏輔國爭雄雌必然大叚剪兇逆須召勁勇持軍麾四方賊壘猶古地死者暴骨生寒飢歸來輙擬荷鋤立詬吏已責租錢遲興師十万一日費不翅千金何以支秪今利口且箕歛何暇俛首哀惸嫠均荒補敗豈無術布在方䇿撑頽巇氷霜襦袴易反掌白面諸郎殊不知江湖散人悲古道悠悠幸寄羲皇傲官家未議活蒼生拜賜江湖散人號甫里先生傳云少攻歌詩與造物者争柄遇事輙変化不一其體裁始則凌轢波濤穿穴險固囚鏁怪異破碎陣敵卒造平澹而後已亀蒙居震澤之南巨積注有鬪鴨一欄有驛使過挾彈斃其尤者䝉蒙乎一表本云此鴨能人語待附蘇州上進使者斃之奈何使人恐酬以槖中金俟其箱悦方請人語之由曰能呼其名使人憤且笑拂袖上馬復召之還其金曰吾戯耳龜蒙少髙放從張摶遊歷湖蘇二州辟以自佐嘗至饒州三日無所詣刺史蔡京率官屬就見之亀䝉不樂拂衣去不喜交流俗不乗馬升舟設蓬席齎束書茶竈筆牀釣具徃來時謂江湖散人或號天随子甫里先生自比涪翁漁父江上丈人皮日休日休字襲羙襄陽人咸通中為太常愽士遭亂歸吴中黄巢冦江浙刼以從軍至京師以為翰林學士今日休作䜟云欲識聖人姓田八二十一欲知聖人名果頭三屈律巢大怒蓋巢頭醜掠鬢不盡疑譏之也遂及禍日休寒日晝齋即事三章云參佐三間似草堂恬然無事可成忙移時寂歴澆松子盡日殷勤乳牀將近道齋先衣褐欲清詩思量焚香空庭好待中宵月獨禮星辰學歩四不知何事有生涯皮揭裁衣學道家深夜數甌為相葉清晨一氣是雲華盆池有鷺窺蘋末石板無人掃桂花江漢欲歸方朔家貧未有車肯從榮利捨樵漁從公未恠多侵酒見客唯求轉借書暫聽松風生意足偶㸔溪月世情踈如鈎得貴非吾事合向煙波爲五魚五魚􅊨松江有日休賦亀詩嘲歸仁紹云硬骨殘形知幾秋屍骸終是不風流頑皮死後錢須遍只爲平生不出頭歸氏子以姓嘲日休云八片尖斜砌作裘火中燖子水中楺一包閑氣如常在惹踢招奉卒未休北夢瑣言云日休傲誕自號間氣布衣日休之子光業辭文宏贍唐末為越州副使松陵集序曰詩有六義其一曰比比者定物之情狀也則必謂之才才之備者於聖為六藝在賢為聲詩噫春秋之後頌聲亡寢降及漢氏詩道荐作然二雅之風委而不興矣在詩有三言四言五言六言七言之作三言者曰振振鷺鷺于飛是也五言者曰誰謂雀無角何以穿我屋是也六言者我姑酌彼金罍是也七言者交交黄鳥止于桑是也九言者曰浻酌彼行潦挹彼注兹是也盖古詩率以四言為本而漢氏方以五言七言為之也其句亦出於周詩五言者李陵曰携手上河梁是也七言漢武曰日月星辰和四時是也爾後盛於建安以降江左君臣得以浮艶然然詩之六義微矣逮及吾唐開元之世易其體為律焉始切於儷偶拘於聲勢然詩云遇憫既多受侮不少其對也二矣堯典曰依永律和聲其為律也甚矣由漢及唐詩之道盡矣吾文不知千祀之後詩之道止於斯而已即後有變而作者不得以知之夫才之備者猶天地之氣乎氣者止乎一也分而為四時其為春則煦枯發枿如弃如濩百物融洽酣人肌骨其為夏則赫㬢朝升天地如窰草蕉木暍若燎毛髪其為秋則凉颸髙瞥若露天骨景爽夕清神不蔽形其為冬則霜陣一棲萬物皆瘁雲沮日慘若憚天責夫如是豈拘於一哉亦變之而已人之有才者不變則已茍變之豈異於是乎故才之用也廣之爲滄溟細之爲四竇髙之爲山岳碎之爲瓦礫羙之爲西子悪之爲四洽壯之爲武賁弱之爲處女大則八荒之外不可窮小則一毫之末不可見茍其才如是復能善用之則庖丁之牛慶之輪郢之斤不足喻其神解也噫古之士窮逹必形於歌詠茍欲見乎志非文不能宣也扵是爲其詞詞之作固不能獨善必須人以成之昔周公爲詩以貽成王吉甫作煩以贈申伯詩之酬贈其來尚矣後毎爲詩必多爲咸通七年今兵部令狐員外在淮南今中書舍人公守毗陵日休皆以詞獲幸悉蒙以所製命之和各軸亦有名其守者十年大司諫清河公世收於吴日休為部從事居一月有進士陸亀䝉業見造凡數編其才之變真天地之氣也近代稱温飛卿李義山爲之最俾生參之未知其孰為之後先雜體詩序云案舜典帝曰命汝典樂教胄子詩言志歌永言在焉周禮太師之職掌敎六詩諷賦比興風雅互作雜體遂生然後係之于樂府盖典樂之職也在漢代李延年為恊律造新聲雅道缺樂府乃盛鐃歌皷吹拂舞干俞因斯而興詞之體不得不因時而易也古樂書論之甚詳今不能備載載其他見者漢武集元封三年作栢梁臺詔群臣二千石有能為七言詩者乃得上座帝曰日月星辰相四時梁王曰驂駕駟馬從梁來由是聮句興焉孔融詩曰漁父屈節水潜匿方作郡姓名離合也由是離合興焉晉傅咸有廽文反覆詩二首云反覆其文者以示憂心展轉也悠悠逺邁獨焭焭是也由是反覆興焉梁武帝云後牖有朽栁沈約云偏眠舩舷邊由是疊韻興焉詩云蝶蝀在東又曰鴛鴦在梁由是雙聲興焉詩云惟南有箕不可以簸場惟北有斗不可以挹酒漿近乎戯也古詩或為之蓋風俗之言也古有採詩官命之曰風人圍棊燒敗襖㸔子故依然由是風人之作興焉梁書云昭明善賦短韻吴均善壓强韻今亦効而為之存于編中陸生與予各有是為凡八十六首如四聲詩三字離合全篇雙聲疊韻之作悉陸生所為又足見其多能也案齊竟陵王郡縣詩曰追共承荔浦一道信雲丘縣名由是興焉案梁元藥名詩曰戍客栢山下當思衣錦歸藥名由是興焉陸與予亦有是作至如鮑昭之建除沈炯之六甲十二屬梁簡文之卦名陸惠曉之百姓梁元帝之鳥名亀兆蔡黄門之口字古詩兩頭纎纎藁砧五雜組已降非不能也皆鄙而不為噫由古至律由律至雜詩詩之道盡乎此也近代作雜體唯劉賔客集中有逥文離合雙聲疊韻如聮句則莫若孟東野與韓文公之多他集罕見足知為之之難也日休疊韻山中吟云穿煙泉潺湲觸竹犢觳觫荒篁香墻匡熟鹿伏屈曲雙聲溪上思云踈衫低通灘冷鷺立亂浪草彩欲夷猶雲空容澹蕩晚秋吟字韻合以題十五東臯㷑雨歸耕日免去黄冠首刈禾火滿酒壚詩在口今人無計奈儂何藥名離合夏日即事云季春人病抛芳杜仲夏溪波遶壊垣衣典濁醪身倚桂心中無事到雲昏懐鹿名縣名離合云山痩更培秋後桂溪澄閑數晩來魚臺前過鴈盈千百泉石無情不寄書寒日古人名云北顧懽遊悲沈宋為北顧梁武改南徐陵寢嘆齊梁水邊韶景無窮栁寒被江淹一半黄風人詩云江上秋聲起從來浪得名逆風猶掛蓆苦不㑹帆情陸亀蒙詩云十万合師出遥知至憶君一心如瑞表唯作兩歧分崔璐璐有覧皮先軰盛製詩贈日休云河嶽挺靈異星辰精氣殊在人為英傑與國作禎符襄陽得竒士俊邁真龍駒勇果魯仲由文賦蜀相如渾浩江海廣葩華桃李敷小言人無間大言塞空虚幾人遊赤水夫子得玄珠鬼神争奥祕天地惜洪鑪既比曽參行仍兼君子儒吾知上帝意將使居黄樞好保千金體須為万姓謨日休和云伊余㓜且賤所禀自以殊弱歳謬知道有心臣皇符豈意海上鷹運跼軒下駒縱性作古文所爲皆自如但恐才格劣敢誇詞彩敷句句考事實篇篇窮玄虚誰能変羊質競不獲驪珠奥有造化手曽聞天地鑪文章鄴下秀氣貎淹中儒展我此志業期君持中樞蒼生眼穿望勿作番溪謨璐登咸通七年進士第任蕃宫怨云淚乾紅落臉心盡白垂頭自此方知怨從來豈信愁蕃又有無語與春别細㸔枝上紅之句張爲取作主客圗盧休春寒酒力遲冉冉生微紅聮句寒月自然草木性誰祝元化功句湓浦風生破膽愁句血染劒花明帳幕三千車馬出漁陽句右張為取作主客圗休不第劉畋畋有晩泊漢江渡詩云末秋雲木輕蓮拆晚香清雨下侵苔色雲凉出浪聲疊㠶依岸尽微照夾堤明渡吏已頭白遥知客姓名又有雨後句云殘陽來霽岫獨興起滄洲張為取作主客圖舉進士唐詩紀事卷第六十四
