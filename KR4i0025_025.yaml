front:
  text: 唐詩紀事巻第二十五
  hash: sha256:a502c64ad6511d8ab0b050762d46f4d1597665287988ae574e17eb7c83503fff
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_025-1a}
body:
  text: 徐安貞崔惠童崔敏童劉晏劉灣薛據劉眘虚張廵張繼張謂梁肅柳渾孟雲卿徐安貞畫襄陽圖云畫得襄陽郡依然見昔逰現山思駐馬漢水憶回舟丹壑常含霽青林不換秋圖書空咫尺千里意悠悠安貞始名楚壁應制舉三登甲科開元中爲中書舍人集賢學士帝屬文多令視草終中書侍郎在中書省乆李林甫用事或言計議多所參助云或云安正天寳後以林甫之故避罪衡山岳寺李北海逰岳識之因戯曰峴山思駐馬漢水憶廻舟暮雨衣猶濕春風㠶正開抑能記否因同載北歸至長沙謂守者曰瀟湘逢故人若幽谷之覩太陽不然委頓巗穴矣崔惠童宴城東庄云一月人生笑㡬回相逢相識且㗸杯眼㸔春色如流水今日飛花昨日開尚明皇晉國公主崔敏童宴城東庄云一年始有一年春百歳曽無百歳人能向花中㡬回醉十千沽酒莫辭貧敏童惠童昆弟也劉晏明皇御勤政樓大張樂羅列百技時教坊有王大娘者戴百尺竿竿上施木山狀􅌡州方丈令小兒持綘節出入於其間歌舞不輟時劉宴以神童爲秘書正字方十歳帝召之貴妃置之膝上爲施粉黛與之巾櫛帝問宴汝爲正字正得㡬字晏曰天下字皆正唯朋字未正得貴妃復令詠王大娘戴竿晏應聲曰樓前百戯競爭新唯有長竿妙入神誰謂綺羅翻有力猶自嫌輕更着人因命牙笏及黄紋袍賜之晏八歳獻頌㤗山行在帝命張說試之說曰國瑞也即授太子正字公卿邀請旁午號神童晏字士安劉灣字靈源彭城人天寳進士天寳之亂以侍御史居衡陽元結送王契佐卿入蜀序曰與佐卿去者有清河崔異與次山住者有彭城劉灣相醉相留㡬日江畔出塞曲云將軍在重圍音信絶不通羽書如流星飛入甘泉宫倚是并州兒少年心膽雄一朝隨召募百戰爭王公去年桒乾北今年桒乾東死是征人死功是將軍功汗馬敗秋月疲人卧霜風仍聞左賢王更欲圍雲中即席賦露中菊云衆芳春競發寒菊露偏滋受氣何曽異開花獨自遲晚成猶有分欲採未過時勿棄東籬下㸔隨秋草衰元次山作劉侍御月夜讌㑹序云兵興以来十一年矣獲與同人懽醉逹旦詠歌取適無三焉乙巳歳彭城劉靈源在衡陽逢故人或有在者日夕相會第寛逺遊始與諸公待月而笑語競與諸公愛月而懽詠夜乆賦詩言懐於戲文章道喪蓋亦乆矣時之作者煩雜過多歌兒舞女且相喜愛系之風雅誰道是耶諸公嘗欲變時俗之滛靡爲後生之規範今夕豈不能道逹情性成一時之美乎次山詩曰我從蒼梧来將耕舊山田踟蹰爲故人且復停歸船日夕得相從轉覺和樂全愚爱凉風来明月正滿天河漢望不見㡬星猶燦然中夜興欲酣攺坐臨清川未醉恐天旦更歌促䌓絃懽娛不可逢請君莫言旋薛據出青門往南山下別業云舊居在南山夙駕自城闕榛莾相蔽虧去爾漸超忽散漫餘雪晴蒼茫季冬月寒風吹長林白日原上沒懐抱曠莫伸相知阻胡越弱年好棲隱錬藥在巗窟及此離垢氛興来亦因物末路期赤松斯言庻不伐西陵口觀海云浙江漫湯湯近海勢彌廣在昔胚腪凝融爲百川長地形失端倪天色潜滉瀁東南際萬里極目逺無象山影乍浮沉潮波忽来往孤帆或不見棹歌猶響像日暮長風起客心空振蕩浦口霞未收潭心月初上林嶼㡬邅廻亭臯時偃仰歳晏訪蓬􅌡真遊非外奬據與王摩詰杜子美最善子美有喜薛三據授司議郎詩云文章開穾奥遷擢潤朝廷又有寄薛三郎中詩云與子俱白頭役役常辛苦雖爲尚書郎不及村野人天未厭戎馬我軰本常貧子尚客荆州我亦滯江濵聞子心甚壯所過信席珍賦詩賔客間揮灑動八垠乃知蓋代手才力老益神其略如此據自永樂主簿陟縣丞復選宰陟縣劉長卿贈詩云棲鸞往巳屈馴翟今可嗣此道如不移雲霄坐應致縣前漳水緑郭外晉山翠日得謝客遊時堪陶令醉髙適淇止寄據云故交負靈竒逸氣包謇諤隱軫經濟具縱横建安作據開元中自恃才名於吏部參選請授萬年録事諸流外官共見宰執訴之曰赤録事某等清要官今𬒳進士奪去某等色人無措手足矣遂罷商璠云據爲人骨鯁兼有氣魄其文亦不自傷不卑不逹故著古興詩云投珠恐見疑抱玉但垂泣道在君不舉功成歎何及怨憤頗深至如寒風吹長林白日原上没又窮冬時短晷日盡西南天可謂曠代之佳句也㩀河中寶鼎人中書舍人文思曽孫父元暉什邡令開元天寶間據與第播揔相繼登科終禮部侍郎省署開文苑滄浪學釣翁據之詩也子美懐據詩乃云獨當省署開文苑兼泛滄浪學釣翁據古興云日中望雙闕軒蓋楊飛塵鳴珮初罷朝自言皆近臣光華滿道路意氣安可親歸来宴髙堂廣筵羅八珎僕妾盡錦綺歌舞夜逹晨四時自相代誰能分要津巳㸔覆前車未見攺後輪丈夫湏兼濟豈得樂一身君今皆得志肯頋憔悴人初去郡書情云肅徒辭汝頴懐古獨悽然尚想文王化猶思巢父賢時移多讒巧大道竟誰傳况是疾風起悠悠旌斾懸征鳥無返翼歸流不停川巳經霜露下乃驗松栢堅回首望城邑迢迢間雲煙志士不傷物小人皆息妍感時唯責已在道非怨天從此適樂土東歸知㡬年劉眘虚去年上䇿不見收今年寄食仍淹留羡君有酒能共醉羡君無錢能不憂如今五侯不待客羡君不問五侯宅如今七貴方自尊羡君不過七貴門大夫會應有知巳世上悠悠何足論喬林贈青瞑南山色君與緇錫鄰深路入古寺亂花隨暮春紛紛對寂寞往往落衣巾松色空照水經聲時有人晩心復南望山逺情獨親應以脩往業亦唯立此身深林度空夜煙月資清真莫歎文明日彌年從隱淪閻防贈九日送人云海上正揺落客中還別離固舟去未巳逺送新相知流水意何極滿樽徒爾爲從来菊花節早已醉東籬江南曲云美人何蕩漾湖上風日長玉手欲有贈徘徊雙鳴璫唱歌隨緑水怨色起春陽日暮還家望煙雲横洞房登廬山峰頂寺云孤峰㽜萬象秋氣何髙清天際南郡出林端四湖明山門二緇叟振錫聞幽聲心照有無界業懸前後生徒知真機静尚與愛網并方首金門路未遑參道情暮秋楊子江寄孟浩然云木葉紛紛下東南日煙霜山林相曉暮天海深清蒼瞑色空復乆秋聲亦何長孤舟兼㣲月獨夜仍越郷寒笛對京口故人在襄陽詠思勢今夕江漢遥相望海上云日處歸且逺送君東悠悠滄溟千萬里日夜一孤舟曠望絶國所㣲茫天際愁有時近仙境不定若夢遊或見青色石孤山百丈秋前心方杳眇此路勞夷逰離別惜吾道風波敬皇休春浮花氣逺思逐海水流日莫離歌後永懐空滄州鄭處誨明皇雜録云天寶末劉希夷王泠然王昌齡祖詠張若虚張子容孟浩然常建李白劉眘虚崔署杜甫雖有文章盛名皆流落不偶商璠云慎虚詩情幽興逺思苦詞竒忽有所得便驚衆聼頃東南髙唱者十數人然聲律婉態無出其右雖氣骨不逮諸公自永明以来可傑立江表至如松色空照水經聲時有人又滄溟千萬里日夜一孤舟道自白雲静春與青溪長時有落花至逺隨流水香開門向溪路深柳讀書堂幽映每落日清輝照衣裳並方外之言也惜其不永天年隕碎國寳王昌齡宿京江口期眘虚不至詩云霜天起長望殘月生海門風静夜潮滿城髙寒氣昏故人何寂寞乆巳乖清言明發不能寐徒盈江上罇又送眘虚歸取宏詞觧云天清聞海鸖遊子引郷盻聲隨羽儀逺勢與歸雲便青桂春再榮白雲暮来變遷飛在禮義豈復淚如霰孟浩然九日於龍沙寄劉大眘虚云龍沙豫章北九日挂㠶過風俗因時見湖山發興多客中誰送酒棹裏自成歌歌竟乘流去滔滔任夕波張廵守睢陽日嘗賦詩曰接戰春來苦孤城日漸危合圍侔月暈分守効魚麗屢厭黄塵起時將白羽揮裹瘡猶出陣飲血更登陴忠信應難敵堅貞自不移無人報天子心計欲何施又夜聞笛云岧嶤試一臨虜騎俯城隂不辨風塵色安知天地心營開星月近戰苦陣雲深旦夕更樓上遥聞横笛吟廵謝金吾將軍表云想峨嵋之碧峰豫遊西蜀追緑耳於玄圃保壽南山逆賊禄山殺戮黎獻羶腥闕庭臣被圍四十七日凢一千八百餘戦主辱臣死當臣效命之時惡稔罪盈是賊㓕亡之日廵祭纛文曰太一先鋒蚩尤後殿蒼龍持弓白虎捧箭祭城隍云眢井鳩翔危堞龍攫皆文武雄徤志氣不衰真忠烈士也廵字廵鄧州人博通群書爲文章不立藁以忠義死睢陽張繼閶門即事云耕夫占募逐樓船春草青青萬頃田試上吳門㸔郡郭清明㡬處有新煙清明日自西午橋至瓜巗村有懐云晩霽龍門雨春生汝穴風鳥啼官路静花發毁垣空鳴玉慙時軰垂絲學老翁舊遊人不見惆悵洛城東洛陽作云洛陽天子縣金谷石崇郷草色侵官道花枝出菀墻書成休逐客賦罷遂爲即貧賤非吾事西遊思自強春夜皇甫冉宅對酒云流落時相見悲歡共此情興因樽酒洽愁爲故人輕暗滴花垂露斜輝月過城那知横吹曲江外作邊聲安公房問法云流年一日復一日世事何時是了時試向東林問禪伯遣將心地學琉璃髙仲武云張繼貟外累代詞伯積襲弓箕其於爲文不雕不飾及尔登第秀發當時詩體清逈有道者風如女停襄邑杼農廢汶陽耕使者乗軒去諸侯擁節迎火燎原猶熱波揺海未平此興深矣繼字懿孫襄州人登天寶進士第大歴末檢校祠部貟外郎分掌財賦於洪州送郄紹充河南租庸判官云齊魯傷心地頻年此用兵女停襄邑杼農廢汶陽耕使者乗軺去諸侯擁節迎深仁佐君子薄賦䘏黎甿火燎原猶熱波揺海未平應將否泰理一問魯諸生感懐云調與時人背心將静者論經年帝城裡不識五侯門伉儷歿於洪州劉長卿哭張貟外云白簡曽連拜滄州每共思撫存怜稚齒歎逝頋身衰自此辭張劭何由見戴逵獨聞山吏部流涕訪孤兒楓橋夜泊云月落烏啼霜滿天江楓漁火對愁眠姑蘇城外寒山寺夜半鐘聲到客船之無常鐘繼志其此地有夜半鐘謂爲詰病非也異耳歐陽以張謂負薪老翁往北州北望郷關生客愁自言老翁有三子两人巳向黄沙死如今少男新長成明年聞道更徴兵定知此別必零落不及相隨同死生盡將田宅借鄰伍且復仱俜去郷土在生本求多子孫及有誰知更辛苦近傳天子尊武臣強兵直欲静胡塵安邊自合有長䇿何必流離中國人老翁荅代北州送盧舉使河源詩云故人行役向邊州疋馬今朝不少留長路關山何日盡滿堂絲管爲君愁同諸公遊雲公禪院云共許尋鷄足誰能惜馬蹄長空浄雲雨斜日半虹蜺簷下千峰轉窓前萬水低㸔花尋逕逺聼鳥入林迷地與喧卑隔人將物我齊不知樵客意何事武陵溪送青龍一公云事佛輕金印勤王度玉關不知從樹下還許到人間楚水清蓮浄吳門白日閑聖朝湏助治切莫愛東山哭護國上人云昔喜三身静今悲萬刼長不應歸北斗多是向西方舍利衆生得袈裟弟子將鼠行殘藥椀蟲網舊䋲床別起千花塔空留一草堂支公何處在神理竟茫茫麓山精舍送莫侍御歸寜云何處堪留客香林隱翠㣲薜蘿通驛騎松竹掛朝衣霜引臺烏集風驚塔鴈飛飲茶勝飲酒聊以送相歸乾元中謂以尚書郎出使夏口沔州牧杜公觴于江城之南湖謂命李白標之嘉名白目爲郎官湖云謂同王徴君湘中有懐云八月洞庭秋瀟湘水北流還家萬里夢爲客五更愁不用開書秩偏冝上酒樓故人京洛客何日復同遊玉清公主挽歌云學鳯年猶少乗龍日尚賖㓜封千户邑忽駕五雲車地接金人㟁山通玉女家秋風何太早吹落禁園花之女代宗謂登天寶二年進士第奉使長沙嘗作長沙風土記云巨唐八葉元聖六載正言待罪湘東商璠云謂代北州老翁荅及湖中對酒行並在物情之外衆人未曽說耳亦何必歷遐逺探古跡然後始爲冥搜謂湖中對酒行云夜坐不猒湖上月晝游不猒湖上山眼前一罇又長滿心中萬事如等閑主人有黍百餘碩濁醪數斗應不惜即今相對不盡歡別後相思復何益茱茰灣頭歸路賖願君且宿黄翁家風光若此人不醉參差辜負東園花謂大曆間爲禮部侍郎典七年八年九年貢舉梁肅肅字欽之世居陸渾蕭復杜佑交薦辟終右𥙷闕崔恭序其文以肅文雖多而無適時之用故以皇甫士安比之肅賛四皓云秦失其鹿豪傑並逐鸞鳳何依白雲深谷英英南山采采紫芝漢以劒起吾誰與歸栖心化元澹泊無爲禮物雖至先生黙而惟彼貞名確不可轉儲皇不安我徳用顯大君是驚惠位是寜四公屈身天下和平弋者何思鴻飛㝠㝠柳渾正元中牡丹多渾詩云近来無柰牡丹何數十千錢買一窠今朝始得分明見也共戎葵不校多雜爼見酉陽渾字夷曠不樂拘檢爲正元宰相孟雲卿宋郊詩云徘徊宋郊上不見平生親獨立正傷心悲風来孟津大方載群物生死有常倫虎豹不相食哀哉人食人豈知逢世運天道亮云云又云太虛流素月三五何皎明光耀侵白日賢愚迷至精四時更變化天道有虧盈常恐今巳没須㬰復更生雲卿河南人元次山送孟校書往南海云雲卿與次山同州里以辭學相友少次山六七歳聲名滿天下知巳在朝廷及次山之年何事不可勿愛羅浮徃而不歸也雲卿鄴城懐古云朝發箕水南將尋北燕路魏家舊城闕寥落無人住伊昔天地屯曺公獨中據群臣將北靣白日忽西暮三臺竟寂寥萬世難長固雄豪安在哉衰草霑霜露崔㟴長河北尚見應劉墓古樹藏龍蛇荒茅伏狐兔永懐故池舘數子章連句逸興驅山河雄辭變雲霧我行覩遺跡精爽如相遇斗酒將酹君悲風白楊樹古挽歌云草草閭巷喧塗車儼成位冥寂何所須盡我生人意北去路非逺此別終天地臨穴頻撫棺至哀反無淚爾形未衰老爾音猶童稚骨肉安可離皇天若容易房帳即虚張庭宇爲哀吹薤露歌若斯人生盡如寄別離曲云結髪生別離相思復相保何知日巳乆五變庭中草渺渺天海途悠悠吳江島但懼不出門出門無逺道逺道行既難家貧衣服单嚴風吹積雪晨起鼻何酸人生各有戀豈不懐爾安分明天上日生死誓同歡傷懐醻故友詩云悄悄晨鷄翔浙浙草上霜人生早艱苦壽命恐不長二十學巳成三十名不彰豈無同門友貴賤易中膓驅馬行萬里悠悠過帝郷幸因弦歌末得上君子堂衆樂互喧奏獨余被笙篁坐中無知音安得神洋洋願因髙風起上感白日光古離别云朝日上髙臺離人怨秋草但見萬里天不見萬里道君行本遥逺昔樂誠難保宿昔夢同衾心憂夢顛倒含酸欲謝訴轉轉傷懐抱白髪年巳深征行去何早寒暄有時謝顦顇難再好人皆筭年壽死者何曽老少壮無會期水深風浩浩髙仲武云孟君詩祖述沈千運賊中十首又漁獵陳拾遺詞氣傷古怨者之流如虎豹不相食哀哉人食人方於七哀路有飢婦人抱子棄草間則雲卿深矣懇雖効之於陳沈纔能昇堂猶未入室然當今古調無出其右者一時之英也余感懇君平生好古著格律門論及譜二篇以攝其體綂雲卿與杜子美元次山最善群物歸大化六龍頺西荒句感懐安知浮雲外日月不運行句苦雨孤兒去慈親孤客䘮主人莫吟辛苦曲此曲誰忍聞可聞不可說去去無期別行人念前程不待參辰没朝亦常苦飢暮亦常苦飢飄飄萬里餘貧賤多是非少年莫逺行逺行多不歸行悲哉右張爲取作主客圖以雲卿爲髙古奥逸主唐詩紀事巻第二十五
