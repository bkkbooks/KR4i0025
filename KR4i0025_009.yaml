  text: 唐詩紀事卷第九
  hash: sha256:7adbddce0b1a41b29441aab3b5d96e266a8bd15a6e2dc10ec640cdec51fde946
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_009-1a}
body:
  text: 李適張錫徐彥伯宗楚客韋承慶蕭至忠李逈秀劉憲崔湜岑羲李適適字子至京兆人武后修三教珠英以李嶠張昌宗為使取文學士綴集適與王無競尹元凱等在選睿宗時以工部侍郎卒九日登慈恩應制云鳯輦乘朝霽鸚林對晚秋天文貝葉寫聖澤菊花浮塔似神功造龕疑佛影留幸陪清漢蹕欣奉淨居遊答宋十一崖口五渡見贈云聞君訪遠山躋險造幽絶眇然青雲境觀竒彌年月登嶺亦泝溪孤舟事沿越崿嶂傳彩翠崕磴互欹缺石林上攢叢金澗下明滅捫壁窺丹井梯苔瞰乳穴忽枉巖中贈對玩未嘗輟殷勤獨往事委曲鍊藥説邀余名山期從爾泛海澨嵗晏秉宿心斯言匪徒説初中宗景龍二年始於修文館置大學士四員學士八員直學士十二員象四時八節十二月於是李嶠宗楚客趙彥昭韋嗣立為大學士適劉憲崔湜鄭愔盧藏用李又岑羲劉子玄為學士薛稷馬懷素宋之問武平一杜審言沈佺期閻朝隱為直學士又召徐堅韋元旦徐彥伯劉允濟等滿員其後被選者不一凡天子饗會遊豫唯宰相直學士得從春幸黎園並渭水祓除則賜桞圈辟癘夏宴蒲萄園賜朱櫻秋登慈恩浮圖獻菊花酒稱壽冬幸新豐歷白鹿觀上驪山賜浴湯池給香粉蘭澤從行給翔麟馬品官黃衣各一帝有所感即賦詩學士皆屬和當時人所欽慕然皆狎猥佻佞忘君臣禮法惟以文華取幸若韋元旦劉允濟沈佺期宋之問閻朝隱等無它稱景龍二年七夕御兩儀殿賦詩李嶠獻詩云唯言七襄詠流入五絃歌唱步虛歌是日李行言九月幸慈寺塔上官氏獻詩群臣並賦閠九月幸總持登浮圖李嶠等獻詩十月三日幸三會寺十一月十五日中宗誕辰內殿連句為柏梁體二十一日安樂公主出降武延秀是月以婕妤上官為昭容十二月六日上幸薦福寺鄭愔詩先成闢是也舊邸三乘宋之問後進歸是也駕象法王立春侍宴賦詩二十一日幸臨渭亭李嶠等應制三十日幸長安故城十二月晦諸學士入閣守嵗以皇后乳母戲適御史大夫竇從一有國爹之號往來其家遂三年七日清暉閣登髙遇雪宗楚客詩云蓬萊雪作山是也因賜金綵人勝李嶠等七言詩筵披是也千鍾聖酒御是日甚歡上令學士遞起屢舞至沈佺期賦回波有齒緑牙緋之語晦日幸昆明池宋之問詩自有夜珠來之句至今傳之二月八日送沙門元奘等歸荆州李嶠等賦詩十一日幸太平公主南莊七月幸望春宫送朔方節度使張亶赴軍八月三日幸安樂公主西莊九月九日幸臨渭亭分韻賦詩先成韋安石十一月一日安樂公主入新宅賦詩十五日中宗誕辰長寧公主滿月李嶠詩龍神見像日仙鳳飬雛年是也二十三日南郊徐彥伯上南郊賦十二月十二日幸溫泉宫勑蒲州刺史徐彥伯入仗同學士例因與武平一等五人獻詩上官昭容獻七言絶句三首十四日幸韋嗣立莊拜嗣立逍遙公名其居曰清虛原幽栖谷十五日幸白鹿觀十八日幸秦始皇陵四年正月朔賜群臣柏樹五日蓬萊宫宴吐蕃使因為柏梁體人亦賦吐蕃舍七日重宴大明殿賜綵鏤人勝又觀打毬八日立春賜綵花二十九日晦幸滻水二月一日送金城公主三日幸司農少卿王光輔莊是夕岑羲設茗飲討論經史武平一論春秋崔日用請北靣日用贈平一歌曰彼名流兮左氏癖意玄逺兮冠今昔二十一日張亶至自朔方宴于桃花園賦七言詩明日宴承慶殿李嶠桃花園詞因號桃花行三月一日清明幸黎園命侍臣為拔河之戲三日上已祓禊於渭濵賦七言詩賜細柳圈八日令學士尋勝同宴於禮部尚書竇希琳亭賦詩張説為之序十一日宴於昭容之别院二十七日李嶠入都祔廟徐彥伯等餞之賦詩四月一日幸長寧公主莊六日幸興慶池觀競渡之戲其日過希玠宅學士賦詩二十九日御宴祝欽明為八風舞諸學士曰祝公斯舉五經掃地盡矣睿宗時道士司馬承禎還天台適贈詩詞甚美朝士屬和三百餘人徐彥伯編為白雲記中宗幸興慶戲競渡應制云拂霧金輿丹斾轉凌晨黼帳碧池開南山倒影從雲落北澗搖灮寫浪回急舸爭標排荇度輕帆截浦觸荷來橫汾宴鎬歡無極歌舞年年聖壽杯陪幸臨渭亭詩云長樂喜春歸披香愛雪霏花從銀閣度絮繞玉窗飛寫曜銜天藻呈祥拂御衣山林紛可望無處不灮輝安樂公主山莊云平陽金榜鳳凰樓沁水銀河鸚鵡洲綵仗遙尋丹壑裏仙輿暫幸緑亭幽前池錦萬蓮花艷後嶺香爐桂蘂秋貴主稱觴萬年壽還輕漢武濟汾遊人日大明宫應制云朱城待鳳韶華至碧殿乘龍淑氣來寶帳金屏人巳帖圖花學鳥勝初裁林香近接冝春苑山翠遙添獻壽杯向夕憑髙風日麗天文垂曜象昭回望春宫迎春應制云玉輦金輿天上來花園四望錦屏開輕絲半拂朱城柳細纈全披畫閣梅舞蝶分行飄御席歌鶯度曲繞仙杯聖詞春日灮輝滿漢主秋風莫道才送金城公主云降河從逺娉青海赴和親月作臨邊曉花為度隴春主歌悲顧鸖帝䇿重安人獨有瓊簫去悠悠思錦輪宴安樂公主新宅云銀河半倚鳯凰臺玉酒相傳鸚鵡杯若見君平須借問仙槎一去幾時來餞唐永昌赴任東都云聞道飛鳬向洛陽翩翩矯翮度文昌郎為令自尚書因聲寄意三花樹少室嵓前幾過香室不見十年矣適云有田在少徐元伯題適碑隂序曰嘻嘻李公生自號東山子死葬東山豈其讖哉神交者歌薤露以送子歸東山焉歌曰隴障縈紫氣金灮赫氛氲美人含遙靄桃李方自薰圖髙黃鸖羽寶奪驪龍群忽驚薤上曲掩曀東山雲回也實天枉賈生亦晚促今復哀若人危迅風前燭夜臺淪清鏡窮塵埋結緑何以贈下泉生芻唯一束張錫慈恩寺九月九日登浮圖應制云九州霜景淨千門曉望通仙遊光御路瑞塔逈凌空菊彩揚堯日茰香繞舜風天文麗辰象竊抃仰層穹晦日宴髙文學林亭云雪盡銅駝路花照石崇家年灮開柳色池影㲹雲華賞洽情方逺春歸景未賖欲知多暇日樽酒漬澄霞錫文琮之子也久視𥘉代其甥李嶠為宰相請還廬陵王不為張易之所右俄知選坐贓論流循州韋后臨朝為相旬日出刺絳州卒徐彥伯兖州人為蒲州司軍兵參時司戶韋皓善判司士李亘工書彥伯屬辭號河東三絶武后撰三教珠英取文辭士皆天下選彥伯嶠居首和宋之問崕口五渡云聞有獨往客拂衣捐世心結欣薄枉渚撰念榮舊林經亘去崕合冥綿歸壑深琪樹環碧彩金潭生翠隂洄沿弄沙傍危眺明岑夕聞桂裏猿曉玩松上禽雜珮藴孤袖瓊敷綴雙襟我懷滄洲想懿爾白雪吟秉願理方叶存期迹易尋兹言庶不負為報巗中琴贈劉舍人古意云深林閟靈鳥文章世所希巢居碧梧樹舞君青瑣闈或言鳳池樂撫翼更西飛鳯池環禁林仙閣霧沉沉璇題激流日珠綴綿清隂郁穆絲言重熒煌台座深風張丹戺翮月弄紫庭音還彩結不散孤英跂莫尋浩歌向蘭渚婉孌故儔心和韋元旦早朝云夕轉清壺漏晨驚長樂鐘逶迤綸禁客假寐守銅龍豫亦趍三殿肩隨謁九重繁珂接曙響華劒比春容相間苔灮歇彌憐芳意濃願言乘日旰携手即雲峰祓禊渭濵侍宴應制云晴風麗日滿芳洲御幕春筵祓錦流皆言曲侍璜溪宴暫似輕飛天漢遊侍宴韋嗣立莊云鼎臣休浣隟方外結遙心别業青霞境孤潭碧樹林每馳東野䇿遙弄北溪琴帝眷紆時豫台園賞嵗隂移鑾明月沼張組白雲岑御酒瑶觴落仙壇竹徑深三光懸聖藻五等冠朝簮自昔皇恩感咸言獨自今送金城公主云鳯扆憐簫曲鸞閨念掌珍羌庭遙築館廟䇿重和親星轉銀河夕花移玉樹春聖心悽逺送留蹕望征塵駕幸溫泉云姬典歌時邁虞編記省方何如黑帝月玄白雲鄉翠仗縈船岸明旗應萯草也音負王陽風搖花彩雪艷寶戈芒御陌開油次離宫夾樹行桂枝籠騕裊松葉蔭堂皇仙女舍珠液溫池孕璧房湧疑神瀵溢泛若帝臺漿獨沸流常熱潛蒸氛轉香青玹環玉甃紅淀鑠金光藻曜凝芳潔葳蕤獻淑祥五龍歸寶算九鴈叶時康同預華封老中衢祝聖皇安樂公主新宅云鳳樓開闔引明光花酎連添醉益香欲知帝女薰天貴金歌玉柱夜成行柱或云金欹或云金珂玉柱玉餞唐永昌云金溪碧水玉潭砂鳬鳥翩翩弄日華鬪雞香陌行春倦為摘東園桃李花餞唐州髙使君云香蕚媚紅滋垂條縈緑絲情人拂瑶袂共惜此芳時驌騻巳躑躅鳥隼方葳㽔跂聞望太守流潤及京師中宗幸興慶池戲競渡獻詩曰夾道傳呼翊翠虬天回日轉御芳洲青潭曉靄籠仙蹕紅嶼晴花隔綵旒香溢金環盈廣坐聲搖妓舸匝中流群臣相慶嘉魚樂共哂撗汾歌吹秋中宗與修文館學士宴樂賦詩每命彥伯為之序文彩華縟夜宴安樂公主新第序云言容有典緝似幄之柔規湯沐增榮結風庭之藻渙又曰鳴璜節珮登繡軸之雕軒花綬香纓帶澤壺之青鎖駙馬此言送鄭惟忠序云卷蘆葉而橫吹聲愁隴月撫劒鐔而直視目斷洲彥伯為文多變易求新以鳳閣為鷃閣龍門為虬戶金谷為銑溪玉山為瓊嶽竹馬為篠驂月兔為魄兔進士效之謂之徐澀體宗楚客正月晦中宗幸滻水詩云御輦出明灮乘流泛羽觴珠胎隨月減玉漏與年長寒盡梅猶白風遲柳未黃日斜旌騎轉休氣滿林塘人日清暉閣應制云窈窕神仙閣參差雲漢間九重中禁啓七夕早春還太液天為水蓬萊雪作山今朝上林樹無處不堪攀幸安樂公主西園應制詩玉樓銀榜枕嚴城翠蓋虹旗列禁庭日映層巗圖畫色風搖雜樹管絃聲水邊重閣含飛動雲裏孤峰似削成幸陪七聖遊昆閬無勞萬里訪蓬瀛又安樂公主入新宅詩云星橋他日創仙榜此時開馬向鋪錢埒簫聞弄玉臺人疑衛叔美客似長卿才借問遊天漢誰能取石回楚客字叔敖河東人節愍太子之敗也楚客請誅其首祭三思俄為相與紀處納締交世號宗紀御史崔琬與宗紀兄弟劾之帝詔琬兩解之世謂帝為和事天子韋氏敗被誅韋承慶字延休性謹畏長安中為相附張易之時與異母弟嗣立並為宰相韋氏孝友詞學則承慶嗣立邃音樂有萬石逹禮儀則叔夏史才博識有述時趙冬曦兄弟亦各有名張説曰韋趙兄弟人之杞梓寒食應制詩云鳳條春色晚龍禁早輝通舊火收槐燧餘寒入桂宫鶯啼正隱葉雞鬪始開籠藹藹瑶山滿仙歌始樂風直中書省詩清切鳳凰池扶踈雞樹枝惟應集鸞鷺何為宿羈雌大造乾坤闢深恩雨露垂昆蚑既含養駑駘亦驅馳朩偶翻為用芝泥忽濫窺九思空自勉五字本無施徒喜逢千載何階答二儀螢灮向日盡蚊力負山疲禁宇庭除闊間宵鐘箭移暗花臨戶發殘月下簾欹白髮隨身改丹心為主披命將時並泰言與行俱危寄謝巢由客堯年正在斯南中詠鴈云萬里人南去三秋鴈北飛不知何嵗月得與爾同歸凌朝浮江旅思云天晴上𥘉日春水送孤舟山遠疑無樹潮平似不流岸花榮且落江鳥沒還浮羈望傷千里長歌遣客愁蕭至忠安樂公主山莊云西郊窈窕鳳凰臺北渚平明法駕來匝地金聲𥘉度曲周堂玉溜始傳杯灣路分遊畫舟轉巗門相向碧亭開微臣此時承宴樂髣佛疑從星漢回九日侍宴應制云望幸三秋暮登髙九日𥘉朱旗巡漢苑翠帟俯秦墟寵極茰香遍恩深菊酎餘承歡何以答萬億俯宸居字得餘慈恩寺九日登塔應制云天蹕三乘啓星輿六轡行登髙臨寶塔極目遍王城神衛虛中繞仙歌雲外清重陽千萬壽率舞頌升平至忠德言孫相中宗後從太平公主逆謀誅明皇曰至忠誠國器但晚謬耳李逈秀慈恩寺九日應制云沙界人王塔金繩𣑽帝遊言從祗樹賞行玩菊叢秋御酒調甘露天花亂綵旒堯年持佛日同此慶時休和主弟錫宴云金榜岧嶤雲裏開玉簫參差天際回莫驚側辨還歸路祗為平陽歌舞催安樂公主山莊云詰旦重門聞警蹕傳言太主奏山林是日回輿羅萬騎此時歡甚賜千金鷺羽鳳簫參樂曲荻薗竹徑接帷隂手舞足蹈方無巳萬年千嵗奉薰琴逈秀崔湜鄭愔在武后中宗時以姦淫汙名位然皆有文逈秀嘗以鴛鴦一雙與張易之共飲取其常相逐也逈秀為兵部尚書有疾謂問者曰僕自知當作侍中有命固不憂也問者出門而終詔贈侍中劉憲送張亶赴朔方應制云命將擇耆年圖功勝必全灮輝萬乘餞威武二庭宣中衢橫鼓角曠野蔽旌旃推食天厨至投醪御酒傳涼風過鴈苑殺氣下雞田分閫恩何極臨岐動睿篇陪幸長寧公主林亭莊云公主林亭地清晨降玉輿畫橋飛渡水仙閣涌臨虛晴新看蛺蝶夏早摘芙蕖文酒娛遊盛欣叨侍從餘陪幸五王宅云北斗樞機任西京肺腑親疇昔王門下今兹制幸晨恩灮山水被聖作管絃新繞座薰紅藥當軒暗緑筠摘荷才早夏聽鳥尚餘春行漏金徒晚風煙起觀津三會寺應制云岧嶤蒼史臺敞朗紺園開戒旦壺人警翻霜羽騎來下輦登三襲褰旒望九垓林披館陶榜水浸昆明灰網戶飛花綴幡竿度鳥回豫遊仙唱動瀟灑出塵埃薦福寺應制云地靈傳景福天駕儼鈎陳佳哉藩邸舊赫矣𣑽宫新香塔魚山下禪堂鴈水濵珠幡映白日鏡殿寫青春甚歡延故吏大覺拯生人幸承歌頌末長奉屬車塵陪遊上苑遇雪云龍驂曉日望春宫正逄春雪舞春風花灮併在天文上寒氣行銷御酒中賜剪綵花應制云上林宫館妓春心獨早知剪花疑始發刻燕似新窺色濃輕雪點香淺嫩風吹此日叨陪待恩榮槧數枝人日清暉閣應制云輿輦乘人日登臨上鳳京風尋歌曲揚雪向舞行縈千官隨興合百福與時并承恩長若此微賤幸升平安樂公主山莊云主家别墅帝城隈無勞海上覔蓬萊沓嶂懸流平地起危樓曲閣半天開庭莎作薦舞行出浦樹相將歌棹回此日風灮與形勝祗言併伴聖詞來侍宴韋嗣立莊云東山有謝安枉道鳴和鑾緹騎紛初日霓旌度曉寒雲蹕巗間下虹橋澗底盤幽棲俄似屆聖曯宛餘觀崕懸飛溜直岸轉緑潭寬桂華堯酒泠松響舜絃彈明主恩斯極賢臣節更殫不才叨侍從詠聽以濡翰白鹿觀應制云玄遊乘落暉仙宇曖霏微石梁縈澗轉珠斾掃壇飛芝童薦膏液松鶴舞驂騑還似瑶池上歌成周馭歸人日玩雪應制云勝日登臨雲葉起芳風搖蕩雪花飛星暉幸得承金鏡揚影還將奉玉衣送金城公主云外館踰河右行營指路岐和親悲逺嫁忍愛泣將離旌斾羌風引軒車漢水隨那堪馬上曲時向管中吹興慶池應制云蒼龍闕下天泉池軒駕來遊簫管吹緣堤夏篠縈不散冒水新荷卷復披帳殿疑從畫裏出樓船直在鏡中移自然東海神仙處何用西昆轍迹疲宴安樂公主新宅云層軒洞戶旦新披度曲飛觴夜不疲綺綴玲瓏河色曉珠簾隱映月華窺餞唐永昌云始見郎官拜洛陽旋聞近侍發雕章緒言巳朂期年政綺字當生滿路灮七夕應制云秋吹過雙闕星仙動二靈更深移月鏡河淺度雲軿殿上呼方朔人間失武丁天文兹夜裏光映紫微庭慈恩寺九日應制云香塔曾霄半仙鑣淨鏡逰登臨慿季月寥廓見中州御酒新寒退天文寶氣浮却邪將獻壽兹日奉千秋人日侍宴大明宫應制云禁苑韶華此日歸東郊道上轉青旗柳色梅芳何處所風前雪裏覔芳菲開氷池內魚新躍剪綵花間燕始飛欲識王遊逹陽氣為觀天藻競春輝奉和三日祓禊渭濵云桃花欲落柳條長沙頭水上足風灮此時御蹕來遊處願奉年年祓禊觴奉和春幸望春宫應制云暮春春色最便妍苑裏花開列御筵商山積翠臨城起滻水浮灮共幕連鶯藏嫩葉歌相喚蝶礙芳叢舞不前歡娛節物今如此願奉宸遊億萬年憲字元度宋州人為中書舍人坐善張易之出刺渝州召為太僕少卿兼修文館學士卒天授中治來俊臣獄疾其酷欲痛繩之反為所陷明皇在東宫憲啓曰禇無量經明行修耆年宿望冝數召問以察其言太子順納崔湜白鹿觀應制云御旗探紫籙仙仗闢丹丘捧藥芝童下焚香桂女留鸞歌無歲月鸖語記春秋臣朔其何幸常陪漢武遊送金城公主云懷戎前册備降女舊姻修簫鼓辭家怨旌旃出塞愁尚孩中念切方逺御慈留顧乏謀臣用仍勞聖主憂餞唐州髙使君云芳春桃李時京都物華好為嶽豈不貴所悲陟逺道逺道不可思宿昔夢見之贈君雙佩刀日夕視來期慈恩寺九日應制云帝里重陽節香園萬乘來却邪萸結珮獻壽菊傳杯塔類承天湧門疑待佛開睿詞懸日月長得仰昭回立春內出綵花應制云淡蕩春光滿曉空逍遙御輦入離宫山河降望雲天外臺榭參差煙霧中庭際花飛錦繡合枝間鳥囀管絃同即此歡娛齊鎬宴唯應率舞樂薰風婕妤怨云不分君恩斷新粧視鏡中容華向春日嬌愛似秋風枕席臨燈曉屏幃向月空年年後庭樹榮落在深宫秦州薛都督挽詞云十里綘山幽千年汾水流碑傳門客建劒是故人留壠樹煙含夕山門月照秋古來鐘鼎盛共盡一蒿丘湜仁師之子弟澄液從兄涖並有文翰列居清要每私宴自比王謝之家謂人曰吾門戶及出身歷官未嘗不為第一丈夫當先據要路以制人豈能默默受制於人故進取不巳而不以令終湜執政時年三十六嘗暮出端門下天津馬上賦詩曰春還上林苑花滿洛陽城張説見之嘆曰文與位固可致其年不可及也湜字澄瀾以文詞稱附韋后作相又附太平公主門下客獻海鷗賦以諷湜稱善而不自悛帝誅蕭至忠湜流嶺外後知湜本謀賜死荆州岑羲安樂公主山莊云銀榜重樓出霧開金輿步輦向天來泉聲回入吹簫曲山勢遙臨獻壽杯帝女含笑流飛電乾文動色象昭回誠願北極拱堯日微臣抃舞詠康哉宴安樂公主新宅云金榜重樓開夜扉瓊筵愛客未言歸御歡不覺銀河曙盡醉那知玉露晞餞唐州髙使君云蒼茫南塞地明媚上春時目極傷千里懷居不自持征車别岐路斜日下崦嵫一歎軺軒阻悠悠即所思慈恩寺九日應制云寶臺聳天外玉輦步雲端日麗重陽景風搖季月寒𣓕堂遙集鴈帝樂近翔鸞願獻延齡酒長承湛露歡立春內出綵花應制云和風助律應韶年清蹕乘髙入望先花笑鶯歌迎帝輦雲披日霽俯皇川南山近獻仙杯上北斗平臨御座前一奉恩榮歡在鎬空知率舞聽薰絃羲字伯華初為金壇令弟仲翔長洲令仲休溧水令宗楚客語本道巡察御史曰母遺江東三岑後相中宗睿宗坐預太平公主謀誅始岑氏在清要者數十人羲曰物極則反一可以懼矣然不能抑退以及禍唐詩紀事卷第九
