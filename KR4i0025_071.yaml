front:
  text: 唐詩紀事卷第七十一
  hash: sha256:0656e88dd6514b4fd0a624ad68cae6f3f0012cf4ce2252a619670c4f8e71c2e1
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_071-1a}
body:
  text: 張道古許鼎李京胡曾伍唐圭韓定辭蔣貽恭狄歸昌李極髙越許郴孫蜀牛嶠崔庸同谷子陳詠李旭沈彬周朴孫魴王易簡范櫨之子鄭雲叟謝大虛李嶼江為張道古昭宗時拾遺張道古貢五危二亂表黜居于蜀後聞駕走西岐又遷東洛皆契五危之事悉歸二亂之源因吟一章上蜀王詩曰封章才逹冕旒前黜詔俄離玉座端二亂豈由明主用五危終被佞臣彈西巡鳳府非為固東播鑾輿卒未安諫疏至今如可在誰能更與讀來看道古臨淄人景福中進士釋褐為著作郎遷右拾遺播遷之後方鎮阻兵道古上危亂疏云只今劉備孫權已生於世矣責施州司戶參軍後入蜀王氏聞而憾之乃變姓名賣卜導江青城市中建開國召為武部郎中至玉壘關謂所親曰吾唐室諌臣終不能拳跽與雞犬同食雖召必再貶於此之日葬我於關東不毛之地題曰唐佐輔補闕張道古墓後遇害妻亦繼亡蜀主憫之俾袝葬焉鄭雲叟在華聞之有詩哭之曰曾陳章疏忤昭皇朴落西南事可傷豈使諫臣終屈辱直疑天道惡忠良生前賣卜居三蜀死後馳名遍大唐誰是後來修史者言君力死正頽綱乾符中道古在王鎔幕府一日久旱得雨衆賔賦詩道古最後曰亢陽今已久嘉雨自雲傾一點不斜去極多時下成禪月以詩悼之曰清河逝水太匆匆東觀無人失至公天上君恩三載隔鑑中鸞影一時空墳生苦霧蒼茫外門掩寒雲寂寞中惆悵斯人又如此一聲蠻笛滿江風許鼎登嶺望詩云渺渺三江水悠悠五嶺關鴈飛猶不渡人去若為還鼎唐末詩人至梁正明六年始登第李京除夜長安作云長安朔風起窮巷掩雙扉新嵗明朝是故鄉何路歸鬢絲饒鏡色隟雪奪燈輝却羡秦州鴈逢春盡北飛京唐末詩人至梁正明六年登第胡曾寒食都門詩云二年寒食住京華寓目春風萬萬家金絡馬銜原上草玉叉人折路傍花軒車競出紅塵合冠蓋爭回白日斜誰念都門兩行淚故園寥落在長沙髙駢鎮蜀南蠻時飛一朩夾有借錦江飲馬之語曾時為書記以檄破之兼有詩云辭天出塞陳雲空霧卷霞開萬里通親受虎符安宇宙誓將龍劒定英雄殘霜敢冒髙懸日秋葉爭禁大假風為報南蠻須屏迹不同蜀將武侯公蜀日曾為之或曰路嵓鎮王衍五年宴飲無度衍自唱韓琮柳枝詞曰梁苑隋堤事已空萬條猶舞舊春風何如思想千年事誰見楊花入漢宫內侍宋光溥詠曾詩曰吳王恃霸棄雄才貪向姑蘇醉緑醅不覺錢塘江上月一霄西送越兵來衍怒罷宴曾有詠史詩百篇行于世伍唐圭寒食日獻郡守云入門堪笑復堪憐三徑苔荒一釣船慙愧四鄰教斷火不知厨裏久無煙唐圭唐末進士也韓定辭定辭為鎮州王鎔書記聘燕帥劉仁恭舍於賔館命幕客馬彧延接馬有詩贈韓云燧林芳草綿綿思盡日相携陟麗譙别後巏嵍山上望羡君時復見王喬彧詩清秀然意在試其學問韓於座酬之曰崇霞臺上神仙客學辨癡龍藝最多盛德好將銀筆述麗詞堪與雪兒歌座賔靡不欽訝然亦疑銀筆之僻也他日彧持燕帥之命答聘常山亦命定辭接於公館彧從容問韓以雪兒銀筆之事韓曰昔梁元帝為湘東王時好學著書常紀忠臣義士及文章之美者筆有三品或以金銀雕飾或用班竹為管忠孝全者用金管書之德行清粹者用銀筆書之文章贍麗者以班竹書之故湘東之譽振於江表雪兒者李密之愛姬能歌舞每見賔寮文章有竒麗入意者即付雪兒叶音律以歌之又問癡龍出自何處定辭曰洛下有洞穴曾有人誤墮於穴中因行數里漸見明曠見有宫殿人物凡九處又見有大羊羊髯有珠人取而食之不知何所後出以問張華華曰此地仙九館也大羊者名曰癡龍耳定辭復問彧巏嵍山當在何處彧曰此隨郡之故事何謙光而下問由是兩相悅服結交而去奬貽恭貽恭詠蠶詩云辛勤得繭不盈筐燈下繅絲恨更長著處不知來處苦但貪衣上繡鴛鴦貽恭江淮人唐末入蜀巧於刺譏蜀人畏之孟氏時卒官止令佐而已狄歸昌僖宗幸蜀或題馬嵬驛云馬嵬煙柳正依依重見鑾輿幸蜀歸泉下阿蠻應有語這回休更泥楊妃或云歸昌詩也時為侍郎隱詩或謂羅李極襄王僭偽朱玫秉政百揆失序逼李極為內署極嘗吟曰紫宸朝罷綴鴛鸞丹鳳樓前駐馬看惟有終南山色在晴明依舊滿長安極終為亂兵所殺極字昌詩隴西人登咸通十二年進士第僖宗幸寶雞極在鳳翔襄王逼為翰林學士及王行瑜殺玫襄王奔京城極及妻盧皆被害高越越燕人舉進士文價藹然鄂帥李簡賢之待以殊禮將妻以女越竊諭其意賦詩一絶書于壁不告而去詩云雪瓜星眸衆所歸摩天専待振毛衣虞人莫謾張羅網未肯平原淺草飛餘録出唐許郴中秋夜有懷云趨馳早晚休一嵗又殘秋若只如今日何難致白頭滄波歸處逺旅食向邊愁賴見前賢説窮通不自由郴睦州人鄭谷送郴罷舉歸睦州詩云桐廬歸舊廬垂老復樵漁吾子雖言命鄉人懶讀書孫蜀中秋夜戲酬顧道流云不那此身偏愛月等間看月即更深仙翁每被常娥使一度逢圓一夜吟蜀與方干同時干有别蜀之作云吳越思君意易傷别君添我鬢邊霜由來浙水偏堪恨截斷千山作兩鄉牛嶠紅薔薇云曉啼珠露渾無力繡簇羅襦不著行若綴夀陽公主額六宫爭肯學梅粧嶠字松卿一字延峰隴西人自云僧孺之後乾符五年進士歷遺補尚書郎王建鎮蜀辟判官及僭位為給事中崔庸蘇州崑山惠嚴寺殿基或曰鬼工有僧繇畫龍每風雨如騰躍狀僧繇畫鎖以釘固之乾寧初吳郡進士崔庸有詩云人莫嫌山小僧還愛寺靈殿髙神氣力龍活客丹青庸登天祐二年進士第同谷子昭宗播岐何后用事有同谷子者詠五子之歌何后潛令秦王誅之事未行而奔去詩曰邦惟固本自安寧臨下常須馭朽驚何事十旬逰不返禍胎從此召殷兵灑色聲禽號四荒郍堪峻宇又雕牆靜思今古為君者未或因兹不滅亡唯彼陶唐有冀方少年都不解思量如今算得當時事首為盤逰亂紀綱明明我祖萬邦君典則貽將示子孫惆悵太康荒墜後覆宗絶祀滅其門仇讎萬姓遂無依顔厚何曾解忸怩五子既歌邦已失一場前事悔難追陳詠陳詠眉州青神人有詩名善奕碁昭宗劫遷駐蹕陜郊是嵗䇿名歸蜀韋莊以詩賀之鄉中有嫉善者屬和韋詩曰讓德已令多士伏沽名還得世人聞譏其比滌器當壚也陳嘗以詩自負其詩卷有一聮云隔岸水牛浮鼻渡傍溪沙鳥點頭行杜光庭謂曰先輩佳句甚多何必以此為卷首詠曰曾為朝廷見賞所以列為卷首時人笑之李旭旭及第後呈朝中知已云凌晨曉鼓奏嘉音雷擁龍迎出陸沉金榜髙懸當王闕錦衣即著到家林真珠每被塵泥陷病鸖多遭螻蟻侵今日始知天有意還交雪得一生心旭天祐元年進士登第沈彬彬字子文髙安人也天才狂逸好神仙之事少孤西遊以三舉為約常夢著錦衣貼月而飛識者言雖有虛名不入月矣洪州解至長安初舉納省卷夢仙謡云玉殿大開從客入金桃爛熟沒人偷鳳驚寶扇頻翻翅龍誤金鞭忽轉頭第二舉憶仙謡云白榆風颯九天秋王母朝回宴玉樓日月漸長雙鳳睡桑田欲變六鼇愁雲翻簫管相隨去星觸旌幢各自流詩酒近來狂不得騎龍却憶上清遊第三舉納省卷贈劉象為首云曾應大中天子舉四朝風月鬢蕭踈不隨世祖重携劒却為文皇再讀書十載戰塵銷舊業滿城春雨壞貧居一枝何事於君惜仙桂年年幸有餘劉象孤寒三十舉無成主司覽彬詩其年特放象及第彬乾符中值駕起三峯四方多事南逰嶺表二十餘年回吳中江南偽命吏部郎中致仕彬唐末遊湖湘隱雲陽山十年余與虛中齊已貫休以詩名相吹噓又與韋莊杜光庭唱和皆蜀人也疑其曾入蜀彬詩有九衢冠蓋暗爭路四海干戈多異心之句周朴朴唐末詩人寓於閩中於僧寺假丈室以居不飲酒茹葷塊然獨處諸僧晨粥卯食朴亦携巾孟厠諸僧下畢飯而退率以為常郡中豪貴設供率施僧錢朴即巡行拱手各丐一錢有以三數錢與者朴止受其一了得千錢以備茶藥之費將盡復然僧徒亦未嘗厭也性喜吟詩尤尚苦澀每遇景物搜竒抉思日旰忘返茍得一聮一句則欣然自快嘗野逢一負薪者忽持之且厲聲曰我得之矣我得之矣樵夫矍然驚駭掣臂棄薪而走遇遊徼卒疑樵者為偷兒執而訊之朴徐往告卒曰適見負薪因得句耳卒乃釋之其句云子孫何處間為客松柏被人伐作薪彼有一士人以朴僻於詩句欲戲之一日跨驢於路遇朴在傍士人乃欹帽掩頭吟朴詩云禹力不到處河聲流向東朴聞之忩遽隨其後且行士但促驢而去略不回首行數里追及朴告之曰僕詩河聲流向西何得言流向東士人領之而已閩中傳以為笑或曰曉來山鳥閙雨過杏花稀亦朴詩也古陵寒雨絶髙鳥夕陽明句髙情千里外長嘯一聲初句右張為取作主客圖黃巢至福州求得朴問曰能從我乎答曰我尚不仕天子安能從賊巢怒斬之孫魴潤州金山寺張祐孫魴留詩為第一篇山居大江中逈然孤秀詩意難盡羅隱云老僧齋罷關門睡不管波濤四面生孫生句云結宇孤峯上安禪巨浪間又曰萬古波心寺金山名日新天多剩得月地少不生塵過櫓妨僧定驚濤濺佛身誰言張處士題後更無人魴夜坐句云劃多灰漸冷坐久席成䀶沈彬曰此田舍翁火爐頭之作爾魴南昌人唐末鄭谷避亂歸宜春魴往依之頗為誘掖後有能詩聲終於南唐魴父畫工也王徹為中書舍人草魴誥詞云李陵橋上不吟取次之詩顧凱筆頭豈畫尋常之物魴終身恨之王易簡易簡唐末進士梁乾化中及第名居榜尾不看榜却歸華山尋就山釋褐授華州幕職後召入拜左拾遺又辭官歸隱留詩一絶曰汨沒朝班愧不才誰能低折向塵埃青山得去且歸去官職有來還自來及再召為郎遷諫垣臺三十年歸華山十年而終范攄之子吳人范攄處士之子七嵗能詩贈隱者云掃葉隨風便澆花趂日隂方千曰此子他年必成名又吟夏日云間雲生不雨病葉落非秋千曰惜哉必不享夀果十嵗卒鄭雲叟鄭微君為詩皆祛淫靡逈絶囂塵如富貴曲云美人梳洗時滿頭間珠翠豈知兩片雲戴却數鄉稅又詠西施云素面已云妖更著花鈿飾臉橫一寸波浸破吳王國又七言傷時帆力劈開滄浪海馬蹄踏破亂山青浮名浮利過於酒醉得人心死不醒又題霍山秦尊師老鸖玄猿伴採芝有時長歎獨移時翠娥紅粉嬋娟劒殺盡世人人不知又偶題似鸖如雲一箇身不憂家國不憂貧擬將枕上日髙睡賣與世間榮貴人又思山詠因賣丹砂下白雲鹿裘惟惹九衢塵不如將耳入山去萬是千非愁殺人又景福中作云悶見戈鋋匝四溟恨無竒䇿救生靈如何飲酒得長醉直到太平時節醒又招友人遊春云難把長繩繫日烏芳時偷取醉工夫任堆金壁磨星斗買得花枝不老無又山居云間見有人尋移庵更入深落花流澗水明月照松林醉勸頭陀酒間教孺子吟身同雲外鸖斷得世塵侵又詩云冥心栖太室散髮浸流泉採柏時逢麝看雲忽見仙夏狂衝雨戲春醉戴花眠絶頂登雲望東都一點煙又詩不求朝野知卧見嵗華移採藥歸侵夜聽松飯過時荷竿尋水釣背局上嵓碁祭廟人來説中原正亂離雲叟僖宗時應百篇舉不利遂隱華山月到君山酒半醒朗吟疑有水仙聽無人識我真間事羸得髙秋看洞庭雲叟宿洞庭詩也謝太虛抄秋洞庭懷王道士云漂泊日復日洞庭今更秋青桃亦何意此夜催人愁惆悵客中月徘徊江上樓心知楚天逺目送蒼波流謝客久已滅微言無處求空餘白雲在客與隨孤舟千里杳難盡一身常獨遊故園復何許江漢徒遲留李嶼過洞庭云浩渺注橫流千潭合萬湫半洪侵楚翼一汊屬吳頭動軸當新霽漫空正仲秋勢翻荆口迮聲擁嶽陽浮逺脈滋衡嶽微涼散橘洲星辰連影動嵐翠逐隅收漸落分行鴈旋添趂伴舟升騰人莫測安穩路何憂氣與塵中别言堪象外搜此身如粗了來把一竿休江為嶽陽樓云倚樓髙望極展轉念前途晚葉紅殘楚秋江碧入吳雲中來鴈急天末去帆孤明月誰同我悠悠上帝都唐詩紀事卷第七十一
