  text: 唐詩紀事卷第十四
  hash: sha256:ccc18d570ffa924f630584a3c097a6a7d16cf9629b36e81d3de2afecde58058c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_014-1a}
body:
  text: 張説宋璟王丘崔翹王光庭席豫梁升卿源乾曜張嘉正盧從願韓休徐知仁崔禹錫裴漼韋抗程行諶李皓蕭嵩劉升裴光庭宇文融崔沔崔尚陸堅崔泰之崔日知魏奉古張説人日迎春賜綵花詩云别館芳菲上苑東飛花淡沱御筵紅城臨渭水天河近闕對南山雲霧通繞殿流鶯凡幾樹當蹊亂蝶許多叢春園既醉心和樂共識皇恩造化同送金城公主云青海和親日星潢出降時戎王子􅡾寵漢國舊家慈春野開離宴雲天起别詞空彈馬上曲詎減鳳樓悲晦日滻水應制云千行發御柳一葉下仙笻青浦宸遊至朱城佳氣濃雲霞交暮色草樹喜春容藹藹天旗轉清笳入九重餞唐州管使君云常時好間燕朋舊少相過及爾宣風去方嗟離别多淮流春晼晚江海路蹉跎百年屢分散言歡復幾何中宗時作已上四首説字道濟洛陽人相明皇為文屬思精壯長於碑志謫嶽州後詩益悽婉人謂得江山助云夜坐詩云懷哉四壁時未有五都價百金誰見許斗酒難為貰落花生芳春孤月皎清夜復逢利交客題户遙相謝嶽陽早霽南樓云山水佳新霽南樓玩𥘉旭夜來枝半紅雨後洲全緑四運相終始萬形紛代續適臨青草湖再變黃鶯曲地穴穿東武江流下西蜀歌聞枉渚邅舞見長沙促心逺居無漏神和生自足白髮悲上春知常謝無欲嶽陽石門墨山二山相連有禪道觀天下絶境詩云囷輪江上山近在華容縣常陟巴丘首天晴遙可見佳邀屢前諾芳月愆幽眷及此符守移歡言臨道便既携賞心客復見送行掾竹徑入隂窅松崕上空蒨草共林一色雲與峰萬變探窺石門斷緣越沙澗轉兩山勢爭雄峰巘相顧盻藥妙靈仙寶境華巗壑選清都西淵絶金地東敞宴池果接園畦風煙邇臺殿高尋去石頂曠覽天宇遍千山紛滿目百川豁對靣騎來雲氣迎人去鳥聲戀長揖桃源士舉世同企羡嶽州山城云嶽城豐日暇閉户見天心東曠迎朝色西樓引夕隂觀書千載近學靜二毛深忽有南風至吹君堂上琴嶽州行郡竹籬云山郡不溝郭荒城無翳壅愛人忠主利義守閉為勇芶非小勤瘁安得期逸寵板築恐土踈蘘城嫌役重藩柵聊可固筠篁近易奉差池截浦沙繚繞緣隈隴矗似長雲亘森如高戟聳預絶材狼憂知免牛羊恐閭里寬矯步榛叢恣踏踵始果遊處心終日成間拱出湖寄趙冬曦云西泛平湖盡參差入亂山東瞻嶽陽郡汙漫太虛間窘步同行樂遒文亦屢看山戍上雲桂江亭臨水關川途倐忽間風景依如昨湘浦未賜環荆門猶主諾何時得余美載酒遊宛洛説謫嶽州常鬱鬱不樂時宰以説機辨才略牙相排檳蘇頲方大用説與瓌善説因為五君詠致書封其詩以貽頲誡其使曰當候忌日近暮送之使者近暮弔客至多説先公僚舊頲覽詩鳴咽流涕翌日上對大陳説忠正謇諤人望所屬不宜淪滯遐方上因降璽書勞問俄遷荆州長史由是陸象先韋嗣立張庭圭賈曽皆以譴逐歲久因加甄敘頲以父之執友事之甚謹王泠然上燕公書云詩曰投我以朩瓜報之以瓊琚此言雖小可以喻大相公五君詠曰凄涼丞相府餘慶在元成蘇公一聞此詩移公於荆府積漸至相由蘇得也今蘇屈居益部公坐廟堂投朩報瓊義將安在亦可舉蘇以自代然後為方朔之行泠然書又曰相公嶽陽送别詩云誰念三千里江潭一老翁今日忘往日之棲遲貪暮年之富貴乎明皇封太山回過金橋御路縈轉一望旌纛綿數十里上曰張説言我勒兵三十萬旌旗徑五百里陜右上黨至于太原上碑見后真才子也召吳道子韋無忝陳閹同製金橋圖扈從南山雀鼠谷云豫動三靈贊時巡四海威硤關凌曙出平路半春歸霍鎮迎雲罕汾河送羽旗山南柳半密北谷草全稀遲日冝華蓋和風入夾衣上林千里近應見百花飛將赴朔方軍應制云禮樂逄明主韜鈐用老臣恭憑神武策逺御鬼方人供帳榮恩餞山川喜詔巡天文日月送朝賦管弦新幼志傳三略衰材謝六鈞膽猶忠作伴心故道為鄰漢保河南地胡清塞北塵連年大軍後不日小康辰劒舞輕離别歌酣忘苦辛從來思博望許國不謀身説赴集賢院學士上賜宴應制得輝字韻云侍帝金華講千齡道固稀任將賢士設書共學徒歸首命深燕隗通經淺漢韋列筵榮賜食送客愧儒衣賀燕窺簷下遷鶯入殿飛欲知朝野處文教日光輝三相同日拜官奉和御制云大塊鎔群品輕生偶聖時猥承三仕命虛忝百僚師右揆謀華實前星傳重資逵騫求舊禮濫點樂賢詩賜釜同榮拜樅金宴宰司菊花吹御酒蘭葉捧天詞寶曆休明盛頺年晷漏衰少留青史筆未敢赤松期恩賜宴樂遊園云漢苑佳遊地軒庭近侍臣共持榮幸日來賞豔陽春饌玉頒王篚樅金下帝鈞池臺草色遍宫觀柳條新花綬光連榻朱顔暢飲醇聖朝多樂事天意每隨人醉中作云醉後方知樂彌勝未醉時動容皆是舞出語揔成詩雜詩云抱薰心常焦舉斾心常搖天長地自久歡樂能幾朝君看西陵樹歌舞為誰嬌五君詠事顔氏之心也擬焉達志美類刺異感義哀齊公生人表向天聞鸖唳清論早揣摩玄心晚超詣入相廊廟靜出軍沙漠霽見深吕祿憂舉後陳平計甘心除君惡足以報先帝許公信國楨堯美具瞻情百事資朝問三章廣世程處高心不有臨節自為名朱户傳新戟青松拱舊瑩凄涼丞相府餘慶在玄成李公實神敏才華乃天授睦親何用心處貴不忘舊故事尊臺閣新詩冠宇宙在人忠所奉惡我誠將宥南浦去莫歸嗟嗟蔑孫秀代公舉鵬翼翻飛磨海霧志康天地屯適與雲雷遇興喪一言決安危萬心注大勳書王府窄命淪江路勢傾北夏門哀靡東平樹耿公山嶽靈才傑心亦妙鷙鳥峻摽立辰玉扣清調協贊休明啓思華日月照何意瑶臺雲風吹落江徼湘流下潯陽灑淚一投弔宋璟奉和明皇答張説南出雀鼠谷詩云秦地雄西夏并州近北胡禹行山啓路王在邑為都忽視寒暄隔深思險易殊四時宗伯敘六義宰臣鋪徴作宫常應星環日每紆盛哉逢合道良以致亨衢奉和聖製送張尚書巡邊云帝道薄存兵王師尚有征是開司馬法爰命揔戎行畫閫崇威信分麾盛寵榮聚觀方結轍出祖遂傾城聖酒山河潤天詞象緯明德風邊地偃勝氣朔雲平宰國推良器為軍挹壯聲至和常得體不戰即雲精以智泉寧竭其徐海自清遲遲廟堂坐贈别故人情奉和御製三相同日上官詩云丞相邦之重非賢諒不居老臣庸且憊何德以當諸厚秩先為忝崇班復此除太常陳禮樂中棭降簮據聖酒山河潤仙文象緯舒冒恩懷寵祿陳力省空虛郭隗慙無駿馮諼愧有魚不知周勃者榮幸定何如恩賜樂遊園宴詩云侍飲終酺會承恩續勝遊戴天惟慶幸選地即殊尤北向祗雙闕南臨賞一丘曲江新溜暖上苑雜花稠亹亹韶絃屢戔戔賁帛周醉歸填畛陌榮耀接軒裘右開元天子登封泰山南出雀鼠谷張説獻詩明皇御答群臣應制故明皇詩有川途猶在晉車馬漸歸秦之句餞張尚書朔方者燕公説也明皇詩有三台入武帳八座起文昌之句左丞相張説右丞相宋璟太子少傳源乾曜同日上官錫宴東堂明皇賜詩有赤帝收三傑之句故蘇晉序云天子作三傑之詩以命宴樂蓋為此也劉禹錫獻權舍人書日昔宋廣平之沉下僚也蘇公味道時為繡衣直指使者廣平投以梅花賦蘇盛稱之自是方列于聞人之目名遂振嗚呼以廣平之才未為是賦則蘇公果暇知其人耶將廣平困於窮厄於躓然後為是文耶是知英賢卓犖可外文字然猶用片言借説於先逹之口席其勢而後驤首當時矧碌碌者疇能自異皮日休桃花賦序曰餘常慕宋廣平之為相正姿徑質剛態毅狀疑其鐵腸石心不能吐婉媚辭然覩其文而有梅花賦清便冨艷得南朝徐庾之體王丘奉和明皇答張説南出雀鼠谷詩云襟帶三秦接旗裳萬乘過陽源淑氣早隂谷沍寒多花褥前茆仗霜嚴後乘戈戍雲開晉嶺江鴈入汾河北土分堯俗南風動舜歌一聞天樂唱恭逐萬人和丘字仲山擢童子科能屬文為吏部侍郎典選其奬用如孫逖張晉明王泠然皆一時茂秀蕭嵩引與當國丘盛推韓休休秉政薦為御史大夫托言蕭頴士恃才傲物嘗携壺逐勝憩於逆旅風雨暴至有紫衣翁領二僮避雨於此頴士頗侮之雨止老人上馬呵殿而去頴士始知為丘也明日造門謝罪丘引至廡下坐而責之復曰子負名傲忽其止於一第乎果終于楊州工曹崔翹奉和皇明答張説南出雀鼠谷詩云硤路繞河汾晴光掃曙氛笳吟中嶺樹仗入半峰雲頓覺山原盡平看邑里分早行芳草末晚想好風薰嘉頌推英宰春遊扈聖君共欣承睿渥日月照天文翹官至禮部尚書清河公王光庭奉和明皇答張説南出雀鼠谷詩云省俗恩時遍巡方路稍回寒隨汾谷盡春逐晉郊來雲騎傳行漏煙旄引從臺惠風𥘉應律和氣正調梅雅頌通晨禁天文接曙台霸城桃李色應待日華開奉和御製送張尚書巡邊詩云賢相德符充朝推文武雄海波先若鏡關草預從風鉞助將軍勇威成天子功瓊章九霄發錫宴五衢通玉輾龍盤帶金裝鳳頸驄虎貔分擬擬河洛震熊熊戈刃千霜白旌旗萬火紅示刑夷夏變流惠鬼神同張説送光庭詩云同居洛陽陌經日懶相求及爾江湖去言别悵悠悠楚雲眇羇翼海月倦行舟愛而不可見徒嗟芳歲流光庭與燕公最善故云席豫奉和明皇答張説南出雀鼠谷詩云鳴鑾𥘉幸代旋蓋欲橫汾山盡千旗直郊平五校分前林已暄景後壑尚寒氛風送簫韶曲花鋪黼黻文鹽梅推上宰禮樂統中軍獻賦紆天札飄飄飛白雲奉和聖製送張尚書巡邊詩云聖帝重兵權分飛屬大賢中軍人執政丞相復巡邊翕習戎裝動張皇廟略宣朝榮承睿札野餞轉行旃亭障東緣海沙場北際天春冬見嚴雪朝夕候烽煙巳勒燕山頌猶聞遣戍篇五營將月合八陳與雲連經略圖方逺懷柔道更全歸來畫麟閣藹藹武功傳豫字建侯年十六舉手筆俊拔科中之後為中書舍人與韓休許景先徐安正孫狄名相甲乙當時號為席公帝嘗登朝元閣賦詩群臣屬和帝以豫詩最工詔曰詩人之冠冕也梁升卿奉和明皇答張説南出雀鼠谷詩云何忽重關道千年遇聖皇幽林承惠澤間客見清光日御仙途逺山靈壽域長寒雲入晉薄春樹隔汾香國佐同時雨天文屬歲陽從來漢家盛未若此巡方升卿與張九齡善涉學工書於八分尤工歷廣州都督書東封朝覲碑為時絶筆源乾曜奉和御製送張尚書巡邊云胸奴邇河朔漢地復戎旅天子擇英才朝端出監撫流星下閶闔寶鉞專公輔禮物生光輝宸意備思詡有征示矛戟制勝惟樽俎彼美何壯哉桓桓擅斯舉聲華振臺閣功德摽文武奉國知命輕忘家以身許安人在勤恤保大殫襟腑此外無異言同情報明主送張説上集賢學士賜宴賦詩得迎字云盛業光書府微人盡國英絲綸賢相稱群俊學為名寵命垂天賜崇恩發睿情薰風清禁籞文殿述皇明日霽庭隂出池新水氣生歡娛此無限詩酒自相迎奉和御製賜三相同日上官云睿作超千古湛思育萬人遞遷俱荷澤同拜忽為鄰道合音徽暢芳馳景命新鼓鐘崇享禮鵷鷺集朝倫竊位思官謗雕容謝木春慙多無以敘拙備實難陳進級懷三少承光盡百身自當歸第日何幸列宫臣乾曜開元𥘉薑皎薦於帝召見神氣爽徹占對有序帝悅之性謹重與張嘉正張説李元紘同秉政居書中未常廷議可否皎為嘉正所排得罪訖不申救君子譏焉張嘉正奉和御製送張尚書巡邊云天錫我宗盟元戎付夏卿多才思命將必勇獨橫行經緯稱人傑文章作代英山川看是陳草木想為兵不待河氷合猶防漢月明有謀當繫魄無戰是綏氓閫外專三略雲中冀一平感恩共心盡悵别屢魂驚直視前旌掣遙聞後騎鳴還期方定日復此出郊迎嘉正性簡疏與人不疑所薦中書舍人苖延嗣吕太一考功貟嘉靖侍御史崔訓時語曰令君四俊苖吕崔貟始為中書舍人崔湜輕之後與議事正出其上湜驚曰此終其坐後十年而為中書令盧從願奉和御製送張説巡邊云上將發文昌中軍靖朔方占星引旌節擇日拜壇場禮樂臨軒送威聲出塞揚安邊俟帷幄制勝在巗廊作鼓將軍氣投醪將士觴戒途遵六月離贈動三光槐路清梅暑蘅臯赴麥涼時文仰雄伯耀武震遐荒袵席知無戰兵戈示不忘佇聞歌杖杜凱入繫名王從願字子襲舉制科髙第為兵部尚書數充校考使御史中丞宇文融將以栝田户功為上下考從願不許乃密白從願盛植産占良田數百頃帝自此薄之目為多田翁後欲用為相屢矣卒以是止韓休奉和御製送張尚書巡邊云一德光台象三軍掌夏卿來威申廟略出揔協師貞受鉞辭金殿憑軒去鼎城曉光搖組甲踈吹繞雲旌左律方先凱中􅎏即訓兵定功彰武事陳頌紀天聲祖宴𥘉留賞宸章更寵行車徒零雨送林野夕隂生路極河流逺川長朔氣于南轅遲反斾歸奏謁承明休知制誥簫嵩薦與同秉政帝重之徐知仁奉和御製送張尚書巡邊云聖德膺三統皇威𬒳八埏大明均照物小醜未寧邊國相台衡重元戎廟略宣紫泥方受命黃石乃推賢問罪隂山下安人屬國前度關行照月乘障坐銷煙北闕紆宸藻南橋列祖筵耀威當夏日殺氣指秋天􅤯鼓黿鼉振旌旗鳥獸懸由來詞翰首今見勒燕然崔禹錫奉和御製送張尚書巡邊云供帳何煌煌公其撫朔方群寮咸餞酌明主降離章關塞重門下郊歧禁苑傍練兵冝雨洗卧鼓候風涼炎景寧云憚神謀肅所將旌搖天月逈騎入塞雲長赫赫皇威振油油聖澤滂非惟按車甲兼以正封疆叱叱隂山道澄清潮海陽虜垣行決勝台座佇為光禹錫字洪範登顯慶三年進士第為中書舍人裴漼送張説上集賢學士賜宴賦得升字云問道圖書盛尊儒禮教興石渠因學廣金殿為賢升日月恩光照風雲寵命膺謀謨言可範舟楫事斯慿宴喜明時洽光輝湛露凝大哉堯作主天下頌歌稱漼與張説善説為相數薦之漼長於敷奏天子亦自重焉韋杭送集賢學士張説上官賜宴賦得西字云廣庭臨璧沼多士侍金閨英宰文儒協明君日月齊集賢光首拜改殿發新題早夏𥘉移律餘花尚拂溪壷觴接雲上經術引關西聖德鴻名逺將陪玉檢泥杭終於刑部尚書所薦如梁升卿王倕王夀後皆為顯人唐史稱之程行諶送張説上集賢學士賜宴賦得回字聖主崇文化鏘鏘得盛才相因歸夢立殿以集賢開象繫微言闡詩書至道該堯樽承帝澤禹膳自天來禮洽歡逾長風怡暑更回國朝將舜頌同是一康哉裴子餘輔鄠尉行諶與之同舍行諶以文法稱而子餘以儒顯長史陳崇業曰蘭菊異芬無可廢者二子卒子餘諡孝行諶諡正張説嘆曰二諡可無愧矣李皓送張説上集賢學士賜謙得催字偃武堯風接崇文漢道恢集賢更內殿清選自中台佐命留侯業詞華博物才天厨千品降夏旨百壷催鵷鷺方成列神仙喜暫陪復欣同拜首叨此頌良哉蕭嵩送張説上集賢學士賜宴得登字云帝日簡才能旌賢在股肱文章體一變禮樂道逾引藝閣英華入賔門鵷鷺登恩延過所望聖澤實超恆夏葉開紅蘂餘花發紫藤微臣亦何幸叨此預文明奉和御製三相同日上官詩云審官思共理多士屬惟唐歷選台庭舊來熙帝業昌入朝師百辟論道協三光垂拱資元老親賢輔少陽登榮崇禮送寵德耀宸章卿酒飛觴洽仙闈雅樂張荷恩思有報陳力愧無良願罄公忠節同心奉我皇嵩開元初權中書舍人崔琳王丘齊浣以嵩少學術不以輩行許也獨姚崇稱其逺到帝欲相蘇頲嘗夜密召嵩草詔其詞曰國之瓌寶帝曰朕不斥其父名卿當為刋削沉思久之乃曰國之珍寶嵩出帝曰虛有其表嵩頥大多髭故帝有是言劉升送張説上集賢學士賜宴得賔字云圖書應明主策府宴嘉賔台耀臨東壁乾光自北辰網羅窮象繫述作究天人聖酒千鍾洽仙厨百味陳成山徒可仰涉海詎知津幸逢文教盛還覩頌聲新升能文善草隸德威之後也開元中纍遷中書舍人裴光庭奉和御製三相同日上官詩云樂賢聞往誥褒德偶兹辰端揆升元老師謀擇纍仁紫庭崇讓畢粉署禮容陳既荷恩榮舊俱承寵命新天文懸瑞色聖酒泛華茵雜遝陳簫鼓歡娛洽縉紳掖垣招近侍虛薄厠清塵共保堅身節當期雨露均光庭字連城時為兵部侍郎後為相撰瑶山往則維城前軌二篇獻之手制褒美詔皇太子諸王於光順門見光庭謝所以規諷意宇文融奉和御製三相同日上官詩云申甫生周日宣慈舉舜年何如偶昌運比德邁前賢寵獲元良密榮瞻端揆遷職優三仕老位極百僚先北極回宸渥南宮飾宴筵飛文瑶札降賜酒玉杯傳謬列台衡重俱承雨露偏誓將同竭力相與效塵涓融為張説所惡欲先事中傷説張九齡謂説曰融辨洽多詐公不可忽説曰狗鼠何能其後乃與崔隱甫廷劾説受賕事帝詔説致仕而出融詩有誓將同竭力相與效塵涓之語欣附説之辭也融安輯户口明皇賜詩張説奉和云聖德臨天下勞情遍九圍念兹人去本蓬轉將何依外避征戌數內傷親黨稀嗟不逢明盛胡能照隱微柏臺簡行李蘭殿錫朝衣别曲動秋風恩令生春輝使出四海安詔下萬心歸怍無夔龍佐徒歌鴻鴈飛崔沔恩賜樂遊園宴云五日酺𥘉畢千年樂未央復承天所賜終宴園之陽地勝春逾好恩深樂更張落花飛廣座垂栁拂行觴庶尹陪三吏諸侯具萬方酒酣同抃躍歌舞詠時康沔字善沖有才章舉賢良方正第一最受知於張説儉約自持嘗作陋室銘以見志云崔尚恩賜樂遊園宴云春日照長安皇恩寵庶官合簪承罷飲宴帛賜追歡供帳憑高列城池入逈寬花催相國飲鳥和樂人彈北闕雲中見南山樹杪看樂遊冝締賞舞詠惜將闌尚登久視六年進士第官至祠部郎中陸堅送張説上集賢學士應制得今字云聖主崇文教層霄降德音尊賢澤既厚式宴寵逾深復有夔龍相良哉簡帝心得人惟邁昔多士諒推今書殿榮光滿儒門喜氣臨顧惟成濫吹徒此接衣簮堅為中書舍人以集賢學士或其非人而供擬太厚議白罷之張説曰麗正乃天子禮樂之司所費細而所益者大陸生之言蓋未逹耶帝知遂薄堅崔泰之酬韋嗣立龍門北溪作云闕塞臨伊水驪山枕灞川俱臨隱路側同在帝城邊謝公兼出處携妓玩林泉鳴騶噴梅雪飛蓋曵松煙聞琴幽谷裏看奕古巗前落月低幃帳歸雲繞管絃叨榮慙北闕微尚愛東田寂寞灰心盡蕭條塵事捐朝思登絶塹夜夢弄潺湲宿懷南澗意况覩北嵓邊同光祿弟冬日述懷序云韋祭酒張左丞二公並廊廟偉才朝廷舊相咸光首和殊為佳作輒繼陽春深增愧悚詩云吾族白眉良才華動洛陽觀光𥘉入仕應宿始為郎飛螢玩書籍白鳳吐文章海卿逾往雅河尹冠前張擇才綏􅋣郢殊化𬒳江湘高樓臨廣陌甲第敞通莊别館邙山下疏亭洛水傍昌年賞豐陌暇日悅林塘衣冠皆秀茂羅綺盡名倡隔岸聞歌度臨池見舞行門庭寒變色􅙶戟自生光窮隂方靉靆殺氣正蒼茫咸時興盛作晚歲共多傷積德韋丞相通神張子房吟草編簮紱逸韻合宫啇功名守留省濫迹在文昌家園遙可見臺寺近相望無庸乘侍謁有暇共翺翔棣華依鴈序竹葉拂鸞觴水坐憐秋月山行弄晚芳恩榮慙服冕友愛篤垂堂無由報天德相顧詠時康丞説光祿日知也韋祭酒嗣立張左泰之時以禮部居洛故與嗣立説日知數有酬唱泰之知溫之子𥘉以職方郎中預平二張終於工部尚書崔日知和韋嗣立龍門北溪作云夙齡秉微尚中年忽有鄰以慈山水僻遂得學通人逮我南京道聞君北業新嵓前窺石鏡河畔踏芳茵既憐伊浦緑復憶灞池春連詞謝家子同歡寄野賔趣間魚共樂情洽鳥來馴誰念昔遊者祗命獨留秦蕭條頴陽戀沖漠漢隂真無由陪勝躅空此玩書筠冬日述懷奉呈韋祭酒張左丞蘭臺名賢云弱齡好經藉披卷即怡然覃精四十載馳騁數千言孔壁採遺篆周韋考絶編袁公論劒術孫子敘兵篇魯史君臣道姬書日月懸從師改炎燠負笈遍山川上異西河道中非北海玄光榮拾青紫名價接通賢既重萬鍾樂寧思二頃田長戟同分虎高冠亞附蟬晚懷重虛曠飬志息雕鐫登高慙思拙匠物謝情妍不慕張平子寧希王仲宣誰為登龍日翻成刻鸖年循循勞善誘軋軋思微牽琢磨才既竭鑽仰德彌堅朽朩誠為諭椚心徒自憐終期吞鳥夢振翼上雲煙賦成先擲地詞高直掞天更執樞衣禮仍開函丈筵露披槐市藹水靜璧池圓願逐從風葉飛舞翰林前日知字子駿日用從父兄與張説同為魏元忠朔方判官再遷洛州司馬譙王重福之變以功加銀青光祿大夫遷殿中少監日知在洛日與韋嗣立張説酬唱故説和冬日述懷詩序云太極殿衆君子分司洛城自春涉秋日有遊訪崔光祿述志論文首貽雅唱諸公嘉德序事咸有報章若夫盛時榮位華景勝會此四者古難一遇而我輩實兼之嗣立亦序云僕忝臺閣早經聮事崔公以雅道自居未嘗至偃之室僕羸疾收退門堪羅雀公存訪不避風雨方知向時迹也今晨情也蘭菊春秋自芳竹柏歲寒無變故嗣立詩有昌年雖共偶歡會此難并為憐漳浦曲沉痼有劉禎之句説詩云夫君邁前侣觀國騁竒姿山似鳴威鳳泉如出寶龜又曰紫綬拂三寺朱門臨九逵其貴盛如此後為太常卿自以處朝廷久每入謁必與尚書齒時謂尚書裏行後為潞州長史卒𥘉赴潞州明皇賜詩云潞國開新府壷關寵舊臨妙旌循吏德持悅庶民心蓋潞為明皇舊鎮故也張説和云聖情垂曩鎮佳氣翊興王增戟雄都府高車轉太常川橫八澗濶山帶五龍長連帥𥘉恩命天人舊紀綱餞塗飛御藻闔境自輝光明主招循吏何年下鳳凰魏奉古和韋嗣立龍門北溪作云有美朝為貴幽尋地自偏踐臨伊水汭想望灞池邊是遇皆新賞兹遊若舊年藤蘿隱路接楊柳御溝聮道愜神情王機忘俗理捐遂𥘉誠已重兼濟實為賢迹是山東戀心唯北闕前顧慙經拾紫多謝賦思玄未屣中林步空乘麗藻傳陽春和巳寡扣寂竟徒然龍門北溪韋嗣立山居在焉諸公賦詩奉古詩預酬唱之末張説序崔韋贈答詩云二公述志論文首貽雅唱其餘尋聲響答望形影赴故亦峻碧池之連漪增瑶林之沃若蓋奉古之徒是也唐詩紀事卷第十四
