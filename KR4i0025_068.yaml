front:
  text: 唐詩紀事卷第六十八
  hash: sha256:46e639a9ff458d49cd6b00bc60c831571d448ba65300751dbc1a54af5e181ba0
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_068-1a}
body:
  text: 湯文圭唐彥謙裴徹盧携韋莊吳融公乘億羅鄴羅衮湯文圭本殷文圭文圭池州人居九華小字桂郎苦學所用墨池底為之穴舉進士中途遇一叟曰眉緑拳文入口神仙狀也如學道當沖虛為儒當大有名於天下唐末詞場請託公行文圭與遊恭獨步場屋乾寧中帝幸三峯文圭携梁王表薦及第仍列榜中尋為裴樞宣諭判官至大梁朱全忠表薦之既而由汴宋馳歸全忠大怒遣吏捕之不及矣自是屢言措大率皆負心每以文圭為證白馬之禍蓋自此也文圭事楊行密終左千牛衛將軍子崇義自江南歸朝改姓湯名悅九華賀雨吟云陶公焦思念生靈變旱為豐合杳冥雷劈老松疑虎怒雨衝隂洞覺龍腥萬畦香稻蓬蔥緑九朵竒峰撲亞青吟賀西成饒旅興散絲飛灑滿長亭贈池州張太守云神珠無纇玉無瑕七葉簮貂漢相家陳面奔星破犀象筆頭飛電躍龍蛇綘幃夜坐窮三史紅斾春行到九華只怕他人留不住别遷征鎮擁髙牙和友人送衡尚書赴池陽副車云淮王上將例分憂玉帳參承半列侯次第選材如創厦别離排宴向藏舟鵾鵬變化知難測龍蠖升沉各有由躞蹀行牽金錂重嬋娟立唱翠娥愁築頭勳業諧三陳滿腹詩書究九流金海珠韜乘月讀肉芝牙茗撥雲收赤鱗斾卷鷗汀晚青雀􅊑撗鴈陳秋十字細波澄鏡面九華殘雪露峯頭醉沉北海千樽酒吟上南荆百尺樓况是昭明食魚郡不妨間擲釣璜鈎正命云衆口聲光文圭賀池陽太守勳業佐淮王誇漠將築頭中秋自宛陵寄池陽太守云出山三見月如眉蝶夢終宵繞戟枝旅客思歸鴻去日賢侯行化子來時郡樓遐想劉琨嘯相閣方窺謝傳棊按部况聞秋稼熟馬前迎拜羡并兒次韻九華杜先輩重陽寄投宛陵丞相云日下飛聲徹不毛酒醒時得廣離騷先生鬢為吟詩白上相心因治國勞千乘信回魚榼重九華秋逈鳯巢髙強酬小謝重陽句沙恨無金盡日淘寄賀杜荀鸖及第云一戰平疇五字勞晝歸鄉去錦為袍大鵬出海翎猶濕駿馬辭天氣正豪九子舊山增秀絶二南新格變風騷由來稽古符公道平地丹梯甲乙髙主犯切馬首飾文圭詩中錂字文圭杜荀鸖楊夔康軿夏侯淑王希羽等皆為淮南將田頵上客文圭有美名不應朱全忠錢鏐之辟頵置田宅迎其母以甥事之故文圭為盡力夔知頵不足亢楊行密著溺賦以戒頵不用果敗文圭受薦於全忠復擬飾非投啓於公卿略曰於莬獵食非求尺璧之珍鶢鶋避風不望洪鍾之樂既登第即南歸俄為多言者所發全忠捕之則不及矣或云文圭應舉嘗經大澤中驟雨震電衆駭躓獨安詳如不聞雨定傍人見其兩耳中鬼神以泥封之後為內翰曽草司空李德誠麻潤毫久不至為詩督之云紫殿西頭月欲斜曽草臨淮上相麻潤筆巳曽經奏謝更將章句問張華時論少之唐彥謙唐儉裔孫憲宗時終中書舍人次子持持子彥謙字茂葉歷慈綘澧三州刺史自號鹿同先生陶榖之祖也榖避晉祖諱改姓陶後遂不易識者非之中秋玩月云一夜髙樓萬景竒碧天無際水無涯只留皎月當層漢並送浮雲出四維霧靜不容玄豹隱水生唯恐夏蟲疑坐來離思憂將曉爭得嫦娥子知細上已寄韓八云上已接寒食鶯花寥落晨微微潑火雨草草踏青人涼似三秋景清無九陌塵與余同病者對此合傷神又云露白風清夜向晨小星乘佩且埋輪綘河浪淺休相隔滄海波深尚作塵天外鳯凰何寂寞世間烏鵲謾辛勤倚欄殿北斜樓上多少通宵不寐人八月十六日夜月云斷腸佳賞固難期昨夜消魂更不疑丹桂影空蟬有露緑槐隂在鵲無枝懶將吟咏聊惆悵早是踈頑耐别離堪恨賈生曽慟哭不緣清景為憂時過長陵詩云耳聞明主提三尺眼見愚民盜一抔千古腐儒騎瘦馬灞陵斜日重回頭又題蒲津河亭云煙橫博望乘槎水月上文王避雨陵最善用事詠栁云惹絆風光别有情世間誰敢鬪輕盈楚王江畔無端種餓損宫腰學不成彥謙學義山為詩裴徹徹通登咸通進士第後為相初左拾遺孟昌圖在蜀上疏極諫僖宗田令孜惡之沉諸蟇頥江徹以詩弔曰一章何罪死何名投水惟君與屈平從此蜀江煙月夜杜鵑應作兩般聲盧携常題司空圗壁云姓氏司空貴官班御史卑老夫如且在不用歎屯竒携字子升乾符中為相巢寇表求天平節度不與欲倚髙駢立功巢遂入關携仰藥死韋莊立春云青帝東來日馭遲暖煙輕逐曉風吹罽袍公子樽前覺錦帳佳人夢裏知雪浦乍開紅菜甲綵幡新剪緑楊枝殷勤欲獻冝春曲題向花箋帖繡楣長安清明云早是傷春夢雨天可堪芳草更芊芊內官初賜清明火上相間分白打錢紫陌亂嘶紅叱撥緑楊髙映畫鞦韆遊人記得承平事暗喜風光似昔年感懷詩云長年方悟少年非人道新詩勝舊詩十畝野塘留客釣一軒春雨對僧碁花間醉任黃鶯語亭上吟從白鷺窺大道不將爐冶去有心重築太平基或謂此詩包括生成果為台輔莊應舉時遇巢冦犯闕著秦婦吟云內庫燒為錦繡灰天街踏盡公卿骨公卿多垂訝莊乃諱之時號秦婦吟秀才又有帝子夢魂煙水闊謝公詩思碧雲低最為警䇿至若間卧詩云誰知間卧意非病亦非眠又手從雕扇落頭任漉巾偏識者知其不祥後誦子美詩白沙翠竹江村暮相送紫門月色新吟諷不輟是歲卒於花林坊葬於白沙莊字端巳杜陵人見素之後曾祖少微宣宗中書含人莊踈曠不拘小節李詢為兩川宣諭和協使辟為判官以中原多故潛欲依王建建辟為掌書記尋召為起居舍人建表留之後相建為偽平章事莊為王建管記時一縣宰乘時擾民莊為建草牒云正當凋瘵之秋好安凋瘵勿使瘡痍之後復作瘡痍時以為口實莊集詩人一百五十人得詩三百章為又元集序云此蓋詩中鼓吹名下笙篁繫鳬氏之鍾霜清日觀淬雷公之劔影動星津雲間分合壁之光海上運摩天之翅奪造化而雲雷噴湧沒鬼神而風雨奔馳但忍其食馬留肝徒云染指豈慮其烹魚去乙或致傷鱗吳融壬戌歲閿鄉卜居云六載抽毫侍禁闈不堪多病決然歸五陵年少如相問阿對泉頭一布衣伯起家阿對是泉至今尚在嘗引泉灌蔬其華清宫云中原無鹿海無波鳯輦鑾旗出幸多今日故鄉歸寂寞太平功業在山河四郊飛雪暗雲端唯此宫中落旋乾緑樹碧簷相掩映無人知道外邊寒漁陽烽火照函關玉輦匆匆下此山一曲羽衣聽不盡至今遺恨水潺潺關東獻劉員外云昨夜星辰動仙郎近漢關玳筵吟雪罷錦帳押春還巳到青雲上應捿綘圃間臨卭有辭賦一為奏天顔融字子華越州人昭宗時為翰林學士卒官李巨川為華帥韓建掌書記昭宗至華清宫賜建御容一軸時巨川草謝表以示融其中有彤雲似蓋以長隨紫氣臨關而不度融吟味不已因草篇與巨川對壘略曰霧開五里克諧披覩之心掌拔一峯兼助捧持之力松江晚泊云樹逺天疑盡江奔地欲隨孤帆落何處殘日更新離客是凄涼本情為繫滯枝寸腸無計免應只楚猿知紅樹云一聲南鴈已先紅槭槭凄凄葉葉同此是孤根非暖地莫驚他朩耐秋風燒煙散去隂全薄明月臨來影半空長憶洞庭千萬樹昭山撗浦夕陽中公乘億髙湜咸通末為禮部侍郎士多繇權要于請湜曰吾決以至公取之得譴固吾分乃取億許棠聶夷中皆有文名億字夀仙魏人與李山甫皆為魏博樂彥禎幕府羅隱寄詩於易定云謝舞仍宫栁髙竒世少雙侍中生不到園今死須降班秩通烏府樽壘奉碧幢昭王有餘烈試為禱迷邦億郎官上應列宿詩云北極佇文昌南宫曉拜郎紫泥乘帝澤銀印佩天光緯結三台側鈎連四輔傍佐啇依傳説仕漢笑馮唐委佩搖秋色峩冠帶晚霜自然符列象千古耀嵓廊秋菊有佳色云陶令籬邊菊秋來色轉佳翠攢千片葉金剪一枝花蘂逐蜂鬚亂英隨蝶翅斜帶香飄緑綺和酒上烏紗散漫搖霜彩嬌妍漏日華芳菲彭澤見稱更在誰家臨江遲來客云江上晚沉沉煙波一望深向來殊未至何處擬相尋栁結重重眼萍翻寸寸心暮山期共眺寒渚待同臨北去魚無信南飛鴈絶音思君不可見使我獨愁吟億以詞賦著名咸通十三年别家十餘年矣嘗大病鄉人傳以死其妻自河北迎喪會億送客馬上見婦人粗縗類其妻也睇睨不已妻亦如之詰之則是也相持而哭路人異之後旬日登第億嘗有詩云十上十年皆落第一家一半已成塵可知其屈矣羅鄴費拾遺書堂云滿袖歸來天桂香紫泥重降舊書堂自憐葦帶同巢許不駕蒲輪佐禹湯怪石盡㴠千古秀竒花多吐四時芳何人更肯追髙躅唯有樵童戲蘚牀雲詩云紛紛靄靄遍江湖得路為霖豈合無莫使悠揚祗如此帝鄉還更暖蒼梧嵗仗云玉帛朝天萬國來雞人唱曉五門開春排北極迎仙仗日捧南山入夀柸歌舜薰風鏘玉佩祝堯嘉氣靄樓臺可憐四海車書混重見蕭曹佐漢才牡丹云落盡春紅始見花花時比屋事豪奢買栽池館恐無地看到子孫能幾家門倚長衢攢繡軛幄籠輕日護香霞歌鍾到此爭歡賞豈信流年鬢有華賞春云芳草和煙暖更青間門要路一時生年年點撿人間事唯有春風不世情公子行云雕鞍玉勒照花明過後鄉風特地生半醉五侯門裏出月髙猶在禁街行鄴餘杭人父則為鹽鐵小吏有二子俱以文學上進鄴尤長七言詩時宗人隱亦以律韻著稱然隱才雄而踈鄴才清而緻咸通中崔安潛侍郎亷問江西志在弓旌竟為幕吏所沮既而俯就督郵因兹舉事無成而卒羅衮清明登奉先城樓云年來年去只艱危春半堯山草尚衰四海清平耆舊見五陵寒食小臣悲煙銷井邑隈樓檻雪滿川原泥酒巵拭盡賈生無限淚一行歸鴈逺參差清明赤水寺居云榆火輕煙處處新旋從間望到諸鄰浮生浮世秪多事野水野花娛病身濁酒不禁雲外景碧峰猶冷寺前春蓑衣毳衲誠吾黨自結村薗一社貧羅隱梁開平中召拜夕郎不起衮以小天倅大秋姚公使兩浙以詩贈隱曰平日時風好涕流讒書雖盛一名休寰區歎屈瞻天問夷貊聞詩過海求向夕便思青瑣拜近年尋伴赤松逰何當世祖從人望早以公台命卓侯隱答曰崑崙水色九般流飲即神仙憩即休敢恨守株曽失意始知緣朩更難求鴒原謾欲均餘力鸖髮那堪問舊逰遙望北辰當上國羡君歸棹五諸侯昭宗誅韓全誨等衮時為左拾遺上言劉蕡當大和時宦官始熾因直言䇿請奪爵土復歸除之役遂羅譴逐死異土六十餘年正人端士切齒飲泣使蕡䇿蚤用則杜漸防萌逆節可消帝感悟贈蕡左諫議大夫唐詩紀事卷第六十八
