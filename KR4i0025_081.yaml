front:
  text: 唐詩紀事卷第八十一
  hash: sha256:c4af8e3911dc114b4457f6c78bf5876b6dec0f78f5aad7ab478a9034d77a8768
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_081-1a}
body:
  text: 毛仙翁贈行詩裴度云爰自荆州鼎成黃金道息封固真粹教不流傳代歷泰漢言者怪濶先儒以為繫風捕影誰抵其實琅邪論衡詳之矣豫嘗以為斯言之未盡其臧否也及見仙翁勃違前聞且嗇神胎元抱和含真默然道風煦然如春追柱稚色將數百歲光隂自駛寒暑不易爐鎚之間物無不化養之在我得之自然加以熊經鳥伸玄藏城府閉合默識孰窺崇墉當今勢位壓山河器業橫覆載皆靣嚮傾就誠屇乎辭度不知先儒誰談其無乎得食馬肝者豈為知味耶啚鬼神者易為工耶不復知總總化昭而已仙翁將去追遺雲縱茍非造物者不能以識裴度述僧孺云僧孺見仙翁兄深仰其為真人也僧孺讀史傳嘗病仙者能上升鄙見也斯不然僧孺聞胡國西胡法至其將歿之日必大會族黨州里衆其人齋其食人則飄飄而發地焉數百里外而墜窮谷中國中人咸謂曰化豫焉知非胡國之幻乎今兄不離世間而出世間浩蕩乎嗜欲之境蹂􅏳乎人情之圃三事五侯躬擁篲于門獲禮仙翁者為榮不獲禮為羞况雙眸炅然紅膚若花迅駭無羈踈步飄飄然豫安謂其非至人乎昔昌黎韓公侍郎掌國裴李二相府皆命世之大賢與兄文字不曰師則曰丈豫又焉測兄之壽耶嵇君著養生一篇以中才用心養其性命斯為勝矣腥者吾食諸稔者吾食諸􅉵於我者食諸又不測兄之立妙也至於煮錬金石妙至先覺若指乎掌不為能事賄利軒冕故無不明於心劉郎之骨非凡目所測大和三年秋九月偶拜遇兄於夏口眷豫塵俗授之玄記又約僧孺為道弟所訝真步超遙白雲無繫要他日為拜會之資僧孺抽毫以敘離恨題文曰别志且用契異時之語焉李翺云紫霄仙客下三山因救生靈到世間龜鶴計年承甲子氷霜為質駐童顔韜藏休咎傳真籙變化榮枯試小還從此更教塵骨貴九霄雲路願追攀令狐楚云宣州渾是上清宫客有真人貌似童紺髮垂纓光細髯緣頷緑葺葺壺中藥物梯霞訣肘後方書縮地功既許焚香為弟子願教年紀共椿同李程云茫茫塵纍愧腥膻強把蜉蝣望列仙間指紫霄峰下路却歸白鹿洞中天吹簫鳳去經何代茹玉得幾年他日更來人世看又應東海變桑田李玄閔云不知仙客占青春肌骨才教稱兩旬俗眼暫驚相見日疑心未測幾時人間推甲子經何代笑説浮生老此身殘藥儻能沾杇質願將霄漢永為憐韓愈云仙翁姓毛氏名于姬與韓為族愈末年為弟也相識於湖陽逆旅敘宗焉察其言不由乎孔聖道不由乎老莊教而以惠性知人爵祿厚薄壽命長短發言如駛駟囁嚅持疑於脣吻間即信乎異人也若古之許負輩不足言哉然兄言果有證期愈自與袁州從表州除國子祭酒後主兵部事續拜京兆尹又改吏部郎中若如言即掃廳屋候兄一日勸笑質亦不杇之名也酒酣留詞走筆而成不能采其文章之要也時元和十四年己亥四月十六日族弟門人韓愈序崔郾云存亡厺住一壺中兄事安期弟葛洪甲子已過千歲鶴儀容方稱十年童心靈暗合行人數藥力潛均造化功終待此身無繫纍武陵山下等黃公王起云氷霜肌骨稱童年羽駕何由到俗間丹竈化金留祕訣仙宫嗽玊叩玄關壺中世界青天近洞裏煙霞白日間若許隨師去塵網願陪鸞鶴向三山李益云玉潤溶上仙氣深含光混俗似無心長愁忽作鶴飛去一片孤雲何處尋鄭浣云至道無名至人長生爰觀繪事似挹真形方口渥丹濃眉刷青松姿本秀鶴質自輕道德神仙內藹心靈紅肌緑髮外彰華清色如含芳貌若和光胚渾造化吐納隂陽吾聞安期隱見不常或在世間或遊上蒼猗歟真人得非後身寫此仙骨久而不磷皎皎明眸瞭然如新藹藹童顔的然如春金石可並丹青不泯通天臺上有見常人俗士觀瞻方悟出塵君子圖之敬兮如神楊於陵云先生赤松侣混俗遊人間崑閬無窮路何時下故山千年猶孺質祕術救塵寰莫便沖天去雲雷不可攀楊嗣復云天上王郎騎白鶴肘後金壺成妙藥暫遊下界傲五侯重看當時舊城郭羽衣葺葺輕似雪雲上雙童持絳節王母親縫紫錦囊令向懷中藏祕訣令威子晉皆儔侣東嶽同尋太真女搜竒綴韻和陽春文章不是人間語藥成自固黃金骨天地齊兮身不歿日月宫中便是家下視崑崙何突兀童姿玉貌誰方比互髮緑髯先彌彌滿朝將相門弟子隨師盡願拋塵滓九轉琅玕必有餘願乞刀圭救生死元􅍬云余廉問浙東歲毛仙翁惠然來顧越之人士識之者相與言曰仙翁嘗與葉法善吳筠遊於稽山逮兹多歷年所而風貌愈少蓋神仙者也余因得執弟子之禮師其道焉余嘗見圓冠方領之士讀道書疑其絶聖智棄仁人謂斯書不足以經世理國殊不知至人無兼受智人又無災非大樂同天地之和大禮同天地之節其可臻乎上德宜乎大道之致華胥終北之化熙熙然也又以徐市文成之事謂方士之流誕妄於世不足以為教也殊不知洞山髙卧汾水凝神怡心傲世藐然物外至五侯不可得師友也若然則徐市之莠不足以害嘉穀文成之誕不足以停大教今我仙翁真風遺骨玄格高情冥鴻孤鶴不可方喻蓋洞山汾水之儔也一言上道合止于山亭三日而南棲天台謂余曰入相之年相候於安仁里余拜而言曰果如仙約燃香柫榻以俟雲駕焉杼詩一章以為他日之志也仙駕初從蓬䲧來相逢又説向天台一言親授希微訣三夕同傾沆瀣杯此日臨風飄羽衛他年嘉約落鹽梅花前揮手超遙去目斷霓旌不可陪沈傳師云安期何事出雲煙為把仙方與世傳只向人間稱百歲誰知洞裏過千年青牛到日迎方朔丹竈開時共稚川更説桃源更深處異花長古四時天崔元略云莫將凡聖比雲泥椿􅌲之年本不齊度世無勞大稻米升天只用半刀圭人間嗟對黃昏槿海上間聽碧落雞旌節行中令引道便從塵外蹈丹梯柳公綽云桃源千里逺花洞四時春中有含真客長為不死人松高枝葉荗鶴老羽毛新莫遣同籬槿朝榮暮化塵􅊨白居易云仙翁已得道混迹尋岩泉肌膚氷雪淨衣服雲霞鮮紺髮緑並緻齠容花共妍方瞳點玄漆高步凌非煙幾見桑田變莫知龜鶴年所憩九霄外所遊五嶽巔軒昊舊為侣松喬難比肩每嗟人世人役役如狂顛孰能脫羈鞅盡遭利名牽貌隨歲華換神逐光隂遷唯余負憂譴憔悴湓江壖衰鬢忽霜白愁腸如火煎羇旅坐多感徘徊私自憐晴眺五老峰玉洞多神仙何當憫湮厄授道安虛孱我師惠然來論道窮重玄浩蕩八溟濶志泰心超然形骸得無束得喪亦都捐豈識椿􅌲異鄉知鵬鷃玄丹華既相付促景定當延玄功曷可報感極唯擎拳霓旌不可駐又歸語罷倐然别孤鸖遙天賦詩敘明德永續步虛編李紳云憶惜我祖神仙主玄元皇帝周柱史曽師軒黃友堯湯混迹和光佐周武周之天子無仙氣成武康昭都瞥爾穆王粗識神仙事八極輪蹄方逞志鸖髮韜真世不知日月星辰幾回死金鼎作丹丹化碧三萬六千神入宅仙兄受術幾千年已是當時駕鴻客海光悠容天路逺春風玉女開宫苑紫筆親教書姓名玉皇詔刻青金簡桂窗一别三千春秦妃鏡裏娥眉新忽控香虬天上去海隅劫石霄花塵一從仙駕辭中土頑日昏風老無主九州事奪無時休八駿垂頭避豺虎我亦玄元千世孫眼穿望斷蒼煙根花白鳳竟冥寞飛春走月勞神昏百年命促奔馬疾愁腸盤結心摧崒今朝稽首拜仙兄願贈丹砂化秋骨劉禹鍚唐長慶元祀壬寅秋九月止鄂州官舍時風徑秋寒掩關無事月晦前三日有異客毛仙翁至禹錫攝袵見之晬容秀目精貌輝然初莫之測坐久語及裴相國晉公韓祭酒文公皆為方外之交嘗有述序今因請焉齋心拭目盡得披諷知仙翁之道非人間人也拜請延奮奉以師禮欣然見許止余所止凡七晝夜師之異者故不可窮其大榷裴韓二公具述矣不能復書其察人吉凶貴賤壽夭或假寐自生死雖百年之變窮通修短皆俊發利詞指陳毫釐無疑忌語堅意真聞之者失色則果然符契于意其神授乎其智知乎至於金火飛伏之道錬魂御氣之訣吾又莫得而窮之矣嗟乎禹鍚之生蹇厄以至羈沉遇師之目謂其有人爵之望可至人臣則鄙誠豈敢企望但師之道多隱晦人不能盡知况仁義惻憫時又甚焉真乎出世者也今將適桃花溪訪秦人追羽客臨風再拜謹志大略以備他日之約其年九月二十九日門人劉禹錫述禹錫時赴和州於武昌縣喜再遇十八兄仙翁因成絶句武昌山下蜀江東重向仙舟見葛洪又得案前親禮拜大羅仙訣玉函封張仲方云毛仙翁毛仙翁容貌常如二八童幾歲頭梳雲鬢緑無時靣帶桃花紅眼前人世閲滄海肘後藥成辭月宫方口繡眉編貝齒瞭然炅炅雙瞳子芝椿稟氣本堅強龜鸖計年應不死四海五山長獨遊矜貧傲富欺王侯靈通指下甎甓化瑞氣爐中金玉流定是煙霞列仙侣暫來塵俗救危苦紫霞妖女瓊華飛祕法處心傳附與隂功足隂功成羽駕何年歸上清待我休官了婚嫁桃源洞裏覔仙兄杜光庭云毛仙翁者名干字鴻漸得久視之道不知其甲子常如三十許人其齠容稚姿雪肌玄髮若處子焉周遊湖嶺間常以丹石攻疾隂功救物受其賜者不可勝紀大中戊寅歲進士張為薄遊長沙落魄數載以詩酒自得不汲汲於隨計一但值女奴於嶽麓山下若豪家之青衣焉奔而歸之張遽感焉歲餘寢成羸疾尪瘠骨立待時而已毛翁自海陵來泊于道族即張所止也請謁之者逡巡盈門皆曰尊師十年二十年一屇于市人仰其惠猶夏乏隂冬日之陽也蒙其澤者多矣顧見張愍之曰子妖氣邪光浹遍肌骨茍不相值殞於旦夕也吾有鮑南海丸可數百步張之魅妾長號一聲蹶然而斃因共視之即木偶人也心下至足肌肉如人心上至頂猶木偶之狀衆共異之棄于江中師曰此魅逝矣子之性命可全形骸可保也又以丹砂三粒其狀黍米命張吞之旬月之間肌豐力倍􅉵疾都瘳師忽告厺不言所之張遂為詩别焉其略云羸形感神藥削骨生豐肌蘭炷飄靈煙妖怪立誅夷重覩日月光何報父母慈黃河濁滚上别泪流澌上黃河清有時别泪無收期自是别去莫知所適江湘間至今以為口實張進士亦南入臺山訪道而去今覩朝彥贈仙翁文集果符長沙之事裴晉公度牛公僧孺令狐公楚李公程李公宗閔李公紳楊公嗣復楊公於陵王公起元公􅍬當代之賢相也白公居易崔公郾鄭都尉浣李公益張公仲方沈公傳師崔公元略劉公禹鍚柳公公綽韓公愈李公翺當代之名士也望藹寰區名動海島或師以奉之或兄以事之皆以師為上清品人也或美其登仙出世或紀其孺質嬰姿或異其藏往知來者或敘其液金水玉霞綺交爛組繡相宣蓋玄史之盛事也自元和泊太中戊子五十餘年容色不改信非常人矣竒章公獨以上升為疑者乃拘教守常未逹神仙之深旨矣夫仙之上者骨肉升飛與天無極又九天之上無何之鄉為極陽之都神仙之府也世之得道者煉隂而全陽隂滓都盡陽華獨存故能上賔于天與道冥合則黃帝駕龍而騰躍子喬控鶴而飛翔赤松乘雨而飄飄烈冦馭風而上下史簡昭著又何疑焉所云胡國胡法將終之事是設幻化之誣詞謗神仙之輕舉者有是焉耳嘗試論之真一既判元精肇分清氣為人謂之三才皆稟於妙無成於妙有人之生也參天而兩地與氣為一天地所以長存者無為也人所以生化者有為也情以動之智以役之是非以感之喜怒以戰之取捨以弊之馳騖以勞之氣耗於內神疲於外氣竭而形衰形凋而神遊以至於死矣故曰委和而生委順而死率以為常也修道之士黜嗜欲隳聰明凝然無心沈然無味收視反聽萬慮都冥然後虛室生曰吻合自然觀化之𥘉窮物之始浩然動息與道為一矣與道為一則恣心所之從心所欲是非不能亂勢利不能誘寒暑不能變生死不能
