  text: 唐詩紀事卷第十一
  hash: sha256:6431feb78b80517ac2cb3ca4952359417705d4666182f7fbf0dfc40fcf9b8c1c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_011-1a}
body:
  text: 韋嗣立趙彥伯閻朝隱鄭愔沈佺期宋之問徐堅盧懷慎武平一李行言韋元旦韋嗣立九日應制云層觀遠沉沉鑾旗九日臨帷宫壓水岸步輦入煙岑枝上茰新採樽中菊始斟願陪歡樂事長與嵗時深字得深嗣立在省閣與嶽州張使君說潭州王都督熊聮事後承朝譴各東西相别詩云茂先王佐才作牧楚江隈登樓正欲賦復遇仲宣來黃鵠飛將逺雕龍文為開寧知昔聮事聽曲有餘哀昔時陪二賢纓冕㑹神仙一去馳江海相逢共播遷無因千里駕忽覩四愁篇覽諷歡何已歡終徒愴然嗣立中宗時為大學士制云詞林佇秀學海資英茍非鴻儒孰副推擇守大府卿韋嗣立金籯襲慶玉鼎生才浴德澡身居中履孝保淳懿之道綜虛明之識前言往行獨運襟靈健筆通文孤標望實果升臺閣常典樞機誠亮險夷政敷匡益自出入中外周旋䆠遊夕郎歸其峻寵冬卿美其成務官曹內殿朝野旁求宜參右署之榮俾接金閨之彥可修文館大學士兄承慶長夀中與嗣立相代為鳯閣舍人長安三年承慶代嗣立為鳯閣侍郎頃之又代為黃門侍郎四職相代時謂大郎罷相二郎拜相中宗授嗣立黃門侍郎制曰芝蘭並秀見謝石之階庭騏驥並驅有劉山之昆季又曰近者命於鸞渚巳擢鴈行才出芝扃奄歸蒿里永言荆樹坐折連枝眷彼常山空餘一鳥俾遷榮於皂蓋宜襲寵於黃樞嗣立㽵在驪山鸚鵡谷中宗幸之嗣立獻食百輿及朩器藤盤等物上封為逍遙公谷為逍遙谷原為逍遙原中宗留詩從臣屬和嗣立並鐫于石請張說為之序薛稷書之李乂詩略云樞掖調梅暇林園種槿初入朝榮劒履退食樂琴書地隱東巗石天回北斗車旌門臨􅌄窱輦路屬扶踈沈佺期詩略云水堂開禹膳山閣獻堯鐘皇鑒清居逺天文睿奬濃武平一云三灮回斗極萬騎肅鈎陳地若遊汾水畋疑獵渭濵趙彥昭云廊廟心存巗壑中鑾輿矚在灞城東逍遙自有蒙莊子漢主徒言河上公張說序亦云嵐氣入野榛煙出谷魚潭竹岸松齊藥畹虹泉電射雲木虛吟恍惚疑夢間關忘術兹所謂丘壑道政龍衣冠巢許也開元中嗣立自湯井還都經其龍門北溪别業忽懷驪山之勝嘗有詩云幽谷杜陵邊風煙别幾年偶來伊水曲溪嶂覺依然傍浦憐芳木尋崕愛渌泉嶺雲隨馬足山鳥向人前地合心俱靜言因理自玄短才叨重寄尸祿愧妨賢每揖掛冠侣思從𥘉服旋稻粱仍欲報歲月坐空捐助嶽無纎芥輸溟謝末㳙還晤北轅失方兹南澗田時張說崔泰之崔日知在東都皆和焉先一日太平公主上官昭容題詩數篇故張說詩云舞鳯迎公主雕龍賦婕妤趙彥伯九日應制云九日報仙家三秋轉翠華呼鷹下鳥路戲馬出龍沙簮挂丹茰蘂杯涵紫菊花所願同微物年年共辟邪字得花張亶來自朔方軍中宗迓之宴于桃花園應制曰紅萼競燃春苑曙芊茸新色御筵開長年願奉西王宴近侍慙無東朔才彥伯為洪文館學士閻朝隱送金城公主生舅重親地君臣厚義鄉還將貴公主嫁與褥檀王鹵簿山川闊胡琴道路長回贍父母國日出在東方人日大明宫應制云句芒人靣乘兩龍道是春神衛九重綵勝年年逢七日酴䕷嵗嵗滿千鍾宫梅間雪祥光遍城柳含煙瑞氣濃醉倒君前情未盡願因歌舞自為容宴安樂公主新宅云鳯凰鳴舞樂昌年蠟燭開花夜管絃半醉徐擊珊瑚樹巳聞鐘漏曉聲傳鸚鵡猫兒云鸚鵡惠鳥也猫不仁獸也飛翔其背焉嚙啄其頤焉攀之緣之蹈之履之弄之藉之蹌蹌然此為自得彼亦以為自得畏者無所起其畏忍者無所行其忍抑血屬舊故之不若臣叨踐太子舍人朝暮侍從預見其事聖上方以禮樂文章為功業朝野歡娛强梁充斥之輩願為臣妾稽顙闕下者日萬計尋而天下一統實以為惠可以伏不惠仁可以伏不仁亦太平非常之明證事恐久遠風雅所缺再拜稽首為之篇霹靂引豐隆鳴猛獸噫氣蛇吼聲鸚鵡鳥同資造化兮殊粹精鷫鸘毛翡翠翼鵷雛延頸鵾雞弄色鸚鵡鳥同禀隂陽兮異埏埴彼何為兮隱隱振振此何為兮緑衣翠襟彼何為兮窘窘蠢蠢此何為兮好㒵好音倣倣兮佯佯似妖姬屣步兮動羅裳趍趍兮蹌蹌若處子回眸兮登玉堂爰有獸也安其獸也其忍觜其脅距其胸與之放曠浪浪兮從從容容鈎瓜踞牙也霄行晝伏無以當遇之兮忘味搏擊騰擲也朝飛暮噪無以拒逢之兮屏氣由是言之貪殘薄則智惠作貪殘臨之兮不復躍由是言之智惠周則貪殘囚智惠犯之兮不復憂菲形陋質雖賤微皇王顧遇長光輝離宫别館臨朝市妙舞繁絃雜宫徵嘉喜堂前景福內和歡殿土明光裏雲母屏風文彩合流蘇斗帳香煙起承恩宴盻接宴喜髙視七頭金駱駝平懷五尺銅師子國有君兮國有臣君為主兮臣為賔朝有賢兮朝有德賢為君兮德為飾千年萬歲兮心轉憶九日應制云九九侍神仙髙髙坐半天文章二曜動氣色五星連簮紱趨皇極笙歌接御筵願因吹菊酒相守百千年字得筵中宗立春遊苑應制云管籥周移寰極裏乘輿望幸斗城闉草根未結青絲縷蘿蔦揂垂緑帔巾鵲入巢中言改歲燕銜書上道冝新願得長繩繫取日光臨天子萬年春送唐永昌赴東都詩曰洛陽難理若棼絲推破連環定不疑鸚鵡鳥道長安樂回首一顧一相思授著作郎直學士制云朝隱夜光成寶朝陽擢秀文高一變藝㧾三端承顧問於鸞掖賞圖書於麟府頃屬播遷獲返班序方來石室分曹已參於著述金門直事俾崇於伸奬可修文館直學士朝隱字友倩趙州欒城人性滑稽屬辭竒詭為武后所賞景龍時為著作郎先天中為祕書少監坐事貶通州别駕卒鄭愔上幸薦福寺令賦詩云舊邸三乘闢佳辰萬騎留攔圖奉葉偈芝蓋拂花樓國㑹人王法宫還天帝逰紫雲成寶界白水作禪流鴈塔昌基逺鸚杯睿藻抽欣承大風曲竊預小童謳三㑹寺應制詩云鳥籕遺新閣龍旗訪古臺造書臣頡往觀跡帝羲來睿覽山川匝宸心宇宙該𣑽音隨駐輦天步接乘杯舊苑經寒露殘池問劫灰散花將捧日俱喜聖詞開陪幸昭容院獻詩四首地軸樓居逺天台闕路賖何如遊帝宅即此對仙家拂座金壺電池搖玉酒霞無云秦漢隔别訪武陵花堯詞姑射近漢苑建章連十五蓂知月三千桃幾年鶯歌隨鳯吹鸖舞向鵾絃更覔瓊妃伴來過玉女泉宫掖賢才重山林髙士難不言辭輦地更有結廬歡池棟清溫燠巗窗起泫寒幽亭有仙桂聖主萬春看槎流天上轉茅宇禁中開河鵲填橋至山熊避檻來庭花採菉蓐巗石步莓苔願奉蘿圖泰長聞錦翰裁陪幸長寧公主莊云公門襲漢環主第稱秦玉池架祥鱣宇山吹鳴鳯曲拂席薜蘿垂回舟芰荷觸平陽妙舞處日暮清歌續望春宫迎春應制云晨蹕凌髙轉翠旌春樓望逺背朱城忽排花上遊天苑却坐雲邊看帝京百草香心初罥蝶干林嫩葉始藏鶯幸同微藿傾誠早願比盤相應候榮送金城公主云下嫁戎庭逺和親漢禮優笳聲出虜塞簫曲比秦樓貴主悲黃鸖征人怨紫騮皇情眷億兆割念俯懷柔早朝云瑞闕龍居峻宸庭鳯掖深才良寄天綍趍拜侣朝簪飛鳥看來影喧車識駐音重軒輕霧入洞户落花侵聞有題新翰依然想舊林同聲慙卞玉謬比託韋金寒外三篇塞外蕭條望征人北路賖邊聲亂朔馬秋色引胡笳遙鄣侵歸日長城帶晚霞斷蓬飛古戊連鴈聚寒沙海暗雲無葉山春雪作花丈夫期報主萬里獨辭家荒壘三秋夕窮郊萬里平海隂凝獨樹日氣下連營戎斾霜疑重邉裘夜更輕將軍猶轉戰都尉不成名折柳悲春曲吹笳斷夜聲明年漢使返須築受降城陽鳥南飛夜隂山北地寒漢家征戍客年歲在樓蘭玉關朔風起金河秋月團邊聲入鼓吹霜氣下旌干海外歸書斷天涯旅鬢殘子卿猶奉使常向節旌看愔字文靖年十七進士擢第神龍中為中書舍人與崔日用趙履溫李􅞥等託武三思權熏炙中外天下語曰崔冉鄭亂時政雍也冉祖或曰初附來俊臣俊臣誅附易之易之誅託韋庶人後附譙王卒被戮人日侍宴大明宫云瓊殿含光映早輪玉鑾𥘉蹕望初晨池開凍水仙宫麗樹發寒花禁苑新佳氣徘徊籠細網殘霙淅瀝染輕塵良時荷澤皆迎勝窮谷稀陽猶未春哭郎著作云詩禮康成學文章賈誼才已年人得夢庚日鳥為灾書草藏天閣琴聲入夜臺荒階羅駁蘚雲座滿塵埃白馬賔從散青烏隴隧開悲凉門館下懷舊幾遲回秋閨詩云征客向輪臺幽閨寂不開音書秋鴈斷機杼夜蛩催虛愰風吹葉間階露染苔自憐愁思影常共月徘徊唐永徽以來唱桑條歌云桑條韋也女韋也神龍時逆韋應之愔作枽條樂詞十首以進擢吏侍愔樂府採蓮曲云錦楫沙棠艦羅帶石榴裙緑潭採荷芰清香日稍曛魚鳥爭唼喋花葉相芬氲不覺湘州暮菱歌處處聞胡笳曲云漢將留邊朔遙遙嵗序深誰堪牧馬思正是胡笳吟曲斷江山月聲悲雨雪隂傳書向蘇武陵也獨何心折楊柳云青柳映紅顔黃雲蔽紫關忽聞邊使出枝葉為君攀舞腰愁欲斷春心望不還風花衮成雪羅綺亂班班夜遊曲云漢室歡娛盛魏國文雅遒許史多暮宿應陳從夜逰西園燕公子北里召王侯詎似將軍獵空嗟亭尉留年少行云頴川豪橫客咸陽輕薄兒田竇方貴幸趙李新相知軒蓋終朝集笙竽此夜吹黃金盈篋笥白日忽西馳沈佺期幸太平公主南莊詩云主第山門起灞川宸遊風景入初年鳳凰樓下交天仗烏鵲橋頭敞御筵往往花間逢綵石時時竹裏見虹泉今朝扈蹕平陽館不羡乘槎雲漢邊九日臨渭亭云御氣幸金方慿髙薦羽觴魏文班菊蘂漢武賜茰房秋美銅池色晴添銀樹光年年重九慶日月奉天長陪幸韋嗣立㽵云台階好赤松别業對青峰茆室承三顧花源接九重虹旗縈秀木鳯輦拂踈笻徑直千官擁溪長萬騎容水堂開禹膳山閣獻堯鐘皇鑑清居逺天文睿奬濃巗泉他夕夢漁釣往年逢共榮丞相府偏降逸人封白鹿觀應制云紫鳯真人府班龍太上家天流芝蓋下山轉桂旌斜聖藻垂寒露仙杯落晚霞唯應問王母桃作幾時花上已陪駕渭濱云寶馬香車清渭濱紅桃碧柳禊堂春皇情尚隱垂竿佐天瑞先呈捧劒人陪幸五王宅云北闕垂旒暇南宫聽履回天臨翔鳯轉恩向濯龍開蘭氣承仙帳榴花引御杯日從金穴吐雲是玉衣來池影搖歌席林香散舞臺不知行漏晚清蹕尚徘徊安樂公主㽵云皇家貴主學神仙别業𥘉開雲漢邊山出盡如鳴鳳嶺池成不讓飲龍川粧樓翠幌教春住舞閣金鋪借日懸景從乘輿來此地稱觴獻夀樂鈞天人日大明宫應制云拂旦雞鳴仙衛陳慿髙龍首帝庭春千宫黼帳杯前夀百福香奩勝裏人山鳥𥘉來猶怯囀林花未發已偷新天文正應韶光轉設報懸知用此辰望春宫迎春應制云芳郊緑野散春晴復道離宫煙霧生楊柳千條花欲綻蒲桃百丈蔓𥘉縈林香酒氣元相入鳥囀歌聲各自成定是風灮牽宿醉來晨復得幸昆明晦日滻水應制云素滻接宸居青門盛祓除摘蘭喧鳳野浮棗溢龍渠苑蝶飛殊懶宫鶯囀不踈景移天上入歌舞向儲胥送金城公主云金榜扶丹掖銀河屬紫閽那堪將鳳女還似嫁烏孫玉就歌中怨珠辭掌上恩西戎非我匹明主為公存餞唐永昌云洛陽舊有神明宰輦轂田來天地中餘邑政成何足貴因君取則四方同早朝云閶闔連雲起巗廊拂霧開玉珂龍影度珠履鴈行來長樂霄鐘盡明光曉奏催一經推舊德五字擢英才儼若神仙去紛從霄漢回千春奉休歷分禁喜趨陪曝衣篇云君不見昔日冝春太液邊披香畫閣與天連登華灼爍九微映香氣氛氲百和燃此夜星繁河正白人傳織女牽牛客宫中擾擾曝衣樓天上娥娥紅粉席曝衣何許矄半黃宫中梁絳河裏碧煙上雙花伏兔畫屏風四子盤龍擎斗帳舒羅散縠雲霧開綴玉垂珠星漢回朝霞散綵羞衣架曉月分光劣鏡臺上有仙人長命錦中有玉女迎歡繡玳瑁筵中别作春珊瑚窗裏翻成晝椒房金屋寵新流意氣嬌奢不自由漢文冝惜露臺産晉武須燒前殿裘脫字中間疑有九日應制云御氣幸金方慿高薦羽觴魏文頒菊𦵔蘂漢武賜茰房去鸖留歌吹歸鴻識舞行臣歡重九慶日月奉天長字得長和晦日駕幸昆明池云法駕乘春轉神池象漢回雙星移舊石孤月隱殘灰戰鷁逢時去恩魚望幸來岸花緹騎繞堤栁幔城開思逸橫汾唱歡流宴鎬杯微臣凋杇質羞覩䂊章材白鹿觀應制云四郊秦漢國八水帝王都閭閻雄理閈宫闕壯規模貫渭稱天邑含歧實奧區金門披玉館因此識皇圖主第夜宴云濯龍門外主家親鳴鳯樓中天上人自有金杯迎甲夜還將綺席發陽春張燕公說嘗謂佺期曰沈三兄詩須還他第一佺期字雲卿相州人除給事中考功郎受贓劾未究㑹張易之敗遂長流歡州稍遷台州録事參軍入計召見拜起居郎兼修文直學士侍宴為弄辭恱帝賜牙緋尋為太子詹事開元初卒時佺期流向嶺外生歸身佺期回波樂詞云回波爾笏未復牙緋名已䝉齒録袍魏建安後訖江左詩律屢變至沈約庾信以音韻相婉附屬對精密及之問沈佺期又加靡麗回忌聲病約句凖篇如錦繡成文學者宗之號為沈宋語曰蘇李居前沈宋比肩謂蘇武李陵也酬蘇味道夏晚省中云並命登仙閣分霄直禮闈大官供宿膳侍史護朝衣卷幔天河入開窗月露微小池殘暑退髙樹早凉歸冠劒無時釋軒車待漏飛明朝題漢柱三署有光輝和楊再思春夜宿直云西禁青春滿南端皓月微千廬霄駕合五夜曉鐘晞星斗橫綸閣天河渡瑣闈煙花章奏裏紛向夕郎飛和崔正諫登秋日早朝云雞鳴朝謁滿露白禁門秋爽氣臨旌㦸朝光映冕旒河宗來獻寶天子命焚裘獨負津陽議言從逮禮遊巫山髙云巫山髙不極合沓竒狀新暗谷疑風雨隂崕若鬼神月明三峽曙潮滿九江春為問陽臺客應知入夢人此詩范攄以為佺期之作而顧陶以為張循今記於此宋之問芙蓉園應制云芙蓉秦地沼盧橘漢家園谷轉斜盤徑江回曲抱源風來花自舞春入鳥能言侍宴瑶池夕歸途笳吹繁三㑹寺應制云六飛回玉輦雙樹謁金仙瑞鳥呈真字神龍吐浴泉淨心遙證果睿想獨超禪塔踴香花地山圍日月天𣑽音迎雨徹空樂倚雲懸今日登仁夀長看法鏡圓薦福寺應制云𣑽筵光聖邸遊䂊覽宏規不改靈光殿因開功德池蓮生新步葉桂長昔攀枝踴塔夜中見飛樓海上移聞韶三月幸觀象七星危欲識龍歸處朝來雲氣隨陪遊苑遇雪云紫禁仙輿詰旦來青旗遙倚望春臺不知庭霰今朝落疑是林花昨夜開餞許州宋司馬云頴郡水東流荀陳兄弟遊偏傷兹日逺獨向聚星州河潤在明德人康非外求當聞力為政遙慰我心愁謁禹廟云夏王乘四載兹地發金符駿命終不易報功疇敢渝先驅惣昌㑹後至伏靈誅玉帛空天下衣冠照海隅旋聞厭黃屋更道出蒼梧林表詞轉茂山阿井詎枯舟遷龍負壑田變鳥藝蕪舊物森如在天威肅未殊玄夷届瑶席玉女侍青都奕奕扃闈邃軒軒文衛趨氣青連曙海雲白洗春湖猿嘯有時合禽言長自呼靈歆異蒸糈至樂匪笙竽茅殿今文襲梅梁古製無運遙日崇麗業盛答昭蘇伊昔力云盡而今功尚敷揆才非美箭精享愧生芻郡職昧為美邦空寧自誣下車霰已積攝事露行濡人隱冀多祐曷惟霑薄驅詠海云肅事祠春溟宵齊洗䝉慮雞鳴見日出鷺下觀濤鶩地闊八荒近天回百川澍筵端濟空曲目外唯氛霧暖氣物象來周遊晦明互致腥匪玄享䄄滌期靈煦的的波際禽泫泫島間樹安期今何在方丈蔑尋路仙事與世隔冥搜徒巳屢四明背群山遺老莫辨處內撫良自慨弱齡忝恩遇三入文史林兩拜神仙署雖歎出關逺始知臨海趣賞來空自多理勝孰能喻留楫竟何時待徙倚歲云暮浣紗篇贈陸上人云越女顔如花越王聞浣沙國微不自寵獻作吳宫娃山藪半濳匿苧羅更蒙遮一行霸勾踐再笑傾夫羌艷色奪人目效嚬亦相誇一朝還舊都靚粧尋若耶林鳥驚入松網魚畏沈花始覺冶容妄方悟君心邪欽子秉幽意世人共稱嗟願言託君懷儻類蓬生麻家住雷門曲閣髙陵飛霞淋漓翠羽帳旖旎緑雲車奉風艷楚舞秋月綿胡笳自昔専嬌愛玩襲惟矜奢逹本知空寂棄彼猶泥沙永割偏執性自長薰修牙携妾不障道願止妾西家中宗幸薦福寺獻詩云香剎中天起宸逰滿路輝乘龍太子去駕象法王歸殿飾金人影窗搖玉女扉稍迷新草木遍識舊庭闈水入禪心定雲從寶思飛欲知星劫逺𥘉拂六銖衣立春日侍宴內殿出剪綵花詩云金閣裝新店瓊筵弄綺梅人間都未識天上忽先開蝶繞香絲住蜂憐艷粉回今年春色早應為剪刀催陪幸公主南㽵詩云青門路接鳯凰臺素滻宸遊龍騎來澗草自迎香輦合巗花應對御筵開文移北斗成天象酒近南山作夀杯此日侍臣將石去共歡明主錫金回及此作都為冠之問薦福寺昆明河篇云八月凉風天氣晶萬里無雲河漢明昏見南樓清且淺曉落西山縱復橫洛陽城闕天中起長河夜夜千門裏復道連甍共蔽虧畫堂瓊户特相冝雲母帳前𥘉㲹濫水精簾外轉逶迤倬彼昭回如練白復出東城接南陌南陌征人去不歸誰家今夜搗寒衣鴛鴦機上踈螢度烏鵲橋邊一鴈飛鴈飛螢度愁難歇坐見明河漸微沒巳能舒卷任浮雲不惜光輝讓流月明河可望不可親願得乘槎一問津更將織女支機石還訪成都賣卜人蓋之問求為北門學士天后不許故此篇有乘槎訪卜之語后見其詩謂崔融曰吾非不知其才但以其有口過爾之問終身耻之齒疾口過武后遊龍門命群官賦詩先成者賜以錦袍左史東方虬詩成拜賜坐未安之問詩後成文理兼美左右莫不稱善乃就奪錦袍衣之其詞曰宿雨霽氛埃流雲度城闕河湜柳新翠苑樹花𥘉發洛陽花柳此時濃山水樓臺映幾重羣公拂霧朝翔鳯天子乘春幸鑿龍龍門近出王城外羽從淋漓擁軒蓋雲蹕才臨御水橋天衣已入香山㑹山壁嶄巗斷復連清流澄徹俯伊川塔影遙遙緑波上星龕奕奕翠微邊層巒舊長千尋木春壑𥘉飛百丈泉綵仗霓旌繞香閣下輦登髙望河洛東城宫闕擬昭回南陌溝塍殊綺錯林下天香七寶臺山中春酒萬年杯微風一起祥花落仙樂𥘉鳴瑞鳥來鳥來花落紛無已稱觴獻夀煙霞裏歌舞淹留景欲斜石間猶駐五雲車鳥旗翼翼留芳草龍騎駸駸映晚花千乘萬騎鑾輿出水靜山空嚴警蹕郊外喧喧引看人傾城南望屬車塵嚻聲引揚聞黃道王氣周回入紫宸先王定鼎三河固寶命乘周萬物新吾皇不事瑶池樂時雨來觀農扈春詠省壁畫鸖詩云粉壁圖仙鸖昻藏真氣多騫飛竟不去當是戀恩波韋善心為郎中善剖决之問善詩時謂户部二妙之問字延清汾州人與佺期允濟媚附易之及敗貶瀧州參軍事逃歸復附三思景龍中諂事太平公主安樂公主權盛復往諧結太平深嫉之中宗將用為中書舍人太平發其贓下遷越州長史賦詩流傳京師睿宗立以獪險盈惡詔流欽州賜死徐堅送金城公主云星漢下天孫車服降殊藩匣中詞易切馬上曲虛繁關塞移朱帳風塵照錦軒簫聲去日遠萬里望河源餞許州宋司馬云舊許星車轉神京祖帳開斷煙傷别望零雨送離杯辭燕依空繞賔鴻入聽哀分携與秋氣日夕共徘徊餞唐永昌赴任東都云郎官出宰赴伊瀍征轉駸駸灞水前此時長望新豐道携手相看共黯然餞考功武員外學士使嵩山置舍利塔歌云伊川别騎灞岸分筵對三春之花月覽千里之風煙望青山兮分地見白雲兮在天寄愁心於樽酒愴離緒於清絃共握手而相顧各㗸悽而黯然宗時作巳上中堅字元固西臺舍人齊𣆀之子屬文典厚楊再思每日為鳳閣舍人樣中宗時為給事中明皇改麗正書院為集賢院以堅充學士不為章句之學而窮覽治聞綿歷四朝以謹厚稱送張說巡邊應制云至德撫遐荒神兵赴朔方帝思元帥重爰釋股肱良纍相承開池深籌協子房寄崇専斧鉞禮備設壇場􅎏鼓喧雷電戈劒凛風霜四騏將戒道十乘啓先行聖錫加常錫天光曜寵光出郊開帳飲寅餞盛離章雨濯梅林潤風秋麥野凉燕山應勒頌麟閣佇名楊開池字疑堅卒張說挽歌云才美臨淄北名髙淮海東羽儀三省遍漁獵五車通玉殿孤新榜珠英落舊叢徒存一寶劒何處訪徐公盧懷慎九日應制云時和素秋節宸豫紫機間鸖似聞琴至人疑宴鎬還曠望對平野潺湲俯暝灣無因酬大德空此愧崇班字得還懷慎靈昌人開元初與姚崇同相時譏為伴食然能清儉以直道始終武平一駕幸溫泉詩云秦王登竭石周后襲昆崘何必在遐逺方稱萬㝢尊我皇順時豫星駕動軒轅雄騎交馳道清笳度國門回輿長樂觀校獵上林園行漏移三象連營惣八屯旌搖鸚鵡谷騎轉鳯凰原絶壁蒼苔古靈泉碧溜溫參差開水殿􅌄窱敞巗垣豐邑蹤猶在驪宫跡尚存煙松銜翠幄雪徑繞花源侍從推玄草文章召武賁深仁浹夷夏洪造溢乾坤謬忝王枚列多慙雨露恩景龍四年正旦賦柏樹詩云緑葉迎春緑寒枝歷嵗寒願將百葉夀長奉萬年歡興慶池云鑾輿羽駕直城隈帳殿旌門此地開皎潔靈潭圖日月參差畫舸結樓臺波搖岸影隨橈轉風送荷香逐酒來願奉皇歡常不極長逰雲漢幾昭回白鹿觀應制云玉府凌二曜金壇駐六龍緑旒懸倒景羽蓋偃喬松玄圃靈芝秀華池瑞液濃謬因霑舜渥長願奉堯封送金城公主云廣化三邊靜通姻四海安還將膝下愛特副域中歡聖念飛玄藻仙儀下白蘭日斜征蓋沒歸騎動鳴鸞宴安樂公主新宅云王孫帝女下仙臺金榜珠簾日夜開遽惜瓊筵歡正洽唯愁銀箭曉相催餞唐永昌云聞君墨綬出丹墀䨥舄飛來佇有期寄謝銅街攀柳日無忘粉署握蘭時正月八日立春內出綵花賜近臣應制云鑾輅青旗下帝臺東郊上苑望春來黃鶯未解林間囀紅蘂先從殿裏開畫閣條風初變柳銀塘曲水半含苔斦逢睿藻先韶律更促霞觴畏景催是日中宗手勑批云平一年雖最少文甚警新恱紅蘂之先開訝黃鶯之未囀循環吟咀賞歎兼懷今更賜花一枝以彰其美所賜學士花並令插在頭上後所賜者平一左右交插因舞蹈拜謝時崔日用乘酣飲欲奪平一所賜花上於簾下見之謂平一曰日用何為奪卿花平一跪奏曰讀書萬卷從日用滿口虛張賜花一枝學平一終身不獲上及侍臣大笑因更賜酒一杯當時嘆美中宗宴安樂公主新宅應制云紫漢秦樓敞黃山魯館開簪裙分上席歌舞列平臺馬既如龍至人疑學鳳來幸欣聮棣萼何以接鄒枚人日西臺觀打毬應制云令節重遨遊分鏕戲綵毬驂驔回上苑躞蹀繞通溝影就紅塵沒光隨赭汗流賞闌清景暮歌舞樂時休平一名甄以字行武后時畏禍隱嵩山中宗雖宴豫嘗因詩規誡然不能卓然自引去明皇時終亦彼謫雖謫而名不衰李行言秋晚度廢關云秦郊平舊險周德眷遺黎始聞清夜柳俄見落風泥物色來無限津途去不迷空亭誰問馬間戍但鳴雞山月寒彌淨河風曉更凄贈言楊伯起非復是關西景龍中中宗引近臣宴集令各獻伎為樂張錫為談客娘舞宗晉卿舞渾脫張洽舞黃麞杜元琰誦婆羅門呪行言唱駕車西河盧藏用效道士上章國子司業郭山輝請誦古詩兩篇誦鹿鳴蟋蟀未畢李嶠以詩有好樂無荒之語止之行言隴西人兼文學幹事函谷關詩為時所許中宗時為給事中能唱步虛歌帝七月七日御兩儀殿㑹宴帝命為之行言於御前長跪作三洞道士音詞歌數曲貌偉聲暢上頻嘆美韋元旦正月七日宴大明殿詩云鸞鳯旌旗拂曉陳魚龍角觗大明辰青韶既肇人為日綺勝𥘉成日作人聖藻凌雲裁柏賦仙歌從宴摘梅春垂旒一慶冝年酒朝野俱歡薦夀新安樂公主山庒云銀河南渚帝城隅帝輦平明出九衢刻鳳蟠螭陵桂邸穿池疊石寫蓬壺瓊簫暫下鈞天樂綺綴長懸明月珠仙榜承恩爭既醉方知朝野更歡娛望春宫迎春應制云九重樓閣半山霞四望韶陽春未賖侍蹕妍歌遊灞涘留觴罷舞出京華危萍競捧中街日戲馬爭銜上苑花景色歡娛長若此承恩不醉不還家送金城公主云柔逺安夷俗和親重漢年軍容旌節送國命錦車傳琴曲悲千里簫聲戀九天唯應西漢月來就掌珠圓餞唐州髙使君云桐柏膺新命芝蘭惜舊逰鳴臯夜鸖在遷木早鶯求傳擁淮源路樽空灞水流落花分送逺春色别離憂早朝云霞維芳月季宸極衆星尊佩玉朝三陛鳴珂過九門挈壺分早漏伏檻耀初暾北倚蒼龍闕西臨紫鳯垣詞庭草雖視溫室樹無言鱗翰空為忝長懷聖主恩中宗立春遊苑應制云灞涘長安常近日殷正臘月早迎新池魚戲葉仍含凍宫女裁花巳作春向苑雲疑承翠帷入林風若起青蘋年年斗柄東無限願把瓊觴夀北辰中宗時興慶池侍宴應制云滄池漭沆帝城邊殊勝昆明鑿漢年夾岸旌旗疏逺道中塘簫鼓振樓船雲峰四起迎宸幄寶樹千重入御筵宴樂已深魚鳥詠承恩更欲奏甘泉主第夜宴云主第新成銀作榜賔筵廣宴玉為樓壺觴既卜仙人夜歌舞疑停織女秋元旦京兆萬年人與張易之姻屬易之罷貶感義尉舅陸頌妻韋后弟也元旦慿以復進終中書舍人唐詩紀事卷第十一
