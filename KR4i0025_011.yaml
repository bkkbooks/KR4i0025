天衣已入香山㑹山壁嶄巗㫁復連清流澄澈俯伊川塔影遥遥緑波上星龕奕奕翠微邊層巒舊長千尋木春壑𥘉飛百丈泉綵仗蜺旌遶香閣下輦登髙望河洛東城宫闕擬昭回南陌溝塍殊綺錯林下天香七寳臺山中春酒萬年盃微風一起祥花落仙樂𥘉鳴瑞鳥來鳥來花落紛無已稱觴獻夀煙霞裏歌舞淹留景欲斜石間猶駐五雲車鳥旗翼翼留芳草龍騎駸駸映晩花千乗萬騎鑾輿出水静山空嚴警蹕郊外喧喧引㸔人傾城南望属車塵嚻聲引颺聞黄道王氣周廻入紫宸先王定鼎三河固寳命乗周萬物新吾皇不事瑶池樂時雨來觀農扈春詠省壁畫鸖詩云粉壁圖仙鸖昻藏真氣多騫飛竟不去當是戀恩波韋善心為郎中善剖决之問善詩時謂户部二妙之問字延清汾州人與佺期允濟媚附易之及敗貶瀧州參軍事逃歸復附三思景龍中謟事太平公主安樂公主權盛復徃諧結太平深嫉之中宗將用為中書舍人太平發其贓下遷越州長史賦詩流傳京師睿宗立以獪險盈惡詔流欽州賜死徐堅送金城公主云星漢下天孫車服降殊藩匣中詞易切馬上曲虚繁闗塞移朱帳風塵照錦軒簫聲去日遠萬里望河源餞許州宋司馬云舊許星車轉神京祖帳開㫁煙傷别望零雨送離盃辭鷰依空遶賔鴻入聽哀分携與秋氣日夕共徘徊餞唐永昌赴任東都云郎官出宰赴伊瀍征轉駸駸㶚水前此時長望新豐道携手相看共黯然餞考功武員外學士使嵩山置舍利塔謌云伊川别騎㶚㟁分筵對三春之花月覽千里之風煙望青山兮分地見白雲兮在天寄愁心於樽酒愴離緒於清絃共握手而相顧各㗸悽而黯然宗時作巳上中堅字元固西臺舍人齊𣆀之子属文典厚楊再思每日為鳳閣舍人様中宗時為給事中明皇改麗正書院為集賢院以堅充學士不為章句之學而窮覽治聞綿歴四朝以謹厚稱送張說廵邊應制云至徳撫遐荒神兵赴朔方帝思元帥重爰釋股肱良累相承開池深籌協子房寄崇専斧鉞禮俻設壇塲􅎏皷喧雷電戈劒凛風霜四騏將戒道十乗啓先行聖錫加常錫天光曜寵光出郊開帳飲寅餞盛離章雨濯梅林潤風秋麥野凉燕山應勒頌麟閣佇名楊開池字疑堅卒張說挽歌云才美臨淄北名髙淮海東羽儀三省遍漁獵五車通玉殿孤新榜珠英落舊叢徒存一寳劒何處訪徐公盧懷慎九日應制云時和素秋節宸豫紫機閑鸖似聞琴至人疑宴鎬還曠望對平野潺湲俯暝灣無因酬大徳空此媿崇班字得還懷慎靈昌人開元初與姚崇同相時譏為伴食然能清儉以直道始終武平一駕幸温泉詩云秦王登竭石周后襲崐崘何必在遐逺方稱萬㝢尊我皇順時豫星駕動軒轅雄騎交馳道清笳度國門廻輿長樂觀校獵上林園行漏移三象連營惣八屯旌揺鸚鵡谷騎轉鳯凰原絶壁蒼苔古靈泉碧溜温參差開水殿􅌄窱敞巗垣豐邑蹤猶在驪宫跡尚存煙松衘翠幄雪逕遶花源侍從推玄草文章召武賁深仁浹夷夏洪造溢乾坤謬忝王枚列多慙雨露恩景龍四年正旦賦栢樹詩云緑葉迎春緑寒枝歴嵗寒願将百葉夀長奉萬年歡興慶池云鑾輿羽駕直城隈帳殿旌門此地開皎潔靈潭圖日月參差畫舸結樓臺波揺㟁影隨橈轉風送荷香逐酒來願奉皇懽常不極長逰雲漢幾昭回白鹿觀應制云玉府凌二曜金壇駐六龍緑旒懸倒景羽葢偃喬松玄圃靈芝秀華池瑞液濃謬因霑舜渥長願奉堯封送金城公主云廣化三邊静通姻四海安還将膝下愛特副域中歡聖念飛玄藻仙儀下白蘭日斜征蓋没歸騎動鳴鸞宴安樂公主新宅云王孫帝女下仙臺金牓珠簾日夜開遽惜瓊筵懽正洽唯愁銀箭曉相催餞唐永昌云聞君墨綬出丹墀䨥舄飛來佇有期寄謝銅街攀柳日無忘粉署握蘭時正月八日立春内出綵花賜近臣應制云鑾輅青旂下帝臺東郊上苑望春來黃鶯未觧林間囀紅蘂先從殿裏開畫閣條風初變柳銀塘曲水半含苔斦逢睿藻先韶律更促霞觴畏景催是日中宗手勑批云平一年雖㝡少文甚警新恱紅蘂之先開訝黃鶯之未囀循環吟咀賞歎兼懷今更賜花一枝以彰其美所賜學士花並令挿在頭上後所賜者平一左右交挿因舞蹈拜謝時崔日用乗酣飲欲奪平一所賜花上於簾下見之謂平一曰日用何爲奪卿花平一跪奏曰讀書萬卷從日用滿口虚張賜花一枝學平一終身不獲上及侍臣大笑因更賜酒一盃當時嘆美中宗宴安樂公主新宅應制云紫漢秦樓敞黃山魯館開簪裙分上席歌舞列平臺馬既如龍至人疑學鳳來幸忻聮棣萼何以接鄒枚人日西臺觀打毬應制云令節重遨遊分鏕戲綵毬驂驔廻上苑躞蹀繞通溝影就紅塵沒光隨赭汗流賞闌清景暮歌舞樂時休平一名甄以字行武后時畏禍隱嵩山中宗雖宴豫嘗因詩規誡然不能卓然自引去明皇時終亦彼謫雖謫而名不衰李行言秋晩度廢關云秦郊平舊險周德眷遺黎始聞清夜柳俄見落風泥物色來無限津途去不迷空亭誰問馬閑戍但鳴鷄山月寒彌浄河風曉更凄贈言楊伯起非復是關西景龍中中宗引近臣宴集令各獻伎爲樂張錫爲談客娘舞宗晉卿舞渾脫張洽舞黄麞杜元琰誦婆羅門呪行言唱駕車西河盧藏用効道士上章國子司業郭山煇請誦古詩兩篇誦鹿鳴蟋蟀未畢李嶠以詩有好樂無荒之語止之行言隴西人兼文學幹事函谷闗詩為時所許中宗時為給事中能唱歩虛歌帝七月七日御兩儀殿㑹宴帝命為之行言於御前長跪作三洞道士音詞歌數曲皃偉聲暢上頻嘆美韋元旦正月七日宴大明殿詩云鸞鳯旌旂拂曉陳魚龍角觗大明辰青韶既肇人為日綺勝𥘉成日作人聖藻凌雲裁栢賦仙歌從宴摘梅春垂旒一慶冝年酒朝野俱歡薦夀新安樂公主山庒云銀河南渚帝城隅帝輦平明出九衢刻鳳蟠螭陵桂邸穿池疊石冩蓬壺瓊簫暫下鈞天樂綺綴長懸明月珠仙牓承恩争既醉方知朝野更歡娱望春宫迎春應制云九重樓閣半山霞四望韶陽春未賖侍蹕妍歌㳺㶚涘留觴罷舞出京華危萍競捧中街日戲馬争衘上苑花景色歡娱長若此承恩不醉不還家送金城公主云柔逺安夷俗和親重漢年軍容旌節送國命錦車傳琴曲悲千里簫聲戀九天唯應西漢月來就掌珠圓餞唐州髙使君云桐栢膺新命芝蘭惜舊逰鳴臯夜鸖在遷木早鸎求傳擁淮源路罇空㶚水流落花分送逺春色别離憂早朝云霞維芳月季宸極衆星尊佩玉朝三陛鳴珂過九門挈壺分早漏㐲檻耀初暾北倚蒼龍闕西臨紫鳯垣詞庭草雖視温室樹無言鱗翰空爲忝長懷聖主恩中宗立春遊苑應制云㶚涘長安常近日殷正臘月早迎新池魚戲葉仍含凍宫女裁花巳作春向苑雲疑承翠帷入林風若起青蘋年年斗柄東無限願把瓊觴夀北辰中宗時興慶池侍宴應制云滄池漭沆帝城邊殊勝昆明鑿漢年夾㟁旌旗䟽逺道中塘簫皷振樓船雲峰四起迎宸幄寳樹千重入御筵宴樂已深魚鳥詠承恩更欲奏甘泉主第夜宴云主第新成銀作榜賔筵廣宴玉為樓壺觴既卜仙人夜歌舞疑停織女秋元旦京兆萬年人與張易之姻属易之罷貶感義尉舅陸頌妻韋后弟也元旦慿以復進終中書舍人唐詩紀事巻第十一
