  text: 唐詩紀事巻第十一
  hash: sha256:5d85306edb87d316e611acb80d81a8f6ee197aef7a1c28ca9bb360b918d8105e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_011-1a}
body:
  text: 韋嗣立趙彥伯閻朝隠鄭愔沈佺期宋之問徐堅盧懷慎武平一李行言韋元旦韋嗣立九日應制云層觀遠沉沉鑾旗九日臨帷宫壓水㟁歩輦入煙岑枝上茰新採樽中菊始斟願陪歡樂事長與嵗時深字得深嗣立在省閣與岳州張使君說潭州王都督熊聮事後承朝譴各東西相别詩云茂先王佐才作牧楚江隈登樓正欲賦復遇仲宣來黃鵠飛将逺雕龍文為開寧知昔聮事聽曲有餘哀昔時陪二賢纓冕㑹神仙一去馳江海相逢共播遷無因千里駕忽覩四愁篇覽諷歡何已歡終徒愴然嗣立中宗時為大學士制云詞林佇秀學海資英茍非鴻儒孰副推擇守大府卿韋嗣立金籯襲慶玉鼎生才浴徳澡身居中履孝保淳懿之道綜虛明之識前言徃行獨運襟靈徤筆通文孤標望實果升臺閣常典樞機誠亮險夷政敷匡益自出入中外周旋䆠遊夕郎歸其峻寵冬卿美其成務官曹内殿朝野旁求宜叅右署之榮俾接金閨之彥可修文館大學士兄承慶長夀中與嗣立相代為鳯閣舍人長安三年承慶代嗣立為鳯閣侍郎頃之又代為黄門侍郎四職相代時謂大郎罷相二郎拜相中宗授嗣立黄門侍郎制曰芝蘭並秀見謝石之階庭騏驥並驅有劉山之昆季又曰近者命於鸞渚巳擢鴈行纔出芝扃奄歸蒿里永言荆樹坐折連枝眷彼常山空餘一鳥俾遷榮於皂蓋宜襲寵於黄樞嗣立㽵在驪山鸚鵡谷中宗幸之嗣立獻食百轝及朩器藤盤等物上封為逍遥公谷為逍遥谷原為逍遥原中宗留詩從臣属和嗣立並䥴于石請張說為之序薛稷書之李乂詩略云樞掖調梅暇林園種槿初入朝榮劒履退食樂琴書地隱東巗石天廻北斗車旌門臨􅌄窱輦路属扶踈沈佺期詩略云水堂開禹膳山閣獻堯鐘皇鑒清居逺天文睿奨濃武平一云三灮廻斗極萬騎肅鈎陳地若遊汾水畋疑獵渭濵趙彦昭云廊廟心存巗壑中鑾輿矚在㶚城東逍遥自有蒙莊子漢主徒言河上公張說序亦云嵐氣入野榛煙出谷魚潭竹㟁松齋藥畹虹泉電射雲木虚吟恍惚疑夢間闗忘術兹所謂丘壑道政龍衣冠巢許也開元中嗣立自湯井還都經其龍門北溪别業忽懷驪山之勝嘗有詩云幽谷杜陵邊風煙别㡬年偶來伊水曲溪嶂覺依然傍浦憐芳木尋崕愛渌泉嶺雲隨馬足山鳥向人前地合心俱静言因理自玄短才叨重寄尸禄媿妨賢每揖掛冠侣思從𥘉服旋稻粱仍欲報歳月坐空捐助岳無纎芥輸溟謝末㳙還晤北轅失方兹南澗田時張說崔㤗之崔日知在東都皆和焉先一日太平公主上官昭容題詩數篇故張說詩云舞鳯迎公主雕龍賦婕妤趙彦伯九日應制云九日報仙家三秋轉翠華呼鷹下鳥路戲馬出龍沙簮挂丹茰蘂杯涵紫菊花所願同㣲物年年共辟邪字得花張亶來自朔方軍中宗迓之宴于桃花園應制曰紅萼競燃春苑曙芊茸新色御筵開長年願奉西王讌近侍慙無東朔才彦伯為洪文舘學士閻朝隱送金城公主生舅重親地君臣厚義鄉還將貴公主嫁與褥檀王鹵簿山川闊胡琴道路長廻贍父母國日出在東方人日大明宫應制云句芒人靣乗兩龍道是春神衛九重綵勝年年逢七日酴䕷嵗嵗滿千鍾宫梅間雪祥光徧城柳含煙瑞氣濃醉倒君前情未盡願因歌舞自為容宴安樂公主新宅云鳯凰鳴舞樂昌年蠟燭開花夜管絃半醉徐擊珊瑚樹巳聞鐘漏曉聲傳鸚鵡猫兒云鸚鵡恵鳥也猫不仁獸也飛翔其背焉嚙啄其頤焉攀之縁之蹈之履之弄之藉之蹌蹌然此為自得彼亦以為自得畏者無所起其畏忍者無所行其忍抑血属舊故之不若臣叨踐太子舍人朝暮侍從預見其事聖上方以禮樂文章為功業朝野歡娱强梁充斥之軰願為臣妾稽顙闕下者日萬計尋而天下一統實以為惠可以伏不惠仁可以伏不仁亦太平非常之明證事恐久遠風雅所缺再拜稽首為之篇霹靂引豐隆鳴猛獸噫氣蛇吼聲鸚鵡鳥同資造化兮殊粹精鷫鸘毛翡翠翼鵷雛延頸鵾鷄弄色鸚鵡鳥同禀隂陽兮異埏埴彼何為兮隱隱振振此何為兮緑衣翠襟彼何為兮窘窘蠢蠢此何為兮好㒵好音彷彷兮佯佯似妖姬躧歩兮動羅裳趍趍兮蹌蹌若處子廻眸兮登玉堂爰有獸也安其獸也其忍觜其脇距其胸與之放曠浪浪兮從從容容鈎瓜踞牙也霄行晝伏無以當遇之兮忘味搏擊騰擲也朝飛暮噪無以拒逢之兮屏氣由是言之貪殘薄則智惠作貪殘臨之兮不復躍由是言之智惠周則貪殘囚智惠犯之兮不復憂菲形陋質雖賤微皇王顧遇長光輝離宫别館臨朝市妙舞繁絃雜宫徵嘉喜堂前景福内和歡殿土明光裏雲母屏風文彩合流蘇斗帳香煙起承恩宴盻接宴喜髙視七頭金駱駝平懷五尺銅師子國有君兮國有臣君為主兮臣為賔朝有賢兮朝有徳賢為君兮德為飾千年萬歳兮心轉憶九日應制云九九侍神仙髙髙坐半天文章二曜動氣色五星連簮紱趨皇極笙歌接御筵願因吹菊酒相守百千年字得筵中宗立春遊苑應制云管籥周移寰極裏乗輿望幸斗城闉草根未結青絲縷蘿蔦揂垂緑帔巾鵲入巢中言改歳燕衘書上道冝新願得長繩繫取日光臨天子萬年春送唐永昌赴東都詩曰洛陽難理若棼絲推破連環定不疑鸚鵡鳥道長安樂回首一顧一相思授著作郎直學士制云朝隱夜光成寶朝陽擢秀文高一變藝㧾三端承顧問於鸞掖賞圖書於麟府頃属播遷獲返班序方來石室分曹已參於著述金門直事俾崇於伸奨可修文舘直學士朝隱字友倩趙州欒城人性滑稽属辭竒詭為武后所賞景龍時為著作郎先天中為秘書少監坐事貶通州别駕卒鄭愔上幸薦福寺令賦詩云舊邸三乗闢佳辰萬騎留攔圖奉葉偈芝蓋拂花樓國㑹人王法宫還天帝逰紫雲成寳界白水作禪流鴈塔昌基逺鸚杯睿藻抽忻承大風曲竊預小童謳三㑹寺應制詩云鳥籕遺新閣龍旗訪古臺造書臣頡徃觀跡帝羲來睿覽山川匝宸心宇宙該𣑽音隨駐輦天歩接乗杯舊苑經寒露殘池問刼灰散花将捧日俱喜聖詞開陪幸昭容院獻詩四首地軸樓居逺天台闕路賖何如遊帝宅即此對僊家拂座金壺電池揺玉酒霞無云秦漢隔别訪武陵花堯詞姑射近漢苑建章連十五蓂知月三千桃㡬年鶯歌隨鳯吹鸖舞向鵾絃更覔瓊妃伴來過玉女泉宫掖賢才重山林髙士難不言辭輦地更有結廬歡池棟清温燠巗䆫起泫寒幽亭有仙桂聖主萬春看槎流天上轉茅宇禁中開河鵲填橋至山熊避檻來庭花採菉蓐巗石歩莓苔願奉蘿圖㤗長聞錦翰裁陪幸長寧公主庄云公門襲漢環主第稱秦玉池架祥鱣宇山吹鳴鳯曲拂席薜蘿垂廻舟芰荷觸平陽妙舞處日暮清歌續望春宫迎春應制云晨蹕凌髙轉翠旌春樓望逺背朱城忽排花上遊天苑却坐雲邊㸔帝京百草香心初罥蝶干林嫩葉始藏鸎幸同微藿傾誠早願比盤相應候榮送金城公主云下嫁戎庭逺和親漢禮優笳聲出虜塞簫曲比秦樓貴主悲黃鸖征人怨紫騮皇情眷億兆割念俯懷柔早朝云瑞闕龍居峻宸庭鳯掖深才良寄天綍趍拜侣朝簪飛鳥㸔來影喧車識駐音重軒輕霧入洞户落花侵聞有題新翰依然想舊林同聲慙卞玉謬比託韋金寒外三篇塞外蕭條望征人北路賖邊聲亂朔馬秋色引胡笳遥鄣侵歸日長城帶晚霞斷蓬飛古戊連鴈聚寒沙海暗雲無葉山春雪作花丈夫期報主萬里獨辭家荒壘三秋夕窮郊萬里平海隂凝獨樹日氣下連營戎斾霜疑重邉裘夜更輕将軍猶轉戰都尉不成名折柳悲春曲吹笳斷夜聲明年漢使返湏築受降城陽鳥南飛夜隂山北地寒漢家征戍客年歳在樓蘭玉闗朔風起金河秋月團邊聲入皷吹霜氣下旌干海外歸書斷天涯旅鬢殘子卿猶奉使常向節旌㸔愔字文靖年十七進士擢第神龍中為中書舍人與崔日用趙履温李􅞥等託武三思權熏炙中外天下語曰崔冉鄭亂時政雍也冉祖或曰初附來俊臣俊臣誅附易之易之誅託韋庻人後附譙王卒被戮人日侍宴大明宫云瓊殿含光映早輪玉鑾𥘉蹕望初晨池開凍水仙宫麗樹發寒花禁苑新佳氣徘徊籠細網殘霙淅瀝染輕塵良時荷澤皆迎勝窮谷稀陽猶未春哭郎著作云詩禮康成學文章賈誼才已年人得夢庚日鳥為灾書草藏天閣琴聲入夜臺荒階羅駁蘚雲座滿塵埃白馬賔從散青烏隴隧開悲凉門舘下懷舊幾遲廻秋閨詩云征客向輪臺幽閨寂不開音書秋鴈㫁機杼夜蛩催虚愰風吹葉閑堦露染苔自憐愁思影常共月徘徊唐永徽以來唱桑條歌云桑條韋也女韋也神龍時逆韋應之愔作枽條樂詞十首以進擢吏侍愔樂府採蓮曲云錦檝沙棠艦羅帶石榴裙緑潭採荷芰清香日稍曛魚鳥争唼喋花葉相芬氲不覺湘州暮菱歌處處聞胡笳曲云漢将留邊朔遥遥嵗序深誰堪牧馬思正是胡笳吟曲㫁江山月聲悲雨雪隂傳書向蘇武陵也獨何心折楊柳云青柳映紅顔黄雲蔽紫闗忽聞邊使出枝葉為君攀舞腰愁欲㫁春心望不還風花衮成雪羅綺亂班班夜遊曲云漢室歡娱盛魏國文雅遒許史多暮宿應陳從夜逰西園燕公子北里召王侯詎似将軍獵空嗟亭尉留年少行云頴川豪横客咸陽輕薄兒田竇方貴幸趙李新相知軒蓋終朝集笙竽此夜吹黄金盈篋笥白日忽西馳沈佺期幸太平公主南庄詩云主第山門起㶚川宸遊風景入初年鳳凰樓下交天仗烏鵲橋頭敞御筵徃徃花間逢綵石時時竹裏見虹泉今朝扈蹕平陽館不羡乗槎雲漢邊九日臨渭亭云御氣幸金方慿髙薦羽觴魏文班菊蘂漢武賜茰房秋美銅池色晴添銀樹光年年重九慶日月奉天長陪幸韋嗣立㽵云台階好赤松别業對青峰茆室承三顧花源接九重虹旗縈秀木鳯輦拂踈笻逕直千官擁溪長萬騎容水堂開禹膳山閣獻堯鐘皇鑑清居逺天文睿奨濃巗泉他夕夢漁釣徃年逢共榮丞相府偏降逸人封白鹿觀應制云紫鳯真人府班龍太上家天流芝蓋下山轉桂旌斜聖藻垂寒露仙杯落晩霞唯應問王母桃作幾時花上已陪駕渭濱云寳馬香車清渭濱紅桃碧柳禊堂春皇情尚隱垂竿佐天瑞先呈捧劒人陪幸五王宅云北闕垂旒暇南宫聽履廻天臨翔鳯轉恩向濯龍開蘭氣承僊帳榴花引御盃日從金穴吐雲是玉衣來池影揺歌席林香散舞臺不知行漏晚清蹕尚徘徊安樂公主㽵云皇家貴主學神仙别業𥘉開雲漢邊山出盡如鳴鳳嶺池成不譲飲龍川粧樓翠幌教春住舞閤金鋪借日懸景從乗輿來此地稱觴獻夀樂鈞天人日大明宫應制云拂旦鷄鳴仙衛陳慿髙龍首帝庭春千宫黼帳杯前夀百福香奩勝裏人山鳥𥘉來猶怯囀林花未發已偷新天文正應韶光轉設報懸知用此辰望春宫迎春應制云芳郊緑野散春晴複道離宫煙霧生楊柳千條花欲綻蒲桃百丈蔓𥘉縈林香酒氣元相入鳥囀歌聲各自成定是風灮牽宿醉來晨復得幸昆明晦日滻水應制云素滻接宸居青門盛祓除摘蘭諠鳳野浮棗溢龍渠苑蝶飛殊嬾宫鸎囀不踈景移天上入歌舞向儲胥送金城公主云金牓扶丹掖銀河属紫閽那堪将鳳女還似嫁烏孫玉就歌中怨珠辭掌上恩西戎非我匹明主為公存餞唐永昌云洛陽舊有神明宰輦轂田來天地中餘邑政成何足貴因君取則四方同早朝云閶闔連雲起巗廊拂霧開玉珂龍影度珠履鴈行來長樂霄鐘盡明光曉奏催一經推舊徳五字擢英才儼若神仙去紛從霄漢廻千春奉休歴分禁喜趨陪曝衣篇云君不見昔日冝春太液邊披香畫閣與天連登華灼爍九微映香氣氛氲百和燃此夜星繁河正白人傳織女牽牛客宫中擾擾曝衣樓天上娥娥紅粉席曝衣何許矄半黃宫中梁絳河裏碧煙上雙花㐲兎畫屏風四子盤龍擎斗帳舒羅散縠雲霧開綴玉垂珠星漢廻朝霞散綵羞衣架曉月分光劣鏡臺上有仙人長命錦中有玉女迎歡繡玳瑁筵中别作春珊瑚䆫裏飜成晝椒房金