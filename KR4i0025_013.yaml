front:
  text: 唐詩紀事卷第十三
  hash: sha256:523d99eefee917022a7fdb289a117ef8d2bcf54958f7ecfde687a7a0301588f0
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_013-1a}
body:
  text: 崔液張元一劉希夷鄭遂初王熊房融張敬忠崔圭沈祖仙盧崇道徐安期張紘薛曜袁暉李休烈邵士彥吳大江劉幽求賈曾楊齊哲魏元忠李夔司馬承禎崔液上元詩六首云玉漏銅壺且莫催鐵關金鎖徹明開誰家見月能間坐何處聞燈不看來今年春色勝常年此夜風光最可憐鳷鵲樓前新月滿鳳凰臺上寶燈燃神燈佛火百輪張刻象圖容七寶裝影裏如聞金口說空中似放玉豪光金勒銀鞍控紫騮玉輪珠幰駕青牛驂驔始散東城曲倐忽還來南陌頭公子王孫意氣驕不論相識也相邀最憐長袖風前弱更賞新絃暗裏調星移漢轉月將微露灑煙飄燈漸稀猶惜道傍歌舞處踟蹰相顧不能歸液字潤甫仁師之子湜之弟也工五言舉進士第一人湜嘗曰液子我家龜龍也官至殿中侍御史坐湜故亡命郢州作幽征賦以見意遇赦還卒張元一武后朝左司郎中張元一善滑稽時西戎犯邊武懿宗統兵禦之至邠畏懦而遁懿宗短陋元一嘲曰長弓短度箭蜀馬臨高蹁去賊七百里隈墻獨自戰忽然逢著賊騎猪向南䞼則天未曉曰懿宗無馬耶元一曰騎猪夾豕也則天大笑后嘗問元一外有何事曰有三慶旱而雨洛橋成郭洪霸死吏也洪霸酷劉希夷將軍行云將軍闢轅門耿介當風立諸將欲言事逡巡不敢入劒氣射雲天鼓聲破原隰黃塵塞路起走馬追兵急彎弓從此去飛箭如雨集截圍一百里斬首五千級代馬流血死胡人抱鞍泣古來養甲兵有事常討襲乘我廟堂運坐使干戈戢獻凱歸帝京軍容何翕習悲代白頭翁云洛陽城東桃李花飛來飛去落誰家洛陽兒女惜顔色行逢落花長歎息今年花落顔色改明年花開誰復在巳見松柏摧為薪更聞桑田變為海古人無復洛城東今人還對落花風年年歲歲花相似歲歲年年人不同寄言全盛紅顔子須憐半謝白頭翁此翁白頭真可憐伊昔紅顔美少年公子王孫芳樹下清歌妙舞落花前光祿臺前開錦繡將軍樓閣盡神仙一朝卧病無人識三春行樂在誰邊宛轉娥眉能幾時須臾鸖髮亂如絲但看舊來歌舞地唯有黃昏鳥雀悲唐新語云希夷一名庭芝汝州人少有文華好為宫體詩詞㫖悲苦不為時人所重善彈琵琶嘗為白頭翁詠云今年花落顔色改明年花開復誰在既而自悔曰我此詩䜟與石崇白首同所歸何異乃更作一聮云年年歲歲花相似歲歲年年人不同既而歎曰此句復似向䜟矣然死生有命豈復由此乃兩存之詩成未周歲為姧人所殺或云宋之問害之後孫翌撰正聲集以希夷詩為集中之最由是大為人所稱為巳作至今載此篇在之問集中或云之問害希夷而以洛陽之篇晚憩南陽旅館云旅館何年廢征夫此日過途窮人自哭春至鳥還歌行路新知少荒田古路多池篁覆丹谷墳樹繞清波日照蓬隂轉風微野氣和傷心不可去回首怨如何秋日題汝陽潭壁云獨坐秋隂至悲來從所適行見汝陽潭飛蘿蒙水石懸瓢朩葉上風吹何歷歷幽人不耐煩振衣步間寂回流清見底金沙覆銀礫洛水非一丈空朧幾千尺魚鱗可憐紫鴨毛自然碧秋水弄清灮渺焉忘損益遊山隨形影清濁混心迹歲暮歸去來東山餘宿昔故園置酒云酒熟人須飲春還鬢已秋願逢千日醉得緩百年憂舊里多青草新知盡白頭風前燈易滅川上月難留卒卒周姬旦棲棲魯孔丘平生能幾日不及且遨遊夜集張諲所居云江南成久客門館日蕭條唯有圖書在多傷鬢髮凋諸生陪講誦稚子給漁樵隱室寒燈淨空階落葉飄滄洲自有趣誰道隱須招巫山懷古云巫山幽隂地神女艷陽年襄王伺容色落日望悠然歸來高堂夜金釭熖青煙頺想卧瑶席夢魂何翩翩搖落殊未已榮華倐徂遷愁思瀟湘浦悲凉雲夢田猿啼秋風夜鴈飛明月天巴歌不可聽聽此益潺湲孤松篇云蠶月桑葉青鶯時柳花白淡艷煙雨滋敷芬陽春陌如何秋風起零落從此始獨有南澗松不歎東流水玄隂天地冥皓雪朝夜零豈不罹寒暑為君留青青靑靑好顔色落落任孤直群樹遙相望衆草不敢逼靈龜卜真隱仙鳥冝棲息耻受秦帝封願言唐侯食寒山夜月明山冷氣清清凄兮歸風集吹之作琴聲松子卧仙岑寂聽凝野心清冷有真曲樵採無知音美人何時來幽徑委緑苔吁嗟深澗底弃捐廣厦材鄭遂𥘉别離怨云蕩子戍遼東連年信不通塵生錦步障花送玉屏風只怨紅顔改寧辭玉簟空繫書春鴈足早晚到雲中萬歲通天年李逈秀下登第王熊熊自潭州至嶽陽張燕公宴别贈詩二章云絲管清且哀一曲傾一杯氣將然諾重心向友朋開古木無生意寒雲若死灰贈君芳杜草為植建章臺縉紳連省閣溝水遽西東然諾心猶在容華歲不同孤城臨楚塞逺樹入秦宫誰念三千里江潭一老翁熊答云長沙辭舊國洞庭逢故人薰蘭敦久要披霧轉相親歲月方嗟老江山不惜春忽聞黃鸖曲更作白頭新平生共風月倐忽間山川不期交淡水暫得欵忘年興逸方罷釣帆開欲解船離心若危斾朝夕為君懸韋嗣立嘗和前作并序云余昔忝省闥與嶽州張使君潭州王都督同官聮事後承朝譴各自東西張公與王都督别詩二首情頗感切余覽以耿歎因追和焉立門詩見嗣房融遊始興廣果寺山房云零落嗟殘命蕭條託勝因方燒三界火遽洗六情塵隔嶺天花發凌空月殿新誰令鄉國思從此學分身融河南人武后時為宰相神龍元年貶死高州張敬忠先天中王上客為侍御史自以才望華妙當入省望前行忽除膳部員外微有悵惋吏部郎中張敬忠戲詠曰有意嫌兵部專心望考功誰知腳蹭蹬幾落省墻東蓋膳部在省最東北隅也張仁願在朔方奏用御史張敬忠何長鸞等分揔軍事太子文學柳彥昭為管記義烏尉昆良正為隨機皆著稱敬忠自監察御史纍遷吏部郎中開元七年拜平盧節度使未詳上客字崔圭孤寢怨云征戍動經年含情拂玳筵花飛織錦處月落搗衣邊燈暗愁孤坐牀空怨獨眠自君遼海去玉匣間春絃圭開元中為太子詹事與兄中書舍人琳弟光祿卿瑶俱列棨㦸世號三㦸崔家沈祖仙秋閨詩云白馬三軍客青娥十載思王庭霜落夜羅幌月明時爐冷蜘蛛喜燈寒熠耀期愁多不可曙流涕坐空幃盧崇道新都南亭别郭大元振詩云竹徑女蘿蹊蓮洲文石隄靜深人俗斷尋玩往還迷碧潭秀𥘉月素林驚夕棲褰幌納鳥侶罷琴聽猿啼佳辰改宿昔勝寄坐睽携長懷賞心愛如玉復如圭崇道為太常卿坐其􅡾崔湜反俱流嶺南還歸至都為其子娶崔氏女有內給使取充貴人崇道賂之令别娶一崔氏女入內事敗并男三人皆勑杖至殞蓋睿宗時也徐安期催粧云傳聞燈下調紅粉明鏡臺前作好春不須靣上渾粧却留著雙眉待畫人張紘閨怨詩云去年離别鴈𥘉歸今夜裁縫螢已飛征客近來音信斷不知何處寄寒衣紘登久視六年進士第薛曜正夜侍宴應制云重關鐘漏通夕敞鳳凰宫雙日祥煙裏千門明月中酒杯浮湛露歌曲唱流風侍臣咸醉止常慙恩遇崇曜尚城陽公主子紹尚太平公主紹兄顗懼太盛以問從兄克克曰帝甥尚主由來故事但以恭慎行之何懼也曜堂姪警子鏽自曜至鏽一門四公主曜元起之子也聖曆中附張易之官正諌大夫袁暉正月閨情云正月金閨裏微風繡户聞曉魂憐别夢春思逼啼顔繞砌梅堪折當軒樹未攀歲華庭北上何日度陽關七月閨情云七月坐凉霄金波滿麗譙容華芳意改枕席怨情饒錦字沾愁淚羅裙紱細腰不如銀漢女歲歲鵲成橋二月閨怨云二月韶光好春風香氣多園中花巧笑林裏鳥能歌有恨離琴瑟無情著綺羅更聽春燕語妾亦不如他三月閨怨云三春時將盡空房獨妾居蛾眉愁自結鬢髮沒情梳魏知古薦為左𥙷闕開元中馬懷素欲校正群籍暉自邢州司户參軍預焉明皇東巡回出雀鼠谷暉應制云魏國山河險周王警蹕回九旗雲際出萬騎谷中來石岸行將盡煙郊望忽開賞矜垂柳拂春畏落花催興逸橫汾體恩褒作頌才小臣曕日月延首詠康哉李休烈長夀三年則天徴天下銅五十餘萬斤鐵一百三十餘萬斤於定鼎門內鑄八稜銅柱高九十尺徑一丈二尺題曰大周萬國述德天樞紀革命之功貶唐家之德天樞下置鐵山銅龍負載獅子麒麟圍繞上有雲蓋上施盤龍以托珠高一丈圍三丈金彩熒煌光侔日月武三思為其文朝士獻詩者不可紀惟李嶠詩冠絶當時曰轍跡光西山弇勳庸紀北燕何如萬國㑹諷德九門前灼灼臨黃道迢迢入紫烟仙盤正下露高柱欲承天山類叢雲起珠疑大火懸聲流塵作劫業固海成田聖澤傾堯酒薰風入舜絃欣逢下生日還偶上皇年後憲司發嶠附㑹韋庶人左授滁州别駕而終開元中詔毁天樞發卒鎔鑠彌月不盡洛陽尉李休烈賦詩以詠之曰天門街裏倒天樞火急先須卸火珠計合一條絲線挽何勞兩縣索人夫先有訛言云一條線挽天樞言其不經久也故休烈詩及之士庶莫不諷詠天樞之北韋庶人繼造一臺先此毁拆新語出大唐邵士彥秋閨詩云斜日空庭暮幽閨積恨盈細風吹帳冷微月度窗明怨坐啼相續愁眠夢不成調琴欲有弄畏作斷腸聲吳大江搗衣詩云沙塞秋應晚金閨恨已空那堪裂紈素時許出房櫳杵影弄寒月砧聲調夜風裁縫雙淚盡萬里寄雲中劉幽求幽求書懷云心為明時盡君門尚不容田園迷徑路歸去欲何從幽求冀州人臨淄王入誅韋庶人預參大䇿先天中為相在同列下意望未滿已而竇懷正崔湜附太平公主有逆謀幽求說明皇圖之謀泄睿宗流之於封州明年公主誅召復舊官開元初進左丞相以太子少保罷姚崇忌之奏幽求鬱鬱散職有怨言詔有司鞠治盧懷愼等奏幽求輕肆不恭失大臣體貶睦州刺史遷杭郴二州恚憤卒于道賈曾洛陽人以孝聞開元𥘉為中書舍人與蘇晉同掌制誥時號蘇賈曽孝和皇帝挽詞云新命千齡啓鴻圖纍聖餘天行應潜躍帝出受圖書禮若傳堯舊功疑復夏𥘉夢遊長不返何國是華胥曾和宋之問下山歌云良遊晼晚兮月成紅錦路逶迤兮山路長王孫不留兮歲將宴嵩嵓仙草兮為誰芳旡競門之問詩見王未詳紅字奉和春日出苑遊矚云彤闈晚闢問安回金輅遊春博望開渭北晴光搖草樹終南佳氣入樓臺招賢巳得商山客託乘還招鄴下才臣在東周獨留滯欣承睿藻日邊來人使在東都時為太子舍楊齊哲過函谷關云地險崤函北途經分陜東逶迤衆山盡荒凉古塞空河光流曉日樹影散朝風聖德今無外何處是關中魏元忠侍宴銀潢宫應制云别殿秋雲上離宫夏景移寒風生玉樹凉氣下瑶池塹花仍􅻸葉嵓菌尚抽枝願奉南山夀千秋長若斯史有傳元忠唐李夔夔為汴州司户使至汴州喜逢宋之問詩云阮籍蓬池上孤韻竹林才巨源從吏道正擁使車來相逢且交臂相命且銜杯醉後長歌畢餘聲繞吹臺之問答曰逺方來下客輶軒揖使臣弄琴冝在夜傾酒貴逢春駟馬留孤館雙魚贈故人明朝雲雨散遙仰德為鄰司馬承禎宋之問吟冬霄引贈承禎云河有氷兮山有雪北户墐兮行人絶獨山中兮對明月懷美人兮屢盈缺明月的的寒潭中青松幽幽吟徑風此情不向俗人說愛而不見恨無窮承禎答云時既暮兮節欲春山林寂兮懷幽人登竒峰兮望白雲悵湎邈兮象郁紛白雲悠悠去不返寒風颼颼吹日晚不見其人誰與言歸坐彈琴思逾逺承禎字子微事潘師正傳辟穀導引術無不通睿宗明皇纍召至京師問其術卒贈正一先生沈佺期贈詩云紫微降天仙丹地授雲藻上言華頂事中問長生道華頂居最高大壑朝陽早長生術何妙童顔後天老清晨朝鳳京靜夜思鴻寶叙其被召之事也李白云余音於金陵見司馬子微謂余有仙風道骨可以神遊八極之表因著大鵬賦以見志焉唐詩紀事卷第十三
