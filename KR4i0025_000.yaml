front:
  text: 重刻唐詩紀事序
  hash: sha256:ad40121eb92f68757a7d488a770107c4f14370b7ebe7184ebff64cf131842386
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_000-1a}
body:
  text: 明中憲大夫浙江提刑按察副使敕理學政汾陽孔天胤汝錫甫譔唐詩紀事若干卷舊叙是臨卭灌園居士計敏夫字有功所集而爲懷安假守王禧字慶長鋟置郡齋時記嘉定甲申年代既逺印板磨滅或無再刻之者故其書罕存即有傳者但鈔本爾嗜文之士意恒闕如也嘉靖乙巳錢塘洪子美氏釋宫寀玉絳之班理家園竹素之業得笥蔵懷安𥘉本遂爲雕繕久之成書余覽而嘉之且善其紀事之意叙日夫詩以道情疇弗恒言之哉然而必有事焉則情之所繇起也辭之有爲綜也故觀于其詩者得事則可以識情得情則可以逹辭譬諸水木事其源委本末乎辭其津渉林叢乎情其爲流爲鬯者乎是故可以觀巳故君子曰在事爲詩又曰國史明乎得失之迹夫謂詩爲事以史爲詩其義幠哉然自性情之說拘而狂簡或遂畧于事則猶不窮水木而徒迷乎津渉蔽虧乎林叢其于流鬯益巳踈矣故孔父言知在于格物孟子誦詩必論其世且如虞有卿雲之歌弗稽大傳曷知其爲禪夏漢盛五篇之詩非考兩都又焉得其鴻典也故善學者大通而無閡不善學者小見而多離詩從删後豈展無之顧大雅雖闕然歌詠之事可考而繹焉唐俗尚詩號專盛至其摛藻命章逐境紆翰皆情感事而發杼辭縁情而綺麗即情事之合一詎觀覽之可偏宋興理學儒者徧鄙薄詞華覆又推杜甫等而以格調聲律爲品裁然但言理而不及事豈與古人說詩之旨同哉今高材㓛慕其成說競依憑其籬下掇拾其緒餘及博討唐篇如窮水木或不喻其時代與人物是旣不曉事又安識所謂道情者與夫所謂聲調者亦窽言也巳然則紀事一書其藝流之源委文苑之本末利渉之方航發蒙之朗若者矣甞觀集唐詩者奚啻什數集紀事如有功者少刻唐詩者奚啻伯數刻紀事如子美者少予故嘉善作此叙詞詩三百篇毛傳蓋其紀事今爲考亭所絀然欲究遺經當必攷之子美名楩歷詹事府主簿唐詩紀事序唐人以詩名家姓氏着于後世殆不滿百其餘僅有聞焉一時名軰㓕没失傳蓋不可勝數敏夫閑居尋訪三百年間文集雜說傳記遺史碑誌石刻下至一聮一句傳誦口耳悉搜採繕録間捧䆠牃周逰四方名山勝地殘篇遺墨未甞棄去老矣無所用心取自唐𥘉首尾編次姓氏可近紀一千一百五十家篇什之外其人可考即略紀大節庻讀其詩知其人所恨家貧缺簡籍地僻罕聞見聊據所得先成八十一卷目曰唐詩紀事云灌園居士臨邛計敏夫有功叙慶元辛酉禧從大諌傅公㳺于凌雲邂逅灌園季子次陽緫幹盖禧戊午類試坐主也因得是書立命數十吏傳録其間不能無魯魚亥豕之誤繙閱累年手自讎校十是正其七八餘則傳疑不敢妄加損也夫文章與時高下而詩發於情帝王盛時採之以觀民風在治忽春秋之時趙孟請賦詩以觀鄭七子之志季札請觀樂以知列國之風世之君子欲觀唐三百年文章人物風俗之汚隆邪正則是書不爲無助乃鋟之懷安郡齋與世共之嘉定甲申懷安假守王禧慶長書唐詩紀事摽目第一卷太宗高宗中宗第二卷朙皇德宗文宗宣宗昭宗第三卷武后徐賢妃上官昭容越王貞韓王元嘉孔紹安鄭世翼董思㳟沈叔安陸敬袁助牛鳯及朱子奢庾抱張文恭陳叔逹薛收第四卷王珪禇亮虞世南蔡允㳟許敬宗劉孝孫魏徴楊師道岑文本李伯藥來濟長孫無忌杜正倫馬周李義府陳子良杜之松崔善爲王績第五卷蕭德言顔師古杜淹裴守眞胡元範元萬頃李敬玄張文琮薛元超鄭蜀賔王德眞楊思玄鄭義眞作珩蕭翼張執恭鄭軌王勣竇咸第六卷上官儀郭正一喬知之喬侃貟半千任希古蘇味道杜審言郭利正吳少㣲冨嘉謨李福業王適李崇嗣第七卷高正臣崔知賢韓仲宣周彦昭高球弓嗣𥘉高瑾王茂時徐晧長孫貞隱高紹郎餘令陳嘉言周彦暉高嶠周思鈞劉友贒于季子東方虬駱賔王盧照隣王勃楊烱田遊巖第八卷陳子昻邵大震李日知李景伯劉禕之王無競袁恕巳郭元震崔融張昌齡第九卷李適張鍚徐彦伯宗楚客韋承慶蕭至忠李逈秀劉憲崔湜岑羲第十卷趙彦昭崔日用李乂盧藏用馬懷素薛稷劉元濟李元紘李嶠蘇瓌蘇頲第十一卷韋嗣立趙彦伯閻朝隱鄭愔沈佺期宋之問徐堅盧懷慎武平一李行言韋元旦第十二卷畢乾㤗辛替否王景韋安石竇希玠李咸陸景𥘉鄭南金于經野解琬麴瞻樊忱孫佺李從遠周利用楊廉張景源李恒第十三卷崔液張元一劉希夷鄭遂𥘉王熊房融張敬忠崔珪沈祖僊盧崇道徐安期張紘薛曜袁暉李休烈邵士彦吳大江劉幽求賈曽楊齊哲魏元忠李夔司馬承禎第十四卷張說宋璟王丘崔翹王灮庭席豫梁昇卿源乾曜張嘉正盧從愿韓休徐知仁崔禹鍚裴漼韋玩程行諶李暠蕭嵩劉昇裴灮庭宇文融崔沔崔尚陸堅崔㤗之崔日和魏奉古第十五卷王灣魏知古許景先姚崇姜皎姜晞王岳靈楊顔鄭繇張諤趙仁奬張暈金昌緒蘇晉張九齡崔國輔第十六卷王維王縉裴迪崔興宗第十七卷賀知章賀蘭進明李邕隂行光李伯魚趙冬曦尹􅐂崔成甫李昻殷遥徐延壽苑咸丘爲第十八卷杜甫李白第十九卷崔宗之敬括房琯蘇源明第二十卷鄭虔嚴武史俊李適之祖詠李傾綦母濳趙謙光李元操薛令之張諲陶翰顔舒王琚王熊薛維翰崔亘朱琳王泠然萬楚胡皓袁瓘柳識高力士高霽息夫牧崔曙第二十一卷蕭頴士李華崔顥李嘉祐王翰第二十二卷任華鄒象先賈至違述裴輝卿解彦融儲光羲孫翃梁知微沈千運魏萬元結萬齊融張均李嶷宋鼎崔頌第二十三卷司馬退之吳筠蘇廣文尉遲厈王諲陳希烈高適張彪張子容李之芳崔或孟浩然岑參第二十四卷元傑韋迢孟彦深郭受陶現張偁王昌齡周萬包融顔眞卿丁仙芝李清韓滉齊澣顧朝陽韋建第二十五卷徐安貞崔惠童崔敏童劉晏劉灣薛據劉眘虛張廵張