front:
  text: 唐詩紀事卷第七十
  hash: sha256:85bd7402c8f865753d7f6170ee0b40171dffaea063aec05bba9f66eb322e9851
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_070-1a}
body:
  text: 訐棠張喬劇燕任濤張蠙鄭谷溫憲李昌符王穀李山甫伊潘鍾離權許棠分與仙山背多年負翠微無因隨鹿去只是送人歸頂朩晴摩日根嵐曉潤衣㑹於猿鳥外相對掩高飛棠旅中送人歸九華詩也大抵棠詩多隱如䁱嶂猿窺戶寒秋鹿砥氷當空吟待月到晚坐看山類恬淡絶物者然非真好也棠字文化宣州涇縣人登咸通十二年進士第有洞庭詩為工時號許洞庭初為涇縣尉鄭谷以詩送云白頭新作尉縣在故山中髙第能卑宦前賢尚此風蕪湖春蕩漾梅雨晝溟濛佐理人安後篇章莫廢功棠洞庭詩有四顧疑無地中流忽有山之句人以題扇過洞庭云驚波常不定半日鬢堪班四顧疑無地中流忽有山鳥飛應畏墮帆逺却如間漁父時相引行歌浩渺間張喬喬池州人有詩名咸通中與許棠俞坦之劇燕任濤吳宰張蠙周繇鄭谷李栖逺溫憲李昌符謂之十哲十二人十哲而咸通中京兆府解試月中桂詩喬擅場云與月轉洪濛扶踈萬古同根非生下土葉不墜秋風每以圓時足還隨缺處空影髙群朩外香滿一輪中未種丹霄日應虛白兔宫如何當羽化細得問神功其年李建州頻主試府參軍時為京兆以許棠老於場屋以為首薦未幾巢寇為亂遂與伍喬之徒隱九華喬送許棠云離鄉積歲年歸路逺依然夜火山頭市春江樹抄船干戈愁鬢改瘴癘喜家全何處營甘㫖潮濤浸薄田喬與俞坦之受知許下薛尚書能許棠首薦能以詩唁二子曰何事盡參差惜哉吾子詩日令銷此道天亦負明時有路當重振無門即不知何當見堯日相與啜澆漓喬逰終南白鸖觀詩云上徹鍊丹峯求玄意未窮古壇青草合往事白雲空仙境日月外帝鄉煙霧中人間足煩暑欲去戀清風送友人歸宜春云落花兼柳絮無處不紛紛逺道空歸去流鶯獨自聞野橋喧磑水山郭入樓雲故里南陔曲秋期更送君鄭谷題喬廷興門外所居云平生苦節同旦夕㑹原東掩卷斜陽裏看山落朩中星霜人欲老江海業全空近日文場裏因君起古風劇燕劇燕蒲版人也工為雅正詩王重榮鎮河中燕投贈王曰秪向國門安四海不離鄉井拜三公重榮甚禮重為人多縱凌轢諸從事竟為平正之禍任濤任濤豫章筠川人也詩名早著有露團沙鸖起人卧釣船流他皆倣此數舉敗於垂成李常侍騭廉察江西特與放鄉里之役盲俗互有論列騭判曰江西境內凡為詩得及濤者即與放色役不止一任濤耳李建州頻主京兆解試時濤與許棠張喬俞坦之劇燕吳罕張蠙周繇鄭谷李栖逺溫憲李昌符謂之十哲是年試俱以次得之是嵗咸通末也月中桂詩張喬擅場頻以許棠場屋多年為首薦張蠙詠葦詩云葦叢寒水邊曾折釣漁船咸喜亭臺近翻嫌島嶼偏花明無月夜聲急正秋天遙憶巴陵渡殘陽一望煙送友人赴涇州幕云杏園沉飲散榮别就佳招日月相期盡山川獨去遙府樓明蜀雪關磧轉胡鵰縱有煙塵動應隨上䇿銷蠙字象文唐末登第尉擽陽避亂入蜀王蜀時為金堂令徐后遊大慈寺見壁間題云墻頭細雨垂纖草水面回風聚落花問寺僧僧以蠙對乃賜霞光箋令寫詩以進蠙進二百首衍善之召為知制誥宋光嗣以蠙輕忽傲物遂止卒於官蠙生頴秀幼有單于臺詩曰白日地中出黃河天外來為世所稱鄭谷殘月如新月云榮落何相似初終却一般猶疑和夕照誰信墜朝寒水國光華別詩情比象難佳人應誤拜捿鳥返求安屈指期輪滿何心誚影殘庾樓清賞處吟徹曙鍾看谷自序云幼受知於李公朋馬博士戴求試春闈故薛許昌能李建州頻不以晚輩見待逰舉場十六年著述千餘首乾寧初上幸三峯朝謁多暇寓止雲臺道舍遂拾墜補遺成三百首目為雲臺編谷字愚袁州人故永州刺史之子幼年司空圖與刺史同院見而奇之曰曾吟得丈丈詩否曰吟得莫有病否曰丈丈曲江晚望斷篇云村南斜日間回首一對鴛鴦落渡頭即深意矣司空嘆惜撫背曰當為一代風騷主乾寧中為都官郎中卒于家谷自叙云故許昌薛尚書能為都官郎中後數年建州李員外頻自憲府內彈拜都官員外皆一時騷雅宗師都官之曹振盛於此余早受知今忝此官復是正秩何以相繼前賢耶谷詠雪詩云亂飄僧舍茶煙濕密灑髙樓酒力微江上晚來堪畫處漁翁披得一蓑歸有假贊善者善畫因採其詩意寫之成圖曲盡瀟灑之意持以贈谷谷為詩寄謝云贊善賢相後家藏名畫多留心於素繪得意在煙波屬興同吟詠功成更琢磨愛余風雪句幽絶寫漁蓑濃淡方春滿蜀鄉半隨風雨斷鶯腸浣花溪上堪惆悵子美無情為發揚谷蜀中海棠詩也相看臨逺水獨自上孤舟句潮來無别浦朩落見他山句情多最恨花無語愁破方知酒有權句關東多事日天末未歸心句捲卷斜陽裏看山落朩中句兩浙尋山遍孤舟帶鸖歸句長安一夜殘春雨右省三年老拾遺句班趍黃道急殿揖紫宸深句已上皆谷詩警䇿題杭州樟亭云故國江天外登臨返照間潮平無别浦朩落見他山沙鳥晴飛逺漁人夜唱間嵗窮歸未得心逐片帆還感興云禾黍不陽艷競栽桃李春翻令力耕者半作賣花人曲江春草云花落江堤簇晚煙雨余江色逺相連香輪莫輾青青破留與愁人一醉眠十日菊云節去風愁蝶不知曉庭還繞折殘枝自緣今日人心别未必秋香一夜衰石城云石城昔為莫愁鄉莫愁魂散石城荒江人依舊棹舴艋江岸還飛雙鴛鴦帆去帆來風浩渺花開花謝春悲凉煙濃草逺望不盡千古漢陽間夕陽卷末偶題云一卷踈蕪一百篇名成未敢便忘筌何如海日生殘夜一句能令萬古傳谷不喜高仲武間氣集而喜殷璠河嶽英靈集嘗有詩云殷璠鑒裁英靈集頗覺同才得㫖深何事後來髙仲武品題間氣未公心品題唐人詩仲武璠二集皆溫憲溫憲貟外廷筠子也僖昭之間就試於有司值鄭相延昌掌邦貢也以其父文多刺時復傲毁朝士抑而不録既不第遂題一絶於崇慶寺壁後滎陽公登大用因國忌行香見之憫然動容暮歸宅已除趙崇知舉即召之謂曰某頃主文衡以溫憲廷筠之子深怒嫉之今日見一絶令人惻然幸勿遺也於是成名詩曰十口溝隍待一身半年千里絶音塵鬢毛如雪心如死猶作長安下第人杏花詩云團雪正晴梢江明映碧寥店香風起夜村白雨休朝靜落頻沾帶繁開正蔽條淡然間賞玩無以破妖韶憲光啓中為山南從事李巨川草薦表盛述先人之屈曰娥眉先妬明妃為去國之人猿臂自傷李廣乃不侯之將溫終於山南從事李昌符送琴客詩云楚客抱離思蜀琴留恨聲坐來看月落聽久覺秋生夜靜騷人語天髙别鸖鳴因君興一歎竟夕亦難平秋晚歸故居云馬省曾行處連嘶渡晚河忽驚鄉樹出漸識路人多細徑穿禾黍頽垣壓薜蘿乍歸猶似客鄰叟亦相過傷春云酒醒鄉關逺迢迢聽漏終曙分林影外春盡雨聲中鳥思江村路花殘野岸風十年成底事贏馬倦西東鄭谷寄膳部李郎中昌符詩云鄠郊陪野步早嵗偶因詩自後吟新句長愁減舊知靜燈微落燼寒硯旋生澌夜夜冥搜苦那能鬢不衰昌符字嵓夢登咸通四年進士第歷尚書郎塞上行云漭滄蘆關北孤城帳幕多客軍甘入陳老將望回戈樹盡禽捿草氷堅路在河汾陽尋下世羌虜肯先和北夢瑣言云咸通中前進士李昌符有詩名久不登第常嵗卷軸怠於裝修因出一奇乃作婢僕詩五十首於公卿間行之其間有詩云春娘愛上酒家樓不怕歸遲揔不憂推道那家娘子卧且留教住待梳頭又云不論秋菊與春花箇箇能噇空肚茶無事莫教頻入庫一名間物要㱔㱔諸篇皆中婢僕之諱浹旬京域盛傳是年登第與夫桃杖虛靴事雖不同用奇即無異也王轂暑日題道傍樹云火輪逆熖燒長空浮埃撲面愁濛濛羸童走馬喘不進忽逢碧樹舍清風清風留我移時住滿地濃隂懶前去却歎人無及物功不似團團道傍樹鴻門宴云寰海沸兮爭戰苦風雲愁兮㑹龍虎四百年漢欲開基項莊一劒何虛舞殊不知人心去暴秦天意歸明主項王足底踏漢土席上相看渾未悟轂字虛中宜春人登乾寧進士第有玉樹曲云陳宫內宴明朝日玉樹新粧逞嬌逸三閣霞明天上開靈鼉振攂神仙出天花數朵風吹綻對舞輕盈瑞香散金管紅絃旖旎隨霓旌玉佩參差轉壁月夜滿樓風輕蓮舌泠泠詞調新當行狎客盡居祿直諫犯顔無一人歌舞未終樂未闋晉王劒上粘腥血君臣猶在醉鄉中一面已無陳日月聖唐御宇三百祀濮上桑間宜禁止請停此曲歸正聲願將雅樂調元氣轂未及第時輕忽被人毆擊揚聲曰莫無禮吾便是君臣猶在醉鄉中一面已無陳日月毆者斂衽慙謝而退轂唐末為尚書郎中致仕轂始與崔胤同在庠序相善將赴舉胤餞之有日者在坐曰待此郎為相乃登第二十年胤為相轂遂登第李山甫咸通中數舉進士被黜依魏府樂彥禃幕府內樂禍且怨中朝大臣導彥禎子從訓伏兵殺王鐸劫其家嘗有詩云勸君莫用誇頭角夢裏輸羸總未真譏執政也巢冦之亂翰林待詔王遨者北逰在鄴山甫遇於道觀謂曰幽蘭緑水可得聞乎遨應命奏之曲終澘然曰憶在咸通玉亭秋夜供奉至尊不意流離至此也山甫賦詩曰幽蘭緑水耿清音歎惜先生枉用心世上幾時曾好古人前何必獨霑襟句未成山甫亦自黯然悲其不遇也貧女云平生不織綺羅裳間把荆簮益自傷鏡裏祗應諳素㒵人間多是重紅粧當年未嫁還憂老終日求媒即道狂兩意定知無處說暗垂珠淚滴蠶筐贈處士琴云情知此事少知音自是先生枉用心世上幾時曾好古人間何必更沾襟致身不以笙篁巧悅耳寧知鄭衛淫三尺絲桐七條線子期師曠兩沉沉國初髙英秀者與贊寧為詩友辨捷滑稽嘗譏古人詩病云山甫覽漢史王莾弄來曾半破曹公將去便平沉是破船詩李羣玉詠鷓鴣方穿詰曲崎嶇路又聽鈎輈格磔聲是梵語詩羅隱曰雲中雞犬劉安過月裏笙歌煬帝歸是見鬼詩杜荀鶴今日偶題題似著不知題後更誰題此衛子詩也不然安有四蹄伊璠璠及第後寄梁燭處士云繡轂尋芳許史家獨將羈思逹江沙十年辛苦一枝桂二月艷陽千樹花鵬化四溟歸碧落鸖捿三島接青霞同袍不得同逰玩今對春風日又斜璠登咸通四年進士第曾為涇陽令至黃巢亂璠陷冦屢脫命於刃下其後逃避與其家相失夜至藍關猛獸搏而食之鍾離權邢州開元寺有唐鍾離權處士二詩其一云得道髙曽不易逢幾時歸去願相從自言住處連滄海别是蓬萊第一峯其一云莫厭追歡笑語頻尋思離亂好傷神間來屈指從頭數得見清平有幾人唐詩紀事卷第七十
