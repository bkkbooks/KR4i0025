  text: 唐詩紀事巻第五十一
  hash: sha256:883e1a31b135c4a55f9daa91d72997a49ea817bea0d7f2f64e88d88e6a5dee89
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_051-1a}
body:
  text: 白敏中魏扶馬植崔鉉殷堯藩沈亞之裴夷直楊敬之房千里厲元喻亮楊衡符載王彦威繁知一楊洵美白敏中敏中字用晦武宗欲召用居易徳裕即薦敏中文類其兄而有器識即日知制誥宣宗立徳裕貶乃力詆之五年十三遷至門下侍郎咸通二年以太傅致仕卒至日上公獻夀酒云候曉天門闢朝天萬國同瑞雲昇觀闕香氣映華宫日色臨仙籞龍顔對昊宫羽儀瞻百姓獻夀侍三公化被君王洽恩沾草朩豐自欣朝玉座宴此詠皇風敏中方為郎唯李徳裕時以國器重之大中初邉鄙不寧吐蕃屈强宣宗决於致討延英先問宰臣敏中首奏興師遂為統帥宣宗初覽捷書云我知敏中必殄兇醜敏中凱旋與同列宰輔進詩敏中詩云一詔皇城四海頒醜戎無數束身還戍樓吹笛人休戰牧野嘶風馬自閑河水九盤收數曲天山千里鎻諸闗西邊北塞今無事為報東南夷與蠻魏扶詩云蕭關新復舊山川古戍秦原景象鮮戎虜乞降歸恵化皇威漸被懾腥膻穹廬逺戍煙塵滅神武光揚竹帛傳左袵盡知謌帝澤從兹不更備三邉崔鉉詩云邊陲萬里注恩波宇宙羣方洽凱歌右地名王爭觧辮逺方戎壘盡投戈煙塵永息三秋戍瑞嵗遙清九折河共偶聖眀千載運更觀俗阜與時和王起長慶中再主文柄意欲以第一人處敏中恨其與賀拔惎為友惎有文而落魄因宻令親知述意俾與惎絶敏中欣然曰如所教既而惎造門左右紿以敏中他適惎遲留不言而去俄頃敏中躍出見惎於是悉以實告乃曰一第何門不致奈輕負至交相與歡醉或語於起起曰我此只得敏中今當更取惎矣遂以第一人處惎而敏中居三焉杜牧云今皇帝一詔㑹兵不日功集河湟關郡次第歸降因獻詩云捷書皆應運謀期十萬曽無一鏃遺漢武慙誇朔方地宣王休道太原師威加塞外寒來早恩入河源凍合遲聽取滿城歌舞曲凉州聲韻喜參差牧又和敏中詩呈上三相云行看臘破好年光萬夀南山對未央黠戞可汗修職貢文思天子復河湟應湏日御西廵狩不假星弧北射狼吉甫裁詩歌盛業一篇江漢美宣王牧又作河湟詩云元載相公曽借筯憲宗皇帝亦留神旋見衣冠就東市忽遺弓劔不西巡牧羊驅馬雖戎服白髪丹心盡漢臣唯有凉州歌舞曲流傳天下樂閑人魏扶扶登太和四年進士第大中初知禮闈入貢院題詩云梧桐葉落滿庭隂鎻閉朱門試院深曽是當年辛苦地不將今日負前心牓出無名子削為五言詩以譏之李羲叟義山第也是嵗登第義山因上魏公詩曰國以斯文重公仍内署才風標森太華星象逼中台朝滿遷鸎侣門多吐鳳來寧同魯司冦只鑄一顔回馬植敏中之㨗植時為相和敏中詩云舜徳堯仁化犬戎許提河隴欵皇風指揮貙武皆神筭恢拓乾坤是聖功四帥有征無汗馬七關虽戍已殁弓天留此事還英主不在他年在大中同華解最利元和中令狐楚鎮三峯時及秋賦牓云特加試五場莫有至者唯盧洪正請試已試兩場而植不觧植將家子從事竊笑曰此未可知已而試登山採玉賦略曰文豹且異於驪龍採斯踈矣白石又殊於武􅑕剖莫得之公大伏其精遂奪解元後洪正自丞郎將判鹺俄為植所據復以手札戲植曰昔日華元已遭毒手今來鹺務又中老拳植罷安南都䕶又除黔南殊不得意維舟峽中古寺寺前有長堤夜月明甚見白衣緩歩堤上吟曰截竹為筒作笛吹鳳凰池上鳳凰飛勞君更向黔南去即是陶鎔萬類時邀問則失之矣後自黔南召入爲大理遷刑判鹽鐵拜相植字存之爲李徳裕所抑頗怨望宣宗立白敏中當國凡徳裕所不善悉不次用之故植遂相崔鉉魏公鉉元略之子也爲兒時隨父訪韓晉公滉滉指架上鷹令詠焉吟曰天邊心膽架頭身欲擬飛騰未有因萬里碧霄終一去不知誰是觧絛人滉曰此兒可謂前程萬里也寳曆三年登第久居廊廟三擁節旄宣宗嘗謂侍臣曰崔鉉真貴也裴休真措大初李石鎮江陵辟為戎倅一旦告去既入京華俄昇翰苑造朝凡三嵗石未離荆渚崔既秉鈞衡石馳牋賀之曰某早拜光塵叨承眷與深蒙異分屢接清言幸曽顧於厚恩俯見循於末契去載分麾南楚拜節西秦思賢方詠於嘉魚棲止實慙於威鳳賔筵初啟曽陪罇俎之歡將幕未移已在陶鎔之下光生隣蔀喜溢轅門豈唯九土獲安斯亦一方多幸乃掌記李隲之詞也鉉字台碩相武宗與李徳裕不叶罷復相宣宗除楊州大都督府長史封魏國公宣宗於太液亭賦詩宴餞有七載秉鈞調四序之句識者榮之殷堯藩元和九年韋貫之掌文衡堯藩雜文黜矣尚書楊漢公乃貫之前牓門生盛言堯藩屈貫之為之重收是年登第既落復收摭言謂之三月初三日千家與萬家蝶飛秦地草鶯入漢宫花鞍馬皆爭麗笙歌盡闘奢吾師無所願唯願老煙霞曲水公卿宴香塵盡滿街無心修禊事獨歩到禪齋細草萦愁目繁花逆旅懐綺羅人走馬遺落鳳凰釵贈都上人二章巳上堯藩登第許渾贈詩云㡬載聞名翰墨林為從知已信浮沉青山有雪諳松性碧落無雲稱鸖心帯月獨歸蕭寺逺翫花頻醉庾樓深尋思一見如瓊樹空把新詩舊日吟堯藩從李翺長沙莫府後以侍御官江南姚合有送堯藩歸同州詩堯藩為永樂令雍陶寄詩云古縣蕭條秋景晚昔時陶令亦如君堯藩有憶江南詩三十章皆蘇杭事樂天詩曰江南名郡數蘇杭寫在殷家三十章君是旅人猶苦憶我爲刺史更難忘堯藩有宫詞云呉宫愛歌舞夜夜醉嬋姢見日吹紅燭和塵掃翠鈿徒令句踐霸不信子胥賢若問長洲草荒凉無限年又有館娃宫詩云宫女三千去不回眞珠翠羽是塵埃夫差舊國久破碎紅鷰自歸花自開又有暮烟葵葉屋秋月竹枝歌句欲射狼星把弓箭休將荧火讀詩書句右張爲取作主客圗堯藩未第時許渾寄詩云直道知誰用經年向水濵宅從栽竹貴家爲買書貧就學多新客登朝盡故人蓬萊自有路莫羡武陵春又詶堯藩云相如愧許詢寥落向溪濵竹馬兒猶小荆釵婦慣貧獨愁憂過日多病不如人莫恠青袍選長安隱舊春沈亞之字下賢登進士第大和初李同捷反詔兩河諸鎮出兵反無功乃授柏耆徳利行營諸軍計㑹使亞之以殿中侍御史為判官諭㫖㑹李祐平徳州同捷窮請䧏耆乃馳入滄誅同捷諸將嫉其功比奏攅詆文宗不獲已貶耆循州司戸參軍亞之南康尉張祐以詩送云秋風江上草先是客心摧萬里故人去一行新鴈来山髙雲緒斷浦迥日波頽莫恠南康逺相思不可裁亞之呉人元和七年不第李賀以詩送云吴興才人怨春風桃花滿陌千里紅紫絲竹斷駿馬小家住錢塘東復東是也杜牧之贈詩云斯人清唱何人和草逕苔荒不可尋一夕小敷山下夢水如環珮月如襟亞之村居詩云無樹巢宿鳥無酒共客醉月上蟬韻殘梧桐隂繞地獨出村舍門吟劇㣲風起蕭蕭蘆荻叢呌嘯同山鬼應緣我憔悴為我發愁思五月發石頭城歩望前船示弟詩云客子去淮陽蹉跎客夢長水關開夜鏁霧掉起晨凉烟月期同賞風波忽異行隱帆撼轉瀬指遙墻蒲葉錢刀綠筠筒楚粽香因書報恵逺為我憶檀郎李商隱擬沈下賢詩云千二百輕鸞春衫痩着寛倚風行稍急含雪語應寒帯火遺金斗兼珠碎玉盤河陽㸔花過曽不問潘安裴夷直王質傳云李徳裕擢為河南尹宣歙觀察使幕府若河東裴夷直天水趙晢隴西李行方梁國劉蕡皆一時選云獻蕡書情云白髪添雙鬢空宫又一年音書鴻不到夢寐兎空懸地逺星辰側天髙雨露偏聖期知有感雲海慢相連同樂天中秋夜洛河翫月二首詩云清洛半秋懸璧月練船當夕泛銀河蒼龍頷底珠皆没白帝心邊鏡乍磨海上㡬時霜雪積人間此夜管絃多須知天地為鑪意盡取黄金鑄作波又云不熱不寒三五夕晴川朗月正相臨千珠競没蒼龍頷一鏡髙懸白帝心㡬處凄凉縁地逺有時惆悵值雲隂如何清洛如清晝共見初升又見沉李景遜傳云所善蘇滌裴夷直皆為宗閔嗣復所擢故景遜在㑹昌時抑厭不遷夷直字禮卿文宗時為右拾遺張克勤以五品官推與其甥夷直時為禮部外郎劾曰是開後日賣爵之端詔聽遂著于令為中書舍人武宗立視冊牒不肯書出刺杭州斥驩州司戸叅軍宣宗初復拜江華等州刺史終散騎常侍夷直戯唐仁烈詩云自知年㡬偏應少先把屠蘇不讓春儻更數年逢此日遂應惆悵羡他人楊敬之禾黍正離離南園翦白芝細腰沉趙女髙髻唱蠻姬路愧前㟠月梳慚一頷絲鄉人不可語獨念畏人知吟敬之客思姚合寄楊祭酒云日日新詩出城中冩不禁清光冝對竹閑雅勝聞琴門戸饒秋景兒童觧令吟雲山持管盡莫惜别人尋敬之字茂孝文宗命為祭酒兼太常少卿是日二子戎載登科時號楊家三喜敬之華山賦最為韓愈李徳裕所稱士林一時傳布霜樹烏棲夜空街雀報眀碧山相倚暮歸鴈一行斜右張為取作主客國房千里房千里博士初上第逰嶺徼詩序云有進士韋滂者自南海邀趙氏而來為余妾西上京都調于天官乃乃與趙别約中秋為㑹期趙極悵戀余乃杼詩寄情曰鸞鳳分飛海樹秋忍聽鐘皷越王樓只應霜月明君意緩撫瑶琴送我愁山逺莫教雙淚盡鴈來空寄八行幽相如若返臨卭市畫舸朱軒萬里逰在蜀州萬里橋房至襄州逢渾侍御赴引農蕃揚之命乃以情意相託許到府邸遣人訪之則趙氏却從韋矣渾寄房詩曰春風白馬紫絲韁正值蚕眠未採枽五夜有心隨暮雨百年無節待秋霜重尋綉帯朱滕合却認羅裙碧草長為報西逰减離恨阮郎纔去嫁劉郎千里以罪居廬陵作所居竹室記云子方窮不能奮其處于是亦冝矣千里字鵠舉大和進士也終於髙州刺史馬使君與千里俱貶端州李羣玉留别詩云俱來海上嘆煙波君佩銀魚我觸羅經國才微甘放蕩専城年少豈蹉跎應憐旅夢千重思共愴離心一曲歌唯有管絃知客意分眀吹出感恩多厲元元日觀朝云玉座臨新嵗朝盈萬國人火連雙闕曉仗列五門春瑞雪銷鴛瓦祥光在日輪天顔不敢視稱慶拜空頻元大和二年進士終於侍御史有子自南登中和進士第元有從軍行云邊草旱不春劔花増野塵戰塲收驥尾清瀚怯龍鱗㠶色起歸越松聲厭避秦㡬時逢范蠡處處是通津右張為取作主客圗姚合題厲侍御所居云幽棲一畝宫清峭似山峰隣里不通徑俸錢惟買松野人時寄宿谷鳥自相逢朝路宋前是誰知曉起慵喻鳬元日即事云歛板賀交親稱觴詎有廵年光悲擲舊景色喜呈新水柳煙中重山梅雪後真不知將白髮何以度青春贈李商隱云羽翼恣摶扶山河使筆驅月踈吟夜桂龍失詠春珠草細盤金勒花繁倒玉壺徒嗟好章句無力致前途浴馬云解控復收鞍長津動細漣空蹄沉綠玉闊臆沒連錢沫漩橋聲下嘶盤栁影邊常聞禀龍性固與白波便姚合有送喻鳬歸毗陵詩云闕下詩名出鄉中賦籍除又曰吾亦家呉者無因見弊廬杜荀鸖叙雪寄鳬詩曰比時行逕無人迹唯望音徽問寂寥鳬毗陵人開成進士也卒於烏程令顔凋眀鏡覺思苦白雲知句滄洲迷釣隱紫閣負僧期句酬難塵鬢皓坐久壁燈青句滄洲未歸迹華髪受恩心句右張為取作主客圖北夢瑣言云鳬體閬仙為詩嘗謁杜紫徽不遇乃曰我詩無羅綺鈆粉冝其不售也鳬與方干友善于嘗贈詩云知心似古人嵗久分弥親離别波濤闊留連槐柳新蟇陵寒貰酒漁浦夜垂綸自此星居後音書豈厭頻又哭鳬詩云日夜役神多損夀先生下世未終年撰碑縦託登龍伴營奠應支賣馬錢孤壟隂風吹細草空牎濕氣漬殘篇人間别更無寃事到此誰能與問天楊衡初隱廬山有盗其文登第者衡因詣闕亦登第見其人盛怒曰一一鸖聲飛上天在否荅曰此句知兄㝡惜不敢偷衡笑曰猶可恕也隨雲歩入青牛谷青牛道士留我宿可憐夜久月明中唯有壇邊一枝竹牛宿青都無看花意偶到樹邊來可憐枝上色一一為愁開樹題花竹亭送姪偁云落葉寒擁壁清霜夜霑石正是憶山時復送歸山客殷勤一樽酒曉月當窓白寄廬山隱者云風鳴雲外鐘鸖宿千年松相思杳不見月出山重重哭李象云白鷄黄犬不將去寂寞空余葬時路草死花開更㡬年後人知是何人墓憶君思君獨不眠夜寒月照青楓樹邉思云蘇武節旄盡李陵音信稀花當隴上發人向壠頭歸仙女辭云玉笄初侍紫皇君金縷鴛鴦滿綘裙仙宫一閉無消息遥結芳心向碧雲孟東野有悼吴興楊衡詩云君生霅水清君死霅水渾空有骨肉親哭得日月昬大夜不復曉古松長閉門琴絃綠水絶詩句青山存昔為芳春顔今為芳草根獨恨冥漠理先儒未嘗言衡與符載者群隱廬山號山中四友衡寄徹公云北風吹霜霜月明荷葉枯盡越水清别來㡬度龍宫宿雪山童子應相逐題山寺云千峰白路後雪壁掛殘燈曙色海邊月經聲松下僧意閑門不閉年去水空澄稽首如何問森羅盡一乗送孔周之南海謁王尚書云泛棹送流萍桂寒山更青望雲生碧落看日下滄溟潮盡收珠母沙閑拾翠翎自趨龍㦸下再為頌芳馨符載載字厚之蜀人有竒才始與楊衡宋濟習業青城山衡擢第濟老死無成唯載以王覇自許耻於常調韋臯鎮蜀辟為支使雖曰受知尚多偃蹇臯嘗於二十四化設醮請撰齋詞于時陪飲於摩訶池載離席盥漱命小吏十二人捧硯人分兩題緩歩池間各授口占其敏速如此劉闢時為金吾倉曹參軍始依臯焉載與撰真賛云矯矯化初氣傑文雄靈螭出水秋鶚乗風行義則固輔仁乃通他年良覿麟閣之中及臯卒闢揔留務載亦在幕中及闢敗載遂免禍載居廬山遣三尺童子持數幅書乞買山錢百萬於于頔于即與之栁子厚賀趙江陵宗儒啓云伏聞以武都符載為記室天下立志之士雜然相顧繼以歎息知為善者得其歸嚮流言者有所間執直道之所行義風之所物堂堂焉實在荆山之南矣夫以符君之藝術志氣為時聞人才位未㑹盤旋固久中間因緣䧟在危邦與時偃仰不廢其道而為見忌嫉者横致唇吻房給事以髙節特立眀之於朝王吏部以清議自任辨之於外然猶小人浮議困在交㦸凡諸侯之欲得符君者城聮壤接而惑於騰沸環視相讓莫敢先舉及受署之日則皆開口垂臂悵望悼悔譬之採珠於海而徑寸先得則衆皆怏然罷去知竒寳之有所歸也嗚呼巧言難明下流多謗自非大君子出世之氣則何望焉瞻望清風若不在天外無任感激欣躍之至云劉闢房式傳式叅謀曰符載似謗也發兵書牒首曰闢副曰崔羣送載歸蜀覲省序云旄頭光明垂三十載不習俎豆化為侯王者十有八九焉由是隱逸憔悴羔鴈不行蒼山沈沈側陋不顯建中初有峨嵋客符君發六籍棹三湘深入匡廬絶跡半紀學窺顔子之門閾文紹陳君之骨鯁逸慕嚴光之垂釣志斆管寧之不欺結廬熙熙人不知其然也頊予奉命江西三年徃復彭蠡未嘗不詠湖月漱天倪造符君雲扃宿五老峰下動更晦朔不理還櫂偶丹霄至人白鸖羽客奉靈芝跪天壇相顧永息乎蓬瀛豈復又縈於塵網頼君超澹愴興舊遊雖笑語飲食如常終忽忽若居大夢君家在岷蜀展愛髙堂將聖賢典籍充人子幣帛期所以激衰俗扇清風方伯地君不以厚禮遲吾子予未之信秋九月楚人歌採蘭以送之或云載始隱廬山不為章句學正元中李巽為江西觀察薦其材授奉禮部郎為南昌軍副使繼辟西川韋臯掌記澤潞郄士美叅謀歴恊律郎監察御史卒嘗以牋叩襄陽樊澤曰故處士孟浩然丘壠頽沒公欲更築大墓久之未遑誠令好事者乗而有人負公夙志矣澤乃更為刻碑鳳林山南村寵其墓王彦威長安舊俗以不歷臺省出頷廉車節鎮者率呼為麁官大栾重内而輕外今東京皇城乾元門舊章武軍皷角樓也節度使王彦威有詩刻石在其上曰天兵十萬勇如貔正是酬恩報國時汴水波瀾喧皷角隋堤楊栁拂旌旗前驅紅斾闗西將坐間青蛾趙國姬寄語長安舊冠蓋麁官到底是男兒彦威自太常博士出辟使府至兹鎮故有是句後梁氏建國其石不知所在薛能亦有謝寄荼詩云麁官寄與真抛却頼有詩情合得嘗洪文館舊不置學士文宗特置一員以待彦威為户部侍郎邊兵訴所賜不時縑皆敝惡貶衛尉卿俄為忠武節度徙宣武卒繁知一樂天除蘇州刺史自峽㳂流赴郡時秭歸縣繁知一聞居易將過巫山先於神女祠粉壁大書之曰忠州刺史今才子行到巫山必有詩為報髙唐神女道速排雲雨候清詞居易覩處暢然邀知一至曰歷陽劉郎中禹錫三年理白帝欲作一詩而不能罷郡經過悉去千餘詩但留四章而已沈佺期詩曰巫山髙不極合沓竒狀新闇谷疑風雨幽崕若鬼神月眀三峽曙潮滿九江春為問陽臺客應知入夢人王無競詩曰神女向髙唐巫山下夕陽徘徊作行雨婉孌逐荆王電影江前路雷聲峽外長朝雲無處所臺舘曉蒼蒼皇甫冉詩曰巫峽見巴東迢迢出半空雲藏神女舘雨到楚王宫朝暮泉聲落寒暄樹色同清猿不可聽偏在九秋中李端詩曰巫山十二重皆在碧空中廻合雲藏日霏微雨帯風猿聲寒度水樹色暮連空悲向髙唐去千秋見楚宫居易吟四篇與繁生同濟卒不賦詩楊洵美荅李昌期詩云三山載群仙峨峨鹹浪中雲衣翦不得此路安可従我生亦何事出門如飛蓬白日又黄昬所悲瑶草空蟲聲故鄉夢枕上禾黍風吾道如未䘮天運何時通洵美登寳暦元年進士第終監察御史洵美有暮鵶不噪禁城樹衙鼓未殘兵衛秋之句洎荅昌期詩張為取作主客圗唐詩紀事巻第五十一
