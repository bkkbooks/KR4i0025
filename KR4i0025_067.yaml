front:
  text: 唐詩紀事卷第六十七
  hash: sha256:17445771dfd625119d45f7f4a370c9ed2069d73c5e585e512b6e1c4e5c89b0c1
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_067-1a}
body:
  text: 李嶸袁皓歐陽澥徐振李濤王貞白王祝劉谷李昌鄴王滌王碩陸貞洞李縞髙衢張綺韋氷薛昭緯鄭合敬許晝程賀裴鉶張孜顧雲李昭象李嶸李蔚鎮江淮有李嶸者獻詩云雞樹煙含瑞氣凝鳯池波待玉山澄國人久倚東關望擬築沙湜到廣陵後果入相袁皓皓書師曠廟文云吟篁怨桐天其聲乎鏘石鏗金天其文乎擊革鳴絲天其暢乎匏土之韻天其和乎天有至音寄斯八物先生不生斯音欎欎先生既生斯音在律嗚呼先生之耳時可求也先生之心不可得也大哉樂乎先生之無神乎愚固狂而不可攄先生之有神乎愚堅誠而乞其圖先生之耳有神乎化為天下之耳先生之心有神乎化為天下之心古者可以舒於今然後家家知舜琴羅隱贈袁侍御詩云風塵慚上品才業愧明時千里芙蓉幕何由話所思皓冝春人咸通進士龍紀集賢殿圖書使自稱碧池處士僖宗狩蜀皓時為倉部員外采李晟功烈為興元聖功録遍賜諸將表勵之皓初登第過嶽陽悅妓蘂珠以詩寄嚴使君曰得意東歸過嶽陽桂枝香惹蘂珠香也知暮雨生巫峽爭奈朝雲屬楚王萬恨只慿期尅手寸心唯繫别離腸南亭晏罷笙歌散回首煙波路渺茫嚴君以妓贈之皓及第後作云金榜髙懸姓字真分明折得一枝春蓬瀛乍接神仙侶江海回思耕釣人九萬摶扶排羽翼十年辛苦涉風塵升平時節逄公道不覺龍門是嶮津歐陽澥閩川歐陽澥者四門詹之孫也澥娶婦經旬而辭赴舉久不還家詩云黃菊離家十四年又云離家已是夢松年又云落日望鄉處何人知客情自憐十八年之帝鄉未遇知己也亦為燕詩以獻主司鄭愚曰翩翩雙燕畫堂開送古迎今幾萬回長向春秋社前後為誰歸去為誰來澥出入場中僅二十年善和韋中令在閣下澥即行卷及門凡十餘載未嘗一面而澥慶弔不虧韋公雖不言而心念其人中和初公隨駕至蜀命相時澥寓居漢南公以書令襄帥劉巨容俾澥計偕巨容得書大喜待以厚禮首薦之撰日遵路無何一夕心痛而卒巨容因籍澥答書呈於公公覽之憮然因曰十年不見灼然不錯徐振雷塘云九重城闕悲涼盡一聚園林怨恨長花憶所為猶自笑草知無道更應荒詩名占得風流在酒興催教運祚亡若問皇天惆悵事只應斜日照雷塘古意云擾擾都城曉又昏六街車馬五侯門箕山渭水空明月可是巢由絶子孫右二詩韋莊取為又元集李濤李濤長沙人也篇詠甚著如水聲長在耳山色不離門又掃地樹留影拂床琴有聲又落日長安道秋槐滿地花皆鱠炙人口溫飛卿任太學博士主秋試濤與衛丹張郃等詩賦皆榜於都堂王貞白貞白唐末大播詩名御溝為卷首云一派御溝水緑槐相蔭清此波㴠帝澤無處濯塵纓鳥道來雖險龍池到自平朝宗心本切願向急流傾自謂冠絶無瑕呈僧貫休休曰甚好只是剩一字貞白揚袂而去休曰此公思敏書一字於掌中逡巡貞白回欣然曰已得一字云此中􅉼帝澤休將掌中字示之一同天祐年中內試貞白扎翰狼藉帝覽拂下玉案有黃門奏此舉人有詩名御批曰粗通放貞白寄鄭谷曰五百首新詩緘封寄與誰秪慿夫子鑒不要俗人知火鼠重收布氷蠶乍吐絲直須天上手裁作領巾披僧貫休送貞白重試及第東歸云心苦酬心了東歸謝所知可憐經試者如折兩三枝雨毒逢花少山多愛馬遲此行三可羡正值倒戈時解圍江西昭宗皇帝頗為寒進開路崔合州凝典貢舉但是子弟無問文章其間屈人不少孤寒中唯程宴黃滔擅場之外如貞白張蠙詩題觀文古風皆臻前輩之閫閾者也貞白字有道王柷會昌時有題三鄉者曰余本若耶溪東與同志者二三紉蘭佩蕙每貪幽間之境玩花光於松月之亭竟晝綿霄往往志倦洎乎初笄至于五換星霜矣自後不得已從良人西入函關寓居晉昌里第其居逈絶囂塵花朩叢翠東西鄰二佛宫皆上國勝逰之最伺其間寂因遊覽焉亦不辜一時之風月也不意良人已矣邈然無依帝里芳春光景東邁涉滻水歷渭川背終南陟太華經虢略抵陜郊揖嘉祥之清流面女几之蒼翠凡經過之所皆曩昔宴笑之地銜冤加歎舉目魂銷雖殘骸尚存而精爽都失假使潘嶽復生無以悼其幽思也遂命筆聊題終不能滌其懷抱絶筆慟哭而東時會昌壬戌歲仲春十九日也詩曰昔逐良人西入關良人身殁妾空還謝娘衛女不相待為雨為雲歸舊山和者十人祝和三鄉詩云女几山前嵐氣低佳人留恨此中題不知雲雨歸何處空使王孫見即迷柷字不耀名家子唐末為給事中巢冦前典常州既亂寄江湖甚有時望及詔召經陜時王拱為帥凶暴以厚禮降接願居子姪之末柷堅不許拱怒罷宴命將吏速請離館害于途悉投其家于黃河時朝廷多故捨而不問柷一子行至襄州亦無故投井而卒劉谷三鄉詩云蘭蕙芬芳見玉姿路傍花笑景遲遲苧蘿山下無窮意併在三鄉惜别時李逞送谷詩云村樓西路雪初晴雲暖沙乾馬足輕寒澗渡頭芳草色新梅嶺外鷓鴣聲郵亭巳送輕車發山館誰將候火迎落日千峰轉迢遞知君回首望髙城又和谷除夜見寄云灞上家殊逺爐前酒易曛劉郎亦多恨詩憶故山雲李昌鄴三鄉詩云紅粉蕭娘手自題分明幽怨發雲閨不應更學文君去泣向殘花歸剡溪王滌三鄉詩云浣沙遊女出關東舊迹新詞一夢中槐陌栁亭何恨事年年回首向春風滌字用霖及景福進士第三鄉詩云李王謝兩風流王子沉淪謝子愁歸思若隨文字在路傍空為感千秋髙衢三鄉詩云南北千山與萬山軒車誰不思鄉關獨留芳翰悲前迹陌上恐傷桃李顔張綺三鄉詩云洛川依舊好風光蓮帳無因見女郎雲雨散來音信斷此生遺恨寄三鄉韋氷三鄉詩云來時歡喜去時哀家國迢迢向越臺待寫百年幽思盡故宫流水莫相催氷唐末為鄠令薛昭緯華州榜昭緯寄諸門生詩曰時君過聽委平衡粉署華燈到曉明開卷固難窺浩汗執公空欲慕公平機雲筆舌臨文健沈宋章篇發詠清自笑觀光輝闕自此昭緯以侍郎掌貢舉試未明求衣賦王贊圖為榜首薛保遜大中朝尤肆輕佻侵侮諸叔自起居舍人貶洗馬而卒昭緯其子也頗有父風嘗任祠部外郎時李系任小儀王蕘任小賔正旦立仗班退昭緯吟曰左金烏而右玉兔天子旌旗蕘遽請下句昭緯應聲曰上李系而下玉蕘小人行綴天復中自臺丞纍貶磎州司馬中書舍人顔蕘當制略曰陵轢諸父代嗣其凶薛存誠之子廷老廷老之子保遜保遜之子昭緯為乾寧禮部侍郎性輕率坐事貶磎州刺史鄭合敬合敬及第後宿平康里詩曰春來無處不間行楚閏相看别有情好是五更殘酒醒時時聞喚狀頭聲閏楚也妓合敬乾符三年登上第終諫議大夫許畫許畫者睢陽人天復四年大駕東幸駐蹕甘棠晝於此及第梁太祖長子大卿者常與晝屬和晝以卿為奧主隨駕至洛携同年醉梁祖私苐因折其牡丹主吏馳報梁祖大卿竊知之先遣行晝行遂亡命河北閩人黃遇嘗宰滑州衛南與晝聲迹不踈光化三年求選京師遇謗晝嘗笞背矣晝卞急時內翰吳融侍郎西銓獨孤損侍郎皆晝知己一旦晝造二君子自辨因袒而視之二公掩袂而入晝遇其年俱落晝中秋月云應是蟾宫别有情每逢秋半倍澄清清光不向此中見白髮爭教何處生間地占將真可惜幽窗分得始為明殷勤好長來年桂莫遣平人道不平程賀賀有君山詩時號程君山詩云曽逰方外見麻姑説道君山自古無云是崑崙山頂石海風飄落洞庭湖崔亞典眉州賀為廳僕崔見其風味不常問曰爾讀書乎曰薄涉藝文崔指一物令詠之雅有意旨因令歸選奬稱於諸公間凡二十五舉及第時中和二年也入京則館博陵之苐亞卒賀服縗三年裴鉶乾符五年鉶以御史大夫為成都節度副使題石室詩曰文翁石室有儀形庠序千秋播德馨古柏尚留今日翠髙岷猶藹舊時青人心未肯拋羶蟻弟子依前學聚螢更歎沱江無限水爭流秪願到滄溟時髙駢為使時亂矣故鉶詩有願到滄溟之句有微旨也鉶作傳竒行於世張孜懿僖之代有京兆張孜者耽酒如狂與李山甫善有雪詩云長安大雪天馬雀難相覔其中豪貴家搗椒泥四壁到處爇紅爐周回下羅羃暖手調金絲蘸甲斟瓊液醉唱玉塵飛困融香汗滴豈知飢寒人腳手生皴劈僖宗在蜀孜有傷時之作其間云著牙賣朱紫斷錢賖舉選帝還京相府遣人捕之孜易姓越淮而遁世傳孜夢李白歌有華山秀作英雄骨黃河㵼出縱橫才又云夢破青霄春煙霞無去塵若誇郭璞五色筆江淹却是尋常人顧雲雲字垂象池州鹺賈之子也風韻詳整與杜荀鸖殷文圭友善同肄業九華咸通中登第為髙駢淮南從事師度之亂退居霅川杜門著書宰相杜某奏雲與盧知猷陸希聲錢翊馮渥司空圗等分修宣懿德三朝實録皆一時之選也書成加虞部外郎乾寧初卒有文號鳯䇿聮華編藁昭亭雜筆雲在淮南李昭象以學仙詞寄之云記得初傳九轉方碧雲峯下祝虛皇丹砂未熟心徒切白日難留鬢欲蒼無路洞天尋穆滿有時人世羡劉郎仙人恩重何由報焚盡星壇午夜香蓋招隱之義也雲大順中制同羊昭業等十人修史雲至江淮遇髙逢休諫議時劉子長為僕射其弟崇望復在中書雲叩逢休希致先容逢休許之久矣雲臨岐請書授之一函甚草創雲微有惑潛啓閲之凡一幅並不言雲但曰羊昭業等擬將一尺三寸汗腳踏他燒殘龍尾道懿宗皇帝雖薄德不任被前件人羅織執太政者亦太悠悠雲歎而巳雲詠栁云間花野草總爭新眉皺絃乾獨不勻乞與東風殘氣力莫教虛度一年春雲為虞部郎中髙駢淮南從事駢章疏不恭皆雲之辭也雲著述目為鳯䇿聮華雲初下苐鄭谷有詩勉之云鳯䇿聮華是國華春來偶為上仙槎鄉連南渡思菰米淚滴東風避店花吟聒暮鶯歸廟院睡消遲日寄僧家一般情緒應相信門靜莎深樹影斜李昭象字化文池州刺史方玄之子父卒因家焉懿宗末年以文干相國路公嵓問其年曰十有七矣嵓年尚少尤器重之薦於朝將召試會嵓貶遂還秋浦移居九華與張喬顧雲輩為方外友龍紀中楊行密奔宣州以書招之不從題顧正字溪居云髙敞吟軒近釣灣塵中來似出人間若教明月休生桂應得危時共掩關春酒夜棊難放客短籬踈竹不遮山莫誇恬淡勝榮祿鴈引行髙未許間寄獻山中顧公員外云抽却朝簮著釣蓑近來聲迹轉巍峩祥麟避網雖山野丹鳯銜書即薜蘿乍隱文章情更逸久間經齊術翻多深慙未副吹噓力竟困風埃爭奈何山中寄崔諌議云半生猿鳥共山居吟月吟風兩鬢踈新句未嘗忘教化上才爭忍不吹噓全家欲去干戈後大國中興禮樂初從此升騰休説命祗希公道數封書喜杜荀鸖及第云深嵓貧復病榜到見君名貧病渾如失山川頓覺清一春新酒興四海舊詩聲日使能吟者西來步步輕赴舉出山留寄山居鄭參軍云還如費冠卿向此振髙名肯羡魚鬚美長誇鸖氅輕理琴寒指倦試藥黑髭生時泰難雲卧隨看急詔行唐詩紀事卷第六十七
