front:
  text: 唐詩紀事卷第三十三
  hash: sha256:026a6327146207f37cacb08134d57a99232eb2ab2c2d3c2ecaefbb73bb401b2a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_033-1a}
body:
  text: 李吉甫武元衡鄭絪獨孤良弼獨孤授李季何李應盧拱李觀裴度韋同則陳蛻李吉甫九日小園獨謡贈門下武相公云小園休沐暇暫與故山期樹杪懸丹棗苔隂落紫梨舞叢新菊遍繞格古藤垂受露紅蘭晚迎霜白薤肥上公留鳳沼冠劔俟清祠應命端居者長慙補衮詩武元衡九日致齋禁省和中書李相公云齋沐限中禁家山傳勝逰露寒潘省夜木落庾園秋蘭菊回幽步壺觴絶舊儔位髙天祿閣詞異半牢愁孤思琴先覺馳暉水共流明朝不相見清祀在圎丘唐次云都門去馬嘶灞水東流淺青槐驛路長白日離亭晚望望煙景微草木行人逺早秋西亭宴徐員外詩云鼎鉉辭台坐麾幢領益州曲池連月曉橫笛滿城秋有美皇華使曾同白社逰今來重相見偏覺艷歌愁元衡字伯蒼元和二年為相代髙崇文鎮蜀八年召還途經百牢關題石洞詩云昔佩兵符去今持相甲還天光臨井絡春物度巴山鳥道青冥外風泉洞壑間何慙班定逺辛苦玉門關送柳侍御裴起居云沱江水緑波喧鳥去喬柯南浦别離處東風蘭麝多長亭春婉娩層漢路蹉跎會有歸朝日班超奈老何又云望鄉臺上秦人去學射山中杜魄哀落日河橋千騎别春風寂寞斾旌回酬嚴司空荆南見寄云金貂再入三公府玉帳連封萬户侯簾捲青山巫峽曉雲凝碧岫渚宫秋劉琨坐嘯風清塞謝眺裁詩月滿樓白雪調高歌不得美人南國翠娥愁送張諫議赴闕云詔書前日下丹霄頭戴儒冠脫皂貂笛怨柳營煙漠漠雲愁江館雨蕭蕭鵷鴻得路爭先翥松桂凌霜貴後雕歸去朝端如有問玉關門外老班超又元集三詩韋莊元衡善為五言好事者傳之被之管絃嘗夏夜作詩云夜久喧暫息池臺惟月明無因駐清景日出事還生明日遇害初八年元衡自蜀再輔政時太微犯上相歷執法占者言今之三相皆不利始輕末重月餘李絳以足疾免明年十月李吉甫以暴疾卒至是元衡為盜所害年五十八始元衡與吉甫齊年又同日為宰相及出鎮分領楊益及吉甫再入元衡亦還吉甫先一年以元衡生月卒元衡後一年以吉甫生月卒吉凶之數若符會焉先是長安謡曰打麥麥打三三三既而旋其袖曰舞了也解者謂打麥者打麥時也麥打者謂暗中突擊也三三三謂六月三日也舞了也謂元衡之卒也元衡卒劉禹錫作佳人怨二章云寶馬鳴珂踏曉塵魚文匕首犯華茵適來行哭里門外昨夜華堂歌舞人秉燭朝天遂不回路人彈指望高臺墻東便是心傷地夜夜秋螢飛去來鄭絪奉和武相公省中宿齋酬李相公見寄云髙閣安仁省名園廣武廬沐蘭朝太一種竹詠華胥禁靜踈鍾徹庭開爽韻虛洪鈞齊萬物縹帙整羣書寒露滋新菊秋風落故蕖同懷不同賞幽意竟何如絪字文明善屬文所交皆天下名士憲宗初拜相默默居位四年罷為太子賔客太和中以太子太傳致仕卒絪守道寡欲所居不為烜赫事以篤實稱絪九日懷邵二詩云十嵗此辰同醉友登髙各處巳三年又懷林十二云情人共惆悵良友不同遊其重友如此又有九月十五日東亭望月詩云紫閣道流今不見紅樓禪客早曾聞獨孤良弼上巳接清明遊宴詩云上巳歡初罷清明賞又追閏年侵舊曆令節併芳時細雨鶯飛重春風酒醖遲尋花迷白雪看桞拆清絲淑氣如相待天和意為誰吁嗟名未立空詠宴遊詩良弼正元間進士也為左司郎中又有良史者登進士第獨孤綬投珠於泉詩云至道歸淳化明珠必棄捐天真來照乘成性却沉泉不是靈蛇吐非緣合浦還岸傍隨月落波底共星懸致遠終無脛懷貪遂息肩欲知恭儉德所寶在惟賢德宗多召學術之士躬自考試又制科宣政殿如稱旨即翹足高吟偏示宰臣曰此皆朕門生也獨孤綬所司試馴象賦及其本上上吟其句曰化之式孚則必受乎來獻物或違性斯用感於至仁上以綬為知去就故特書第三先是代宗朝越人獻象三十有二上悉放之於山之南而綬不辱其受獻不傷其放棄故賞其知去就焉綬舉博學宏詞吏部考當乙科子邵覆之置甲科人咨其公李季何立春日曉望三素雲詩云靄靄青春曙飛仙駕五雲浮雲初縹眇承蓋下氤氲薄影隨風度殊容向日分羽毛紛共逺環珮杳猶聞靜合煙霞色遙將鸞鶴羣年年瞻此節應許從元君季何登正元十一年進士第李應立春日曉望三素雲詩云玄鳥初來日靈仙望裏分氷容朝上界玉輦擁朝雲碧落流輕艷紅霓間綵文帶煙時縹眇向斗更氤氲髣佛隨風馭超遙出曉氛兹辰三見後希得從元君應登正元十一年進士第盧拱中元日觀法事云四孟逢秋序三元得氣中雲迎碧落步章奏玉皇宮壇滴槐花露香飄柏子風羽衣凌縹眇瑶轂輾虛空久慕餐霞客常悲習蓼蟲青囊如可授從此訪鴻蒙姚合送慮拱祕書遊魏詩云官間身自在詩儉語分明車馬應回晚煙花滿去塵楊巨源寄申州盧拱使君云領郡仍聞總虎貔致身還是見男兒小船隔水催桃葉大鼓當風舞柘枝酒坐微酣諸客倒毬場慢撥幾人隨從來樂事憎詩苦莫放窗中逺岫知元􅍬自唐歸京拱時為祕書郎以詩贈樂天兼以遺􅍬􅍬和云新識蓬山傑深交翰苑材連投珠作貫獨和玉成堆劇敵徒相軋羸師亦自媒李觀字元賔以文馳聲正元中卒於校書郎陸希聲序其文曰退之窮老不休終不能為元賔之辭使元賔後退之死亦不能及退之之質退之大革流弊落落有老成風元賔則不古不今卓然自作一體激揚發越若絲竹中有金石聲每篇得意處如徢馬在御蹀蹀不能止其所長如此觀贈馮宿云寒城上秦原遊子意飄飄黑雲截萬里獵火從中燒隂空蒸長煙殺氣獨不銷氷交石可裂風疾山如搖時無青松心顧我獨不凋宿裴友書齋云卧君山窗下山鳥與我言清風何颼颼松柏中夜繁久遊失歸趣宿此似故園林煙還近郊溪月落古原稚子不待曉花間出柴門正元八年宏詞試中和節詔賜公卿尺詩云淑節韶光媚皇明寵錫崇具寮頒玉尺成器幸良工豈止尋常用將傳度量同人何不取利物亦賴其功紫翰宣殊造丹誠厲匪躬奉之無失墜恩澤自天中裴度至日登樂遊園云隂律隨寒改陽和應節生祥雲觀魏闕瑞氣映秦城驗炭論時政書雲受嵗盈影移長日至霧斂逺霄清景暖仙梅動風柔御柳傾那堪封得意空對物華情公出討淮西過女几山下刻石題詩後果尅期平賊其詩云待平賊壘報天子莫指仙山示武夫由是淮蔡底平民安生業白居易作詩二百言繼公篇之未何處畫功業何處題詩篇麒麟高閣上女几小山前爾後多少時四朝二十年賊骨化為土賊壘犂為田一從賊壘平陳蔡民晏然騾軍成牛户鬼火變人煙生子巳嫁娶種枽亦絲綿皆云公之德欲報無由緣公今在何處守都鎮三川舊宅留永樂新居開進賢今公在何官被衮弭貂蟬戰袍破猶在髀肉生欲圓傍水間行詩云間餘何事覺身輕暫脫朝衣傍水行鷗鳥亦知人意靜固來相近不相驚公赴敵淮西題名華嶽廟之闕門大順中户部侍郎司空圖以一絶紀之曰嶽前大隊赴淮西從此中原息戰髀石闕莫教苔蘚上分明認取晉公題公正元中作鑄劔戟為農器賦其首云皇帝之嗣位三十載寰海鏡清方隅底平驅域中盡歸力穡示天下不復用兵其後作相立殊勳致太平巳見於文矣公題南莊云野人不識中書令喚作陶家與謝家樂天有詩云陶廬僻陋那堪比謝墅幽微不足攀何似嵩峰三十六長隨申甫作家山樂天求馬裴贈以馬因戲云君若有心求逸足我還留意在名姝引妾換馬之事樂天答云安石風流無奈何欲將赤驥換青娥不辭便送東山去臨老何人與唱歌正元八年公試宏詞有司以中和節詔賜公卿尺為題公詩曰陽和行慶賜尺度及羣公荷寵承佳節傾心立大中短長思合制逺近貴攸同共仰財成德將酬分寸功作程施有政垂範播無窮願續南山夀千春奉聖躬中書即事云有意效承平無功益聖明灰心緣忍事霜鬢為論兵道直身還在恩深命轉輕鹽梅非擬議葵藿是平生白日長懸照蒼蠅謾發聲嵩陽舊田地終使謝歸耕唐趙璘云晉公正元中作鑄劔戟為農器賦云觀其氣概巳有立殊勳致太平之意進士李為作淚及輕薄暗小四賦李賀作樂府多屬意花草蜂蝶之間二子終不逺大文字之作可以定相命優劣矣韋同則仲月賞花云梅花似雪柳含煙南地風光臘月前把酒且須判却醉風流何必待歌筵同則建中時詩人也有韋同正者登建中四年第陳蛻蛻肅代間人賦長安十五詠自序云蛻生長江淮間以詩句從賦僅十餘年矣今我后撫運澤及四夷蛻復得為太平人其華清宮詩有夢裏換春秋之句唐詩紀事卷第三十三
