front:
  text: 唐詩紀事卷第七十六
  hash: sha256:78d02400277a40b7faa09e6a5a68e56fdbe421f46b087ae55ea76eebd8bc5a6e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_076-1a}
body:
  text: 僧太易僧惟審僧滄浩僧良義僧志定僧栖霞僧曇翼僧清塞僧無悶僧文益僧修睦僧景雲僧太易贈司空拾遺云侍臣何事辭雲陛江上微吟見雪花望闕來承丹鳯詔開門空對野人家陳琳草奏才還在王燦登樓興不賖髙館更吟塵外客仍令歸路待瑶華僧惟審賦得聞曉鶯啼云卷簾清夢後芳樹引流鶯隔葉傳春意穿花送曉聲未調雲路翼空負桂林情莫盡關西興羈愁正厭生别友人云一身無定處萬里獨銷魂芳草迷歸路春衣滴泪㾗幾時休旅食向夜宿江村欲識異鄉苦空山啼暮猿春日旅懷呈知已云生涯萬事有蒼蒼應任流萍便越鄉春水獨行人漸逺故園歸路夜空長一聲隔浦猿啼夜數滴驚心淚滿裳不為知音皆鮑叔信憑江上厺茫茫僧滄浩留别嘉興知已云一座東林寺從來未下山不因尋長者無事到人間宿雨愁為客寒禽散未還空懷舊山月童子誦經間僧皎然下此詩已載僧良義秋山答盧鄴云風泉只向夢中聞身外無餘可寄君當户一輪唯曉月挂簷數片是秋雲右張為取此詩於主客啚僧志定唯有鐏前今夜月當時曽照墮樓人句梧桐葉老蟬聲死一夜洞庭波上風句右張為取作主客啚僧栖蟾再宿京口禪院詩云灘聲依舊水溶溶岸影參差對𣑽宫楚樹七回凋舊葉江人兩至宿秋風蟾蜍竹老搖踈白􅔽蓞池乾落謝紅多病支郎念行止曉來生計轉如蓬牧童云牛得自由騎春風細雨飛青山青草裏一笛一簔衣日出唱歌厺月明撫掌歸何人得似爾無是亦無非短歌行云蟾光堪自笑浮世懶思量身得幾時活眼開終日忙千門無壽藥一鏡有愁霜早向塵埃外光隂任短長宿巴江云江聲五千里㵼碧急於弦不覺日又夜爭教人少年一汀巫峽月兩岸子規天山影似相伴濃遮到曉船遊邊云邊雲四顧濃飢馬咬枯叢萬里八九月一身西北風戍營天正黑戰馬雪多紅昨夜東歸夢桃開晚色中寄南嶽元泰布衲云曹溪入室人終老甚孤群四十余年內青山與白雲松和巢鶴看果共野猿分海內僧來說髙名自小聞僧曇翼招隱詩云連峰數千里修林帶平津雲起逺山翳風至茰荒榛茅茨隱不見雞鳴知有人躡蹬踐其跡處處見遺薪乃知百代下固有上皇民僧清塞贈王道士云藥力資蒼鬢應非舊日身一為嵩嶽客幾葬洛陽人冰縫瓢探水雲根斧斷薪關西往來熟誰得水銀銀山舍秋思云一從雲水住曽不下西岑故水故園在秋庭秋葉深泉流通井脉蟲響出墻隂靜夜更聲徹寒燈獨自吟早秋别盧玄休云此别經歲久唯約半夜回野渡人初過前山雪未開鴈群逢曉斷秋色映春來是夜蘆花宿嚴家有釣臺贈幻群法師云北京從别後南越幾聽砧住久白髭出講長黃葉深香連鄰舍像磬徹逺巢禽寂寞應關道何人見此心送耿逸人南歸云南行隨越僧舊業一池菱兩鬢已如雪五湖歸挂罾夜濤鳴柵鎖寒葦露船燈此厺應無事却來期未能辭姚合云波濤千里隔抱疾亦相尋㑹宿逄髙燒辭歸值雨淋叢桑山店逈孤燭海船深尚有重來計知無省閣心早秋至郭徑書齊云暑消岡舍清間㘴有餘情石水生茶味秋風减扇聲逺雲收海雨靜角掩山城此地秋吟苦時來繞菊行送晏上人云絶頂無禪侣長懷落髮師齊歸門掩雪講徹樹生枝沙井泉燈疾秋鍾韵盡遲將行誰請住又爽禁城期送康沼歸建業云南朝秋色滿歸厺思何如帝業空城在民耕壞塜多月明臺獨上栗綻寺頻過籬下西江闊相思見白波贈柏岩禪師云野寺絶依念空山曽遍行老來披衲重病起讀經生乞食嫌村逺尋溪愛路平多年柏岩住不記柏岩名贈胡僧云瘦影無血色草履著從穿間語似持呪不眠同㘴禪背經來漢地袒膞過冬天情性人難㑹遊方應信緣贈絶粒僧云一齊難過日况復更休糧養力時行道聞鐘不上堂唯留煨藥火不寫化金方舊有山厨在從僧請作房晚秋江館云病寄西州居帶城傍門髙柳一蟬鳴澄江月上見魚擲荒徑葉乾聞犬行越嶠夜無侵閣色寺鍾凉有隔原聲故園賣盡休歸厺湖水秋來空自平贈李道士云布褐髙眠石竇春迸泉多濺黑沙巾昻頭說易常間客落手圍碁對俗人自算天年窮甲子誰同雨夜守庚申擬㱕太華何時厺他日相逢乞藥銀秋日同朱度餘懷少室舊隱云曽居少室黃河畔秋夢長懸未到回扶病十年離水石思歸一夜隔風雷荒齊幾度曽眠起晚菊頻經塵路來燈下此心誰共說傍松幽徑幾多苔宿隱靜寺云一宿五峰杯渡寺虛廊中夜磬聲分踈林未落上方月幽澗忽生平地雲髙鳥背泉生靜景逺人當燭想遺文暫來此地歇勞足望斷故園滄海濆湘漢懷傑公云一宿空山聽急流仍同賈客㘴孤舟逺書來隔巴陵雨雙鬢厺驚彭蠡秋不擬為身謀舊業終求斷榖隱蒿丘吾宗尚作無憀者中夜廢吟生旅愁重陽詩云雲木踈黃秋滿川茱茰風裏一樽前幾回為客逢佳節曽見何人再少年霜報征衣冷針指鴈驚幽隱泣雲泉古來醉樂皆難得留取窮通委上天師東洛人姓周氏少從浮圖法遇姚合而返初易名賀初與賈長江無可齊名賀哭柏岩師云林徑西風急松枝講抄餘凍髭亡夜剃遺偈疾時書地燥焚身後堂空卧影初此時頻泪下曽省到吾廬時島亦有詩云苔覆石床新師曽過幾春寫留行道影焚却㘴禪身塔院關松雪房廊鎖露塵自嫌雙泪下不是解空人時謂相侔云兩鬢已垂白五湖歸釣魚句夜濤驚柵鎖寒葦露船燈句谷水生茶味林風减扇聲句磬徹逺巢禽句伊流背行客嶽響答清猿句右張為作主客啚唐有周賀詩即清塞也秋宿洞庭云洞庭初葉下旅客不勝愁明月天涯夜青山江上秋一官成白首萬里寄滄洲只𬒳浮名繫寧無愧海鷗巴陵秋思云楊州已寒色楚田方刈禾歸心病起切敗葉夜來多細雨城蟬噪夕陽嶠客過故鄉余業在杳隔洞庭波嶽陽樓云平楚起寒色杪秋猶未還世情何處淡湘水向人閒空翠隱髙鳥夕陽歸逺山孤舟萬餘里惆悵洞庭間周賀三詩作方干滌上懷賀云就枕忽不寐孤懷興嘆初南譙收舊曆上苑絶來書暝雪細聲積晨鍾寒韻踈侯門昔彈鋏曽共食無魚僧無悶暮春送人云折栁亭邊手重携江烟淡淡草萋萋杜鵑不顧離人意更向落花枝上啼寒林石屏云草堂無物伴身間唯有屏風枕簟間夲向他山求得石却於石上看它山僧文益看牡丹云擁毳對芳叢由來趣不同髮從今日白花是厺年紅艷色隨朝露馨香逐晚風何須待零落然後始知空覩木平和尚云木平山裏人貌古言復少相看陌路同論心秋月皎懷衲線非蠶助歌聲有鳥城闕今日來一謳曽已曉僧修睦秋日間居云是事不相關誰人似此間卷簾當白晝移榻對青山野鶴眠松上秋苔長雨間嶽僧頻有信昨日得書還宿嶽陽開元寺云竟夕憑虛檻何當興歎頻往來人自老今古月長新風送沉漁唱松踈露鶴身無眠鍾又動幾客在迷津雪中送人北遊云然知心厺速其奈雪飛頻莫笑無危道雖平更陷人逺郊光接漢曠野色通秦此厺迢遙極却回應過春送邊將云人盡有離别而君獨無嗟言將身報國敢望祿榮家戰思風吹野鄉心月滿沙歸期定何日塞北樹無花睡起作云長空秋雨歇睡起覺精神看水看山㘴無名無利身偈吟諸祖意茶碾厺年春此外誰相識孤雲到砌頻賣松者云求利有何限將松入市來直饒人買去也向柳邊栽細葉猶粘雪孤根尚惹苔知君用心錯舉世重花開落葉云雨過間田地重重落盡紅翻思向春日肯信有秋風幾處隨流水河邊亂暮空祗應松自立而不與君同落花云一片又一片等間苔靣紅不能延數日開亦是春風公子歌聲歇詩人眼界空遙思故山下經雨兩三叢題田道者院云入門空寂寂真個出家兒有行鬼不見無心人謂癡古岩寒柏對流水落花隨欲别一何懶相於所恨遲題東林云欲厺不忍去徘徊吟繞廊水光秋淡蕩僧好語尋常碑古苔文疊山晴鍾韵長翻思南嶽上缺此白蓮香思齊已上人云同人與流俗相謂好襟靈有口不他說長年自誦經水聲秋後室山色晚來庭客問修何法指松千歲青送玄泰禪師云厺去厺何住一盂兼一瓶水邊寒草白鳥外晚峰青宿處林聞虎行時天有星回期誰可定浮世重看經三生石云聖迹誰㑹得每到亦徘徊一尚不可得三從何處來清宵寒露滴白晝野雲隈應是表靈異凡情安可猜景雲老僧云日照西山雪老僧門始開凍瓶粘柱礎宿火陷爐灰童子病歸去鹿麋寒入來齊鍾知漸近枝鳥下生臺溪叟云溪翁居處靜溪鳥入門飛早起釣魚厺夜深乘月歸露香菰米熟烟暖荇絲肥消灑塵埃外扁舟一草衣畫松云畫松一似真松樹且待尋思記得無曽在天台山上見石橋南畔第三株岑參有偃師東與韓樽同詣景雲上人即事云山隂老僧解楞伽潁陽歸客逺相過烟深草濕昨夜雨雨後秋風渡漕河空山終日塵事少平郊逺見行人小尚書磧上黃昏鐘别駕渡頭一歸鳥唐詩紀事卷第七十六
