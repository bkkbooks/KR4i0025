  text: 唐詩紀事卷第六十三
  hash: sha256:4daf07787eb390162f599015b10ce9f5f99dce1e3862a2f28d43be61c12ae443
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_063-1a}
body:
  text: 方干劉駕王駕衞凖詹雄顧非熊司馬圖秦韜玉潘誠胡駢髙駢潘緯武瓘于鄴路徳筵翁承賛韓垂方干早春云運行元化不參差四極中華共一時正氣纔隨灰律變殘寒便被栁條欺水融太澤陽春覺草緑根塵夜雨知不信風光疾於箭年來年去變霜髭越州使院竹云莫見凌雲飄粉籜湏知礙石作盤根細看枝上蟬吟處猶是笋時䖝食㾗月送緑隂斜上砌露凝寒色濕遮門列仙終日逍遥地鳥雀潜來不敢喧除夜云玉漏斯須即逹晨四時吹轉任風輪寒燈短燼方燒臈畫角殘聲已報春明日便爲經歳客昨朝猶是少年人新正定數隨年减浮世惟應百遍新干爲人質野毎見人設三拜曰禮數有三識者呼爲方三拜爲人脣缺連應十餘舉遂歸鏡湖後十數年遇醫補唇年已老矣鏡湖人号曰補唇先生鏡湖西島閑居詩曰寒居壓鏡心此處是家林梁燕欺春醉嵓猿學夜吟雲連平地起月向白波沉猶自聞鍾角栖身可在深又云無人如不容吾自縱天慵落葉憑風掃秋粳任水舂花朝連郭霧雪夜隔湖鍾身在能無事頭宜白此峰又感懐云至葉不得力到今猶苦吟吟成五字句用破一生心世路屈聲滿雲溪冤炁深前賢多晚逹莫怕鬢霜侵于爲詩如鸖盤遠勢投孤嶼蟬曵殘聲過别枝齊梁已來未之有也孫郃哭元英方先生云斗失文星落知是先生死湖上聞哭聲門前見彈指官無一寸禄名傳千万里死着紙衣裳生誰念朱紫我心痛其語淚落不能已猶喜爲補闕揚名獻天子干師徐凝干常刺凝曰把得新詩草裏論反語曰村裏老餘杭守謂干苦冷曰未能應卒因夜燕以飛字韻􅒛賦之干詩立成曰間世星郎夜燕時丁丁寒漏滴聲微琵琶絃促千般調鸎鵡盃深四散飛遍請玉容歌白雪髙燒紅燭照朱衣人間有此榮華事爭遣漁翁戀釣磯唐末宰臣張文蔚中書舍人封舜卿奏名儒不遇者十有五人請賜一官以蔚冥魂干其一也干寄李頻云山木又揺落望君還不還軒車何處去雨雪滿前山思苦寒星動鄉遥釣渚閑明年見名字唯我獨何顔又有題桃花塢周處士别葉云細泉出石飛難盡孤燭和雲濕不明何事懶於嵇叔夜更無書扎荅公卿又貽天目中峯客有枯井夜聞隣果落廢巢寒見别禽來之句張爲取作主客圖呉融贈干詩曰把筆尽爲詩何人敵夫子句滿天下口名䀨天下耳不識朝不識市曠逍遥閑徙倚一杯酒無万事一葉舟無千里衣裳白雲坐卧流水霜落風髙忽相憶惠然見訪留一夕一夕聽吟十數篇水榭林蘿爲岑寂拂旦捨我亦不辭携笻徑去隨所適無處覔雲半片鸖一隻僧可朋贈干詩云盛名傳出自皇州一舉參差便縮頭月裏豈無攀桂分湖中剛愛釣魚休童偷詩藁呈隣叟客乞書題謁郡侯獨泛短舟何限景波濤西接洞庭秋僧貫休贈詩云盛名與髙隱合近謝敷村第子已得桂先生猶灌園投綸侵海分得句覔雲根白日昇天路知君别有門李頻也弟子謂僧虚中悼干云先生在世日祗向鏡湖居明主未廵狩白頭閑釣魚烟莎一徑小洲島四隣踈獨有爲儒者時來弔舊廬孫郃元英先生傳曰先生新定人字雄飛章八元即先生外王父也廣明中和間爲律詩江之南未有及者始謁錢塘守姚公郃公視其貌陋初甚侮之坐定覽卷駭目變容而歎之先生一舉不得志遂遯扵㑹稽漁於鑑湖與鄭仁規李頻陶詳爲三益友弟子洪農楊弇釋子居逺先生卒弇編其詩請舍人王賛爲之序賛序云張祐升杜甫之堂方干入錢起之室云劉駕呉中懐古云勾踐飲膽日呉王酒滿盃笙歌入海雲聲自姑蘇來西施舞初罷侍兒整金箆衆女不敢妬自比泉下泥越鼓聲騰騰呉王隔黄溪難將角東地更學㑹稽栖上已云上已曲江濵喧於市井路相尋不見者此地皆相遇日光去此遠翠幕張如霧何事歡娱中易覺春城暮物情重此節不是愛芳樹明日花更多何人肯回顧駕與曹鄴友善工古風鄴大中時擢第不出京候駕登科同去馬上續殘夢馬嘶而復驚心孤多所慮僮僕近我行句只恐塞上山低於沙中骨句蒲帆出浦去但見滴邊樹不如馬行郎馬跡猶在路大舟不相載買宅令妾住莫道留金多本非愛郎冨句右張爲取作主客圖王駕司空圖喜王駕小儀重陽相訪云白菊初開卧内明聞君相訪病身輕罇前且撥傷心事谿上還隨覔句行幽鸖傍人疑舊識殘蟬向月噪新晴擬將寂寞同留住且勸康時立大名僖宗幸蜀駕下第還蒲中鄭谷以詩送云孤单取仕休言􅒛早晚逢人苦愛詩後有次韻王駕校書結綬見寄之什云直應歸諫苑方肯别山村勤苦常同業孤單共感恩駕夏雨詩云非惟消旱暑且喜救生民天地如園林似却春洗風清枕簟換夜失埃塵又作豊年望田夫笑向人駕字大用河中人登大順進士第仕至禮部員外郎自稱守素先生與圖谷相爲詩友衞凖亦作单莫言閑話是閑話徃徃事從閑話來句何必剃頭爲弟子無家便是出家人句有張爲取前句作主客圖凖大歷五年登進士第詹雄塵飛遺恨盡花落古宫平城句洛陽古紅粉笙歌人代逺月明陵樹水東流堂句銅雀右張爲取作主客圖顧非熊寄費冠卿云先生九華隠鳥道隔塵埃石室和雲住山田引燒開久閑仙客降髙卧詔書來一人深林去人間更不回長安清明言懐云明時帝里遇清明還逐逰人出禁城九陌芳菲冩心轉万家車馬雨初晴客中下第逢今日愁裏看花猒此生春色來年誰是主不堪悲悴更無成非熊滑稽好凌轢在舉場垂三十年長慶中登苐劉得仁賀以詩云愚爲童稚時已解念君詩及得髙科晚須逢聖主知成名歸茅山項斯送以詩曰吟詩三十載成此一名難自有恩門人全無帝里歡湖光愁裏碧嵓影夢中寒到後於松月何人共曉看非熊大中時自盱貽簿弃官隠茅山非熊况之子曰叚成式云况始喪子年七十况哭之曰老人喪愛子旦暮哭成血聲逐斷猿悲跡隨飛鳥滅老夫已七十不作多時别後再生子七歳其兄戯批之忽曰我尔之兄何故批我乃叙前生事歷歷不誤即非熊也姚合送非熊下第歸越詩云失意尋歸路親知不復過家山向城遠日月在舩多楚塞數逢㕍浙江長有波秋風别郷老還聽鹿鳴歌賈島寄非熊詩云知君歸有處山水亦難齊猶去瀟湘逺不聞猿狖啼穴通茅嶺下潮滿石城西獨立生遥思秋原日漸低司空圖圖與李生論詩云文之難詩尤難古今之喻多矣而愚以辨於味而后可以言詩也江嶺之南凡是資於適口者若醢非不酸也止於酸而已若醝非不醎也止於醎而已華之人所以充飢而遽輟者知其鹹酸之外醇美者有所乏耳彼江嶺之人習之而不辨者宜哉詩貫六義則諷諭抑揚渟蓄淵雅皆在其聞矣然直致所得以格自竒前軰諸集亦不專工於此矧其下者耶王右丞韋蘇州澄澹精緻格在其中豈妨於道舉哉賈閬仙誠有警句視其全篇意思殊餒大詆附寒澁方可置才亦爲體之不備也矧其下者哉噫近而不盡然後可以言韻外之致耳愚㓜嘗自負既久而愈覺缺然得於春早則有草嫩侵沙長氷輕著雨消又人家寒食月花影午時天又雨㣲吟足思花落夢無憀得於山中則有坡暖冬生笋松凉夏徤人又川明虹照雨樹宻鳥衝天得於江南則戍皷和潮暗舩燈照鳥幽又曲塘春盡雨方響夜深舩又夜短猿聲减風和鵲喜靈得於塞下則有馬色經寒慘鵰聲帶晚飢得於喪亂則有驊騮思故第鸚鵡失佳人又鯨鯢人海涸魑魅棘林髙得於道宫則有棊聲花院靜幡影石壇幽得於夏景則有地凉清鶴夢林靜肅僧儀得於佛寺則有松日明金像苔龕響木魚又解吟僧亦俗愛舞鶴終卑得於郊園則有遠坡春早慘猶有水禽飛得於樂府則有晚粧留拜月春睡更生香得於寂寥則有孤螢出荒池落葉穿破屋得於愜適則有客來當意愜花發遇歌成雖庻㡬不濵於淺涸亦未廢作者之譏訶也七言云逃難人多分隙地放生鹿大出寒林又得劍乍如添徤僕亡書久似憶良朋又孤嶼池痕春漲滿小欄花韻午晴初又故國春歸未有涯小欄髙檻别人家五更惆悵迴孤枕猶自殘燈照落花又甲子今重數生涯只自憐殷勤元日日欹午又明年皆不拘一槩也盖絶句之作本於詣極外千變万狀不知所以神而自神也豈容易哉今足下之詩時軰固有難及儻復以全美爲上即知味外㫖矣與王駕評詩云末伎之工雖蒙譽於賢哲未足自信必俟推於其類而后神躍而色揚今之贄藝者反是若即醫而靳其病也唯恐彼之善察藥之我攻耳以爲率人以謾莫能自振痛哉且工之尤者莫若彼於文章其能不死於詩者比他伎尤寡豈可容易挍量哉圖㓜生上好文雅風流特盛沉宋始興之後傑出於江寜宏肆於李杜極矣右丞蘇州趍味澄敻若清沅之貫逹大暦十數公抑又其次焉力勍而炁孱乃都市豪沽耳劉公夢得楊巨源亦各有勝㑹閬仙無可劉得仁軰時得致亦足滌煩厥後所聞逾𥚹淺矣然河汾蟠鬰之炁冝繼有人今王生者㝢居其間沉清益乆五言所得長於思興皆乃詩家之所尚者則前所謂必推於其類豈止神躍色揚哉經亂索居得其所録尚累百篇其勤亦至矣吾適又自編一鳴集且云撑霆裂月劼作者之肝脾亦當吾言之無怍也王禹偁五代史闕文云圖字表聖自言泗州人有俊才咸通中登進士第雅好爲文躁於進取頗自矜伐端士鄙之從事使府洎登朝驟歷清顯巢賊之亂車駕播迁圖有先人旧業在中條山極林泉之美圖自礼部員外郎避地焉日以詩酒自娯属天下版蕩士人多徃依之互相推奬由是聲名籍甚昭宗反正以戸部侍郎召至京師圖既負才慢世謂已當爲宰輔時人悪之稍抑其鋭圖憤憤謝病復歸中條與人書䟽不名官位但称知非子又稱柰辱居士其所居在㑗貽谿之上結茅屋􅒛曰休休亭嘗自爲亭記云云史旧文已上梁謹案圖河中虞卿人少有文采未爲鄉里所称㑹王凝自尚書郎出爲絳州刺史圖以文謁之大爲凝知入知制誥遷中書舍人知貢舉擢圖上苐頃之凝出爲宣州觀察史辟圖爲從事既度江御史府奏圖監察下詔追之圖感凝知已之恩不忍輕離幕府滿百日不赴闕爲臺司所劾遂以本官分司久之召拜礼部員外郎俄知制誥故集中有文曰戀恩稽命黜繋洛師於今十年方忝綸閤此豈躁于進取者即曰史不詳一至扵是圖見唐政多僻中官用事知天下必亂即棄官歸中條山尋以中書舍人召拜礼部戸部侍郎皆不起及昭宗播迁華下圖以宻迩乘輿即時奔問復歸還山故其詩曰多病形容五十三誰怜借笏趂朝參此豈有意於相位邪河中節度使王重榮誑圖撰碑得絹數千疋圖致于虞卿市中恣郷人所取一日而盡是時盗賊充斥獨不入王官谷河中士人依圖避難獲免者甚衆昭宗東迁又以兵部侍郎召至洛下爲栁㻮所沮一謝而退梁祖授禪以禮部尚書召辭以老病卒時年八十餘又案梁宝大臣如恭庿諱本字犯翔李振杜曉湯渉等皆唐朝舊族本以忠義立身重侯累將三百餘年一旦委質朱梁其甚者賛成殺逆唯圖以清直避世終身不仕梁祖故梁史拾圖小瑕以泯大節者良有以也裴晉公赴敵淮西題名華岳之闕門大順中圖以一絶紀之云岳前大隊赴淮西從此中原息鼓鼙石闕莫教苔蘚上分明認取晉公題題休休亭之楹曰咄諾休休休莫伎倆雖多性靈悪頼是長教閑處著休休休莫莫莫一局棋一爐藥天意時情且料度白日偏催人快活黄金難買堪騎鶴若曰尔何能荅曰耐苦莫柳傑爲相臣僚多被放逐圖爲監察御史尤加畏㥀昭宗郊禮畢上章懇乞致仕曰察臣本意非爲官榮可驗衰羸庶全名節上特賜歸山其詔畧曰既養髙以傲世類移山以釣名心也惟樂於漱流仕非顓於食禄匪夷匪惠特忘艾正之朝載省載思當狥遯棲之志宜放歸中條山詔辭乃傑之文也時多以四皓二踈譽之惟僧虚中云道装汀鸖識春醉野人扶言其操履撿身非傲世者也又云有時看御扎特地挂朝衣言其尊戴存誠非邀君也退栖云官逰蕭索爲無能移住中條最上層得劍乍如添徤僕亡書久似憶良朋燕昭不是空憐馬支遁何妨亦愛鷹自致此身繩撿外肯教世路日兢兢華下云日炙旱雲裂迸爲千道血天地沸一鑊竟自烹妖孽堯湯遇災數災數還中輟何事姦與邪古來難撲㓕僧舍貽友人云笑破人間事吾徒莫自欺解吟僧亦俗愛舞鶴終卑竹上題幽夢溪邊約敵碁舊山歸有阻不是故遲遲長安贈王沄云正下搜賢詔多君獨避名客來當意愜花發遇歌成樂地留髙趣權門讓後生東風閑小駟園外好同行下方云昏旦松軒下怡然對一瓢雨㣲吟足思花落夢無憀細事當碁遣衰容喜鏡饒溪僧有深趣書至又相邀黄巢䧟長安孫樵赴岐隴授職方員外詔書曰行在三絶以常侍李隲有曽閔之行圖有巢由之風樵有楊馬之文故也秦韜玉對花云長與韶光暗有期可憐蜂蝶却先知誰家促席臨低樹何處横釵帶小枝麗日多晴疑曲照和風得路合偏吹向人強道渾無語幾勸王孫到醉時貧女云蓬門未識綺羅香擬托良媒益自傷誰念風流髙格調共怜時世儉梳粧敢將十指誇纎巧不把雙眉闘畫長毎恨年年壓金線爲他人作嫁衣裳貴公子行云堦前莎毬緑不捲銀龜噴香挽不斷亂花織錦柳撚線粧㸃池臺畫屛展主人公業傳國𥘉六親聮亂馳朝車闘鷄走狗家世事抱來皆佩黄金魚却笑儒生把書卷學得顔回忍飢靣韜玉字仲明京兆人父爲左軍軍將韜出入田令孜之門又與劉曄李嵓士姜垍蔡鋋之徒交逰中貴各將兩軍書尺僥求巍科時謂對軍解頸僖宗幸蜀韜玉以工部侍郎爲令孜神策判官小歸公主文韜玉准勑及第仍編入牓中韜玉以書謝新人呼同年曰三條燭下雖阻門闌數仞墻邊幸同恩地潘誠棧踏猿聲暮江看劍影秋蜀句送人逰僧老白雲上磬寒髙鳥邊句心已同猿狖不聞人是非句三月獨立看花月只欠子規啼一聲句長安行人渡流水白馬入前山句秋深雪滿黄金塞夜夜鴻聲入漢陽句右張爲取作主客圖胡駢經費拾遺舊隠詩云林下茅齋已半傾九華幽逕少人行不將冠劍爲榮事只向烟蘿寄此身松竹漸荒池上色琴書徒立世間名白楊風起秋山暮時復哀猿啼一聲駢唐末進士也髙駢駢鎮蜀日以南詔侵暴築羅城四十里朝廷雖加恩賞亦疑其固䕶或一日聞奏樂聲響知有改移乃題風筝寄意曰夜静絃聲響碧空宫啇信任徃來風依稀似曲才堪聽又被移將别調中旬日報到移鎮渚宫駢好爲詩雅有竒藻其言懐詩曰恨乏平戎䇿慙登拜將壇手持金越冷身掛鐵衣寒主聖扶持易恩深報効難三邊猶未靜何敢便休官又二妃廟云帝舜南廵去不還二妃幽怨水雲間當時珠淚垂多少直到如今竹尚班又雪詩云六出花飄入戸時立看修竹變瓊枝逡廵好上髙樓看蓋盡人間悪路岐聽歌詩云公子邀歡月滿樓佳人掲調唱伊州便將席上秋風起直到蕭關水盡頭又寄僧笻竹杖詩云堅輕笻竹枝一枝有九節寄與沃州僧閑歩秋山月光啓三年駢鎮淮海三月看花駢與諸從事詩其末云人間無限傷心事不得罇前折一枝蓋亡㓕之䜟也及被幽辱計口給食自五月至八月外圍益急遂及於難駢字千里崇文孫也生於長慶之首卒于光啓之間家世禁衞頗修飭折爲文學與諸儒交硜硜談治道兩軍中人更稱譽之号落雕侍御赴安南却寄台司云曽驅万馬靜江山風去雲廻頃刻間今日海門南靣事莫敎還似鳯林關歩虚詞云青溪道士人不識上天下天鶴一隻洞門深鎻碧牎寒滴露研朱㸃周易題羅浮别業云不將真性染埃塵爲有烟霞伴此身帶月長江好歸去博羅山下碧桃春聞河中王鐸加都統云煉水燒鈆四十年至今猶在藥爐前不知子晉緣何事只學吹簫便得仙不平如此其驕傲潘緯中秋月云古今逢此夜共兾泬寥明豈是月華别祗應秋氣清影當中土正輪對八荒平尋客徒留望璿璣自有程琴云客來鳴素琴惆悵對遺音一曲起於古幾人聽到今盡含風靄遠日泛月烟深風續水山操坐生方外心湘南何涓瀟湘賦緯古鏡詩天下傳之或曰潘緯十年吟古鏡何涓一夜賦瀟湘登咸通進士第武瓘九日衛使君筵上作云佳晨登賞喜還郷謝宇開筵晚興長滿眼黄花初泛酒隔烟紅樹欲迎霜千家門戸笙歌發十里江山白鳥翔共賀安人豐樂歳幸陪珠履侍銀章瓘登咸通進士第唐末宰益陽勸酒云勸君金屈巵滿酌不須辭花發多風雨人生足别離感事云花開蝶滿枝花謝蝶還稀唯有舊巢燕主人貧亦歸灌初投卷於知舉蕭倣見是詩賞其有存故之志遂放反第于鄴孤雲詩云南北各萬里有雲心更閑因風離海上伴月到人間洛浦少髙樹長安無舊山徘徊不可駐漠漢又東還蝉詩云江頭一聲起芳樹已難留聽此髙樹上遥知故囯秋應催風落葉似勸客回舟不是新蝉苦年年自有愁鄴唐末進士也路徳延徳延儋州巖相之猶子數歳嘗賦芭蕉詩曰一種靈苗異天然體性虚葉如斜界紙心似倒抽書詩成翌日傳於都下㑹儋州坐事誅故德延久不能振光化初方就舉擢第又爲感舊詩曰初騎竹馬詠芭蕉嘗忝名卿誦滿朝五字便容趍綘帳一枝尋許折丹霄豈知流落萍蓬遠不覺推迁歳月遥囯境未安身未立至今顔巷守簞瓢天祐中授拾遺㑹河中節度使朱友謙領鎮辟掌書記友謙甚禮之然徳延浮薄動多忤物友謙解禮徳延乃作小兒詩五十韻以刺友謙友謙聞而大怒乃因醉沉之黄河詩曰情態任天然桃紅兩頰鮮乍行人共看初語客多憐臂膞肥如瓠肌膚軟勝綿長頭纔覆額分角漸垂肩散誕無塵慮逍遥占地仙排衙朱閣上喝道畫堂前合調歌楊柳齊聲踏採蓮走堤行細雨奔巷趂輕烟嫩竹乗爲馬新蒲折作鞭鸎雏金鏃繫猫子綵絲牽擁鶴歸晴島驅鵞入暖泉楊花爭弄雪榆葉共收錢錫鏡當胸挂銀珠對耳懸頭依蒼鶻褁䄂學柘枝揎酒殢丹砂暖茶催小玉煎頻邀籌箸掙時乞繡針穿寳篋挐紅豆粧奩拾翠鈿戯袍被按褥尖㡌戴靴氊展畫趍三聖開屏笑七賢貯懐青杏小垂額緑荷圓驚滴沾羅淚嬌流汚錦涎倦書饒婭姹憎藥巧迁延弄帳燕綃映藏衾鳯綺纒指敲銀使皷筋撥賽神絃簾拂魚鈎動筝推鴈柱偏碁圖添路畫笛管欠吹䥴惱客𥘉酣睡驚僧半入禪尋蛛窮屋瓦採雀遍樓椽抛果忙開口藏鈎亂出拳夜分圍榾柮朝聚打鞦韆折竹裝泥鷰添絲放紙鳶㸦誇輪水碓相教放風旋旗小裁紅絹書幽戴碧牋逺鋪張鴿網低控射蠅弦詀語時時道謡歌處處傳匿牎眉乍曲遮路臂相連闘草當春逕爭毬出晩田柳傍慵獨坐花底困横眠等鵲前離畔聽蛩伏砌邊旁枝粘舞蝶隈樹捉鳴蟬平島誇趫上層崖逞㨗縁嫩苔車跡小深雪履㾗全兢指雲生岫齊呼月上天蟻窠尋逕􅓯蜂穴遶堦填樵唱廻深嶺牛歌下逺川壘柴爲屋木和土作盤筵險砌髙䑓石危跳峻塔塼忽陞隣舍樹偷上後池舩項橐称師日甘羅作相年明時方任徳勸尔减狂顛翁承賛蕭蕭風雨建陽溪溪伴維舟見亞齊一軸新詩劍潭北十年曰識華山西吟魂惜向江村老空性元知世路迷應笑乘軺青瑣客此時無暇聽猿啼右承賛詩承賛字文堯閩人唐末爲諫議大夫使福州至劍浦見舊識僧亞齊贈此章承賛乾寜進士也唐語曰槐花黄舉子忙承賛有詩曰雨中粧㸃望中黄勾引蝉聲送夕陽憶得當年隨計吏馬蹄終日爲君忙韓垂垂唐之詩人也題金山云靈山一峰秀岌然殊衆山盤根大江底影掙浮雲間雷霆常間作風雨時徃還象外懸清影千載長躋攀其詩偶爲庸僧所毁江南時李鍾山留一絶云不嗟白髪曽逰此不嘆征㠶無了期盡日憑欄誰㑹我只悲不見韓垂詩建勲也鍾山公唐詩紀事卷第六十三
