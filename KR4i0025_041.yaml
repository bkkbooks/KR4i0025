front:
  text: 唐詩紀事卷第四十一
  hash: sha256:1fe5eb42514896481c85e1c0eb9b6b39d746859344a223f87cf0c06874ffe2b1
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_041-1a}
body:
  text: 白行簡章孝摽施肩吾鮑溶孟簡李程張簫逺許康佐許堯佐張南史徐凝朱畫侯喜蔣防白行簡春從何處來詩云欲識春生處先從木德來入門潜報栁度嶺暗驚梅透雪寒光散銷氷水鏡開曉迎郊綺發夜逐斗光回淑氣寅中變新聲雨後催偏宜資律呂應是候陽臺在巴南望郡南山云臨江一嶂白雲間紅緑層層錦繡班不作巴南天外意何殊昭應望驪山樂天和云返照前山雲樹明從君苦道似華清試聽腸斷巴猿呌早晚驪山有此聲在忠州時樂天九日作云隆慮意何如窮荒九日初三秋異鄉客一紙故人書對酒情無限開緘思有餘感時空寂寞懷舊幾躊躇鴈盡平沙逈煙銷大漠虛登臺南望處掩淚對雙魚行簡以濾水羅賦得名其警句云焦螟之生必全有以小為貴者江漢之流雖大盡可以一貫之又曰夕掛于壁如滿月之在天曉用於人狀圓荷之映水行簡字知退敏而有詞元和二年登第為度支郎中寶曆二年卒行簡小字阿憐樂天同宿湖亭詩云潯陽少有風情客招宿湖亭盡却回水檻虛凉風月好夜深惟有阿憐來行簡恩賜章服樂天以詩寄之云吾年五十加朝散爾亦今年賜章服齒髮恰同知命嵗官銜俱是客曹郎緋俱是主客都官豫兄弟年五十賜榮傳錦帳花聮蕚彩動綾袍鴈趂行大抵著緋宜老大莫嫌秋鬢數莖霜章孝摽孝摽元和十三年下第時輩多為詩以刺主司獨孝標為歸燕詩留獻侍郎庾承宣得詩展轉吟諷庾果重典禮曹孝標來年登第詩云舊纍危巢泥已落今年故向社前歸連雲大厦無捿處更望誰家門户飛孝摽及第除正字東歸題杭州驛云樟亭樟亭驛上題詩客一半尋為山下塵世事日隨流水去紅花還似白頭人初成落句云紅花真笑白頭人改為還似且曰我將老成名似我芳艷詎能久乎及還鄉而逝或曰前有八元後有孝摽皆桐廬人復同姓而皆不達矣李紳鎮楊州請孝摽賦春雪詩命題於臺盤上孝摽唯然索筆一揮云六出花飛處處飄粘窗拂砌上寒條朱門到晚難盈尺盡是三軍喜氣銷孝摽及第後寄紳曰及第全勝十改官金鞍鍍了出長安馬頭漸入楊州郭為報時人洗眼看紳以一絶針之曰假金方用真金鍍若是真金不鍍金十載長安得第一何須空腹用髙心孝摽大和中山南東道從事試大理評事明日鑾輿欲向東守宫金翠帶愁紅九門佳氣巳西去千里花開一夜風題無右張為取詩為主客圖歸海上舊居云鄉路繞蒹葭縈紆出海涯人衣被蜃氣鳥跡印鹽花草沒題詩石潮推坐釣槎還歸舊窗裏凝思賞煙霞長安秋日云田家無五行水旱卜蛙聲牛犢乘春放兒孫候暖耕池塘煙未起桑柘雨初晴嵗晚香醪熟村村自送迎莊又元集右二詩韋施肩吾肩吾洪州人元和十年登第以洪州西山羽化之地慕其真風髙蹈於此為詩奇麗著百韻山居詩才情富贍如荷翻紫蓋搖波面蒲瑩青刀插水湄又經粘薜荔龍鬚軟雨壓芭蕉鳯翅垂又贈邊將詩曰輕生奉國不為難戰苦身多舊箭瘢玉匣鎖龍鱗甲冷金鈴襯鶻羽毛寒皂貂擁出花當背白馬騎來月在鞍猶恐犬戎臨虜塞栁營時把陳圖看又上禮部侍郎陳情云九重城裏無親識八百人中獨姓施弱羽飛時攢箭險蹇驢行處薄氷危晴天欲照盆難反貧女如花鏡不知却向從來受恩地再求青律變寒枝又贈友人下第間居云花眼綻紅斟酒看藥心抽緑帶煙鋤皆輕巧之極惜花云落盡萬株紅無人解繫風今朝芳徑裏惆悵錦機空隋曲有踈勒鹽唐曲有突厥鹽阿鵲鹽或云關中人謂好為鹽故肩吾詩云顛狂楚客歌成雪媚賴吳娘笑是鹽蓋當時語也今杖鼓譜中尚有炎杖聲效古興云金雀無舊叉緗綺無舊裾唯有一寸心長貯萬里夫南軒夜蟲織已促北牖飛蛾繞殘燭秪言衆口鑠千金誰信獨愁銷片玉不知嵗晚歸不歸又將啼眼縫征衣夜宴曲云闌釭如晝賈不眠玉爐夜起沉香煙青娥一行十二仙欲笑不笑桃花燃碧窗㺯嬌梳洗晚戶外不知雲漢轉被郎㖽罰屠酥盞酒入四肢紅玉軟肩吾有年來如拋梭不老應不得之句又及第後過楊子江詩云憶昔將貢年抱愁此江邊魚龍互閃鑠白浪髙於天今日步青草還來經此道江神也世情為我風色好右張為取作主客圗張籍贈詩云世間漸覺無多事難得空名未著身合取藥成相待喫不須先作上天人又送肩吾東歸云知君本是煙霞客被薦因來城闕間世業偏臨七里瀨仙遊多在四明山早聞詩句傳人遍新得科名到處間惆悵灞亭相送去雲中琪樹不同攀鮑溶岐路詩云北風送微寒徒侣勤逺程憂人席不暖殘月馬上明飄飄岐路間長見日初生重嶂曉色淺踈猿寒啼清人間多岐路常恐終身行廽見四方人車輪無留聲空谷亦堪隱下田非懶耕古人有遺訓飽食非親縈我生禮義鄉少小見太平聖賢猶羈旅况復非其名長城作云䝉公虜生人北築秦氏寃禍興蕭墻內萬重防禍根城成六國亡宮闕晵千門生人半為土何用空中原奈何家天下骨肉尚無恩投沙擁海水安得不久翻乘髙慘人魂寒日易黃昏枯骨貫朽鐵沙中如有言万古驪山葬誰知野火燔秋暮山中寄李益端公云舊事與日逺酒花仍舊香前年繡衣客此節過此堂侍臣不自髙笑解繡衣裳眠雲有餘態入鳥不亂行我恐雲嵐色損君鞍馬光君言此何言且共覆前觴古人重一笑買日輕金裝日盡秉燭遊千年不能忘君言此何言明日皆異鄉明日非今日山下道路長一從山下去天地再炎凉此期果難得夢君馬玄黃許渾過鮑溶宅有感云寥落故人宅重來身已亡古苔殘墨沼深竹舊書堂秋色館池靜雨聲雲木凉無因展交道日暮倍心傷溶登元和進士第與韓愈李正封孟郊友善溶有途中句云躍馬非壯嵗報恩無髙功斯言化為火日夜焚深衷又上太原王尚書云天王委管籥開閉秦北門頂戴日月光口宣雨露言又秋懷句云萬里岐路多一身夫地窄右張為主客圗取溶為工用博解宏拔主孟簡惜分隂詩云業廣因功苦拳拳志士心九流難酌挹四海易消沉對景嗟移晷窺園詎改隂三冬勞聚學駟景重兼金刺股情方勵偷光思益深再中如可冀終嗣絶編音元和中簡將試詣日者卜之曰近東門坐即得之矣既入即坐西廊迫晚忽得疾鄰坐請與終篇見其姓即東門也乃擢上第簡字幾道德州人元和中為户部侍郎以贓貶後以太子賔客分司卒尤工詩尚節義簡擬古云劒客不誇怨主人知取心但營纎毫義肯許千萬金勇則看鷙擊憤來聼虎吟平生貴酬德刃敵無幽深李程程正元中試日五色賦破題云德動天鑒祥開日華其卷已黜揚於陵質之主文吕謂於是已落重收詠氷壺云琢玉性惟堅成壺躰更圓虛心含衆象應物受寒泉溫潤資天質清真稟自然日融光自散雪映色逾鮮至鑒功寧宰無私照豈偏明將水鏡對白與粉闈連拂拭終為美提携佇見傳勿令毫髮黑遺恨綴成篇程字表臣為翰林學士日過八磚乃至時號八磚學士寶曆二年為相最為帝所重曰髙飛之翮長者在前卿朝廷羽翮也張蕭逺履春氷詩云一步一愁新輕輕恐陷人薄光全透日殘影半銷春蟬想行時翼魚驚躍處鱗風虛難駐足岸闊怯回身豈暇踟蹰久寧辭顧盻頻願將兢慎意從此赴通津觀燈云十萬人家火燭光門門開處見紅粧歌鍾喧夜更漏暗羅綺滿街塵土香星宿别從天畔出蓮花不向水中芳寶叉驟馬多遺落依舊明朝在路傍蕭逺元和進士登第與舒元輿聲價俱美糠言出廣秦雲寂寂僧還定盡日無人鹿繞牀句日暮風吹官渡栁白鴉飛出頭石墻句廢城雙雙白燕入祠堂女祠句乳石洞玉右張為取作主客圗張籍有弟蕭逺雪夜同宿詩云數卷新遊蜀客詩長安僻卷得相隨草堂深夜携琴宿說似青城館裏時許康佐白雲起封中詩云英英白雲起呈瑞出封中表聖寧依地逄時豈待風浮輝迷皎潔流影忽冲融自叶堯天美誰言漢日同泥金光乍掩檢玉氣俄通猶願非煙瑞亭亭不散空元稹酬許五康佐詩云猿啼三峽雨蟬報兩京秋珠玉慙新贈芝蘭忝舊遊他年問狂客須向老農求康佐以中書舍人為翰林侍講學士與王起皆為文宗寵禮帝讀春秋至閽弒吳子余祭問閽何人耶康佐以中官方彊不敢對帝嘻笑後問李訓訓曰國君不近刑人以為輕死之道帝曰朕近刑人多矣得不慮哉訓曰列聖知而不能逺惡而不能去陛下念之宗廟福也於是內謀翦除矣康佐終於禮部尚書許堯佐堯佐金谷懷古云石氏遺文在凄凉見故園清風思奏樂衰草念行軒舞榭蒼苔掩歌臺落葉繁斷雲歸舊壑流水咽新源曲沼殘煙斂叢篁宿烏喧唯余池上月猶似對金樽康佐諸弟皆第進士而堯佐最先進又舉宏詞為太子授書郎八年康佐繼之堯佐正元十六年與燉煌張宗本滎陽鄭權皆佐征西府後位諫議大夫卒張南史陸滕宅秋雨中探韻云同人永日自相將深竹間園偶辟强已被秋風交憶膾更聞寒雨勸飛觴歸心莫問三江水旅服徒霑九月霜醉裏欲尋騎馬路蕭條幾處有垂楊送朱大北遊云嵗暮一為别江湖聊自寬且無人事變誰為客行難郢曲憐公子皇州憶伯鸞蒼蒼逺山際松樹獨宜寒南史好奕碁其後析節讀書遂入詩境李端哭之云諫草文猶在圍碁智不如髙仲武云張君奕碁者中年感激苦節學文數年間稍入詩境如已被秋風教憶膾更聞寒雨勸飛觴事與物力俱矣南史字季直幽州人以試參軍避亂居楊州楊子再召未赴而卒錢起贈南史云紫泥何日到滄州笑向東陽沈隱侯黛色睛峰雲外出縠紋江水縣前流使臣自欲論公道才子非關厭薄遊溪畔秋蘭雖可佩知君不得少停舟徐凝范攄言樂天為杭州刺史令訪牡丹獨開元寺僧惠澄近於京師得之植於庭時春景方深惠澄設油幕覆其上㑹凝自富春來未識白先題詩曰此花南地知難種慙愧僧間用意栽海燕解憐頻睥睨胡蜂未識更徘徊虛生芍藥徒勞妬羞殺玫瑰不敢開唯有數苞紅萼在含芳只待舍人來白尋到寺看花乃命徐同醉而歸時張祐傍舟而至二生各希首薦白曰二君論文若薕白之鬪鼠穴勝負在於一戰也遂試長劒倚天外賦餘霞散成綺詩試訖解送凝為元祐次耳祐曰祐詩有地勢遙尊嶽河流側讓關又題金山寺詩曰樹影中流見鍾聲兩岸聞雖綦毋潜云塔影挂青漢鍾聲和白雲此句未為佳也凝曰美則美矣爭如老夫今古長如白練飛一條界破青山色凝遂擅場祐歎曰榮辱糾紛亦何常也遂行歌而邁凝亦鼓枻而歸自是二生不隨鄉賦矣白又以祐宫詞四句皆數對未足竒也後杜牧守秋浦與祐為詩酒友酷吟祐宫詞以白有非祐之論常不平之乃為詩以髙之曰誰人得似張公子千首詩輕萬户侯又云如何故國三千里虛唱歌詞滿六宫杜盛言其美者欲以茍異於白而曲成於張也故牧又著論言近有元者喜為淫言媟語鼓扇浮囂吾恨方在下位未能以法治之斯亦敷佐於祐耳潘若冲郡閣雅談云凝官至侍郎多吟絶句曾吟廬山瀑布鱠炙人口又題處州縉雲山黃帝上升之所鼎湖蓋黃帝鑄鼎處也有池在山頂詩云黃帝旌旗去不廽空余片石碧崔嵬有時風卷鼎湖浪散作晴天雨㸃來自後無敢題者凝送馬向游蜀云遊子去咸京巴山萬里程白雲連鳥道青壁遞猿聲雨露經泥坂煙花望錦城工文人共許應記蜀中行送李補闕歸朝云駟牡歸城闕雙鳬去海門還從清切禁再沐聖明恩禮樂中朝貴文章大雅存江湖多旅逸獻替欲誰論問漁叟云生事同薸梗機心在野船如何臨逝水白髮未忘筌樂天薦徐凝屈張祐論者至今鬱鬱或歸白之妬才也余讀皮日休論祐云祐元和中作宫體詩辭曲艷發當時輕薄之流能其才合譟得譽及老大稍窺建安風格誦樂府録知作者本意講諷怨譎時與六義相左右此為才之最也祐初得名乃作樂府艷發之詞其不羈之狀往往間見疑之操履不見於史然方千學詩於凝贈之詩曰吟得新詩草裏論戲反其辭謂村裏老也方干世所謂簡古者且能譏凝則凝之朴略榷魯從可知矣樂天方以實行求才薦凝而抑祐其在當時理其然也令狐楚以祐詩三百篇上之元稹曰雕蟲小技或奬激之恐害風教祐在元白時其譽不甚持重杜牧之刺池州祐且老矣詩益髙名益重然牧之少年所為亦近於祐為祐恨白理亦有之余嘗謂文章之難在發源之難也元白之心本乎立教乃寓意於樂府雍容宛轉之詞謂之諷諭謂之間適既持是取大名時士翕然從之師其詞失其㫖凡言之浮靡艷麗者謂之元白體二子規規榱臂解辨而習俗既深牢不可破非二子之心也所以發源者非也可不戒哉青山舊路在白首醉還鄉公句别白試到第三橋便入千頃花句髙景爭來草木頭一生心事酒前休山公自是山人侣携手醉登城上樓公句答白右張為取作主客圖朱晝贈友人古鏡云我有古時鏡初自壞陵得蛟龍猶泥蟠魑魅幸月蝕摩久見菱蘂青於藍水色贈君將照心無使心受惑喜陳懿老示新製云一别一千日一日十二憶苦心無間時今夕見玉色玉色復何異紅明含羣德有文如星宿飛入我胸臆憂愁方破壞歡喜重補塞使我心㒵全且非黃金力將攀下風手願假仙鸞翼見詩豫欲寄誠於此人孟郊故賦得花藤藥合寄頴陰故人云藤生南海濵引蔓青且長剪削為花枝何人無文章非才亦有心割骨聞余芳繁葉落何處孤貞在中央願盛黃金膏寄與青眼郎路逺莫知意水深天蒼蒼晝元和間進士侯喜劉師服軒轅彌明韓退之石鼎聮句詩序云元和七年十二月四日衡山道士軒轅彌明舊與進士劉師服衡湘中相識師服在京夜抵其居宿有校書郎侯喜新有能詩聲夜與劉說詩彌明指爐中石鼎曰子能為我賦此乎喜即援筆賦之彌明繼焉詩曰妙匠斫山骨刳中事煎烹服師直柄未當權塞口且吞聲喜龍頭縮菌蠢豕腹脹膨脝明彌外苞乾蘚文中有暗浪驚服師在冷安自足遭焚意彌亨喜謬當鼎鼐間妄使水火爭明彌大若烈士膽圓如戰馬纓服師上比香爐尖下與鏡面平喜秋苽未落蒂凍芋彊抽萌明弥一塊元氣間細泉幽竇碩服師不值輸寫處焉知懷抱清喜方當洪爐然益見小器盈明彌睨睨無刃跡團團類天成遙疑龜負圗出曝曉正晴喜旁有雙耳穿上為孤髻撑明弥或訝短尾銚大似無足鐺服師可惜寒食毬擲在路傍坑喜何當出灰灺無計離瓶罌服師陋質荷斟酌狹中貴提擎服師豈能煮仙藥但未汚羊羮喜形模婦女笑量度兒童輕明弥徒爾堅重性不過升合盛仍似廢轂仰側見折軸橫喜時於蚯蚓竅微作蒼蠅鳴明弥以兹翻溢愆實負任使誠服師常居顧盻地敢有漏泄情寧依暖熱弊不與寒凉并明弥區區徒自效瑣瑣不足呈服師回旋但兀兀開合唯鏗鏗喜全勝瑚璉貴空有口傳名豈比俎豆古不為手所撜磨礲去圭角浸潤著光明願君莫嘲誚此物方施行弥明作也四韻並是始師服援筆題首句授喜喜綴其下云云道士笑曰子詩如是而巳乎即袖手竦肩傍北牆坐謂劉曰吾不解世俗書弟子為我書吾句因髙吟龍頭豕腹一聮初不似經意詩㫖有似譏喜二子相顧慙駭欲以多窮之道士不用意益切竒出不可附說皆侵劉侯二子思竭不能續道士曰章不可不成命劉把筆唱出四十字為八句讀畢謂二子曰此皆不足與語此寧為文耶吾所聞子皆不足聞也二子驚惋自失蔣防春風扇微和詩云麗日催遲景和風扇早春暖浮丹鳯闕韶媚黑龍津淡蕩迎仙仗霏微送畫輪緑搖宫桞散紅待禁花新舞席皆回雪歌筵暗送塵幸當陽律候惟願及佳辰望禁苑祥光詩云嘉瑞生天色葱籠幾效祥樹搖三殿側日映九城傍仙霧今同色卿雲未可章拱汾疑鼎氣臨渭比熒光豈並春風舊俄同聖夀長微臣時一望短羽欲翺翔冬至日祥風應候詩云節逄清景空氣古二儀中獨喜登髙日先知應候風端呈光舜化表慶盛堯聰况與承時叶還將入律同微微萬井逼習習九門通繞殿爐煙起殷勤報嵗功杜賔客永豐里新居云退蹟居三徑辭榮繼二踈聖情容解印帝里許懸車已去龍樓籍猶分御廩儲風泉輸耳目松竹助玄虛調護心常在山林思有餘應嗤紫芝客逺就白雲居元和中李紳及防薦龎嚴為翰林學士李逄吉誣紳罪逐之出嚴刺信州防刺汀州于敖封還詔書搢紳意伸其枉曰于給事犯宰執之怒申龎蔣之屈不亦善乎奏下乃論貶嚴太輕衆嗤譟防作連州廖先生碑銘云長慶末余自尚書司封郎中知制誥翰林學士出守臨汀尋改此郡唐詩紀事卷第四十一
