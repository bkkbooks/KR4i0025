front:
  text: 唐詩紀事卷第四十四
  hash: sha256:8a9c4532a55213e3d42438b62539413d2f344edd018a2716d444d1687589dcb0
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_044-1a}
body:
  text: 王建百首宮詞一蓬萊正殿躰金鼇紅日初生碧海濤開著五門遙北望柘黃新帕御床高殿前傳點各依班召對西來八詔蠻上得青花龍尾道側身偷覷正南山龍煙日氣紫曈曈宣政門當玉殿風五刻閣前卿相出下簾身在半天中白玉窗中起草臣櫻桃初出賜嘗新殿頭傳語金階逺因進詞來謝聖人內人對御疊花箋繡坐移來玉案邊紅蠟燭前呈草本平明升出閣門宣千牛仗下放朝初玉案傍邊立起居每日請來金鳳紙殿頭無事不教書延英引對碧衣郎江硯宣毫各别床天子下簾親考試宮人手裏過茶湯此詩亦云元稹作朱明開著九重關金畫黃龍五色幡直到銀床排仗合聖人三殿對西畨少年天子愛邊功親到凌煙畫閣中教覔勳臣寫圖本長教殿裏作屏風丹鳳樓門把火開先排法駕出蓬萊棚前走馬人傳語天子南郊一宿回樓前立仗看宣赦萬歲聲長再拜齊日照綵盤髙百尺飛仙爭上取金雞集賢殿裏圖書滿點勘頭邉御印同真迹進來依字數别收鎖在玉函中秋殿清齋刻漏長紫微宮女夜焚香拜陵日到公卿發鹵簿分頭入太常新調白馬怕鞭聲供奉騎來繞殿行為報諸王侵早起隔門催進打毬名對御難爭第一籌殿前不打背身毬內人唱好龜兹急天子龍輿過玉樓新衫一樣殿頭黃銀帶排方獺尾長揔把金鞭騎御馬緑緵紅額麝煙香羅衫葉葉繡重重金鳳銀鵝各一藂每遍舞頭分兩向太平萬歲字當中魚藻宮中鎖翠娥先皇行處不曾過如今池砥休鋪錦菱角鴉頭積漸多殿前明日中和節連夜瓊林散舞衣傳報所司供蠟燭監門金鎖放人歸五更五點索金車盡放宮人出看花仗下一時催立馬殿頭先報內園家城東南北望雲樓半下珠簾半上鈎騎馬行人長逺過忽防天子在樓頭射生宮女宿紅粧請得新弓各自張臨上馬時齊賜酒男兒跪拜謝君王新秋白兔大於拳紅耳霜毛趂草眠天子不教人射煞玉鞭遮到馬蹄前內人籠脫解紅縚戴勝爭飛出手髙直到碧雲還却下一雙金爪菊花毛競渡船頭掉綵旗兩邊泥水濕羅衣池東爭向池西岸先到先書上字歸燈前飛入玉揩蟲未卧嘗聞半夜鍾看著中元齋日到白盤金線繡真容步行送出長門逺不許來辭舊院花只恐他時身到此乞來自在得還家一時起立吹簫管得寵人來滿殿迎整頓衣裳皆著節舞頭當拍第三聲琵琶先抹六么頭小管丁寧側調愁半夜美人雙起唱一聲聲出鳳凰樓春池日暖少風波花裏牽船水上歌遙索劒南新樣錦東宮先釣得魚多十三初學擘箜篌弟子名中被點留昨日教坊新進入並房宮女與梳頭紅蠻捍撥帖胸前移坐當頭近御筵用力獨彈金殿響鳳凰飛出四條絃春風吹曲信旗竿自得深宮不怕寒誇道自家先上馬團中橫過覔人看粟金腰帶象牙錐插散紅翎玉突支旋獵一邊還引馬歸來花鴨繞鞍垂雲駮月驄各試行一般毛色一般纓殿前來往重騎過欲得天恩别賜名每夜停燈尉御衣銀燻籠砥火霏霏遙聽帳裏君王覺上直聲鍾始得歸因喫櫻桃病故歸三年著破舊羅衣內中侍從來還去結得金花上貴妃欲迎天子看花去下得金階却悔行恐見失恩人舊院廽來憶著五絃聲住來舊院不堪修近敇宣徽别起樓聞有美人新入內宮中未識大家愁自誇歌舞勝諸人恨未承恩出內頻連夜宮中修理院地衣簾額一時新悶來無處可思量旋下金階旋下床收得山丹紅蘂粉窗中洗却麝香黃嫌羅不著索輕對面交人染褪紅衫子成來一遍出今朝看處滿園中合暗報來門鎖子夜深應别喚笙歌房中下著珠簾睡月過金階白露多御厨下食索時新每見花開即苦春白日卧多嬌似病隔簾教喚女醫人藂藂洗手繞金盆旋拭紅巾入殿門衆裏遙拋金橘子在前收得便承恩御波水色春來好處處分流白玉渠密奏君王知入月喚人相伴洗裙裾移來女樂部頭邊新賜花檀大五絃縱得紅羅手帊子當心香畫一雙蟬新晴草色暖溫暾山雪初消漸出渾今日踏青歸校晚傳聲問著苑東門兩簾新換珠簾額中尉明朝設內家一樣金盤五千箇紅蘇點出牡丹花舞送香迷出內家記巡傳把一枝花散時各自燒紅燭相逐行歸不上車家常愛著舊衣裳空戴紅梳不作粧忽把下階衣帶解非時應得見君王宣勑教歌不出房一聲一遍報君王再三博士留殘拍索向宣徽作徹章行中第一頭先舞博士傍邉亦被欺忽覺管絃偷急遍翩翩羅袖不教知同黃縫校捨叉梳欲得金仙觀內居近被天恩知識字收來按上撿文書月冷江清近臘時玉階金瓦雪澌澌浴堂門外抄名入公主家人謝面脂未承恩澤一家愁乍到宮中憶外頭求首管絃聲欵逐側啇調裏唱伊州東風潑潑雨新休盡春風蕩雪溝走馬犢車當御路漢陽公主進雞毬風簾水閣壓芙蓉四面拘欄在水中避熱不歸金殿宿秋河織女夜燈紅聖人生日明朝是私地先須屬內監自寫金花紅榜子前頭先進鳳凰衫避脫昭儀不擲盧井邉含水噴鴉雛內中數日無呼喚寫得滕王蛺蝶圖內宴初秋入二更殿前燈火一天明宮官分半音聲住諸院門開觸處行玉蟬金掌三層插翠髻髙藂緑鬢虛舞處春風吹落地歸來别賜一頭梳樹葉初成鳥出窠石榴花裏笑聲多舞中遺却金叉子拾得從他要賞羅小殿新裝粉欲乾貴妃姊妹盡來看為逢好日先移入續向街西索牡丹內人相續報花開準擬君王便看來縫著五絃琴繡袋宜春院裏按歌回巡吹遍不相和暗看誰人曲校多明日梨花園裏見先須逐得內家歌黃金合裏盛紅雪重結香羅四出花一一傍邊書勑字分明送與大臣家未明東上閣門開排仗聲從後殿來阿監兩邊相對立遙聞索馬一時廽宮人早起笑相呼不識階前掃地夫乞與金錢爭借問外頭還似此間無小隨阿姊學吹笙好見君王乞與名夜掃玉床朝把鏡黃金階下不教行日髙殿裏有香煙萬歲聲來動九天妃子院中初降誕內人爭乞洗兒錢宮花不共外邊同正月長生一朵紅供御櫻桃看守别直無鴉鳥在園中殿前鋪設兩邊樓寒食宮人步打毬一半走來爭跪拜上朋先謝得頭籌太儀前日暖房來囑和昭陽乞藥栽勑賜一窠紅躑躅謝恩未了奏花開床前謝賜紫羅襦不下金階上軟輿官局揔來為喜樂院中新拜內尚書鸚鵡誰教轉舌關內人手裏飬來姦語多近更承恩澤數對君王憶隴山分明間坐賭櫻桃休却投壺玉腕勞各把沉香雙陸子局中鬪得壘髙髙禁寺紅樓內裏通笙歌引駕夾城中褁頭官監當前立手把牙鞘竹彈弓春風院院落花堆金鎖衣生掣不開更築歌臺起粧殿明朝先進畫圖來舞來汗濕羅衣徹樓上人扶下玉梯歸到院中重洗面金盆水裏撥紅泥宿粧殘粉未明天揔在朝陽花樹邊寒食內人長自打庫中先散與金錢衆中愛得君王笑偷把金箱筆硯開書破紅蠻隔子上旋催當內美人來後宮宮女無多少起得園中笑一團舞蝶落花相看著春風共語亦應難黛眉小婦砑裙長惣被抄名入教坊春設殿前多隊舞明頭各别請衣裳水中芹葉土中花拾得還將避衆家揔待别人般數盡抽中捻得鬱金牙玉簫改調移纎指催赴紅羅繡舞筵未著柘枝花帽子兩行宮監在簾前窗窗戶戶院相當揔有珠簾玳瑁床雖道君王不來宿帳中長是炷衙香銀燭秋光冷畫屏輕羅小扇朴飛螢天階夜色涼如水卧看牽牛織女星雨入珠簾滿殿涼避風新出石盆湯內人恐要秋衣著不住熏籠換好香金吾除夜進儺名畫袴朱衣四隊行院院燒燈如白日沉香火砥坐吹笙樹頭樹砥覔殘紅一片西飛一片東自是桃花貪結子錯教人恨五更風金殿當頭紫閣重仙人掌上玉芙蓉太平天子朝迎日五色雲車駕六龍日晚長秋簾外報望陵歌舞在明朝添爐欲爇熏衣麝憶得分時不忍燒日映西陵松柏枝下臺相顧一相悲朝來樂部歌新曲唱著君王自作詞淚盡羅巾夢不成夜深前殿按歌聲紅顏未老恩先斷斜倚熏籠坐到明新鷹初放兔方肥白日君王在內稀薄暮千門臨欲鎖紅粧飛騎向前歸黃金捍撥紫檀槽絃索初張調更髙盡理昨來新上曲內官簾外送櫻桃鴛鴦瓦上忽然驚晝寢宮娥夢裏聲元是吾皇金彈子流棠窠下打流鶯寶仗平明金殿開暫將紈扇共徘徊玉顏不及寒鴉色猶帶昭陽日影來間吹玉殿昭華管醉打黎園縹蒂花千年一夢歸人世絳縷猶封繫臂紗建初為渭南尉值內官王樞密者盡宗人之分然彼我不均復懷輕謗之色忽過飲語及漢元靈信任中官起黨錮興廢之事樞密深憾其譏乃曰吾弟所有宮詞天下皆誦於口禁掖深邃何以知之建不能對後為詩以贈之乃脫其禍建詩曰先朝行坐錯相隨今上春宮見長時脫下御衣偏得著進來龍馬每交騎當承密旨還家少獨對邉情出殿遲不是當家頻向説九重爭遣外人知上李庶子云紫煙樓閣碧沙亭上界詩仙獨自行奇險驅回還寂寞雲山經用始鮮明藕綃紋縷裁來滑鏡水波濤濾得清昏思願因秋露洗幸容階砥禮先生建赴陜州司馬樂天夢得以詩送之夢得詩云暫輟清嚴出太常空携詩卷赴甘棠府公既有朝中舊司馬應容酒後狂案牘來時唯署字風煙入興便成章兩京大道多遊客每遇詞人戰一場樂天詩云陜州司馬去何如養靜資貧兩有餘公事間忙同少尹俸錢多少敵尚書只携美酒間為伴惟作新詩趂下車自有鐡牛無詠者計君投刃必應虛張籍贈建詩云早在山東聲價逺曾將順策佐嫖姚識來詩句無間語老去官班未在朝身屈只聞詞客説居貧多見野僧招獨從詩閣歸來晚春水橋邊看桞條建大曆進士為昭應丞太府寺丞終於司馬建在昭陽楊巨源寄詩曰武皇金輅輾香塵每歲朝元及此辰光動泉心初浴日氣蒸山腹㧾成春謳歌日入雲韶曲詞賦方歸侍從臣瑞靄朝朝猶望幸天教赤縣有詩人唐詩紀事卷第四十四
