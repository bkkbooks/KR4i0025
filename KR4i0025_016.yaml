front:
  text: 唐詩紀事卷第十六
  hash: sha256:f74bbeec9819b7d4facefa13838301a6a7f1c20c07495b7f4b7922e6223a0121
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_016-1a}
body:
  text: 王維王縉裴廸崔興宗王維集異記載維未冠文章得名妙能琵琶春之一日岐王引至公主第使為伶人進主前一進新曲號鬰輪𫀆并出所為文主大竒之令宫婢傳教遂召試官至第諭之作觧頭登第祿山之亂李龜年奔於江潭曽於湘中採訪使筵上唱云紅豆生南國秋來發幾枝贈君多採擷此物最相思又清風明月苦相思蕩子從戎十載餘征人去日慇懃嘱歸鴈來時数附書此皆維所製而梨園唱焉維年十七時九日憶山東弟兄云獨在異鄉為異客毎逢佳節倍思親遥知兄弟登高處遍揷茱茰少一人祿山大㑹凝碧池梨園弟子欷歔泣下樂工雷海清擲樂噐西向大慟賊支解於試馬殿維時拘於菩提寺有詩曰萬户傷心生野煙百僚何日更朝天秋槐落葉深宫裏凝碧池頭奏管絃後有罪以此詩獲免寜王憲貴盛寵妓數十人有賣餅之妻纎曰明媚王一見属意因厚遺其夫求之寵愛逾等嵗餘因問曰汝復憶餅師否使見之其妻注視雙淚垂頰若不勝情時王座客十餘人皆當時文士無不悽異王命賦詩維先成云莫以今時寵難忘異日恩看花滿眼淚不共楚王言座客無敢繼者王乃歸餅師以終其志出本事詩或説維詠終南山詩譏時也詩曰太一近天都連山接海隅言勢熖盤據朝野也白雲回望合青靄入看無言徒有其表也分野中峰變晴隂衆壑殊言恩澤偏也故人投處宿隔水問樵夫畏禍深也維善畫破墨山水嘗自制曰當代謬詞客前身應畫師不能捨餘習偶𬒳時人知維字摩詰為給事中遇禄山反賊平下遷太子中允三遷尚書右丞䘮妻不娶孤居三十年母亡表輞川第為寺終葬其西寳應中代宗語王縉曰朕嘗於諸玉座聞維樂章今傳幾何遣中人徃取縉裒集數百篇上之表曰臣兄文辭立身行之餘力當官堅正秉操孤直縱居要劇不忘清浄實見時軰許以高流至於晚年彌加進道端坐虛室念兹無生乗興為文未嘗廢業詔荅云卿之伯氏天下文宗位歷先朝名高希代抗行周雅長揖楚詞調六氣於終篇正五音於逸韻泉飛藻思雲散襟情詩家者流時論歸美誦於人口乆鬰文房謌以國風冝登樂府眎朝之後一夜將觀石室所藏歿而不杇栢梁之會今也則亡乃春棣華克成編録聲猷益茂歎息良深商璠云維詩辭秀調雅意新理愜在泉爲珠看壁成繪一字一句皆出帝境至如落日山水好漾舟信歸風又澗芳襲人衣山月映石壁又天寒逺山靜日暮長河急又賤日豈殊衆貴來方悟稀又日暮沙漠陲戦聲煙塵裡詎肯慙於古人也送晁監歸日本國云積水不可極安知滄海東九州何重去萬里若乗空向國唯看日歸㠶但信風鼇身映天黒魚眼射波紅郷樹扶桒外主人孤島中别離方異域音信若為通送丘為云憐君不得意况復柳條春為客黄金盡還家白髮新五湖三畝宅萬里一歸人知禰不能薦羞稱獻納臣獵騎云風勁角弓鳴將軍獵渭城草枯鷹眼疾雪盡馬蹄輕忽過新豐市還歸細柳營回㸔射雕處千里暮雲平此詩家射鵬之手也更擇其極玄者自送晁監以後三詩姚合極元集云藍田精舎云落日山水好漾舟信歸風翫竒不覺逺因以㝷源窮遥愛雲木翠𥘉疑路不同安知清流轉偶與前山通捨舟理輕䇿果然愜所適老僧四五人逍遥䕃松栢朝𣑽林方曙夜禪山更寂道心友牧童世事問樵客瞑宿長林下焚香卧瑶席澗芳襲人衣山月映石壁再㝷畏迷誤明發更登歷笑謝桃源人花紅復來覿西施篇云艶色天下重西施寕又微朝仍越溪女莫作吳宮妃賤日豈殊衆貴來方悟稀要人傳脂粉不自着羅衣君寵益嬌態君憐無是非當時浣沙伴莫得同車歸寄言鄰家子効顰安可希未詳又字淇上别趙仙舟云相逢方一笑相送還成泣祖席忽傷離荒城復愁入天寒逺山静日暮長河急觧纜君已遥望君猶佇立李陵詠十九時年云漢家李將軍三代將門子結髪有竒䇿少年成壯士長驅塞上兒深入單于壘旌旗列相向簫皷悲何已日暮沙漠陲戰聲煙塵裏將令驕虜㓕豈獨名王侍既失大軍援遂嬰穹廬耻少小蒙漢恩何堪坐思此深哀欲有報投軀未能死引領望子卿非君誰相理渭城朝雨裛輕塵客舎青青柳色新勸君更盡一杯酒西出陽關無故人維送客詩也王縉縉字夏卿河中人與兄維俱以名聞舉草澤文辭清麗科上第相肅宗縉九月九日作云莫將邊地比京都八月嚴霜草已枯今日登高樽酒裏不知能有菊花無別輞川云山月曉仍在林風凉不絶殷懃如有情惆悵令人别贈曇壁上人云林中空寂舎階下終南山高卧一床地回㸔六合間浮雲幾處㓕飛鳥何時還問義天人接無心世界閑誰知大隱客兄弟自追攀遊悟真寺云聞道黄金地仍成白玉田擲山移巨石呪嶺出飛泉猛虎同三逕愁猿學四禪買香燃緑桂乞火踏青蓮草色揺霞上松聲泛月邊山河窮百二世界滿三千梵宇聊慿覽王城遂眇然㶚陵纔出樹渭水欲連天逺縣分朱郭孤村起白煙望雲思聖主披霧憶羣賢薄䆠慙尸禄終身擬尚玄誰言草庵客曾和栢梁篇送孫秀才云帝城風日好况復建平家玉枕䨇紋簟金盤五色瓜山中無魯酒松下飲胡麻莫厭田家苦歸期逺復賖裴廸過曇興上人山院云不逺㶚陵邊安居何十年入門穿竹徑留客曰或山泉鳥囀深林裏心閑落照前浮名竟何憶從此願棲禪未詳畎字聽廸𥘉與王維興宗俱居終南天寶後為蜀州刺史與杜甫友善姓崔興宗廸與王維訪逸人不遇賦詩云恨不逢君出荷蓑青松白屋更無他陶令五男曽不有蔣生三逕任相過芙蓉曲沼春流滿薜荔成帷晚靄多聞説桃源好迷客不如高卧盻庭柯維詩云桃源一向絶風塵柳市南頭訪隠淪到門不敢題凢鳥㸔竹何湏問主人城外青山如屋裏東家流水入西隣閉户著書多歳月種松皆作老龍鱗王維輞川集云餘别業在輞川山谷其遊止有孟城坳華子岡文杏舘斤竹嶺鹿柴聲去木蘭柴茱茰沜上潘切水流也去音匹半宫槐陌臨湖亭南垞茶音欹湖柳浪欒家瀬金屑泉白石灘北垞竹里舘辛夷塢漆園等與裴廸閑暇各賦絶句云維孟城坳云新家孟城口古木餘衰柳來者復為誰空悲昔人有廸和云結廬古城下時登古城上古城非疇昔今人自來徃維華子岡云飛鳥去不窮連山復秋色上下華子岡惆悵情何極廸和云落日松風起還家草露睎雲光侵履跡山翠拂人衣維文杏舘云文杏裁為梁香茅結為宇不知棟裏雲去作人間雨廸和云迢迢文杏舘躋攀日已屢南嶺與北湖前看復廻顧維斤竹嶺云擅欒映空曲青翠漾漣漪暗入商山路樵人不可知明流紆且直緑篠宻復深一逕通山路行歌望舊岑廸鹿柴云空山不見人但聞人語響返景入深林復照青苔上維日夕見寒山便爲獨徃客不知深林事但有麏麚迹廸木蘭柴云秋山歛餘照飛鳥逐前侣彩峰時分明夕嵐無處所維蒼蒼落日時鳥聲亂溪水縁溪路轉深幽興何時巳廸茱茰沜云結實紅且緑復如花更開山中儻留客置此芙蓉盃維飄香亂椒桂布葉間檀欒雲日雖廻照森沉猶自寒廸宮槐陌云返逕䕃宮槐幽隂多緑苔應門但迎掃畏有山僧來維門前宮槐陌是向欹湖道秋來山雨多落葉無人掃廸臨湖亭云輕舸迎上客悠悠湖上來當軒對樽酒四靣芙蓉開維當軒彌滉漾孤月正徘徊谷口猿聲發風傳入户來廸南垞云輕舟南垞去北垞淼難即融浦望人家遥遥不相識維孤舟信一泊南湖水㟁落日下崦嵫清波殊淼漫廸欹湖云吹簫凌極浦日暮送夫君湖上一廻首青山卷白雲維空闊湖水廣青熒天色同艤舟一長嘯四靣來清風廸柳浪云分行接綺樹倒影入清漪不學御溝上春風傷别離維映池同一色逐吹散如絲結隂旣得地何謝陶家詩廸欒家瀬云颯颯秋雨中淺淺石溜㵼跳波自相濺白鷺驚復下維瀬聲喧極哺㳂渉向南津汎汎鷗鳬渡時時欲近人廸金屑泉云日飲金屑泉少當千餘歳翠鳳翊文螭羽節朝玉帝維縈渟澹不流金碧如可拾迎晨含素華獨徃事朝汲廸白石灘云清淺白石灘緑蒲尚堪把家住水東西浣沙明月下維跂石復臨水弄波情未極日下川上寒浮雲澹無色廸北垞云北垞湖水北雜樹映朱欄逶迤南川水明㓕青林端維南山北垞下結宇臨欹湖毎欲採樵去扁舟出菰蒲廸竹里舘云獨坐幽篁裏彈琴復長嘯深林人不知明月來相照維來過竹里舘日與道相親出入唯山鳥幽深無世人廸辛夷塢云木末芙蓉花山中發紅蕚澗户寂無人紛紛開且落維緑堤春草合王孫自留翫况有辛夷花色與芙蓉亂廸漆園云古人非慠吏自闕滛世務偶寄一㣲官婆娑數株樹維好閑早成性果此諧宿諾今日漆園遊還同莊叟樂廸椒園云桂樽迎帝子杜若贈佳人椒漿奠瑶席欲下雲中君維丹刺刺人衣芳香留過客幸填調鼎用願君垂採摘廸李頎聖善閣送廸入京云雪華歛高閣苔色上鈎欄藥草空階静梧桐返照寒清吟可愈疾携手暫同歡墜葉和金磬飢烏鳴露盤伊川惜東别㶚水向西看舊託含香署雲霄何足難崔興宗興宗為右𥙷闕時和王譙勑賜櫻桃詩云未央朝謁正逶迤天上櫻桃錫此時朱實𥘉傳九華殿繁花舊雜萬年枝全勝晏子江南橘莫比潘家大谷梨聞道令人顔色好神農本草自應知喜群公訪林亭云窮巷深林常閉關悠然獨卧對前山今朝忽枉嵇生駕倒屣開門遥觧顔王維詩云緑樹重隂蓋四隣青苔日厚自無塵科頭箕踞長松下白眼看君是甚人盧象云映竹時聞轉轆轤當䆫只是網蜘蛛主人非病常高卧堵蒙籠一老儒王縉云聲名不問十年餘老大誰能更讀書林中獨酌隣家酒門外時聞長者車裴廸云喬柯門裏自成隂散髪䆫中曾不簮逍遥且喜從吾事榮寵從來非我心為處士時號興宗又王維有崔九徃南山馬上口號與别云城隅一分首幾日還相見山中有桂花莫待花如霰裴廸云歸山深淺去湏盡丘壑美莫學武陵人暫遊桃源裏興宗留别云駐馬欲分襟清寒御溝上前山氣景佳獨徃還惆悵王維與興宗冩真詠云畫君年少時如今君已老今時新識人知君舊時好王維送興宗遊蜀云送君從此去轉覺古人稀徒御猶回首田薗方掩扉出門當旅食中路授寒衣江漢風流地遊人何歳歸唐詩紀事卷第十六
