front:
  text: 唐詩紀事卷第四十五
  hash: sha256:b333b0d2919feb02c88e58731e29c9836f19e8cbd455771f42416a9789b0c544
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_045-1a}
body:
  text: 朱灣王良㑹柳公綽張正一徐放崔備蘇郁胡幽貞張儼杜韋丹鄭俞杜元頴吳丹鄭餘慶趙宗儒周弘亮王播周匡物許玫張碧朱灣壁畫古松詩云石上盤古根謂言天生朽安知草木性變在畫師手隂深方丈間真趣幽且間木文離披勢搓捽中裂空心火燒出掃成三寸五寸枝便作千年萬年物莓苔濃淡意不同一半死皮藏蠧蟲風霜未必來到此氣色杳似寒山中孤摽可玩不可取能使支公道場古平陵寓居再逢寒食云幾回江上泣途窮每遇良晨歎轉蓬火燧知從新節變灰心還與故人同莫聽黃鳥啼愁處自有花開向客中貧病固應無撓事但將懷抱醉春風逼寒節寄崔七云間庭只是長莓苔三徑曾無車馬來旅館尚愁寒食火羈心懶向不燃灰門前下客雖彈鋏溪畔窮魚且曝鰓他日趍庭因問禮須言陋巷有顏回九日登青山云昔人惆悵地繫馬又登臨舊處煙霞在多時草木深水將空合色雲共我無心想見龍山㑹良辰亦似今灣别湖州崔使君侃書云灣聞蓬萊之山藏杳冥而可到驪龍之珠潜瀇滉而可識貴人之顏無因而前不可識灣自假道路問津主人一身孤雲兩度圓月凡再請職事三趍㦸門門人謂灣曰子私來耶公來耶若言公僕實非公若言私公庭無私以兹交戰倣徨于今信知庭之與堂不啻千里况寄食漂母夜眠漁舟門如龍而難登食如玉而難得如龍之門轉深如玉之粟轉貴實無機心翻成機事漢隂丈人聞之豈不大笑屬溪上風便囊中金貧望甘棠而歎自引分而退也髙仲武云朱灣率履正素放情江湖郡國交辟潜耀不起有唐髙人也詩體幽逺興用洪深因詞寫意窮理盡性於詠物尤工如受氣何曾異開花獨自遲所謂哀而不傷國風之深者也灣為李勉永平從事灣秋夜燕王郎中宅賦得露中菊云衆芳春競發寒菊露偏滋受氣何曾異開花獨自遲晚成猶有分欲採未過時忍棄東籬下看隨秋草衰賦得白鸖翔翠微送陳偃下第云不知鷗與鸖天畔弄晴暉背日分明見臨川相映微淨中雲一㸃回去雪孤飛正好南枝住翩翩何所依長安喜雪云千門萬戶雪花浮㸃㸃無聲落瓦溝全似玉塵消更積半成冰片結還流光含曉色清天苑輕逐微風繞御樓平地已霑盈尺潤年豐須荷富人侯取為又元集右三詩韋莊王良㑹武元衡鎮西蜀有中秋夜錦樓望月詩云玉輪初滿空逈出錦城東相向秦樓境分飛碣石鴻桂香隨窈窕珠綴隔玲瓏不及前秋見團圓鳳沼中良㑹和云德星搖此夜珥月滿重城杳靄煙氣色飄䬙砧杵聲令行秋氣爽樂感素風輕共賞千年聖長歌四海清字得清良㑹以內侍省內侍省為監軍使柳公綽和錦樓玩月詩云此夜年年月偏宜此地逢近看江水淺遙辨雪山重萬井金花肅千林玉露濃不唯樓上思飛蓋亦陪從字得濃公綽裴度同為西蜀武元衡判官綽先入為吏部郎中度有詩曰兩人同日事征西今日君先奉紫泥公綽字寬京兆人時為西川營田副使兼少尹後終於刑部尚書取士如許康佐崔與李拭韋長皆知名貴顯云張正一和錦樓玩月詩云髙秋今夜月皓色正蒼蒼逺水澄如練孤鴻逈帶霜旅人方積思繁宿稍沉光朱檻叨陪賞尤宜清漏長字得蒼正一時為西川觀察判官正一德宗末年為左補闕以上書召見王叔文之黨疑正一言巳隂事令韋執誼反譛於上乃與所善王仲舒劉伯芻皆坐逺貶徐放和錦樓玩月詩云玉露中秋夜金波碧落開鵲驚初泛濫鴻思共徘徊逺目清光遍髙空爽氣來此時陪永望更得上燕臺放字逹夫元衡西川從事元和九年為衢州刺史見退之徐偃王廟碑崔備字二篇得前字秋和錦樓玩月詩云清景同千里寒光盡一年竟天多鴈過通夕少人眠照别江樓上添愁野帳前隋侯恩未報猶有夜珠圓又云四時皆有月一夜獨當秋照曜初含露徘徊正滿樓遙連雪山淨逈入錦江流願以清光末年年許從游備時為西川度支判官備使院憶山中道侶兼懷李約云松竹去名嶽衡茅思舊居山君水上印天女月中書舊秩藝香在空奩藥氣餘褐衣寬易攬白髮少難梳病柳傷摧折殘花惜掃除憶巢同倦鳥避網甚跳魚阮巷慙交絶啇嵓愧跡踈與君非宦侶何日共樵漁清溪路中寄諸公云偏郡隔雲岑回溪路更深少留攀桂樹長渴望梅林野筍資公膳山花慰客心别來無信息可謂井瓶沉備登建中進士第終工部郎中兄弟備侃元衡中秋夜聽歌聮句此夕來奔月何時去上天備雲鬢方自照玉腕更呈鮮度嬿婉人間意飄䬙物外緣相公公綽上詩裁明月扇歌索想夫憐盧侍御元衡奉暗染筒香久長隨楚夢偏放㑹當來彩鳳髣佛逐神仙十一政元衡在蜀淡於接物而開府極一時選公綽為少尹正一觀察判官備度支判官裴度掌書記盧士玫觀察推官楊嗣復節度推官蘇郁鸚鵡詞云莫把金籠閉鸚鵡箇箇分明解人語然忽更向君前語三十六宮愁幾許和戎詩云關月夜懸青塜鏡寒雲秋薄漢宮羅君王莫信和親䇿生得胡雛轉更多郁正元元和間詩人十二樓藏玉堞中鳳凰雙宿碧芙蓉流霞淺酌誰同醉今夜笙歌弟幾重詞步虗吟倚雨殘樹月收山下村句右張為取作主客圖胡幽貞題西施浣沙石云一朝入紫宮萬古遺芳塵至金溪邊花不敢嬌靑春歸四明詩云海色連四明仙舟去容易天籍豈輒問不是卑朝士張為取二詩作主客圖張儼貞元八年十二月謁先主廟絶句三首其一云仗順繼皇業并吞勢由巳天命屈雄圖誰歌大風起其三得股肱賢明能以竒用兵何事傷客情何人歸帝京其三雄名垂竹帛荒陵壓阡陌終古更何聞悲風入松柏杜頠故綘行云君不見銅鞮觀數里城池巳蕪漫君不見析裭宮幾重臺榭亦微䝉介馬兵車全盛時歌童舞女妖豔姿一代繁華皆共絶九原唯望塜纍纍韋丹江西韋大夫丹與東林靈徹上人為忘形之契丹嘗為思歸絶句以寄徹公云王事紛紛無暇日浮生冉冉只如雲已為平子歸休計五老嵓前必共聞徹奉酬詩曰年老身間無外事麻衣草坐亦容身相逢盡道休官去林下何曾見一人丹字分明京兆人幼孤從外祖顏真卿元和中守江西功第一鄭俞玉水記方流詩云積水棊風動因知玉德幽如天含素色侔地引方流潜潤滋雲起熒華射浪浮魚龍水不夜草木岸無秋璧沼寧堪北瑶池詎可儔若非懸坐側猶得兾冥搜俞登正元十六年進士第杜元頴吳丹白樂天皆同年登科樂天為河南尹俞始受長水縣令樂天四雖呤云命雖薄猶勝於鄭長水杜元頴玉水記方流詩云重泉生美玉積水異常流始玩清堪賞因知寶可求斗回清氣見磬折紫花浮中矩皆明德同方叶至柔月華偏共映風韻喚將遊遇鑒終無暗逢時願見收元頴淹之孫也正元末登第敏文辭憲宗時所賞嘆穆宗立拜中書舍人不閲歲至宰相再朞鎮蜀敬宗驕僻元頴裒斂上供削軍食遂啓南詔之冦斥為循州司馬死貶所在蜀時官屬崔璜訖于衆盧并奪秩分逐之吳丹玉水記方流詩云玉泉何處記四折水紋浮淵下不逾矩居方在上流映空虛漾漾涵日靜悠悠影碎疑衝斗光清耐觸舟圭璋分辨狀砂礫共懷愁願獻朝賔海縈回入御溝樂天花前嘆云前歲花前五十二今歲花前五十五歲課年功頭髮知從霜成雪君看取幾人得老莫自嫌樊李吳韋盡成土注云樊絳州宗師李諫議景儉吳饒州丹韋侍郎顗皆舊往還相次喪逝丹字真存登苐歷職至鎮州宣慰副使使尚書郎卒于饒州葬於常州樂天為志鄭餘慶和黃門相公過石門洞云紫氛隨馬處黃閣駐車情嵌壑驚山勢洲灘戀水深地分三蜀限關志百牢名琬琰攀酬郢微言鼎飪情元衡也黃門武餘慶字居業滎陽人善屬文嚴震帥山南西道奏置幕府正元末為相憲宗立再相出鎮山南西道穆宗立加檢校司徒卒趙宗儒宗儒字秉文鄧州人父驊有文名宗儒為翰林學士驊改祕書少監父子並命驊少與殷寅顏真卿柳芳陸據蕭頴士李華邵軫善時語曰殷顏柳陸李蕭邵趙謂皆全交也宗儒正元十二年為相以文學歷將相位任崇劇然無儀矩以治生瑣碎失名和黃門相公詔還題石門洞云益部恩輝降同榮漢相還韶芳滿歸路軒騎出重關望日朝天闕披雲過蜀山更題風雅韻永絶翠嵓間元衡也黃門武周弘亮除夜書情詩云何處風塵歲雲陽古驛前三冬不再稔曉日又明年春入江南柳寒歸塞北天還傷知候客花景對韋編故鄉除夜詩云三百六十日云終故鄉還與異鄉同非唯律變情堪恨抑亦才踈命未通何處夜歌銷臘酒誰家髙燭候春風詩成始欲吟將看早是去年牽課中弘亮登正元進士第王播王播少孤貧嘗客楊州惠照寺木蘭院隨僧齊飱僧厭怠乃齊罷而後擊鍾後二紀播自重位出鎮是邦因訪舊遊向之題名皆以碧紗幕其詩播繼以二絶句曰三十年前此院遊木蘭花發院新修如今再到經行處樹老無花僧白頭上堂已了各西東慙愧闍梨飯後鍾三十年來塵撲面而今始得碧紗籠言也出摝播字明敏父恕家楊州播正元中與弟炎起皆有名穆宗立為相居位無所裨益復失河北衆望不厭乃出為淮南節度大和初復輔政時韋處厚以獻替自任而播專以錢榖進不甚與事居位四年卒播為淮南節度使逰故居感舊詩云昔年獻賦去江湄今日行春到却悲三徑僅存新竹樹四鄰惟見舊孫兒壁間潜認偷光處川上寧忘結網時更見橋邊記名姓始知題柱免人嗤李德𥙿和云千騎風生大斾舒春江重訪武侯廬共提龜印銜新授同憶鱣庭是故居取履橋邊啼鳥換釣璜溪畔野花踈今來却笑臨卭客入蜀空馳使者車周匡物匡物字幾夲潭州人元和十一年李逢吉下進士及苐時以歌詩著名家貧徒步應舉至錢塘乏僦船之資久不得濟乃題詩公館云萬里茫茫天塹遙秦皇底事不安橋錢塘江口無錢過又阻西陵兩信潮郡牧見之乃罪津吏及苐後謝座主云一從東越入西秦十度聞鶯不見春試向昆山投瓦礫便容靈沼洗埃塵悲歡暗負風雲力感激潜生木植身中夜自將形影語古來吞炭是何人許玫題鴈塔云寶輪金地壓人寰獨坐蒼蓂啓玉關北嶺風煙開魏闕南軒氣象鎖啇山灞陵車馬垂楊裏京國城池落照間暫放塵心逰物外六街鍾鼓又催還玫大和元年登苐其兄弟琯瓘皆髙科張碧秋日登嶽陽樓晴望云三秋綺練飛金盞洞庭波定平如剗天髙雲卷緑羅低一㸃君山礙人眼漫漫萬頃鋪琉璃煙波闊逺無鳥飛西南東北競無際直疑浸斷青天涯屈原回日牽愁吟龍宮感激致應沉賈生憔悴說不得茫茫煙靄堆湖心又云范蠡帆張一掌風無人來往繼其中鴻溝云毒龍銜日天地昏八紘靉靆生愁雲秦原走鹿無藏處紛紛爭處蜂成羣四溟波立鯨相吞蕩搖五嶽崩山根魚蝦舞浪狂鰍鯤龍蛇膽戰登鴻門星旗羽鏃强者尊黑風白雨東西屯山河欲折人煙分壯士鼓勇君王存項莊憤氣吐不得亞父㪷聲天上聞玉光墮地驚崑崙留侯氣魂吞太華舌頭一寸生陽春神農女媧愁不言蛇枯老媪啼泪㾗星曹定稱稱王孫項籍骨輕迷精魂沛公仰面爭乾坤須臾垓下賊星起歌聲繞繚悽人耳吳娃捧酒橫秋波霜天月照空城壘力拔山兮呼到此騅嘶懶渡烏江水新豐瑞色生樓臺西楚寒蒿哭愁鬼三尺霜鳴金匣裏神光一八千里漢皇驟馬意氣生西南掃地迎天子美人梳頭云玉堂花院小枝紅緑窗一片春光曉玉容驚覺濃睡醒圓蟾挂出妝臺表金盤解下叢鬟碎三尺巫雲綰朝翠皓指髙低寸黛愁水精梳滑參差墜須臾攏掠蟬鬢生玉叉冷透冬氷明芙蓉拆向新開臉秋泉慢轉眸波橫鸚鵡偷來話心曲屏風半倚遙山緑題祖山人池上怪石云寒姿數片竒突兀曾作秋江秋水骨先生應是厭風雲著向江邊塞龍窟我來池上傾酒樽半酣書破青煙㾗參差翠縷擺不落筆頭驚怪粘秋雲我聞吳中顧容水墨有髙價邀得將來倚松下鋪却䨥繒直道難掉首空歸不成畫孟東野讀張碧集詩云天寶太白沒六義已消歇大哉國風本喪而王澤竭先生今復生斯文信難缺下筆證興亡陳辭備風骨髙秋數奏琴澄潭一輪月誰作採詩官忍之不揮發碧字大碧正元中人自序其詩云碧嘗讀李長吉集謂春拆紅翠霹開蟄戶其奇峭者不可攻也及覽李太白詞天與俱髙青且無際鵬觸巨海瀾濤怒翻則觀長吉之篇若陟嵩之巔視諸阜者耶余嘗鋭志狂勇心魄恨不得攤文陳以交鋒覩拔㦸挾輈而比矣唐詩紀事卷第四十五
