front:
  text: 唐詩紀事卷第八
  hash: sha256:c8451aa0486ab171a287d5df235ad8ee28610e00e5ea44718a30ab334e674f35
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_008-1a}
body:
  text: 陳子昻邵大震李日知李景百劉禕之王無競袁恕巳郭元震崔融張昌齡陳子昻字伯玉梓州人資褊躁然好施豫篤朋友與陸餘慶王無競房融崔泰之盧藏用趙元最厚唐興文章承徐庾餘風子昻始變雅正為感遇詩三十八篇王適曰是必為海內文宗子昻趙貞固盧藏用杜審言宋之問畢隆澤郭襲微司馬承􅐃釋懷一陸餘慶號方外十友盧黃門藏用曰道喪五百嵗而得陳君激昻頺俗雖顔真卿曰若隱侯論謝康樂靈均以來此祕未覩同也無害於過正權其中論不亦傷於厚誣與沈開寶中梓州刺史郭廷謂以詩哭之略曰魄逐東流水墳依獨坐山退之薦士詩曰國朝盛文章子昻始髙蹈黃門侍郎盧藏用祭文曰天之生也珠圓流兮玉方潔子之歿也太山頺兮良玉折士林閴寂兮人物踈門館蕭條兮賔侣絶嘆佳城之不返辭玉階而長别鳴呼置酒祭子子不顧亢聲哭子子不回唯天道而無託但無心而巳摧獨異記載子昻初入京不為人知有賣胡琴者價百萬豪貴傳視無辨者子昻突出謂左右曰輦千緡市之衆驚問答曰余善此樂皆曰可得聞乎曰明日可集宣揚里如期偕往則酒肴畢具置胡琴於前食畢捧琴語曰蜀人陳子昻有文百軸馳走京轂碌碌塵土不為人知此樂賤工之役豈宜留心舉而碎之以其文軸遍贈會者一日之內聲華溢郡時武攸宜為建安王辟為書記感遇詩云微月生西海幽陽始代升圓光正東滿隂魄巳朝凝太極生天地三元更廢興至精諒斯在三五誰能徵一其蘭若生春夏芊蔚何青青幽獨空林色朱蕤冒紫莖遲遲白日晚嫋嫋秋風生嵗華盡搖落芳意竟何成二其蒼蒼丁零塞今古緬荒途亭堠何摧兀暴骨無全軀黃沙暮南起白日隱西隅漢甲三十萬曾以事胸奴但見沙場死誰憐塞上孤三其樂羊為魏將食子殉軍功骨肉且相薄他人安得忠吾聞山中相乃屬放麑翁孤獸猶不忍况以奉君終四其市人矜巧智於道若童蒙傾奪相夸侈不知身所終曷見玄真子觀世玉壺中杳然遺天地乘化入無窮五其吾觀龍變化乃知至陽精石林何冥密幽洞無留行古之得仙道信與元化並玄感非象識誰能測淪冥世人拘目見酣酒笑丹經昆崘有瑶樹安得采其英六其白日每不歸青陽時暮矣茫茫吾何思林卧觀無始衆芳委時晦鶗鵊悲鳴耳鴻荒古已頺誰識巢居子七其吾觀昆崘化日月淪洞冥精魄相交會天壤以羅生仲尼推太極老聃貴窈冥西方金仙子崇議乃無明空色皆寂滅業緣定何成名教信紛藉死生俱未停八其聖人祕元命懼世亂其真如何嵩公輩詼譎誤時人先天誠為美階亂禍誰因長城備胡寇嬴禍發其親赤精既迷漢子年何救秦去去桃李花多言死如麻九其深居觀群動悱然爭朵頥群動相啖食利害紛疑疑便便夸毗子榮耀更相持務灮讓天下商賈競刀錐已矣行采芝萬世同一時十其吾愛鬼谷子青溪無垢氛囊括經世道遺身在白雲七雄方龍鬪天下亂無君浮榮不足貴遵飬晦時文舒可彌宇宙卷之不盈分豈徒山木壽空與麋鹿群十一其􅊯􅊯南山鹿離罟以媒和招搖青桂樹幽蠧亦成科世情甘近習榮耀紛如何怨憎未相復親愛生禍羅瑶臺傾巧笑玉杯殞雙娥誰見枯城蘖青青成斧柯二十林居病時久水木淡孤清間卧觀物化悠悠念無生青春始萌逹朱玉巳滿盈殂落方自此感歎何時平三十臨岐泣世道天命良悠悠昔日殷王子玉馬遂朝周寶鼎淪伊穀瑶臺成古丘西山傷遺老東陵有故侯四十貴人難得意賞愛在須臾莫以心如玉探他明月珠昔稱夭桃子今為舂市徒鴟梟悲東國麋鹿泣沽蘇誰見鴟夷子扁舟去五湖五其十聖人去巳久公道𬗟良難蚩蚩夸毗子堯禹以為謾驕榮貴工巧勢利迭相干燕玉尊樂毅分國願同歡魯連讓齊爵遺組去邯鄲伊人信往矣感激為誰歎六十幽居觀大運悠悠念群生終古代興沒豪聖莫能爭三季淪周赧七雄滅秦嬴復聞赤精子提劒入咸京炎灮既無象晉虜紛縱橫堯禹道已昧昏虐勢方行豈無當世雄天道與胡兵咄咄安可言時醉而未醒仲尼溺東夏伯陽遁西溟大運自古來旅人胡歎哉七十逶迤世巳久骨鯁道斯窮豈無感激者時俗頺此風灌園何其鄙皎皎於陵子世道不相容嗟嗟張長公八十聖人不利巳憂濟在元元黃屋非堯意瑶臺安可論吾聞西方化清淨道彌敦奈何窮金玉雕刻以為尊雲架山林盡瑶圖珠翠煩鬼功尚未可人力安能存夸愚適增纍矜智道逾昏九十玄天幽且默群議曷嗤嗤聖人教猶在世運久陵遲一繩將何繫憂醉不能持去去行采芝勿為塵所欺十二蜻蛉遊天下與世本無患飛飛未能止黃雀來相干穰侯富秦寵金石比交歡出入咸陽裏諸侯莫敢言寧知山東客激怒秦王肝布衣取丞相千載為辛酸一二微霜知嵗晏斧柯始青青况乃金天久浩露霑群英登山望宇宙白日巳西暝雲海方蕩潏孤鱗安得寧二二翡翠巢南海雄雌珠樹林何知美人意驕愛比黃金殺身炎洲裏委羽玉堂隂旖旎光首飾葳蕤爛錦衾豈不在遐逺虞羅匆見尋多材信為纍歎息比珍禽三二挈瓶者誰子姣服當青春三五明月滿盈華不自珍髙坐委金玉微縷懸千鈞如何負公鼎被敓笑時人四二寒蟬號白露兹歲巳蹉跎群物從大化孤英將奈何瑶臺有青鳥逺食玉山禾昆崘見玄鳯豈復羅雲龍五二荒哉穆天子始與白雲期宫女多怨曠層城閉峨眉日晚瑶臺樂豈傷桃李時青苔空萎絶白髮生羅帷六二朝發宜都渚浩然思故鄉故鄉不可見但見巫山陽巫山彩雲沒髙丘正微茫佇立望巳久涕淚霑衣裳豈慈越鄉感憶昔楚襄王朝雲無處所荆國亦淪亡七二十昔日章華宴荆王樂荒淫霓旌翠羽蓋射兕雲夢林朅來髙堂觀悵望陽雲岑雄圖今何在黃雀空哀吟八二十丁亥歲云暮西山事甲兵贏糧市卭道荷戟爭羌城嚴冬隂風徑窮岫油雲生昏黷無晝夜羽檄復相驚拳局兢萬仞崩危走九冥籍籍峰壑裏哀哀氷雪行聖人御宇宙聞道太階平肉食謀何朱藜藿𬗟縱橫九二十可惜瑶臺樹灼灼佳人姿碧華映朱實攀折青春時豈不盛光寵榮君白玉墀但恨紅芳歇凋傷感所思十三朅來豪遊子勢利禍之門如何蘭膏歎感激自生怨衆趨明所避時棄道猶存雲泉既巳失羅網與誰論箕山有髙節湘水有清源唯應白鷗鳥可為洗心言一三十索居猶幾日炎夏忽然衰陽彩皆隂翳親友盡暌違登山望不見涕泣久漣洏宿昔感顔色若與白雲期世中驕豪子驅逐正嗤嗤蜀山與楚水携手在何時二三十金鼎合神丹世人將見欺飛飛騎羊了胡乃在峨眉變化固幽類芳菲能幾時疲痾苦淪世憂痗日侵淄眷然顧幽褐白雪空涕洟㙋三三朔風吹海樹蕭條邊巳秋亭上誰家子哀哀明月樓自言隂燕客結髮事逺遊赤丸殺公吏白刃報私讎避仇至海上被役此邊州故鄉三千里遼水復悠悠每憤胡兵入常為漢國羞何知七十載白首未封侯四三十本為貴公子平生實憂才感時思報國拔劒起蒿萊西馳丁令塞北上單于臺登山見千里懷古心悠哉誰言未忘禍磨沒成塵埃十五其三浩然坐何慕吾蜀有峨眉念與楚狂子悠悠白雲期時哉悲不會涕泣久漣洏夢登西山冗南采巫江芝探元觀造化遺出從雲螭婉戀將永矣感悟不見之十六其三朝入雲中郡北望單于臺胡秦何密邇沙朔氣雄哉藉藉天驕子猖狂已復來塞垣無名將亭堠空崔嵬咄嗟吾何歎邊人塗草萊十七其三仲尼探元化幽鴻順陽和大運自盈縮春秋遞來過首飈忽號怒萬物相紛劘溟海皆震蕩孤鳯其如何十八其三邵大震九日登玄武山旅眺云九月九日望遙空秋水秋天生夕風寒鴈一向南飛逺遊人幾度菊花叢盧照鄰和云九月九日眺山川歸心歸望積風煙他鄉共酌金花酒萬里同悲鴻鴈天玄武山在今東蜀髙宗時王勃以檄雞文斥出沛王府既廢客劒南有遊玄武山賦詩照鄰為新都尉大震其同時人也勃詩云九月九日望鄉臺他席他鄉送客杯人今巳厭南中苦鴻鴈郍從北地來李日知鄭州人景龍初為相初安樂公主館第成中宗臨幸燕從官賦詩日知卒章曰所願但知居者樂無使時稱作者勞獨以規誡睿宗他日謂曰嚮時雖朕亦不敢諫非卿亮直何能爾即拜侍郎亮直唐書本傳作挺直李景伯中宗宰相懷逺之子景龍初為諫議大夫中宗宴侍臣酒酣各命為廽波辭景伯獨為針規語帝不悅蕭至忠曰真諫官也回波辭曰回波爾持酒巵微臣職在針規侍宴既過三爵喧譁切恐非宜劉禕之字希美常州人與孟利貞髙智周郭正一俱有名號劉孟髙郭上元中與元萬頃等偕召入禁中論次新書髙宗又密與參決時政以分宰相權時謂北門學士武后時以罪賜死九成宫秋初應制詩云玄圃疏金闕仙臺駐玉鑾野分仙鸑岫路接寶雞壇林樹千霜積山宫四序寒蟬急知秋早鶯踈覺夏闌怡神紫氣外凝涕白雲端舜海詞波發空驚遊聖難和太子納妃公主出降詩曰夢梓青灮陛穠桃藹紫宫德優宸念逺禮備國姻崇萬戶聲明發三條騎吹通香輪送重景綵斾引仙虹奉和别越王詩云周屏辭金殿梁驂整玉珂管聲依折柳琴韻動流波鸖蓋分隂促龍軒别念多延襟小山路還起大風歌王無競字仲列宋太尉弘之裔氣豪縱下筆成章為殿中侍御史張易之等誅坐嘗交貶廣州仇家矯制榜殺之巫山詩云神女向髙唐巫山下夕陽徘徊作行雨婉孌逐荆王電影江前落雷聲峽外長霽雲無處所臺館曉蒼蒼宋之問下山歌云懷嵩丘兮所思携佳人兮步遲松間明月長如此君再遊兮復何時無競和云日云暮兮嵩山路連綿兮樹石間谷口兮見明月心徘徊兮不能還袁恕巳詠屏風云綺閣雲霞滿芳林草樹新鳥驚疑欲曙花笑不關春山對彈琴客溪流垂釣人請看車馬客行處有風塵恕巳滄州人與誅二張相中宗及貶周利正逼殺之郭元震古劒歌云君不見昆吾鐡冶飛炎煙紅灮紫氣俱赫然良工煆鍊凡幾年鑄得寶劒名龍泉龍泉顔色如霜雪良工嗟咨歎竒絶琉璃玉匣吐蓮花錯鏤金環生明月正逄天下無風塵幸得用防君子身精灮黯黯青蛇色文章片片緑龜鱗非直結交遊俠子亦曾親近英雄人何言中路遭棄捐零落飄淪古獄邊雖復沉埋無所用猶能夜夜氣衝天詩云壯公臨事斷子美過代公故宅劒篇神交付溟漠顧步涕橫落髙詠寶元振尉通泉任挾使氣撥去小節武后知所為召欲詰既與語竒之索所為文章上寶劒篇后覽嘉嘆詔示學士李嶠等久戍人偏老長征馬少肥元振警句也元振嘗山居夜有人靣如盤出燈下元振以此詩題其頰遂滅明日出行巨木上有白耳此句在焉元振魏州人年十六與薛稷趙彥昭同為大學生資雄邁景雲中位宰相崔融融字成安齊州人擢八科髙第與李嶠蘇味道王紹宗附易之兄弟杜審言為融所奬引為服緦麻子禹錫翹知名孫巨曾孫從和宋之問寒食題黃梅臨江驛云春分自淮北寒食渡江南忽見潯陽水疑是宋家潭明主閽難呌孤臣逐未堪遙思故園陌桃李正酣酣宋之問詩云馬上逄寒食愁中屬暮春可憐江浦望不見洛橋人北極懷明主南溟作逐臣故園腸斷處日夜桞條新戶部尚書崔公挽歌云八座圖書委三臺章奏盈舉杯常有勸曵履忽無聲市若荆州罷池如薛縣平空餘濟南劒天子署髙名詠劒詩云寶劒出昆吾龜龍夾采珠五精初獻術千戶競論都匣氣衝牛斗山形轉鹿廬欲知天下貴持此問風湖未詳風湖字則天皇后挽歌云前殿臨朝罷長陵合葬歸山川不可望文物盡成非隂月霾中道軒星落太微空餘天子孝松上景雲飛韋長史挽詞云日落桑榆下寒生松柏中冥冥多苦霧切切有悲風京兆新阡闢扶陽甲第空郭門從此送荆棘漸蒙籠崔融瓦松賦序曰崇文館瓦松者産于屋霤之下謂之木也訪山客而未詳謂之草也驗神農而罕記賦云煌煌特秀狀金芝之産霤歷歷虛懸若星榆之種天葩條郁育根抵連卷間紫苔而裛露凌碧瓦而含煙又曰慙魏宫之烏悲惡漢殿之紅蓮崔公博學莫不該悉豈不知瓦松巳有舊説乎博雅云在屋曰昔邪在墻曰垣衣廣志謂之香生於久屋之瓦魏明帝好之命長安西載其瓦於洛陽以覆屋前代詞人詩中多用昔邪梁簡文詠薔微曰緣階覆碧倚依簷映昔邪或言屋上木多松栽土木氣泄則瓦松生出酉陽雜爼未詳烏悲字久視元年改控鸖府為奉宸府張易之為奉宸令引詞人為供奉佞者奏云昌宗王子晉後身令被羽衣吹簫乘木鸖奏樂於庭融賦詩為絶唱有昔遇浮丘伯令同丁令威中郎才貌是藏史姓名非之句後與宰相蘇味道相誚云某詩所以不及相公無銀花合也蘇有詩云火樹銀花合味道云子詩雖無銀花合還有金銅丁取令威之句也融為文華婉當時未有輩者朝廷大筆多手敕委之撰武后哀册最髙麗絶筆而死時謂思苦神竭云張昌齡冀州人與兄昌宗皆能文昌齡舉進士與王公治齊名皆為考功王師旦所絀太宗問之答曰昌齡等華而少實其文浮靡非令器也取之則後生勸慕亂陛下風雅帝然之後獻翠微宫頌敕於通事舍人裏洪奉賀蘭敏之奏豫北門修撰卒南部新書云昌齡與文皇作息兵詔嘆曰禰衡潘嶽之儔也唐詩紀事卷第八
