  text: 唐詩紀事卷第四十六
  hash: sha256:582c1dc9e4667defd5cd24efca242795cd70ad089046f74f65a282d2c96290b8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_046-1a}
body:
  text: 劉言史劉猛李餘李涉劉昭禹孫昌胤嚴休復朱慶餘劉軻獨孤鉉張燦楊虞卿楊汝士張志和劉言史竹裏梅云竹裏梅花相並枝梅花正發竹枝垂風吹總向竹枝上直似王家雪下時春過趙墟有作云下馬邯鄲陌頭歇寂寥崩隧臨車轍古柏重生枝亦乾餘漆見風幽焰滅白蒿微紫槿新行人感此復悲春初下東周贈孟郊云鸖老耳更工龜死殼亦靈正信非外㳂終始全本情童子不戲塵積書就嵓扃身著木葉衣養鹿兼㹀耕偶隨下山雲荏苒失故程漸入機險中危思難泰行十髮九縷絲悠然東周城言詞野麋態出口多纍刑因依漢元寮似羇細輕泠竈助新熱靜砧與寒聲清斷蓬在門欄豈當桃李榮寄食若蠧蟲侵損利微生固非拙為強懦劣寂療并素堅氷蘗心潔立保賢貞修文返正風刋字齊古經慙將衰末分髙棲喧世名過春秋峽云峭壁蒼蒼苔色新無風晴景自勝春不知何樹幽崖裏臘月開花似北人長門怨云獨坐爐邊結夜愁暫時思去亦難收手持金筯垂紅淚亂撥寒灰不舉頭樂府新詞云花顔鬢髮一何偏緑槐香陌欲朝天仍嫌衆裏嬌行疾傍鐙深藏白玉鞭噴沫團香小桂條玉鞭兼賜霍嫖姚弄影便從天禁出碧蹄聲碎五門橋廣州王園寺伏日即事寄北中親友云南越逢初伏東林度一朝曲池煎畏景髙閣絶微飈竹簟移先灑蒲葵破復搖地偏毛瘴近山毒火威饒裛汗絺如濯親床枕並燒墮枝傷翠羽萎葉惜紅蕉且困流金熾難成獨酌謡望霖窺潤礎思吹候生條旅恨生烏滸鄉心繫洛橋誰憐在炎客一夕壯容銷言史與孟東野友善詩中有貝州召郊之作又有金陵瀟湘之遊廣州贈北中親友詩蓋言史平生所經歷處東野哭言史詩云精異劉言史詩腸傾珠珂取此為拋擲飛過東溟波可惜大國謡揚為四夷歌常於衆中㑹顔色兩切嗟今日果成死葬喪之洛河言史送婆羅門歸本國詩云剎利王孫字迦攝竹錐橫寫吒蘿葉遙知漢地未有經手牽白馬繞天行龜兹磧酉胡雪黑大師凍死來不得地盡年深始到船海裏更行三十國行多耳斷金環落冉冉悠悠不停腳馬死經留却去時往來應盡一生期出漢獨行人絶處磧西天漏雨絲絲瀟湘遊云夷女采山蕉緝紗浸江水野花滿髻妝花新間歌曖乃深峽裏曖乃知從何處生當時泣舜腸斷聲翠華寂寞嬋娟沒野篠空餘紅淚情青煙冥冥覆杉桂崖壁麥天風雨細昔人幽恨此地遺緑芳紅豔含怨姿清猿未盡鼠切汩水流到湘妃祠北人莫作瀟湘遊九疑雲入蒼梧愁放螢怨云放螢去不須留聚時年少今白頭架中科斗萬餘卷一字重回重照見靑雲杳眇不可親開囊欲放增餘怨且逍遙還酩酊仲舒漫不窺園井那將寂寞老病身更就微蟲借光影欲放時泪沾裳衝籬落千㸃光觀繩伎云泰陵遺樂何最珍綵繩冉冉天仙人廣揚寒食風日好百夫伐鼓錦臂新銀畫靑綃抹雲髮髙處綺羅香更切重肩接立三四層著屐背行仍應節兩邊圓劒漸相迎側身交步何輕盈閃然欲落却收得萬人肉上寒毛生危機險勢無不有倒掛纎腰學垂柳下來一一芙蓉姿粉薄鈿稀態轉竒坐中還有沾巾者曾見先王初教時公席上作潞府李相買花謡云杜陵村人不田穡入谷經溪復緣壁每至南山草木春即向侯家取金碧幽豔凝花春景曙採來移得將何處蝶惜芳叢送下山尋斷孤香始回去豪少居連鳷鵲東千金使買一株紅院多花少栽未得零落緑娥纎指中咸陽親戚長安里無限將金買花子澆紅濕緑千萬家靑絲玉轤聲啞啞王中丞宅夜觀舞胡騰云石國胡兒人見少蹲舞樽前急如鳥織成蕃帽虛頂尖細㲲胡衫雙袖小手中拋下蒲萄盞西顧忽思鄉路逺跳身轉轂寶帶鳴弄腳繽紛錦靴軟四座無言皆瞪目橫笛琵琶遍頭促亂騰新毯雪朱毛傍拂輕花下紅燭酒䦨舞罷絲管絶木錦花西見殘月武俊也王中丞皮日休劉棗強碑文云歌詩之風蕩來久矣大抵喪于南朝壞于陳叔寶然今之業是者苟不能求古於建安即江左矣苟不能求麗於江左即南朝矣或過為豔傷麗病者即南朝之罪人也吾唐來有是業者言出天地外思出鬼神表讀之則神馳八極測之則心懷四溟磊磊落落真非世間語者有李太白百嵗有是業者雕金篆玉牢竒籠怪百煆為字千練成句雖不追躅太白亦後來之佳作也有與李賀同時有劉棗強焉先生姓劉氏名言史不詳其鄉里所有歌詩千首其美麗恢贍自賀外世莫得此王武俊之節制鎮兾也先生造之武俊雄健頗好詞藝一見先生遂加異敬將署之賔位先生辭免武俊善騎射載先生以二乘逞其藝如野武俊先騎驚雙鴨起於蒲稗間武俊控弦不再發雙鴨聮斃於地武俊歡甚命先生曰某之伎如是先生之詞如是可謂文武之㑹矣何不一言以讃邪先生由是馬上草射鴨歌以示武俊議者以為禰正平鶯鵡賦之類也武俊益重先生由是奏請官先生詔授棗強今先生辭疾不就世重之曰劉棗強亦如范萊蕪之類焉故相國隴西公夷簡之節度漢南也少與先生遊且思相見命列將以襄之髹器千事賂武俊以請先生武俊許之先生由是為漢朝相府賔冠隴西公日與之為筆宴其獻酬之歌詩大播于當時隴西公從事或曰以某下走之才誠不足汚辱重地劉棗強至衆必以公賔劉於幕吏之上何抑之如是公曰愚非惜幕間一足地不容劉也然視其狀有不足稱者諸公視某與劉分豈有間然哉反為之惜其夀爾後不得巳問先生所欲為先生曰司功椽甚間或可承闕相國由是椽之雖居官曹宴見與從事儀等後從事又曰劉棗強縱不容在賔署承乏於椽曹詘矣奚不疏整其秩相國不得巳而表奏焉詔下之日先生不恙而卒相國哀之慟曰果然止椽曹然吾愛客葬之有加等墳去襄陽郭五里曰柳子關後先生數十嵗日休始以鄙文稱于襄陽襄陽邑人劉求高士也嘗述先生之道業嘗咏先生之歌詩且歎曰襄之人只知有浩然墓不知有先生墓恐百嵗之後埋滅而不聞與荆棘凡骨溷吾子之文吾當刋焉日休自存既托實録之何愧嗚呼先生之官卑不稱其德宜加私諡然棗強之號世巳美矣故不加焉是為劉棗強碑劉猛元微之樂府古題序云詩訖于周離騷訖于楚是後詩之流為二十四名賦頌銘贊文誄針詩行咏呤題怨歎章篇操引謡謳歌曲詞調皆詩人六義之餘而作者之㫖由操而下八名皆起於郊祭軍賔吉凶苦樂之際在審聲以度詞審調以節唱句度短長之數聲律平上之差莫不由之准度而又區别其在琴瑟者為操引採民氓者為謳謡備曲度者揔得謂之歌曲詞調斯皆由樂以定詞非選詞以配樂也由詩而下九名皆屬事而作雖題號不同而悉謂之為詩可也後之審樂者往往採取其詞度為歌曲蓋選詞以配樂非由樂以定詞也而纂撰者由詩而下十七名盡編為樂府等題除鐃吹橫吹郊祀清啇等詞在樂志者其餘木簡仲卿四愁七哀之輩亦未必盡播於管弦明矣後之文人達樂者少不復如是配列但遇興紀題往往兼以句讀短長於歌詩之異劉補闕云樂府肇於漢魏操仲尼學文王操伯牙作水仙操齊牘沐作雉朝飛衛女作思歸引則不於漢魏而後始亦以明矣况自風雅至於樂流莫非諷興當時之事以貽後世之人㳂襲古題唱和重復於文或有短長於義咸為贅媵尚不如寓意古題刺美見事猶有詩人引古以諷之義者焉曹劉沈鮑之徒時得如此亦復稀少近代惟詩人杜甫悲陳陶哀江頭兵馬麗人等凡所歌行率皆即事名篇無有倚傍餘少時與友人白樂天李公垂輩謂是為當遂不復擬賦古樂府詩數十首中一二章咸有新意豫因選而和之其有雖用古題全無古義者若出門行不言離别將進酒特書列女之類是也其或頗同古義全創新詞則因家止述軍輸捉捕請先螻蟻之類是也劉李二子方將極意於斯文因為粗明古今歌詩同異之㫖焉月生十五前日望光彩圓明滿十五後日畏光彩瘦不見夜光色一樽成暗酒匣中苔背銅光短不照空不惜補明月暫無此良玉句月生自念數年間兩手中藏鈎於心且無恨他日為我羞古老傳童歌連淫亦兵象夜夢戈甲鳴苦不願年長句苦兩朝㧧一把白夜淚千滴雨可耻垂拱時老作在家女曉句張為作主客圖取猛月生十五前等句以孟雲卿為髙古奧逸主而以猛為入室元微之酬劉猛見送云種花有顔色異色即為妖養鳥惡羽翮翦翮不待髙非無剪傷者物性難自逃百足雖健健啇羊亦翹翹伊豫狷然質謬入多士朝任氣有愎戇容身寡朋曹愚狂偶以直靜僻非敢驕一為毫髮忤十載山川遙爍鐵不在火割肌不在刀險心露山嶽詖語翻波濤六尺安敢主方寸由自調神劒土不蝕異布火不燒雖無二物姿庶欲效一毫未能深蹙蹙多謝相勞勞去去我移馬遲遲君過橋雲勢正橫壑江流初滿槽持此慰逺道比之為舊交李餘張為作主客圖以孟雲卿為髙古奧逸主以餘為入室取其句云長安東門别立馬生白髮句霽後軒蓋繁南山瑞煙發句嘗憂車馬繁土薄聞水聲句餘登長慶三年進士第蜀人也張籍送餘歸蜀詩云十年人詠好詩章今日成名出舉場歸去唯將新誥牒後來爭取舊衣裳山橋曉上蕉花暗水店晴看芋葉光鄉里親情相見日一時携酒上髙堂賈島送餘及弟歸蜀云知音伸久屈覲省去光輝津濟逢清夜途程盡翠微雲當綿竹疊鳥離錦江飛肯寄書來否原居出甚稀又送餘往湖南云昔去候溫凉秋生滿蜀鄉今來從辟命春物遍涔陽嶽石桂陽雪野帆堆渚檣若尋吾祖宅寂寞在瀟湘李涉有坡詩同刻有王蕊花在石夲作李涉鎮江鸖林寺醉中贈崔膺云與君兄弟住嶺故與君相逢楊子渡白浪南分吳塞寒緑楊深入隋宮路隋家文物今雖改舞館歌臺基尚在煬帝陵邊草木深汴河流水空歸海古今悠悠人自别此地繁華終未歇大道靑樓夾翠煙瓊墀繡帳開明月與君一言兩相許外捨形骸中爾女楊州歌酒不可追洛神映箔湘妃語白馬黃金為身置誰能獨羡他人醉暫到香爐一夕間能展愁眉百世事君看白日光如箭一度别來顔色變早謀侯印佩腰間莫遣看花鬢如霰題鸖林寺僧室云終日昏昏醉夢間忽聞春盡强登山因過竹院逢僧話又得浮生半日間春晚遊鸖林寺寄使府諸公云野寺尋春花巳遲背嵓唯有兩三枝平生携酒猶堪醉為報春風且莫吹嶽陽别張祐云十年蹭蹬為逐臣鬢毛白盡巴江春鹿鳴猿嘯雖寂寞水蛟山魅多精神山瘧困中聞有赦死灰不望光隂借半夜州符喚牧童虛教衰病生驚怕巫峽洞庭千里餘巒陬水國何親踈由來真宰不宰我徒勞歎者懷吹噓霸橋昔與張生别萬變桑田何處說龍蛇縱在沒泥塗長衢却為駑駘設愛君氣堅風骨峭文章真把江淹笑洛下諸生懼刺先烏鳶不得齊鷹鸇嶽陽西南湖上寺水閣松房遍文字新釘張生一首詩自餘吟著皆無味䇿馬前途須努力莫學龍鍾虛嘆息晚泊潤州聞角云孤城吹角水茫茫風引胡笳怨思長驚起暮天沙上鴈海門斜去兩三行涉嘗過九江至皖口遇盜問何人從者曰李博士也其豪首曰若是李涉博士不用剽奪久聞詩名願題一篇足矣涉贈一絶云春雨蕭蕭江上村緑林豪客夜知聞他時不用相回避世上如今半是君涉至楊州一女子拜且泣問之曰宋態也故吳興劉員外之愛姬白也劉全劉李有昔年之分涉因贈詩曰長憶雲仙至小時芙蓉頭上綰靑絲當時驚覺高唐夢唯有而今宋玉知又云陵陽夜宴使君筵解語花枝在眼前自從明月西沉海不見常娥二十年涉渤之兄纎人也早從陳許辟憲宗時為太子通事舍人投匭言吐穸承璀冤狀孔戣知匭事表其姦逐為峽州司倉參軍始戣見其副章詰責不受涉乃行賂詣光順門通之故戣極言涉姦險欺天請加顯戮大和中為太學博士自號清溪子張為作主客圖以孟雲卿為高古奧逸主而以涉入室取其句云但將鍾鼓悅私愛肯以犬羊為國羞句尼父未適魯婁倦迷津徒懷教化心䊸欎不能伸一遇知巳言萬方始喧喧至今百王則孰不挹其源句六歎云漢臣一沒丁零塞牧羊西過隂沙外朝慿南鴈信難回夜望北辰心獨在漢家茅土橫九州髙門長㦸分王侯但將鍾鼓悅私愛肯以犬羊為國羞夜霜寒雲卧氷雪嚴風獨刃垂旌節丁年奉使白頭歸泣盡李陵衣上血春山三朅來云釣魚朅來春日暖松溪不厭舟行緩野竹初栽碧玉長澄潭欲下靑絲短昔人避世兼避仇暮棲雲外兼悠悠我今無事亦如此赤鯉忽到長竿頭泛泛隨波凡幾里碧莎如煙沙似砥瘦璧橫空怪石危山花鬪日禽爭水有時帶月歸扣舷身間自是漁家仙山上朅來採新茗新花亂發前山頂瓊英動搖鍾乳碧䕺䕺髙下隨崖嶺未必蓬萊有仙藥能向鼎中雲漠漠越甌遙見裂鼻香欲覺身輕騎白鸖採藥朅來藥苖盛藥生只傍行人徑世人重耳不重目指似藥苖心不足野客住山三十載妻兒共寄浮雲外小男學語便分别巳辨君臣知匹配都市廣長開大鋪疾來求者多相誤見說韓康舊姓名識之不識先相怒劉昭禹經費冠卿舊隱云節髙終不起死戀九華山聖主情何切孤雲性本間名傳中國外墳在亂松間依約曾棲處斜陽鳥自還昭禹字休明婺州人也少師林寬為詩刻苦風雪詩云句向夜深得心從天外歸集首懷華山隱者云先生入太華杳杳絶良音秋夢有時見孤雲無處尋神清峯頂立衣冷瀑泉吟應笑干名者六街塵土深嘗與人論詩曰五言如四十箇賢人著一字如屠沽不得覔句者若掘得玉合子底必有蓋但精心求之必獲其寶在湖南纍為宰字後署天榮府學士嚴州刺史卒于桂州幕中有詩三百首孫昌㣧淸明詩曰淸明暮春裏悵望北山陲燧火開新熖桐花發故枝沉冥慙嵗物歡宴阻朋知不及林間鳥遷喬並羽儀和司空曙劉眘虛九日送人云京邑歎離群江樓喜遇君開筵當九日泛菊外浮雲朗詠山川霽酣歌物色曛君看酒中意未肯喪斯文桞子厚與韋中立書云古者重冠禮將以責成人之道是聖人所尤用心者也數百年來人不復行近有孫昌㣧者獨發憤行之既成禮明日造朝到外廷薦笏言於卿士某子冠畢應之者咸憮然京兆尹鄭叔則怫然曵笏却立曰何預我耶廷中皆大笑天下不以非鄭尹而快孫子何哉獨為所不為巳昌胤登天寶進士第嚴休復楊州唐昌觀玉蘂花拆有仙人遊悵然成二絶云終日齊心禱玉宸魂銷目斷未逢真不如滿樹瓊瑶蘂笑對藏花洞裏人羽車潜下玉龜山塵世何由覩愛顔唯有無情枝上雪好風吹綴緑雲鬟元和中見一女子從以二女冠三小僕直造花所佇立良久命小童折花數枝謂黃冠者曰曩有玉峯之期自此可以行矣行百許步遂不復見休復有詩元微之和云弄玉潜過玉樹時不教青鳥出花枝的應未有諸人覺只是嚴郎卜得知樂天詩云嬴女偷乘鳯下時洞中潜歇弄花枝不緣啼鳥春饒舌青瑣仙郎可得知朱慶餘慶餘遇水部郎中張籍知音索慶餘新舊篇什留二十六章置之懷袖而推贊之時人以籍重名皆繕録諷詠遂登科慶餘作閨意一篇以獻曰洞房昨夜停紅燭待曉堂前拜舅姑粧罷低聲問夫壻畫眉深淺入時無籍酬之曰越女新粧出鏡心自知明豔更沉吟齊紈未足門人貴一曲菱歌敵萬金由是朱之詩名流於海內矣中秋月詩自古分功定唯應缺又盈一霄當皎潔四海盡澄淸靜覺風微起寒過雪乍傾孤高希此遇吟賞倍牽情題薔薇花云四面垂條密浮雲入夏清緑攢傷手刺紅墮斷腸英粉著蜂鬚膩光凝蝶翅明雨中看亦好况復值初晴送韋校書赴浙東幕云丞相辟書新秋關獨去人官離藝閣早名占甲科頻水驛迎舷火山城候吏塵湘邊寄家處到日倍榮親慶餘名可久以字行登寶應進士苐滿酌勸僮僕好隨郎馬蹄花時愼行李莫上白銅堤句又題王侯廢宅云古巷㦸門誰舊宅早曾聞說屬官家更無新燕來巢屋唯有間人去看花空廄欲摧塵滿櫪小池初涸草侵沙繁華事歇皆如此立馬踟蹰到日斜右張為取此作主客圖姚合送景餘越州歸覲云鄉書落姓名太守拜親榮訪我波濤郡還家霧露城海山空外逺鏡水世間清何計隨君去鄰牆間此生張籍送慶餘歸越云東鄰歸路逺幾日到鄉中有寺山皆遍無家水不通潮聲蓮葉雨野氣稻苗風州縣知名久爭邀與客同劉軻軻為僧時葬遺骸夢一書生來謝持三雞子勸食之嚼一而吞二後精儒術任史官退之欲為文贊之㑹貶不就玉聲如樂詩云玉振能旋止人言與樂并繁音忽巳闋雅韻詘然淸珮想停仙步泉疑咽夜聲曲終無巽韻聽罷有餘情特逹知難擬玲瓏豈易名崑山如可得一片佇為榮托言云軻慕孟軻為文故以名焉少為僧止于豫章高安之南果園復求黃老之術隱於廬山既而進士登苐文章與韓桞齊名軻上座主書曰軻本沛上耕人代業儒為農人家天寶末流離于邊徙貫南鄙邊之人嗜習玩味異乎沛然亦未嘗輟耕捨學與邊俗齒且曰言忠信行必果雖夷貊行矣故處邊如沛然貞元中軻僅能執經從師元和初方結廬于廬山之陽日有芟夷畚築之役雖震風凌雨亦不廢力大耨或農圃餘隙積書窗下日與古人磨礱前心嵗月悠久寖成書癖樂天云廬山自陶謝後正元初有符載楊衡輩隱焉今讀書屬文結茅嵓谷者猶一二十人其中秀出者有彭城劉軻開卷慕孟軻為人秉筆慕楊雄司馬遷為文軻志不息異日必能跨符楊而攀陶謝矣軻字希仁元和末登進士苐卒于洺州刺史與吳武陵並以史才直史館彭城劉軻否不知為僧者是獨孤鉉日南至云玉曆班窮律凝隂發一陽輕暉猶惜短桂影叱偏長晷度經南斗流晶盡北堂乍疑周户耀可愛逗林光積雪消微照初萌動渺茫更升臺上望雲物已昭彰鉉登元和進士第張燦寒食遣懷云繁華泣淸露悄悄落衣巾明日逢寒食春春風見故人病來羞帶楚西去欲迷秦憔悴此時夜靑山歸四鄰璨正元元和間進士也楊虞卿過小妓英英墓云蕭晨騎馬出皇都聞說埋冤在路隅别我巳為泉下土思君猶似掌中珠四弦品柱聲初絶三尺孤墳草巳枯蘭質惠心何所在焉知過者是狂夫樂天夢得皆有和章樂天云人間有夢何曾入泉下無家豈是歸墳上少啼留取淚明年寒食更霑衣夢得云但見好花皆易落從來尤物不長生鸞臺夜直衣衾冷雲雨無因入禁城虞卿醉後善歌掃市詞又有小妓攻琵琶虞卿死遂辭去樂天哭虞卿詩云何日重聞掃市歌誰家收得琵琶妓虞卿字師臯虢州人佞柔善諧麗宗閔僧孺相穆宗引為右司郎中宗閔倚之時號黨魁為京兆尹以罪貶䖍州司户參軍死楊汝士唐名族重京官而輕外任汝士建節後詩云拋却弓刀上砌臺上方樓殿翠雲開山僧見我衣裳窄知道新從戰地來又云而今老大騎官馬羞向關西道姓楊寶曆中楊於陵僕射入覲其子嗣復率兩榜門生迎於潼關宴新昌里苐僕射與所執坐正寢嗣復領諸生翼兩序元白俱在賦詩席上汝士詩後成元白覽之失色詩曰隔坐應須賜桞屏盡將仙翰入高冥文章舊價留鸞掖桃李新隂在鯉庭再嵗生徒陳賀宴一時良吏盡傳馨當時疏廣雖云盛詎有兹筵醉緑醽其日大醉歸謂其子弟曰吾今日壓倒元白刑侍時為開成中汝士以户侍檢校尚書鎮東川時樂天以太子少傅分洛戲代內子賀兄嫂曰劉綱與婦共登仙弄玉隨夫亦上天何似沙哥領崔嫂碧油幢引向東川又云金花銀碗饒兄用罨畫羅裙任嫂裁嫁得黔婁為妹壻可能空寄蜀茶來裴令公居守東洛夜宴半酣公索句元白有得色時公為破題次至汝士曰昔日蘭亭無艷質此時金谷有高人白知不能加遽裂之曰笙歌鼎沸勿作冷淡生活元顧曰樂天所謂能全其名者也汝士鎮東川其子知溫及苐命妓張宴人與紅綾一匹詩曰郎君得意又靑春蜀國將軍又不貧一曲高歌紅一匹兩頭娘子謝夫人汝士字慕巢牛李待之善開成初鎮東川時嗣復鎮西川乃族昆弟對擁節旄世榮其門終刑部侍郎張志和漁父歌云西塞山前白鷺飛桃花流水鱖魚肥靑蒻苙緑蓑衣斜風細雨不須歸又云釣臺漁父褐為裘兩兩三三鮓艋舟能縱掉慣乘流長江白浪不曾憂又云霅溪灣裏釣魚翁舴艋為家西復東江上雪浦邊風笑著荷衣不歎窮又云松江蟹舍主人歡菰飯蓴羮亦共餐楓葉落荻花乾醉宿漁舟不覺寒又云靑草湖中月正圓巴陵漁父掉歌連釣車子掘頭船樂在風波不用仙憲宗時畫玄真子像訪之江湖間不可得因令集其詩上之玄真之兄張松齡懼其放浪而不返也和答其漁父云樂在風波釣是間草堂松徑已勝攀太湖水洞庭山狂風浪起且須還志和字子周婺州人母夢楓生腹上而産志和十六擢明經肅宗時以事貶南浦尉不復仕居江湖自稱煙波釣徒著元真子兄鸖齡恐其遁世為築室越州東郭與陸羽往還憲宗圖真求其歌不能致李德𥙿稱志和隱而有名顯而無事不窮不達嚴光之比云唐詩紀事卷第四十六
