front:
  text: 唐詩紀事卷第三十八
  hash: sha256:55cb0e03fb4dbb06ff4d3c126e58f573972b3763712e44281c68eda53d1cdec8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_038-1a}
body:
  text: 白居易張為以居易為廣大教化主取其讀史詩云含沙射人影雖病人不知巧言誣人罪至死人不疑掇蜂殺愛子掩鼻戮寵姫弘恭陷蕭望趙髙謀李斯隂德既必報陽禍豈虛施人事雖可罔天道終難欺明即有刑辟幽即有神祗茍免勿私喜鬼得而誅之又取秦中吟云厚地植桑麻所用濟生民生民理布帛所求活一身身外充征賦上以奉君親國家定兩稅本意在憂人厥初防其淫明勑內外臣稅外加一物皆以枉發論奈何歲月久貪吏得因循役我以求寵斂桑無冬春織絹未盈匹繅絲未盈斤里胥迫我納不許暫逡巡歲暮天地閉隂風生破村夜深煙火盡霰雪白紛紛幼者形不蔽老者體無溫悲喘與寒氣併入鼻頭辛昨日輸殘稅因窺官庫門繒帛如山積絲絮如雲屯號為羡餘物隨日獻至尊奪我身上暖買爾眼前恩進入瓊林庫歲久化為塵又取寓意云豫章生深山七年而後知挺髙二百尺本末皆十圍天子建明堂此材獨中規匠人執斤墨採度將有期孟冬草朩枯烈火燎于陂狂風吹猛熖從根燒到枝養培二十年方成棟梁姿一朝為灰燼柯葉無孑遺地雖生爾材天不與爾時不如糞上芝猶有人掇之已矣勿重陳重陳令人悲勿悲焚燒苦但悲採用遲又取赫赫京內史奕奕中書郎昨傳徴拜日恩私顧殊常貂冠水蒼玉紫綬黃金章佩服身未暖已聞竄炎荒親戚不得别吞聲泣路旁賔客亦已散門前雀羅張富貴來未久倐如瓦溝霜權勢言尤速瞥若石火光不如守貧賤貧賤可久長傳語宦遊子且來歸故鄉又取得意減别恨半酣還逺程之句又人吏留不得直入故山雲之句又長生不似無生理休向青山學錬丹之句又曰髮鑷不盡根在愁腸中之句又與薛濤云峨眉山勢接雲霓欲逐劉郎北路迷若似剡中容昜到春風猶隔武陵溪主客圖巳上皆序洛詩序云序洛詩樂天自敘在洛之樂也豫歷覽古今歌詩自風騷之後蘇李以還為五言詩李陵蘇武次及鮑謝徒迄于李杜輩其間詞人聞知者纍百詩章流傳者巨萬觀其所自多因讒冤譴逐征戍行旅凍餒病老存歿别離情發於中文形於外故憤憂怨傷之作通計今十八九焉世所謂文士多數竒詩人尤命薄於斯見矣又知理安之世少離亂之時多亦明矣豫不佞喜文嗜詩自幼及老著詩數千首以其多矣故章句在人口姓字落詩流雖才不逮古人然所作不啻數千首作一數竒命薄之士亦有餘矣今壽過耳順幸無病苦官至三品免罹飢寒此一樂也大和二年詔受刑部侍郎明年就領河南尹事又三年病免歸履道里弟再受賔客分司自三年春至八年夏至洛凡五周年作詩四百三十二首除喪明哭子十數篇外其他皆寄懷於酒或取意於琴間適有餘酣樂不暇苦詞無一字憂歎無一聲豈牽強所能致耶蓋亦發中而形外耳斯樂也實本之於省分知足濟之以家給身間文之以觴詠絃歌飾之以山水風月此而不適何往而適哉兹又以重吾樂也豫嘗云治世之音安以樂間居之詩泰以適茍非理世安得間居故集洛詩别為序引不獨記東都履道里有間居泰適之叟亦欲知皇唐大和歲有理世安樂之音集而序之以侯夫棌詩者甲寅歲七月十日云爾元微之長慶集序云憲宗皇帝册召天下士樂天對詔稱旨又登甲科未幾入翰林掌制誥比上書言得失因為賀雨詩秦中吟等數十章指言天下事時人北之風騷焉豫始與樂天同校祕書前後多以詩章相贈答會豫譴掾江陵樂天猶在翰林寄豫百韻律詩及雜體前後數十章是後各佐江通復相酬寄巴蜀江楚間洎長安中少年遞相倣效競作新詞自謂為元和詩而樂天秦中吟賀雨諷諭等篇時人罕能知者然而二十年間禁省觀寺郵候牆壁之上無不書王公妾婦牛童馬走之口無不道至于繕寫模勒衒賣于市井或持之以交酒茗者處處皆是其甚者有至于盜竊名姓苟求自售雜亂間廁無可奈何豫嘗于平水市中草市名鏡湖傍見村校諸童競習詩召而問之皆對曰先生教我樂天微之詩固亦不知豫之為微之也又云雞林賈人求市頗切自云本國宰相每以百金換一篇其甚偽者宰相輒能辨别之自篇章以來未有如是流傳之廣者長慶四年樂天自杭州刺史以右庶子詔還豫時刺會稽因得盡徴其文手自排纘成五十卷凡二千一百九十一首前輩多以前集中集為名豫以為陛下眀年秋當改元長慶于是因號曰白氏長慶集大凡人之文各有所長樂天之長可以為多矣夫以諷諭之詩長于激間適之詩長于遣感傷之詩長于切五字律詩百言而上長于贍五字七字百言而下長于情賦贊針戒之類長于當碑記敘事制誥長于實啓表奏狀長于直書檄詞策剖判長于盡總而言之不亦多乎哉至于樂天之官族景行與豫之交分淺深非敘文之要也故不書與元九書云夫文尚矣三才各有文天之文三光首之地之文五材首之人之文六經首之就六經言詩又首之何者聖人感人心而天下和平感人心者莫先乎情莫始乎言莫切乎聲莫深乎義詩者根情苗言華聲實義上自賢聖下至愚騃微及豚魚幽及鬼神羣分而氣同形異而情一未有聲入而不應情交而不感者聖人知其然因其言經之以六義緣其聲緯之以五音五音韻義有類韻協則言順言順則聲易入類舉則情見情見則感易交于是乎孕大含深貫微洞密上下通而一氣泰憂樂合而百志熙五帝三皇所以直道而行垂拱而理者揭此以為大柄決此以為大竇也故聞元首眀股肱良之歌則知虞道昌矣聞五子洛汭之歌則知夏政荒矣言者無罪聞者作戒言者聞者莫不兩盡其心焉洎周衰秦興採詩官廢上不以詩補察時政下不以歌泄導人情乃至于諂成之風動救失之道缺于時六義始刓矣國風變為騷辭五言始于蘇李蘇李騷人皆不遇者各繫其志發而為文故河梁之句止于傷别澤畔之吟歸于怨思倣徨抑欎不暇及他耳然去詩未逺梗概尚存故興離别則引雙鳧一雁為喻諷君子小人則引香草惡鳥為比雖義類不具猶得風人之什二三焉于時六義始缺矣晉宋以還得者蓋寡以康樂之奧博多溺于山水以淵眀之髙古偏放于田園江鮑之流又狹于此如梁鴻五噫之例者百無一二焉于時六義寖微矣陵夷至于梁陳間率不過嘲風雪弄花草而已噫風雪花草之物三百篇中豈捨之乎顧所用何如耳設如北風其涼假風以刺威虐也雨雪霏霏以愍征役也棠棣之華感華以諷兄弟也采采芣苡美草以樂有子也皆興發于此而義歸于彼反是者可乎哉然則餘霞散成綺澄江淨如練離花先委露别葉乍辭風之什麗則麗矣吾不知其所諷焉故僕所謂嘲風雪弄花草而已于時六義盡去矣唐興二百年其間詩人不可勝數所可舉者陳子昂有感遇詩二十首鮑魴有感興詩十五首又詩之豪者世稱李杜之作才已竒矣人不逮矣索其風雅比興十無一焉杜詩最多可傳者千餘篇至于貫穿今古覼縷格律盡工盡善又過于李然撮其新安吏石壕吏潼關吏塞蘆子留花門之章朱門酒肉臭路有凍死骨之句亦不過三四十首杜尚如此况不逮杜者乎僕嘗痛詩道崩壞忽忽憤發或食輟哺夜輟寢不量材力欲扶起之嗟乎事有大謬者又不可一二而言然亦不能不粗陳于左右僕始生六七月時乳母抱弄于書屏下有指無字之字示僕者僕雖口未能言心已默識後有問此二字者雖百十其試而指之不差則僕宿昔之緣已在文字中矣及五六嵗便學為詩九嵗諳識聲韻十五六始知有進士苦節讀書二十已來晝課賦夜課書間又課詩不遑寢息矣以至于口舌成瘡手肘成胝既壯而膚革不豐盈未老而齒髮早衰白瞥瞥然如飛蠅垂珠在眸子中者動以萬數蓋以苦學力文所致又自悲矣家貧多故二十七方從鄉試既第之後雖專于科試亦不廢詩及授校書郎時已盈三四百首或出示交友如足下輩見皆謂之工其實未窺作者之域耳自登朝來年齒漸長閲事漸多每與人言多詢時務每讀書史多求理道始知文章合為時而著歌詩合為事而作是時皇帝初即位宰府有正人屢降璽書訪人急病僕當此日擢在翰林身是諌官手請諌紙啓奏之外有可以救濟人病裨補時闕而難于指言者輒詠歌之欲稍稍遞進聞于上上以廣宸聰副憂勤次以酬恩奬塞言責下以復吾平生之志豈圖志未就而悔已生言未聞而謗已成矣又請為左右終言之凡聞僕賀雨詩而衆口籍籍已謂非宜矣聞僕哭孔戡詩衆面脈脈盡不悅矣聞秦中吟則權豪貴近者相目而變色矣聞樂逰園寄足下詩則執政柄者扼腕矣聞宿紫閣村詩則握軍要者切齒矣大率如此不可遍舉不相與者號為沽名號為詆訐號為訕謗苟相與者則如牛僧孺之戒焉乃至骨肉妻孥皆以我為非也其不我非者舉不過三兩人有鄧魴者見僕詩而喜無何而魴死有唐衢者見僕詩而泣未幾而衢死其餘則足下又十年來困躓若此嗚呼豈六義四始之風天將破壞不可支持耶抑又不知天之意不欲使下人之病苦聞于上耶不然何有志于詩者不利若此之甚也然僕又自思關東一男子耳除讀書屬文外其他懵然無知乃至書畫棊博可以接羣居之歡者一無通曉即其愚拙可知矣初應進士時中朝無緦麻之親逹官無半面之舊策蹇步于利足之途張空拳于戰文之場十年之間三登科第名入衆耳迹升清貴出交賢俊入侍冕旒始得名于文章終得罪于文章亦其宜也日者又聞親友間説禮吏部舉選人多以僕私試賦判傳為凖的其餘詩句亦往往在人口中僕恧然自愧不之信也及再來長安又聞有軍使髙霞寓者欲聘娼妓妓大誇曰我誦得白學士長恨歌豈同他妓哉由是增價又足下書云到通州日見江館柱間有題僕詩者復何人哉又昨過漢南日適遇主人集衆樂娛他賔諸妓見僕來指而相顧曰此是秦中吟長恨歌主耳自長安抵江西三四千里凡鄉校佛寺逆旅行舟之中往往有題僕詩者士庶僧徒孀婦處女之口每每有詠僕詩者此誠雕蟲之戲不足為多今時俗所重正在此耳雖前賢如淵雲者前輩如李杜者亦未能忘情于其間古人云名者公器不可以多取僕是何者竊時之名已多既竊時名又欲竊時之富貴使已為造物者肯兼與之乎今之迍窮理固然也况詩人多蹇如陳子昻杜甫各授一拾遺而迍剝至死李白孟浩然輩不及一命窮悴終身近日孟郊六十終試協律張籍五十未離一太祝彼何人哉彼何人哉况僕之才又不逮彼今雖謫在逺郡而官品至第五月俸四五萬寒有衣飢有食給身之外施及家人亦可謂不負白氏之子矣微之微之勿念我哉僕數月來檢討囊篋中得新舊詩各以類分分為卷首自拾遺來凡所遇所感關于美刺興比者又自武德訖元和因事立題題為新樂府者共一百五十首謂之諷諭詩又或退公獨處或移病間居知足保和吟玩性情者一百首謂之間適詩又有事物牽于外情理動于內隨感遇而形于歎詠者一百首謂之感傷詩又有五言七言長句絶句自一百韻至兩韻者四百餘首謂之雜律詩凡為十五卷約八百首異時相見當盡致于執事微之古人云窮則獨善其身逹則兼濟天下僕雖不肖常師此語大丈夫所守者道所待者時時之來也為雲龍為風鵬勃然突然陳力以出時之不來也為霧豹為冥鴻寂兮寥兮奉身而退進退出處何往而不自得哉故僕志在兼濟行在獨善奉而始終之則為道言而發眀之則為詩謂之諷諭詩兼濟之志也謂之間適詩獨善之義也故覽僕詩知僕之道焉其餘雜律詩或誘于一時一物發于一笑一吟率然成章非平生所尚者但以親朋合散之際取其釋恨佐歡今銓次之間未能刪去他時有為我編集斯文者略之可也微之夫貴耳賤目榮古陋今人之大情也僕不能逺徴古舊如近嵗韋蘇州歌行清麗之外頗近興諷其五言詩又髙雅間淡自成一家之體今之秉筆誰能及之然當蘇州在時人亦未甚愛重必待身後然後人貴之今僕之詩人所愛者悉不過雜律詩與長恨歌已下耳時之所重僕之所輕至于諷諭者意激而言質間適者思淡而詞迂以質合迂宜人之不愛也今所愛者並世而生獨足下耳然千百年後安知復無如足下者出而知愛我詩哉故自八九年來與足下小通則以詩相戒小窮則以詩相勉索居則以詩相慰同處則以詩相娛知吾最要率以詩也如今年春逰城南時與足下馬上相戲因各誦新豔小律不雜他篇自皇子陂歸昭國里迭吟遞唱不絶聲者二十里餘樊李在傍無所措口知我者以為詩仙不知我者以為詩魔何則勞心靈役聲氣連朝接夕不自知其苦非魔而何偶同人當美景或花時宴罷或月夜酒酣一詠一吟不知老之將至雖驂鸞鶴逰蓬瀛者之適無以加于此焉又非仙而何微之微之此吾所以與足下外形骸脫蹤迹傲軒鼎輕人寰者又以此也當此之時足下興有餘力且與僕悉索還往中詩取其尤長者如張十八古樂府李二十新歌行盧楊二𥙿書律詩竇七元八絶句博取精掇編而次之號元白往還詩集衆君子得擬議於此者莫不踊躍欣喜以為盛事嗟乎言未終而足下左轉不數月而僕又繼行心期索然何日成就又可為之歎息又僕嘗語足下凡人為文私於自是不忍於割截或失於繁多其間妍媸益又自惑必待文友有公鑒無姑息者討論而削奪之然後繁簡當否得其中矣况僕與足下為文尤患其多已尚病之况他人乎今且各纂詩筆粗為卷弟待與足下相見日各出所有終前志焉又不知相遇是何年相見是何地溘然而至則如之何微之微之知我心哉潯陽臘月江風苦寒嵗莫鮮歡夜長無睡引筆鋪紙悄然燈前有念則書言無次第勿以繁雜為倦且以代一夕之話也微之微之知我心哉唐紀紀事卷第三十八
