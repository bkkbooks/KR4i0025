front:
  text: 唐詩紀事卷第二十一
  hash: sha256:e34137c4c4b343cd24ceb4250f41fefd92f82535355a87b6b9b44017084c0b64
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_021-1a}
body:
  text: 蕭頴士李華崔皓李嘉祐王翰蕭頴士頴士重陽陪魯山登北城贈别時元有掛冠之意詩云山縣繞古堞悠悠快登望雨餘秋天高目盡無隱狀綿連滍川逈杳渺鴉路深彭澤興不淺臨風動歸心賴兹琴堂暇傲倪傾菊酒人和嵗巳登從政復何有逺山十里並一道銜長雲青霞半落日混合疑晴曛漸聞栖林羽坐歎清夜月中歡愴有違行子念明發僅能泯寵辱未免傷别離江湖不可忘風雨勞相思明時當盛才短伎安所設何日謝百里從君漢之澨又答韋司業垂訪云􅊯􅊯食蘋鹿常飲清泠川但恱豐草美寧知牢饌鮮主人有幽意將以充林泉羅網幸免傷䝉君復羈牽高堂列衆賔廣坐鳴清絃俯仰轉傷惕徘徊獨憂煎𬗟懷雲巖路欲往無由緣物各有所好違之傷自然神龜在南國緬邈湘川隂遊止蓮葉上歲時嘉樹林毒蟲且不近斤斧何由尋錯落負竒文熒煌耀丹金江山萬里餘淮海阻且深獨保貞素質不為寒暑侵一逢聖明代應見通靈心晉代有儒臣當年冨辭藻立言寄青史將以贊王道遼落𬗟歲時辛勤歷江島且言風波倦探涉豈為寶不遇庾征西云誰展懷抱士貧乏知巳安得成所好彭陽昔游說願謁南郢都王果尚未逹况從夷節謨豈知晉叔向無罪嬰囚拘臨難俟解紛獨知祁大夫舉讎且不棄何必論親踈夫子覺者也其能遺我乎關西一公子年貌獨青春披褐來上京翳然聲未振中郎何為者倒屣驚座賔詞賦豈不佳盛名亦相因為君奏此曲此曲多苦辛千載不可誣孰言今無人李華序其文曰開元天寶間以文學著於時者曰蘭陵蕭頴士字茂挺年十九進士擢第淮南連帥表君為楊州工曹沒於汝南旅次君謂六經之後有屈原宋玉文甚雄壯而不能經厥後有賈誼文詞詳正近於理躰杖乘司馬相如亦瓌麗才士然而不近風雅楊雄用意頗深班彪識理張衡宋曠曺植豐贍王粲超逸嵇康摽舉此外皆金相玉質所尚或殊不能備舉左思詩賦有雅頌遺風千寶著論近乎王化根源此外皆敻絶無聞近日陳拾遺文體最正以此而言見君𫐠作君以文章制度為巳任時人咸以此許之頴士卒門人贈文元先生惟一子存字伯誠為金部外員郎有功曹文風惡裴延齡棄官歸廬山存子東從事雍南以女妻柳淡字中庸韓文公少時受存之知自袁州入為祭酒經廬山過其山居知諸子凋謝唯二女在乃為詩曰中郎有女能傳業伯道無鬼可保家今日匡山過舊隱空將衰淚對烟霞頴士以推奬後進為任如李陽李幼皇甫冉陸渭等數十人由奬目皆為名士天下推知人稱蕭功曹嘗兄事元德秀而友殷寅顔真卿柳芳陸據李華邵軫趙驊時人語曰殷顔柳陸李蕭邵趙以能全其交也李華與齊名世號蕭李李華華字遐叔舉開元二十三年進士天寶二年博學宏詞皆為科首天寶十一年拜監察御史除右𥙷闕祿山亂輦母而逃為盜所得二京復坐謫杭州司功參軍召加司封外員郎將以司言處之華曰焉有隳節奪志者可以荷君之寵乎移病請告李峴領選江南表為從事以風痺廢居楚詠史詩云日照崑崙山羽人披羽衣乘龍駕雲霧欲往心無違此山在西北乃是神仙國靈氣皆自然求之不可得何為漢武帝精意遍群山糜費巨萬計宫車終不還蒼蒼茂陵樹足以戒人間天生忠與義本以佐雍熙何意李司隸而當昏亂時古墳襄城野斜徑橫秋陂况不禁樵採茅莎無了遺髙褾尚可仰精爽今何之一忤中常侍銜寃誰見知常觀黨錮傳撫卷不勝悲文候耽鄭衛一聽一忘飱白雪燕姬舞朱絃趙女彈淫聲流不返慆蕩日無端獻歲受朝時鳴鍾宴百官兩牀陳管磬九奏殊未闌對此唯恐卧更能整衣冠漢皇修雅樂乘與臨太學三老輿五更天王親割牲一人調風俗萬國和且平單于驟欵塞武庫欲銷兵文物此朝盛君臣何穆清至今壝壇下如有簫韶聲蜀主相諸葛功高名亦尊驅馳千萬衆怒目瞰中原曺伯任公孫國亡身不存社宫久蕪沒白鴈猶飛翻勿言君臣合可以濟黎元為蜀諒不易如曹難復論秦滅漢帝興南山有遺老危冠揖萬乘幸得猒征討當君逐鹿時臣等巳枯槁寧知市朝變但覺泉石好高卧五十年相看成四皓帝言翁甚善見顧何不早咸稱太子仁重義亦尊道側聞驪姬事申生不自保暫出啇山雲朅來趍灑掃東宫成羽翼楚舞傷懷抱後代無其人戾園滿秋草六國韓最弱末年尤畏秦鄭生為韓計且欲疲秦人利物可分社原情堪滅身咸陽古城下萬頃稻苗新昻藏獬豸獸出自太平年亂代乃潜伏縱人為禍愆常聞斷馬劍每壯朱雲賢身死名不滅寒風吹墓田精靈如有在幽憤滿松煙沂水春可涉泮宫映楊葉麗色異人間珊珊搖珮環展禽常獨處深巷生禾黍城上飛海雲城中暗春雨適來鳴珮者復是誰家女泥沾珠綴履雨濕翠毛簮電影閉蓮臉雷聲飛蕙心自言沂水曲采蘋兼采菉歸徑雖可尋天隂光景促憐君貞且獨願許君家宿徒勞惜衾枕子不顧雙娥豔質誠可重淫風如禮何周王惑褒姒城闕成波沱巢許在嵩頴陶唐不得臣九州上洗耳一命安能親綿邈數千祀丘中誰隱淪朝遊八卿府夕是山林人蒲帛楊仄陋薜蘿為縉紳九重念入夢三事思降神且設庭中燎寧窺泉下鱗漢時征百越楊僕將樓船幕府功未立江湖巳騷然島夷非敢亂政暴地仍偏得罪因懷壁防身輒控弦三軍求裂土萬里詎聞天魏闕心猶在旗門首巳懸如何得良吏一為制方圓一篇詠史十寄題趙七侍御餘自干溪行經弋陽至上饒山川幽麗思與雲卿同遊邈不可得因叙疇年之素寄懷於篇云搖槳曙江流江清山復重心愜賞未足川迥失前峯凌灘出極浦曠若天池通君陽青嵯峨開折混元中九潭魚龍窟仙成羽人宫隂奧潜鬼物精光動煙空玄猿啼深蘢竹樹深者為蘢千宗反楚越謂白鳥戲葱䝉飛湍鳴金石激溜鼓雷風雨濯万木鮮霞照千山濃草間長餘緑花淨落幽紅渚烟見晨釣山月聞夜春覆溪窈窕波滔石洶溶溶丹丘忽聚散素壁相奔衝白日破昏靄靈山出其東勢排昊蒼上氣壓吳越雄逈頸望雲卿此恨發吾衷昔日蕭郊逰四人才成童侍御驊故華與趙七十六軫未冠進太學相次與校邵後三人及第也蕭十功曹皆苦貧幫弊同年三人登科頴士故邵屬詞慕孔門入仕希上公緯卿陷非罪折我昆吾鋒字郡貶卒南中緯卿以冤橫茂挺獨先覺拔身渡京虹斯人謝明代百代墜鵷鴻東殯葬先人逝于江南蕭天寶未知亂棄官往江世故墜橫流與君哀路窮與趙受辱見中逆胡陷兩京華相顧無死節䝉恩逐殊封貶泉州晋江尉華貶杭州司功趙天波洗其瑕朱衣備朝容恩纍華承拜𥙷聞御史遷尚書郎趙一别凡十年豈期復相從餘生得携手遺此兩孱翁群遷失鶯羽後凋惜長松衰旅難重别悽悽滿心胸遇勝悲獨逰貪竒悵孤逢禽尚彼何人胡為束樊籠吾師度門教投辨躡遐蹤崔皓擢進士第有文無行終司勳員外郎𥘉李雍聞其名虛舍待之皓至獻詩首章云十五嫁王昌雍叱曰小兒無禮不與接而去孟門行云黃雀銜黃花翩翩傍簷隙本擬報君恩如何反彈射金罍美酒滿座春平原愛財多衆賔滿堂盡是忠義士何意得有讒諛人諛人翻覆那可道能令君心不自保北園新裁桃李枝根株未固何轉移成隂結子君自取若問傍人那得知霍將軍云長安甲第髙入雲誰家居住霍將軍日晚朝回擁賔從路旁揖拜何紛紛莫言灸手手可熱須臾火盡灰亦滅莫言貧賤即可欺人生富貴自有時一朝天子賜顔色世上悠悠應始知黃鶴樓詩昔人已乘白雲去此地空餘黃鶴樓黃鶴一去不復返白雲千載空悠悠晴川歷歷漢陽樹春草凄凄鸚武洲日暮鄉關何處是煙波江上使人愁在上頭遂作鳯凰臺詩以䡋勝負恐不然世傳太白云眼前有景道不得崔皓題詩王家少婦詩云十五嫁王昌盈盈入畫堂自憐年最小復倚壻為郎舞愛前溪緑歌憐子夜長間來鬪百草度日不成粧商璠云皓少年為詩屬意浮艷多陷輕薄晚歲忽變常躰風骨凛然如殺人遼水上走馬漁陽歸錯落金鎖甲䝉茸貂鼠衣又秋風吹淺草獵騎何翩翩插羽兩相顧鳴弓新上弦鮑昭江淹須有慙色古遊俠呈軍中諸將云少年負膽氣好勇復知機仗劍出門去孤城逢合圍殺人遼水上走馬漁陽歸錯落金鎖甲䝉茸貂鼠衣還家行且獵弓矢速如飛地逈鷹狗疾草深狐兔肥腰間帶兩綬轉盻生光輝顧謂今日戰何如隨建威贈王威古云三十羽林將出身常事邊秋風吹淺草獵騎何翩翩插羽兩相顧鳴弓新上弦射麋入深谷飲馬向寒泉馬上共傾酒野中聊割鮮相看未及醉雜虜叩幽燕烽火知不息胡塵高際天長驅救東北戰解城亦全報國行赴難古來皆共然送單于裴都護云征馬出翩翩秋城月正圓單于莫近塞都護欲臨邊漢驛通烟火胡沙乏井泉功成須獻捷未必去經年題隱侯八詠樓云梁日東陽守為樓望越中緑窗明月在青史古人空江靜聞山狖川長數塞鳴登臨白雲晚流恨此遺風遼西云燕郊芳歲晚殘雪涷邊城四月青草合遼陽春水生胡人正牧馬漢將日徵兵露重寶刀濕沙虛金鼓鳴寒衣著巳盡春服誰與成寄言洛陽使為傳邊戍情渭城少年行云洛陽三月梨花飛秦地行人春憶歸揚鞭走馬城南陌朝逢驛使秦川客驛使前日發章臺傳道長安春早來棠梨宫中燕𥘉至蒲萄館裏花正開問念使人歸更早三月便逹長安道長安道上春可憐搖風蕩日曲江邊萬戶樓臺臨渭水五陵花柳滿秦川李嘉祐字從一上元中嘗為台州剌史大曆間剌袁州李肇記漠漠水田飛白鷺隂隂夏朩囀黃鸝之句本嘉祐詩而集中不見與嚴維劉長卿冷朝陽友善嘗有詩四年謫官滯江城未猒門前鄱水清誰言宰邑化黎庶欲别雲山如兄弟雙鷗為底無心狎白髮從他繞鬢生惆悵間眠臨極浦夕陽秋草不勝情嘉祐蓋嘗謫官但不知其故然見元日無衣冠入朝云白髭空換歲丹陛不朝天其坎坷之狀可少見矣嘉祐有送從叔陽氷寄從弟紆及姪端詩蓋三子之族也逰鶴林寺云野寺江城近雙旌五馬過禪心超忍辱𣑽語問多羅松竹間僧老雲霞晚日和寒塘歸路轉清磬隔微波送王收往吉州謁王使君云細草緑汀洲王孫耐薄遊年華𥘉冠帶文體舊弓裘野渡花爭發春塘水亂流使君矜小阮應念倚門愁仲夏江隂官舍寄裴明府云萬里邊江次孤城對海安朝霞晴作雨濕氣曉生寒苔色侵衣桁潮痕上井欄題書招茂宰畏尓欲辭官潤州送蔣侍御收兵歸楊云冷氣清金虎兵威壯䥫冠楊旌川色瞑吹角水風寒人對輜軿醉花看睥睨殘羡歸丞相府空望舊門欄高仲武云嘉祐袁州人振藻天朝大收芳譽中興髙流也與錢郎别為一躰往往涉於齊梁綺美婉麗蓋吳筠何遜之敵也至於野渡花爭發春塘水亂流朝霞晴作雨濕氣曉生寒文華之冠冕也又禪心超忍辱𣑽語問多羅設使許珣更生孫綽復在窮思極筆未到此境和苗員外發秋夜宿直云久雨南宫夜仙郎寓直時漏長丹鳯闕秋冷白雲司螢影侵階亂鴻聲出苑遲蕭條人吏散小謝有新詩極元集姚合取為戴叔倫夜發袁州寄李頴川詩即嘉祐也詩云半夜回舟入楚鄉月明山水共蒼蒼孤猿更發秋風裏不是愁人亦斷腸於此時李貶王翰古長城吟云長安少年無逺圖一生唯羡執金吾騏驎前殿拜天子走馬西擊長城胡胡沙獵獵吹人靣漢虜相逢不相見遙聞鍾鼓動地來傳道單于夜猶戰此時顧恩寧顧身為君一行摧萬人壯士揮戈回白日單于濺血染朱輪回來飲馬長城窟長城道傍多白骨問之耆老何代人云是秦王築城卒黃昏塞北無人烟鬼哭啾啾聲沸天無罪見誅功不賞孤魂流落此城邊當昔秦王按劍起諸侯膝行不敢視冨國強兵二十年築怨興徭九千里秦王築城何太愚天實亡秦非北胡一朝禍起蕭墻內渭水咸陽不復都翰字子羽晋陽人少豪健恃才張嘉正張說為并州長史厚禮之為駕部外員郎坐事貶道州司馬卒明皇送張說巡邊應制云紫盩尚書印朱軿丞相車登朝身許國出閫將辭家不憚炎蒸苦親嘗走馬賖選徒軍有令誓卒爾無譁帝樂風𥘉起王城日半斜寵行流聖作寅餞至台華騎歷河南樹旌搖天北沙榮懷應盡服嚴殺巳先加業峻靈祗保功成道路嗟寧知鑿空使逺致石榴花送張說赴集賢院上賜宴賦得筵字云東堂起集賢貴得俊神仙首命台階老將崇御府圓送人將玉珮中使拂瓊筵和樂薰風解湛恩時雨連長材成磊落短翮強翩􅗁徒仰蓬萊地何階不讓緣恩賜樂遊園宴應制云未極人心暢何如帝道明仍嫌酺宴促復寵樂遊行陸海披珍藏天河直斗城四關清靄合數處白雲生飪餗調元氣歌鍾溢雅聲空慙堯舜力至德眷難名唐詩紀事卷第二十一
