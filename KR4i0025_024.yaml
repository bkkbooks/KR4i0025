  text: 唐詩紀事卷第二十四
  hash: sha256:0df96fe31926ca155fce1c8b9b4f0bbe502b162dd95cbc306778d35eecf8e89d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_024-1a}
body:
  text: 元傑韋迢孟彥深郭受陶現張稱王昌齡周萬包融顔真卿丁仙芝李清詠十二韓滉齊浣顧朝陽韋建元傑元傑有湞陽果業寺開東嶺洞谷銘并序云隂陽精氣結為山嶽者則為勝為異為奧為閟故萬嶺交峙而嵩華辨其方群嶽斆靈而瀛壺拔其類是知仙居靈宅其必有黨乎鳴絃之北趾果業之東阜髙不百仞廣才千畝層巖石室幽谷靈洞殊景異觀秀絶竒偉雖瀑流之下爐峰懸磴之躋丹嶠路逺莫覿餘不知其倫擬焉按寺記云昔有方七千是山錬金變形羽服登仙故石座丹竈至今存焉觀其東嶺削成石瑩如玉岡巒峭竦巖壁重復捫藟而曻如造雲根縹眇嬋娟似霞衣可攀真氣勝而塵纍捐五蓋破而清機間蕩然放懷如羽翼之巳生赤城之可接噫境變志遷若符契之協從也下臨長川澄波吐瀾煙霞夕收飛鳥不喧青渺逶迤流注無間西直巨壑連嶂如屏林靄朝翠巖灮晝清篠漡臧輝杉松下冥虛豁寂寥􅉼風有聲緑嶺未極劃開洞門黛容崢嶸詭狀輪囷疑伏龍怪鎮含煙雲又有古木倒傍絶壁盤根網結挂絡空碧崩崖傍傾援徑下庂羽人幽會此焉瑶席摶翠壁而直上軋崎嶇於紫氛雙巖屹以中斷奔屛蹙而成室涵孕精爽澄凝氣源信列仙之攸居豈塵俗之所止哉嗚呼鸖駕一去鳳簫響絶荆榛蔽路危磴敗滅迹留人境而舉世莫知地聮精剎而群遊莫至吁可怪乎其晦藏也元和丙申嵗秋八月余以膠鬲之困寓居精舍再從兄昭肅時假兹邑政便於人務簡多暇與當寺僧知捷日探道源捷亦好古叨竒之士也因語故實緬思羽客之玄風以為靈迹神蹤精誠必復乃操刃持畚履險道幽挮絶棧而歷巉巖排蒙籠而登杳藹時更一稔而神居祕躅粲然皆睹嗟乎芝田玄圃豈遠乎哉天之與人氣通則合客有顧咨而諗豫者或應之曰天之運否泰相濟故善利稱德下民昏墊人之道行藏有數故棘津蓬纍時惟鷹揚靈物必通道在斯著不然何荒阻千祀勃焉而興歟乃為銘曰鑿石通道兮援木枝仰攀洞口兮踐竒危奔龍伏虎兮勢狀竒林攢峰倚兮蟠雲螭下臨隂谷兮神以栗嵌巖兮洞無極老松蕭瑟兮生遠風興雲霈兮煙霧黑懸巖排空兮色噴黛堅根網絡兮層霄外披霓解帶兮羽翼生下眺遙江兮入青靄世道紛綸兮何足謂朝為榮華兮夕憔悴不如幽谷兮閲仙經冀接浮丘兮整煙轡我窺丹竈兮坐山腹衆峰參差兮隱雲族鑿仙嶺兮望瑶臺朝霞照海兮錦綺開信赤松之所升降王喬之所往來道或用晦兮靈物斯潛殷道未昌兮説築傳巖紛豫感此兮勒銘雲根山既不杇兮與名長存韋迢杜子美在長沙送韋員外迢牧韶州詩云炎海韶州牧風流漢署郎分符先令望同舍有輝光白首多年疾秋天昨夜涼洞庭無過鴈書疏莫相忘迢留別杜員外院長詩云江畔長沙驛相逢纜客船大名詩獨步小郡海西偏地濕愁飛鵩天炎畏跕鳶去留俱失意把臂共澘然迢早發湘潭寄子美云北風吹夜雨江上早來涼楚岫千峰翠湘潭一葉黃故人湖外客白首尚為郎相憶無南鴈何時有報章子美酬云養拙江湖外朝廷記憶踈深漸長者轍重得故人書白髮絲難理新詩錦不如雖無南過雁看取北來魚子美後送魏司直掌選嶺南兼寄迢云故人湖外少春日嶺南長憑報韶州牧新詩昨寄將孟彥深字士源天寶末為武昌令元次山居武昌之樊山新春大雪彥深以詩問之曰江山十日雪雪深江霧濃起來望樊山但見群玉峯林鶯却不語野獸翻有蹤山中應大寒短褐何以安皓氣凝書帳清著釣魚竿懷君欲進謁溪滑渡舟難次山酬云積雪閉山路有人到庭前云是孟武昌令獻苦雪篇長吟未及終不覺為悽然古之賢逹者與世竟何異不能救時患諷論以全意知公惜春物豈非愛時和知公苦隂雪傷彼災患多姦凶正驅馳不合問君子林鶯與野獸無乃怨如此兵興向九嵗稼穡誰能憂何時不發卒何日不殺牛耕者日巳少耕牛日巳希皇天復何忍更又恐鱉之自經危亂來觸物堪傷嘆見君問何意只益􅎍中亂山禽飢不飛山木凍皆折懸泉化為氷寒爐近不熱出門望天地天地皆昏昏時見雙峯下雪中生白雲次山又有雪中懷孟武昌云冬來三度雪農者歡嵗稔我麥根巳濡各得在倉廪天寒未能起孺子驚人寢云有山客來籃中見冬簟上生木燒柴為溫酒煮鱖為作瀋羮汁尺甚反客亦愛杯樽思君共杯飲所嗟山路開時節寒又甚不能苦相邀興盡還就枕次山作退谷銘曰干進之客不得遊之作杯湖銘曰為人厭者勿泛焉乃曰孟士源嘗黜官無情于進在武昌不為人厭可遊退谷可泛杯湖故有招孟武昌詩云武昌不仕進武昌人不厭退谷可正遊杯湖任來泛湖上有水鳥見人不飛鳴谷中有山獸往往隨人行莫將車馬來令我鳥獸驚彥深登天寶二年第郭受受寄子美詩云新詩海內流傳困舊德朝中屬望勞郡邑地卑饒霧雨江湖天闊足風濤杜醪酒熟傍看醉蓮葉舟輕自學操春興不知凡幾首衡陽紙價頓能髙又云出五里紙衡陽出五家紙子美酬郭十五判官云才微嵗老尚虛名卧病江湖春復生藥褁關心詩揔廢花枝照眼句還成只同燕石能星隕自得隨珠覺夜明喬口橘洲風浪促繫帆何惜片時程受大曆間衡陽判官也陶現現彭澤之孫也開元末家崑山泛遊江湖自制三舟與孟彥深孟雲卿焦遂共載吳越之士號為水仙省親南海獲崑崙奴名摩訶善遊水至西塞山下泊舟吉祥佛舍見江水深黑謂必有怪物投劒命摩訶下取久之支體磔裂浮於水上現流涕回棹賦詩自敘不復遊江湖矣詩云匡廬舊業是誰主吳越新居安此生白髮數莖歸未得青山一望計還成鴉翻楓葉夕陽動鷺立蘆花秋水明從此捨舟何所詣酒旗歌扇正相迎張稱辭房相公云秋風颯颯雨霏霏秋絶恓惶一布衣辭君且作隨陽鴈海內無家何處歸稱天寶至德間人王昌齡昌齡字少伯江寧人中第輔校書郎又中慱學宏辭科遷汜水尉不護細行世亂還鄉里為刺史閭丘曉所殺工詩緒密而思清時謂王江寧獨遊詩云林卧情每間獨遊景常晏時從灞陵下垂釣往南澗手携雙白魚目送千里雁悟彼飛有有適知此罹憂患放之清冷泉因得省踈慢永惟青岑客廽首白雲間神超物無違豈繫名與宦齋心詩云女蘿覆石璧溪水幽濛瀧紫葛蔓黃花娟娟寒露中朝飲花上露夜卧松下風雲英化為水光彩與我同日月蕩精魄寥寥天府空箜篌引云瀘溪郡南夜泊舟夜聞南岸羌戊謳其時月黑猿啾啾微雨霑衣令人愁有一遷客登髙樓不言不寐彈箜篌彈作薊門桑葉秋風沙颯颯青冢頭將軍鐵驄汗血流深入胸奴戰未休黃旗一點兵馬收亂殺胡人積如丘瘡病驅來配邉州仍披漠北羊羔裘顔色機枯掩靣羞眼眶滴淚深兩眸還思本鄉食氂牛欲語不得指咽喉或有強壯能咿嚘意説𬒳他邉將讎五世屬蕃漢主留碧毛氈帳河曲遊槖駝五萬部落稠勑賜飛鳳金兜鍪為君百戰如過籌靜掃隂山無鳥投家藏鐵劵特承優黃金千斤不稱求九族分離作楚囚深溪寂寞絃苦幽草木悲感聲颼颼僕本山東為國憂光明殿前論九疇簏讀兵書盡宜搜為君掌上施權謀洞曉山川無與儔紫宸發詔懷逺柔搖筆飛箱如奪鉤鬼神不得知其由憐愛蒼生北蚍蜉緣河屯兵須漸抽盡遣降來拜御溝便令海內休戈矛何用班超定逺侯史臣書之得巳不長信秋云金并梧桐秋葉黃珠簾不捲夜來霜熏籠玉枕無顔色卧聼南宫清漏長奉帚平明秋殿開且將團扇共徘徊玉顔不及寒鴉色猶帶昭陽日影來西宫秋怨云芙蓉不及美人粧水殿風來珠翠香誰分含啼掩秋扇空懸明月侍君王作情啼一西宫春怨云西宫夜靜百花香欲落珠簾春恨長斜抱雲和深見月𪷟朧樹色隔朝陽青樓怨云香幃風動花入樓髙調鳴筝緩夜愁腸斷關山不解説依依殘月下簾鈎送李濯遊江東詩云清洛日夜漲微風引孤舟離觴便千里逺夢生江樓楚國橙橘暗吳門煙雨愁東南且今古歸望山雲秋商璠云元嘉巳還四百年內曹劉陸謝風骨頓盡今昌齡克嗣厥迹至如明堂坐天子月朔朝諸侯清樂動千門皇風𬒳九州慶雲從東出泱漭抱日流又獨飲灞上亭寒山青門外長雲驟落日東來寂巳晦又蒼荻寒滄江石頭岸邉飲又長亭酒未酣千里風動地又京門望西嶽百里見郊樹飛雨祠下來靄然關中暮又姦雄乃得志遂使群心搖赤風蕩中原烈火無遺巢一人計不用萬里空蕭條又百泉勢相蕩巨石皆却立昏為蛟龍怒清見雲雨入又去時三十萬獨自還長安不信沙場苦君看刀箭瘢又雲起太華山雲水玄明滅東峯始含景了了見松雪又櫧柟無冬春柯葉連峯稠險璧下蒼黑煙含清江樓疊沙積為岡崩剝雨露幽石脈盡橫亘潛潭何時流斯並驚耳駭目略舉十句則中興髙作可知矣豫常覩昌齡齋心詩弔軹道賦謂其人孤潔恬淡與物無傷晚節謗議沸騰言行相背及淪落竄謫竟未減才名固知善毁者不能掩西施之美也放歌行云南渡洛陽津西望十二樓明堂坐天子月朔朝諸侯清樂動千門皇風𬒳九州慶雲從東來泱漭抱日流升平貴論道文墨將何求有詔徴草澤微誠將獻謀冠冕如星羅拜揖曹與周望塵非吾事入賦且遲留幸蒙國士識因脫負薪裘今者放歌行以慰梁甫愁位榮數計祿奉飬每豐羞願得金膏遂飛雲亦可籌代扶風主人答云然氣凝不流風悲日彩寒浮塵起四逺遊子彌不歡依然宿扶風沽酒聊自寬寸心亦未理長鋏誰能彈主人就我飲對我還慨歎便泣數行淚因歌行路難十五役邊城三回討樓蘭連年不解甲積日無所飱將軍降胸奴國使沒桑乾去時三十萬獨自還長安不信沙場苦君看刀箭瘢鄉親悉零落塜墓亦摧殘仰攀青松枝慟哭傷心肝禽獸悲不去路旁誰忍看幸逢休明代寰宇靜波瀾老馬思伏櫪長鳴力巳殫少年與君會何事發悲端天子𥘉封禪賢良刷羽翰三邊悉如此否泰亦須觀鄭縣宿陶大公館中贈馮六元二云儒有輕侯王脫略當世譽本家藍溪下非為漁弋故無何困躬耕且欲馳永路幽居與君近出谷同所務昨日辭石門五年變秋露雲龍未相感于謁亦以屢子為黃綬羈豫忝蓬山顧京門望西嶽百里見郊樹飛雨祠上來靄然關中暮馳車鄭城宿秉燭論永素山月出華隂開此河渚霧清光比故人豁逹展心晤馮公尚戢翼元子仍局步拂衣易為髙淪迹難有趣張范善始終吾等豈不慕罷酒當涼風屈伸備冥數小敷谷龍潭祠作詩云崖谷噴疾流地中有雷集百泉勢相蕩巨石皆却立跳波沸崢嶸深處不可挹昏為蛟龍怒清見雲雨入靈怪崇偏祠廢興自兹邑沉淫頃多昧簷宇遂不葺吾聞𬒳明典盛德惟世及生人載山川血食報原隰豈伊駭微險將以循氓揖飛振吕梁忠信亦我習波流侵巳廣悔吝在所汲溪水有清源褰裳靡沾濕過華隂詩云雲起太華山山色玄明滅東峰始含景了了見松雪羇人感幽棲窗映轉竒絶欣然忘所疲永望吟不輟信宿百里餘山開玩新月何意昨來心遇物遂遷別人生屢如此何以肆愈恱作雲仙山色一出郴山口至疊石灣野人室中寄張十一詩云櫧柟無冬春柯葉連峰稠隂壁下蒼黑煙含清江樓景開獨沿曵響答隨興酬旦夕望吾友如何迅孤舟疊沙積為岡崩剝雨露幽石脈盡橫亘潛潭何時流既見萬古色頗盡一物由水與世人逺氣還草木收盈縮理無餘今往何必憂郴土群山髙耆老如中州孰云議外降豈是娛官遊隂火昔所服丹砂將爾謀昨臨蘇耽井復向衡陽求同疚來相依脫身當有籌數月乃離居風湍成阻修野人善竹器童子能溪謳寒月波蕩漾羇鴻去悠悠作問疚同疚一九江口作詩云漭漭江勢濶雨開潯陽秋驛門是髙岸望盡黃蘆洲水與五溪合心期萬里遊明時無棄才謫去隨孤舟鷙鳥立寒木丈夫佩吳鈎何當報君恩却繫風霜頭從軍行二首云向夕臨大荒朔風軫歸慮平沙萬里餘飛鳥宿何處虜騎獵長原翩翩傍河去邉聲搖白草海氣生黃霧百戰起風塵十年履霜露雖投定逺筆未坐將軍樹早知行路難悔不理章句秋風馬蹄輕角弓持絃急去為龍城戰正值胡兵襲軍氣橫大荒戰酣日將入長風金鼓動白露鐵衣濕四起愁邉聲南庭時佇立斷蓬孤自轉寒鴈飛相及萬里雲沙漲平原冰霰澀惟聞漢州遙獨向刀環泣周萬送沈芳謁李觀察求仕進詩云往日長安路歡逰不借年為貪盧女曲用盡沈郎錢身老方投刺途窮始著鞭猶聞有知巳此去不徒然因之此君曽浪迹長萬開元末登第包融送國子張主簿詩云湖岸纜𥘉解鶯啼別離處遙見舟中人時時一回顧坐悲芳歲晚花落清軒樹春夢隨我心搖揚逐君去融潤州延陵人歷大理司直二子何吉齊名世稱二包孟浩然宴包二融宅詩曰間居枕清洛左右接大野門庭無雜賔車轍多長者是時方盛夏風物自瀟灑五月休沐歸相携竹林下開襟成歡趣對酌不能罷煙暝棲鳥迷餘將歸白社顔真卿吳門有清逺道士同沈恭子逰虎丘詩其辭自商周歷近代枊二千年來矣鬼神耶隱士耶莫能測也而辭藻健俊魯公愛之刻於巖際并有鑑作衛公又次而和之清逺道士詩云我本長殷周遭罹歷秦漢四瀆與五嶽名山盡幽竄及此寰區中始有近峯玩近峰何鬱鬱平湖眇瀰漫吟挽川之隂步上山之岸山川共澄徹光彩交凌亂白雲翁欲歸青松忽消半客去川島靜人來山鳥散谷深中見日崖幽曉非旦聞子盛逰遨風流足詞翰嘉兹好松石一言常纍歎勿謂餘鬼神欣君共幽讃魯公詩云不到東西寺于今五十春朅來從舊賞林壑宛相親吳子多藏日秦皇厭聖辰劔池穿萬仭盤石坐千人金氣騰為虎琴臺化若神登壇仰生一捨宅歎珣珉中嶺分雙樹回巒絶四鄰窺臨江海接崇飾四時新客有神仙者於兹雅麗陳名高清逺峽文聚斗牛津迹異心寧間聲同質豈均悠然千載後知我揖光塵衛公詩云茂苑有靈峰嗟餘未遊觀藏山在平陸壞谷有髙岸岡繞數仭墻巖潛千丈幹乃知造化意回斡資竒玩鏐騰昔虎踞劒沒嘗龍煥潭黛入海底崟岑聳霄半層巒未升日哀狖寧知旦緑篠夏凝隂碧林秋不換冥搜既窈窕逈望何蕭散川曉嵐氣收江春雜英亂逸人綴清藻前哲留篇翰共扣哀玉音皆舒文繡假難追彥回賞實又見虎丘則逾其所聞褚彥回見凡人所稱常過其徒起興公歎一力如再升含毫星斗爛真卿與耿湋水亭詠風聯句有度琴方解愠臨水巳迎秋之句丁仙芝長寧公主舊山池詩云平陽舊池館寂寞使人愁座卷留黃簟簾垂白玉鈎庭間花自落門閉水空流追想吹簫處應隨仙騎逰越裳貢白雉云聖哲承休運伊臯列上台尋思丹徼逺入貢素翬來北闕欣𥘉見南枝顧未回斂容殘雪靜矯翼片霜開馴擾將無懼翻飛幸不猜甘從上林裏飲啄自徘徊仙芝潤州曲阿人登開元進士第為餘杭尉李清詠石季倫云金谷繁華石季倫只能謀富不謀身當時縱與緑珠去猶自無窮歌舞人清登天寶十二年進士第韓滉晦日呈諸判官云晦日新晴春日嬌萬家攀折渡長橋年年老向江城寺不覺春風換柳條聽樂悵然自述云萬事傷心對管絃一身含淚向春煙黃金用盡教歌舞留與他人樂少年滉字太沖正元𥘉加同平章事江淮轉運使二年封晉國公𥘉有美名所與遊皆天下豪俊其詩與孟浩然酬唱云齊幹長門怨云營營孤思通寂寂長門夜妾妬亦知非君恩那不借携琴就玉階調悲心未諧將心寄明月流影入君懷浣字洗心定州人開元間與蘇晉蘇頲賈曽韓休許景先孫逖典詔誥為代言最杜暹當國表宋璟為吏部尚書浣及蘇晉為侍郎世謂臺選常稱陳希烈苖晉卿之才後皆大顯顧朝陽昭君怨云莫將鉛粉匣不用鏡花光一去邊城路何情更畫粧影銷胡地月衣盡漢宫香妾死非關命都緣怨斷腸朝陽開元間詩人韋建泊舟旴𣅿云維舟淮水次霜降夕流清夜出潮侵岸天寒月近城平沙依鴈宿候館聽雞鳴鄉國雲霄外
