  text: 唐詩紀事卷第二十六
  hash: sha256:389de6f9f2f2a21f8287a446ca3f2345257b31f4cb84bfab34b8ce7ea1e3c683
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_026-1a}
body:
  text: 盧象閻防王季友楊賁張陵王之渙李陽冰蘇渙劉長卿章八元李穆韋應物朱放孫逖李紵畢耀盧象象題叔徴君東溪草堂云關山十餘里青壁森相倚欲識堯時天東溪白雲是雷聲轉幽壑雲氣杳流水澗影生蟲蛇巗端翳梓杞大道終不易君恩曷能巳鸖羡無老時龜言攝生理浮年笑六甲元化潜一指未暇掃雲梯空慙阮家子又云今朝共逰者得性間未歸巳到仙人家莫驚鷗鳥飛水深嚴公釣松挂巢父衣雲氣轉幽寂溪流無是非名理未足羡腥臊詎所稀自惟負真意何歲當食薇象自江東止田園移莊慶會未幾歸汶上小弟幼妹尤悲其別賦詩云謝病始告歸依然入桑梓家人皆佇立相候衡門裏疇類皆長年成人舊童子上堂家慶畢顧與親姻邇論舊或餘悲思存且相喜田園轉蕪沒但有寒泉水衰柳日蕭條秋光清邑里入門乍如客休騎非便止中飲顧王程離憂從此始兩妹日長成雙鬟將及人巳能持寶瑟自解掩羅巾念昔別時小未知踈與親今來識離恨掩淚方殷勤小弟更孩幼歸來不相識同居雖漸慣見人猶默默宛作越人言殊鄉甘水食別此最為難淚盡有餘憶劉夢得董侹詩集序云嘗所遊皆青雲之士聞名如盧杜工部甫員外象髙韻如包李侍郎紵祭酒吉迭以章句揚於當時商璠云象詩雅而不素有大體得國士之風曩在校書名光祕閣其如靈越山多秀新安江甚清蓋東南之數郡也竹里館云江南冰不開山澤氣潜通臘月聞山鳥寒崕見蟄熊柳林青半合荻笋亂無叢回首金陵岸依依向北風送祖詠云田家宜伏臘歲晏子言歸石路雪𥘉下荒村雞共飛東源多煙火北澗隱寒暉滿酌野人酒倦聞鄰女機胡為困樵採幾日𬒳朝衣贈張筠貟外云公門世業昌才子冠裴王出自平津邸還為吏部郎神仙餘氣色列宿動輝光夜出南宫靜朝趍北禁長時人窺水鑑明主賜衣裳翰苑飛鸚鵡天池待鳳凰承歡疇日顧未記後時傷去去圖南逺微才幸不忘趙都護晏別云結髮候旌麾元戎復在斯門開都護府兵動羽林兒黠虜多翻覆謀臣有別離智同天所授恩共日相隨漢使開賔幕胡笳送酒巵風霜迎馬首雨雪事魚麗上䇿應無戰深情屬載馳不應行萬里明主寄安危象字緯卿劉夢得紀其文云公始以章句振起於開元中與王維崔顯比肩驤首鼓行於時妍詞一發樂府傳貴由前進士𥙷祕書郎轉右衛倉曹掾丞相曲江公方執文衡揣摩後進得公深器之擢為左𥙷闕河南府司録司勳貟外郎名盛氣髙少所卑下為飛語所中左遷齊汾鄭三郡司馬入為膳部貟外郎大盜起幽陵入洛師執公脅之從伍中謫果州長史又貶永州司户移吉州長史詔拜主客員外郎道病留武昌遂不起故相崔大傳時為右史方作鄂以文志其墓其詞曰噫公妙年有聲振耀當代翺翔雲路不虞矰􅌳盛名先物易生疵癘三至郎省坐成遺耋蹭蹬江臯栖栖沒齒見知者恨之閻防百丈溪新理茅茨讀書云浪迹棄人世還山自幽獨始傍巢由蹤吾其獲心曲荒庭何所有老樹半空腹秋蜩鳴北林暮鳥穿我屋栖遲樂遵渚恬曠寡所欲開卦推盈虛散帙攻節目養間廢人事逹命知止足不學東國儒俟時勞伐輻防與薛據在終南山豐得寺讀書韋蘇州有城中卧疾和閻薛二子屢從邑令飲詩云車作良車一馬日蕭蕭胡不住在一作我廬方來從令飲卧病獨何如秋風起漢江一作臯開户望平蕪即此吝稀一作音素表一作焉知中密踈渴者不思火寒者不求水人生羈寓旅一作時去就當如此猶希心異跡心迹異一作從利眷眷存終始防在開元天寶間有文稱岑參孟浩然韋蘇州有贈章然不知得罪謫長沙之故也商璠云防為人好古博雅其詩警䇿語多真素至如荒庭何所有老樹半空腹又若熊楷庭中樹龍蒸棟裏雲皎然信也秋晚石門禮佛云輕䇿凌絶壁招提謁金仙舟車無由徑崕嶠乃屬天躑躅淹興景夷猶望新絃石門變暝色谷口生人煙陽鴈呌平楚湫風急寒川馳暉苦代謝浮脆暫貞堅永欲卧丘壑息心依梵筵誓將歷劫願無以外物牽宿岸道人精舍云早歲參道風放情巳寥豁重息知心侣遂果巗中諾斂跡辭人間杜門守寂寞秋風剪蘭蕙霜氣冷淙壑山牖見燃燈竹房聞搗藥願言捨塵事所趣非龍蠖夕次鹿門山云龐公嘉遁所浪跡難追攀浮舟暝始至抱杖聊自間雙巗開鹿門百谷集珠灣噴薄湍上水㫪容漂裏山焦原足險峻梁壑未成艱我行自春仲夏鳥語綿蠻蕙草色巳晚客心殊未還逺遊非避地訪道愛童顔安能狥機巧爭奪錐刀間與永樂諸官夜泛黃河云煙深載酒入但覺暮川虛映水見山火鳴桹聞夜漁愛兹川上趣忽與世人踈無假燃官燭中流有望舒孟浩然湘中旅泊寄防云桂水通百粵扁舟期曉發荆雲閉三邑夕望不見家襄王夢行雨才子謫長沙長沙饒瘴癘胡為久留滯久別思歡顔承歡懷接袂接𬒮杳無由徒增旅泊愁清猿不可聽㳂月上湘流王季友古塞曲云進軍飛狐北窮冦勢將變日落沙塵昏背河更一戰騂馬黃金勒雕弓白羽箭射殺左賢王歸奏未央殿欲言塞下事天子不召見東出咸陽門哀哀淚如霰觀于舍人壁畫山水云野人宿在人家少朝見此山謂山曉半壁仍棲嶺上雲開簾放出湖中鳥獨坐長松是阿誰再三招手起來遲于公大笑向子說小弟丹青能爾為還山留別長安知巳云出山不見家還山見家在山前是門前此去長樵採青溪誰招隱白髮自相待唯伴澗底松依依色不攺宿東溪李十五山亭云上山下山入溪谷溪中落日留我宿柏樹依依當主人主人不在情亦足花石出地兩重階絶頂平天一小齊本意猶來是山水何用相逢憶舊懷寄韋子春云出山秋雲曙山水巳再春食我山中藥不憶山中人山中誰余密白髮惟相親雀鼠晝夜無知我厨廩貧依依北舍松不厭吾南鄰有情盡棄捐土石為同身子美為季友作可歎行云近者抉眼去其夫河東女兒身姓柳丈夫正色動引經鄷城客子王季友豫章太守髙帝孫引為賔客敬頗久時危可拔真豪傑二人得置君側否商璠云季友詩放蕩愛竒務險逺出常情之外然而白首短褐良可悲乎至如觀于舍人西亭壁畫山水云野人宿在人家少朝見此山謂山曉半壁仍栖嶺上雲開簾放出湖中鳥甚有新意也季友肅代間詩人也錢考功起有贈季友赴洪州幕下詩云列郡皆用武南征所從誰諸侯重才略見子如瓊枝乃知季友曾遊江西之幕郎士元酬季友半日村别業兼呈李明府云村映寒原日巳斜煙生密竹早歸鴉長溪南路當群岫半景東鄰照數家門通小徑連芳草馬飲東泉踏淺沙欲待主人林上月還思潘令縣中花岑參潼關使院懷王七季友云王生今才人時輩咸所仰何當見顔色終日勞夢想驅車到關下欲往阻河廣滿目徒春華思君罷心想開門見太華朝日映髙掌忽覺蓮華峰別來更如長無心顧微祿有意在獨往不負林中期終當出塵網楊賁賁時興詩云貴人昔未貴咸願顧寒微及自登樞要何曽問布衣平明登紫閣日晏下彤闈擾擾路傍子無勞歌是非賁登天寶三年第張陵今日漢家探使回蟻疊胡兵來未歇春風渭水不敢流總作六軍心上血陵天寶間詩人也王之渙九日送別云蒯庭蕭索故人稀何處登髙且送歸今日暫同芳菊酒明朝應作斷蓬飛出塞詩云黃沙直上白雲間一片孤城万仭山羌笛何須怨楊柳春光不過玉門關登鸛鵲樓云白日依山盡黃河入海流欲窮千里目更上一重樓之渙并州人與兄之咸之賁皆有文天寶間人樂天作滁州刺史鄭昈墓志云與王昌齡王之渙崔國輔聮唱迭和名動一時送別云楊柳東門樹青青夾御河近來攀折苦應為別離多李陽冰陽氷阮客舊居詩云阮客身何在仙雲洞口橫人間不到處今日此中行阮客縉雲之隱者也陽氷善篆曾宰當塗太白依之蘇渙渙有變律詩云日月東西行照在大荒北其中有燭龍靈怪人莫測開目為晨暉閉目為夜色一開復一閉明晦無休息居然六合內曠哉天地德天地且不言世人強喧喧毒蜂成一窠髙掛惡木枝行人百步外目動魂亦飛長安大道旁挾彈誰家兒右手持金丸引滿無所凝一中紛下來勢若風雲隨身如萬箭攢宛轉迷所之徒有疾惡心奈何不知機養蠶為素絲葉盡蠶不老傾筐對空林此意向誰道一女不得織萬夫受其寒一夫不得意四海行路難􅍔亦不在大福亦不在先世路險孟門吾徒當勉旃杜子美有聽蘇大侍御誦詩之作髙仲武云渙本不平者善攻白拏巴人號曰白跖賨人患之以比莊蹻後自知非乃變節從學鄉賦擢第遷御史佐湖南使崔中丞權幕崔遇害渙遂踰嶺扇動哥舒晃跋扈交廣此猶蛟龍見血本質彰矣五年作變律詩十九首上廣州連率李公其意可歎答曰漢䇿紀蒯通說詞皇史録祖君彥書檄此本所以容納天善惡必書春秋顯訓名言渙者其殆庶幾乎豈但不棄雕蠱亦以深懲戒餘子也渙以哥舒叛伏誅劉長卿字文房至監察御史以檢校祠部貟外郎為轉運使判官知淮南鄂嶽轉運留後鄂嶽觀察使吳仲孺誣奏貶潘州南巴尉會有為之辨者除睦州司馬終隋州刺史以詩馳聲上元寶應間皇甫湜云詩未有劉長卿一句巳呼宋玉為老兵矣語未有駱賔王一字巳罵宋玉為罪人矣其名重如此李嘉祐入睦州分水路憶長卿詩云北闕忤明主南方隨白雲㳂洄灘草色應接海鷗群建德潮巳盡新安江又分回看嚴子瀨朗詠謝安文雨過暮山碧猿吟秋日曛吳洲不可到刷鬢為思君髙仲武云長卿貟外有吏幹而犯上兩度遷謫皆自取之詩體雖不新竒甚能錬飾十首巳上語意稍同於落句尤甚此竒思鋭穿也然春風吳草緑古木剡山深明日滄洲路歸雲不可尋又沙鷗驚小吏明月上髙枝又細雨濕衣看不見間花落地聼無聲裁長𥙷短蓋王徽之類歟又得罪風霜苦全生天地仁傷而不怨亦足以發揮風雅矣過張明府别業云寥寥東郭外白首一先生考滿孤琴在家移五柳成夕陽臨水釣春雨向田耕終日空林下何人識此情餘干旅舍云遙落暮天逈青楓霜葉稀孤城向水閉獨鳥背人飛渡口月初上鄰家漁未歸鄉心正欲絶何處搗寒衣送鄭公歸廬山云潯陽數畝宅歸卧掩柴關谷口何人在門前秋草間無機買藥罷不語杖藜還舊筍成寒竹空齊向暮山水流過舍下雲去到人間桂樹花應發因行寄一攀姚合取為極元集自過張明府別業三篇負譴後題于越亭云南天愁望絶亭上柳條新落日獨歸鳥孤舟何處人生涯投嶺徼世業陷邊塵江入千峰暮花連百越春秦臺憐白首楚水怨青蘋草色無征路鶯聲傍逐臣獨醒翻取笑直道不容身得罪風霜苦全生天地仁青山數行淚滄海一窮鱗流落誰相見空憐鷗鷺親喜此篇楊大年最同郭參謀題崔令公庭竹云不學媚清瀾能依上將壇蒙蘢玄冕過青蒨卷簾看得地移根逺經霜抱節難開花成鳳實嫩筍長漁竿藹藹軍容靜蕭蕭郡宇寬細音和角暮踈影上門寒阮巷何人在梁薗幾處殘空餘軒屏側歲晚對任安送朱山人越中賊退後歸山云越中初戰罷江上送歸橈南渡無來信西陵自落潮空城垂故柳舊葉發春苖閭里稀相見鶯花共寂寥送張扈司直歸越中云時危身赴難事往任浮沉萬里三江客孤城百戰心春風吳草緑古木剡山深明日滄洲路歸飛不可尋陪鄭中丞園林宴諸姪云心逺親魚鳥功成厭鼓鼙林中阮家醉池上謝公題門徑蒼苔合窗隂緑篠玄夕陽山向背秋草水東西舊架懸藤老踈籬挣槿齊風塵不可到唯羡武陵溪送駱少府云汀洲芳草緑日暮更氛氲舊國無來信春江獨送君五言凌白雪六翮向青雲空自無機事沙鷗巳可群送李中丞之襄州云流落征南將曽驅十萬師罷歸無舊業老去戀明時獨立三朝盛輕生一劒知茫茫江漢上日暮欲何之送嚴士元云春風倚棹闔閭城水國猶寒隂復晴細雨濕衣看不見間花落地聽無聲日斜江上孤帆影草緑湖南萬里程東道若逢相識問青𫀆今巳誤儒生章八元八元題慈恩塔云十層突兀在虛空四十門開靣靣風却怪鳥飛平地上自驚人語半天中回梯暗踏如穿洞絶頂初攀似出籠落日鳳城佳氣合滿城春樹雨濛濛或云元白見其詩云不謂嚴維出此弟子八元歸桐廬舊居寄嚴長史云昨辭天子棹歸舟家在桐廬憶舊丘三月暖時花競發兩溪分處水爭流近聞江老傳鄉語遙見家山减旅愁或在醉中逢夜雪懷賢應向剡川遊酬劉長卿月夜云夜凉河漢白卷箔出南軒過月鴻爭逺辭枝葉暗翻獨謡聞麗曲緩步接清言宣室思前席行看拜主恩月空愧子猷過劉云貧家唯好韋蘇州送八元擢第往上都應制云決勝文場戰巳酣行應辟命復才堪旅食不辭遊闕下春衣未換報江南天邊宿鳥生歸思關外晴山滿夕嵐立馬欲從何處別都門楊柳正毿毿髙仲武云八元嘗於郵亭偶題數句蓋激楚元以辭家維大異之遂親指喻數年克賦擢第至如雪晴山脊見沙淺浪㾗交得山水狀貌也八元睦州人登大曆進士第八元新安江行詩云江源南去永野渡暫維梢古戍懸漁網空林露鳥巢雪晴山脊見沙淺浪㾗交自笑無媒者逢人即解嘲寄苖貟外云舊宅平津邸槐隂接漢宫鳴騶馳道上見月直廬中白雪歌偏麗青雲官早通悠悠天一縫千里恨清風李穆劉長卿之壻也詩寄劉云處處雲山無盡時桐廬南望轉參差舟人莫道新安近欲上潺湲行自遲在新時劉郡安劉答云孤舟相訪至天涯萬轉雲山路更賖欲掃柴門迎客逺青苔黃葉滿貧家長卿又送穆詩云渡口發梅花山中動泉脉蕪城春草生君作楊州客鴈還空渚在人去落湖翻臨水獨揮手殘陽歸掩門狎鷗携稚子釣魚終老身殷勤囑歸客莫話桃源人韋應物周逍遙公敻之後待價生令儀令儀生鑾鑾生應物其詩言天寶時扈從遊幸事疑為三衛永泰中任洛陽丞京兆府功曹天曆十四年自扈縣令制除櫟陽令以疾辭不就建中二年由北部外郎出剌滁州攺剌江州追赴闕攺左司郎中正元𥘉歷蘇州罷守寓蘇臺永定精舍李肇國史𥙷云開元後位卑而著名李北海雍王江寧昌齡李館陶鄭廣文䖍元魯山德秀蕭功曹頴士張長史旭獨孤常州及崔北部梁補闕肅韋蘇州其一也應物仕官本末似止於蘇案白傳蘇州答劉禹錫詩云敢有文章替左司謂應物也官稱亦止此郡齊雨中與諸文士燕集詩云兵衛森畫㦸宴寢凝清香海上風雨至逍遙池閣凉煩痾近正一作消散嘉賔復滿堂自慙居處崇未覩斯民康理會是非遣性逹形迹忘鮮肥屬時禁𬞞果幸見嘗俯飲一杯酒仰聆金玉章神歡體自輕意欲凌風翔作雲風一吳中盛文史群彥今汪洋方知大藩地盛一作豈曰財賦強應物性髙潔所在焚香掃地而坐惟顧况劉長卿丘丹秦系皎然之儔得厠賔列與之酬唱樂天吳郡詩石記獨書兵衛森畫㦸宴寢凝清香劉太真與韋書云顧著作來况也以足下郡齊燕集相示是何情致暢茂遒逸如此宋齊間沈謝吳何始精於理意然緣情體物備詩人之㫖後之傳者甚失其源惟足下制其橫流師摯之始關雎之亂於足下之文見之矣故人重九日求橘戲贈云憐君獨坐思新橘始摘猶酸亦未黃書後欲題三百顆洞庭須待滿林霜樂天與元九書云近歲韋蘇州歌行才麗之外頗近興諷其五言詩又髙雅間淡自成一家之體今之秉筆者誰能及之然當蘇州在時人亦未甚愛重必待身後然後貴之欲持一瓢酒逺寄風雨夕句萬籟自生聽大空常寂寥還從靜中起却向靜中銷聲詠山深松子落幽人應未眠句舟泊南池雨簾捲北樓風句右張為取作主客圖應物寄全椒山中道士云今朝郡齊冷忽念山中客澗底束荆薪歸來煮白石欲持一瓢酒逺寄風雨夕落葉遍空山何處尋行跡應物郡齊雨中燕集顧况和詩云好鳥集嘉樹飛雨灑髙城况與數君子列坐分兩楹文雅一何麗林堂含餘清我公未歸朝遊子不待情白雲帝鄉逺滄江桃葉鳴拜手欲無言零淚如酒傾寸心巳摧折別離方骨驚安得凌風翰肅肅賔天京時况左廷饒州司士參軍故寓意於詩朱放一作倣剡溪行寄新別云潺湲寒溪上自此成離别回首望歸人移舟逢暮雪頻行識草樹漸老傷年髮唯有白雲心為向東山月九日陪劉中丞宴送客云獨坐三臺妙重陽百越間水心觀逺俗霜氣入秋山不棄遺簮舊寧辭落帽還仍聞西上客咫尺謁天顔九日與楊凝崔淑期登江上山有故不往云欲從携手登髙去一到門前意巳無郍得更將頭上髮學他年少插茱茰山中聽子規云幽人自愛山中宿又近葛洪丹井西窗中有箇長松樹半夜子規來上啼亂後經淮隂岸云荒村古岸誰家在野水浮雲處處愁唯有河邊衰柳樹蟬聲相送到揚州剡山夜月六言云月在沃洲山上人歸剡縣溪邊漠漠黃花覆水時時白鷺驚船銅雀妓云恨唱歌聲咽愁翻舞䄂遲西陵日欲暮是妾斷腸時經故賀賔客鏡湖道觀云巳得歸鄉裏逍遙一外臣那隨游水去不待鏡湖春雪裏登山屐林間漉酒申空餘道士觀誰是學仙人放字長通襄州人隱居剡溪嗣曹王臯鎮江西辟節度參謀正元中召為左拾遺不就送張山人云知君住處足風煙古寺荒村在眼前便欲移家逐君去唯愁未有買山錢送著公歸越云誰能愁此别到越會相逢長憶雲門寺門前千萬峰石床埋積雪山路倒枯松莫學白道士無人知去蹤戴叔倫早行寄放云山曉旅人去天髙秋氣悲明河川上沒芳草露中滋此別又萬里少年能幾時心知剡溪路聊且寄前期放答陸澧云松葉堪為酒春來釀幾多不辭山路逺踏雪也相過毗陵留别云別離非一處此處最傷情白髮將青草相隨日日生遊石澗寺云聞道幽深石澗寺不逢流水亦難知莫道山僧無伴侣獼猴長在古松枝顧况贈放云野客歸時無四鄰黔婁別久桉常貧漁樵舊路不堪入何處空山猶有人嚴維贈放云昔年居漢水日醉習家池道勝跡長在名髙身不知欲依天目住新自始寧移生事曽無長唯將白接籬孫逖逖河南人年十五崔齊公日用試土火爐賦援翰立成甫冠三擅甲科吏侍王丘試竹簾賦降階約拜待以殊禮其典誥也宰相張九齡掎托疵瑕沉吟久之不能易一字公除庶子苑咸詔草曰西掖掌綸朝推無對張說命二子施伯仲之禮江夏李雍自陳州入計繕録其集詣公託知巳之分可謂人文之宗師國風之哲匠也卿序其文巳上顔真逖終刑部侍郎和登會稽山云稽山碧湖上勢入東溟盡煙景晝清明九峰爭隱嶙望中厭朱紱俗內探玄牝野老聽鳴騶山童擁竹軫仙花寒未落古蔓柔堪引竹澗入山多松崕向天近雲從海天去日就江村隕能賦丘嘗聞和歌叄不敏冥搜信冲漠多士期標凖願奉濯纓心長謡入招隱奉和左司貟外自洛使全京中路先赴長安逢立春日贈韋侍郎等諸公云拜郎登省闥奉使馳車乘遙瞻使者星便是郎官應臺妙時放言皇華德弥稱二陜聼風謡三秦望形勝此中睽友益是日多詩興寒盡歲隂催春歸日華證忽覩雲間數鴈回更逢山上花正開河邊淑氣迎芳草林下輕風待落梅秋憲府中髙唱入春卿署裏和聲來共言東閣招賢地自有西征謝傅才楊子江樓云楊子何年邑雄雄作禁關江連二妃渚雲近八公山驛道青桃外人煙緑嶼間晚來潮正滿數處落帆還李紓字仲舒大曆𥘉李季卿薦為左𥙷闕德宗時終吏侍李嘉祐有元日無衣冠入朝詩寄再從弟𥙷關紓獨孤及見元載求正字元知其所欲迎謂曰誰堪制誥及心知不我與乃薦紓時楊炎在閣下忌及故也李嘉祐自蘇臺至望亭驛人家盡空春物增思悵然有作寄從弟紓云南浦菰蔣覆白蘋東吳黎庶逐黃巾野棠自發空流水江燕𥘉歸不見人逺樹依依如送客平田渺渺獨傷春那堪回首長沙苑烽火年年報虜塵戴叔倫寄中書李舍人紓云萍翻蓬自卷不共本心期復入重城裏頻看百草滋水流歸思逺花發長年悲盡日春風起無人見此時畢耀與獨孤常州唱和嘗贈常州云洪爐無久停日月速如飛忽然衝人身飲酒不須疑常州後寄耀云别時前盟在寸景莫自擲心與白日鬪十無一滿百寓形薪火內甘作天地客與物無踈親斗酒勝竹帛耀與杜子美犮善子美贈畢四耀詩云才大今詩伯家貧苦䆠卑又喜耀除監察詩云大雅何寥闊斯人尚典刑交期余潦倒材力爾精靈其推重如此唐詩紀事卷第二十六
