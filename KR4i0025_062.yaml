  text: 唐詩紀事卷第六十二
  hash: sha256:ec179aa50f550b23439cedfde48e2980802caa5056bd212b6c949c376b5dbb21
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_062-1a}
body:
  text: 鄭嵎津陽門詩云華清宫之外闕南局禁闈北走京道開放中嵎常得群書下帷於石甕僧觀而甚聞宫中陳跡焉今年冬自虢而來暮及山下因解鞍謀飡求客旅邸而主公年且艾自言世事明皇夜闌酒餘復爲嵎道承平故實翌日於馬上輙裁刻俚叟之話爲長句七言詩凡一千四百字成一百韻止以門題爲之目云耳津陽門北臨通逵雪風獵獵飄酒旗泥寒欵叚蹶不進疲童退問前何爲酒家雇客催觧裝案前羅列樽與巵青錢瑣屑安足數白醪軟美甘如飴開爐引滿相獻酬枯腸渇肺忘朝飢愁憂似見出門去漸覺春色入四肢主翁移客挑華燈雙肩隠膝烏㡌欹笑云鮐老不爲禮飄蕭雪鬢霜垂頥閑余何徃凌寒曦顧翁枯杇郎豈知翁曽豪盛客不見我自爲君陳昔時時平親衞号羽林我纔十五爲孤兒射熊搏虎衆莫敵彎􅋃出入隨佽飛但以六軍爲親衛開元中未有東西神䇿軍此時初創觀風樓簷髙百尺堆華榱樓南更起闘鷄殿晨光山影相參差連上内前臨池道周視山川寳應中觀風樓在宫之外東北隅属夾城而存唯閗鷄殿焉球場迤邐而在魚朝思毁之以修章敬今遺址尚其年十月移禁仗山下櫛比羅百司朝元閣成老君見㑹昌縣以新豊移下至明年十月老君見于朝元閤南而於其處直時有詔改新豊爲㑹昌縣移自隂鱉故城置于山成令大将軍髙力弈禁樂以樂之降重觀復改新豐爲昭應縣廨宇始幽州曉進供奉馬玉珂寳勒黄金覊特而極衘䩗之飾安禄山毎進焉必珠五王扈駕夾成路傳聲校獵渭水湄六軍各出射絡野張罝維彫弓繡緯不知數翻身滅沒皆娥眉赤鷹黄鶻雲中來妖狐狡兎無所依人煩馬殆禽獸盡百里腥膻禾黍稀特異他等上愛之毎弋獵必置於駕前目為决申王有髙䴡赤鷹岐王有北山黄鵠逸期竒姿兒勝暖山度臘東風微宫娃賜浴長湯池刻成玉蓮噴香液漱廻烟浪深逶迤有湯十六所長湯毎賜諸嬪宫内除供奉兩湯池内外更玉蓮捧湯泉噴以成池又縫綴盖繡爲鳬㕍於水中御嬪御其修廣與諸湯不侔斃以文瑶客石中央有縷小舟以嬉㳺焉上時於其間泛鈫犀屏象薦雜羅列錦鳬繡鴈相追隨破簮碎鈿不足拾金溝殘溜和纓緌上皇寛容易承事十家三國爭光輝繞床呼盧恣樗愽張燈逹晝相謾欺相君侈擬縱驕横日從秦虢多㳺嬉朱衫馬前未滿足更驅武卒羅旌旗節受使常與秦虢聮轡楊國忠爲宰相帶劍南兩川旌節爲導也而出更於馬前以畫輪寳軸從天來雲中笑語聲融怡鳴鞭後騎何躞􅰭宫粧禁袖皆仙姿青門紫陌多春風風中數日殘春遺驪駒吐沬一奮迅路人擁􅭌爭珠璣此更下重叙其事事盡載在囯史中八姨新起合歡堂翔鵾賀鷰無由窺万金酬工不看去矜能恃巧猶嗟咨創一虢囯受綘羅五千叚工者嗤而不顧虢囯汙之問其由工堂價費万金堂成工人償價之外更邀賞伎之直復蜂蠆之類其目而投扵堂中使有閑隙得立一物郎曰某生平之能殚於此矣茍不知信願得縷蟻蜡蝪佳人至今話故事者尚以弟行呼諸姨焉不論工直也扵是又以繒綵珍其與之山下四方節制傾附媚窮奢極侈沽恩私堂中特設夜明枕銀燭不張光鍳帷西川節度使所進事載囯史畧書之虢囯夜明枕置扵堂中光燭一室瑶光樓南皆紫禁梨園仙宴臨花枝迎娘歌㗋玉􅌄窱蛮兒舞帶金葳蕤蛮児乃梨园弟子之名聞者瑶光樓即飛霜殿之北門迎娘三郎紫笛弄烟月怨如别鶴呼覊雌玉奴琵琶香龍撥倚歌促酒聲嬌悲琵琶其樂器聞於人間者有逻逤檀爲上皇善吹笛常寳一紫玉管貴妃妙弹水調曲遍而太真輙弹弦倚歌爲上送酒内中皆以槽龍香栢爲撥者上毎執酒巵必令迎外歌乃太真小字也上爲三郎玉奴飲鹿泉邊春露晞粉梅檀杏飄朱墀金沙洞口長生殿玉蘃峰頭王母祠流澗号爲飲鹿山城内多馴鹿元閣即御長生殿以沐浴也有長生殿乃齋殿也有事扵朝禁庭術士多幻化上前較勝紛相持羅公如意奪顔色三藏袈裟成散絲将謁七聖殿忽然背痒公逺折竹枝化作七宝如意上頗崇羅公逺楊妃尤信金剛三藏上常幸功徳院㓜誰耳僧爲陛下取真物乃扵袖中出如宝七意炳以進上大喜顧渭金剛曰上人能致此乎三藏曰此三人定優劣時禁中将創小殿三藏乃㪯一鴻梁於耀而光逺所進即時復爲竹枝耳後一日楊妃與与以逺飛符於他處竊三藏金欄袈裟於籄中守者不之空中将中公逺之首公逺不爲動容上連命止之公水龍符扵袈裟上散爲絲縷以尽也見三藏怒又呪取之湏㬰而至公逺復噀蓬萊池上望秋月無雲万里懸清輝上皇夜半月中去三十六宫愁不歸月中秘樂天半間丁璫玉石和塤箎宸聦聽覽未終曲却到人間迷是非月宫時秋已深上苦葉法善常引上人入憶其半遂扵笛中冩之㑹西梁都督楊敬述進婆罗淒冷不爲久留帰扵天半間尚間仙楽及上帰且記用敬述所進曲作其腔而名霓裳羽衣法曲門曲每其声調相符遂以月中所聞爲之散序千秋御節在八月㑹同萬國朝華夷花蕚樓南大合樂八音九奏鸞來儀都盧尋橦誠齷齪公孫劍伎方神竒馬知舞徹下株榻人惜曲終更羽衣爲千秋節毎大上始以誕聖日當時号爲雄妙又設連榻令馬舞其上馬衣紈綺而酺㑹必扵勤政楼下使華夷縱觀有公孫大娘舞劍令宫妓梳九騎仙髻衣孔雀翠衣佩七宝瓔珞爲霓被鈴鐸驤首奮鬛㪯趾翹尾变熊動容皆中音律又以帰而私習之其後田承嗣代安有存者一旦扵廐裳羽衣之類曲終珠翠可掃其舞馬禄山亦将𢾗疋爲怒未斫妙因更奮繫宛轉曲尽其態厮恐以告承上聞鼓声頓挫其舞廐人悪之㪯篲以繫之其馬尚而舞焉自此絶矣嗣以爲妖遂戮之禄山此時侍御側金鷄畫障當梁罳繡祤衣褓日屓贔甘言狡計愈嬌癡㑹必令禄山上毎座及宴爲子時襁褓戯而加之上亦呼之禄児毎入宫必先坐扵御座側而以金鷄障隔之賜其箕踞太真又以不蕃中人礼先拜母後拜父是以然也拜貴妃然後拜上笑而問其故輒對曰臣詔令上路建甲第樓通走馬如飛翬大開内府恣供給玉缶金筐銀簸箕人督其事仍謂之曰卿善爲部署禄山眼時扵親仁里南陌爲禄山建甲弟令中貴咸金銀為之今回元覌即其故弟耳孔大勿令笑我至扵篣筐簸箕缶之具異謀潜熾促歸去臨軒賜帶盈十圍緩帶十五圍方周躰禄山肥愽過人腹垂而忠臣張公識逆狀日日切諌上弗疑逆狀數數言於上上張曲江先識其必反石勒而誤疑禄山尔曰卿勿以王夷甫識湯成召浴果不至潼關已溢漁陽師御街一夕無禁鼓玉輅順動西南馳子使回泣其年賜甘喻云我爲卿造一湯時卿至使回荅言反状上然後訴禄山反状云臣㡬不至生反上猶疑其言復遣使以至潼関矣憂疑即冦軍九門回望塵坌多六龍夜馭兵衞疲縣官無人具軍頓行宫徹屋屠雲螭頓之備上命徹行時郊畿草擾無御以饗士卒宫木宰御馬馬嵬驛前駕不發宰相射殺冤者誰長眉鬒髪作凝血空有君王潜涕洟青泥坂上到三蜀金堤城邊止九旂移文泣祭昔臣墓度曲悲歌秋㕍辭過劍閣下望山川忽憶水調辭云山川滿目淚沾駕至蜀詔中貴人馳祭張曲江墓悔不納其諫又㕍飛上泫然流涕顧問左右曰此誰人詩從臣對曰衣富貴榮華能幾時不見只今汾水上唯有年年秋李嶠真可謂才子也此李嶠詩復掩泣曰明年尚父上㨗書洗清觀闕收封畿兩君相見望賢頓君臣皷舞皆歔欷咸陽之東望賢宫在於上上之歔欷拜授左右皆泣不圖今日復觀兩君數里時車駕自蜀回肅宗迎駕至上皇自致傳囯璽决顧問從臣不能對高力士前曰上皇雖尊人臣也相見之禮駕将入開逺門上皇疑焉上先後入門不而入後行耆皆呼万歳當時皆是之皇帝維子主也上皇偏門而先行皇帝而正門宫中親呼高驃騎潜令改塟楊真妃花膚雪艶不復見空有香囊和淚滋其所瘞在嵬坡驛西北十餘歩當時時肅宗詔令改塟太真高力力士知塟之時皆已杇懷惟有胸前紫繡香囊中尚得水麝乗輿志據無復備周身之具且以紫縟而定之及改上皇泣而佩之香時以進上皇鑾輿却入清華宫滿山實紅垂相思飛霜殿前月悄悄迎春亭下風颸颸白傳長恨以長生飛霜殿即寝殿而幸華清宫信宿乃回自此遂移䖏西内中矣殿爲寝殿即殊誤矣上皇至明年復舊臣以雪衣女失玉籠在長生鹿瘦銅牌垂象牀塵凝罨颯被畫檐䖝網頗梨碑尤爱之字爲雪衣女上常扵芙蓉園中太真養白鸚鵡西囯所貢辨恵多辞上左右周視之乃於角際毛雪中得銅牌子刻之曰宜獲白鹿惟山人上昊識之曰此晋時鹿也上異之令上止華清罨颯公主嘗爲上晨召聽按新水調爱主春苑中白鹿上由是愈愛之移扵此山自知曰山客知省及上歸南内一旦再入此宫而當罨颯之被苑起晚遽自真珠被而出及冦至蒼惶隨駕出宫後不石瑩徹見人形影宫中号爲頗梨碑然而塵積矣上尤感焉温泉堂碑其碧菱花覆雲母陵風篁雨菊低離披真人影帳偏生草果老藥堂空掩扉真人潜告符契至今山下祠宇宫中有七姜真人李順興後周時修道北山神農皇帝授禅后皆立衣衮衣繞殿石榴樹皆太真所植俱擁腫矣殿自神農至睿宗所植俱擁腫矣南有功院其建竇順㒷影堂果老藥室亦在禁中也南有功院其間瑶壇羽帳皆在焉鼎湖一日失弓劒橋山烟草俄霏霏空聞玉捥入金市但見銅壺飄翠帷開元到今踰十紀當初事跡皆殘隳竹花唯養棲梧鳯水藻周㳺巢葉龜㑹昌御宇斥内典去留二教分黄緇慶山汙潴石甕毁紅樓緑閤皆支離竒松恠栢爲樵蘇童山眢谷亡嶮巇㷑中壁碎摩詰畫雲間字失玄宗詩有緑額複道而上天后朝以禁臣取宫持囯寺本名慶山寺徳宗始改其額洔修繕佛殿中玉石像皆幽州進来與朝元間道像同中制度結構之石甕寺開元中以創造華清宫餘材空像皆元伽兒之制能妙纎麗曠古無儔紅樓在佛日而至精妙無比叩之如罄餘像並楊惠之手塑肢萹一躰王右丞山水兩璧寺毁之後皆失之矣摩詰殿之西巖下臨絶壁樓中有玄宗題詩草八分毎一字也乃王維石魚巖底百尋井銀床下卷紅綆遲當時清影䕃紅葉一且飛埃埋素䂓其形如甕以佇飛泉石魚嵓下有天絲石叙引修祚長二百餘尺以汲甕泉出扵紅樓喬樹之故上以石甕爲之寺名寺僧扵上層飛樓中縣轆轤甕今已埋没也杪寺既毁拆石韓家燭臺倚林杪千枝燦若山霞摛昔年光彩奪天月昨日銷鎔當路岐臺髙八十尺置韓囯爲千枝灯光奪月凡百里之内皆可望焉于山上毎至上元夜則燃之千龍宫御牓髙可惜火焚牛挽臨﨑峗孔雀松殘赤琥珀鴛鴦瓦碎青琉螭雀松下有赤茯苓入圡千年則成琥珀寺之前峯古寺額睿宗在藩却中所題也摽扵危楼之上世傳孔今皆樵蘇蕩除矣松老桓洎乎嘉草今我前程能幾許徒有餘息筋力羸逢君話此空灑涕却憶歡娯無見期主翁莫泣聽我話寜勞感舊休呼嘻河清海宴不難覩我皇已上昇平基湟中土地昔烟没昨夜收復無瘡痍戎王北走弃青塜虜馬西奔空月支兩逢堯年豈易偶願翁頥養豐膚飢平明酒醒便分首今夕一罇翁莫違唐詩紀事卷第六十二
