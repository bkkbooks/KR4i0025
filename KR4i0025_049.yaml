  text: 唐詩紀事卷第四十九
  hash: sha256:3f754fc3d558689ab654f728d22e0db408e0dfa45fcd79d3f0186e0b213902bb
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_049-1a}
body:
  text: 胡杲吉皎劉真鄭據盧貞張渾白居易項斯龐藴蔡京滕邁郭周藩殷潜之裴思謙何扶鄭浣廖有方薛書記賈耽盧貞姚合胡杲胡杲年八十九前懷州司馬安定九老㑹賦詩云間居同㑹在三春大抵愚年最出羣霜鬢不嫌杯酒興白頭仍愛玉爐薰徘徊玩桞心猶健老大看花意却勤鑿落滿斟判酩酊香囊髙掛任氤氲搜神得句題紅𥿄望景長吟對白雲今日友情何不替齊年同事聖明君吉皎吉皎年八十八衛尉鄉致仕馮翊九老㑹云休官罷任巳間居林苑園亭興有餘對酒最宜花藻發邀歡不猒桞條初低腰醉舞垂緋袖擊筯謳歌任褐裾寧用管絃來合雜自親松竹且清虛飛觥酒到須先酌賦詠成詩不住書借問商山賢四皓不知此後更何如劉真平劉真八十七前磁州刺史廣九老㑹云垂絲今日幸同筵朱紫居身是大年賞景尚知心未退吟詩猶覺力完全間庭飲酒連三月在席權豪象七賢山茗煮時秋霧碧玉杯斟處彩霞鮮臨階花笑如歌妓傍竹松聲當管絃雖未學窮生死訣人間豈不是神仙鄭據陽鄭據八十五前龍武軍長史滎九老㑹云東洛幽間日暮春邀歡多是白頭賔官班朱紫多相似年幾髙低次第勻聮句每言松竹意停杯多說古今人更無外事來心肺空有清虛入思神醉舞兩回迎勸酒狂歌一曲㑹余身今朝何事偏情重同作明時列任臣盧貞范陽盧貞八十三前侍御史內供奉官九老㑹云三春巳盡洛陽宮天氣初晴景象中千朵嫩桃迎曉日萬株垂桞逐和風非論官位皆相似及至年髙亦共同對酒歌聲猶覺妙玩花詩思豈能窮先時共作三朝貴今日猶逢七老翁但願緑醽常滿酌煙霞萬里㑹應通張渾河張渾七十七前永州刺史清九老㑹云幽亭春盡共為歡印綬居身是大官遁跡豈勞登逺岫垂絲何必坐溪磻詩聮六韻猶應易酒飲三杯未覺難每况襟懷同要㑹共將心事比波瀾風吹野桞懸羅帶日照庭花落綺紈此席不煩鋪錦帳斯筵堪作畫圖看白居易仕年七十四刑部尚書致九老㑹云七人五百八十四拖紫紆朱垂白鬚囊裏無金莫嗟嘆樽中有酒且歡娛吟成六韻神還王飲到三杯氣尚麁嵬峩狂歌教婢拍婆娑醉舞遣孫扶天年髙邁二踈傳人數多於四皓圖除却三山五天笁人間此㑹且應無樂天退居洛中作尚齒九老之㑹其序曰胡吉劉鄭盧張等六賢皆多夀餘亦次焉於東都弊居履道坊合尚齒之㑹七老相顧既醉且歡靜而思之此㑹希有因各賦七言韻詩一章以記之或傳諸好事者時㑹昌五年二月二十四日樂天云其年夏又有二老年貌絶倫同歸故鄉亦來斯㑹續命書姓名年齒寫其形貌附于圖右與前七老題為九老圖仍以一絶贈之云雪作鬚眉雲作衣遼東華表暮雙歸當時一鸖猶希有何况今逢兩令威百三十六禪僧如滿歸洛中遺老李元爽年一十五嵗洛年九又云時祕書狄兼謨河南尹盧貞以年未七十雖與㑹而不及列項斯斯字子遷江東人始未為聞人因以卷謁楊敬之楊苦愛之贈詩云幾度見詩詩盡好及觀摽格過於詩平生不解藏人善到處逢人說項斯未幾詩逹長安明年擢上苐蒼梧雲氣詩云何年畫作愁漠漠便難收數㸃山能逺平鋪水不流濕連湘竹暮濃蓋舜墳秋亦有思鄉客看來盡白頭贈金州姚合使君云為郎名更重領郡是蹉跎官壁題詩盡衙庭看鸖多城池連竹塹籬落帶椒坡未覺旌幡貴間行觸處過始張水部籍為律格詩惟朱慶餘親授其㫖㳂流而下有任蕃陳摽章孝摽司空圖咸及門焉寶曆開成之際斯尤為水部所知故其詩格與之相類鄭少師薰云項斯逢水部誰道不關情斯留别水部詩云省中重拜别兼領故人書已念此行逺不應相問踈子城西並宅御水北同渠要取春前到乘間候起居佳人背江坐眉際列煙樹燕句庾樓馬蹄沒青莎船跡成空波春風吹兩意何處更相值意古燭殘催卷席坐冷怕梳頭寒入鴈聲長句右張為取於主客圖張籍贈詩云端坐吟詩忘忍飢萬人中亦見君稀門連野水風長到驢放秋原夜不歸日暖剩收新落葉天寒更著舊生衣曲江亭上頻頻見為愛鸕鷀雨飛裏龐藴藴有詩云未識龍宮莫說珠識珠言說與君殊空拳只是嬰兒信豈得將來誑老夫又曰萬法從心起心生萬法生法生何日了來去枉虛行寄語修道人空生愼勿生如能逹此理不動出深坑又曰極目觀前境寂寥無一人回頭看後底影亦不隨身又曰神識茍能無罣礙廓周法界等虛空不假坐禪持戒律超然解脫豈勞功藴字道元衡陽人嗜浮屠法厭離貪俗挈所有沉之洞庭鬻竹器以為生後居襄陽臨終召刺史于頔謂曰但願空諸所有愼勿實諸所無善住世間皆知影響言訖奄然而化時正元間也世號龎居士居士初參石頭和尚問師不與萬法為侣是什麼人石頭以手掩居士口居士豁然大悟石頭一日問居士云子自見老僧已來日用事作麼生居士云若問某甲日用事直下無開口處石頭云知子什麼方始問子居士遂呈一頌曰日用事無别惟吾自偶諧頭頭非取捨處處勿張乖朱紫誰為號青山絶㸃埃神通并妙用運水及搬柴石頭然之曰子將緇耶素耶居士曰願從所慕遂不染剃居士後之江南參見馬祖問不與萬法為侶是什麼人祖云待你一口吸盡西江水即向汝道居士言下頓悟宗要乃作頌曰十方同聚㑹箇箇學無為此是選佛場心空及第歸居士一日訪谷隱道者道者問云誰居士立起杖子隱云莫是上上機麼居士拋下杖子隱無語居士云只知上上機不覺上上事隱云作麼生是上上事居士拈起杖子隱云不得草草居士云可憐強作主宰隱云有一機人不要拈捶豎拂亦不明對答言辭居士若逢如何則是居士云何處逢隱把住居士居士驀面便唾隱無語居士與一頌曰熖水無魚下底鈎覔魚無處笑君愁可憐谷隱孜禪伯被唾如何見亦羞蔡京雍州蔡大夫京者故令狐文公楚鎮滑臺日於僧中見曰此童眉目踈秀進退不懾惜其單幼可以勸學乎師從之乃得陪學於相國子弟後以進士舉上第尋又學究登科作尉畿服既為御史覆獄淮南李相紳憂悸而卒頗得繡衣之稱謫居澧州為厲員外玄所辱稍遷撫州刺史以辭氣自負郡有汝水為放生池不許漁罟之事忽一人乘小舟釣於此蔡遣吏捕釣者乃為詩曰拋却長竿卷却絲手携蓑苙獻新詩臨川太守清如鏡不是漁人下釣時京覽詩召之巳去卒不言其姓字或曰野人張頂也京益自驕矜作詩責商山四皓曰秦末家家思逐鹿商山四皓獨忘機如何鬢髮霜相似更出深山定是非及假節雍交道由吳溪傍偟賦詩久之詩曰停撓積水中舉目孤煙外借問吳溪人誰家有山賣既而殂於雍南藁殯此地亦有其兆矣詠子規云千年冤魄化為禽永逐悲風呌逺林愁血滴花春豔死月明飄浪冷光沉凝成紫塞風前淚驚破紅樓夢裏心腸斷楚詞歸不得劔門迢遞蜀江深劉夢得有送前進士蔡京赴學究科詩云已是世間能賦客更攻窗下絶編書又云幸遇天官舊丞相知君無翼上虛空蓋欲薦之時相也京以進士舉登學究科時為好及苐惡科名有錦上披簔之誚焉令狐文公在天平後堂宴樂京時在坐故義山詩云曰足禪僧思敗道青袍御史擬休官謂京曾為僧也或云咸通中為廣西節度褊忮貪克峻條令為炮熏刳斫法御下慘毒為軍中所逐後貶死滕邁湖州崔芻言郎中初為越副戎宴席中有周德華者劉採春女善歌楊柳枝詞所唱七八篇皆名流之詠滕邁郎中一首云三條陌上拂金羈萬里橋邊映酒旗此日令人腸欲斷不堪將入笛中吹賀知章祕監一首云碧玉裝成一樹高萬條垂下緑絲絛不知細葉誰裁出二月春風似剪刀楊巨源員外一首云江邊楊柳麴塵絲立馬憑君折一枝唯有春風最應惜殷勤更向手中吹劉禹錫尚書一首云春江一曲柳千條二十年前舊板橋曾與美人橋上别恨無消息到今朝韓琮舍人二首云枝裊芳腰葉鬪眉春來無處不如絲灞陵原上多離别少有長條拂地垂又曰梁苑隋堤事已空萬條猶舞舊春風郍堪更想千年後誰見楊花入漢宮雲溪子曰杜牧舍人云巫娥廟裏低含雨宋玉堂前斜帶風滕郎中又云陶令門前罥接籬亞夫營裏拂朱旗但不言楊桞二字最為妙也是以姚合郎中吟道傍亭子詩云南陌遊人回首去東林道者杖藜歸不稱亭而意見矣邁登元和進士苐郭周藩談宜者陵州民叔皮子也開元末生而有異年二十餘忽失所在大曆初年還家即霞冠羽衣真仙之流也言訖而去其家靈泉湧出禱必有應因名談子池亦曰天池進士郭周藩為詩記其事曰澄水一百步世名談子池余詰陵陽叟此池當因誰父老謂餘說本郡談叔皮開元末年中生子字阿宜墜地便能語九嵗多髭眉不飲亦不食未嘗言渴飢十五鋭行走快馬不能追二十入山林一去無還期父母憶念深鄉閭為立祠大曆元年春此兒忽來歸頭冠簮鳳凰身著霓裳衣普遍拯疲俗丁寧告親知餘為神仙官下界不可祈恐為妖魅假不如早平夷此有黃金藏鎮在兹廟基發掘散生聚可以救貧羸金出繼靈泉湛若清琉璃泓澄表符瑞水旱無竭時言訖辭冲虛杳靄上玄微凡情留不得攀望衆號悲尋禀神仙誡徹廟僅開窺果獲無窮寶均融沾困危巨源出巔頂噴湧世間稀異境流千古終年福四維周藩河東人登元和六年苐殷潜之野人殷潜之題籌筆驛云江東矜割據鄴下奪孤婺矛牙霸略非匡漢宏圖欲佐誰奏書辭後主仗劔出全師重襲褒斜路懸開反正旗欲將苞有截必使覺無遺沉慮經謀際揮毫决勝時圜觚當分畫前筯此操持山秀扶英氣川流入妙思算成功在彀運去事終亐命屈天方厭人亡國自隨艱難推舊姓開創極初基總歎曾過地寧探作教資若歸新曆數誰復顧衰危報德兼明道長留識者知杜牧之和云三吳裂婺女九錫獄孤兒霸王業未半本朝心是誰永安宫受詔籌筆驛沉思畫地乾坤在濡毫勝負知艱難同草創得失計毫厘寂默經千慮分明渾一期川流縈智思山聳助扶持慷慨匡時略從容問罪師褒中秋鼓角渭曲晚旄旗仗義懸無敵鳴攻固有辭若非天奪去豈復慮能支子夜星才落鴻都鼎便移郵亭世自換白日事長垂何處躬耕者猶題殄瘁詩裴思謙思謙及苐後作紅箋名𥿄十數詣平康里因宿於里中詰旦賦詩曰銀釭斜背解鳴璫小語偷聲賀玉郎從此不知蘭麝貴夜來新染桂枝香思謙開成三年登上苐何扶扶大和九年及苐明年捷三篇因以一絶寄舊同年曰金榜題名墨尚新今年依舊去年春花間每被紅粧問何事重來只一人鄭浣和李德裕遊漢州房公湖云太尉留琴聽時移重可尋徽絃一掩抑風月助登臨榮駐青油騎高張白雪音秪言酬唱美良史記王針又云靜對煙波夕猶思棟宇精卧龍空有處馴鳥獨忘情顧步襟期逺參差物象橫自宜雕樂石爽氣際青城舊竹亭聞琴云石室寒颷鶩孫枝雅器裁坐來山水操絃斷弔遺埃浣餘慶之子文宗時為翰林學士進左丞出為山南西道節度使以户部尚書召卒文宗嘗為餘慶曰㴠卿令子而朕直臣也可更相賀㴠浣舊名以文宗故名改焉廖有方有方元和十年失意遊蜀至寶雞西界窆旅逝者書板記之曰余元和乙未嵗落苐西征適此聞呻吟之聲潜聽而微惙也問其疾苦住止對曰辛勤數舉未遇知音眄睞叩頭久而復語唯以殘骸相託餘不能言俄而逝餘乃鬻所乘馬於村豪備棺瘞之恨不知其姓字臨歧悽斷復為銘曰嗟君沒世委空囊幾度勞心翰墨場半面為君申一慟不知何處是家鄉明年李逢吉擢有方及第改名游鄉唐之義士也有方交州人桞子厚以序送之薛書記元相公賔府有薛書記飲酒醉後因爭令擲注子擊傷相公猶子遂出幕醒來乃作十離詩上獻府主犬離主云馴撓朱門四五年毛香足淨主人憐無端咬著親情客不得紅絲毯上眠筆離手云越管宣毫始稱情紅箋𥿄上撒花瓊都緣用久鋒頭盡不得羲之手裏擎馬離廄云雪耳紅毛淺碧蹄追風曾到日東西為驚玉貌郎君墜不得華軒更一嘶鸚鵡離籠云隴西獨自一孤身飛去飛來上錦裀都緣出去無方便不得籠中再喚人燕離巢云出入朱門未忍拋主人嘗愛語咬咬銜泥穢汚珊瑚簟不得梁間更壘巢珠離掌云皎潔圓明內外通清光似照水精宫都緣一㸃瑕相穢不得終霄在掌中魚離池云戲躍蓮池四五秋常搖朱尾弄輪鈎無端擺斷芙蓉朵不得清波更一遊鷹離主云瓜利如鋒眼似鈴平原捉兔稱髙情無端竄向青雲外不得君王手上擎竹離亭云蓊鬱新栽四五行常將貞節負秋霜為緣春筍鑽牆破不得垂隂覆玉堂鏡離臺云鑄㵼黃金鏡始開初生三五月徘徊為遭無限塵䝉蔽不得華堂上玉臺元公詩云馬上同携今日杯湖邊還折去年梅年年秪是人空老處處何曾花不開歌詠每添詩酒興醉酣還命管絃來樽前百事皆依舊㸃檢唯無薛秀才賈耽耽賦虞書歌云衆書之中虞書巧躰法自然歸大道不同懷素只攻顛豈類張芝惟劄草形勢素筯骨老父子君臣相揖抱孤青似竹更颼飀闊白如波長浩渺能方正不隳倒功夫未至難尋奧須知孔子廟堂碑便是青箱中至寶耽字敦詩正元中為宰相盧貞字子䝉㑹昌五年為河南尹樂天九老㑹貞年未七十亦與焉時又有內供奉盧貞貞和劉夢得嵗夜懷云文翰走天下琴樽卧洛陽貞元朝士盡新嵗一悲凉名早緣才大官遲為夀長時來知病巳莫歎步趍妨楊桞枝詞云一樹依依在永豐兩枝飛去杳無蹤玉皇曾採人間曲應逐歌聲入九重姚合合宰相崇曾孫登元和進士第調武功主簿世號姚武功又為富平萬年尉寶應中歷監察御史户部外郎出荆杭二州刺史後為給事中陜虢觀察使開成末終祕書監與馬戴費冠卿殷堯藩張籍遊李頻師之合有涵元集取王維等二十六人詩百篇曰此詩中射雕手也移花兼蝶至買石得雲饒句插劔龍纒臂開旗火滿身句家中去城逺日月在船多句身慙山友棄膽賴酒杯扶句右張為主客圖取李益為清竒雅正主以合為入室酉陽雜爼言僧清教句云雷電下嵩隂故姚監常吟之不輟又僧雲容句云朩末上明星清教又有句云香連鄰舍像荆州僧云犬熟護鄰房張籍寄合詩云病來辭赤縣按上有丹經為客燒茶竈教兒掃竹亭詩成添舊卷酒盡卧空瓶闕下今遺逸誰占隱士星又寒食夜寄合云貧官多寂寞不異野人居作酒和山藥教兒寫道書五湖歸去逺百事病來踈況是同懷客寒應月上初合酬張司業見寄云日日在心中青山青桂叢髙人多愛靜歸路亦應同罷吏無由病因僧得解空新詩勞見問吟對竹林風一日看除目終年損道心合之詩也合為魏州從事寄耿拾遺云小在兵馬間長還繫戎職雞飛不得逺豈要生羽翼三年城中遊與君最相識應知我衷腸不茍念衣食主人樹功名欲揻天下賊愚雖乏智謀願陳一夫力人生須氣健飢凍縳不得睡當一席寬覺乃千里窄古人不懼死徒死亦無益至交不可合一合難離拆君嘗相勸勉苦語毒胸臆百年心知聞誰限河南北送張宗原詩云東門送客道春色如死灰一客失意行十客顔色低住者既無家去者又非歸愁窮一成疾百藥不可治子賢我且愚命分不合齊誰開蹇躓門日日同遊棲子行何所之切切食與衣誰能買仁義令子無寒飢野田不草草四向生路岐士人甚商賈終日須東西鴻鴈春北去秋風復南飛勉君向前路無失相見期武功縣間居云縣去京城逺為官與隱齊馬隨山鹿放雞雜野禽棲連舍惟滕架侵階是藥畦更師嵇叔夜不擬作書題又云簿書多不㑹薄俸亦難銷醉卧慵開眼間行懶繫腰移花兼蝶至買石得雲饒且自心中樂從他笑寂寥又云日出方能起庭前看種莎吏來山鳥散酒熟野人過岐路荒城少煙霞逺岫多同官更相引下馬上西坡劔器云聖朝能用將破敵速如神插劔龍纒臂開旗火滿身積尸川沒岸流血野無塵今日當場舞須知盡戰人方干哭姚監云入室幾人成弟子為儒是處哭先生又上姚杭州云身貴久離行樂伴才高獨作後人師唐詩紀事卷第四十九
