front:
  text: 唐詩紀事卷第五十三
  hash: sha256:8d23dde1f81706ceb772b56203f1f49040b2984e3ff32c29e82141b8d11d09da
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_053-1a}
body:
  text: 喬琳王鋋于興宗李朋楊牢李汶儒薛䝉李鄴于環王嚴劉騤李渥盧栯劉璐李續盧求高璩田樟牛徴蕭祐魏謩陸肱李啇隱劉得仁喬琳緜州越王樓即事云三蜀澄清郡政閑登樓携酌日躋攀頓覺胸懷無俗事廻㸔掌握是人寰灘聲曲折涪州水雲影低衘冨樂山行鴈南飛似郷信忽然西笑向秦關琳爲郭子儀朔方掌書記與聮舎畢曜相棹訐貶巴州司戸叅軍歴果綿遂懷四州刺史建中初爲朱泚叛爲僞吏部尚書後伏誅臨刑歎曰我以七月七日生以此日死非命耶王鋋登越王樓見喬公詩偶題云雲架重樓出郡城虹梁雅韻仲宣情越王空置千年跡丞相兼揚萬古名過鳥時時衝客㑹閑風徃徃弄江聲謬將蹇歩㝷高躅魚日驪珠豈繼明鋋大曆中代喬琳為綿州剌史于興宗夏抄登越王樓臨涪江望雪山寄朝中知友詩云巴西西北樓堪望亦堪愁山亂江廻逺川清樹欲秋晴明中雪嶺煙靄下魚舟冩寄朝天客知予恨獨遊大中時以御史中丞守緜州後為洋川節度𥘉在左緜作此詩和者李朋楊牢軰皆朝中知友也許渾詶緜州于中丞見寄云故人書信越褒斜新意雖多舊約賖皆就一麾先去國共謀三逕未還家荆巫夜隔巴江月鄔郢春連漢上花半月離居猶恨望可堪垂白各天涯李朋綿州中丞以江山小圗逺垂賜及兼寄詩云巴江與雪山井邑共廻環圗寫丹青内分明煙靄間移君名郡興助我小齋閑日想登臨處高蹤不可攀朋為尚書郎和于興宗詩朋除刑部員外郎制云將仕郎御史李朋能積行實發其辭華方正端愼官業克舉之句杜牧楊牢牢洪農人少孤年六歳母俾入雜學誤入人家乃父友也方彈棊戯以局為題俾牢賦之應聲曰魁形下方天湏亞二十四寸牎中月年十八中第奉酬于中丞見寄之什詩云劔外書來日驚忙自拆封丹青得山水強徤慰心胸事少勝諸郡江廻見㡬重寜悲乆作别且似一相逢詩合焚香詠愁應賴酒濃庾樓寒更憶膓㫁雪千峰牢登大中二年進士第最有詩名大中時顧陶作唐詩類選去取甚嚴其序云刪定之𥘉如楊牢等十數公時猶在世及稍稍淪謝一篇一詠未稱所録若續有所得當列為卷軸庻無遺恨李汶儒和緜州于中丞詩云珎重巴西守殷勤寄逺情劔峰當戸碧詩韻滿樓清日照涪川闊煙籠雪嶠明徴黃㸔即及莫歎滯江城汶儒登大和五年進士第官至翰林學士汶儒守禮部員外郎充翰林學士制云才行冠時名聲曅然揚歴臺閣宣昭職業無人而不得其道守正而莫混其源並為儒者之英獨藴賢人之操乆遊安在相見何晚之詞牡牧薛蒙和綿州于中丞詩云左綿江上樓五馬此銷愁暑退千山雪風來萬水流邅廻猶剌郡繫滯似維舟即有徴黃日名川莫厭遊蒙時為考功郎李鄴和緜州于中丞詩云長聽巴西事㸔圗勝所聞江樓眀返照雪嶺亂晴雲景象詩情在幽竒筆跡分使君徒說好不抵怨離群鄴時為戸部郎宫于瓌和緜州于中丞詩云樓因藩邸號川勢似依樓顯敞含清暑風光入素秋山宜姑射貌江泛李膺舟郢曲思朋執輕紗畫勝遊又云極目郡城樓浮雲拂檻愁政成多暇日詩思覺先秋逺霽千巗雪隨波一葉舟昔曽窺粉繪今願許陪遊瓌字正徳敖之子也大中七年進士第一人時為校書郎玉嚴和于中丞詩云雉堞臨朱檻登兹便散愁蟬聲怨炎夏山色報新秋江轉穿雲樹心閑隨葉舟仲宣徒有歎謝守㡬追遊嚴大中時布衣劉暌題越王樓寄獻中丞使君詩云朱軒逈壓碧煙州昔歳賢王是勝遊山簇劒峰朝闕逺水如巴字遶城流人間物象分千里天上笙歌醉五侯今日登臨無限意同霑恵化自銷愁騤時爲郷貢進士李渥秋日登臨越王樓詩曰越王曾牧劔南州因向城隅建此樓横玉逺開千嶠雪暗雷下聽一江流畫簷先弄朝陽色朱檻低臨衆木秋徒學仲宣聊四望且將詞賦好依劉渥時爲鄉貢進士後登第劉璐洋州于中丞頃牧左綿題詩越王樓上朝賢繼和輙課四韻詩云隔政代君矦多慙跡令猷山光來戸牖江鳥滿汀洲雅韻徴朝客清詞寫郡樓至今謡未巳注意在洋州璐為綿州剌史隔政代興宗璐曾剌蜀州盧栯和于中丞見寄詩云圖畫越王樓開緘慰别愁山光􅉼雪冷水色帶江秋雲鳥孤征鴈煙㠶一葉舟嚮風舒霽景如伴謝公遊栯時為洪文舘學士李續和中丞見寄詩云早年登此樓退想不勝愁地逺二千里時將四十秋洪皐尚書携登此樓於今三十士續相從東川奏舉過綿州刺史韋矣年邅迍多失路華皓任虚舟詩酒雖堪使何因得共遊續時為同州剌史盧求和于中丞見寄詩云高情推謝守善政属綿州未落紫泥詔閑登白雪樓晴江如送日寒嶺鎭迎秋滿壁朝天士唯予不繫舟求登寳暦二年進士第李翺之婿也翶典合淝有道人號先知始翶妹婿楊嗣復知舉求落第至是嗣復再知舉道人以小卷遺嗣復曰放牓日開之泊放牓開卷乃曰裴頭黃尾三求六李時第一人裴求牓末黃駕次則李俅盧求又李方玄從毅道裕景𥘉李助李俅共六人道人又謂翶曰公之子不如外孫後求子携鄭亞子畋李審權子遜能為相皆翶外孫也田章和于中丞云志乖多感物臨眺更増愁暑候雖云夏江聲巳似秋雪遥難辨木村近好維舟莫恨歸朝晚朝簮擬勝遊章登開成四年進士第高璩白敏中自劒南節度移荆南經忠州追尋樂天遺迹有詩云南浦花臨水東樓月映風璩時為書記有詩云公齋一到人非舊詩板重尋墨尚新璩自梓州剌史入朝經綿州與剌史薛逢登越王樓逢以詩贈别云乗逓初登劔外州傾心喜事冨人侯方當游藝依仁日便到攀轅卧轍秋客聽巴歌消子夜許陪仙躅上危樓欲知恨戀情深䖏聽取長江旦暮流璩和云劒外緜州第一州罇前偏喜接君流歌聲婉轉添長恨管色凄凉似到秋但務歡娛思曉角獨耽雲水上高樓莫言此去難相見怨别徴黃是順流璩字瑩之第進士第翰林學士擢諌議大夫學士超省郎進官者惟鄭顥以尚主而璩以寵升懿宗時為宰相卒曹鄴言璩宰相交游醜雜進取多蹊徑諡法不思妄愛曰剌請謚為剌牛徴登越王樓即事詩云危樓送逺目信美奈郷情轉㟁孤舟疾衘山落照明蕭條㸔草色惆悵認江聲誰㑹登臨恨從軍白髪生徴登咸通二年進士第叢之子也蕭祐遊石堂觀詩云西山高高何所知上有古昔眞人居嶔崕巨石自成室其下磅礴含清虚我來斯邑訪遺迹乃遇沈生躭載籍沈生為政哀惸婺矛牙又能索隱探靈竒欣然向我話佳境與我﨑嶇到山頂甘瓜割緑出寒泉碧甌浮花酌春茗嚼瓜啜茗身清凉汗消絺綌如迎霜胡為空山百草花倐爾籩豆肆我旁始驚知周無小大力寡多方驗斯在妙用騰聲冠蓋間勝遊恣意烟霞外故碑石像凡幾年雲鬱雨霏衍生緑煙我知遊此多靈仙縹緲月中飛下天天風㣲微夕露委松梢颼颼暁聲起鳳去空遺簫管音星翻寥落銀河水勸君學道此時來結茅獨宿何遼哉齋心玄黙感靈衛必見鸞鶴相徘徊我愛崇山䨇劔北峰如人首拄天黒人頭山俗呼為群仙傴僂勢奔走狀若歸尊趨有德半巗有洞頂有池出入靈恠潜蛟螭我去不得晝夜思夢遊曽信南風吹南風吹我到林嶺故國不見秦天逈山花名藥撲地香月色泉聲洞心泠䕃松散髪逢異人寂寞曠然口不言道陵公逺莫能識髪短耳長誰獨存司農驚覺怱惆悵可惜所遊俱是妄藴懷耿耿誰與言直至今來意通形神開擁傳又恨斜陽催一丘人境尚堪戀何况海上金銀臺祐於唐為祠部郎中魏謩宣宗重陽錫宴群臣有御製詩其略曰欵塞旋征騎和戎委廟賢傾心方倚注叶力共安邉宰臣以下應制皆和上曰宰相魏謩詩㝡佳其两䏈云四方無事去神像抄秋來八水寒光起千山霽色開上嘉賞乆之魏蹈舞拜謝群寮聳視魏有得色極歡而罷謩字申之文宗時以直言拜右𥙷闕大中時鎭蜀宣宗曰謩名臣孫有祖風朕心憚之然卒以剛正為令狐綯所忌䜛罷之陸肱松詩云霜雪知勁質今古乞嘉名斷砌盤根逺踈林偃蓋清鶴栖何代色僧老四時聲鬰鬰心彌乆煙高萬井生肱大中九年登進士第咸通六年自前振武從事試平判入等後牧南康郡辟許棠為郡從事鄭谷寄詩云江山多勝境賔主是貧交肱以春賦得名李啇隱啇隱字義山懐州人英國公世勣裔孫令孤楚帥河陽竒其文使與諸子游楚歴鎭表爲廵官卒於工部侍郎郢故樊南甲乙之集作焉啇隱累佐王茂元鄭亞栁仲温庭筠段成式俱以儷偶相夸號三十六體楊大年出義山詩示陳恕酷愛一絶云珠箔輕明覆玊墀披香新殿鬪腰支不須㸔盡魚龍戯終遣君王怒偃師嘆曰古人措辭寓意如此深妙令人感㮣不巳大年又曰鄧帥錢若水舉賈誼兩句云可憐半夜虚前席不問蒼生問鬼神錢云措意如此後人何以企及鹿門先生唐彦謙爲詩纂慕玉溪得其清峭感愴盡其一體也然警絶之句亦多有商隱賦云豈如河畔牛星隔年只開一過不及苑中人桞終朝剰得三眠注漢中有人形桞一日三起三側義山少遊投宿逆旅主人會客召與坐不知其為義山也酒酣席客賦木蘭花詩義山後就曰洞庭波泠暁侵雲日日征㠶送逺人幾度木蘭舟上望不知舩是此花身坐客覧之大驚詢之乃義山也商隱為彭陽公從事彭陽之子綯繼有韋平之拜惡商隱從鄭亞之辟以為忘家恩踈之重陽日商隱留詩於其􅈦事曰曾共山翁把酒巵霜天白菊遶堦墀十年泉下無消息九日罇前有所思不學漢臣裁苜蓿空教楚客詠江蘺郎君官貴施行馬東閤無因再得窺綯乃𥙷太學博士尋為東川桞仲郢判官府罷客榮陽卒錦瑟詩云錦瑟無端五十絃一絃一柱思華年莊生暁夢迷蝴蝶望帝春心託杜鵑滄海月明珠有淚藍田日暖玉生煙此情可待成追憶只自當時巳惘然狐楚之妾或云錦瑟令劉得仁聽松聲詩曰庭際微風暖高松韻自生聽時無物亂盡日覺神清強以幽泉並翻嫌細雨并拂空増鶴唳得仁貴主之子自開成至大中三朝昆弟皆歴貴仕而得仁苦於詩出入舉場三十年卒無成常自𫐠曰外家雖是帝當路且無親又云帝族外王是中朝親故稀翻令浮議者不許九霄飛旣終詩人競為詩弔之僧栖白詩曰忍苦為詩身到此氷魂雪魄巳難招若教桂子落墳上生得一枝寃始銷吟若曉燈暗露深秋草踈舊山多夢到流水送愁餘句風定一池星句右張為取作主客圖宿宣義里池亭云暮色遶桐亭南山幽竹青夜深斜舫月風定一池星島嶼無人傍菰蒲有鶴翎此中休使得何必泛滄溟聽歌云朱檻滿明月美人歌落梅忽驚塵起處疑有鳳飛來一曲聽𥘉徹幾年愁暫開東南正雲雨不得見陽臺長信宫云簟凉秋氣初長信恨何如拂黛月生指觧環雲滿梳一從悲畫扇幾度泣前魚坐聽南宫樂清風揺翠𥚑
