front:
  text: 唐詩紀事卷第四十
  hash: sha256:ba6a51cfdb76a14309890b422e930975e06d5a5a7008cf45500819a781f9c838
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_040-1a}
body:
  text: 范傳正薛存誠賈島馬異張登包吉長孫佐輔李正封崔護張又新陸復禮桞公權陸鴻漸王季則王公亮徐牧陳存范傳正謝真人過舊山云麾蓋從仙府笙歌入舊山水流丹竈缺雲起草堂關白鹿行為衛青鸞舞自間種松鱗未立移石蘚仍斑望路煙霞外回輿巖岫間豈唯遼西鶴空歎令威還鮑溶人日陪宣州范中丞傳正與范侍御宴云人日春風綻早梅謝家兄弟看花來吳姬對酒歌千曲秦語留人酒百杯絲桞向空初宛轉玉山看日漸徘徊流光易去歡難得莫厭頻頻上此臺傳正元和十二年亷問宣池遷李白墳於青山之陽為銘曰嵩嶽降神是生輔臣蓬萊譴真斯為逸人晉有七賢唐稱八仙應彼星象唯公一焉晦以麴蘖暢於文編萬象奔乎筆端萬慮泯滅乎樽前卧必酒甕行唯酒船吟風詠月席地幕天但貴適其所適不知夫所以然而然至今尚疑其醉在千日寧審乎夀終百年謝家山兮李公墓異代詩流同此路舊墳卑庳風雨侵新宅爽塏松柏林故鄉萬里且無嗣二女從民永於此猗歟琢石為二碑一藏幽隧一臨歧岸深谷髙變化時一存一毁名不虧傳正為宣歙觀察頗事華侈憲宗知之代還拜光祿卿好古性情悍初自整飭官益逹用度益奢傾資貨市權貴歡私公府如家帑亦幸素有名不敗云薛存誠暮春自南臺丞再除給事中仍是本廳几榻杖履宛然如舊云再入青瑣闈忝官誠自非拂塵驚物在開户似僧歸積草漸無徑殘花猶灑衣禁垣偏日近行坐是恩輝盧綸同存誠登栖巖寺云衰蹇步難前上山如上天塵泥來自晚猿鳥到何先萬壑應孤磬百花通一泉蒼蒼此明月下界正沉眠存誠字資明河中人登正元進士第和易容物而當官毅然不可奪元和末為御史中丞卒賈島字浪仙范陽人初為浮屠名無本能詩獨變格入僻似矯艷於元白來洛陽韓愈教為文去浮屠舉進士終普州司戶島久不第吟病蟬之句以刺公卿或奏島與平曾等為十惡逐之詩曰病蟬飛不得向我掌中行折翼猶能薄酸吟尚極清露華凝在腹塵點誤侵睛黃雀并烏鳥俱懷害爾情大中末授遂州長江簿初之任屇東川守者厚禮之島獻感恩詩曰匏革奏終非獨樂軍城未曉啓重門何時却入三台貴此日空知八座尊羅綺舞間收雨點貔貅鬪外卷雲根逐遷屬吏隨賔列撥棹扁舟不忘恩自長江遷普州司倉方干自鏡湖寄詩曰亂山重復疊何路訪先生豈料多才者空垂不第名間曹猶得醉薄俸亦勝耕莫問吟詩苦年年芳草平島至老無子因啖牛肉得疾終于傳舍延康吟云寄居延夀里為與延康鄰不愛延康里愛此里中人人非十年故人非九族親人有不杇語得之煙山春望山詩云南山三十里不見踰一旬冒雨時立望望之如朋親虬龍一掬波洗蕩千萬春日日雨不斷怨殺望山人天事不可長徑風來如奔隂淫一已掃浩翠寫國門長安百萬家家家張屏新誰家最好山我願為其鄰朝飢云市中有樵山此舍無朝煙井底有甘泉釜中乃空然我要見白日雪來塞青天立聞西牀琴凍折兩三絃飢莫詣他門古人有拙言再投李益常侍云何處初投刺當時赴尹京淹留花栁變然諾肺腸傾避暑蟬移樹髙眠鴈過城人家嵩嶽色公府洛河聲聮句逄秋盡嘗茶見月生新衣裁白紵思從曲江行王建寄島詩云盡日吟詩坐忍飢萬人中梘似君稀僮眠冷榻朝猶卧驢放秋田夜不歸傍暖旋收紅落葉覺寒重著舊生衣曲江池畔時時到為愛鸕鷀雨裏飛島詩有警句韓退之喜之其渡桑乾詩曰客舍并州三十霜歸心日夜憶咸陽如今更渡桑乾水却望并州是故鄉又赴長江道中詩曰䇿杖馳山驛逄人問梓州長江那日到行客替生愁晉公度初立第於街西興化里鑿池種竹起臺榭島方下第或以為執政惡之故不在選怨憤題詩曰破却千家作一池不栽桃李種薔薇薔薇花落秋風起荆棘滿庭君始知皆惡其不遜島為僧時洛陽令不許僧午後出寺賈有詩云不如牛與羊猶得日暮歸韓愈惜其才俾反俗應舉貽其詩云孟郊死葬北邙山日月星辰頓覺間天恐文章中斷絶再生賈島在人間由是振名退之詩或曰非送長安惟鑒法師云講經春色裏花繞御床飛南海幾回渡舊山臨老歸觸風香損印霑雨磬生衣雲水路迢遞往來消息稀題杜司户亭子云牀頭枕是溪中石井底泉通竹下池宿客未眠過夜半獨聞山雨到來時題李欵幽居云間居少鄰並草徑入荒村鳥宿池中樹僧敲月下門過橋分野色移石動雲根暫去還來此幽期不負言哭柏嵓和尚云苔覆石牀新吾師古幾春寫留行道影焚却坐禪身塔院關松雪房門鎖隙塵自嫌雙淚下不是解空人乃是燒殺活和尚也永叔云焚却坐禪身哭孟郊云身死聲名在多應萬古傳寡妻無子息破宅帶林泉塜近登山道詩隨過海船故人相豫後斜日下寒天普州有嶽陽山島葬於此唐安程錡從事倅嶽陽有詩曰倚恃才難繼昻藏貌不恭騎驢衝太尹奪卷誤宣宗馳譽超前輩居官下我儂司倉舊曹署一見一心忡唐末舉子李克恭有詩曰一一玄微縹眇成盡吟方更爽神情宣宗謫去為間事韓愈知來已振名海底也應搜得淨月輪常被玩教傾如何未隔四十載不遇論量向此生夜半長安雨燈前越客吟士句贈吳處島嶼夏雲起汀洲芳草深句秋風吹渭水落葉滿長安句山鍾夜度空江水汀月寒生古石樓句舊國别多日故人無少年句右張為取作主客圖李洞過浪仙舊地云鸖外唐來有句星長江東注冷滄溟境搜松雪仙人島吟歇林泉主簿廳片月已能臨榜黑遙天何益抱墳青年年誰不登髙第未勝騎驢入畫屏姚合寄島云寂寞荒原下南山只隔籬家貧惟我並詩好復誰知草色無窮處蟲聲少盡時朝昏鼓不到間卧益相思浪仙寄友人云一日不作詩心源如廢井筆硯為轆轤吟詠作縈綆朝來重汲引依舊得清冷書贈同懷人詞中作苦辛島赴舉至京騎驢賦詩得僧推月下門之句欲改推作敲引手作推敲之勢未決不覺衝大尹韓愈乃具言愈曰敲字佳矣遂並轡論詩久之或云吟落葉滿長安之句唐突大尹劉栖楚被繫一夕放之馬異送皇甫湜赴舉云馬啼聲特特去入天子國借問去是誰秀才皇甫湜吞吐一腸文八音兼五色主文有崔李郁郁為朝德青銅鏡必明朱絲繩必直稱意太平年願子長相憶貞元旱嵗云赤地炎都寸草無雨川水沸煮蟲魚定應燋爛無人救淚落三篇古尚書暮春醉中寄李干云歡異且交親酒生開甕春不須愁犯卯且乞醉過申折草為籌筯鋪花作錦禋嬌鶯解言語留客也殷勤異河南人與盧同結交答同結交詩云有鳥南翔口銜一書札逹我山之維開緘金玉煥陸離乃是盧同結交詩此詩峭絶天邊格力與文星色相射長河拔作數條絲太華磨成一拳石莫嗟獨笑無往還月中芳桂難追攀况值亂邦不平年回陵到谷如等間與君俯首大艱阻喙長三尺不得語因君今日形章句羡獮猴子著衣裳悲蚯蚓子安翅羽上天不失察我為遼天失所將吾劔兮切遊泥使良驥兮捕老鼠昨日脫身卑賤籠卯星借與老人峰抱鋤築地藝芝术偃蓋參天舊有松我與松兮保身世臥居居兮起于于潄潺潺兮聆嘒嘒道在其中可終嵗不教辜負堯為帝燒我荷衣摧我身回看天地如砥平鎠刀銼骨不辭去卑窮君子今明明俯首辭山心慘惻白雲雖收戀不得看雲且擬直須臾疾風又卷西飛翼為報覃懷新結交死生富貴存後凋我心不畏朱公散君意須防劉孝摽以膠投漆苦不早就中相去萬里道河水悠悠山之間無由把袂攄懷抱同吟文能治奧成蘭薰不知何處清風夕擬使張華見陸雲張登招客遊寺云江城吏散倦春隂山寺鳴鍾隔雨深招取遺民赴僧社竹堂分坐靜看心小雪日戲題絶句云甲子徒推小雪天刺梧猶緑槿花然融和長養無時歇却是炎洲雨露偏送王主簿遊南海云平生推久要留滯共三年明日東南路窮荒霧露天曠懷常寄酒素業不言錢道在貧非病時來醜亦妍過山乘蠟屐涉海附樓船行矣無為限宗門有大賢上已泛舟詩云令節推元已天涯喜有期初筵臨泛地舊俗祓穰時枉渚潮新上殘春日正遲竹枝遊女曲桃葉度江詞風鷁今方退沙鷗亦未疑且同山簡醉倒戴莫褰帷劉夢得有楊州春夜與李端公益張侍御登假侍御平仲同會水館對酒聮句詩登始以巾褐就辟歷衛佐廷評登貞元中為河南士曹遷殿院為漳州刺史坐公纍受劾感疾卒權載之序其文曰清河張登剛潔介特不趍和從俗循性屬詞發為英華自江南士椽滿嵗計相表為殿中侍御史董賦江南無何授漳州刺史居七年坐公事受劾吏議侵誣胸臆約結感疾不起君疾卑讇細人白黑太明矯枉憤厲往往過正故其賦有云鶡必鬪而知斃龍雖屠而不馴又云賤而榮兮跌而喪痛一世之紛淪皆所以感憤頓挫放言敘心兆憂賈禍常必由之二十年間數免希遷志力相盩斯亦從古才士之所患也道雖由已感於知已名不加人成必因人此登之語也包吉字幼正潤州人登進士第為諫議大夫坐善元載貶嶺南劉晏奏起為汴東兩稅使貞元中為詩寄劉長卿云波瀾喧衆口藜藿靜吾廬喪馬思開卦占梟懶發書敘其遷謫之狀也父融與賀知章張若虛張旭號吳中四士酬于侍郎湖南見寄云桂嶺千崖斷湘流一派通長沙今賈傅東海舊丁公章甫經殊俗離騷繼雅風金閨文作字玉匣氣成虹翰墨時無侣丹青夙在公恩主留左掖人望積南宮巧拙循名異浮沉顧位同九遷歸上略三已契愚衷責謝庭中禮悲寬塞上翁楚材欣有適燕石愧無工山曉重嵐外林春苦霧中雪花翻海鸖波影到江楓去禮頻逄信回帆早挂空避賢方有日非敢愛微躬贈廬山白鸖觀劉尊師云蒼蒼五老霧中壇杳杳三山洞裏官手護崑崙象牙簡心推霹靂棗枝盤春飛雪粉加毫潤曉潄膏瓊氷聲去齒寒漸恨流年筯力少唯思露冕事星冠嶺下臥病寄劉長卿云唯有貧兼病能令親愛踈嵗時空放逐身世付空虛脛弱秋添絮頭風曉廢梳波瀾喧衆口藜藿靜吾廬喪馬思開卦占梟懶發書十年江海隔離恨子知豫長孫佐輔擬古詠河邊枯樹云野火燒枝水洗根數圍孤樹半心存應是無機承雨露却將春色寄苔痕别友人云愁多不忍醒時别想極還尋靜處行誰遣同衾又分手不如行路本無情德宗時人第公輔為吉州刺史佐輔往依焉佐輔有傷故人歌妓云愁臉無紅衣滿塵萬家門户不容身曽將一笑君前去誤殺幾多回顧人右張為取此詩作主客圗南中客舍對雨送故人歸北云猿聲啾啾鴈聲苦卷簾相對愁不語幾年客吳君在楚况送君歸我猶阻家書作得不忍封北風吹斷階前雨杭州秋日别故友云相見又相别大江秋水深悲歡一世事去住兩鄉心浙瀝籬下葉凄清階上琴獨隨孤掉去何處更同衾代别後夢别云别中還夢别悲後更生悲覺夢俱千里追期難再期翻思夢裏苦却恨覺來遲縱是非真事何妨夢會時答邊信云征人去年戍遼水夜得邊書字盈紙揮刀就燭裁紅綺結作同心答千里君寄邊書書莫絶妾答同心心自結同心再解心不離書字頻看字愁滅結成一夜和淚封貯書只在懷袖中莫如書字固難久願學同心長可同對鏡吟云憶昔逄君新納聘青銅鑄出千年鏡意憐光彩固無瑕義比恩情永相映每將鑒面兼鑒心鑒來不輟情逾深君非結心空結帶結處尚新恩已背開簾覽鏡悲難語對面相看孟門阻掩匣徒慙雙鳯飛懸臺欲效孤鸞衰昔日照來人共許今朝照罷自生疑鏡上有塵猶可拂君恩詎肯無廽時山行書事云日落風䬘䬘驅車行逺郊中心有所悲苦去穿黃茅茅中狐兔窠四面烏鳶巢鬼火時獨出人煙不相交行行近破村一徑欹還坳迎霜聼蟋蟀向月看蠨蛸翁喜客來坐客來羞厨庖濁醪誇撥蟻時果仍新苞相歡對寒爐呼兒爇枯梢性朴頗近古其言無斗筲憂歡世上并嵗月途中拋誰知問津客空作揚雄嘲古宮怨云窗前好樹名玫瑰去年花落今年開無情春色尚識反君心忽斷何時來憶昔粧成候仙仗宮璅玲瓏日新上拊心却笑西子嚬掩鼻誰憂鄭姬謗草染文章衣下履花粘甲乙牀前帳三千玉貌休自誇十二金叉獨相向盛衰傾奪欲何如嬌愛翻悲逐侫諛重逺豈能慙沼鵠棄前方見泣船魚看籠不記薰龍腦詠扇空曽秃鼠鬚始喜類蘿新託柏終傷如薺却甘荼院深獨開還獨閉鸚鵡驚飛苔覆地滿箱舊賜前日衣滴枕新垂夜來淚恨多開鏡照還悲緑髻青娥尚未衰莫道新縑長絶比猶逄故劔會相追李正封洛陽清明日雨霽云曉日清明天夜來嵩少雨千門尚煙火九陌無塵土酒緑河橋春漏間宫殿午遊人戀芳草半犯嚴城鼓詠露云霏霏靈液重雲表無聲落霑樹急玄蟬灑池凄皓鸖流塵清逺陌飛月澄髙閣霄潤玉堂簾曙寒金井索佳人比珠淚坐感空綃薄唐文皇好詩大和中賞牡丹上謂程修已曰今京邑人傳牡丹詩誰為首出對曰中書舍人李正封詩天香夜染衣國色朝酣酒時楊妃侍上曰粧臺前宜飲以一紫金盞酒則正封之詩見矣夏逰招隱寺暴雨晚晴云竹柏風雨過蕭踈臺殿涼石渠㵼奔溜金剎照頺陽鸖飛巖煙碧鹿鳴澗草香山僧引清梵幡蓋繞回廊禪門寺暮鍾云簨簴髙懸于闐鍾黃昏發地殷龍宮遊人憶到嵩山夜疊閣連樓倚太空退之正封從軍有晚秋郾城聮句詩正封云從軍古云樂談笑青油幕燈明夜觀碁月暗秋城拆遂為警䇿正封字中護終監察御史崔護晚雞云黯黯嚴城罷鼓鼙數聲相續出寒捿不嫌驚破紗窗夢却恐為奴半夜啼山雞舞石鏡云盧峰開石鏡人説舞山雞物象纎無隱禽情目自迷景當煙霧歇心喜錦翎齊宛轉烏呈彩婆娑鳯欲栖何言資羽族在地得天倪應笑翰名者終朝飲敗醯沈存中云唐人以詩主人物故雖小詩莫不烻揉極工而後已所謂旬煆月鍊者信非虛言小説護題城南詩其始曰去年今日此門中人面桃花相映紅人面不知何處去桃花依舊笑春風後以其意未全語未工改第三句曰人面秪今何處去至今所傳有此兩本惟本事詩作秪今何處在唐人作詩大率如此雖有兩今字不恤也取語意為主耳後人以其有兩今字故多行前篇筆談護舉進士不第清明獨遊都城南得村居花木叢萃叩門久有女子自門隟問之對曰尋春獨行酒渴求飲女人啓關以盂水至獨倚小桃柯佇立而意屬殊厚崔辭起送至門如不勝情而入後絶不復至及來嵗清明徑往尋之門庭如故而户扄鎖矣因題去年今日此門中之詩於其左扉護字殷功正元十二年登第終嶺南節度使張又新郡齋三月下旬作云春事日已歇池塘曠幽尋殘紅披獨墜初緑間淺深偃仰捲芳褥顧步愛新隂謀春未及竟夏初遽見侵三月五日陪裴大夫泛長沙東湖詩云上已餘風景芳辰集逺埛綵舟浮泛蕩繡轂下娉婷棲樹回蔥蒨笙歌轉杳冥湖光迷翡翠草色醉蜻蜓鳥弄桐花日魚翻榖雨萍從今留勝會誰看畫蘭亭五月水邊桞詩云結根挺涯涘垂影覆清淺睡臉寒未開懶腰晴更軟搖空條已重拂水帶方展似醉煙景凝如愁月露泫絲長魚誤恐枝弱禽驚踐悵别幾多情含春任攀搴時號又新張三頭謂進士狀頭宏詞勑頭京兆解頭又新嘗作廣陵從事有酒妓每致情焉後二十年罷江南郡舟道廣陵適李紳鎮淮南又新方懼其讎已而又遇風漂沒二子紳憫然復書曰端溪不讓之辭愚罔懷怨荆浦沉淪之事鄙實憫然宴遇殊厚前所謂酒妓者猶在席又新以指染酒題盤上為詞曰雲雨分飛二十年當時求夢不曽眠今頭白重相見還上襄陽玳瑁筵李即命妓歌以送酒又新與楊虔州善揚妻李有德無容又新求婚於揚曰得美室足矣揚曰但與我同好定諧君心又新既成婚殊失望乃為詩曰牡丹一朵直千金將謂從來色最深今日滿欄開似雪一生辜負看花心作惜看一又新字孔昭薦之子附逄吉罷貶汀州刺史又附李訓訓死復坐貶終左司郎中陸復禮正元八年宏詞試中和節詔賜公卿尺詩云春仲令初吉歡娛樂大中皇恩貞百度寶尺賜羣公欲使方隅法還令規矩同捧觀珍質麗拜受聖恩崇如荷丘山重思酬分寸功從兹度天地與國慶無窮是嵗復禮第一人李觀裴度次之栁公權公權武宗朝在內庭上常怒一宮嬪久之既而復召謂公權曰朕怪此人若得學士一篇當釋然矣目御前蜀箋數十幅授之公權略不佇思而成一絶曰不分前時忤主恩已甘寂寞守長門今朝却得君王顧重入椒房拭淚痕上大悅令宫人上前拜謝之文宗時充翰林學士從幸未央宫苑中駐驆謂公權曰我有一喜事邊上衣賜久不及時今年二月給春衣訖公權前奉賀上曰可賀我以詩宫人迫其口進公權應聲曰去嵗雖無戰今年未得歸皇恩何以報今日得春衣上悅激賞之文宗夏日與諸學士聮句曰人皆苦炎熱我愛夏日長公權續曰薰風自南來殿閣生微涼五學士屬和帝獨諷公權兩句辭清意足不可多得乃令公權題於壁上字方圓五寸帝視之嘆曰鍾王復生無以加矣公權字誠懸卒於太子太保陸鴻漸太子文學陸鴻漸名羽其先不知何許人景陵龍蓋寺僧姓陸於堤上得初生兒收育之遂以陸為氏及長聰俊多聞學贍辭逸恢諧辨捷性嗜茶始創煎茶法至今鬻茶之家陶為其像置於煬器之間云宜茶足利至大和中復州有一老僧云是陸僧弟子常諷其歌云不羡黃金壘不羡白玉杯不羡朝入省不羡暮入臺唯羡西江水長向金陵下來鴻漸又撰茶經三卷行於代今為鴻漸形因目為茶神有售則祭之無則以釡湯沃之皇甫曾送鴻漸採茶相過詩云千峰待逋客香茗復叢生採摘知深處煙霞羡獨行幽期山寺逺野飯石泉清寂寂然燈夜相思一磬聲吳門有辟強園地多怪石鴻漸玩月詩云辟強舊林閬怪石終相向權載之送陸太祝赴湖南幕詩云不憚征路遙定緣賔禮重新知折栁贈舊侣乘藍送此去嘉句多楓江接雲夢太常寺太祝不就職按鴻漸自太子文學徙王季則魚上水云北陸收寒盡東風解凍初氷消通淺溜氣變躍潛魚應節似知化楊鬐任所如浮沉非樂藻沿泝異傳書綴網時空久臨川意有餘為龍將可望今日愧才虛季則登元和進士第王公亮魚上水詩云春生寒氣減稍動久潛魚乍喜東風至來看曲岸初出氷朱鬛見望日錦鱗舒漸覺流澌近還欣掉尾餘噞喁情自樂沿泝意寧踈儻得隨鱗化終能上太虛公亮登正元進士第長慶初上兵書十八卷自司門郎中為商州刺史制云茂於學精於文文學之外有折毫刜鍾之用自佐戎律領郡符持憲為郎皆稱厥職命以為商州以爾精敏當自得中徐牧臨淵羡魚詩云清泚濯纓處今來喜一臨慙無下釣處空有羡魚心退省時頻改謀身嵗屢沉鬛成川上媚網就水寧深頳尾臨波裏朱鬚破浪潯此時儻不漏江上免行吟陳存穆陵路詩云西遊匣長劒日暮湘楚間歇馬上秋草逄人問故關孤村緑溏水曠野白雲山方念此中去何時此路還寓居武丁館云暑雨飄已過涼飈觸幽襟虛館無喧塵緑槐多晝隂俯視古苔積仰聆早蟬吟放卷一長想間門千里心送劉秀才南歸詩云鳥啼楊栁垂此别千萬里古路入商山春風生灞水停車落日在罷酒離人起蓬户寄龍沙送歸情詎已存大曆正元間詩人唐詩紀事卷第四十
