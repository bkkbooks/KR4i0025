body:
  text: 白居易韋式崔玄亮牛僧孺李紳沈傳師盧羣劉禹錫封孟紳陳潤白居易按樂天生於代宗大曆七年壬子十日正月二大和七年樂天尹河南元日對酒詩云今朝吳與洛相憶一欣然夢得君知否俱過本命年又詩云何事同生壬子歲老於崔相及劉郎序云余注云余與蘇州劉郎中同生子壬歲今年六十三退之生於大曆三年戊申微之生於德宗建中元年庚申卒於大和五年時年五十三少樂天八歲德宗正元十六年己卯中書舍人髙郢下及第第四人省試性習相近逺賦玉水記方流詩時年二十八樂天送侯權秀才序云正元十五年豫與侯生俱為宣城守所貢明年春豫中春官第啇隱銘云年二十傳云年二十七李六十七年庚辰試中書判拔萃補校書郎樂天泛渭賦序云右丞相髙公之掌貢舉也豫以鄉貢進士舉及第左丞相鄭公瑜珣之領選部也豫以書判拔萃選登科十九年天子並命二公對掌鈞軸塤薨二公入相是年齊抗罷崔憲宗元和元年丙戌四月以賢良方正對䇿乙等冬十二月尉盩厔為集賢校理賦長恨歌于盩厔是月召入翰林為學士遷左拾遺為拾遺元和二年樂天曲江感秋詩云元和二年秋我年三十七長慶二年秋我年五十一序云元和二年三年四年豫每歲有曲江感秋詩是時豫為左拾遺翰林學士賀雨詩元和三年冬作諷諭樂府詞元和四年作言分為五十首凡九千二百五十秦中吟等詩皆拾遺時拾遺歲滿當遷憲宗聽自擇官樂天請如薑公輔以學士兼京兆戶曹參軍以便親養詔可五年以母喪解還有渭上等詩洎效陶淵明詩十六首七年拜左贊善大夫居昭國里酬張十八訪宿云昔我為近臣君常稀到門今我官職冷唯君來往頻又寄元八云進入閣前拜退就廊下餐歸來昭國里人卧馬歇鞍却坐至日午起坐心浩然又十年贈杓直云已年四十四又為五品官蓋為贊善大夫首尾四年十年秋或言居昜母墮井死賦新井詩出為刺史王涯言其不可乃貶江州司馬相嫌其出位故也論盜殺武元衡事宰樂天東南行一百韻其間云博望移門籍潯陽佐郡符注云十年春微之移佐通州其年秋豫出佐潯陽十一年秋賦琵琶行時年四十五矣詩云行年四十五兩鬢半蒼蒼清瘦詩成癖麁豪酒放狂老來尤委命安處即為鄉或擬廬山下來春結草堂十二年裴度平淮西十三年冬移刺忠州三遊洞庭序云平淮西之明年冬豫自江州司馬授忠州刺史微之自通州司馬授號州長史又明年春各祗命之郡與知退偕行三月十一日參會於夷陵又賦詩云澧氷店頭春盡日年十送君馬上謫通川夷陵峽口明月夜此處逄君是偶然一别五年方見面相携三宿未回船是也十五年正月德宗崩穆宗立召為司馬員外郎是年寒食夜詩云四十九年身老日一百五夜月明天抱膝思量何事在癡男騃女喚鞦韆又初除尚書郎脫刺史緋詩云頭白喜拋黃草峽眼明驚拆紫泥書便留朱紱還銓閣却著青袍侍玉除是歲下峽自商山路還朝有商山路詩云萬里路長在六年身始歸所經多舊館太半主人非是六年矣自十年至明年除主客郎中知制誥元年長慶以詩贈王十一李七元九王舍人云紫垣曹局聮華地白鬢郎官老醜時莫怪不如君氣味此中來挍十年遲中人之薦入為時元微之亦以人舍是年除中書舍人有絲綸閣下文章靜等詩長慶二年七自月舍人丐外出守杭州謀趙國急丨樂時河北復丨亂乃丐外遷天論事不合次藍溪詩云既居可言地願助朝廷理伏閣三上章戇愚不稱旨聖人存大體優貸容不死鳯詔停舍人魚書除刺史長慶三年二月五日杭州花下作云二月五日花如雪五十二人頭似霜聞有酒時須笑樂不關身事莫思量長慶四年以太子左庶子分司東都宗崩恭宗立是歲正月穆三年為刺史無政在人口唯向郡城中題詩千餘首慙為甘棠詠豈有思人不三年為刺史飲氷復食蘖唯向天笁山取得兩片石此秪有千金無乃傷清白月三杭州則分司當在秋時作錢塘湖石記時猶在洛中詩云五年職翰林四年蒞潯陽一年巴郡守半年南宫郎二年直綸閣三年刺史堂凡此十五載有詩千餘章寶曆元年三月餘守蘇州是年七月有吳郡詩石記明年病免日前蘇州刺史曰白居易記是歲十二月華嚴經社石記云寶曆二年九月二十五文宗立恭帝崩樂天欲去郡有自詠五章其一云官舍非我廬官園非我樹洛中有小宅渭上有别墅既無婚嫁纍幸有歸休處歸去誠已遲猶勝不歸去又宿滎陽詩云生長在滎陽少小辭鄉曲迢迢四十載復到滎陽宿去時年十二今年五十六和元年也時文宗大文宗大和元年以祕書監召十月上旬誕聖之日樂天以祕書監與沙門義林道士楊洪元發問酬難是歲遷刑部侍郎微之於浙東就拜尚書樂天詩云我為憲部入南宫君作尚書鎮浙東老去一時成白首别來七度換春風是也二年歲暮詠懷云窮冬月末兩三日半百年過六七時龍尾趂朝無氣力牛頭參道有心期榮華外物終須悟老病傍人豈得知猶被妻兒教漸退莫求致仕且分司時二李黨事興樂天畏禍求退故詠懷云人間禍福愚難料世上風波老不禁萬一差池似前事又應追悔不抽簮二年春移病還東都是年夏得請為太子賔客分司是不出東吳矣見池上篇序自將至東都先寄令狐留守云東都添箇狂賔客先報壷觴風月知歸履道宅詩云往時多暫住今日是長歸裴相唱和甚多自是劉白令狐四年作自嘲詩云五十八翁方有後靜思堪喜亦堪嗟自後何處難忘酒不如來飲酒詩篇皆東都作也五年拜河南尹樂天詩云六十河南尹前途足可知老應無處避病不與人期是年六十矣七年復以賔客分司序洛詩云大和二年詔授刑部侍郎明年病免歸洛旋以賔客分司居二年就領河南尹事又三年病免歸履道里第再授賔客分司開成元年起為同州刺史不拜改太子少傅二年三月河南尹李待價禊於洛濵啓留守裴令公公召居易劉禹鍚等一十五人宴舟中樂天賦三月草萋萋黃鶯歇又啼之作四年賦病中詩序云開元已未嵗余蒲柳之年六十有八冬十月甲寅始得風痺之疾因成十五首題為病中詩且貽所知兼用自廣五年春盡獨吟云病共樂天相伴住春隨樊子一時歸崩武宗立是年文宗樂天妓樊素也善歌楊柳枝人多以曲名名之樂天病去之夢得詩云春盡絮飛留不得隨風好去落誰家辛酉會昌元年年七十以刑部尚書致仕逹哉樂天行云分司東都十三年七旬才滿冠已挂又香山寫真贊序云會昌二年罷太子少傅為白衣居士寫真香山寺藏經臺又初致仕贈留守牛丞相時年七十一則樂天七十致仕矣致仕詩云南北東西無所羈挂冠自在勝分司探花嘗酒多先到拜表行香盡不知炮笋烹魚飽飱後擁袍枕臂醉眠時報君一語君應笑兼亦無心羡保釐又醉中吟一生耽酒客五度棄官人刺史太子少傅皆以病免􅊨注云蘇州刑侍河南尹同州五年為東都九老會時年七十四六年八月薨東都贈右僕射時年七十五樂天寄王起李紳詩云云豫與山南王僕射淮南李僕射仕歷五朝年踰三紀海內年輩今唯三人故詩云故交海內只三人二坐嵓廊一卧雲時會昌六年也微之卒於大和六年明年崔元亮卒會昌二年劉夢得卒樂天之卒最後韋式樂天分司東洛朝賢悉會興化亭送别酒酣各請一字至七字詩以題為韻王起賦花詩云花點綴分葩露初裛月未斜一枝曲水千樹山家戲蝶未成夢嬌鶯語更誇既見東園成徑何殊西子同車漸覺風飄輕似雪能令醉者亂如麻李紳賦月詩云月光輝皎潔耀乾坤靜空闊圓滿中秋玩爭詩哲玉兔鏑難穿桂枝人共折萬象照乃無私瓊臺豈遮君謁抱琴對彈别鸖聲不得知音聲不切令狐楚賦山詩云山聳峻回環滄海上白雲間啇老深尋謝公逺攀古巖泉滴滴幽谷鳥關關樹島西連隴塞猿聲南徹荆蠻世人只向簮裾老芳草空餘麋鹿間元稹賦茶詩云茶香葉嫩芽慕詩客愛僧家碾雕白玉羅織紅紗銚煎黃蘂色琬轉麴塵花夜後邀陪明月晨前命對朝霞洗盡古今人不倦將知醉亂豈堪誇魏扶賦愁詩云愁逈野深秋生枕上起眉頭閨閣危坐風塵逺遊巴猿啼不住谷水咽還流送客泊船入浦思鄉望月登樓煙波早晚長羈旅絃管終年樂五侯韋式郎中賦竹詩云竹臨池似玉裛露靜和煙緑抱節寧改貞心自束渭曲偏種多王家看不足仙仗正驚龍化美實當隨鳯熟唯愁吹作别離聲回首駕驂舞陳速張籍司業賦花詩云花落早開賖對酒客興詩家能回遊騎每駐行車宛宛清風起茸茸麗日斜且願相留歡洽惟愁虛棄光華明年攀折知不逺對此誰能更嘆嗟范堯佐道士賦書字詩云書慿鴈寄魚出王屋入匡廬文生益智道著清虛葛洪一萬卷惠子五車餘銀鈎屈曲索靜題嬌司馬相如别後莫睽千里信數封緘送到間居居易賦詩字詩云詩綺美瓌竒明月夜落花時能助歡笑亦傷别離調清金石怨吟苦鬼神悲天下只應我愛世間惟有君知自從都尉别蘇句便到司空送白辭崔元亮元亮為散騎常侍後以太子賔客分司東都歸洛和樂天詩云病餘歸到洛陽頭拭目開眉見白侯鳯詔恐君今嵗去龍門欠我舊時遊遊龍門自到未幾人樽下酒歌詠數盞燈前共獻酬相對憶劉劉在逺寒宵耿耿夢長洲得身朝士忽為方外士主人仍是眼中人夢得詩云幾年侍從作朝臣却向青雲索元亮在洛與白樂天相從醉吟之樂曽有詩云共相呼喚醉歸來樂天答云居士忘筌默默坐先生枕麴昏昏睡早晚相從入醉鄉醉鄉此去無多地元亮字晦叔礠州人大和中為諌議大夫鄭注誣宋申鍚捕逮倉卒內外震駭元亮率諌官叩延英苦諌帝感悟由是名重朝廷頃之移疾歸東都召為虢州刺史卒元亮與元微之白樂天皆正元初同年生也元亮名最後自詠云人間不會雲間事應笑蓬萊最後仙後白刺杭州元為浙東廉使刺越而崔刺湖州白以詩戲之曰越國封疆吞碧海杭城樓閣入青天吳與卑小君應屈為是蓬萊最後仙三郡有唱和詩謂之三州唱和集樂天志元亮墓云公晚年師六祖以無相為心地易簀之夕大怖將至如入三昧恬然自安於遺疏之未手筆題云暫榮暫悴石敲火即空即色眼生花許時為客今歸去大曆元年是我家諸子中芻言罕言登進士第元微之酬歌舒少府寄同年科第云前年科第偏年少未解知羞最愛狂九陌爭馳好鞍馬八人同看綵衣裳注云同年科第宏詞吕二炅王十一起拔萃白二十二居易平判李十一復禮吕四頻歌舒大垣崔十一八元亮逮不肖八人皆奉榮養元亮在湖州寄三癖詩劉夢得言癖在詩與琴酒夢得和之并序云栁吳興亭臯隴首之句王融書之白團扇故夢得詩曰視事畫屏中自稱三癖翁管絃泛春渚旌斾拂晴虹酒對青山月琴韻白蘋風會書團扇上知君文字工牛僧孺樂天夢得有除夜詩僧孺和云惜歲歲今盡少年應不知凄涼數流輩歡喜見孫兒暗減一身力潛添蒲鬢絲莫愁花笑老花自幾多時元和三年宣政殿試賢良方正能直言極諌科一十人登科其後僧孺李宗閔王起賈餗四人皆相次拜相先是白居易在翰林為考校官後僧孺罷相出鎮楊州居易在洛中有詩送云北闕至東京風光十六程坐移丞相閣春入武陵城紅斾擁雙節白髮無一莖萬人開路看百吏立班迎閫外君彌重樽前我亦榮何須身自得將相是門生公始至京致琴書灞滻間先以所業謁韓文公皇甫員外二公披卷卷首有説樂一章未閲其詞遽曰且以拍板為什麼對曰樂句二公相顧大喜曰斯髙文必矣公因謀所居二公良久曰可於客戶坊稅一廟院公如所教二公復誨之曰某日可遊青就寺薄暮而歸二公其日聮鏕至彼因大書其門曰韓愈皇甫湜同謁幾官先輩不遇翌日輦轂名士咸往觀焉章竒之名由是赫然矣或云僧孺登第與同輩登政事堂宰相曰掃廳奉候樂天在香山時僧孺在廣陵有詩曰唯羡東都白居士年年香積問禪師樂天答云支許徒思遊白日夔龍未放下青天應須且為蒼生住猶去懸車十四年五十七時僧孺年樂天求筝於維揚僧孺先有詩曰但愁封寄去魔物或驚禪樂天云會教魔女弄不動是禪心樂天云思黯自誇前後服鍾乳三千兩而歌舞之妓甚多乃謔豫衰老故答思黯詩云鍾乳三千兩金叉十二行如他心似火欺我鬢如霜慰老資歌笑銷愁仰酒漿眼看狂不得狂得且須狂竒章又有詩云不是道公狂不得恨公逄我不教狂公赴舉之秋嘗投贄於劉補闕禹錫對客展卷飛筆塗竄其文歷二十餘歲劉轉汝州公鎮海南枉道駐旌信宿酒酣賦詩劉方悟往年改公文卷僧孺詩曰粉署為郎四十春今來名輩更無人休論世上升沉事且鬪樽前見在身珠玉會應成咳唾山川猶覺露精神莫嫌恃酒輕言語曽把文章謁後塵禹鍚和云昔年曽忝漢朝臣晚歲空餘老病身初見相如成賦日後為丞相掃門人追思往事咨嗟久幸喜清光笑語頻猶有當時舊冠劒待公三日拂埃塵牛公吟和詩前意稍解曰三日之事何敢當焉印可以升降百宰相三朝後主也司於是移宴竟夕方整前驅也劉乃戒其子咸及承雍曰吾成人之志豈料為非汝輩進修守中為上僧孺周秦行紀云余正元中舉進士落第歸宛葉間至伊闕南道鳴臯山下將宿大安民舍會暮不至更十餘里一道甚異夜月始出忽聞有異香因而進行不知猒逺見火明意為莊家更驅至一宅庭門若富家有黃衣人曰郎君何氏何至余曰僧孺姓牛應進士落第往大安民舍誤道來此黃衣入告少時出曰請郎君入拜殿下簾下語曰妾漢文帝母薄太后此是妾廟太后遣軸簾使上殿召坐食頃太后命髙祖戚夫人元帝王嬙余皆拜乃亦就坐太后迎唐朝太真楊妃齊潘妃余拜既命饌太后問曰今天子誰余對曰今皇帝名適代宗長子太后曰沈婆兒作天子也大竒命酒各賦詩余應教作詩曰香風引上大羅天月地花宫拜洞仙具道人間惆悵事不知今夕是何年太后曰秀才逺來今日誰伴戚夫人先起辭曰如意成長潘妃曰東昏侯誓不負他緑珠曰石衛尉嚴忌太后曰太真今朝先帝貴妃重言其他太后目王昭君昭君不對低眉羞恨俄歸休餘為左右送入昭君院旦侍人告起太后戚夫人昭君等皆泣别使朱衣人送至大安民里余衣上香經十餘年不歇云云李紳紳初以古風求知於吕溫溫見齊煦誦其憫農詩曰春種一粒粟秋收萬顆子四海無間田農夫猶餓死鋤禾日當午汗滴禾下土誰知盤中飱粒粒皆辛苦又曰此人必為卿相果如其言奉酬樂天立秋日有懷見寄云深夜星漢靜秋風初報涼篁階浙瀝響露葉參差光氷免半升魄銅壷微滴長薄帷乍飄卷襟帶輕搖揚北除魂夢清斜月滿軒房屣履步前楹劒戟森在行重城霄正分號鼓牙相望獨坐有所思夫君鸞鳯章天津落星河一葦安可航龍泉白玉首魚服黃金裝報國未知效維鵜徒在梁徘徊顧戎旃皓氣生東方衰葉滿欄草班毛盈鏡霜羸牛未脫轅老馬強騰驤吟君白雪唱慙愧巴人腸樂天贈紳詩云一篇長恨有風情十首秦吟近正聲剛被老元偷格律苦教短李復歌行注云元九往江陵余以詩一軸贈行自是格變李二十嘗自負歌行近見余樂府五十首默然心伏樂天藏書東都聖善寺號白氏文集紳有詩以美之云寄玉蓮花藏緘珠貝葉扃院間容客讀講倦許僧聽部列雕金榜題名刻石銘永添鴻寶集莫雜小乘經紳字公垂中書令敬玄曽孫號短李穆宗召為翰林學士與李德裕元稹同時號三俊武宗時為相居位四年出鎮南卒紳江南暮春寄家云洛陽城見迎梅雪魚口橋逄送雪梅劒外寺前芳草合鏡湖亭上野花開江鴻斷續翻雲去海燕差池拂水回料得心知近寒食潛聼喜鵲望歸來開成間紳集其詩為追昔遊蓋嘆逝感時發於悽恨而作也或長句或五言或雜言或歌或吟或樂府齊梁不一其辭乃由牽思所屬爾赴梁漢歸諌垣升翰苑感恩遇歌帝京風物遭讒邪播越歷荆楚涉湘沅逾嶺嶠抵荒陬止髙安移九江泛五湖過鍾陵沂荆江守滁陽轉壽春改賔客留洛陽歷會稽過梅里遭讒邪再為賔客分務歸東周擢川守鎮大梁詞有所懷興生於怨故或隱或顯不常其言兾知音於異而已南梁行云江城欎欎春草長悠悠漢水浮清光雜英飛盡空晝景緑楊重隂官舍靜此時醉客縱橫書公言可薦承明廬崔公奏觀察判官蒙以書見委常元和十四年蒙故山南節度僕射速戲拙青天詔下寵光至頒籍金閨徴石渠蒙恩除左是歲五月遺拾秭歸山路煙嵐隔山朩幽深晚花拆澗底紅光奪火燃搖風扇毒愁行客花明艷而與杜鵑花相雜樵駱谷中多毒朩名山琵琶其草朩殺人者識之言內杜鵑啼咽花亦殷聲悲絶艷連空山斜陽瞥影淺深朩雲雨翻迷嵓谷間山雞錦質矜毛羽透出穿蘿命儔侣喬朩幽溪上下同雄雌不惑飛摟處望秦峯逈過商顔浪疊波堆萬族山行盡杳冥青嶂外九重鍾漏紫霄間元和列侍明光殿諌草初焚市朝變北闕趍臣半隙塵南梁吟嘯皆飛霰追思感歎却昏迷霜鬢愁吟到曉雞故篋歲深開斷簡秋堂月曉掩遺袿嗚嗚曉角霞輝粲撫劒長楹一長歎芻狗無由學聖賢空持感激終昏旦憶春日太液池東亭候對云宫鶯曉報瑞煙開三島靈禽拂水回橋轉綵虹當綺殿檻浮花鷁近蓬萊草承步輦王孫長桃艷仙顔阿母栽簮筆此時方侍從却思金馬笑鄒枚憶夜直金鑾奉詔承旨詩云月當銀漢玉繩低深聼簫韶碧落齊門壓紫垣髙綺樹閣連青鎖近丹梯墨宣外渥催飛詔草定新恩促換題明日獨歸花路近可憐人世隔雲泥過荆門詩云荆江水闊煙波轉荆門路逺山蔥倩帆勢侵雲滅又明山程背日昏還見青青麥壠啼飛鴉寂寞野徑棠梨花行行驅馬萬里逺漸入煙嵐危棧賖林中有鳥飛幽谷月上千嵓一聲哭腸斷思歸不可聞人言恨魄來巴蜀我聽此鳥祝我魂之死莫學聲銜冤縱馬羽族莫棲息直上青雲呼帝閽此時山月如銜鏡嵓樹參差互輝映皎潔深看入澗泉分明細見樵人徑隂森鬼廟當郵亭雞豚日宰聞膻腥愚夫禍福自迷惑魍魎憑何通百靈日低山晚問行客已酹椒漿拜荒陌惆悵忠直徒自持誰登山頭望夫石涉沅湘詩云屈原死處瀟湘隂滄浪渺渺雲沉沉蛟龍長怒虎長嘯山水翛翛波浪深煙橫日落驚鴻起山映雲霞渺千里鴻呌離離入莫天霞消漠漠深雲水水虛江暗揚波濤黿鼉動蕩風騷騷行人愁望待明月星漢沉浮魅鬼號屈原爾為懷忠沒水府通天化靈物何不驅雷擊電除姦邪空作沈泉抱冤骨舉杯瀝酒召爾魂月影滉漾開乾坤波白水黑山隱見汨羅之上遙昏昏風帆候晚看五兩戍鼓鼕鼕逺山響潮滿江津猿鳥啼荆夫楚語飛蠻槳瀟湘弔浦無人居風驚水暗惟鮫魚行來擊棹獨長歎問爾精魂何所如悲善才詩余守郡日有客遊者善彈琵琶聞其所傳乃善才所授頃在內庭日别承恩顧賜宴曲江勑善才等二十人備樂自余經播遷善才巳沒因追感前事為悲善才穆王夜幸蓬池曲金鑾殿門髙秉燭東頭弟子曹善才琵琶請奏新翻曲翠娥列坐層城女笙歌參差齊笑語天顔靜聽朱絃彈衆樂寂然無敢舉銜花金鳯當承撥轉腕攏絃促揮霍抹花翻鳯天上來徘徊滿殿飛春雪抽絃度曲新聲發金鈴玉佩相瑳切流鶯子母飛上林仙鸖雌雄唳明月此時奉詔侍金鑾别殿承恩許占看三月曲江春草緑九霄天樂下雲端紫髯供奉前屈膝盡彈妙曲當春日寒泉注射隴水開胡鴈翻飛朔天沒日曛塵暗車馬散為惜新聲有餘歎明年冠劒閉橋山萬里孤臣投海畔籠禽鎩翮尚回飛白首生從五嶺歸聞道善才成朽骨空餘弟子奉宣徽南譙寂寞三春晚有客彈絃獨悽怨靜聼深奏楚月光憶惜初聞曲江宴心悲不覺淚闌干更為調絃反復彈秋吹動搖神女佩月珠敲擊水精盤自憐淮海同泥滓恨魄凝心未能死惆悵追懷萬事空誰聞感慨徒為爾憶過潤州時元和二年余以進士為鎮海軍書奏從事秋七月兵亂余以不從書奏飛檄之詐遭庶人李暴怒腰領不殊者再三後軍平尚書李公欲具事以聞余以本乃誓節非欲求榮罷所奏詩云昔年從宦干戈地黃綬青春一魯儒弓犯控絃招武族劒當抽匣問狂夫帛書投筆封魚腹元髮衝冠捋虎鬚談笑謝金何所貴不為偷買用兵符元微之和樂天東南行云李多嘲蝘蜓竇數集蜘蛛注云李二十多詠物之作竇七頗改官銜屢有蜘蛛之喜樂天詩曰悶勸迃辛酒間吟短李詩迃辛辛丘度也丘度之子一日自云辛氏子來見紳曰小子每憶白二十二丈詩悶勸疇昔酒間吟二十丈詩紳笑曰辛大有此狂兒吾敢不存舊沈傳師子詢傳師次潭州酬唐侍御姚員外遊道林嶽麓寺題示云承明年老輒自論訖得湘守東南奔為聞楚國富山水青嶂邐迤僧家園含香珥筆皆眷舊謙抑自忘臺省尊不令執簡候亭館直許携手遊山樊忽驚列岫曉來逼朔雪洗盡煙嵐昏碧波回嶼三山轉丹檻繚郭干艘屯華鏕躞蹀絢沙步大斾綵錯輝松門樛枝競鶩龍蛇勢折幹不滅風霆痕相重古殿倚嵓腹别引新徑縈雲根目傷平楚虞帝魂情多思逺聊開樽危絃細管逐歌飄盡鼓繡靴隨節翻鏘金七言凌老杜入朩八法蟠髙軒嗟余潦倒久不知忍復感激諭元元傳師字子言既濟之子材行有餘權德輿門生七十人推為顔子終吏侍子詢字誠之亦能文咸通中為昭義節度使詢清粹端美神仙中人也制除山北節旄京城咸誦曹唐遊仙詩贈之云玉詔新除沈侍郎便分茅土領東方不知今夜逰何處侍從皆騎白鳯凰李德裕觀察浙西有招隱山觀玉蘂花詩云玉蘂天中樹金閨昔共窺落英間舞雪密葉作低帷大夫所內署沈集庭砌大夫草詔之暇常邀余同玩居閣前有此花落空巾回旋久之方舊賞煙霄逺前歡歲月移今來想顔色還似憶瓊枝傳師和云曽對金鑾直同依玉樹隂雪英飛舞近煙葉動搖深素蕚年年密衰容日日侵勞君想華髮僅欲不勝簮盧羣唐淮西節度使吳少誠不奉詔令羣使蔡州詰之羣諭以君臣之分忠順之義少誠乃從命羣又與唱和賦詩自言以反側常蒙隔在恩外羣於筵中醉而歌曰祥瑞不在鳯凰麒麟太平須得邊將忠臣衛霍真誠奉主貔虎十萬一身江河潛注息浪蠻貊欵塞無塵但得百寮師長肝膽不用三軍羅綺金銀少誠大悅羣以奉使稱旨遷祕書監羣字載初范陽人終於義成軍節度使劉禹鍚三鄉驛伏覩明皇望女几山詩斐然有感云開元天子萬事足惟惜當時光景促三鄉陌上望仙山歸作霓裳羽衣曲仙花從此在瑶池三清八景相追隨天上忽乘白雲去世間惟有秋風辭長慶中元微之夢得韋楚客同會樂天舍論南朝興廢各賦金陵懷古詩劉滿引一杯飲已即成曰王濬樓船下益州金陵王氣黯然收千尋鐵鎖沉江底一片降幡出石頭人世幾回傷往事山形依舊枕江流而今四海為家日故壘蕭蕭蘆荻秋白公覽詩曰四人探驪龍子先獲珠所餘鱗瓜何用耶於是罷唱詩弔張曲江曰聖言貴忠恕至道重觀身法在何所恨色傷斯為仇良時難久恃隂謫豈無因寂寞韶陽廟魂歸不見人元和十年自朗州召至京戲贈看花君子云紫陌紅塵拂面來無人不道看花回元都觀裏桃千樹盡是劉郎去後栽再遊元都觀絶句并序云余正元二十一年為屯田員外郎時此觀未有花是歲出牧連州貶朗州司馬居十年召至京師人人皆言有道士手植仙桃滿觀如紅霞遂有前篇以志一時之事旋又出牧今十有四年復為主客郎中重遊元都蕩然無復一樹唯兔葵燕麥動搖春風耳因再題二十八字以俟後遊時大和二年三月也詩云百畝庭中半是苔桃花落盡菜花開種桃道士歸何處前度劉郎今獨來禹錫嘗對賔友每吟張博士籍詩云新酒欲開期好客衣冠暫脫見間身對花朩則吟王右丞詩云興闌啼鳥換坐久落花多白二十二好余秋水詠云東屯滄海闊南瀼洞庭寬余自知不及韋蘇州春潮帶雨晚來急野渡無人舟自橫嘗過洞庭雖為一篇思杜員外落句云年去年來洞庭上白蘋愁殺白頭人鄙夫之言有愧於杜公也楊茂卿校書過華山詩曰河勢崑崙逺山形􅔽蓞秋此實為佳句贈歌人米嘉榮詩云唱得梁州意外聲舊人唯有米嘉榮近來年少輕前輩好染髭鬚事後生禹錫赴吳臺楊州大司馬杜公鴻漸開宴命妓侍酒禹錫詩曰髙髻雲鬟宫樣粧春風一曲杜韋娘司空見慣渾間事斷盡蘇州刺史腸白樂天任杭州刺史携數妓還洛陽後却還錢塘故禹鍚戲答云其那錢塘蘇小小憶君淚黯石榴裙沈存中曰禹鍚霓裳羽衣曲云三鄉陌上望仙山歸作霓裳羽衣曲又王建詩云聽風聽雨作霓裳樂天詩注云開元中西涼府節度使楊敬述造鄭愚津陽門詩注云葉法善嘗引上入月宫聞仙樂及上歸但記其半遂於笛中寫之會西涼府都督楊敬述進婆羅門曲與其聲調相符遂以月中新聞為散序用敬述所進為其腔而名霓裳羽衣曲説各不同今蒲州逍遙樓楣上有唐人橫書類梵字相傳是霓裳譜字訓不通莫知是非或謂今燕部有獻仙音曲乃其遺聲然霓裳本謂之道調法曲今獻仙音乃小石調耳未知孰是山圍故國周遭在潮打空城寂寞回淮水東邊舊時月夜深還過女墻來樂天掉頭苦今嘆賞良久曰石頭詩云潮打空城寂寞回吾知後之詩人不復措辭矣題自敘云禹錫金陵五禹鍚與樂天唱和號劉白唱和集與裴度唱和號汝洛集與令狐楚唱和號彭陽唱和集與李德裕唱和號吳蜀集禹鍚字夢得附叔文擢度支員外郎人不敢斥其名號二王劉栁憲宗立禹錫貶連州未至斥朗州司馬作竹枝詞武元衡初不為宗元所喜自中丞下除右庶子及是執政禹鍚久落魄乃作問大鈞謫九年等賦又敘張九齡事為詩欲感諷權久之召還宰相欲任南省郎乃作元都觀看花君子詩當路不喜由為播州易連州徙夔州由和州刺史入為主客郎中復作遊元都觀詩有兔葵燕麥之語聞者益薄其行俄分司東都裴度薦為集賢學士度罷出刺蘇州徙汝同二州會昌時檢校禮部尚書卒禹鍚晚年與白傳友善詩筆文章時無在其右者常與禹錫唱和往來因集其詩而序之曰彭城劉夢得詩豪者也其鋒森然少敢當者豫不量力往往犯之夫合應者聲同交爭者力敵一往一復欲罷不能由是每制一篇先於視草視竟則興作興作則文成一二年來日尋筆研同和贈答不覺滋多大和三年春已前紙墨所存者凡一百三十八首其餘乘興仗醉率然口號者不在此數因而命小姪龜兒編勒成兩軸仍寫二本一付龜兒一授夢得小男崑郎各令收藏附兩家文集豫頃與元微之唱和頗多或在人口嘗戲微之云僕與足下二十年來為文友詩敵幸也亦不幸也吟詠情性播揚名聲其適遺形其樂忘老幸也然江南士女語才子者多云元白以子之故僕不得獨步於吳越間此亦不幸也今垂老復遇夢得非重不幸耶夢得文之神妙莫先於詩若妙與神則吾豈敢如夢得雪裏髙山頭白早海中仙果子生遲沉舟側畔千帆過病樹前頭萬朩春之句類真謂神妙矣在在處處應有靈物護持豈兩家子弟祕藏而已其為名流許與如此故國思如此若為天外心公句寄白湖上收宿雨句故人日已逺窗下塵滿琴坐對一樽酒恨多無力斟幕踈螢色逈露重月華深萬境與羣䕀此時情豈任題無禪思何妨在玉琴真僧不見聽時心秋堂境寂夜方半雲去蒼梧湘水深聼琴右張為取作主客圖夢得曰栁八駮韓十八平淮西碑文左餐右粥何如我平淮西雅云仰父俯子韓碑兼有帽子使我為之便説用兵伐叛矣夢得曰韓碑桞雅余詩為云城中晨雞喔喔鳴城中鼓角聲和平美訴之入蔡城也須臾之間賊無覺者又落句云始於元和十二載四海重見升平時以見平淮之年云禹鍚敘董侹文集云詩其文章之藴耶義得而言喪故微而難能境生於象外故精而寡和千里之謬不容秋毫非有的然之姿可使戶曉必俟知者然後鼓行於時自建安距永明以還詞人比肩唱和相發有以朔風零雨髙視天下雖蟬噪鳥鳴蔚在史䇿國朝因之粲然復興由篇章以躋貴仕者相踵而起封孟紳行不由徑詩云欲速意何成康莊欲砥平天衢皆利往吾道泰方行不復由莖徑無由見蔣生三條遵廣逹九軌尚安貞紫陌悠悠去芳塵步步清淡臺千載後公正有遺名孟紳正元十五年髙郢下進士第一人終於太常卿陳潤賦得浦外虹云日影化為虹彎彎出浦東一條微雨後五色片雲中輪勢隨天度橋形跨海通還將飲水處持送使車雄送駱徴君云野人膺辟命溪上掩柴扉黃卷猶將去青山豈更歸馬留苔蘚迹人脫薜蘿衣他日相思處天邊望少微東都所居寒食下作云江南寒食早二月杜鵑鳴日暖山初緑春寒雨欲晴浴蠶看社日改火待清明更喜瓜田好令人憶邵平賦得秋河曙耿耿云曉望秋髙夜微明欲曙河橋成鵲已去機罷女應過月上殊開練雲行類動波尋源不可到耿耿復如何潤大歷間人終坊州鄜城縣令樂天之外祖也大夫不感恩感恩寧有淚心頭感恩血一滴染天地右張為取作主客圖唐詩紀事卷第三十九
