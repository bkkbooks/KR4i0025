front:
  text: 唐詩紀事卷第十二
  hash: sha256:9e9ab322d0730fad4de05923ec7508ea1f45eeee6dbdfd036abe2ba8260ce4b5
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_012-1a}
body:
  text: 畢乾泰辛替否王景韋安石竇希玠李咸陸景初鄭南金于經野解琬麴瞻樊忱孫佺李從遠周利用楊廉張景源李恆應制羣臣巳上景龍畢乾泰慈恩寺九日應制云鸚林花塔啓鳯輦順時遊重九昭皇慶大千揚帝休耆闍妙法闡王舍睿文流至德覃無極小臣歌詎酬辛替否慈恩寺九日應制云洪慈均動植至德俯深玄出豫從𥘉地登髙適𣑽天白雲飛御藻慧日暖皇編别有秋原藿長傾雨露緣替否字協時京兆人景龍中為左拾遺以直諫遷右臺殿中侍御史為憲司彈擊不避強禦纍遷頴王府長史卒王景慈恩寺九日應制云玉輦移中禁珠梯覽四禪重階清漢接飛竇紫霄懸綴葉披天藻吹花飲御筵無因鑾蹕暇俱舞鸖林前􅊨景太原人為司門貟外郎萊州刺史子之咸為長安尉昆弟之賁之渙皆善屬文之咸之子緯有傳韋安石九日侍宴應制云重九開秋節得一動宸儀金風飄菊蘂玉露泫茰枝睿覽八紘外天文七曜披臨深應在即居髙豈慮危字得枝安石京兆人久視中為相二張三思橫寵安石數析辱之復相中宗不附太平公主睿宗時為薑晦所劾貶黜發憤卒竇希玠九日應制云鑾輿巡上苑鳳駕瞰層城御座丹烏麗宸居白鸖驚玉旗縈桂葉金杯泛菊英九晨陪聖膳萬歲奉承明字得明八月中宗令學士尋勝同宴於禮部尚書竇希玠林亭張説製序云召絲竹於伶官借池亭於貴族雕俎在席金羈駐門逺山片雲隔層城而即興繁鶯芳樹繞髙臺而共樂夏日帝幸五王第乃過希玠宅劉憲詩云北斗樞機任西京肺腑親李乂詩云貴遊開北第宸眷幸西鄉按希玠武德時內史令威之後中宗時為禮書以恩澤賜實封開元為太子少傅世為外戚唐世貴盛莫與為此李咸九日應制云重陽乘令序四野開晴色日月數𥘉并乾坤聖登極菊黃迎酒泛松翠凌霜直遊海難為深負山徒倦力字得直陸𥘉景九日應制云九秋灮順豫重節霽良辰登髙識漢苑問道侍軒臣菊花浮秬鬯茰房插縉紳聖化謐邊垂長洲鴻鴈濵字得臣景初元𥘉之子恬靜寡欲議論髙簡景雲中與崔湜同知政事睿宗曰子能召先業是謂象賢乃賜名象先鄭南金九日應制云重陽玉律應萬乘金輿出風起韻虞絃雲開吐堯日菊花浮聖酒茱香挂衰質欲知恩煦多順動觀秋實字得日于經野九日應制云御氣三秋節登髙九曲門桂筵羅玉爼菊體溢芳樽遵渚歸鴻度承雲舞鶴騫微臣濫陪賞空荷聖明恩字得樽經野中宗時為戶部尚書中宗九日登髙應制二十四人韋安石蘇瓌詩先于成經野及盧懷慎詩後成時景龍三年也解琬慈恩寺九日登塔應制云瑞塔臨𥘉地金輿幸上坊空邊有清淨覺處無馨香雨霽微塵斂風秋定水涼兹辰採仙菊薦夀慶重陽晦日宴髙氏林亭云主第簪裾出王畿春照華山亭一巳眺城闕帶煙霞橫堤列錦帳傍浦駐香車歡娛屬晦節酩酊未還家琬魏州元城人與郭元振善習邊事守邊積二十年開元中終同州刺史麴瞻慈恩寺九日應制云扈蹕遊玄地陪仙瞰紫微似邁銖衣劫將同羽化飛雕戈秋日麗寶劒曉霜霏獻觴乘菊序長願奉天暉樊忱慈恩寺九日應制云淨境重陽節仙逰萬乘來插茰登鷲嶺把菊坐蜂臺十地祥煙合三天瑞景開秋風詞更逺竊抃樂康哉孫佺慈恩寺九日應制云應節茰香滿𥘉寒菊浦新龍旗煥辰極鳯駕儼香闉蓮井偏疑夏梅梁更若春一欣陪應塔還似得天身佺麟德宰相處約之子延和初為幽州都督為奚所敗同周以弟見獲送默啜所殺之佺不知兵始裴懷古為都督馭士有方朝廷以佺代之遂及敗李從逺慈恩寺九日應制云九月從時豫三乘為法開中霄日天子半座寶如來摘果珠盤獻攀茰玉輦回願將塵露點遙奉光明臺周利用慈恩寺九日應制云出輿乘金節飛文煥日宫茰房開聖酒杏苑被玄功塔向三天逈禪收八解空叨恩奉蘭籍終愧洽薰風金城公主和蕃中宗送至馬嵬群臣賦詩帝令御史大夫鄭惟忠及利用護送入蕃學士賦詩以餞徐彥伯為之序云楊廉九日侍宴應制云逺目瞰秦埛重陽坐灞亭既開黃菊酒還降紫微星簫鼓諳仙曲山河入畫屏幸兹陪宴喜無以效丹青字得亭慈恩寺九日應制云萬乘臨真境重陽眺逺空慈雲浮鴈塔定水映龍宫寶鐸含飈響仙輪帶日紅天文將瑞色輝煥滿寰中沈佺期酬楊給事中廉見贈臺中詩云子雲惟辨博公理擅詞雄始自尚書省旋聞給事中言從溫室祕籍向鎖闈通張景源慈恩寺九日應制云飛塔凌霄起宸遊一屆焉金壺新泛菊寶座即披蓮就日搖香輦慿雲出𣑽天祥氛與佳色相伴雜爐煙李恆慈恩寺九日應制云寶地鄰丹掖香臺瞰碧雲關山江水出城闕樹中分睿藻蘭英秀仙杯菊蘂薰願將今日樂長奉聖明君唐詩紀事卷第十二
