front:
  text: 唐詩紀事卷第七十九
  hash: sha256:937a33ae21804ec9ca857b3d6f84018b1eb2ba8614e7e48c1cf185b14bb715d4
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_079-1a}
body:
  text: 張夫人崔仲容女郎張琰女郎崔公逹女郎宋若昭女郎宋若荀女郎田娥女郎劉雲薛濤女郎葛鴉兒女郎張文姫鮑君徽女郎張窈窕倡妓常皓女郎蔣藴女郎劉媛廉氏彭伉妻程長文尼海印孫氏鶯鶯非烟徐月英張夫人侍郎妻吉中孚拜新月云拜新月拜月出堂前暗魄深籠桂虛弓未引絃拜新月拜月粧樓上鸞鏡未安臺蛾眉已相向拜新月拜月不勝情庭前風露清月臨人自老望月更長生東家阿母亦拜月一拜一悲聲斷絶昔年拜月逞容儀如今拜月雙泪垂回看衆女拜新月却憶紅閨年少時崔仲容贈所思云所居幸接鄰相見不相親一似雲間月何殊鏡裏人丹誠空有恨腸斷不經春願作梁間燕無由變此身戲贈云暫到崑崘未得歸阮郎何事教人非如今身佩上清籙莫遣落花占羽衣贈歌妓云水剪雙眸霧剪衣當筵一曲媚春輝瀟湘夜色怨猶在巫峽曉雲愁不稀皓齒乍分寒玉細黛眉輕蹙逺山微渭陽朝雨休重唱滿眼陽關客未歸女郎張琰春詞云垂柳鳴黃鸝間關若求友春晴不可耐愁殺閨中婦日暮登髙樓誰憐小垂手昨日桃花飛今日梨花吐春色能幾時那堪正愁緒蕩子遊不歸春來淚如雨女郎崔公逹獨夜詞云晴天霜落寒風急錦帳羅幃羞更入􅌙箏不復斷續絃回身掩淚挑燈立女郎宋若昭和御製麟德殿宴百僚云垂衣臨八極肅穆四門通自是無為化非關輔弼功修文招隱伏尚武殄妖凶德炳韶光熾恩沾雨露濃衣冠陪御宴禮樂盛朝宗萬壽稱觴舉千官信一同若昭貝州人父廷芬生五女皆警慧善屬文長若華次若昭若倫若憲若荀若昭文尤髙皆性素潔鄙薰澤靚粧不願歸人欲以學名家家亦不欲與寒鄉凡裔為姻對貞元中若義節度使李抱真表其才德宗召入禁中試文章并問經史大義帝咨美悉留宫中帝能詩每與侍臣賡和五人者皆預又髙其風操不以妾侍命之呼學士自貞元七年祕禁圖籍詔若華總領元和末卒後穆宗拜若昭尚官嗣其秩歷穆恭文三朝皆呼先生若憲文宗時以讒死倫荀早卒廷芬男獨愚不可教為民終身女郎宋若荀和御製麟德殿宴百僚云端拱承休命時清荷聖皇四聰聞受諌五服逺朝王景媚鶯初囀春殘日更長命筵多濟濟盛樂復鏘鏘鄷鎬誰將敵潢汾未可方願齊山嶽壽祉福永無疆女郎田娥寄逺云憶昨㑹詩酒終日相逢迎今來成故事歲月令人驚泪流紅粉薄風度羅衣輕難為子猷忘虛負文君名女郎劉雲有所思云朝亦有所思暮亦有所思登樓望君處靄靄蕭關道掩淚向浮雲誰知妾懷抱玉井蒼苔春院深桐花落盡無人掃薛濤罰赴邊有懷上韋相公云聞道邊城苦而今到始知却將門下曲唱與隴頭兒元微之贈濤詩因寄舊詩與之云詩篇調態人皆有細膩風光我獨知月夜詠花憐暗淡雨朝題柳為欹垂長教碧玉藏深處總向紅箋寫自隨老大不能收拾得與君開似教男兒濤好製小詩惜其幅大狹小之蜀中號薛濤箋或兒營妓無校書之號韋南康欲奏之而罷後遂呼之胡曽詩曰萬里樓臺女校書琵琶花下閉門居掃眉才子知多少管領春風總不如進士楊藴中下成都獄夢一婦人曰吾薛也贈詩云玉漏深長燈耿耿東墻西墻時見影月明窗外子規啼忍使孤魂愁夜永女郎葛鴉兒懷良人云蓬鬢荆叉世所稀布裙猶是嫁時衣胡麻好種無人種正是歸時不見歸有之未知孰是河北士人間亦女郎張文姬溪口雲云一片溪口雲才向溪中吐不復歸溪中還作溪中雨沙上鷺云沙頭一水禽鼓翼揚清音只待高風使非無雲漢心鮑君徽間宵對月茶宴云間朝向晚出簾櫳茗宴高亭四望通逺眺城池山色裏俯聆絃管水聲中幽篁映沼新抽翠芳桂低簷砍吹紅㘴久此中無限興更憐團扇起清風女郎張窈窕寄故人云淡淡春風花落時不堪愁望更相思無金可買長門賦有恨空吟團扇時窈窕居於蜀當時詩人雅相推重有上城都在事詩曰昨日賣衣裳今日賣衣裳衣裳渾賣盡羞見嫁時箱有賣愁仍緩無時心轉傷故園有虜隔何處事蠶桑倡妓常浩贈盧夫人云佳人借顔色恐逐芳菲歇日暮作畫堂下階見新月拜月仍有詞傍人那得知歸取玉臺下始覺泪㾗垂女郎蔣藴之孫彥輔一作馧贈鄭女郎古意云昨夜巫山中失却陽臺女朝來香閣裏獨伴楚王語艷陽灼灼河洛神珠簾繡户清樓春能彈箜篌弄纎指愁殺門外少年子笑開一靣紅粉粧東園幾處桃花死朝理曲暮理曲獨㘴窗前一片玉行也嬌㘴也嬌見之令人魂魄銷堂前錦褥紅地爐緑沉香榼傾屠蘇解佩時時歇歌管芙蓉帳裏蘭麝滿晚起羅衣香不斷滅燭每嫌秋夜短女郎劉媛長門怨云雨梧桐秋夜長愁心和雨到昭陽泪㾗不學君恩斷拭却千行更萬行又云學畫娥眉獨出群當時人道便承恩經年不見君王靣花落黃昏空掩門女郎廉氏峽中即事云清秋三峽此中去鳴鳥孤猿不可聞一道水聲多亂石四時天色少晴雲日暮泛舟溪溆口那堪夜永思氛氲彭伉妻彭伉評事冝陽微君之孫及第後西廉使于公辟入幕歲久未回妻張氏寄二絶其一云久無音信到羅幃路逺迢迢遣問誰問君折得東堂桂折罷那能不暫歸其二云驛使今朝過五湖殷勤為我報狂夫從來誇有龍泉劍試割相思得斷無彭伉始以詩寄之曰莫訝相如獻賦遲錦書誰道泪沾衣不須化作山頭石待我東堂桂折枝程長文書情上使君云妾家今住鄱陽曲一片堅心比孤竹當年二八盛容儀紅箋草隸恰如飛盡日間窗刺繡㘴有時極浦採蓮歸誰道居貧守都邑幽居寂寞無人入海燕朝歸枕席寒山花夜落階墀濕強暴之男何所為手持白刃向簾幃一命任從刀下死千金豈受暗中欺我心匪石情難轉志奪秋霜意不移血濺羅衣終不恨瘡粘錦繡亦何辭縣僚曽未知情緒即便教人縶囹圄朱脣滴瀝獨銜冤玉筯䦨干歎非所十月寒更堪思人一聞擊拆一傷神高髻不梳雲已散蛾眉罷掃月仍新三尺嚴章難可越百年心事向誰說但看洗雪出圜扉始信白玉無㸃缺尼海印蜀悲光寺尼海印唐末人才思清峻有舟夜一章云水色連天色風聲益浪聲旅人歸思苦漁叟夢魂驚舉棹雲先到移舟月逐行旋吟詩句罷猶見逺山橫孫氏進士孟昌期之妻也代夫作白臘燭詩贈人云景勝銀缸香比蘭一條白玉逼人寒他時紫禁春風夜醉草天書仔細看又琴詩云玉指朱絃軋復清湘妃愁怨最難聽初疑颯颯涼風徑又似蕭蕭暮雨零近若流泉來碧嶂逺如玄鶴下青冥夜深彈罷堪倜悵霧濕叢蘭月滿庭謝人送酒云謝將清酒寄愁人澄徹甘香氣味真好是緑窗風月夜一杯搖蕩滿懷春三詩皆代夫之作一旦曰才思非婦人之事也併焚其集鶯鶯鶯鶯姓崔氏有張生者託其婢紅娘以春詞二篇誘之崔答曰待月西廂下迎風户半開拂墻花影動疑是故人來張喜其意既遇而别崔命瑟鼓霓裳羽衣之曲張文戰不利崔貽書以廣其意又有竹茶碾亂絲之贈曰泪㾗在竹愁緒縈絲因物逹情永以為好楊巨源元稹善張生見其書歎賞之巨源賦崔娘一篇云清閠潘郎玉不如中庭蕙草雪鋪初風流才子多春思腸斷蕭娘一劄書元稹亦續生㑹真詩三十韻張後以為妖於身也絶之既而䌊其所居崔潜寄一詩云自從消瘦减容光萬轉千回懶下床不為傍人羞不起因郎憔悴却羞郎張將行賦一章以絶之云棄置今何道當時且自親還將舊來意憐取眼前人自是遂絶非烟臨淮武公葉任河南參軍有愛妾非烟姓步氏善文章工擊甌北鄰有趙子以詩誘之曰一覩傾城貌塵心只自猜不隨簫史厺擬學阿蘭來非烟答曰緑慘嬌娥不自持只緣憂恨在新詩郎心應似琴心怨脉脉春情更付誰趙又曰珍重佳人惠好音綵箋花翰兩情深薄於蟬翼誰供眼密似蠅頭未寫心疑是落花還碧洞又思輕雨滿幽襟百回消息千回夢裁作長謡寄緑琴非烟偶病旬日方答之云無力嚴粧倚繡櫳聊題蟬錦思無窮香囊贈趙以連蟬錦近來羸得傷春病柳弱花欹怯晚風後乃踰垣相從趙有十洞三清難阻路有心還得傍瑶臺之句非烟答曰相思何似不相識相見還將却别君公叢後知箠殺之趙竄於江淮盻所欺匹合纊類之語公業粗悍故非烟有媒徐月英月英江淮間娼也送人詩云惆悵人間萬事違兩人同去一人歸生憎平望亭前水忍照鴛鴦相背飛又云枕前泪與階前水隔箇間窗滴到明亦有詩集行于世唐詩紀事卷第七十九
