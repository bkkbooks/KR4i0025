front:
  text: 唐詩紀事卷第七十三
  hash: sha256:cba2a2f806e6918dee5880e046d3d35b8424aeb411bb90f6ebe316829e674fd6
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_073-1a}
body:
  text: 僧法振僧常雅僧隱丘僧法照僧泠然金地藏僧皎然僧護國僧含曦僧法振月夜泛舟云西塞長雲盡南湖片月斜漾舟人不見卧入武陵花趙使君生子晬日詩云老骨貴天生肌膚片玉明見人空解笑弄物不知名國器嗟猶小風神望益清抱來芳樹下時聽鳯凰聲送人遊閩越云不須行借問為爾話閩中海島春寒雨江帆來去風道遊玄度宅身寄朗陵公此别河傷逺如今關塞通疾愈寄友人云哀樂暗成疾卧中芳月移西山有清士孤嘯不可追搗藥曙林淨汲泉隂澗遲微縱與麋鹿逺謝求羊知姚合取用極元集送人遊閩以下二章題天長阮少府湖上客歸云孤棹移官舍新農寄楚田晴林渡海日春草長湖煙卧對間鷗戲談經稚子賢佳期更何許應向笑臺前陳九溪中草堂云溪草落濺濺魚飛入稻田早寒臨洞月輕素卷簾煙䪻幘題新句簔衣象古賢曙花間秀色三十六峰前送韓侍御自使幕巡海北云微雨空山洗夜兵繡衣朝拂海雲清幕中揮䇿心應苦馬上題詩卷已成離筵莫惜花園醉古道猶看夢草生因説元戎能破虜髙歌一曲隴關情李益與振同賦應門緑苔益詩云宫闕何年月應門何歲苔清光一侣照白露共徘徊珠履久行絶玉房重未開妾心正如此昭陽歌唱來李益送賈弇祕校東歸寄振上人云北風南鴈數聲悲况指前林是别時秋草不堪頻送逺白雲何處更相期山隨匹馬行看暮路入寒城獨厺遲為向東州故人道江淹已擬惠休詩僧常雅題五相廟蒼蒼古廟映林巒漠漠煙霞覆古壇精魄不知何處在威風猶入浙江寒僧隱丘石橋琪樹云山上天將近人間路漸遙誰當雲裏見知欲渡仙橋僧法照送禪師歸新羅云萬里歸鄉路隨緣不算程登山百衲敝過海一杯輕夜宿依雲色晨齋就水聲何年持貝葉却到漢家城寄錢郎中云閉門深樹裏間足為經過駟馬不為貴一僧誰奈何稻苗家自有香飯乞時多寄語嬋娟客將心向薜蘿僧泠然宿九華化成寺莊詩云佛寺孤莊千嶂間我來詩境強相關岩邊樹動猿下澗雲裏錫鳴僧上林松月影寒生碧落石泉聲亂噴潺湲明朝更躡層霄厺誓共煙霞到老間泠然唐末僧也金地藏新羅國王子也至德初落髮航海隱於池之九華山送童子下山詩云空門寂寞汝思家禮别雲房下九華愛向竹欄騎竹馬懶於金地聚金沙添瓶澗底休招月烹茗甌中罷弄花好厺不須頻下淚老僧相伴有煙霞僧皎然姓謝字清晝吳興人靈運十世孫居杼山顔卿真為刺史集文士撰韻海皎然預其著貞元中集賢院取其集藏之于頔為序嘗於舟中抒思作古體十數篇求合韋蘇州韋大不喜明日獻其舊製乃極稱賞云向不但以所工見投而猥希老夫之意人各有所得非卒得至晝大服其鑒裁之精訪陸羽云太湖東西路吳王古山前所思不可見歸鴈字翩翩何山賞春茗何處弄春泉莫是滄浪子悠悠一釣船舟行懷閻士和云二月湖南春草遍熿山渡口花如霰相思一日在孤舟空見歸雲兩三片山雪云夕陽在西峰疊翠縈殘雪狂風卷絮回驚猿攀玉折何意山中人誤報山花發詠史云田氏門下客馮公衆中賤一朝市義還百代名獨擅始知下客不可輕能使主人功業成借問髙車與珠履何如卑賤一書生又云獨負髙世姿冥冥寄浮俗卞子厺不歸何人識荆玉鬻春意不淺汚迹身豈辱鸞鎩樂迍邅蚪蟠甘窘束五噫譎且正可以見心曲思歸示説公云桐江秋信早憶在故山時靜夜風鳴磬無人竹掃墀猿來觸淨水鳥下啄寒梨何物關吾事歸心自有期題審道士新亭云何處好攀躋新亭俯舊溪坐中千里近簷下四山低小浦依林曲回塘繞郭西桃花春滿地滯路莫相迷懷舊云一坐西林寺從來未下山不因尋長者無事到人問宿雨愁為客看花笑未還空懷舊山月童子念經間陪盧中丞間遊山寺云野寺出人境捨舟登逺峰林間明見月萬壑靜聞鐘擁燭明山翠交麾動水容如何股肱守塵外得相逢同裴録事樓上望月云退食髙樓上湖山向晚晴桐花落萬井月影出重城水竹涼風起簾幃暑氣清蕭蕭獨無事因見蒞人情仙女臺云寂寂舊桑田何時女得仙應無雞犬在空有子孫傳古木花猶發荒臺路未遷暮來雲一片疑是欲歸年陪盧使君登樓送方巨之還亰云萬里汀洲上東樓欲别難春風潮水漫正月栁條寒旅逸逢魚浦清髙愛鳥冠雲山寧不起今日向長安尋陸鴻漸不遇云移家唯帶郭野徑入桑麻近種籬邊菊秋來未著花扣門無犬吠欲厺問西家報道山中厺歸來日每斜酬崔侍郎見贈云買得東山後逢君小隱時五湖逰不厭柏署迹如遺儒服何妨道禪心不廢詩一從居士説長破小乘凝若溪春興云春生若溪水雨後漫流通芳草行無盡清源去不窮野煙迷急浦斜日起微風數處承流望依稀似剡中湖南草堂讀書招李少府云削厺僧家事南池便隱居為憐松子夀還卜道家書藥院常無客茶樽獨對餘有時招逸吏來飯野中蔬宿吳匡山破寺云雙峰百戰後真界滿塵埃蔓草沿空壁悲風起故臺野花寒更發山月暝還來何事池中水東流獨不回宿法華寺云心與空林共杳冥孤燈寒竹自熒熒不知何處小乘客一夜風來聞誦經答李季蘭云天女來相試將花欲染衣禪心竟不起還捧舊花歸酬鄭判官湖上見贈云歲嵗湖南隱已成如何星使忽知名沙鷗慣識無心客今日逢君不解驚贈韓武康云山僧唯不飲沽酒飲陶潛此興雖無别多為俗士嫌韋蘇州寄皎然云吳興老釋子野雪蓋精廬詩名徒自振道心常晏如想茲栖禪夜見月東峰初鳴磬警岩壑焚香滿空虛夙慕端成舊未識豈為踈願以碧雲思方君怨别餘茂苑文華地流水古僧居何當一逰詠倚閣吟躊躇皎然詩式著偷語詩例云如陳后主詩日月光天德取傳長虞日月光太清上三字語同下二字義同偷意詩例云如沈佺期詩小池殘暑退髙樹早涼歸取栁渾太液滄波起長楊髙樹秋偷勢詩例云如王昌齡詩手携雙鯉魚目送千里鴈悟彼飛有適嗟此罹憂患取嵇康目送歸鴻手揮五絃俯仰自得逰心太玄詩式云詩有跌宕格二品一曰越俗其道如黃鶴臨風貌逸神王杳不可羇郭景純遊仙詩左挹浮丘袖右拍洪崕肩鮑明逺詩舉頭四顧望但見松柏繁荆棘鬱叢叢中有一鳥名杜鵑言是古時蜀帝魂聲音哀苦鳴不息羽毛憔悴似人髠飛走樹間啄蟲蟻豈知往日天子尊念茲變化非常理中間惻隱不能言二曰駭俗其道如楚有接輿魯有原壤外示驚俗之貌內藏逹人之度郭景純遊山詩嫦娥楊妙音洪崕頷其頥王梵志道情詩我惜未生時冥冥無所知天公強生我生我復何為無衣使我寒無食使我飢還你天公我還我未生時賀知章放逹詩云落花真好夢一醉一回顛盧照鄰漫作云城狐尾獨山鬼面參談淈沒格一品曰淡俗此道如夏姬當壚似蕩而貞采吳楚之風雖俗而正古歌曰華隂山頭百尺井下有流泉徹骨冷可憐女子來照影不照其餘照斜領調笑格一品曰戲俗漢書云匡鼎來解人頥蓋説詩也此一品非雅作足以為談笑之資矣李白狂詠女媧弄黃土摶作愚下人散在六合間濛濛若塵埃微雨云片雨拂簷楹煩襟四座清霏微過麥隴簫瑟傍莎城靜愛和梅落幽間入竹聲朝觀趣無限髙詠寄間情題廢寺云武陵罹亂後真界積塵埃殘月照秋水悲風起古臺居人今已盡栖鴿暝還來不到無生理應堪賦七哀賦得啼猿送客三峽云萬里巴江外三聲月峽深何年有此路幾客共霑襟斷壁分重影流泉入苦吟凄凄别離後聞此更傷心合取為極玄集微雨以下三章姚護國贈張駙馬班竹柱杖詩云此君與我在雲溪徑節竒文勝杖藜為有嵗寒堪贈逺玉階行處願提携護國江南人攻詞翰題醴陵玉仙觀歌云王喬一厺空仙觀白雲至今凝不散星垣松殿幾千秋往往笙歌下天半瀑布西行過石橋黃精採根還採苗路逢一人擎藥碗松花夜雨風吹滿又言家住在東坡白犬相隨邀我過南山石上有棊局曽使樵夫爛斧柯張謂哭護國上人云昔喜三身淨今悲萬劫長不應歸北斗多是向西方舍利衆生得袈裟弟子將鼠行殘藥碗蟲網舊繩床别起千花塔空留一草堂支公何處在神理竟茫茫僧含曦盧同訪含曦上人云三入寺曦未來轆轤無繩井百尺渴心歸厺生塵埃曦酬云長夀寺石壁院盧公一首詩渴飲即不渴飢食即不飢鯨吞海水盡露出珊瑚枝海神知貴不知價留向人間光照夜唐詩紀事卷第七十三
