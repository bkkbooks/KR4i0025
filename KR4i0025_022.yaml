front:
  text: 唐詩紀事卷第二十二
  hash: sha256:2a23627ea41779bfffd51cf1ed00ec4746f28c50b3c4a26e7bd6d9c6ec0779d5
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_022-1a}
body:
  text: 任華鄒象先賈至違述裴耀卿解彥融儲光羲孫翃梁知微沈千運魏萬元結張均李嶷萬齊融宋鼎崔頌任華雜言寄李白古來文章有能奔逸氣聳高格清人心神驚人魂魄我聞當今有李白大獵賦鴻猷文嗤長卿笑子雲班張所作瑣細不入耳未知卿雲得在嗤笑限登廬山觀瀑布海風吹不斷江月照還明余愛此兩句登天台望渤海雲垂大鵬飛山壓巨鼇背斯言亦好至於他作多不拘常律振擺超騰旣俊且逸或醉中操紙或興來走筆手下忽然片雲飛眼前劃見孤峰出而我有時白日忽欲睡睡覺歘然起攘臂任生知有君君也知有任生未中間聞道在長安及余戾止君巳江東訪元丹邂逅不得見君面毎常把酒背東望良久見說徃年在翰林胷中矛戟何森森新詩傳在宫人口佳句不離明主心身騎天馬多意氣目送飛鴻對豪貴承恩召入凡㡬迴待詔歸來仍半醉權臣妬盛名群大多吠聲有勑放君歸隱淪髙歌大笑出關去且向東山爲外臣諸侯交迓馳朱輪白璧一雙買交者黃金百鎰相知人平生傲岸其志不可測數十年爲客未嘗一日低顔色八詠樓中坦腹眠五侯門下無心憶䌓花越臺上細柳呉宫側緑水青山知有君白雲明月偏相識飬高簾卷閑可見不可攀荘周萬物外范蠡五湖間又聞訪道滄海上丁令王喬時還徃蓬萊經是曽到來方丈豈唯方一丈伊余毎欲乗興逺尋相江湖擁隔勞寸心今朝忽遇東飛翼寄此一章表胷臆儻能報我一片言但訪任華有人識雜言寄杜拾遺云杜拾遺名甫第二才甚竒任生與君别來巳多時何嘗一日不相思杜拾遺知不知昨日有人誦得數篇黃絹詞吾怪異竒特借問果然稱是杜二之所爲勢攫虎豹氣騰蛟螭滄海無風似鼓蕩華嶽平地欲奔馳曹劉俯仰慙大敵沈謝逡廵稱小兒昔在帝城中盛名君一箇諸人見所作無不心膽破郎官叢裏作狂歌丞相閤中常醉卧前年皇帝歸長安承恩闊歩青雲端積翠扈遊花匼匝披香寓直月團欒英才特逹承天睠公卿無不相欽羡只縁汲黯好直言遂使安仁却爲掾如今避地錦城隅幕下英寮毎日相就提玉壺半醉起舞捋髭鬚乍低乍昻傍若無古人制禮但爲防俗士豈得爲君設之乎而我不飛不鳴亦何以只待朝廷有知巳巳曽讀却無限書拙詩一句兩句在人耳如今看之惣無益又不能﨑嶇倚朝市且當事耕稼豈得便徒爾南陽葛亮爲朋友東山謝安作隣里閑常把琴弄悶即携罇起鸎啼二月三月時花發千山萬山裏此中幽曠無人知火急將書憑驛吏爲報杜拾遺高適贈任華云丈夫結交須結貧貧者結交交始親世人不解結交者唯重黃金不重人黃金雖多有盡時結交一成無竭期君不見管仲與鮑叔至今留名名不移摭言載華告辭京尹賈大夫書責其恃才傲物又與京兆杜中丞書責其始以文章見知而終不相顧上御史嚴大夫牋以爲失在於倨闕在於恕欲其遇士誡於倨撫下洪以恕可以長守富貴與庾中丞書云公幸以文章見許以𥙷衮相期公頃謂李太僕曰任子文詞可謂卓絶負冤以乆何不奏與太僕丞然公之相待何前緊而後慢耶華本野人常思漁釣尋常杖䇿歸乎舊山非有機心致斯扣繫但以今之後進皆屬望於公公其留意焉鄒象先象先尉臨漁蕭頴士自京邑無成東歸以象先同年生也作詩贈之來年蕭𥙷正字象先寄詩重述前事云六月度關雲三峰翫山翠爾時黃綬屈别後青雲致蕭荅云桂枝常共擢茅茨冀同薦一命何阻脩載馳各州縣壯圖悲歳月明代耻貧賤回首無津梁祗令二毛變賈至岳陽樓宴王員外貶長沙云極浦三春草高樓萬里心楚山晴靄碧湘水暮流深或謂朝中舊同爲澤畔吟停盃試北望還欲淚沾襟侍讌曲云雲陛褰衣裳丹墀覆緑楊隔簾粧掩映向席舞低昻鳴珮長廊靜如氷廣殿凉餘懽劒履散同輦入昭陽馮昭儀當熊云白羽挿彫弓蜺旌動朔風平明出金屋扈輦上林中逐獸長廊靜呼鷹御苑空王孫莫諌獵賤妾解當熊早朝大明宫云銀燭薫天紫陌長禁城春色曉蒼蒼千條弱柳垂青瑣百囀流鸎繞建章劒珮聲隨玉墀歩衣冠氣接御爐香共沭恩波鳳池裏終朝黙黙待君王岑參同和王維杜甫自蜀奉冊命徃朔方途中作云胡羯亂中夏鑾輿或南巡衣冠䧟冦戎狼狽隨風塵豳公秉大節臨難不顧身激昻白刄前濺血下沾巾尚書抱忠義歴險披蒼榛扈從出劍門登翼岷江濵時望揖侍郎公才摽縉紳亭亭崑山玉皎皎無緇磷頋惟乏經濟扞牧陪從臣永願雪㑹稽一劍清咸秦太皇時内禪神器付嗣孫新命集舊邦至德𬒳逺人捧冊自南服奉詔趍北軍覲謁心載馳違離難重陳䇿馬出蜀山畏途上縁雲飲啄叢箐間棲息虎豹群嶇﨑凌棧危惴惴慄心神峭璧上嶔岑大江下沄沄皇風扇八極異類懐深仁元兇誘熟虜肘腕生妖氛明主信英武威聲嚇四鄰誓師自朔方旗幟何􅌭紛鐡騎照白日旄頭拂秋旻將來盪滄𬈑寜止蹴崑崙古來有迍難否泰長相因夏康纉禹績代祖復漢勲干後各勤王驅馳拱紫宸豈惟太公望徃昔逢周文語謂三傑才公業獨殊倫感此慰行邁無爲歌苦辛帝日先天誥命乃父帝傳位至譔冊進藁典出卿父子之手可謂継美矣為之辭今兹命又爾爲之兩朝盛至字㓜鄰曽之子也肅宗時爲中書舎人坐小法貶岳州司馬在巴陵有詩寄朝中犮人云江南春草𥘉羃羃愁殺江南獨愁客秦中楊柳也應新轉憶秦中相憶人萬里鸎花不相見登高一望淚沾巾寳應𥘉召復故官大暦中位右散騎常侍卒李白寄至詩云賈生西望憶京華湘浦南遷莫怨嗟聖主恩深漢文帝憐君不遣到長沙韋述晚度伊水詩云悠悠渉伊水伊水清見石是時春向深兩岸草如積迢遞望洲嶼逶迤亘津陌新樹落踈紅遥原上新碧回首瞻洛陽遽有長山隔烟霧猶隔家風塵巳爲客登渉多異趨徃來見行役雲起早巳昏鳥飛日將夕光隂逝不借超然慕疇昔逺近亦何爲歸來存竹帛送張說上集賢學士應制云修文中禁啓改字令名加台坐徵人傑書坊應國華賦詩開廣宴賜酒酌流霞雲散明金闕池開照玉沙掖垣留宿鳥温樹落餘花謬此天光及啣恩醉日斜述純厚長者澹榮利任史官二十年典掌圖書餘四十年天寳間爲國子司業充集賢學士禄山亂抱國史藏南山臣賊賊平流渝州爲剌史薛舒所困不食死裴耀卿耀卿爲宣州剌史日張九齡經當塗界以詩寄之又有江上使風詩寄耀卿云江路與天連風帆何淼然遥林浪出沒孤舫鳥聮翩常自千鈞重深思萬事捐報恩非狥禄還逐賈人舩耀卿和當塗詩云茂先寔王佐仲舉信時英氣覩衝天發人將下榻迎珪符肅有命江國逺徂征九派期方越千鈞或可輕高帆出風逈孤嶼入雲平遄邁嗟于役離憂空自情飾簮倍早歳接壤厠專城曠别心彌􅎮宏規義轉傾徒然限飢渇况乃諷瑶瓊再酬使風見示云兹地五湖隣難哉萬里人驚飈翻是託危浪亦相因宣室才華子金閨諷議臣承明有三入去去速歸輪解彦融鴈塔詩云崢嶸徹倒景刻峭俯無地勇進攀有縁即嶮恐迷墜窅然喪五藴蠢尒懐萬類實際罔它尋波羅必可致南山繚上苑耆樹連巖翠北斗臨帝城扶宫切太清飡和禆日用味道懿天明縁野冷風浹紫薇佳氣晶馴禽演法要忍草藉經行本願從兹適方知物世輕此詩開元八年清河傳巖題于鴈塔儲光羲古意云秋風肅天地太行高崔嵬猿狖清夜吟其聲一何哀寂寥掩圭蓽夢寐逰蓬萊琪樹逺亭亭玉堂雲中開洪崖吹簫管素女飃䬙來雨師既先後道路無纎埃鄙哉楚襄王獨好雲陽臺胚渾本無象末路多是非逹士志寥廓所在能忘機耕鑿時未至還山聊採薇虎豹對我蹲鸑鷟傍我飛仙人空中來謁我勿復歸格擇爲君駕雲霓爲君衣西近崑崙墟可與世人違王維待光羲不至詩云重門朝巳啓起坐聽車聲要欲聞清風方將出戸迎晩鍾鳴上苑踈雨過春城了自不相顧臨堂空復情光羲兖州人登開元進士第又詔中書試文章歴監察御史禄山亂䧟焉賊平貶死啇璠云儲公詩格高調逸削盡常言趣逺情深挾風雅之道得浩然之氣述華清宫詩云山開鴻䝉色天轉招揺星又遊茅山詩云山門入松栢天路涵空虚此例數百句畧見荆陽集不復廣播常覩儲公政論十五卷九經分義䟽二十卷言愽理當實可謂經國之才新豊道中作云西下長樂坂東入新豊道雨多車馬稀道上生秋草太隂蔽皐陸莫知晚與早雲雷杳冥㝠川谷漫浩浩詔書植佳朩有詔重果二十八年無言桃李好自頋無此容歸從漢隂老泊舟詒潘少府云行子苦風潮維舟未能發宵分卷前幔卧視清秋月四澤葭葦深中洲烟火絶蒼蒼水霧起落落踈星沒所遇盡漁啇與言多楚越其如念極浦又以思明哲後浦時潘在常若千里餘况之異郷别田家即事云蒲葉日巳長杏花日巳滋老農要看此貴不違天時迎晨起飯牛雙駕耕東菑蚯螾土中出田烏隨我飛羣合亂啄噪嗷嗷如道飢我心多惻隱顧此兩復非撥食與田烏日暮空筐歸親戚更相誚我心終不移田家雜興三首云春至鶬鶊鳴薄言何田墅不能自力作黽俛娶鄰女旣念生子孫方思廣園圃閑時相顧笑喜悅好禾黍夜夜登嘯臺南望洞庭渚白草𬒳霜露秋山響砧杵却羡故年時中情無所取梧桐䕃我門薜荔網我屋超超兩夫婦朝出暮還宿稼穡旣自種牛羊還自牧日時懶耕鋤登高望川陸空山足禽獸墟落多喬朩白馬誰家兒聯翩相馳逐楚山有高士梁國有遺老築室旣相隣向田復同道粮糒常共飯兒孫日更抱忘此耕耨勞媿彼風雨好蟪蛄鳴空澤鶗鴂傷秋草日夕寒風來衣裳苦不早同王十三維偶然作四首云野老本貧賤冐暑鋤瓜田一畦未及終樹下高枕眠荷蓧者誰子皤皤來息肩不復間郷墟相見但依然腹中無一物高話羲皇年落日臨層隅逍遥望晴川使婦提蠶筐呼兒傍漁舩悠悠泛緑水去摘浦中蓮蓮花艶且美使我不能還仲夏日中時草朩看欲燋田家惜功力把鋤來東臯顧望浮雲隂徃徃誤傷苖歸來悲困極兄嫂相共饒無錢可沽酒何以解劬勞夜深星漢明庭宇虚寥寥高柳三五株可以獨逍遥浮雲在虚空随風傷卷舒我心方處順動作何憂虞但言嬰世網不復得閑居迢遞别東國超遥來西都見人乃恭敬曽不問賢愚雖若不能言中心亦難誣故郷滿親戚道逺情日踈偶欲陳此意復無南飛鳬北山種松栢南山種蒺藜出入雖同趣所向各有宜孔丘貴仁義老氏好無爲我心若虚空此道將安施暫過伊闕間晼晚三伏時高閣入雲中芙蓉滿清池要自非我室還望南山陲孫翃張曲江在洪州有郡南江上别孫侍御詩云雲障天涯盡川途海縣窮何言此地僻忽與故人同身負邦君弩情紆御史騘王程我安駐離思逐秋風翃時以監察御史奉使洪州酬云受命議封疆逢君牧豫章於焉審虞芮復爾共舟航悵别秋隂盡懐歸客思長江臯枉離贈持此慰他郷梁知微知微自潭州入朝張說宴别於岳陽以詩送之云逺涖長沙渚欣逢賈誼才江山疲應接風日復晴開又云月餘偏地賞心盡故人杯其末云夢見長安陌朝宗實盛哉知微奉别燕公詩云華容佳山水之子厭承明符竹迃小郡江湖𬒳德聲三年計吏入路指巴丘城鳬舟纔結纜騶駕巳相迎别離他郷酒委曲故人情孤嶼早烟泊長波晚氣清辛勤方逺鶩勝賞屢難并廻瞻洞庭浦日暮愁雲生燕公有送知微渡東海詩云今日此相送明年此相待天上客星廻知君渡東海曁送入朝至洞庭山又作云巴陵一望洞庭秋日見孤峰水上浮聞道神仙不可接心随湖水去悠悠蓋心存魏闕之意也知微嗣聖𥘉登進士第沈千運山中作詩云捿隱别無事所願早離塵不辭城邑逰禮樂拘束人邇來歸山林庶事皆吾身何者爲形骸誰是智與仁寂寞于閑事然後知天眞咳唾驚榮華迂俯相屈伸如何巢與由天子不得臣贈史修文云故人阻千里㑹靣非别期握手於此地當歡返成悲念離宛猶昨俄巳經數期疇昔皆少年别來髪如絲不道舊姓名相逢知是誰曩逰盡騫翥與君仍布衣豈曰無其才命理應有時别路漸欲少不覺生涕洟感懐弟妹詩云今日喜氣暖東風杏花拆䈥力又不如慙嘆澗中石神仙杳難凖中夀纔滿百近世多天傷喜見髭鬢白藜杖竹樹間宛宛舊行跡豈知園中主却是園中客兄弟所存半空爲亡者惜冥寞無再期哀哀望松栢骨肉能㡬人年老漸踈隔性情誰免此而我何不易唯願得尓軰相看慰朝夕平生只巳矣此外盡非逸濮上言懐云聖澤優賢良草澤無遺匿人生各有志在予胡不淑一生但區區五十無寸禄衰退當弃捐貧賤遭時讟恓恓去人世迍質日窮逼不如守田園歳晏望豊熟壯年失宜盡老大無䈥力始愴前計非方貽後生福兒童新學稼小女未能織頋此煩知巳終日求衣食元結篋中集序云風雅不作㡬及千年近世作者更相㳂襲拘限聲病喜尚形似且以流易爲辭不知喪於雅正呉興沈千運獨挺於流俗之中強攘於巳溺之後窮老不惑五十餘年凢所爲文皆與時異故朋友後世稍見師効能似類者有五六人於戯自沈公及二三子皆以正直而無禄位皆以忠信而乆貧賤皆以仁謙而至喪亡兵興于今六歳巳長逝者遺文散失方阻絶者不見近作故編於篋中者凡二十二首云王季友代人贈千運云相逢問姓名復存别來無子今有孫山上雙峰長不攺百姓唯有三家村村南東西車馬道一宿通舟水浩浩河中磊磊十里石河上游㳺㲹種稻平坡古塜背我拆滿田主人舊是客舉聲酸辛問同年十人七人歸下泉分手如何更此地廻頭不去淚澘然張籍過千運舊居詩云汝北君子宅我來見頺墉亂離子孫盡地屬隣里翁古朩𬒳丘墟蹊路不相通舊井蔓草合牛羊墜其中居辭天子書放意任禮躬一生不自力家與逆旅同我如星辰餘生於繳瘖聾方將旌舊閭百歳不可封嗟其未積來巳爲荒林叢時當無知者莫能敦此風浩蕩意無覩我將安所從魏萬君抱碧海珠我懐藍田玉各稱希代寳萬里遥相燭長卿慕閵久子猷意巳深平生風雅人暗合江海心去秋忽乗興命駕來東土謫仙遊梁園愛子在鄒魯二處一不見拂衣向江東五兩挂淮月扁舟隨海風南遊呉越徧高揖二千石雲上天台山春逢翰林伯宣父敬項託林宗重王生一長復一少相看如弟兄惕然意不盡更逐西南去同舟入秦淮建業龍盤處楚歌醉呉酒借問承恩𥘉宫買長門賦天迎駟馬車才高世難容道廢可推命安石重携妓子房空謝病金陵百萬戸六代帝王都虎丘踞西江鍾山臨北湖湖山信爲美王屋人相待應爲𡵨路多不知歳寒在君遊早晚還勿乆風塵間此别未逺别秋期到仙山右魏萬贈太白詩也太白送萬還王屋序云王屋山人魏萬自嵩宋㳂呉相送數千里不遇乗興遊台越經永嘉觀謝公石門後於廣陵相見美其愛文好古浪迹方外因述其行而贈以詩云萬後名顥上元𥘉登第始見白於廣陵白曰爾後必著大名於天下無忘老夫與明月奴因盡出其文命顥集之元結㫪陵行序云癸卯歳漫叟授道州剌史道州舊四萬餘戸經賊巳來不滿四千太半不勝賦稅到官未五十日承諸使徵求符牒二百餘封皆曰失其限者罪至貶削於戯若悉應其命則州縣破亂剌史欲焉逃罪不應命又即獲罪戾必不免也五將守官靜以安又待罪而巳此州是㫪陵故作㫪陵行以逹下情詩曰軍國多所須切責在有司有司臨郡縣刑法競欲施供給豈不憂徵歛又可悲州小經亂亡遺人實困疲大郷無十家大族命單羸朝食是草根暮食乃木皮出言氣欲絶意速行歩遲追呼尚不忍况乃鞭撲之郵亭傳急符來徃跡相追更無寛大恩但有迫促期欲令鬻兒女言發恐亂随悉使索其家而又無生資聽彼道路言恐傷誰復知去冬山賊來殺奪㡬無遺所願見王官撫養以惠慈柰何重駈逐不使存活爲安人天子命符節我所持州縣忽亂亡得澤復是誰逋緩違詔令䝉責固所冝前賢重守分惡以禍福移亦云貴守官不愛能適時頋惟孱弱者正直當不虧何人釆國風吾欲獻此辭賊退示官吏詩序云癸卯歳西原賊入道州煞掠㡬盡而去明年賊又攻永州破邵不犯此州邉鄙而退豈力能制敵歟盖蒙其傷憐而巳諸使何爲忍苦徵故作詩一篇以示官吏詩云昔年逢太平山林二十年泉源在庭戸洞壑當門前井稅有常期日晏猶得眠忽然遭世變數歳親茂旃今來典斯郡山夷又紛然城小賊不屠人貧傷可憐是以䧟隣境此州獨見全使臣將王命豈不如賊焉今彼徴歛者迫之如火煎誰能絶人命以作時世賢思欲委符節引竿自剌舩將家就魚麦歸老江海邉杜子美和元使君㫪陵行序云覽道州元使君㫪陵行兼賊退後示官吏作二首志之曰當天子分憂之地效漢官良吏之日今盗賊未息知民疾苦得結軰十數公落落參錯天下爲邦伯萬物吐氣天下少安可待矣不意復見比興體制微婉頓挫之詞感而有詩増諸卷軸簡知我者不必寄元也詩曰遭亂髮盡白轉衰病相嬰沉緜盜賊際狼狽江漢行歎時藥力薄爲客羸瘵成吾人詩家秀愽釆世上名粲粲元道州前聖畏後生觀乎㫪陵作歘見俊哲情復覽賊退篇結也實國禎賈誼昔流慟匡衡常引經道州憂黎庶詞氣浩縱横兩章對秋月一字皆華星致君唐虞際純朴憶大庭何時降璽書用爾爲舟青獄訟乆衰息豈唯偃甲兵悽惻念誅求薄歛近休明乃知正人意不苟飛長纓凉飈振南岳之子寵若驚色阻金印大興含滄𬈑清我多長卿病日久思朝廷肺枯渇大甚漂泊公孫城呼兒具紙筆隱几臨軒楹作詩呻吟内墨淡字欹傾感彼危苦詞庶㡬知者聽蘇源明薦結於肅宗時思明攻河陽帝將幸河東召結詣京師結上時議三篇乃攝監察御史發宛業軍屯泌陽全十五城帝善之代宗時侍親歸樊上後拜道州剌史民樂其敎還京師卒始號猗玗子後稱浪士又曰漫郎更曰聱叟張均九日巴丘登高云客心驚暮序賔鴈下襄州共賞重陽節言尋戯馬游湖風愁代柳江雨暗山樓且酌東籬菊聊祛南國憂岳州西城云水國何遼矌風波遂極天西江三汜合南浦二湖連危堞臨清境煩憂暫豁然九圍觀掌内萬像閱眸前日去長沙浦山横雲夢田汀葭變秋色津樹入寒烟潜穴探靈詭浮山揖聖仙至人今不見迹滅事空傳巴丘春作云日出洞庭水春山挂斷霞江涔相映發卉木其紛華湘戍南浮闊荆關北望賖湖隂窺魍魎丘勢辨巴虵島戸巢爲舘漁人艇作家自憐心問景三歳客長沙岳州觀競渡云畫作飛鳬艇雙雙競拂流俄装岀色變急掉水華浮土尚三閭俗江傳二女逰齊歌迎孟姥獨舞送陽侯皷發南湖汊標爭西驛樓並驅常詫速非畏日光遒傳疑俄装字岳州晚景云晚景寒鵶集秋聲海鴈歸水光浮日去霞彩映江飛洲白蘆花吐園紅柿葉稀長沙卑暑濕九月未成衣送梁六自洞庭山作云巴陵一望洞庭秋目見孤峰水上浮聞道神仙不可接心隨湖水共悠悠奉和燕公山城云郡舘臨清賞開扄坐白雲訟虚棠戸曉觀靜竹簷曛懸榻迎賔下趍庭學禮聞風傳琴上意遥向日華紛燕公岳州别均云離筵非讌喜别酒正消魂念汝猶童孺嗟予隔逺藩津亭拔心草江路斷腸猿他日將何見愁來獨倚門均丞相說之子也說最衷愛其情見於岳州别均之作說爲左相知官考均時任中書舎人特注之曰父敎子忠古之善訓祁奚舉子義不務私至於潤色王言彰施帝載道參墳典例絶功常恭聞前烈尤難其任豈以嫌疑敢撓綱紀考上下均能文爲大理卿禄山盗國爲僞中書令免死流合浦流合浦嶺外作云瘴江西去火爲山炎徼南窮鬼作關從此更投人境外生涯應在有無間杜子美贈太常張卿云方丈三韓外崑崙萬國西建摽天地闊詣絕古今迷氣得神仙逈恩承雨露低相門清議衆儒術大名齊軒冕羅天闕琳琅識介珪伶官詩必誦䕫樂典猶稽徤筆凌鸚鵡銛鋒瑩鸊鵜友于皆挺㧞公望各端倪通籍踰青瑣亨衢照紫泥靈虬傳夕箭歸馬散霜蹄能事聞重譯嘉謨及逺黎弼諧方一展班序更何躋適越何顛躓逰梁竟慘悽謬知終畫虎微分是醯雞萍泛無休日桃隂想舊蹊吹嘘人所羡騰躍事仍暌碧海真難渉青雲不可梯顧深慙鍜鍊方小辱提携檻束哀猿呌林驚夜鵲棲㡬時陪羽獵應指釣璜溪乃贈張垍或疑此詩李嶷淮南秋夜詩云天淨河漢高夜閑砧杵發清秋急如此離恨應難歇風亂池上螢露光竹門月君與共遊處勿作他郷别商璠云嶷詩鮮淨有規矩其少年行三章辭雖不多翩翩然俠氣在目也少年行云十八拜林郎戎衣從漢王臂鷹金殿側挾彈玉輿傍馳道春氷起陪遊出建章侍獵長揚下承恩更射飛塵生馬影滅箭落鴈行稀薄暮隨天仗聮翩入瑣闈玉劒膝邊横金盃馬上傾朝遊茂陵道暮宿鳯凰城豪吏多猜忌無勞問姓名萬齊融上巳緑潭篇云春潭滉瀁接隋宫宫闕連延潭水東蘋苔嫩色􅉼波緑桃李新花照底紅垂菱布藻如鏡麗日晴天相皎映素影顥顥對蝶飛金沙礫礫窺魚詠佳人祓褉賞韶年傾國傾城併可憐拾翠㧾來芳樹下蹋青爭遶緑潭邉公子王孫恣逰翫沙場水曲情無猒禽浮似楫羽觴杯鱗躍疑投水心劒金鞭玉勒騁輕肥落絮紅塵擁路飛渌水殘霞催席散畫樓𥘉月待人歸梁肅作越州開元寺僧曇一碑銘云師與賀賔客知章李北海邕禇諌議庭誨涇陽令萬齊融爲儒釋之遊莫逆之友李華為潤州鸖林寺徑山大師碑銘云菩薩戒弟子故吏部侍郎齊澣故刑部尚書張均故潤州剌史徐嶠故涇陽令萬齊融道流人望莫盛於此以二銘觀之齊融盖開元以來江南樂道之士也于休烈傳云與㑹稽賀朝萬齊融延陵包融齊名齊融止於崑山令越州人也宋鼎鼎明皇時剌襄州云張丞相齡九與余有孝廉校理之舊又代余爲荆州余攺漢陽仍兼按使巡至荆州故贈之詩曰漢上登飛幰荆南歴舊居已嘗臨砌橘更覩躍池魚盛德繼微眇深衷能卷舒義申蓬閣際情坦廟堂𥘉郡挹文章美人懐燮理餘皇恩儻昭亮豈厭承明廬九齡有酬宋使君詩云時來不息意宿昔謬樞衡翊聖負明主妨賢媿友生罷歸猶右職待罪尚南荆政有留棠舊風因繼祖成高軒問疾苦蒸庶荷仁明衰廢時所薄祗言僚故情崔頌張曲江在荆州有晨出郡舎林下詩云晨興歩北林蕭散一開襟復見林上月娟娟猶未沉片雲自孤逺叢蓧亦清深無事由來貴方知物外心時頌爲郡司馬和云優閑表政清林薄賞秋成江上懸曉月徃來虧復盈天雲抗眞意郡閣晦高名坐嘯應無欲寜牽濟物情唐詩紀事卷第二十二
