  text: 唐詩紀事卷第四十八
  hash: sha256:25f164e06d86a3b6c53f293eb0182a1f2ba7718c00a982170cc7e648b96259e6
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_048-1a}
body:
  text: 李祕韋臯李德裕鄭還古裴航裴休呂羣徐商王傳韋渠牟陸長源盧宗回劉闢薛宜僚陸希聲崔季卿皇甫徹李祕禁中送任山中云子去非長往君恩取大還補天留彩石縮地入青山獻夀千年外來朝數月間莫拋殘藥物切欲駐童顔唐宗室也元和正元時人韋臯臯少遊江夏止於姜使君之館有小青衣曰玉簫才十許嵗常侍臯臯後告别與約後㑹因留玉指環一枚并詩寄情云黃雀銜來巳數春别時留解贈佳人長江不見魚書至為遣相思夢入秦李德裕元和十一年嵗在丙申李逢吉下三十三人皆取寒素時有語曰元和天子丙申年三十三人皆得仙袍似爛銀文似錦相將白日上青天德裕頗為寒素開路及謫官南去或有詩曰八百孤寒齊下淚一時回首望崖州言出托上巳憶江南褉事云黃河西繞郡城流上已應無袚褉遊為憶渌江春水色更隨霄夢向吳州德裕營平泉莊逺方以異物奉之或題曰隴右諸侯供語鳥日南太守送名花及譴責或作詩云肉視具寮忘匕著氣吞同列削寒溫當時誰是承恩者肯有餘波達鬼村之句又云畫閣不開梁燕去朱門罷掃乳烏歸千嵓萬㕡應惆悵流水斜傾出武闈蓋恨之也公離東都平泉有詩云十年紫殿掌洪鈞出入三朝一品身文帝寵深陪雉尾武皇恩重燕龍津黑山永破和親虜烏嶺全坈跋扈臣自是功高臨盡處禍來名滅不由人公漢州日夕遊房公西湖云丞相鳴琴地何年黯玉徽聲聞海內房公好琴偶因微月夕重敞故樓扉桃李蹊空在芙蓉客暫依唯憐濟川楫長與夜舟歸重題云晚日臨寒渚微風發櫂謳鳳城波自闊魚水運難留亭古思宏棟川長憶濟舟想公髙世志祗似化城游房公舊竹亭聞琴緬慕風流神期如對有作云流水音長在青霞意不傳獨悲形解後誰聽廣陵絃德裕論文曰沈休文以音韻為切重輕為難語雖甚工㫖則未逺未可以言文外意也古之辭髙者蓋以言妙而工適情不取於音韻依四韻王粲有舉原安曹植七哀詩有四泥諧元勳佐漢舉信是也矣三韻班固多用協韻倚歟意盡而止成篇不拘於隻耦韻十一韻者文選有五韻七故篇無足尤詞寡纍句古辭如金石琴瑟尚於至音今則如絲竹鞞鼓迫於促節即知聲律之為其弊也世有非文章者曰詞不出於風雅思不越於離騷摸鴈古人何足貴也余曰譬諸日月雖終古常見而光景嘗新此所以為靈物者也嘗為文針曰文之為物自然靈氣惚恍而來不思而至杼軸得之淡而無味琢刻藻繪弥不足貴如彼璞玉磨礱成器奢者為之錯以金翠美質既雕良寶斯弃此文之大㫖也劉三復謂德裕曰漁歌樵唱皆傳述作夢北述夢詩云賦命誠非薄良時幸巳遭君當堯舜日官接鳳凰曹目睇煙霄闊心驚羽翼髙夢中作此六句椅梧連鸖禁埤堄接龍韜西接羽林軍內署北連春宮我后憐詞客卿等是我門客先后朝曾宣諭吾僚並雋髦著書同陸賈待詔比王褒重價鄰玄璧英辭淬寶刀泉流初落澗流於齒􅊯文賦稱言泉露滴更濡毫赤豹欣來獻彤弓喜暫櫜身赴闕海內無事者纍月時西戎乞盟幽鎮二帥束羆蓋真也詩稱赤豹黃非煙含瑞氣馴雉潔霜毛靜室便幽獨虛樓散鬱陶有小樓時燕語於此學士院有一室西南花光晨豔豔松韻晚騷騷畫壁看飛鸖山圖見巨鼇松鸖先是西壁畫內署垣牆皆有畫臨幸中使懼而圖焉海內曲龍山憲宗欲傍簷隂藥樹落落蔓蒲萄句悉此八遊者依然可想也是內署物色唯曾荷靜蓬池膾氷寒郢水醪初上腸每學士酒以酒味稍濃常和氷而飲禁中有酒方食皆蓬萊池魚膾夏至後頒賜水及燒香荔芰來自逺盧橘賜常叨亦䝉頒賜自後以道逺罷獻先朝初臨御南方曾獻荔芰麝氣隨蘭澤霜華入杏膏恩光唯覺重携挈未為勞扇回交綵翟鵰起揚銀絛轡待奚絲攬書期蜀客操盡規徒謇謇退舍尚忉忉內庭所覩此八句述龜顧垂金鈕鸞飛曵錦袍御溝楊柳弱天廄驌驦豪屢換青春直間隨上苑遨煙低行殿竹風折繞垣桃浣日遊戲此八句述聚散俄成昔悲愁益自熬每懷仙駕逺更望茂陵號地接三茅嶺川迎五子濤子胥憤氣所作代稱海濤是五花迷瓜步暗石固䔉山牢蘭野凝青管梅洲動翠篙泉魚驚綵妓溪鳥避千旄感舊心猶絶思歸首更搔無聊燃密炬誰復勸金舠實僚乃常顧形迹未嘗以此而相勸也余自到此絶無夜宴酒器中大者呼為舠嵐氣朝生棟城隂暝入濠望煙歸海嶠送鴈度江臯宛馬嘶寒攊吳鈎在錦㢭未能追狡兔空覺長江蒿水逾國千里風帆過萬艘閲川終古恨唯見暮滔滔德裕述夢詩記為夢中賦詩耳元微之和云聞有池塘什還因夢寐遭攀禾占類蔡詠豆放過曹莊蝶玄言祕羅禽藻思髙注云本篇稱六句皆夢中作故此三聮多證夢意巳下皆言同在翰林及翰苑故事若學士初入賜龍飛馬故有借騎銀杏葉之句青詔用麥紋𥿄故有麥𥿄侵紅㸃之句麻制例别通宵勘寫故有蘭燈熖碧髙之句學士密邇銀臺每旦嘗聞門使勘契開鎖又院門有急命即鈴索門自搖習以為異故有吏傳開鎖契神撼引鈴絛之句學士無過從聚㑹之例時與李間行寺觀而巳故有分阻杯盤㑹間期寺觀遨之句乃皆唐之故事也鄭還古還古間居東都將入京赴選桞當將軍者餞之酒酣以一詩贈桞氏之妓曰冶艷出神仙歌聲勝管絃詞輕白紵曲歌遏碧雲天未擬生裴秀如何乞鄭玄不堪金谷水橫過墜樓前桞喜甚曰專伺榮命以此為賀未幾還古除國子博士桞見除目即遣入京及嘉祥驛而還古物故乃放妓他適逸史載還古初娶桞氏女嘉㑹之初夢娶房氏後柳卒再娶東都李氏屬房直溫為東洛少尹李之舅也禮宴皆房主之始知舊夢之前定也還古登元和進士苐裴航長慶中裴航下第遊鄂渚傭舟還都有樊氏女同載航賂其侍兒以詩求達曰同為胡越猶懷思况遇天花隔錦屏儻若玉京朝㑹去願隨鸞鸖入青蓂樊答詩曰一飲瓊漿百感生玄霜搗盡見雲英藍橋便是神仙宅何必﨑嶇上玉清世傳藍橋雲英之事未必信姑載於此裴休贈黃蘖山僧希運詩曰自從大士傳心印額上圓珠七尺身挂錫十年棲蜀水浮杯今日渡漳濵一千龍象隨髙步萬里香華結勝因擬欲事師為弟子不知將法付何人休㑹昌中官于鍾陵請運至郡以所解一篇示之師不顧曰若形於𥿄墨何有吾宗休問其故曰上乘之印唯是一心更無别法心體一空萬緣俱寂如大日輪升於虛空其中照耀靜無纎埃證之者無新舊無淺深說之者不立義解不開户牗直下便是動念即乖其後休録之為傳心法要云休字公美孟州人大中六年為相能文章為人醖藉進止雍間宣宗曰休真儒者呂羣羣元和十一年下第遊蜀性不容下僕馭怨之至眉州題詩所寓寺之東壁其一云路行三蜀盡身及一陽生賴有殘燈火相依坐到明其二曰社後辭巢燕霜前别蒂蓬願為胡蝶夢飛去覔關中吟訖淚下意緒不堪未幾為其奴所殺徐商王傳商鎮襄陽有副使節判同加章綬商以詩賀之云朱紫花前賀故人兼榮此㑹頗關身同年坐上聮賔榻宗姓亭中布錦裀晴日照旗紅灼爍韶光入隊影玢璘芳菲解助今朝喜嫩蘂青條滿眼新觀察判官將仕郎監察御史王傳和云朱紫聮輝照日新芳菲全屬斷金人華筵重處宗盟地白雪飛時郢曲春仙府色饒攀桂侣蓮花光讓握蘭身自憐亦是膺門客吟想恩榮氣益振朝議郎江州刺史假成式和云雲雨軒懸鶯語新一篇佳句占陽春銀黃年少偏欺酒金紫風流不讓人連璧坐中斜日滿貫珠歌裏落花頻莫辭倒戴吟歸去看欲東山又吐茵商宣宗時為山南東道節度使咸通四年為宰相封東莞縣子商與曹確楊收路巖同秉政有嘲之者曰確確無餘事錢財揔被收商人都不管貨賂幾時休傳登大中三年進士第初貧窶於中條山萬固寺入院讀書家廟碑云隨僧洗鉢韋渠牟貞元元年渠牟為大府卿與金吾李齊運度支裴延齡京兆尹嗣道皆承恩寵薦人多得名位時劉老師穆寂皆科目渠牟主穆寂齊運主老師㑹齊運朝對上嗟其羸弱許以致仕而老師失據無名子嘲之云太尉朝天外穆老尚書倒地落劉郎劉禹錫曰名場巇嶮如此出古今詩話渠牟南山四皓贊云煥煥煌煌為圭為璋孰光乎不耀之光幽幽深深為山為林孰繫乎不繫之心足知乎虛室生白玄門不關流水去住清風往還豈比乎稷契在世巢由在山一物有纍兩心不間者哉間之謂何簮居薜蘿本不干我豈云其他熙熙欣欣與時為春匡漢避秦惟兹四人于德之濵不迷其津繪事後素孰知其故想像儀刑念兹丹青曄曄紫芝深谷逶迤俯仰今古空林往時鳳豈無德鸞皆有羣出處默語商山白雲渠牟述之從子也少警悟攻為詩李白異之授以古樂府去為道士不終更為浮屠巳而復冠韓滉表試校書郎德宗誕日詔徐岱趙需許孟容與渠牟及佛老二師並對麟德殿質問大趣渠牟有口辨雖三家未究解然答問鋒生帝聽之意動遷祕書郎後倚延齡為姦利勢熖可炙擢太常卿卒權載之叙其文曰初君年十一嘗賦銅雀臺絶句右拾遺李白見而大駭因授以古樂府之學且以瓌琦軼拔為巳任至弱冠乃喟然曰四始五際今既逺矣㑹情性者因於物象窮比興者在於聲律蓋辨以麗以則得於無間合於天倪者其在是乎彼思休稱謝永嘉如芙蓉出水鍾嶸謂范尚書如流風回雪吾知之矣遂苦心藻慮儷詞比事纎密清巧度越羣倫嘗著天笁寺十六韻魯郡文忠公序引而和之使畫工圖於仁祠摘句配境偕為勝絶又於江南著卧疾三十韻晉國忠肅公手翰以美之曰草木獨立其在我韋生乎其為名臣宗公所稱賞如此又與竟陵陸鴻漸杼山僧皎然為方外之侶沉冥慱約為日最久而不名一行不滯一方故其曵羽衣也則曰遺名攝方袍也則曰塵外披儒服也則今之名字著焉周流三教出入無際寄詞詣理必於斯文陸長源孟東野以樂府戲贈云蓮子不可得荷花生水中猶勝道傍桞無事蕩春風長源答云芙蓉初出水菡蓞露中花風吹著枯朩無奈值空槎東野有夷門雪贈主人云夷門貧士空吟雪夷門豪士皆飲酒酒聲歡閙入雲霄雪聲激切悲枯杇悲歡不同歸去來萬里春風動江桞長源答云好丹與素道不同失意得途事皆别東鄰年少樂未英南客思歸腸欲絶千里長河水復氷雲鴻冥冥楚山雪酬東野新居見寄云大道本夷曠髙情亦冲虛因隨白雲意偶逐青蘿居青蘿分䝉密四序無慘舒餘情濯子襟散彩還吾廬去嵗登美第榮名在公車將必繼管蕭豈惟躡應徐首夏尚清和殘芳遍丘墟褰幃䕃窗桞汲井滋園𬞞達者貴知心古人不願餘愛君蔣生徑且著茂陵書長源吳人贍於學德宗以宣武節度使董晉儒愞詔長源為司馬佐之持法峭刻晉卒長源總留後事軍亂殺之盧宗回長安慈恩寺塔詩云東方曉日上翔鸞西轉蒼龍拂露盤渭水冷光搖藻井玉峯晴色墮欄杆九重宮闕參差見百二山河表裏觀暫輟去蓬悲不定一憑金界望長安宗回登元和進士苐劉闢登樓望月云圓月當新霽髙樓見最明素波流粉壁丹桂拂飛甍下瞰千門靜旁觀萬象生梧桐窗下影烏鵲檻前聲嘯逸劉琨興吟資庾亮情遊人莫登眺迢遞故鄉程又云皎潔三秋月巍峩百丈樓下分征客路上有美人愁帳卷芙蓉帶簾褰玳瑁鈎倚窗情渺渺慿檻思悠悠未得金波轉俄成玉筯流不堪三五夕夫壻在邊州闢字太初擢進士宏詞科佐韋臯府後為西川節度以叛誅薛宜僚宜僚以左庶子充新羅冊贈使至青州恱一妓假東美賦詩曰阿母桃花方似錦王孫草色正如煙不須更向滄溟望惆悵歡情又一年到外國謂判官苖甲曰東美何故頻見夢中數日而卒櫬至青假奠之一慟而卒陸希聲古之善書鮮有得筆法者希聲得之凡五字擫押鈎格扺用筆雙鈎則㸃畫遒徑而盡妙矣謂之撥鐙法希聲自言昔二王皆傳此法至陽氷亦得之希聲以授沙門𧦬光𧦬光入長安為翰林供奉希聲猶未達以詩寄𧦬光云筆下龍蛇似有神天池雷雨變逡巡寄言昔日不龜手應念江頭洴澼人𧦬光感其言引薦希聲於貴幸後至相希聲博學善屬文相昭宗在位無所輕重以太子太師罷李茂正犯京師輿疾避難卒崔季卿晴江秋望云八月長江萬里晴千帆一道帶風輕盡日不分天水色南是嶽陽城季卿峒之從孫也皇甫徹正元十四年徹刺蜀州賦四相詩序云蜀州刺史㕔壁記居相位者前後四公謨明弼諧遷轉歷此顧已無取忝跡於斯景行遺烈嗟嘆之不足也謹述其行事詠其休美庶將來君子知聖朝之德云爾中書令漢陽王張柬之周曆革元命天步值艱阻烈烈張漢陽左袒清諸武休明神器正文物舊儀覩南向翊大君西宮朝聖母作補文借韻用茂勳鏤鍾鼎鴻勞食茅土至今稱五王卓立邁萬古中書令鍾紹京景龍仙駕逺中禁姧釁結謀猷叶聖朝披鱗奮英節清宫閶闔啓滌穢氛沴滅紫極重昭回皇天新日月從容廟堂上肅穆人神恱唐元佐命功輝煥何烈烈禮部尚書門下侍郎平章事李峴時來偶明聖道濟寧邦國猗歟瑚璉器竭我股肱力進賢黜不肖措枉舉諸直宦官既却坐權竪亦移職載踐每若驚三巳無愠色昭昭垂憲章來世實作則門下侍郎平章事王縉舟楫濟巨川山河資秀氣昭膺究儒業屈指取髙位北征戮驕悍東守輯携二論道致巍巍持衡無事事知巳不易遇宰相固有器瞻事華壁中來者誰其嗣唐詩紀事卷第四十八
