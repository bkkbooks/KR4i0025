front:
  text: 唐詩紀事巻第一錢塘洪楩校
  hash: sha256:a706a940efac84991ca675129bae04c271b6a567ed3eb6ede489b314e09c6a8a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_001-1a}
body:
  text: 太宗高宗中宗帝京篇序云余以萬機之暇遊息藝文觀列代之皇王考當時之行事軒昊舜禹之上信無間然矣至於秦皇周穆漢武魏明峻宇雕墻窮侈極麗征税殫於宇宙轍跡徧於天下九域無以稱其求江海不能贍其欲覆亡㒹沛不亦宜乎余追蹤百王之末馳心千載之下慷慨懐古想彼哲人庻以堯舜之風蕩秦漢之弊用咸英之曲變爛漫之音求之人情不爲難矣故觀文教於六經閲武功於七德臺榭取其避燥濕金石尚其諧人神皆節之於中和不係之於淫放故溝洫可恱何必江海之濵乎麟閣可翫何必山陵之間乎忠良可接何必海上神仙乎豐鎬可游何必瑶池之上乎釋實求華以人從欲亂於大道君子耻之故述帝京篇以明雅志云爾秦川惟帝宅凾谷壯皇居綺殿千尋起離宫百雉餘連甍遥接漢飛觀逈凌虚雲日隱層闕風煙出綺䟽一其巖廊罷機務崇文聊駐輦玉匣啓龍圖金繩披鳳篆韋編斷仍續縹帙舒還卷對此乃淹留欹案觀墳典二其移歩出詞林停輿欣載宴琱弓冩明月駿馬疑流電驚鴈落虚弦啼猿悲急箭閲賞誠多矣於兹乃忘倦三其鳴笳臨樂舘眺聽歡芳節急管韻朱絃長歌凝白雪威鳳肅來下玄鶴分成列去兹鄭衛聲雅音方可恱四其芳辰追逸趣禁苑信多竒橋形通漢上峰勢接雲危煙霞交隱映花鳥自參差何如肆轍跡萬里賞瑶池五其飛盖去芳園蘭橈遊翠渚萍間日彩亂荷處香風舉桂楫滿中川絃歌振長嶼豈獨汾河曲方爲歡宴所六其日落䨇闕昏廻輿九重暮長煙散初碧皎月澄輕素褰幌翫琴書開軒引雲霧銀漢耿層閣清風揺玉樹七其歡樂難再遇芳晨良可惜玉酒溢雲罍蘭肴陳綺席千鐘合堯禹百獸諧金石得志重寸隂忘懐輕尺璧八其建章歡賞夕二八盡妖妍羅綺昭陽殿芬芳玳瑁筵珮移星正動扇掩月初圎無勞上玄圃即此對神仙九其以兹逰觀極悠然獨長想披卷覽前蹤撫躬尋既徃望古茅茨約曠今蘭殿廣入道慮高危虚心誡盈蕩奉天竭誠敬臨民思惠養納善察忠諫明科慎刑賞六五誠難繼四三非易仰庻待淳化敷方嗣云亭響十其帝製帝京篇命李百藥並作既上詔曰卿何身老而才之壯齒宿而意之新乎正月臨朝云條風開獻節灰律動初陽百蠻奉遐書萬國朝未央雖無舜禹跡幸欣天地康車軌同八表書文混四方赫奕儼冠盖紛綸盛服章羽旌飛馳道鐘鼓震脩廊組練暉霞色霜㦸照朝灮晨宵懐至理終愧撫遐荒秋日垂清光賜房元齡詩曰秋露凝高堂朝光上翠微參差麗䨇闕照耀滿重闈仙馭隨輪轉靈烏帶影飛臨波無定彩入隙有圓暉還當葵藿志傾葉自相依賦得白日傍西山詩曰紅輪不暫駐烏飛豈復停岑霞漸漸落溪隂寸寸生藿葉隨光轉葵心逐照傾晚煙含樹色棲鳥雜流聲賦得花庭霧詩云蘭氣巳薰宫新蘂半粧叢色含輕重霧香引去來風拂樹濃舒碧蘩花薄蔽紅還當雜行雨髣髴隱遥空詠小山詩云近谷文縈蘂遥峰對出蓮徑細無全磴松小未含煙弱柳鳴秋蟬詩云散影玉階柳含翠隱鳴蟬微形藏葉裡亂響出風前早鴈出雲鳴詩云初秋玉露清早鴈出雲鳴隔雲時亂影因風乍含聲秋日翠微宫詩曰秋光凝翠嶺凉吹肅離宫荷踈一蓋缺樹冷半帷空側陣移鴻影圓花釘菊叢攄懐俗塵外高眺白雲中春日望海詩云披襟眺滄海慿軾翫春芳積流横地軸䟽派引天潢仙氣凝三嶺和風散八荒拂曉雲布色穿浪日舒光照㟁花分彩迷雲鴈斷行懐卑運深廣持滿守靈長有形非易測無源詎可量洪濤經變野翠島屢成桒之罘思漢帝碣石想秦皇霓裳非本意端拱且圖王召侍臣賜宴守歳云四時運灰琯一夕變冬春送寒餘雪盡迎歳早梅新洛水云春蒐馳駿骨緫轡俯長河霞處流縈錦風前漾卷羅水花飜照樹隄蘭倒挿波豈必汾隂曲秋雲發棹歌冬日臨昆明池詩云石鯨分玉溜刼燼隱平沙柳影水無葉梅心凍有花寒野凝朝露霜天散夕霞歡情猶未極落景遽西斜賦得浮橋詩云岸曲非千里橋斜異九星暫低逢輦度還高值浪驚水搖文鷁動纜轉錦花縈逺近隨輪影輕重應人行入潼闗詩云崤函稱地險襟帯壯兩京霜峰直臨道氷河曲遶城古木參差影寒猿斷續聲冠蓋徃來合風塵朝夕驚高談先馬渡偽曉預鷄鳴弃繻懐遠志封泥負壯情别有真人氣安知名不名春日玄武門宴群臣詩云韶光開令序淑氣動芳年駐輦華林側高宴栢梁前紫庭文珮滿丹墀衮紱連九夷簉瑶席五狄列瓊筵娱賔歌湛露廣樂奏鈞天盈樽浮緑醑雅曲韻朱絃粤余君萬國還慙撫八埏庻㡬保正固虚巳厲求賢又置酒坐飛閣詩云高軒臨碧渚飛簷逈駕空餘花攅漏檻殘柳散雕櫳㟁菊初含蘂園梨始帶紅却慮崐山暗不共盡杯中冬宵各爲四韻詩云雕宫靜龍漏綺閣宴公侯珠簾燭𦦨動繡柱月光浮塵起將歌發風停與管遒瑣池任多士端扆竟何憂尚書詩云崇文時駐歩東觀還停輦輟膳玩三墳輝燈披五典寒心覩肉林飛目㸔沉湎縱情昬主多克巳明君鮮㓕身資累惡成名猶積善既承百王末戰兢隨歳轉詠司馬彪續漢志詩云二儀初創象三才乃分位非惟樹司牧固亦垂文字綿代更膺期芳圖無輟記炎漢承君道英謨纂神噐濳龍既可躍術兎奚難致前史殫妙詞後昆沉雅思書言揚盛跡補闕興洪志川谷猶舊涂郡國開新意梅山未覺杇榖水誰云異車服隨名表文物因時置鳳㦸翼康衢鑾輿揔柔轡清濁必能澄洪纎幸無棄觀儀不失序遵禮方由事政宣竹律和時平玉條備文囿雕竒彩藝門藴深致雲飛星共流風揚月兼至類禋遵令典壇壝資良地五勝竟無違百司誠有庇我皇承暇景談叢引衆祕討論窮義府㸔覈披經笥大辯良難仰小學終先匱聞道諒知榮含毫孰忘愧出獵詩云楚王雲夢澤漢帝長揚宫若時因農暇閲武出轘嵩三駈陳銳卒七萃列材雄寒野霜氛白平原燒火紅琱戈夏服箭羽騎綠沉弓佈獸潜幽壑驚禽散翠空長煙晦落景灌木偃嚴風所爲除民瘼非是恱林叢冬狩詩云烈烈寒風起慘慘飛雲浮霜濃凝廣隰氷厚結清流金鞍多上苑玉勒騁平疇旌旗四望吞罝羅一靣求楚踣争兕殪秦亡觧鹿愁獸忙投宻樹鴻驚起礫洲騎歛原塵静戈廻嶺日收心非洛汭逸意在渭濵㳺禽荒非所樂撫轡更招憂李詩云玉衡流桂圃成蹊正可尋鸚啼緑葉外蝶戯晩花心麗景光朝彩輕煙散夕隂暫頼暉章側還眺靈山林賦得櫻桃詩春爲韻云華林滿芳景洛陽徧陽春朱顔含逺日翠色影長津喬柯轉嬌鳥低枝映美人昔作園中實今來席上珍春池柳詩年柳變池臺隋堤曲直廻逐浪絲隂去迎風帯影來踈枝一鳥哢半翠㡬眉開瑩雪臨春㟁參差間早梅臨池柳詩云岸曲絲隂聚波移帯影踈還將眉裡翠來就鏡中舒竹詩云貞條彰曲砌翠葉負寒霜拂牖分寒影臨池待鳳翔詠飮馬詩云駿骨飲長涇奔流灑絡纓細紋連噴聚亂荇遶蹄縈水光鞍上側馬影溜中横飜似天池裏騰波龍種生帝甞作宫體詩使虞世南賡和世南曰聖作誠工然體非雅正上有所好下必有甚臣恐此詩一傳天下風靡不敢奉詔帝曰朕試卿尔後帝爲詩一篇述古興亡既而嘆曰鍾子期死伯牙不復皷琴朕此詩何所示耶敕禇遂良即世南靈坐焚之正觀六年九月帝幸慶善宫帝生時故宅也因與貴臣宴賦詩起居郎請平宫商被之管絃命曰功成慶善樂使童子八佾爲九功之舞大宴㑹與破陣舞偕奏於庭正觀二十年秋帝幸靈州破薛延陁時廻紇諸部遣使入貢乞置官司上爲詩序其事曰雪耻酬百王除㓙報千古公卿請勒石於靈州從之高宗九月九日云端居臨玉扆初律啓金商鳳闕澄秋色龍闈引夕凉野静山氣歛林踈風露長砌蘭虧半影巖桂發全香滿蓋荷彫翠圓花菊散黄揮鞭争電烈飛羽亂星光栁空穿石碎弓虚側月張怯猿啼落岫驚鴈斷分行斜輪低夕影歸斾擁通莊七夕宴玄圃云羽蓋飛天漢鳳駕越層巒俱歎三秋阻共叙一宵歡璜虧夜月落靨碎曉星殘誰能重操杼纎手濯清瀾又云霓裳轉雲路鳳駕儼天潢虧星凋夜靨殘月落朝璜促歎今夕促長離别後長輕梭聊駐織掩淚獨悲傷過温湯詩温渚停仙蹕豐郊駐曉旌路曲回輪影巖虚傳漏聲暖溜驚湍駛寒空碧霧輕林黄踈葉下野白曙霜明眺聽良無巳煙霞斷續生太子納妃太平公主出降詩云龍樓光曙景魯館啓朝扉艷日濃粧影低星降婺輝玉庭浮瑞色銀牓藻祥徽雲轉花縈蓋霞飄葉綴旗雕軒回翠陌寳駕歸丹殿鳴珠珮曉衣鏤璧輪初扇華冠列綺筵蘭醑申芳宴環階鳳樂陳玳席珍羞薦蝶舞䄂香新歌分落素塵歡凝歡懿戚慶叶慶初姻暑闌炎氣息凉早吹踈蘋方期六合㤗共賞萬年春太平公主武后所生后愛之傾諸女帝擇薛紹尚之假萬年縣爲婚館門隘不能容翟車有司毁垣以入自興安門設燎相屬道樾爲枯當時群臣劉禕之詩云夢梓光青陛穠桃藹紫宫元萬頃云离元應春夕帝子降秋期任奉古云帝子升青陛王姬降紫宸郭正一云桂宫初服冕蘭掖早升笄皆納妃出降之意也中宗立春日游苑迎春云神臯福地三秦邑玉臺金闕九仙家寒氷猶戀甘泉樹淑景催臨建始花綵蝶黄鶯未歌舞梅香柳色巳矜誇迎春正啓流霞席蹔囑曦輪勿遽斜九月九日幸臨渭亭登高作云九日正乗秋三杯興巳周泛桂迎罇滿吹花向酒浮長房茰早熟彭澤菊初収何藉龍沙上方得恣淹留字得秋時景龍三年也御製序云陶潜盈把既浮九醖之觀畢卓持螯湏盡一生之興人題四韻同賦五言其最後成罰之引滿韋安石得枝字云金風飄菊蘂玉露泫茰枝蘇瓌得暉字云恩深荅効淺留醉奉宸暉李嶠得歡字云令節三秋晚重陽九日歡蕭至忠得餘字云寵極茰房遍恩深菊酎餘竇希玠得明字云九晨陪聖膳萬歲奉承明韋嗣立得深字云願陪歡樂事長與歲時深李逈秀得風字云霽雲開晚日仙藻麗秋風趙彦伯得花字云簮挂丹茰蘂杯􅉼紫菊花楊廉得亭字云逺日瞰秦埛重陽坐灞亭岑羲得涘字云爰豫矚秦埛昇高臨灞涘盧藏用得開字云茰依珮裏發菊向酒邊開李咸得直字云菊黄迎酒泛松翠凌霜直閻朝隱得筵字云簮紱趨皇極笙歌接御筵沈佺期得長字云臣歡重九慶日月奉天長薛稷得曆字云願陪九九辰長奉千千曆蘇頲得時字云年數登高日延齡命賞時李乂得濃字云捧篋茰香遍稱觴菊氣濃馬懐素得酒字云蘭將葉布席菊用香浮酒陸景初得臣字云登高識漢苑問道侍軒臣韋元旦得月字云雲物開千里天行乗九月李適得高字云禁苑秋光入宸遊霽色高鄭南金得日字云風起韻虞絃雲開吐堯日于經野得樽字云桂筵羅玉俎菊醴溢芳樽盧懐慎得還字云鶴似聞琴至人疑宴鎬還是宴也韋安石蘇瓌詩先成于經野盧懐慎最後成罰酒幸秦始皇陵賦詩云眷言君失德驪邑想秦餘政煩方攺篆愚俗乃焚書阿房乆已㓕閣道遂成墟欲厭東南氣飜傷掩鮑車十月帝誕辰内殿宴群臣聮句云潤色鴻業寄賢才帝云叨居右弼貴鹽梅李嶠運籌帷幄荷時來客宗楚職掌圖籍濫蓬萊劉憲兩司謬沗謝鍾裴崔湜禮樂銓管効塵埃鄭愔陳師振旅青九垓昭趙彦忻承顧問侍天杯李適衘恩獻壽栢梁臺蘇頲黄縑青簡奉康哉用盧蔵鯫生侍從忝王枚李乂右掖司言實不才懐馬素宗伯秩禮天地開薛稷帝歌難續仰昭回問朱之微臣捧日變寒灰遠慙班左愧遊陪上官婕妤帝謂侍臣曰今天下無事朝野多歡欲與卿等詞人時賦詩宴樂可識朕意不湏惜醉大學士李嶠宗楚客等跪奏曰臣等多幸同遇昌期謬以不才䇿名文館思勵駑杇庻禆河嶽既陪天歡不敢不醉此後每遊別殿幸離宫駐蹕芳苑鳴笳仙禁或戚里宸筵王門巹席無不畢從長寧公主韋庻人所生下嫁楊慎交制曰駙馬都尉楊慎交分榮戚里藉寵公門恭肅著於立身恪勤効於從政鳳凰樓上宛符琴瑟之歡烏鵲橋前載恊松蘿之契冝分覃茅土式廣山河造第東都府財㡬竭又取西京高士廉第左金吾衛廢營合爲宅作三重樓築山浚池帝及后數臨幸置酒賦詩群臣属和故李嶠長寧公主東荘侍宴詩其末云承恩咸巳醉戀賞未還鑣崔湜云席臨天女貴杯接近臣歡李適云願奉瑶池駕千春侍德音李乂云地出東郊廻日馭城臨南斗度雲車徐元伯云鳳扆憐簫曲鸞閨念掌珍公主之生也帝誕日而公主滿月李嶠詩云神龍見象日仙鳳養雛年大寳來天正明珠對月圓祚延金篋裏歌奏玉箱前今日冝孫慶還叅祝聖篇登驪山高頂詩云四郊秦漢國八水帝王都閶闔雄里閈城闕壯規模貫渭稱天邑含𡵨實奥區金門披玉館因此識黄圖帝自題序末云人題四韻後罰三盃日暮成者五六人餘皆罰酒劉憲詩云驪阜鎮皇都鑾遊眺八區原隰旌門裏風雲扆坐隅直城如斗柄官樹似星榆從臣詞賦末濫得上天衢蘇頲云仙蹕御層氛高高積翠分巖聲中谷應天語半空聞豊樹連黄道秦關入紫雲聖圖恢㝢縣歌賦小横汾武平一云鑾輿上碧天翠帟拖晴煙絶崿紆仙逕層巗敞御筵雲披丹鳳闕日下黑龍川更覩南薰奏流聲入管絃景龍四年正月五日移仗蓬萊宫御大明殿㑹吐蕃騎馬之戯因重爲栢梁體連句帝曰大明御㝢臨萬方曰皇后顧慙内政翊陶唐公主曰長寧鸞鳴鳳舞向平陽主曰安樂公秦樓魯館沭恩光主曰太平公無心爲子輙求郎茂曰温王重雄才七歩謝陳王官曰昭容上當熊讓輦愧前芳崔湜曰吏部侍郎再司銓管恩可忘郎鄭著作曰愔文江學海恩濟航武平一曰考功員外郎萬邦考績臣所詳朝隱曰著作郎著作不休出中膓時上疑御史大夫竇從一將作大匠宗晉卿素不属文未即令續二人固請許之從一曰權豪屏跡肅嚴霜晉卿曰鑄鼎開嶽造明堂此外遺忘時吐蕃舍人明􅊖獵請令授筆與之曰玉醴由來獻壽觴上大恱賜與衣服唐詩紀事卷第一
