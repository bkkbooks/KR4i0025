  text: 唐詩紀事卷第四
  hash: sha256:0640011dfb25c7daed90e83794a25a891c495ea65b2d4556b13b6b00700f674a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_004-1a}
body:
  text: 王圭禇亮虞世南蔡允恭許敬宗劉孝孫魏徵楊師道岑文本李百藥來濟長孫無忌杜正倫馬周李義府陳子良杜之松崔善為王績王圭詠漢髙祖云漢祖起豐沛乘運以躍鱗手奮三尺劒西滅無道秦十月五星聚七年四海賔髙抗威宇宙貴有天下人憶昔與項王契闊時未伸鴻門既薄蝕榮陽亦蒙塵蟣虱生介胄將卒多苦辛瓜牙驅信越腹心謀張陳赫赫西楚國化為丘與榛詠淮陰侯韓信云秦王日凶慝豪傑爭共亡信亦胡為者劒歌從項梁項羽不能用脫身歸漢王道契君臣合時來名位彰北討燕承命東驅楚絶糧斬龍堰濉水擒豹潛夏陽功成享天祿建旗還南昌金千答漂母錢百酬下鄉吉凶成糾纆倚伏難預詳弓藏狡兔盡慷慨令心傷圭字叔玠相太宗母李最賢老杜詩有我之曽老姑爾之髙祖母謂李也禇亮字希明錢塘人警敏工為詩正觀中為散騎常侍武德四年太宗為天䇿上將軍宫城西開文館下教以杜如晦房元齡于志寧蘇世長薛收禇亮姚思廉陸德明孔頴達李玄道李守素虞世南蔡允恭顔相時許敬宗薛元敬蓋文達蘇朂並以本官為學士收卒以劉孝孫補之使亮為贊奉和詠日午詩云曦車日亭午浮箭未移暉日灮無落照樹影正中圍草萎看靡稱葉燥望疑稀晝寢慙經笥暫解入朝衣燭花詩云蘭徑香風滿梅梁暖日斜言是東方騎來尋南陌車靨星臨夜燭眉月隱輕紗莫言春稍晚自有鎮開花賦得蜀都詩云列宿灮輿井分土跨梁岷沉犀對江浦駟馬入城闉英圖多霸迹歷選有名臣連騎簮纓滿含章詞賦新得上仙槎路無待訪嚴遵秋鴈云日暮霜風急羽翮轉難任為有傳書意翩翩入上林秋享送文舞用舒和歌云御扆合宮承寶曆帝圖重館奉明靈偃武修文九圍泰沉烽靜拆八荒寧祀五方用舒和歌云笙歌籥舞蜀年韶鷺鼓鳬鐘展時豫調露初迎綺春節承雲遽踐蒼霄馭樂府詞云髙臺暫俯臨飛翼聳輕音浮灮隨日度漾影逐波深逈瞰周平野開懷暢逺襟獨此三休上還傷千里心奉和禁苑餞別應令詩云大藩初錫瑞出牧邇皇京暫以緑車重言承朱邸榮舒桃臨逺騎垂栁映軍營惠化宣千里威風動百城禁蘌芳嘉節神襟餞送情金笳催別景玉管切離聲野花開且落山鳥哢還驚微臣夙多幸薄官奉儲明釣臺慙作賦伊水濫聞笙懷德良知久酬恩識命輕和望月應魏王教詩云層軒澄皎月流照滿中天色共梁珠逺灮隨趙璧圓落影臨秋扇虛輪入夜仙所欣東館裏預奉西園篇虞世南和鸞輿頓戲下詩云重輪依紫極前耀奉丹霄天經戀宸扆帝命扈仙鑣乘星開鸖禁帶日下虹橋銀書含曉色金輅轉晨飈霧徹軒營近塵暗苑城遙蓮花分秀蕚竹箭下驚潮撫已慙龍幹承恩集鳳條瑶山盛風樂抽簡薦徒謡侍宴應詔詩云芬芳禁林晚容與桂舟前橫空一鳥度照水百花燃緑野明斜日青山淡晚煙濫得陪終宴握管類窺天奉和詠日午詩曰髙天淨秋色長漢轉曦車玉樹陰初正桐圭影未斜翠蓋飛圓影明鏡發輕花再中良表瑞共仰璧輝賖奉和月夜觀星應令詩曰早秋炎景暮初絃月彩新清風滌暑氣零露淨嚻塵薄霧銷輕縠鮮雲卷夕鱗休灮灼前曜瑞彩接重輪緣情摛聖藻並作命徐陳宿草誠渝濫吹噓偶搢紳天文豈易述徒知仰北辰又春夜詩云春苑月徘徊竹堂侵夜開驚鳥排林度風花隔水來凌晨早朝云萬瓦霄灮曙重簷夕霧收玉花停夜燭金壺送曉籌日暉青鎖殿霞生結綺樓重門啓應路通籍引王侯詠舞詩云繁絃奏淥水長袖轉回鸞一雙俱應節還似鏡中看賦得吳都詩云畫野通淮泗星躔應斗牛玉牒宏圖表黃旗美氣浮三分開霸業萬里宅神州髙臺臨茂苑飛閣跨沉流江濤如素蓋海氣似朱樓吳越自有樂還似鏡中逰賦飲馬長城窟云馳馬渡河干流深馬渡難前逢錦車使都護在樓蘭輕騎猶銜勒疑兵尚解鞍溫池下絶棧澗道接危巒拓地勳未賞亡城律詎寬有月關猶暗經春隴尚寒雲昏無復影氷合不聞湍懷君不可遇聊持報一餐賦鸖云飛來雙白鸖奮翼達凌煙俱棲集紫蓋一舉背青田揚影過伊落流聲入管絃鳴儔倒景外刷羽閬風前顧步已相失徘徊各自憐危心猶警露哀響詎聞天無因振六翮輕舉復隨仙賦結客少年場云韓魏各竒節倜儻遺名利共矜然諾心各負縱橫意結友一言重相思千里至緑沈明月絃金絡浮雲轡吹簫入吳市擊築逰燕肆尋源博望侯結客逺相求少年垂一顧長驅背隴頭焰焰戈霜動耿耿劒虹浮天山冬夏雪交河南北流雲起龍沙暗木落鴈行秋輕生徇知已非是為身謀怨歌行云紫殿秋風冷雕甍落日沉裁紈悽斷曲織素别離心掖庭若改晝長門不惜金寵移恩稍薄情踈恨轉深香銷翠羽帳絃斷鳳凰琴鏡前紅粉歇階上緑苔侵誰言掩歌扇翻作白頭吟門有車馬客云陳遵重交結田蚡擅豪華曲臺臨上路髙門抵狹邪赭汗千里馬繡轂五香車白鸖隨飛蓋朱鷺入鳴笳夏蓮開劒水春桃發綬花輕裙染回雪浮蟻泛流霞逢恩借羽翼失路委泥沙擬古云塗山烽候驚弭節度龍城冀馬樓蘭將燕犀上谷兵劒寒花不落弓曉月逾明凛凛嚴霜節氷壯黃河絶蔽日卷征蓬浮天散飛雪全兵值月滿精騎乘膠折結髮早驅馳辛苦事旌麾馬凍重關冷輪摧九折危漢有西山將年年屬數竒爟火發金微連營出武威孤城寒雲起絶陳虜塵飛俠客吸龍劒惡少縵胡衣朝摩骨都壘夜解谷蠡圍蕭關逺無極蒲海廣難依沙鐙離旌斷晴川候馬歸凶河梁已畢燕山斾欲揮方知萬里相侯服有灮輝顔師古隋朝遺事載洛陽獻合蒂迎輦花煬帝令袁寶兒持之號司花女時詔世南草征遼指揮德音敕於帝側寶兒注視久之帝曰昔傳飛燕可掌上舞今得寶兒方昭前事然多憨態今注目於卿卿才人可便嘲之世南為絶句曰學畫鴉黃半未成垂肩嚲袖太憨生緣憨却得君王惜長把花枝傍輦行世南越州人仕太宗帝每稱其有五絶德行忠直博學文詞書翰也既卒帝曰世南於我猶一體拾遺補闕無日忘之蓋當代名臣人倫凖的今其云亡石渠東觀中無復人矣蔡允恭允恭在隋時奉和出頴至淮詩云久倦川塗曲忽此望淮圻波長泛渺渺晚逈情依依稍覺金烏轉漸見錦帆稀欲知仁化洽謳歌逺路歸允恭荆州江陵人工為詩在隋時煬帝有所賦必令諷誦遣教宫人允恭耻之授內史舍人固辭繇是踈斥隋亡歸唐正觀初除太子洗馬卒許敬宗奉和正日臨朝云天正開初節日觀上重輪百靈滋景祚萬土慶惟新待旦敷玄造韜旒御紫宸武帳臨灮宅文衛象鈎陳廣庭楊九奏大帛麗三辰發生同化育播物體陶鈞霜空澄曉氣靄景瑩芳春德暉覃率土相賀奉還淳奉和七夕應制云牛閨臨淺漢鸞駟涉秋河兩河縈别緒一宿慶停梭星模鉛裏靨月寫黛中娥奈許令霄度長嬰離恨多又應制婺閨期今夕娥輪泛淺潢迎秋伴暮雨待瞑合神灮薦寢低雲鬢程態解霓裳喜中怨漏促別後怨天長七夕賦詠云一年抱怨嗟長別七夕含言始能歸飄飄羅襪灮天步灼灼新粧鑒月輝情催巧笑聞星靨不惜呈露解雲衣所歎却隨更漏盡掩泣還弄昨霄機敬宗字延族杭州人太宗時檢校黃門侍郎髙宗時中書令在唐史姦臣傳劉孝孫詠笛詩云涼秋夜鳴笛流風詠九成調髙時慷慨曲變或凄清征客懷離緒鄰人思舊情幸以知音顧千載有髙聲早發成臯望河詩云清晨發巗邑車馬走轘轅回瞰黃河上倘恍屢飛魂鴻流導積石驚浪下龍門仙槎不辨處沉璧想猶存逺近洲渚出颯沓鳬鴈喧懷古空延佇歎逝將何言孝孫荆州人正觀六年遷太子洗馬未拜卒魏徵正日臨朝應詔詩曰百靈侍軒后萬國會塗山豈如今睿哲邁古獨灮前聲教溢四海朝宗别百川鏘洋鳴玉珮灼爍耀金蟬淑景輝雕輦髙旌楊翠煙庭實超王會廣樂盛鈞天既傾東日户復詠南風篇願奉灮華慶從斯萬億年出關作云中原初逐鹿投筆事戎軒縱橫計不就慷慨志猶存杖策謁天子驅馬出關門請纓係南越憑軾下東蕃鬱紆陟髙岫出沒望平原古木吟寒鳥空山啼夜猿既傷千里目還驚久逝魂豈不憚艱險深懷國士恩季布無二諾侯嬴重一言人生感意氣功名誰復論徵字元成魏州人相太宗致太平天下既治懼帝喜武功嘗賦詩曰終藉叔孫禮方知皇帝尊帝曰徵言未嘗不約我以禮徵亡帝賦詩曰望望情何極浪浪淚空泫無復昔時人芳春共誰遣太宗在洛陽宮幸積翠池宴酣各賦一事帝賦尚書曰日吳玩百篇臨燈披五典夏康既逸豫商辛亦流湎恣情昏主多克已明君鮮滅身資纍惡成名由積善徵賦西漢曰受降臨軹道爭長趣鴻門驅傳渭橋上觀兵細栁屯夜宴經柏谷朝逰出杜原終藉叔孫禮方知皇帝尊帝曰徵言未嘗不約我以禮楊師道字景猷清警有才思正觀十年拜侍中參預朝政後為太常卿每與文士宴歌詠自適帝見其詩為擲諷嗟賞後賜宴帝曰聞公每酣賞捉筆賦詩如宿成試為朕為之師道再拜少選輒成無所竄定一坐嗟伏春朝間步詩云偃沐乘間豫清晨步出林池塘籍芳草蘭芷襲幽襟霧中分曉日花裏哢春禽野徑香常滿山階筍屢侵何須命輕蓋桃李自成隂又初秋夜坐應詔詩云玉琯涼初應金壺夜漸闌蒼池流稍潔仙掌露方圑鴈聲風處斷樹影月中寒爽氣長空淨髙吟覺思寒賦終南山用風字韻應詔詩云眷言懷隱逸輟駕踐幽叢白雲飛夏雨碧嶺冠春虹草緑長揚路花踈五祚宮登臨日將晚蘭桂起香風詠硯云圓池類璧水輕翰染煙華將軍欲見逺見棄不應賖詠飲馬應詔詩云寶馬權竒出未央雕鞍照耀紫金裝春草初生馳上苑秋風欲動醉長楊鳴珂屢度章臺側細蹀經向濯龍傍徒令漢將連年去宛城今已獻名王詠弓詩云霜重麟膠徑風髙月影圓烏飛隨帝輦鴈落逐鳴弦還山宅詩云暮春還舊嶺徙倚玩年華芳草無遙徑空山正落花垂藤掃幽石卧栁礙浮槎鳥散茅簷靜雲披澗户斜依然北泉路猶是昔煙霞彈鳴琴詩云北林鵲夜飛南軒月馭進調弦發清徵蕩心祛𥚹吝變作離鴻聲還入思歸引長歎未終極秋風飄素鬢又詠琴詩云久擅龍門質孤竦嶧陽名齊娥初發弄趙女正調聲嘉客勿遽反繁弦曲未成詠笙詩云短長插鳳翼洪細摹鸞音能令楚妃歎復使荆王吟切切孤竹管來應雲和琴詠舞云二八如回雪三春類早花分行向燭轉一種逐風斜又詠飲馬應詔曰清晨控龍馬弄影出花林躞蹀依春澗聮翩度碧潯苔流染絲絡水潔寫調音一御瑶池駕詎憶長城陰賦隴頭水云隴頭秋月明隴水帶關城笳添離別曲風送斷腸聲映雪峰猶暗乘氷馬屢驚霧中寒鴈至沙上轉蓬輕天山傳羽檄漢地急徵兵陳門都護道劒聚伏波營於兹覺無渡方共濯朝纓正日臨朝應詔云皇猷被寰宇端扆屬元辰九重麗天色千門臨上春岑文本字景仁鄧州人中書侍郎顔師古以譴罷太宗曰朕自舉一人乃授文本侍郎專典機要奉和元日臨朝云時雍表昌運日正叶靈符德兼三代禮功包四海圖踰沙紛在列執玉儼相趨清蹕喧輦道張樂駭天衢拂霓九旗映儀鳳八音殊佳氣浮仙掌薰風繞帝梧天文光七政皇恩被九區方陪瘞玉禮珥筆岱山隅奉述飛白書勢詩云六文開玉篆八體曜銀書飛毫列錦繡拂素起龍魚鳳舉崩雲絶鸞驚逰霧踈別有臨池草恩霑垂露餘李百藥字重規定州人隋內史令德林子也翰藻沈鬱詩尤其所長樵厮皆能諷之正月臨朝應詔詩云化曆昭唐典承天順夏正百樂警軒禁三辰揚斾旌充庭富禮樂髙宴齒簮纓獻壽符萬嵗移風韻九成少年詞云始酌文君酒新吹弄玉簫少年不歡樂何以盡芳朝千金笑裏靣一榒掌中腰挂冠豈憚宿迎拜不勝嬌寄語少年子無辭歸路遙郢城懷古云客心悲暮序登墉瞰平陸林澤窅芊綿山川鬱重復王公資設險名都拒江隩方城疑北門溟海窮南服長策挫吳豕雄圖競周鹿大搜雲夢掩壯觀章華築人世更不競西師日侵蹙運圯屬驅馳時屯恣敲朴莫救夷陵火無復秦庭哭鄢郢遂丘墟風塵俄慘黷狐兔時逰踐霜露日霑沐鈞渚故池平神臺層宇覆陳雲埋夏首窮陰慘荒谷帳矣洲壑遷悲哉年祀倐雖異三春望終傷千里目百藥七歲能屬文聞中書舍人陸乂嘗過其父德林有説徐陵文者云刈琅琊之稻坐客並不識其事百藥進曰傳稱鄅人藉稻注云鄅國在琅琊開陽縣人皆驚喜云此兒即神童百藥幼多疾父母以百藥為名名臣之子才行相繼四海名流莫不宗仰藻思沉鬱尤長五言雖樵童牧子亦皆吟諷及懸車告老怡然自得穿池築山文酒談賔以盡平生之志年八十五先是和太宗帝京篇手詔曰卿何身之老而才之壯齒之宿而意之新乎子安期永徽末遷中書舍人自德林至安期三代掌制誥安期孫羲仲又為中書舍人賔録出談來濟楊州人父護兒濟正觀十八年初置太子司議郎髙其選以濟為之永徽中為相世謂護兒兒作相世南男作匠是也濟出玉關絶句云斂轡遵龍漢銜悽渡玉關今日流沙外垂涕念生還太宗餞中書侍郎來濟詩云暖暖去塵昏灞岸飛飛輕蓋指河梁雲峰衣結千重葉雪岫花開幾樹粧深悲黃鸖孤舟逺獨歎青山別路長聊將分袂霑襟淚還用持添離席觴長孫無忌無忌嘲歐陽詢形狀猥陋云聳膞成山字埋肩畏出頭誰家麟閣上畫此一彌猴詢應聲曰索頭連背暖漫襠畏肚寒祇緣心渾渾所以靣團團大宗笑曰詢殊不畏皇后耶太宗嘗謂唐儉酒杯流行發言可喜是時天下初定君臣俱欲無為酒杯善謔理亦有之髙宗雖不君然亦深察事機當時諸王鬬雞王勃在沛王府戲為文檄英王雞帝見之大怒曰此殆交結之漸即日竄勃以太宗之賢杯酒一時之樂何足為後世戒及其弊也中宗詔羣臣曰天下無事欲與羣臣共樂於是回波艷辭妖冶之舞作於文字之臣而綱紀蕩然矣創業之難也一觴一詠足以肇亂况其甚焉者哉杜正倫相州人工屬文嘗與中書舍人董思恭夜直論文思恭歸謂人曰與杜公評文今日覺吾頓進顯慶初為相侍宴北門詩云大君端扆暇􅌖賞狎林泉開軒臨禁籞藉野列芳筵參差歌管揚溶泄羽旗懸玉池流若釀雲閣聚非煙湛露晞堯日薰風入舜絃大德侔玄造微物荷陶甄謬陪瑤水宴仍厠柏梁篇闞名徒十月鄒辨詎談天既喜灮華旦還傷遲暮年猶冀升中日簮裾奉肅然疑以傳疑闞名徒十月馬周凌朝浮江旅思詩云太清上初日春水送孤舟山逺疑無樹潮平似不流岸花開且落江鳥沒還浮羈望傷千里長歌遣四愁周字賔王博州人嗜學善詩春秋天資曠邁武德中補州助教不治事刺史達奚怒數咎責周乃去客密州趙仁本高其才厚以資使入關留客汴為浚儀令崔賢所辱遂感激而西至長安客常何家正觀五年太宗召之後為中書令李義府遙敘封禪詩云天齊摽巨鎮日觀啓崇祠岹嶢臨渤澥隱嶙控河沂建嶽誠為長升功亮在兹帝猷符廣運玄範暢文思飛聲總地絡載化撫乾維瑞䇿開真鳳禎圖薦寶龜東后方肆覲西都道六師肅駕移星苑楊罕馭風司沸鼓喧平陸凝蹕靜通逵汶陽馳月羽蒙陰驚電輜巗花飄曙輦峰葉蕩春旗石間環藻衛金壇映黼帷仙階溢祕秬靈險耀祥芝三始貽遐貺萬嵗受重釐菲質陶恩奬趨迹奉軒墀觸網淪幽裔乘徼限明時周南昔已歎卭西今復悲詠鶯鵡詩云牽弋辭重海觸網去層巒戢翼雕籠際延思彩霞端慕侣朝聲切離羣夜影寒能言殊可賞相助憶長安高宗朝義府常賦詩曰鏤月為歌扇裁雲作舞衣自憐回雪影好取洛川歸有棗強尉張懷慶好偷竊名士文章乃為詩曰生情鏤月為歌扇出性裁雲作舞衣照鑑自憐回雪影來時好取洛川歸時人為之語曰活剝張昌齡坐吞郭正一義府初遇以李大亮劉洎之薦太宗召令詠烏義府曰日裏揚朝彩琴中聞夜啼上林如許樹不借一枝棲帝曰與卿全樹何止一枝義府擅殺寺丞畢正義王義方彈義府疏云臣聞履霜堅氷積小成大請乞重勘當畢正義致死之由雪寃象於幽泉誅姦臣於白日對叱伏義府不退義方三叱上既無言義府趨出義方乃讀彈文義府善柔成性佞媚為心昔事馬周分桃見寵後交劉洎割袖承恩生其羽翼長其灮價因緣際會遂階通達不能盡忠端節對揚王休䇿蹇勵駑祗奉皇眷而反憑附城社蔽虧日月請託公行交逰群小貪冶容之好原有罪之淳于恐漏泄其謀殞無辜之正義雖挾山超海之力望此猶輕回天轉日之威方斯更劣此如可恕孰不可容金風戒節玉露啓途霜簡與秋典共清忠臣將鷹鸇並擊請除君側少益鴻私碎首玉階庶明臣節伏請付法推斷以申典憲義府其先瀛州人與來濟俱以文翰顯時稱來李永徽六年為相王義方庭劾之帝隂德義府故貸不問為抑義方逐之俄進中書令後以罪流振州朝野相賀陳子良詠雪云灮映粧樓月花承歌扇風欲妬梅將柳故落早春中七夕看新婦隔巷停車詩云隔巷遙停幰非復為來遲只言更尚淺未是渡河時得妓詩云微雨散芳菲中園照落暉紅樹遙歌扇緑珠飄舞衣繁絃調對酒雜引動思歸愁人當此夕羞見落花飛新宫詞云春色照蘭宫秦女旦窗中栁葉來眉上桃花落臉中拂塵開扇匣卷帳却熏籠衫薄偏憎日裙輕更畏風子良吳人與蕭德言庾抱同為太子學士正觀六年卒杜之松和衛尉寺栁詩云漢將本屯營遼河有戍城大夫曽取姓先生曾得名髙枝拂逺鴈踈影度遙星不辭攀折苦為入管絃聲之松正觀中為河中刺史答王績書云辱書知不降顧艱恨何已僕幸恃故情庶回高躅豈意康成道重不許太守稱官老萊家居羞與諸侯為友延佇不獲如何竒迹獨全幸甚幸甚敬想結廬人境植杖山河林壑地之所豐煙霞性之所適蔭丹桂藉白茅濁酒一杯清琴數弄誠足樂也此真髙士何謂狂生僕憑藉國恩濫尸貴部官守有限就學無因延頸下風我勞何極前因行縣實欲秪尋誠恐燉煌孝廉守琴書而不出酒泉太守列鐘鼓而空還所以遲回遂攬轡也僕雖不敏頗識前言道既知尊榮何足恃豈不能正平公之坐敬養亥唐屈文侯之膝恭師子夏雖齊桓德薄五行無疑雎夸人一來何損蒙借家禮今見披尋微而精簡而備誠經傳之典略閨庭之要訓也以傳疑雎夸人疑崔善為吕才序王無功文集云君河中有渚田十數頃又有隱士仲長子灮服食養性君遂結廬河渚正觀中京兆杜之松清河崔善為繼為州刺史皆召之君曰奈河坐召君平耶答無功冬夜載酒鄉館詩云頒條忝貴郡懸榻久相望處士同楊鄭邦君謝李強詎知方擁篲逢子敬惟枽明朝蓬户側會自謁任棠答無功九日詩秋來菊花氣深山客重尋露葉疑㴠玉風花似散金摘來還泛酒獨坐即徐斟王弘貪自醉無復覔楊林善為貝州人武德中歷尚書左丞諸曹吏惡其聽察嘲其短傴曰崔子曲如鈎隨例得封侯髆上全無項腦前别有頭髙祖勞之曰齊末姦吏歌斛律明月高緯昏不察至滅其家朕雖不德幸免是下令求謗者謗遂止卒於秦州刺史王績晚年敘志示翟處士正師云弱齡慕竒調無事不兼修望氣登重閣占星上小樓明經思待詔學劎覔封侯棄繻頻北上懷刺幾西遊中年逢喪亂非復昔追求失路青門隱藏名白社逰風雲私所愛屠博暗為儔解紛曽霸越釋難頗存周晚嵗聊長想生涯太若浮歸來南畝上更坐北溪頭古岸多磐石春泉足細流東隅誠已謝西景懼難收無謂退耕近伏念已經秋庾枽逢處跪陶潛見人羞三晨寧舉火五月鎮披裘自有居常樂誰知身世憂建德破後入長安詠秋蓬示辛學士云遇坎聊知止逢風忽未歸孤根何處斷輕葉強能飛辛答云託根雖異所飄葉早相依因風若有便更共入雲飛辛氏不知録於此之名今古意云幽人在何所紫嵓有仙躅月夜橫寶琴此外將安欲材抽嶧山幹徽點昆丘玉漆抱蛟龍唇絲纒鳳凰足前彈廣陵罷後以明灮續百金買一聲千金傳一曲世無鐘子期誰知心所屬竹生大夏溪蒼蒼富竒質緑葉吟風徑翠莖犯霄密霜霞封其柯鴛鸞食其實寧知軒轅後更有伶倫出刀斧俄見尋根株坐相失裁為十二管吹作雄雌律有用雖自傷無心復招疾不如山上草離離保終吉寶龜尺二寸由來宅深水浮遊五湖內宛轉三江裏何不深復深輕然至溱洧溱洧源流狹春秋不濡軌漁人遞往還網罟相縈藟一朝失運會刳腸血流死豐骨輸廟堂鮮腴籍籩簋棄置誰怨尤自我招此否餘靈寄明卜復來欽所履松生北巗下由來人徑絶布葉捎雲煙插根擁巗穴自言生得地獨負凌雲潔何時畏斤斧幾度經霜雪風驚西北枝雹隕東南節不知歲月久稍覺枝幹折藤蘿上下碎枝幹縱橫裂行當縻爛盡坐共灰塵滅寧關匠石顧豈為王孫折盛衰自有時聖賢未嘗屑寄言悠悠者無為嗟大耋桂樹何蒼蒼秋來花更芳自言歲寒性不知露與霜幽人重其德徙植臨前堂連拳八九樹偃蹇二三行枝枝自相糾葉葉還相當去來雙鴻鵠栖息兩鴛鴦榮蔭誠不厚斤斧亦勿傷赤心許君時此意那可忘彩鳳欲將歸提羅出郊訪羅張大澤已鳳入重雲揚朝栖昆閬木夕飲蓬壺漲問鳳郍逺飛賢君坐相望鳳言何深德微禽安足尚但使雛卵全無令繒繳放皇臣力牧舉帝樂簫韶暢自有來巢時明年阿閣上春日詩云前旦出園逰林華都未有今朝下堂來池水開已久雪被南軒梅風催北庭栁遙呼竈前妾却報機中婦年灮恰恰來滿甕營春酒績字無功絳州人兄通大儒也績誕縱與李播吕才善大業末仕為六合丞嗜酒不任事因解去居河渚間與仲長子灮友以周易老子置牀頭他書罕讀也著五斗先生傳醉鄉記無心子傳豫知終日自志其墓自號東臯子唐詩紀事卷第四
