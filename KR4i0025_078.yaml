  text: 唐詩紀事卷第七十八
  hash: sha256:c746933ee4d99e8dad1dacf4ae35da7032d6a43515108289dfe7f63e9001cf32
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_078-1a}
body:
  text: 開元宫人楊氏女薛彥輔母林氏崔氏劉氏慎氏薛媛李季蘭侯氏如意中女子魚玄機僖宗宫人張建封妓女道士元淳裴柔之宫女開元宫人開元中賜邊軍纊衣製於軍中有兵士於短𫀆中得詩曰沙場征戍客寒苦若為眠戰𫀆經手作知落阿誰邊蓄意多添線含情更著綿今生巳過也重結後生緣兵士以詩白帥帥進呈玄宗以詩遍示宫中曰作者勿隱不汝罪也有一宫人自言萬死上深閔之遂以嫁得詩者謂曰吾與汝結今生緣邊人感泣楊氏女盈川姪女曰容華有新粧詩云宿鳥驚眠罷房櫳乘曉開鳯叉金作鏤鸞鏡玉為臺粧似臨池出人疑月下來自憐終不見故厺復徘徊韓彥輔母林氏送男左貶詩云他日初投杼勤王在隱兵有辭期不罰積意許相仍謫宦今何在御冤猶未勝天涯分越徼驟騎速毗陵腸斷腹非苦書傳寫豈能泪添江水逺心劇海雲蒸明月珠難識甘泉賦可稱但將忠報主何懼點青蠅彥輔開元時登進士第右按薛播伯父元曖終於隰城丞其妻濟南林氏丹陽太守洋之妹善屬文有子彥輔彥國彥偉彥雲及播兄據總並早孤悉為林氏訓導立名開元天寶間彥輔劇等七人並舉進士連中科名衣冠榮之崔氏盧校書年暮取崔氏結䄜之後為詩曰不怨盧郎年紀大不怨盧郎官職卑自恨妾身生校晚不及盧郎年少時劉氏或云趙氏杜羔不第將至家其妻劉氏先寄詩云良人的的有竒才何事年年𬒳放回如今妻靣羞君靣君到來時近夜來羔即回尋登第又寄詩云長安此厺無多地鬱鬱蔥蔥佳氣浮良人得意正少年今夜醉眠何處樓雜言寄杜羔云君從淮海遊再過杜蘭秋歸來不須臾又欲向梁州梁州秦嶺西棧道與雲齊羌虜萬餘落戟矛自髙低已念寡儔似復慮勞攀躋丈夫重志氣女兒空悲啼臨卭滯遊地肯顧濁水泥人生賦命有厚薄君自遨遊我寂寞羔登貞元年進士第終工部尚書贈右僕射制云生於士族藴為公器敦厚孝友本乎天性文學政事出於餘力自立朝右藹然素風司諌平刑駮訤廉問凡所踐歷不懈于位以年致政以疾就弟出處進退皆叶時中有詩墮李益門白樂天之詞也羔羔有至性父死河北母不知所之羔憂號終日後竟得其母又不知其父墓處復得其墓於佛相柱下後歷振武節度使愼氏毗陵愼氏三史嚴灌夫之妻以無子𬒳出有詩曰當時心事已相關雨散雲收一餉間便是孤帆從此去不堪重過望夫山遂如𥘉友議雲溪薛媛濠梁南楚材旅遊陳頴受頴牧之眷無返舊意其妻薛媛寫真寄之曰欲下丹青筆先拈寶鏡端已驚顔索寞漸覺鬢凋殘泪眼描將易愁腸寫出難恐君渾忘却時展畫啚看夫婦遂偕老焉友議雲溪時人嘲之曰當時婦棄天今日夫棄婦若不逞丹青空房應獨守李季蘭三峽流泉歌云妻家本住巫山雲巫山流水常自聞玊琴奏出轉寥敻直似當時夢中聽三峽迢迢幾千里一時流入幽闈裏巨石崩崕指下生飛浪逺波絃中起初疑噴怒含雷風復似嗚咽流不通回湍曲瀨意將盡時復滴瀝平沙中憶昔元公為此曲能使仲容聽不足一彈既畢還一彈願北流泉鎮相續寄韓校書云無事烏程縣蹉跎歲月餘不知蘭閣吏寂寞意何如逺水浮仙棹寒星伴使車因過大雷岸莫忘八行書結素魚貽友人云尺素如殘雪結為雙鯉魚欲知心裏事看取腹中書得閻伯鈞書云情來對鏡懶梳頭暮雨蕭蕭庭樹秋莫怪欄杆垂玉筯只緣惆悵對銀鈎送韓撥之江西云相看指楊柳别恨轉依依萬里江西水孤舟何處歸湓城潮不到夏口信應稀唯有衡陽鴈年年來厺飛季蘭五六歲其父抱於庭作詩詠薔薇云經時未架却心緒亂縱橫父恚曰此必為失行婦也後竟如其言高仲武云士有百年女有四德季蘭則不然形器既雄詩意亦蕩自鮑昭已下罕有其倫如逺水浮仙棹寒星伴使車此五言之嘉境也上方班媫妤則不足下北韓英則有餘不以遲暮亦一俊嫗劉長卿謂季蘭為女中詩豪侯氏會昌中邊將張暌防戎十年餘其妻侯氏繡回文作龜形詩詣闕進之詩云暌離已是十秋強對鏡那堪重理粧聞鴈幾回修尺素見霜先為製衣裳開箱疊練先垂泪拂杵調砧更斷腸繡作龜形獻天子願教征客早還鄉侯氏賜絹三百匹以彰才美出杼情詩如意中女子如意中女子年九歲能吟詩則天試之皆應聲而就其兄辭去則天令作詩送兄遂賦云别路雲愁起離亭葉正稀所嗟人異鴈不作一行飛出唐宋遺史裴柔之元微之自會稽拜尚書右丞到京未踰月出鎮武昌裴夫人柔之難之曰歲杪到家鄉先春又赴任鎮即贈詩曰窮冬到鄉國正歲别京華自恨風塵眼嘗看逺地花碧憧還照曜紅粉莫咨嗟嫁得浮雲壻相隨即是家柔之答曰侯門𥘉擁節御苑柳絲新不是悲殊命唯愁别是親黃鶯遷古木珠履從清塵想到千山外滄江正暮春魚玄機臨江樹云草色連荒岸煙姿入逺樓葉鋪秋水靣花落釣人頭根老藏魚窟枝低拂客舟作傍拂一蕭蕭風雨夜驚夢復添愁玄機咸通中西京咸宜觀女道士也字幼微善屬文其詩有綺陌春望逺瑶徽春興多又殷勤不得語紅泪一雙流又焚香登玉壇端簡禮金闕又雲情自鬱爭同夢仙貌長芳又勝花後以笞殺女童緑翹事下獄獄中有詩云易求無價寶難得有情夫又云明月照幽隙清風開短襟僖宗宫人唐僖宗自內出袍千領賜塞外吏士神䇿軍馬真於袍中得金鎖一枚詩二首云玉燭製袍夜金刀呵手裁鎖寄千里客鎖心終不開真就市貨鎖為人所告主將得其詩奏聞僖宗令赴闕以宫人妻真後僖宗幸蜀真晝夜不解衣前後捍禦張建封妓樂天有和燕子樓詩其序云徐州張尚書有愛妓眄眄善歌舞雅多風態為校書郎時遊淮泗間張尚書宴豫酒酣出眄眄佐歡豫因贈詩落句云醉嬌聲不得風嫋牡丹花一歡而去爾後絶不復知兹一紀矣昨日司勳員外郎張仲素繪之訪余因吟詩新有燕子樓詩三首辭甚婉麗詰其由乃眄眄所作也繪之從事武寧纍年頗知眄眄始末云張尚書既歿彭城有張氏舊第中有小樓名燕子眄眄念舊愛而不嫁居是樓十餘年于今尚在眄眄詩云樓上殘燈伴曉霜獨眠人起合歡床相思一夜情多少地角天涯不是長又云北印松柏鎖愁煙燕子樓中思悄然自埋劍履歌塵散紅袖香銷一十年又云適看鴻鴈嶽陽回又覩玄禽逼社來瑶瑟玉簫無意緒任從蛛網任從灰余嘗愛其新作乃和之云滿窗明月滿簾霜𬒳冷燈殘拂卧床燕子樓中寒月夜愁來祗為一人長鈿帶羅衫色似煙幾回欲起即潛然自從不舞霓裳袖疊在空箱二十年今春有客洛陽回曽到尚書墓上來見説白楊堪作柱忍教紅粉不成灰又贈之絶句黃金不惜賣娥眉揀得如花四五枝歌舞教成心力盡一朝身厺不相隨後仲袁以余詩示眄眄乃反覆讀之泣曰自公薨背妾非不能死恐百載之後人以我公重色有從死之妾是玷我公清範也所以偷生爾乃和白公詩云自守空樓斂恨眉形同春後牡丹枝舍人不會人深意訝道泉臺不厺隨眄眄得詩後往往旬日不食而卒但吟詩云兒童不識沖天物謾把青泥汚雪毫出長慶集宫女天寶末宫娥衰悴不願備宫掖有落葉題詩隨御水而流云舊寵悲秋扇新恩寄早春聊題一紅葉將寄接流人顧况聞而和之云愁見鶯啼柳絮飛上陽宫女斷腸時君恩不禁東流水葉上題詩寄與誰既逹宸聰由是遣出禁中者有五使之號焉宣宗朝又有題紅葉隨流者為盧渥得之詩曰水流何太急深宫盡日間殷勤謝紅葉好厺到人間女道士元淳寄洛中諸姊云舊國經年别關河萬里思題詩憑鴈翼望月想蛾眉白髮愁偏覺歸心夢獨知誰憑離亂處掩泣向南枝唐詩紀事卷第七十八
