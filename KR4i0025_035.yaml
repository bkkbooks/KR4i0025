  text: 唐詩紀事第三十五
  hash: sha256:791cb9c7d2f141c845c271e5508a21319c26111c2c22b8fc5fa495e0026b9c01
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_035-1a}
body:
  text: 陸暢崔元翰張建封皇甫湜李翺麴信陵孟郊盧同劉義楊巨源陳羽王履正彭伉辛弦智歐陽詹焦郁袁高陸暢暢字逹夫吳郡人韋臯雅所厚禮天寶時李白為蜀道難以斥嚴武暢更為蜀道易以美臯與注計事斬注首鄭注亂以前少尹嘗吟對雪落句云天人寧底巧剪水作花飛又山齋玩月云野情平生唯好月新晴半夜覩嬋娟起來自擘書窗破教漏清光落枕前又經崔諫議林亭云蟬噪入雲樹風開無主花初為江西王仲舒從事拂衣去後遇雲陽公主下降百僚舉暢為儐相詩皆頃刻而成詠簾曰勞將素手捲蝦鬚瓊室流光更綴珠玉漏報來過半夜可憐潘嶽立躊蹰詠行障曰碧玉為竿丁字成鴛鴦繡帶短長聲強遮天上花顔色不隔雲中笑語聲詔作催粧五言曰雲安公主貴出嫁五侯家天母親調粉日兄憐賜花催鋪柏子帳待障七香車借問粧成未東方欲曉霞內人以其吳音捷才以詩嘲之云十二層樓倚翠空鳳鸞相對立梧桐雙成走報監門衛莫使吳歈人漢宫蘭姊妹作或曰宋若陸酬曰粉面仙郎選世朝偶逢神女學吹簫須教翡翠聞王母不奈烏鳶噪鵲橋六宮大咍别賜宫錦楞伽瓶唾盂各一暢謁韋臯作蜀道易詩云蜀道易易於履平地臯大喜臯薨朝廷欲繩其既往之事復閲先進兵器上皆刻定秦二字不相與者因造成罪名暢上疏理之曰臣在蜀日見造所進兵器定秦者匠名也由此得釋段成式云暢江東人語多差誤人以為劇語初娶董溪女每旦婢進澡豆暢輒沃水服之或曰君為貴門女壻幾多樂事陸曰貴門苦禮法俾豫食辣麨殆不可過張籍贈暢云共踏長安街裏塵吳州獨作未歸身胥門舊宅今誰住君過西塘與問人趙麟儀質瑣陋成名後以薛能為儐相能詩曰第一莫教蛛太過緣人衣帶上人頭又火爐床上平身立便與夫人作鏡臺或曰暢羡而能罵崔元翰名鵬以字行舉進士年五十矣禮侍于邵以其文擢異等曰後當司詔令竇參秉政引知制誥其訓詞溫厚有典誥風以剛褊罷為比部郎中卒晚年方取應咸為首捷京兆解頭禮部狀頭宏詞勑制科三等勑頭權德輿謂其文如黃鐘玉磬琮璧琬琰奏於懸間列在西序其章者雖漢廷諸公無以加也然清剛而不能容物介特寡徒晚達中廢斯亦命之所賦也清明卧病不得遊開元寺詩云山色入層城鍾聲臨復岫乘間息邊事探異憐春候曲閣下重階回廊遙對霤石間花遍落草上雲時覆鑽火見樵人飲泉逢野獸道情親法侶時望登朝右執憲糾姦邪刋書正訛謬茂才當時選公子生人秀贈答繼篇章歡娛重用舊垂簾獨衰疾擊缶酬金奏奉和聖製重陽日百寮曲江宴示懷詩云偶聖覩昌期受恩慙弱質幸逢良宴會况是清秋日逺岫對壺觴沉瀾映簮紱炮羔備豐膳象鳳調鳴律薄劣厠英髦歡娛忘衰疾平臯行鴈下曲渚雙鳬出沙岸菊開花霜枝果垂實天文見成象帝念資勤恤探道得玄珠齋心居特室豈如橫汾唱其事徒嬌逸張建封字本立南陽人少喜文章尚氣節正元四年拜御史大夫徐泗濠節度使十三年來朝帝不待日召見延英殿朝會赴大夫班以示殊寵建封賦朝天行以獻還鎮帝賦詩餞之又賜所持鞭曰卿節誼嵗寒故用此為况建封又賦詩自警勵十六年卒許孟容韓愈皆奏置幕府權載之敘其文曰公贊勳伐表丘隴銘器敘事放言詣理皆與作者方駕而歌詩特優有仲宣之氣質越石之清拔如雪濤溟漲浩漾無際而天球夜光往往在焉其入覲也獻朝天行一篇因喜氣以攄肝膈覽其詞者見公之心焉其還鎮也德宗皇帝紆天文以送别湛恩異倫輝動中朝至於內庭錫宴君唱臣和皆酌六義之英而為一時之盛夫文之病也或牽拘而不能騁或奔放而不自還公則財成心匠揮斥細故英華感槩卓爾其閎大析理研幾泊然其精微全才逸氣與勳力相直盡在是矣皇甫湜湜為出世行云生當為大丈夫斷羈羅出泥塗四散號呶擾俶無隅埋之深淵飄然上浮騎龍披青雲泛覽遊八區經泰山絶大海一長吁西摩月鏡東弄日珠上括天之門直指帝所居群仙來迎塞天衢鳳凰鸞鳥􅙾金輿音聲嘈嘈滿太虛旨飲食兮照疱厨食之不飫飫不盡使人不陋復不愚旦旦狎玉皇夜夜御天姝當御者幾人百千為翻宛宛舒舒忽不自知支消體化膏露明湛然無色芮席濡俄而散漫裴然虛無翕然後搏搏久而蘇精神如太陽霍然照淸都四支為琅玕五藏為璠璵顔如芙蓉頂為醍醐與天地相終始浩漫為歡娛下顧人間溷糞蠅蛆湜不善詩退之和公安陸渾二篇可以想見其怪竒退之詩曰皇甫作詩止睡昏辭䜍出真遂上焚要余和增怪又煩雖欲悔舌不可椚言其語怪而好譏罵也湜字持正睦州新安人擢第為陸渾尉仕至工部郎中下急使酒數忤同省求分司東都留守裴度辟為判官樂天哭皇甫七郎中云志業過玄晏詞華似禰衡多才非福祿薄命是聰眀不得人間夀還留身後名涉江文一首便可敵公卿江歌一篇尢奇持正文甚多涉李翺翺刺史㓪州贈藥山髙僧惟儼詩云練得身形似鸖形千株松下兩函經我來問道無餘説雲在青霄水在瓶再贈詩曰選得幽居愜野情終年無送亦無迎有時直上孤峰頂月下披雲嘯一聲唐時文人李習之不能為詩韓吏部集有習之兩句云前之巨灼灼此去信悠悠殊無可取鄭州嘗掘地得刺史李翺戲贈詩云縣君愛磚渠繞水姿行逰鄙性樂山野掘地便成溝兩岸植芳草中間漾清流所尚既不同磚鑿各自修從他後人見景趣誰為幽此自一李翺非習之也唐書習之傳亦不記為鄭州王深甫編次習之集乃收入此詩翺在潭州席上有舞柘枝者顔色憂悴殷堯藩侍御當筵贈詩曰姑蘇太守青娥女流落長沙舞柘枝滿坐繡衣皆不識可憐紅臉淚雙垂翺詰其事乃姑蘇臺韋中丞愛姬所生之女也正卿之姪夏卿之裔曰妾以昆弟夭折委身樂部耻辱先人言訖涕咽情不能堪亞相為之吁嘆且曰吾韋族姻舊速命更其舞服飾以袿襦延與韓夫人相見部之子夫人吏顧其言語清楚宛有冠蓋風儀遂於賔榻中選士而嫁之舒元輿侍郎聞之自京馳詩曰湘江舞罷忽成悲便脫蠻靴出綘幃誰是蔡雍琴酒客魏公懷舊嫁文姬習之為㓪州刺史入為禮部郎中出刺廬州入為中書舍人歷遷桂管湖南觀察山南東道節度其與僧惟儼詩及其女識廬儲登第事皆習之也然習之學韓愈者其與藥山僧詩是非未可知也歸妹於楊嗣復歸女於盧求鄭亞杜審權故携畋讓能皆習之之甥皆為宰相云其在鄭州者非習之也麴信陵信陵正元元年進士為舒州望江令卒有吳門送客詩云亂山吳苑外臨水讓王祠素是傷情處春非送客時不須愁落日且願駐青絲千里會應到一樽誰共持信陵移居洞庭詩云重林將疊嶂此處可逃秦水隔人間世花開洞裏春荷鋤分地利縱酒樂天真萬事更何有吾今巳外身白樂天感遇詩云我聞望江縣麴令撫惸婺在官有仁政名不聞京師身殁欲歸葬百姓遮路岐攀轅不得去留葬此江湄至今道有名男女涕皆垂無人立碑碣唯有邑人知孟郊李翺薦郊於張建封云兹有平昌孟郊正士也伏聞執事舊知之郊為五言詩自前漢李都尉蘇屬國及建安諸子南朝二謝郊能兼其體而有之李觀薦郊於梁肅補闕書曰郊之五言詩其有高處在古無上其有平處下顧兩謝韓愈送郊詩曰作詩三百首杳默咸池音彼二子皆言知也豈欺天下之人哉郊窮餓不得安養其親周天下無所遇作詩曰食薺腸亦苦強歌聲無歡出門即有礙誰謂天地寬其窮也甚矣凡賢人竒士自以所負不茍合于世是以雖見之難得而知也見而不能知其賢如勿見而巳矣知其賢而不能用如勿知其賢而巳矣用而不能盡其才如勿用而巳矣盡其才而容讒人之所間者如勿盡其才而巳矣故見賢而能知知而能用用而能盡其才而不容讒人之所間者天下一人而巳矣郊下第詩曰棄置復棄置情如刀劒傷又再下第詩曰兩度長安陌空將淚見花而後及第有詩曰昔人齷齪不足嗟今朝曠蕩恩無涯青春得意馬蹄疾一日看盡長安花一日之間花即看盡何其速也果不達韋莊奏請追贈十餘人其一孟郊字東野尚古風詩與李光韓退之為友貞元十二年及第佐徐州張建封幕卒私諡曰貞耀先生賈島詩曰身殁聲名在多應萬古傳寡妻無子息破宅帶林泉塜近登山道詩隨過海船故人相弔處斜日下寒天郊字東野湖州人年五十擢調溧陽尉鄭餘慶為東都留守表為水陸運判官鎮興元表為參謀卒退之答郊詩云規模背時利文字覷天巧人皆餘酒肉子獨不得飽才春思巳亂始秋悲又攪朝餐動及午夜諷常至卯名聲暫羶腥腸肚鎮煎炒古心雖自鞭世路終難拗弱拒喜張臂猛拿間縮瓜見倒誰肯扶從嗔我須咬張為取郊青山輾為塵白日無間人食薺腸亦苦強歌聲無歡欲知萬里情曉卧半床月等句以為清竒僻苦主遊子吟云慈母手中線遊子身上衣臨行密密縫意恐遲遲歸誰將寸草心報得三春輝烈女操云梧桐相待老鴛鴦會雙死正女貴徇夫捨生亦如此波瀾誓不起妾心井中水天寒色青蒼北風呌枯桑厚氷無裂文短日有冷光敲石不得火壯隂奪正陽苦調更何言久吟成此章此郊苦寒吟也或曰郊島善言貧此詩與島詩云卧聞西牀琴凍拆兩三絃鬢邊雖有絲不堪織寒衣正相侔矣楚怨云秋入楚江水獨照汩羅魂手把芰荷泣意愁珠淚翻九門不可入一犬吠千門塘下行云塘邊日欲斜年少早還家徒將白羽扇調妾木蘭花不是城頭樹那棲來去鴉臨池曲云池中春荷葉如帶紫菱成角蓮子大羅裙蟬鬢倚迎風雙雙伯勞飛向東偷詩之作餓犬齚枯骨自喫饞飢涎今文與古文各各稱可憐亦如嬰兒食餳桃口旋旋惟有一點味豈見逃景延繩床獨坐翁默覽有所傳終當罷文字别著逍遙篇從來文字淨君子不以賢贈别崔純亮云食薺腸亦苦強歌聲無歡出門即有礙誰謂天地寬有礙非遐方長安大道傍小人智慮險平地生太行鏡破不改光蘭死不改香始知君子心交久道益彰君心與我懷離别俱回遑譬如浸蘖泉流苦日巳長忍泣目易衰忍憂形易傷項籍豈不壯賈生豈不良當其失意時涕泗各滿裳古人勸加飱此飱難自強一飰九祝噎一嗟十斷腸况是兒女怨怨氣凌彼蒼彼蒼若有知白日下清霜今朝始驚呼白日空茫茫落第云曉月難為光愁人難為腸誰言春物榮獨見花上霜雕鶚失勢病鷦鷯假翼翔棄置復棄置情如刃劒傷再下第云一夕九起嗟夢短不到家兩度長安陌空將淚見花盧同有所思云當時我醉美人家美人顔色嬌如花今日美人棄我去青樓珠箔天之涯娟娟常娥月三五二八盈又缺翠眉蟬鬢生别離一望不見心斷絶心斷絶幾千里夢中醉卧巫山雲覺來淚滴湘江水兩岸花朩深美人不見愁人心含愁更奏緑綺琴調高絃絶無知音美人兮美人不知為暮雨兮為朝雲相思一夜梅花發忽到窗前疑是君樓上女曲云誰家女兒樓上頭指揮婢子挂簾鈎林花撩亂心之愁卷却羅袖彈箜篌箜篌歷亂五六絃羅袖掩靣啼向天相思絃斷情不斷落花紛紛心欲穿心欲穿憑欄杆相憶柳條線相思錦帳寒直緣感君恩愛一回顧使我雙淚長珊珊我有嬌靨待君笑我有嬌娥待君掃鶯花爛熳君不來及至君來花巳老心腸寸斷誰得知玉階羃歷生青草秋夢行云客行一夜秋風起客夢南遊渡湘水湘水泠泠徹底清二妃怨處無限情娥皇不語啓嬌靨女英目成轉心愜長眉入鬢何連娟肌膚白玉秀且鮮徘徊共詠東方日沉吟再理南風絃聲斷續思綿綿中含幽意兩不宣殷勤纎手警破夢中霄寂寞心悽然心悽然腸亦絶寐不寐兮玉枕寒夜深夜兮霜似雪鏡中不見雙翠眉臺前空挂纎纎月纎纎月盈復缺娟娟似眉意難訣願此眉兮如此月萬里萬里光不滅同居東都退之為河南令愛其詩厚禮之自號玉川子嘗為月蝕詩譏切元和朋黨月蝕詩云新天子即位五年嵗次庚寅斗柄插子律調黃鍾森森萬朩夜殭立寒氣贔贔頑無風爛銀盤從海底出來照我草屋東天色紺滑凝不流氷光交貫寒曈朧初疑白蓮花浮出龍王宮八月十五夜此並不可雙此時怪事發有物吞食來輪如壯士斧斫壞桂似雪山風拉摧百鍊鏡照見膽平地埋寒灰火龍珠飛出腦却入蚌蛤胎摧輪破壁眼看盡當天一搭如炲煤磨縱滅迹須臾間便似萬古不可開不料至神物有此大狼狽星如撥沙出爭頭事光大如婢炷暗燈掩切烏感菼如玳玳今夜吐啖長如虹孔隟千道窮户外土川涕泗下中庭獨自行念此日月者太隂太陽精皇天要識物日月乃化生走天汲汲勞四體與夫作眼行光明此眼不自保天公行道何由行吾見隂陽家有説望日蝕月月光滅朔月掩日日虧缺兩眼不相攻此説吾不容又孔子師老子云五色令人目盲吾恐天似人好色即喪明幸且非春晴萬物不嬌榮青山破瓦色渌水氷崢嶸花枯無女艷鳥死沉歌聲頑冬何所好偏使一目盲傳説古老説月蝕蝦蟆精徑圍千里入汝腹汝此癡骸阿誰生何從海窟來便解緣青冥恐是睚睫間掩塞所化成黃帝有四目帝舜重瞳明二帝懸四目四海生光輝吾不遇二帝滉漭不可知何故童子上坐受蟲豸欺長嗟白兔搗靈藥恰似有意防姦非藥成滿臼不中度委任白兔夫何為憶昔堯為天十日燒九州金鑠水銀流玉煼炒丹砂焦六合烘為窑堯心增百憂帝見堯心憂勃然發怒決洪流立擬沷殺九日妖天高日走沃不及但見萬國赤子生魚頭此時九御導九日爭持節幡麾幡旒駕車六九五十四頭蛟螭虬掣電九火輈汝若蝕開齱齬輪御轡執索相爬鉤推蕩轟轕入汝喉紅鱗焰鳥燒口快翎鬛倒側聲盞鄒撑腸拄肚礧如山丘自可飽死更不偷不獨填飢坑亦解堯心憂恨汝當食藏頭壓腦不肯食不當食張唇哆觜食不休食天之眼養逆命安得天帝請汝劉嗚呼人飬虎被虎齧天昏暮得瞽疾蝦蟆敢將天眼瞎乃知恩非類一一自作孽吾見患眼人必索良工訣想天不異人愛眼固應一安得嫦娥氏來習扁鵲術手操春喉戈去此睛上物初見猶朦朧既久如抹漆但恐功業成便此不吐出玉川子又涕泗下心禱再拜額榻沙土中地上蟣虱臣同告訴帝天皇臣心有鐡一寸可刳妖蟇癡腸上天不為臣立梯磴臣血肉身無由飛上天揚天光先封辭付與赤心風越排閶闔入紫宫密邇玉几前擘圻奏上臣同頑愚胸敢死橫干天代天謀其長東方蒼龍角插戟虎拽風當心開明堂統領三百六十鱗蟲坐理東方宮月蝕不救援安用東方龍南方火鳥赤潑血項長尾短飛跋躠頭戴丹冠高達月蝕鳥宮十二度鳥為居停主人不覺察貪向何人家行赤口毒舌毒蟲頭上喫却月不啄殺虛貶鬼眼明䆷䆷下音血上音抉鳥罪不可雪西方攫虎立䗁踦几音斧為牙鑿為齒偷犧牲食封豕大蟇一臠固當軟美似見不見是何道理瓜牙根天不念天天若準擬北方寒龜被蛇縳藏頭入慤如入獄蛇筋束緊束破慤寒龜夏龜一種味且當以其肉充臛死殼沒信處唯堪支床腳不堪鑽灼與天卜嵗星主福德官爵奉董秦忍使黔婁生覆尸無衣巾天失眼不嵗星胡其仁熒惑矍鑠翁執法大不中月明無罪過不糾食月蟲年年十月朝太微支盧謫罰何災凶土星與土性相背反飬福德生禍害到人頭上死破敗今夜月蝕安可會太白真將軍怒激鋒鋩生常御名同州與太宗州陳斬酈定進項骨脆甚春蔓菁天唯兩眼失一眼將軍何處行天兵辰星任廷尉天律自主持人命在盆底固應樂見天盲時天若不肯信試喚臯陶鬼一問一如今宜三台文昌宮作天上紀綱環天二十八宿磊磊尚書郎整頓排班行劒握他人將一四太陽側一四天帝旁操斧代大匠兩手不怕傷弧矢引滿反射人天狠呀啄明煌煌癡牛與騃女不肯勤農枽徒勞含淫思旦夕遙相望蚩尤簸箕弄旬朔始捶天鼓鳴璫琅枉天能蛇行眉目森森張天狗下舐地血流何滂滂譎險萬萬黨搆架何可當昧目亹成就害我光明王請留北斗相北極指揮萬國懸中央此外盡掃除堆積如山岡贖我父母光當時帝星沒星雨如坼漿似天會事發叱喝誅姦強何故中道廢自遺今日殃善善惡惡郭公所以亡願天神聖心無信他人忠玉川子辭訖風色緊格格近月黑暗邊似有動劒戟須臾癡蟇精兩吻自決抑初露半箇璧漸吐滿輪魄衆星盡原赦一蟇獨誅磔腹肚忽脫落依舊挂穹碧光彩未蘇來慘淡一片白奈何萬里光受此吞吐厄再得見天眼感荷天地力或問玉川子孔子修春秋二百四十年月蝕盡不收今子咄咄辭固合孔意不玉川子笑答或請聽逗遛孔子父母魯諱魯不諱周書外書大惡故月蝕不見收余命唐天口食唐土唐禮過三唐樂過五小猶不説大不可數災沴無有大小愈安得引衰周研核其可否日分晝月分夜辨寒暑一主刑一主德政乃舉孰為人靣上一目偏可去願天完兩目照見萬方土更不瞽萬萬古與馬異結交詩天地日月如等間盧同四十無往還唯有一片心脾骨巉巗崒硉元鬱律刀劒為峰崿平地放著高如昆崘山天不容地不受日月不敢偷照耀神農畫八卦鑿破天心胸女媧本是伏羲婦恐天怒搗鍊五色石引日月之斜五星之縷把天補補了不肯歸聓家走向日中放老鴉月裏栽桂養蝦蟇天公發怒罰龍蛇此龍此蛇得死炳神農合藥救死病天怪神農黨龍蛇罰神農為牛頭令載元氣車不知藥中有毒藥藥煞元氣天不覺爾來天地不神聖日月之光無正定不知元氣本不死忽聞空中喚馬異馬異若不是祥瑞空中敢道不容易昨日同不同異自異是謂大同而小異今日同自同異不異是謂同不往兮異不至直當中兮動天地自玉璞裏斷出相思心黃金礦裏鑄出相思淚忽聞空中崩崕倒谷聲絶勝明珠千萬斛買得西施南越一雙婢嬌饒惱殺人凝脂為腰翡翠裙唯解畫眉朱點唇自從獲得君䰙金摐玉凌浮雲却退顧一雙婢子何足云平生結交苦少人憶君眼前如見君青雲欲開白日沒天眼不見此竒骨此骨縱橫竒又竒千嵗萬嵗枯松枝半半殆壓山谷盤根蹙節成蛟螭忽雷霹靂卒風暴雨撼不動欲動不動千變萬化惣是鱗皴皮此竒怪物不可欺盧同一見馬異文章酌得馬異胸中事風姿骨本恰如此是不是一字劉義塞上逢盧同云直到枽乾北逢君夜不眠上樓腰腳健懷土眼精穿斗柄寒垂地河源涼徹天羈魂泣相向何事有詩篇􅊨自問云自問彭城子何人接汝顛酒腸寬似海詩膽大於天斷劔徒勞匣枯琴無復絃相逢不得合賴是向秋泉義節士也少放肆為俠行因酒殺人亡命會赦出更折節讀書能為歌詩然恃故時所負不能俯仰貴人聞韓愈接天下士步謁之作氷柱雪車二詩出盧孟右樊宗師見為獨拜後以爭語不能下賔客因持愈金數斤去曰此諛墓中人得耳不若與劉君為夀愈不能止歸齊魯不知所終楊巨源春日獻聖夀無疆詞云代是文明晝春當宴喜時爐煙添桞重宮漏出花遲漢典方寬律周官正採詩碧霄吹鳳吹紅日在龍旗造化膺神契陽和沃聖慈每因隨百獸率舞奉丹墀宮漏出花遲為詩題梁正明三年薛廷圭以張弘靖三世掌書命在台坐巨源詩曰伊陟無聞祖韋賢不到孫時稱其能與張氏説家門巨源在元和時詩韻不為新語體律務實功夫頗深旦暮吟詠不輟年老頭搖人言吟詩所致早春即事呈劉員外云明朝晴暖即相隨肯信春光被雨欺且任文書堆案上免令杯酒負花時馬蹄經歷須應遍鶯語丁寧巳怪遲更待雜芳成艷錦鄴中爭唱仲宣詩送章孝標校書歸杭州因寄白舍人云曾過靈隱江邊寺獨宿東樓看海門潮色銀河鋪碧落日光金柱出紅盆不妨公事資高卧無限詩情要細論若訪郡人徐孺子應須騎馬到沙林巨源以三刃夢益州一箭取遼城得名故樂天詩云早聞一箭取遼城相識雖深有故情清句三朝誰是敵白鬚四海半為兄貧家剃草時時入瘦馬尋花處處行不用更教詩過好折君官職是虛名巨源後拜省郎樂天復以詩賀云文昌新入有光輝紫界宮墻白粉闈曉日雞人傳漏箭春風侍女護朝衣雪飄歌句高難和鶴拂煙霄光飛官職聲名俱入手近來詩客似君稀巨源字景中時為河中少尹何事慰朝夕不踰詩酒情山河空道路蕃漢共刀兵禮樂新朝市園林舊弟兄向風一點淚寒晚暮江平為主客圖張為取此作送裴中丞出使云一清淮甸假朝綱金印初迎細柳黃辭闕天威和雨露出關春色避風霜龍韜何必陳三略虎旅由來肅萬方宣諭生靈真重任回軒應問石渠郎送綘州盧使君云應將清靜結心期又共陽和到郡時絳老問年須算字庾公逢月要題詩朱欄迢遞因髙勝粉蝶清明欲下遲他日徵還作霖雨不須求賽敬亭祠送司徒童子云衛多君子魯多儒七歲聞天笑舞雩光彩春風初轉蕙性靈秋水不藏珠兩經在口知名小百拜垂髫稟氣殊况復元侯旌爾善桂林枝上得鵷雛送人過衛州云憶昔征南府內逰君家東閣最淹留縱橫聮句長侵曉次第看花直到秋論舊舉杯先下泪傷離臨水更登樓相思前路幾回首舊眼青山過衛州寄昭應王丞云武皇金輅輾香塵每歲朝元及此辰光動泉心初浴日氣蒸山腹揔成春謳歌已入雲韶曲詞賦方歸侍從臣瑞靄朝朝猶望幸天教赤縣有詩人寄江州白司馬云江州司馬平安否惠逺東林住得無湓浦曾聞似衣帶廬峰見説勝香爐題詩歲晏離鴻斷望闕天遙病鸖孤莫謾勾牽雨花社青雲依舊是前途古意贈王常侍云繡户紗窗北里深香風暗動鳳凰簮組紃長在佳人手刀尺空搖寒女心欲學齊謳逐雲管還思楚練拂霜砧東家少婦當機織應念無衣雪滿林贈張將軍云關西諸將揖容光獨立營門劔有霜知愛魯連歸海上肯令王剪在平陽天晴紅幟當山滿日暮清笳入塞長年少高功人最美漢壇煙樹日蒼蒼贈李傳云知因公望掩能文誓激明誠在致君曾罷雙旌瞻白日猶將一劔許黃雲搖窗竹色留僧語入院松聲共鸖聞莫被此心生晚計鎮南人憶杜將軍述舊紀勳寄太原李光顔侍中云玉舍含悽見鴈行北垣新詔拜龍驤弟兄間世真飛將貔虎歸時似故鄉鼓角因風飄朔氣旌旌映水發秋光河源收地心猶壯笑向天西萬里霜又云倚天孤劔截雲孤報國縱橫見丈夫五載登壇真宰相六重分閫正司徒曾聞轉戰平堅冦共説題詩壓腐儒料敵知機在方寸不勞心力講隂符上裴中丞云六年西掖弘湯誥三捷東堂總漢科政引風霜成物色語回天地到陽和清威更助朝端重聖澤曾隨筆下多應笑白鬚揚執戟可憐春日老如何和人與人分惠賜氷云天水藏來玉墮空先頒密署幾人同映盤皎潔非關露當扇清涼不在風瑩質方從綸閣內凝輝更備錦帷中麗詞珍貺難雙有迢遞金輿殿角東觀打毬有作云親掃毬場如砥平龍驤驟馬曉光晴入門百拜瞻雄勢動地三軍唱好聲玉勒回時霑赤汗花騣分處拂紅纓欲令四海氛煙靜杖底纎塵不敢生贈鄰家老將云白首羽林郎丁年戍朔方隂天瞻磧路秋日渡遼陽大漠寒山黑孤城夜月黃十年依蓐食萬里帶金瘡拂雪陳師祭衝風立教場箭飛瓊羽合旌動火雲張虎翼分營勢魚鱗擁陳行誓心清塞色鬪血雜沙光戰地晴輝薄軍門曉氣長冦深爭暗襲關逈勒春防身賤竟何訴天高徒自傷功成封寵將力盡到貧鄉雀老方悲海鷹衰却念霜空餘孤劔在開匣一霑裳酬崔博士云自知頑叟更何能唯學雕蟲謬見稱長被有情邀唱和近來無力更秪承青松樹杪三千鸖白玉壺中一片氷今日為君書壁右孤城莫怕世人憎酬盧員外云謝傅旌旗控上遊盧郎鐏俎借前籌舜城風土臨清廟魏國山川在樓雲寺當時接高步水亭今日又同遊滿筵舊有笙歌在獨有羊曇最淚流酬于駙馬云綺陌塵香曙色分碧山如畫又逢君蛟藏秋月一片水驥鎖晴空千尺雲戚里舊知何駙馬詩家今得鮑參軍陽和本是煙霄曲願向花間次第聞又云芳時碧落心應斷今日清詞事不同瑶草秋殘仙圃在綵雲天逺鳳樓空晴花曾送金羈影涼葉還生玉簟風長得聞詩歡自足會看春露濕蘭叢酬裴舍人見寄云誰道重遷是舊班自將霄漢比鄉關二妃樓下宜臨水五老祠西好看山再葺吾廬心巳足每來公府路常間詩陪亞相逾三紀石笥煙霞不共攀酬崔駙馬惠箋百張兼貽四韻云百張雲樣亂花開七字文頭艷錦回浮碧空從天上得殷紅應自日邊來捧持價重凌葉封褁香深笑海苔滿篋清光應照眼欲隨凡韻輒徘徊元微之憶楊十二詩云楊子愛言詩春天好詠時戀花從馬滯聮句放杯遲日映含煙竹風牽卧柳絲南山更多興須作白雲期巨源善敘事胡二十以户部度支乃賀以詩曰雄拜知承聖主恩於是有雄拜之日陳羽羽湘妃云二妃哭處雲沉沉二妃怨處湘江深商人酒滴廟前草蕭颯風生班竹林雪詩云千門萬户雪花浮點點無聲落硯溝全似玉塵消更積半成氷片約還流光含曙色清天苑輕逐微風繞御樓平地巳霑盈尺潤年豐須荷冨人侯宴楊駙馬山亭云垂楊拂岸草葺葺繡户窗前花影重鱠下玉盤紅縷細酒開金甕緑醅醲中朝駙馬何平叔南國詞人陸士龍落日泛舟同醉處回潭百丈映千峰贈子云或棹孤舟或杖藜尋常適意釣長溪草堂竹徑在何處落日孤煙寒渚西題夫差廟云姑蘇臺上千年朩刻作夫差廟裏神冠蓋寂寥塵滿坐不知簫鼓樂何人韓退之有落葉送羽云誰云少年别流淚各霑衣羽與退之同年登第羽夜别溫商梓州云鳳凰城裏花時别元武江邊月下逢客舍莫辭先買酒相門曾忝舊登龍迎風騷屑千家竹隔水悠揚午夜鐘明日又行西蜀去不堪天際逺山重春園即事云水隔群物外夜深風起頻霜中千樹橘月下五湖人聽鸖忽忘寢見山如得鄰明年還到此共看洞庭春送戴端公赴容州云分命諸侯重葳蕤繡服香八蠻治險路千騎踏繁霜山斷旌旗出天晴劔佩光還將小戴禮逺去化南方送友人及第歸江東云五陵春色泛花枝心醉花前逺别離落第耻為關上客成名空羡里中兒都門雨歇愁分處山店殘燈夢到時家住洞庭多釣伴同來相賀話相思小江驛送陸侍御歸湖上山云鸖唳天邊秋水空荻花蘆葉起西風今夜渡頭何處宿會稽山在月明中王履異方霑瑞氣干呂見青雲表聖興中國來王謁大君迎祥殊大樂叶慶賴橫汾自是明時起非將觸石分映霄難辨色從吹作成文須使流千載垂芳在典墳干呂青雲履貞元七年青雲干呂詩登第彭伉聖布中區化符祥異域雲含春初應呂暈碧巳成文東起隨風暖西流共日曛升時嘉異月為慶等凝汾輕與晴煙比高將曉霧分飄飄如可致願此翊明君君伉正元七年杜黃裳下試青雲干呂詩登第伉宜春人既登第伉妻族有湛賁者猶為郡吏伉妻即湛姨也妻族賀伉坐皆名士伉居客右一坐盡碩而賁飯於後閣其妻責之曰男子不能自勵窘辱如此復何顔賁感其言力學一舉擢第正年第元十二伉方郊逰聞之失聲墜驢袁人謔曰湛郎及第彭伉落驢袁州至今落驢橋之西有辛弘智弘智國子監進士賦詩曰君為河邊草逢春心剩生妾如臺上鏡得照始分明同房常定宗改始字為轉字遂爭之皆云我作乃下牒見博士羅道琮判云昔五言定表以理切稱竒今一言競詩取詞多為主詩歸弘智轉還定宗以狀牒知任為公驗歐陽詹字行周泉州人初見拔於常衮後見知於退之元賔終於四門助教李胎孫序其文曰君之文周詳切於情故事敘重復宜其掌代文柄以變風雅一命而卒天其絶乎子價早死孫澥銅雀妓云蕭條登古臺回首黃金屋落葉不歸林高陵永為谷粧容徒自麗舞態閲誰目惆悵繐帷前歌聲苦於哭晨裝行云村店月西入山林鳥鵊聲旅裝徹夜席束囊事晨征寂寂人尚眠悠悠天未明豈無偃息心所務前有程蜀中將歸留辭韋相公云寧體即雲搆方前恆玉食貧居豈及此要欲懷歸憶在夢關山逺如流嵗華逼明晨首鄉路迢遞孤飛翼玩月詩序云月可玩玩月古也謝賦鮑詩聎之庭前亮之樓中皆玩月也貞元十二年歐閩君子陳可封遊在秦寓于永崇里華陽觀豫與鄉人安陽邵楚萇濟南林藴頴川陳詡亦旅長安秋八月十五夜詣陳之居修厥玩事月之為玩冬則繁霜大寒夏則蒸雲大熱雲蔽月霜侵人蔽與侵俱害乎玩秋之於時後夏先冬八月於秋季始孟終十五於夜又月之中稽於天道則寒暑均取於月數則蟾兔圓况埃壒不流大空悠悠嬋娟徘徊桂華上浮升東林入西林肌骨與之踈涼神氣與之清冷四君子恱而相謂曰斯古人所以為玩也既得古人所玩之意冝襲古人所玩之作月詩云八月十五夕舊嘉蟾兔光斯從古人好共下今宵堂素魄皓孤凝芳輝紛四揚徘徊林上頭泛灔天中央皓露助流華輕風佐浮涼清冷到肌骨潔白盈衣裳惜此苦宜玩攬之非可將含情顧廣庭願至沉西方途中寄太原所思詩云鷗鳥漸覺逺回頭長路塵高城已不見况復城中人去意自未甘居情諒猶辛萬里東北晉千里西南秦一履不出門一車無停輪流萍與匏繫早晚期相親或曰詹遊太原悅一妓將别約至都相迎故有早晚期相親之句妓思之不巳得疾且甚乃刃其髻藏之謂女弟曰歐陽生至可以為信又作詩曰自從别後減容光半是思郎半恨郎欲識舊來雲髻樣為奴開取縷金箱絶筆而逝及詹至如其言示之詹啓函一慟而卒孟簡賦詩哭之序云穆玄道訪豫常嘆其事玄道頗惜之焦郁白雲向空垂云白雲升逺岫搖拽入晴空乘化隨舒卷無心任始終欲銷仍帶日將斷更因風勢薄飛難定天高色易窮影收元氣表光滅太虛中儻若從龍去還施濟物功春雪詩云散漫天涯色承春四望平不分殘照影何處斷腸聲繚繞光經塞霏微勢逐城因風低未斂帶雨重還輕干呂知時泰如膏候嵗成小儒叨盛世無以答皇明袁高字公碩滄洲人恕巳之孫慷慨有節尚為給事中德宗將起盧𣏌刺饒州詔出高執不下帝慰曰朕唯卿言切至巳如奏憲宗時卒贈禮書禹貢通逺俗所圖在安人后王失其本職吏不敢陳亦有姦佞者因兹欲求伸動生千金費日使萬姓貧我來顧渚源得與茶事親氓輟耕農耒採採實苦辛一夫旦當役盡室皆同臻捫葛上欹壁蓬頭入荒榛終朝不盈掬手足皆鱗皴悲嗟遍空山草朩為不春隂嶺芽未吐使者牒巳頻心爭造化力先走銀臺均選納無晝夜搗聲昏繼晨衆工何枯稿俯視彌傷神皇帝尚巡狩東郊路多堙周回繞天涯所獻愈艱勤况減兵革困重兹困疲民未知供御餘誰合分此珍顧省忝邦守又慙復因循茫茫滄海間丹憤何由申右高所賦茶山詩也案唐制潮州造貢茶最多謂之顧渚貢焙嵗造一萬八千四百斤大曆後始有進奉建中二年高刺郡進三千六百串并詩此一章刻石在貢焙故杜鴻漸與楊祭酒書云顧渚中山紫笋茶兩片此物但恨帝未得嘗實所嘆息一片上太夫人一片充昆弟同啜開成三年以貢不如法停刺史裴充官唐詩紀卷第三十五
