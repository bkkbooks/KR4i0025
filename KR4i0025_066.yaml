  text: 唐詩紀事卷第六十六
  hash: sha256:86338d0dcfa99fe5ad8c4f2bee2a62f3e9814bc51b0f5a8b244ae9ef0ba48cd2
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_066-1a}
body:
  text: 馮涓盧嗣立李質姚巖傑王璘嚴郭陳摽崔安潛盧發錢珝盧駢嚴惲王渙張曙翁綬戴司顔孫定趙牧盧注鄭愚王鐐陳淑馮涓涓初除京兆府參軍恩地杜相審權有江西之拜制未出召涓密語延辟之命戒勿涓漏其言於友人鄭寬寬尋捧刺詣賀杜遂鄙涓淺薄不預初選及亷車發日候涓别於長樂杜長揖曰勉旃後分符眉州不得之任在西川重圍中局蹐於陳田之間羈愁六年徒步糊口著懷秦賦有南冠龍吟等集皆傷蹭蹬也集有蜀馱引其要云昻藏大步蠶叢國曲頸微伸髙九尺卓女窺窗莫我知嚴仙據按何曽識又題支機石云不隨俗物皆成土只待良時却補天惜已知之不遇也涓字信之信都人大中初舉進士登宏詞科時危隱啇山十年昭宗以為眉州刺史陳田拒命涓棄郡於成都墨池灌園自給王建以為翰林學士雖詼諧傲物而多有輔益卒於蜀盧嗣立望九華山云九華深翠落軒楹逈眺澄江氣象明不遇隂霾孤岫隱正當寒日衆峯呈坐觀風雪銷煩思惜别煙嵐駐曉行得路歸山期早訣夜來潛已告誠精嗣立登會昌進士第李質質字公幹襄陽人應舉無成有親在衡湘往謁焉泝流至湓城豫章逐師捨舟由武寧而反會草冦殺其宰蒼惶前去得日觀宿東房有酒數缸甚美遂携一壺上樓酌之因吟曰曽入桃溪路仙原信少雙洞霞飄素練蘚壁畫隂窗古木愁撑月危峯欲墮江自吟空向寂誰共倒秋缸吟畢如有人言曰土主尚書寓宿在此質登第後二十年亷察豫章時大中十二年也出科名分定録姚巖傑巖傑梁國公元崇裔孫嘗以詩酒放遊江左乾符中顔摽典藩鞠場亭宇初創命巖傑紀其事文成粲然摽欲刋去一二字巖傑大怒摽遂什其碑巖傑以一篇紀之曰為報顔公識我麼我心唯只與天和眼前俗物關情少醉後靑山入意多田子莫嫌彈鋏恨寧生休唱飯牛歌聖朝若為蒼生計也合公車到薜蘿盧肇牧歙州巖傑在婺源先以著述寄肇肇已知其人辭以兵火之後郡中凋弊無以迎逢大賢嵓傑復以長箋激之肇不得已輟所乘馬迎至郡齋館榖如公卿禮既而日肆傲睨肇常以篇詠吒於巖傑曰明月照巴山巖傑笑曰明月照天下奈何獨巴山耶子發漸不得意無何會於江亭時蒯希逸在席肇改令曰目前取一聮象令主曰逺望漁舟不濶尺八巖傑遽飲酒一器憑欄嘔噦須臾即席還令曰憑欄一吐已覺空喉有集二十卷目曰象溪子中和末豫章大亂巖傑病死王璘長沙日試萬言王璘詞學富贍崔詹事亷問表薦於朝先試之使𪠘璘請十書吏皆給筆札璘口授十吏筆不停綴首題黃河賦三千字復為鳥散余花落詩二十首援筆而就時忽風雨暴至數幅為回飈所卷泥滓沾漬璘曰勿取但將紙來復縱筆一揮斯須復十餘篇矣時未亭午已七千余言時路嵓方當鈞軸遣一介召之璘曰請俟見帝嵓大怒亟命奏廢萬言科璘杖策而歸放曠杯酒間雖屠沽無間然矣璘與李羣玉相遇嶽麓寺羣玉曰公何許人璘曰日試萬言王璘羣玉待之甚淺曰請與公聮句可乎璘曰唯子之命羣玉破題而授之其詞不記璘略不佇思繼之曰芍藥花開菩薩面棕閭葉散野人頭羣玉遂屈崔詹事遺璘夾纈數匹璘翌日以作中單襜䄖衣之嚴郭賦百舌鳥云此禽輕巧少同倫我聽長疑舌滿身星未沒何先報曉栁猶粘雪便迎春頻嫌海燕巢難定却訝林鶯語不真莫倚春風便多事玉樓還有晏眠人陳摽摽贈元和十三年登第進士曰春官南院粉牆東地色初分月色紅文字一千重馬擁喜歡三十二人同眼看魚變辭凡水心逐鶯飛出瑞風莫怪雲泥從此别揔曽惆悵去年中摽詠蜀葵花云能共牡丹爭幾許得人嫌處是花多韋絢曰鸖與鸕鷀皆胎化而人以鸖為仙禽蓋鸖難見鸕鷀易見貴耳而賤目也遂誦摽蜀葵花詩以况之啄朩謡云丁丁向晚急還稀啄遍庭槐未肯歸終日與君除蠧害莫嫌無事不平飛寄友人云杜甫在時貪入蜀孟郊生處却歸秦如今始會麻姑意借問山川與後人右張為取二詩作主客圗標終侍御史長慶二年進士也崔安潛何澤韶陽曲江人也父鼎容管經略有文稱澤乾寧中隨計至三峯行在永樂崔公安潛即澤之同年文人也聞澤來乃以一絶報之曰四十九年前及第同年唯有老夫存今日殷勤訪吾子穩將鬐鬛上龍門時主文與奪未分又會相庭有所阻權即永樂猶子也時崔相公胤恃因之敗於垂成後漂泊關外梁太祖受禪澤假廣南幕職入貢勑賜及第世謂崔魏公鉉好食新䭃頭杜豳公悰每早食饙飯乾脯崔侍中安潛看鬪牛李衛公曰吾喜見未聞新書䇿安潛字進之纍為西川平盧等節度拜侍中自中令鎮荆南盧發杜藴亷問長沙發為從事往致聘焉發酒酣傲睨公公因改著詞令曰十姓胡中第六胡也曽金闕掌洪爐少年從事誇門地莫向樽前喜氣粗盧答曰十姓胡中第六胡文章官職勝崔盧暫來關外分憂寄不稱賔筵喜氣粗公極歡而罷錢珝字端文吏部尚書徽之子善文辭宰相王榑薦知制誥進中書舍人搏得罪珝貶撫州司馬珝客舍寓懷云灑灑灘聲晚霽時客亭風袖半披垂野雲行止誰相待明月襟懷秪自知無伴偶吟溪上路有花偷笑臘前枝牽情景物潛惆悵忽似傷春逺别離春恨三首云負罪將軍在北朝秦淮芳草緑迢迢髙臺愛妾魂銷盡始得丘遲為一招久戍臨洮報未歸篋香銷盡别時衣身輕願比蘭階葉萬里還尋塞草飛永巷頻聞小苑逰舊恩如淚亦難收君前願報新顔色團扇須防白露秋蜀國偶題云忽憶明皇西幸時暗傷潛恨竟誰知佩蘭應語宫臣道莫向金盤進荔枝送王郎中云惜别逺相送却成惆悵多獨歸回首處爭那暮山何未展芭蕉云冷燭無煙緑蠟乾芳心猶卷怯春寒一緘書劄藏何事會被東風暗折看盧駢盧駢貟外一日休于青龍僧舍詞氣悽慘暮歸促命筆題南楣曰壽天雖云命榮枯亦太偏不知雷氏劔何處更衝天題畢草草而去涉旬卒駢咸通進士也嚴惲皮日休傷嚴子重序云余為童在鄉校時簡上抄杜舍人牧之集見有與進士嚴惲詩後至吳一日有客曰嚴某余忘其名久矣遽懷文見造於是樂甚觀其所為文工於七字往往有清便柔媚時可軼駿於常軌其佳者曰春光冉冉歸何處更向花前把一杯盡日問花花不語為誰零落為誰開余美之諷而未嘗怠生舉進士亦十餘計偕余方寃之謂終有得於時也未幾歸吳興後兩月一年也咸通十霅人至云生以疾亡於所居矣噫生徒以詞聞於士大夫竟不名而逝豈止此而堙沒耶江湖間多美材士君子茍樂退而有文者死無不為時惜可勝言耶於是哭而為詩魯望生之友也嘗為我作詩云十哭都門榜上塵蓋棺終是五湖人生前有敵唯丹桂沒後無家秪白蘋箬下斬新醒處月江南依舊詠來春知君精爽應無盡必在鄷都頌帝晨曰紂絶栗帝晨項梁成鄷都宫頌陸魯望云嚴子重以詩遊於名勝間舊矣余晚於江南相遇甚樂不幸且沒襲美作詩序而弔之其名真不杇矣又何戚其死哉余因息悲而為之和云每值江南日落春十年詩酒愛逢君芙蓉湖上吟船倚翡翠巖前醉馬分秪自汀洲連舊業豈無章疏動遺文猶憐未卜佳城處更斸要離冢畔雲王渙裴贄大順中王渙自左史拜考工貟外同年李德鄰自右史拜小戎趙光胤自補衮拜小儀王拯自小版拜小勳渙首唱長句感恩上裴公曰青襟七十榜三年建禮含香次苐遷珠彩下連星錯落桂花曽對月嬋娟玉經磨琢多成器劒拔沉埋更倚天應念銜恩最深者春來為壽拜樽前裴公答曰謬持文柄得時賢粉署清華次苐遷昔嵗䇿名皆健筆今朝稱職並同年各懷器業寧推讓俱上青霄肯後先何事老夫猶賦詠欲將酬和永留傳渙字羣吉大順二年侍郎裴贄下登苐德鄰拯光胤皆同年也渙惆悵詩云氷蠶薄絮鴛鴦綺半夜佳期並枕眠鍾動紅娘喚歸去對人勻淚拾金鈿李夫人病巳經秋漢武看來不舉頭得所濃華銷歇盡楚魂湘血一生休謝家池館花籠月蕭寺房廊竹颯風夜半酒醒憑檻立所思多在别離中隋師戰艦欲亡陳國破應難保此身訣别徐郎淚如雨鑑鵉分後屬何人七夕瓊筵往事陳蓼花蓮蒂共傷神蜀王殿裏三更月不見驪山私語人夜寒春病不勝懷玉瘦花啼萬事乖薄幸檀郎斷芳信驚嗟猶夢合歡鞋嗚咽離聲管吹秋妾身今日為君休齊奴不説平生事忍看花枝謝玉樓靑絲一絡墮雲鬟金剪刀鳴不忍看持謝君王寄幽怨可能從此住人間陳宫興廢事難期三閣空餘緑草基狎客淪亡麗華死他年江令獨來時晨肇重來路已迷碧桃花謝武陵溪仙山目斷無尋處流水潺湲日漸西少卿降北子卿還朔野離觴慘别顔却到茂陵唯一慟節毛零落鬢毛班夢裏分明入漢宫覺來燈背錦屏空紫臺月落關山晚腸斷君恩信畫工張曙張曙崔昭緯中和初同舉相與詣日者問命曙時自負才名籍甚以為將來狀元崔亦分居其下日者殊不顧曙苐目崔曰將來万全髙苐曙有愠色日者曰郎君亦及苐然須待崔拜相當此時過堂既而曙果不終場昭緯首冠曙以篇什刺之云千里江山陪驥尾五更風水失龍麟昨夜浣花溪上雨緑楊芳草為何人後七年昭緯為相曙方登苐果於昭緯下過堂杜荀鸖同年生也酬曙詩云天上書名天下傳引來齊到玉皇前大仙録後頭無雪至藥成來竈絶煙笑躡紫雲金作闕夢拋塵世鐵為船九華山叟驚凡骨同到蓬萊豈偶然翁綬詠酒云逃暑迎春復送秋無非緑蟻滿杯浮百年莫惜千回醉一盞能消万古愁幾為芳菲眠細草曽因雨雪上髙樓平生名利關身者不識狂歌到白頭綬登咸通進士第戴司顔景福中江西節度使鍾傳遣僧從約進法華經一千部上待之甚厚恩渥有加宣從約入內賜齋面錫紫衣一副將行太常博士戴司顔以詩贈行略曰逺來朝鳯闕歸去戀元侯時吳子華任中諫司顔仰公之名志在屬和以為從約之資融覽之附掌大笑曰這阿師更不要見便拽出得其承奉如此司顔登大順進士第孫定定字志元涪州大戎之族子長於儲定數舉矣儲方欲就貢訪於定定謔曰子儀表堂堂好將軍材何必以科第為資儲銜之後儲貴逹未嘗言定之長晚年喪志放意柸酒景福二年下第遊京西開逺門醉中走筆寄儲詩曰行行血淚灑塵襟事逐東流渭水深秋跨蹇驢風尚緊靜投孤店日初沉一枝猶挂東堂夢千里空馳北巷心明月悲歌又前去滿城煙樹噪春禽定詩歌千餘首多委於兵火竟無成而卒趙牧牧不知何許人也大中咸通中斆李長吉為短歌對酒曰雲翁耕扶桑種黍養日烏手挼六十花甲子循環落落如弄珠長繩繫日未是愚有翁臨鏡捋白鬚飢魂弔骨吟古書馮唐八十無髙車人生如雲在須臾何乃自苦八尺驅裂衣換酒且為娛勸君朝飲一瓢夜飲一壺杞天崩雷騰騰紂非舜是何足憑桐君桂父豈勝我醉裏白龍多上升菖蒲花開魚尾定金丹始可延君命其餘尤尚輕巧詞多載不唐詩自咸通而下不足觀矣亂世之音怨以怒亡國之音哀以思氣喪而語偷聲煩而調急甚者忿目褊吻如戟手交罵大抵王化習俗上下俱喪而心聲隨之不獨士子之罪也其來有源矣司空圖輩傷時思古退已避禍清音冷然如世外道人所謂變而不失正者也余故盡取晚唐之作庶知律詩末伎初若虛文可以知治之盛衰盧汪汪門族甲天下因宦家于荆南舉進士二十上不第嘗賦詩曰惆悵興亡繫綺羅世人猶自選青娥越王解破夫差國一箇西施也太多晚年失意賦酒胡子一篇云同心相遇思同歡擎出酒胡當玉盤盤中危臬危瓦不自定四座清賔注意看可亦不在心否亦不在面徇客隨時自圎轉酒胡五藏屬他人十分亦是無情勸爾不耕亦不飢爾不蠶亦有衣有眼不能分黼黻有口不能明是非鼻何尖眼何碧儀形本非天地力雕鐫匠意苦多端翠帽朱衫巧粧飾長安斗酒十千酤劉伶平生為酒徒劉伶虛向酒中死不得酒池中拍浮酒胡一滴不入眼空令酒胡名酒胡鄭愚咸通中愚自禮部侍郎除鎮南海時崔魏公在京南愚著錦襖子半臂袖卷謁文公大竒之會夜飲更衣賔從間竊謂公曰此應是慚其不稱既而復易紅錦尤加煥麗衆莫能測愚為進士時未嘗以文章及魏公門至是乃贄所業崔歎賞曰真銷得錦半臂矣愚作大溈虛祐師銘云湖之南湘之西山太溈深無蹊虎已嘯猿又啼雨摵摵風捿捿髙入雲不可梯雖欲去誰與摧彼上人忘其身一宴坐千余旬去無踈來無親夷積阻架嶙峋棟宇成供養陳我不知徒自勤物之生孰無情識好惡知寵驚真物藏百慮呈隨婉轉任崢嶸雲糊天月不明金在礦火收罃我不知天地先無首尾功用全六度備万行圎常自隨在畔邊要即用長目前非艱難不幽玄哀世徒苦馳驅覔作佛何其愚算海沙登迷廬眠喘喘心區區見得失繫榮枯棄知覺求形模近似逺易復難但無事心即安少思慮簡悲歡淨蕩蕩圎團團更無物不勞看聽他語被人謾生必死理之常榮必悴非改張造衆罪欺心王作少福須天堂善惡報正身當自結褁無人將心作惡口脫空欺木石嚇盲聾牛阿房鬼五通專覷捕見西東禁定住陽朦朧與作為事不同最上乘有想基無結淨本無為人不見自心知動便是莫狐疑直下説沒文詞識此意見吾師愚廣州人唐末為相王鐐王鐐富有詞學數舉未捷門生盧肇等公薦於春官云同盟不詞賢者受譏相子負薪優臣致誚乃旌鐐嘉句曰擊石易得火扣人難得心今日朱門者曽恨朱門深聲藹然果擢上第鐐登咸通進士第宰相王播之弟炎生二子鐸鐐鐸相僖宗鐐纍官至汝州刺史王仙芝陷郡城鐐貶韶州司馬終太子賔客陳琡鴻之子也咸通中佐亷使郭常侍銓于徐性耿介有所不合挈家居茅山平居焚香習禪妻子罕面寄居蘭若自述檀經三卷臨行留一章與其僧云行若獨輪車常畏大道覆止若圎底器常恐他物觸行止既如此安得不離俗乾符中第璉佐薛能幕於徐琡自丹陽掉小舟與相見能重其人延入城不可曰某已有誓不入公門矣薛移舟赴之話道永日不宿而去唐詩紀事卷第六十六
