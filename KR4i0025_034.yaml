front:
  text: 唐詩紀事卷第三十四
  hash: sha256:a97c4fb25860cbc474483efa4d20909d2a054ad5f89f0883cbab68667eca2cea
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_034-1a}
body:
  text: 韓愈張籍史延丁澤樊宗師李道昌韓愈司空圖云金之精粗效其聲皆可辨也豈清於磬而渾於鍾哉然則作者為文為詩才格亦可見豈當善於彼不善於此耶愚觀文人之為詩詩人之為文始皆繫其所尚所尚既專則搜研愈至故能衒其功於不朽亦猶力巨而鬪者所持之器各異而皆能濟勝以為勍敵也愚嘗覽韓吏部歌詩纍百首其驅駕氣勢若掀雷挾電撑抉於天地之根物狀其變不得鼓舞而狥其呼吸也其次皇甫祠部文集外所作亦為遒逸非無意於深密蓋或未遑耳今於華下方得柳詩味其探搜之致亦深遠矣俾其窮而克夀抗精極意則固非瑣瑣者輕可擬議其優劣又嘗覩杜子美祭太尉房公文李太白佛寺碑贊宏拔清厲乃其歌詩也張曲江五言沈鬱亦其文筆也豈相傷哉噫後之學者褊淺片詞隻句未能自辨巳側目相詆訾矣痛哉因題柳集之末庶俾後之詮評者罔惑偏說以蓋其全工洛邑得休告華山窮絶陘倚巗睨海眼引袖拂天星日駕此回轄金神所司刑泉紳拖修白石劔攢高青磴蘚漣拳局梯飈颭伶俜悔狂巳咋指垂誡仍鐫銘退之答張徹詩也李肇載登華事信有之沈顔遺肇書謂退之託此以悲世人登髙而不知止且示誡焉皇甫湜作韓先生生既以疾免吏部侍郎書諭湜曰死墓志云長慶四年八月昌黎韓先能令我躬所以不隨世磨滅者惟子以為囑其年十二月丙子遂薨明年其孤昶使奉功緒之録繼訃以至三月癸酉葬河陽乃哭而叙其墓其詳將揭之於神道碑云先生諱愈字退之後魏安桓王茂六代孫祖朝散大夫桂州長史諱睿素父祕書郎贈尚書左僕射諱仲卿先生七嵗好學言出成文及冠恣為書以傳聖人之道人始未信既發不掩聲震業光衆方驚爆而萃排之乘危將顚不懈益張卒大信於天下先生之作無圓無方至是歸工抉經之心執聖之權尚友作者跂邪抵異以扶孔氏存皇之極人知人罪非我計茹古􅉼今無有端涯渾渾灝灝不可窺校反其酣放豪曲快字凌𥿄怪發鯨鏗春麗驚耀天下然而栗密窈眇章妥句適精能之至入神出天嗚呼極矣後人無以加之矣姬氏以來一人而巳矣始先生以進士仕歷官二十有七其為御史尚書郎中中書舍人前後三貶皆以疏陳治事廷議不隨為罪常惋佛老法潰聖人之隄乃唱而築之及為刑部侍郎遂章言憲宗迎佛骨非是任為身耻上怒天子先生處之安然就貶八千里海上嗚呼古所謂非茍知之亦允蹈之者耶吳元濟反吏兵久遁無功國涸將疑衆懼恟恟先生以右庶子兼御史中丞行軍司馬宰相軍出潼關請先乘遽至汴感說都統師乘遂和卒擒元濟王庭凑反圍牛元翼於深救兵十萬望不敢前詔擇庭臣往諭衆栗縮先生勇行元稹言於上曰韓愈可惜穆宗悔馳詔無徑入先生曰止君之仁死臣之義遂至賊營麾其衆責之賊恇汗伏地乃出元翼春秋美臧孫辰告糴于齊以為急病校其難易孰為冝褒嗚呼先生真古所謂大臣者耶選拜京兆尹斂禁軍帖旱糴獻幸臣之鋩再為吏部侍郎薨年五十七贈禮部尚書先生與人洞朗軒闢不施㦸級族姻友舊不自立者必待我然後衣食嫁娶喪葬平居雖寢食未嘗去書怠以為枕餐以飴口講評孜孜以磨諸生恐不貌美游以詼笑嘯歌使皆醉義忘歸嗚呼可謂樂易君子巨人者矣夫人高平郡君范陽盧氏孤前進士昶壻左拾遺李漢壻集賢校理樊宗懿次女許嫁陳氏三女未笄銘曰維天有道在我先生萬頸胥延坐廟以行令望絶耶痌此四方惟聖有文乖微嵗千先生起之焯役于前彍義滂仁耿照充天有如先生而合且年按我章書經紀大環吟不時施昌極後昆噫嘻永歸知心之悲吟其禁反王戞反喚起窗前曙催歸日未西無心花裏鳥更與盡情啼乃二禽名也喚起聲如絡緯圓轉清亮偏鳴於春曉江南謂之春喚催歸子規也謹按公生於代宗大曆三年戊申德宗貞元八年壬申是嵗公登第年二十五十一年乙亥上宰相三書嵗欲相延齡陽城諫止時趙璟賈耽盧邁為相是五月東歸作感二鳥賦其末云幸年嵗之未暮庶無羡於斯類時年二十八十三年丁丑從董晉辟為汴宋頴毫觀察推官十五年巳卯二月公晉薨公隨晉喪歸既出四日宣武軍亂殺行軍司馬陸長源公作汴州亂二章云汴州城門朝不開天狗墮地聲如雷健兒爭誘殺留後連屋纍棟燒成灰諸侯咫尺不能救孤士何者自興衰又曰母從子走者為誰大夫夫人留後兒也長源昨日乘車騎大馬坐者為趨乘者下廟堂不肯用干戈嗚呼奈汝母子何十六年庚辰依徐州武寧軍節度張建封十九年癸未拜監察御史上書論宮市貶連州陽山令時有送浮屠文暢孟東野序二十年甲申移江陵法曹參軍途中作詩寄三翰林未幾以四門博士召二十一年乙酉正月德宗崩順宗立改元永正韋叔誼王叔文等用事又謀奪中官兵制天下之命是年八月皇太子即位帝自稱太上皇貶叔誼叔文等公作永正行云君不見太皇諒隂未出命小人乘時偷國柄北軍百萬虎與貔天子自將非他師一朝奪印付私黨凛凛朝士何能為孤鳴梟噪爭署置晱閃跳踉相嫵媚夜作詔書朝拜官超資越序曾無難公然白日受賄賂火齊磊落堆金盤元臣故老不敢語晝卧涕泣何汍瀾董賢三公誰復惜侯景九錫行可歎國家功高德且厚天位未許庸夫干嗣皇卓犖信英主文如太宗武高祖膺圖受禪登明堂共流幽州鮌死羽四門肅穆賢俊登數君匪親豈其朋郎官清要為世稱荒郡迫野嗟可矜湖波連天日相騰蠻俗生梗瘴癘蒸江氛嶺祲昏若凝一蛇兩頭見未曾怪鳥爭鳴令人憎蠱蟲羣飛夜撲燈雄虺毒螫墮股肱食中置藥肝心崩左右使令詐難憑愼勿浪信當兢兢吾常同僚情可勝具書自見非妄徵嗟爾既往冝為懲是嵗又作五針十八年二憲宗元和元年丙戌權知國子博士作釋言二年丁亥是嵗作元和聖德詩三年分司東都始宰相鄭公索公文公獻之有譛公者遂作釋言至是不自安乃求分司四年是嵗真為國子博士改分司都官員外郎五年為河南令是嵗效玉州子月蝕詩六年入拜職方員外郎時有送窮文寄盧同詩坐論華隂令柳澗事復為博士作進學解執政竒其才改比部郎中史館修撰轉考功郎中修撰如故數月以考功知制誥論討蔡事與裴度議合月滿遷中書舍人賜緋魚袋後卒以謗語改太子右庶子十一年也自六年至十二年丁酉裴度軍慰淮西奏公行軍司馬有從軍泊途中諸篇其間次潼關寄張十二使君詩云荆山已去華山來日照潼關四扇開刺史莫辭迎候逺相公新破蔡州回又次潼關上都統相公云暫辭堂印執兵權盡管諸軍破賊年冠蓋相望催入相待將功德格皇天又桃林夜賀晉公云西來騎火照山紅夜宿桃林臘月中來把命圭兼相印一時重疊賞元功數篇皆有奧㫖元濟平遷刑部侍郎十四年正月表乞燒佛骨疏入貶潮州刺史有次藍關示姪孫湘詩云一封朝奏九重天夕貶潮陽路八千欲為聖明除弊事豈將衰朽計殘年雲橫秦嶺家何在雪擁藍關馬不前知汝逺來應有意好收吾骨瘴江邊是嵗十月量移袁州刺史酬張韶州詩云明時逺逐事何如遇赦移官罪未除北望詎令隨塞鴈南遷才免葬江魚將經貴郡須留客先惠高文謝起豫暫欲繫船韶石下上賔虞舜整冠裾又留别張使君云來往再逢梅柳新别離一醉綺羅春久欽江總文才妙自歎虞翻骨鳴笛急吹催落日清歌緩送感行人巳知奏課當徵拜那復淹留詠白蘋十五年庚子至袁州是嵗正月憲宗崩穆宗立召為國子祭酒長慶元年辛丑兵部侍郎七月成德軍大將王廷湊殺田洪正以二年公奉命宣撫鎮州時裴度為幽鎮招撫使公有行次承天營酬裴公詩云竄遂三年海上歸逢公復此著征衣旋吟佳句還鞭馬恨不身先去鳥飛是嵗四月廷湊解深州之圍牛元翼奔歸京師六月裴度罷六月罷三月相李逢吉為相始公有和裴公感恩言志詩云文武功成後居為百辟師林園窮勝事鍾鼓樂清時擺落遺高論雕鎸出小綺自然無不可范蠡爾其誰又和裴公回朝見寄云蠱瘁年將久公今始暫間事隨憂共减詩與酒俱還放意機衡外收身矢石間秋臺風日逈正好看前山時牛李黨熾裴介其間纍遭謗讟故公詩有高蹈之語是嵗拜京兆尹三年罷京兆尹為兵部侍郎尋拜吏部侍郎四年甲辰有南溪始泛詩是嵗公以病罷吏侍故有餘年諒無幾休日愴巳晚自是病使然非由取髙謇又有足弱不能步自宜收朝蹟之句十二月二日卒於靖安里年五十七張籍短歌行云青天蕩蕩高且虛上有白日無根株流光暫出還入地使我年少不須臾與君相逢勿寂寞衰老不復如今樂玉巵盛酒置君前再拜願君千萬年節婦吟寄東平李司空云君知妾有夫贈妾雙明珠感君纒綿意繫在紅羅襦妾家髙樓連花起良人執㦸光明裏知君用心如日月事夫誓擬同生死還君明珠雙淚垂何不相逢未嫁時白紵歌云皎皎白紵白且鮮將作春衣稱少年裁縫長短不能定自持刀尺向姑前復恐蘭膏汚纎指常遣傍人收墮珥衣裳著時寒食下還把玉鞭鞭白馬將軍行云彈箏峽東有胡塵天子擇日拜將軍蓬萊殿前賜六纛還領禁兵為部曲當朝受詔不辭家夜向咸陽原上宿戰車彭彭旌陽動三十六軍聲上隴隴頭戰勝夜亦行分兵處處收舊城胡兒殺盡隂磧暮擾擾唯有牛羊聲邊人親戚曾戰殁今逐官軍收舊骨磧西行見萬里空樂府獨奏將軍功白頭吟云請君膝上琴彈我白頭吟憶昔君前嬌笑語兩情宛轉如縈素宫中為我起高樓更開花池種芳樹春天百草秋始衰棄我不待白頭時羅襦玉珥色未暗今朝巳道不相宜揚州青銅作明鏡暗中持照不見影人心回玄自無窮眼前好惡那能定君恩已去若再返菖蒲花青月長滿籍樂府詞清麗深婉五言律詩亦平淡可喜七言詩則質多文少人才各自有冝不可強文飾也文昌有謝裴司空馬詩云乍離華厩移蹄澀初到貧家舉眼驚此馬乃是一遲鈍不能行而多驚詩人之微而顯亦少其比寒食內宴云朝光瑞氣滿宫樓彩纛魚龍四靣稠廊下御厨分冷食殿前香騎逐飛毬千官盡醉猶教坐百戲皆呈未放休共喜拜恩侵夜出金吾不敢問行由籍宿江上詩云楚驛南渡口夜深來客稀月明見潮上江靜覺鷗飛旅次今巳逺此行殊未歸離家久無信又聽搗寒衣或云劉長卿餘干旅舍云搖落暮天逈丹楓霜葉稀孤城向水閉獨鳥背人飛渡口月初上鄰家漁未歸鄉心正欲絶何處㨶征衣槩相類也籍字文昌和州人歷水部外郎終主客郎中籍答鄱陽客云江臯嵗暮相逄地黃葉霜前半夏枝子夜吟詩向松桂心中萬事喜君知乃知藥名詩自元和間巳為之矣蕃漢斷消息死生長别離句長於送人處憶得别家時句流光漸出還入地使我年少不須㬰句採樵莫採松與柏生且堅與爾作屋成家宅句右張為取為主客圖退之送東野序云唐有天下陳子昻蘇元明元結李白杜甫李觀皆以其所能鳴其存而在下者孟郊東野始以其詩鳴其高出晉魏不懈而及於古其他浸淫乎漢氏矣從吾遊者李翺張籍其尤也三子者之鳴信善鳴矣抑不知天將和其聲使鳴國家之盛耶抑將窮餓其身思愁其心腸而使自鳴其不幸耶三子者之命則存乎天矣其在上也奚以喜其在下也奚以悲籍詩善叙事如拜豐陵云嵗朝園寢遣公卿學省班中亦攝行身逐陵官齊再拜手持木鐸叩三聲寒更報㸃來三殿曉炬分行照柏城却下龍門看漸逺峰高處日初晴送令狐尚書東都留守云朝廷重寄在關東共說從前選上公勳業新成大梁鎮恩榮便賞洛陽宮行暫出天橋上巡禮常過紫殿中每領羣官拜章表開門仗日曈曈田司空入朝云西來將相望兼雄不與諸軍覲禮同早變山東知順命新收濟上立殊功朝官叙謁趍門外恩使宣迎滿路中閭闔曉開銅漏盡身當受冊大明宮送汀州源使君云曾成趙北歸官計因拜王門最好官為郡暫辭雙鳳闕全家逺過九龍灘山鄉只有輸蕉户水鎮應多養鴨欄地僻尋常來客少㓨桐花發共誰看送李僕射訴赴鎮鳳翔云由來勳業屬英雄兄弟連雲列位同先入賊城擒惡首盡封管管讓元公旌幢獨繼家聲外竹帛新添國史中天子欲收秦隴地故交移鎮古扶風送裴相公鎮太原云盛德雄名逺近知功高先乞守藩維銜恩暫遣分龍節署勑還同在鳳池天子親臨樓上送朝官齊出道邊辭明年塞北諸蕃落應赴生祠請立碑白樂天讀籍詩集云張公何為者業文三十春尤攻樂府詞舉代少其人姚合讀籍詩有詩云妙絶江南曲凄凉怨女詩古風無敵手新語足人知史延清明賜新火云上苑連侯第清明及暮春九天初改火萬井屬良辰頒賜恩踰洽承時慶亦均翠煙和柳嫩紅熖出花新寵命尊三老祥光燭萬人太平當此日空腹賀陶鈞大曆九年留守蔣渙試進士於東都延登第丁澤龜負圖詩云天意將垂象神龜出負圖五方行有配八封義寧孤作瑞旌君德披文叶帝謨乘流喜得路逢聖幸存軀蓮葉池通泛桃花水自浮還尋九江去安肯曳泥途澤大曆十年試龜負圖詩為東都第一樊宗師蜀綿州越王樓詩序云綿之城帝猲明威瀰石硝馳涪瀨左陵凌紅稊簮天地送行癸壬且掬跎踼于西北蟠紅頠青越王正故為樓重軒疊飛門窗䝉傘蹇蹇子始登謂日月昏曉可窺其背雷電合風雲遇霜辛露酸星辰介行鬼神變化草朩頭繡髻銜蓑芰皆可察極既縈視其江帶又極視其土岡斷暴逺近山嶮嶮若閿之東皇天原開見荆山我其黃河􅗎然為曲直淚雨落不可掩因口其心曰無害若其目果星星過歸尚悲不能解重為詩以釋益不可顧謂郡中諸君能無有意綴以華艷其念蓄云危樓倚天門如闉星辰宮榱題薄龍怪洄洄繞雷風徂秋試登臨大靄屯喬空不見西北路考懷益雕窮石瀨薄濺濺土山杳穹穹昔人創為逝所適酡顔紅今我兹之來猶挍成嵗功輟田植科畝游圃歌芳叢地財無叢厚人室安取豐既乏富庶能千萬慙文翁宗師字紹述襄陽節度使澤之子韓退之志其墓曰為文必出於已不襲蹈前人一言一句何其難也必出於仁義其富若生蓄萬物必具海􅉼地負放恣縱橫無所統紀然而不煩於繩削而自合也嗚呼紹述於斯術其可謂至於斯極者矣李道昌道昌唐大曆十三年為蘇州觀察使一日郡城外虎丘山有鬼題詩二首隱于石壁之上云青松多悲風蕭蕭聲且哀南山接幽壠幽壠空崔嵬白日徒昭昭不照長夜臺雖知生者樂魂魄安能回况復念所親慟哭心肝摧慟哭更何言哀哉復哀哉又曰神仙不可學形化空遊魂白日非我朝青松為我門雖復隔幽顯猶知念子孫何以遣悲惋萬物歸其根寄語世上人莫厭臨芳樽莊生問枯骨王樂成虛言道昌異其事遂具奏聞准勑令致祭道昌為其文曰嗚呼萬古丘陵化無再出君若何人能間詩筆何代而亡誰人子姪曾作何官是誰仙室寂寞夜臺悲乎白日不向𥿄上石中隱出桃源三月深草垂楊黃鶯百囀猿聲斷腸不題姓字寧辨賢良嗚呼哀哉嘆昔先賢空傳經史終無再還青松嶺上嵯峨碧山大唐正業巳記詩言痛復痛兮何處賔悲復悲兮萬古墳能作詩兮動天地聲悲怨兮淚霑巾感我皇兮列清酌願當生兮事明君是時祭後經數日再有詩一絶于石云幽冥雖異路平昔忝攻文欲知潜昧處山北兩孤墳後於寺山之地果有二墳極高大荆榛藂茂詢諸耆艾竟不知何姓氏至今猶存皮日休和云念爾風雅魂幽咽猶能文空令傷魂鳥啼破山邊墳陸龜䝉和云靈氣猶不死尚能成綺文如何孤窆裏猶自讀三墳唐詩紀事卷第三十四
