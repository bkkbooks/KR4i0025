front:
  text: 唐詩紀事卷第三十二
  hash: sha256:f4c58d17e2b1e083f7b66f35b9583d82ab54908b537eebf1857ece4b516e801b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_032-1a}
body:
  text: 崔琮李竦裴逵于尹躬顔粲葉季良陳通方嚴公弼嚴公貺王表陸贄楊炎元季川蔣煥包何陸海劉商八拍胡笳十崔琮長至日上公獻夀詩云應曆三陽首朝天萬國同斗邊看子月臺上候祥風五夜鏡初曉千門日正融王階文物盛仙仗武貔雄率舞皆羣辟稱觴即上公南山為聖夀長對未央宮琮登大曆二年進士第李竦長至日上公獻夀詩云候曉金門闢乘時寶曆長羽儀瞻上宰雲物麗初陽漢禮方傳佩堯年正捧觴日行臨觀闕帝錫洽圭璋盛美超三代洪休降百祥自憐朝不坐空此詠無疆竦登大曆二年進士第官于京師朱泚亂竦與關播盧𣏌皆踰垣走追及帝咸陽裴逵南至日太史登臺書雲物詩云圓丘才展禮佳氣近初分太史新簮筆髙臺紀彩雲煙空和縹眇曉色共氛氲道泰資賢輔年豐荷聖君恭惟司國瑞兼用察人文應念懷鉛客終朝望碧氛逵登大曆進士第于尹躬南至日太史登臺書雲物詩云至日行時令登臺約禮文官稱伯趙氏色辨五方雲晝漏聽初發陽光望漸分用天為嵗備持簡出人羣惠愛周微物生靈荷聖君常當有嘉瑞郁郁復紛紛尹躬大曆進士元和間為中書舍人坐其弟臯漢以贓獲罪左授洋州刺史制云雖無從坐之法合當失教之責顔粲吳宮教美人戰云有客陳兵畫功成欲霸吳玉顔承將略金鈿指軍符轉佩風雲暗鳴􅤯錦繡趨雪花頻落粉杳汗盡流珠掩笑誰欺令嚴刑必用誅至今孫子術猶可靜邊隅粲登建中進士第葉季良吳宮教美人戰詩云強吳矜霸略講武在深宮盡出嬌娥妓先觀上將風揮戈羅袖卷擐甲汗粧紅掩笑分旗下含羞入隊中鼓停行未正刑舉令才崇自可威鄰國何勞逞戰功李良登正元進士第陳通方通方金谷園懷古云緩步洛城下􅎮懷金谷園昔人隨水逝舊樹逐春繁冉冉搖風弱菲菲裛露翻歌臺豈易見舞袖乍如存戲蝶香中起流鶯暗處喧徒聞施錦帳此地擁行軒通方登正元進士第與王播同年播年五十六通方甚少因期集撫播背曰王老奉贈一第言其日暮途逺及第同贈官也播恨之後通方丁家艱辛苦萬狀播捷三科為正郎判鹽鐵通方窮悴求助不甚給之時李虛中為副使通方以詩求為汲引云應念路傍憔悴翼昔年喬朩幸同遷播不得巳薦為江西院官嚴公弼題漢州西湖云西湖創置自房公心匠縱橫造化同見說鳳池推獨步髙名何事滯川中公弼公貺嚴震之子震梓州人建中中為鳳州刺史治行為山南第一封鄖國公公弼襲封嚴公貺題漢州西湖云鳳沼才難盡餘思鑿西湖珍朩羅修岸氷光映坐隅琴臺今寂寞竹島尚縈紆猶藴濟川志芳名終不渝桞子厚序送公貺下第歸興元覲省云相國馮翊公極人臣之尊分天子之憂殿邦坤隅柄是文武而子之伯仲皆脫略貴美服勤儒素故繼登上科以及於子是可舉嚴氏之教誦乎他門使有矜式也子何患賈之不售耶王表大曆十四年侍郎潘炎試花發上林苑表詩云御苑春何早繁花巳繡林笑迎明主仗香拂美人簮地接樓臺近天垂雨露深晴光來戲蝶夕景動棲禽欲託凌雲勢先開捧日心方知桃李樹從此别成隂清明日登城春望寄大夫使君詩云春城間望愛晴天何處風光不眼前寒食花開千樹雪清明日出萬家煙興來促席唯同舍醉後狂歌盡少年聞說鶯啼却惆悵詩成不見謝臨川元稹叙詩寄樂天詩云有人以陳子昻感遇詩相示吟玩激烈即日為寄思玄子詩二十首故鄭京兆於僕為外諸翁深賜憐奬因以獻京兆翁深相駭異祕書少監王表在座顧謂表曰使此兒五十不死其志義何如哉惜吾輩不見其成就因召諸子訓責泣下僕亦竊不自得由是勇於為文又久之得杜甫詩數百首愛其浩蕩津涯處處皆到始病沈宋之不存寄興而訝子昻之未暇旁備矣不數年與詩人楊巨源友善日課為詩性復僻懶人事常日間則有作識足下時有詩數百篇矣表大曆十四年潘炎下登第時謂榜有六異朱遂為朱滔太子表為李納置彼軍呼為附馬趙博宣為易定押衙袁同直入番為阿師竇常二十年稱前進士其一奚陟也或曰六差陸贄太曆八年試禁中春松云隂隂清禁裏蒼翠滿春松雨露恩偏近陽和色更濃高枝分曉月虛吹雜霄鍾香助爐煙逺形疑蓋影重願符千載夀不羡五株封幸得回天眷全勝老碧峰錢起喜贄擢第還蘇州云鄉路歸何早雲間喜擅名思親盧橘熟帶雨客帆輕夜火臨津驛晨鍾隔浦城華亭養仙羽計日再飛鳴楊炎流崕州至鬼門關作云一去一萬里千知千不還崕州何處在生度鬼門關元載末年納薛瑶英為姬處以金絲帳却塵褥衣以龍綃衣載以瑶英體輕不勝重衣於異國求此服也唯賈至與炎雅與載善往往時見其歌舞至贈詩曰舞怯銖衣重笑疑桃臉開方知漢成帝空築避風臺炎亦贈歌云雪靣淡眉天上女鳳簫鸞翅欲飛去玉山翹翠步無塵楚腰如桞不勝春炎字公南常衮長於除書炎善德音自開元後言制詔者稱常楊元載與炎同郡炎又出也故擢炎禮部侍郎德宗時位宰相元季川泉上雨後作云風雨蕩繁暑雷息佳霽初衆風帶雲雨清風入我廬颯颯凉飈來臨窺愜所圖緣蘿長新蔓裊裊垂坐隅流水復簷下丹砂發清蕖養葛為我衣種芉為我𬞞誰是畹與畦弥漫連野蕪山中晚興云河漢降玄霜昨來節物殊愧無神仙姿亦有隂陽俱靈鳥望不見慨然悲髙梧華葉隨風揚珍條雜榛蕪為君寒谷吟歎息知何如季川大曆正元間詩人也一曰季川名融元次山之弟也次山作處規云季川曰兟復不言兟有意乎兄兟稱也之别蔣渙和徐侍郎書叢篠韵云中禁夕沉沉幽篁别作林色連雞樹近影落鳳池深為重凌霜節能虛應物心年年承雨露長對紫庭隂渙儀鳳宰相智周之孫與兄冽皆第進士渙永泰初歷鴻臚卿日本使嘗遺金帛不納唯取箋一番以貽其副云終吏部尚書冽終尚書左丞包何江上田家云近海川原薄人家本自稀黍苖期臘酒霜葉是寒衣市井誰相識漁樵夜始歸不須騎馬問恐是狎鷗飛同諸公尋李方真不遇云聞說到揚州吹簫有舊逰人來多不見莫是上迷樓和苖員外寓直寄臺中舍弟云朝列稱多士君家有二難正為臺裏柏芳作省中蘭兵直分曹闊晨趨接武歡每憐雙闕下鴈序入鴛鸞闕下芙蓉云一人理國致升平萬物呈祥助聖明天上河從闕下過江南花向殿前生慶雲垂䕃關難落湛露為珠滿不傾更對樂懸張宴處歌工欲奏採蓮聲賦得稱送雲孺卿云願以金錘稱因君贈别離鈎懸新月吐衡舉衆星隨掌握須平執錙銖必盡知由來投分定莫被弄權移何字幼嗣融之子也大曆中為起居舍人劉商秋夜聽嚴紳巴童倡竹枝歌云巴人逺從荆山客回首荆山楚雲隔思歸夜倡竹枝歌庭槐葉落秋風多曲中歷歷叙鄉思鄉思綿綿楚詞古身騎吳牛不畏虎手提簔笠欺風雨猿啼日暮江岸邊緑蕪連山水連天來時十三今十五一成新衣巳再補鴻鴈南飛報鄰伍在家歡樂辭家苦天晴露白鍾漏遲淚㾗滿靣看竹枝曲終寒竹風裊裊西風落日東風曉移居深山謝别親故云不食黃精不採薇葛苖為帶草為衣孤雲更入深山去人絶音書鴈自飛商髙情放游戲為山水朩石自張璪貶後惆悵賦詩曰苔石蒼蒼臨澗水溪風島島動松枝世間唯有張通㑹流向衡陽那得知商彭城人居長安劉禹錫作高陵令劉仁師遺愛碑云武德名臣刑部尚書德威三代孫大曆中詩人商之猶子其名重如此商終於檢校禮部郎中汴州觀察判官胡笳銅雀妓云魏主矜娥眉美人美於玉髙臺無晝夜歌舞竟未足盛色如轉圓夕陽落深谷仍令身殁後尚縱平生欲紅粉淚縱橫調絃向空屋舉頭君不在唯見西陵朩玉輦豈再來嬌鬟為誰緑那堪秋風裏更舞陽春曲曲罷情不勝闌干向西哭臺邊生野草來去罥羅縠况復陵寢間雙雙見麋鹿古意云連曙寢衣冷開門霜露凝風吹昨夜淚一片枕前氷滑州送人先歸云河水氷銷旅鴈飛寒衣未足又春衣自憐飄蕩經年客送别千回獨未歸陸海陸餘慶與陳子昻盧藏用為方外十友孫海工於五言為賀賔客所賞自省郎典潮州但賦詩自通題奉國寺云新秋夜何爽露下風轉凄一磬竹窗外千燈花塔西題龍門寺云窗燈林靄裏門磬水聲中更與龍華㑹爐煙滿夕風孫長源有才思嘗為諷刺云忽然一曲稱君心破却中人百家産又云城外平人驅欲盡帳中猶打衮花毬唐詩紀事卷第三十二
