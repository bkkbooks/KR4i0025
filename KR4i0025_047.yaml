  text: 唐詩紀事卷第四十七
  hash: sha256:89d3064f182b7ae1ded4a24c6ba07f86e8ff5d07460ff9ea7641bd4907f39a37
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_047-1a}
body:
  text: 謝良輔鮑防杜奕丘丹嚴維鄭槩陳元初吕渭范燈樊珣劉蕃賈弇沈仲昌李祐李播蕭靜崔子向李逢吉楊乘謝良輔長安十二詠因載他詩於其後自良輔至沈仲昌有相會作憶憶長安十二詠云憶長安正月時和風喜氣相隨獻夀彤庭萬國燒燈青玉五枝終南往往殘雪渭水處處流澌又云憶長安臘月時溫泉彩仗新移瑞氣遙迎鳳輦日光先暖龍池取酒蝦蟇林下家家守嵗傳巵狀江南十二詠云江南孟冬天荻穗軟如綿緑絹芭蕉裂黃金橘柚懸太白與良輔遊涇川陵嵓寺詩云乘君素舸泛涇西宛似雲門對若溪且從康樂尋山水何必東遊入會稽良輔登天寶十一年進士第為團練所殺德宗時刺商州又狀江南十二詠云江南仲春天細雨色如煙絲為武昌桞布作石門泉鮑防憶長安十二詠云憶長安二月時玄鳥初至禖祠百囀宮鶯繡羽千條御柳黃絲更有曲江勝地此來寒食佳期狀江南十二詠云江南孟春天荇葉大如錢白雪裝梅樹青袍似葑田防雜感詩云漢家海內承平久萬國戎王皆稽首天馬常銜苜蓿花胡人嵗獻蒲萄酒五月荔枝初破顔朝離象郡夕函關鴈飛不到桂陽嶺馬走皆從林邑山甘泉御果垂仙閣日暮無人香自落逺物皆重近皆輕雞雖有德不如鸖防字子慎襄陽人正元初為禮侍䇿賢良方正得穆質裴復柳公綽歸登崔邠韋純魏弘簡熊執易世美防知人防於詩尤所感發以譏切當世與中書舍人謝良弼友善號鮑謝送薛補闕入朝云平原門下十餘人獨受恩多未殺身每嘆漢家兄弟少更憐楊氏子孫貧柴門豈斷施行馬魯酒郍堪醉近臣賴有軍中遺令在猶將談笑對風塵杜奕憶長安十二詠云憶長安三月時上范遍是花枝青門幾場送客曲水竟日題詩駿馬金鞭無數良辰美景追隨丘丹憶長安十二詠云憶長安四月時南郊万乘旌旗嘗酎玉巵更獻含桃絲籠交馳芳草落花無限金張許史相隨狀江南十二詠云江南季冬月紅蟹大如鯿湖水龍為鏡爐風氣作煙韋蘇州秋夜寄丹云懷君屬秋夜散步詠涼天山空松子落幽人亦未眠丹和云露滴梧葉鳴秋風桂花發中有學仙侶吹簫弄明月蘇州又贈丹云迹與孤雲逺心將野鸖俱那同石氏子每到府門庭丹和云久作煙霞侶暫將簮組親還同禇伯玉入館忝州人蘇州聽江笛送陳侍御云逺聽江上笛江上笛若君還愁獨宿客更向郡齋聞丹和云離樽聞夜笛寥亮入塞城月落車馬散悽惻主人情蘇州送丘員外還山詩云長棲白雲表暫訪髙齋宿還辭郡邑喧歸泛松江渌結茅隱蒼嶺伐薪響深谷同是山中人不知往來躅靈芝非庭草遼鸖委池鶩終當書里門一表髙陽族丹酬云側聞郡守至偶乘黃犢出不别桃源人一見經纍日蟬鳴念秋稼蘭酌動離瑟臨水降麾幢野艇才容膝參差碧山路目送江帆疾涉海得驪珠棲梧慙鳳質愧非鄭公里歸掃蒙籠室蘇州重送丘二十二還臨平山居云嵗中始再見方來又解携才留野艇語已憶故山棲幽澗人夜汲深林鳥長啼還持郡齋酒慰子霜露凄丹和云賣藥有時至自知往來踈遽辭池上酌新得日中書步出芙蓉府歸乘觳觫車猥蒙招隱作豈愧班生盧此丹述懷之作丹隱臨平山與韋蘇州往還韋有詩贈丹云高詞棄浮靡正行表鄉閭未真南宮拜聊偃東山居中元日鮑端公宅遇吳天師聮句云道流為柱史教戒下真仙維嚴共契中元會初修內景篇防鮑遊方依地僻卜室喜墻連輔謝良寶笥開金籙華池漱玉泉奕杜怪龍隨羽翼青節降雲煙青李昔去遺丹竈今來變海田蕃劉養形奔二景練骨度千年輔謝良騎竹投陂裏携壺挂牖邊槩鄭洞中嘗入靜河上舊談玄初陳允伊俗笙歌逺蓬壺日月偏珣樊清騾薊訓引白犬伯陽牽丹丘法受相君後心存象帝先渭呂道成能縮地功滿欲升天淹范何意迷孤性含情戀數賢筠吳鮑防代宗時以御史大夫歷福建江西觀察使吕渭大曆間為浙西支使大曆末貶歙州司馬觀十二月詩與中元聮句皆在江南時事也詠江南而憶長安其意可見矣嚴維憶長安十二詠云憶長安五月時君王避暑華池進膳甘瓜朱李續命芳蘭綵絲競處髙明臺謝槐隂柳色通逵狀江南十二詠云江南春季天蓴葉細如絃池邊草作徑湖上葉如船維字正文越州人與劉長卿善長卿對酒寄維云陋巷喜陽和衰顔對酒歌懶從華髮亂間住白雲多郡簡容垂釣家貧學弄梭門前七里瀨早晚子陵過維答云蘇耽佐郡時近出白雲司藥補清羸疾窗吟絶妙詞桞塘春水慢花塢夕陽遲欲識懷君意朝朝訪楫師州司馬時劉為睦維作越之諸暨尉劉隨州以詩送云愛爾文章逸還家印綬榮退公兼色養臨下帶鄉情喬木映官舍春山宜縣城應憐釣臺石間却為浮名維留别云中年從一尉自笑此身非道薄甘微祿時艱耻息機晨趍本鄉府晝偃故山扉待見干戈畢何妨更採薇題靈一上人院新泉云山下新泉出泠泠比法源落花才有響濺石未成䀶獨映孤松色難分衆鳥喧唯當清月夜觀定此禪門送薛尚書入朝云卑情不敢論拜首入轅門列郡諸侯長登朝八座尊凝笳臨水發行斾向風翻幾許遺民泫同懷父母恩哭靈一上人云一公何不住空有逺公名共説岑山路今時莫可行舊房松更老新塔草初生經論傳緇侣文章遍墨卿禪床枝幹折法字棟梁傾誰復修僧史應知傳巳成長卿送維赴河南充嚴中丞幕府云久别耶溪客來乘使者軒用才榮入幕扶病喜同樽山屣留何處江帆去獨翻暮情辭鏡水愁夢識雲門蓮府開花蕚桃源寄子孫何當舉嚴助偏沐漢朝恩維贈别云早見登郎署同時迹下僚幾年江路永今日國門遙文變騷人體官移漢帝朝望山吟度日接枕話通霄萬里趍公府孤帆恨信潮康時知巳老聖代耻逃堯長卿蛇浦月下重送云秋風颯颯鳴條風月相和寂寥黃葉一離一别青山暮暮朝朝寒江漸出髙岸老樹猶依斷橋明日行人巳逺空餘淚逐歸潮維重别云月色今霄最明庭間夜久天清愁靜多年左宦殷勤逺别深情溪臨修竹煙色風落髙梧雨聲耿耿相看不寐遙聞擊拆山城長卿七里瀨重送云秋江渺渺水空波越客孤舟欲榜歌手折衰楊悲老别故人零落已無多維重别云新安非故枉帆過海內如君有幾何醉裏别時秋水色老人南望一狂歌錢起送維尉河南云蕙葉青青花亂開少時趍府下蓬萊甘泉未厭楊雄賦吏道何勞賈誼才征陌獨愁雲蓋逺離筵只惜暝鍾催欲知别後相思處願植瓊林向柏臺維終校書郎鄭槩憶長安十二詠云憶長安六月時風臺水榭逶迤朱果雕籠香透分明紫禁寒隨塵驚久衢客散赭汗滴瀝清驪司空曙寄槩詩云倦枕欲徐行開簾秋日明手便笻杖冷頭喜葛巾輕緑草前侵水黃花半上城虛銷此風景不見十年兄狀江南十二詠云江南孟秋天稻花白如氊素腕慙新藕殘粧妬晚蓮陳元初憶長安十二詠云憶長安七月時槐花點散罘罳七夕針樓競出中元香供初移繡轂金鞍無限遊人處處歸隨僧靈一有送元初卜居麻源詩云欲向麻源隱能尋謝客蹤空山幾千里幽谷第三重嵓宇寧須葺荷衣不待縫因君見往事為我謝喬松陳孫移耶溪舊居呈陳元初校書云雞犬漁舟裏長謡任興行即令邀客醉巳被逺山迎書笈將非重荷衣著甚輕謝安無箇事忽起為蒼生呂渭憶長安十二詠云憶長安八月時闕下天髙舊儀衣冠共頒金鏡犀象對舞丹墀更愛終南灞上可憐秋草碧滋狀江南十二詠云江南仲冬天紫蔗節如鞭海將鹽作雪山用火耕田渭正元十一年知貢舉撓悶不能定去留寄詩前主司曰獨坐貢闈裏愁多芳草生仙翁昨日事應見此時情中書省桞久枯死興元二年車駕還桞再榮謂之瑞桞明年渭以為禮部賦題德宗甚惡之渭字君載河中人德宗時為禮部侍郎與裴延齡姻家擢其子上弟出為潭州刺史卒范燈憶長安十二詠云憶長安九月時登髙望見崑池上苑初開露菊芳林正獻霜梨更想千門萬户月明砧杵參差狀江南十二詠云江南季夏天身熱汗如泉蚊蚋成雷澤袈裟作水田樊珣憶長安十二詠云憶長安十月時華清士馬相馳萬國來朝漢闕五陵共臘秦祠晝夜歌鍾不歇山河四塞京師狀江南十二詠云江南仲夏天時雨下如川盧橘垂金彈甘蕉吐白蓮劉蕃憶長安十二詠云憶長安子月時千官賀至丹墀御苑雪開瓊樹龍堂氷作瑶池獸炭氊爐正好貂裘狐白相宜狀江南十二詠云江南季秋天栗熟大如拳楓葉紅霞翠蘆花白浪川蕃登天寶六年進士第賈弇狀江南十二詠云江南孟夏天慈竹笋如編蜃氣為樓閣蛙聲作管絃弇登大曆進士第桞子厚先友志云弇長樂人善士也為校書郎卒李益送校書賈弇東歸寄振上人詩云北風吹鴈數聲悲况指前林是别時愁草不堪頻送逺白雲何處更相期山隨匹馬行看暮路入寒城獨去遲為向東州故人道江淹巳擬惠休詩沈仲昌狀江南十二詠云江南仲秋天鱏鼻大如船雷是樟亭浪苔為界石錢仲昌登天寶九年進士第蕭頴士送劉方平沈仲昌秀才同觀所試雜文云山東茂異有河南劉方平臨汝沈仲昌以郡府計偕之尤當禮闈能賦之試餘勇待賈未始踰辰吾徒相與登羣玉咀遺芳目臨雲外思入神境佳哉樂乎意數子之出幽谷而漸于陸矣李祐袁江口懷王司勳王吏部云京華不啻三千里客淚如今一萬雙若箇最為相憶處青楓黃竹入袁江唐宗室也大曆元和間江南録事參軍纂之子李播見志云去嵗買琴不與價今年沽酒未還錢門前債主鴈行立屋裏人醉魚貫眠播登元和進士第播以郎中典蘄州有李生携詩謁之播曰此吾未第時行卷也李曰頃於京師書肆百錢得此遊江淮間二十餘年矣欲幸見惠播遂與之因問何往曰江陵謁盧尚書播曰公又錯也盧是某親表李慚悚失次進曰誠若郎中之言與荆南表丈一時乞取再拜而出蕭靜三湘有懷云桞絮飛來别洛陽梅花落後到三湘世情已逐浮雲散離恨空隨江水長崔子向上鮑大夫云行盡江南塞北時無人不誦鮑家詩東堂桂樹何年折直到如今少一枝元時人鮑防正送惟詳律師自越之義興云陽羡諸峯頂何曾異剡山雨晴人到寺朩落夜開關縫衲紗燈晃看心錫杖間西方知有社未得與師還子向正元以前為監察御史終南海從事裴鉶傳竒云子向之子煒正元中人居南海李逢吉送令狐秀才赴舉云子有雄文藻思繁齠年射䇿向金門前隨鸞鸖登霄漢却望風沙走塞垣獨憶忘機陪出處自憐何力繼飛翻郍堪兩地生離緒蓬户長扄行旅喧和嚴揆省中宿齋遇令狐員外當直之作云致齋分直宿南宫越石盧諶此夜同位極班行猶念舊名題章奏亦從公曾驅瓜士三邊靜新贈髯參六義窮竟夕文昌知有月可憐如在庾樓中望京臺上寄令狐華州云祗役滯南服頽思屬暮年間上望京臺萬山蔽其前落日歸飛翼連翩東北天涪江適在下為我久潺湲中葉成文教德威清逺邊頒條信徒爾華髮生蒼然寄懷三峯守岐路隔雲煙奉酬忠武李相公見寄云直繼先朝衛與英能移孝友作忠貞劔門失險曽縳虎淮水安流緣斬鯨黃閣碧幢惟是儉三公二伯未為榮惠連忽贈池塘句又遣羸師破膽驚酬致政楊祭酒見寄云初還相印罷戎旃獲守皇居在紫煙妄比鄼侯功蔑爾每懷踈傳意悠然應將半俸霑閭里料入中條訪洞天十載别離那可道倍令驚喜見來篇逢吉與令狐楚有唱和詩曰斷金集裴夷直為之序云二相未遇時每有所作必驚流輩不數年遂壓秉筆之士及入官登高益復隆高我不求異他人自逺逢吉卒楚有題斷金集詩云一覽斷金集載悲埋玉人牙絃千古絶珠淚萬行新楊乘甲子嵗書事時上黨用兵討賊云竪子未鼎烹大君尚旰食風雷隨出師雲霞有戰色犒功椎萬牛募勇懸千帛武士日曵柴飛將競執馘喜氣迎捷書歡聲送羽檄天兵日雄強桀犬稍離坼賊臂既巳斷賊喉既巳扼樂禍但鯨鯢同惡惟肘腋小大勢難侔逆順初不敵違命固天亡恃險乖長䇿蠆毒久萌牙狼顧非日夕禮貌忽驕狂疏奏遂指斥動衆豈佳兵含忍恐無益鴻恩既巳孤小效不足惜腐儒一鉛刀投筆時感激帝閽不敢干恓恓坐長畫南徐春日懷古云六代驕奢地三春物象繁靈湖通漲海天塹隔中原曉渡高帆駃隂風巨艦翻旌旗西日落戈甲夏雲屯豹變資陳武龍飛擁晉元風流前事盡文物舊儀存邪侮嘗移潤忠貞幾度冤興亡山兀兀今古水渾渾露暖蜂偷蘂鶯啼日到軒酒腸堆麴蘖詩思繞乾坤愁夢全無蝶離憂每愧萱形骸勞大塊玉石任炎崑出處寧由巳升沉未足言且應中聖樂坐起任昏昏建鄴懷古云故城故壘滿江濆盡是干戈舊苦辛見此即須知帝力生來便作太平人吳中書事云十萬人家天塹東管絃臺榭滿春風名歸范蠡五湖上國破西施一笑中香徑自生蘭葉小響廊深映月華空樽前多暇但懷古盡日愁吟誰與同榜句云自憐乖拙兩何如晝泥琴聲夜泥書數拍胡笳彈未熟故人新命畫胡車乘甲子年書事乃會昌四年討劉稹也張為作主客圖以白樂天為廣大教化主而以乘為入室之上乘宣宗大中初登第官終殿中侍御史楊維直四子發假收嚴發以春為義其子以柷以乘為名假以夏為義其子以照為名收以秋為義其子以巨鏻鑑為名嚴以冬為義其子以注涉浻為名皆以文學登苐時號修行楊家與靖恭諸楊比於華盛唐詩紀事卷第四十七
