  text: 唐詩紀事卷第五十九
  hash: sha256:3c02529b41bf701e0f6b455a78db0e4948b3b7c7efb802b41f717de1d1f1da7b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_059-1a}
body:
  text: 薛瑩禇載汪遵蕭遇盧渥李訥崔元範楊知至封彥卿盧鄴髙湘盧溵滕倪林傑李明逺李章武郭圓薛逢張洪靖韓察崔恭崔公信陸湹胡證髙銖張賈薛瑩中秋月云三十六旬盈復缺百年堪喜又堪傷勸君莫惜登樓望雲放嬋娟不久長禇載雲詩云盡日看雲首不回無心都大似無才可憐光彩一片玊萬里青天何處來賀趙觀文重試及第云一枝仙桂兩回春始覺文章可致身已把色絲要上第又將彩筆冠群倫龍泉再淬方知利火浣重燒轉更新今日街頭看御榜大能榮耀苦心人案觀文乾寧二年崔凝下第八人登第是年命陸辰重試而觀文為榜首􅊨陸威為郎官載以文投獻數字犯其家諱威因矍然載尋以箋致謝曰曹興之圖畫雖精終慙誤筆殷浩之矜持太過翻逹空函載字厚之登乾寧進士第汪遵五湖詩曰巳立平吳霸越功片帆高揚五湖風不知戰國縱橫者誰似陶朱得始終澠池云西秦北趙各稱高池上張筵列我曹何事君王親擊缶相如有劔可吹毛函谷關云脫禍東奔壯氣催馬如飛電勢如雷當時若不輕彈鋏那得關門夜半開遵幼為吏許棠應二十餘舉遵猶在胥徒善為絶句詩而深晦密一旦辭役就貢會棠送客至灞滻間遇遵於途訊曰何事至京遵曰就貢棠怒曰小吏無禮後遵成名五年棠始登第秦築長城比鐡牢蕃戎不敢過臨洮雖然萬里連雲際爭及堯階三尺髙遵長城詩也得名於時遵宣城人登咸通七年進士第許棠其鄉人也水泉花木好髙樹嵩少縱橫滿目前惆悵人間不平事今朝身在海南邉遵題李太尉平泉莊詩也蕭遇春詩云南國韶光早春風送臘來水堤煙報栁山寺雪驚梅練色鋪江晚潮聲逐渚回青旗問沽酒何處撥寒醅蕭與韋保衡同年登第保衡以幸進而蕭自摽致衡銜之既相椅蕭之失貶播州司馬途經三峽月夜賦詩自悼懼其見害若有人告曰公其勿憂余當為禁禦蕭後為相盧渥渥字子章軒冕之盛近代無比伯仲四人咸居顯列乾符初母憂服闋渥自前中書舍人拜陜府觀察使弟紹前長安令除給事中弟沅自前集賢校理除左拾遺弟沼自畿尉遷監察御史詔書疊至士族榮之及赴任陜郊洛城自居守分司朝臣已下牙設祖筵洛城為之一空都人聳觀亘數十里渥題嘉祥驛詩曰交親榮餞洛城空秉鉞戎裝上將同星使自天丹詔下雕鞍照地數程中馬嘶靜谷聲偏響斾映晴山色更紅到後定知人易化滿街棠樹有遺風渥在舉場甚有時稱曾於滻水逆旅遇宣宗微行意其貴人斂身避之帝呼與相見乃自稱進士盧渥帝請詩卷袖之而去它日對宰臣語及盧渥今主司擢第宰臣問渥與主上有何階緣渥具陳其由時亦不以為忝渥應舉之歲偶臨御溝見一紅葉葉上有絶句置於巾箱或呈於同志及宣宗放宫人初下詔許從百官司吏獨不許貢舉人盧後一任范陽獲其退宫覩紅葉而吁藏巾篋驗其書無不驚訝詩曰水流何太急深宫盡日間殷勤謝紅葉好去到人間出本事詩唐末渥自陜府廉察入朝知舉遇巢冦犯闕不及終場趙崇戲之曰出腸不生養主司也蓋盧氏未嘗知舉盧相携耻之拔為主文卒不果渥終檢校司徒李訥李尚書訥為浙東廉使夜登越城樓聞歌曰堆門山上堆初飛其聲激切召至曰去籍之妓盛小叢也時察院崔侍御元範自府幕赴闕庭李餞之命小叢歌餞在座各為一絶贈送之崔下句云獨向柏臺為老吏或曰侍御鳯閣中書即其程也何老於柏臺請改之崔不可是年秋崔鞠獄譙中乃終於柏臺之任訥詩云繡衣奔命去情多南國佳人斂翠娥曾向教坊聽國樂為君重唱盛叢歌訥故侍郎建字杓直之子字敦正大中時為浙東觀察使卒於兵部尚書崔元範元範詩云羊公留宴峴山亭洛浦髙歌五夜情獨向柏臺為老吏可憐林木響余聲元範以監察御史為浙東幕府楊知至知至詩云趙燕能歌有幾人為花回雪似含聲頻隨御史西歸去誰伴文翁怨九春知至時為浙東團練判官會昌四年王起奏五人楊知至汝士之子刑部尚書源重午僧故相孫孺之鄭朴崔永式女壻河東節度使楊嚴發之弟監察御史竇緘直之子故相易有旨令送所試雜文付翰林重考覆續奉進旨楊嚴一人宜與及第源重等四人落下知至因以長句呈同年曰由來梁堆與冥鴻不合翩翩向碧空寒谷謾勞鄒氏律長天獨遇宋都風此時泣玉情雖異它日銜環事亦同二月春光正搖蕩無因得醉杏園中知至字幾之登進士第為宰相劉瞻所善擢纍户部侍郎封彥卿彥卿詩云蓮府才為緑水濵芙蓉泛緑水故有此句庾杲之在王儉幕府似忽乘驄馬入咸秦為君唱作西歌調日暮偏傷去住人彥卿大中進士第為浙東觀察判官户部尚書敖之子盧鄴鄴詩云何郎載酒别賢侯更吐歌珠宴庾樓莫道江南不同醉即陪舟楫上京溝鄴大中四年登第為浙東觀察使高湘湘詩云謝安春渚餞袁宏千里仁風一扇清歌黛慘時方酩酊不知父子重飛觥唐父子之學三家髙諧子湘湜子邵子允躬崔郾子瑤唯崔氏相去只二十年咸通末路嵓作相除不附已者十司户崔沆州李瀆繡州李藻費州湘髙州湘與兄湜不睦湜為中書舍人與嵓善湘到任憤湜不巳嘗賦詩曰唯有髙州是當家湘字濬之鍇之子為右諌議大夫盧溵溵詩云烏臺上客繡衣公共捧天書靜境中桃朵不須歌白苧耶溪暮雨起樵風溵浙東處士也滕倪滕倪苦心為新詩嘉聲早播逺之吉州謁宗人太守郎中邁邁每吟其句云自髮不能容相國也同間客滿頭生又題鷺鷀障子云映水有深意見人無懼心邁曰魏文惜陳思之學潘安褒正叔之文貴集一家之盛如此倪逼秋試捧笈告逰留詩為别悵然曰是必不祥倪至秋逝於啇於館舍聞者莫不傷焉倪詩曰秋初江上别旌旗故國無家淚欲垂千里未知投足處前程便是聽猿時誤攻文字身空老却返漁樵計已遲羽翼雕零飛不得舟霄無路接差池林傑林傑字智周幼而秀異言則成文年六歲請舉童子時父肅為閩府大將性樂善尤好聚書又妙於手談當時名公多與之交及有是子益大其門廉使崔侍郎于函與遷職鄉人榮之傑五歲父携行至王仙君霸壇戲問童子能詩乎傑口占云羽客已登仙路去丹爐草木盡雕殘不知千載歸何日空使時人掃舊壇父初不謂眇歲之作遽臻於此群親益驚異遞相傳諷自此日課所為未幾盈軸明年遂獻唐中丞唐既伸幅窺吟聳尓駭嘆命子弟延入學院時會七夕賦乞巧詩傑援筆曰七夕今霄看碧霄牛郎織女渡河橋家家乞巧望秋月穿盡紅絲幾百條唐嘆曰真神童耳傑又精於琴棋草隸俱自天然不煩師授唐因與賔從碁或全局輸者令罩之勿觸取童子來繼終其事傑必指縱出竒往往返勝曲盡其妙時謂神助後復業詞賦頗振聲問有仙客入壺中賦云仙客以變化隨形逍遙放情處於外則一壺斯在入其中則萬象俱呈飛閣重樓不是人間之狀竒花異木無非物外之名至九歲謁盧大夫貞黎常侍植無不嘉奬尋就賔廡日在宴筵李侍御逺趙支使格深所知仰不捨斯須和趙支使詠荔枝詩云金盤摘下排朱顆紅殼開時飲玉漿鄭副使立作竒童傳劉制置潼為序以貽之至年十七方結束琴書將西邁而殂李明逺宣宗時太僕卿韋覲以禱醮之故為女巫誣告帝知其寃詔誅巫謫覲潘州司馬李明逺時為監察御史有詩曰北鳥飛不到南人誰去逰天涯浮瘴水嶺外向潘州草木春秋暮猿猱日夜愁定知遷客淚應只對君流李章武大和末勑僧尼試經不通者勒還俗章武為成都少尹有山僧云禪觀有年未嘗念經今被追試前業棄矣章武贈詩曰南宗尚許通方便何處心中更念經好去苾篘雲水畔何山松柏不青青諭主者特免試郭圓世傳張延賞韋臯持節劔南相代之事頗為延賞之耻郭泗濵圓詩曰宣父從周又適秦昔賢雖少出風塵當時甚訝張延賞不識韋臯是貴人南部新書云韋臯見辱於張延賞崔圓受薄於李彥允皆丈人子壻為西川交代圓會昌中檢校司門外郎為劔南李固言從事薛逢子庭圭逢字陶臣蒲州人會昌進士初與劉瑑交會瑑當國有薦逢知制誥者瑑猥曰先朝以兩省官給事舍人先治州縣乃得除逢未試州執不可乃出刺巴州而楊收王鐸同牒署收輔政逢有詩微辭幾訕收銜之復斥蓬綿二州刺史鐸為相又以詩訾鐸云昨日鴻毛萬鈞重今朝山嶽一毫輕遂不見齒於祕書監題黃花驛云孤戌迢迢蜀路長鳥鳴山館客思鄉更看絶頂煙霞外數樹嵓花照夕陽元日田家云南村晴雪北村梅樹裏茅簷曉盡開蠻榼出門兒婦去鳥飛迎路女郎來相逢但祝新正夀對舉那愁暮景催長笑士林因管别一官輕是十年回賀楊收作相詩云闕下憧憧車馬塵沉浮相次宦逰身須知金印朝天客同是沙堤避路人威鳳偶時因瑞聖應龍無水謾通神丘門不是趍時客始向窮途學問津逢命一道士貌真自為贊曰裝造薛逢長一尺五寸於是絶筆終未能續一旦忽一羽衣詣門見真讃命筆續之云手把金鎚鑿開混沌長揖而去不知所之逢鑿開混沌賦得名也漢武帝詞云武帝清齋夜築壇自斟明水醮仙官殿前童女移香案雲際金人捧露盤絳節有時還入夢碧桃何處更驂鸞茂陵煙雨埋弓劔石馬無聲謾草寒張洪靖宏靖為太原節度使有山亭懷古詩云叢石依古城懸泉灑清池髙低袤丈內衡霍相蔽虧歸田竟何因為郡豈所宜誰能辦大野寄適聊在斯節度判官侍御史韓察和云公府政多暇思與仁智全為山想嵓穴引水聽潺湲軒冕迹自逸塵俗無由牽蒼生方矚望詎得賦歸田節度副使檢校右散騎常侍崔恭和云髙情樂間放寄迹山水中朝霞鋪座右虛白貯清風潛竇激飛泉石路躋且崇步武有勝槩不與俗情同梁肅文集恭能文嘗叔觀察判官兼殿中侍御史崔公信和云疊石狀崖巘翠含城上樓前移盧霍峰逺帶沅湘流瀟灑主人靜夤緣芳徑幽清輝在昏旦豈異東山逰給事中陸瀍和云激水㵼飛瀑寄懷良在兹如何謝安石要結東山期入座蘭蕙馥當軒松桂滋於焉悟幽道境寂心自怡左金吾衛大將軍胡證和云飛泉天台狀峭石蓬萊姿潺湲與青翠咫尺當幽竒居然盡精道得以書妍詞豈無他山勝懿此清軒墀節度判官監察御史髙銖和云鬪石類嵓巘飛流㵼潺湲逺壑簷宇際孤鸞雉堞間何必到海嶽境幽機自間兹焉得髙趣髙步謝東山尚書左丞張賈和云中庭起崖谷漱玊下漣漪丹丘誰云逺寓象得心期豈不貴鍾鼎至懷在希夷唯當蓬萊閣靈鳳復來儀從姪也賈洪靖節度掌書記監察御史李德裕和云嵓石在朱戶風泉當翠樓始知峴亭賞難與清輝留余景淡將夕凝嵐輕欲收東山有歸志亦接赤松逰洪靖字元理元和中自宰相出為河東節度使公信登元和元年進士第洪靖帥太原辟為掌記後以德裕代之以公信為觀察判官瀍登正元元年進士第證河東人舉進士第元和十三年自振武節度使召任金吾大將軍趙宗儒鎮河中證時建節赴振武備桑梓里入謁持刺稱百姓獻趙公詩云詩書入京國旌斾過鄉關州里榮之話録出因退之奉酬振武胡十二丈大夫詩云傾朝共羡寵光頻半嵗遷騰作虎臣弩矢前驅煩縣令停辭仕樹一云戎笳斬里門先下敬鄉人撗飛玊盞家山曉逺蹀金珂塞草春自笑平生誇膽氣不離文字鬢毛新恭終汾州刺史銖字權仲既擢第為洪靖幕府後為太常卿賈為韋夏卿所知後至逹官初以侍御史為華州上以忘言之句别之曰束簡下髙閣買符驅短轅故人惜分袂結念醉芳樽切切别思纒蕭蕭征騎煩臨歸無限意相視却忘言唐詩紀事卷第五十九
