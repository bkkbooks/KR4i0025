  - {type: variant, offset: 1303, length: 278, content: 爲岀世行云生當爲大丈夫斷覊羅岀泥塗四散號呶擾俶無隅埋之深淵飄然上浮騎龍披青雲汎覽遊八區經㤗山絶大海一長吁西摩月鏡東弄日珠上括天之門直指帝所居群仙來迎塞天衢鳳凰鸞鳥􅙾金輿音聲嘈嘈滿太虚旨飲食兮照疱厨食之不飫飫不盡使人不陋復不愚旦旦狎玉皇夜夜御天姝當御者幾人百千爲飜宛宛舒舒忽不自知支消體化膏露明湛然無色芮席濡俄而散漫裴然虚無翕然後搏搏乆而蘇精神如太陽霍然照淸都四支爲琅玕五藏爲璠璵顔如芙蓉頂爲醍醐與天地相終始浩漫爲歡娛下顧人間溷糞蠅蛆湜不善詩退之和公安陸渾二篇可以想見其恠竒退之詩曰皇甫作詩止睡昏辭䜍岀真遂上焚要余和增恠又煩雖欲悔舌不可椚言其語恠而好譏罵也湜, WYG: ''}
