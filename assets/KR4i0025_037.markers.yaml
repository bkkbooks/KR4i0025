  - {type: variant, offset: 745, length: 377, content: 偷鸚鵡舌文章分得鳯凰毛紛紛辭客多停筆箇箇君候欲夢刀别後相思隔煙水菖蒲花發五雲高後㢘問淛東乃有劉採春自淮甸而來容華奠比元贈詩曰新粧巧様盡雙蛾褁慢常州透額羅正靣偷倫光滑笏暖行輕踏皺紋波言辭雅措風流足舉止低回秀媚多更有惱人腸斷處選詞能唱望夫歌望夫歌者即羅嗊之曲也元云在淛河七年因醉題東武其詩曰役役行人事紛紛碎簿書功夫兩衙盡留滯七年餘病痛梅天發親情海㟁踈因循未歸得不是憶鱸魚盧侍郎簡求戯曰丞相雖不爲鱸魚爲好鏡湖春色耳謂採春也公先娶京兆韋氏字蕙叢韋逝爲詩悼之曰曾經滄海難爲水除却巫山不是雲岀本事傳稹元和四年爲御史鞠獄梓潼樂天昆仲送至城西而别後旬日昆仲與李侍郎建閑遊曲江及慈恩寺飲酣作詩曰花時同醉破春愁醉折花枝作酒籌忽憶故人天際去計程今日至梁州後旬日得元書果以是日至褒仍寄詩曰夢見兄弟曲江頭也到慈恩院院遊驛吏喚人排馬去忽驚身在古梁州千里魂交合若符契自有感夢記備叙其事, WYG: ''}
