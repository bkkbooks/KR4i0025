  - {type: line-break, offset: 0, content: '', id: KR4i0025_SBCK_037-1a01}
  - {type: variant, offset: 0, length: 359, content: 唐詩紀事巻第三十七元􅍬􅍬為御史奉使東川於褒城題黄明府詩其序云昔年曾於觧縣飲酒余為觥録事嘗於竇明府㕔有一人至頻犯語令連飛十數觥不勝因迯去醒後問人前虞卿黄丞也此後絶不復知元和四年三月奉使東川十六日至褒城驛逡廵有黄明府見迎瞻其形容髣髴似識問其前衘即曩日逃席黄氶也説向前事黄生惘然而悟因饋酒一罇􅋈舟請余同載余不免其意與之盡歡徧問褒陽山水則褒姒所奔之城在其左諸葛所征之路次其右感今懐古作贈黄明府詩曰昔年曾痛飲黄令困飛觥席上當時走馬前今日迎依稀迷姓字積漸識平生故友身皆逺他鄉眼暫明便邀連榻坐兼共剔舡行酒思臨風亂霜稜拂地平不㸔深淺酌貪愴古今情迤邐七盤路坡拖數大城花疑褒女笑棧息武侯征一種埋幽石空開千載名出本事詩稹聞西蜀薛濤有辭辯及爲監察使蜀以御史推鞠難得見焉嚴司空潜知其意毎遣薛徃洎登翰林以詩寄曰錦江滑膩峨眉秀生出文君與薛濤言語巧稹, WYG: ''}
