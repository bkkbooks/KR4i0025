  - {type: variant, offset: 1443, length: 491, content: 盡他繁華當時能獵賢保國兼保家乆困名塲咸通末戴佐大同軍幕棠徃謁之一見如舊相識留連數月但詩酒而巳未嘗問所欲一旦大會賔友命使者以棠家書授之棠驚㬽莫知其來啓緘即知戴潜遣一介䘏其家矣戴與姚合善合其詩云天府鹿鳴客幽山秋未歸我知方甚善衆說以爲非隔石聞泉細和風見鸖飛新詩此處得清峭此應稀合又有送戴下第客遊詩云昨夜送君處亦是九衢中此日慇懃别前時寂寞冋鳥啼寒食雨花落暮春風向晚離人别筵收樽未空戴酬姚合歸字韻詩云歧路非人見尚得起心中日憶瀟湘渚春生蘭桂叢鳥啼花半落客散爵方空所贈誠難荅冷然一雅風蠻家云領得賣珠錢還歸銅柱邊㸔兒調小象打鼓新船醉後眠神樹耕時語瘴煙不逄寒便老相問莫知年夕次淮口云天涯秋光盡木末群鳥還夜乆遊子息月明岐路閑風生淮水上㠶落楚雲間此意竟誰見行行非故關夕發邠中路却寄舒從事云飲酣走馬别馬後鏁邉城日落月未上鳥棲人獨行方馳故國戀復愴長年情久夜不能息何當閑此生楚江懷古云露氣寒光集微陽下楚丘猿啼洞庭樹人在木蘭舟廣澤生明月蒼山夾亂流雲中君不見竟夕自悲秋金華子云戴大中𥘉掌書記於大原李司空幕以正言𬒳斥貶龍陽尉行道興詠以自傷其方城懷古云申胥任向秦庭哭靳尚終貽楚國羞新春聞赦云道在掅讒息仁深疾苦除堯聦能下, WYG: ''}
