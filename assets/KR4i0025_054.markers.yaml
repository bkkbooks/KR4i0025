  - {type: line-break, offset: 0, content: '', id: KR4i0025_SBCK_054-1a01}
  - {type: variant, offset: 0, length: 1027, content: 唐詩紀事卷第五十四韋表㣲羅引信高崇文王智興劉綺莊馬戴孟遲南卓鄭顥李群玉温庭筠周繇韋表微表微字子明韋皐鎮西川王緯司空曙獨孤良弼裴說居幕府厚相推挹以表微比衛玠自以不能及也遷中書舎人敬嘗語左右欲相二韋會崩事表㣲處厚以父池州夫子廟麟臺碑銘曰二儀旣閉三象乃乖聖道埋鬱人心不開上無文武下有定哀吁嗟麟兮孰爲來哉周雖不綱孔實嗣聖詩書旣刪禮樂太定勸善懲惡姦邪乃正吁嗟麟兮克昭符命聖道時君化行位尊茍或乖戾身窮道存於昭魯邑栖遑孔門吁嗟麟兮孰知其仁運極數殘德至時否楚國䆮廣秦封益侈墻仞迫阨﨑嶇闕里吁嗟麟兮靡有攸止世治則麟世亂則麏出非其時麋鹿同群孔不自聖麟不自祥吁嗟麟兮天何所亡羅引信柳詩云粧點青春更有誰青春常許占先知亞夫營畔風輕處元亮門前日暖遲花宻苑如飄六出葉繁何惜借䨇眉交情别緒論多少好向仁人贈一枝詠白菊云雖𬒳風霜競欲催皎然顔色不低摧巳疑素手能粧岀又似金錢未染來香散自宜飄渌酒葉交仍得䕃蒼苔尋思閉戸中霄見應認寒䆫雪一堆弘信字德孚魏州人爲魏博節度使高崇文崇文夲薊門將校討劉闢有功爲西川節度使渤海鄙言呼人爲􅐴兒一旦雪下崇文謂賔客曰某雖武夫亦有一詩乃吟曰崇文崇武不崇文提戈出塞號將軍那箇􅐴兒射鴈落白毛空裏雪紛紛或謂北齊敖曺之比也瑣云出此夢王智興智興為徐州節度一日從事於使院會飲賦詩智興召䕶軍俱至從事屏去翰墨智興曰適聞作詩何獨見某而罷復以牋陳席上小吏亦置牋於智興前於是引毫立成曰三十年前老徤兒剛𬒳郎官遣作詩江南花桞從君詠塞北煙塵獨我知四座驚嘆監軍謂張祐曰觀兹盛事豈得無言祐乃獻詩曰十年受命鎭方隅孝節忠規兩有餘誰信將壇嘉政外李陵草句右軍書左右曰書生謟辭耳智興叱曰有人道我惡汝軰又肯否張生海内名士篇什豈易得天下人間且以為王智興樂善矣劉綺莊楊州送人詩云桂檝木蘭舟楓江竹箭流故人從此去望逺不勝愁落日低㠶影歸風引棹謳思君折楊桞淚盡武昌樓置酒云酒熟人湏飲春還鬢巳秋願逄千日醉得逭百年愁卒卒周姬旦捿捿魯孔丘平生能㡬日不及且遨遊尤善樂府嘗守藩服與白敏中崔元式韋琮相知宣宗時人也馬戴易水懷古詩云荆卿西去不復返易水東流無盡期落日蕭條薊城北黄沙白草狂風吹送客南遊云擬卜何山隱高秋指岳陽葦乾雲夢色橘熟洞庭香踈雨殘虹影回雲背鳥行靈均如可問一為哭清湘河梁別云河梁送别者行哭半非親此地足征戰胡天多殺人金罍照離席寳瑟凝青春中秋夜對月云隂魄出海上望之増苦吟冷搜驪頷重寒徹􅑕胎深皓氣籠諸夏清光射萬岑悠然天地内皎㓗一般心校獵曲云楚子畋郊野布罟籠天涯浮雲張作羅萬草結成罝意在絶飛鳥臂弓腰鏌鋣逺將射句踐次欲誅夫差壯志一朝攄湯綱, WYG: ''}
