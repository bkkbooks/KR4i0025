  - {type: variant, offset: 775, length: 0, content: '', WYG: 欽定四庫全書唐詩紀事巻三十七宋計敏夫撰元微之微之為御史奉使東川於褒城題黄明府詩其序云昔年曾於觧縣飲酒余為觥録事嘗於竇明府㕔有一人至頻犯語令連飛十數觥不勝因迯去醒後問人前虞卿黄丞也此後絶不復知元和四年三月奉使東川十六日至褒城驛逡廵有黄明府見迎瞻其形容髣髴似識問其前衘即曩日逃席黄丞也説向前事黄生惘然而悟因饋酒一罇􅋈舟請余同載余不違其意與之盡歡徧問褒陽山水則褒姒所奔之城在其左諸葛所征之路次其右感今懐古作贈黄明府詩曰昔年曾痛飲黄令困飛觥席上當時走馬前今日迎依稀迷姓字積漸識平生故友身皆逺他鄉眼暫明便邀連榻坐兼共榜舡行酒思臨風亂霜稜拂地平不㸔深淺酌貪愴古今情迤邐七盤路坡陁數丈城花疑褒女笑棧息武侯征一種埋幽石空聞千載名出本事詩微之聞西蜀薛濤有辭辯及為監察使蜀以御史推鞠難得見焉嚴司空潜知其意毎遣薛徃洎登翰林以詩寄曰錦江滑膩峨眉秀幻出文君與薛濤言語巧偷鸚鵡舌文章分得鳯凰毛紛紛辭客多停筆箇箇君侯欲夢刀别後相思隔煙水菖蒲花發五雲高後㢘問淛東乃有劉採春自淮甸而來容華莫比元贈詩曰新粧巧様畵雙蛾謾裹常州透額羅正靣偷勻光滑笏緩行輕踏皺紋波言辭雅措風流足舉止低回秀媚多更有惱人腸斷處選詞能唱望夫歌望夫歌者即羅嗊之曲也元云在淛河七年因醉題東武其詩曰役役行人事紛紛碎簿書功夫兩衙盡留滯七年餘病痛梅天發親情海㟁踈因循未歸得不是憶鱸魚盧侍郎簡求戯曰丞相雖不為鱸魚為好鏡湖春色耳謂採春也公先娶京兆韋氏字蕙叢韋逝為詩悼之曰曽經滄海難為水除却巫山不是雲出本事傳微之元和四年為御史鞠獄梓潼樂天昆仲送至城西而别後旬日昆仲與李侍郎建閑遊曲江及慈恩寺飲酣作詩曰花時同醉破春愁醉折花枝作酒籌忽憶故人天際去計程今日到梁州後旬日得元書果以是日至褒仍寄詩曰夢見兄弟曲江頭也到慈恩院院遊驛吏喚人排馬去忽驚身在古梁州千里魂交合若符契自有感夢記備叙其事微之}
