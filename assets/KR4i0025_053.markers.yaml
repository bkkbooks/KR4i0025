  - {type: variant, offset: 3624, length: 1, content: 𥚑, WYG: 裙唐詩紀事巻五十三欽定四庫全書唐詩紀事巻五十四宋計敏夫撰韋表㣲羅𢎞信髙崇文王智興劉綺莊馬戴孟遲南卓鄭顥李羣玉温庭筠周繇韋表㣲表㣲字子明韋臯鎮西川王緯司空曙獨孤良弼裴説居幕府厚相推挹以表㣲比衛玠自以不能及也遷中書舍人敬嘗語左右欲相二韋會崩處厚以父事表㣲池州夫子廟麟臺碑銘曰二儀既閉三象乃乖聖道埋鬱人心不開上無文武下有定哀吁嗟麟兮孰為來哉周雖不綱孔實嗣聖詩書既刪禮樂大定勸善懲惡姦邪乃正吁嗟麟兮克昭符命聖與時合化行位尊茍或乖戾身窮道存於昭魯邑栖遑孔門吁嗟麟兮孰知其仁運極數殘徳至時否楚國寖廣秦封益侈墻仞廹阨﨑嶇闗里吁嗟麟兮靡有攸止世治則麟世亂則麏出非其時麋鹿同羣孔不自聖麟不自祥吁嗟麟兮天何所亡羅𢎞信柳詩云粧㸃青春更有誰青春常許占先知亞夫營畔風輕處元亮門前日暖遲花宻宛如飄六出葉繁何惜借雙眉交情别緒論多少好向仁人贈一枝詠白菊云雖被風霜競欲催皎然顔色不低摧已疑素手能粧出又似金錢未染來香散自宜飄渌酒葉交仍得䕃蒼苔尋思閉户中宵見應認寒忩雪一堆𢎞信字徳孚魏州人為魏博節度使髙崇文崇文本薊門將校討劉闢有功為西川節度使渤海鄙言呼人為􅐴兒一旦雪下崇文謂賔客曰某雖武夫亦有一詩乃吟曰崇文崇武不崇文提戈出塞號將軍那箇􅐴兒射鴈落白毛空裏雪紛紛或謂北齊敖曹之比也出比夢𤨏言王智興智興為徐州節度一日從事於使院㑹飲賦詩智興召䕶軍俱至從事屏去翰墨智興曰適聞作詩何獨見某而罷復以牋陳席上小吏亦置牋於智興前於是引毫立成曰三十年前老徤兒剛被郎官遣作詩江南花柳從君詠塞北煙塵獨我知四座驚嘆監軍謂張祐曰觀兹盛事豈得無言祐乃獻詩曰十年受命鎮方隅孝節忠規兩有餘誰信将壇嘉政外李陵章句右軍書左右曰書生謟辭耳智興叱曰有人道我惡汝軰又肯否張生海内名士篇什豈昜得天下人間且以為王智興樂善矣劉綺荘揚州送人詩云桂檝朩蘭舟楓江竹箭流故人從此去望逺不勝愁落日低㠶影歸風引棹謳思君折楊柳淚盡武昌樓置酒云酒熟人湏飲春還鬢已秋願逄千日醉得逭百年愁卒卒周姫旦棲棲魯孔㐀平生能幾日不及且遨遊尤善樂府嘗守藩服與白敏中崔元式韋琮相知宣宗時人也馬戴易水懐古詩云荆卿西去不復返易水東流無盡期落日蕭條薊城北黄沙白草狂風吹送客南遊云擬卜何山隐髙秋指岳陽葦乾雲夢色橘熟洞庭香踈雨殘虹影回雲背鳥行靈均如可問一為哭清湘河梁别云河梁送别者行哭半非親此地足征戰胡天多殺人金罍照離席寳瑟凝青春中秋夜對月云隂魄出海上望之増苦吟冷搜驪頷重寒徹蚌胎深皓氣籠諸夏清光射萬岑悠然天地内皎潔一般心校獵曲云楚子畋郊野布罟籠天涯浮雲張作羅萬草結成罝意在絶飛鳥臂弓腰鏌鋣逺将射句踐次欲誅夫差許棠乆困名塲咸通末戴佐大同軍幕棠徃謁之一見如舊相識留連數月但詩酒而已未嘗問所欲一旦大㑹賔友命使者以棠家書授之棠驚愕莫知其來啓緘即知戴潜遣一介䘏其家矣戴與姚合善合贈詩云天府鹿鳴客幽山秋未歸我知方甚善衆説以為非隔石聞泉細和風見鶴飛新詩此處得清峭比應稀合又有送戴下第客遊詩云昨夜送君處亦是九衢中此日慇懃别前時寂寞同鳥啼寒食雨花落暮春風向晩離人别筵收樽未空戴酬姚合歸字韻詩云岐路非人見尚得起心中日憶瀟湘渚春生蘭桂叢鳥啼花半落客散爵方空所贈誠難答冷然一雅風蠻家云領得賣珠錢還歸銅柱邊㸔兒調小象打鼓放新船醉後眠神樹耕時語瘴煙又逄衰蹇老相問莫知年夕次淮口云天涯秋光盡木末羣鳥還夜乆遊子息月明岐路閑風生淮水上㠶落楚雲間此意竟誰是行行非故闗夕發邠中路却寄舒從事云飲酣走馬别别後鏁邊城日落月未上鳥棲人獨行方馳故國戀復愴長年情乆夜不能息何當閑此生楚江懐古云露氣寒光集㣲陽下楚􅏀猿啼洞庭樹人在朩蘭舟廣澤生明月蒼山夾亂流雲中君不見竟夕自悲秋金華子云戴大中初掌書記於大原李司空幕以正言被斥貶龍陽尉行道興詠以自傷其方城懐古云申胥任向秦庭哭靳尚終貽楚國羞新春聞赦云道在猜䜛息仁深疾苦除堯聰能下聽湯網}
