  - {type: variant, offset: 9833, length: 0, content: '', WYG: 欽定四庫全書唐詩紀事巻三十宋計敏夫撰李益杜羔諸葛覺韋執中耿湋盧綸韓翃錢起司空曙苖發崔峒李端冷朝陽李益益姑臧人字君虞大厯四年登第其受降城聞笛詩教坊樂人取為聲樂度曲又有冩征人歌早行詩為圖畫者回樂峯前沙似雪之詩是也益有心疾不見用及為幽州劉濟營田副使獻詩有感恩知有地不上望京樓之句左遷右庶子年且老門人趙宗儒自宰相罷免年七十餘益曰此吾為東府所選進士也聞者憐益之困後遷禮部尙書致仕卒益録其從軍詩贈左補闕盧景亮自序云吾自兵間故為文多軍旅之思或軍中酒酣塞上兵寢投劍秉筆散懷於斯文率皆出乎慷慨意氣武毅果厲本其凉國則世將之後乃西州之遺民歟亦其坎軻當世發憤之所致也其詩皆建中貞元間作夜上受降城聞笛詩云回樂烽前沙似雪受降城下月如霜不知何處吹蘆管一夜征人盡望鄉烽烽火臺也征人歌云邊風凍合鸊鵜泉牧馬千羣逐暖川塞外征行無盡日年年移帳雪中天曉角詩云邊霜一夜落平蕪吹角當城片月孤無數塞鴻飛不度秋風巻入小單于從軍北征云天山雪後海風寒横笛偏吹行路難磧裏征人三十萬一時廻向月明看獻劉濟云草緑古燕州鶯聲引獨逰鴈歸天北畔春盡海西頭向日花偏落馳年水自流感恩知有地不上望京樓從軍有苦樂行時從司空兾公北征作云勞者且莫歌我欲歌送觴行軍有苦樂此曲樂未央僕居在隴上隴水斷人膓東過秦宫路宫樹入咸陽時逢漢帝出諫獵至長楊詎馳逰俠窟非結少年場一旦承嘉惠輕身重恩光秉筆參帷帟從軍至朔方邊馬多陰風草朩自凄凉斷絶西海去出沒胡沙長㕘差引鴈翼隠轔騰軍裝劍文夜如水馬汗凍成霜使氣五都少矜功六郡良山河起目前睚眦死路傍北逐馳種虜西臨復舊疆昔還賦餘資今出乃贏糧一矢弢夏服我弓不再張寄言丈夫雄苦樂身自當馳一作駞來從竇車騎云自朔方行作東髪逢世屯懷恩抱明義讀書良不武學劍慙非智遂別魯諸生來從竇車騎追兵赴邊急絡馬黄金轡出入燕南陲由來重意氣自經臯蘭戰入破樓煩地西北護三邊東南留一尉時過如雲雨參差不自意將軍失恩澤萬事從此異置酒髙臺上薄暮秋風至長㦸與我歸歸來同棄置自酌還自飲非名又非利歌出易水寒琴下雍門淚出逢平樂舊言在天階侍問我從軍苦自陳少年貴丈夫交四海徒論身自致漢將不封侯蘓卿還逺使今我終此曲此曲誠不易貴人難識心何由知忌諱夜發軍中云邊馬櫪上驚雄劍匣中鳴半夜軍書至匈奴㓂六城中堅分暗陣太乙起神兵出没風雲合蒼皇豺虎争今日邊庭戰縁賞不縁名五城道中云金鐃隨玉節落日河邊路沙鳴後騎來鴈起前軍度五城鳴斥堠三秦新召募天寒白登道寒濁陰山霧仍聞舊兵老尙在烏蘭戍笳簫漢思繁旌旗邊色故寢興倦弓甲勤役傷風露來逺賞不行鋒交勲乃茂未知朔方道何年罷兵賦塞下曲云蕃門部落能結東朝朝馳獵河南曲一作朝馳暮獵兾河曲燕歌未斷塞鴻飛牧馬羣嘶邊草緑秦築長城城已摧漢武北上單于䑓古來征戰虜不盡至今還復天兵來黄河東流流九折沙塲埋恨何時絶蔡琰没去造胡笳蘇武歸來持漢節為報如今都䕶雄匈奴且莫下雲中請書塞北陰山石願比燕然車騎功大厯十才子唐書不見人數盧綸錢起郎士元司空曙李端李益苗發皇甫曽耿湋李嘉祐又云吉頊夏侯審亦是或云錢起盧綸司空曙皇甫曽李嘉祐吉中孚苖發郎士元李益耿湋李端二李皆出於姑臧庶子為文章李益尚書為門户李益一日赴嘉㑹尙書曰今日兩箇坐頭皆是李益紅樓下聮句云佛刹接重城紅樓切太清紫雲連照灼丹檻望峥嶸廣宣榱棟烟虹入軒窻日月平參差五陵晚分背八川明李益絃韻風初過蓮枝浪欲傾敬瞻疑涌見圍繞學無生杜羔蘭陵僻居聮句云潘岳閑居賦陶潜獨酌謡二賢成往事三徑是今朝廣宣生幸逢唐運昌時奉帝堯進思諧啟沃退即混漁樵李益蠧簡封延閣彫欄閟上霄相從達曠地秋露浥蘭苕杜羔天津橋南山中各題一句云野坐分苔䂖益山行遶菊叢韋執中雲衣惹不破諸葛覺秋色望來空閑庭草色能留馬當路楊花不避人句笳簫漢恩繁旌旗邊色故句馬汗凍成霜句古張為取為主客圖以益為清竒雅正主耿湋元日早朝云九陌朝臣滿三朝候皷賖逺珂時接韻攅炬偶成花紫貝為髙闕黄龍建大牙參差萬㦸合左右八貂斜羽扇紛朱檻金爐隔翠華微風傳曙漏曉日上春霞環珮聲重疊蠻夷服等差樂和天易感山固壽無涯渥澤千年聖車書四海家盛明多在位誰得守蓬麻贈苗員外云為郎日賦詩小謝少年時業繼儒門後心多道者期曉迴長樂殿新出永明祠行樂西園暮春風動栁絲許州書情寄韓張二舎人云謫宦軍城老更悲近來頻夢到丹墀乍燃乍滅心中火漸鑷漸多鬢上絲繞院緑苔聞鴈處滿庭黄葉閉門時故人髙步雲衢上肯念前程杳未期贈嚴維云許詢清論重寂寞住山陰野客棲寒寺閑門當古林海田秋熟早湖水夜漁深世上窮通理誰能奈此心贈朗公云來自西天竺持經奉紫微年深梵語變行苦俗人歸月上安禪久苔生出院稀梁間有馴鴿不去為無機早朝云鐘鼓餘聲裏千官向紫微冒寒人語少乗月燭來稀清漏聞馳道紅霞映鏁闈猶看嘶馬處未啟掖垣扉秋日云返照入閭巷憂來與誰語古道無人行秋風動禾黍書情逢故人云因君知此事流恨已忘機客乆多人識年髙衆病歸連雲潮色逺度雪鴈聲稀又説家林盡悽傷淚滿衣沙上鴈云衡陽多道里弱羽復哀音還塞知何日驚弦亂此心夜陰前侶逺秋冷後湖深獨立沙汀意寧知霜霰侵贈張將軍云寥落邊城暮重門返照間鼓鼙驚雨暗士馬過秋閑慣守臨邊郡曽營近海山關西舊業在夜夜夢中還酧暢當云同逰漆沮後已是十年餘幾度曽相夢何時定得書月髙城影盡霜重栁條疎且對樽中酒千般想未如書情逢故人以下四篇姚合取為極元集湋寳應元年進士為左拾遺詩有家貧童僕慢官罷友朋疎世多傳之盧綸綸字允言河中人大歴進士與吉中孚韓翃錢起司空曙苖發崔峒夏侯審李端皆能詩號大歴十才子春日登樓云花正濃時人正愁逢花却欲替花羞年來笑伴皆歸去今日晴明獨上樓長安春望云東風吹雨過青山却望千門草色閑家在夢中何日到春歸江上幾人還川原繚繞浮雲外宫闕參差落照間誰念為儒多失意獨將衰鬢客秦闗貞元中吉中孚為翰林學士薦綸于朝㑹丁家艱而中孚卒大歴中李端錢起韓翃軰能為五言詩詞情徤麗綸作尤工至貞元末錢李諸公凋落綸為懷舊詩五十韻叙其事曰吾與吉侍郎中孚司空郎中曙苖員外發崔補闕峒耿拾遺湋李校書端風塵追逰向三十載數公皆負當時盛稱榮耀未幾俱沉泉下傷悼之際常暢博士追感前事賦詩五十韻見寄輙有所酧以申悲舊兼寄夏侯審侍郎其歴言諸子云侍郎文章宗傑出淮楚靈掌賦若吹籟司言如建瓴郎中善餘慶雅韻與琴清鬱鬱松帶雪蕭蕭鴻入冥員外真貴儒弱冠被華纓月香飄桂實乳溜瀝瓊英補闕思冲融巾拂藝亦精彩蝶戱芳圃瑞雲滋翠屏拾遺興難侔逸調曠無程九醖貯彌潔三花寒轉馨校書才智雄舉世一娉婷賭墅鬼神變属辭鸞鳳驚差肩曵長裾總轡奉和鈴共賦瑤䑓雪同觀金谷笙倚天方比劍沉水忽如瓶君持玉盤珠冩我懷袖盈讀罷涕交頤願言躋百齡綸之才思皆此類也綸徳宗時為户部郎中舅韋渠牟表其才召見禁中帝有所作輙賡和異日問渠牟盧綸李益何在答曰綸從渾瑊在河中驛召之㑹卒文宗尤愛其詩問宰相綸文章幾何亦有子否李徳裕對綸四子皆擢進士第在臺閣帝遣中人悉索家笥得詩五百篇以聞綸春詞云北苑羅裙帶塵衢錦綉鞋醉眠芳樹下半被落花埋得嶺南故人書云瘴海寄䨇魚中宵達我居兩行燈下淚一紙嶺南書地説炎蒸極人稱老病餘慇懃祝賈誼莫共酒盃疎題興善寺後池云隔牕棲白鶴似與鏡湖鄰月照何年樹花逢幾畨人㟁沙青有路苔逕緑無塵願得容依止僧中老此身山下古朩云髙林巳蕭索夜雨復秋風墜葉鳴荒竹斜根擁斷蓬半侵山影裏長在水聲中此地何人到雲門去亦通送李端云故闗衰草遍離別自堪悲路出寒雲外人歸暮雪時少孤為客慣多難識君遲掩涙空相向風塵何所期寄嶺南故人以下四篇姚合取為極元集臈月觀咸寧王部曲娑勒擒豹歌云山頭曈曈日将出山下獵圍照初日前林有獸未識名將軍促騎無人聲潛形踠伏草不動䨇鵰旋轉羣鵶鳴陰方質子纔三十譯語受詞蕃語揖捨鞍解甲疾如風人忽虎蹲獸人立歘然扼顙批其頤爪牙委地涎淋漓既蘇復吼抝於教切仍怒果叶英謀生致之拖自深叢目如電萬夫失容千馬戰傳呼拜賀聲相連殺氣騰陵陰滿川始知縛虎如縛䑕敗虜降羗在眼前祝爾嘉詞身無苦獻看將隨犀象舞苑中流水禁中山期爾攫搏開天顔非熊之兆慶無極願紀雄名傳百蠻送張侍郎還蜀歌云秦家御史漢家郎親傳兩印征殊方功成走馬朝天子伏檻談邊若流水曉離仙署趨紫微夜按髙儒讀青史瀘南五將望君還願以天書示百蠻曲棧重江初過雨前旌後騎不同山迎車拜舞多耆老舊卒新營遍青草塞口雲生火候遲烟中鶴唳軍行早黄花川下水交横逺映孤霞蜀國晴笻竹筍長椒瘴起荔支花發杜鵑鳴回首岷峩半天黒傳觴接膝何由得空令豪士仰威名無復貧交恃顔色垂楊不動雨紛紛錦帳胡瓶争送君湏㬰醉起簫笳發空見紅旌入白雲韓翃字君平南陽人命以駕部郎中知制誥時有兩韓翃徳宗曰與詩人韓翃終中書舎人翃別韋兵曹歸池州云南陵八月天暮色逺峰前楚竹青陽路吳江赤馬船籯金上客貴佩玉主人賢終日應相逐西歸定幾年侯希逸鎮青淄翃為從事罷府閑居十年李勉鎮夷門辟為幕属時已遲暮不得意多家居一日夜將半客叩門急賀曰員外除駕部郎中知制誥翃愕然曰誤矣客曰邸報制誥闕人中書兩進名不從又請之曰與韓翃時有同姓名者為江淮刺史又具二人同進御批曰春城無處不開花寒食東風御栁斜日暮漢宫傳蠟燭青煙散入五侯家又批曰與此韓翃客曰此員外詩耶翃曰是也是不誤矣時建中初也奉送王相公縉赴幽州巡邊云黄閣開帷幄丹墀侍冕旒位髙湯左相權摠漢諸侯不改周南化仍分趙北憂䨇旌過易水千騎入幽州塞草連天暮邊風動地秋無因隨逺道結束佩吳鈎南部新書云昇平公主宅即席李端擅塲送王相之幽鎮翃擅塲送劉相巡江淮錢起擅塲徳宗西幸有神智騘如意騮二馬謂之功臣一日有進瑞鞭者上曰朕有二駿今得此可為三絶因吟翃觀調馬詩云鴛鴦赭白齒新齊晚日花開放碧蹄玉勒乍迴初噴沫金鞭欲下不成嘶髙仲武云韓員外意放經史興致繁富一篇一詠朝野珍之多士之選也至如星河秋一鴈砧杵夜千家又客衣筒布細山舎荔枝繁又疎簾㸔雪巻深户映花關方之前載則芙蓉出水未足多也其比興深於劉員外筋節减於皇甫冉也少年行云千㸃斕媥噴玉騘青絲結尾繡纒騌鳴鞭曉出銅臺路葉葉春衣楊栁風羽林云駿馬牽來御栁中鳴鞭欲向渭橋東紅蹄亂踏青城雪花頷驕嘶上苑風題薦福衡岳禪師房云春城乞食還髙論此中閑僧臘堦前樹禪心江上山疎簾看雪倦深户映花關晚送門人去鐘聲杳靄間送孫革及第東歸云過淮芳草歇千里又東歸野水吳山出家林越鳥飛荷香隨去棹梅雨㸃行衣無數滄洲客如君達者稀少年行以下四章姚合取為極元集送故人歸魯云魯客多歸興居人愴別情雨餘衫袖冷風急馬蹄輕秋草靈光殿寒雲曲阜城知君拜親後少婦下機迎韋莊又元集世傳翃有寵姬栁氏翃成名從辟淄青置之都下數嵗寄詩曰章䑓栁顔色青青今在否縱使長條似舊垂也應攀折他人手栁答曰楊栁枝芳菲節可恨年年贈離別一葉隨風忽報秋縱使君來豈堪折後果為蕃將沙吒利所刼翃㑹入中書道逢之謂永訣矣是日臨淄大校置酒疑翃不樂具告之有虞候將許俊以義烈自許即詐取得之以授韓希逸聞之曰似我往日所為也俊復能之翃後為夷門幕府後生共目為惡詩輕之李義山有韓翃舎人即事云萱草含丹粉荷花抱緑房鳥應悲蜀帝蟬是怨齊王通内蔵珠府應官解玉坊橋南荀令過十里送花香錢起起吳興人天寳進士與郎士元齊名時語曰前有沈宋後有錢郎終考功郎中天寳十年試湘靈鼔瑟詩云善鼓雲和瑟常聞帝子靈馮夷徒自舞楚客不堪聽苦調凄金石清音入香𡨕蒼梧來怨慕白芷動芳馨流水傳湘浦悲風過洞庭曲終人不見江上數峰青起從鄉薦居江湖客舎聞吟於庭中曰曲終人不見江上數峰青視之無所見矣明年崔暐試湘靈鼓瑟詩起即用為末句人以為鬼謡奉送劉相公催運云國用資戎事臣勞為主憂將徵任土貢更發濟川舟擁傳星還去過池鳳不留唯髙飲水節稍淺別家愁落葉淮邊雨孤山海上秋遙知謝公興微月上江樓時以此詩為擅塲髙仲武云詩格清竒理致清澹粤從登第挺冠詞林文宗右丞許以髙格右丞沒後貟外為雄投齊宋之浮游削梁陳之靡嫚逈然獨立莫之與京且如鳥道掛踈雨人家殘夕陽又牛羊山上小煙火隔林深又長樂鐘聲花外盡龍池栁色雨中深皆特出意表標凖古今又窮達戀明主耕桑亦近郊則禮義克全忠孝兼著足以引長名流為後楷式送僧歸日東云上國隨縁去東途若夢行浮雲滄海逺去世法舟輕水月通禪觀魚龍聽梵聲唯憐慧燈影萬里眼中明送僧自吳逰蜀云隨縁忽西去何日返東林世路無期別空門不住心人煙一飰少山雪獨行深天外猿聲夜誰聞清梵音送張管書記云邊事多勞役儒衣逐鼓鼙曰寒闗樹外峰盡塞雲西河廣篷難度天遙鴈漸低班超封定逺之子去思齊送征鴈云秋空萬里静嘹唳獨南征風急翻霜冷雲開見月驚塞長憐去翼影滅有餘聲悵望遥天外郷愁滿目生寄郎士元云龍節知無事江城不掩扉詩傳過客逺書別故人稀坐嘯看潮起行春送鴈歸望舒三五夜思盡謝𤣥暉宿洞口館云野竹通溪冷秋蟬入户鳴亂來人不到寒草上堦生裴廸書齋望月云夜來詩酒意月上謝公樓影閉重關静寒生獨樹秋鵲驚隨葉散螢逺入煙流今夕遥天末清暉幾處愁送彈琴李長史赴洪州云抱琴為傲吏孤棹復南行幾度秋江水皆添白雪聲佳期來客夢幽興緩王程佐牧無勞問心平政自平寄郎士元以下四章姚合取為極元集起還藍田王維贈別云草色日向好桃源人去稀手持平子賦目送老萊衣毎候山櫻發時同海燕歸今年寒食酒應得返柴扉起答詩云卑栖却得性毎與白雲歸徇禄仍懷橘看山免採薇一作別山只昨日春露已霑衣採蕨頻盈夣看花空厭歸暮禽先去馬新月待開扉霄漢時迴首知音青𤨏闈王維春夜竹亭贈起歸藍田詩云夜静羣動息時聞隔林犬却憶山中時人家澗西逺羡君明發去采蕨輕軒冕起答云山月隨客來主人興不淺今宵竹林下誰覺花源逺惆悵曉鶯啼孤雲還絶巘贈闕下裴舎人云二月黄鶯飛上林春城紫禁曉陰陰長樂鐘聲花外盡龍池栁色雨中深陽和不散窮途恨霄漢長懷捧日心獻賦十年猶未遇羞將白髪對華簪東臯早春寄郎校書云禄微頼學稼嵗起歸衡茅窮達戀明主耕桑亦近郊夜來霽山雪陽氣動林梢萌蕙暖初吐春鳩鳴欲巢蓬萊時入夢知子憶平交題玉山村叟壁云谷口好泉石居人能陸沉牛羊上山小煙火隔雲深一徑入溪色數家連竹陰藏虹辭晚雨驚隼落殘禽涉趣皆流目將歸必在林却思黄綬事辜負紫芝心逃暑太子李舎人別業云下馬失炎暑重門深緑篁宫臣禮嘉客林表開蘭堂兹夕興難盡澄罍照墨塲東陵晩來好目極趣何長鳥路掛疎雨人家殘夕陽城隅擁歸騎留醉戀羣芳和張僕射塞下曲云月黒鴈飛髙單于夜遁逃欲將輕騎逐大雪滿弓刀司空曙和耿拾遺元日早朝云元朔争朝闕奔流若㑹溟路塵和薄霧騎火接低星漏促䨇魚鑰車喧百子鈴冕旒當翠殿幢㦸滿彤庭表嵗方編瑞乘春即宥刑諸侯陳禹玉司歴獻堯蓂壽酒三觴退簫韶九奏停太陽開物象沛澤及生靈南陌祥光紫東方曉氣青自憐楊子賤歸草太元經立秋日云律變新秋至蕭條自此初花酣蓮報謝葉在栁呈疎淡月多雲映清風似雨餘捲簾凉暗度却扇暑先除草静多翻燕波澄乍露魚今朝散騎省作賦興何如酬張芬有赦後見贈云紫鳳朝㘅五色書陽春忽報網羅除已將心變寒灰後豈料光生腐草餘建水風煙收客淚杜陵花竹夢郊居勞君故有詩相贈欲報瓊瑶恨不如晦日益州北池陪宴云臨泛從公日仙舟翠幕張七橋通碧澗䨇樹接花塘玉燭收寒氣金波隠夕光野聞歌管思水静綺羅香遊騎縈林逺飛橈截岸長郊原懷㶚滻波漾冩江潢常侍傳花詔偏裨問羽觴豈令南峴首千載播餘芳曙字文初廣平人登進士第從韋臯於劍南貞元中為水部郎中終虞部耿湋就宿因傷故人云舊時聞笛淚此夜重霑衣方恨同懷少那堪相見稀竹煙疑澗壑林雪似芳菲多謝勞車馬應憐獨掩扉經廢寳光寺云黄葉前朝寺無僧寒殿開池晴龜出曝松暝鶴飛回古砌碑横草陰廊畫雜苔禪宫亦銷歇塵世轉堪哀春日野望寄錢起員外云草長花落樹羸病强尋春無復少年意空餘華髪新青原晴見水白社静逢人寄謝南宮客軒車不見親喜外弟盧綸見宿云静夜四無隣荒居舊業貧雨中黄葉樹燈下白頭人似我獨沉久媿君相見頻平生自有分况是蔡家親送王閏云相送臨寒水蒼然望故闗江蕪連夢澤楚雪入商山話我他年舊看君此日閑因將自悲淚一灑別離顔新蟬云今朝蟬忽鳴覉客若為情漸覺一年謝能令萬感生微風初滿樹落日稍沉城為問同懷者凄凉聴幾聲望水云高樓晴見水楚色靄相和野極空如練天遙不辨波永無人跡到時有鳥行過况是蒼茫外殘陽照最多哭麴象云憶昨秋風起君曽歎逐臣何言芳草日自作九泉人耿就宿以下七篇姚合取為極元集苖發送司空曙之蘇州詩云盤門吴舊地蟬盡早秋時歸國人皆久移家君獨遲廣陵經水宿建鄴有僧期若到西霞寺應看江揔碑送孫徳諭罷官往黔州孫父曽牧此州因寄家也云中嵗分符典石城兩朝趨陛謁承明闕下昨陳歸老疏天南今切去郷情親知握手三秋别几杖扶身萬里行伯道暮年無嗣子欲將家事託門生發晉卿子終都官員外郎崔峒寄上禮部李侍郎云吳楚相逢處江湖共泛時任風舟去逺待月酒行遲白髮常同歎青雲本異期貴來君却少愁去我先悲玉佩明朝盛蒼苔陋巷滋追尋恨無路唯有夢相思江上書懷云骨肉天涯別江山日落時淚流襟上血髪白鏡中絲胡越書難到存亡夢豈知登髙迴首罷形影自相隨喜逢妻弟鄭損因送入京詩云亂後自江城相逢喜復驚為經多載別欲問小時名對酒悲前事論文畏後生遙知盈巻軸紙貴在江城詠門上畫小松上元王杜三相公云昔聞生澗底今見起毫端衆草此時没何人知嵗寒豈能禆棟宇且貴出門䦨只在丹青意凌雲也不難題崇福寺禪師院云僧家竟何事掃地與焚香清磬度山翠閑雲來竹房身心塵外逺嵗月坐中長向晚禪堂閉無人空夕陽峒有初入集賢院贈李獻任詩峒與李初同官於常山又有拜拾遺酬邱二十二見贈詩云江海久垂綸朝衣忽掛身丹墀方謁帝白髪免羞人才愧文章士名當諫諍臣空餘薦賢分不敢負交親嚴維送峒使往睦州云如今相府用英髦獨往南州肯告勞氷水近開漁浦出雪雲初巻定山髙朩蘭花映桐盧縣青雀舟隨白鷺濤使者應湏訪㢘吏府中唯有范功曹髙仲武云峒詩文彩炳發意思雅淡如清磬度山翠閑雲來竹房又流水聲中視公事寒山影裏見人家此亦披沙錬金時時見寳也峒登進士第為拾遺入集賢為學士後終州刺史或云終元武令文藝傳云終右補闕峒寄李明府云松堂寂寂對煙霞五栁門前集晩鵶流水聲中視公事寒山影裏見人家觀風共美新為政計日還應更觸邪可惜陶潛無限酒不逢籬菊正開花李端古別離詩云水國葉黄時洞庭霜落夜行舟問商賈宿在楓林下此地送君還茫茫似夢間後期知幾日前路轉多山巫峽通湘浦迢迢隔雲雨天晴見海檣月落聞津鼓人老自多愁水深難急流清宵歌一曲白首對汀洲贈郭駙馬詩云郭令公子曖尙昇平公主此詩席上成青春都尉最風流二十功成便拜侯金距闘鷄過上苑玉鞭驅馬出長楸薫香荀令偏憐小傅粉何郎不解愁日暮吹簫楊栁陌路人遥指鳳凰樓又云方塘似鏡草芊芊初月如鈎未上弦新開金埒看調馬舊賜銅山許鑄錢楊栁入樓吹玉笛芙蓉出水妬花鈿今朝都尉如相顧願脫長裾學少年端趙州人始郭曖尙昇平公主賢明有才思尤多招士端等多從曖逰曖進官大集客端賦詩最工錢起曰素為之請賦起姓又工於前客乃服端賦巫山髙云巫山十二峰皆在碧虛中回合雲藏日霏微雨帶風猿聲寒過水樹色暮連空愁向髙唐望清秋見楚宫蜀路有飛泉亭中詩板百餘篇後薛能佐李福於蜀道過此題云賈椽曽空去題詩豈易哉悉去諸板唯留端巫山髙一篇而已贈苖發員外云朱户敞高扉青槐凝落暉八龍承慶重二虎逓朝歸坐竹人聲絶横琴鳥語稀花慚潘岳貌年稱老萊衣葉暗新櫻熟絲長粉蝶飛應憐魯儒賤空與故山違茂陵山行陪韋金部云宿雨朝來歇空山天氣清盤雲䨇鶴下隔水一蟬鳴古道黄花落平蕪赤燒生茂陵雖有病猶得伴君行雲際中峰云自得中峰住深林亦閉關經秋無客到入夜有僧還暗澗泉聲小荒崗樹影閑高亭不可望星月滿空山蕪城懷古云風吹城上樹草沒城邊路城裏月明時精靈自來去贈苖發以下四篇姚合取為極元集冷朝陽登靈善寺塔云飛閣青霞裏先秋獨早凉天花映窻近月桂拂簷香華岳三峰小黄河一帶長空聞指歸路煙處有垂楊中秋與空上人同宿華嚴寺云掃榻相逢宿論詩舊梵宫鐘聲迎鼓盡月色過山窮庭簇安禪草牕飛帶火蟲一宵何惜別迴首隔秋風立春詩云玉律傳佳節青陽應北辰土牛呈嵗稔綵燕表年春臈盡星迴次寒餘月建寅風光何處好雲物望中新流水初銷凍潛魚欲振鱗梅花將栁色偏思越郷人潞州節度薛嵩有青衣善彈阮咸琴手紋隠起如紅線因以名之一日辭去朝陽為詞曰採菱歌怨朩蘭舟送客魂銷百尺樓還似洛妃乗霧去碧天無際水東流李嘉祐送朝陽登第歸江寧云髙第猶佳句諸生似者稀長安帶酒別建業候潮歸稚子歡迎棹鄰人為掃扉含情過舊浦鷗鳥亦依依朝陽登大厯進士第為薛嵩從事錢起送朝陽擢第後歸金陵覲省詩云萊子晝歸今始好潘園景色夏偏濃夕陽流水吟詩去明月青山出竹逢兄弟相親初讓果鄉人争賀舊登龍佳期少別俄千里雲樹愁看過幾重唐詩紀事巻三十欽定四庫全書唐詩紀事巻三十一宋計敏夫撰竇叔向竇常竇牟竇羣竇庠竇鞏常建李約栁中庸郭鄖韋處厚權徳輿張薦楊於陵許孟容崔邠馮伉潘孟陽武少儀鄭常鄭轅韓濬王濯張莒張叔良竇叔向五子常牟羣庠鞏叔向字遺直京兆人代宗時常衮為相用為左拾遺内供奉及貶亦出為溧水令四子登第羣以處士隠毗陵韋夏卿薦之朝徳宗擢為左拾遺代武元衡為中丞薦呂温羊士諤為御史李吉甫以二人躁險持不下羣怨吉甫伺吉甫陰事幾為憲宗所誅羣與兄常牟弟庠鞏皆為郎工詞章為聮珠集行於時義取昆弟若五星然常字中行登第隠居二十年終國子祭酒牟字貽周終國子司業庠字胄卿終婺州刺史鞏字友封元稹節度武昌辟為御史中丞充副使雅裕有名于時平居與人言若不出口世號囁嚅翁卒於武昌叔向寒食賜恩火云恩光及小臣華燭忽驚春電影隨中使星輝拂路人幸因榆栁暖一照草茅貧端午日恩賜百索云仙宫長命縷端午降殊私事盛蛟龍見恩深犬馬知餘生儻可續終冀答明時酬李袁州嘉祐云少年輕㑹復輕離老大闗心揔是悲强説前程聊自慰未知携手定何時公才屈指登黄閣匪服胡顔上赤墀想到長安誦佳句滿朝誰不念瓊枝蓋嘉祐以詩送叔向并寄其弟紓云自歎未霑黄紙詔那堪逺送赤墀人老為僑客偏相戀素是詩家倍益親妻兒共載無覉思鴛鷺同行不負身憑爾將書通令弟惟論華髪愧頭巾故叔向詩有瓊枝之句竇常常任武陵寒食日次松滋渡先寄劉員外云杏花榆莢曉風前雲際離離上峽船江轉數程淹驛騎楚曽三户少人煙㸔春又遇清明節筭老重經癸已年幸得住山當郡舍在朝常詠卜居篇常初登第桑道茂云二十年後出官後五度奏官勑皆不下即攝職久之至大厯十四年及第即二十年矣北固晩眺云小園芒種後梅天風雨凉露蠶開晩簇江燕遶危檣山趾北來固潮頭西去長年年此登眺人事幾銷亡途中立春寄楊郇伯云浪迹終年客驚心此地春風前猶去馬澤畔耦耕人老大交情重悲凉外物親子雲今在宅應見栁條新七夕寄懷云露盤花水望三星髣髴虛無降匹靈斜漢沒時人不寐幾條蛛網下風庭竇牟元日喜聞大禮寄四學士六舎人云有事郊壇畢無私日月臨嵗華春更早天瑞雪猶深玉輦回時令金門降徳音翰飛鴛別侶叢植桂為林粉澤資鴻筆薫和本素琴禮成戎器下恩徹鬼方沉麟爵來稱紀官師退絶箴道風黄閣静祥景紫垣陰壽酒朝時獻農書夜直尋國香煴翠幄庭燎赩紅衾漢魏文章盛堯湯雨露霃密辭投水石精義出沙金宸扆親惟敬鈞衡近匪侵長驅千里駿清唳九霄禽慶賜迎新服齋莊棄舊簪忽思班女怨遥聽越人吟末路甘貧病流年苦滯淫夢中青𤨏闥歸處碧山岑竊抃聞韶濩觀光想韎任大哉寰海晏不筭子牟心牟秋夕閑居對雨贈別盧坦云燕燕辭巢蟬蛻枝窮居積雨壞藩籬夜長簷溜寒無寢日晏厨煙濕未炊悟主一言那可學從軍五百竟徒為故人駿馬朝天使洛下秋聲恐要知竇羣黔中書懷云萬事非京國千山擁麗譙佩刀㸔日曬賜馬傍江調言語多重譯壺觴毎獨謡㳂流如着翅不敢問歸橈竇庠陪留守韓僕射巡内至上陽宫感歎云愁煙漠漠草離離太乙鈎陳處處疑薄暮毁垣春雨裏殘花猶發萬年枝竇鞏代隣叟云年來七十罷耕桑就煖支羸强下床滿眼兒孫身外事閑梳白髪對斜陽永寧小園寄接近校書云故里心期奈別何手移芳樹憶庭柯東臯黍熟君應醉梨葉初紅白露多寄南遊弟兄云書來未報幾時還知在三湘五嶺間獨立衡門秋水闊寒鵶飛去日㘅山自京將赴黔南云風雨荆州二月天問人初雇峽中船西南一望雲和水猶道黔南有四千南逰感興云傷心欲問當時事唯見江流去不迴日暮東風春草綠鷓鴣飛上越王䑓放魚云金錢贖得免刀㾗聞道禽魚亦感恩好去長江千萬里不須辛苦上龍門武昌時也宮人斜云離宮路逺北原斜生死恩深不到家雲雨今歸何處去黄鸝飛上野棠花新營别墅寄兄云懶性如今成野人行藏由興不由身莫驚此度歸來晚買得山居正值春樂天與微之書云君興有餘力且與僕悉索還往詩中取其尤長者如張十八古樂府李二十新歌行紳也盧楊二秘書律詩貞與巨源竇七鞏也元八絶句博考精掇編而次之號元白往還詩集衆君子得擬議於此者莫不踊躍歡喜以為盛事常建清晨入古寺初日照髙林竹徑通幽處禪房花朩深山光悦鳥性潭影空人心萬籟此都寂但餘鐘磬音題破山寺後禪院江上調玉琴一絃清一心泠冷七弦遍萬朩澄幽陰能使江月白又令江水深始知梧桐枝可以徽黄金江上琴興夢太白西峰云夢寐昇九崕杳靄逢元君遺我太白岑寥寥辭垢氛結宇在星漢宴林閉氤氲簷楹覆餘翠巾舄生片雲時往溪谷間孤亭晝仍曛松峰引天影石瀬清霞文恬目緩舟趣霽心投鳥羣春風又揺櫂潭島花紛紛宿王昌齡隠居云青溪深不測隠處惟孤雲松際露微月清光猶為君茅亭宿花影藥院滋苔紋余亦謝時去西山鸞鶴羣歐陽永叔云吾嘗愛建竹逕通幽處禪房花朩深欲効其語作一聮久不可得始知造意者為難工也來青州得一山齋不意平生想見而不能道以言者乃為已有於是益欲希其髣髴竟爾莫獲一言丹陽殷璠撰河岳英靈集首列建詩愛其山光悦鳥性潭影空人心商璠云髙才而無貴位誠哉是言也曩劉楨死於文學左思終於記室鮑昭卒於㕘軍今常建亦淪於一尉悲夫建詩似初發通莊却尋野逕百里之外方歸大道所以其㫖逺其興僻佳句輙來惟論意表至如松際露微月清光猶為君又山光悦鳥性潭影空人心此例數十句並可稱為警䇿一篇盡善者戰餘落日黄軍敗鼓聲死今與山鬼隣殘兵哭遼水思既邈古詞又警絶潘岳雖云能敘悲怨未見如此章句也昭君墓云漢宮豈不死異域猶傷沒萬里䭾黄金蛾眉為枯骨迴軍夜出塞立馬皆不發憤恨丹青人墳上哭明月弔王將軍墓云嫖姚北伐時深入强千里戰餘落日黄軍敗鼓聲死常聞漢飛將可奪單于壘今與山鬼隣殘兵哭遼水送李十一尉臨溪云泠泠花下琴君唱渡江吟天際一㠶影預懸離別心以言神仙尉因致瑶華音迴軫撫商調越溪澄碧林李約汧公勉之子也為兵部外郎與主客外郎張諗同官毎單床静言連旦不寐故約贈韋徴君况詩曰我有心中事不向韋三説秋夜洛陽城明月照張八嵗日感懷云曙氣變東風蟾壺夜漏窮新春幾人老舊厯四時空身賤悲添嵗家貧喜過冬稱觴唯有感歡慶在兒童觀祈雨云桑條無葉土生烟簫管迎龍水廟前朱門幾處看歌舞猶恐春陰咽管絃過華清宫云君王逰樂萬幾輕一曲霓裳四海兵玉輦昇天人已盡故宫猶有樹長生從軍行云㸔圖閑教陣畫地静論邊烏壘天西戍鷹姿塞上川路長唯筭月書逺毎題年無復生還望翻思未別前柵濠三面鬬箭盡舉烽頻營栁和煙暮關榆帶雪春邊城多老將磧路少歸人殺盡金河卒年年添塞塵候火起鵰城塵沙擁戰聲游軍藏虜幟降騎説蕃情霜落彪池淺秋深太白明嫖姚方虎視不覺説添兵約雅度簡逺有山林之致在潤州得古鐡一片擊之清越又養一猨名山公月夜泛江登金山鼓琴猨必嘯和曽佐庶人李錡幕至金陵屢讃招隠寺摽致一日庶人宴寺中明日謂曰予嘗稱招隠之致昨日逰宴何殊州中約曰某所賞者疎野耳若逺山將翠幕遮古松用綵物褁羶腥涴鹿跑泉音樂亂山鳥聲此則實不如在叔父大㕔也性又嗜茶能自煎曰茶湏緩火炙活火煎活火炭火有熖者曽奉使行陜州硤石縣東愛渠水清流旬日忘發梁武造寺令蕭子雲飛白大書一蕭字約自江淮竭産致歸洛中匣於小亭號曰蕭齋約城南訪裴氏昆季云相思起中夜夙駕訪柴荆早霧桑柘隠曉光溪澗明村蹊蒿棘間往往斷新耕貧野煙火微晝無烏鳶聲田頭逢餉人道君南山行南山千里峯盡是相思情野老無拜揖村童多躶形相呼㸔車馬顔色喜相驚荒圃鷄豚樂雨牆禾莠生欲君知我來壁上空書名栁中庸江行詩云繁陰乍隠洲落葉初飛浦蕭蕭客舟㠶暮入寒江雨夜渡江云夜渚帶浮煙蒼茫晦逺天舟輕不覺動䌫急始知牽聽笛遥尋㟁聞香暗識蓮唯㸔去㠶影常恐客心懸李端司馬於𤓰州寄中庸云懷人同不寐清夜起論文月魄正出海鴈行斜上雲寒潮來灔灔秋葉下紛紛便送江東去徘徊只待君又江上別中庸云秦人江上見握手便沾衣中庸子厚之族御史并之弟也與弟中行皆名有文咸為官早死叚成式酉陽雜爼載中庸善易嘗詣普寂公公曰筮吾心所在也柳曰和尙心在前簷第七題復問之在某處寂曰萬物無逃於數也吾將逃矣嘗試測之栁久之矍然曰至矣寂然不動吾無得而知矣郭鄖寒食寄李補闕云蘭陵士女滿晴川郊外紛紛拜古埏萬井閭閻皆禁火九原松栢自生煙人間後事悲前事鏡裏今年老去年介子終知禄不及王孫誰肯一相憐李公垂云常州建元寺在郡東郭松扉竹院各在崗阜毎嵗寒食里人洒掃經過之所大歴中詩人郭鄖賦寒食詩當時以為絶唱嘗在兒童即聞此詩因和云江城物候傷心地逺寺經過禁火辰芳草壠邊迴首客野花叢裏斷膓人紫荆繁艷空門晝紅藥深開古殿春歎惜光陰催白髮莫悲風月獨沾巾皇甫冉送鄖詩云纔見吳洲百草春巳聞燕鴈一聲新秋風何處催年急偏逐山行水宿人鄖大歴貞元詩人也韋處厚盛山十二詩韓退之序云韋侯昔以考功顯曹盛山僻郡奪所宜處納之惡地以枉其材韋侯將怨且不釋矣或曰不然夫得利則躍躍以喜不得利則戚戚以泣若不可生者豈韋侯之謂哉韋侯讀六藝之文探周公孔子之意又妙能為辭章可謂儒者夫儒者之於患難茍非其自取之其拒而不受於懷也若築河堤以障屋霤其容而消之也若水之於海氷之於夏日其玩而忘之以文辭也若奏金石以破蟋蟀之鳴䖝飛之聲况一不快於考功盛山一出入息之間哉未幾果有以韋侯所為十二詩遺余者其意方且以入溪谷上巗石追逐雲月不足日為事讀而詠歌之令人欲棄百事往而與之游不知其出於巴東以属朐䏰也于時應而和者凡十人及此韋侯為中書舎人侍講六經禁中和者通判元司馬稹為宰相洋州許使君康佐為京兆忠州白使君居易為中書舎人李使君景儉為諫議大夫黔州嚴中丞謩為秘書少監温司馬造為起居舎人皆集闕下於是盛山之十二詩與其和者大行於時聮為大巻家有之焉慕而為者將日益多則分為別巻韋侯俾予題其首隠月岫云初映鈎如線終銜鏡似鈎逺澄秋水色髙倚曉河流流杯渠云激曲縈飛箭浮溝泛滿巵將來山太守早向習家池竹嵓云不資冬日秀為作暑天寒先植誠非鳳來翔定是鸞繡衣石榻云為温侍御置嵓巉雪中嶠磊落標方峭勿為枕蒼山還當礎清廟宿雲亭云雨合飛危砌天開巻曉窻齊平聮郭栁帯繞抱城江梅谿云夾㟁凝輕素交枝漾淺淪味調方薦實臈近又先春桃塢云噴日舒紅景通蹊茂緑陰終期王母摘不羡武陵深胡盧沼云疏鑿徒為巧圓窪目可澄倒花紛錯秀鑑月静涵氷茶嶺云顧渚吳商絶䝉山蜀信稀千叢因此始含露紫英肥盤石磴云繚繞縁雲上璘玢甃玉聮髙髙曽幾折極目瞰秋鳶琵琶䑓云褊地難層土因崕遂削成淺深嵐嶂色盡向此中呈上士缾泉云為栁律師置綆汲豈無井顛巖貴非浚願洗塵垢餘一雨根莖潤權徳輿三雜詩云婉彼嬴氏女吹簫偶蕭史彩鸞駕非煙綽約兩仙子神期諒交感相顧乃如此豈比成都人琴心中夜起陽臺巫山上風雨忽晴曠朝雲與逰龍變化千萬狀魂交復目斷縹緲難比况蘭澤不可親凝情坐惆悵淇水春正深上宫蘭葉齊光風兩搖蕩鳴珮出中閨一顧授横波千金呈瓠犀徒然路傍子怳怳復悽悽侍御從舅初免職歸東山寄以詩云靡靡南軒蕙迎風轉芬滋落落幽澗松百尺無附枝世物自多故達人心不覊偶陳幕中畫未負林間期感恩從慰薦循性難縶維野鶴無俗質孤雲多異姿清泠松露泫照灼巖花遲終當税塵駕來就東山嬉江行四首云曉風搖五兩殘月映石壁稍稍曙光開片㠶在空碧右曉孤舟漾暖景獨鶴下秋空安流日正晝浄緑天無風右晝古樹夕陽盡空江暮靄收寂寞叩船坐獨生千里愁右晚猿聲到枕上愁夢紛難理寂寂深夜寒清霜落秋水右夜徳輿字載之元和中為相其文雅正贍縟動止無外飾其醖藉風流自然可慕楊嗣復序其文集曰貞元中奉詔考定賢良草澤之士昇名七十七人及為禮部侍郎擢進士第者七十有二鸞鳳杞梓舉集其門登輔相之位者前後十人載之送陳秀才應舉序云陳侯工詩賦長波清瀾浩浩不窮屯田栁郎中為予誦其佳句曰地偏雲自起日暮山更深及獲其巻又有過於是者不知陳氏之名今載於此和潘孟陽迴文絶句云酒杯春醉好飛雲晩庭閑久憶同前賞中林對逺山張薦徳宗時薦作秘書監權載之以離合詩贈之云黄葉從風散暗嗟時節換忽見鬢邊霜勿辭林下觴躬行君子道身負芳名早帳殿漢官儀巾車塞垣草交情劇斷金文律毎招尋始知逢山下如見古人心薦和云移居既同里多幸陪君子宏雅重當朝弓旌早見招植根瓊林圃直夜金閨步勸深子玉銘力競相如賦間闊向春闈日復想光儀格言信難繼朩石强為辭薦和潘孟陽迴文絶句云遲遲日氣暖漫漫雪天春知君欲醉飲思見此交親薦字孝舉唐史有傳崔邠和權載之離合詩云脉脉羡佳期月夜吟麗詞諫垣則隨步東觀方承顧林雪消艷陽簡冊漏華光坐更芝蘭室千載各芬芳節苦文俱盛即時仍並命翩翻紫霄中羽翮相輝映字處仁時為中書舎人唐史有傳楊於陵和權載之離合詩云校徳盡珪璋才臣時所揚放情寄文律方茂經邦術王猷符發揮十載契心期晝逰有嘉話書法無隠辭信兹酬和美言與芝蘭比昨來恣吟繹日覺祛䝉鄙時為中書舎人唐史有傳許孟容答權載之離合詩云史才司秘府文哲今超古亦有擅風騷六聮文墨曹聖賢三代意工藝千金字化識從臣謡人推仙閣吏如登崑閬時口誦靈真詞孫簡下威鳳系霜瓊玉枝時為給事中唐史有傳馮伉和權載之離合詩云車馬退朝後聿懷在文友動詞宗伯雄重美良史功亦曽吟鮑謝二妙尤増價雨霜鴻唳天匝樹鳥鳴夜覃思客縱横早擅希代名息心欲焚硯自靦陪羣英時為給事中唐史有傳潘孟陽和權載之離合詩云詠歌有離合永夜觀酬答笥中操綵牋竹簡何足編意深俱妙絶心契交情結計彼官接聮言初並清切翔集本相隨羽儀良在斯煙雲競文藻因喜翫新詩春日雪以迴文絶句呈張薦權徳輿云春梅雜落雪發樹幾花開真湏盡興飲仁里願同來時未四十為户部侍郎唐史有傳武少儀和權載之離合詩云少年慕時彦小晤文多變朩鐸比羣英八方流徳聲雷陳美交契雨雪音塵繼恩顧各飛翔因詩覩瑰麗傳野絶遺賢人希有盛遷早欽風與雅日詠贈酬篇時為國子司業鄭常寄邢逸人云羡君無外事日與世情稀地僻人難別溪深鳥自飛儒衣荷葉老野飰藥苖肥疇昔江湖意如今憶共歸謫居漁陽至白沙阻雨題驛云漁陽知近逺見説過湓城雲雨經春客江山幾日程終隨鷗鳥去祗待海潮生前路逢漁父多慙問姓名送頭陀上人自廬山歸東溪云僧家無住着早晩出東林行道非真相頭陀是苦心持齋山果熟倚錫野雲深溪寺誰相待香花與梵音髙仲武云常省静婉靡雖未洪深已入文流翻翻然有士風故録之鄭轅清明賜新火詩云改火清明候優恩賜近臣漏殘丹禁曉燧發白榆新瑞彩來䨇闕神光煥四隣氣回侯第暖煙散帝城春利用調羮鼎餘輝燭縉紳皇明如照隠願及聚螢人轅大歴九年進士韓濬清明賜新火詩云朱騎傳紅燭天厨賜近臣火隨黄道見煙繞白榆新榮耀分他室恩光共此辰更調金鼎膳還暖玉堂人灼灼千門曉煇煇萬井春應憐聚螢者瞻望獨無隣李端送濬及第歸江東覲省詩云登龍兼折桂歸去當高車舊楚楓猶暗前隋栁已疎月中逢漢客浪裏得卿書見説江邊住知君不厭魚濬大歴九年進士王濯清明賜新火詩云御火傳香殿華光及侍臣星流中使馬燭燿九衢人轉影連金屋分煇麗錦茵熖迎紅蘂發煙染緑條春助律和風早添爐暖氣新誰憐一寒士猶望照東隣濯登大歴九年進士第張莒元日望含元殿御扇開合詩云萬國來朝嵗千秋覲聖君輦迎仙仗出扇匝御香焚俯對朝容近先知曙色分冕旒開處見鐘磬合時聞影動承朝日花攅似慶雲蒲葵那可比徒用隔炎氛栁子厚先友碑云莒長山人登大歴九年第大中時官吏部外郎張叔良長至日上公獻壽詩云鳳闕晴鐘動鷄人曉漏長九重初啟鑰三事正稱觴日至龍顔近天旋聖歴昌休光連雪净瑞氣雜爐香化被君恩洽恩沾士庶康不因稽舊典誰得紀朝章叔良登廣徳二年進士第唐詩紀事巻三十一欽定四庫全書唐詩紀事巻三十二宋計敏夫撰崔琮李竦裴逵于尹躬顔粲葉季良陳通方嚴公弼嚴公貺王表陸贄楊炎元季川蔣煥包何陸海劉商胡笳十八拍崔琮長至日上公獻夀詩云應歴三陽首朝天萬國同斗邊㸔子月臺上候祥風五夜鏡初曉千門日正融玉堦文物盛仙仗武貔雄率舞皆羣辟稱觴即上公南山為聖夀長對未央宮琮登大歴二年進士第李竦長至日上公獻夀詩云候曉金門闢乘時寳歴長羽儀瞻上宰雲物麗初陽漢禮方傳佩堯年正捧觴日行臨觀闕帝錫洽珪璋盛美超三代洪休降百祥自憐朝末坐空此詠無疆竦登大歴二年進士第官于京師朱泚亂竦與闗播盧杞皆踰垣走追及帝咸陽裴逵南至日太史登臺書雲物詩云圓丘纔展禮佳氣近初分太史新簮筆髙臺紀彩雲煙空和縹緲曉色共氛氲道泰資賢輔年豐荷聖君恭惟司國瑞兼用察人文應念懷鈆客終朝望碧雰逵登大歴進士第于尹躬南至日太史登臺書雲物詩云至日行時令登臺約禮文官稱伯趙氏色辨五方雲晝漏聽初發陽光望漸分司天為嵗備持簡出人羣惠愛周微物生靈荷聖君常當有嘉瑞郁郁復紛紛尹躬大歴進士元和間為中書舍人坐其弟臯漢以贓獲罪左授洋州刺史制云雖無從坐之法合當失教之責顔粲吳宮教美人戰云有客陳兵畫功成欲覇呉玉顔承將略金鈿指軍符轉佩風雲暗鳴􅤯錦綉趨雪花頻落粉香汗盡流珠掩笑誰欺令嚴刑必用誅至今孫子術猶可静邊隅粲登建中進士第葉季良吳宮教美人戰詩云強吳矜覇略講武在深宮盡出嬌娥妓先觀上將風揮戈羅袖巻擐甲汗粧紅掩笑分旗下含羞入隊中皷停行未正刑舉令纔崇自可威鄰國何勞逞戰功季良登貞元進士第陳通方通方金谷園懷古云緩歩洛城下軫懷金谷園昔人隨水逝舊樹逐春繁冉冉揺風弱菲菲裛露翻歌臺豈易見舞袖乍如存戲蝶香中起流鶯暗處喧徒聞施錦帳此地擁行軒通方登貞元進士第與王播同年播年五十六通方甚少因期集撫播背曰王老奉贈一第言其日暮途逺及第同贈官也播恨之後通方丁家艱辛苦萬狀播捷三科為正郎判鹽鐵通方窮悴求助不甚給之時李虛中為副使通方以詩求為汲引云應念路傍憔悴翼昔年喬朩幸同遷播不得巳薦為江西院官嚴公弼題漢州西湖云西湖創置自房公心匠縱横造化同見説鳳池推獨歩髙名何事滯川中公弼公貺嚴震之子震梓州人建中中為鳳州刺史治行為山南第一封鄖國公公弼襲封嚴公貺題漢州西湖云鳳沼才難盡餘思鑿西湖珍朩羅脩㟁氷光映坐隅琴臺今寂寞竹島尚縈紆猶藴濟川志芳名終不渝桞子厚序送公貺下第歸興元覲省云相國馮翊公極人臣之尊分天子之憂殿邦坤隅柄是文武而子之伯仲皆脱略貴美服勤儒素故繼登上科以及於子是可舉嚴氏之教誦乎他門使有矜式也子何患賈之不售耶王表大歴十四年侍郎潘炎試花發上林苑表詩云御苑春何早繁花巳繡林笑迎明主仗香拂美人簮地接樓臺近天垂雨露深晴光來戱蝶夕景動棲禽欲託凌雲勢先開捧日心方知桃李樹從此别成隂清明日登城春望寄大夫使君詩云春城閑望愛晴天何處風光不眼前寒食花開千樹雪清明日出萬家煙興來促席唯同舍醉後狂歌盡少年聞説鶯啼却惆悵詩成不見謝臨川元微之叙詩寄樂天詩云有人以陳子昻感遇詩相示吟翫激烈即日為寄思元子詩二十首故鄭京兆於僕為外諸翁深賜憐奬因以獻京兆翁深相駭異秘書少監王表在座頋謂表曰使此兒五十不死其志義何如哉惜吾軰不見其成就因召諸子訓責泣下僕亦竊不自得由是勇於為文又乆之得杜甫詩數百首愛其浩蕩津涯處處皆到始病沈宋之不存寄興而訝子昻之未暇旁備矣不數年與詩人楊巨源友善日課為詩性復僻嬾人事常日閑則有作識足下時有詩數百篇矣表大歴十四年潘炎下登第時謂牓有六異朱遂為朱滔太子表為李納聓彼軍呼為附馬趙博宣為易定押衙袁同直入番為阿師竇常二十年稱前進士其一奚陟也或曰六差陸贄太歴八年試禁中春松云隂隂清禁裏蒼翠滿春松雨露恩偏近陽和色更濃高枝分曉日虛吹雜宵鐘嵐助爐煙逺形疑蓋影重願符千載夀不羡五株封幸得回天眷全勝老碧峰錢起喜贄擢第還蘇州云鄉路歸何早雲間喜擅名思親盧橘熟帶雨客㠶輕夜火臨津驛晨鐘隔浦城華亭養仙羽計日再飛鳴楊炎流崕州至鬼門闗作云一去一萬里千知千不還崕州何處在生度鬼門闗元載末年納薛瑶英為姬處以金絲帳却塵褥衣以龍綃衣載以瑶英體輕不勝重衣於異國求此服也唯賈至與炎雅與載善徃徃時見其歌舞至贈詩曰舞怯銖衣重笑疑桃臉開方知漢成帝空築避風臺炎亦贈歌云雪面淡眉天上女鳳簫鸞翅欲飛去玉山翹翠歩無塵楚腰如桞不勝春炎字公南常衮長於除書炎善德音自開元後言制詔者稱常楊元載與炎同郡炎之出也故擢炎禮部侍郎德宗時位宰相元季川泉上雨後作云風雨蕩繁暑雷息佳霽初衆風帶雲雨清風入我廬䬃䬃凉飈來臨窺愜所圖縁蘿長新蔓裊裊垂坐隅流水復簷下丹砂發清蕖養葛為我衣種芋為我蔬誰是畹與畦彌漫連野蕪山中晚興云河漢降元霜昨來節物殊媿無神仙姿亦有隂陽俱靈鳥望不見慨然悲髙梧華葉隨風揚珍條雜榛蕪為君寒谷吟歎息知何如季川大歴貞元間詩人也一曰季川名融元次山之弟也次山作處規云季川曰兟復不言兟有意乎兟兄之别稱也蔣渙和徐侍郎書叢篠韻云中禁夕沉沉幽篁别作林色連鷄樹近影落鳳池深為重凌霜節能虛應物心年年承雨露長對紫庭隂渙儀鳳宰相智周之孫與兄冽皆第進士渙永泰初歴鴻臚卿日本使嘗遺金帛不納唯取牋一番以貽其副云終吏部尚書冽終尚書左丞包何江上田家云近海川原薄人家本自稀黍苖期臘酒霜葉是寒衣市井誰相識漁樵夜始歸不須騎馬問恐是狎鷗飛同諸公尋李方直不遇云聞説到揚州吹簫有舊逰人來多不見莫是上迷樓和苖員外寓直寄臺中舍弟云朝列稱多士君家有二難貞為臺裏栢芳作省中蘭夜直分曹闊晨趨接武歡每憐䨇闕下鴈序入鴛鸞闕下芙蓉云一人理國致昇平萬物呈祥助聖明天上河從闕下過江南花向殿前生慶雲垂䕃開難落湛露為珠滿不傾更對樂懸張宴處歌工欲奏採蓮聲賦得秤送雲孺卿云願以金錘秤因君贈别離鈎懸新月吐衡舉衆星隨掌握須平執錙銖必盡知由來投分定莫被弄權移何字幼嗣融之子也大歴中為起居舍人劉商秋夜聽嚴紳巴童倡竹枝歌云巴人逺從荆山客回首荆山楚雲隔思歸夜倡竹枝歌庭槐葉落秋風多曲中歴歴叙鄉土鄉思綿綿楚詞古身騎吳牛不畏虎手提簔笠欺風雨猿啼日暮江㟁邊緑蕪連山水連天來時十三今十五一成新衣巳再補鴻鴈南飛報隣伍在家歡樂辭家苦天晴露白鐘漏遲涙㾗滿面㸔竹枝曲終寒竹風裊裊西風落日東風曉移居深山謝别親故云不食黄精不採薇葛苖為帯草為衣孤雲更入深山去人絶音書鴈自飛商髙情放游戱為山水朩石自張璪貶後惆悵賦詩曰苔石蒼蒼臨澗水溪風裊裊動松枝世間唯有張通㑹流向衡陽那得知商彭城人居長安劉禹錫作高陵令劉仁師遺愛碑云武德名臣刑部尚書德威三代孫大歴中詩人商之猶子其名重如此商終於檢校禮部郎中汴州觀察判官胡笳銅雀妓云魏主矜娥眉美人美於玉髙臺無晝夜歌舞竟未足盛色如轉圜夕陽落深谷仍令身殁後尚縱平生慾紅粉淚縱横調絃向空屋舉頭君不在唯見西陵朩玉輦豈再來嬌鬟為誰緑那堪秋風裏更舞陽春曲曲罷情不勝闌干向西哭臺邊生野草來去􅇢羅縠况復陵寢間雙雙見麋鹿古意云連曙寢衣冷開門霜露凝風吹昨夜淚一片枕前氷滑州送人先歸云河水氷銷旅鴈飛寒衣未足又春衣自憐飄蕩經年客送别千廻獨未歸陸海陸餘慶與陳子昻盧藏用為方外十友孫海工於五言為賀賔客所賞自省郎典潮州但賦詩自適題奉國寺云新秋夜何爽露下風轉凄一磬竹䆫外千燈花塔西題龍門寺云䆫燈林靄裏門磬水聲中更與龍華㑹爐煙滿夕風孫長源有才思嘗為諷刺云忽然一曲稱君心破却中人百家産又云城外平人驅欲盡帳中猶打衮花毬唐詩紀事巻三十二欽定四庫全書唐詩紀事巻三十三宋計敏夫撰李吉甫武元衡鄭絪獨孤良弼獨孤授李季何李應盧拱李觀裴度韋同則陳蛻李吉甫九日小園獨謡贈門下武相公云小園休沐暇暫與故山期樹杪懸丹棗苔隂落紫梨舞叢新菊徧繞格古藤垂受露紅蘭晚迎霜白薤肥上公留鳳沼冠劔俟清祠應命端居者長慙補衮詩武元衡九日致齋禁省和中書李相公云齋沐限中禁家山傳勝逰露寒潘省夜木落庾園秋蘭菊回幽歩壺觴絶舊儔位髙天禄閣詞異畔牢愁孤思琴先覺馳暉水共流明朝不相見清祀在圎丘送唐次云都門去馬嘶㶚水東流淺青槐驛路長白日離亭晩望望煙景㣲草木行人逺早秋西亭宴徐員外詩云鼎鉉辭台坐麾幢領益州曲池連月曉横笛滿城秋有美皇華使曾同白社逰今來重相見偏覺艶歌愁元衡字伯蒼元和二年為相代髙崇文鎭蜀八年召還途經百牢闗題石洞詩云昔佩兵符去今持相印還天光臨井絡春物度巴山鳥道青冥外風泉洞壑間何慙班定逺辛苦玉門闗送柳侍御裴起居云沱江水緑波喧鳥去喬柯南浦别離處東風蘭麝多長亭春婉娩層漢路蹉跎㑹有歸朝日班超柰老何又云望鄉臺上秦人去學射山中杜魄哀落日河橋千騎别春風寂寞斾旌廻酬嚴司空荆南見寄云金貂再入三公府玉帳連封萬户侯簾捲青山巫峽曉雲凝碧岫渚宫秋劉琨坐嘯風清塞謝脁裁詩月滿樓白雪調高歌不得美人南國翠娥愁送張諫議赴闕云詔書前日下丹霄頭戴儒冠脱皂貂笛怨柳營煙漠漠雲愁江舘雨蕭蕭鵷鴻得路爭先翥松桂凌霜貴後彫歸去朝端如有問玉闗門外老班超三詩韋莊又元集元衡善為五言好事者傳之被之管絃嘗夏夜作詩云夜乆喧暫息池臺惟月明無因駐清景日出事還生明日遇害初八年元衡自蜀再輔政時太㣲犯上相歴執法占者言今之三相皆不利始輕末重月餘李絳以足疾免明年十月李吉甫以暴疾卒至是元衡為盗所害年五十八始元衡與吉甫齊年又同日為宰相及出鎭分領楊益及吉甫再入元衡亦還吉甫先一年以元衡生月卒元衡後一年以吉甫生月卒吉㐫之數若符㑹焉先是長安謡曰打麥麥打三三三既而旋其袖曰舞了也解者謂打麥者打麥時也麥打者謂暗中突擊也三三三謂六月三日也舞了也謂元衡之卒也元衡卒劉禹錫作佳人怨二章云寳馬鳴珂踏曉塵魚文匕首犯華茵適來行哭里門外昨夜華堂歌舞人秉燭朝天遂不回路人彈指望高臺墻東便是傷心地夜夜秋螢飛去來鄭絪奉和武相公省中宿齋酬李相公見寄云髙閣安仁省名園廣武廬沐蘭朝太一種竹詠華胥禁静踈鐘徹庭開爽韻虛洪鈞齊萬物縹帙整羣書寒露滋新菊秋風落故蕖同懷不同賞幽意竟何如絪字文明善屬文所交皆天下名士憲宗初拜相黙黙居位四年罷為太子賔客太和中以太子太傳致仕卒絪守道寡欲所居不為烜赫事以篤實稱絪九日懷邵二詩云十嵗此辰同醉友登髙各處巳三年又懷林十二云情人共惆悵良友不同遊其重友如此又有九月十五日東亭望月詩云紫閣道流今不見紅樓禪客早曾聞獨孤良弼上巳接清明遊宴詩云上巳歡初罷清明賞又追閏年侵舊歴令節併芳時細雨鶯飛重春風酒醖遲尋花迷白雪㸔桞拆清絲淑氣如相待天和意為誰吁嗟名未立空詠宴遊詩良弼貞元間進士也為左司郎中又有良史者登進士第獨孤綬投珠於泉詩云至道歸淳化明珠必棄捐天眞來照乘成性却沉泉不是靈蛇吐非縁合浦還㟁傍隨月落波底共星懸致遠終無脛懷貪遂息肩欲知恭儉德所寳在惟賢德宗多召學術之士躬自考試又制科宣政殿如稱㫖即翹足高吟徧示宰臣曰此皆朕門生也獨孤綬所司試馴象賦及其本上上吟其句曰化之式孚則必受乎來獻物或違性斯用感於至仁上以綬為知去就故特書第三先是代宗朝越人獻象三十有二上悉放之於山之南而綬不辱其受獻不傷其放棄故賞其知去就焉綬舉博學宏詞吏部考當乙科子邵覆之置甲科人咨其公李季何立春日曉望三素雲詩云靄靄青春曙飛仙駕五雲浮雲初縹緲承蓋下氤氲薄影隨風度殊容向日分羽毛紛共逺環珮杳猶聞静合煙霞色遥將鸞鶴羣年年瞻此節應許從元君季何登貞元十一年進士第李應立春日曉望三素雲詩云元鳥初來日靈仙望裏分氷容朝上界玉輦擁朝雲碧落流輕艶紅霓間綵文帶煙時縹緲向斗更氤氲髣髴隨風馭超遥出曉雰兹辰三見後希得從元君應登貞元十一年進士第盧拱中元日觀法事云四孟逢秋序三元得氣中雲迎碧落歩章奏玉皇宮壇滴槐花露香飄栢子風羽衣凌縹緲瑶轂輾虛空乆慕飡霞客常悲習蓼䖝青囊如可授從此訪鴻䝉姚合送盧拱秘書遊魏詩云官閑身自在詩儉語分明車馬應回晩烟花滿去塵楊巨源寄申州盧拱使君云領郡仍聞總虎貔致身還是見男兒小船隔水催桃葉大鼓當風舞柘枝酒坐㣲酣諸客倒毬塲慢撥幾人隨從來樂事增詩苦莫放䆫中逺岫知元㣲之自唐歸京拱時為秘書郎以詩贈樂天兼以遺㣲之㣲之和云新識蓬山傑深交翰苑材連投珠作貫獨和玉成堆劇敵徒相軋羸師亦自媒李觀字元賔以文馳聲貞元中卒於校書郎陸希聲序其文曰退之窮老不休終不能為元賔之辭使元賔後退之死亦不能及退之之質退之大革流弊落落有老成風元賔則不古不今卓然自作一體激揚發越若絲竹中有金石聲每篇得意處如徤馬在御蹀蹀不能止其所長如此觀贈馮宿云寒城上秦原遊子意飄飄黑雲截萬里獵火從中燒隂空蒸長煙殺氣獨不銷氷交石可裂風疾山如揺時無青松心頋我獨不凋宿裴友書齋云卧君山䆫下山鳥與我言清風何颼颼松栢中夜䌓乆遊失歸趣宿此似故園林煙還近郊谿月落古原稚子不待曉花間出柴門貞元八年宏詞試中和節詔賜公卿尺詩云淑節韶光媚皇明寵錫崇具寮頒玉尺成器幸良工豈止尋常用將傳度量同人何不取利物亦頼其功紫翰宣殊造丹誠厲匪躬奉之無失墜恩澤自天中裴度至日登樂遊園云隂律隨寒改陽和應節生祥雲觀魏闕瑞氣映秦城驗炭論時政書雲受嵗盈影移長日至霧歛逺霄清景暖仙梅動風柔御柳傾那堪封得意空對物華情公出討淮西過女几山下刻石題詩後果尅期平賊其詩云待平賊壘報天子莫指仙山示武夫由是淮蔡底平民安生業白居易作詩二百言繼公篇之末何處畫功業何處題詩篇麒麟高閣上女几小山前爾後多少時四朝二十年賊骨化為土賊壘犂為田一從賊壘平陳蔡民晏然騾軍成牛户鬼火變人煙生子巳嫁娶種桑亦絲綿皆云公之德欲報無由縁公今在何處守都鎭三川舊宅留永樂新居開進賢今公在何官被衮珥貂蟬戰袍破猶在髀肉生欲圓傍水閑行詩云閑餘何事覺身輕暫脫朝衣傍水行鷗鳥亦知人意静故來相近不相驚公赴敵淮西題名華嶽廟之闕門大順中户部侍郎司空圖以一絶紀之曰岳前大隊赴淮西從此中原息戰髀石闕莫教苔蘚上分明認取晋公題公貞元中作鑄劔㦸為農器賦其首云皇帝之嗣位三十載寰海鏡清方隅底平駈域中盡歸力穡示天下不復用兵其後作相立殊勲致太平巳見於文矣公題南庄云野人不識中書令喚作陶家與謝家樂天有詩云陶廬僻陋那堪比謝墅幽㣲不足攀何似嵩峰三十六長隨申甫作家山樂天求馬裴贈以馬因戱云君若有心求逸足我還留意在名姝引妾換馬之事樂天答云安石風流無奈何欲將赤驥換青娥不辭便送東山去臨老何人與唱歌貞元八年公試宏詞有司以中和節詔賜公卿尺為題公詩曰陽和行慶賜尺度及羣公荷寵承佳節傾心立大中短長思合制逺近貴攸同共仰財成德將酬分寸功作程施有政垂範播無窮願續南山夀千春奉聖躬中書即事云有意効承平無功益聖明灰心縁忍事霜鬂為論兵道直身還在恩深命轉輕鹽梅非擬議葵藿是平生白日長懸照蒼蝇謾發聲嵩陽舊田地終使謝歸耕唐趙璘云晉公貞元中作鑄劔㦸為農器賦云觀其氣㮣巳有立殊勲致太平之意進士李為作淚及輕薄暗小四賦李賀作樂府多属意花草蜂蝶之間二子終不逺大文字之作可以定相命優劣矣韋同則仲月賞花云梅花似雪柳含煙南地風光臘月前把酒且須判却醉風流何必待歌筵同則建中時詩人也有韋同正者登建中四年第陳蛻蛻肅代間人賦長安十五詠自序云蛻生長江淮間以詩句從賦僅十餘年矣今我后撫運澤及四夷蛻復得為太平人其華清宮詩有夢裏換春秋之句唐詩紀事巻三十三欽定四庫全書唐詩紀事巻三十四宋計敏夫撰韓愈張籍史延丁澤樊宗師李道昌韓愈司空圖云金之精麤效其聲皆可辨也豈清於磬而渾於鐘哉然則作者為文為詩才格亦可見豈當善於彼不善於此耶愚觀文人之為詩詩人之為文始皆繫其所尚所尚既專則搜研愈至故能衒其功於不朽亦猶力巨而闘者所持之器各異而皆能濟勝以為勍敵也愚嘗覽韓吏部歌詩累百首其驅駕氣勢若掀雷挾電撑抉於天地之根物狀其變不得鼓舞而狥其呼吸也其次皇甫祠部文集外所作亦為遒逸非無意於深密蓋或未遑耳今於華下方得柳詩味其探搜之致亦深遠矣俾其窮而克夀抗精極意則固非𤨏𤨏者輕可擬議其優劣又嘗覩杜子美祭太尉房公文李太白佛寺碑賛宏抜清厲乃其歌詩也張曲江五言沈鬱亦其文筆也豈相傷哉噫後之學者褊淺片詞隻句未能自辨巳側目相詆訾矣痛哉因題柳集之末庶俾後之詮評者罔惑偏説以蓋其全工洛邑得休告華山窮絶陘倚巗睨海眼引袖拂天星日駕此廻轄金神所司刑泉紳拖脩白石劔攅高青磴蘚漣拳跼梯飈颭伶俜悔狂巳咋指垂誡仍䥴銘退之答張徹詩也李肇載登華事信有之沈顔遺肇書謂退之託此以悲世人登髙而不知止且示誡焉皇甫湜作韓先生墓志云長慶四年八月昌黎韓先生既以疾免吏部侍郎書諭湜曰死能令我躬所以不隨世磨㓕者惟子以為嘱其年十二月丙子遂薨明年其孤昶使奉功緖之録繼訃以至三月癸酉葬河陽乃哭而叙其墓其詳將揭之於神道碑云先生諱愈字退之後魏安桓王茂六代孫祖朝散大夫桂州長史諱叡素父秘書郎贈尚書左僕射諱仲卿先生七嵗好學言出成文及冠恣為書以傳聖人之道人始未信既發不掩聲震業光衆方驚爆而萃排之乘危將顚不懈益張卒大信於天下先生之作無圓無方至是歸工抉經之心執聖之權尚友作者跂邪觝異以扶孔氏存皇之極人知人罪非我計茹古􅉼今無有端涯渾渾灝灝不可窺校及其酣放豪曲快字凌紙恠發鯨鏗春麗驚燿天下然而栗密窈𦕈章妥句適精能之至入神出天嗚呼極矣後人無以加之矣姬氏以來一人而巳矣始先生以進士仕歴官二十有七其為御史尚書郎中中書舍人前後三貶皆以䟽陳治事廷議不隨為罪常惋佛老法潰聖人之隄乃唱而築之及為刑部侍郎遂章言憲宗迎佛骨非是任為身耻上怒天子先生處之安然就貶八千里海上嗚呼古所謂非茍知之亦允蹈之者耶呉元濟反吏兵乆遁無功國涸將疑衆懼恟恟先生以右庶子兼御史中丞行軍司馬宰相軍出潼闗請先乘遽至汴感説都統師乗遂和卒擒元濟王庭凑反圍牛元翼於深救兵十萬望不敢前詔擇庭臣徃諭衆慄縮先生勇行元㣲之言於上曰韓愈可惜穆宗悔馳詔無徑入先生曰止君之仁死臣之義遂至賊營麾其衆責之賊恇汗伏地乃出元翼春秋美臧孫辰告糴於齊以為急病校其難易孰為宜褒嗚呼先生眞古所謂大臣者耶選拜京兆尹歛禁軍帖旱糴獻􅀢倖臣之鋩再為吏部侍郎薨年五十七贈禮部尚書先生與人洞朗軒闢不施㦸級族姻友舊不自立者必待我然後衣食嫁娶䘮葬平居雖寢食未嘗去書怠以為枕飡以飴口講評孜孜以磨諸生恐不貎美游以詼笑嘯歌使皆醉義忘歸嗚呼可謂樂易君子鉅人者矣夫人高平郡君范陽盧氏孤前進士昶壻左拾遺李漢壻集賢校理樊宗懿次女許嫁陳氏三女未笄銘曰維天有道在我先生萬頸胥延坐廟以行令望絶耶痌此四方惟聖有文乖㣲嵗千先生起之焯役於前彍義滂仁耿照充天有如先生而合且年按我章書經紀大環唫不時施昌極後昆噫嘻永歸知心之悲􅀢王戞反唫其禁反喚起窓前曙催歸日未西無心花裏鳥更與盡情啼乃二禽名也喚起聲如絡緯圓轉清亮偏鳴於春曉江南謂之春喚催歸子規也謹按公生於代宗大歴三年戊申德宗貞元八年壬申是嵗公登第年二十五十一年乙亥上宰相三書時趙璟賈躭盧邁為相是嵗欲相延齡陽城諫止五月東歸作感二鳥賦其末云幸年嵗之未暮庶無羡於斯類時年二十八十三年丁丑從董晉辟為汴宋頴亳觀察推官十五年巳卯二月晉公薨公隨晉䘮歸既出四日宣武軍亂殺行軍司馬陸長源公作汴州亂二章云汴州城門朝不開天狗墮地聲如雷健兒爭誘殺留後連屋累棟燒成灰諸侯咫尺不能救孤士何者自興衰又曰母從子走者為誰大夫夫人留後兒長源也昨日乘車騎大馬坐者為趨乗者下廟堂不肯用干戈嗚呼奈汝母子何十六年庚辰依徐州武寧軍節度張建封十九年癸未拜監察御史上書論宮市貶連州陽山令時有送浮屠文暢孟東野序二十年甲申移江陵法曹參軍途中作詩寄三翰林未幾以四門博士召二十一年乙酉正月德宗崩順宗立改元永貞韋叔誼王叔文等用事又謀奪中官兵制天下之命是年八月皇太子即位帝自稱太上皇貶叔誼叔文等公作永貞行云君不見太皇諒隂未出命小人乘時偷國柄北軍百萬虎與貔天子自將非他師一朝奪印付私黨凛凛朝士何能為狐鳴梟噪争署置晱閃跳踉相娬媚夜作詔書朝拜官超資越序曾無難公然白日受賄賂火齊磊落堆金盤元臣故老不敢語晝卧涕泣何汍瀾董賢三公誰復惜侯景九錫行可歎國家功高德且厚天位未許庸夫干嗣皇卓犖信英主文如太宗武高祖膺圖受禪登明堂共流幽州鮌死羽四門肅穆賢俊登數君匪親豈其朋郎官清要為世稱荒郡廹野嗟可矜湖波連天日相騰蠻俗生梗瘴癘蒸江氛嶺祲昏若凝一蛇兩頭見未曾怪鳥争鳴令人憎蠱虫羣飛夜撲燈雄虺毒螫墮股肱食中置藥肝心崩左右使令詐難憑愼勿浪信當兢兢吾嘗同僚情可勝具書自見非妄徵嗟爾既徃宜為懲是嵗又作五箴年二十八憲宗元和元年丙戌權知國子博士作釋言二年丁亥是嵗作元和聖德詩三年分司東都始宰相鄭公索公文公獻之有譛公者遂作釋言至是不自安乃求分司四年是嵗真為國子博士改分司都官員外郎五年為河南令是嵗效玉川子月蝕詩六年入拜職方員外郎時有送窮文寄盧仝詩坐論華隂令柳澗事復為博士作進學解執政竒其才改比部郎中史館修撰轉考功郎中修撰如故數月以考功知制誥論討蔡事與裴度議合月滿遷中書舍人賜緋魚袋後卒以謗語改太子右庶子自六年至十一年也十二年丁酉裴度軍慰淮西奏公行軍司馬有從軍泊途中諸篇其間次潼闗寄張十二使君詩云荆山已去華山來日照潼闗四扇開刺史莫辭迎候逺相公新破蔡州廻又次潼闗上都統相公云暫辭堂印執兵權盡管諸軍破賊年冠蓋相望催入相待將功德格皇天又桃林夜賀晉公云西來騎火照山紅夜宿桃林臘月中來把命珪兼相印一時重疊賞元功數篇皆有奥㫖元濟平遷刑部侍郎十四年正月表乞燒佛骨䟽入貶潮州刺史有次藍闗示姪孫湘詩云一封朝奏九重天夕貶潮陽路八千欲為聖明除弊事豈將衰朽計殘年雲横秦嶺家何在雪擁藍闗馬不前知汝逺來應有意好收吾骨瘴江邊是嵗十月量移袁州刺史酬張韶州詩云明時逺逐事何如遇赦移官罪未除北望詎令隨塞鴈南遷纔免葬江魚將經貴郡須留客先惠高文謝起予暫欲繫船韶石下上賔虞舜整冠裾又留别張使君云來徃再逢梅柳新别離一醉綺羅春乆欽江總文才妙自歎虞飜骨相貧鳴笛急吹催落日清歌緩送感行人巳知奏課當徵拜那復淹留詠白蘋十五年庚子至袁州是嵗正月憲宗崩穆宗立召為國子祭酒長慶元年辛丑轉兵部侍郎七月成徳軍大將王廷湊殺田洪正二年公奉命宣撫鎭州時裴度為幽鎭招撫使公有行次承天營酬裴公詩云竄逐三年海上歸逢公復此着征衣旋吟佳句還鞭馬恨不身先去鳥飛是嵗四月廷湊解深州之圍牛元翼奔歸京師六月裴度罷三月相六月罷李逢吉為相始公有和裴公感恩言志詩云文武功成後居為百辟師林園窮勝事鐘鼓樂清時擺落遺高論雕鎸出小詩自然無不可范蠡爾其誰又和裴公回朝見寄云蠱瘁年將乆公今始暫閑事隨憂共减詩與酒俱還放意機衡外收身矢石間秋臺風日逈正好㸔前山時牛李黨熾裴介其間累遭謗讟故公詩有高蹈之語是嵗拜京兆尹三年罷京兆尹為兵部侍郎尋拜吏部侍郎四年甲辰有南溪始泛詩是嵗公以病罷吏侍故有餘年諒無幾休日愴巳晚自是病使然非由取髙謇又有足弱不能歩自宜收朝蹟之句十二月二日卒於靖安里年五十七張籍短歌行云青天蕩蕩高且虛上有白日無根株流光暫出還入地使我年少不須臾與君相逄勿寂寞衰老不復如今樂玉巵盛酒置君前再拜願君千萬年節婦吟寄東平李司空云君知妾有夫贈妾䨇明珠感君纒綿意繫在紅羅襦妾家髙樓連苑起良人執㦸光明裏知君用心如日月事夫誓擬同生死還君明珠䨇淚垂何不相逢未嫁時白紵歌云皎皎白紵白且鮮將作春衣稱少年裁縫長短不能定自持刀尺向姑前復恐蘭膏汚纎指常遣傍人收墮珥衣裳着時寒食下還把玉鞭鞭白馬將軍行云彈箏峽東有邊塵天子擇日拜將軍蓬萊殿前賜六纛還領禁兵為部曲當朝受詔不辭家夜向咸陽原上宿戰車彭彭旌陽動三十六軍聲上隴隴頭戰勝夜亦行分兵處處收舊城邊兵殺盡隂磧暮擾擾惟有牛羊聲邊人親戚曾戰殁今逐官軍收舊骨磧西行見萬里空樂府獨奏將軍功白頭吟云請君膝上琴彈我白頭吟憶昔君前嬌笑語兩情宛轉如縈素宫中為我起高樓更開花池種芳樹春天百草秋始衰棄我不待白頭時羅襦玉珥色未暗今朝巳道不相宜揚州青銅作明鏡暗中持照不見影人心廻互自無窮眼前好惡那能定君恩已去若再返菖蒲花青月長滿籍樂府詞清麗深婉五言律詩亦平澹可喜七言詩則質多文少人才各自有宜不可強文飾也文昌有謝裴司空馬詩云乍離華厩移蹄澁初到貧家舉眼驚此馬乃是一遲鈍不能行而多驚詩人之㣲而顯亦少其比寒食内宴云朝光瑞氣滿宫樓彩纛魚龍四面稠廊下御厨分冷食殿前香騎逐飛毬千官盡醉猶教坐百戱皆呈未放休共喜拜恩侵夜出金吾不敢問行由籍宿江上詩云楚驛南渡口夜深來客稀月明見潮上江静覺鷗飛旅次今巳逺此行殊未歸離家久無信又聽搗寒衣或云劉長卿餘干旅舍云揺落暮天逈丹楓霜葉稀孤城向水閉獨鳥背人飛渡口月初上隣家漁未歸鄉心正欲絶何處搗征衣槩相類也籍字文昌和州人歴水部外郎終主客郎中籍答鄱陽客云江臯嵗暮相逄地黄葉霜前半夏枝子夜吟詩向松桂心中萬事喜君知乃知藥名詩自元和間巳為之矣蕃漢斷消息死生長别離句長於送人處憶得别家時句流光漸出還入地使我年少不須㬰句採樵莫採松與栢松栢生枝直且堅與爾作屋成家宅句右張為取為主客圖退之送東野序云唐有天下陳子昻蘇元明元結李白杜甫李觀皆以其所能鳴其存而在下者孟郊東野始以其詩鳴其高出晉魏不懈而及於古其他浸滛乎漢氏矣從吾遊者李翺張籍其尤也三子者之鳴信善鳴矣抑不知天將和其聲使鳴國家之盛耶抑將窮餓其身思愁其心膓而使自鳴其不幸耶三子者之命則存乎天矣其在上也奚以喜其在下也奚以悲籍詩善叙事如拜豐陵云嵗朝園寢遣公卿學省班中亦攝行身逐陵官齊再拜手持木鐸叩三聲寒更報㸃來三殿曉炬分行照栢城却下龍門㸔漸逺金峰高處日初晴送令狐尚書東都留守云朝廷重寄在闗東共説從前選上公勲業新成大梁鎭恩榮便賞洛陽宮行香蹔出天橋上廵禮常過紫殿中每領羣官拜章表半開門仗日曈曈田司空入朝云西來將相望兼雄不與諸軍覲禮同早變山東知順命新收濟上立殊功朝官叙謁趍門外恩使宣迎滿路中閭闔曉開銅漏盡身當受冊大明宮送汀州源使君云曾成趙北歸官計因拜王門最好官為郡蹔辭䨇鳳闕全家逺過九龍灘山鄉只有輸蕉户水鎭應多養鴨欄地僻尋常來客少刺桐花發共誰㸔送李僕射愬赴鎭鳳翔云由來勲業属英雄兄弟連雲列位同先入賊城擒惡首盡封筦庫讓元公旌幢獨繼家聲外竹帛新添國史中天子欲收秦隴地故交移鎭古扶風送裴相公鎭太原云盛德雄名逺近知功高先乞守藩維衘恩暫遣分龍節署勑還同在鳳池天子親臨樓上送朝官齊出道邊辭明年塞北諸蕃落應赴生祠請立碑白樂天讀籍詩集云張公何為者業文三十春尤攻樂府詞舉代少其人姚合讀籍詩有詩云妙絶江南曲凄凉怨女詩古風無敵手新語足人知史延清明賜新火云上苑連侯第清明及暮春九天初改火萬井屬良辰頒賜恩踰洽承時慶亦均翠煙和柳嫩紅熖出花新寵命尊三老祥光燭萬人太平當此日空腹賀陶鈞大歴九年留守蔣渙試進士於東都延登第丁澤龜負圖詩云天意將垂象神龜出負圖五方行有配八卦義寧孤作瑞旌君德披文叶帝謨乗流喜得路逄聖幸存軀蓮葉池通泛桃花水自浮還尋九江去安肯曳泥途澤大歴十年試龜負圖詩為東都第一樊宗師蜀綿州越王樓詩序云綿之城帝猲􅀈􅀈明威瀰石硝馳涪瀬左陵凌紅䄺簮天地送行癸壬且掬跎踼於西北蟠紅頠青越王正故為樓重軒疊飛門牎䝉傘蹇蹇子始登謂日月昬曉可窺其背雷電合風雲遇霜辛露酸星辰介行鬼神變化草朩顯繡髻衘蓑芰皆可察極既縈視其江帶又極視其土崗斷暴逺近山嶮嶮若閿之東皇天原開見荆山我其黄河􅗎然為曲直涙雨落不可掩因口其心曰無害若其目果星星過歸尚悲不能解重為詩以釋益不可顧謂郡中諸君能無有意綴以華艶其念蓄云危樓倚天門如闉星辰宮榱題薄龍怪洄洄繞雷風徂秋試登臨大靄屯喬空不見西北路考懷益雕窮石瀨薄濺濺土山杳穹穹昔人創為逝所適酡顔紅今我兹之來猶挍成嵗功輟田植科畝游圃歌芳叢地財無叢厚人室安取豐既乏富庶能千萬慙文翁宗師字紹述襄陽節度使澤之子韓退之誌其墓曰為文必出於已不襲蹈前人一言一句何其難也必出於仁義其富若生蓄萬物必具海涵地負放恣縱横無所統紀然而不煩於䋲削而自合也嗚呼紹述於斯術其可謂至於斯極者矣李道昌道昌唐大歴十三年為蘇州觀察使一日郡城外虎􅏀山有鬼題詩二首隱于石壁之上云青松多悲風蕭蕭聲且哀南山接幽壠幽壠空崔嵬白日徒昭昭不照長夜臺雖知生者樂魂魄安能廻况復念所親慟哭心肝摧慟哭更何言哀哉復哀哉又曰神仙不可學形化空遊魂白日非我朝青松為我門雖復隔幽顯猶知念子孫何以遣悲惋萬物歸其根寄語世上人莫厭臨芳罇莊生問枯骨王樂成虛言道昌異其事遂具奏聞准勑令致祭道昌為其文曰嗚呼萬古邱陵化無再出君若何人能閑詩筆何代而亡誰人子姪曾作何官是誰仙室寂寞夜臺悲乎白日不向紙上石中隱出桃源三月深草垂楊黄鶯百囀猿聲斷膓不題姓字寧辨賢良嗚呼哀哉嘆昔先賢空傳經史終無再還青松嶺上嵯峨碧山大唐正業巳記詩言痛復痛兮何處賔悲復悲兮萬古墳能作詩兮動天地聲悲怨兮涙霑巾感我皇兮列清酌願當生兮事明君是時祭後經數日再有詩一絶於石云幽𡨕雖異路平昔忝攻文欲知潜昧處山北兩孤墳後於寺山之地果有二墳極高大荆榛藂茂詢諸耆艾竟不知何姓氏至今猶存皮日休和云念爾風雅魂幽咽猶能文空令傷魂鳥啼破山邊墳陸龜䝉和云靈氣猶不死尚能成綺文如何孤窆裏猶自讀三墳唐詩紀事巻三十四欽定四庫全書唐詩紀事巻三十五宋計敏夫撰陸暢崔元翰張建封皇甫湜李翺麴信陵孟郊盧仝劉义楊巨源陳羽王履正彭伉辛𢎞智歐陽詹焦郁袁高陸暢暢字逹夫呉郡人韋臯雅所厚禮天寳時李白為蜀道難以斥嚴武暢更為蜀道易以美臯鄭注亂以前少尹與注計事斬注首嘗吟對雪落句云天人寧底巧剪水作花飛又山齋翫月云野性平生唯好月新晴半夜覩嬋娟起來自擘書牎破教漏清光落枕前又經崔諫議林亭云蟬噪入雲樹風開無主花初為江西王仲舒從事拂衣去後遇雲陽公主下降百僚舉暢為儐相詩皆頃刻而成詠簾曰勞將素手捲蝦鬚瓊室流光更綴珠玉漏報來過半夜可憐潘岳立躊蹰詠行障曰碧玉為竿丁字成鴛鴦繡帯短長聲強遮天上花顔色不隔雲中笑語聲詔作催粧五言曰雲安公主貴出嫁五侯家天母親調粉日兄憐賜花催鋪百子帳待障七香車借問粧成未東方欲曉霞内人以其呉音捷才以詩嘲之云十二層樓倚翠空鳳鸞相對立梧桐䨇成走報監門衛莫使呉歈入漢宫或曰宋若蘭姊妹作陸酬曰粉面仙郎選世朝偶逢神女學吹簫須教翡翠聞王母不奈烏鳶噪鵲橋六宮大咍别賜宫錦楞伽瓶唾盂各一暢謁韋臯作蜀道易詩云蜀道易易於履平地臯大喜臯薨朝廷欲䋲其既往之事復閲先進兵器上皆刻定秦二字不相與者因造成罪名暢上䟽理之曰臣在蜀日見造所進兵器定秦者匠名也由此得釋段成式云暢江東人語多差誤人以為劇語初娶董溪女每旦婢進澡豆暢輙沃水服之或曰君為貴門女婿幾多樂事陸曰貴門苦禮法俾予食辣麨殆不可過張籍贈暢云共踏長安街裏塵吳州獨作未歸身胥門舊宅今誰住君過西塘與問人趙麟儀質𤨏陋成名後以薛能為儐相能詩曰第一莫教蛛太過縁人衣帶上人頭又火爐床上平身立便與夫人作鏡臺或曰暢羡而能罵崔元翰名鵬以字行舉進士年五十矣禮侍于邵以其文擢異等曰後當司詔令竇叅秉政引知制誥其訓詞温厚有典誥風以剛褊罷為比部郎中卒晚年方取應咸為首捷京兆解頭禮部狀頭宏詞勑制科三等勑頭權德輿謂其文如黄鐘玉磬琮璧琬琰奏於懸間列在西序其章者雖漢廷諸公無以加也然清剛而不能容物介特寡徒晚達中廢斯亦命之所賦也清明卧病不得遊開元寺詩云山色入層城鐘聲臨複岫乗間息邊事探異憐春候曲閣下重堦廻廊遥對霤石間花遍落草上雲時覆鑚火見樵人飲泉逢野獸道情親法侶時望登朝右執憲糺姦邪刋書正訛謬茂才當時選公子生人秀贈答繼篇章歡娯重用舊垂簾獨衰疾擊缶酬金奏奉和聖製重陽日百寮曲江宴示懷詩云偶聖覩昌期受恩慙弱質幸逢良宴㑹况是清秋日逺岫對壺觴沉瀾映簮紱炰羔備豐膳象鳳調鳴律薄劣厠英髦歡娛忘衰疾平臯行鴈下曲渚雙鳬出沙㟁菊開花霜枝果垂實天文見成象帝念資勤恤探道得𤣥珠齋心居特室豈如横汾唱其事徒嬌逸張建封字本立南陽人少喜文章尚氣節貞元四年拜御史大夫徐泗濠節度使十三年來朝帝不待日召見延英殿朝㑹赴大夫班以示殊寵建封賦朝天行以獻還鎭帝賦詩餞之又賜所持鞭曰卿節誼嵗寒故用此為况建封又賦詩自警勵十六年卒許孟容韓愈皆奏置幕府權載之叙其文曰公贊勲伐表邱隴銘器叙事放言詣理皆與作者方駕而歌詩特優有仲宣之氣質越石之清㧞如雪濤溟漲浩漾無際而天球夜光往往在焉其入覲也獻朝天行一篇因喜氣以攄肝膈覽其詞者見公之心焉其還鎮也徳宗皇帝紆天文以送别湛恩異倫輝動中朝至於内庭錫宴君唱臣和皆酌六義之英而為一時之盛夫文之病也或牽拘而不能騁或犇放而不自還公則裁成心匠揮斥細故英華感慨卓爾其閎大析理研幾泊然其精微全才逸氣與勲力相直盡在是矣皇甫湜湜字持正睦州新安人擢第為陸渾尉仕至工部郎中使酒數忤同省求分司東都留守裴度辟為判官樂天哭皇甫郎中云志業過𤣥晏詞華似禰衡多才非福祿薄命是聰眀不得人間夀還留身後名涉江文一首便可敵公卿李翺翺刺史朗州贈藥山髙僧惟儼詩云練得身形似鶴形千株松下兩函經我來問道無餘説雲在青霄水在缾再贈詩曰選得幽居愜野情終年無送亦無迎有時直上孤峰頂月下披雲嘯一聲唐時文人李習之不能為詩韓吏部集有習之兩句云前之巨灼灼此去信悠悠殊無可取鄭州嘗掘地得刺史李翺戱贈詩云縣君愛塼渠遶水恣行逰鄙性樂山野掘地便成溝兩㟁植芳草中間漾清流所尚既不同塼鑿各自修從他後人見景趣誰為幽此自一李翺非習之也唐書習之傳亦不記為鄭州王深甫編次習之集乃收入此詩翺在潭州席上有舞柘枝者顔色憂悴殷堯藩侍御當筵贈詩曰姑蘇太守青娥女流落長沙舞柘枝滿坐繡衣皆不識可憐紅臉涙䨇垂翺詰其事乃姑蘇臺韋中丞愛姬所生之女也夏卿之裔正卿之姪曰妾以昆弟夭折委身樂部耻辱先人言訖涕咽情不能堪亞相為之吁嘆且曰吾韋族姻舊速命更其舞服飾以袿襦延與韓夫人相見夫人吏部之子頋其言語清楚宛有冠蓋風儀遂於賔榻中選士而嫁之舒元輿侍郎聞之自京馳詩曰湘江舞罷忽成悲便脱蠻靴出綘幃誰是蔡邕琴酒客魏公懷舊嫁文姬習之為朗州刺史入為禮部郎中出刺廬州入為中書舍人歴遷桂管湖南觀察山南東道節度其與僧惟儼詩及其女識廬儲登第事皆習之也然習之學韓愈者其與藥山僧詩是非未可知也歸妹於楊嗣復歸女於盧求鄭亞杜審權故携畋讓能皆習之之甥皆為宰相云其在鄭州者非習之也麴信陵信陵貞元元年進士為舒州望江令卒有呉門送客詩云亂山呉苑外臨水讓王祠素是傷情處春非送客時不須愁落日且願駐青絲千里㑹應到一罇誰共持信陵移居洞庭詩云重林將疊嶂此處可迯秦水隔人間世花開洞裏春荷鋤分地利縱酒樂天眞萬事更何有吾今巳外身白樂天感遇詩云我聞望江縣麴令撫惸婺在官有仁政名不聞京師身殁欲歸葬百姓遮路岐攀轅不得去留葬此江湄至今道有名男女涕皆垂無人立碑碣唯有邑人知孟郊李翺薦郊於張建封云兹有平昌孟郊正士也伏聞執事舊知之郊為五言詩自前漢李都尉蘇屬國及建安諸子南朝二謝郊能兼其體而有之李觀薦郊於梁肅補闕書曰郊之五言詩其有高處在古無上其有平處下顧兩謝韓愈送郊詩曰作詩三百首杳黙咸池音彼二子皆言知也豈欺天下之人哉郊窮餓不得安養其親周天下無所遇作詩曰食薺膓亦苦強歌聲無歡出門即有礙誰謂天地寛其窮也甚矣凢賢人竒士自以所負不茍合於世是以雖見之難得而知也見而不能知其賢如勿見而巳矣知其賢而不能用如勿知其賢而巳矣用而不能盡其才如勿用而巳矣盡其才而容讒人之所間者如勿盡其才而巳矣故見賢而能知知而能用用而能盡其才而不容讒人之所間者天下一人而巳矣郊下第詩曰棄置復棄置情如刀劍傷又再下第詩曰兩度長安陌空將淚見花而後及第有詩曰昔人齷齪不足嗟今朝曠蕩恩無涯青春得意馬蹄疾一日看盡長安花一日之間花即看盡何其速也果不達韋莊奏請追贈十餘人其一孟郊字東野尚古風詩與李光韓退之為友貞元十二年及第佐徐州張建封幕卒私諡曰貞耀先生賈島詩曰身殁聲名在多應萬古傳寡妻無子息破宅帶林泉塜近登山道詩隨過海舩故人相弔處斜日下寒天郊字東野湖州人年五十擢調溧陽尉鄭餘慶為東都留守表為水陸運判官鎭興元表為叅謀卒退之答郊詩云規模背時利文字覷天巧人皆餘酒肉子獨不得飽纔春思巳亂始秋悲又攪朝餐動及午夜諷常至卯名聲暫羶腥腸肚鎭煎炒古心雖自鞭世路終難拗弱拒喜張臂猛挐閑縮爪見倒誰肯扶從嗔我湏齩張為取郊青山輾為塵白日無閑人食薺腸亦苦強歌聲無歡欲知萬里情曉卧半床月等句以為清竒僻苦主遊子吟云慈母手中線遊子身上衣臨行密密縫意恐遲遲歸誰將寸草心報得三春輝烈女操云梧桐相待老鴛鴦㑹雙死正女貴徇夫捨生亦如此波瀾誓不起妾心井中水天寒色青蒼北風呌枯桑厚氷無裂文短日有冷光敲石不得火壯隂奪正陽苦調更何言乆吟成此章此郊苦寒吟也或曰郊島善言貧此詩與島詩云卧聞西牀琴凍拆兩三絃鬢邊雖有絲不堪織寒衣正相侔矣楚怨云秋入楚江水獨照汩羅魂手把芰荷泣意愁珠淚飜九門不可入一犬吠千門塘下行云塘邊日欲斜年少早還家徒將白羽扇調妾木蘭花不是城頭樹那棲來去鵶臨池曲云池中春荷葉如帶紫菱成角蓮子大羅裙蟬鬢倚迎風雙雙伯勞飛向東偷詩之作餓犬齚枯骨自喫饞饑涎今文與古文各各稱可憐亦如嬰兒食餳桃口旋旋惟有一㸃味豈見逃景延䋲床獨坐翁黙覽有所傳終當罷文字别著逍遥篇從來文字浄君子不以賢贈别崔純亮云食薺腸亦苦強歌聲無歡出門即有礙誰謂天地寛有礙非遐方長安大道傍小人智慮險平地生太行鏡破不改光蘭死不改香始知君子心交乆道益彰君心與我懷離别俱廻遑譬如浸蘖泉流苦日巳長忍泣目易衰忍憂形易傷項籍豈不壯賈生豈不良當其失意時涕泗各滿裳古人勸加飱此飱難自強一飰九祝噎一嗟十斷腸况是兒女怨怨氣凌彼蒼彼蒼若有知白日下清霜今朝始驚呼白日空茫茫落第云曉月難為光愁人難為腸誰言春物榮獨見花上霜鵰鶚失勢病鷦鷯假翼翔棄置復棄置情如刀劍傷再下第云一夕九起嗟夢短不到家兩度長安陌空將淚見花盧仝有所思云當時我醉美人家美人顔色嬌如花今日美人棄我去青樓珠箔天之涯娟娟常娥月三五二八盈又缺翠眉蟬鬢生别離一望不見心斷絶心斷絶幾千里夢中醉卧巫山雲覺來淚滴湘江水兩㟁花朩深美人不見愁人心含愁更奏緑綺琴調高絃絶無知音美人兮美人不知為暮雨兮為朝雲相思一夜梅花發忽到䆫前疑是君樓上女曲云誰家女兒樓上頭指揮婢子掛簾鈎林花撩亂心之愁巻却羅袖彈箜篌箜篌歴亂五六絃羅袖掩面啼向天相思絃斷情不斷落花紛紛心欲穿心欲穿憑欄杆相憶桞條線相思錦帳寒直縁感君恩愛一廻頋使我雙淚長珊珊我有嬌靨待君笑我有嬌蛾待君掃鶯花爛熳君不來及至君來花巳老心腸寸斷誰得知玉階羃歴生青草秋夢行云客行一夜秋風起客夢南遊渡湘水湘水泠泠徹底清二妃怨處無限情娥皇不語啓嬌靨女英目成轉心愜長眉入鬢何連娟肌膚白玉秀且鮮徘徊共詠東方日沉吟再理南風絃聲斷續思綿綿中含幽意兩不宣慇懃纎手警破夢中霄寂寞心悽然心悽然腸亦絶寐不寐兮玉枕寒夜深夜兮霜似雪鏡中不見雙翠眉臺前空掛纎纎月纎纎月盈復缺娟娟似眉意難訣願此眉兮如此月萬里萬里光不㓕仝居東都退之為河南令愛其詩厚禮之自號玉川子嘗為月蝕詩譏切元和朋黨月蝕詩云新天子即位五年嵗次庚寅斗柄揷子律調黄鍾森森萬朩夜殭立寒氣贔屭頑無風爛銀盤從海底出來照我草屋東天色紺滑凝不流氷光交貫寒曈朧初疑白蓮花浮出龍王宮八月十五夜此並不可雙此時恠事發有物吞食來輪如壯士斧斫壞桂似雪山風拉摧百鍊鏡照見膽平地埋寒灰火龍珠飛出腦却入蚌蛤胎摧輪破壁眼㸔盡當天一撘如炲煤磨蹤滅跡須㬰間便似萬古不可開不料至神物有此大狼狽星如撥沙出争頭事光大奴婢炷暗燈揜烏感切菼如玳瑇今夜吐㗖長如虹孔隟千道射户外玉川子涕泗下中庭獨自行念此日月者太隂太陽精皇天要識物日月乃化生走天汲汲勞四體與天作眼行光明此眼不自保天公行道何由行吾見隂陽家有説望日蝕月月光㓕朔月掩日日虧缺兩眼不相攻此説吾不容又孔子師老子云五色令人目盲吾恐天似人好色即䘮明幸且非春晴萬物不嬌榮青山破瓦色渌水氷崢嶸花枯無女艷鳥死沉歌聲頑冬何所好偏使一目盲傳説古老説月蝕蝦蟇精徑圍千里入汝腹汝此癡骸阿誰生何從海窟來便解縁青㝠恐是眶睫間揜塞所化成黄帝有四目帝舜重瞳明二帝懸四目四海生光輝吾不遇二帝滉漭不可知何故瞳子上坐受虫豸欺長嗟白兎𢷬靈藥恰似有意防姦非藥成滿臼不中度委任白兎夫何為憶昔堯為天十日燒九州金鑠水銀流玉煼炒丹砂焦六合烘為窯堯心增百憂帝見堯心憂勃然發怒决洪流立擬沃殺九日妖天高日走沃不及但見萬國赤子􅀈􅀈生魚頭此時九御導九日爭持節幡麾幢旒駕車六九五十四頭蛟螭虬掣電九火輈汝若蝕開齱齬輪御轡執索相爬鉤推蕩轟轕入汝喉紅鱗燄鳥燒口快翎鬛倒側聲醆鄒撑腸拄肚礧如山邱自可飽死更不偷不獨塡饑坑亦解堯心憂恨汝當食藏頭壓腦不肯食不當食張唇哆觜食不休食天之眼養逆命安得天帝請汝劉嗚呼人養虎被虎齧天昏暮得瞽疾蝦蟇敢將天眼瞎乃知恩非類一一自作孽吾見患眼人必索良工訣想天不異人愛眼固應一安得嫦娥氏來習扁鵲術手操舂喉戈去此睛上物初見猶朦朧既久如抹漆但恐功業成便此不吐出玉川子又涕泗下心禱再拜額榻沙土中地上蟣虱臣仝告訴帝天皇臣心有鐡一寸可刳妖蟇癡腸上天不為臣立梯磴臣血肉身無由飛上天揚天光先封辭付與赤心風越排閶闔入紫宫密邇玉几前擘圻奏上臣仝頑愚胸敢死横干天代天謀其長東方蒼龍角揷㦸虎拽風當心開明堂統領三百六十鱗蟲坐理東方宮月蝕不救援安用東方龍南方火鳥赤潑血項長尾短飛䟦躠頭戴丹冠高達枿月蝕鳥宮十二度鳥為居停主人不覺察貪向何人家行赤口毒舌毒䖝頭上喫却月不啄殺虛貶鬼眼明䆕䆷上音抉下音血鳥罪不可雪西方攫虎立䗁踦音兀斧為牙鑿為齒偷犧牲食封豕大蟇一臠固當軟美似見不見是何道理爪牙根天不念天天若准擬北方寒龜被虵縳藏頭入殻如入獄虵䈥束緊束破殻寒龜夏鼈一種味且當以其肉充臛死殻没信處唯堪支床脚不堪鑚灼與天卜嵗星主福德官爵奉董秦忍使黔婁生覆尸無衣巾天失眼不弔嵗星胡其仁熒惑矍鑠翁執法大不中月明無罪過不糺食月䖝年年十月朝太㣲支盧謫罰何災㐫土星與土性相背反養福德生禍害到人頭上死破敗今夜月蝕安可㑹太白眞將軍怒激鋒鋩生恒州陣斬酈定進項骨脆甚春蔓菁天唯兩眼失一眼將軍何處行天兵辰星任廷尉天律自主持人命在盆底固應樂見天盲時天若不肯信試喚臯陶鬼一問一如今宜三台文昌宮作天上紀綱環天二十八宿磊磊尚書郎整頓排班行劍握他人將一四太陽側一四天帝旁操斧代大匠兩手不怕傷弧矢引滿反射人天狼呀啄明煌煌癡牛與騃女不肯勤農桑徒勞含滛思旦夕遥相望蚩尤簸箕弄旬朔始搥天皷鳴璫琅枉矢能蛇行眉目森森張天狗下䑛地血流何滂滂譎險萬萬黨搆架何可當眯目亹成就害我光明王請留北斗相北極指揮萬國懸中央此外盡掃除堆積如山崗贖我父母光當時帝星没星雨如坼漿似天㑹事發叱喝誅姦強何故中道廢自遺今日殃善善􅁖􅁖郭公所以亡願天神聖心無信他人忠玉川子辭訖風色緊格格近月黒暗邊似有動劍㦸須㬰癡蟇精兩吻自决抑初露半箇璧漸吐滿輪魄衆星盡原赦一蟇獨誅磔腹肚忽脱落依舊掛穹碧光彩未蘇來慘淡一片白奈何萬里光受此吞吐厄再得見天眼感荷天地力或問玉川子孔子修春秋二百四十年月蝕盡不收今子咄咄辭固合孔意不玉川子笑答或請聽逗遛孔子父母魯諱魯不諱周書外書大惡故月蝕不見收余命唐天口食唐土唐禮過三唐樂過五小猶不説大不可數災沴無有大小瘉安得引衰周研覈其可否日分晝月分夜辨寒暑一主刑一主德政乃舉孰為人面上一目偏可去願天完兩目照見萬方土更不瞽萬萬古與馬異結交詩天地日月如等閑盧仝四十無往還唯有一片心脾骨巉巗崪硉元鬰律刀劍為峰㠋平地放着高如崐崘山天不容地不受日月不敢偷照耀神農畫八卦鑿破天心胷女媧本是伏羲婦恐天怒𢷬鍊五色石引日月之針五星之縷把天補補了不肯歸聓家走向日中放老鵶月裏栽桂養蝦蟇天公發怒罰龍蛇此龍此蛇得死病神農合藥救死命天恠神農黨龍蛇罰神農為牛頭令載元氣車不知藥中有毒藥藥煞元氣天不覺爾來天地不神聖日月之光無正定不知元氣本不死忽聞空中喚馬異馬異若不是祥瑞空中敢道不容易昨日同不同異自異是謂大同而小異今日仝自同異不異是謂仝不往兮異不至直當中兮動天地白玉璞裏斷出相思心黄金礦裏鑄出相思涙忽聞空中崩崕倒谷聲絶勝明珠千萬斛買得西施南越一䨇婢嬌饒惱殺人凝脂為腰翡翠裙唯解畫眉朱㸃唇自從獲得君敲金摐玉凌浮雲却退頋一䨇婢子何足云平生結交苦少人憶君眼前如見君青雲欲開白日没天眼不見此竒骨此骨縱横竒又竒千嵗萬嵗枯松枝半半殆壓山谷盤根蹙節成蛟螭忽雷霹靂卒風暴雨撼不動欲動不動千變萬化惣是鱗皴皮此竒恠物不可欺盧仝一見馬異文章酌得馬異胷中事風姿骨本恰如此是不是寄一字劉义塞上逢盧仝云直到桑乾北逢君夜不眠上樓腰脚徤懷土眼精穿斗柄寒垂地河源凉徹天覊魂泣相向何事有詩篇自問云自問彭城子何人接汝顚酒腸寛似海詩膽大於天斷劔徒勞匣枯琴無復絃相逢不得合頼是向秋泉义節士也少放肆為俠行因酒殺人亡命㑹赦出更折節讀書能為歌詩然恃故時所負不能俛仰貴人聞韓愈接天下士歩謁之作氷柱雪車二詩出盧孟右樊宗師見為獨拜後以争語不能下賔客因持愈金數斤去曰此䛕墓中人得耳不若與劉君為夀愈不能止歸齊魯不知所終楊巨源春日獻聖夀無疆詞云代是文明晝春當宴喜時爐煙添桞重宮漏出花遲漢典方寛律周官正採詩碧霄吹鳳管紅日在龍旗造化膺神契陽和沃聖慈每因隨百獸率舞奉丹墀梁貞明三年薛廷珪以宮漏出花遲為詩題張𢎞靖三世掌書命在台坐巨源詩曰伊陟無聞祖韋賢不到孫時稱其能與張氏説家門巨源在元和時詩韻不為新語體律務實功夫頗深旦暮吟詠不輟年老頭揺人言吟詩所致早春即事呈劉員外云明朝晴暖即相隨肯信春光被雨欺且任文書堆案上免令杯酒負花時馬蹄經歴須應遍鶯語丁寧巳恠遲更待雜芳成艶錦鄴中争唱仲宣詩送章孝標校書歸杭州因寄白舍人云曾過靈隱江邊寺獨宿東樓㸔海門潮色銀河鋪碧落日光金柱出紅盆不妨公事資高卧無限詩情要細論若訪郡人徐孺子應須騎馬到沙林巨源以三刀夢益州一箭取遼城得名故樂天詩云早聞一箭取遼城相識雖深有故情清句三朝誰是敵白鬚四海半為兄貧家薙草時時入痩馬尋花處處行不用更教詩過好折君官職是虛名巨源後拜省郎樂天復以詩賀云文昌新入有光輝紫界宮墻白粉闈曉日鷄人傳漏箭春風侍女護朝衣雪飄歌句高難和鶴拂煙霄老慣飛官職聲名俱入手近來詩客似君稀巨源字景山大中時為河中少尹何事慰朝夕不踰詩酒情山河空道路蕃漢共刀兵禮樂新朝市園林舊弟兄向風一㸃淚寒晚暮江平張為取此作為主客圖送裴中丞出使云一清淮甸假朝綱金印初迎細柳黄辭闕天威和雨露出闗春色避風霜龍韜何必陳三略虎旅由來肅萬方宣諭生靈眞重任回軒應問石渠郎送綘州盧使君云應將清静結心期又共陽和到郡時綘老問年須算字庾公逢月要題詩朱欄迢逓因髙勝粉蝶清明欲下遲他日徵還作霖雨不須求賽敬亭祠送司徒童子云衛多君子魯多儒七歲聞天笑舞雩光彩春風初轉蕙性靈秋水不藏珠兩經在口知名小百拜垂髫禀氣殊况復元侯旌爾善桂林枝上得鵷雛送人過衛州云憶昔征南府内逰君家東閣最淹留縱横聨句長侵曉次第看花直到秋論舊舉盃先下泪傷離臨水更登樓相思前路幾回首舊眼青山過衛州寄昭應王丞云武皇金輅輾香塵每歲朝元及此辰光動泉心初浴日氣蒸山腹揔成春謳歌已入雲韶曲詞賦方歸侍從臣瑞靄朝朝猶望幸天教赤縣有詩人寄江州白司馬云江州司馬平安否惠逺東林住得無湓浦曾聞似衣帶廬峰見説勝香爐題詩歲晏離鴻斷望闕天遥病鶴孤莫謾勾牽雨花社青雲依舊是前途古意贈王常侍云繡户紗䆫北里深香風暗動鳳凰簮組紃長在佳人手刀尺空揺寒女心欲學齊謳逐雲管還思楚練拂霜砧東家少婦當機織應念無衣雪滿林贈張將軍云闗西諸將揖容光獨立營門劔有霜知愛魯連歸海上肯令王剪在平陽天晴紅幟當山滿日暮清笳入塞長年少高功人最美漢壇煙樹日蒼蒼贈李傳云知因公望掩能文誓激明誠在致君曾罷雙旌瞻白日猶將一劔許黄雲揺窓竹色留僧語入院松聲共鶴聞莫被此心生晩計鎭南人憶杜將軍述舊紀勲寄太原李光顔侍中云玉舍含悽見鴈行北垣新詔拜龍驤弟兄間世眞飛將貔虎歸時似故鄉皷角因風飄朔氣旌旗映水發秋光河源收地心猶壯笑向天西萬里霜又云倚天孤劔截雲孤報國縱横見丈夫五載登壇眞宰相六重分閫正司徒曾聞轉戰平堅冦共説題詩壓腐儒料敵知機在方寸不勞心力講隂符上裴中丞云六年西掖𢎞湯誥三捷東堂總漢科政引風霜成物色語回天地到陽和清威更助朝端重聖澤曾隨筆下多應笑白鬚楊執㦸可憐春日老如何和人與人分惠賜氷云天水藏來玉墮空先頒密署幾人同映盤皎潔非闗露當扇清凉不在風瑩質方從綸閣内凝輝更備錦帷中麗詞珍貺難䨇有迢逓金輿殿角東觀打毬有作云親掃毬場如砥平龍驤驟馬曉光晴入門百拜瞻雄勢動地三軍唱好聲玉勒回時霑赤汗花騣分處拂紅纓欲令四海氛煙静杖底纎塵不敢生贈隣家老將云白首羽林郎丁年戍朔方隂天瞻磧路秋日渡遼陽大漠寒山黒孤城夜月黄十年依蓐食萬里帶金瘡拂雪陳師祭衝風立教場箭飛瓊羽合旌動火雲張虎翼分營勢魚鱗擁陣行誓心清塞色闘血雜沙光戰地晴輝薄軍門曉氣長冦深争暗襲闗逈勒春防身賤竟何訴天高徒自傷功成封寵將力盡到貧鄉雀老方悲海鷹衰却念霜空餘孤劔在開匣一霑裳酬崔愽士云自知頑叟更何能唯學雕虫謬見稱長被有情邀唱和近來無力更秪承青松樹杪三千鶴白玉壺中一片氷今日為君書壁右孤城莫怕世人憎酬盧員外云謝傅旌旗控上游盧郎鐏俎借前籌舜城風土臨清廟魏國山川在白樓雲寺當時接高歩水亭今日又同遊滿筵舊有笙歌在獨有羊曇最淚流酬于駙馬云綺陌塵香曙色分碧山如畫又逢君蛟藏秋月一片水驥鏁晴空千尺雲戚里舊知何駙馬詩家今得鮑參軍陽和本是煙霄曲願向花間次第聞又云芳時碧落心應斷今日清詞事不同瑶草秋殘仙圃在綵雲天逺鳳樓空晴花曾送金覊影凉葉還生玉簟風長得聞詩懽自足㑹㸔春露濕蘭叢酬裴舎人見寄云誰道重遷是舊班自將霄漢比鄉闗二妃樓下宜臨水五老祠西好㸔山再葺吾廬心巳足每來公府路常閑詩陪亞相逾三紀石笥煙霞不共攀酬崔駙馬惠牋百張兼貽四韻云百張雲様亂花開七字文頭艶錦回浮碧空從天上得殷紅應自日邊來捧持價重凌雲葉封褁香深笑海苔滿篋清光應照眼欲隨凢韻輙徘徊元㣲之憶楊十二詩云楊子愛言詩春天好詠時戀花從馬滯聨句放盃遲日映含煙竹風牽卧柳絲南山更多興須作白雲期巨源善叙事胡二十以户部判度支乃賀以詩曰雄拜知承聖主恩於是有雄拜之目陳羽羽湘妃云二妃哭處雲沉沉二妃怨處湘江深商人酒滴廟前草蕭颯風生斑竹林雪詩云千門萬户雪花浮㸃㸃無聲落瓦溝全似玉塵消更積半成氷片約還流光含曙色清天苑輕逐㣲風繞御樓平地巳霑盈尺潤年豐須荷富人侯宴楊駙馬山亭云垂楊拂㟁草茸茸綉户牕前花影重鱠下玉盤紅縷細酒開金甕緑醅醲中朝駙馬何平叔南國詞人陸士龍落日泛舟同醉處回潭百丈映千峰贈人云或棹孤舟或杖藜尋常適意釣長溪草堂竹徑在何處落日孤煙寒渚西題夫差廟云姑蘇臺上千年朩刻作夫差廟裏神冠蓋寂寥塵滿坐不知簫鼓樂何人韓退之有落葉送羽云誰云少年别流淚各霑衣羽與退之同年登第羽夜别温商梓州云鳳凰城裏花時别元武江邊月下逢客舎莫辭先買酒相門曾忝舊登龍迎風騷屑千家竹隔水悠揚午夜鐘明日又行西蜀去不堪天際逺山重春園即事云水隔羣物外夜深風起頻霜中千樹橘月下五湖人聽鶴忽忘寢見山如得隣明年還到此共㸔洞庭春送戴端公赴容州云分命諸侯重葳蕤繡服香八蠻治險路千騎踏繁霜山斷旌旗出天晴劔佩光還將小戴禮逺去化南方送友人及第歸江東云五陵春色泛花枝心醉花前逺别離落第耻為闗上客成名空羡里中兒都門雨歇愁分處山店燈殘夢到時家住洞庭多釣伴同來相賀話相思小江驛送陸侍御歸湖上山云鶴唳天邊秋水空荻花蘆葉起西風今夜渡頭何處宿㑹稽山在月明中王履正異方霑瑞氣干呂見青雲表聖興中國來王謁大君迎祥殊大樂叶慶頼横汾自是明時起非將觸石分映霄難辨色從吹作成文須使流千載垂芳在典墳青雲干呂履貞元七年青雲干呂詩登第彭伉聖布中區化符祥異域雲含春初應呂暈碧巳成文東起隨風煖西流共日曛升時嘉異月為慶等凝汾輕與晴煙比高將曉霧分飄飄如可致願此翊明君伉貞元七年杜黄裳下試青雲干呂詩登第伉宜春人既登第伉妻族有湛賁者猶為郡吏伉妻即湛姨也妻族賀伉坐皆名士伉居客右一坐盡傾而賁飯於後閤其妻責之曰男子不能自勵窘辱如此復何顔賁感其言力學一舉擢第貞元十二年第伉方郊逰聞之失聲墜驢袁人謔曰湛郎及第彭伉落驢至今袁州之西有落驢橋辛𢎞智𢎞智國子監進士賦詩曰君為河邊草逢春心剰生妾如臺上鏡得照始分明同房常定宗改始字為轉字遂争之皆云我作乃下牒見博士羅道琮判云昔五言定表以理切稱竒今一言競詩取詞多為主詩歸𢎞智轉還定宗以狀牒知任為公驗歐陽詹字行周泉州人初見拔於常衮後見知於退之元賔終於四門助教李貽孫序其文曰君之文周詳切於情故事叙重複宜其掌代文柄以變風雅一命而卒天其絶乎子價早死孫澥銅雀妓云蕭條登古臺廻首黄金屋落葉不歸林高陵永為谷粧容徒自麗舞態閲誰目惆悵繐帷前歌聲苦於哭晨裝行云村店月西入山林鴨鵊聲旅裝徹夜席束囊事晨征寂寂人尚眠悠悠天未明豈無偃息心所務前有程蜀中將歸留辭韋相公云寧體即雲搆方前恒玉食貧居豈及此要欲懷歸憶在夢闗山逺如流嵗華逼明晨首鄉路迢逓孤飛翼翫月詩序云月可翫翫月古也謝賦鮑詩脁之庭前亮之樓中皆翫月也貞元十二年歐閩君子陳可封遊在秦寓于永崇里華陽觀予與鄉人安陽邵楚萇濟南林藴頴川陳詡亦旅長安秋八月十五夜詣陳之居修厥翫事月之為翫冬則繁霜大寒夏則蒸雲大熱雲蔽月霜侵人蔽與侵俱害乎翫秋之於時後夏先冬八月於秋季始孟終十五於夜又月之中稽於天道則寒暑均取於月數則蟾兎圓况埃壒不流大空悠悠嬋娟徘徊桂華上浮昇東林入西林肌骨與之踈凉神氣與之清冷四君子悦而相謂曰斯古人所以為翫也既得古人所翫之意宜襲古人所翫之作月詩云八月十五夕舊嘉蟾兎光斯從古人好共下今宵堂素魄皓孤凝芳輝紛四揚徘徊林上頭泛灔天中央皓露助流華輕風佐浮凉清冷到肌骨㓗白盈衣裳惜此苦宜翫攬之非可將含情頋廣庭願至沉西方途中寄太原所思詩云鷗鳥漸覺逺廻頭長路塵高城已不見况復城中人去意自未甘居情諒猶辛萬里東北晉千里西南秦一履不出門一車無停輪流萍與匏繫早晚期相親或曰詹遊太原悦一妓將别約至都相迎故有早晚期相親之句妓思之不巳得疾且甚乃刃其髻藏之謂女弟曰歐陽生至可以為信又作詩曰自從别後減容光半是思郎半恨郎欲識舊來雲髻様為奴開取縷金箱絶筆而逝及詹至如其言示之詹啓函一慟而卒孟簡賦詩哭之序云穆𤣥道訪予常嘆其事𤣥道頗惜之焦郁白雲向空盡云白雲生逺岫揺曳入晴空乘化隨舒巻無心任始終欲銷仍帶日將斷更因風勢薄飛難定天高色易窮影收元氣表光滅太虛中儻若從龍去還施濟物功春雪詩云散漫天涯色承春四望平不分殘照影何處斷腸聲繚繞光經塞霏㣲勢逐城因風低未歛帶雨重還輕干呂知時泰如膏候嵗成小儒叨盛世無以答皇明袁高字公碩滄洲人恕巳之孫慷慨有節尚為給事中德宗將起盧杞刺饒州詔出高執不下帝慰曰朕唯卿言切至巳如奏憲宗時卒贈禮書禹貢通逺俗所圖在安人后王失其本職吏不敢陳亦有姦佞者因兹欲求伸動生千金費日使萬姓貧我來顧渚源得與茶事親甿輟耕農耒採採實苦辛一夫旦當役盡室皆同臻捫葛上欹壁蓬頭入荒榛終朝不盈掬手足皆鱗皴悲嗟遍空山草朩為不春隂嶺芽未吐使者牒巳頻心爭造化力走挺麋鹿均選納無晝夜搗聲昏繼晨衆工何枯槁俯視彌傷神皇帝尚廵狩東郊路多堙周廻遶天涯所獻愈艱勤况減兵革困重兹困疲民未知供御餘誰合分此珍頋省忝邦守又慙復因循茫茫滄海間丹憤何由申右高所賦茶山詩也案唐制潮州造貢茶最多謂之顧渚貢焙嵗造一萬八千四百斤大歴後始有進奉建中二年高刺郡進三千六百串并詩此一章刻石在貢焙故杜鴻漸與楊祭酒書云頋渚中山紫笋茶兩片此物但恨帝未得嘗實所嘆息一片上太夫人一片充昆弟同歠開成三年以貢不如法停刺史裴充官唐詩紀事巻三十五欽定四庫全書唐詩紀事巻三十六宋計敏夫撰黎逢閻濟美裴交泰劉皂黎逢小苑東望宫池柳色詩云上林新柳變小苑暮天晴始望和煙密遥憐拂水輕色承陽氣暖隂帶御溝清不厭隨風弱仍宜向日明垂絲遍閣榭飛絮觸簾旌漸到依依處思聞出谷鸎韋蘇州任京兆功曹日有答貢士黎逢詩云彌月曠不接公門但驅馳蘭草忽有贈持用慰所思不見心㣲密况當相見時逢氣貎山野及第年初塲後至便於簾前設席主司異之誚其生踈必謂文詞稱是專令人伺之句句來報初問云何人徘徊曰亦是常言既而將及數聨莫不驚嘆遂擢第逢登大歴十二年進士第閻濟美濟美大歴九年春下第將出闗獻坐主張謂詩六韻曰謇諤王臣直文明雅量全望鑪金自躍應物鏡何徧南國幽沉盡東堂禮樂宣轉令遊藝士更惜至公年芳樹歡新景青雲泣暮天唯愁鳳池拜孤賤更誰憐謂覽之問失第之因具以實告謂深有遺才之嘆乃曰所投六韻必展後效明年濟美自江東繼薦就試東都謂復主文雜文巳過繼欲帖經濟美辭以不能謂曰禮闈故事亦許作詩贖帖遂命天津橋望洛城殘雪題濟美曰新霽洛城端千家積雪寒未收清禁色偏向上陽殘既而日勢巳晚詩未就謂云只據見在將來一覽稱賞遂唱過盧景莊謂曰前足下試蜡日祈天宗賦以魯􅉌對衛賜則子貢也乃作駟字誤矣方悔之明日謂曰天寒急景諸君文巻不成未可以呈宰相請重録送納既而索舊巻則駟字上朱㸃在焉易巻之意蓋有在也到闕謂揖濟美曰前日春間遺才所投六韻不敢暫忘幸副素懷矣濟美紀其事曰前朝公相許與定分一面不忘美哉濟美貞元末歴福建觀察為治簡易以工部尚書卒濟美元和初刺華州劾華隂令柳澗贓罪韓愈使過華上䟽理澗留中不下詔御史按得澗贓狀以愈妄論復為國子博士裴交泰長門怨云自閉長門經幾秋羅衣濕盡淚還流一種峨嵋明月夜南宮歌吹北宮愁范攄曰近日舉塲詩尤新章孝標對月云長安一夜千家月幾處笙歌幾處愁有類乎裴交泰交泰正元間詩人劉皂長門怨云宮殿沉沉月色分昭陽宮漏不堪聞珊瑚枕上千行淚不是思君是恨君皂正元間人也韋莊載皂長門怨云涙滴長門秋夜長愁心和雨到昭陽淚㾗不學君恩斷拭却千行更萬行唐詩紀事巻三十六欽定四庫全書唐詩紀事巻三十七宋計敏夫撰元微之微之為御史奉使東川於褒城題黄明府詩其序云昔年曾於觧縣飲酒余為觥録事嘗於竇明府㕔有一人至頻犯語令連飛十數觥不勝因迯去醒後問人前虞卿黄丞也此後絶不復知元和四年三月奉使東川十六日至褒城驛逡廵有黄明府見迎瞻其形容髣髴似識問其前衘即曩日逃席黄丞也説向前事黄生惘然而悟因饋酒一罇􅋈舟請余同載余不違其意與之盡歡徧問褒陽山水則褒姒所奔之城在其左諸葛所征之路次其右感今懐古作贈黄明府詩曰昔年曾痛飲黄令困飛觥席上當時走馬前今日迎依稀迷姓字積漸識平生故友身皆逺他鄉眼暫明便邀連榻坐兼共榜舡行酒思臨風亂霜稜拂地平不㸔深淺酌貪愴古今情迤邐七盤路坡陁數丈城花疑褒女笑棧息武侯征一種埋幽石空聞千載名出本事詩微之聞西蜀薛濤有辭辯及為監察使蜀以御史推鞠難得見焉嚴司空潜知其意毎遣薛徃洎登翰林以詩寄曰錦江滑膩峨眉秀幻出文君與薛濤言語巧偷鸚鵡舌文章分得鳯凰毛紛紛辭客多停筆箇箇君侯欲夢刀别後相思隔煙水菖蒲花發五雲高後㢘問淛東乃有劉採春自淮甸而來容華莫比元贈詩曰新粧巧様畵雙蛾謾裹常州透額羅正靣偷勻光滑笏緩行輕踏皺紋波言辭雅措風流足舉止低回秀媚多更有惱人腸斷處選詞能唱望夫歌望夫歌者即羅嗊之曲也元云在淛河七年因醉題東武其詩曰役役行人事紛紛碎簿書功夫兩衙盡留滯七年餘病痛梅天發親情海㟁踈因循未歸得不是憶鱸魚盧侍郎簡求戯曰丞相雖不為鱸魚為好鏡湖春色耳謂採春也公先娶京兆韋氏字蕙叢韋逝為詩悼之曰曽經滄海難為水除却巫山不是雲出本事傳微之元和四年為御史鞠獄梓潼樂天昆仲送至城西而别後旬日昆仲與李侍郎建閑遊曲江及慈恩寺飲酣作詩曰花時同醉破春愁醉折花枝作酒籌忽憶故人天際去計程今日到梁州後旬日得元書果以是日至褒仍寄詩曰夢見兄弟曲江頭也到慈恩院院遊驛吏喚人排馬去忽驚身在古梁州千里魂交合若符契自有感夢記備叙其事微之以明經制䇿入仕其一篇自述曰延英引對碧衣郎江硯宣毫各别床天子下簾親考試宫人手裏過茶湯是時貴族並應制科用為男子榮進連昌宫辭云連昌宫中滿宫竹歲乆無人森似束又有牆頭千葉桃風動落花紅蔌蔌宫邊老人為余泣小年選進因曾入上皇正在望僊樓太真同憑欄干立樓上樓前盡珠翠炫轉熒煌照天地歸來如夢復如癡何暇備言宫裡事初過寒食一百六店食無煙宫樹緑夜半髙樓絃索鳴賀老琵琶定場屋力士傳呼覔念奴念奴潜伴諸郎宿湏㬰覔得又連催特勑街中許燃燭春嬌滿眼睡紅消掠削雲鬟旋粧束飛上九天歌一聲二十五郎吹管逐逡廵大遍梁州徹色色龜兹轟陸續李謩擪笛傍宫牆偷得新翻數般曲平明大駕發行宫萬人鼓舞途路中百官隊仗避岐薛楊氏諸姨車鬬風明年十月東都破御路猶存禄山過驅令供頓不敢藏萬姓無聲淚潜墮兩京定後六七年却尋家舎行宫前庄園燒盡有枯井行宫門闥樹宛然爾後相傳六皇帝不到離宫門乆閉徃來年少説長安𤣥武樓前華蕚廢去年勑使因斫竹偶值門開暫相逐荆榛櫛比塞池塘狐兎驕癡縁樹朩舞榭欹傾基尚存文牎窈窕紗猶覆塵埋粉壁舊花鈿鳥啄風筝碎珠玉上皇偏愛臨砌花依然御榻臨街斜蛇出鷰巢盤鬬栱菌生香桉正當衙寢殿相連端正樓太真梳洗樓上頭晨光未出簾影黒至今反掛珊瑚鈎指向傍人因慟哭却出宫門淚相續自從此後還閉門夜夜狐狸上門屋我聞此語心骨悲太平誰致亂者誰翁言野父何分别耳聞眼見為君説姚崇宋璟作相公勸諌上皇言語切爕理隂陽禾黍豐調和中外無兵戎長官清平太守好揀選皆言由相公開元欲末姚宋死朝廷漸漸由妃子祿山宫裏飬作兒虢國門前閙如市弄權宰相不記名依稀憶得楊與李廟謀顛倒四海揺五十年來作瘡痏今皇神聖丞相明詔書纔下呉蜀平官軍又取淮西賊此賊亦除天下寧年年耕種宫前道今年不遣子孫耕老翁此意深望幸努力廟謀休用兵穆宗時嬪御多誦微之歌宫中號為元才子後荆南監軍崔峻歸朝出微之連昌宫詞等百餘篇奏御穆宗大悦即日拜祠部郎中知制誥微之上令狐文公書云某始自御史府謫官於外十餘年矣閑誕無事遂用力於詩章日益月滋有詩千餘首其間感物寓意可備矇瞍之風逹者有之詞直氣麤罪戾是懼固不敢陳露於人惟盃酒灮景間屢為小碎篇章以自吟暢然以為律體卑下格力不揚茍無姿態則䧟流俗常然欲得思深語近韻律調新屬對無差而風情自逺然而病未能也江湖間多有新進小生不知天下文有宗主妄相倣傚而又從而失之遂至有褊淺之調皆目為元和詩體某又與同門生白居昜友善居昜雅能為詩就中愛驅駕文字窮極聲韻或為千言或為五百言律詩以相投寄小生自審不能有以過之徃徃戯排舊韻别創新詞名為次韻盖欲以難相挑耳江湖間為詩者或相倣傚或力不足則至於顛倒語言重複首尾韻同意等不異於篇亦目為元和詩體而司文者考變異之由徃徃歸咎於某嘗以為雕蟲小事不足自明也樂天在洛大和中㣲之拜左丞相自越過洛以二詩别樂天云君應恠我留連乆我欲與君辭别難白頭徒侣漸稀少明日恐君無此歡又云自識君來三度别這回白盡老髭䰅戀君不去君湏㑹知得後廻相見無未幾死于鄂樂天哭之曰始以詩交終以詩訣絃筆俱絶其今日乎屈指貞元舊朝事幾人同見大和春感興句兒歌楊栁葉妾拂石榴花句逺路事無限相逄惟一言月色照榮辱長安千萬門逄白公句右張為取作主客圗㣲之序言寄樂天云九嵗學賦詩長者徃徃驚其可恠年十五六粗識聲病時貞元十年已後徳皇帝春秋髙理務因人最不欲文法吏生天下罪過外閫節將動十餘年不許相朝死於其地不易者十八九而又將豪卒愎之處因喪負衆横相賊殺告變絡繹使者迭窺旋以状聞天子曰某色將某能遏亂亂衆寧附願為其師名為衆情其實逼詐因而可之者又十八九前置介倅因縁交授者亦十四五由是諸侯敢自為意有羅列兒孩以自固者有開導蠻夷以自重者甚者視一境如一室刑殺其下不啻六畜厚加剥奪名為進奉其實貢入之數百一焉京城之中停第邸店以曲巷斷侯甸之内水陸腴沃以鄉里計其餘奴婢資財生生之備稱是朝廷大臣以謹慎不言為朴雅以時進見者不過一二親信直臣議士徃徃抑塞禁省之間􅂉繕完隤墜豪家大帥乗聲相扇延及老㓜土朩妖熾習俗不恠上不欲令有司備宫闥中小碎湏求徃徃持幣帛以易餅餌吏縁其端剽奪百貨勢不可禁僕時孩騃不慣聞見獨於書傳中初習理亂萌漸心體悸震若不可活思欲發之乆矣適有人以陳子昻感遇詩相示吟翫激烈即日為寄思𤣥子詩二十首故鄭京兆於僕為外諸父深賜憐奨因以所賦呈獻京兆翁深相駭異秘書少監王表在坐顧謂表曰使此兒五十不死其志義何如哉惜吾軰不見其成就因召諸子訓責泣下僕亦竊不自怠由是勇於為文又乆之得杜甫詩數百首愛其浩蕩津涯處處臻到始病沈宋之不存寄興而訝子昻之未暇旁備矣不數年與詩人楊巨源友善日課為詩性復僻懶人事常有閑暇閑則有作識足下時有詩數百篇矣習慣性靈遂成病蔽毎公私感憤道義激揚朋友切磨古今成敗日月遷逝光景舒慘山川勝勢風雲景色當花對酒樂罷哀餘通滯屈伸悲歡合散至於疾恙其身悼懐昔遊凢所對遇有常者則欲賦詩又不幸年三十二時有罪譴弃今三十七矣三十六年間是丈夫心力壮時常在閑處無所役用性不近道未能淡然忘懐又復懶於他欲全盛之氣注射語言雜揉精粗遂成多文然亦未嘗繕寫適值河東李明府景儉在江陵時僻好僕詩章謂能為觧欲得盡取觀覽僕因撰成巻軸其中有㫖意可觀而詞近古徃者為古諷意亦可觀而流在樂府者為樂諷詞雖近古而止於吟寫情性者為古體詞實樂流而止於模象物色者為新題樂府聲勢㳂順屬對稳切者為律詩仍以七言五言為兩體其中有稍存寄興與諷為流者為律諷不幸少有伉儷之悲撫存感徃成數十詩取潘子悼亡為題又有以干教化者近昵婦人暈淡眉目綰約頭䰅衣服修廣之度及匹配色澤尤極恠艶因為艶詩百餘首詞有今古又兩體自十六時至是元和七年矣有詩八百首色類相從共成十體凢二十巻自笑冗辭亦不復致之於行李昨來京師偶在箱篋及通行盡置足下僅亦有説僕聞上士立徳其次立事不遇立言凢人急位其次急利下急食僕天與不厚既乏全然之徳命與不遇未遭可為之事性與不恵復無垂範之言兀兀狂癡行近四十徼名取位不過於第八品而冒憲已六七年授通之初有習通之熟者曰地濕墊卑褊人士稀少近歳荒札死亡過半邑無吏市無貨百姓茹草朩刺史以下計粒而食大有虎豹蛇虺之患小有蟆蚋浮塵蜘蛛之類皆能鑚囓肌膚使人瘡痏夏多隂霪秋為痢瘧地無醫巫藥石萬里病者有百死一生之慮夫何以僕之命不厚也如此智不足也又如此其所詣之憂險也又復如此則安能保持萬全與足下必復京輦以湏他日立言立事之驗耶但恐一旦與急食相扶而終使足下受天下有不如已之誚是用悉所為文留穢箱笥比夫格奕摴里之戯猶曰愈於飽食僕所為又不愈於格奕摴里之戯乎昨行巴南道中又有詩五十一首文書中得七年已後所為向二百篇繁亂冗雜不復置之執事前所寄思𤣥子者小歳為文不能自足其意貴其起予之始且志京兆公見遇之由今亦寫為古諷之一移諸左右僕少時授吹嘘之術於鄭先生病懶不就今在閑處思欲怡神保和以求其内異日亦不復費詞於無用之文矣省視之煩庻亦已於是乎琵琶歌寄管兒兼管鐵山此後並新題樂府琵琶宫調八十一旋宫三調彈不出𤣥宗偏許賀懐智叚師此藝還相匹自後流傳指撥衰崐崘善才徒爾為鴻聲少得似雷吼去聲纒絃不敢彈羊皮人間竒事㑹相續但有卞和無有玉叚師弟子數十人李家管兒稱上足管兒不作供奉兒抛在東都雙鬢絲逄人便請送盃盞㸔盡工夫人不知李家兄弟皆愛酒我是酒徒為宻友著作曽邀連夜宿中輾清溪華新緑平明船在管兒行盡日聽彈無限曲曲名無限知者鮮霓裳羽衣偏宛轉凉州大遍最毫嘈緑腰散序多籠撚我聞此曲深賞竒賞著竒處驚管兒管兒為我雙淚垂自彈此曲長長悲淚垂捍撥朱絃濕氷泉鳴咽流鶯澁因兹彈作雨霖鈴風雨蕭條鬼神泣一彈既罷又一彈珠幢夜靜風珊珊低佪慢弄闗山思坐對燕然秋月寒月寒一聲深殿磬驟彈曲破音繁併百萬金鈴旋去聲玉盤醉客滿船皆暫醒自兹聽後六七年管兒在洛我朝天游想慈恩杏園裡夢寐仁風花樹前去年御史留東臺公私蹙促顔不開今春制獄正撩亂晝夜推囚心似灰暫輟歸時尋著作著作南園花拆萼胭脂耀眼桃正紅雪片滿溪梅巳落是夕青春值三五花枝向月雲含吐著作施罇命管兒管兒乆别今方覩管兒還為彈緑腰緑腰依舊聲迢迢猿鳴雪岫來三峽鶴唳晴空聞九霄逡廵彈得緑腰徹霜刀破竹無殘節幽闗鵶軋胡鴈悲斷絃砉騞層氷裂我為含凄歎竒絶許作是歌始終説藝竒思寡塵事多許來寒暑又經過如今左降在閑處始為管兒歌此歌此歌寄管兒管兒憂爾衰爾衰之後繼者誰繼之無乃在鐡山鐡山已近曹穆間二善才性靈甚好功猶淺急處未得臻幽閑努力鐡山勤學取莫遣後來無所祖何滿子歌張胡南坐為唐有態作何滿能歌能宛轉天寳年中世稱罕嬰刑繫在囹圄間下調哀音歌憤懣棃園弟子奏𤣥宗一唱承恩覊網緩便將何滿為曲名御譜親題樂府纂魚家入内本領絶葉氏有年聲氣短自外徒煩記得詞㸃拍纔成已夸誕我居湖外拜君侯正值灰飛仲春琯廣宴江亭為我開紅粧遲日花枝暖此時有態踏華筵未吐芳詞貌夷坦翠蛾轉盼揺雀釵碧袖歌垂飜鸖卵定靣凝眸一聲發雲停塵下何勞筭迢迢擊磬逺玲玲一一貫珠匀欵欵犯羽含商移調態留情度意抛絃管湘妃寳瑟水上來秦女玉蕭空外滿纒綿疊破最慇勤整頓衣裳事閑散水含逺溜咽還通鸎泥晩花啼漸嬾歛黛吞聲若自寃鄭袖見捐西子浣隂山鳴鴈曉斷行巫峽哀猿夜呼伴古者諸侯饗外賔鹿鳴三奏陳圭瓉何如有態一曲終牙籌記令紅螺盞五絃彈云趙璧五絃彈徴調徴聲巉絶何清峭辭雄皓鸖警露啼失子哀猿繞林嘯風入春松正凌亂鸎含曉舌憐驕妙嗚嗚暗溜咽氷泉殺殺霜刀澁寒鞘促節頻催漸繁撥珠幢斗絶金鈴掉千􅀈鳴鏑發胡弓萬片清球擊虞廟衆樂雖同第一部徳宗皇帝常偏召旬休節假暫歸來一聲狂殺長安少主第侯家最難見挼蘇雷反歌按曲皆承詔水晶簾外散貴嬪瑇瑁筵心伴中要臣有五賢非此絃或在拘囚或屠釣一賢得進勝累百兩賢得進同周邵三賢仕漢滅暴强四賢鎮岳寧邊徼五賢並用調五常五常既序三光曜趙璧五絃非此賢九九何勞設庭燎放言五首云近來逄酒便髙歌醉舞詩狂漸欲魔五斗觧醒猶恨少十分飛盞未嫌多眼前讎敵都休問身外功名一任他死是等閑生也得擬將何事奈吾何莫將心事厭長沙雲到何方不是家酒熟餔糟學漁父飯來開口似神鵶竹枝待鳯千莖直柳樹迎風一向斜揔被天公霑雨露等頭成長盡生涯霆轟電烻數聲頻不奈狂夫不藉身縱使被雷燒作燼寧殊埋骨颺為塵得成蝴蝶尋花樹儻化江魚掉錦鱗必若乖龍在諸處何湏警動自來人安得心源處處安何勞終日望林巒玉英惟向火中冷蓮葉元來水上乾寗戚飯牛圖底事陸通歌鳯也無端孫登不語啓期樂各自當情各自歡三十年來世上行也曾狂走趂浮名兩廻左降湏知命數度登朝何處榮乞我杯中松葉滿遮渠肘上柳枝生他時定𦵏燒缸地賣與人家得酒盛和樂天過秘閣書省舊㕔云聞君西省重徘徊秘閣書房次第開壁記欲題三漏合吏人驚問十年來經排蠧簡憐初校芸長陳根識舊栽司馬見詩心最苦滿身蚊蚋笑煙埃和樂天贈楊秘書云昔與楊郎在帝城搜天斡地覔詩情曾因並句甘稱小不為論年便喚兄刮骨直穿由苦闘夢腸翻出暫閑行因君投贈還相和老去那能競底名琵琶云學語胡兒撼玉鈴甘州破裏最星星使君自恨常多事不得工夫夜夜聼内状詩寄楊白二員外時知制誥天門暗闢玉錚鍧晝送中樞曉禁清彤管内人書細膩金奩御印篆分明衝街不避将軍令䟦勑兼題宰相名南省郎中誰待詔與君将向世間行酬樂天餘思不盡加為六韻之作律吕同聲我愛身文章君是一伶倫衆推賈誼為才子帝喜相如作侍臣樂天先有秦中吟及百節判皆為書肆書賈題其巻云白才子文章及樂天知制誥詞云覧其詞賦喜與相如並處一時次韻千言曾報答樂天曽寄予千字律詩數首予皆用本韻酬和後來遂以成風耳直詞三道共經綸樂天與予同應制科並求前軰切直詞䇿以盡經邦之術其事已具之字詩注中爾元詩駮雜真難辯後軰好偽作予詩傳流諸處身到㑹稽以有人寫宫詞百篇及雜詩兩巻皆云是余所撰及手勘驗無一篇是者白樸流傳用轉新樂天於翰林中書取書詔批答詞等撰為程式禁中號曰白樸毎有新入學士求訪寳重過於六典也蔡女圖書雖在口蔡琰口誦家書四百餘篇于公門户豈生塵樂天嘗贈予詩云詩心如肺石動必逹窮民東川八十家寃憤一言申因感無兒之嘆故余自有此句商瞿未老猶希兾莫把籯金便付人寄湖西李大夫四首云柳眼梅心漸欲春白頭西望憶何人金陵太守曽相伴共踏銀䑓一路塵蘂珠深處少人知網索西臨太液池浴殿曉聞天語後步廊騎馬笑相隨網索在太液上學士候對歇於此禁林同直話交情無夜無曽不到明最憶西樓人静後玉晨鐘磬兩三聲玉晨觀在紫宸殿後靣也由來鵬化便圖南浙右雖雄我未甘早渡西江好歸去莫抛舟檝滯春潭㣲之善紀事如䑓中鞠獄贈周兄詩云閙装轡頭繘静拭腰帯班鷂子繡線􅭕狗兒金油去聲鐶又坐卧摩錦褥捧擁綟絲鬟罰俸西歸詩邀我上華筵横頭坐賔位那知我年少深觧酒中事能唱犯聲歌偏精變籌義含詞徙殘拍促舞逓繁吹呌噪擲投盤生獰攝觥使寄呉士矩云予時最年少專務酒中職未觧媿生獰偏矜任狂直曲庇桃根盞横講捎雲式亂布鬬分朋惟新間䜛慝耻作最先吐羞言未朝食酬東川季相公云昔附赤霄羽葳蕤逰紫垣鬬班香案上奏語玉晨尊酬白學士云並入紅蘭署偏親白玉䂓又闘班雲洶湧開扇雉参差又麫棃通蒂朽無味火米帯芒炊不精芽笋錢筒束鯾魚箭羽鬐又病賽烏稱鬼巫占瓦代龜南人賽烏鬼紀懐贈李六云昔冠諸生首初因三道徴公卿碧墀㑹名姓白麻稱答胡靈之云矮馬駞鬉䪜犛茒牛獸面纓一船席外語三榼拍心精傳盞加分數横波擲目成華奴歌淅淅塩媚子侮卿卿又環坐唯更草投盤漸廢觥又柳愛凌寒軟梅憐上畨驚又雨催魚火熖風引去竹枝聲店卧戯呈諸公籌筯隨宜放投盤止罰啀紅娘留醉打舞引紅娘抛打曲名觥使及醒差酒中觥使席上古職又搶旗如在手籌筯色目那復敢崴㠢酬樂天東南行云科試銓衡局衙參典校厨書判同年校正同省月中分桂樹天上識菖蒲又白麻雲色膩墨詔電光徂又祖竹聚新筍孫枝壓舊梧又酬樂天待漏入閣云未勘銀䑓契先挑浴殿闗沃心因特召承㫖絶常班承㫖在學士上颭閃才人袖宫官傳詔嘔鵶軟轝鐶宫花低作帳雲從積成山宻視樞機草偷瞻咫尺顔恩垂天語近對乆漏聲閑丹陛曽同立金鑾恨獨攀樂天舎人徽之翰林筆無鴻業潤袍愧紫文殷河水通天上瀛洲接世間謫仙名籍在何不重來還神麹酒云七月調神麹三春釀綠醽雕鐫荆玉盞烘透内邱瓶戴光弓詩云潞府筋角勁戴光因合成閑吟云晻淡州煙白籬篩日脚紅江喧過雲雨船泊打頭風底子收魚市鴉兒噪荻叢不堪堤上立滿眼是蚊䖝狂醉云崐亭今日顛狂醉舞引紅娘亂打人亞枝紅云平陽池上亞枝紅桃花平在池上悵望山郵是事同還向萬莖深竹裡一枝渾卧碧流中㣲之在鄂州周復為從事常命酬唱復簮笏見㣲之曰某偶以大人徃還獲一第其實不能詩賦㣲之曰質實如是賢於能詩逺矣一云㣲之守浙東樂天守蘇䑓逓簡唱和内一聮云有月多同賞無杯不共持兩地暗合唐詩紀事巻三十七欽定四庫全書唐詩紀事巻三十八宋計敏夫撰白居易張為以居易為廣大教化主取其讀史詩云含沙射人影雖病人不知巧言誣人罪至死人不疑掇蜂殺愛子掩鼻戮寵姫𢎞恭䧟蕭望趙髙謀李斯隂徳既必報陽禍豈虛施人事雖可罔天道終難欺明即有刑辟幽即有神祗茍免勿私喜鬼得而誅之又取秦中吟云厚地植桑麻所用濟生民生民理布帛所求活一身身外充征賦上以奉君親國家定兩税本意在憂人厥初防其滛明勑内外臣税外加一物皆以枉法論奈何歳月乆貪吏得因循役我以求寵歛求無冬春織絹未盈疋繰絲未盈斤里胥廹我納不許蹔逡廵歳暮天地閉隂風生破村夜深煙火盡霰雪白紛紛幼者形不蔽老者體無温悲喘與寒氣併入鼻頭辛昨日輸殘税因窺官庫門繒帛如山積絲絮如雲屯號為羡餘物隨日獻至尊奪我身上暖買爾眼前恩進入瓊林庫歳乆化為塵又取寓意云豫章生深山七年而後知挺髙二百尺本末皆十圍天子建明堂此材獨中規匠人執斤墨採度将有期孟冬草朩枯烈火燎于陂狂風吹猛熖從根燒到枝養培二十年方成棟樑姿一朝為灰燼柯葉無孑遺地雖生爾材天不與爾時不如糞上芝猶有人掇之已矣勿重陳重陳令人悲勿悲焚燒苦但悲採用遲又取赫赫京内史奕奕中書郎昨傳徴拜日恩私頋殊常貂冠水蒼玉紫綬黄金章佩服身未暖已聞竄炎荒親戚不得别吞聲泣路旁賔客亦已散門前雀羅張富貴來未乆倐如瓦溝霜權勢言尤速瞥若石火光不如守貧賤貧賤可乆長傳語宦遊子且來歸故鄉又取得意减别恨半酣還逺程之句又人吏留不得直入故山雲之句又長生不似無生理休向青山學錬丹之句又白髪鑷不盡根在愁腸中之句又與薛濤云峨眉山勢接雲霓欲逐劉郎北路迷若似剡中容昜到春風猶隔武陵溪巳上皆主客圖序洛詩序云序洛詩樂天自叙在洛之樂也予歴覽古今歌詩自風騷之後蘇李以還李陵蘇武為五言詩次及鮑謝徒迄于李杜軰其間詞人聞知者累百詩章流傳者鉅萬觀其所自多因䜛寃譴逐征戍行旅凍餒病老存歿别離情發於中文形於外故憤憂怨傷之作通計今十八九焉世所謂文士多數竒詩人尤命薄於斯見矣又知理安之世少離亂之時多亦明矣予不佞喜文嗜詩自幼及老著詩數千首以其多矣故章句在人口姓字落詩流雖才不逮古人然所作不啻數千首作一數竒命薄之士亦有餘矣今壽過耳順幸無病苦官至三品免罹飢寒此一樂也大和二年詔受刑部侍郎明年就領河南尹事又三年病免歸履道里第再受賔客分司自三年春至八年夏至洛凡五周年作詩四百三十二首除喪明哭子十數篇外其他皆寄懐於酒􅂉取意於琴閑適有餘酣樂不暇苦詞無一字憂歎無一聲豈牽强所能致耶盖亦發中而形外耳斯樂也實本之於省分知足濟之以家給身閑文之以觴詠絃歌飾之以山水風月此而不適何徃而適哉兹又以重吾樂也予嘗云治世之音安以樂閑居之詩泰以適茍非理世安得閑居故集洛詩别為序引不獨記東都履道里有閑居泰適之叟亦欲知皇唐大和歳有理世安樂之音集而序之以候夫採詩者甲寅歳七月十日云爾元㣲之長慶集序云憲宗皇帝冊召天下士樂天對詔稱㫖又登甲科未幾入翰林掌制誥比上書言得失因為賀雨詩秦中吟等數十章指言天下事時人比之風騷焉予始與樂天同校秘書前後多以詩章尤長者始張十八古樂府李二十新歌行盧楊一裕書律詩竇七元八絶句愽取精掇編而次之號元白徃還詩集衆君子得擬議於此者莫不踊躍欣喜以為盛事嗟乎言未終而足下左轉不數月而僕又繼行心期索然何日成就又可為之歎息又僕嘗語足下凡人為文私於自是不忍於割截或失於繁多其間妍媸益又自惑必待交友有公鑒無姑息者討論而削奪之然後繁簡當否得其中矣况僕與足下為文尤患其多巳尚病之况他人乎今且各纂詩筆粗為巻第待與足下相見日各出所有終前志焉又不知相遇是何年相見在何地溘然而至則如之何㣲之㣲之知我心哉潯陽臘月江風苦寒歳暮鮮懽夜長無睡引筆鋪紙悄然燈前有念則書言無次第勿以繁雜為倦且以代一夕之話也㣲之㣲之知我心哉唐詩紀事巻三十八欽定四庫全書唐詩紀事巻四十宋計敏夫撰范傳正}
