  text: 唐詩紀事卷第三
  hash: sha256:61b667b7b8c718be782909b2ababa13ea55b6fa974681b42e8afb8af90590896
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_003-1a}
body:
  text: 武后徐賢妃上官昭容越王貞韓王元嘉孔紹安鄭世翼董思恭何仲喧沈叔安陸敬袁朗牛鳳及朱子奢庚抱張文恭陳叔逹薛收武后天授二年臘卿相欲詐稱花發請幸上苑有所謀也許之尋疑有異圖乃遣使宣詔曰明朝遊上苑火急報春知花須連夜發莫待曉風吹於是凌晨名花布苑群臣咸服其異后託術以移唐祚此皆妖妄不足信也大凡后之詩文皆元萬頃崔融輩為之同太平公主遊九龍潭則天御製云山窗遊玉女澗戶對瓊峰巗頂翔雙鳳潭心倒九龍酒中浮竹葉杯上寫芙蓉故驗山家賞唯有入松風萬歲通天元年鑄九鼎成置于東都明堂之庭后自製曳鼎歌令曳者唱和焉開元二年太子賔客薛謙光獻東都九鼎銘其蔡州鼎銘武后所制文曰犧農首出軒昊膺期唐虞繼踵湯禹乘時天下灮宅域內雍熙上玄降鍳方建隆基紫微令姚元崇奏曰聖人啓運休兆必彰請宣付史館巳兆於此明皇御名徐賢妃秋風函谷應詔云秋風起函谷徑氣動河山偃松千嶺上離雨二陵間低雲愁廣隰落日慘潼關此時飄紫氣應驗真人還長安崇聖寺有賢妃粧殿太宗曾召妃久不至怒之因進詩曰朝來臨鏡臺粧罷暫徘徊千金始一笑一召詎能來正觀二十三年上疏諌太宗息兵罷役其略曰大業者易驕願陛下難之善始者難終願陛下易之又曰漆器非延叛之方桀造之而人叛玉杯豈招亡之術紂用之而國亡侈麗之源不可不遏作法於儉猶恐其奢作法於奢何以制後賢妃名惠湖州人生五月能言四歲通論語八歲曉屬文父孝德嘗試使擬離騷為小山篇曰仰幽巗而流盻撫桂枝以凝想將千齡兮此遇荃何為兮獨往孝德大驚知不可掩於是所論著遂傳太宗知之召為才人遷充容丞徽元年卒贈賢妃弟齊𥅆子堅皆以學名上官昭容綵書怨云葉下洞庭𥘉思君萬里餘露濃香被冷月落錦屏虛欲奏江南曲貪封薊北書書中無别意唯悵久離居九月九日上幸慈恩寺登浮圖羣臣上菊花壽酒賦詩婕妤獻詩云帝里重陽節香園萬乘來却邪茰入佩獻壽菊傳杯塔類承天湧門疑待佛開睿詞懸日月長得御昭回十月駕幸三㑹寺婕妤獻詩云釋子談經處軒臣刻字留故臺冝老識殘簡聖皇求駐驆懷千古開襟望九州四山緣塞合二水夾城流宸翰陪瞻仰天杯接獻酬太平詞藻盛長願託鴻休中宗立春日遊苑迎春昭容應制云密葉因裁吐新花逐剪舒攀條雖不謬摘蘂詎知虛春至由來發秋還未肯踈借問桃將李相亂欲何如長寧公主流杯池六首玉環騰遠創金埒荷殊榮弗玩珠璣飾仍留仁智情鑿山便作室憑樹即為楹公輸與班尓從此遂韜聲其一登山一長望正遇九春初結駟填街術閭閻滿邑居鬪雪梅先吐驚風栁未舒直愁斜日落不畏酒樽虛其二霽曉氣清和披襟賞薜蘿玳瑁凝春色琉璃漾水波跂石聊長嘯攀松乍短歌除非物外者誰就此經過三其暫爾遊山苐淹留惜未歸霞窗明月滿澗戶白雲飛書引藤為架人將薜作衣此真攀玩所臨睨賞灮暉其四放曠出煙雲蕭條自不群漱流清意府隱几避囂氛石畫裝苔色風梭織木文山室何為貴唯餘蘭桂薰其五䇿杖臨霞岫危步下霜蹊志逐深山靜途隨曲澗迷漸覺心神逸俄看雲霧低莫怪人題樹祗為賞幽棲六其三首七言沁水田園先自多齊城樓觀更無過倩語張騫莫辛苦人今從此識天河其一參差碧岫聳蓮花潺湲緑水瑩金沙何須逺訪三山路人今巳到九仙家其二憑高瞰逈足怡心菌閣桃源不暇尋餘雪依林成玉樹殘雵㸃岫即瑶岑其三九首五言攀藤招逸客偃桂叶幽情水中看樹影風裏聽松聲其一携琴待叔夜負局訪安期不應題石壁為記賞山時二其泉石多仙趣巗壑寫竒形欲知堪悅耳唯聽水冷冷三其巗壑恣登臨瑩目復怡心風篁類長笛流水當鳴琴四其懶步天台路惟登地胏山幽巗仙桂滿今日恣情攀五其暫遊仁智所蕭然松桂情寄言棲遁客勿復訪蓬瀛六其瀑溜晴疑雨叢篁晝似昏山中真可玩暫請報王孫七其傍池聊試筆倚石旋題詩預彈山水調終擬從鍾期八其橫鋪豹皮褥側戴鹿胎巾借問何為者山中有逸人九其五首四言檀欒竹影飈䫻松聲不煩歌吹自足娛情其一仰循茅宇俯眄喬枝煙霞問訊風月相知其二枝條鬱鬱文質彬彬山林作伴松桂為鄰其三清波洶湧碧樹冥蒙莫怪留步因攀桂叢其四莫論圎嶠休說方壺何如魯館即是仙都其五二首三言逐仙賞展幽情喻昆閬邁蓬􅌡其一遊魯館陟秦臺汙山壁愧瓊瓌其二張說作昭容文集序云古者有女史記功書過有女尚書决事宫閣昭容兩朝專美一日萬機顧問不遺應接如響雖漢稱班媛晋譽左嬪文章之道不殊輔佐之功則異迹祕九天之上身沒重泉之下嘉猷令範代罕得聞庶幾後學嗚呼何仰然則大君據四海之圖懸百靈之命喜則九圍挾纊怒則千里流血靜則黔黎乂安動則蒼氓罷弊入耳之語諒其難乎貴而勢大者疑賤而禮絶者隔近而言輕者忽遠而意忠者忤惟窈窕柔曼誘掖善心忘味九德之衢傾情六藝之圃故登昆巡海之意寢剪胡刈越之威息璿臺珍服之態消從禽嗜樂之端廢獨使溫柔之教漸於生人風雅之聲流於來葉非夫元黃育粹正明助思衆妙扶識群靈挾志誕異人之寶授興王之瑞其孰能臻斯懿乎鎮國太平公主道高帝妹才重天人昔嘗共逰東辟同宴北渚倐來忽往物在人亡憫雕琯之殘言悲素扇之空曲上聞天子求椒房之故事有命史臣叙蘭亭之新集中宗正月晦日幸昆明池賦詩群臣應制百餘篇帳殿前結綵樓命昭容選一首為新翻御製曲從臣悉集其下須臾𥿄落如飛各認其名而懷之既進唯沈宋二詩不下又移時一𥿄飛墜競取而觀乃沈詩也及聞其評曰二詩工力悉敵沈詩落句云微臣雕杇質羞覩豫章材蓋詞氣巳竭宋詩云不愁明月盡自有夜珠來猶陟健舉沈乃伏不敢復爭宋之問詩曰春豫靈池近滄波帳殿開舟凌石鯨動查拂斗牛回節晦蓂全落春遲柳暗催象溟看浴景燒劫辨沉灰鎬飲周文樂汾歌漢武才不愁明月盡自有夜珠來昭容名婉兒西臺侍郎儀之孫父廷芝與儀死武后時母鄭方妊夢巨人畀大稱曰持此稱量天下昭容生踰月每戲曰稱量者豈爾耶輒啞然應後內秉機政符其夢云自通天以來內掌詔命中宗立進拜昭容帝引名儒賜宴賦詩婉兒常代帝及后長寧安樂二公主衆篇並作而采麗益新又差第群臣所賦賜金爵故朝廷靡然成風當時屬辭大抵浮靡然皆有可觀昭容力也韋后之敗斬闕下中宗幸溫湯獻三絶句云三冬季月景龍年萬乘觀風出灞川遙看電躍龍為馬逈矚霜原玉作田鸞旗掣曵拂雲回羽騎驂驔躡景來隱隱驪山雲外聳迢迢御帳日邊開翠幕朱帷敞月營金罍玉斚泛蘭英歲歲年年常扈蹕長長久久樂承平正元十四年崔仁亮於東都買得研神記一卷有昭容列名書縫處吕溫感歎因賦上官昭容書樓歌云漢家婕妤唐昭容工詩能賦千載同自言才藝是天真不服丈夫勝婦人歌闌舞罷間無事縱恣優游弄文字玉樓寶架中天居緘竒祕異萬卷餘水精編帙緑鈿軸雲母搗𥿄黃金書風飄花露清旭時綺窗高挂紅綃帷香囊盛煙繡結絡翠羽拂案青琉璃吟披嘯卷紛無巳皎皎淵機破研理詞縈綵翰紫鸞回思耿寥天碧雲起碧雲起心悠哉境深轉苦坐自催金梯珠履聲一斷瑶階日夜生青苔青苔祕仙關曾比群玉山神仙杳何許遺逸滿人間君不見洛陽南市賣書肆有人買得研神記𥿄上香多蠧不成昭容題處猶分明令人惆悵難為情高宗後苑雙頭牡丹昭容詩云勢如連璧友心似臭蘭人越王貞和過溫湯詩鳳輦騰宸駕驪籞次乾遊坎德踈溫液山隈派暖流寒氛空外擁蒸氣沼中浮林凋帷影散雲斂蓋隂收霜郊暢玄覽參差落景遒貞善騎射涉文史有吏幹為宗室材王中宗廢居房陵貞為豫州剌史垂拱四年八月起兵圖反正事兵敗及禍韓王元嘉奉和同太子監守違戀詩云乾象開層屋離眀啓少陽卜征從獻吉守器屬元良逖矣凌周誦遙哉掩漢莊好士傾南洛多才盛北場地分丹鷟嶺途間白雲鄉儲誠爰曉夕宸愛積炎凉珠璧連霄漢萬物仰重光太子也高宗為元嘉高祖子垂拱中剌綘州與越王子冲圖舉兵冲敗元嘉至京師謀泄后逼令自殺孟利正嘗稱其文曰劉鄰之周思茂不過也孔紹安石榴詩可惜庭中樹移根逐漢臣只為時來晚開花不及春詠夭桃云結葉還臨影飛香欲遍空不意餘花落翻沉露井中紹安大業末為監察御史高祖為隋討賊河東紹安監其軍深見接遇高祖受禪紹安自洛陽間行來奔高祖大悅拜內史舍人時夏侯端亦嘗為御史先來歸紹安授祕書監因侍宴詠石榴有祗為時來晚開花不及春之句武德中令狐德棻欲補正歷代史記各差官主修一代紹安以中書舍人與崔善為蕭德言主梁多歷年不能就皆罷之紹安在隋時與孫萬壽以文辭稱時謂孫孔紹安贈蔡君詩云疇昔同幽谷伊爾遷喬木赫奕盛青紫討論窮簡牘賦結客少年場云結客佩吳鈎橫行度隴頭鴈在弓前落雲從陳後浮吳師驚燧象燕將警奔牛轉蓬飛不息氷河結未流若使三邊定當封萬戶侯鄭世翼過嚴君平古井詩云嚴平本高尚逺蹈古人風賣卜成都市流名大漢中舊井攺人世寒泉久不通年多既罷汲無禽乃遂空如何屬秋氣唯有雙井桐看新婚詩云初笄夢桃李新粧應標梅疑逐朝雲去翻隨暮雨來雜珮含風響叢花隔扇開姮娥對此夕何用久徘徊登北邙還至京洛詩云步登北邙阪踟蹰聊寫望宛洛盛皇居規模窮大壯三河分設儉兩崤資巨防飛觀紫煙中層臺碧雲上青槐夾馳道迢迢修且曠左右多第宅參差居將相清晨謁帝返車馬相追訪胥徒各異流文物紛殊狀囂塵暗天起簫管從風揚伊余忠且直生平獨淪喪山幽有桂叢何為坐惆悵世翼滎陽人武德時為楊州録事參軍數以言忤物有崔信明者嘗矜其文謂過李百藥世翼遇之江中謂曰聞公有楓落吳江冷願見其餘信明欣然多出衆篇世翼覽未終曰所見不逮所聞投諸水引舟去正觀時坐怨謗流死嶲州世翼巫山高云巫山凌太清岧嶤類削成霏霏暮雨合靄靄朝雲生危峰入鳥道深谷寫猿聲别有幽棲客淹留攀桂情董思恭星詩云歷歷東井舍昭昭右掖垣雲際龍文出池中鳥色翻流暉下月路墮影入河源方知頴川集别有太丘門雪詩云天山飛雪度言是落花朝惜哉不我與蕭索健風飄鮮潔凌紈素紛糅下枝條良書竟何在坐見容華銷虹詩云春暮萍生早日落雨飛餘橫彩分長漢倒色媚清渠梁前朝影出橋上晚光舒願逐旌旗轉飄飄侍直廬霧詩云蒼山寂巳暮翠觀黯將沉終南晨豹隱巫峽夜猿吟天寒氣不歇景晦色方深侍訪公超市將豫赴華隂詠日云滄海十枝暉玄圃重輪慶蕣華發晨檻凌彩翻朝鏡忽遇驚風飄自有浮雲映更也人皆仰無待揮戈正昭君怨云琵琶馬上彈行路曲中難漢月正南逺燕山直北寒髻環風拂破眉黛雪沾殘斟酌紅顔攺徒勞握鏡看詠月云北堂未安寢西園聊騁望玉戶照羅幃珠軒明綺幛别客長安道思婦高樓上所願君莫遺清風時可訪野郊愴新别河橋非舊餞慘日映峰沉愁雲隨蓋轉哀笳時斷續悲旌乍舒卷望望情何極浪浪淚空泫無復昔時人芳春共誰遣詠琵琶云半月無雙影金花有四時權藏千里態掩抑幾重悲促節縈紅䄂清音滿翠帷駛彈風響急緩曲釧聲遲空餘關隴恨因此代相思詠弓詩云上弦明月半激箭流星逺落鴈帶書驚啼猿映枝轉詠桃詩云禁苑春灮麗花蹊幾樹裝綴條深淺色㸃露參差灮向日分千笑迎風共一香如何仙嶺側獨秀隱遙芳詠李詩云盤根植􅌡渚交幹橫倚天舒華灮四海卷葉䕃三川守歲詩云暮景斜芳殿年華麗綺宫寒辭去冬雪暖帶入春風階馥舒梅素盤花卷燭紅共歡新故歲迎送一霄中又云歲隂窮暮紀獻節啓新芳冬盡今宵促年開明日長冰銷出鏡水梅散入風香對此歡終宴傾壺待曙光思恭高宗時中書舍人同撰瑶山玉彩何仲喧七夕賦詠成萹云日日思歸勤理鬢朝朝佇望懶調梭凌風寶扇遙臨月映水仙車逺渡河歷歷珠星疑拖珮冉冉雲衣似曵羅通宵道意終無盡向曉離愁巳復多仲喧武德正觀間人也沈叔安七夕賦詠成篇云皎皎霄月麗秋灮耿耿天津橫復長停梭且復留殘緯拂鏡及早更新粧彩鳯齊駕初成輦凋鵲填河巳作梁雖喜得同今夜枕還愁重空明日牀南部新書云武德七年遣刑部尚書沈叔安携天尊像賜高麗後為潭州都督圖形凌煙閣陵敬七夕詩云夙駕鳴鑾啓閶闔霓裳遙裔儼天津五明霜紈開羽扇百和香車動畫輪婉孌夜分能幾許靚粧冶服為誰新片時歡娛自有極巳復長望隔年人敬有集十四卷高祖時人也初為竇建德國子祭酒秦王軍武牢建德軍迫於武牢不得進敬說令取懷州踰太行入上黨趍壷口駭蒲津乘唐國之虛以取山北建德不從以及於敗其僞官屬皆降唐袁朗秋日應詔詩云玉樹凉風舉金塘細草萎葉落商飈觀鴻歸明月池迎寒桂酒熟含霧菊花垂一奉章臺宴千秋長願斯朗父樞仕陳為德教殿學士陳亡入隋唐初朗為秦王府文學太宗時為給事中卒帝曰朗任淺而性謹厚使人悼惜賦飲馬長城窟云朔風動秋草清蹕長安道長安運不窮所以隔華戎規模唯聖作荷負曉成功鳥庭巳向內龍荒更鑿空玉關塵卷靜金徽路巳通湯征隨北怨舜詠起南風盡野功初立綏邊事云集朝服踐狼居凱歌旋馬邑山響傳鳳吹霜華藻瓊鈒屬國擁節歸單于欵關入日落寒風起驚河被原隰零落葉巳寒河流清且急四時徭役靜千載干戈戢太平今若斯汗馬意無施唯當事筆硯歸去草封禪牛鳳及奉和受圖溫洛詩云八神文玉輦六羽警瑶溪戒道伊川北通旌澗水西御圗開洛匱刻石與天齊瑞日波中上仙禽霧裡低微臣矯弱翮抃舞接鸞鷖劉軻與馬植論史官書云文皇帝受命有若魏鄭公楊仁卿牛鳳及朱子奢文德皇后挽歌云神京背紫陌騩駟結行輈北失橫橋道西分清渭流寒灮向壟沒霜氣入松楸今日泉臺路非是濯龍遊子奢蘇州人正觀時為諌議大夫善文辭為人樂易能劇談以經誼緣飾每侍宴帝令論難群臣庾抱賦得胥臺露詩云胥臺既落室荆棘稍侵扉棟折連雲影梁槯照日暉翔鸖遂不返巢燕反無歸唯有團階露承曉共霑衣抱仕隋為元德太子學士高祖起兵太子封隴西公以抱為記室文檄皆出其手俄為東官學士正觀初徙趙王友卒張文恭七夕詩云鳳律驚秋氣龍梭靜夜機星橋百枝動雲路七香飛映月回雕扇凌霞曵綺衣含情向華幄流態入重闈歡餘夕漏盡怨結曉驂歸誰念分河漢還憶兩心違文恭正觀時人與房元齡辛丘馭李懷儼趙洪智劉禕之陽仁鄉上官儀李淳風等同修晉書名為御撰陳叔逹字子聰陳宣帝子武德初判納言太宗時拜禮部尚書明辨善為容初年詩云和風起天路嚴氣銷氷井索索枝未柔厭厭漏猶永春首詩曰雪花聮玉樹氷彩散瑶池翔禽遙出沒積翠逺參差又早春桂林殿應詔詩曰金鋪照春苑玉律動年華朱樓雲似蓋丹桂雪如花氷岸銜階轉風條出柳斜輕輿臨太液仙露酌流霞聽鄰人琵琶詩云本自龍門桐因妍入漢中香由羅䄂裏聲逐朱絃中離有相思韻翻將入塞同關山臨却月花蘂散回風為將金谷引添令曲未終薛收琵琶賦云惟兹器之為宗揔群樂而居妙應清角之高節發號鐘之雅調處躁靜之中權執踈密之機要遏浮雲而散彩揚白日以垂耀爾其狀也龍腹鳳頭熊據龍旋戴曲履直破觚成圓虛心內受徑質外宣磅礴象地穹崇法天候八風而運軸感四氣而鳴絃金華徘徊而月照玉桂的歷以星懸收字伯褒蒲州人善屬文為秦王府主簿陜東大行臺金部郎中武德七年卒太宗即位語元齡曰收若在朕當以中書令處之收與弟德音元欽齊名號河東三鳳收為長雛德音為鸑鷟元敬年最少為鵷雛唐詩紀事卷第三
