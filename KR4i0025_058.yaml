  text: 唐詩紀事卷第五十八
  hash: sha256:71f6eafb7d515e4d11d5b8eccd03029ddef6878d55b16f49dda6253ee6e3aca9
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_058-1a}
body:
  text: 溫庭皓韋蟾李敬芳李溟李郢韓琮劉滄栁棠賀蘭朋吉崔珏李洞長孫翺崔櫓曹唐于武陵霍㧾劉魯風盧尚卿溫庭皓尚書東苑公鎮襄陽成式庭皓蟾皆其從事上元唱和詩各三篇成式詩云風杪影凌亂露輕光陸離如霞散仙掌似燒上峨嵋道樹千花發扶桑九日移因山成衆象不復藉蟠螭踴出多寶塔往來飛錫僧分明三五月傳照百千燈馴狖移髙柱慶雲遮半層夜深寒焰白猶自綴金繩磊落風初定輕明雲乍妨疏中搖月彩繁處雜星芳火樹枝柯密燭籠鱗角張窮愁讀書者應得假餘光庭皓詩云一峰當勝地萬㸃照嚴城勢異崑岡發光疑玄圃生焚書翻見字舉燧不招兵况遇新春夜何勞秉燭行九枝應並耀午夜思潜然景集青山外螢分碧草前輝華侵月影歷亂寫星躔望極髙樓上搖光滿綺延春山收暝色爝火集余輝麗景饒紅熖祥光出翠微白榆行自比青桂影相依唯有偷光客追逰欲忘歸庭皓咸通中為徐州崔彥曾幕府龎勛反以創脅廷皓使為表求節度使倨答曰我豈以筆硯事汝耶其速殺我遂遇害廷皓梅詩云一樹寒林外何人此地栽春光先自暖陽艷暗相催曉覺霜添白寒迷月借開餘香低惹䄂墮蘃逐流杯零落移新暖飄揚上故臺雪繁鶯不識風裊蝶空回羌吹應愁起征徒異渴來莫貪題詠興商鼎待鹽梅韋蟾上元唱和詩云新正圓月夜尤重看燈時纍塔嫌沙細成文訝筆遲歸牛疑燧落過鴈悮書遺生惜蘭膏燼還為隔嵗期舉燭光才起揮毫勢競分㸃時驚墜石桃處接崩雲辭異秦丞相銘非竇冠軍唯愁殘熖落逢玊亦俱焚多寶神光動生金瑞色浮照人低入郭伴月夜當樓熏穴應無取焚林固有求夜䦨陪玉帳不見九枝留蟾簾問鄂州罷賔僚祖餞蟾曾書文選句云悲莫悲兮生别離登山臨水送將歸以箋毫授賔從請續其句逡巡有妓泫然起曰某不才不敢染翰欲口占兩句韋大驚異令隨念云武昌無限新栽栁不見楊花撲面飛座客無不嘉歎韋令唱作楊栁枝詞蟾為尤丞至長樂驛見李湯給事題名題其側曰渭水春山照眼明希仁何事寡詩情只應學得虞姬壻書字才能記姓名蟾字隱圭下杜人大中七年進士登第初為徐商掌書記終尚書左丞梅詩云髙樹臨溪艷低枝隔竹繁何須是桃李然後欲忘言擬折魂先斷須看眼更昏誰知南陌草却解望王孫題僧壁云一竹橫簷挂淨巾竈無烟火地無塵剃頭未必知心法要且間於名利人假成式和云有僧支頰撚眉毫起就夕陽磨剃刀到此既知間處樂俗心何啻九牛毛送盧潘尚書之靈武云賀蘭山下果園成塞北江南舊有名水木萬家朱戶暗弓刀千隊鐡衣鳴心源落落堪為將膽氣堂堂合用兵却使六畨諸子弟馬前不信是書生贈商山僧云啇嶺東西路欲分兩間茅屋一溪雲師言耳重知師意人是人非不欲聞李敬方天台間望云天台十二旬一片雨中春林果垂楊盡山苖半夏新陽烏暗展翅隂餽夜飛輪坐兾無雲物分明見北辰勸酒云不向花前醉花應解笑人只憂連夜雨又過一年春聞髙侍郎卒貶所云京西髙院長直氣似吾徒走馬論邉備飛聲感廟謨官移人未察身沒事多符寂寞他年後名編野史無遣興云果窺丹竈鶴莫羡白頭翁日月仙壺外筋骸藥臼中雲歸無定所鳥跡不留空何必勞方寸嶇﨑問逺公汴河直進船云汴水通淮利最多生人為害亦相和東南四十三州地取盡脂膏是此河字中䖍登長慶進士第大和中為歙州刺史大中時顧陶集唐詩類選云李歙州敬方才力周備興比之間獨與前輩相近家集三百首簡擇律韻八篇而已雖前後􅞅絶或畏多言而典刑具存非敢避棄李溟喬木掛斗色水驛壞門開向月片帆去背雲行鴈來晚年名利跡寧免路岐哀前計不能息若為玄鬢回題無溟以是詩得名張為取作主客圖賈島送溟謁宥州李權使君云英雄典宥州迢遞苦吟遊風宿驪山下月斜灞水流去時初落葉回日定無秋太守携才子看鵬百尺樓李郢重陽日寄浙東諸從事云野人多病門長掩荒圃重陽菊自開愁裏又聞清笛怨望中難見白衣來元瑜正及從軍樂寧戚誰憐叩角哀紅斾紛紛碧江暮知君醉下望鄉臺奉陪裴相公重陽日游安樂池亭云絳霄輕靄翊三台嵇阮情懷管樂才蓮沼昔為王儉府菊籬今作孟嘉杯寧知北闕元勳在北闕大第漢賜蕭何等却引東山臼客來自笑吐茵還酩酊日斜空從綘衣回和湖州杜員外冬至日白蘋州見憶云白蘋亭上一陽生謝眺新裁錦繡成千嶂雪銷溪影緑幾家梅綻海波清已知鷗鳥長來狎可許汀洲獨有名多愧龍門重招引即拋田舍棹舟行贈羽林將軍云虬髯憔悴羽林郎曽入甘泉侍玉皇鵰沒夜雲知御苑馬隨仙仗識天香五湖劫去孤舟月六國平來兩鬢霜唯有桓伊江上笛卧吹三弄送殘陽上裴晉公詩云四朝憂國鬢如絲龍馬精神海鶴姿天上玊書傳詔夜陳前金甲受降時曾經庾亮三秋月下盡羊曇兩路碁惆悵臼堂扄緑野夕陽無限鳥飛遲江亭春霽云江籬漠漠荇田田江上雲亭霽景鮮蜀客帆檣背㱕燕楚山花木怨啼䳌春風掩映千門栁晚色凄寒萬井烟金磬泠泠水南寺上方僧室翠微連寒食逺望云舊墳新隴哭多時流世都堪幾度悲烏鵲亂啼人未逺野風吹散白棠梨七夕寄張氏兄弟云新秋牛女㑹佳期紅粉筵開玊饌時好與檀郎記花朵莫教清曉羡珠絲七夕云烏鵲橋頭雙扇開年年一度過河來莫嫌天上稀相見猶勝人間去不回欲减烟花饒俗世暫煩烟月掩粧臺别時舊路長清淺豈肯離似死灰中元夜詩云江南水寺中元夜金粟欄邉見月娥紅燭影回仙態近翠環光動見人多香飄彩殿疑蘭麝霧繞輕衣雜綺羅湘水夜空巫峽逺不知歸路欲如何字楚望大中進士終於御史郢有詩云江風徹曙不成睡二十五聲秋㸃長最為警絶劉光逺載於金華子李義山汴上送郢之蘇州云人髙詩苦滯夷門萬里梁王有舊園烟幌自應憐白紵月樓誰伴詠黃昏露桃塗頰依苔井風栁誇腰住水村蘇小小墳今在否紫蘭香徑與招魂杜牧之湖南正初招郢云行樂及時時巳晚對酒當歌歌不成千里暮山重疊翠一溪寒水淺深清髙人以飲為忙事浮世除詩盡强名看著白蘋芽欲吐雪舟相訪勝間行方千贈李郢端公非唯孤峭與世絶吟處斯須能變通物外搜羅歸大雅毫端剪削有餘功山川正氣侵靈府雪月清輝引惠風别得人間上升術丹霄路在五言中郢子興字魯珍生於南海尤能詩每一篇成必鱠炙人口後登甲科韓琮春愁篇云金烏長飛玉兔走青鬢長青古無有秦娥十六語如絲未解貪花惜楊栁吳魚嶺無鴈消息氷盻蘭情别來久勸君年少莫逰春暖風遲日濃如酒詠馬云曽經伯樂識長鳴不似龍行不敢行金垀未登嘶若是鹽車猶駕瘦何驚難逢王濟知音癖欲就燕昭買駿名早晚飛黃引同皂碧雲天上作鸞鳴暮春送客云緑暗紅稀出鳯城暮雲樓閣古今情行人莫聼宫前水流盡年光是此聲駱谷晚望云秦川如畫渭如絲去國還鄉一望時公子王孫莫來好嶺花多是斷腸枝二月二日逰洛源云舊苑新晴草似苔人還香在踏青開今朝此地成惆悵已後逢春更莫來公子行云紫袖長衫色銀蟬半臂花帶粧盤水玊鞍繡坐雲霞别殿承恩澤飛龍賜渥窪控羅青裊轡鏤象碧熏葩意氣催歌舞䦨珊走鈿車袖彰雲縹眇叉轉鳳欹斜珠卷迎歸箔紅籠晃醉紗唯無難夜日不得似仙家字代封大中中為湖南觀察使待將士不以禮宣宗時為都將石載順等所逐劉滄中秋夜玩月詩云中秋郎月靜天河烏鵲南飛客恨多寒色滿窗明枕簟清光凝露拂烟蘿桂枝斜漢流靈魄蘋葉微風動細波此夜空庭聞木葉蒹葭霜積鴈初過與僧話舊云巾舄同時下翠微舊逰因話事多違南朝古寺幾僧在北嶺空林唯鳥歸莎徑晚烟凝竹塢石池香色染苔衣此來相見又相别即是關河朔㕍飛經煬帝行宫云此地曾經翠輦過浮雲流水竟如何香消南國美人盡怨入東風芳草多殘栁宫前空露葉夕陽川上浩烟波行人遙起廣陵思古渡月明聞棹歌咸陽懷古云經過此地無窮事一望凄然感廢興渭水故都秦二世咸陽秋草漢諸陵天空絶塞聞邉㕍葉盡孤村見夜燈風景蒼蒼多少恨寒山半出白雲層長洲懷古云野燒空原盡狄灰吳王此地有樓臺千年事往人何在半夜月明潮自來白鳥影從江樹沒清猿聲入楚雲哀停車日晚薦蘋藻風靜寒塘花正開滄字藴靈大中進士也栁棠東川栁棠應進士舉才思優贍楊尚書汝士作鎮日以一巨魚飲之棠不即飲楊公以詩戲之曰文章謾道能吞鳳杯酒何曾解喫魚今日梓州張社㑹應須遭這老尚書棠曰未向燕臺逢厚禮幸因社㑹接餘歡一魚喫了終無愧鵾化為鵬也不難初棠與馮戡善棠及第後戡與詩曰桃花浪裏成龍去竹葉山頭退鷁飛棠每於東川席狂上縱日甚詩忤楊公云莫言名位未相儔風月何曽阻獻酬前輩不須輕後輦靖安今日在衡州靖安李宗閔尚書與楊公中外昆弟東川益怒為書讓其座主髙諎侍郎曰栁棠者凶悖囂傲識者惡之狡過者仲容才非犬子且膺門之貴豈宜有此生乎二公以書往返詰難棠不任憂愓其後參越嶲軍事而卒賀蘭朋吉客舍喜友人相訪云荒居無四鄰誰肯訪來頻古樹秋中葉他鄉病裏身㕍聲風送急螢影月流新獨為成名晚多慙見友人賈島寄朋吉云往往東林下花香似火焚故園從小别夜雨近秋聞野菜連寒水枯株簇古墳泛舟同逺客尋寺入幽雲斜日扉多掩荒田徑細分相思蟬幾處偶坐蝶成群㑹宿曽論道登髙省議文苦吟遙可想邉葉向紛紛島又有夜喜賀蘭三見訪詩云漏鍾仍夜淺時節欲秋分泉䀨棲松鶴風除翳月雲踏苔行引興枕石卧論文即此尋常靜來多祗是君崔珏嶽陽樓晚望云乾坤千里水雲間釣艇如萍去復還樓上北風斜卷席湖中西日倒銜山懷莎有恨騷人往鼓瑟無聲帝子間何事黃昏尚凝睇數行烟樹接荆蠻哭李商隱云成紀星郎字義山適歸黃壤抱長歎詞林枝葉三春盡學海波瀾一夜乾風雨已吹燈燭滅姓名長在齒牙寒應逰物外攀琪樹便著霓裳上玉壇水精枕云千年積雪萬年氷掌上初擎力不勝南國舊知何處得北方寒氣此中凝黃昏轉燭螢飛沼白日褰簾水在簮蘄簟蜀琴相對好裁詩乞與滌煩襟鴛鴦云翠鬛紅毛舞落暉水禽情似此禽稀暫分烟島猶回首秪過寒塘亦並飛映霧乍迷金殿冷逐梭齊上玊人機採蘭無恨蘭橈女笑指中流候爾歸珏作太魏公幕與副車袁充常侍不叶公俱薦之於朝珏拜藝閣讐校㑹有客以絲桐詣公心善之欲振其名命以所乘馬迎珏賞之公為客請一篇珏因以發其憤詩云云七條絃上五音寒此藝知音自古難唯有河南房次律始終憐得董庭蘭恚公大珏字夢之登大中進士第李義山送珏往西川云年少因何有旅愁欲為東下更西逰一條雪浪吼巫峽千里火雲燒益州卜肆至今多寂寞酒爐從古擅風流浣花箋紙桃紅色好好題詩詠玊鈎李洞上崇賢曹郎中云間坊宅枕穿宫水聽氷分衾盡蜀僧藥杵聲中搗殘夢茶鐺影裏煮孤燈刑曹樹䕃千年井華嶽樓開萬里氷詩句變風官漸緊夜濤春盡海邉藤子規詩云萬古瀟湘汲上雲化為流血杜䳌喀長疑啄破青山色只恐啼穿白月輪花落玄宗歸蜀道雨飛工部宿江津聲聲猶恐聒君耳不見千愁一甑塵洞唐諸王孫也常逰西川慕賈浪仙為詩鑄銅像其儀事之如神洞為終南山詩二十韻句有殘陽髙照蜀敗葉逺浮涇復曰􅓯竹烟嵐凍偷湫雨雹腥逺平丹鳳闕冷射五侯㕔贈司空侍郎云馬饑餐落葉鶴病曬殘陽又曰卷箔清溪月敲松紫閣書又送僧云越講迎騎象蕃齊懴射鵰上髙僕射曰征南破虜漢功臣提劔歸來萬里身間倚凌雲金柱看形容消瘦老於真復曰藥杵聲中搗殘夢茶鐺影裏煮孤燈送人歸東南云島嶼分諸國星河共一天時人但誚其僻澀而不能貴其竒峭唯吳子華深知之子華才力浩大八面受敵以韻著稱刃游頗攻騷雅嘗以百篇示洞洞日大兄所示百篇中有一聯絶唱西昌新亭曰暖漾魚遺子晴逰鹿引麛子華不怨所鄙而喜所許洞三榜裴公第二榜䇿夜簾前獻詩公道此時如不得昭陵慟哭一生休尋卒蜀中裴公無子人謂屈洞所致裴公贄也洞慕賈島鑄其像頂戴常念賈島佛夢北洞終南山詩云關內平田窄東西截杳冥雨侵諸縣黑雲破九門青暫看猶無暇長栖信有靈古苔先漬斗積霧夜昏螢怒恐撞天漏深疑隱地形盤根連北嶽轉影落南溟窮穴何山出遮蠻上國寧殘陽髙照蜀敗葉逺浮涇􅓯竹烟嵐凍偷湫雨雹腥間房僧灌頂浴澗鶴為翎梯滑危緣索雲深靜唱經放泉經鹿睡聞磬得人醒踏逐神仙宅敲開洞府扄碁殘秦士局字缺晉公銘一谷𠢐開午孤峰聳起丁逺平丹鳯闕冷射五侯㕔万丈氷哜折千尋樹影亭望中仙島動行處月輪馨疊石移臨砌研膠潑上屛明時獻君夀不假老人星送僧逰南海云春往海南邉秋閒半路蟬鯨吞洗鉢水犀觸㸃燈船島嶼分諸國星河共一天長空却歸日松偃舊房前賦得送賈島調長江云敲爐吟雪月謫出國西門行傍長江影愁深汨水魂印携過燒寺琴典在花村飢食山松子誰知賈傳孫題維摩暢林居云諸方逰幾臘五夏五峰銷越講迎騎象蕃齊懴射鵰冷笻書雪倚枯櫟畫雲燒從此西林老瞥然三万朝鄭谷哭洞詩云自聞東蜀病唯我最關情若近長江死想君勝在生浪仙詩李生酷愛瘴蒸丹旄濕燈隔素帷清塜樹僧栽後新蟬一兩聲長孫翺長孫翺朱慶余各有宫詞翺詞曰一道甘泉接御溝上皇行處不曾秋誰言水是無情物也到宫前咽不流朱曰寂寂花時間院門美人相對泣瓊軒含情欲說宫中事鸚鵡前頭不敢言崔櫓春晚嶽陽城言懷云煙花零落過清明異國光隂老客情雲夢夕陽愁裏色洞庭春浪坐來聲天邉一與舊山别江上幾看芳草深獨憑欄杆意寫難暮笳鳴軋調孤城華清宮詩云銀河漾漾月輝輝樓礙星邉織女機橫玊呌雲清似水滿空霜逐一聲飛障掩金雞蓄禍機翠華西拂蜀雲飛珠簾一閉朝元閣不見人歸見燕歸草遮回蹬絶鳴鑾雲樹深深碧殿寒明月自來還自去更無人倚玉欄杆門橫金鎖悄無人落日秋聲渭水濵紅葉下山寂寂濕雲如夢雨如塵櫓慕杜紫微為詩櫓才情麗而近蕩有無機集三百篇尤能詠物如梅花詩曰强半瘦因前夜雪數枝愁向晚天來復曰初開已入雕梁畫未落先愁玉笛吹山鵲詩曰雲生柱礎降龍地露洗林巒放鶴天蓮花詩云無人解把無塵袖盛取殘香盡日憐櫓有酒失於䖍州陸郎中肱以詩謝之日醉時顛蹶醒時羞麴蘖推人不自由叵耐一雙窮相眼不堪花卉在前頭出托言櫓大中時進士也山路見花詩曰曉紅初折露香新獨立空山冷笑春春意自知無主惜恣風吹逐馬蹄塵岸梅云含情含怨一枝枝斜壓漁家短短籬惹袖尚餘香半日向人如訴雨多時初開偏稱雕梁畫未落先愁玉笛吹行客見來無去意解帆烟浦為題詩曹唐暮春戲贈吳端公云年少英雄好丈夫大家望拜漢金吾間眠曉日聼鶗鴂笑倚春風杖轆轤深院吹笙從漢婢靜街調馬任奚奴牡丹花外簾鈎下獨憑紅肌捋虎鬚病馬云緑耳何年别渥窪病來顔色半泥沙四蹄不鑿銀砧裂雙眼慵開玉燭斜墮月兔毛輕蔛蔌失雲龍骨瘦牙槎平原好放無人放嘶向東風苜蓿花嘗寓江陵佛寺寺有亭沼唐得句曰水底有天春漠漠人間無路月茫茫明日還坐沼上有二婦人素裳徐徐步詠所吟詩唐迫而訊之不應未十步而沒數日唐亦殂竟不成名簫聲欲盡月色苦依舊漢家宫樹秋句逰仙看却龍髯攀不得九霞零落鼎湖宫句一曲哀歌茂陵道漢家天子葬秋風句誰知漢武無仙骨滿竈黃金成白烟句右張為取作主客圖唐字堯賔桂州人初為道士後為使府從事咸通中卒作逰仙詩百餘篇其友人曰堯賔曽作鬼詩唐曰何也日井底有天春寂寂人間無路月茫茫非鬼詩而何唐大哂逰仙詩今見一絶云靜節先生幾代孫青娥曽玉郎魂春風流水還無賴偷放桃花出洞門唐詩屬對清切如鷓鴣思起歌聲動鴝鵒身翻舞袖齊斬蛟青海上射虎黑山頭此類頗多于武陵孤雲詩云南北各萬里有雲心更間因風離海上伴月到人間洛浦少髙佳一作樹長安無舊山徘徊不可住漠漠又東還客中云楚人歌竹枝逰子淚沾衣異國久為客寒宵頻夢歸一封書未返千樹葉皆飛南度洞庭水更應消息稀長信宫云簞凉秋氣初長信恨何如拂黛月生指理髮雲滿梳一從悲畫扇幾度泣前魚坐聽南宫樂清風搖翠𥚑武陵㑹昌時詩人也白日不西落紅塵應亦深白青山如有利白石亦成塵句四海少年路千川無定波句右張為取作主客圖霍揔郡樓望九華歌云樓上坐見九子峰翠雲赤日光溶溶有時朝昏變踈密八峰和烟一峯出有時風卷天雨晴聚連連如弟兄陽烏生子偶成數丹鳯飬雛同此名日日遙看機已靜未離塵躅思真境子明龍駕騰九垓陵陽相對空崔嵬玉漿瑶草不可見自有神仙風馬來武元衡嘗有送揔詩云瑟絲簫管怨津樓三奏行人醉不留别後相思江一岸落花飛處杜䳌愁揔咸通時為池州刺史劉魯風魯風江西投謁所知頗為典客所阻因賦一絶曰萬卷書生劉魯風烟波萬里謁文翁無錢乞與韓知客名紙毛生不肯通魯風張又新客也又新水記曰子刺九江有客李滂門士劉魯風自正元後唐文甚振以文學科第為一時之榮及其弊也士子豪氣罵吻逰諸矦門諸侯望而畏之如劉魯風姚嵓保栁棠平曽之徒其文皆不足取余故載之者以見當時諸侯爭取譽於文士此蓋外重內輕之牙蘖如李益者一時文宗猶曰感恩知有地不上望京樓其後如李山甫輩以一名第之失至挾方鎮劫宰輔則又有甚焉者矣一篇一韻初若虛文而治亂之萌係焉余以是知其不可忽也盧尚卿咸通十一年以龎勛盜據徐州久屯戌卒連年飛挽物力方虛因詔權亭貢舉一年是嵗尚卿自至闕聞詔而回乃賦東歸詩曰九重丹詔下塵埃深瑣文闈罷選才桂樹放教遮月長杏園終待隔年開自從玉帳論兵後不許金門諌獵來今日灞陵橋上過門人應笑臘前回尚卿至僖宗中和二年始登第於蜀
