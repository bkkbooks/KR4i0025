  text: 唐詩紀事卷第五十七
  hash: sha256:6c6e7f8f11261d36b653fe08fa021fefac27ba6fcc953d53f72c0f540fcf6777
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4i0025_SBCK_057-1a}
body:
  text: 假成式成式記云武宗癸亥三年夏豫與張君希復善繼同官祕書鄭君符夢復連職仙局㑹暇日逰大興善寺因問兩京雜記及逰目記多所遺略乃約一旬尋兩寺以街東興善為首二記所不具到則别録之遊及慈恩初知官將併寺僧衆草草乃泛問一二上人及記塔下畫跡逰於此遂絶後三年豫職于京洛及刺安成至大中七年歸京在外六甲子所留書籍揃壞居半於故簡中覩與二亡友逰寺瀝血淚交當時造適樂事邈不可追復方刋整才足續穿蠧然十亡五六矣靖恭坊大興善寺寺取大興兩字坊名一字為名新記云優填像總章初為火所燒據梁時西域優填在荆州言隋自臺城移來此寺非也今又有旃檀像開目其工頗拙尤差謬矣不空三藏塔前多老松嵗旱則官伐其枝為龍骨以祈雨蓋三藏役龍意其木必有靈也東廊之南素和尚院庭有紫桐四株素之手植元和中卿相遊此院桐至夏有汗汚人衣如輠脂不可浣相國東門鄭相嘗與丞相數人避暑惡其汗謂素曰弟子為和尚伐此木各植一松也及暮素戲祝木曰我種汝二十餘年汝以汗為人所惡來嵗若復有汗我必薪汝自是無汗寶歷末豫見說已十五餘年無汗矣素公不出院轉法華經三萬七千部夜常有貉子聽經齊時烏鵲就掌取食長慶初庭前牡丹一朵合歡有僧玄幽題此院詩警句三萬蓮經三十春半生不踏院門塵左顧蛤像舊傳云隋帝嗜蛤所食必兼蛤味數逾千萬矣忽有一蛤椎擊如舊帝異之置諸几上一夜有光及明肉自脫中有一佛二菩薩像帝悲悔誓不食蛤非陳宣帝辭二十字連絶句乘晴入精舍語默想東林盡是忘機侶誰驚息影禽繼善有松堪繫馬遇鉢更投針記得湯師句高禪助郎吟古柯一雨微塵盡支郎許數過方同嗅詹匐不用算多羅復夢蛤像連二十字絶句雖因雀變化不逐月虧盈縱有天中匠神工詎可成古相好全如𣑽端倪秪為隋寧同蚌頑惡但與鷸相持繼聖柱連句上有鐡索跡天心惟助善聖跡此開陽古載恐雷輪重絙凝電索長繼上行扶螮蝀不動束銀鐺柯飢鳥未曾啄乖龍寧敢藏長樂坊安國寺紅樓睿宗在藩時舞榭東禪院亦曰木塔院院門西北廊五璧吳道子弟子釋思道畫釋𣑽八部不施彩色尚有典刑禪師法堂影堂世號吉州空者久飬一騾將終鳴走而死有弟子允元一日嵩患風常於空室埋一柱鎖之僧難輒愈佛殿開元初玄宗拆寢室施之當陽彌勒法空自光明寺移來建都時此像在村蘭若中往往放光因號光明寺在懷逺坊後為延火所燒唯像獨存法空初移像時索大如虎口數十牛曵之索斷不動法空執爐依法作禮九拜泣涕發誓像身忽嚗嚗作聲身迸分為數十假不終日移至寺焉利涉塑堂元和中取其處聖容院遷像廡下上忽夢一僧形容竒偉訴曰暴露數日豈聖君意耶及明為幸驗問如夢即令移就堂中側施帷帳安光明寺中鬼子毋及文惠太子塑像舉止態度如生工名李岫山庭院古朩崇阜幽若山谷當時輦土營之上座璘公院有穗柏一林衢柯覆下坐十餘人辭紅樓連句隱侯體重疊碎晴空餘霞更助紅蟬蹤近鳷鵲鳥道接相風繼苔靜金輪路雲輕白日宫幸此宫元和中帝璧詩傳謝客尚寒龍跡在紅樓初施日光詞人陳至題此院詩云藻井通門榜占休公詩名時號為紅樓集廣宣上人住此院有穗柏聯句一院暑難侵莓苔可影深枝標爭息鳥餘吹正開襟柯宿雨香添色殘陽石在隂乘間動詩意助靜入禪心繼題璘公院每人古而題二言至七言靜虛熱際安居夢龕燈斂印香餘東林賔客西澗圖書簷外垂青豆經中發白渠縱辨宗因衮衮忘言事理如如竟柯泉臺定將入流否鄰笛足疑青𣑽余度柯新常樂坊趙景公寺隋開皇三年置本曰弘善寺十八年改焉南中三門裏東璧上吳道玄白畫地獄變筆力徑怒變狀隂怪覩之不覺毛戴吳畫中得意處三階院西廊下范長夀畫西方變及六對事實池尤妙絶諦視之覺水入浮壁院門上白畫樹石頗似閻立德豫携立德行天詞粉本驗之西中三門裏門南吳生畫龍及刷天王鬚筆蹟如鐡有執爐天女竊眸欲語辭吳畫連句慘淡十堵內吳生縱狂跡風雲將逼人神鬼如脫壁柯其中龍最怪張甲方汗栗黑雲夜窸窣焉知不霹靂繼此際忽仙子獵獵衣舄奕妙瞬乍疑生參差奪人魄夢往往乘猛虎衝梁聳竒石蒼峭束髙泉角膝警欺側柯冥獄不可視毛戴腋流液茍能水成剎那沈火宅題約公院四言印火熒熒燈續熖青繼七俱眩咒四阿含經柯各録佳語聊事素屏夢文室安居延賔不扄上升人大同坊雲化寺大厯初僧儼講經天雨花至地咫尺而滅夜有光燭室敕改為雲華儼即康藏之師也康本住恭靖里氈曲忽覩光如輪衆人皆見遂尋光至儼講經所滅佛殿西廊立髙僧一十六身天寶初自南內移來畫蹟拙俗觀音堂在寺西北隅建中末百姓屈嚴患瘡且死夢一菩蕯摩其瘡曰我在雲花寺嚴驚覺汗流數日而愈因詣寺尋檢至坐畫堂見菩蕯一如其覩也辭偶連句共入夕陽寺因窺甘露門人升上清香惹苔蘚忍草雜蘭蓀夢捷偈飛䈤答新詩倚杖論柯壞幡摽古剎聖畫煥崇垣繼豈慕穿籠鳥難防在牖猿柯一音唯一性三語更三幡繼道政坊寶應寺韓幹藍田人少時常為酒家送酒王右丞兄弟未遇每貰酒漫逰幹常徴債於王家戲畫地為人馬右丞精思丹青竒其意趣乃歲與錢二萬令學畫十餘年今寺中釋𣑽天女悉齊公妓小小等寫真也寺有韓幹畫下生彌勒衣紫袈裟右邉仰靣菩薩及二師子漆之如羅㬋羅每盆供日出之寺中彌勒殿齊公寢堂也東廊北靣楊岫之畫鬼神齊公嫌其筆蹟故止一宿辭僧房連句古畫思崖嶺上方疑傳嵓蝶間移忍草蟬曉揭髙杉柯香字消芝印金經發茞函井通松底脉書坼洞中緘繼小小寫真連句如生小小真猶自未棲塵夢䄖袂將離座斜柯欲近人柯昔時知出衆情寵古撗陳繼不遣逰張巷豈教窺宋鄰夢庾樓吹笛裂弘閣賞歌新蟬怯纎腰步蛾驚半額嚬繼圖形誰有術買笑詎辭貧柯復隴迷村徑重泉隔漢津夢同心知作羽比目定為鱗繼殘月巫山夕餘霞洛浦晨平康坊菩薩寺佛殿東西障日及諸柱上圖畫是東廊跡舊鄭法士畫開元中因屋壞移入大佛殿內北壁食堂前東壁上吳道玄畫智度論色偈變偈是吳自題筆跡遒徑如磔鬼神毛髮次堵畫禮骨仙人天衣飛揚滿壁風動佛殿內後壁吳道子畫消灾經事樹石古嶮元和中上欲令移之慮其摧壞乃下詔擇畫手寫進佛殿內槽壁維摩變舍利佛角膝而轉元和末俗講僧文淑裝之筆蹟盡矣故興元鄭公尚書題此壁僧院詩曰但慮彩色汚無虞臂肥置寺碑隂雕飾竒巧相傳鄭法士所起樣也初㑹覺上人以利施起宅十餘畝工畢釀酒百石列鉼甕於兩廊下引吳道玄觀之因謂曰檀越為我畫以是賞之吳生嗜酒且利其命欣然而許豫以蹤跡似不及景公寺畫中三門內東門神善繼云是吳生弟子王耐兒之手也辭書事連句悉為無事者任被俗流憎夢客異子時客僧非出院僧柯逺聞踈牖磬曉辨密籠燈繼步觸珠幡響吟窺鉢水澄夢句饒方外趣逰愜社中朋柯靜裏巳馴鴿齊中亦好鷹繼金塗筆是褧彩溜紙非曾人升上錫杖已尅煆田衣從壞塍柯占牀暫一脅卷箔賴長肱繼佛日初開照魔天破幾層柯况中陳祕計論處正燒燈繼勇帶綻針石危防丘井藤宣陽坊奉慈寺開元中虢國夫人宅安祿山僞置百官以田乾真為京兆尹取此宅為府後為郭曖駙馬宅今上即位之初太皇太后為升平公主追福奏置奉慈寺賜錢二十萬繡幀三車抽左街十寺僧四十人居之今有僧惟則以七寶木摹阿育王舍利塔自明州負來寺成後二年司農少卿楊敬之小女年十三以六韻成詩題此寺自稱關西孔子二十七代孫字德麟警句云日月金輪動旃檀碧樹秋塔分鴻雁翅鐘掛鳯凰樓事因見勑賜衣光宅坊光宅寺本官蒲萄園中禪師影堂師號惠中肅宗上元二年徴至京師初居此寺詔云杖錫而來京師非逺齊心巳久副朕虛懷辭中禪師影堂連句名下固無虛敖曹貌嚴毅洞逹見空王圓融入佛地繼一言當要害忽忽醒諸醉不動須彌山如須彌一云不動多言辨無匱夢坦率對萬乘偈答無所避爾如毗沙門外形如脫履柯但以理為量不語怪力事木石催貢髙慈悲引貪恚人升上當時乏支許何人契深致隨冝詎說三直下開不二柯翊善坊保夀寺本髙力士宅天寶九載捨為寺初鑄鍾成力士設齊慶之舉朝畢至一擊百千有規其意連擊二十杵經藏閣規創危巧二塔火珠受十餘斛河陽從事李涿性好竒古與僧智增善嘗俱至此寺觀庫中舊物忽於破瓮中得物如被幅裂汚坌觸而塵起涿徐視之乃畫也因以縣圖三及縑三十獲之令家人裝治之大十餘幅訪於常侍栁公權方知張萱所畫石橋圖也玄宗賜髙因留寺中後為鬻畫人宗收言於左軍尋有小使領軍卒數十人至宅宣勑取之即日進入先帝好古見之大悅命張於廬韶院寺見有先天菩薩幀本起成都妙積寺開元初有尼魏八師者常念大悲呪雙流縣百姓劉乙意鬼年十一自欲事魏尼尼遣之不去嘗奧室立禪嘗白魏云先天菩薩見身此地篩灰於庭一夕有巨跡數尺輪理成就因謁畫工隨意設色悉不如意有僧楊法成自言能畫童兒常合掌仰然後指授之以匠十稔五方後素先天菩蕯几二百四十首首如塔勢分臂如意蔓其榜子有一百四十日鳥樹一鳳四翅水肚樹所題深怪不可詳悉畫樣凡十五卷栁七師者崔寧之甥分三卷往上都流行時魏奉古為長史進之後因四月八日賜髙力士今成都者是其次本辭先天幀讃連句觀音化身厥形孔怪胣腦淫厲衆魔膜拜繼指夢鴻紛膀列區界其事明張何不可解柯閻河德川大士先天衆象參羅暾暾田田夢百億花發百千燈燃膠如終澤浩汗連綿繼熖摩界戚洛迦苦霽正念販依衆如青􅭌柯戾滓可汰癡膜可蛻稽首如空晬容若睇繼闡提墨師覩而靣之寸念不生未遇乎而柯宣陽坊靜域寺本太穆皇后宅僧寺云三階院門外是神堯皇帝射孔雀處禪門內外逰目記云王昭隱畫門西裏面和修吉龍王有靈門內之西火目藥義義及北方天王甚竒猛門東裏面賢門也野義部落鬼首上蟠蛇汗烟可懼東廊樹石嶮怪髙僧亦怪西廊万菩薩院門裏南璧皇甫軫畫鬼神及鵰鵰勢若脫軫與吳道玄同時吳以其藝逼巳募人殺之万菩薩堂內有寶塔以少金銅塔數日飾之大厯中將作劉監有子合手出胎七嵗念法華經及卒焚之得舍利數千粒分藏於金銅塔中善繼云合是釗銛佛殿東廊有古佛堂其地本雍村堂中像設悉是石作相傳云隋恭帝終此堂惣三階院連句密密助堂堂隋人歌檿桑雙鶻摧孔雀一矢隕貪狼柯百步望雲立九規看月張獲蛟􅫤破浪中乙漫如墻繼還似貫金鼓更疑穿石梁因添挽河力為滅射天狂何絶藝却南牧英聲來鬼方麗電何足敵殪豕未為長懲龍臂勝猿臂星芒超箭芒虛誇絶髙鳥垂拱議明堂柯崇義坊招福院本日正覺國初毁之以其地立第賜諸王睿宗在藩居之乾封二年移長寧公主佛殿於此重建此寺贈諸上人連句翻了西天偈燒餘𣑽字香撚眉愁俗客反頰背殘陽柯州號唯思沃山名秪記匡辨中摧世智定裏破魔强繼許睿禪心徹湯休詩思長助吟疏磬斷久語貫珠妨柯乘興書芭葉間來入豆房漫題存古壁怪畫匝長廊繼招國坊崇濟寺寺內有天后織成綾龍披襖子及繡衣六事東廊從南第二院有宣律師製袈裟堂曼殊堂有松數株甚竒辭宣律和尚袈裟絶句善繼云共覆三衣中夜寒披時不鎮尼師壇無因蓋得龍宫地畦裏塵飛葉相殘和前云南山披時寒夜中一角不動毗嵐風何人見此生慙愧斷續猶應護得龍竒松二十字杉松何相疏榆栁方逈屑無人檀談柄一枝不敢折柯中庭苔蘚深吹余鳴佛禽至於槯折枝凡草猶避隂繼僻徑根從露間房枝任侵一株風正好來助碧雲吟夢時時掃窗聲重露滴寒砌風颭一枝間窺别生勢人升上偃蓋入樓妨盤根侵井窄髙僧獨惆悵為與嵐燈隔柯永安坊永夀寺三門東吳道子畫似不得意佛殿名㑹仙本是內中梳洗殿貞元中有證智禪師往往靈驗或時在張櫝蘭中若治田及夜歸寺若在金山界相去七百里辭間中好間中好盡日松為侶此趣人不知輕風度僧語夢間中好塵務不縈心坐對當窗木看移三面隂柯間中好幽磬度鍾遲卷上論題肇畫中僧姓支繼崇仁坊資聖寺净土院門外相傳吳生一夕秉燭醉畫就中㦸手視之惡駭院門裏盧稜伽常學吳勢吳亦授以手訣乃畫揔持三門寺方半吳大賞之謂人曰稜伽不得心訣用思太苦其能久乎畫畢而卒中門窗間吳畫高僧韋述贊李嚴書中三門外兩面上層不知何人畫人物頗類閻令寺西廊北隅楊怛畫近塔天女明睇將瞬團塔院北堂有鐡觀音辰三丈餘觀音院兩廊四十二賢聖韓幹畫元中書贊東廊北頭散馬不意見者如將嘶蹀聖僧中龍樹商那和修絶妙團塔上菩薩李真畫四面花鳥邊鸞當藥菩薩頂工莪葵尤佳塔中藏千部法華經辭諸畫連句柏梁體吳生畫勇正㦸攢柯出變竒勢千萬端繼蒼蒼鬼怪層璧寬夢覩之忽忽毛髮寒柯稜伽之力所疲殫柯李真周昉優劣難夢活禽生卉推邊鸞柯花房嫩彩猶未乾繼韓幹變態如激湍夢惜者璧畫勢未殫後人新畫何汗漫繼成式字柯古文昌之子慱學强記多竒篇祕籍嘗於私第鑿池得片鐡命尺周量之笑而不言置之密室時窺之則有金書二字報十二時也成式博物類此終太常少卿成式與溫庭筠雲籃紙詩序曰豫在九江多意造之分送五十詩云三十六鱗充使時數畨猶得褁相思待將袍襖重抄了盡寫襄陽播掿詞成式酉陽雜爼云古樂府木蘭篇願駝千里明送兒還故鄉明字多誤作鳴駝卧腹不帖地屈足漏明則行千里又云波斯國謂象牙為白暗犀角為黑暗故老杜有黑暗通蠻貨之句又載鬼詩二篇云長安女兒踏春忙何處春歸不斷腸舞袖弓彎渾忘却蛾眉空帶九秋霜又云流水姢姢芹發牙織鳥雙飛客還家荒村無人作寒食殯宫空對棠梨花酉陽雜爼云一夕豫坐客牙送連句為煩乃命工取細斑竹以白金鎖首如茶挾以遞聯名之豫在城時常與客連句初無虛日小酌求狎或窮韻相角或押惡韻或煎茗一碗為八韻詩謂之雜連若志於不杇則汰揀穩韵無所得輒巳謂之苦連連時共押平聲好韻不僻者出於竹簡謂之韻牒出城忘携行坐客句枝韻牒之語必為好事者所傳矣因說故相牛公楊州賞秀才蒯希逸詩蟾蜍醉裏破蛺蝶夢中殘每坐吟之豫因請坐客各吟近日為詩者佳句有吟賈島舊國别多日故人無少年馬戴猿啼洞庭樹人在木蘭丹又骨銷金鏃在有吟僧無可河來當塞斷盡一日山岸一日逺與沙平又開門落葉深有吟張祐河流側讓關山一日又泉聲到池盡有吟僧靈凖詩晴看漢水廣秋覺峴山髙吟朱景玄塞鴻先秋去邉草入夏生豫吟上都僧元礎守隔殘潮去又採藥過泉聲又林塘秋半宿風雨夜深來豫識蜀中客龎李豫每云寒雲生易滿秋草長難髙成式有漢上題襟十卷光風亭夜宴妓有醉毆者溫飛卿曰若狀此便可以疻靣對捽胡成式乃曰捽胡雲彩落疻靣月痕消又曰擲履仙鳬起扯衣蝴蝶飄羞中含薄怒嚬裏帶余嬌醒後猶攘腕歸時更折腰狂夫自纓絶眉勢倩誰描韋蟾云爭揮鈎弋手競聳踏徭身傷頰詎關舞捧心非效嚬飛卿云吳國初成陳王家欲解圍拂巾雙雉呌飄瓦兩鴛飛唐詩紀事卷第五十七
